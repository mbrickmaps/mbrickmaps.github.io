<!DOCTYPE html>
<html>
<head>
<style>
  :root {
    --bg: #ffffff;
    --fg: #111111;
  }
  html[data-theme="dark"] {
    --bg: #111111;
    --fg: #eeeeee;
  }
 
  body { background: var(--bg); color: var(--fg); }
 
  .toggle-btn {
    margin: 10px;
    padding: 6px 12px;
    background: var(--fg);
    color: var(--bg);
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }
 
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, 200px); gap: 10px; }
  .gallery img { cursor: pointer; }
 
  [popover] {
    margin: auto;
    border: none;
    background: transparent;
    max-width: 90vw;
    max-height: 90vh;
  }
  [popover] img { max-width: 90vw; max-height: 90vh; }
  [popover]::backdrop { background: rgba(0,0,0,0.8); }
</style>
</head>
<body>
 
<button class="toggle-btn" onclick="
  const html = document.documentElement;
  html.dataset.theme = html.dataset.theme === 'dark' ? 'light' : 'dark';
">Toggle dark mode</button>
 

  <div class="gallery" id="gallery"></div>

  <script>
    // Add or remove names here to control what shows up on the page
    const photos = [
      "7372",
      "7012",
      "7029",
      "7049",
      "7085",
      "7093",
      "7147",

      "7158",

      "7324",

      "7334",

      "7352",
      "7366"
    ];

    function photoBlock(name) {
      return `
      <button popovertarget="${name}-pop" style="border:none; background:none; padding:0;">
        <picture>
          <source srcset="edits/${name}-web.avif" type="image/avif">
          <source srcset="edits/${name}-web.webp" type="image/webp">
          <img src="edits/${name}-web.jpg" width="200" alt="${name}">
        </picture>
      </button>
      <div popover id="${name}-pop">
        <picture>
          <source srcset="edits/${name}-web.avif" type="image/avif">
          <source srcset="edits/${name}-web.webp" type="image/webp">
          <img src="edits/${name}-web.jpg" alt="${name}" loading="lazy">
        </picture>
      </div>
    `;
    }

    document.getElementById("gallery").innerHTML = photos.map(photoBlock).join("");
  </script>

</body>

</html>
