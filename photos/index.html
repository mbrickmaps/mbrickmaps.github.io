<!DOCTYPE html>
<html>
<head>
<style>
  :root {
    --bg: #111111;
    --fg: #eeeeee;
  }
  html[data-theme="light"] {
    --bg: #ffffff;
    --fg: #111111;
  }

  body { background: var(--bg); color: var(--fg); }

  .toggle-btn {
    margin: 10px;
    padding: 6px 12px;
    background: var(--fg);
    color: var(--bg);
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  .gallery { display: grid; grid-template-columns: repeat(auto-fill, 200px); gap: 10px; }
  .thumb-wrap { position: relative; display: inline-block; }
  .thumb-wrap img { cursor: pointer; display: block; }

  .thumb-wrap .hover-caption {
    position: absolute;
    top: 0;
    left: 100%;
    margin-left: 8px;
    white-space: nowrap;
    background: var(--bg);
    color: var(--fg);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 0.85rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
    z-index: 1;
  }
  .thumb-wrap:hover .hover-caption { opacity: 1; }

  [popover] {
    margin: auto;
    border: none;
    background: transparent;
    max-width: 90vw;
    max-height: 90vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  [popover] img { max-width: 80vw; max-height: 90vh; display: block; cursor: pointer; }
  [popover] .caption {
    color: var(--fg);
    font-size: 0.9rem;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.15s;
  }
  [popover]:hover .caption { opacity: 1; }
  [popover]::backdrop { background: rgba(0,0,0,0.8); }
</style>
</head>
<body>

<button class="toggle-btn" onclick="
  const html = document.documentElement;
  html.dataset.theme = html.dataset.theme === 'light' ? 'dark' : 'light';
">Toggle dark mode</button>

<script>
  document.documentElement.dataset.theme = 'dark';
</script>

<div class="gallery" id="gallery"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
  function photoBlock(name, meta) {
    const { caption, date } = meta[name] || {};
    const label = `${caption || ""}${date ? " — " + date : ""}`;
    return `
      <button class="thumb-wrap" popovertarget="${name}-pop" style="border:none; background:none; padding:0;">
        <picture>
          <source srcset="derived/${name}-web.avif" type="image/avif">
          <source srcset="derived/${name}-web.webp" type="image/webp">
          <img src="derived/${name}-web.jpg" width="200" alt="${caption || name}" loading="lazy">
        </picture>
        <span class="hover-caption">${label}</span>
      </button>
      <div popover id="${name}-pop">
        <picture>
          <source srcset="derived/${name}-web.avif" type="image/avif">
          <source srcset="derived/${name}-web.webp" type="image/webp">
          <img src="derived/${name}-web.jpg" alt="${caption || name}" loading="lazy"
               onclick="this.closest('[popover]').hidePopover()">
        </picture>
        <div class="caption">${label}</div>
      </div>
    `;
  }

  d3.csv("meta.csv").then((rows) => {
    const meta = {};
    for (const row of rows) {
      if (row.name) meta[row.name] = row;
    }

    const photos = rows
      .filter((row) => row.exclude !== "yes")
      .map((row) => row.name);

    document.getElementById("gallery").innerHTML =
      photos.map((name) => photoBlock(name, meta)).join("");
  });
</script>

</body>
</html>
