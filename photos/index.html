<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noimageindex">
<meta name="robots" content="noai, noimageai">
<link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<style>
  :root {
    --bg: #111111;
    --fg: #eeeeee;
  }
  html[data-theme="light"] {
    --bg: #ffffff;
    --fg: #111111;
  }

  body { background: var(--bg); color: var(--fg); }

  .toggle-btn {
    margin: 10px;
    padding: 6px 12px;
    background: var(--fg);
    color: var(--bg);
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  .filter-bar { margin: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .filter-bar input {
    padding: 6px 10px;
    border-radius: 4px;
    border: 1px solid var(--fg);
    background: var(--bg);
    color: var(--fg);
  }
  .tag-btn {
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--fg);
    background: var(--bg);
    color: var(--fg);
    cursor: pointer;
    font-size: 0.85rem;
  }
  .tag-btn.active { background: var(--fg); color: var(--bg); }

  .gallery { display: grid; grid-template-columns: repeat(auto-fill, 200px); gap: 10px; }
  .thumb-wrap { position: relative; display: inline-block; }
  .thumb-wrap img { cursor: pointer; display: block; }

  .thumb-wrap .hover-caption {
    position: absolute;
    inset: auto 0 0 0;
    background: rgba(0,0,0,0.6);
    color: #eee;
    padding: 4px 8px;
    font-size: 0.85rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
    z-index: 1;
  }
  .thumb-wrap:hover .hover-caption { opacity: 1; }

  .thumb-wrap .mm-link {
    position: absolute;
    top: 4px;
    right: 4px;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    background: rgba(0,0,0,0.6);
    border-radius: 4px;
    font-size: 0.9rem;
    text-decoration: none;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .thumb-wrap:hover .mm-link { opacity: 1; }

  .thumb-wrap .thumb-name {
    position: absolute;
    top: 4px;
    left: 4px;
    z-index: 1;
    background: rgba(0,0,0,0.6);
    color: #eee;
    padding: 1px 5px;
    font-size: 0.7rem;
    border-radius: 3px;
    pointer-events: none;
  }

  .thumb-wrap .copyright-tag {
    position: absolute;
    bottom: 4px;
    right: 4px;
    z-index: 1;
    background: rgba(0,0,0,0.6);
    color: #eee;
    padding: 1px 5px;
    font-size: 0.7rem;
    border-radius: 3px;
    pointer-events: none;
  }

  [popover] {
    display: none;
    margin: auto;
    border: none;
    background: transparent;
    max-width: 90vw;
    max-height: 90vh;
    overflow: hidden;
    gap: 16px;
  }
  [popover]:popover-open {
    display: flex;
    align-items: center;
  }
  [popover] img { max-width: 80vw; max-height: 90vh; display: block; cursor: pointer; }
  [popover] .meta-panel {
    display: flex;
    flex-direction: column;
    gap: 6px;
    color: var(--fg);
    font-size: 0.9rem;
    white-space: nowrap;
    min-width: 140px;
  }
  [popover] .meta-name {
    font-size: 1.1rem;
    font-weight: bold;
  }
  [popover] .meta-row .meta-label {
    display: block;
    font-size: 0.7rem;
    text-transform: uppercase;
    opacity: 0.6;
    letter-spacing: 0.03em;
  }
  [popover] .meta-copyright {
    margin-top: 12px;
    font-size: 0.75rem;
    opacity: 0.7;
  }

  .minimap {
    width: 160px;
    height: 160px;
    border-radius: 4px;
    overflow: hidden;
  }
  .minimap-marker {
    position: relative;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #ff5500;
    border: 2px solid white;
  }
  .minimap-arrow {
    position: absolute;
    top: -14px;
    left: 2px;
    width: 0;
    height: 0;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-bottom: 12px solid #ff5500;
    transform-origin: 50% 26px;
  }
  [popover]::backdrop { background: rgba(0,0,0,0.8); }
</style>
</head>
<body>

<button class="toggle-btn" onclick="
  const html = document.documentElement;
  html.dataset.theme = html.dataset.theme === 'light' ? 'dark' : 'light';
">Toggle dark mode</button>

<script>
  document.documentElement.dataset.theme = 'dark';
</script>

<div class="filter-bar">
  <input type="text" id="search" placeholder="Search caption or tags...">
  <div id="tag-filters"></div>
</div>

<div class="gallery" id="gallery"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
  function photoBlock(name, meta) {
    const { caption, date, lat, lng, bearing, tags } = meta[name] || {};
    const label = `${caption || ""}`;
    return `
      <div class="thumb-wrap">
        <button popovertarget="${name}-pop" style="border:none; background:none; padding:0; display:block;">
          <picture>
            <source srcset="edits/${name}-web.avif" type="image/avif">
            <source srcset="edits/${name}-web.webp" type="image/webp">
            <img src="edits/${name}-web.jpg" width="200" alt="${caption || name}" loading="lazy">
          </picture>
        </button>
        <span class="hover-caption">${label}</span>
        <span class="copyright-tag">© mbricknell</span>
        <span class="thumb-name">${name}${date ? "-" + date : ""}</span>
        <a class="mm-link" href="../mirror-mirror/?photo=${name}" target="_blank" rel="noopener" title="Open in mirror mirror">🪞</a>
      </div>
      <div popover id="${name}-pop">
        <picture>
          <source srcset="edits/${name}-web.avif" type="image/avif">
          <source srcset="edits/${name}-web.webp" type="image/webp">
          <img src="edits/${name}-web.jpg" alt="${caption || name}" loading="lazy"
               onclick="this.closest('[popover]').hidePopover()">
        </picture>
        <div class="meta-panel">
          <div class="meta-name">${name}${date ? "-" + date : ""}</div>
          ${caption ? `<div class="meta-row"><span class="meta-label">Caption</span>${caption}</div>` : ""}
          ${tags ? `<div class="meta-row"><span class="meta-label">Tags</span>${tags}</div>` : ""}
          ${lat && lng ? `
            <div class="meta-row"><span class="meta-label">Location</span>${lat}, ${lng}</div>
            <div class="minimap" data-lat="${lat}" data-lng="${lng}" data-bearing="${bearing || ""}"></div>
          ` : ""}
          ${bearing ? `<div class="meta-row"><span class="meta-label">Bearing</span>${bearing}°</div>` : ""}
          <div class="meta-copyright">© mbricknell</div>
        </div>
      </div>
    `;
  }

  d3.csv("meta.csv").then((rows) => {
    const meta = {};
    for (const row of rows) {
      if (row.name) meta[row.name] = row;
    }

    const allNames = rows
      .filter((row) => !row.exclude)
      .map((row) => row.name);

    const allTags = [...new Set(
      rows.flatMap((row) => (row.tags || "").split(";").map((t) => t.trim()).filter(Boolean))
    )].sort();

    let activeTag = null;

    function render() {
      const query = document.getElementById("search").value.trim().toLowerCase();

      const visible = allNames.filter((name) => {
        const row = meta[name] || {};
        const tags = (row.tags || "").split(";").map((t) => t.trim());

        if (activeTag && !tags.includes(activeTag)) return false;

        if (query) {
          const haystack = `${row.caption || ""} ${row.tags || ""} ${name}`.toLowerCase();
          if (!haystack.includes(query)) return false;
        }

        return true;
      });

      document.getElementById("gallery").innerHTML =
        visible.map((name) => photoBlock(name, meta)).join("");
    }

    document.getElementById("tag-filters").innerHTML = allTags.map((tag) => `
      <button class="tag-btn" data-tag="${tag}">${tag}</button>
    `).join("");

    document.getElementById("tag-filters").addEventListener("click", (e) => {
      const btn = e.target.closest(".tag-btn");
      if (!btn) return;
      const tag = btn.dataset.tag;
      activeTag = activeTag === tag ? null : tag;
      document.querySelectorAll(".tag-btn").forEach((b) =>
        b.classList.toggle("active", b.dataset.tag === activeTag)
      );
      render();
    });

    document.getElementById("search").addEventListener("input", render);

    render();

    document.addEventListener("keydown", (e) => {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      const open = document.querySelector("[popover]:popover-open");
      if (!open) return;

      const currentName = open.id.replace(/-pop$/, "");
      const visibleNow = [...document.querySelectorAll("[popover]")].map((el) => el.id.replace(/-pop$/, ""));
      const i = visibleNow.indexOf(currentName);
      if (i === -1) return;

      const nextI = e.key === "ArrowRight"
        ? (i + 1) % visibleNow.length
        : (i - 1 + visibleNow.length) % visibleNow.length;

      open.hidePopover();
      document.getElementById(`${visibleNow[nextI]}-pop`).showPopover();
    });
  });

  // "toggle" fires on the popover element itself and doesn't bubble,
  // so it's caught here via the capture phase.
  document.addEventListener("toggle", (e) => {
    if (!e.target.matches("[popover]")) return;

    // Popover API's backdrop doesn't block pointer events like a <dialog>'s
    // does, so the gallery behind stays clickable unless made inert.
    document.getElementById("gallery").inert = e.newState === "open";

    if (e.newState !== "open") return;
    const mapEl = e.target.querySelector(".minimap");
    if (!mapEl || mapEl.dataset.initialized) return;
    mapEl.dataset.initialized = "true";

    const lat = parseFloat(mapEl.dataset.lat);
    const lng = parseFloat(mapEl.dataset.lng);
    const bearing = mapEl.dataset.bearing ? parseFloat(mapEl.dataset.bearing) : null;

    requestAnimationFrame(() => {
      const map = new maplibregl.Map({
        container: mapEl,
        style: {
          version: 8,
          sources: {
            osm: {
              type: "raster",
              tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
              tileSize: 256,
              attribution: "&copy; OpenStreetMap contributors"
            }
          },
          layers: [{ id: "osm", type: "raster", source: "osm" }]
        },
        center: [lng, lat],
        zoom: 14,
        interactive: false,
        attributionControl: { compact: true }
      });

      const markerEl = document.createElement("div");
      markerEl.className = "minimap-marker";
      if (bearing !== null && !Number.isNaN(bearing)) {
        const arrow = document.createElement("div");
        arrow.className = "minimap-arrow";
        arrow.style.transform = `rotate(${bearing}deg)`;
        markerEl.appendChild(arrow);
      }
      new maplibregl.Marker({ element: markerEl }).setLngLat([lng, lat]).addTo(map);
    });
  }, true);
</script>

</body>
</html>
