      const hasFixedExtent = !!(cfg.bbox?.coords || cfg.bbox?.refUid || cfg.bbox?.geometry);
      const extentStyle = mergeProjectStyle(PROJECT_POLY_DEFAULTS, cfg.bbox?.style);
      return `<div class="edit-row"><div class="edit-row-head inset-head selected">Inset</div>` +
        row(
          `<label>extent ${hasFixedExtent ? 'fixed' : 'follows main map'}</label>` +
          `<button class="sketch-btn" data-inset-act="draw-extent">Draw extent</button>` +
          `<button class="sketch-btn${insetMarkerArmed ? ' armed' : ''}" data-inset-act="add-marker">${insetMarkerArmed ? 'Click the inset… (Esc to stop)' : 'Add marker'}</button>` +
          (cfg.markers?.length ? `<button class="sketch-btn" data-inset-act="clear-markers">Clear markers</button>` : '')
        ) +
        (hasFixedExtent ? row(
          `<label>extent stroke ${f('color', 'bbox.style.stroke', toHex(extentStyle.stroke === 'none' ? '#ffffff' : extentStyle.stroke))}</label>` +
          `<label>extent stroke-width ${f('number', 'bbox.style.stroke-width', extentStyle['stroke-width'], 'min="0" step="0.5"')}</label>` +
          `<label>extent fill ${f('color', 'bbox.style.fill', toHex(extentStyle.fill === 'none' ? '#ffffff' : extentStyle.fill))}</label>` +
          `<label>extent fill-opacity ${f('number', 'bbox.style.fill-opacity', extentStyle['fill-opacity'], 'min="0" max="1" step="0.05"')}</label>`
        ) : '') +
        row(
          `<label>position ${sel('position', cfg.position ?? 'bottom-right', ['top-left', 'top-right', 'bottom-left', 'bottom-right'])}</label>` +
          `<label>size ${f('number', 'size', cfg.size ?? 160, 'min="60" step="10"')}</label>` +
          `<label>radius ${f('text', 'radius', cfg.radius ?? '50%')}</label>` +
          `<label>projection ${sel('projection', cfg.projection ?? 'globe', ['globe', 'mercator'])}</label>`
        ) +
        row(
          // The control today's globe-size confusion needed: at a fixed zoom the sphere shrinks
          // toward the equator, so a low-latitude inset has to be zoomed in to fill its frame.
          `<label>zoom ${f('number', 'zoom', cfg.zoom ?? 0, 'step="0.05"')}</label>` +
          `<label>lng ${f('number', 'center.0', center[0], 'step="0.1"')}</label>` +
          `<label>lat ${f('number', 'center.1', center[1], 'step="0.1"')}</label>` +
          `<button class="sketch-btn" data-inset-act="here">use map center</button>`
        ) +
        row(
          `<label>labels ${cb('labels', cfg.labels !== false)}</label>` +
          `<label>follow ${cb('follow', cfg.follow === true)}</label>` +
          `<label>border ${f('color', 'border.color', toHex(border.color ?? '#ffffff'))}</label>` +
          `<label>border w ${f('number', 'border.width', border.width ?? 1.5, 'min="0" step="0.5"')}</label>`
        ) +
        row(
          `<label>vignette ${cb('vignette', !!cfg.vignette)}</label>` +
          (cfg.vignette ? `<label>color ${f('color', 'vignette.color', toHex(v.color ?? '#000000'))}</label>` +
            `<label>opacity ${f('number', 'vignette.opacity', v.opacity ?? 0.55, 'min="0" max="1" step="0.05"')}</label>` +
            `<label>stop ${f('number', 'vignette.stop', v.stop ?? 55, 'min="0" max="100" step="5"')}</label>` : '')
        ) +
        `<div class="paste-actions"><button class="sketch-btn" data-inset-act="remove">Remove inset</button></div>` +
        `</div>`;
    }

    // Which style layer this section's features are drawn beneath. "(top)" means no anchor —
    // they sit above everything. Project/sandbox layers are excluded: anchoring to one would be
    // circular, and they come and go as you edit.
    function insertBelowSelect(kind) {
      const cur = projectBeforeId[kind] || '';
      // Style order is bottom->top; reverse so the topmost layer is first, matching the Layer
      // tab's list rather than contradicting it.
      // The empty conflict-* placeholders ('interactions') are left out too, unless a project
      // already anchors to one (so its saved choice still shows).
      const ids = map.getStyle().layers.slice().reverse()
        .filter((l) => groupOf(l) !== 'interactions' || l.id === cur)
        .map((l) => l.id)
        .filter((id) => !id.startsWith('project-') && !id.startsWith('sandbox-') && !isPatternHelper(id));
      return `<select class="section-anchor-sel" data-kind="${kind}">` +
        `<option value=""${cur ? '' : ' selected'}>(top)</option>` +
        ids.map((id) => `<option value="${esc(id)}"${id === cur ? ' selected' : ''}>${esc(id)}</option>`).join('') +
        `</select>`;
    }

    function editSectionHtml() {
      const labels = { points: 'Points', polys: 'Polygons', annotations: 'Annotations' };
      return Object.keys(labels).map((kind) => `
          <div class="edit-row" data-kind="${kind}">
            <div class="edit-row-head">${labels[kind]}
              <label class="edit-row-hint"><input type="checkbox" class="section-show-cb" data-kind="${kind}"${projectDoc[kind].show === false ? '' : ' checked'}> show</label>
              <label class="edit-row-hint">under ${insertBelowSelect(kind)}</label>
              <label class="edit-row-hint" title="On: a new feature inherits the style you last edited. Off: new features keep the default."><input type="checkbox" class="section-stylemem-cb" data-kind="${kind}"${styleMemory[kind] ? ' checked' : ''}> remember style</label>
              <button class="section-stylereset-btn" data-kind="${kind}" title="restore this section's starting style">reset</button>
            </div>
            <div class="paste-actions">
              ${SKETCH_TOOLS.filter(t => t.kind === kind).map(t =>
                `<button class="sketch-btn" data-kind="${t.kind}" data-tool="${t.tool}">${t.label}</button>`).join('')}
            </div>
            ${selectedItem?.kind === kind ? `
            <div class="selected-item">
              <span class="placed-label">${esc(selectedItem.uid || itemSummary(kind, pastedArrayFor(kind)[selectedItem.index]))}</span>
              ${selectedItem.uid ? `<button class="clear-part-btn" title="edit all shapes in this entry instead">all</button>` : ''}
              <button class="placed-del-btn" title="delete">×</button>
            </div>` : ''}
            ${activeFor(kind) ? styleRowHtml(kind) : ''}
            ${kind === 'polys' && selectedItem?.kind === 'polys' && pastedArrayFor('polys')[selectedItem.index]?.geometry ? `
            <div class="trim-row">
              <span>Trim the selected shape — enter a refUid (Enter to run):</span>
              <input type="text" class="trim-refuid-in" placeholder="e.g. admin0:ukr">
            </div>` : ''}
          </div>`).join('') + imagesSectionHtml() + viewSectionHtml() + insetSectionHtml();
    }

    // Images: world-file rasters in export.raster (drawn by renderProjectRasters). Drop an image
    // and its world file (.pgw/.jgw/.wld/.tfw…), together or one after the other (anything else,
    // e.g. a .prj, is ignored). The dropped image renders from memory (imgBlobs), while the
    // project stores the pointer data/<name> — copy the file into projects/data/ to keep it.
    function imagesSectionHtml() {
      const list = projectDoc.export?.raster?.data || [];
      const rows = list.map((r, i) => `
            <div class="img-row">
              <input type="checkbox" class="img-show-cb" data-i="${i}"${r.show === false ? '' : ' checked'} title="show">
              <span class="img-name" title="${esc(r.image || '')}">${esc(r.name || r.image || 'image')}</span>
              <select class="img-pos-sel" data-i="${i}" title="draw over the basemap fills, or under the basemap">
                <option value="top"${r.position === 'top' ? ' selected' : ''}>over</option>
                <option value="raster"${r.position === 'top' ? '' : ' selected'}>under</option>
              </select>
              <input type="text" inputmode="decimal" class="img-op-in" data-i="${i}" value="${r.opacity ?? 1}" title="opacity, 0–1">
              <button class="img-del-btn" data-i="${i}" title="remove">×</button>
            </div>`).join('');
      const pend = imgPending.image ? `waiting for the world file for ${esc(imgPending.image.name)}`
        : imgPending.worldfile ? `world file ${esc(imgPending.worldfileName)} — now drop its image` : '';
      return `<div class="edit-row" data-kind="images">
            <div class="edit-row-head">Images <span class="edit-row-hint">image + world file</span></div>
            ${rows}
            ${pend ? `<div class="img-pending">${pend}</div>` : ''}
            <div class="img-drop">drop an image + its world file here (or click)</div>
            <input type="file" class="img-file-in" multiple accept="image/*,.pgw,.jgw,.wld,.tfw,.pngw,.jpgw,.tifw" hidden>
          </div>`;
    }
    // Opacity box: a text field (a number field can blank itself on "0.9" vs "0,9" depending on
    // browser/locale). Accepts either separator; null when it isn't a number.
    function parseImgOpacity(raw) {
      const v = parseFloat(String(raw).trim().replace(',', '.'));
      return Number.isFinite(v) ? Math.max(0, Math.min(1, v)) : null;
    }
    function setImgOpacity(i, v) {
      const r = projectDoc.export?.raster?.data?.[i]; if (!r) return;
      r.opacity = v;
      if (map.getLayer('project-raster-' + i)) map.setPaintProperty('project-raster-' + i, 'raster-opacity', v);
    }
    const imgBlobs = new WeakMap();   // entry → blob: URL of a dropped image (never serialized)
    const imgPending = { image: null, worldfile: null, worldfileName: '' };
    const IMG_EXT = /\.(png|jpe?g|webp|gif|avif)$/i, WF_EXT = /\.(pgw|jgw|wld|tfw|pngw|jpgw|tifw|gfw|txt)$/i;
    function parseWorldFile(text) {
      const n = String(text).split(/\r?\n/).map((s) => parseFloat(s.trim())).filter(Number.isFinite);
      if (n.length < 6) return null;
      return { xPixelSize: n[0], yRotation: n[1], xRotation: n[2], yPixelSize: n[3], xUpperLeft: n[4], yUpperLeft: n[5] };
    }
    async function takeImageFiles(files) {
      for (const f of files) {
        if (/^image\//.test(f.type || '') || IMG_EXT.test(f.name)) imgPending.image = f;
        else if (WF_EXT.test(f.name)) {
          const wf = parseWorldFile(await f.text());
          if (wf) { imgPending.worldfile = wf; imgPending.worldfileName = f.name; }
          else readout.textContent = `${f.name}: not a world file (needs 6 numbers)`;
        }
      }
      if (imgPending.image && imgPending.worldfile) {
        const file = imgPending.image;
        const base = file.name.replace(/\.[^.]+$/, ''), ext = (file.name.match(/\.[^.]+$/) || ['.png'])[0].toLowerCase();
        const slug = base.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'image';
        const entry = { show: true, id: 'image-' + Date.now().toString(36), name: file.name, image: `data/${slug}${ext}`,
          worldfile: imgPending.worldfile, position: 'top', opacity: 1 };
        imgBlobs.set(entry, URL.createObjectURL(file));
        projectDoc.export = projectDoc.export || {};
        projectDoc.export.raster = { show: true, ...(projectDoc.export.raster || {}),
          data: [...(projectDoc.export.raster?.data || []), entry] };
        projectDoc.export.raster.show = true;
        imgPending.image = imgPending.worldfile = null; imgPending.worldfileName = '';
        readout.textContent = `added ${file.name} — the project points at ${entry.image}: copy the file into projects/data/ to keep it`;
        renderProjectRasters();
      }
      buildPanel();
    }

    // Style controls for the "next sketch" of this kind — also edits the selected placed item
    // (if any) live, via setSketchStyleField. Field set differs per kind: points get fill/size/
    // stroke, polys get fill/stroke/pattern, annotations (arrows) get stroke/stroke-width.
    function styleRowHtml(kind) {
      const sel = selectedItem?.kind === kind ? pastedArrayFor(kind)[selectedItem.index] : null;
      // Merge over the kind's own PROJECT_* defaults rather than the sketch defaults, so every
      // control shows a real value even for keys the entry (or the next-sketch default) never set.
      const baseFor = { points: PROJECT_POINT_DEFAULTS, polys: PROJECT_POLY_DEFAULTS };
      const sketchFor = { points: sketchPointStyle, polys: sketchRectStyle };
      const field = (type, dataField, value, extra = '') =>
        `<input type="${type}" class="sketch-style-in" data-kind="${kind}" data-field="${dataField}" ${extra} value="${value}">`;
      // Feature-level fields (a point's name/dir, a text area's text) live on the entry itself,
      // not inside its `style`, so they route through their own class.
      const meta = (dataField, value, extra = '') =>
        `<input type="text" class="sketch-meta-in" data-kind="${kind}" data-field="${dataField}" ${extra} value="${esc(value)}">`;
      const metaArea = (dataField, value) =>
        `<textarea class="sketch-meta-area" data-kind="${kind}" data-field="${dataField}" rows="2">${esc(value)}</textarea>`;
      const metaNum = (dataField, value, extra = '') =>
        `<input type="number" class="sketch-meta-in" data-kind="${kind}" data-field="${dataField}" ${extra} value="${value}">`;
      const select = (cls, dataField, value, options) =>
        `<select class="${cls}" data-kind="${kind}" data-field="${dataField}">` +
        options.map(o => `<option value="${o}"${o === value ? ' selected' : ''}>${o}</option>`).join('') +
        `</select>`;
      const metaSelect = (dataField, value, options) => select('sketch-meta-select', dataField, value, options);
      const styleSelect = (dataField, value, options) => select('sketch-style-select', dataField, value, options);
      const row = (inner) => `<div class="sketch-style-row">${inner}</div>`;
      const DASHES = ['solid', 'dashed', 'dotted'];
      // The five label-* keys, identical everywhere a label can appear.
      const labelStyleRow = (sty) => row(
        `<label>label-font ${styleSelect('label-font', sty['label-font'], PROJECT_LABEL_FONTS)}</label>` +
        `<label>label-size ${field('number', 'label-size', sty['label-size'], 'min="6" step="1"')}</label>` +
        `<label>label-color ${field('color', 'label-color', toHex(sty['label-color']))}</label>` +
        `<label>label-halo-color ${field('color', 'label-halo-color', toHex(sty['label-halo-color']))}</label>` +
        `<label>label-halo-width ${field('number', 'label-halo-width', sty['label-halo-width'], 'min="0" step="0.5"')}</label>`
      );

      if (kind === 'points') {
        const sty = mergeProjectStyle(baseFor.points, sel ? sel.style : sketchFor.points);
        const label = sel || sketchPointLabel;
        return row(
          `<label>name ${meta('name', label.name ?? '', 'placeholder="(none)"')}</label>` +
          `<label>dir ${metaSelect('dir', label.dir ?? 'NE', SKETCH_DIRS)}</label>` +
          `<label>fill ${field('color', 'fill', toHex(sty.fill))}</label>` +
          `<label>size ${field('number', 'size', sty.size, 'min="1" step="0.5"')}</label>` +
          `<label>stroke ${field('color', 'stroke', toHex(sty.stroke))}</label>` +
          `<label>stroke-width ${field('number', 'stroke-width', sty['stroke-width'], 'min="0" step="0.5"')}</label>` +
          `<label>opacity ${field('number', 'opacity', sty.opacity, 'min="0" max="1" step="0.05"')}</label>`
        // Typography only matters once there's actually a label to set it on.
        ) + (label.name ? labelStyleRow(sty) : '');
      }

      if (kind === 'polys') {
        const sty = mergeProjectStyle(
          mergeProjectStyle(baseFor.polys, sel ? sel.style : sketchFor.polys),
          sel && selectedItem?.uid ? sel.overrides?.[selectedItem.uid] : null);
        const noFill = sty.fill === 'none';
        return row(
          `<label>fill ${field('color', 'fill', toHex(sty.fill), noFill ? 'disabled' : '')}</label>` +
          `<label>fill: none <input type="checkbox" class="sketch-style-fill-none" data-kind="polys"${noFill ? ' checked' : ''}></label>` +
          `<label>fill-opacity ${field('number', 'fill-opacity', sty['fill-opacity'], 'min="0" max="1" step="0.05"')}</label>` +
          `<label>stroke ${field('color', 'stroke', toHex(sty.stroke))}</label>` +
          `<label>stroke-width ${field('number', 'stroke-width', sty['stroke-width'], 'min="0" step="0.5"')}</label>` +
          `<label>stroke-dash ${styleSelect('stroke-dash', sty['stroke-dash'] ?? 'solid', DASHES)}</label>` +
          `<label>line-join ${styleSelect('line-join', sty['line-join'] ?? 'miter', ['miter', 'bevel', 'round'])}</label>` +
          `<label>opacity ${field('number', 'opacity', sty.opacity, 'min="0" max="1" step="0.05"')}</label>`
        ) + row(
          `<label>pattern <select class="sketch-style-select" data-kind="polys" data-field="pattern">` +
            `<option value="">none</option>` +
            PATTERNS.map(pt => `<option value="${pt}"${pt === sty.pattern ? ' selected' : ''}>${pt}</option>`).join('') +
          `</select></label>` +
          `<label>pattern-opacity ${field('number', 'pattern-opacity', sty['pattern-opacity'], 'min="0" max="1" step="0.1"')}</label>`
        );
      }

      // annotations: the row is built for whichever annotation you're actually working on —
      // the entry selected on the map, or, with nothing selected, the type the armed tool is
      // about to place. Connectors and text areas share almost no settings, so showing a union
      // of both would be mostly irrelevant controls either way.
      const armedText = !sel && pendingSketch?.tool === 'text-area';
      const isText = sel?.type === 'text-area' || armedText;
      const sty = sel
        ? mergeProjectStyle(isText ? PROJECT_ANNOTATION_BOX_DEFAULTS : PROJECT_ANNOTATION_LINE_DEFAULTS, sel.style)
        : armedText
          ? mergeProjectStyle(PROJECT_ANNOTATION_BOX_DEFAULTS, sketchTextStyle)
          : { ...PROJECT_ANNOTATION_LINE_DEFAULTS, ...sketchArrowStyle };

      if (isText) {
        const noFill = sty.fill === 'none';
        const entry = sel || sketchText;
        return row(
          `<label>text ${metaArea('text', entry.text ?? '')}</label>` +
          `<label>align ${styleSelect('align', sty.align, ['left', 'center', 'right'])}</label>` +
          (sel ? `<label>width px ${metaNum('width', sel.width ?? 120, 'min="20" step="5"')}</label>` +
                 `<label>height px ${metaNum('height', sel.height ?? 40, 'min="14" step="5"')}</label>` : '') +
          `<label>text-max-width ${field('number', 'text-max-width', sty['text-max-width'], 'min="1" step="1"')}</label>` +
          `<label>opacity ${field('number', 'opacity', sty.opacity, 'min="0" max="1" step="0.05"')}</label>`
        ) + row(
          `<label>fill ${field('color', 'fill', toHex(sty.fill), noFill ? 'disabled' : '')}</label>` +
          `<label>fill: none <input type="checkbox" class="sketch-style-fill-none" data-kind="annotations"${noFill ? ' checked' : ''}></label>` +
          `<label>fill-opacity ${field('number', 'fill-opacity', sty['fill-opacity'], 'min="0" max="1" step="0.05"')}</label>` +
          `<label>stroke ${field('color', 'stroke', toHex(sty.stroke))}</label>` +
          `<label>stroke-width ${field('number', 'stroke-width', sty['stroke-width'], 'min="0" step="0.5"')}</label>`
        ) + labelStyleRow(sty);
      }

      const connector = row(
        `<label>type ${metaSelect('type', sel ? sel.type : (sketchArrowShape === 'curved' ? 'curved-arrow' : 'straight-arrow'), ['straight-arrow', 'curved-arrow'])}</label>` +
        (sel?.type === 'curved-arrow' ? `<label>bend ${metaNum('bend', sel.bend ?? 0.25, 'step="0.05"')}</label>` : '') +
        `<label>stroke-dash ${styleSelect('stroke-dash', sty['stroke-dash'] ?? 'solid', DASHES)}</label>` +
        `<label>stroke ${field('color', 'stroke', toHex(sty.stroke))}</label>` +
        `<label>stroke-width ${field('number', 'stroke-width', sty['stroke-width'], 'min="0" step="0.5"')}</label>` +
        `<label>arrow-size° ${field('number', 'arrow-size', sty['arrow-size'], 'min="0" step="0.05"')}</label>` +
        `<label>opacity ${field('number', 'opacity', sty.opacity, 'min="0" max="1" step="0.05"')}</label>`
      );
      if (!sel) return connector;
      // A selected connector can carry its own label instead of needing a separate text area
      // hand-aligned to its tail.
      return connector + row(
        `<label>label ${meta('label', sel.label ?? '', 'placeholder="(none)"')}</label>` +
        `<label>label-anchor ${styleSelect('label-anchor', sty['label-anchor'] ?? 'start', ['start', 'middle', 'end'])}</label>`
      ) + (sel.label ? labelStyleRow(sty) : '');
    }

    function pastedArrayFor(kind) {
      return projectDoc[kind].data;
    }

    // Polys render from the resolved copy; points/annotations render straight from the doc.
    // Resolution can refetch a `source:` file, so this is async — callers fire and forget and
    // the layer catches up a tick later.
    async function refreshPolyRender() {
      renderPolys = await resolvePolysData(projectDoc.polys.data);
      ensureProjectPolysLayer({ show: projectDoc.polys.show, data: renderPolys });
    }

    function rerenderPasted(kind) {
      if (kind === 'polys') refreshPolyRender();
      else if (kind === 'points') ensureProjectPointsLayer(projectDoc.points);
      else { ensureProjectAnnotationsLayer(projectDoc.annotations); refreshAnnotationHandles(); }
      updateProjectJson();
    }

    // Cheap in-place refresh of the Project tab's text, so every edit is reflected without
    // rebuilding the panel (which would blow away focus in whichever style input you're using).
    function updateProjectJson() {
      const pre = panel.querySelector('.project-json');
      if (pre) pre.textContent = JSON.stringify(projectDoc, null, 2);
    }

    // A polys.data entry may give `source` (a URL/filename) instead of geometry/refUid: fetches a
    // file containing a plain array of features (or a FeatureCollection) and uses each feature's
    // geometry, paired with this entry's own `style` — the file itself carries no style, same as
    // any other poly entry, so one `source` entry with N features in the file renders as N
    // identically-styled features. Fails soft: a bad URL or empty file contributes nothing.
    // Cached per source path: refreshPolyRender() re-resolves on every poly edit, and refetching
    // the same GeoJSON on each keystroke of a style input would be wasteful.
    const polySourceCache = new Map();
    async function loadPolySource(source) {
      if (polySourceCache.has(source)) return polySourceCache.get(source);
      const res = await fetch(projectFileUrl(source));
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const parsed = await res.json();
      // Accept TopoJSON too: a {type:"Topology"} file has no `.features`, so expand every object
      // to GeoJSON features via topojson-client (loaded on demand — the sandbox is otherwise
      // topojson-free). topo.feature() yields a FeatureCollection for a GeometryCollection object
      // and a single Feature otherwise, so normalize both to a flat feature array.
      let features;
      if (parsed?.type === 'Topology') {
        const topo = await import('https://esm.sh/topojson-client@3');
        features = Object.keys(parsed.objects).flatMap(k => {
          const f = topo.feature(parsed, parsed.objects[k]);
          return f.features ?? [f];
        });
      } else {
        features = Array.isArray(parsed) ? parsed : (parsed.features || [parsed]);
      }
      polySourceCache.set(source, features);
      return features;
    }
    async function resolvePolysData(items) {
      const resolved = [];
      for (const item of items) {
        if (!item.source) { resolved.push(item); continue; }
        try {
          for (const f of await loadPolySource(item.source)) {
            // The expanded features are new objects, but they must answer to the AUTHORED entry's
            // id — clicking one on the map should select the `source:` entry that produced it.
            const expanded = { geometry: f.geometry, style: item.style, insertBelow: item.insertBelow, minzoom: item.minzoom, maxzoom: item.maxzoom };
            itemIds.set(expanded, idFor(item));
            resolved.push(expanded);
          }
        } catch (err) {
          console.warn(`[project] failed to load poly source "${item.source}":`, err);
        }
      }
      return resolved;
    }

    // Locator globe pinned to a corner of the viewport (project.inset) — a genuinely separate
    // maplibregl.Map() instance (own WebGL context), created only when that section is present.
    // See dev/specs/2026-08-04-sandbox-reference-maps-design.md's `inset` section.
    let insetMap = null;
    let insetLiveBbox = false;
    let insetFollow = false;

    // Walks any GeoJSON geometry (any nesting depth of Polygon/MultiPolygon/etc coordinates) and
    // returns its [west, south, east, north] bbox — used to turn a refUid/geometry into the same
    // bbox rectangle the inset already knows how to draw, so "show this feature's extent" reuses
    // updateInsetBbox() rather than a second rendering path.
    function geometryBbox(geometry) {
      let w = Infinity, s = Infinity, e = -Infinity, n = -Infinity;
      const walk = (coords) => {
        if (typeof coords[0] === 'number') {
          const [lng, lat] = coords;
          if (lng < w) w = lng; if (lng > e) e = lng;
          if (lat < s) s = lat; if (lat > n) n = lat;
        } else {
          for (const c of coords) walk(c);
        }
      };
      walk(geometry.coordinates);
      return w === Infinity ? null : [w, s, e, n];
    }

    // Splits a [w,s,e,n] bbox into a densified ring — straight lat/lng edges don't read as
    // straight on a globe, so each edge is sampled into multiple points before rendering, same
    // idiom as curved-arrow's sampled bezier.
    function densifyBbox([w, s, e, n], stepsPerEdge = 16) {
      const lerp = (a, b, t) => a + (b - a) * t;
      const edges = [[[w, s], [e, s]], [[e, s], [e, n]], [[e, n], [w, n]], [[w, n], [w, s]]];
      const ring = [];
      for (const [[x1, y1], [x2, y2]] of edges) {
        for (let i = 0; i < stepsPerEdge; i++) ring.push([lerp(x1, x2, i / stepsPerEdge), lerp(y1, y2, i / stepsPerEdge)]);
      }
      ring.push(ring[0]);
      return ring;
    }

    function setInsetRectStyle(fillId, outlineId, styleOverrides) {
      const style = mergeProjectStyle(PROJECT_POLY_DEFAULTS, styleOverrides);
      insetMap.setPaintProperty(fillId, 'fill-color', toMapLibreColor(style.fill));
      insetMap.setPaintProperty(fillId, 'fill-opacity', style['fill-opacity']);
      insetMap.setPaintProperty(outlineId, 'line-color', toMapLibreColor(style.stroke));
      insetMap.setPaintProperty(outlineId, 'line-width', style['stroke-width']);
      insetMap.setPaintProperty(outlineId, 'line-opacity', style.opacity);
    }

    function updateInsetBbox(coords) {
      if (!insetMap?.getSource('inset-bbox')) return;
      const ring = densifyBbox(coords);
      insetMap.getSource('inset-bbox').setData({
        type: 'Feature', geometry: { type: 'Polygon', coordinates: [ring] }, properties: {}
      });
    }

    function ensureInsetMap(config) {
      const div = document.getElementById('inset-map');
      if (config.show === false) {
        if (insetMap) { insetMap.remove(); insetMap = null; }
        div?.remove();
        insetPosConfig = null;
        return;
      }
      if (insetMap) return; // already created — config is set once, not re-applied live.

      // follow: false (default) — static locator, camera set once and never moves, per the
      // original design. true — the inset re-centers on the main map's center on every 'move'
      // (see the map.on('move') handler below); its own zoom/bearing/pitch stay as configured,
      // it doesn't mirror the main map's zoom too.
      insetFollow = config.follow === true;

      const size = config.size ?? 160;
      insetPosConfig = { corner: insetCorner(config.position), size };
      // radius defaults to '50%' (circle) — except with a mercator projection, where a
      // circular mask would just clip the flat map's corners off rather than reading as
      // intentional, so the default there is a square frame (0) instead.
      const radius = config.radius ?? (config.projection === 'mercator' ? 0 : '50%');
      // border: { color, width } — or false for none. Note the border sits in the box model, so
      // it eats into the canvas (a 160px div with a 1.5px border gives a 157px canvas). Widening
      // it shrinks the globe's available space rather than growing the frame around it.
      const border = config.border === false ? { width: 0 } : (config.border || {});
      const borderWidth = border.width ?? 1.5;
      const borderColor = border.color ?? '#fff';
      const el = document.createElement('div');
      el.id = 'inset-map';
      el.style.cssText = `position:absolute;width:${size}px;height:${size}px;` +
        `border-radius:${typeof radius === 'number' ? radius + 'px' : radius};overflow:hidden;` +
        `border:${borderWidth}px solid ${borderColor};z-index:5;`;
      document.getElementById('map').appendChild(el);
      // Click the inset to edit it, mirroring click-a-feature-to-select on the main map. The
      // listener sits on the container, not the inset's canvas, so it still fires with the inset
      // map's own interaction handlers disabled. stopPropagation keeps the click from reaching
      // the main map underneath, which would clear the selection again immediately.
      if (debug) {
        el.addEventListener('click', (ev) => {
          ev.stopPropagation();
          insetSelected = true;
          selectedItem = null;
          activeTab = 'edit';
          buildPanel();
        });
      }
      repositionInsetForExport();

      insetMap = new maplibregl.Map({
        container: el,
        style: styleUrl(style),
        center: config.center ?? [0, 20],
        zoom: config.zoom ?? 0,
        bearing: config.bearing ?? 0,
        pitch: config.pitch ?? 0,
        attributionControl: false,
        // preserveDrawingBuffer, same reason as the main map above: without it the WebGL buffer
        // may be cleared before the export tool can drawImage() the inset into the output.
        canvasContextAttributes: { antialias: true, preserveDrawingBuffer: true },
        transformRequest
      });

      applyInsetVignette();

      if (config.lock !== false) {
        for (const h of ['scrollZoom', 'dragPan', 'dragRotate', 'doubleClickZoom', 'touchZoomRotate', 'boxZoom', 'keyboard']) {
          insetMap[h]?.disable();
        }
      }

      insetMap.on('load', () => {
        if (config.labels === false) {
          for (const l of insetMap.getStyle().layers) {
            if (groupOf(l) === 'label') insetMap.setLayoutProperty(l.id, 'visibility', 'none');
          }
        }
        // Exact layer ids to hide in the inset, same idiom as view.hide on the main map — e.g.
        // ["admin1-stroke", "innerlines"] to drop country/admin border lines.
        for (const id of (config.hide || [])) {
          if (insetMap.getLayer(id)) insetMap.setLayoutProperty(id, 'visibility', 'none');
        }
        insetMap.addSource('inset-bbox', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
        insetMap.addLayer({ id: 'inset-bbox-fill', type: 'fill', source: 'inset-bbox', paint: {} });
        insetMap.addLayer({ id: 'inset-bbox-outline', type: 'line', source: 'inset-bbox', paint: {} });
        setInsetRectStyle('inset-bbox-fill', 'inset-bbox-outline', config.bbox?.style);

        // bbox source, in priority order: explicit coords > a feature's own extent (geometry or
        // refUid, e.g. mark "the extent of Ukraine" rather than a hand-typed rectangle) > live
        // main-map viewport tracking (the default when none of the above are given).
        const extentGeometry = config.bbox?.geometry
          ? config.bbox.geometry
          : Array.isArray(config.bbox?.refUid) ? resolveRefUidGeometry(config.bbox.refUid, insetMap) : null;
        if (config.bbox?.coords) {
          insetLiveBbox = false;
          updateInsetBbox(config.bbox.coords);
        } else if (extentGeometry) {
          insetLiveBbox = false;
          const bbox = geometryBbox(extentGeometry);
          if (bbox) updateInsetBbox(bbox);
          if (config.bbox.refUid) {
            // refUid only resolves once the relevant tiles have loaded, same constraint as
            // highlight.refUid just below — re-resolve once idle confirms that.
            insetMap.once('idle', () => {
              const g = resolveRefUidGeometry(config.bbox.refUid, insetMap);
              const b = g && geometryBbox(g);
              if (b) updateInsetBbox(b);
            });
          }
        } else {
          insetLiveBbox = true;
          updateInsetBbox([map.getBounds().getWest(), map.getBounds().getSouth(), map.getBounds().getEast(), map.getBounds().getNorth()]);
        }

        if (config.highlight?.refUid) {
          const geometry = resolveRefUidGeometry(config.highlight.refUid, insetMap);
          insetMap.addSource('inset-highlight', {
            type: 'geojson',
            data: { type: 'Feature', geometry: geometry || { type: 'MultiPolygon', coordinates: [] }, properties: {} }
          });
          insetMap.addLayer({ id: 'inset-highlight-fill', type: 'fill', source: 'inset-highlight', paint: {} });
          insetMap.addLayer({ id: 'inset-highlight-outline', type: 'line', source: 'inset-highlight', paint: {} });
          setInsetRectStyle('inset-highlight-fill', 'inset-highlight-outline', config.highlight.style);
          // refUid only resolves once the relevant tiles have loaded, same constraint as polys'
          // refUid on the main map — re-resolve once idle confirms that.
          insetMap.once('idle', () => {
            const g = resolveRefUidGeometry(config.highlight.refUid, insetMap);
            if (g) insetMap.getSource('inset-highlight').setData({ type: 'Feature', geometry: g, properties: {} });
          });
        }

        refreshInsetMarkers();
        refreshInsetCenterDot();

        // Click the inset itself, while "Add marker" is armed, to drop a pin at that lng/lat —
        // same idiom as the main map's sketch tools, just scoped to the inset's own click events.
        insetMap.on('click', (e) => {
          if (!insetMarkerArmed) return;
          projectDoc.inset.markers = projectDoc.inset.markers || [];
          projectDoc.inset.markers.push({
            lng: +e.lngLat.lng.toFixed(4), lat: +e.lngLat.lat.toFixed(4),
            style: { ...sketchPointStyle }
          });
          refreshInsetMarkers();
          updateProjectJson();
          readout.textContent = 'added inset marker — click to add more, Esc to stop';
        });
      });
    }

    // markers: array of { lng, lat, style } — same style keys as points (fill/size/stroke/
    // stroke-width/opacity), no labels (an inset globe is too small for label clutter). Callable
    // any time after creation (not just once at load), so "Add marker" can push a new pin and
    // see it immediately rather than waiting for the inset to be rebuilt.
    // centerDot: { style } — a single circle on the inset marking the MAIN map's current center,
    // so the inset reads as "you are here" while the globe stays put (unlike inset.follow, which
    // moves the camera). Same style keys as points/markers; updated live on every main-map move
    // (see the map.on('move') handler). Absent config → no dot, no source, no cost.
    function refreshInsetCenterDot() {
      if (!insetMap) return;
      const cfg = projectDoc.inset?.centerDot;
      if (!cfg) {
        if (insetMap.getLayer('inset-center-dot')) insetMap.removeLayer('inset-center-dot');
        return;
      }
      const style = mergeProjectStyle(PROJECT_POINT_DEFAULTS, cfg.style);
      const c = map.getCenter();
      const data = {
        type: 'Feature',
        geometry: { type: 'Point', coordinates: [c.lng, c.lat] },
        properties: {
          _fill: toMapLibreColor(style.fill), _radius: style.size,
          _stroke: toMapLibreColor(style.stroke), _strokeWidth: style['stroke-width'],
          _opacity: style.opacity
        }
      };
      if (insetMap.getSource('inset-center')) {
        insetMap.getSource('inset-center').setData(data);
      } else {
        insetMap.addSource('inset-center', { type: 'geojson', data });
        insetMap.addLayer({
          id: 'inset-center-dot', type: 'circle', source: 'inset-center',
          paint: {
            'circle-color': ['get', '_fill'], 'circle-radius': ['get', '_radius'],
            'circle-stroke-color': ['get', '_stroke'], 'circle-stroke-width': ['get', '_strokeWidth'],
            'circle-opacity': ['get', '_opacity']
          }
        });
      }
    }

    function refreshInsetMarkers() {
      if (!insetMap) return;
      const markerFeatures = (projectDoc.inset?.markers || []).map((m) => {
        const style = mergeProjectStyle(PROJECT_POINT_DEFAULTS, m.style);
        return {
          type: 'Feature',
          geometry: { type: 'Point', coordinates: [m.lng, m.lat] },
          properties: {
            _fill: toMapLibreColor(style.fill), _radius: style.size,
            _stroke: toMapLibreColor(style.stroke), _strokeWidth: style['stroke-width'],
            _opacity: style.opacity
          }
        };
      });
      const data = { type: 'FeatureCollection', features: markerFeatures };
      if (insetMap.getSource('inset-markers')) {
        insetMap.getSource('inset-markers').setData(data);
      } else if (markerFeatures.length) {
        insetMap.addSource('inset-markers', { type: 'geojson', data });
        insetMap.addLayer({
          id: 'inset-markers-circle', type: 'circle', source: 'inset-markers',
          paint: {
            'circle-color': ['get', '_fill'], 'circle-radius': ['get', '_radius'],
            'circle-stroke-color': ['get', '_stroke'], 'circle-stroke-width': ['get', '_strokeWidth'],
            'circle-opacity': ['get', '_opacity']
          }
        });
      }
    }

    function migrateLegacyTextAreaSizes() {
      const boxes = pastedArrayFor('annotations').filter(
        (a) => a.type === 'text-area' && ((a.width ?? 0) < 20 || (a.height ?? 0) < 20));
      if (!boxes.length) return;
      const c = map.getCenter();
      const p0 = map.project([c.lng, c.lat]);
      const pxPerLng = Math.abs(map.project([c.lng + 1, c.lat]).x - p0.x);
      const pxPerLat = Math.abs(map.project([c.lng, c.lat + 1]).y - p0.y);
      for (const b of boxes) {
        b.width = Math.round(Math.max((b.width ?? 1) * pxPerLng, 20));
        b.height = Math.round(Math.max((b.height ?? 1) * pxPerLat, 14));
      }
      console.warn(`[project] converted ${boxes.length} text-area width/height from degrees to px ` +
        `— copy the Project tab back over the file to keep the new values`);
      rerenderPasted('annotations');
    }

    // Tiles stream in as you pan and zoom, so a refUid entry that resolved to nothing (or to
    // half a country) gets another chance on every idle. Cheap because it only fires when the
    // project actually uses refUid, and the cache means each pass can only add shapes.
    map.on('idle', () => {
      if (pastedArrayFor('polys').some((it) => Array.isArray(it.refUid))) rerenderPasted('polys');
    });

    // Live-tracking bbox/camera: recompute on every main-map move. No-op until an inset has
    // actually been created (and, for the bbox case, finished loading its own sources).
    map.on('move', () => {
      if (exportParam) updateExportBboxReadout();  // keep the export bbox field live while panning/zooming
      if (insetFollow && insetMap) insetMap.jumpTo({ center: map.getCenter() });
      if (insetMap?.getSource('inset-center')) refreshInsetCenterDot();
      if (!insetLiveBbox || !insetMap?.getSource('inset-bbox')) return;
      const b = map.getBounds();
      updateInsetBbox([b.getWest(), b.getSouth(), b.getEast(), b.getNorth()]);
    });

    // Loads every ?project= file and concatenates their points/polys/annotations data, in listed
    // order. show/view settings only apply when exactly one project file is given — with more
    // than one there's no non-arbitrary way to resolve two files disagreeing on e.g.
    // view.basemap, so they're ignored entirely rather than picking a rule (use ?lock etc. for
    // view behavior when combining multiple project files).
    // --- World-file images (export.raster) ------------------------------------------------
    // The same block Mapa writes: export.raster = { show, data: [{ image, worldfile: { xPixelSize,
    // yRotation, xRotation, yPixelSize, xUpperLeft, yUpperLeft }, opacity, order, position, show }] }.
    // Each image becomes a MapLibre image source pinned at its four corners. Two world-file flavours,
    // told apart the way Mapa does (|pixel size| < 1 → degrees):
    //   Web Mercator metres — MapLibre stretches images linearly in Web Mercator, so the corners
    //     alone place it exactly (rotation terms included);
    //   degrees (EPSG:4326) — latitude isn't linear in Mercator, so the image is first re-warped
    //     row by row into Mercator on a canvas, then pinned the same way.
    // Like Mapa, the upper-left value is taken as the image's outer corner. Not supported: other
    // projections (UTM…) and blend modes (MapLibre rasters only have opacity).
    // position: 'top' = over the basemap fills, under labels and project data (Mapa: over basemap);
    // otherwise just above the style background, under the basemap. insertBelow (a style layer id)
    // overrides either. Draw order follows `order` (higher on top).
    const MERC_R = 6378137, MERC_MAX = 20037508.342789244;
    const mercToLngLat = (x, y) => [x / MERC_MAX * 180, (2 * Math.atan(Math.exp(y / MERC_R)) - Math.PI / 2) * 180 / Math.PI];
    const latToMercY = (lat) => MERC_R * Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360));
    // Relative paths resolve like Mapa's pointers: the project file's own folder first, then ./projects/.
    function rasterCandidates(src) {
      if (/^(https?:)?\/\//.test(src) || /^(blob|data):/.test(src) || /^\.{0,2}\//.test(src)) return [src];
      const base = loadedProjectUrls.length === 1 ? loadedProjectUrls[0].slice(0, loadedProjectUrls[0].lastIndexOf('/') + 1) : './projects/';
      return [...new Set([base + src, './projects/' + src])];
    }
    async function loadRasterImage(src) {
      for (const url of rasterCandidates(src)) {
        try {
          const img = new Image(); img.crossOrigin = 'anonymous'; img.src = url;
          await img.decode();
          return img;
        } catch { /* next candidate */ }
      }
      throw new Error('not found: ' + rasterCandidates(src).join(', '));
    }
    // Re-warp a degrees (plate carrée) image so its rows are evenly spaced in Web Mercator.
    function warpToMercator(img, north, south) {
      const w = img.naturalWidth, h = img.naturalHeight;
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      const yN = latToMercY(north), yS = latToMercY(south);
      for (let j = 0; j < h; j++) {
        const lat = (2 * Math.atan(Math.exp((yN + (yS - yN) * (j + 0.5) / h) / MERC_R)) - Math.PI / 2) * 180 / Math.PI;
        const sy = Math.min(h - 1, Math.max(0, Math.floor((north - lat) / (north - south) * h)));
        ctx.drawImage(img, 0, sy, w, 1, 0, j, w, 1);
      }
      return new Promise((res) => c.toBlob((b) => res(URL.createObjectURL(b)), 'image/png'));
    }
    let rasterIds = [], rasterGen = 0;
    async function renderProjectRasters() {
      // A newer call (e.g. another drop) supersedes this one: stop before adding anything stale.
      const gen = ++rasterGen;
      for (const id of rasterIds) { if (map.getLayer(id)) map.removeLayer(id); if (map.getSource(id)) map.removeSource(id); }
      rasterIds = [];
      const block = projectDoc.export?.raster;
      if (!block || block.show === false || !Array.isArray(block.data)) return;
      const items = block.data.filter((r) => r && r.show !== false && typeof r.image === 'string' && r.worldfile)
        .map((r, i) => ({ r, i })).sort((a, b) => (a.r.order ?? a.i) - (b.r.order ?? b.i));
      for (const { r, i } of items) {
        try {
          const img = await loadRasterImage(imgBlobs.get(r) || r.image);
          if (gen !== rasterGen) return;
          const wf = r.worldfile, W = img.naturalWidth, H = img.naturalHeight;
          const A = +wf.xPixelSize || 0, D = +wf.yRotation || 0, B = +wf.xRotation || 0, E = +wf.yPixelSize || 0;
          const C = +wf.xUpperLeft || 0, F = +wf.yUpperLeft || 0;
          const at = (px, py) => [A * px + B * py + C, D * px + E * py + F];
          const geographic = Math.abs(A) < 1;
          let url = img.src, corners;
          if (geographic) {
            corners = [at(0, 0), at(W, 0), at(W, H), at(0, H)];
            // Unrotated degrees image: re-warp so latitude lands right across its whole height.
            if (!B && !D) url = await warpToMercator(img, F, F + E * H);
            if (gen !== rasterGen) return;
          } else {
            corners = [at(0, 0), at(W, 0), at(W, H), at(0, H)].map(([x, y]) => mercToLngLat(x, y));
          }
          if (r.blendMode && r.blendMode !== 'normal') console.warn(`[raster] ${r.name || r.image}: blend mode "${r.blendMode}" isn't available in MapLibre — drawn normally`);
          const id = 'project-raster-' + i;
          if (map.getSource(id)) continue;
          const layers = map.getStyle().layers;
          const firstSymbol = layers.find((l) => l.type === 'symbol')?.id;
          const afterBackground = layers[layers.findIndex((l) => l.id === 'background') + 1]?.id;
          const beforeId = (r.insertBelow && map.getLayer(r.insertBelow)) ? r.insertBelow
            : r.position === 'top' ? firstSymbol : afterBackground;
          map.addSource(id, { type: 'image', url, coordinates: corners });
          // Added bare, then painted — the addLayer wrapper's -transition keys are rejected for
          // raster-fade-duration (not animatable).
          map.addLayer({ id, type: 'raster', source: id }, beforeId);
          map.setPaintProperty(id, 'raster-opacity', r.opacity ?? 1);
          map.setPaintProperty(id, 'raster-fade-duration', 0);
          rasterIds.push(id);
        } catch (e) { console.warn(`[raster] ${r.name || r.image}: ${e.message}`); }
      }
    }
    const loadedProjectUrls = [];   // the URL each loaded project actually came from (relative data paths)
    async function loadProjects() {
      if (!projectUrlSets.length) return;
      const loaded = [];
      for (const candidates of projectUrlSets) {
        let ok = false;
        for (const url of candidates) {
          try {
            const res = await fetch(url);
            if (!res.ok) continue;   // 404 on the mode-folder candidate -> try the flat fallback
            loaded.push(await res.json());
            loadedProjectUrls.push(url);
            ok = true;
            break;
          } catch { /* network/parse error on this candidate — try the next */ }
        }
        if (!ok) console.warn(`[project] failed to load any of: ${candidates.join(', ')}`);
      }
      if (!loaded.length) return;

      // view.insertBelow (single-project only, see below) must be applied before the renders
      // just below, since addLayer's beforeId only takes effect when a layer is first created.
      // Either one string (applies to all three sections) or {points, polys, annotations} for
      // independent per-section anchors.
      if (loaded.length === 1 && loaded[0].view?.insertBelow) {
        const insertBelow = loaded[0].view.insertBelow;
        if (typeof insertBelow === 'string') {
          projectBeforeId.points = projectBeforeId.polys = projectBeforeId.annotations = insertBelow;
        } else if (typeof insertBelow === 'object') {
          Object.assign(projectBeforeId, insertBelow);
        }
      }

      // Seed projectDoc from the file itself. With exactly one project this is a deep clone, so
      // every key the sandbox never touches (view, inset, hideFeatures, and any future field)
      // survives verbatim into what the Project tab hands back — that's what makes the copy a
      // complete file rather than a fragment. Cloning also means edits can't write back through
      // to the fetched object.
      //
      // show flags must land before the renders below: rerenderPasted() reads them at render
      // time, so setting them afterwards left the first render using the stale true default
      // regardless of a project's own show: false.
      if (loaded.length === 1) {
        Object.assign(projectDoc, structuredClone(loaded[0]));
      }
      // Whether one file or several, guarantee the three sections exist and concatenate data in
      // listed order. With multiple files only their data merges — view/inset are ignored, same
      // as before, since there's no non-arbitrary way to reconcile two files disagreeing.
      for (const kind of ['points', 'polys', 'annotations']) {
        const existing = projectDoc[kind];
        projectDoc[kind] = {
          ...(existing || {}),
          show: existing ? existing.show !== false : true,
          data: loaded.length === 1 ? (existing?.data || []) : []
        };
      }
      if (loaded.length > 1) {
        for (const projectData of loaded) {
          for (const kind of ['points', 'polys', 'annotations']) {
            if (projectData[kind]) projectDoc[kind].data.push(...(projectData[kind].data || []));
          }
        }
      }
      rerenderPasted('points');
      rerenderPasted('polys');
      rerenderPasted('annotations');
      // Legend/note are export presentation, not data — skip them in Mapa nav mode.
      if (!mapaMode) loadSpriteJson().then(renderFrameOverlays);

      if (loaded.length > 1) return;
      const [projectData] = loaded;

      // Accessibility alt text — promoted to the host page via the vallenato resizer's `imageAlt`
      // message (sets the iframe's role=img + aria-label; optional title/aria-description). A
      // top-level `alt` string (plus optional `title`/`description`) on the project file, since it
      // describes the whole map, not just its framing. Posted below alongside the height report.
      if (typeof projectData.alt === 'string') {
        embedAlt = { alt: projectData.alt };
        if (typeof projectData.title === 'string') embedAlt.title = projectData.title;
        if (typeof projectData.description === 'string') embedAlt.description = projectData.description;
      }

      // view: {center, zoom, lock, basemap, hillshade, hide} — same semantics as the matching
      // URL params, but authored into the project file so a published reference map carries its
      // own default framing/basemap choice without needing every param on every link.
      if (projectData.view && !mapaMode) {
        // center/zoom/bbox are optional and only apply if ?bbox=/?zoom= didn't already position
        // the view — an explicit URL param always wins over the project file's default.
        const v = projectData.view;
        // Responsive extent override: deltas over view (bbox/height), applied at narrow widths.
        if (v.mobile && typeof v.mobile === 'object') {
          mobileView = {
            bbox: v.mobile.bbox?.length === 4 ? v.mobile.bbox : null,
            height: Number.isFinite(v.mobile.height) ? v.mobile.height : null,
            maxWidth: Number.isFinite(v.mobile.maxWidth) ? v.mobile.maxWidth : null,
          };
        }
        if (!bbox?.length && !centerParam?.length && zoom == null && (v.center || v.zoom != null || v.bbox?.length === 4)) {
          // Priority within the project file itself: explicit center/zoom win; bbox (an extent,
          // same [w,s,e,n] order as ?bbox=) only fills in whichever of the two wasn't explicitly
          // given. Lets a project pin an exact designed zoom while still deriving a
          // viewport-responsive center from the extent, or vice versa — cameraForBounds computes
          // the fit without moving the map, so it composes cleanly with the jumpTo() below rather
          // than needing two separate camera moves.
          // A project view.bbox is a responsive extent — keep re-fitting it on resize, unless the
          // author pinned BOTH center and zoom (then it's a deliberate fixed camera). Set before
          // computing the camera so activeFitBbox() can pick the mobile extent when the frame is narrow.
          if (v.bbox?.length === 4 && !(v.center != null && v.zoom != null)) fitBbox = v.bbox;
          // Frame to the extent for the CURRENT width — mobile bbox if narrow — so the first paint
          // lands on the right crop instead of flashing the desktop framing before the resize re-fit.
          const framingBbox = activeFitBbox() ?? v.bbox;
          const extentCamera = framingBbox?.length === 4
            ? map.cameraForBounds([[framingBbox[0], framingBbox[1]], [framingBbox[2], framingBbox[3]]], { padding: 40 })
            : null;
          map.jumpTo({
            center: v.center ?? extentCamera?.center ?? map.getCenter(),
            zoom: v.zoom ?? extentCamera?.zoom ?? map.getZoom()
          });
        }
        if (projectData.view.basemap === false) setBasemapVisibility(false);
        if (projectData.view.hillshade === false) setHillshadeVisibility(false);
        if (Array.isArray(projectData.view.hide)) hideLayers(projectData.view.hide);
        if (Array.isArray(projectData.view.hideFeatures)) hideFeatures(projectData.view.hideFeatures);
        // Per-project zoom limits (interactive, unlike lock which pins to one level). Override the
        // default maxZoom cap / min of 0. `lock` below still wins if also set.
        if (Number.isFinite(projectData.view.minzoom)) map.setMinZoom(projectData.view.minzoom);
        if (Number.isFinite(projectData.view.maxzoom)) map.setMaxZoom(projectData.view.maxzoom);
        if (Number.isFinite(projectData.view.height)) embedHeight = projectData.view.height;
        // view.bounds is a HARD cage (maxBounds): the map can move within it but can't be panned/
        // zoomed off to another area — keeps an embed pinned to its region so it can't be rewired.
        // Distinct from view.bbox, which only FRAMES (a soft, responsive fit). Set either or both.
        if (projectData.view.bounds?.length === 4) {
          const [bw, bs, be, bn] = projectData.view.bounds;
          map.setMaxBounds([[bw, bs], [be, bn]]);
        }
        if (projectData.view.lock) lockZoomAt(map.getZoom());
      }

      // A text area's width/height used to be degrees and are now pixels. A box under 20px wide
      // is narrower than a single character, so such a value can only be a legacy degree figure —
      // convert it against the view this file was authored for. Done after the view block above
      // so the zoom is the project's own, not whatever the map happened to open at.
      migrateLegacyTextAreaSizes();

      if (projectData.inset && !mapaMode) ensureInsetMap(projectData.inset);
    }

    function ensureDropLayer() {
      if (map.getSource('sandbox-drops')) return;
      map.addSource('sandbox-drops', { type: 'geojson', data: drops });
      map.addLayer({
        id: 'sandbox-drops', type: 'circle', source: 'sandbox-drops',
        paint: {
          'circle-radius': ['get', '_r'],
          'circle-color': ['get', '_color'],
          'circle-opacity': ['get', '_op'],
          'circle-stroke-color': ['get', '_sc'],
          'circle-stroke-width': ['get', '_sw']
        }
      });
    }

    // Clear the "armed" highlight from every placement button (circle rows + preset rows)
    function clearArmedButtons() {
      panel.querySelectorAll('.drop-btn.armed, .sketch-btn.armed').forEach(b => b.classList.remove('armed'));
      labels.querySelectorAll('.place-preset.armed, .pv-add.armed').forEach(b => b.classList.remove('armed'));
    }

    function armDrop(id, btn) {
      ensureDropLayer();
      pendingLabel = null;   // only one placement mode at a time
      pendingLL = null;
      pendingDrop = pendingDrop === id ? null : id;   // click again to cancel
      map.getCanvas().style.cursor = pendingDrop ? 'crosshair' : '';
      clearArmedButtons();
      if (pendingDrop && btn) btn.classList.add('armed');
      readout.textContent = pendingDrop
        ? `click the map to drop a circle (from ${id}) — Esc to stop`
        : '';
    }

    // Shared symbol layer for dropped label OBJECTS. Per-feature size/color/halo; font is a plain
    // layer property (text-font can't be read per-feature), set from each drop's chosen stack.
    function ensureLabelLayer() {
      if (map.getSource('sandbox-labels')) return;
      map.addSource('sandbox-labels', { type: 'geojson', data: labelDrops });
      map.addLayer({
        id: 'sandbox-labels', type: 'symbol', source: 'sandbox-labels',
        layout: {
          'text-field': ['get', '_t'],
          'text-font': ['Noto Sans Medium'],
          'text-size': ['get', '_sz'],
          'text-anchor': ['get', '_anchor'],
          // Push the text away from its anchor side so it doesn't sit on top of the point.
          // Each [x,y] output must be wrapped in ["literal", ...] — a bare array here is
          // parsed as a nested expression (["1", 0] etc.), not a literal value.
          'text-offset': ['match', ['get', '_anchor'],
            'left', ['literal', [1, 0]],
            'right', ['literal', [-1, 0]],
            'top', ['literal', [0, 0.8]],
            'bottom', ['literal', [0, -0.8]],
            'top-left', ['literal', [0.7, 0.6]],
            'top-right', ['literal', [-0.7, 0.6]],
            'bottom-left', ['literal', [0.7, -0.6]],
            'bottom-right', ['literal', [-0.7, -0.6]],
            ['literal', [0, 0]]],
          'text-allow-overlap': true
        },
        paint: {
          'text-color': ['get', '_col'],
          'text-halo-color': ['get', '_hc'],
          'text-halo-width': ['get', '_hw']
        }
      });
    }

    // Begin placement: text comes from the preview's text input (no prompt); anchor from the
    // preview's anchor select — shared across every placement path, same as text already is
    function startLabel(src, style, btn, desc) {
      const text = pvq('.pv-text')?.value || style.name || 'Label';
      const anchor = pvq('.pv-anchor')?.value || 'center';
      pendingLabel = { src, text, font: style.font, size: style.size, color: style.color, hc: style.hc, hw: style.hw, anchor };
      map.getCanvas().style.cursor = 'crosshair';
      if (btn) btn.classList.add('armed');
      readout.textContent = `click the map to place "${text}" (${desc}) — Esc to stop`;
    }

    // Arm a label from an existing symbol layer (copies its font/size/color/halo)
    function armLabel(id, btn) {
      ensureLabelLayer();
      pendingDrop = null;
      pendingLL = null;
      clearArmedButtons();
      if (pendingLabel && pendingLabel.src === 'layer:' + id) { pendingLabel = null; map.getCanvas().style.cursor = ''; readout.textContent = ''; return; }
      const tf = map.getLayoutProperty(id, 'text-font');
      startLabel('layer:' + id, {
        font: Array.isArray(tf) && typeof tf[0] === 'string' ? tf : ['Noto Sans Medium'],
        size: plain(map.getLayoutProperty(id, 'text-size'), 12),
        color: plain(map.getPaintProperty(id, 'text-color'), '#ffffff'),
        hc: plain(map.getPaintProperty(id, 'text-halo-color'), '#000000'),
        hw: plain(map.getPaintProperty(id, 'text-halo-width'), 0)   // no stroke unless the layer has one
      }, btn, 'from ' + id);
    }

    // Full resolved style for a preset (font, size, fill color, stroke color + width)
    function presetStyle(p) {
      return {
        name: p.name,
        font: p.font ? [p.font] : ['Noto Sans Medium'],
        size: (p.size !== '' && p.size != null) ? +p.size : 12,
        color: p.color || '#000000',
        hc: p.haloColor || '#ffffff',
        hw: (p.haloWidth !== '' && p.haloWidth != null) ? +p.haloWidth : 0
      };
    }

    // Arm a label from a preset (uses the preset's own font/size/fill/stroke)
    function armLabelFromPreset(pid, btn) {
      const p = labelPresets.find(x => x.id === pid);
      if (!p) return;
      ensureLabelLayer();
      pendingDrop = null;
      pendingLL = null;
      clearArmedButtons();
      if (pendingLabel && pendingLabel.src === 'preset:' + pid) { pendingLabel = null; map.getCanvas().style.cursor = ''; readout.textContent = ''; return; }
      startLabel('preset:' + pid, presetStyle(p), btn, 'preset ' + p.name);
    }

    function disarmDrop() {
      pendingDrop = null;
      pendingLabel = null;
      pendingSketch = null;
      pendingTrim = null;
      setSketchPreview(null);
      clearTrimPreview();
      if (pendingLL) { pendingLL = null; refreshLeaderLines(); }   // wipe any pending click markers
      map.getCanvas().style.cursor = '';
      clearArmedButtons();
    }

    // ~1m precision is plenty for a hand-clicked sketch — raw e.lngLat has ~12 junk decimal
    // digits from the map's internal Mercator math.
    const roundCoord = ([lng, lat]) => [+lng.toFixed(5), +lat.toFixed(5)];
    const roundBend = (b) => +b.toFixed(4);

    // Arm/toggle a sketch tool. 'point' inserts on a single click and stays armed (click again
    // to add more); 'rect' and the two arrow modes take two clicks each and then disarm.
    function armSketch(kind, tool, btn) {
      pendingDrop = null;
      pendingLabel = null;
      if (pendingLL) { pendingLL = null; refreshLeaderLines(); }
      const wasArmed = pendingSketch?.kind === kind && pendingSketch?.tool === tool;
      clearArmedButtons();
      setSketchPreview(null);
      // Clicking an armed tool again disarms it — rebuild so its options go away with it.
      if (wasArmed) {
        pendingSketch = null;
        map.getCanvas().style.cursor = '';
        readout.textContent = '';
        buildPanel();
        return;
      }
      const mode = resolveSketchMode(tool);
      // head: false is what makes "Add line" a plain connector rather than an arrow.
      pendingSketch = { kind, tool, mode, head: tool !== 'line' };
      map.getCanvas().style.cursor = 'crosshair';
      // Rebuild so this tool's options appear as soon as it's armed, rather than only once
      // something has been placed. buildPanel() re-applies the armed class from pendingSketch,
      // so the passed btn (about to be replaced) doesn't need marking here.
      buildPanel();
      const shape = sketchArrowShape === 'curved' ? 'curved' : 'straight';
      readout.textContent =
        tool === 'point' ? 'click the map to add a point — click again for more, Esc to stop' :
        tool === 'rect' ? 'rectangle: click one corner, then the opposite corner — Esc to cancel' :
        tool === 'custom-shape' ? 'shape: click each vertex in order, Enter to finish (3+ needed) — Esc to cancel' :
        tool === 'text-area' ? 'text area: click where it should sit — Esc to cancel' :
        tool === 'extent' ? 'inset extent: click one corner, then the opposite corner — Esc to cancel' :
        `${shape} ${tool}: click the start point — Esc to cancel`;
    }

    // Placed sketch annotations get draggable handles (start/end, plus a bend handle for
    // curved arrows) so a shape can be reshaped after the fact without hand-editing JSON.
    const annotationHandles = { type: 'FeatureCollection', features: [] };
    function ensureAnnotationHandlesLayer() {
      if (map.getSource('sandbox-annotation-handles')) return;
      map.addSource('sandbox-annotation-handles', { type: 'geojson', data: annotationHandles });
      map.addLayer({
        id: 'sandbox-annotation-handles', type: 'circle', source: 'sandbox-annotation-handles',
        paint: {
          'circle-radius': 4,
          'circle-color': ['case',
            ['==', ['get', '_locked'], 1], '#c39bff',
            ['match', ['get', '_role'],
              'bend', '#7fd3ff',
              ['nw', 'ne', 'se', 'sw'], '#9ae6a0',
              '#ffd166']],
          'circle-stroke-color': '#000000', 'circle-stroke-width': 1
        }
      });
    }
    // Reshape handles are an editing aid, meaningless to a plain (non-?debug) viewer, and
    // shouldn't appear for arrows the project itself has hidden (annotations.show: false) — both
    // were previously ignored, so a hidden arrow's start/end/bend dots still rendered for every
    // viewer, live.
    function refreshAnnotationHandles() {
      if (!debug) return;
      ensureAnnotationHandlesLayer();
      const features = [];
      if (projectDoc.annotations.show) {
        pastedArrayFor('annotations').forEach((ann, i) => {
          // A text area gets one handle per corner, so it can be resized after the fact the same
          // way it was drawn. Dragging one pins the opposite corner (see the mousemove below).
          if (ann.type === 'text-area') {
            const corners = textAreaCornersPx(ann.position, ann.width, ann.height);
            for (const [role, pt] of Object.entries(corners)) {
              const ll = map.unproject(pt);
              features.push({ type: 'Feature', geometry: { type: 'Point', coordinates: [ll.lng, ll.lat] }, properties: { _i: i, _role: role } });
            }
            return;
          }
          if (ann.type !== 'straight-arrow' && ann.type !== 'curved-arrow') return;
          const ends = connectorEnds(ann);
          // A locked end gets its own color so it's obvious the arrow is attached to something.
          features.push({ type: 'Feature', geometry: { type: 'Point', coordinates: ends.start }, properties: { _i: i, _role: 'start', _locked: ann.startRef ? 1 : 0 } });
          features.push({ type: 'Feature', geometry: { type: 'Point', coordinates: ends.end }, properties: { _i: i, _role: 'end', _locked: ann.endRef ? 1 : 0 } });
          if (ann.type === 'curved-arrow') {
            features.push({
              type: 'Feature',
              geometry: { type: 'Point', coordinates: curveControlPoint(ends.start, ends.end, ann.bend ?? 0.25) },
              properties: { _i: i, _role: 'bend', _locked: 0 }
            });
          }
        });
      }
      annotationHandles.features = features;
      map.getSource('sandbox-annotation-handles').setData(annotationHandles);
    }

    // Dashed preview line shown while a sketch arrow's end point is still being chosen — the
    // line's live direction as the cursor moves IS the arrow's eventual bearing.
    function ensureSketchPreviewLayer() {
      if (map.getSource('sandbox-sketch-preview')) return;
      map.addSource('sandbox-sketch-preview', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
      map.addLayer({
        id: 'sandbox-sketch-preview', type: 'line', source: 'sandbox-sketch-preview',
        paint: { 'line-color': '#7fd3ff', 'line-width': 2, 'line-dasharray': [2, 2] }
      });
    }
    function setSketchPreview(geometry) {
      ensureSketchPreviewLayer();
      map.getSource('sandbox-sketch-preview').setData({
        type: 'FeatureCollection',
        features: geometry ? [{ type: 'Feature', geometry, properties: {} }] : []
      });
    }

    // --- Trim: split a placed poly against another geometry via polygon-clipping (already
    // loaded, see resolveRefUidGeometry above), then click whichever resulting piece to keep.
    // A poly entry's geometry as actual coordinates, resolving refUid on the spot if needed
    // (source: file entries aren't resolvable synchronously here, so those return null).
    function resolvePolyItemGeometry(item) {
      if (item.geometry) return item.geometry;
      if (Array.isArray(item.refUid)) return resolveRefUidGeometry(item.refUid);
      return null;
    }
    function ensureTrimPreviewLayers() {
      for (const [id, color] of [['sandbox-trim-intersection', '#1a73e8'], ['sandbox-trim-difference', '#ff8c42']]) {
        if (map.getSource(id)) continue;
        map.addSource(id, { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
        map.addLayer({ id, type: 'fill', source: id, paint: { 'fill-color': color, 'fill-opacity': 0.5 } });
        map.addLayer({ id: id + '-outline', type: 'line', source: id, paint: { 'line-color': color, 'line-width': 2 } });
      }
    }
    function setTrimPreview(intersectionCoords, differenceCoords) {
      ensureTrimPreviewLayers();
      const toFeatures = (coords) => coords?.length ? [{ type: 'Feature', geometry: { type: 'MultiPolygon', coordinates: coords }, properties: {} }] : [];
      map.getSource('sandbox-trim-intersection').setData({ type: 'FeatureCollection', features: toFeatures(intersectionCoords) });
      map.getSource('sandbox-trim-difference').setData({ type: 'FeatureCollection', features: toFeatures(differenceCoords) });
    }
    function clearTrimPreview() {
      if (map.getSource('sandbox-trim-intersection')) setTrimPreview(null, null);
    }
    // Runs the actual boolean ops and shows the "click a piece" preview. Coordinates only (not
    // GeoJSON geometry objects) — same convention polygon-clipping already uses elsewhere here.
    function startTrimPreview(targetIndex, targetCoords, otherCoords) {
      disarmDrop();   // trim is its own mode, mutually exclusive with sketch/drop/label placement
      const intersectionCoords = polygonClipping.intersection(targetCoords, otherCoords);
      const differenceCoords = polygonClipping.difference(targetCoords, otherCoords);
      if (!intersectionCoords.length && !differenceCoords.length) {
        readout.textContent = "trim: that geometry doesn't overlap this shape at all — nothing to split. Esc to cancel";
        return;
      }
      pendingTrim = { targetIndex, intersectionCoords, differenceCoords };
      setTrimPreview(intersectionCoords, differenceCoords);
      readout.textContent = 'trim: click the piece on the map you want to KEEP (blue = overlap, orange = the rest) — Esc to cancel';
    }
    function commitTrim(coords) {
      pastedArrayFor('polys')[pendingTrim.targetIndex].geometry = { type: 'MultiPolygon', coordinates: coords };
      rerenderPasted('polys');
      pendingTrim = null;
      clearTrimPreview();
      buildPanel();
      readout.textContent = 'trimmed';
    }

    // --- Leader lines: origin (optionally snapped to a placed label) -> one or two targets.
    // With two targets the line forks: origin -> junction -> target1, junction -> target2.
    // The junction is auto-computed (computeLeaderGeometry), never dragged directly.
    // Sandbox is authoring/preview only: copy the result and paste it into leader-lines-geo's
    // `data` in style-light.json — this tool never writes the style files itself.
    function computeLeaderGeometry(origin, targets, forkRatio = 0.5) {
      if (targets.length === 1) return { type: 'LineString', coordinates: [origin, targets[0]] };
      const mid = [(targets[0][0] + targets[1][0]) / 2, (targets[0][1] + targets[1][1]) / 2];
      const junction = [
        origin[0] + (mid[0] - origin[0]) * forkRatio,
        origin[1] + (mid[1] - origin[1]) * forkRatio
      ];
      return { type: 'MultiLineString', coordinates: [[origin, junction], [junction, targets[0]], [junction, targets[1]]] };
    }
    const fmtCoord = ([lng, lat]) => `${lng.toFixed(2)},${lat.toFixed(2)}`;
    const leaderLines = { type: 'FeatureCollection', features: [] };
    const llRecords = [];      // { id, originRef, origin:[lng,lat], targets:[[lng,lat],...], forkRatio, minzoom, maxzoom }
    const llHandles = { type: 'FeatureCollection', features: [] };
    let leaderSeq = 0;
    let forkRatio = 0.5;
    let llMinZoom = 0;
    let llMaxZoom = 24;
    let forkArmed = false;     // decided before placement starts: 2-click (single target) vs 3-click (fork)
    let pendingLL = null;      // { stage: 'origin'|'target1'|'target2', fork, origin, originRef, targets }
    let llDragId = null;       // { recordId, role: 'origin'|'target1'|'target2' } of the handle being dragged

    // Only offer the tool when the current style actually has the leader-lines layer
    function leaderLinesReady() { return !!map.getSource('leader-lines-geo'); }

    const SNAP_LAYERS = ['sandbox-labels', 'cities-labels', 'countries-labels', 'water-label'];
    // Snap the origin to a nearby placed label so dragging that label moves the line;
    // otherwise fall back to the raw click position with no link.
    function snapOrigin(e) {
      const layers = SNAP_LAYERS.filter(id => map.getLayer(id));
      const r = 8;
      const hits = layers.length
        ? map.queryRenderedFeatures([[e.point.x - r, e.point.y - r], [e.point.x + r, e.point.y + r]], { layers })
        : [];
      if (!hits.length) return { coords: [e.lngLat.lng, e.lngLat.lat], ref: null };
      const f = hits[0];
      const coords = f.geometry.type === 'Point' ? f.geometry.coordinates.slice() : [e.lngLat.lng, e.lngLat.lat];
      const key = f.layer.id === 'sandbox-labels' ? f.properties._id : (f.properties.name ?? f.properties.NAME_EN);
      return { coords, ref: key != null ? `${f.layer.id}:${key}` : null };
    }

    // Small draggable circle per origin/target endpoint (skipped for a label-linked origin —
    // drag the label itself instead, which stays in sync via the mousemove handler below).
    // "_pending" markers (bigger, red) give immediate feedback for clicks made mid-placement,
    // before the line is finalized and gets its permanent blue/yellow handles.
    function ensureLeaderLineHandleLayer() {
      if (!leaderLinesReady() || map.getSource('leader-line-handles')) return;
      map.addSource('leader-line-handles', { type: 'geojson', data: llHandles });
      map.addLayer({
        id: 'leader-line-handles', type: 'circle', source: 'leader-line-handles',
        paint: {
          'circle-radius': ['case', ['==', ['get', '_lineId'], '_pending'], 7, 5],
          'circle-color': ['match', ['get', '_role'],
            'origin', '#7fd3ff',
            'pending-origin', '#ff3b3b',
            'pending-target1', '#ff3b3b',
            '#ffd166'],
          'circle-stroke-color': '#fff',
          'circle-stroke-width': 2
        }
      });
      // Coordinates for the origin (the point that attaches to the label) shown right next to it
      map.addLayer({
        id: 'leader-line-handle-labels', type: 'symbol', source: 'leader-line-handles',
        filter: ['in', ['get', '_role'], ['literal', ['origin', 'pending-origin']]],
        layout: {
          'text-field': ['get', '_label'],
          'text-font': ['Noto Sans Medium'],
          'text-size': 10,
          'text-anchor': 'left',
          'text-offset': [0.9, 0],
          'text-allow-overlap': true
        },
        paint: {
          'text-color': '#fff',
          'text-halo-color': '#000',
          'text-halo-width': 1.5
        }
      });
    }

    // Handle points for every already-placed (finalized) leader line. Origin always gets a
    // point (for its coordinate label), even when label-linked and so not itself draggable.
    function recordHandles() {
      return llRecords.flatMap(r => {
        const pts = [{ role: 'origin', coords: r.origin, draggable: !r.originRef }];
        r.targets.forEach((t, i) => pts.push({ role: `target${i + 1}`, coords: t, draggable: true }));
        return pts.map(p => ({
          type: 'Feature',
          geometry: { type: 'Point', coordinates: p.coords },
          properties: {
            _lineId: r.id, _role: p.role, _draggable: p.draggable,
            _label: p.role === 'origin' ? fmtCoord(p.coords) : ''
          }
        }));
      });
    }

    // Rebuild rendered geometry + handles from llRecords — the single source of truth for
    // both what's drawn and what gets exported.
    function refreshLeaderLines() {
      leaderLines.features = llRecords.map(r => ({
        type: 'Feature',
        geometry: computeLeaderGeometry(r.origin, r.targets, r.forkRatio),
        properties: {
          // minzoom/maxzoom (no underscore) are read directly by the leader-lines layer's
          // filter in the style JSON — same convention as water-labels-geo/cities-geo/etc.
          minzoom: r.minzoom, maxzoom: r.maxzoom,
          _id: r.id, _originRef: r.originRef, _origin: r.origin, _targets: r.targets,
          ...(r.targets.length > 1 ? { _forkRatio: r.forkRatio } : {})
        }
      }));
      if (leaderLinesReady()) map.getSource('leader-lines-geo').setData(leaderLines);

      llHandles.features = recordHandles();
      if (map.getSource('leader-line-handles')) map.getSource('leader-line-handles').setData(llHandles);
    }

    // Marks each click already made in the CURRENT in-progress placement, so there's visible
    // proof a click registered before the line is finalized — this is the feedback that was
    // missing (only the small bottom readout text changed, easy to miss).
    function updatePendingHandles(p) {
      if (!map.getSource('leader-line-handles')) return;
      const pending = [];
      if (p.origin) pending.push({ role: 'pending-origin', coords: p.origin });
      if (p.targets?.[0]) pending.push({ role: 'pending-target1', coords: p.targets[0] });
      llHandles.features = [
        ...recordHandles(),
        ...pending.map(pt => ({
          type: 'Feature',
          geometry: { type: 'Point', coordinates: pt.coords },
          properties: {
            _lineId: '_pending', _role: pt.role, _draggable: false,
            _label: pt.role === 'pending-origin' ? fmtCoord(pt.coords) : ''
          }
        }))
      ];
      map.getSource('leader-line-handles').setData(llHandles);
    }

    function finalizeLeaderLine(p) {
      llRecords.push({
        id: ++leaderSeq, originRef: p.originRef, origin: p.origin, targets: p.targets,
        forkRatio, minzoom: llMinZoom, maxzoom: llMaxZoom
      });
      refreshLeaderLines();
      readout.textContent = `leader line placed (${llRecords.length} total) — drag handles to adjust`;
    }

    function armLeaderLine(btn) {
      if (!leaderLinesReady()) return;
      ensureLeaderLineHandleLayer();
      if (pendingLL) { pendingLL = null; refreshLeaderLines(); map.getCanvas().style.cursor = ''; clearArmedButtons(); readout.textContent = ''; return; }
      pendingDrop = null;
      pendingLabel = null;
      clearArmedButtons();
      pendingLL = { stage: 'origin', fork: forkArmed };
      map.getCanvas().style.cursor = 'crosshair';
      if (btn) btn.classList.add('armed');
      readout.textContent = 'leader line: click the origin (near a placed label to snap to it) — Esc to stop';
    }

    // Only meaningful before/at the start of a placement — decides 2-click vs 3-click for it
    function toggleForkArmed(btn) {
      forkArmed = !forkArmed;
      btn.classList.toggle('armed', forkArmed);
    }

    // Hides the drag handles + coordinate text (not the leader lines themselves) for a clean screenshot
    function toggleLeaderLineHelpers(btn) {
      const hide = !btn.classList.contains('armed');
      ['leader-line-handles', 'leader-line-handle-labels'].forEach(id => {
        if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', hide ? 'none' : 'visible');
      });
      btn.classList.toggle('armed', hide);
      btn.textContent = hide ? 'show helpers' : 'hide helpers';
    }

    // Images section: drop zone (drag events bubble to the panel, which survives buildPanel()).
    panel.addEventListener('dragover', (e) => {
