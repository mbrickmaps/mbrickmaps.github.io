            `<label title="Hide the drag handles + coordinate text so a screenshot is clean"><button type="button" class="ll-toggle-helpers${helpersOn ? '' : ' armed'}">${helpersOn ? 'hide helpers' : 'show helpers'}</button></label>` +
            `<label>min zoom <input type="number" class="llminzoom-in" min="0" max="24" step="0.5" value="${llMinZoom}"></label>` +
            `<label>max zoom <input type="number" class="llmaxzoom-in" min="0" max="24" step="0.5" value="${llMaxZoom}"></label>` +
            settings;
        }
      } else if (l.type === 'fill') {
        const ovId = `${l.id}__patternoverlay`;
        const hasOv = !!map.getLayer(ovId);
        const pat = hasOv ? map.getPaintProperty(ovId, 'fill-pattern') : undefined;
        const patOp = hasOv ? map.getPaintProperty(ovId, 'fill-opacity') : null;
        const bgId = `${l.id}__patternbg`;
        const bgOn = !!map.getLayer(bgId);
        const bgVal = bgOn ? map.getPaintProperty(bgId, 'fill-color') : null;
        const bgHex = typeof bgVal === 'string' ? toHex(bgVal) : '#000000';
        const bgOp = bgOn ? map.getPaintProperty(bgId, 'fill-opacity') : null;
        settings =
          `<label>pattern <select class="fill-pattern" data-layer="${l.id}">` +
          `<option value="">none</option>` +
          PATTERNS.map(p => `<option value="${p}"${p === pat ? ' selected' : ''}>${p}</option>`).join('') +
          `</select></label>` +
          `<label>opacity <input type="number" class="num-in pattern-op" data-layer="${l.id}" placeholder="1" value="${typeof patOp === 'number' ? patOp : ''}" min="0" max="1" step="0.1" title="pattern opacity"></label>` +
          `<label>bg <input type="checkbox" class="patternbg-on" data-layer="${l.id}"${bgOn ? ' checked' : ''}>` +
          `<input type="color" class="swatch patternbg-color" data-layer="${l.id}" value="${bgHex}">` +
          `<input type="number" class="num-in patternbg-op" data-layer="${l.id}" placeholder="1" value="${typeof bgOp === 'number' ? bgOp : ''}" min="0" max="1" step="0.1" title="background opacity"></label>`;
      } else if (l.type === 'circle') {
        const r = l.paint?.['circle-radius'];
        const sc = l.paint?.['circle-stroke-color'];
        const sw = l.paint?.['circle-stroke-width'];
        settings =
          `<label>radius <input type="number" class="num-in" data-layer="${l.id}" data-prop="circle-radius" placeholder="expr" value="${typeof r === 'number' ? r : ''}" min="0" step="0.5"></label>` +
          `<label>stroke <input type="color" class="swatch" data-layer="${l.id}" data-prop="circle-stroke-color" value="${typeof sc === 'string' ? toHex(sc) : '#ffffff'}"></label>` +
          `<label>stroke width <input type="number" class="num-in" data-layer="${l.id}" data-prop="circle-stroke-width" placeholder="0" value="${typeof sw === 'number' ? sw : ''}" min="0" step="0.5"></label>`;
      } else if (l.type === 'symbol') {
        const ts = l.layout?.['text-size'];
        const hc = l.paint?.['text-halo-color'];
        const hw = l.paint?.['text-halo-width'];
        settings =
          `<label>preset <select class="label-preset" data-layer="${l.id}"><option value="">—</option>` +
          labelPresets.map(p => `<option value="${esc(p.id)}"${labelBinding[l.id] === p.id ? ' selected' : ''}>${esc(p.name)}</option>`).join('') +
          `</select></label>` +
          `<label>size <input type="number" class="num-in" data-layer="${l.id}" data-prop="text-size" data-kind="layout" placeholder="expr" value="${typeof ts === 'number' ? ts : ''}" min="0" step="1"></label>` +
          `<label>halo <input type="color" class="swatch" data-layer="${l.id}" data-prop="text-halo-color" value="${typeof hc === 'string' ? toHex(hc) : '#000000'}"></label>` +
          `<label>halo width <input type="number" class="num-in" data-layer="${l.id}" data-prop="text-halo-width" placeholder="0" value="${typeof hw === 'number' ? hw : ''}" min="0" step="0.25"></label>`;
      }
      const hidden = collapsed.has(groupOf(l)) ? ' hidden' : '';
      const visible = (l.layout?.visibility ?? 'visible') !== 'none';
      return `<div class="layer${hidden}" data-group="${groupOf(l)}">` +
        `<div class="lname">` +
        `<input type="checkbox" class="vis-cb" data-layer="${l.id}"${visible ? ' checked' : ''}>` +
        `<span class="id">${l.id}</span>` +
        `<span class="type${settings ? ' type-btn' : ''}">${l.type}</span>` +
        `<span class="copy-btn" data-layer="${l.id}" title="${l.id === 'leader-lines' ? 'copy placed leader lines as GeoJSON' : 'copy layer style JSON'}">⧉</span></div>` +
        `<div class="lctrl">` +
        `<input type="number" class="zoom-in" data-layer="${l.id}" data-bound="min" placeholder="0" value="${l.minzoom ?? ''}" min="0" max="24" step="0.5">` +
        `<input type="number" class="zoom-in" data-layer="${l.id}" data-bound="max" placeholder="24" value="${l.maxzoom ?? ''}" min="0" max="24" step="0.5">` +
        `${paint}${l.type === 'circle' ? `<button class="drop-btn" data-layer="${l.id}" title="Add a circle object — then click the map to place it">+</button>`
          : l.type === 'symbol' ? `<button class="drop-btn" data-kind="label" data-layer="${l.id}" title="Add a label object — then click the map to place it">+</button>`
          : l.id === 'leader-lines' ? `<button class="drop-btn" data-kind="leaderline" title="Add a leader line — click the origin, then target(s), on the map">+</button>` : ''}</div>` +
        (settings ? `<div class="settings">${settings}</div>` : '') +
        `</div>`;
    }

    // Detect every layer brought in from the style.json and list them by group
    const panel = document.getElementById('panel');
    // Which tab the panel is showing. 'edit' authors project features, 'layer' inspects the
    // style file's own layers, 'project' shows the resulting file. Three separate jobs that used
    // to share one scroll, with the authoring tools wedged into the layer inspector's header.
    let activeTab = 'edit';
    const PANEL_TABS = { edit: 'Edit', layer: 'Layer', project: 'Project' };

    function buildPanel() {
      const tabs = `<div class="ptabs">` +
        Object.entries(PANEL_TABS).map(([id, label]) =>
          `<button class="ptab${activeTab === id ? ' active' : ''}" data-tab="${id}">${label}</button>`).join('') +
        `</div>`;
      let head = tabs +
        `<button class="io-btn" data-act="openmapa" style="width:100%;margin-bottom:8px" title="Open the current map view in Mapa (static vector export)">Open in Mapa ↗</button>`;
      let body = '', foot = '';

      if (activeTab === 'layer') {
        // Style order is bottom->top; reverse so the topmost layer sits at the top of the list.
        // Hide the synthetic pattern-background helper layers.
        const layers = map.getStyle().layers.slice().reverse().filter(l => !isPatternHelper(l.id) && groupOf(l) !== 'interactions');
        const _su = styleUrl(style);  // a string URL, or a wrapped-pmtiles style object
        head += `<div class="style-name">${esc(typeof _su === 'string' ? _su.split('/').pop() : style.split('/').pop())}</div>` +
          `<h3>Layers (${layers.length})</h3>` +
          `<input type="text" class="layer-search-in" placeholder="filter layers…" value="${esc(layerFilter)}">` +
          `<div class="colhead"><span class="ch">min</span><span class="ch">max</span>` +
          `<span class="ch-rest">color · opacity</span></div>`;
        for (const group of GROUPS) {
          const inGroup = layers.filter(l => groupOf(l) === group);
          if (!inGroup.length) continue;
          const isCol = collapsed.has(group);
          body += `<div class="group${isCol ? ' collapsed' : ''}" data-group="${group}">` +
            `<span class="caret">${isCol ? '▸' : '▾'}</span>${group} (${inGroup.length})</div>` +
            inGroup.map(layerRow).join('');
        }
        // Export/Import belong here, not to the panel as a whole — they carry this style's layer
        // settings, which is only ambiguous while project tools share the same footer.
        foot = `<div class="toolbar">` +
          `<button class="io-btn" data-act="export">Export</button>` +
          `<button class="io-btn" data-act="import">Import</button>` +
          `<button class="io-btn${inspectMode ? ' armed' : ''}" data-act="inspect">${inspectMode ? 'Inspect: ON' : 'Inspect'}</button>` +
          `<input type="file" class="import-file" accept="application/json,.json" hidden></div>`;
      } else if (activeTab === 'edit') {
        body = editSectionHtml();
      } else {
        body = `<pre class="project-json">${esc(JSON.stringify(projectDoc, null, 2))}</pre>`;
        foot = `<div class="toolbar"><button class="project-copy-btn">Copy</button></div>`;
      }

      panel.innerHTML = `<div class="phead">${head}</div><div class="pbody">${body}</div><div class="pfoot">${foot}</div>`;
      if (activeTab === 'layer') applyLayerFilter();
      // Rebuilding the panel wipes any "armed" class — reapply it if sketch mode is still active
      // (points placement stays armed across clicks, so this fires after every point added).
      if (pendingSketch) panel.querySelector(`.sketch-btn[data-kind="${pendingSketch.kind}"][data-tool="${pendingSketch.tool}"]`)?.classList.add('armed');
    }
    // --- Label presets: named (font, size) sets referenced from each symbol layer's dropdown ---
    // Presets persist per browser; bindings (layer -> preset) persist per style. Presets are the
    // reference: editing one live-updates every layer bound to it, and re-applies on reload.
    const labels = document.getElementById('labels');
    const PRESETS_KEY = 'sandbox:label-presets';
    const BINDINGS_KEY = `sandbox:label-bindings:${style}`;
    let labelPresets = [];
    let labelBinding = {};
    const PREVIEW_KEY = 'sandbox:preview';

    // Font stacks on the glyph server in the style JSON (protomaps basemaps-assets)
    const ATLAS_FONTS = ['Noto Sans Regular', 'Noto Sans Italic', 'Noto Sans Medium'];

    // Standard MapLibre text-anchor values — where the label sits relative to its point
    const ANCHOR_OPTIONS = [
      'center', 'left', 'right', 'top', 'bottom',
      'top-left', 'top-right', 'bottom-left', 'bottom-right'
    ];

    // Font stacks actually used in the style — the only ones the glyph server is sure to have
    function styleFonts() {
      const set = new Set();
      for (const l of map.getStyle().layers) {
        const tf = l.layout?.['text-font'];
        if (Array.isArray(tf) && typeof tf[0] === 'string') set.add(tf[0]);
      }
      return [...set].sort();
    }

    function loadLabels() {
      try { labelPresets = JSON.parse(localStorage.getItem(PRESETS_KEY) || 'null') || []; }
      catch { labelPresets = []; }
      try { labelBinding = JSON.parse(localStorage.getItem(BINDINGS_KEY) || 'null') || {}; }
      catch { labelBinding = {}; }
      // Seed from the fonts already in the style so the panel isn't empty on first run
      if (!labelPresets.length) {
        labelPresets = styleFonts().map((f, i) => ({
          id: `p${i}${Date.now().toString(36)}`, name: f.replace(/_/g, ' '), font: f, size: 11
        }));
      }
    }
    const savePresets = () => localStorage.setItem(PRESETS_KEY, JSON.stringify(labelPresets));
    const saveBindings = () => localStorage.setItem(BINDINGS_KEY, JSON.stringify(labelBinding));

    // Apply a layer's bound preset (font stack + size) to the map
    function applyBinding(layerId) {
      const p = labelPresets.find(x => x.id === labelBinding[layerId]);
      if (!p || !map.getLayer(layerId)) return;
      if (p.font) map.setLayoutProperty(layerId, 'text-font', [p.font]);
      if (p.size !== '' && p.size != null) map.setLayoutProperty(layerId, 'text-size', +p.size);
      if (p.color) map.setPaintProperty(layerId, 'text-color', p.color);
      if (p.haloColor) map.setPaintProperty(layerId, 'text-halo-color', p.haloColor);
      if (p.haloWidth !== '' && p.haloWidth != null) map.setPaintProperty(layerId, 'text-halo-width', +p.haloWidth);
    }
    const applyAllBindings = () => Object.keys(labelBinding).forEach(applyBinding);
    const applyToBound = (pid) => {
      for (const [lid, bound] of Object.entries(labelBinding)) if (bound === pid) applyBinding(lid);
    };

    // Render only the presets list (.lbody) so the preview mini-map above it survives re-renders
    function renderLabels() {
      const body = labels.querySelector('.lbody');
      if (!body) return;
      const datalist = `<datalist id="font-options">` +
        ATLAS_FONTS.map(f => `<option value="${esc(f)}">`).join('') + `</datalist>`;
      const rows = labelPresets.map(p =>
        `<div class="preset" data-id="${esc(p.id)}">` +
        `<div class="prow1">` +
        `<input class="pname" data-id="${esc(p.id)}" value="${esc(p.name)}" placeholder="preset name">` +
        `<button class="place-preset" data-id="${esc(p.id)}" title="place a label with this preset on the map">+</button>` +
        `<span class="del" data-id="${esc(p.id)}" title="delete preset">×</span></div>` +
        `<div class="fields">` +
        `<input class="pfont" data-id="${esc(p.id)}" list="font-options" value="${esc(p.font)}" placeholder="font stack">` +
        `<input type="number" class="psize" data-id="${esc(p.id)}" value="${p.size ?? ''}" min="1" step="0.5" placeholder="size"></div>` +
        `<div class="fields">` +
        `<label class="plab">fill <input type="color" class="pcolor" data-id="${esc(p.id)}" value="${toHex(p.color || '#000000')}"></label>` +
        `<label class="plab">stroke <input type="color" class="pstroke" data-id="${esc(p.id)}" value="${toHex(p.haloColor || '#ffffff')}"></label>` +
        `<input type="number" class="pstrokew" data-id="${esc(p.id)}" value="${p.haloWidth ?? ''}" min="0" step="0.25" placeholder="0" title="stroke width"></div>` +
        `</div>`).join('');
      const prevPreset = labels.querySelector('.pv-preset')?.value;
      body.innerHTML = datalist + rows +
        `<button class="add-preset">+ add preset</button>` +
        `<div class="pv-addrow">` +
        `<select class="pv-preset"><option value="">preset…</option>` +
        labelPresets.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('') +
        `</select><button class="pv-add">add to map</button></div>` +
        `<div class="hint">Type text in the preview, pick a preset, then Add to map and click the map.</div>`;
      const sel = labels.querySelector('.pv-preset');
      if (sel && prevPreset) sel.value = prevPreset;   // keep the selection across re-renders
    }

    // Edit preset font/size live (no re-render -> keeps input focus); name change handled on 'change'
    labels.addEventListener('input', (e) => {
      const t = e.target;
      if (t.className && t.className.startsWith('pv-')) { applyPreview(); updateContrast(); savePreview(); return; }
      const p = labelPresets.find(x => x.id === t.dataset.id);
      if (!p) return;
      if (t.classList.contains('pfont')) p.font = t.value;
      else if (t.classList.contains('psize')) p.size = t.value === '' ? '' : +t.value;
      else if (t.classList.contains('pcolor')) p.color = t.value;
      else if (t.classList.contains('pstroke')) p.haloColor = t.value;
      else if (t.classList.contains('pstrokew')) p.haloWidth = t.value === '' ? '' : +t.value;
      else if (t.classList.contains('pname')) { p.name = t.value; savePresets(); return; }
      else return;
      savePresets();
      applyToBound(p.id);
    });
    // Renaming: refresh the layer dropdowns so their option labels match
    labels.addEventListener('change', (e) => {
      if (e.target.classList.contains('pv-preset')) { loadPresetIntoPreview(e.target.value); return; }
      if (e.target.className && e.target.className.startsWith('pv-')) { applyPreview(); updateContrast(); savePreview(); return; }
      if (e.target.classList.contains('pname')) { renderLabels(); buildPanel(); }   // refresh both dropdowns
    });
    labels.addEventListener('click', (e) => {
      const toggle = e.target.closest('.lhead-toggle');
      if (toggle) {
        // Flip `hidden` on the existing elements — NOT buildLabelsShell(), which rewrites
        // labels.innerHTML and replaces #preview-map with an empty div while the live previewMap
        // stays bound to the old detached one. Re-expanding would then show nothing, forever.
        labelPreviewCollapsed = !labelPreviewCollapsed;
        toggle.querySelector('.caret').textContent = labelPreviewCollapsed ? '▸' : '▾';
        labels.classList.toggle('collapsed', labelPreviewCollapsed);
        document.getElementById('preview').hidden = labelPreviewCollapsed;
        document.getElementById('label-presets-wrap').hidden = labelPreviewCollapsed;
        // Its canvas measured 0x0 while hidden; let layout settle before it re-measures.
        if (!labelPreviewCollapsed) requestAnimationFrame(() => previewMap?.resize());
        return;
      }
      // "Add to map" from the preview: arm placement, then the next map click drops the label
      if (e.target.classList.contains('pv-add')) { armFromPreview(); return; }
      // Place a label object styled by this preset
      const place = e.target.closest('.place-preset');
      if (place) { armLabelFromPreset(place.dataset.id, place); return; }
      if (e.target.classList.contains('add-preset')) {
        labelPresets.push({ id: `p${Date.now().toString(36)}`, name: 'New preset', font: styleFonts()[0] || '', size: 11 });
        savePresets(); renderLabels(); buildPanel();
        return;
      }
      const del = e.target.closest('.del');
      if (del) {
        labelPresets = labelPresets.filter(p => p.id !== del.dataset.id);
        for (const [lid, pid] of Object.entries(labelBinding)) if (pid === del.dataset.id) delete labelBinding[lid];
        savePresets(); saveBindings(); renderLabels(); buildPanel();
      }
    });

    // --- Preview: a mini MapLibre map that renders the real atlas glyphs (SDF), not CSS text ---
    let previewMap = null, previewReady = false;
    const pvq = s => labels.querySelector(s);
    // Horizontal position (left %) of a contrast ratio on a log 1..21 scale
    const pvFrac = r => `${Math.max(0, Math.min(1, Math.log(r) / Math.log(21))) * 100}%`;

    // Load a preset's font/size/fill into the preview so it shows what "add to map" will place
    function loadPresetIntoPreview(pid) {
      const p = labelPresets.find(x => x.id === pid);
      if (!p) return;
      const f = pvq('.pv-font'); if (f && p.font) f.value = p.font;
      const s = pvq('.pv-size'); if (s && p.size != null && p.size !== '') s.value = p.size;
      const c = pvq('.pv-color'); if (c && p.color) c.value = toHex(p.color);
      applyPreview(); updateContrast(); savePreview();
    }

    // "Add to map": place the selected preset's full style (fill + stroke); if none picked, use
    // the preview's own font/size/color. Then the next map click drops the label.
    function armFromPreview() {
      ensureLabelLayer();
      pendingDrop = null;
      clearArmedButtons();
      const text = pvq('.pv-text')?.value || 'Label';
      const p = labelPresets.find(x => x.id === pvq('.pv-preset')?.value);
      const style = p ? presetStyle(p) : {
        font: [pvq('.pv-font')?.value || 'Noto Sans Medium'],
        size: +pvq('.pv-size')?.value || 12,
        color: pvq('.pv-color')?.value || '#000000',
        hc: pvq('.pv-stroke')?.value || '#000000', hw: +pvq('.pv-strokew')?.value || 0
      };
      const anchor = pvq('.pv-anchor')?.value || 'center';
      pendingLabel = { src: 'preview', text, font: style.font, size: style.size, color: style.color, hc: style.hc, hw: style.hw, anchor };
      map.getCanvas().style.cursor = 'crosshair';
      pvq('.pv-add')?.classList.add('armed');
      readout.textContent = `click the map to place "${text}" — Esc to stop`;
    }

    // Static shell: preview block + presets header + empty .lbody (rebuilt content lives in .lbody)
    function buildLabelsShell() {
      const saved = (() => { try { return JSON.parse(localStorage.getItem(PREVIEW_KEY) || 'null') || {}; } catch { return {}; } })();
      const val = (k, d) => saved[k] != null ? saved[k] : d;
      const fontOpts = ATLAS_FONTS.map(f =>
        `<option value="${esc(f)}"${f === val('font', 'Noto Sans Medium') ? ' selected' : ''}>${esc(f.replace(/_/g, ' '))}</option>`).join('');
      labels.classList.toggle('collapsed', labelPreviewCollapsed);
      labels.innerHTML =
        `<div class="lhead lhead-toggle"><span class="caret">${labelPreviewCollapsed ? '▸' : '▾'}</span><h3>Label preview</h3></div>` +
        `<div id="preview"${labelPreviewCollapsed ? ' hidden' : ''}>` +
        `<div id="preview-map"></div>` +
        `<input class="pv-text" value="${esc(val('text', 'Aa Bb Cc 123'))}" placeholder="sample text">` +
        `<div class="pv-row">` +
        `<select class="pv-font">${fontOpts}</select>` +
        `<input type="number" class="pv-size" value="${esc(val('size', 24))}" min="4" step="1" title="size">` +
        `</div>` +
        `<div class="pv-row">` +
        `<label class="pv-lab">anchor <select class="pv-anchor" title="Where the label attaches relative to its point">` +
        ANCHOR_OPTIONS.map(a => `<option value="${a}"${a === val('anchor', 'center') ? ' selected' : ''}>${a}</option>`).join('') +
        `</select></label>` +
        `</div>` +
        `<div class="pv-row">` +
        `<label class="pv-lab">text <input type="color" class="pv-color" value="${esc(val('color', '#ffffff'))}"></label>` +
        `<label class="pv-lab">bg <input type="color" class="pv-bg" value="${esc(val('bg', '#1e1e1e'))}"></label>` +
        `<label class="pv-lab">stroke <input type="color" class="pv-stroke" value="${esc(val('stroke', '#000000'))}"></label>` +
        `<input type="number" class="pv-strokew" value="${esc(val('strokew', 0))}" min="0" step="0.25" title="stroke width">` +
        `<select class="pv-mode" title="which WCAG rule to check against">` +
        `<option value="text"${val('mode', 'text') === 'text' ? ' selected' : ''}>Text</option>` +
        `<option value="graphic"${val('mode', 'text') === 'graphic' ? ' selected' : ''}>Graphic</option>` +
        `</select>` +
        `</div></div>` +
        `<div id="label-presets-wrap"${labelPreviewCollapsed ? ' hidden' : ''}>` +
        `<div class="lhead" style="padding-top:0"><h3>Label presets</h3></div>` +
        `<div class="lbody"></div>` +
        `</div>`;
    }

    function initPreview() {
      previewMap = new maplibregl.Map({
        container: 'preview-map',
        style: {
          version: 8,
          glyphs: 'https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf',
          sources: { pt: { type: 'geojson', data: { type: 'Feature', geometry: { type: 'Point', coordinates: [0, 0] }, properties: {} } } },
          layers: [
            { id: 'bg', type: 'background', paint: { 'background-color': pvq('.pv-bg').value } },
            {
              id: 'txt', type: 'symbol', source: 'pt',
              layout: { 'text-field': pvq('.pv-text').value || ' ', 'text-font': [pvq('.pv-font').value], 'text-size': +pvq('.pv-size').value || 24, 'text-allow-overlap': true },
              paint: {
                'text-color': pvq('.pv-color').value,
                'text-halo-color': pvq('.pv-stroke').value,
                'text-halo-width': +pvq('.pv-strokew').value || 0
              }
            }
          ]
        },
        center: [0, 0], zoom: 0, interactive: false, attributionControl: false
      });
      previewMap.on('load', () => { previewReady = true; applyPreview(); });
      // Contrast badge overlaid on the preview's lower-right
      const badge = document.createElement('div');
      badge.id = 'pv-contrast';
      document.getElementById('preview-map').appendChild(badge);
      // Horizontal AA/AAA scale below the controls, with a moving pointer
      const scale = document.createElement('div');
      scale.id = 'pv-scale';
      scale.innerHTML =
        `<div class="pv-bar"></div>` +
        `<div class="pv-tick" data-k="aa">AA</div>` +
        `<div class="pv-tick" data-k="aaa">AAA</div>` +
        `<div class="pv-ptr"></div>`;
      document.getElementById('preview').appendChild(scale);
      scale.querySelector('[data-k="aa"]').style.left = pvFrac(4.5);
      scale.querySelector('[data-k="aaa"]').style.left = pvFrac(7);
      // Legend defining each band's meaning and ratio range
      const legend = document.createElement('div');
      legend.id = 'pv-legend';
      legend.innerHTML =
        `<span title="Below WCAG AA — insufficient contrast for any text size"><i style="background:#ff6b6b"></i>Fail &lt;3</span>` +
        `<span title="Passes AA only for large text (≥24px, or ≥18.66px bold). Fails for normal body text. 3:1 is also the WCAG 1.4.11 minimum for non-text graphics — icons, map dots, lines, borders."><i style="background:#ffd166"></i>AA Large 3–4.5</span>` +
        `<span title="Passes WCAG AA for normal text of any size"><i style="background:#7cfc9b"></i>AA 4.5–7</span>` +
        `<span title="Passes WCAG AAA — the highest level, for normal text"><i style="background:#35d07f"></i>AAA ≥7</span>`;
      document.getElementById('preview').appendChild(legend);
      // Dynamic clarifier — filled by updateContrast based on the current size/weight
      const note = document.createElement('div');
      note.id = 'pv-note';
      document.getElementById('preview').appendChild(note);
      updateContrast();
    }

    // WCAG relative-luminance contrast ratio between text and background (both #rrggbb)
    function contrastRatio(a, b) {
      const lum = hex => {
        const ch = [0, 1, 2]
          .map(i => parseInt(hex.slice(1 + i * 2, 3 + i * 2), 16) / 255)
          .map(v => v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
        return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
      };
      const l1 = lum(a), l2 = lum(b);
      return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
    }

    // Badge + scale are a plain contrast meter with FIXED bands, so the label always matches
    // the colored band the pointer sits in. Size can't move the ratio (it's color-only), so the
    // size-dependent part — how high the bar is for THIS size — lives entirely in the note line.
    function updateContrast() {
      const badge = document.getElementById('pv-contrast');
      if (!badge) return;
      const r = contrastRatio(pvq('.pv-color').value, pvq('.pv-bg').value);
      const [label, cls] =
        r >= 7 ? ['AAA', 'pass'] :
        r >= 4.5 ? ['AA', 'pass'] :
        r >= 3 ? ['AA Large', 'warn'] :
        ['Fail', 'fail'];
      badge.textContent = `${r.toFixed(2)}:1 ${label}`;
      badge.className = cls;
      const ptr = document.querySelector('#pv-scale .pv-ptr');
      if (ptr) ptr.style.left = pvFrac(r);
      // The required ratio depends on what you're checking:
      //   Graphic -> WCAG 1.4.11 non-text, flat 3:1 (icons, dots, lines, borders)
      //   Text    -> WCAG 1.4.3, size-based: large text 3:1, normal 4.5:1
      const mode = pvq('.pv-mode')?.value || 'text';
      let need, ctx;
      if (mode === 'graphic') {
        need = 3;
        ctx = 'Graphic — WCAG 1.4.11 non-text (icons, dots, lines)';
      } else {
        const size = +pvq('.pv-size').value || 24;
        const bold = /(?:^|_)(Bold|Heavy)(?:_|$)/.test(pvq('.pv-font').value || '');
        const large = size >= 24 || (bold && size >= 18.66);
        need = large ? 3 : 4.5;
        ctx = `Text at ${size}px${bold ? ' bold' : ''} — ${large ? 'large' : 'normal'}`;
      }
      const note = document.getElementById('pv-note');
      if (note) note.textContent = `${ctx}: needs ${need}:1 — ${r.toFixed(2)}:1 ${r >= need ? 'passes' : 'is below'}.`;
    }

    function applyPreview() {
      if (!previewReady) return;
      previewMap.setLayoutProperty('txt', 'text-field', pvq('.pv-text').value || ' ');
      previewMap.setLayoutProperty('txt', 'text-font', [pvq('.pv-font').value]);
      previewMap.setLayoutProperty('txt', 'text-size', +pvq('.pv-size').value || 24);
      previewMap.setPaintProperty('txt', 'text-color', pvq('.pv-color').value);
      previewMap.setPaintProperty('txt', 'text-halo-color', pvq('.pv-stroke').value);
      previewMap.setPaintProperty('txt', 'text-halo-width', +pvq('.pv-strokew').value || 0);
      previewMap.setPaintProperty('bg', 'background-color', pvq('.pv-bg').value);
    }

    const savePreview = () => localStorage.setItem(PREVIEW_KEY, JSON.stringify({
      text: pvq('.pv-text').value, font: pvq('.pv-font').value, size: pvq('.pv-size').value,
      color: pvq('.pv-color').value, bg: pvq('.pv-bg').value, mode: pvq('.pv-mode')?.value,
      anchor: pvq('.pv-anchor')?.value, stroke: pvq('.pv-stroke')?.value, strokew: pvq('.pv-strokew')?.value
    }));

    // Build the static shell + preview map now (independent of the main map's load)
    buildLabelsShell();
    initPreview();

    // Load presets first so buildPanel can render each symbol layer's preset dropdown
    map.on('load', loadLabels);
    map.on('load', renderLabels);
    map.on('load', buildPanel);

    // Swatches: a static, read-only color reference. Collapsed by default; a "hex" toggle hides
    // the hex labels. Custom groups come from ./swatches.json (see below); the rest are pulled
    // from the loaded style, grouped by section.
    const swatches = document.getElementById('swatches');
    const SWATCH_PROPS = ['fill-color', 'line-color', 'circle-color', 'circle-stroke-color', 'text-color', 'text-halo-color'];
    const swatchChip = (color, label) =>
      `<div class="chip" title="${esc(label)}"><span class="cbox" style="background:${esc(color)}"></span>` +
      `<span class="chex">${esc(toHex(color))}</span></div>`;

    async function buildSwatches() {
      let body = '';
      // 1) Custom colors from ./swatches.json: { "Group": {"name":"#hex", ...} | ["#hex", ...] }
      let custom = null;
      try { const r = await fetch('./swatches.json', { cache: 'no-cache' }); if (r.ok) custom = await r.json(); } catch { /* none */ }
      if (custom && typeof custom === 'object') {
        for (const [name, val] of Object.entries(custom)) {
          const entries = Array.isArray(val) ? val.map(c => [c, c]) : Object.entries(val).map(([k, c]) => [c, k]);
          if (!entries.length) continue;
          body += `<div class="sgroup">${esc(name)} (${entries.length})</div><div class="srow">`;
          for (const [color, label] of entries) body += swatchChip(color, label);
          body += `</div>`;
        }
      }
      // 2) Colors used in the style, grouped by section
      const groups = {};   // group -> Map(color -> "layer · prop")
      for (const l of map.getStyle().layers) {
        if (isPatternHelper(l.id) || l.id === 'sandbox-labels' || l.id === 'sandbox-drops') continue;
        const g = groupOf(l);
        for (const prop of SWATCH_PROPS) {
          const v = l.paint?.[prop];
          if (typeof v !== 'string') continue;
          (groups[g] ??= new Map());
          if (!groups[g].has(v)) groups[g].set(v, `${l.id} · ${prop.replace('-color', '')}`);
        }
      }
      for (const g of GROUPS) {
        const m = groups[g];
        if (!m || !m.size) continue;
        body += `<div class="sgroup">${g} (${m.size})</div><div class="srow">`;
        for (const [color, label] of m) body += swatchChip(color, label);
        body += `</div>`;
      }
      if (!body) { swatches.innerHTML = ''; return; }
      const open = localStorage.getItem('sandbox:swatches-open') === '1';
      const showHex = localStorage.getItem('sandbox:swatches-hex') !== '0';
      swatches.className = `${open ? '' : 'collapsed'}${showHex ? '' : ' nohex'}`.trim();
      swatches.innerHTML =
        `<div class="shead"><span class="scaret">${open ? '▾' : '▸'}</span><h3>Swatches</h3>` +
        `<button class="shex" title="show/hide hex codes">hex</button></div>` +
        `<div class="sbody">${body}</div>`;
    }
    map.on('load', buildSwatches);

    swatches.addEventListener('click', (e) => {
      if (e.target.closest('.shex')) {   // toggle hex labels
        const nohex = swatches.classList.toggle('nohex');
        localStorage.setItem('sandbox:swatches-hex', nohex ? '0' : '1');
        return;
      }
      if (e.target.closest('.shead')) {  // collapse / expand
        const collapsed = swatches.classList.toggle('collapsed');
        localStorage.setItem('sandbox:swatches-open', collapsed ? '0' : '1');
        const caret = swatches.querySelector('.scaret');
        if (caret) caret.textContent = collapsed ? '▸' : '▾';
      }
    });

    // Presets are the reference — applied once the style's layers exist.
    map.on('load', applyAllBindings);

    // --- Export / import of the editable per-layer settings ---
    const PAINT_KEYS = ['fill-color', 'fill-opacity', 'fill-pattern',
      'line-color', 'line-opacity', 'line-width', 'line-dasharray',
      'circle-color', 'circle-opacity', 'circle-radius', 'circle-stroke-color', 'circle-stroke-width',
      'text-color', 'text-opacity', 'text-halo-color', 'text-halo-width', 'icon-color'];

    function exportSettings() {
      const out = {};
      for (const l of map.getStyle().layers) {
        if (isPatternHelper(l.id)) continue;   // synthetic layers, not part of the style — their
        const e = {};                          // state is captured below, folded into the base layer
        if (l.layout?.visibility) e.visibility = l.layout.visibility;
        if (l.layout?.['line-cap']) e['line-cap'] = l.layout['line-cap'];
        if (l.layout?.['text-size'] !== undefined) e['text-size'] = l.layout['text-size'];
        if (l.layout?.['text-font']) e['text-font'] = l.layout['text-font'];
        if (l.minzoom != null) e.minzoom = l.minzoom;
        if (l.maxzoom != null) e.maxzoom = l.maxzoom;
        const p = {};
        for (const k of PAINT_KEYS) if (l.paint?.[k] !== undefined) p[k] = l.paint[k];
        if (Object.keys(p).length) e.paint = p;
        // Fill pattern overlay/background live on separate synthetic layers (not a paint
        // property of this one), so they need their own capture or Export silently drops them
        const ovId = PATTERN_OVERLAY(l.id);
        if (map.getLayer(ovId)) {
          e.pattern = { name: map.getPaintProperty(ovId, 'fill-pattern'), opacity: map.getPaintProperty(ovId, 'fill-opacity') };
        }
        const bgId = PATTERN_BG(l.id);
        if (map.getLayer(bgId)) {
          e.patternBg = { color: map.getPaintProperty(bgId, 'fill-color'), opacity: map.getPaintProperty(bgId, 'fill-opacity') };
        }
        if (Object.keys(e).length) out[l.id] = e;
      }
      return out;
    }

    function importSettings(obj) {
      for (const [id, e] of Object.entries(obj || {})) {
        if (!map.getLayer(id)) continue;
        if (e.visibility) map.setLayoutProperty(id, 'visibility', e.visibility);
        if (e['line-cap']) map.setLayoutProperty(id, 'line-cap', e['line-cap']);
        if (e['text-size'] !== undefined) map.setLayoutProperty(id, 'text-size', e['text-size']);
        if (e['text-font']) map.setLayoutProperty(id, 'text-font', e['text-font']);
        if (e.minzoom != null || e.maxzoom != null)
          map.setLayerZoomRange(id, e.minzoom ?? 0, e.maxzoom ?? 24);
        if (e.paint) for (const [k, v] of Object.entries(e.paint)) map.setPaintProperty(id, k, v);
        if (e.pattern) setPatternOverlay(id, e.pattern.name, e.pattern.opacity);
        if (e.patternBg) setPatternBg(id, e.patternBg.color, e.patternBg.opacity);
      }
      buildPanel();
    }

    function download(name, text) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      a.download = name;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    // The inset's configured corner + size (project.inset.position/size, set later by
    // ensureInsetMap once a project with an inset loads), kept around so the export-image tool
    // below can re-anchor it to the crop box's corner instead of the full viewport's while
    // exportMode is on. Declared up here (not next to ensureInsetMap, further down) because
    // setExportMode can run at page-init time via ?export, before that code executes.
    let insetPosConfig = null;
    const INSET_MARGIN = 12;

    // While exportMode is on, re-anchors the inset to the export box's own corner (so it lands in
    // the right place inside the exported crop, matching project.inset.position); otherwise
    // restores its normal corner-of-viewport position. A no-op if there's no inset configured.
    // In ?debug the editing chrome occupies both map edges — #panel (300px, right:10) and
    // #leftcol (320px, left:10, full height) — so a corner-anchored inset would sit underneath
    // whichever column is on its side. Push it inboard past that column in debug; a plain
    // (non-debug) view is unobstructed and keeps the normal margin. Vertical offsets are
    // untouched: both columns span the full height, so moving up/down wouldn't clear them.
    // vignette: true (defaults below) or { color, opacity, stop } — darkens the sphere's rim so
    // it reads as 3D against the flat basemap. It has to be a child element layered OVER the
    // canvas: a background on #inset-map itself paints behind MapLibre's canvas, not on top of
    // it. pointer-events:none so it never intercepts clicks meant for the map.
    function applyInsetVignette() {
      const el = document.getElementById('inset-map');
      if (!el) return;
      const cfg = projectDoc.inset?.vignette;
      let ov = document.getElementById('inset-vignette');
      if (!cfg) { ov?.remove(); return; }
      const v = cfg === true ? {} : cfg;
      if (!ov) { ov = document.createElement('div'); ov.id = 'inset-vignette'; el.appendChild(ov); }
      // stop = % of the radius where darkening begins; below that the map is untouched.
      ov.style.cssText = `position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;` +
        `opacity:${v.opacity ?? 0.55};` +
        `background:radial-gradient(circle at 50% 50%, transparent ${v.stop ?? 55}%, ${v.color ?? '#000'} 100%);`;
    }

    // Everything the Inset section can change without rebuilding the map: frame geometry, border,
    // vignette, camera. Only `projection` needs a teardown, since it's a constructor-time choice.
    function applyInsetLive() {
      const cfg = projectDoc.inset;
      const el = document.getElementById('inset-map');
      if (!cfg || !el || !insetMap) return;
      const size = cfg.size ?? 160;
      const radius = cfg.radius ?? (cfg.projection === 'mercator' ? 0 : '50%');
      const border = cfg.border === false ? { width: 0 } : (cfg.border || {});
      el.style.width = el.style.height = size + 'px';
      el.style.borderRadius = typeof radius === 'number' ? radius + 'px' : radius;
      el.style.border = `${border.width ?? 1.5}px solid ${border.color ?? '#fff'}`;
      insetPosConfig = { corner: insetCorner(cfg.position), size };
      repositionInsetForExport();
      insetMap.resize();
      insetMap.jumpTo({
        center: cfg.center ?? insetMap.getCenter(),
        zoom: cfg.zoom ?? insetMap.getZoom()
      });
      insetFollow = cfg.follow === true;
      if (insetMap.isStyleLoaded()) {
        for (const l of insetMap.getStyle().layers) {
          if (groupOf(l) === 'label') insetMap.setLayoutProperty(l.id, 'visibility', cfg.labels === false ? 'none' : 'visible');
        }
      }
      applyInsetVignette();
      // Extent-color edits write to projectDoc.inset.bbox.style like everything else here, but
      // this is the one live-apply step that only means anything once the layer exists — a fresh
      // inset's 'load' handler hasn't run yet the first time applyInsetLive() fires after Add.
      if (insetMap.getLayer('inset-bbox-fill')) {
        setInsetRectStyle('inset-bbox-fill', 'inset-bbox-outline', cfg.bbox?.style);
      }
    }

    // projection is fixed when the Map is constructed, so changing it means starting over.
    function rebuildInset() {
      if (insetMap) { insetMap.remove(); insetMap = null; }
      document.getElementById('inset-map')?.remove();
      insetPosConfig = null;
      if (projectDoc.inset && projectDoc.inset.show !== false) ensureInsetMap(projectDoc.inset);
    }

    // Dotted paths so nested keys (border.color, vignette.opacity, center.1) can come straight
    // off a control's data-field without a branch per key.
    function setInsetField(path, value) {
      if (!projectDoc.inset) projectDoc.inset = {};
      const parts = path.split('.');
      let node = projectDoc.inset;
      for (const k of parts.slice(0, -1)) {
        if (node[k] == null || typeof node[k] !== 'object') node[k] = k === 'center' ? [0, 20] : {};
        node = node[k];
      }
      const last = parts[parts.length - 1];
      if (value === '' || value == null) delete node[last];
      else node[last] = value;
      if (path === 'projection' || path === 'show') rebuildInset(); else applyInsetLive();
      updateProjectJson();
    }

    function insetCorner(position) {
      const side = (w) => (debug ? 10 + w + INSET_MARGIN : INSET_MARGIN) + 'px';
      const left = side(320), right = side(300), edge = INSET_MARGIN + 'px';
      return {
        'top-left': { top: edge, left },
        'top-right': { top: edge, right },
        'bottom-left': { bottom: edge, left },
        'bottom-right': { bottom: edge, right }
      }[position] || { bottom: edge, right };
    }

    function repositionInsetForExport() {
      if (!insetPosConfig) return;
      const el = document.getElementById('inset-map');
      if (!el) return;
      el.style.top = el.style.left = el.style.right = el.style.bottom = '';
      const { corner, size } = insetPosConfig;
      if (exportMode) {
        const left = 'right' in corner ? exportBox.left + exportBox.width - size - INSET_MARGIN : exportBox.left + INSET_MARGIN;
        const top = 'bottom' in corner ? exportBox.top + exportBox.height - size - INSET_MARGIN : exportBox.top + INSET_MARGIN;
        el.style.left = left + 'px';
        el.style.top = top + 'px';
      } else {
        Object.assign(el.style, corner);
      }
    }

    // Legend/note overlays normally sit at the map's own corners (the CSS .fo-* classes). In export
    // mode, re-anchor each corner group to the crop box's matching corner so the legend lands inside
    // the clipping area (mirrors repositionInsetForExport). Off export mode: clear the inline offsets
    // so the CSS corners apply again.
    function repositionFrameOverlaysForExport() {
      const mapEl = document.getElementById('map');
      const m = exportBox.innerMargin, mw = mapEl.clientWidth, mh = mapEl.clientHeight;
      mapEl.querySelectorAll('.frame-overlay-corner').forEach((corner) => {
        corner.style.top = corner.style.left = corner.style.right = corner.style.bottom = '';
        if (!exportMode) return;
        const right = corner.classList.contains('fo-top-right') || corner.classList.contains('fo-bottom-right');
        const bottom = corner.classList.contains('fo-bottom-left') || corner.classList.contains('fo-bottom-right');
        if (right) corner.style.right = (mw - (exportBox.left + exportBox.width) + m) + 'px';
        else corner.style.left = (exportBox.left + m) + 'px';
        if (bottom) corner.style.bottom = (mh - (exportBox.top + exportBox.height) + m) + 'px';
        else corner.style.top = (exportBox.top + m) + 'px';
      });
    }

    // --- Export image: a ratio-locked crop box dragged/resized over the map, rasterized to a
    // downloadable WEBP at a chosen scale multiplier. Lives in its own #export-panel/#export-box,
    // entirely separate from the ?debug layer panel — gated by ?export instead. The box is a
    // plain DOM element (not a map layer) so dragging it never reaches the map's own click/drag
    // handlers underneath.
    let exportMode = false;
    // Export-mode toggle for the legend overlay (the crop's caption/source usually wants the legend,
    // but not always). Read by renderFrameOverlays; flipped by the export panel's "legend" checkbox.
    let showLegend = true;
    // Portrait/landscape of the same ratio isn't a separate preset — .inverted flips whichever
    // preset is selected instead, so "16:9" and "9:16" share one entry.
    const EXPORT_RATIOS = { '1:1': 1, '4:5': 4 / 5, '3:2': 3 / 2, '16:9': 16 / 9 };
    // Space left between the box and the viewport edge when a ratio is (re)applied — purely
    // cosmetic breathing room, not a hard limit while dragging/resizing by hand afterward.
    const EXPORT_MARGIN = 24;
    // ratio: '' means free — no aspect lock, width/height resize independently.
    let exportBox = { ratio: '3:2', inverted: false, scale: 2, innerMargin: 15, left: 0, top: 0, width: 0, height: 0, filename: '' };
    // Caption chrome composited into the exported image. `chrome` is 'none' | 'overlay' — it's
    // drawn onto the map itself, so the output is always exactly the crop-box size.
    let exportMeta = { title: '', subtitle: '', notes: '', chrome: 'none', logo: '' };
    // Transparent-background monograms in styles/logos. Black reads on a light basemap, white on
    // a dark one, so the default follows ?style= — copper is the deliberate choice, never automatic.
    const EXPORT_LOGOS = {
      black: 'CFR_Monogram_Black_OnTransparent.png',
      white: 'CFR_Monogram_White_OnTransparent.png',
      copper: 'CFR_Monogram_Copper_OnTransparent.png'
    };
    const exportLogoCache = new Map();   // key -> HTMLImageElement | false (failed)
    function loadExportLogo(key) {
      if (!key || !EXPORT_LOGOS[key]) return Promise.resolve(false);
      if (exportLogoCache.has(key)) return Promise.resolve(exportLogoCache.get(key));
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => { exportLogoCache.set(key, img); resolve(img); };
        img.onerror = () => {
          console.warn(`[export] logo "${key}" failed to load from ./styles/logos/${EXPORT_LOGOS[key]}`);
          exportLogoCache.set(key, false);
          resolve(false);
        };
        img.src = `./styles/logos/${EXPORT_LOGOS[key]}`;
      });
    }
    const exportBoxEl = document.getElementById('export-box');
    const exportBoxHandle = exportBoxEl.querySelector('.export-box-handle');
    const exportBoxGuideEl = exportBoxEl.querySelector('.export-box-guide');
    const exportPanelEl = document.getElementById('export-panel');

    // Purely visual — inset the guide the configured margin from every edge of the box, never
    // touches what actually gets cropped/downloaded.
    function updateExportGuide() {
      exportBoxGuideEl.style.inset = exportBox.innerMargin + 'px';
    }

    // null means "free" — no ratio lock
    function effectiveExportRatio() {
      if (!exportBox.ratio) return null;
      const v = EXPORT_RATIOS[exportBox.ratio];
      return exportBox.inverted ? 1 / v : v;
    }
    function applyExportBoxRect() {
      exportBoxEl.style.left = exportBox.left + 'px';
      exportBoxEl.style.top = exportBox.top + 'px';
      exportBoxEl.style.width = exportBox.width + 'px';
      exportBoxEl.style.height = exportBox.height + 'px';
      repositionInsetForExport();
      repositionFrameOverlaysForExport();
      updateExportDimsReadout();
      updateExportCaptionPreview();
    }
    // Live "what will actually get downloaded" readout — box size * scale multiplier. Patches the
    // one span directly rather than going through buildExportPanel()'s full innerHTML rebuild, so
    // it stays cheap to call on every drag/resize mousemove.
    // Mirrors renderExportBlob()'s layout at 1x so the box shows what you'll actually get.
    function updateExportCaptionPreview() {
      const boxEl = document.getElementById('export-box');
      const head = boxEl.querySelector('.cap-header');
      const foot = boxEl.querySelector('.cap-footer');
      const m = exportChromeMetrics();
      const k = exportBox.scale;            // metrics are in output px; the box is in CSS px
      const px = (v) => `${v / k}px`;
      const on = exportMeta.chrome !== 'none';
      for (const el of [head, foot]) {
        el.classList.toggle('on', on);
        el.style.padding = `0 ${px(m.pad)}`;
      }
      head.style.top = '0';
      head.style.paddingTop = px(m.pad);
      foot.style.bottom = '0';
      foot.style.paddingBottom = px(m.pad);
      head.innerHTML =
        (m.hasTitle ? `<div class="cap-title" style="font-size:${px(m.titleSize)}">${esc(exportMeta.title)}</div>` : '') +
        (m.hasSub ? `<div class="cap-sub" style="font-size:${px(m.subSize)}">${esc(exportMeta.subtitle)}</div>` : '');
      const logo = m.logo;

    function updateExportDimsReadout() {
      const el = exportPanelEl.querySelector('.export-dims');
      if (!el) return;
      const cm = exportChromeMetrics();
      const w = Math.round(exportBox.width * exportBox.scale);
      const h = Math.round(exportBox.height * exportBox.scale + cm.header + cm.footer);
      el.textContent = `${w} × ${h} px`;
      updateExportBboxReadout();

    // The export box's geographic bounds [W,S,E,N]: unproject its screen corners (box coords are
    // CSS px within #map, same space map.unproject expects). Null until the box has a size.
    function exportBoxBbox() {
      if (!exportBox.width || !exportBox.height) return null;
      try {
        const tl = map.unproject([exportBox.left, exportBox.top]);
        const br = map.unproject([exportBox.left + exportBox.width, exportBox.top + exportBox.height]);
        return [Math.min(tl.lng, br.lng), Math.min(tl.lat, br.lat), Math.max(tl.lng, br.lng), Math.max(tl.lat, br.lat)];
      } catch (_) { return null; }  // projection not ready yet (early init)

    function updateExportBboxReadout() {

      if (!el || el === document.activeElement) return;

    }

    function applyExportBbox(str) {
      const p = String(str).split(',').map((s) => parseFloat(s.trim()));
      if (p.length !== 4 || !p.every(Number.isFinite)) return;
      const [w, s, e, n] = p;
      const mapEl = document.getElementById('map');
      const pad = {
        left: exportBox.left,
        top: exportBox.top,
        right: Math.max(0, mapEl.clientWidth - (exportBox.left + exportBox.width)),
        bottom: Math.max(0, mapEl.clientHeight - (exportBox.top + exportBox.height))

    // Keeps the box's top-left within the map's bounds without changing its size (used while

    function clampExportPosition() {
      const mapEl = document.getElementById('map');
      exportBox.left = Math.max(0, Math.min(exportBox.left, mapEl.clientWidth - exportBox.width));
      exportBox.top = Math.max(0, Math.min(exportBox.top, mapEl.clientHeight - exportBox.height));

    function clampExportSize() {
      const mapEl = document.getElementById('map');
      const ratioValue = effectiveExportRatio();
      if (ratioValue == null) {

        exportBox.height = Math.max(40, Math.min(exportBox.height, mapEl.clientHeight - exportBox.top));

      exportBox.height = exportBox.width / ratioValue;
    }
    // The box's "home" framing for its current ratio: as large as fits the viewport (like
    // background-size:contain) with EXPORT_MARGIN of breathing room, centered — this is what
    // defines the export frame whenever the ratio (or its inversion) changes, not just the very
    // first time the tool is armed. With no ratio set, "home" is just the full viewport inset by
    // the margin on every side.
    function sizeExportBoxToDefault() {
      const mapEl = document.getElementById('map');
      const ratioValue = effectiveExportRatio();
      const vw = mapEl.clientWidth, vh = mapEl.clientHeight;

      exportBox.top = (vh - exportBox.height) / 2;

      sizeExportBoxToDefault();

    // Caps width/height against the viewport's raw dimensions (not relative to the box's current,
    // possibly off-screen, top/left) — used by invert, where the swap can otherwise put the box
    // partly off-screen before position is re-clamped.
    function clampExportDimensionsToViewport() {
      const mapEl = document.getElementById('map');
      const vw = mapEl.clientWidth, vh = mapEl.clientHeight;

        `</div>` +

        `<div class="export-row">` +
        `<label><input type="checkbox" class="export-caption-toggle"${exportMeta.chrome === 'overlay' ? ' checked' : ''}> caption</label>` +
        `<label><input type="checkbox" class="export-logo-toggle"${exportMeta.logo ? ' checked' : ''}> logo</label>` +

    // ?export means "export mode" — the crop box and its controls are just always on, no extra

    // Renders the box's on-screen rect to a WEBP blob at width/height * the chosen scale
    // multiplier. Just upscaling the already-rendered canvas via drawImage looks soft past ~2x,
    // since the source has no more real detail than the screen it was painted for — so before
    // capturing, the map's actual rendering pixel ratio is bumped (map.setPixelRatio) and given
    // one idle repaint at that higher density, then restored. The crop itself still maps 1:1
    // between the box's CSS-pixel rect (relative to #map, which the canvas fills exactly) and
    // canvas device pixels via canvas.width/canvasRect.width.
    // Cached image loader for canvas compositing (pattern + sprite PNGs).
    const _legendImgCache = new Map();
    function loadCanvasImage(url) {
      if (_legendImgCache.has(url)) return _legendImgCache.get(url);
      const p = new Promise((res) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = url; });
      _legendImgCache.set(url, p);
      return p;
    }
    // Draw a legend config onto a fresh canvas — the reliable way (HTML->canvas is not). Mirrors
    // renderLegendOverlay: group headings, rect/point/line/arrow swatches, labels + descriptions.
    async function renderLegendCanvas(cfg, scale) {
      const raw = Array.isArray(cfg.entries) ? cfg.entries : [];
      const rows = [];
      for (const e of raw) {
        if (e.group != null || (e.label != null && !e.swatch && !e.ref && !e.style && !e.symbol)) { rows.push({ group: e.group ?? e.label }); continue; }
        const resolved = e.ref ? resolveRefStyle(e.ref) : null;
        if (e.ref && !resolved) continue;
        const style = resolved ? resolved.style : (e.style || {});
        const symbol = e.symbol || (resolved && resolved.symbol) || null;
        const kind = e.swatch === 'point' ? 'point' : e.swatch === 'arrow' ? 'arrow' : (e.swatch === 'line' || e.swatch === 'path') ? 'line' : 'rect';
        rows.push({ kind, style, symbol, label: e.label || '', desc: e.description });

        titleFont = `600 ${FS}px system-ui, sans-serif`, descFont = `${FS - 1}px system-ui, sans-serif`;

      H = Math.ceil(H);
      const sprite = rows.some((r) => r.kind === 'point' && r.symbol) ? await loadCanvasImage('styles/sprite.png') : null;
      if (sprite) await loadSpriteJson();
      const patterns = new Map();
      for (const r of rows) if (r.kind === 'rect' && r.style.pattern && !patterns.has(r.style.pattern)) {
        const im = await loadCanvasImage('styles/patterns/' + r.style.pattern + '.png');
        if (im) { const pc = document.createElement('canvas'); pc.width = pc.height = 64; pc.getContext('2d').drawImage(im, 0, 0, 64, 64); patterns.set(r.style.pattern, pc); }
        else patterns.set(r.style.pattern, null);

      const ctx = cnv.getContext('2d'); ctx.scale(scale, scale); ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fillRect(0, 0, W, H);

      const labelX = PADX + CELL + GAP;
      for (const r of rows) {
        if (r.group != null) { ctx.font = groupFont; ctx.fillStyle = '#222'; ctx.textBaseline = 'top'; ctx.fillText(r.group, PADX, y); y += FS + 4; ctx.textBaseline = 'middle'; continue; }
        const mid = y + ROWH / 2, cx = PADX + CELL / 2;
        if (r.kind === 'rect') {
          const sw = 24, sh = 16, sx = cx - sw / 2, sy = mid - sh / 2;
          const fill = swatchFillColor(r.style.fill, r.style['fill-opacity']);
          if (fill && fill !== 'transparent') { ctx.fillStyle = fill; ctx.fillRect(sx, sy, sw, sh); }
          const pc = r.style.pattern && patterns.get(r.style.pattern);
          if (pc) { ctx.save(); ctx.globalAlpha = r.style['pattern-opacity'] ?? 1; ctx.fillStyle = ctx.createPattern(pc, 'repeat'); ctx.fillRect(sx, sy, sw, sh); ctx.restore(); }

            ctx.strokeRect(sx, sy, sw, sh); ctx.setLineDash([]);

          if (box && sprite) { const pr = box.pixelRatio || 1, k = Math.min(1, 16 / (box.height / pr)), dw = (box.width / pr) * k, dh = (box.height / pr) * k; ctx.drawImage(sprite, box.x, box.y, box.width, box.height, cx - dw / 2, mid - dh / 2, dw, dh); }
          else { ctx.fillStyle = toMapLibreColor(r.style.fill || '#412c26'); ctx.beginPath(); ctx.arc(cx, mid, 6, 0, Math.PI * 2); ctx.fill(); }

    // Composite the legend into the export canvas, positioned at the crop box corner (innerMargin
    // inside the box edge, matching the on-screen overlay).
    async function drawOverlaysInto(ctx, headerH) {
      if (!showLegend || !projectDoc.legend || projectDoc.legend.show === false) return;
      const legendCanvas = await renderLegendCanvas(projectDoc.legend, exportBox.scale);
      if (!legendCanvas) return;
      const m = exportBox.innerMargin * exportBox.scale, outW = exportBox.width * exportBox.scale, outH = exportBox.height * exportBox.scale;
      const pos = FO_POSITIONS.includes(projectDoc.legend.position) ? projectDoc.legend.position : 'bottom-left';
      const x = pos.includes('right') ? (outW - m - legendCanvas.width) : m;
      const y = pos.includes('bottom') ? (headerH + outH - m - legendCanvas.height) : (headerH + m);
      ctx.drawImage(legendCanvas, x, y);
    }

    async function renderExportBlob() {
      const canvas = map.getCanvas();
      const canSetPixelRatio = typeof map.setPixelRatio === 'function' && typeof map.getPixelRatio === 'function';
      const origPixelRatio = canSetPixelRatio ? map.getPixelRatio() : (window.devicePixelRatio || 1);
      if (canSetPixelRatio && exportBox.scale > 1) {
        map.setPixelRatio(origPixelRatio * exportBox.scale);
        await new Promise((resolve) => map.once('idle', resolve));
      }

      const px = canvas.width / canvasRect.width;   // canvas device pixels per CSS pixel
      if (exportMeta.logo) await loadExportLogo(exportMeta.logo);
      const outW = Math.round(exportBox.width * exportBox.scale);
      const mapH = Math.round(exportBox.height * exportBox.scale);
      const m = exportChromeMetrics();
      const out = document.createElement('canvas');
      out.width = outW;
      out.height = Math.round(mapH + m.header + m.footer);
      const ctx = out.getContext('2d');
      ctx.drawImage(
        canvas,
        exportBox.left * px, exportBox.top * px, exportBox.width * px, exportBox.height * px,
        0, m.header, outW, mapH
      );
      ctx.save();
      ctx.translate(0, m.header);
      drawInsetInto(ctx, outW, mapH);
      ctx.restore();
      drawExportChrome(ctx, outW, mapH, m);
      await drawOverlaysInto(ctx, m.header);  // legend/note overlays into the output
      if (canSetPixelRatio && exportBox.scale > 1) {

        map.triggerRepaint();
      }

    }
    // System serif for now. Map glyphs are MapLibre PBF ranges (SDF bitmaps for WebGL), which
    // canvas and CSS can't render text with — swapping this for a real
    // webfont later is a one-line change here plus the matching CSS on .export-cap.
    const CAPTION_FONT_STACK = `Georgia, "Times New Roman", serif`;

    // Caption geometry, in OUTPUT pixels. Sizes scale with the export multiplier so 4x output
    // gets 4x type rather than the same pixel size on a much bigger image.
    function exportChromeMetrics() {
      const k = exportBox.scale;
      const has = (v) => !!(v || '').trim();
      const m = {
        pad: 14 * k,
        titleSize: 26 * k, subSize: 15 * k, noteSize: 11 * k,
        hasTitle: has(exportMeta.title), hasSub: has(exportMeta.subtitle),
        hasNotes: has(exportMeta.notes),
        logo: exportLogoCache.get(exportMeta.logo) || null,
        header: 0, footer: 0
      };
      // Caption is drawn over the map, so the output is always exactly the crop box — header and
      // footer stay 0 and the fields below are only used for placement within it.
      return m;
    }

    // Draws title/subtitle/notes/logo over the map image: title/subtitle top-left, notes
    // bottom-left, logo bottom-right, all inset by `pad`.
    function drawExportChrome(ctx, outW, mapH, m) {
      if (exportMeta.chrome === 'none') return;
      const light = style === 'light';
      const fg = light ? '#111111' : '#ffffff';
      const dim = light ? 'rgba(0,0,0,.65)' : 'rgba(255,255,255,.7)';
      const overlay = exportMeta.chrome === 'overlay';
      // Overlaid text sits on unpredictable map content, so it gets a shadow for legibility;
      // in bands it's on a flat background and doesn't need one.
      const withShadow = (fn) => {
        if (overlay) {
          ctx.shadowColor = light ? 'rgba(255,255,255,.9)' : 'rgba(0,0,0,.85)';
          ctx.shadowBlur = 4 * exportBox.scale;
        }
        fn();
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
      };
      ctx.textBaseline = 'top';
      ctx.textAlign = 'left';
      let y = overlay ? m.pad : m.pad;
      if (m.hasTitle) {
        ctx.font = `600 ${m.titleSize}px ${CAPTION_FONT_STACK}`;
        ctx.fillStyle = fg;
        withShadow(() => ctx.fillText(exportMeta.title, m.pad, y));
        y += m.titleSize * 1.2;
      }
      if (m.hasSub) {
        ctx.font = `${m.subSize}px ${CAPTION_FONT_STACK}`;
        ctx.fillStyle = dim;
        withShadow(() => ctx.fillText(exportMeta.subtitle, m.pad, y));
      }
      // Footer content is bottom-aligned in its band (or against the image bottom when overlaid).
      const bottom = overlay ? m.header + mapH - m.pad : m.header + mapH + m.footer - m.pad;
      if (m.logo) {
        const h = 22 * exportBox.scale;
        const w = h * (m.logo.width / m.logo.height);
        ctx.drawImage(m.logo, outW - m.pad - w, bottom - h, w, h);
      }
      if (m.hasNotes) {
        ctx.font = `${m.noteSize}px ${CAPTION_FONT_STACK}`;
        ctx.fillStyle = dim;
        ctx.textBaseline = 'bottom';
        withShadow(() => ctx.fillText(exportMeta.notes, m.pad, bottom));
        ctx.textBaseline = 'top';
      }
    }

    // The inset is a separate MapLibre instance in its own DOM element, so it never appears in
    // map.getCanvas() — it has to be composited in by hand. Positions are taken from the live
    // element rect relative to the crop box, so it lands exactly where it sits on screen, and its
    // circular frame + white border are redrawn rather than captured (the border is CSS, which
    // isn't in the canvas at all).
    function drawInsetInto(ctx, outW, outH) {
      const el = document.getElementById('inset-map');
      if (!insetMap || !el || el.style.display === 'none') return;
      const insetCanvas = insetMap.getCanvas();
      const r = el.getBoundingClientRect();
      const mapRect = document.getElementById('map').getBoundingClientRect();
      // Where the inset sits inside the crop box, in output pixels.
      const k = outW / exportBox.width;
      const x = (r.left - mapRect.left - exportBox.left) * k;
      const y = (r.top - mapRect.top - exportBox.top) * k;
      const w = r.width * k;
      const h = r.height * k;
      if (x + w < 0 || y + h < 0 || x > outW || y > outH) return;   // outside the crop entirely
      const cfg = projectDoc.inset || {};
      const radius = cfg.radius ?? (cfg.projection === 'mercator' ? 0 : '50%');
      const rPx = typeof radius === 'string' && radius.trim().endsWith('%')
        ? (parseFloat(radius) / 100) * Math.min(w, h)
        : (+radius || 0) * k;
      ctx.save();
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x, y, w, h, rPx); else ctx.rect(x, y, w, h);
      ctx.clip();
      ctx.drawImage(insetCanvas, 0, 0, insetCanvas.width, insetCanvas.height, x, y, w, h);
      // The vignette is a CSS radial-gradient on an overlay div — also absent from any canvas, so
      // it's redrawn here to match applyInsetVignette()'s transparent->color stop.
      if (cfg.vignette) {
        const v = cfg.vignette === true ? {} : cfg.vignette;
        const cx = x + w / 2, cy = y + h / 2, outer = Math.min(w, h) / 2;
        const g = ctx.createRadialGradient(cx, cy, outer * ((v.stop ?? 55) / 100), cx, cy, outer);
        g.addColorStop(0, 'rgba(0,0,0,0)');
        g.addColorStop(1, v.color ?? '#000');
        ctx.globalAlpha = v.opacity ?? 0.55;
        ctx.fillStyle = g;
        ctx.fillRect(x, y, w, h);
        ctx.globalAlpha = 1;
      }
      ctx.restore();
      const border = cfg.border === false ? { width: 0 } : (cfg.border || {});
      const bw = (border.width ?? 1.5) * k;
      if (bw > 0) {
        ctx.save();
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(x, y, w, h, rPx); else ctx.rect(x, y, w, h);
        ctx.lineWidth = bw;
        ctx.strokeStyle = border.color ?? '#fff';
        ctx.stroke();
        ctx.restore();
      }
    }

    // Disables + relabels the triggering button for the duration of an async export action, so a
    // second click can't stack another render while the pixel-ratio bump is in flight.
    async function withExportBusy(btnSelector, busyLabel, fn) {
      const btn = exportPanelEl.querySelector(btnSelector);
      const prevLabel = btn?.textContent;
      if (btn) { btn.disabled = true; btn.textContent = busyLabel; }
      try { await fn(); }
      finally { if (btn) { btn.disabled = false; btn.textContent = prevLabel; } }
    }
    function downloadExportImage() {
      withExportBusy('.export-download-btn', 'Rendering…', async () => {
        const blob = await renderExportBlob();
        const a = document.createElement('a');
        const name = (exportBox.filename || `${style}-export`).replace(/\.webp$/i, '');
        a.href = URL.createObjectURL(blob);
        a.download = `${name}.webp`;
        a.click();
        URL.revokeObjectURL(a.href);
      });
    }
    // Opens the render in a new tab instead of downloading it — a quick way to check framing/
    // resolution at full size without littering the downloads folder.
    function previewExportImage() {
      withExportBusy('.export-preview-btn', 'Rendering…', async () => {
        const blob = await renderExportBlob();
        window.open(URL.createObjectURL(blob), '_blank');
      });
    }

    // --- Drop circle OBJECTS onto the map (point features, not new style layers) ---
    // The "+" on a circle row arms placement; each map click adds a point to one shared
    // GeoJSON source. Dropped points copy that layer's current circle paint so they match.
    const drops = { type: 'FeatureCollection', features: [] };
    let pendingDrop = null;   // id of the circle layer whose "+" is armed, or null
    // Sketch mode: the "Sketch …" buttons on the points/polys/annotations paste rows arm
    // placement, then map click(s) add straight into projectDoc via addFeature()
    // — same arrays the paste textareas write to, so a sketched shape shows up (and is
    // editable/copyable) right there. `kind` picks the array, `mode` picks the click behavior.
    let pendingSketch = null;
    // { kind, mode: 'point' }                                     — 1 click
    // { kind, mode: 'rect', corner1?: [lng, lat] }                 — 2 clicks (opposite corners)
    // { kind, mode: 'custom-shape', points?: [lng, lat][] }        — N clicks (one per vertex),
    //   Enter to close the polygon back to the first point (needs 3+)
    // { kind, mode: 'straight-arrow', start?: [lng, lat] }         — 2 clicks (start, end)
    // { kind, mode: 'curved-arrow', start?, end?: [lng, lat] }     — 3 clicks (start, end, then
    //   where to bow the curve toward — that 3rd click IS how you pick the curve's direction)
    const labelDrops = { type: 'FeatureCollection', features: [] };
    let labelSeq = 0;         // unique id per placed label, so a label can be dragged later
    let pendingLabel = null;  // { id, text } of the symbol layer whose "+" is armed, or null

    const plain = (v, d) => (typeof v === 'number' || typeof v === 'string') ? v : d;

    // Reference-map project file support (?project=<file>.json).
    // Mirrors Mapa's layer.points/layer.polys config shape and style-key
    // names, translated to MapLibre paint properties.
    // See dev/specs/2026-08-04-sandbox-reference-maps-design.md.
    const DIR_TO_ANCHOR = {
      N: 'bottom', S: 'top', E: 'left', W: 'right',
      NE: 'bottom-left', NW: 'bottom-right', SE: 'top-left', SW: 'top-right'
    };

    const PROJECT_POINT_DEFAULTS = {
      fill: '#412c26', size: 5, stroke: 'none', 'stroke-width': 0, opacity: 1,
      'label-font': 'Noto Sans Medium', 'label-size': 12,
      'label-color': '#000000', 'label-halo-color': '#ffffff', 'label-halo-width': 1
    };
    const PROJECT_LABEL_FONTS = ATLAS_FONTS;
    // text-font can't take an arbitrary per-feature array value directly — MapLibre requires a
    // data-driven text-font's output values to be literals within the expression itself (match/
    // case/step), not pulled from a property (confirmed via validateStyleMin: "Output values
    // must be contained as literals within the expression"). So the actual font-stack arrays are
    // enumerated here as match cases, keyed by a plain string feature property (_labelFont).
    const PROJECT_LABEL_FONT_EXPR = ['match', ['get', '_labelFont'],
      ...PROJECT_LABEL_FONTS.flatMap((f) => [f, ['literal', [f]]]),
      ['literal', ['Noto Sans Medium']]
    ];
    const PROJECT_POLY_DEFAULTS = { fill: 'none', 'fill-opacity': 1, stroke: 'none', 'stroke-width': 1, opacity: 1, 'stroke-dash': 'solid', pattern: null, 'pattern-opacity': 1, 'line-join': 'miter' };

    // Validates a poly entry's style.pattern against the same PATTERNS list the debug-panel
    // pattern dropdown uses (see loadPatterns() above) — an unknown name fails soft rather than
    // breaking the layer, same philosophy as the rest of project-file loading.
    function resolveProjectPattern(name) {
      if (!name) return '';
      if (PATTERNS.includes(name)) return name;
      console.warn(`[project] unknown pattern "${name}" — skipping`);
      return '';
    }

    // Validates a point entry's `symbol` against the sprite images the live style has loaded
    // (map.hasImage). Unknown name → warn and fall back to '' so the point keeps its circle, same
    // fail-soft philosophy as resolveProjectPattern. The sprite can load a tick after the first
    // render; the map's existing 'idle' re-render corrects an early fallback.
    function resolveProjectSymbol(name) {
      if (!name) return '';
      if (map.hasImage && map.hasImage(name)) return name;
      console.warn(`[project] unknown symbol "${name}" — falling back to circle`);
      return '';
    }
    // Text keys deliberately use the same label-* spellings as PROJECT_POINT_DEFAULTS above, so
    // one mental model covers every label in a project file. Shared by text-areas and by an
    // arrow's own `label`, so both are styled identically.
    const PROJECT_LABEL_DEFAULTS = {
      'text-max-width': 10, align: 'center',
      'label-font': 'Noto Sans Medium', 'label-size': 12,
      'label-color': '#000000', 'label-halo-color': '#ffffff', 'label-halo-width': 1,
      'label-offset': [0, 0],
      // text-letter-spacing / text-line-height can't be read per-feature (not data-driven), so
      // they're literals per font-group layer and part of the group key. Defaults = MapLibre's.
      'label-letter-spacing': 0, 'label-line-height': 1.2
    };
    const PROJECT_ANNOTATION_LINE_DEFAULTS = {
      stroke: '#000000', 'stroke-width': 2, opacity: 1, 'arrow-size': 0.3, 'stroke-dash': 'solid',
      ...PROJECT_LABEL_DEFAULTS,
      // Where an arrow's label sits along its own geometry. 'start' (the tail) is the default
      // because an arrow normally runs from its caption to the thing being pointed at.
      'label-anchor': 'start'
    };
    // `color` is the older annotation-only name for label-color, still honored on read so
    // existing project files don't silently go black.
    const PROJECT_ANNOTATION_BOX_DEFAULTS = {
      fill: 'none', 'fill-opacity': 1, stroke: 'none', 'stroke-width': 1, opacity: 1,
      ...PROJECT_LABEL_DEFAULTS
    };
    // One text feature, whatever produced it — a text-area or an arrow's label. rawStyle is the
    // entry's own style object (pre-merge) so an explicit legacy `color` isn't masked by the
    // label-color default.
    function labelTextFeature(position, text, style, rawStyle, id, anchor = 'center') {
      return {
        type: 'Feature',
        geometry: { type: 'Point', coordinates: position },
        properties: {
          _id: id,
          _anchor: anchor,
          _text: text || '',
          _textColor: toMapLibreColor(rawStyle?.['label-color'] ?? rawStyle?.color ?? style['label-color']),
          _maxWidth: style['text-max-width'],
          _justify: style.align,
          _textSize: style['label-size'],
          _haloColor: toMapLibreColor(style['label-halo-color']),
          _haloWidth: style['label-halo-width'],
          _offset: style['label-offset']
        }
      };
    }

    // line-dasharray has NO data-driven support at all in MapLibre (stricter than text-font —
    // not even a match/case expression works; per the style spec: "arrays cannot be read from or
    // derived from feature properties"). So a poly/annotation-line entry's dash pattern can't be
    // a per-feature paint expression — entries with different resolved dash patterns must render
    // through separate dedicated layers, each with a fixed literal line-dasharray. 'solid'/null/
    // unset means no dasharray at all (solid line); a raw array (e.g. [3,2]) passes through as-is.
    const DASH_PRESETS = { solid: null, dashed: [3, 2], dotted: [0, 2] };
    function toDashArray(value) {
      if (Array.isArray(value)) return value;
      return DASH_PRESETS[value] ?? null;
    }

    // Section-level default insertion anchor (via addLayer's beforeId) for points/polys/
    // annotations — used as the fallback for any entry that doesn't set its own insertBelow.
    // Default is undefined (top of the whole stack, same as before insertBelow existed) — a
    // project must set view.insertBelow explicitly to opt into a different default. Either one
    // string (applies to all three sections) or an object {points, polys, annotations} for
    // independent per-section defaults — single-project only, same rule as
    // view.lock/basemap/hillshade/hide.
    const projectBeforeId = { points: undefined, polys: undefined, annotations: undefined };

    // Groups a section's data array by resolved insertion anchor (each entry's own insertBelow,
    // falling back to the section-level default above) — so entries targeting different layers
    // each get their own dedicated layer-set, instead of one shared layer-set per whole section.
    // Entries with no anchor (or an anchor that doesn't exist in the loaded style — addLayer
    // throws on an unknown beforeId, which would otherwise take down the whole render) land in
    // one group with beforeId undefined (top of stack).
    function groupDataByAnchor(data, kind) {
      const groups = new Map(); // anchor key -> { beforeId, items: [] }
      for (const item of (data || [])) {
        // Per-item show flag: `show: false` keeps the entry in the file but skips rendering it,
        // so authors can park a callout without deleting its markup. Omitted/true = rendered.
        if (item.show === false) continue;
        const anchor = item.insertBelow ?? projectBeforeId[kind];
        const key = anchor || '__top__';
        if (!groups.has(key)) {
          groups.set(key, { beforeId: anchor && map.getLayer(anchor) ? anchor : undefined, items: [] });
        }
        groups.get(key).items.push(item);
      }
      return groups;
    }
    const PROJECT_LAYER_PREFIX = { points: 'project-points', polys: 'project-polys', annotations: 'project-annotation' };

    // addLayer's beforeId only applies when a layer is first created, so changing a section's
    // anchor means removing its layers and letting the next render rebuild them in the new spot.
    function removeProjectLayers(kind) {
      const prefix = PROJECT_LAYER_PREFIX[kind];
      for (const l of map.getStyle().layers.slice()) {
        if (l.id.startsWith(prefix) && map.getLayer(l.id)) map.removeLayer(l.id);
      }
      // Sources only after every layer using them is gone, or removeSource throws.
      for (const id of Object.keys(map.getStyle().sources || {})) {
        if (id.startsWith(prefix) && map.getSource(id)) {
          try { map.removeSource(id); } catch { /* still referenced — leave it, setData will reuse */ }
        }
      }
    }

    // view.insertBelow is either one string for all three sections or a per-section object. Set a
    // single section and it has to become the object form, so the other two keep whatever they had.
    function setSectionInsertBelow(kind, value) {
      projectDoc.view = projectDoc.view || {};
      const cur = projectDoc.view.insertBelow;
      const obj = typeof cur === 'string'
        ? { points: cur, polys: cur, annotations: cur }
        : { ...(cur || {}) };
      if (value) obj[kind] = value; else delete obj[kind];
      if (Object.keys(obj).length) projectDoc.view.insertBelow = obj;
      else delete projectDoc.view.insertBelow;
      if (!Object.keys(projectDoc.view).length) delete projectDoc.view;
      projectBeforeId[kind] = value || undefined;
      removeProjectLayers(kind);
      rerenderPasted(kind);
      updateProjectJson();
    }

    // Layer/source ids are built as `<base>--<suffix>` per group; sanitize the anchor key so it's
    // always safe to use as (part of) an id, even though real layer ids already are.
    function anchorSuffix(key) {
      return key.replace(/[^a-zA-Z0-9_-]/g, '_');
    }

    function mergeProjectStyle(defaults, overrides) {
      return { ...defaults, ...(overrides || {}) };
    }

    function toMapLibreColor(value) {
      return (!value || value === 'none') ? 'rgba(0,0,0,0)' : value;
    }

    // Sources are keyed by anchor (and dash, for polys). Delete the last item in a group and that
    // group simply isn't visited on the next render — so its source keeps the features it had and
    // the shape stays on the map after its entry is gone. Emptying every source under the prefix
    // that wasn't rebuilt this pass is what actually makes deletion take effect.
    function clearStaleProjectSources(prefix, live) {
      for (const id of Object.keys(map.getStyle().sources || {})) {
        if (id.startsWith(prefix) && !live.has(id) && map.getSource(id)) {
          map.getSource(id).setData({ type: 'FeatureCollection', features: [] });
        }
      }
    }

    function ensureProjectPointsLayer(section) {
      const liveSources = new Set();
      const anchorMap = { ...DIR_TO_ANCHOR, ...(section.dirDefaults || {}) };
      const visibility = section.show === false ? 'none' : 'visible';

      for (const [key, group] of groupDataByAnchor(section.data, 'points')) {
        const suffix = anchorSuffix(key);
        const sourceId = `project-points--${suffix}`;
        liveSources.add(sourceId);
        const circleId = `project-points-circle--${suffix}`;
