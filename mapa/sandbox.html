      const z = e.target.closest('.img-drop'); if (!z) return;
      e.preventDefault(); z.classList.add('drag');
    });
    panel.addEventListener('dragleave', (e) => { e.target.closest('.img-drop')?.classList.remove('drag'); });
    panel.addEventListener('drop', (e) => {
      const z = e.target.closest('.img-drop'); if (!z) return;
      e.preventDefault(); z.classList.remove('drag');
      if (e.dataTransfer?.files?.length) takeImageFiles([...e.dataTransfer.files]);
    });
    panel.addEventListener('click', (e) => {
      if (e.target.closest('.img-drop')) { panel.querySelector('.img-file-in')?.click(); return; }
      const imgDel = e.target.closest('.img-del-btn');
      if (imgDel) {
        const list = projectDoc.export?.raster?.data || [];
        const [gone] = list.splice(+imgDel.dataset.i, 1);
        if (gone && imgBlobs.has(gone)) URL.revokeObjectURL(imgBlobs.get(gone));
        renderProjectRasters(); buildPanel();
        return;
      }
      // Export / import buttons
      const io = e.target.closest('.io-btn');
      if (io) {
        if (io.dataset.act === 'export') download(`${style}-layer-settings.json`, JSON.stringify(exportSettings(), null, 2));
        else if (io.dataset.act === 'import') panel.querySelector('.import-file').click();
        else if (io.dataset.act === 'openmapa') {
          const bd = map.getBounds();
          const bbox = [bd.getWest(), bd.getSouth(), bd.getEast(), bd.getNorth()].map((n) => n.toFixed(4)).join(',');
          window.open('mapa.html?bbox=' + bbox, '_blank');
        }
        else { inspectMode = !inspectMode; buildPanel(); }
        return;
      }
      // Tab switch
      const tab = e.target.closest('.ptab');
      if (tab) { activeTab = tab.dataset.tab; buildPanel(); return; }
      // Project tab: the whole file, ready to paste over the real one.
      const projCopy = e.target.closest('.project-copy-btn');
      if (projCopy) {
        navigator.clipboard?.writeText(JSON.stringify(projectDoc, null, 2));
        const prev = projCopy.textContent;
        projCopy.textContent = '✓ Copied';
        setTimeout(() => { projCopy.textContent = prev; }, 900);
        return;
      }
      const clearPart = e.target.closest('.clear-part-btn');
      if (clearPart) { delete selectedItem.uid; buildPanel(); return; }
      const styleReset = e.target.closest('.section-stylereset-btn');
      if (styleReset) { resetSketchStyle(styleReset.dataset.kind); buildPanel(); return; }
      const insetHead = e.target.closest('.inset-head');
      if (insetHead) { insetSelected = !insetSelected; if (insetSelected) selectedItem = null; buildPanel(); return; }
      const insetAct = e.target.closest('[data-inset-act]');
      if (insetAct) {
        const act = insetAct.dataset.insetAct;
        if (act === 'add') {
          const c = map.getCenter();
          projectDoc.inset = { position: 'bottom-right', size: 160, labels: false, radius: '50%',
            center: [+c.lng.toFixed(2), +c.lat.toFixed(2)], zoom: 0 };
          rebuildInset();
        } else if (act === 'remove') {
          delete projectDoc.inset;
          rebuildInset();
        } else if (act === 'here') {
          const c = map.getCenter();
          projectDoc.inset.center = [+c.lng.toFixed(2), +c.lat.toFixed(2)];
          applyInsetLive();
        } else if (act === 'add-marker') {
          insetMarkerArmed = !insetMarkerArmed;
          if (insetMarkerArmed) { disarmDrop(); insetMap.getCanvas().style.cursor = 'crosshair'; }
          else insetMap.getCanvas().style.cursor = '';
          readout.textContent = insetMarkerArmed ? 'click the inset to add a marker — Esc to stop' : '';
        } else if (act === 'clear-markers') {
          delete projectDoc.inset.markers;
          refreshInsetMarkers();
        } else if (act === 'draw-extent') {
          armSketch('inset', 'extent', insetAct);
          return;   // armSketch already calls buildPanel(); don't fall through to the one below
        }
        updateProjectJson();
        buildPanel();
        return;
      }
      const sketch = e.target.closest('.sketch-btn');
      if (sketch) { armSketch(sketch.dataset.kind, sketch.dataset.tool, sketch); return; }
      // × on the selected-item row: delete whatever is currently selected on the map.
      const delBtn = e.target.closest('.placed-del-btn');
      if (delBtn && selectedItem) {
        const { kind, index } = selectedItem;
        pastedArrayFor(kind).splice(index, 1);
        selectedItem = null;
        rerenderPasted(kind);
        buildPanel();
        return;
      }
      // "+" on a circle/symbol/leader-line row: arm placement so the next map click(s) place it
      const drop = e.target.closest('.drop-btn');
      if (drop) {
        if (drop.dataset.kind === 'label') armLabel(drop.dataset.layer, drop);
        else if (drop.dataset.kind === 'leaderline') armLeaderLine(drop);
        else armDrop(drop.dataset.layer, drop);
        return;
      }
      // Leader-lines row: toggle fork mode, or hide/show the drag handles + coordinate text
      const llFork = e.target.closest('.ll-fork');
      if (llFork) { toggleForkArmed(llFork); return; }
      const llToggleHelpers = e.target.closest('.ll-toggle-helpers');
      if (llToggleHelpers) { toggleLeaderLineHelpers(llToggleHelpers); return; }
      // Copy to clipboard: the leader-lines row copies its placed lines as GeoJSON (what goes in
      // leader-lines-geo's data); every other row copies its style definition, as before
      const cp = e.target.closest('.copy-btn');
      if (cp) {
        const def = cp.dataset.layer === 'leader-lines'
          ? leaderLines
          : map.getStyle().layers.find(l => l.id === cp.dataset.layer);
        if (def) {
          navigator.clipboard?.writeText(JSON.stringify(def, null, 2));
          const prev = cp.textContent;
          cp.textContent = '✓';
          setTimeout(() => { cp.textContent = prev; }, 900);
        }
        return;
      }
      // Click a type label to expand/collapse that layer's type-specific settings
      const type = e.target.closest('.type-btn');
      if (type) {
        type.closest('.layer').querySelector('.settings')?.classList.toggle('open');
        return;
      }
      // Collapse/expand a group by clicking its header
      const header = e.target.closest('.group');
      if (!header) return;
      const group = header.dataset.group;
      const isCol = header.classList.toggle('collapsed');
      header.querySelector('.caret').textContent = isCol ? '▸' : '▾';
      panel.querySelectorAll(`.layer[data-group="${group}"]`)
        .forEach(row => row.classList.toggle('hidden', isCol));
      isCol ? collapsed.add(group) : collapsed.delete(group);
    });

    panel.addEventListener('change', (e) => {
      const t = e.target;
      if (t.classList.contains('img-file-in')) { if (t.files.length) takeImageFiles([...t.files]); t.value = ''; return; }
      if (t.classList.contains('img-op-in')) {
        // Commit on Enter/blur: any valid 0–1 (0 included); anything else snaps back to the current value.
        const i = +t.dataset.i, v = parseImgOpacity(t.value);
        if (v != null) setImgOpacity(i, v);
        t.value = projectDoc.export?.raster?.data?.[i]?.opacity ?? 1;
        return;
      }
      if (t.classList.contains('img-show-cb') || t.classList.contains('img-pos-sel')) {
        const r = projectDoc.export?.raster?.data?.[+t.dataset.i]; if (!r) return;
        if (t.classList.contains('img-show-cb')) { if (t.checked) delete r.show; else r.show = false; }
        else r.position = t.value;
        renderProjectRasters();
        return;
      }
      // Import a settings file
      if (t.classList.contains('import-file')) {
        const file = t.files[0];
        if (file) file.text()
          .then(txt => importSettings(JSON.parse(txt)))
          .catch(err => alert('Could not import settings: ' + err.message));
        t.value = '';   // allow re-selecting the same file
        return;
      }
      // Per-layer show/hide
      if (t.classList.contains('vis-cb')) {
        map.setLayoutProperty(t.dataset.layer, 'visibility', t.checked ? 'visible' : 'none');
        return;
      }
      // Line dash preset
      if (t.classList.contains('line-dash')) {
        applyDash(t.dataset.layer, t.value);
        return;
      }
      // Fill pattern: manage a separate overlay layer on top of the fill ('' -> remove overlay).
      // The fill's own color is never touched, so a highlight keeps rendering beneath the pattern.
      if (t.classList.contains('fill-pattern')) {
        applyPatternOverlay(t.dataset.layer);
        return;
      }
      // Pattern background on/off: add/remove the solid backing layer beneath the pattern
      if (t.classList.contains('patternbg-on')) {
        applyPatternBg(t.dataset.layer);
        return;
      }
      // Reference a label preset from a symbol layer ('' -> unbind, leaves current font/size)
      if (t.classList.contains('label-preset')) {
        const id = t.dataset.layer;
        if (t.value) { labelBinding[id] = t.value; applyBinding(id); }
        else delete labelBinding[id];
        saveBindings();
        return;
      }
      // Any sketch style <select> (currently just polys' pattern dropdown)
      if (t.classList.contains('sketch-style-select')) {
        setSketchStyleField(t.dataset.kind, t.dataset.field, t.value);
        return;
      }
      // "no fill" checkbox: fill -> 'none' (transparent), independent of pattern, which is its
      // own separate overlay layer and keeps rendering either way. Unchecking restores whatever
      // color the (disabled but still holding its value) color picker was last set to.
      if (t.classList.contains('sketch-style-fill-none')) {
        const kind = t.dataset.kind;
        const colorInput = panel.querySelector(`input.sketch-style-in[data-kind="${kind}"][data-field="fill"]`);
        setSketchStyleField(kind, 'fill', t.checked ? 'none' : (colorInput?.value || '#ff0000'));
        buildPanel();
        return;
      }
      if (t.classList.contains('section-anchor-sel')) {
        setSectionInsertBelow(t.dataset.kind, t.value);
        return;
      }
      if (t.classList.contains('view-capture-cb')) {
        projectDoc.view = projectDoc.view || {};
        const field = t.dataset.field;
        const urlValue = field === 'zoom' ? zoom : field === 'bbox' ? bbox : centerParam;
        if (t.checked) projectDoc.view[field] = urlValue;
        else delete projectDoc.view[field];
        if (!Object.keys(projectDoc.view).length) delete projectDoc.view;
        updateProjectJson();
        return;
      }
      if (t.classList.contains('section-stylemem-cb')) {
        styleMemory[t.dataset.kind] = t.checked;
        return;
      }
      if (t.classList.contains('section-show-cb')) {
        projectDoc[t.dataset.kind].show = t.checked;
        rerenderPasted(t.dataset.kind);
        return;
      }
      if (t.classList.contains('inset-sel')) { setInsetField(t.dataset.field, t.value); buildPanel(); return; }
      if (t.classList.contains('inset-cb')) {
        // `vignette` and `labels` are booleans in the file; the rest of the checkboxes map 1:1.
        setInsetField(t.dataset.field, t.dataset.field === 'labels' ? t.checked : (t.checked || undefined));
        buildPanel();
        return;
      }
      // Feature-level fields, i.e. everything that isn't inside a `style` object: a point's
      // name/dir, a connector's straight/curved shape, a text area's text/align/background.
      // Same dual behavior as the style inputs — set the next-sketch default, and live-apply to
      // the selected item if there is one.
      if (t.classList.contains('sketch-meta-in') || t.classList.contains('sketch-meta-select')
          || t.classList.contains('sketch-meta-area')) {
        setSketchMetaField(t.dataset.kind, t.dataset.field, t.type === 'checkbox' ? t.checked : t.value);
        return;
      }
    });

    // Trim: Enter in the refUid field resolves it as the "other" geometry to split against
    panel.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' || !e.target.classList.contains('trim-refuid-in')) return;
      if (selectedItem?.kind !== 'polys' || !pastedArrayFor('polys')[selectedItem.index]?.geometry) return;
      const refUids = e.target.value.split(',').map(s => s.trim()).filter(Boolean);
      if (!refUids.length) return;
      const otherGeom = resolveRefUidGeometry(refUids);
      if (!otherGeom) { readout.textContent = `trim: couldn't resolve "${e.target.value}" — check the uid, or that area may not be loaded/visible on the map yet`; return; }
      startTrimPreview(selectedItem.index, pastedArrayFor('polys')[selectedItem.index].geometry.coordinates, otherGeom.coordinates);
    });

    // Live edits: color swatch -> setPaintProperty; zoom fields -> setLayerZoomRange
    panel.addEventListener('input', (e) => {
      const t = e.target;
      if (t.classList.contains('img-op-in')) {
        // Live while typing, no rebuild (keeps focus) — but only for a value above 0, so the
        // "0" on the way to "0.9" doesn't blank the image. Enter/blur commits anything (setImgOpacity).
        const v = parseImgOpacity(t.value);
        if (v > 0) setImgOpacity(+t.dataset.i, v);
        return;
      }
      if (t.classList.contains('inset-in')) {
        // No buildPanel() here — these fire per keystroke and a rebuild would drop focus.
        const raw = t.type === 'number' ? (t.value === '' ? '' : +t.value) : t.value;
        setInsetField(t.dataset.field, raw);
        return;
      }
      // Live-update the annotation as the text is typed. Nothing here rebuilds the panel, so the
      // textarea keeps focus and the caret stays put.
      if (t.classList.contains('sketch-meta-area')) {
        setSketchMetaField(t.dataset.kind, t.dataset.field, t.value);
        return;
      }
      if (t.classList.contains('patternbg-color')) {
        // Picking a color also enables the backing layer
        const cb = panel.querySelector(`.patternbg-on[data-layer="${t.dataset.layer}"]`);
        if (cb) cb.checked = true;
        applyPatternBg(t.dataset.layer);
      } else if (t.classList.contains('patternbg-op')) {
        applyPatternBg(t.dataset.layer);
      } else if (t.classList.contains('pattern-op')) {
        applyPatternOverlay(t.dataset.layer);
      } else if (t.classList.contains('swatch')) {
        map.setPaintProperty(t.dataset.layer, t.dataset.prop, t.value);
      } else if (t.classList.contains('opacity-in')) {
        map.setPaintProperty(t.dataset.layer, t.dataset.prop, t.value === '' ? 1 : +t.value);
      } else if (t.classList.contains('zoom-in')) {
        const id = t.dataset.layer;
        const [mn, mx] = ['min', 'max'].map(b =>
          panel.querySelector(`.zoom-in[data-layer="${id}"][data-bound="${b}"]`).value);
        map.setLayerZoomRange(id, mn === '' ? 0 : +mn, mx === '' ? 24 : +mx);
      } else if (t.classList.contains('num-in')) {
        // width / radius / stroke-width / halo-width -> paint; text-size -> layout (data-kind)
        if (t.value !== '') {
          const setter = t.dataset.kind === 'layout' ? 'setLayoutProperty' : 'setPaintProperty';
          map[setter](t.dataset.layer, t.dataset.prop, +t.value);
        }
      } else if (t.classList.contains('llratio-in')) {
        // Applies to every forked line already placed (moves their junction live), and
        // becomes the default for any new fork placed after this
        forkRatio = t.value === '' ? 0.5 : +t.value;
        llRecords.forEach(r => { if (r.targets.length > 1) r.forkRatio = forkRatio; });
        refreshLeaderLines();
        return;   // not a style-layer edit
      } else if (t.classList.contains('llminzoom-in') || t.classList.contains('llmaxzoom-in')) {
        // Same as fork ratio: applies to every line already placed and becomes the default for
        // new ones. The leader-lines layer's filter (baked into every style file, including the
        // dev ones) already reads these, so zooming in/out here shows the effect live.
        if (t.classList.contains('llminzoom-in')) llMinZoom = t.value === '' ? 0 : +t.value;
        else llMaxZoom = t.value === '' ? 24 : +t.value;
        llRecords.forEach(r => { r.minzoom = llMinZoom; r.maxzoom = llMaxZoom; });
        refreshLeaderLines();
        return;   // not a style-layer edit
      } else if (t.classList.contains('layer-search-in')) {
        layerFilter = t.value;
        applyLayerFilter();
        return;   // not a style-layer edit
      } else if (t.classList.contains('sketch-style-in')) {
        const value = t.type === 'number' ? (t.value === '' ? 0 : +t.value) : t.value;
        setSketchStyleField(t.dataset.kind, t.dataset.field, value);
        return;
      } else {
        return;   // not an editable control -> nothing to persist
      }
    });

    // --- Feature search -------------------------------------------------------------------
    // lookups/features.json is [name, uid, category] triples built from the master_shapes CSVs
    // (those live under dev/, which is gitignored, so they can't be fetched at runtime). admin2
    // and populated_places are deliberately excluded — together they'd be ~2MB, and neither is
    // what you reach for when coloring a country or a state.
    const featSearchEl = document.getElementById('featsearch');
    const featSearchIn = document.getElementById('featsearch-in');
    const featSearchList = document.getElementById('featsearch-list');
    featSearchEl.style.display = debug ? '' : 'none';
    let featIndex = null;      // [[name, uid, cat], …]
    let featResults = [];
    let featActive = 0;

    async function loadFeatIndex() {
      if (featIndex) return featIndex;
      try {
        const res = await fetch('./lookups/features.json');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        featIndex = await res.json();
      } catch (err) {
        console.warn('[search] could not load lookups/features.json:', err);
        featIndex = [];
      }
      return featIndex;
    }

    function renderFeatResults() {
      if (!featResults.length) {
        featSearchList.innerHTML = featSearchIn.value.trim()
          ? `<div class="fs-empty">nothing matching</div>` : '';
        featSearchList.hidden = !featSearchIn.value.trim();
        return;
      }
      featSearchList.innerHTML = featResults.map(([name, uid, cat], i) => {
        // admin1 uids are prefixed by their country's ISO ("admin1:nga_lagos"), so a country row
        // can offer every one of its states in a single click.
        // 'admin0', not 'country' — the categories come from the uid prefix in features.json.
        const subCount = cat === 'admin0' ? subUidsFor(uid, 'admin1').length : 0;
        // admin2 is only in the index for countries it's been added for, so this button appears
        // per-country rather than everywhere.
        const sub2Count = cat === 'admin0' ? subUidsFor(uid, 'admin2').length : 0;
        return `<div class="fs-row${i === featActive ? ' active' : ''}" data-uid="${esc(uid)}" data-i="${i}">` +
          `<span class="fs-name">${esc(name)}</span>` +
          (subCount ? `<button class="fs-all" data-i="${i}" data-level="admin1" title="add all ${subCount} admin1 features">+ ${subCount} admin1</button>` : '') +
          (sub2Count ? `<button class="fs-all" data-i="${i}" data-level="admin2" title="add all ${sub2Count} admin2 features">+ ${sub2Count} admin2</button>` : '') +
          `<span class="fs-cat">${esc(cat)}</span></div>`;
      }).join('');
      featSearchList.hidden = false;
    }

    // admin0 first, then admin1, then land and water regions — searching "chad" should offer
    // the country before the lake and the province.
    // Keys are the uid prefixes themselves (admin0:ukr -> admin0), so the labels in the results
    // match what actually goes into the project file.
    const FEAT_CAT_RANK = { admin0: 0, admin1: 1, admin2: 2, land_region: 3, water_region: 4 };

    // Ranked in two passes: a name that STARTS with the query beats one that merely contains it,
    // and within each pass the category order above applies. So "ukr" gives Ukraine, then its
    // oblasts, rather than whichever happened to sort first in the file.
    function runFeatSearch(q) {
      const needle = q.trim().toLowerCase();
      if (!needle) { featResults = []; featActive = 0; renderFeatResults(); return; }
      const starts = [], contains = [];
      for (const row of featIndex || []) {
        const n = row[0].toLowerCase();
        if (n.startsWith(needle)) starts.push(row);
        else if (n.includes(needle) || row[1].includes(needle)) contains.push(row);
      }
      const byCat = (a, b) =>
        (FEAT_CAT_RANK[a[2]] ?? 9) - (FEAT_CAT_RANK[b[2]] ?? 9) || a[0].localeCompare(b[0]);
      featResults = starts.sort(byCat).concat(contains.sort(byCat)).slice(0, 50);
      featActive = 0;
      renderFeatResults();
    }

    // Picking a result adds a poly that references the shape by uid — the same refUid mechanism a
    // hand-written project file uses, so it resolves from the pmtiles rather than baking in
    // coordinates. It lands selected, so the Polygons style row is immediately editing it.
    // "admin0:nga" + "admin1" -> every "admin1:nga_*" uid in the index.
    function subUidsFor(countryUid, level) {
      const iso = countryUid.split(':')[1];
      if (!iso) return [];
      const prefix = `${level}:${iso}_`;
      return (featIndex || []).filter((r) => r[1].startsWith(prefix)).map((r) => r[1]);
    }

    // Writes ONE wildcard entry rather than N concrete uids — the project file stays a flag
    // ("every admin1 in this country") instead of a frozen list that goes stale if the source
    // data gains or loses a state.
    function addAllSubUnits(countryUid, countryName, level) {
      const uids = subUidsFor(countryUid, level);
      if (!uids.length) return;
      const iso = countryUid.split(':')[1];
      addFeature('polys', { refUid: [`${level}:${iso}_*`], style: sketchPolyStyle() });
      rerenderPasted('polys');
      selectLast('polys');
      activeTab = 'edit';
      buildPanel();
      readout.textContent = `added ${level}:${iso}_* — all ${uids.length} ${level} features in ${countryName}, as one entry`;
      featSearchIn.value = '';
      featResults = [];
      renderFeatResults();
    }

    function addFeatureByUid(uid, name) {
      const item = { refUid: [uid], style: sketchPolyStyle() };
      addFeature('polys', item);
      rerenderPasted('polys');
      selectedItem = { kind: 'polys', index: pastedArrayFor('polys').length - 1 };
      insetSelected = false;
      activeTab = 'edit';
      buildPanel();
      readout.textContent = `added ${name} (${uid}) — set its color in the Polygons row`;
      featSearchIn.value = '';
      featResults = [];
      renderFeatResults();
    }

    featSearchIn.addEventListener('focus', loadFeatIndex);
    featSearchIn.addEventListener('input', async () => {
      await loadFeatIndex();
      runFeatSearch(featSearchIn.value);
    });
    featSearchIn.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { featSearchIn.value = ''; featResults = []; renderFeatResults(); featSearchIn.blur(); return; }
      if (!featResults.length) return;
      if (e.key === 'ArrowDown') { featActive = (featActive + 1) % featResults.length; renderFeatResults(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { featActive = (featActive - 1 + featResults.length) % featResults.length; renderFeatResults(); e.preventDefault(); }
      else if (e.key === 'Enter') {
        const [name, uid] = featResults[featActive];
        addFeatureByUid(uid, name);
        e.preventDefault();
      }
    });
    featSearchList.addEventListener('click', (e) => {
      const all = e.target.closest('.fs-all');
      if (all) {
        const [name, uid] = featResults[+all.dataset.i];
        addAllSubUnits(uid, name, all.dataset.level);
        return;
      }
      const row = e.target.closest('.fs-row');
      if (!row) return;
      const [name, uid] = featResults[+row.dataset.i];
      addFeatureByUid(uid, name);
    });

    // Live zoom + bbox readout, and click-to-copy lng,lat for authoring params
    const readout = document.getElementById('readout');
    function update() {
      const b = map.getBounds();
      const c = map.getCenter();
      readout.textContent =
        `bbox ${b.getWest().toFixed(2)},${b.getSouth().toFixed(2)},${b.getEast().toFixed(2)},${b.getNorth().toFixed(2)}` +
        `  |  center ${c.lng.toFixed(2)},${c.lat.toFixed(2)}  |  zoom ${map.getZoom().toFixed(2)}`;
      // Not buildPanel() — that would run on every pan/zoom frame and drop focus from whatever
      // input you're using elsewhere in the panel. syncViewToMap() only ever touches
      // projectDoc.view and the Project tab's text, never the rest of the DOM.
      syncViewToMap();
    }
    document.getElementById('readout-zoom-cb').addEventListener('change', (e) => {
      viewTrackZoom = e.target.checked;
      if (viewTrackZoom) syncViewToMap();
    });
    document.getElementById('readout-center-cb').addEventListener('change', (e) => {
      viewTrackCenter = e.target.checked;
      if (viewTrackCenter) syncViewToMap();
    });
    document.getElementById('readout-bbox-cb').addEventListener('change', (e) => {
      viewTrackBbox = e.target.checked;
      if (viewTrackBbox) syncViewToMap();
    });
    // Unlike zoom/center/bbox, lock isn't a value read off the live camera — it's a plain
    // boolean, same as view.lock in a hand-written project file (pins min/max zoom so no
    // interaction can change it once the file loads).
    document.getElementById('readout-lock-cb').addEventListener('change', (e) => {
      projectDoc.view = projectDoc.view || {};
      if (e.target.checked) projectDoc.view.lock = true; else delete projectDoc.view.lock;
      if (!Object.keys(projectDoc.view).length) delete projectDoc.view;
      updateProjectJson();
    });
    map.on('load', update);
    map.on('move', update);
    map.on('click', (e) => {
      // Placement mode: leader line origin -> target(s), 2 or 3 clicks depending on fork mode
      if (pendingLL) {
        const p = pendingLL;
        if (p.stage === 'origin') {
          const snap = snapOrigin(e);
          p.origin = snap.coords;
          p.originRef = snap.ref;
          p.targets = [];
          p.stage = 'target1';
          updatePendingHandles(p);
          readout.textContent = `leader line: origin set${snap.ref ? ' (snapped)' : ''} — click target 1${p.fork ? ' of 2' : ''} (Esc to cancel)`;
        } else if (p.stage === 'target1') {
          p.targets = [[e.lngLat.lng, e.lngLat.lat]];
          if (p.fork) {
            p.stage = 'target2';
            updatePendingHandles(p);
            readout.textContent = 'leader line: click target 2 (Esc to cancel)';
          } else {
            finalizeLeaderLine(p);
            pendingLL = null;
            map.getCanvas().style.cursor = '';
            clearArmedButtons();
          }
        } else if (p.stage === 'target2') {
          p.targets.push([e.lngLat.lng, e.lngLat.lat]);
          finalizeLeaderLine(p);
          pendingLL = null;
          map.getCanvas().style.cursor = '';
          clearArmedButtons();
        }
        return;
      }
      // Placement mode: drop a label object with the armed style (from a layer or a preset)
      if (pendingLabel) {
        const s = pendingLabel;
        if (Array.isArray(s.font)) map.setLayoutProperty('sandbox-labels', 'text-font', s.font);
        labelDrops.features.push({
          type: 'Feature',
          geometry: { type: 'Point', coordinates: [e.lngLat.lng, e.lngLat.lat] },
          properties: { _id: ++labelSeq, _t: s.text, _sz: s.size, _col: s.color, _hc: s.hc, _hw: s.hw, _anchor: s.anchor || 'center' }
        });
        map.getSource('sandbox-labels').setData(labelDrops);
        // Place once, then disarm (drag it afterwards to reposition)
        pendingLabel = null;
        map.getCanvas().style.cursor = '';
        clearArmedButtons();
        readout.textContent = `placed "${s.text}" — drag to move it`;
        return;
      }
      // Placement mode: drop a circle object matching the armed layer's paint
      if (pendingDrop) {
        const id = pendingDrop;
        drops.features.push({
          type: 'Feature',
          geometry: { type: 'Point', coordinates: [e.lngLat.lng, e.lngLat.lat] },
          properties: {
            _r: plain(map.getPaintProperty(id, 'circle-radius'), 5),
            _color: plain(map.getPaintProperty(id, 'circle-color'), '#7fd3ff'),
            _op: plain(map.getPaintProperty(id, 'circle-opacity'), 0.9),
            _sc: plain(map.getPaintProperty(id, 'circle-stroke-color'), '#ffffff'),
            _sw: plain(map.getPaintProperty(id, 'circle-stroke-width'), 1)
          }
        });
        map.getSource('sandbox-drops').setData(drops);
        readout.textContent = `dropped ${drops.features.length} circle(s) — click to add more, Esc to stop`;
        return;
      }
      // Trim mode: the two preview layers have their own independent click listeners below
      // (registered separately, so they still fire even though this generic handler returns
      // here) — this just stops the "clicked lng,lat" readout/clipboard fallback from also
      // running on every click while a trim choice is pending.
      if (pendingTrim) return;
      // Placement mode: sketch a shape straight into projectDoc via addFeature()
      // — straight into projectDoc via addFeature().
      if (pendingSketch) {
        const p = pendingSketch;
        const cursor = roundCoord([e.lngLat.lng, e.lngLat.lat]);
        if (p.mode === 'point') {
          addFeature('points', {
            lng: cursor[0], lat: cursor[1],
            ...(sketchPointLabel.name ? { name: sketchPointLabel.name, dir: sketchPointLabel.dir } : {}),
            style: { ...sketchPointStyle }
          });
          rerenderPasted('points');
          buildPanel();
          readout.textContent = 'added point — click to add more, Esc to stop';
        } else if (p.mode === 'rect') {
          if (!p.corner1) {
            p.corner1 = cursor;
            readout.textContent = 'rectangle: click the opposite corner (Esc to cancel)';
          } else {
            addFeature('polys', {
              geometry: { type: 'Polygon', coordinates: [rectRingFromCorners(p.corner1, cursor)] },
              style: sketchPolyStyle()
            });
            rerenderPasted('polys');
            pendingSketch = null;
            setSketchPreview(null);
            map.getCanvas().style.cursor = '';
            selectLast('polys');
            buildPanel();
            clearArmedButtons();
            readout.textContent = 'added rectangle';
          }
        } else if (p.mode === 'custom-shape') {
          p.points = p.points || [];
          p.points.push(cursor);
          readout.textContent = `custom shape: ${p.points.length} point(s) — click to add more, Enter to finish (3+ needed), Esc to cancel`;
        } else if (p.mode === 'text-area') {
          // Drawn corner to corner, same as a rect — the box IS the annotation's extent, so
          // dragging it out is the only way to size it against what's actually on the map.
          if (!p.corner1) {
            p.corner1 = cursor;
            readout.textContent = 'text area: click the opposite corner (Esc to cancel)';
          } else {
            const a = map.project(p.corner1), b = map.project(cursor);
            // A stray double-click would otherwise make a zero-size box: invisible, and with no
            // area to hit it couldn't be clicked to select afterwards either.
            const mid = map.unproject([(a.x + b.x) / 2, (a.y + b.y) / 2]);
            addFeature('annotations', {
              type: 'text-area',
              position: roundCoord([mid.lng, mid.lat]),
              text: sketchText.text,
              width: Math.round(Math.max(Math.abs(b.x - a.x), 20)),
              height: Math.round(Math.max(Math.abs(b.y - a.y), 14)),
              style: { ...sketchTextStyle }
            });
            rerenderPasted('annotations');
            pendingSketch = null;
            setSketchPreview(null);
            map.getCanvas().style.cursor = '';
            selectLast('annotations');
            buildPanel();
            clearArmedButtons();
            readout.textContent = 'added text area';
          }
        } else if (p.mode === 'extent') {
          if (!p.corner1) {
            p.corner1 = cursor;
            readout.textContent = 'inset extent: click the opposite corner (Esc to cancel)';
          } else {
            const [x1, y1] = p.corner1, [x2, y2] = cursor;
            const coords = [Math.min(x1, x2), Math.min(y1, y2), Math.max(x1, x2), Math.max(y1, y2)]
              .map((n) => +n.toFixed(4));
            projectDoc.inset = projectDoc.inset || {};
            projectDoc.inset.bbox = { ...(projectDoc.inset.bbox || {}), coords };
            delete projectDoc.inset.bbox.refUid;
            delete projectDoc.inset.bbox.geometry;
            // PROJECT_POLY_DEFAULTS is fill:none/stroke:none — an extent with no style is
            // invisible, not just unstyled. The one existing example (test-inset-extent.json)
            // only works because it sets a style explicitly; a drawn one needs the same.
            if (!projectDoc.inset.bbox.style) {
              projectDoc.inset.bbox.style = { stroke: '#ffffff', 'stroke-width': 1.5 };
            }
            insetLiveBbox = false;
            setInsetRectStyle('inset-bbox-fill', 'inset-bbox-outline', projectDoc.inset.bbox.style);
            updateInsetBbox(coords);
            updateProjectJson();
            pendingSketch = null;
            setSketchPreview(null);
            map.getCanvas().style.cursor = '';
            buildPanel();
            clearArmedButtons();
            readout.textContent = 'set inset extent — Clear extent to resume tracking the main map';
          }
        } else if (p.mode === 'straight-arrow') {
          if (!p.start) {
            const snap = snapToTextAreaAnchor(cursor);
            p.start = snap ? roundCoord(snap.ll) : cursor;
            if (snap) p.startRef = `${ensureTextAreaId(snap.box)}:${snap.at}`;
            readout.textContent = snap
              ? 'arrow: locked to the text area — click to set the end point (Esc to cancel)'
              : 'arrow: move to aim, click to set the end point — Esc to cancel';
          } else {
            const endSnap = snapToTextAreaAnchor(cursor);
            addFeature('annotations', {
              type: 'straight-arrow',
              start: p.start, end: endSnap ? roundCoord(endSnap.ll) : cursor,
              ...(p.startRef ? { startRef: p.startRef } : {}),
              ...(endSnap ? { endRef: `${ensureTextAreaId(endSnap.box)}:${endSnap.at}` } : {}),
              style: { ...sketchArrowStyle, ...(p.head ? {} : { 'arrow-size': 0 }) }
            });
            rerenderPasted('annotations');
            pendingSketch = null;
            setSketchPreview(null);
            map.getCanvas().style.cursor = '';
            selectLast('annotations');
            buildPanel();
            clearArmedButtons();
            readout.textContent = 'added arrow — drag its yellow handles to reshape';
          }
        } else if (p.mode === 'curved-arrow') {
          if (!p.start) {
            const snap = snapToTextAreaAnchor(cursor);
            p.start = snap ? roundCoord(snap.ll) : cursor;
            if (snap) p.startRef = `${ensureTextAreaId(snap.box)}:${snap.at}`;
            readout.textContent = 'curved arrow: move to aim, click to set the end point — Esc to cancel';
          } else if (!p.end) {
            const snap = snapToTextAreaAnchor(cursor);
            p.end = snap ? roundCoord(snap.ll) : cursor;
            if (snap) p.endRef = `${ensureTextAreaId(snap.box)}:${snap.at}`;
            readout.textContent = 'curved arrow: move to bow the curve toward where you want it, click to set — Esc to cancel';
          } else {
            // Negated while drawing only: the curve bows away from the 3rd click, not toward
            // it — feels more like "pulling" the belly of the curve. Editing an already-placed
            // curve's bend handle (below) stays direct/un-negated, since a handle you can see
            // and grab should move the way you drag it.
            const bend = roundBend(-bendFromCursor(p.start, p.end, cursor));
            addFeature('annotations', {
              type: 'curved-arrow', start: p.start, end: p.end, bend,
              ...(p.startRef ? { startRef: p.startRef } : {}),
              ...(p.endRef ? { endRef: p.endRef } : {}),
              style: { ...sketchArrowStyle, ...(p.head ? {} : { 'arrow-size': 0 }) }
            });
            rerenderPasted('annotations');
            pendingSketch = null;
            setSketchPreview(null);
            map.getCanvas().style.cursor = '';
            selectLast('annotations');
            buildPanel();
            clearArmedButtons();
            readout.textContent = 'added curved arrow — drag its handles to reshape (blue = bend)';
          }
        }
        return;
      }
      // Click a project feature on the map to select it — the Edit tab's style row then edits
      // that entry. This is the selection model: there's no list to pick from, because a list of
      // shapes can't tell you which shape on the map it means.
      if (debug && !inspectMode) {
        // A box, not a point: arrows are 2px strokes and points are ~5px circles, both of which
        // a single-pixel query misses far more often than it hits.
        const pad = 6;
        const box = [[e.point.x - pad, e.point.y - pad], [e.point.x + pad, e.point.y + pad]];
        const hit = map.queryRenderedFeatures(box)
          .find((f) => f.layer.id.startsWith('project-') && f.properties?._id != null);
        const found = hit ? findItemById(+hit.properties._id) : null;
        if (found) {
          // For a wildcard entry, remember WHICH part was clicked so the style row edits that
          // shape's override rather than restyling all 37 at once.
          if (hit.properties._uid) found.uid = hit.properties._uid;
          selectedItem = found;
          insetSelected = false;
          activeTab = 'edit';
          buildPanel();
          readout.textContent = `selected ${itemSummary(found.kind, pastedArrayFor(found.kind)[found.index])}`;
          return;
        }
        // Clicking empty map clears the selection, so the style row goes back to setting the
        // defaults for the next thing you draw.
        if (selectedItem || insetSelected) { selectedItem = null; insetSelected = false; buildPanel(); }
      }
      const s = `${e.lngLat.lng.toFixed(2)},${e.lngLat.lat.toFixed(2)}`;
      if (inspectMode) {
        const { refUids, rendered } = inspectFeaturesAt(e);
        console.log('[inspect]', { refUids, rendered });
        const parts = [];
        if (refUids.length) parts.push(`refUid: ${refUids.join(', ')}`);
        if (rendered.length) parts.push(`layers: ${rendered.map(f => f.label).join(', ')}`);
        readout.textContent = parts.length ? `${s} — ${parts.join(' | ')} (full properties in console)` : `${s} — nothing here`;
        return;
      }
      readout.textContent = `clicked ${s}`;
      navigator.clipboard?.writeText(s);
    });

    // Live dashed preview for whichever sketch tool is mid-placement — a straight guide line
    // while aiming an arrow's end (or a curved arrow's, before its bend is chosen), the actual
    // bezier shape once a curved arrow's bend is what's being chosen, or the rectangle outline
    // while dragging a rect's or a text area's second corner.
    map.on('mousemove', (e) => {
      if (!pendingSketch) return;
      const p = pendingSketch;
      const cursor = [e.lngLat.lng, e.lngLat.lat];
      if (p.start && p.end && p.mode === 'curved-arrow') {
        setSketchPreview({ type: 'LineString', coordinates: computeCurvePoints(p.start, p.end, -bendFromCursor(p.start, p.end, cursor)) });
      } else if (p.start && (p.mode === 'straight-arrow' || p.mode === 'curved-arrow')) {
        setSketchPreview({ type: 'LineString', coordinates: [p.start, cursor] });
      } else if ((p.mode === 'rect' || p.mode === 'text-area' || p.mode === 'extent') && p.corner1) {
        setSketchPreview({ type: 'LineString', coordinates: rectRingFromCorners(p.corner1, cursor) });
      } else if (p.mode === 'custom-shape' && p.points?.length) {
        setSketchPreview({ type: 'LineString', coordinates: [...p.points, cursor, p.points[0]] });
      }
    });

    // Esc stops placement mode. buildPanel() is needed here (not just disarmDrop's lightweight
    // class toggling) because the trim row's markup is conditional on pendingTrim in the panel
    // template itself, not just a class to flip.
    window.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      disarmDrop();
      if (insetMarkerArmed) { insetMarkerArmed = false; if (insetMap) insetMap.getCanvas().style.cursor = ''; }
      buildPanel();
    });

    // Enter closes a custom-shape sketch (needs 3+ vertices to be a valid polygon)
    window.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      if (pendingSketch?.mode !== 'custom-shape' || (pendingSketch.points?.length ?? 0) < 3) return;
      addFeature('polys', {
        geometry: { type: 'Polygon', coordinates: [[...pendingSketch.points, pendingSketch.points[0]]] },
        style: sketchPolyStyle()
      });
      rerenderPasted('polys');
      pendingSketch = null;
      setSketchPreview(null);
      map.getCanvas().style.cursor = '';
      selectLast('polys');
      buildPanel();
      clearArmedButtons();
      readout.textContent = 'added custom shape';
    });

    // Drag a placed label to move it (when not in placement mode)
    let dragId = null;
    map.on('mouseenter', 'sandbox-labels', () => { if (!pendingLabel) map.getCanvas().style.cursor = 'move'; });
    map.on('mouseleave', 'sandbox-labels', () => { if (!pendingLabel && dragId == null) map.getCanvas().style.cursor = ''; });
    map.on('mousedown', 'sandbox-labels', (e) => {
      if (pendingLabel) return;        // placement mode: let the click drop a new one
      e.preventDefault();               // stop the map from panning
      dragId = e.features[0].properties._id;
      map.getCanvas().style.cursor = 'grabbing';
    });
    map.on('mousemove', (e) => {
      if (dragId == null) return;
      const feat = labelDrops.features.find(f => f.properties._id === dragId);
      if (feat) {
        feat.geometry.coordinates = [e.lngLat.lng, e.lngLat.lat];
        map.getSource('sandbox-labels').setData(labelDrops);
        // Keep any leader line snapped to this label in sync
        const ref = `sandbox-labels:${dragId}`;
        let linked = false;
        for (const rec of llRecords) {
          if (rec.originRef === ref) { rec.origin = feat.geometry.coordinates.slice(); linked = true; }
        }
        if (linked) refreshLeaderLines();
      }
    });
    map.on('mouseup', () => { if (dragId != null) { dragId = null; map.getCanvas().style.cursor = ''; } });

    // Drag a leader-line origin/target handle (label-linked origins move with their label instead)
    map.on('mouseenter', 'leader-line-handles', () => { if (!pendingLL) map.getCanvas().style.cursor = 'move'; });
    map.on('mouseleave', 'leader-line-handles', () => { if (!pendingLL && llDragId == null) map.getCanvas().style.cursor = ''; });
    map.on('mousedown', 'leader-line-handles', (e) => {
      if (pendingLL) return;
      const f = e.features[0];
      if (f.properties._role === 'origin' && f.properties._draggable === false) return;   // drag the label instead
      e.preventDefault();
      llDragId = { recordId: f.properties._lineId, role: f.properties._role };
      map.getCanvas().style.cursor = 'grabbing';
    });
    map.on('mousemove', (e) => {
      if (llDragId == null) return;
      const rec = llRecords.find(r => r.id === llDragId.recordId);
      if (!rec) return;
      const coords = [e.lngLat.lng, e.lngLat.lat];
      if (llDragId.role === 'origin') rec.origin = coords;
      else rec.targets[llDragId.role === 'target1' ? 0 : 1] = coords;
      refreshLeaderLines();
    });
    map.on('mouseup', () => { if (llDragId != null) { llDragId = null; map.getCanvas().style.cursor = ''; } });

    // Trim: click a preview piece to commit it as the target poly's new geometry
    map.on('click', 'sandbox-trim-intersection', () => { if (pendingTrim) commitTrim(pendingTrim.intersectionCoords); });
    map.on('click', 'sandbox-trim-difference', () => { if (pendingTrim) commitTrim(pendingTrim.differenceCoords); });

    // Drag a sketch-placed arrow's start/end/bend handle to reshape it after the fact
    let annDragId = null;   // { index, role: 'start'|'end'|'bend' } into projectDoc.annotations.data
    map.on('mouseenter', 'sandbox-annotation-handles', () => { if (!pendingSketch) map.getCanvas().style.cursor = 'move'; });
    map.on('mouseleave', 'sandbox-annotation-handles', () => { if (!pendingSketch && annDragId == null) map.getCanvas().style.cursor = ''; });
    map.on('mousedown', 'sandbox-annotation-handles', (e) => {
      if (pendingSketch) return;   // placement mode: don't hijack the click
      e.preventDefault();
      const f = e.features[0];
      annDragId = { index: f.properties._i, role: f.properties._role };
      map.getCanvas().style.cursor = 'grabbing';
    });
    map.on('mousemove', (e) => {
      if (annDragId == null) return;
      const ann = pastedArrayFor('annotations')[annDragId.index];
      if (!ann) return;
      const coords = roundCoord([e.lngLat.lng, e.lngLat.lat]);
      if (annDragId.role === 'start' || annDragId.role === 'end') {
        const snap = snapToTextAreaAnchor(coords, ann);
        const refKey = annDragId.role + 'Ref';
        if (snap) {
          ann[refKey] = `${ensureTextAreaId(snap.box)}:${snap.at}`;
          ann[annDragId.role] = roundCoord(snap.ll);
        } else {
          delete ann[refKey];
          ann[annDragId.role] = coords;
        }
      }
      else if (annDragId.role === 'bend') ann.bend = roundBend(bendFromCursor(ann.start, ann.end, coords));
      else if (ann.type === 'text-area') {
        // Resize from the dragged corner, holding the diagonally opposite one still. Done in
        // screen space because width/height are pixels; clamped so a box dragged through itself
        // can't collapse to something too small to grab again.
        const opposite = { nw: 'se', ne: 'sw', se: 'nw', sw: 'ne' }[annDragId.role];
        const fixed = textAreaCornersPx(ann.position, ann.width, ann.height)[opposite];
        const cur = map.project(coords);
        const width = Math.max(Math.abs(cur.x - fixed[0]), 20);
        const height = Math.max(Math.abs(cur.y - fixed[1]), 14);
        const mid = map.unproject([(cur.x + fixed[0]) / 2, (cur.y + fixed[1]) / 2]);
        ann.position = roundCoord([mid.lng, mid.lat]);
        ann.width = Math.round(width);
        ann.height = Math.round(height);
      }
      rerenderPasted('annotations');
    });
    map.on('mouseup', () => { if (annDragId != null) { annDragId = null; map.getCanvas().style.cursor = ''; } });

    // Drag a text area's body to move it. Grabbing anywhere inside the box would normally pan the
    // map, so dragPan is suspended for the duration — and only restored if it was enabled to
    // begin with, since a project's view.lock may have turned it off deliberately.
    let boxDrag = null;   // { index, dx, dy, wasPan } — dx/dy keep the grab point under the cursor
    map.on('mousedown', (e) => {
      if (!debug || pendingSketch || annDragId != null) return;
      const hit = map.queryRenderedFeatures(e.point)
        .find((f) => f.layer.id.startsWith('project-annotation-boxes') && f.properties?._id != null);
      const found = hit ? findItemById(+hit.properties._id) : null;
      const ann = found && pastedArrayFor(found.kind)[found.index];
      if (!ann || ann.type !== 'text-area') return;
      e.preventDefault();
      const c = map.project(ann.position);
      boxDrag = { index: found.index, dx: c.x - e.point.x, dy: c.y - e.point.y, wasPan: map.dragPan.isEnabled() };
      if (boxDrag.wasPan) map.dragPan.disable();
      selectedItem = found;
      map.getCanvas().style.cursor = 'grabbing';
      buildPanel();
    });
    map.on('mousemove', (e) => {
      if (boxDrag == null) return;
      const ann = pastedArrayFor('annotations')[boxDrag.index];
      if (!ann) return;
      const ll = map.unproject([e.point.x + boxDrag.dx, e.point.y + boxDrag.dy]);
      ann.position = roundCoord([ll.lng, ll.lat]);
      rerenderPasted('annotations');
    });
    map.on('mouseup', () => {
      if (boxDrag == null) return;
      if (boxDrag.wasPan) map.dragPan.enable();
      boxDrag = null;
      map.getCanvas().style.cursor = '';
    });

    // Text-area boxes are sized in pixels but stored as a lng/lat ring, so the ring is only
    // correct for the zoom it was computed at — recompute as the zoom changes, or the box would
    // drift out of step with its own text (which MapLibre keeps at a fixed pixel size).
    map.on('zoom', () => {
      if (pastedArrayFor('annotations').some((a) => a.type === 'text-area')) rerenderPasted('annotations');
    });
  </script>
</body>

</html>
