        const iconId = `project-points-icon--${suffix}`;
        const labelId = `project-points-label--${suffix}`;

        const features = group.items.map((pt) => {
          const lng = pt.lng ?? (pt.latlng ? Number(pt.latlng.split(',')[1].trim()) : undefined);
          const lat = pt.lat ?? (pt.latlng ? Number(pt.latlng.split(',')[0].trim()) : undefined);
          const style = mergeProjectStyle(PROJECT_POINT_DEFAULTS, pt.style);
          return {
            type: 'Feature',
            geometry: { type: 'Point', coordinates: [lng, lat] },
            properties: {
              name: pt.name || '',
              _anchor: anchorMap[pt.dir] || 'center',
              _fill: toMapLibreColor(style.fill),
              _radius: style.size,
              _stroke: toMapLibreColor(style.stroke),
              _strokeWidth: style['stroke-width'],
              _opacity: style.opacity,
              _labelFont: style['label-font'],
              _labelSize: style['label-size'],
              _labelColor: toMapLibreColor(style['label-color']),
              _labelHaloColor: toMapLibreColor(style['label-halo-color']),
              _labelHaloWidth: style['label-halo-width'],
              _symbol: resolveProjectSymbol(pt.symbol),
              _symbolSize: style['symbol-size'] ?? 0.5,
              _id: idFor(pt)
            }
          };
        });

        const data = { type: 'FeatureCollection', features };

        if (map.getSource(sourceId)) {
          map.getSource(sourceId).setData(data);
        } else {
          map.addSource(sourceId, { type: 'geojson', data });
          map.addLayer({
            id: circleId,
            type: 'circle',
            source: sourceId,
            filter: ['==', ['get', '_symbol'], ''],
            paint: {
              'circle-color': ['get', '_fill'],
              'circle-radius': ['get', '_radius'],
              'circle-stroke-color': ['get', '_stroke'],
              'circle-stroke-width': ['get', '_strokeWidth'],
              'circle-opacity': ['get', '_opacity']
            }
          }, group.beforeId);
          map.addLayer({
            id: iconId,
            type: 'symbol',
            source: sourceId,
            filter: ['!=', ['get', '_symbol'], ''],
            layout: {
              'icon-image': ['get', '_symbol'],
              'icon-size': ['get', '_symbolSize'],
              'icon-allow-overlap': true,
              'icon-ignore-placement': true,
              'icon-anchor': 'center'
            }
          }, group.beforeId);
          map.addLayer({
            id: labelId,
            type: 'symbol',
            source: sourceId,
            filter: ['!=', ['get', 'name'], ''],
            layout: {
              'text-field': ['get', 'name'],
              'text-anchor': ['get', '_anchor'],
              // Per-point label size is a plain data expression; per-point font goes through
              // PROJECT_LABEL_FONT_EXPR (see above — text-font can't take a per-feature array
              // value directly).
              'text-size': ['get', '_labelSize'],
              'text-font': PROJECT_LABEL_FONT_EXPR,
              // Push the text away from its anchor side so it doesn't sit on top of the point —
              // same scheme as ensureLabelLayer's manually-dropped labels, for visual
              // consistency. Each [x,y] output must be wrapped in ["literal", ...] — a bare
              // array here is parsed as a nested expression (["1", 0] etc.), not a literal value.
              'text-offset': ['match', ['get', '_anchor'],
                'left', ['literal', [0.75, 0]],
                'right', ['literal', [-0.75, 0]],
                'top', ['literal', [0, 0.6]],
                'bottom', ['literal', [0, -0.6]],
                'top-left', ['literal', [0.5, 0.45]],
                'top-right', ['literal', [-0.5, 0.45]],
                'bottom-left', ['literal', [0.5, -0.45]],
                'bottom-right', ['literal', [-0.5, -0.45]],
                ['literal', [0, 0]]]
            },
            paint: {
              'text-color': ['get', '_labelColor'],
              'text-halo-color': ['get', '_labelHaloColor'],
              'text-halo-width': ['get', '_labelHaloWidth']
            }
          }, group.beforeId);
        }

        if (map.getLayer(circleId)) map.setLayoutProperty(circleId, 'visibility', visibility);
        if (map.getLayer(iconId)) map.setLayoutProperty(iconId, 'visibility', visibility);
        if (map.getLayer(labelId)) map.setLayoutProperty(labelId, 'visibility', visibility);
      }
      clearStaleProjectSources('project-points--', liveSources);
    }

    // uid prefix -> the vector source/source-layer it lives in, same sources ?highlight= uses
    // (highlight-admin0/admin1/admin2/land_region/water_region are always rendered at
    // fill-opacity:0/line-opacity:0, so their tiles are already loaded regardless of ?highlight=).
    const SOURCE_BY_LAYER = {
      admin0: { source: 'admin', sourceLayer: 'admin0' },
      admin1: { source: 'admin', sourceLayer: 'admin1' },
      admin2: { source: 'admin', sourceLayer: 'admin2' },
      water_region: { source: 'regions', sourceLayer: 'water_region' },
      land_region: { source: 'regions', sourceLayer: 'land_region' }
    };

    // Pulls a poly's actual geometry out of the loaded pmtiles vector data by uid, instead of
    // requiring hand-authored coordinates — e.g. refUid: ["admin0:ukr"]. Only returns data once
    // the relevant tiles have loaded (see boot()'s re-render on 'idle'). querySourceFeatures can
    // split OR duplicate geometry across tile boundaries (documented MapLibre/Mapbox behavior) —
    // rendering the raw fragments as separate semi-transparent fills double-blends wherever they
    // overlap, so they're unioned into one clean polygon via polygon-clipping before returning.
    // A bare ISO3 with no "layer:" prefix (e.g. "UKR") means a country — same as "admin0:ukr".
    function normalizeRefUid(uid) {
      return uid.includes(':') ? uid : `admin0:${uid.toLowerCase()}`;
    }

    // ── Geometry generalization (simplify) ──────────────────────────────────────
    // A poly/line entry can set "simplify": <tolerance-in-degrees> to reduce vertex count and
    // smooth a jagged outline (e.g. admin1 borders pulled from coarse tiles). Ramer–Douglas–
    // Peucker, implemented inline so there's no CDN dependency (Atlas serves from S3). Tolerance
    // is in lng/lat degrees — 0.01 is light, 0.05 heavy; higher drops more detail.
    function rdp(points, tol) {
      if (points.length < 3) return points;
      const [ax, ay] = points[0], [bx, by] = points[points.length - 1];
      const dx = bx - ax, dy = by - ay, denom = Math.hypot(dx, dy) || 1;
      let dmax = 0, index = 0;
      for (let i = 1; i < points.length - 1; i++) {
        const [px, py] = points[i];
        const d = Math.abs(dx * (ay - py) - (ax - px) * dy) / denom;
        if (d > dmax) { dmax = d; index = i; }
      }
      if (dmax > tol) {
        return rdp(points.slice(0, index + 1), tol).slice(0, -1).concat(rdp(points.slice(index), tol));
      }
      return [points[0], points[points.length - 1]];
    }
    function simplifyRing(ring, tol) {
      // Preserve ring closure; never collapse a polygon below a triangle.
      const closed = ring.length > 1 && ring[0][0] === ring[ring.length - 1][0] && ring[0][1] === ring[ring.length - 1][1];
      const open = closed ? ring.slice(0, -1) : ring;
      let out = rdp(open, tol);
      if (closed) { if (out.length < 3) return ring; out = out.concat([out[0]]); }
      return out;
    }
    function simplifyGeometry(geometry, tol) {
      if (!geometry || !(tol > 0)) return geometry;
      const t = geometry.type, c = geometry.coordinates;
      if (t === 'LineString') return { type: t, coordinates: rdp(c, tol) };
      if (t === 'MultiLineString') return { type: t, coordinates: c.map((l) => rdp(l, tol)) };
      if (t === 'Polygon') return { type: t, coordinates: c.map((r) => simplifyRing(r, tol)) };
      if (t === 'MultiPolygon') return { type: t, coordinates: c.map((poly) => poly.map((r) => simplifyRing(r, tol))) };
      return geometry;
    }

    // "smooth": <iterations> rounds the angles into a flowing curve via Chaikin corner-cutting
    // (each segment's sharp corner is cut, replaced by points at 1/4 and 3/4). 2–3 iterations is
    // usually enough; more = rounder but more vertices. Pair with "simplify" first: simplify kills
    // the jagged noise, smooth rounds what's left. Simplify alone only makes an outline MORE angular.
    function chaikin(points, iterations, closed) {
      let pts = points;
      const isClosed = closed && pts.length > 1 && pts[0][0] === pts[pts.length - 1][0] && pts[0][1] === pts[pts.length - 1][1];
      if (isClosed) pts = pts.slice(0, -1);
      for (let it = 0; it < iterations; it++) {
        if (pts.length < 3) break;
        const out = [], n = pts.length, limit = isClosed ? n : n - 1;
        if (!isClosed) out.push(pts[0]);
        for (let i = 0; i < limit; i++) {
          const p0 = pts[i], p1 = pts[(i + 1) % n];
          out.push([p0[0] * 0.75 + p1[0] * 0.25, p0[1] * 0.75 + p1[1] * 0.25]);
          out.push([p0[0] * 0.25 + p1[0] * 0.75, p0[1] * 0.25 + p1[1] * 0.75]);
        }
        if (!isClosed) out.push(pts[n - 1]);
        pts = out;
      }
      return isClosed ? pts.concat([pts[0]]) : pts;
    }
    function smoothGeometry(geometry, iterations) {
      if (!geometry || !(iterations > 0)) return geometry;
      const t = geometry.type, c = geometry.coordinates;
      if (t === 'LineString') return { type: t, coordinates: chaikin(c, iterations, false) };
      if (t === 'MultiLineString') return { type: t, coordinates: c.map((l) => chaikin(l, iterations, false)) };
      if (t === 'Polygon') return { type: t, coordinates: c.map((r) => chaikin(r, iterations, true)) };
      if (t === 'MultiPolygon') return { type: t, coordinates: c.map((poly) => poly.map((r) => chaikin(r, iterations, true))) };
      return geometry;
    }
    // A refUid may end in "*" to match every uid with that prefix — "admin1:nga_*" is all 37
    // Nigerian states as ONE entry, instead of 37 lines of near-identical data in the file.
    function resolveRefUidGeometry(refUids, mapInstance = map) {
      const coordsList = [];
      for (const rawUid of refUids) {
        const uid = normalizeRefUid(rawUid);
        const s = SOURCE_BY_LAYER[uid.split(':')[0]];
        if (!s || !mapInstance.getSource(s.source)) continue;
        const wildcard = uid.endsWith('*');
        const features = mapInstance.querySourceFeatures(s.source, {
          sourceLayer: s.sourceLayer,
          filter: wildcard
            // No "starts-with" operator in the expression language, so slice the uid to the
            // prefix length and compare — equivalent, and evaluated per feature the same way.
            ? ['==', ['slice', ['get', 'uid'], 0, uid.length - 1], uid.slice(0, -1)]
            : ['==', ['get', 'uid'], uid]
        });
        for (const f of features) coordsList.push(f.geometry.coordinates);
      }
      if (!coordsList.length) return null;
      const unioned = polygonClipping.union(...coordsList);
      return unioned.length ? { type: 'MultiPolygon', coordinates: unioned } : null;
    }

    // querySourceFeatures only sees CURRENTLY LOADED tiles, so a wildcard resolves to whatever
    // happens to be on screen — pan away and shapes vanish, zoom in and most never appear at all.
    // Geometry is therefore accumulated here as tiles load and never dropped, so panning once over
    // a country fills it in permanently. Fragments for a uid are unioned as they arrive.
    const refUidGeomCache = new Map();   // uid -> coordinates (MultiPolygon-shaped)
    function cacheRefUidGeometry(uid, coordsList) {
      if (!coordsList.length) return;
      const prev = refUidGeomCache.get(uid);
      const all = prev ? [prev, ...coordsList] : coordsList;
      const merged = all.length > 1 ? polygonClipping.union(...all) : all[0];
      if (merged?.length) refUidGeomCache.set(uid, merged);
    }

    // Same matching as resolveRefUidGeometry, but WITHOUT the union — each matched feature stays
    // its own geometry. A wildcard like "admin1:nga_*" unioned is just the country outline; kept
    // separate, every state keeps its own stroke and the internal borders render.
    function resolveRefUidParts(refUids, mapInstance = map) {
      const out = [];
      for (const rawUid of refUids) {
        const uid = normalizeRefUid(rawUid);
        const src = SOURCE_BY_LAYER[uid.split(':')[0]];
        if (!src || !mapInstance.getSource(src.source)) continue;
        const wildcard = uid.endsWith('*');
        const features = mapInstance.querySourceFeatures(src.source, {
          sourceLayer: src.sourceLayer,
          filter: wildcard
            ? ['==', ['slice', ['get', 'uid'], 0, uid.length - 1], uid.slice(0, -1)]
            : ['==', ['get', 'uid'], uid]
        });
        // One source feature can arrive as several tile fragments; union per uid so a state
        // split across tiles doesn't render its seams as internal borders.
        const byUid = new Map();
        for (const f of features) {
          const k = f.properties?.uid || uid;
          if (!byUid.has(k)) byUid.set(k, []);
          byUid.get(k).push(f.geometry.coordinates);
        }
        for (const [partUid, parts] of byUid) cacheRefUidGeometry(partUid, parts);
        // Emit from the cache, not just this query, so already-seen shapes survive panning away.
        const prefix = wildcard ? uid.slice(0, -1) : null;
        for (const [cachedUid, coords] of refUidGeomCache) {
          if (prefix ? cachedUid.startsWith(prefix) : cachedUid === uid) {
            out.push({ uid: cachedUid, geometry: { type: 'MultiPolygon', coordinates: coords } });
          }
        }
      }
      return out;
    }

    // Internal borders between the referenced regions, deduped to ONE line each. Built from the RAW
    // tile geometry (querySourceFeatures) — those coords are snapped to the vector-tile grid, so two
    // adjacent regions share exact, bit-identical boundary vertices. (The healed parts from
    // resolveRefUidParts can't be used: polygon-clipping shifts/reorders vertices, so shared edges
    // never match.) Each undirected edge tracks the SET of uids that own it; an edge is an internal
    // border only when ≥2 DIFFERENT uids share it. That excludes exterior edges (one uid) AND the
    // artificial tile-seam cut inside a single region split across tiles (same uid twice). Returns a
    // MultiLineString of just the internal borders — no fill, no outer ring, no doubled strokes.
    function interiorBordersFromRefUids(refUids, mapInstance = map) {
      const q = (v) => v.toFixed(6);
      const edgeKey = (a, b) => {
        const ka = q(a[0]) + ',' + q(a[1]), kb = q(b[0]) + ',' + q(b[1]);
        return ka < kb ? ka + '|' + kb : kb + '|' + ka;
      };
      const edges = new Map(); // key -> { seg:[a,b], uids:Set }
      const addRing = (ring, uid) => {
        for (let i = 0; i < ring.length - 1; i++) {
          const a = ring[i], b = ring[i + 1];
          const k = edgeKey(a, b);
          let rec = edges.get(k);
          if (!rec) { rec = { seg: [a, b], uids: new Set() }; edges.set(k, rec); }
          rec.uids.add(uid);
        }
      };
      const addGeom = (geom, uid) => {
        if (!geom) return;
        if (geom.type === 'Polygon') geom.coordinates.forEach((r) => addRing(r, uid));
        else if (geom.type === 'MultiPolygon') geom.coordinates.forEach((p) => p.forEach((r) => addRing(r, uid)));
      };
      for (const rawUid of refUids) {
        const uid = normalizeRefUid(rawUid);
        const s = SOURCE_BY_LAYER[uid.split(':')[0]];
        if (!s || !mapInstance.getSource(s.source)) continue;
        const wildcard = uid.endsWith('*');
        const features = mapInstance.querySourceFeatures(s.source, {
          sourceLayer: s.sourceLayer,
          filter: wildcard
            ? ['==', ['slice', ['get', 'uid'], 0, uid.length - 1], uid.slice(0, -1)]
            : ['==', ['get', 'uid'], uid]
        });
        for (const f of features) addGeom(f.geometry, f.properties?.uid || uid);
      }
      const lines = [];
      for (const rec of edges.values()) if (rec.uids.size >= 2) lines.push(rec.seg);
      return lines.length ? { type: 'MultiLineString', coordinates: lines } : null;
    }

    // Feature inspector: what's at a click point, across every layer. The visible basemap fill
    // (admin0-fill etc.) has no "uid" property — that lives on a SEPARATE, invisible source
    // (SOURCE_BY_LAYER, same one resolveRefUidGeometry already reads) whose own render layer is
    // filtered to show nothing by default (it's only turned on by ?highlight=). So refUids are
    // looked up separately here: querySourceFeatures (bypasses that filter) + a bbox check
    // (reusing geometryBbox — a full point-in-polygon test is overkill for a debug tool) against
    // every loaded admin0/1/2/region feature.
    function refUidsAt(lngLat) {
      const found = [];
      for (const s of Object.values(SOURCE_BY_LAYER)) {
        if (!map.getSource(s.source)) continue;
        for (const f of map.querySourceFeatures(s.source, { sourceLayer: s.sourceLayer })) {
          const uid = f.properties?.uid;
          const bbox = uid && geometryBbox(f.geometry);
          if (bbox && lngLat[0] >= bbox[0] && lngLat[0] <= bbox[2] && lngLat[1] >= bbox[1] && lngLat[1] <= bbox[3]) {
            found.push(uid);
          }
        }
      }
      return [...new Set(found)];
    }
    function inspectFeaturesAt(e) {
      const seen = new Set();
      const found = [];
      for (const f of map.queryRenderedFeatures(e.point)) {
        const label = f.properties?.name || f.properties?.NAME_EN || f.properties?.shapeName || f.layer.id;
        const key = `${f.layer.id}:${label}`;
        if (seen.has(key)) continue;
        seen.add(key);
        found.push({ layer: f.layer.id, label, properties: f.properties });
      }
      const refUids = refUidsAt([e.lngLat.lng, e.lngLat.lat]);
      return { refUids, rendered: found };
    }

    // Project-file view.hideFeatures: excludes specific features from a named layer by an
    // arbitrary property/value match you supply directly — e.g. { layer: "admin0-fill",
    // property: "shapeGroup", values: ["UKR"] }. Different layers backed by different pmtiles
    // sources use different property schemas entirely (e.g. admin0-fill's basemap.pmtiles data
    // has no "uid" property at all — it's shapeGroup/shapeName/shapeType, ISO3 codes, unrelated
    // to the "admin0:ukr"-style uid property the separate admin0 pmtiles source used by
    // ?highlight=/refUid has), so there's no reliable automatic uid->property mapping across
    // them — you name the layer/property/value(s) yourself. Unlike view.hide (which hides a
    // whole layer for every feature), this leaves every other feature in that layer alone.
    // Merges into any filter the layer already has, rather than replacing it.
    function hideFeatures(rules) {
      for (const rule of (rules || [])) {
        if (!rule?.layer || !rule.property || !map.getLayer(rule.layer)) continue;
        const values = Array.isArray(rule.values) ? rule.values : [rule.value];
        const notInFilter = ['!', ['in', ['get', rule.property], ['literal', values]]];
        const existing = map.getFilter(rule.layer);
        map.setFilter(rule.layer, existing ? ['all', existing, notInFilter] : notInFilter);
      }
    }

    function ensureProjectPolysLayer(section) {
      const liveSources = new Set();
      const visibility = section.show === false ? 'none' : 'visible';
      const polygonTypes = ['Polygon', 'MultiPolygon'];
      const lineTypes = ['LineString', 'MultiLineString'];

      for (const [anchorKey, anchorGroup] of groupDataByAnchor(section.data, 'polys')) {
        // Sub-group by resolved dash pattern — line-dasharray can't be a per-feature paint
        // expression (see toDashArray() above), so entries with a different dash each need their
        // own dedicated layer-set, on top of the anchor grouping above.
        // Group by dash AND zoom range: line-dasharray can't be a per-feature expression, and
        // minzoom/maxzoom are layer-level — so entries differing in either need their own layer
        // set. This is what makes the "two entries, same geometry, different dash, each gated to a
        // zoom band" pattern work (the clean way to change a line effect by zoom).
        const dashGroups = new Map(); // key -> { dash, minzoom, maxzoom, fillLayerOpacity, lineLayerOpacity, items: [] }
        for (const item of anchorGroup.items) {
          const style = mergeProjectStyle(PROJECT_POLY_DEFAULTS, item.style);
          const dash = toDashArray(style['stroke-dash']);
          // fill-layer-opacity / line-layer-opacity are LAYER-level (MapLibre v6): applied once to
          // the whole layer, so overlapping fills/lines read as ONE flat surface instead of
          // accumulating per-feature. They can't be per-feature ['get'] paint, so entries differing
          // in them need their own layer set — fold into the group key.
          const flo = style['fill-layer-opacity'], llo = style['line-layer-opacity'];
          const dashKey = JSON.stringify([dash, item.minzoom ?? null, item.maxzoom ?? null, flo ?? null, llo ?? null]);
          if (!dashGroups.has(dashKey)) dashGroups.set(dashKey, { dash, minzoom: item.minzoom, maxzoom: item.maxzoom, fillLayerOpacity: flo, lineLayerOpacity: llo, items: [] });
          dashGroups.get(dashKey).items.push(item);
        }

        for (const [dashKey, dashGroup] of dashGroups) {
          const suffix = anchorSuffix(anchorKey) + '--' + anchorSuffix(dashKey);
          const sourceId = `project-polys--${suffix}`;
        liveSources.add(sourceId);
          const fillId = `project-polys-fill--${suffix}`;
          const patternId = `project-polys-pattern--${suffix}`;
          const outlineId = `project-polys-outline--${suffix}`;
          const lineId = `project-polys-line--${suffix}`;
          const dashPaint = dashGroup.dash ? { 'line-dasharray': dashGroup.dash } : {};
          // 'dotted' ([0,2]) is a zero-length dash + gap — with the default butt line-cap that's
          // literally invisible (no width to render). Round caps are what actually turn a
          // zero-length dash into a visible dot, so any non-solid dash gets them (harmless for
          // 'dashed' too — just rounds the dash ends instead of square).
          const dashLayout = dashGroup.dash ? { 'line-cap': 'round' } : {};
          // Per-entry zoom gating (item.minzoom/maxzoom → layer minzoom/maxzoom), applied to all
          // four sub-layers so the whole entry appears/disappears together at the zoom threshold.
          const zoomProps = {};
          if (dashGroup.minzoom != null) zoomProps.minzoom = dashGroup.minzoom;
          if (dashGroup.maxzoom != null) zoomProps.maxzoom = dashGroup.maxzoom;
          // Layer-level opacity (v6) — opt-in via style keys. fill → fill/pattern layers,
          // line → outline/line layers. Flattens overlaps to one surface.
          const fillLayerPaint = dashGroup.fillLayerOpacity != null ? { 'fill-layer-opacity': dashGroup.fillLayerOpacity } : {};
          const lineLayerPaint = dashGroup.lineLayerOpacity != null ? { 'line-layer-opacity': dashGroup.lineLayerOpacity } : {};

          const features = dashGroup.items.flatMap((item) => {
            // A wildcard entry can carry per-uid overrides, so one "all admin1" line can still
            // have Lagos red and the rest grey — only the customized ones appear in the file.
            const propsFor = (uid) => {
              const style = mergeProjectStyle(
                mergeProjectStyle(PROJECT_POLY_DEFAULTS, item.style),
                uid ? item.overrides?.[uid] : null);
              return {
                _fill: toMapLibreColor(style.fill),
                _fillOpacity: style['fill-opacity'],
                _stroke: toMapLibreColor(style.stroke),
                _strokeWidth: style['stroke-width'],
                // 'stroke-opacity' is the SVG-natural name for the outline/line opacity; 'opacity'
                // is the original key and stays as the fallback so existing files are unchanged.
                _opacity: style['stroke-opacity'] ?? style.opacity,
                _pattern: resolveProjectPattern(style.pattern),
                _patternOpacity: style['pattern-opacity'],
                _lineJoin: style['line-join'],
                _id: idFor(item),
                _uid: uid || ''
              };
            };
            // Optional per-entry generalization: "simplify" (RDP, kills noise) then "smooth"
            // (Chaikin corner-cutting, rounds into a flowing curve).
            const simp = (g) => {
              g = item.simplify ? simplifyGeometry(g, item.simplify) : g;
              g = item.smooth ? smoothGeometry(g, item.smooth) : g;
              return g;
            };
            if (item.geometry) return [{ type: 'Feature', geometry: simp(item.geometry), properties: propsFor() }];
            if (!Array.isArray(item.refUid)) return [];
            // "innerBorders": render the region as one clean shape PLUS only the internal borders
            // between the listed regions, each drawn once (deduped) — no doubled per-province
            // outlines. Fill + outer ring come from the union (clean, single stroke); the internal
            // mesh is a separate line that can be styled apart via inner-stroke / inner-stroke-width
            // / inner-opacity (falling back to stroke / stroke-width / opacity). Set fill-opacity 0
            // and stroke-width 0 in style to get the internal division lines ONLY.
            if (item.innerBorders) {
              const feats = [];
              const fillGeom = resolveRefUidGeometry(item.refUid);
              if (fillGeom) feats.push({ type: 'Feature', geometry: simp(fillGeom), properties: propsFor() });
              const mesh = interiorBordersFromRefUids(item.refUid);
              if (mesh) {
                const s = mergeProjectStyle(PROJECT_POLY_DEFAULTS, item.style);
                feats.push({ type: 'Feature', geometry: simp(mesh), properties: {
                  ...propsFor(),
                  _stroke: toMapLibreColor(item.style?.['inner-stroke'] ?? s.stroke),
                  _strokeWidth: item.style?.['inner-stroke-width'] ?? s['stroke-width'],
                  _opacity: item.style?.['inner-opacity'] ?? s['stroke-opacity'] ?? s.opacity
                } });
              }
              return feats;
            }
            // Wildcards stay as separate features so their internal borders survive; an explicit
            // list of uids is unioned into one dissolved shape by default. "merge": false overrides
            // that for an explicit list too — each referenced uid keeps its own geometry and stroke
            // (no cross-uid union), so the internal borders between the listed regions render.
            const keepSeparate = item.merge === false || item.refUid.some((u) => String(u).endsWith('*'));
            if (keepSeparate) {
              return resolveRefUidParts(item.refUid)
                .map(({ uid, geometry }) => ({ type: 'Feature', geometry: simp(geometry), properties: propsFor(uid) }));
            }
            const geometry = resolveRefUidGeometry(item.refUid);
            return geometry ? [{ type: 'Feature', geometry: simp(geometry), properties: propsFor() }] : [];
          });

          const data = { type: 'FeatureCollection', features };

          if (map.getSource(sourceId)) {
            map.getSource(sourceId).setData(data);
          } else {
            map.addSource(sourceId, { type: 'geojson', data });
            map.addLayer({
              id: fillId,
              type: 'fill',
              source: sourceId,
              ...zoomProps,
              filter: ['in', ['geometry-type'], ['literal', polygonTypes]],
              paint: {
                'fill-color': ['get', '_fill'],
                'fill-opacity': ['get', '_fillOpacity'],
                ...fillLayerPaint
              }
            }, anchorGroup.beforeId);
            map.addLayer({
              id: outlineId,
              type: 'line',
              source: sourceId,
              ...zoomProps,
              filter: ['in', ['geometry-type'], ['literal', polygonTypes]],
              layout: { ...dashLayout, 'line-join': ['get', '_lineJoin'] },
              paint: {
                'line-color': ['get', '_stroke'],
                'line-width': ['get', '_strokeWidth'],
                'line-opacity': ['get', '_opacity'],
                ...dashPaint,
                ...lineLayerPaint
              }
            }, anchorGroup.beforeId);
            // Sits directly above the fill (and below the outline/line just added) so a poly's
            // own stroke still draws on top of its pattern, same stacking as the debug panel's
            // fill -> bg -> pattern-overlay layering.
            map.addLayer({
              id: patternId,
              type: 'fill',
              source: sourceId,
              ...zoomProps,
              filter: ['all', ['in', ['geometry-type'], ['literal', polygonTypes]], ['!=', ['get', '_pattern'], '']],
              paint: {
                'fill-pattern': ['get', '_pattern'],
                'fill-opacity': ['get', '_patternOpacity'],
                ...fillLayerPaint
              }
            }, outlineId);
            map.addLayer({
              id: lineId,
              type: 'line',
              source: sourceId,
              ...zoomProps,
              filter: ['in', ['geometry-type'], ['literal', lineTypes]],
              layout: { ...dashLayout, 'line-join': ['get', '_lineJoin'] },
              paint: {
                'line-color': ['get', '_stroke'],
                'line-width': ['get', '_strokeWidth'],
                'line-opacity': ['get', '_opacity'],
                ...dashPaint,
                ...lineLayerPaint
              }
            }, anchorGroup.beforeId);
          }

          [fillId, patternId, outlineId, lineId].forEach((id) => {
            map.setLayoutProperty(id, 'visibility', visibility);
          });
        }
      }
      clearStaleProjectSources('project-polys--', liveSources);
    }

    // Longitude degrees shrink relative to latitude degrees away from the equator
    // (roughly by cos(latitude)) in the map's Mercator projection. Angles and
    // perpendicular offsets computed from raw lng/lat deltas as if they were a flat
    // Cartesian plane come out skewed once rendered — these helpers correct for that
    // by scaling the longitude delta by cos(latitude) before doing angle math, then
    // converting back to lng/lat when producing coordinates.
    function projectedDelta(a, b) {
      const lat = (a[1] + b[1]) / 2;
      const scale = Math.cos(lat * Math.PI / 180) || 1e-6;
      return { dx: (b[0] - a[0]) * scale, dy: b[1] - a[1], scale };
    }

    function bearing(a, b) {
      const { dx, dy } = projectedDelta(a, b);
      return Math.atan2(dy, dx);
    }

    function sampleQuadraticBezier(p0, p1, p2, n) {
      const pts = [];
      for (let i = 0; i <= n; i++) {
        const t = i / n;
        const mt = 1 - t;
        pts.push([
          mt * mt * p0[0] + 2 * mt * t * p1[0] + t * t * p2[0],
          mt * mt * p0[1] + 2 * mt * t * p1[1] + t * t * p2[1]
        ]);
      }
      return pts;
    }

    // Perpendicular to (dx, dy) in projected space is (-dy, dx); convert back to a lng/lat
    // delta by dividing the longitude component by the same scale. Positive bend bows the
    // curve to the left of start->end (facing from start to end); negative bows it right.
    function curveControlPoint(start, end, bend) {
      const mx = (start[0] + end[0]) / 2;
      const my = (start[1] + end[1]) / 2;
      const { dx, dy, scale } = projectedDelta(start, end);
      return [mx + (-dy * bend) / scale, my + dx * bend];
    }

    function computeCurvePoints(start, end, bend) {
      return sampleQuadraticBezier(start, curveControlPoint(start, end, bend), end, 32);
    }

    // Inverse of curveControlPoint: given where the user dragged the control point/cursor to,
    // find the bend value whose control point falls closest to it (projection onto the
    // perpendicular bisector — the only axis a control point can actually move along).
    function bendFromCursor(start, end, cursor) {
      const mx = (start[0] + end[0]) / 2;
      const my = (start[1] + end[1]) / 2;
      const { dx, dy, scale } = projectedDelta(start, end);
      const px = -dy / scale, py = dx;
      const rx = cursor[0] - mx, ry = cursor[1] - my;
      const denom = px * px + py * py;
      return denom ? (rx * px + ry * py) / denom : 0;
    }

    // "<" style open chevron, vertex exactly at `tip` — no filled shape.
    function computeArrowheadChevron(tip, angleRad, size) {
      const scale = Math.cos(tip[1] * Math.PI / 180) || 1e-6;
      const spread = 0.45; // radians, ~26 degrees off the shaft direction on each side
      const backLeftAngle = angleRad + Math.PI - spread;
      const backRightAngle = angleRad + Math.PI + spread;
      const left = [tip[0] + (size * Math.cos(backLeftAngle)) / scale, tip[1] + size * Math.sin(backLeftAngle)];
      const right = [tip[0] + (size * Math.cos(backRightAngle)) / scale, tip[1] + size * Math.sin(backRightAngle)];
      return { type: 'MultiLineString', coordinates: [[left, tip], [tip, right]] };
    }

    // A text area's width/height are PIXELS, not degrees — the box is a piece of chrome, so it
    // should hold its size on screen like its own text does rather than growing as you zoom in.
    // That means the ring is computed in screen space and unprojected, and the layer has to be
    // rebuilt whenever the zoom changes (see the map.on('zoom') below).
    function textAreaCornersPx(position, width, height) {
      const c = map.project(position);
      const w = (width ?? 120) / 2, h = (height ?? 40) / 2;
      return {
        sw: [c.x - w, c.y + h], se: [c.x + w, c.y + h],
        ne: [c.x + w, c.y - h], nw: [c.x - w, c.y - h]
      };
    }
    // The nine points a line or arrow can lock onto: four corners, four edge midpoints, center.
    function textAreaAnchors(ann) {
      const c = textAreaCornersPx(ann.position, ann.width, ann.height);
      const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
      const px = {
        nw: c.nw, ne: c.ne, se: c.se, sw: c.sw,
        n: mid(c.nw, c.ne), e: mid(c.ne, c.se), s: mid(c.sw, c.se), w: mid(c.nw, c.sw),
        c: mid(c.nw, c.se)
      };
      const out = {};
      for (const [k, pt] of Object.entries(px)) { const ll = map.unproject(pt); out[k] = [ll.lng, ll.lat]; }
      return out;
    }
    // A locked end is stored as "<text area id>:<anchor>", e.g. "text-1:ne". Referencing by id
    // rather than array position so the link survives reordering and stays readable in the file.
    function resolveAnchorRef(ref) {
      if (typeof ref !== 'string') return null;
      const [id, at] = ref.split(':');
      const box = pastedArrayFor('annotations').find((a) => a.type === 'text-area' && a.id === id);
      return box ? (textAreaAnchors(box)[at] || null) : null;
    }
    // Resolved every render, so moving or resizing a box drags whatever is locked to it. Falls
    // back to the stored coords if the box has since been deleted — the arrow stays put rather
    // than vanishing.
    function connectorEnds(ann) {
      return {
        start: resolveAnchorRef(ann.startRef) || ann.start,
        end: resolveAnchorRef(ann.endRef) || ann.end
      };
    }
    function ensureTextAreaId(box) {
      if (box.id) return box.id;
      const used = new Set(pastedArrayFor('annotations').map((a) => a.id).filter(Boolean));
      let n = 1;
      while (used.has(`text-${n}`)) n++;
      box.id = `text-${n}`;
      return box.id;
    }
    // Nearest lockable anchor within grabbing distance, in pixels so it feels the same at any zoom.
    function snapToTextAreaAnchor(coords, exclude) {
      const cur = map.project(coords);
      let best = null;
      for (const a of pastedArrayFor('annotations')) {
        if (a.type !== 'text-area' || a === exclude) continue;
        for (const [at, ll] of Object.entries(textAreaAnchors(a))) {
          const q = map.project(ll);
          const d = Math.hypot(q.x - cur.x, q.y - cur.y);
          if (d <= 12 && (!best || d < best.d)) best = { d, box: a, at, ll };
        }
      }
      return best;
    }

    function computeRectangle(position, width, height) {
      const c = textAreaCornersPx(position, width, height);
      const ll = (pt) => { const p = map.unproject(pt); return [p.lng, p.lat]; };
      return [[ll(c.sw), ll(c.se), ll(c.ne), ll(c.nw), ll(c.sw)]];
    }

    // Same rectangle shape as computeRectangle, but from two opposite corners (sketch tool) —
    // returns a plain ring, not GeoJSON-Polygon-wrapped, for reuse as both a Polygon's
    // coordinates[0] and a plain preview LineString.
    function rectRingFromCorners([x1, y1], [x2, y2]) {
      const w = Math.min(x1, x2), e = Math.max(x1, x2), s = Math.min(y1, y2), n = Math.max(y1, y2);
      return [[w, s], [e, s], [e, n], [w, n], [w, s]];
    }

    function ensureProjectAnnotationsLayer(section) {
      const liveSources = new Set();
      const visibility = section.show === false ? 'none' : 'visible';

      for (const [anchorKey, anchorGroup] of groupDataByAnchor(section.data, 'annotations')) {
        const anchorSuf = anchorSuffix(anchorKey);
        const boxesSourceId = `project-annotation-boxes--${anchorSuf}`;
        const boxesId = boxesSourceId;
        const boxesOutlineId = `project-annotation-boxes-outline--${anchorSuf}`;
        const textId = `project-annotation-text--${anchorSuf}`;

        const boxFeatures = [];
        // straight-arrow/curved-arrow entries are sub-grouped by resolved dash pattern —
        // line-dasharray can't be a per-feature paint expression (see toDashArray() above), so
        // each distinct pattern needs its own dedicated lines layer. Boxes stay one shared layer
        // per anchor, but text is sub-grouped by font for the same reason as dash: text-font takes
        // a literal font stack, not a per-feature expression. Size/color/halo ARE data-driven,
        // so they vary freely within a font group.
        const dashGroups = new Map(); // dash key -> { dash, items: [] }
        // Keyed by font AND anchor. text-font must be a literal (see PROJECT_LABEL_FONT_EXPR),
        // and text-anchor is treated the same way here rather than trusted as a per-feature
        // expression — one layer per combination, each with both set as plain values.
        // Keyed by font+anchor AND letter-spacing+line-height — the latter must be literal per
        // layer (MapLibre won't read them per-feature), so they belong in the group key.
        const fontGroups = new Map();
        const groupFor = (font, anchor, ls, lh) => {
          const key = `${font}::${anchor}::${ls}::${lh}`;
          if (!fontGroups.has(key)) fontGroups.set(key, { font, anchor, ls, lh, features: [] });
          return fontGroups.get(key);
        };

        anchorGroup.items.forEach((ann) => {
          if (ann.type === 'straight-arrow' || ann.type === 'curved-arrow') {
            const style = mergeProjectStyle(PROJECT_ANNOTATION_LINE_DEFAULTS, ann.style);
            const dash = toDashArray(style['stroke-dash']);
            const dashKey = JSON.stringify(dash);
            if (!dashGroups.has(dashKey)) dashGroups.set(dashKey, { dash, items: [] });
            dashGroups.get(dashKey).items.push(ann);
            // An arrow can carry its own `label` instead of needing a separate text-area hand-
            // aligned to its tail. It rides the same font-grouped text layers as text-areas, so
            // it takes the identical label-* style keys.
            if (ann.label) {
              const { start: lStart, end: lEnd } = connectorEnds(ann);
              const pts = ann.type === 'curved-arrow'
                ? computeCurvePoints(lStart, lEnd, ann.bend ?? 0.25)
                : [lStart, lEnd];
              const at = style['label-anchor'];
              const pos = at === 'end' ? pts[pts.length - 1]
                : at === 'middle' ? pts[Math.floor(pts.length / 2)]
                : pts[0];
              const font = style['label-font'];
              groupFor(font, 'center', style['label-letter-spacing'], style['label-line-height']).features.push(labelTextFeature(pos, ann.label, style, ann.style, idFor(ann)));
            }
          } else if (ann.type === 'text-area') {
            const style = mergeProjectStyle(PROJECT_ANNOTATION_BOX_DEFAULTS, ann.style);
            boxFeatures.push({
              type: 'Feature',
              geometry: { type: 'Polygon', coordinates: computeRectangle(ann.position, ann.width, ann.height) },
              properties: {
                _id: idFor(ann),
                _fill: toMapLibreColor(style.fill),
                _fillOpacity: style['fill-opacity'],
                _stroke: toMapLibreColor(style.stroke),
                _strokeWidth: style['stroke-width'],
                _opacity: style.opacity
              }
            });
            // For left/right the text is anchored to that edge of the box (inset by a small
            // pad) rather than to its center — done in screen space because width/height are
            // pixels. 'center' keeps the original center point.
            const align = style.align === 'left' || style.align === 'right' ? style.align : 'center';
            let textPos = ann.position;
            if (align !== 'center') {
              const c = map.project(ann.position);
              const halfW = (ann.width ?? 120) / 2;
              const padPx = 6;
              const x = align === 'left' ? c.x - halfW + padPx : c.x + halfW - padPx;
              const ll = map.unproject([x, c.y]);
              textPos = [ll.lng, ll.lat];
            }
            const font = style['label-font'];
            groupFor(font, align, style['label-letter-spacing'], style['label-line-height']).features.push(labelTextFeature(textPos, ann.text, style, ann.style, idFor(ann), align));
          }
        });

        const setSourceData = (id, features) => {
          const data = { type: 'FeatureCollection', features };
          if (map.getSource(id)) map.getSource(id).setData(data);
          else map.addSource(id, { type: 'geojson', data });
        };

        liveSources.add(boxesSourceId);
        setSourceData(boxesSourceId, boxFeatures);

        if (!map.getLayer(boxesId)) {
          map.addLayer({
            id: boxesId, type: 'fill', source: boxesSourceId,
            paint: { 'fill-color': ['get', '_fill'], 'fill-opacity': ['get', '_fillOpacity'] }
          }, anchorGroup.beforeId);
          map.addLayer({
            id: boxesOutlineId, type: 'line', source: boxesSourceId,
            paint: { 'line-color': ['get', '_stroke'], 'line-width': ['get', '_strokeWidth'], 'line-opacity': ['get', '_opacity'] }
          }, anchorGroup.beforeId);
        }

        [boxesId, boxesOutlineId].forEach((id) => {
          map.setLayoutProperty(id, 'visibility', visibility);
        });

        for (const [groupKey, { font, anchor, ls, lh, features }] of fontGroups) {
          const fontTextId = `${textId}--${anchorSuffix(groupKey)}`;
          liveSources.add(fontTextId);
          setSourceData(fontTextId, features);
          if (!map.getLayer(fontTextId)) {
            map.addLayer({
              id: fontTextId, type: 'symbol', source: fontTextId,
              layout: {
                'text-field': ['get', '_text'],
                'text-max-width': ['get', '_maxWidth'],
                'text-justify': ['get', '_justify'],
                // text-justify alone only justifies lines INSIDE the block — the block itself
                // stays centered on its point. Anchoring it is what actually moves the text to
                // the box's left or right edge.
                'text-anchor': anchor,
                'text-size': ['get', '_textSize'],
                // ems, so it tracks label-size — nudges a label clear of its own arrow shaft.
                'text-offset': ['get', '_offset'],
                'text-font': [font],
                'text-letter-spacing': ls,
                'text-line-height': lh
              },
              paint: {
                'text-color': ['get', '_textColor'],
                'text-halo-color': ['get', '_haloColor'],
                'text-halo-width': ['get', '_haloWidth']
              }
            }, anchorGroup.beforeId);
          }
          map.setLayoutProperty(fontTextId, 'visibility', visibility);
        }
        // A font layer built on a previous render keeps its old features unless emptied —
        // setSourceData only touches groups present this time, so text whose font was edited
        // away would otherwise keep rendering from the layer it used to live in.
        const liveTextIds = new Set([...fontGroups.keys()].map((k) => `${textId}--${anchorSuffix(k)}`));
        for (const l of map.getStyle().layers) {
          if (l.id.startsWith(`${textId}--`) && !liveTextIds.has(l.id)) {
            map.getSource(l.id)?.setData({ type: 'FeatureCollection', features: [] });
          }
        }

        for (const [dashKey, dashGroup] of dashGroups) {
          const suffix = anchorSuf + '--' + anchorSuffix(dashKey);
          const linesId = `project-annotation-lines--${suffix}`;
          liveSources.add(linesId);

          const lineFeatures = dashGroup.items.flatMap((ann) => {
            const style = mergeProjectStyle(PROJECT_ANNOTATION_LINE_DEFAULTS, ann.style);
            const { start: aStart, end: aEnd } = connectorEnds(ann);
            const points = ann.type === 'curved-arrow'
              ? computeCurvePoints(aStart, aEnd, ann.bend ?? 0.25)
              : [aStart, aEnd];
            const tip = points[points.length - 1];
            const angle = bearing(points[points.length - 2], tip);
            const arrowSize = style['arrow-size'];
            const props = {
              _id: idFor(ann),
              _stroke: toMapLibreColor(style.stroke),
              _strokeWidth: style['stroke-width'],
              _opacity: style.opacity
            };
            // arrow-size 0 means "no head" — a plain line/callout. The chevron is left out
            // entirely rather than built at zero length: a zero-length segment is invisible under
            // the default butt cap, but dashed/dotted strokes switch the layer to round caps
            // (see the line-cap note below), where it would render as a blob on the tip.
            return arrowSize > 0
              ? [
                  { type: 'Feature', geometry: { type: 'LineString', coordinates: points }, properties: props },
                  { type: 'Feature', geometry: computeArrowheadChevron(tip, angle, arrowSize), properties: props }
                ]
              : [{ type: 'Feature', geometry: { type: 'LineString', coordinates: points }, properties: props }];
          });

          const data = { type: 'FeatureCollection', features: lineFeatures };
          if (map.getSource(linesId)) {
            map.getSource(linesId).setData(data);
          } else {
            map.addSource(linesId, { type: 'geojson', data });
            map.addLayer({
              id: linesId, type: 'line', source: linesId,
              // 'dotted' ([0,2]) is a zero-length dash + gap — invisible with the default butt
              // line-cap (no width to render); round caps are what make a zero-length dash show
              // as a visible dot. Harmless for 'dashed' too — just rounds the dash ends.
              layout: dashGroup.dash ? { 'line-cap': 'round' } : {},
              paint: {
                'line-color': ['get', '_stroke'], 'line-width': ['get', '_strokeWidth'], 'line-opacity': ['get', '_opacity'],
                ...(dashGroup.dash ? { 'line-dasharray': dashGroup.dash } : {})
              }
            }, anchorGroup.beforeId);
          }
          map.setLayoutProperty(linesId, 'visibility', visibility);
        }
      }
      // Same stale-group problem as points/polys: an annotation deleted out of the last
      // group in its anchor/dash/font bucket would otherwise linger on the map.
      for (const pre of ['project-annotation-boxes--', 'project-annotation-text--', 'project-annotation-lines--']) {
        clearStaleProjectSources(pre, liveSources);
      }
    }

    // ── Frame overlays (note / legend) ───────────────────────────────────────────
    // HTML blocks anchored to the map-frame corners, not MapLibre layers, so text stays crisp.
    // Fully torn down and rebuilt each pass so switching ?project= never orphans DOM.
    const FO_POSITIONS = ['top-left', 'top-right', 'bottom-left', 'bottom-right'];

    function renderFrameOverlays() {
      const mapEl = document.getElementById('map');
      mapEl.querySelectorAll('.frame-overlay-corner').forEach((n) => n.remove());

      // Collect blocks by resolved corner, in a stable order (legend above the source note).
      const byCorner = new Map();
      const add = (cfg, node) => {
        if (!cfg || cfg.show === false || !node) return;
        const pos = FO_POSITIONS.includes(cfg.position) ? cfg.position : 'bottom-left';
        if (!byCorner.has(pos)) byCorner.set(pos, []);
        byCorner.get(pos).push(node);
      };
      if (showLegend) add(projectDoc.legend, projectDoc.legend ? renderLegendOverlay(projectDoc.legend) : null);
      add(projectDoc.note, projectDoc.note ? renderNoteOverlay(projectDoc.note) : null);

      for (const [pos, nodes] of byCorner) {
        const corner = document.createElement('div');
        corner.className = `frame-overlay-corner fo-${pos}`;
        nodes.forEach((n) => corner.appendChild(n));
        mapEl.appendChild(corner);
      }
      // Align to the crop box when export mode is on (no-op otherwise).
      repositionFrameOverlaysForExport();
    }

    // Optional per-block visual overrides on top of the .frame-overlay defaults. Project-friendly
    // key names map to CSS on the box; a bare number gets px where a length is expected. Same
    // spirit as the inline `style` objects on points/polys — set only what you want to change.
    const FO_STYLE_MAP = {
      background: 'background', color: 'color', border: 'border', radius: 'borderRadius',
      font: 'fontFamily', 'font-size': 'fontSize', padding: 'padding', width: 'maxWidth',
      opacity: 'opacity', 'text-align': 'textAlign'
    };
    function applyOverlayStyle(el, style) {
      if (!style) return;
      for (const [key, cssProp] of Object.entries(FO_STYLE_MAP)) {
        if (style[key] == null) continue;
        let v = style[key];
        if (typeof v === 'number' && (key === 'radius' || key === 'font-size' || key === 'width' || key === 'padding')) v = `${v}px`;
        el.style[cssProp] = v;
      }
    }

    // Fold fill-opacity into a swatch fill: opacity 0 (or fill none) → transparent, partial opacity
    // on a #rrggbb → rgba, otherwise the color as-is. Keeps the swatch matching the map poly.
    function swatchFillColor(color, opacity) {
      if (!color || color === 'none' || opacity === 0) return 'transparent';
      if (opacity == null || opacity >= 1) return color;
      const m = /^#([0-9a-fA-F]{6})$/.exec(color);
      if (!m) return color;
      const n = parseInt(m[1], 16);
      return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${opacity})`;
    }

    function renderNoteOverlay(cfg) {
      const el = document.createElement('div');
      el.className = 'frame-overlay';
      const body = document.createElement('div');
      body.className = 'fo-note';
      body.textContent = cfg.text || '';
      el.appendChild(body);
      applyOverlayStyle(el, cfg.style);
      return el;
    }

    // A legend entry's `ref` points at a point/poly in this file by its optional `id`, so the
    // swatch inherits the exact style already defined on the map object. Returns the resolved
    // (defaults-merged) style plus the object kind, or null (fail-soft) when no id matches.
    function resolveRefStyle(id) {
      const pt = (projectDoc.points?.data || []).find((p) => p.id === id);
      if (pt) return { kind: 'point', style: mergeProjectStyle(PROJECT_POINT_DEFAULTS, pt.style), symbol: pt.symbol };
      const poly = (projectDoc.polys?.data || []).find((p) => p.id === id);
      if (poly) return { kind: 'poly', style: mergeProjectStyle(PROJECT_POLY_DEFAULTS, poly.style), symbol: null };
      console.warn(`[legend] no object with id "${id}"`);
      return null;
    }

    // Sprite box lookup for rendering a sprite icon as an HTML chip — served relative to the atlas
    // root the sandbox is on, mirroring styles/patterns/ usage. Fetched once and cached; the .catch
    // means a missing/blocked sprite.json degrades to circle chips rather than throwing.
    let _spriteJson = null, _spriteJsonPromise = null;
    function loadSpriteJson() {
      if (_spriteJson) return Promise.resolve(_spriteJson);
      if (!_spriteJsonPromise) {
        _spriteJsonPromise = fetch('styles/sprite.json')
          .then((r) => r.json())
          .then((j) => { _spriteJson = j; return j; })
          .catch(() => { _spriteJson = {}; return {}; });
      }
      return _spriteJsonPromise;
    }
    function spriteBox(name) {
      return (_spriteJson && _spriteJson[name]) || null;
    }

    // Builds the inline chip for one legend entry. `resolved` is the pre-resolved ref style (or
    // null for inline entries); style comes from ref (primary) or inline style.
    // rect → filled/patterned/bordered box; point → circle or sprite icon.
    function legendSwatchHTML(entry, resolved) {
      const style = resolved ? resolved.style : (entry.style || {});
      const symbol = entry.symbol || (resolved && resolved.symbol) || null;
      const kind = entry.swatch === 'point' ? 'point'
        : entry.swatch === 'arrow' ? 'arrow'
        : (entry.swatch === 'line' || entry.swatch === 'path') ? 'line' : 'rect';

      const cell = (inner) => `<span class="fo-swatch-cell">${inner}</span>`;

      if (kind === 'point' && symbol) {
        const box = spriteBox(symbol);
        if (box) {
          const pr = box.pixelRatio || 1;
          const w = box.width / pr, h = box.height / pr;
          // Crop the icon at natural size, then scale the whole element down to a legend-sized chip.
          // transform:scale keeps the crop correct even as the sprite sheet grows more icons.
          const target = 16, k = Math.min(1, target / h);
          return cell(`<span class="fo-swatch" style="`
            + `width:${w}px;height:${h}px;transform:scale(${k});`
            + `background-image:url('styles/sprite.png');background-size:auto;`
            + `background-position:-${box.x / pr}px -${box.y / pr}px;"></span>`);
        }
        // symbol named but not in sprite.json → fall through to a plain circle.
      }

      if (kind === 'point') {
        const fill = toMapLibreColor(style.fill || '#412c26');
        const stroke = toMapLibreColor(style.stroke);
        const sw = style['stroke-width'] || 0;
        return cell(`<span class="fo-swatch fo-swatch-point" style="background:${fill};`
          + `border:${sw}px solid ${stroke};"></span>`);
      }

      // line / path / arrow — a horizontal stroke showing color, width, and dash (matches a
      // LineString poly or an annotation arrow's style, referenced or inline). `arrow` shortens the
      // line and adds a filled arrowhead at the end.
      if (kind === 'line' || kind === 'arrow') {
        const lineColor = (style.stroke && style.stroke !== 'none') ? style.stroke : '#333';
        const lw = style['stroke-width'] || 2;
        const dashArr = { dashed: '5 3', dotted: '1 3' }[style['stroke-dash']] || '';
        const cap = style['stroke-dash'] === 'dotted' ? 'round' : 'butt';
        // Open chevron head (two strokes, no fill) at ~26° — matches the map's arrows
        // (computeArrowheadChevron), not a filled triangle.
        const x2 = kind === 'arrow' ? 21 : 23;
        const head = kind === 'arrow'
          ? `<path d="M15,4.5 L22,8 L15,11.5" fill="none" stroke="${lineColor}" stroke-width="${lw}" stroke-linejoin="round" stroke-linecap="round"/>`
          : '';
        return cell(`<svg width="24" height="16" viewBox="0 0 24 16">`
          + `<line x1="1" y1="8" x2="${x2}" y2="8" stroke="${lineColor}" stroke-width="${lw}" `
          + `stroke-linecap="${cap}"${dashArr ? ` stroke-dasharray="${dashArr}"` : ''}/>${head}</svg>`);
      }

      // rect — fold fill-opacity into the fill so a poly with fill:#000 + fill-opacity:0 (the common
      // "pattern only, no fill" combo, e.g. the Sahel dot layer) reads transparent here, matching
      // the map, instead of a solid black chip behind the pattern.
      const fill = swatchFillColor(style.fill, style['fill-opacity']);
      // Use the raw pattern name — the poly render already validates it, and resolveProjectPattern
      // depends on the async PATTERNS list that may not be loaded yet when the legend first paints
      // (a bad name just 404s the background-image and falls back to the fill).
      const pattern = style.pattern || '';
      const stroke = toMapLibreColor(style.stroke);
      const sw = style['stroke-width'] || 0;
      // stroke-dash maps to the CSS border-style so a dashed/dotted poly outline reads the same on
      // the chip (the values line up 1:1: dashed→dashed, dotted→dotted, else solid).
      const borderStyle = { dashed: 'dashed', dotted: 'dotted' }[style['stroke-dash']] || 'solid';
      // Patterns are seamless 128px PNGs added to the map with pixelRatio:2 (loadPatterns), so the
      // map tiles them at 128/2 = 64 CSS px. Match that exact scale here so the swatch reads the
      // same as the poly on the map, and repeat (not cover, which would stretch one tile solid).
      const bg = pattern
        ? `background-color:${fill};background-image:url('styles/patterns/${pattern}.png');background-size:64px 64px;background-repeat:repeat;`
        : `background:${fill};`;
      return cell(`<span class="fo-swatch fo-swatch-rect" style="${bg}border:${sw}px ${borderStyle} ${stroke};"></span>`);
    }

    function renderLegendOverlay(cfg) {
      const entries = Array.isArray(cfg.entries) ? cfg.entries : [];
      if (!entries.length) return null;
      const el = document.createElement('div');
      el.className = 'frame-overlay';
      const rows = entries.map((entry) => {
        // A group label is a subheading row inside the legend — no swatch, spans the full width.
        // Either an explicit `group`, or a bare `label` with nothing that would draw a swatch.
        if (entry.group != null
          || (entry.label != null && !entry.swatch && !entry.ref && !entry.style && !entry.symbol)) {
          return `<div class="fo-legend-group">${esc(entry.group ?? entry.label)}</div>`;
        }
        // A `ref` that resolves to nothing (typo'd/deleted id) drops the whole row — a blank swatch
        // would just look broken. resolveRefStyle already warns, so the author still gets a signal.
        const resolved = entry.ref ? resolveRefStyle(entry.ref) : null;
        if (entry.ref && !resolved) return '';
        const desc = entry.description
          ? `<div class="fo-legend-desc">${esc(entry.description)}</div>` : '';
        return `<div class="fo-legend-row">${legendSwatchHTML(entry, resolved)}`
          + `<div><div class="fo-legend-label">${esc(entry.label || '')}</div>${desc}</div></div>`;
      }).join('');
      const title = cfg.title ? `<div class="fo-legend-title">${esc(cfg.title)}</div>` : '';
      // Grid layout: `columns:N` lays entries in N content-sized columns, filled row-major; `rows:N`
      // fills column-major down N rows (a horizontal strip is just rows:1, which `layout:"horizontal"`
      // still selects as a shorthand). No columns/rows → the default vertical stack, unchanged.
      const cols = Number.isFinite(cfg.columns) && cfg.columns > 0 ? Math.floor(cfg.columns) : null;
      const rowsN = Number.isFinite(cfg.rows) && cfg.rows > 0 ? Math.floor(cfg.rows)
        : (cfg.layout === 'horizontal' ? 1 : null);
      if (cols || rowsN) {
        el.classList.add('fo-legend-wide');
        const gridStyle = rowsN
          ? `grid-auto-flow:column;grid-template-rows:repeat(${rowsN},auto)`
          : `grid-template-columns:repeat(${cols},auto)`;
        el.innerHTML = title + `<div class="fo-legend-grid" style="${gridStyle}">${rows}</div>`;
      } else {
        el.innerHTML = title + rows;
      }
      applyOverlayStyle(el, cfg.style);
      return el;
    }

    // THE project file, in memory — seeded from the loaded ?project= file at boot, then mutated
    // in place by every sketch and every style edit. This is the single source of truth: layers
    // render from it, and the Project tab shows it verbatim for copying back over the real file.
    // Anything the sandbox doesn't touch (view, inset, hideFeatures) rides along untouched, so
    // what you copy is a complete file rather than a fragment to hand-merge.
    const projectDoc = {
      points: { show: true, data: [] },
      polys: { show: true, data: [] },
      annotations: { show: true, data: [] }
    };
    // Newly sketched features go through here so a sketch and a loaded entry are never added
    // by different routes.
    // Select the entry just added, so the style row is editing it the moment it's placed. The
    // alternative was hunting for a 2px line with the cursor, or re-arming the tool to get the
    // controls back — which places another feature instead of editing the one you just made.
    function selectLast(kind) {
      selectedItem = { kind, index: projectDoc[kind].data.length - 1 };
      insetSelected = false;
    }

    function addFeature(kind, item) {
      projectDoc[kind].data.push(item);
      // A section with show:false renders visibility:none, so anything added to it lands
      // invisibly — you draw a shape, nothing appears, and editing its color does nothing you
      // can see. Adding to a section is an unambiguous signal you want to see it.
      if (projectDoc[kind].show === false) {
        projectDoc[kind].show = true;
        console.warn(`[project] ${kind}.show was false — turned on so the new feature is visible`);
      }
      return item;
    }

    // Stable per-entry id so a rendered feature can be traced back to the doc entry that made it.
    // Kept in a WeakMap rather than as a property on the entry: it must never serialize out into
    // the copied file, and it has to survive reordering and deletion, which an index can't.
    let nextItemId = 1;
    const itemIds = new WeakMap();
    function idFor(item) {
      if (!itemIds.has(item)) itemIds.set(item, nextItemId++);
      return itemIds.get(item);
    }
    function findItemById(id) {
      for (const kind of ['points', 'polys', 'annotations']) {
        const index = projectDoc[kind].data.findIndex((it) => itemIds.get(it) === id);
        if (index !== -1) return { kind, index };
      }
      return null;
    }
    // polys.data holds the AUTHORED form, including `source: "…"` refs. resolvePolysData()
    // expands those into raw geometry, which is right for rendering and wrong for the file —
    // expanding in place would drop the ref and inline a whole GeoJSON. So the resolved copy
    // lives here, used only for rendering, and never shown or copied.
    let renderPolys = [];

    // Each entry arms one sketch tool (kind = which paste array it feeds, mode = placement
    // behavior) — see armSketch()/the map click handler for what each mode actually does.
    // Tools are named by intent. Arrows and lines don't each need a straight and a curved button:
    // the shape comes from the straight/curved selector in the style row and is resolved when the
    // tool is armed, so one button covers both.
    const SKETCH_TOOLS = [
      { kind: 'points', tool: 'point', label: 'Add point' },
      { kind: 'polys', tool: 'rect', label: 'Add rect' },
      { kind: 'polys', tool: 'custom-shape', label: 'Draw shape' },
      { kind: 'annotations', tool: 'arrow', label: 'Add arrow' },
      { kind: 'annotations', tool: 'line', label: 'Add line' },
      { kind: 'annotations', tool: 'text-area', label: 'Add text area' }
    ];
    const SKETCH_DIRS = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
    // A line is just an arrow with no head. It's placed by the same two/three-click flow, so the
    // tool resolves to the same mode and only the head differs.
    function resolveSketchMode(tool) {
      if (tool === 'arrow' || tool === 'line') {
        return sketchArrowShape === 'curved' ? 'curved-arrow' : 'straight-arrow';
      }
      return tool;
    }

    // Style applied to the next feature of each kind — edited live via the style row in the Edit
    // tab, and kept between sketches until changed again.
    // Whether a section's "next new feature" style follows what you last edited, or stays put.
    // On (default) — editing the selected feature also updates the default, so the next one you
    // draw matches it. Off — editing only touches that feature, and new ones keep the default.
    const styleMemory = { points: true, polys: true, annotations: true };
    let sketchRectStyle = { fill: '#ff0000', 'fill-opacity': 0.3, stroke: '#ff0000', 'stroke-width': 1, pattern: '', 'pattern-opacity': 1 };
    let sketchPointStyle = { fill: '#412c26', size: 5, stroke: 'none', 'stroke-width': 0 };
    // The label the next point carries: `name` is the text (blank for an unlabelled dot), `dir`
    // is which side of the dot it sits on.
    let sketchPointLabel = { name: '', dir: 'NE' };
    let sketchArrowStyle = { stroke: '#000000', 'stroke-width': 2, 'stroke-dash': 'solid' };
    // Applies to both arrows and lines — which of the two placement flows the tool arms.
    let sketchArrowShape = 'straight';   // 'straight' | 'curved'
    // The next text area. Its style is a full style object (not a couple of shortcut flags) so
    // the same controls can drive the default and an already-placed entry.
    let sketchText = { text: 'Text' };
    let sketchTextStyle = { align: 'center', fill: '#ffffff', 'fill-opacity': 0.85, stroke: '#000000', 'stroke-width': 1 };
    // Snapshotted immediately after the live defaults above, so "reset" restores exactly the
    // shipped starting point rather than whatever the session has drifted to.
    const SKETCH_STYLE_BASELINE = {
      rect: { ...sketchRectStyle }, point: { ...sketchPointStyle },
      arrow: { ...sketchArrowStyle }, text: { ...sketchTextStyle }
    };
    function resetSketchStyle(kind) {
      if (kind === 'points') sketchPointStyle = { ...SKETCH_STYLE_BASELINE.point };
      else if (kind === 'polys') sketchRectStyle = { ...SKETCH_STYLE_BASELINE.rect };
      else { sketchArrowStyle = { ...SKETCH_STYLE_BASELINE.arrow }; sketchTextStyle = { ...SKETCH_STYLE_BASELINE.text }; }
    }

    // Trim a placed poly against another geometry (another placed poly, or a refUid map
    // feature) using polygon-clipping (already loaded for refUid unioning, see
    // resolveRefUidGeometry above). Workflow: select a poly (target), then either click a
    // *different* poly in the list or type+Enter a refUid (the "other" geometry) — that
    // immediately splits the target into intersection + difference pieces; click whichever
    // one on the map to commit it as the target's new geometry, or Esc to cancel.
    // null, or { targetIndex, intersectionCoords, differenceCoords } once a split is showing.
    let pendingTrim = null;
    // Inspect mode: toggled via the "Inspect" button — while on, a plain map click shows what's
    // there (layer/properties + any refUid) instead of just copying lng,lat.
    let inspectMode = false;
    // Shared by every sketched poly shape (rect, custom-shape) — drops pattern/pattern-opacity
    // when no pattern is chosen, so an un-patterned shape's JSON doesn't carry dead keys.
    function sketchPolyStyle() {
      const s = { ...sketchRectStyle };
      if (!s.pattern) { delete s.pattern; delete s['pattern-opacity']; }
      return s;
    }

    function defaultStyleFor(kind) {
      // Annotations cover two very different things; while the text-area tool is armed its own
      // defaults are what the style row is editing.
      if (kind === 'annotations' && pendingSketch?.tool === 'text-area') return sketchTextStyle;
      return kind === 'points' ? sketchPointStyle : kind === 'polys' ? sketchRectStyle : sketchArrowStyle;
    }
    // Which placed item (if any) the style rows below are currently editing, in addition to
    // updating the "next sketch" default — set by clicking an item in its paste row's list.
    let selectedItem = null;   // { kind, index }
    // The inset isn't a feature in projectDoc[kind].data, so it can't ride selectedItem — but it
    // follows the same rule: its options are only shown while it's the thing being edited.
    let insetSelected = false;
    // Marker placement is its own tiny armed mode, scoped to clicks ON THE INSET rather than the
    // main map — reusing armSketch/pendingSketch would wire it into the main map's click handler
    // instead, since that's the one all the existing sketch-btn plumbing points at.
    let insetMarkerArmed = false;
    // Called by every style input's change/input handler: updates the "next sketch" default,
    // and — if an item of this kind is selected — live-applies the same field to that item too.
    function setSketchStyleField(kind, field, value) {
      // With memory off, an edit to a selected feature is JUST that edit — it no longer rewrites
      // the default for everything drawn afterwards. With nothing selected the row IS the default,
      // so it always writes.
      if (styleMemory[kind] || selectedItem?.kind !== kind) defaultStyleFor(kind)[field] = value;
      if (selectedItem?.kind !== kind) return;
      const item = pastedArrayFor(kind)[selectedItem.index];
      if (!item) return;
      // A selected wildcard PART writes to item.overrides[uid]; only customized shapes end up in
      // the file, so "all admin1 grey except Lagos" stays two lines instead of thirty-seven.
      if (selectedItem.uid) {
        item.overrides = item.overrides || {};
        const ov = { ...(item.overrides[selectedItem.uid] || {}), [field]: value };
        if (kind === 'polys' && field === 'pattern' && !value) { delete ov.pattern; delete ov['pattern-opacity']; }
        item.overrides[selectedItem.uid] = ov;
        rerenderPasted(kind);
        return;
      }
      const style = { ...(item.style || {}), [field]: value };
      if (kind === 'polys' && field === 'pattern' && !value) { delete style.pattern; delete style['pattern-opacity']; }
      item.style = style;
      rerenderPasted(kind);
    }
    // Feature-level counterpart to setSketchStyleField: these fields live on the entry itself
    // rather than inside its `style`, except `background`, which is a friendlier name for "give
    // the text area a fill and a stroke, or neither".
    function setSketchMetaField(kind, field, value) {
      const item = selectedItem?.kind === kind ? pastedArrayFor(kind)[selectedItem.index] : null;
      if (kind === 'points') {
        if (item) {
          if (field === 'name') { value ? (item.name = value) : delete item.name; }
          else item[field] = value;
        }
        sketchPointLabel[field] = value;
      } else if (kind === 'annotations') {
        if (field === 'type') {
          sketchArrowShape = value === 'curved-arrow' ? 'curved' : 'straight';
          // Switching an existing connector's shape rewrites its type. A curve needs a bend to
          // exist at all, so seed the default one on the way in; going back to straight drops it.
          if (item && item.type !== 'text-area') {
            if (value === 'curved-arrow') { item.type = 'curved-arrow'; item.bend = item.bend ?? 0.25; }
            else { item.type = 'straight-arrow'; delete item.bend; }
          }
        } else if (field === 'text') {
          if (item) item.text = value; else sketchText.text = value;
        } else if (field === 'label') {
          // Entry-level, not a style key. Empty clears it rather than writing an empty string,
          // so a label that's been deleted doesn't linger in the copied file.
          if (item) { value ? (item.label = value) : delete item.label; }
        } else if (field === 'bend' || field === 'width' || field === 'height') {
          if (value === '' || !item) return;
          item[field] = +value;
        }
      }
      if (item) rerenderPasted(kind);
      else updateProjectJson();
    }

    // One line describing a placed item, for its row in the Edit tab's list. It has to identify
    // WHICH item it is — the list only shows this session's work, so any index shown here would
    // be a position in the full file that the reader can't see the rest of.
    function itemSummary(kind, item) {
      const at = ([lng, lat]) => `${(+lng).toFixed(2)},${(+lat).toFixed(2)}`;
      if (kind === 'points') {
        const lng = item.lng ?? (item.latlng ? +item.latlng.split(',')[1] : undefined);
        const lat = item.lat ?? (item.latlng ? +item.latlng.split(',')[0] : undefined);
        const coords = (typeof lng === 'number' && typeof lat === 'number') ? at([lng, lat]) : '?';
        return item.name ? `${item.name} · ${coords}` : `point ${coords}`;
      }
      if (kind === 'polys') {
        if (item.refUid) return `refUid ${[].concat(item.refUid).join(', ')}`;
        if (item.source) return `source ${item.source}`;
        if (item.geometry) {
          const g = item.geometry;
          const ring = g.type === 'Polygon' ? g.coordinates[0]
            : g.type === 'LineString' ? g.coordinates
            : g.type === 'MultiPolygon' ? g.coordinates[0]?.[0] : null;
          const shape = g.type === 'LineString' ? 'line' : g.type === 'MultiPolygon' ? 'multi' : 'shape';
          return ring?.length ? `${shape} · ${ring.length - 1} pts · ${at(ring[0])}` : shape;
        }
        return 'poly';
      }
      if (item.type === 'text-area') {
        const t = (item.text || '').replace(/\s+/g, ' ').trim();
        return t ? `text "${t.length > 24 ? t.slice(0, 24) + '…' : t}"` : `text ${at(item.position)}`;
      }
      if (item.type === 'straight-arrow' || item.type === 'curved-arrow') {
        // arrow-size 0 is a headless connector — call it a line, since that's the tool that made it.
        const head = (item.style?.['arrow-size'] ?? 0.3) > 0 ? 'arrow' : 'line';
        const bend = item.type === 'curved-arrow' ? 'curved ' : '';
        return `${bend}${head} ${at(item.start)} → ${at(item.end)}`;
      }
      return item.type || 'annotation';
    }

    // The Edit tab: one section per kind, each with its sketch tools, the style row (which edits
    // the selected item and sets the next new sketch's default), and the list of what's been
    // drawn this session. Nothing renders for a section until it has tools — the sections stay
    // quiet until you actually draw.
    // Style options belong to whatever you're actively working on: an entry selected on the
    // map, or a tool that's armed and about to place something. Idle sections show only their
    // buttons, so the tab isn't a wall of controls for things you aren't touching.
    function activeFor(kind) {
      return selectedItem?.kind === kind || pendingSketch?.kind === kind;
    }
    // The inset's own section. Everything here is projectDoc.inset, so edits land in the Project
    // tab like any other change and copy back out with the rest of the file.
    // Three independent trackers, one per readout value — checking "zoom" only ever touches
    // view.zoom, "center" only view.center, "bbox" only view.bbox. Deliberately not linked:
    // checking one doesn't imply or write another.
    let viewTrackZoom = false;
    let viewTrackCenter = false;
    let viewTrackBbox = false;
    function syncViewToMap() {
      if (!viewTrackZoom && !viewTrackCenter && !viewTrackBbox) return;
      projectDoc.view = projectDoc.view || {};
      if (viewTrackZoom) projectDoc.view.zoom = +map.getZoom().toFixed(2);
      if (viewTrackCenter) {
        const c = map.getCenter();
        projectDoc.view.center = [+c.lng.toFixed(4), +c.lat.toFixed(4)];
      }
      if (viewTrackBbox) {
        const b = map.getBounds();
        projectDoc.view.bbox = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].map((n) => +n.toFixed(4));
      }
      updateProjectJson();
    }
    // Shows only when at least one of ?zoom=/?bbox=/?center= is present — those override a
    // project's own view at load time (see frame() and the loadProjects() guard above) but are
    // otherwise thrown away on reload. A checkbox writes the URL value into view.zoom/bbox/center
    // so it survives into the file instead of being a one-time override. Unrelated to the "add to
    // project" checkbox on the readout, which captures the live camera rather than a URL value.
    function viewSectionHtml() {
      if (zoom == null && bbox?.length !== 4 && centerParam?.length !== 2) return '';
      const v = projectDoc.view || {};
      const cb = (field, urlValue, label) =>
        `<label class="edit-row-hint"><input type="checkbox" class="view-capture-cb" data-field="${field}"` +
        `${JSON.stringify(v[field]) === JSON.stringify(urlValue) ? ' checked' : ''}> ${label}</label>`;
      return `<div class="edit-row"><div class="edit-row-head">View — from the URL` +
        (zoom != null ? cb('zoom', zoom, `zoom ${zoom}`) : '') +
        (bbox?.length === 4 ? cb('bbox', bbox, `bbox ${bbox.join(',')}`) : '') +
        (centerParam?.length === 2 ? cb('center', centerParam, `center ${centerParam.join(',')}`) : '') +
        `</div></div>`;
    }

    function insetSectionHtml() {
      const cfg = projectDoc.inset;
      if (!cfg) {
        return `<div class="edit-row"><div class="edit-row-head">Inset</div>` +
          `<div class="paste-actions"><button class="sketch-btn" data-inset-act="add">Add inset</button></div></div>`;
      }
      // Same rule as the feature sections: idle shows only the header, so the tab isn't a wall of
      // controls for something you aren't touching. Click the inset on the map, or this header.
      if (!insetSelected) {
        return `<div class="edit-row"><div class="edit-row-head inset-head">Inset` +
          `<span class="edit-row-hint">click the inset to edit</span></div></div>`;
      }
      const f = (type, path, value, extra = '') =>
        `<input type="${type}" class="inset-in" data-field="${path}" ${extra} value="${value}">`;
      const sel = (path, value, options) =>
        `<select class="inset-sel" data-field="${path}">` +
        options.map(o => `<option value="${o}"${o === value ? ' selected' : ''}>${o}</option>`).join('') + `</select>`;
      const cb = (path, on) => `<input type="checkbox" class="inset-cb" data-field="${path}"${on ? ' checked' : ''}>`;
      const center = cfg.center ?? [0, 20];
      const border = cfg.border === false ? {} : (cfg.border || {});
      const v = cfg.vignette === true ? {} : (cfg.vignette || {});
      const row = (inner) => `<div class="sketch-style-row">${inner}</div>`;
