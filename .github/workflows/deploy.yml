name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Manually zip your whole repo safely, bypassing GitHub's broken internal tar step
      - name: Create archive
        run: zip -r artifact.zip . -x ".git/*" ".github/*"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 2. Upload the pre-made zip file directly
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifact.zip

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4