name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare site folder and resolve symlinks
        run: |
          mkdir -p _site
          cp -r img mirror-mirror collage photos _site/

          # Working material, never site content — copied in above by the
          # wholesale `cp -r collage`/`cp -r photos`, so it has to come back
          # out. collage/sources/full alone is ~1GB (convert.sh's full-res
          # avifs), which is what pushed the artifact past Pages' 1GB limit
          # and got a deploy cancelled outright. It's meant to be hosted
          # separately (Cloudflare) and reached via a URL, not shipped here —
          # once that's live, point HIRES_ROOTS at it in collage/index.html.
          rm -rf _site/collage/sources/full
          rm -rf _site/collage/downloads
          rm -rf _site/collage/recordings
          rm -rf _site/photos/node_modules

          # Replace the broken symlinks with actual physical files in the staging folder
          rm -rf _site/photos/originals
          mkdir -p _site/photos/originals
          cp -L photos/originals/* _site/photos/originals/ 2>/dev/null || true

          cp index.html .nojekyll _redirect CNAME 404.html meta.csv _site/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4