<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Michael Bricknell — cartographer and data visualization designer. Maps, spatial data tools, and design-driven graphics.">
    <meta property="og:title" content="Michael Bricknell">
    <meta property="og:description" content="Cartographic • Historic Preservation • Research">
    <meta property="og:url" content="https://mbricknell.com">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👨‍🦰</text></svg>">
    <title>Michael Bricknell</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@observablehq/inspector@5/dist/inspector.css">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://api.observablehq.com">
    <link rel="preconnect" href="https://static.observableusercontent.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sixtyfour+Convergence&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  a {
    transition: filter 0.15s ease, text-shadow 0.15s ease;
  }

  a:hover {
    filter: brightness(1.4);
    text-shadow: 0 0 8px currentColor;
  }

  body.effects-off a:hover {
    filter: none !important;
    text-shadow: none !important;
  }

  body, html {
    width: 100%;
    height: 100%;
    background: #010101;
  }

  .link-cols {
    column-count: 1 !important;
  }

  .project-card,
  .project-card * {
    max-width: 100%;
    overflow-wrap: break-word;
    word-break: break-word;
  }

  .project-card img,
  .project-thumb {
    max-width: 100%;
    height: auto;
  }

  body.plain-text, body.plain-text * {
    font-family: Arial, Helvetica, sans-serif !important;
  }

  a[href^="http"]:not([href*="mbricknell.com"])::after {
    content: " \1F517";
    font-size: 0.85em;
    filter: grayscale(1) sepia(1) hue-rotate(90deg) saturate(4);
  }

  #page {
    width: 100%;
    min-height: 100%;
    padding-bottom: 160px;
  }

  .loading-screen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: black;
    pointer-events: none;
    opacity: 0.4;
    mix-blend-mode: hard-light;
    transition: opacity 0.5s ease;
  }


  .loading-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background-repeat: repeat;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .loading-img.active { opacity: 1; }

  .loading-img[data-stage="off"] {
    background-image: url('/img/off.svg');
    background-size: 150px 150px;
  }
  .loading-img[data-stage="init"] {
    background-image: url('/img/init.svg');
    background-size: 150px 150px;
  }
  .loading-img[data-stage="on"] {
    background-image: url('/img/on.svg');
    background-size: 150px 150px;
  }

  @keyframes flash-brightness {
    0%   { filter: brightness(1); }
    20%  { filter: brightness(2.5); }
    100% { filter: brightness(1); }
  }

  @keyframes flash-blur {
    0%   { filter: blur(0px); }
    20%  { filter: blur(3px); }
    100% { filter: blur(0px); }
  }

  @keyframes flash-saturate {
    0%   { filter: saturate(1); }
    20%  { filter: saturate(2.5); }
    100% { filter: saturate(1); }
  }

  @keyframes flash-contrast {
    0%   { filter: contrast(1); }
    20%  { filter: contrast(2); }
    100% { filter: contrast(1); }
  }

  @keyframes flash-hue {
    0%   { filter: hue-rotate(0deg); }
    20%  { filter: hue-rotate(40deg); }
    100% { filter: hue-rotate(0deg); }
  }

  .flash-anim {
    animation-duration: 0.6s;
    animation-timing-function: ease-out;
    animation-fill-mode: forwards;
  }

  .flash-overlay {
    position: fixed;
    inset: 0;
    z-index: 9998;
    background: rgb(0, 209, 7);
    opacity: 0;
    mix-blend-mode: overlay;
    pointer-events: none;
    transition: opacity 0.08s ease-out;
  }

  .loading-text {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Sixtyfour Convergence", sans-serif;
    font-variation-settings: "BLED" 0, "SCAN" 0;
    font-size: clamp(1.5rem, 9vw, 5rem);
    font-weight: 700;
    letter-spacing: 0.06em;
    color: #ff5500;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    text-shadow: 0 0 4px #ff5500, 0 0 12px #ff5500, 0 0 24px #ff3d00, 0 0 45px #ff3d00, 0 0 70px #ff2200;
    mix-blend-mode: hard-light;
  }

  .loading-text.blink .char {
    animation: char-blink 0.6s steps(1, end) infinite;
    animation-delay: calc(var(--i) * 0.15s);
  }

  @keyframes char-blink {
    0%, 50%  { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  #page.main {
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  #page.main.loaded { opacity: 1; }

  #effects-toggle {
    position: fixed;
    bottom: 12px;
    right: 12px;
    z-index: 99999;
    padding: 12px 18px;
    min-height: 44px;
    background: #000;
    color: #33ff33;
    border: 1px solid #33ff33;
    border-radius: 4px;
    font-family: "Courier New", monospace;
    font-weight: 700;
    transition: color 0.15s ease, box-shadow 0.15s ease;
    cursor: pointer;
  }

  #about-toggle {
    cursor: pointer;
  }


  @media print {
    #loading-screen,
    .flash-overlay,
    #effects-toggle,
    #hue-dial,
    #about-toggle,
    #about-panel {
      display: none !important;
    }

    body, html {
      background: #fff !important;
    }

    #page, body, html {
      height: auto !important;
      filter: none !important;
      opacity: 1 !important;
      padding-bottom: 0 !important;
    }

    header, header *, #page, #page * {
      color: #000 !important;
      font-family: Arial, Helvetica, sans-serif !important;
    }

    a[href^="http"]:not([href*="mbricknell.com"])::after {
      filter: none !important;
    }
  }

  #effects-toggle,
  #hue-dial,
  #about-toggle {
    opacity: 0.6;
    transition: opacity 0.6s ease;
  }

  #effects-toggle:hover,
  #hue-dial:hover,
  #about-toggle:hover {
    opacity: 1;
  }

  body.effects-off #effects-toggle,
  body.effects-off #about-toggle {
    opacity: 1 !important;
    transition: none !important;
  }

  body.pre-load #effects-toggle,
  body.pre-load #hue-dial,
  body.pre-load #about-toggle {
    opacity: 0 !important;
    pointer-events: none !important;
  }
</style>
</head>
<body class="pre-load">
  <div id="loading-screen" class="loading-screen">
    <div class="loading-img" data-stage="off"></div>
    <div class="loading-img" data-stage="init"></div>
    <div class="loading-img" data-stage="on"></div>
    <div class="loading-text">LOADING...</div>
  </div>

  <div class="flash-overlay"></div>

  <div id="vignette-overlay" style="position:fixed;inset:0;z-index:9990;pointer-events:none;background:radial-gradient(ellipse at center, rgba(0,0,0,0) 15%, rgba(0,0,0,0.95) 100%);"></div>

  <button id="effects-toggle">turn effects off</button>

  <div id="hue-dial" style="position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:99999;display:flex;align-items:center;gap:8px;background:#000;border:1px solid #33ff33;border-radius:4px;padding:6px 10px;">
    <span style="color:#33ff33;font-family:'Courier New',monospace;font-weight:700;font-size:0.75rem;">colors:</span>
  </div>

  <div id="page" class="main">
    <header style="padding:2rem;color:#eee;font-family:system-ui;">
      <h1 style="font-size:clamp(1.1rem, 5vw, 1.8rem);">Michael Bricknell</h1>
      <p>Cartographer and data visualization designer. Maps, spatial data tools, and design-driven graphics.</p>
      <p><a href="https://observablehq.com/@mbrickmaps" style="color:#e29742;">@mbrickmaps on Observable</a></p>
    </header>
  </div>

  <button id="about-toggle" style="position:fixed;bottom:12px;left:12px;z-index:99999;padding:12px 18px;min-height:44px;background:#000;color:#33ff33;border:1px solid #33ff33;border-radius:4px;font-family:'Courier New', monospace;font-weight:700;transition:color 0.15s ease, box-shadow 0.15s ease;">about</button>

  <div id="about-panel" style="display:none;position:fixed;bottom:52px;left:12px;z-index:100000;padding:1rem 1.25rem;background:rgba(0,0,0,0.85);color:#aaa;font-family:system-ui, sans-serif;font-size:0.8rem;border:1px solid #33ff33;border-radius:4px;max-width:280px;">
    "Sixtyfour Convergence" font by <a href="https://fonts.google.com/?query=Simon%20Cozens" style="color:#e29742;">Simon Cozens</a>, <a href="https://fonts.google.com/?query=Jens%20Kut%C3%ADlek" style="color:#e29742;">Jens Kutílek</a>
  </div>

  <script type="module">
    import {Runtime, Inspector} from "https://cdn.jsdelivr.net/npm/@observablehq/runtime@5/dist/runtime.js";
    import notebook from "https://api.observablehq.com/@mbrickmaps/content.js?v=4";

    let effectsOn = true;
    const loadingScreen = document.getElementById('loading-screen');

    // --- hue picker ---
    const HUE_STOPS = 4;
    let currentHue = 90;

    const dial = document.getElementById('hue-dial');

    const hueTicks = [];
    for (let i = 0; i < HUE_STOPS; i++) {
      const angle = i * (360 / HUE_STOPS);

      const tick = document.createElement('button');
      tick.type = 'button';
      tick.className = 'hue-tick';
      tick.textContent = i + 1;
      tick.style.cssText = 'width:44px;height:44px;border-radius:50%;padding:0;cursor:pointer;' +
        'display:flex;align-items:center;justify-content:center;' +
        'background:#000;color:#33ff33;font-family:"Courier New",monospace;font-size:20px;font-weight:700;' +
        'transition:color 0.15s ease, box-shadow 0.15s ease;' +
        'border:2px solid ' + (angle === currentHue ? '#fff' : '#33ff33') + ';';
      tick.dataset.angle = angle;
      tick.addEventListener('click', () => {
        currentHue = angle;
        hueTicks.forEach(t => { t.style.borderColor = (Number(t.dataset.angle) === currentHue) ? '#fff' : '#33ff33'; });
        applyHue();
      });
      dial.appendChild(tick);
      hueTicks.push(tick);
    }

    function applyHue() {
      document.getElementById('page').style.filter = effectsOn ? 'hue-rotate(' + currentHue + 'deg) saturate(4)' : '';
    }

    function applyEffectsState() {
      const overlay = document.querySelector('.flash-overlay');
      const vignette = document.getElementById('vignette-overlay');
      const aboutToggle = document.getElementById('about-toggle');
      const aboutPanel = document.getElementById('about-panel');
      applyHue();
      document.body.classList.toggle('plain-text', !effectsOn);
      document.body.classList.toggle('effects-off', !effectsOn);
      if (!effectsOn) {
        overlay.style.opacity = '0';
        document.querySelectorAll('.flash-anim').forEach(el => {
          el.classList.remove('flash-anim');
          el.style.animationName = '';
        });
        loadingScreen.style.display = 'none';
        dial.style.display = 'none';
        vignette.style.display = 'none';
        aboutToggle.style.display = 'none';
        aboutPanel.style.display = 'none';
      } else {
        loadingScreen.style.display = '';
        dial.style.display = 'flex';
        vignette.style.display = '';
        aboutToggle.style.display = '';
      }
    }

    document.getElementById('effects-toggle').addEventListener('click', function () {
      effectsOn = !effectsOn;
      this.textContent = 'turn effects ' + (effectsOn ? 'off' : 'on');
      applyEffectsState();
    });

    applyEffectsState();

    document.getElementById('about-toggle').addEventListener('click', function () {
      const panel = document.getElementById('about-panel');
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    });

    const stages = document.querySelectorAll('.loading-img');
    const page = document.getElementById('page');
    const loadingText = document.querySelector('.loading-text');

    const flashAnimations = [
      'flash-brightness',
      'flash-blur',
      'flash-saturate',
      'flash-contrast',
      'flash-hue'
    ];

    function triggerRandomFlash(el) {
      if (!effectsOn) return;
      const chosen = flashAnimations[Math.floor(Math.random() * flashAnimations.length)];
      el.classList.add('flash-anim');
      el.style.animationName = chosen;

      el.addEventListener('animationend', function handler() {
        el.classList.remove('flash-anim');
        el.style.animationName = '';
        el.removeEventListener('animationend', handler);
      });
    }

    function showStage(name) {
      stages.forEach(img => img.classList.toggle('active', img.dataset.stage === name));
    }

    function splitIntoChars(el) {
      const text = el.textContent;
      el.textContent = '';
      [...text].forEach((char, i) => {
        const span = document.createElement('span');
        span.textContent = char === ' ' ? '\u00A0' : char;
        span.style.setProperty('--i', i);
        span.classList.add('char');
        el.appendChild(span);
      });
    }
    splitIntoChars(loadingText);

    showStage('off');

    setTimeout(() => {
      showStage('init');
      loadingText.style.opacity = '1';
      loadingText.classList.add('blink');
    }, 300);

    const runtime = new Runtime();
    const main = runtime.module(notebook, name => {
      if (name === "page") {
        return new Inspector(document.getElementById("page"));
      }
    });

    function dismissLoadingScreen() {
      showStage('on');
      triggerRandomFlash(document.querySelector('[data-stage="on"]'));
      loadingText.classList.remove('blink');
      loadingText.style.display = 'none';
      page.classList.add('loaded');
      setTimeout(() => {
        document.body.classList.remove('pre-load');
      }, 700);
    }

    main.value("page").then(() => {
      dismissLoadingScreen();
    }).catch(err => {
      console.error("Observable content failed to load:", err);
      dismissLoadingScreen();
    });

    function randomFlash() {
      if (effectsOn) {
        const overlay = document.querySelector('.flash-overlay');
        overlay.style.opacity = '0.3';
        setTimeout(() => { overlay.style.opacity = '0'; }, 80 + Math.random() * 100);
      }
      setTimeout(randomFlash, 1500 + Math.random() * 4000);
    }
    randomFlash();
  </script>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-1J5XCP3RRH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-1J5XCP3RRH');

    document.addEventListener("click", (e) => {
      const link = e.target.closest("a");
      if (link && link.href) {
        gtag("event", "link_click", {
          link_url: link.href,
          link_text: link.textContent.trim()
        });
      }
    });

    window.addEventListener("message", (e) => {
      if (e.data.event === "card_click") {
        gtag("event", "card_click", {
          link_url: e.data.link_url,
          link_text: e.data.link_text
        });
      }
      if (e.data.event === "swatch_click") {
        gtag("event", "swatch_click", {
          color_value: e.data.color_value
        });
      }
    });
  </script>
</body>
</html>
