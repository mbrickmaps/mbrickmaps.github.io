<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Michael Bricknell — cartographer and data visualization designer. Maps, spatial data tools, and design-driven graphics.">
<meta property="og:title" content="Michael Bricknell">
<meta property="og:description" content="Cartographic • Historic Preservation • Research">
<meta property="og:url" content="https://mbricknell.com">
<title>Michael Bricknell</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@observablehq/inspector@5/dist/inspector.css">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://api.observablehq.com">
<link rel="preconnect" href="https://static.observableusercontent.com">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body, html { width: 100%; min-height: 100%; background: #010101; overflow-x: hidden; }
  #page { width: 100%; min-height: 100%; padding-bottom: 12rem; }
</style>
</head>
<body>
  <div id="page"></div>

  <script type="module">
    import {Runtime, Inspector} from "https://cdn.jsdelivr.net/npm/@observablehq/runtime@5/dist/runtime.js";
    import notebook from "https://api.observablehq.com/@mbrickmaps/content.js?v=4";

    const targetName = location.pathname.replace(/\/$/, "") === "/home" ? "mediaRoomPage" : "page";
    const runtime = new Runtime();
    const main = runtime.module(notebook, name => {
      if (name === targetName) {
        return new Inspector(document.getElementById("page"));
      }
    });
  </script>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-1J5XCP3RRH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-1J5XCP3RRH');

    document.addEventListener("click", (e) => {
      const link = e.target.closest("a");
      if (link && link.href) {
        gtag("event", "link_click", {
          link_url: link.href,
          link_text: link.textContent.trim()
        });
      }
    });

    window.addEventListener("message", (e) => {
      if (e.data.event === "card_click") {
        gtag("event", "card_click", {
          link_url: e.data.link_url,
          link_text: e.data.link_text
        });
      }
      if (e.data.event === "swatch_click") {
        gtag("event", "swatch_click", {
          color_value: e.data.color_value
        });
      }
    });
  </script>
</body>
</html>
