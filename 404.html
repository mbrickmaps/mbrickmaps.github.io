<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Michael Bricknell — cartographer and data visualization designer. Maps, spatial data tools, and design-driven graphics.">
    <meta property="og:title" content="Michael Bricknell">
    <meta property="og:description" content="Cartographic • Historic Preservation • Research">
    <meta property="og:url" content="https://mbricknell.com">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👨‍🦰</text></svg>">
    <title>Michael Bricknell</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@observablehq/inspector@5/dist/inspector.css">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://api.observablehq.com">
    <link rel="preconnect" href="https://static.observableusercontent.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sixtyfour+Convergence&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     CUSTOM PROPERTIES
     ============================================================ */
  :root {
    --terminal-green: #33ff33;
    --terminal-bg: #000;
    --page-bg: #010101;
    --space-1: 0.5rem;
    --space-2: 0.75rem;
    --space-3: 1rem;
    --tray-inset: var(--space-3);
    --tray-btn-height: 44px;
    --font-mono: "Courier New", monospace;
  }

  /* ============================================================
     RESET
     ============================================================ */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  dialog {
    font-family: Arial, Helvetica, sans-serif;
  }

  body, html {
    width: 100%;
    min-height: 100%;
    background: var(--page-bg);
    overflow-x: hidden;
  }

  /* ============================================================
     LINKS
     ============================================================ */
  a {
    transition: filter 0.15s ease, text-shadow 0.15s ease;
  }

  a:hover {
    filter: brightness(2.4);
    text-shadow: 0 0 4px currentColor;
  }

  body.effects-off a:hover {
    filter: none;
    text-shadow: none;
  }

  body.plain-text, body.plain-text * {
    font-family: Arial, Helvetica, sans-serif;
  }

  a[href^="http"]:not([href*="mbricknell.com"])::after {
    content: " \1F517";
    font-size: 0.85em;
    filter: grayscale(1) sepia(1) hue-rotate(90deg) saturate(4);
  }

  /* ============================================================
     PAGE CONTENT (shell only — the notebook owns its own styling
     once injected into #page)
     ============================================================ */
  #page {
    width: 100%;
    min-height: 100%;
    padding-bottom: 12rem;
  }

  #page.main {
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  #page.main.loaded { opacity: 1; }

  .site-header {
    padding: var(--space-3);
    color: #eee;
    font-family: system-ui, sans-serif;
  }

  .site-header h1 {
    font-size: clamp(1.1rem, 5vw, 1.5rem);
  }

  /* ============================================================
     LOADING SCREEN / FX LAYERS
     ============================================================ */
  .loading-screen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: var(--terminal-bg);
    pointer-events: none;
    opacity: 0.3;
    mix-blend-mode: hard-light;
    transition: opacity 0.5s ease;
  }

  .loading-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background-repeat: repeat;
    background-size: 150px 150px;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .loading-img.active { opacity: 1; }

  .loading-img[data-stage="off"] { background-image: url('/img/off.svg'); }
  .loading-img[data-stage="init"] { background-image: url('/img/init.svg'); }
  .loading-img[data-stage="on"] { background-image: url('/img/on.svg'); }

  .flash-overlay {
    position: fixed;
    inset: 0;
    z-index: 9998;
    background: rgb(0, 209, 7);
    opacity: 0;
    mix-blend-mode: overlay;
    pointer-events: none;
    transition: opacity 0.08s ease-out;
  }

  .vignette-overlay {
    position: fixed;
    inset: 0;
    z-index: 9990;
    pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 15%, rgba(0,0,0,0.95) 100%);
  }

  .loading-text {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Sixtyfour Convergence", sans-serif;
    font-variation-settings: "BLED" 0, "SCAN" 0;
    font-size: clamp(1.5rem, 9vw, 5rem);
    font-weight: 700;
    letter-spacing: 0.06em;
    color: #ff5500;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    text-shadow: 0 0 4px #ff5500, 0 0 12px #ff5500, 0 0 24px #ff3d00, 0 0 45px #ff3d00, 0 0 70px #ff2200;
    mix-blend-mode: plus-lighter;
  }

  .loading-text.blink .char {
    animation: char-blink 0.6s steps(1, end) infinite;
    animation-delay: calc(var(--i) * 0.15s);
  }

  @keyframes char-blink {
    0%, 50%  { opacity: 1; }
    51%, 100% { opacity: 0; }
  }

  @keyframes flash-brightness {
    0%   { filter: brightness(1); }
    20%  { filter: brightness(2.5); }
    100% { filter: brightness(1); }
  }

  @keyframes flash-blur {
    0%   { filter: blur(0px); }
    20%  { filter: blur(3px); }
    100% { filter: blur(0px); }
  }

  @keyframes flash-saturate {
    0%   { filter: saturate(1); }
    20%  { filter: saturate(2.5); }
    100% { filter: saturate(1); }
  }

  @keyframes flash-contrast {
    0%   { filter: contrast(1); }
    20%  { filter: contrast(2); }
    100% { filter: contrast(1); }
  }

  @keyframes flash-hue {
    0%   { filter: hue-rotate(0deg); }
    20%  { filter: hue-rotate(40deg); }
    100% { filter: hue-rotate(0deg); }
  }

  .flash-anim {
    animation-duration: 0.6s;
    animation-timing-function: ease-out;
    animation-fill-mode: forwards;
  }

  /* Fixed position + mix-blend-mode is a documented WebKit/iOS bug:
     fixed elements get their own compositing layer and silently fail
     to blend with content behind them. Rather than chase that, make
     the blend inert on touch/mobile so effects degrade to flat tints
     instead of glitching. No !important needed: these are plain class
     selectors with nothing else competing for them. */
  @media (max-width: 768px), (pointer: coarse) {
    .loading-screen,
    .flash-overlay,
    .loading-text {
        mix-blend-mode: color-dodge;
          }
  }

  /* ============================================================
     CONTROL TRAY (effects toggle, hue dial, about toggle/panel)
     Mobile-first: a single flex container handles spacing so the
     widgets can never overlap, instead of three independently
     positioned fixed elements with hand-picked offsets.
     ============================================================ */
  .control-tray {
    position: fixed;
    inset: auto var(--tray-inset) var(--tray-inset) var(--tray-inset);
    z-index: 99999;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-end;
    gap: var(--space-2);
    pointer-events: none;
    opacity: 0.6;
    transition: opacity 0.6s ease;
  }

  .control-tray > * {
    pointer-events: auto;
  }

  .tray-btn {
    padding: 0.65rem var(--space-3);
    min-height: var(--tray-btn-height);
    background: var(--terminal-bg);
    color: var(--terminal-green);
    border: 1px solid var(--terminal-green);
    border-radius: 4px;
    font: 700 0.85rem var(--font-mono);
    cursor: pointer;
    transition: color 0.15s ease;
  }

  .hue-dial {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: var(--space-1);
    background: var(--terminal-bg);
    border: 1px solid var(--terminal-green);
    border-radius: 4px;
    padding: 0.4rem 0.6rem;
  }

  .hue-dial-label {
    color: var(--terminal-green);
    font: 700 0.75rem var(--font-mono);
  }

  .hue-tick {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    text-align: center;
    cursor: pointer;
    background: var(--terminal-bg);
    color: var(--terminal-green);
    font: 700 1.1rem/40px var(--font-mono);
    border: 2px solid var(--terminal-green);
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  .hue-tick--active {
    border-color: #fff;
  }

  .about-panel {
    display: none;
    position: fixed;
    left: var(--tray-inset);
    bottom: calc(var(--tray-btn-height) + var(--tray-inset) + var(--space-2));
    z-index: 100000;
    padding: var(--space-2) var(--space-3);
    background: rgba(0, 0, 0, 0.85);
    color: #aaa;
    font-family: system-ui, sans-serif;
    font-size: 0.8rem;
    border: 1px solid var(--terminal-green);
    border-radius: 4px;
    max-width: 280px;
  }

  .about-panel.is-open {
    display: block;
  }

  .about-panel a { color: #e29742; }

  .control-tray:hover {
    opacity: 1;
  }

  body.effects-off .control-tray {
    opacity: 1;
    transition: none;
  }

  body.pre-load .control-tray {
    opacity: 0;
    pointer-events: none;
  }

  /* ============================================================
     PROGRESSIVE ENHANCEMENT — larger screens
     ============================================================ */
  @media (min-width: 600px) {
    .control-tray {
      align-items: center;
    }
  }

  /* ============================================================
     FX UTILITIES — special effects (kept for any inline markup
     that references these classes)
     ============================================================ */
  [class*="fx-shadow-"] {
    mix-blend-mode: multiply;
    opacity: 1;
    filter: drop-shadow(8px 8px 10px black);
  }

  [class*="fx-dropshadow-"] {
    opacity: 1;
    filter: drop-shadow(0 0 0.5px black);
  }

  [class*="fx-highlight-"] {
    mix-blend-mode: screen;
    opacity: 0.7;
  }

  [class*="fx-glow-"] {
    mix-blend-mode: plus-lighter;
    filter: blur(5px);
  }

  [class*="fx-texture-"] {
    mix-blend-mode: color-burn;
  }

  [class*="fx-wizard-"] {
    mix-blend-mode: color-dodge;
    filter: blur(3px);
    opacity: 0.5;
  }

  [class*="fx-blur-"] {
    filter: blur(3px);
  }

  [class*="fx-blur-screen"] {
    filter: blur(0.45px);
    mix-blend-mode: screen;
  }

  [class*="fx-normal-"]     { mix-blend-mode: normal; }
  [class*="fx-multiply-"]   { mix-blend-mode: multiply; }
  [class*="fx-screen-"]     { mix-blend-mode: screen; }
  [class*="fx-overlay-"]    { mix-blend-mode: overlay; }
  [class*="fx-darken-"]     { mix-blend-mode: darken; }
  [class*="fx-lighten-"]    { mix-blend-mode: lighten; }
  [class^="fx-colordodge-"] { mix-blend-mode: color-dodge; }
  [class^="fx-colorburn-"]  { mix-blend-mode: color-burn; }
  [class*="fx-hardlight-"]  { mix-blend-mode: hard-light; }
  [class*="fx-softlight-"]  { mix-blend-mode: soft-light; }
  [class*="fx-difference-"] { mix-blend-mode: difference; }
  [class*="fx-exclusion-"]  { mix-blend-mode: exclusion; }
  [class*="fx-hue-"]        { mix-blend-mode: hue; }
  [class*="fx-saturation-"] { mix-blend-mode: saturation; }
  [class^="fx-color-"]      { mix-blend-mode: color; }

  /* ============================================================
     PRINT
     ============================================================ */
  @media print {
    .loading-screen,
    .flash-overlay,
    .vignette-overlay,
    .control-tray,
    .about-panel {
      display: none;
    }

    body, html {
      background: #fff;
    }

    #page, body, html {
      height: auto;
      filter: none;
      opacity: 1;
      padding-bottom: 0;
    }

    .site-header, .site-header *, #page, #page * {
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    a[href^="http"]:not([href*="mbricknell.com"])::after {
      filter: none;
    }
  }
</style>
</head>
<body class="pre-load">
  <div id="loading-screen" class="loading-screen">
    <div class="loading-img" data-stage="off"></div>
    <div class="loading-img" data-stage="init"></div>
    <div class="loading-img" data-stage="on"></div>
    <div class="loading-text">LOADING...</div>
  </div>

  <div class="flash-overlay"></div>
  <div class="vignette-overlay"></div>

  <div class="control-tray">
    <button id="about-toggle" class="tray-btn">about</button>
    <div id="hue-dial" class="hue-dial">
      <span class="hue-dial-label">colors:</span>
    </div>
    <button id="effects-toggle" class="tray-btn">turn effects off</button>
  </div>

  <div id="page" class="main">
    <header class="site-header">
      <h1>Michael Bricknell</h1>
      <p>Cartographer and data visualization designer. Maps, spatial data tools, and design-driven graphics.</p>
      <p><a href="https://observablehq.com/@mbrickmaps" style="color:#e29742;">@mbrickmaps on Observable</a></p>
    </header>
  </div>

  <div id="about-panel" class="about-panel">
    "Sixtyfour Convergence" font by <a href="https://fonts.google.com/?query=Simon%20Cozens">Simon Cozens</a>, <a href="https://fonts.google.com/?query=Jens%20Kut%C3%ADlek">Jens Kutílek</a>
  </div>

  <script type="module">
    import {Runtime, Inspector} from "https://cdn.jsdelivr.net/npm/@observablehq/runtime@5/dist/runtime.js";
    import notebook from "https://api.observablehq.com/@mbrickmaps/content.js?v=4";

    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    let effectsOn = !isMobile;
    const loadingScreen = document.getElementById('loading-screen');

    // --- hue picker ---
    const HUE_STOPS = 4;
    let currentHue = 0;

    const dial = document.getElementById('hue-dial');

    const hueTicks = [];
    for (let i = 0; i < HUE_STOPS; i++) {
      const angle = i * (360 / HUE_STOPS);

      const tick = document.createElement('button');
      tick.type = 'button';
      tick.className = 'hue-tick';
      tick.textContent = i + 1;
      tick.dataset.angle = angle;
      tick.classList.toggle('hue-tick--active', angle === currentHue);
      tick.addEventListener('click', () => {
        currentHue = angle;
        hueTicks.forEach(t => t.classList.toggle('hue-tick--active', Number(t.dataset.angle) === currentHue));
        applyHue();
      });
      dial.appendChild(tick);
      hueTicks.push(tick);
    }

    function applyHue() {
      document.getElementById('page').style.filter = effectsOn ? 'hue-rotate(' + currentHue + 'deg) saturate(4)' : '';
    }

    function applyEffectsState() {
      const overlay = document.querySelector('.flash-overlay');
      const vignette = document.querySelector('.vignette-overlay');
      const aboutToggle = document.getElementById('about-toggle');
      const aboutPanel = document.getElementById('about-panel');
      document.getElementById('effects-toggle').textContent = 'turn effects ' + (effectsOn ? 'off' : 'on');
      applyHue();
      document.body.classList.toggle('plain-text', !effectsOn);
      document.body.classList.toggle('effects-off', !effectsOn);
      if (!effectsOn) {
        overlay.style.opacity = '0';
        document.querySelectorAll('.flash-anim').forEach(el => {
          el.classList.remove('flash-anim');
          el.style.animationName = '';
        });
        loadingScreen.style.display = 'none';
        dial.style.display = 'none';
        vignette.style.display = 'none';
        aboutToggle.style.display = 'none';
        aboutPanel.classList.remove('is-open');
      } else {
        loadingScreen.style.display = '';
        dial.style.display = 'flex';
        vignette.style.display = '';
        aboutToggle.style.display = '';
      }
    }

    document.getElementById('effects-toggle').addEventListener('click', function () {
      effectsOn = !effectsOn;
      this.textContent = 'turn effects ' + (effectsOn ? 'off' : 'on');
      applyEffectsState();
    });

    applyEffectsState();

    document.getElementById('about-toggle').addEventListener('click', function () {
      document.getElementById('about-panel').classList.toggle('is-open');
    });

    const stages = document.querySelectorAll('.loading-img');
    const page = document.getElementById('page');
    const loadingText = document.querySelector('.loading-text');

    const flashAnimations = [
      'flash-brightness',
      'flash-blur',
      'flash-saturate',
      'flash-contrast',
      'flash-hue'
    ];

    function triggerRandomFlash(el) {
      if (!effectsOn) return;
      const chosen = flashAnimations[Math.floor(Math.random() * flashAnimations.length)];
      el.classList.add('flash-anim');
      el.style.animationName = chosen;

      el.addEventListener('animationend', function handler() {
        el.classList.remove('flash-anim');
        el.style.animationName = '';
        el.removeEventListener('animationend', handler);
      });
    }

    function showStage(name) {
      stages.forEach(img => img.classList.toggle('active', img.dataset.stage === name));
    }

    function splitIntoChars(el) {
      const text = el.textContent;
      el.textContent = '';
      [...text].forEach((char, i) => {
        const span = document.createElement('span');
        span.textContent = char === ' ' ? ' ' : char;
        span.style.setProperty('--i', i);
        span.classList.add('char');
        el.appendChild(span);
      });
    }
    splitIntoChars(loadingText);

    showStage('off');

    setTimeout(() => {
      showStage('init');
      loadingText.style.opacity = '1';
      loadingText.classList.add('blink');
    }, 300);

    const runtime = new Runtime();
const targetName = location.pathname.replace(/\/$/, "") === "/home" ? "mediaRoomPage" : "page";
const main = runtime.module(notebook, name => {
  if (name === targetName) {
    return new Inspector(document.getElementById("page"));
  }
});

    function dismissLoadingScreen() {
      showStage('on');
      triggerRandomFlash(document.querySelector('[data-stage="on"]'));
      loadingText.classList.remove('blink');
      loadingText.style.display = 'none';
      page.classList.add('loaded');
      setTimeout(() => {
        document.body.classList.remove('pre-load');
      }, 700);
    }

main.value(targetName).then(() => {
  dismissLoadingScreen();
}).catch(err => {
  console.error("Observable content failed to load:", err);
  dismissLoadingScreen();
});

    function randomFlash() {
      if (effectsOn) {
        const overlay = document.querySelector('.flash-overlay');
        const peak = 0.08 + Math.random() * 0.14;
        overlay.style.opacity = String(peak);
        setTimeout(() => { overlay.style.opacity = '0'; }, 60 + Math.random() * 140);
      }
      setTimeout(randomFlash, 2500 + Math.random() * 8000);
    }
    randomFlash();

    function selectText(element) {
      if (!element) return;
      const range = document.createRange();
      range.selectNodeContents(element);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
    }

    window.addEventListener('DOMContentLoaded', function () {
      const target = document.querySelector('.select');
      selectText(target);
    });
  </script>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-1J5XCP3RRH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-1J5XCP3RRH');

    document.addEventListener("click", (e) => {
      const link = e.target.closest("a");
      if (link && link.href) {
        gtag("event", "link_click", {
          link_url: link.href,
          link_text: link.textContent.trim()
        });
      }
    });

    window.addEventListener("message", (e) => {
      if (e.data.event === "card_click") {
        gtag("event", "card_click", {
          link_url: e.data.link_url,
          link_text: e.data.link_text
        });
      }
      if (e.data.event === "swatch_click") {
        gtag("event", "swatch_click", {
          color_value: e.data.color_value
        });
      }
    });
  </script>
</body>
</html>
