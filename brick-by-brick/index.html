   made yet — and it is a few hundred screen pixels across, does not zoom, and
   snaps to a grid, so you cannot even put an endpoint on the corner of a
   window.

   So the photo gets its own surface, at its own resolution, and measuring here
   is in image pixels, which are meaningless until you say otherwise. You say
   otherwise by drawing one line along something you DO know the size of — a
   scale bar, a doorway, a car, a person — and typing what it is worth. Every
   line on the photo then reads in those units, including the ones you had
   already drawn.

   That is the whole tool. Not a perspective correction, not a rectification:
   one ratio, applied everywhere. It is honest about the cost of that, which is
   that a line running away from the camera reads short, and it says so rather
   than pretending. Measuring across the face of a building is the case that
   matters and the case this gets right.
   ========================================================================== */
function renderRuler(model, host) {
  //  Built once. The model has nothing to do with this panel, and rebuilding
  //  would throw away the photo and every line on it.
  if (host._rulerBuilt) return;
  host._rulerBuilt = true;
  host.innerHTML = "";

  const el = (tag, cls, parent) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (parent) parent.appendChild(n);
    return n;
  };

  const wrap = el("div", "rl-wrap", host);
  const bar = el("div", "rl-bar", wrap);
  const stage = el("div", "rl-stage", wrap);
  const cv = el("canvas", null, stage);
  const empty = el("div", "rl-empty", stage);
  /*  ONE CHILD, NOT LOOSE TEXT.

      This is a centring flex container, and a flex container turns each run of
      bare text between its element children into its own anonymous flex item.
      With a <b> and a <br> in the middle, the sentence was chopped into three
      items and laid out side by side in columns — "Drop a photograph here, or"
      stacked in one narrow column, "open…" in the next. A single wrapper is
      one item, and the text inside it flows as text. */
  const emptyText = el("span", null, empty);
  emptyText.innerHTML = "Drop a photograph here, or <b>open…</b> one.<br>"
    + "Draw a line along something you know the size of, say what it is worth, "
    + "and everything else you draw reads in those units.";
  const foot = el("div", "rl-bar", wrap);

  let img = null;              // the photograph, at its own resolution
  let fit = 1;                 // image pixels per screen pixel, from the fit
  let ox = 0, oy = 0;          // where the fitted image sits in the canvas
  const lines = [];            // { x0, y0, x1, y1 } in IMAGE pixels
  let ref = null;              // index of the calibrating line, or null

  /*  EVERYTHING IS HELD IN METRES.

      Not because metres are the right unit to think in — you will want feet
      for a Victorian mill — but because a calibration held in the unit it was
      typed in cannot be read back in another one without carrying the original
      around anyway. One base unit, converted on the way in and on the way out,
      and switching what you are reading in is then a change to one number and
      not a recalibration.

      The list is what you would actually measure a building in. Adding to it
      is a line. */
  const UNITS = { mm: 0.001, cm: 0.01, m: 1, in: 0.0254, ft: 0.3048, yd: 0.9144 };
  let perM = 0;                // metres for one image pixel
  let unit = "ft";             // what the numbers are being READ in
  const per = () => (perM > 0 ? perM / UNITS[unit] : 0);

  /*  PERSPECTIVE.

      One ratio is a lie about a photograph taken at an angle. It is true only
      for things lying parallel to the film at one particular depth: the moment
      a wall runs away from the camera, a foot at the far end covers fewer
      pixels than a foot at the near end, and no single number can be right for
      both.

      What fixes it is knowing ONE RECTANGLE. Four points that you know are the
      corners of a real rectangle — a door, a window, a gable, a panel — carry
      enough information to undo the projection across the whole of the flat
      surface they lie on. Say what that rectangle really measures and the
      surface is not just square again, it is to scale, and everything on it
      can be measured including the diagonals.

      This is a homography and it is eight numbers. There is no camera in it,
      no lens, no guessing: four points in, four points out, solve the linear
      system. What it cannot do is measure anything off that surface — the roof
      is a different plane, and the yard in front of the building is another
      one again. Measuring the side wall means squaring up the side wall. */
  let quad = null;             // 4 image points known to be a real rectangle
  let quadW = 0, quadH = 0;    // what that rectangle really measures, in metres
  let plane = null;            // the homography, image pixels -> metres
  let picking = null;          // corners collected so far, while collecting

  /*  Eight unknowns from four correspondences, by plain Gaussian elimination
      with partial pivoting. An 8x8 solve is nothing, and a closed form for
      this would be a page of algebra nobody could check. */
  function solve(A, y) {
    const n = y.length;
    for (let c = 0; c < n; c++) {
      let best = c;
      for (let r = c + 1; r < n; r++) if (Math.abs(A[r][c]) > Math.abs(A[best][c])) best = r;
      if (Math.abs(A[best][c]) < 1e-12) return null;      // degenerate: no answer
      [A[c], A[best]] = [A[best], A[c]];
      [y[c], y[best]] = [y[best], y[c]];
      for (let r = 0; r < n; r++) {
        if (r === c) continue;
        const f = A[r][c] / A[c][c];
        if (!f) continue;
        for (let k = c; k < n; k++) A[r][k] -= f * A[c][k];
        y[r] -= f * y[c];
      }
    }
    return y.map((v, i) => v / A[i][i]);
  }

  /*  The corners are taken in the order they were clicked and mapped onto the
      rectangle's corners in the same order, so any starting corner and either
      direction round works — what must not happen is clicking them in a figure
      of eight, which maps the surface onto a bow tie. */
  function buildPlane() {
    plane = null;
    if (!quad || quad.length !== 4 || !(quadW > 0) || !(quadH > 0)) return;
    const dst = [[0, 0], [quadW, 0], [quadW, quadH], [0, quadH]];
    const A = [], y = [];
    for (let i = 0; i < 4; i++) {
      const [x, v] = [quad[i].x, quad[i].y];
      const [u, w] = dst[i];
      A.push([x, v, 1, 0, 0, 0, -u * x, -u * v]); y.push(u);
      A.push([0, 0, 0, x, v, 1, -w * x, -w * v]); y.push(w);
    }
    const h = solve(A, y);
    if (h) plane = h;
  }

  //  An image pixel, in metres on the squared-up surface.
  const onPlane = p => {
    const [a, b2, c, d, e, f, g2, h2] = plane;
    const w = g2 * p.x + h2 * p.y + 1;
    if (!w) return { x: 0, y: 0 };
    return { x: (a * p.x + b2 * p.y + c) / w, y: (d * p.x + e * p.y + f) / w };
  };
  let anchor = null;           // the line being dragged, while it is dragged
  let live = null;

  /*  Kept for the session and no longer. The photograph is somebody's 4MB
      holiday snap and localStorage is a 5MB drawer that the sprite editor's
      draft is already living in; quietly filling it to save a reference you
      are done with in ten minutes is a bad trade. */

  const len = l => Math.hypot(l.x1 - l.x0, l.y1 - l.y0);
  /*  Two decimals is a lie about a measurement taken by eye off a photograph,
      and none is unusable for anything under a foot. One, and it can say
      "8 ft" flat when the number is round. */
  const say = n => {
    /*  Millimetres do not want a decimal and metres want two — a tenth of a
        millimetre off a photograph is a fiction, and 3.7 m loses the 5 cm that
        might matter. The unit decides, not one rule for all of them. */
    const dp = unit === "mm" ? 0 : (unit === "m" || unit === "yd") ? 2 : 1;
    const r = +n.toFixed(dp);
    return (Number.isInteger(r) ? r : r.toFixed(dp)) + " " + unit;
  };
  /*  Through the squared-up surface when one has been set, which is the only
      honest answer on an angled photograph, and by the flat ratio otherwise. */
  const realOfLine = l => {
    if (plane) {
      const a = onPlane({ x: l.x0, y: l.y0 }), b = onPlane({ x: l.x1, y: l.y1 });
      return Math.hypot(b.x - a.x, b.y - a.y) / UNITS[unit];
    }
    return perM > 0 ? len(l) * per() : 0;
  };
  const label = l => ((plane || perM > 0) ? say(realOfLine(l))
                                          : Math.round(len(l)) + " px");

  /*  The fit, recomputed on every paint because a panel can be resized by its
      own corner handle at any moment. Never magnified past 1:1 — blowing a
      small photograph up adds no detail and only makes the endpoints harder to
      place, since a screen pixel then covers less than an image pixel. */
  function layout() {
    const box = stage.getBoundingClientRect();
    const w = Math.max(40, Math.floor(box.width));
    const h = Math.max(40, Math.floor(box.height));
    cv.width = w; cv.height = h;
    if (!img) { fit = 1; ox = oy = 0; return; }
    const s = Math.min(w / img.width, h / img.height, 1);
    fit = 1 / s;
    ox = Math.round((w - img.width * s) / 2);
    oy = Math.round((h - img.height * s) / 2);
  }

  //  Screen to image and back. Every line is stored in image pixels, so a
  //  resize of the panel moves the drawing and not the measurements.
  const toImg = e => {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left - ox) * fit, y: (e.clientY - r.top - oy) * fit };
  };
  const sx = x => ox + x / fit;
  const sy = y => oy + y / fit;

  function paint() {
    layout();
    const g = cv.getContext("2d");
    g.clearRect(0, 0, cv.width, cv.height);
    if (!img) { empty.hidden = false; sync(); return; }
    empty.hidden = true;
    /*  Smoothed, unlike everywhere else in this file. This is a photograph
        being shrunk to fit a panel, not pixel art being blown up: nearest
        neighbour here would drop every second row of a 3000px image and throw
        away the detail you are trying to measure. */
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = "high";
    g.drawImage(img, 0, 0, img.width, img.height,
                ox, oy, img.width / fit, img.height / fit);

    /*  THE RECTANGLE, IF ONE HAS BEEN NAMED.

        Magenta and dashed, in nothing like the colour of a measurement, and
        drawn under them: it is not a thing you measured, it is the statement
        about the ground that makes the measurements mean anything. */
    const corners = quad || picking;
    if (corners && corners.length) {
      g.save();
      g.strokeStyle = plane ? "rgba(255,120,220,0.95)" : "rgba(255,120,220,0.6)";
      g.lineWidth = 1.5;
      g.setLineDash([5, 3]);
      g.beginPath();
      corners.forEach((c, i) => {
        const X = sx(c.x), Y = sy(c.y);
        if (i) g.lineTo(X, Y); else g.moveTo(X, Y);
      });
      if (corners.length === 4) g.closePath();
      g.stroke();
      g.setLineDash([]);
      corners.forEach((c, i) => {
        g.fillStyle = "rgba(0,0,0,0.6)";
        g.beginPath(); g.arc(sx(c.x), sy(c.y), 4.5, 0, Math.PI * 2); g.fill();
        g.fillStyle = "rgb(255,140,225)";
        g.beginPath(); g.arc(sx(c.x), sy(c.y), 2.5, 0, Math.PI * 2); g.fill();
        //  Numbered while picking, because the order is the one thing that can
        //  go wrong and the one thing you cannot see afterwards.
        if (!quad) {
          g.font = "10px ui-monospace, monospace";
          g.fillStyle = "rgb(255,190,240)";
          g.fillText(String(i + 1), sx(c.x) + 6, sy(c.y) - 6);
        }
      });
      g.restore();
    }

    const all = anchor && live ? lines.concat([{ x0: anchor.x, y0: anchor.y,
                                                 x1: live.x, y1: live.y }]) : lines;
    all.forEach((l, i) => {
      const isRef = i === ref;
      const a = { x: sx(l.x0), y: sy(l.y0) }, b = { x: sx(l.x1), y: sy(l.y1) };
      /*  Drawn twice, dark under light. A thin bright line over a photograph
          disappears the moment it crosses anything pale, and a photograph is
          mostly pale somewhere. */
      g.lineCap = "round";
      g.strokeStyle = "rgba(0,0,0,0.55)"; g.lineWidth = 3.5;
      g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
      g.strokeStyle = isRef ? "rgb(120,235,150)" : "rgb(255,235,120)";
      g.lineWidth = 1.5;
      g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
      //  End caps, so you can see exactly where you put it.
      for (const p of [a, b]) {
        g.fillStyle = "rgba(0,0,0,0.55)";
        g.beginPath(); g.arc(p.x, p.y, 3.5, 0, Math.PI * 2); g.fill();
        g.fillStyle = isRef ? "rgb(120,235,150)" : "rgb(255,235,120)";
        g.beginPath(); g.arc(p.x, p.y, 2, 0, Math.PI * 2); g.fill();
      }

      const txt = label(l) + (isRef ? "  ✓" : "");
      g.font = "11px ui-monospace, SFMono-Regular, Menlo, monospace";
      g.textBaseline = "top";
      const tw = g.measureText(txt).width, bw = tw + 8, bh = 15;
      /*  On the line's middle rather than an end: an end is where your hand
          is, and a label under the pointer is a label you cannot read while
          placing the thing it belongs to. */
      let lx = (a.x + b.x) / 2 - bw / 2, ly = (a.y + b.y) / 2 - bh - 5;
      lx = Math.max(0, Math.min(lx, cv.width - bw));
      ly = Math.max(0, Math.min(ly, cv.height - bh));
      g.fillStyle = "rgba(0,0,0,0.72)";
      g.fillRect(lx, ly, bw, bh);
      g.fillStyle = isRef ? "rgb(150,245,175)" : "rgb(255,240,160)";
      g.fillText(txt, lx + 4, ly + 2);
    });
    sync();
  }

  // ---- the bar
  const openBtn = el("button", null, bar);
  openBtn.type = "button"; openBtn.textContent = "open…";
  openBtn.title = "choose a photograph to measure";
  const fileIn = el("input", null, bar);
  fileIn.type = "file"; fileIn.accept = "image/*"; fileIn.hidden = true;
  openBtn.onclick = () => fileIn.click();
  fileIn.onchange = () => { if (fileIn.files && fileIn.files[0]) take(fileIn.files[0]); };

  const clearBtn = el("button", null, bar);
  clearBtn.type = "button"; clearBtn.textContent = "clear lines";
  clearBtn.onclick = () => { lines.length = 0; ref = null; perM = 0; paint(); };

  const dropBtn = el("button", null, bar);
  dropBtn.type = "button"; dropBtn.textContent = "close photo";
  dropBtn.onclick = () => {
    if (img && img.__url) URL.revokeObjectURL(img.__url);
    img = null; lines.length = 0; ref = null; perM = 0;
    paint();
  };

  const named = el("span", "rl-say", bar);

  /*  THE SENTENCE THAT MAKES THE NUMBERS MEAN ANYTHING.

      "this line is [12] [ft]" — read left to right, it says what it does. It
      was a labelled pair of boxes first, which is the same three facts
      arranged as a form and reads as one more thing to fill in. */
  const saidWhich = el("span", "rl-say", foot);
  saidWhich.textContent = "this line is";
  const amtIn = el("input", "rl-num", foot);
  amtIn.type = "number"; amtIn.min = "0"; amtIn.step = "any";
  amtIn.placeholder = "12";
  amtIn.title = "what that line is worth in the real world";
  const unitIn = el("select", "rl-unit", foot);
  for (const u of Object.keys(UNITS)) {
    const o = el("option", null, unitIn);
    o.value = u; o.textContent = u;
  }
  unitIn.value = unit;
  unitIn.title = "read every measurement in this — change it any time and "
               + "they all convert";
  /*  CHANGING THIS IS NOT A RECALIBRATION.

      The photograph did not change and neither did the line you measured; you
      have only asked to be told in different words. So the scale stays exactly
      where it is and the sentence above rewrites itself to match — set it to
      40 ft, switch to m, and it reads 12.19 m, which is the same fact. */
  unitIn.onchange = () => {
    unit = unitIn.value;
    if (perM > 0 && ref !== null) {
      const metres = len(lines[ref]) * perM;
      amtIn.value = +(metres / UNITS[unit]).toFixed(4);
    }
    paint();
  };
  const setBtn = el("button", null, foot);
  setBtn.type = "button"; setBtn.textContent = "set the scale";
  const calNote = el("span", "rl-cal", foot);

  /*  ITS OWN LINE, because it is a different claim about the photograph. The
      line above says how big one thing is; this says what shape the ground
      under everything is. */
  const foot2 = el("div", "rl-bar", wrap);
  const sqBtn = el("button", null, foot2);
  sqBtn.type = "button"; sqBtn.textContent = "square up\u2026";
  sqBtn.title = "click the four corners of something you know is a real "
              + "rectangle \u2014 a door, a window, a wall panel";
  el("span", "rl-say", foot2).textContent = "that rectangle is";
  const rwIn = el("input", "rl-num", foot2);
  rwIn.type = "number"; rwIn.min = "0"; rwIn.step = "any"; rwIn.placeholder = "wide";
  el("span", "rl-say", foot2).textContent = "\u00d7";
  const rhIn = el("input", "rl-num", foot2);
  rhIn.type = "number"; rhIn.min = "0"; rhIn.step = "any"; rhIn.placeholder = "tall";
  const sqNote = el("span", "rl-cal", foot2);
  const sqClear = el("button", null, foot2);
  sqClear.type = "button"; sqClear.textContent = "\u2297";
  sqClear.title = "forget the rectangle and go back to the flat ratio";

  const applyPlane = () => {
    quadW = (+rwIn.value || 0) * UNITS[unit];
    quadH = (+rhIn.value || 0) * UNITS[unit];
    buildPlane();
    paint();
  };
  sqBtn.onclick = () => { picking = []; quad = null; plane = null; paint(); };
  rwIn.oninput = applyPlane;
  rhIn.oninput = applyPlane;
  sqClear.onclick = () => {
    quad = null; plane = null; picking = null; quadW = quadH = 0;
    rwIn.value = ""; rhIn.value = "";
    paint();
  };

  /*  What you TYPED, kept as the fact it is. The length in units is what you
      said; the length in pixels is what you drew; the ratio between them is
      derived. Storing the ratio alone would mean that nudging the reference
      line's end changed how long the reference line is in feet, which is
      backwards — you did not move the doorway, you corrected where you had
      put the line on it. */
  let refMetres = 0;
  const recalibrate = () => {
    if (ref === null || !(refMetres > 0)) return;
    const px = len(lines[ref]);
    if (px > 0) perM = refMetres / px;
  };

  /*  Always the last line drawn, which is what the sentence says. Changing
      which line is the reference is done by drawing another one, not by a
      selection mode nobody asked for. */
  const calibrate = () => {
    if (!lines.length) return;
    const amt = +amtIn.value;
    const i = ref === null ? lines.length - 1 : ref;
    if (!lines[i] || !(amt > 0) || !(len(lines[i]) > 0)) return;
    unit = unitIn.value;
    refMetres = amt * UNITS[unit];
    ref = i;
    recalibrate();
    paint();
  };
  setBtn.onclick = calibrate;
  amtIn.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); calibrate(); } };
  unitIn.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); calibrate(); } };

  /*  The box shows what the selected line is worth right now — the figure you
      typed if it is calibrated, and the reading otherwise. Selecting a
      different line and pressing set the scale then means what it looks like
      it means, instead of quietly reusing the last number you typed for a
      completely different line. */
  const syncAmount = () => {
    if (ref === null || !lines[ref]) return;
    amtIn.value = perM > 0
      ? +(len(lines[ref]) * per()).toFixed(4)
      : "";
  };

  function sync() {
    const has = !!img, n = lines.length;
    clearBtn.disabled = !n;
    dropBtn.disabled = !has;
    unitIn.disabled = false;
    named.textContent = has ? (img.__name || "") : "";
    //  Nothing derived. "1 px = 0.034 ft" is arithmetic you did not ask for
    //  and cannot use; the numbers on the lines are the answer.
    calNote.textContent = plane ? "" : (perM > 0 ? "scale set" : "");
    //  While a rectangle is doing the work, the single ratio is not.
    amtIn.disabled = setBtn.disabled = !n || !!plane;
    sqClear.hidden = !quad && !picking;
    sqBtn.disabled = !has || !!picking;
    rwIn.disabled = rhIn.disabled = !quad;
    sqNote.textContent = picking
      ? "click corner " + (picking.length + 1) + " of 4"
      : plane ? "squared up \u2014 measurements on that surface are true"
      : quad ? "say how big it really is"
      : "";
  }

  // ---- taking a photograph
  async function take(file) {
    if (!file || !/^image\//.test(file.type)) return;
    const url = URL.createObjectURL(file);
    const got = await new Promise(res => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = () => res(null);
      im.src = url;
    });
    if (!got) { URL.revokeObjectURL(url); return; }
    if (img && img.__url) URL.revokeObjectURL(img.__url);
    got.__url = url;
    got.__name = file.name + "  ·  " + got.width + " × " + got.height;
    img = got;
    /*  A new photograph is a new subject, so the lines and the scale go with
        the old one. Keeping them would silently report the last building's
        measurements over this one. */
    lines.length = 0; ref = null; perM = 0;
    quad = null; plane = null; picking = null; quadW = quadH = 0;
    paint();
  }

  const stop = e => { e.preventDefault(); e.stopPropagation(); };
  stage.addEventListener("dragenter", e => { stop(e); stage.classList.add("drop"); });
  stage.addEventListener("dragover", stop);
  stage.addEventListener("dragleave", e => { stop(e); stage.classList.remove("drop"); });
  stage.addEventListener("drop", e => {
    stop(e);
    stage.classList.remove("drop");
    const f = [...((e.dataTransfer && e.dataTransfer.files) || [])]
      .find(x => /^image\//.test(x.type));
    if (f) take(f);
  });

  // ---- drawing lines
  /*  Within six screen pixels of an end. Generous, because the whole job is
      putting an endpoint exactly on a corner, and a target you have to hit
      precisely in order to correct where you were imprecise is a joke. */
  const NEAR = 6;
  const endNear = p => {
    for (let i = lines.length - 1; i >= 0; i--) {
      const l = lines[i];
      if (Math.hypot(sx(l.x0) - sx(p.x), sy(l.y0) - sy(p.y)) < NEAR) return { i, end: 0 };
      if (Math.hypot(sx(l.x1) - sx(p.x), sy(l.y1) - sy(p.y)) < NEAR) return { i, end: 1 };
    }
    return null;
  };
  /*  How far the pointer is from the line ITSELF, not from its ends. Clicking
      a line is how you say "this is the one that is 12 metres", so the whole
      length of it has to be a target. */
  const segNear = p => {
    for (let i = lines.length - 1; i >= 0; i--) {
      const l = lines[i];
      const ax = sx(l.x0), ay = sy(l.y0), bx = sx(l.x1), by = sy(l.y1);
      const px = sx(p.x), py = sy(p.y);
      const vx = bx - ax, vy = by - ay, ll = vx * vx + vy * vy;
      const t = ll ? Math.max(0, Math.min(1, ((px - ax) * vx + (py - ay) * vy) / ll)) : 0;
      if (Math.hypot(px - (ax + t * vx), py - (ay + t * vy)) < NEAR) return i;
    }
    return null;
  };
  let dragEnd = null;

  let dragLine = null;      // { i, x, y, from } while a whole line is moved

  cv.addEventListener("pointerdown", e => {
    if (!img) return;
    e.preventDefault();
    const p = toImg(e);
    /*  Right-click takes a line away — the same button that erases in the
        sprite editor, and removing a line is the erase of a line. */
    if (e.button === 2) {
      //  Anywhere on the line, not only its ends — you delete a line by
      //  pointing at the line.
      const hit = endNear(p);
      const i = hit ? hit.i : segNear(p);
      if (i !== null && i !== undefined) {
        lines.splice(i, 1);
        if (ref === i) { ref = null; perM = 0; }
        else if (ref !== null && ref > i) ref--;
        paint();
      }
      return;
    }
    if (e.button !== 0) return;
    /*  Collecting corners takes the press ahead of everything else: while you
        are picking a rectangle you are not drawing lines, and a stray line
        across the middle of the four clicks is exactly what would happen. */
    if (picking) {
      picking.push(p);
      if (picking.length === 4) { quad = picking; picking = null; applyPlane(); }
      paint();
      return;
    }
    /*  Grab an end and you are moving that end. Measuring a photograph is
        mostly adjusting a line you have already drawn — you get it roughly
        right, then look closely and find you were two pixels off the corner. */
    const hit = endNear(p);
    if (hit) { dragEnd = hit; }
    else {
      /*  ON a line, and you are picking that line rather than starting a new
          one across it. That is the gesture for "this one is the twelve
          metres" — it was whichever you happened to have drawn last, which
          meant re-drawing a line you already had in order to point at it. */
      /*  A press on a line is either "this is the one that is 12 metres" or
          "this one is in the wrong place", and which of the two it is only
          becomes clear when you either move or do not move. So it is held as
          a possible move, and settles into a selection on release if the
          pointer never went anywhere. */
      const on = segNear(p);
      if (on !== null) {
        const l = lines[on];
        dragLine = { i: on, x: p.x, y: p.y, moved: false,
                     from: { x0: l.x0, y0: l.y0, x1: l.x1, y1: l.y1 } };
        try { cv.setPointerCapture(e.pointerId); } catch (err) { /* not captured */ }
        return;
      }
      anchor = p; live = p;
    }
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* not captured */ }
    paint();
  });

  cv.addEventListener("pointermove", e => {
    if (!img) return;
    const p = toImg(e);
    if (dragLine) {
      const dx = p.x - dragLine.x, dy = p.y - dragLine.y;
      //  A hair of slop, so a click with a shaky hand is still a click.
      if (Math.hypot(dx, dy) / fit > 2) dragLine.moved = true;
      const l = lines[dragLine.i], f = dragLine.from;
      l.x0 = f.x0 + dx; l.y0 = f.y0 + dy;
      l.x1 = f.x1 + dx; l.y1 = f.y1 + dy;
      if (ref === dragLine.i) recalibrate();
      paint();
      return;
    }
    if (dragEnd) {
      const l = lines[dragEnd.i];
      if (dragEnd.end) { l.x1 = p.x; l.y1 = p.y; } else { l.x0 = p.x; l.y0 = p.y; }
      //  The ruler moved, so everything measured against it moves with it.
      if (ref === dragEnd.i) recalibrate();
      paint();
      return;
    }
    if (anchor) { live = p; paint(); return; }
    cv.style.cursor = endNear(p) ? "move"
                    : segNear(p) !== null ? "grab"
                    : "crosshair";
  });

  const done = e => {
    if (dragLine) {
      //  Never moved, so it was a click, so it was a choice of reference.
      if (!dragLine.moved) { ref = dragLine.i; syncAmount(); }
      dragLine = null;
      paint();
      return;
    }
    if (dragEnd) { dragEnd = null; paint(); return; }
    if (!anchor) return;
    const p = live || anchor;
    /*  A click that never moved is not a line. It is where somebody meant to
        press something, and leaving a zero-length dot on the photograph with
        "0 ft" beside it helps nobody. */
    if (Math.hypot(p.x - anchor.x, p.y - anchor.y) * (1 / fit) >= 3) {
      lines.push({ x0: anchor.x, y0: anchor.y, x1: p.x, y1: p.y });
      /*  ONLY WHILE THERE IS NO SCALE YET.

          A new line used to become the reference every time, which meant that
          once you had set your scale, the next line you drew silently took the
          job over and the box under the photograph filled with ITS length. The
          scale you set is a decision; drawing another line is not a request to
          change it. So a fresh line adopts the reference only when nothing has
          been calibrated — which is the one case where it is what you want,
          because it is the line you are about to type a number for. */
      if (!plane && !(perM > 0)) { ref = lines.length - 1; syncAmount(); }
    }
    anchor = null; live = null;
    paint();
  };
  cv.addEventListener("pointerup", done);
  cv.addEventListener("pointercancel", done);
  cv.addEventListener("contextmenu", e => e.preventDefault());

  /*  The panel is resizable by its own corner, and the fit is computed from
      the stage. Without this the photograph keeps the size it had when it was
      opened and the lines drift off it. */
  /*  And only when the box has actually changed. Belt as well as braces: a
      resize observer that repaints unconditionally is one stylesheet change
      away from being a loop again, and this one is cheap to make impossible. */
  if (typeof ResizeObserver === "function") {
    let lastW = 0, lastH = 0;
    const ro = new ResizeObserver(() => {
      const b = stage.getBoundingClientRect();
      const w = Math.floor(b.width), h = Math.floor(b.height);
      if (w === lastW && h === lastH) return;
      lastW = w; lastH = h;
      paint();
    });
    ro.observe(stage);
  }
  paint();
}

function renderSpriteEditor(model, host) {
  // Built once. The model changes on every keystroke and this panel has
  // nothing to do with the pile — rebuilding would wipe your drawing.
  if (host._spriteBuilt) return;
  host._spriteBuilt = true;
  host.innerHTML = "";

  const wear = { body: makeBodySheet(), bottom: makeBottomSheet(),
                 top: makeTopSheet(), hat: makeHatSheet() };
  const layers = host._layers = {};
  for (const k of ROWS) { layers[k] = layerCopy(wear[k]); layers[k].__frames = SPR_FRAMES; }

  /*  A place scene is the fifth thing you can draw here, and it is not a
      layer: it stands behind a column rather than on a body, it never walks,
      and it is never recolored. Same editor all the same — it is the same job
      of putting pixels down and seeing them in place, and a second panel would
      only drift from this one. */
  const TARGETS = ROWS.concat(["place"]);
  const PLACE_W = 102, PLACE_H = 64;      // 102 is the widest that draws 1:1 in a column
  layers.place = (() => {
    const c = document.createElement("canvas");
    c.width = PLACE_W; c.height = PLACE_H;
    c.getContext("2d").imageSmoothingEnabled = false;
    c.__frames = 1;
    return c;
  })();
  const isPlace = () => slot === "place";

  /*  What has been drawn on, and so must not be replaced under the hand.

      The editor opens whatever file already exists for the name you have
      typed — otherwise naming a place you drew last week and getting a blank
      rectangle is baffling. But it opens it only while the canvas is still
      untouched: once you have made a mark, the name is a label for what you
      are drawing, not a request to throw it away. */
  const touched = {};
  let loadToken = 0;
  //  Which name the canvas was last filled from, so the panel can tell when the
  //  name in the box has moved on from what you are looking at.
  let loadedAs = "";
  //  What each kind of drawing measured when it came off disk. See `defaultCell`.
  const bornCell = { wear: null, place: null };

  const blitInto = (cv, img) => {
    cv.width = img.width; cv.height = img.height;
    const g = cv.getContext("2d");
    g.imageSmoothingEnabled = false;
    g.clearRect(0, 0, cv.width, cv.height);
    g.drawImage(img, 0, 0);
    /*  A place drawn when anchors were magenta comes in with its anchor turned
        into a flag, so the pink pixel is gone from the canvas the moment it
        opens and the next download writes it the current way. Places only:
        an anchor is a thing a building has, and nothing else here should have
        a colour quietly changed on the way in. */
    if (cv === layers.place && cv.width && cv.height) {
      let d;
      try { d = g.getImageData(0, 0, cv.width, cv.height); } catch (e) { return; }
      if (adoptOldAnchors(d.data, cv.width, cv.height, ANCHOR_A).length) {
        g.putImageData(d, 0, 0);
      }
    }
  };

  /*  The four rows as one file, laid out the way the compositor reads them:
      centered across, standing on the bottom of their own band. Cell size and
      frame count are the largest any row asks for, so the sheet fits the
      broadest hat and every row is cut the same way on the way back in. */
  function stitchSheet() {
    const cells = ROWS.map(k => {
      const cv = layers[k], n = cv.__frames || SPR_FRAMES;
      return { cv, n, w: cv.width / n, h: cv.height };
    });
    const cw = Math.max(SPR_W, ...cells.map(c => c.w));
    const ch = Math.max(SPR_H, ...cells.map(c => c.h));
    const out = document.createElement("canvas");
    out.width = cw * SPR_FRAMES; out.height = ch * ROWS.length;
    const g = out.getContext("2d");
    g.imageSmoothingEnabled = false;
    cells.forEach((cell, i) => {
      const dx = Math.round((cw - cell.w) / 2), dy = i * ch + (ch - cell.h);
      // A row with fewer frames than the sheet repeats, so a still hat sits
      // quietly on a walking body rather than vanishing for three frames.
      for (let f = 0; f < SPR_FRAMES; f++) {
        g.drawImage(cell.cv, (f % cell.n) * cell.w, 0, cell.w, cell.h,
                    f * cw + dx, dy, cell.w, cell.h);
      }
    });
    return out;
  }

  /*  Fill every untouched row from disk, down the same chain the Promenade
      walks: this name's loose layer, then this name's sheet, then everybody's
      loose layer, then everybody's sheet, then the built-in.

      Bails when the load has been overtaken — a keystroke in the name box
      starts another pass, and a slow 404 from the old name must not land on
      top of the new one. */
  async function fillFromDisk(my) {
    const base = ASSET_BASE + "images/wear/";
    const named = slugify(nameIn.value.trim());
    const whos = named && named !== "default" ? [named, "default"] : ["default"];
    const sheets = new Map();
    const sheetOf = async who => {
      if (!sheets.has(who)) sheets.set(who, await loadImg(base + encodeURIComponent(who) + ".png"));
      return sheets.get(who);
    };
    for (let i = 0; i < ROWS.length; i++) {
      const k = ROWS[i];
      if (touched[k]) continue;
      let img = null;
      for (const who of whos) {
        img = await loadImg(base + encodeURIComponent(who + "." + k) + ".png");
        if (img) break;
        const sh = await sheetOf(who);
        const rows = sh ? sheetRows(sh) : null;
        if (rows && rows[i]) { img = rows[i]; break; }
      }
      if (my !== loadToken || !host.isConnected || touched[k]) return;
      /*  Nothing anywhere for this row, so the built-in stands in. Restoring
          it matters on the way back: typing a name that has art and then
          clearing it would otherwise leave that person's coat on everybody. */
      blitInto(layers[k], img || wear[k]);
      layers[k].__frames = SPR_FRAMES;
    }
  }

  /*  What the preview is FOR is seeing a layer among the others, so every row
      is opened, not only the one under the pen. */
  function openExisting() {
    const my = ++loadToken;
    if (isPlace()) {
      if (touched.place) return;
      const base = ASSET_BASE + "images/places/";
      const named = slugify(nameIn.value.trim());
      const tries = [];
      if (named) tries.push(base + encodeURIComponent(named) + ".png");
      tries.push(base + "default.png");
      (async () => {
        for (const url of tries) {
          const img = await loadImg(url);
          if (!img) continue;
          if (my !== loadToken || !host.isConnected || touched.place) return;
          blitInto(layers.place, img);
          layers.place.__frames = 1;
          bornCell.place = { w: layers.place.width, h: layers.place.height };
          loadedAs = slugify(nameIn.value.trim());
          syncSize(); paint();
          return;
        }
      })();
      return;
    }
    (async () => {
      await fillFromDisk(my);
      if (my === loadToken && host.isConnected) {
        bornCell.wear = { w: cellW(), h: cellH() };
        loadedAs = slugify(nameIn.value.trim());
        syncSize(); paint();
      }
    })();
  }

  /*  `linked` is on to begin with, and it is the difference between this being
      usable and being four times the work: a stroke goes into every frame at
      once, so one drawing is a finished layer that simply does not move.
      Turn it off when you actually want to animate something. */
  /*  `all frames` starts OFF. Writing into four frames at once is a surprising
      thing for an editor to do without being asked — you draw one stroke and
      three others appear somewhere you were not looking. Switch it on when you
      want a layer that does not move. */
  /*  The walk starts STOPPED. It is a drawing tool before it is an animation
      one, and a figure pacing beside you the whole time you are working on a
      sleeve is movement in the corner of your eye that you did not ask for.
      `paint` draws the preview whether or not it is running, so a stopped
      preview still shows the figure — it just stands still. */
  let slot = "top", frame = 0, pen = 0, onion = true, playing = false, linked = false;
  //  Drawing the picture, or marking what parts of it mean.
  let fxMode = false, fxKind = GLASS_A;
  let gridOn = true, axesOn = true;
  const GRIDSTEP_KEY = "brick-by-brick:gridstep:v1";
  let gridStep = 4;
  try {
    const n = +localStorage.getItem(GRIDSTEP_KEY);
    if (n >= 2 && n <= 32) gridStep = Math.round(n);
  } catch (e) { /* unavailable */ }
  /*  CURSOR.

      A crosshair is two lines with a hole where the point should be, which is
      the wrong shape for a job measured in whole cells: it tells you roughly
      where you are and never which square you are on. The alternative is to
      hide the pointer entirely and let the outlined cell BE the cursor —
      exactly as accurate as the thing you are about to do.

      A preference, not a mode, so it is remembered. */
  const CURSOR_KEY = "brick-by-brick:spcursor:v1";
  let cellCursor = false;
  try { cellCursor = localStorage.getItem(CURSOR_KEY) === "1"; } catch (e) { /* unavailable */ }
  let tool = "pencil";

  /*  GUIDES.

      The two center lines are fixed and they are the only references this had.
      A guide is the same idea unfixed: a line you put where the drawing needs
      one — a shoulder height, a roof pitch, the eaveline every window on a
      terrace has to sit under.

      All three kinds are one thing. A guide is a cell to pivot on and an angle
      to leave it at, so horizontal is 0°, vertical is 90°, and a roof is
      whatever the roof is. Degrees run anticlockwise from east the way anyone
      reading a slope expects — positive rises to the right — which is the
      opposite of the canvas's own downward y, and the only place that matters
      is the one line that turns an angle into a direction.

      A line has no ends, so 0° and 180° are the same guide; angles are kept in
      [0, 180). They are the editor's, not the layer's — a shoulder line is
      still the shoulder line when you switch from the coat to the hat — and
      they are drawn onto the working canvas only, never into a layer, so
      nothing here can reach the exported PNG. */
  const GUIDE_KEY = "brick-by-brick:guides:v1";
  let guides = [];
  try {
    const raw = JSON.parse(localStorage.getItem(GUIDE_KEY) || "[]");
    if (Array.isArray(raw)) {
      guides = raw.filter(g => g && [g.x, g.y, g.deg].every(n => typeof n === "number" && isFinite(n)))
                  .map(g => ({ x: g.x | 0, y: g.y | 0, deg: normDeg(g.deg) }))
                  .slice(0, 64);
    }
  } catch (e) { /* unavailable */ }
  const saveGuides = () => {
    try { localStorage.setItem(GUIDE_KEY, JSON.stringify(guides)); } catch (e) { /* unavailable */ }
  };
  /*  Into [0, 180). A guide drawn right-to-left is the same guide. */
  function normDeg(d) {
    if (!isFinite(d)) return 0;
    let n = d % 180;
    if (n < 0) n += 180;
    return Math.round(n * 10) / 10;
  }
  /*  The unit vector along a guide, in CANVAS space — where y grows downward
      and the angle does not. This negation is the whole of the conversion. */
  const guideDir = deg => {
    const r = deg * Math.PI / 180;
    return { dx: Math.cos(r), dy: -Math.sin(r) };
  };
  /*  Which guide is under a point, if any: the perpendicular distance from an
      infinite line is the cross product with its direction. */
  function guideNear(px, py, within) {
    let best = -1, bestD = within;
    guides.forEach((g, i) => {
      const { dx, dy } = guideDir(g.deg);
      const d = Math.abs((px - (g.x + 0.5)) * dy - (py - (g.y + 0.5)) * dx);
      if (d <= bestD) { bestD = d; best = i; }
    });
    return best;
  }

  const el = (tag, cls, parent) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (parent) parent.appendChild(n);
    return n;
  };

  const wrap = el("div", "sp-wrap", host);
  const left = el("div", "sp-left", wrap);
  const grid = el("canvas", "sp-grid", left);

  const right = el("div", "sp-right", wrap);

  /*  AS BIG AS THE ROOM ALLOWS — AT WHOLE PIXELS.

      The canvas used to be capped by the column's width and nothing else, so
      a 102-wide place came out at about four screen pixels per drawn one, and
      the panel's height went unspent besides.

      What it does NOT do is stretch the finished canvas with CSS. That is the
      obvious way to fill a box and it rescales everything drawn into it: the
      grid rules, which are one pixel wide by construction, come out three
      pixels thick and soft. Instead the cell size itself is chosen to fit the
      room — a whole number of screen pixels per drawn pixel — and the canvas
      is left at its own size. A rule is then a rule, and a pixel is square. */
  /*  Everything stacked under the canvas, whatever it turns out to be. It was
      a single named row; it is two now and could be three, and a count that
      has to be kept in step with the markup is a count that will not be. */
  const belowGrid = () => {
    let h = 0;
    for (let n = grid.nextElementSibling; n; n = n.nextElementSibling) {
      if (n.offsetParent === null) continue;             // hidden costs nothing
      h += n.offsetHeight + 6;                           // plus its own gap
    }
    return h;
  };
  const fitZ = (cw, ch) => {
    const availW = left.clientWidth;
    /*  Measured from the CANVAS, not from the column. There is a tool row over
        it now, so "where the column starts" stopped being where the drawing
        starts — and sizing against the column's top pushed the canvas down
        past the bottom of the panel by exactly the height of that row.

        The canvas's own top does not depend on its height (it is laid out
        after the row above it), so reading it here cannot chase itself. */
    const rw = wrap.getBoundingClientRect(), rg = grid.getBoundingClientRect();
    const availH = rw.height - (rg.top - rw.top) - belowGrid();
    if (!(availW > 0 && availH > 0)) return 8;   // not laid out yet
    return Math.max(2, Math.min(40, Math.floor(Math.min(availW / cw, availH / ch))));
  };
  /*  The room changes when the panel is dragged, not only when we redraw.
      Watching `wrap` and not `left`: `left` is the box the canvas is sized
      inside, and watching what you change is how an observer starts a loop.
      The repaint is skipped unless the cell size actually moved, so settling
      a scrollbar does not put us in one either. */
  let lastZ = 0;
  if (window.ResizeObserver) {
    new ResizeObserver(() => { if (fitZ(cellW(), cellH()) !== lastZ) paint(); }).observe(wrap);
  }

  // ---- which layer
  const slotBar = el("div", "sp-row", right);
  el("span", "sp-cap", slotBar).textContent = "type";
  /*  The caption takes a line of its own so the five buttons get the whole
      width. They are one set and they were breaking four-and-one, which reads
      as "place" being a different kind of thing from the rest — it is not, it
      is the fifth thing you can draw. */
  el("span", "sp-break", slotBar);
  const slotBtns = TARGETS.map(name => {
    const b = el("button", null, slotBar);
    b.type = "button"; b.textContent = name;
    b.title = name === "body" ? "the figure itself, under everything"
            : name === "place" ? "scenery, standing behind a column"
            : "a layer, centered on the " + name + " anchor";
    b.onclick = () => { slot = name; syncSize(); openExisting(); paint(); };
    return b;
  });

  // ---- how big it is
  const sizeBar = el("div", "sp-row", right);
  el("span", "sp-cap", sizeBar).textContent = "size";
  const wIn = el("input", null, sizeBar);
  el("span", "sp-x", sizeBar).textContent = "\u00d7";
  const hIn = el("input", null, sizeBar);
  for (const [i, t] of [[wIn, "width of one frame, in pixels"], [hIn, "height, in pixels"]]) {
    i.type = "number"; i.min = "1"; i.max = "256"; i.title = t; i.className = "sp-num";
  }
  /*  There was a "frames" spinner here, capped at four, which read as a
      limitation rather than a choice — the only honest answers it took were 1
      and 4, and offering 2 and 3 alongside them invited a question the format
      cannot answer. The capability it set is untouched: a row still carries
      its own frame count, a shorter row still repeats across the sheet, and a
      one-frame hat loaded from disk still sits still on a walking body. It is
      simply read from the file now instead of typed. */
  /*  Size is the FIGURE's, not one layer's.

      Every layer shares a cell — that is what lets a hat sit on a head without
      anchors or configuration. So resizing one layer alone is not a thing
      that can mean anything: shrink the hat's box on its own and the hat comes
      off the head, or gets cropped away entirely, depending which edge you
      anchor to. Both happened while I was building this.

      So the box belongs to all four layers at once. Growing it is headroom for
      everybody; the drawings keep their distance from the ground line, which
      is the bottom edge.

      Frames stay per row — a still hat on a walking body is perfectly sensible
      — but they cannot exceed the sheet's four, because the saved file is four
      columns and nothing in a PNG can say otherwise. A shorter row is written
      out repeated, which is exactly how a one-frame hat behaves already. */
  const applySize = () => {
    const cap = isPlace() ? 256 : 64;       // scenery is allowed to be a building
    const w = Math.max(1, Math.min(cap, +wIn.value || 1));
    const h = Math.max(1, Math.min(cap, +hIn.value || 1));
    //  The row keeps whatever frame count it arrived with; only the box changes.
    const n = isPlace() ? 1 : nFrames();
    //  Shrinking crops. Nothing else here can lose pixels without a stroke.
    if (w !== cellW() || h !== cellH()) snapshot();
    if (isPlace()) {
      layers.place = layerResize(layers.place, w, h, 1);
    } else {
      for (const k of ROWS) {
        layers[k] = layerResize(layers[k], w, h, k === slot ? n : undefined);
      }
      frame = Math.min(frame, nFrames() - 1);
    }
    syncSize(); paint();
  };
  wIn.onchange = hIn.onchange = applySize;

  /*  `change` fires on blur, so the real-world size sat on the old numbers
      the whole time you were typing new ones — which looks exactly like a
      conversion that does not work. This answers as you type; the resize
      still waits for you to finish, because resizing per keystroke would
      crop the drawing to 1 x 1 on the way to 120. */
  wIn.oninput = hIn.oninput = () =>
    syncReal(Math.max(1, +wIn.value || 0), Math.max(1, +hIn.value || 0));

  // ---- what to paint with
  /*  A few colors to hand, and a picker for everything else. Nothing here
      means anything to the page — a pixel is the color you paint it. */
  /*  The palette. Nine colors that suit a Victorian street, and yours to
      replace — the whole set is editable as a list of hex codes and kept in
      the browser, because a palette is a decision about a project rather than
      a fact about the tool. */
  const SWATCH_KEY = "brick-by-brick:swatches:v1";
  const DEFAULT_SWATCHES = ["#c9a689", "#aa8970", "#4a3b2a", "#2f3542", "#4a5568",
                            "#5a4632", "#7a6247", "#8a2f2f", "#3a4a3a"];
  const SWATCHES = [];
  const readHexes = text => (String(text).match(/#?[0-9a-fA-F]{6}\b/g) || [])
    .map(h => "#" + h.replace("#", "").toLowerCase());
  (() => {
    let raw;
    try { raw = JSON.parse(localStorage.getItem(SWATCH_KEY) || "null"); } catch (e) { raw = null; }
    const kept = Array.isArray(raw) ? raw.filter(c => /^#[0-9a-f]{6}$/i.test(c)) : [];
    SWATCHES.push(...(kept.length ? kept : DEFAULT_SWATCHES));
  })();
  const saveSwatches = () => {
    try {
      if (SWATCHES.join() === DEFAULT_SWATCHES.join()) localStorage.removeItem(SWATCH_KEY);
      else localStorage.setItem(SWATCH_KEY, JSON.stringify(SWATCHES));
    } catch (e) { /* unavailable */ }
  };
  /*  Four slots that fill themselves. A color earns a place here by being
      USED — picked and actually put on the canvas — because a color you tried
      and abandoned is not one you want back. Newest first, and a color already
      held moves to the front rather than taking a second slot. */
  const RECENT = [];
  function remember(c) {
    if (!c || SWATCHES.includes(c)) return;
    const i = RECENT.indexOf(c);
    if (i !== -1) RECENT.splice(i, 1);
    RECENT.unshift(c);
    RECENT.length = Math.min(RECENT.length, 4);
  }
  const penBar = el("div", "sp-row", right);
  el("span", "sp-cap", penBar).textContent = "paint";
  /*  EVERY SWATCH IS THREE.

      Lighter above, the colour itself, darker below. Pixel art at this size is
      almost entirely shading — a coat is one colour and two shades of it, and
      the hat brim is the coat's dark — so having to open the picker and mix a
      highlight by eye every time is most of the work of drawing anything
      round.

      The two extras are not new colours in their own right: they are ±22% of
      the one in the middle, which is enough to read as light and shade
      without leaving the same garment. They pick through the picker rather
      than the swatch index, since they have no index of their own — which
      also means using one puts it in the recents, exactly as a mixed colour
      would. */
  const SHADE = 0.22;
  let penBtns = [];
  /*  Rebuilt rather than patched when the palette changes: the row is a column
      of three buttons per color wired to its index, and reconciling that in
      place would be more code than making it again. */
  const penCols = el("span", "sp-pen-set", penBar);
  function buildPens() {
    /*  THE TONE ARROWS LIVE IN THIS ROW TOO, and have to survive the rebuild.

        They were put in here deliberately — appended to the bar instead, the
        row wraps and they land on the second line beside the erase square,
        nowhere near the stacks they move. But that also put them in the way of
        `innerHTML = ""`: apply a palette of your own and the arrows vanished
        until the panel was reopened.

        Found through the DOM rather than by name because this runs once before
        that binding exists. Taking the node out and putting it back keeps its
        handlers — the element is detached, not destroyed. */
    const tone = penCols.querySelector(".sp-tone-col");
    penCols.innerHTML = "";
    penBtns = [];
    SWATCHES.forEach((c, i) => {
      const col = el("div", "sp-pen-col", penCols);
      const pick = (hex, cls, tip) => {
        const b = el("button", "sp-pen " + cls, col);
        b.type = "button"; b.style.background = hex; b.title = tip;
        return b;
      };
      const up = pick(shadeHex(c, SHADE), "sp-shade", "lighter " + c);
      const mid = pick(c, "", c);
      const down = pick(shadeHex(c, -SHADE), "sp-shade", "darker " + c);
      mid.onclick = () => { pen = i; fixed.value = c; paint(); };
      up.onclick = () => { pen = -2; fixed.value = shadeHex(c, SHADE); paint(); };
      down.onclick = () => { pen = -2; fixed.value = shadeHex(c, -SHADE); paint(); };
      penBtns.push(mid);
    });
    if (tone) penCols.appendChild(tone);   // last again, after the new stacks
    // A palette that just shrank could leave the pen pointing past its end.
    if (pen >= SWATCHES.length) pen = SWATCHES.length - 1;
  }
  buildPens();
  /*  Ends the swatch line. The erase square, the picker and the palette button
      are what you reach for BETWEEN colours, not among them, and on the same
      line they read as a tenth and eleventh swatch. */
  el("span", "sp-break", penBar);
  const eraseBtn = el("button", "sp-pen sp-erase", penBar);
  eraseBtn.type = "button"; eraseBtn.title = "erase";
  eraseBtn.onclick = () => { pen = -1; paint(); };
  /*  NOT COLOURS. MEANINGS.

      Beside the erase square, because that is where the things you paint with
      that are not colours already live. A place only — a coat has no windows —
      so they are hidden on the wear layers rather than sitting there inviting
      you to mark a sleeve as glass.

      They paint the reserved marker colours, which the street then repaints
      according to the hour. What you see on the editor canvas is the marker
      itself, which is loud on purpose: a window you cannot pick out from the
      wall around it is a window you cannot tell you have drawn. */
  el("span", "sp-break", penBar);
  /*  THE THREE MARKERS, TOGETHER.

      A window, a door and the anchor are one idea in three parts: a reserved
      colour that the street reads as a meaning rather than as paint. Split
      between two rows — two here and the anchor up in the tools — you had to
      already know they were related to find the third.

      The anchor is still a tool and the other two are still pens, because that
      is what they are: one puts a single pixel, the others draw. But they are
      chosen from one place. */
  /*  TWO MODES, NOT A SPECIAL SET OF TOOLS.

      Marking had its own tools, which meant learning a second way to draw: a
      marker that filled a region, a marker that painted a pixel, neither of
      them the pencil or the box you already know. That is a second editor
      bolted to the side of the first one.

      It is one editor with a switch. In EFFECTS the drawing goes faint and
      every tool you already have — pencil, line, box, fill — paints a MARK
      instead of a colour. Erase unmarks. Nothing else changes: the same tools,
      the same undo, the same right-click.

      What you are marking is chosen here; what you mark WITH is the whole tool
      row, unchanged. */
  el("span", "sp-break", penBar);
  const fxBtn = el("button", "sp-fx", penBar);
  fxBtn.type = "button"; fxBtn.textContent = "paint";
  /*  ONE BUTTON PER ROW OF `EFFECTS`, and nothing here names an effect.

      Each wears the colour its wash paints on the canvas, so the row and the
      drawing agree without anybody having to remember which is which, and each
      hands you the drawing tool that suits it. */
  const markBtns = EFFECTS.map(e => {
    const b = el("button", "sp-pen sp-mark", penBar);
    b.type = "button";
    b.textContent = e.glyph;
    b.title = e.tip;
    b.style.background = e.ink;
    b.dataset.kind = e.id;
    b.onclick = () => {
      /*  An effect that places a single pixel is a TOOL of its own; the rest
          are marks you paint with whatever the row says suits them. */
      if (e.one) { tool = e.tool; }
      else { fxKind = e.alpha; tool = e.tool; }
      paint();
    };
    return b;
  });

  fxBtn.onclick = () => {
    fxMode = !fxMode;
    //  Coming out of effects holding the anchor would leave a tool with no row.
    //  An effect-only tool has no button outside effects, so nobody should be
    //  left holding one.
    if (!fxMode && EFFECTS.some(e => e.one && e.tool === tool)) tool = "pencil";
    paint();
  };

  const fixed = el("input", null, penBar);
  fixed.type = "color"; fixed.value = "#8a2f2f";
  fixed.title = "any other color";
  fixed.oninput = () => { pen = -2; paint(); };
  const recentBtns = [0, 1, 2, 3].map(i => {
    const b = el("button", "sp-pen sp-recent", penBar);
    b.type = "button";
    b.onclick = () => { if (RECENT[i]) { pen = -2; fixed.value = RECENT[i]; paint(); } };
    return b;
  });

  /*  THE PALETTE LIST.

      Folded away behind one button, because it is a thing you set up once and
      then want out of the way — the swatches themselves are the everyday
      control and this is the drawer behind them.

      Free text rather than a row of pickers: a palette usually arrives from
      somewhere else, as a list off a reference, a Lospec page or another
      project's file, and pasting that in whole is the fast path. Anything that
      looks like a six-digit hex is taken and everything else is ignored, so
      commas, quotes, brackets and a leading # all work and none of them has to
      be explained. */
  const palBtn = el("button", "sp-pal-btn", penBar);
  palBtn.type = "button";
  palBtn.textContent = "\u22EF";
  palBtn.title = "edit the palette";
  /*  WHICH OF THE THREE IS THE BIG ONE.

      Every colour is a stack: lighter, the colour, darker. The middle one is
      the tall square and the shades are slivers either side, which is right
      when you are painting the colour and wrong the moment you are working in
      its highlights — then the sliver is the one you keep aiming at.

      These two nudge the stack so a different row is the tall one. Nothing
      about the colours changes and nothing is recomputed; it is which row your
      pointer can hit easily, and it slides rather than jumping so you can see
      which way it went. */
  /*  Stacked, and pushed to the end of the row: up above down is the shape the
      thing they move already has, so the pair reads as one control rather than
      as two more buttons in a row of buttons. */
  const toneCol = el("span", "sp-tone-col", penBar);
  const toneUp = el("button", "sp-tone", toneCol);
  toneUp.type = "button"; toneUp.textContent = "\u25B2";
  toneUp.title = "make the lighter shades the easy ones to hit";
  const toneDown = el("button", "sp-tone", toneCol);
  toneDown.type = "button"; toneDown.textContent = "\u25BC";
  toneDown.title = "make the darker shades the easy ones to hit";
  let toneFocus = 0;                    // -1 dark, 0 the colour, +1 light
  const syncTone = () => {
    penCols.classList.toggle("sp-focus-light", toneFocus > 0);
    penCols.classList.toggle("sp-focus-dark", toneFocus < 0);
    toneUp.disabled = toneFocus >= 1;
    toneDown.disabled = toneFocus <= -1;
  };
  /*  Onto the swatch line itself. Built last but belonging first: the row
      wraps, and appended at the end these landed on the second line with the
      picker and the palette button — beside the erase square rather than
      beside the stacks they move. */
  penCols.appendChild(toneCol);
  toneUp.onclick = () => { toneFocus = Math.min(1, toneFocus + 1); syncTone(); };
  toneDown.onclick = () => { toneFocus = Math.max(-1, toneFocus - 1); syncTone(); };
  syncTone();

  const palBox = el("div", "sp-pal", right);
  palBox.hidden = true;
  const palIn = el("input", "sp-pal-in", palBox);
  palIn.type = "text";
  palIn.spellcheck = false;
  palIn.placeholder = "hex list \u2014 Enter to apply";
  palIn.title = "any six-digit hex codes, in any shape: commas, quotes, "
              + "brackets and a leading # are all ignored";
  const palNote = el("span", "sp-pal-note", palBox);

  const showPal = () => { palIn.value = SWATCHES.join(", "); palNote.textContent = ""; };
  palBtn.onclick = () => {
    palBox.hidden = !palBox.hidden;
    if (!palBox.hidden) { showPal(); palIn.focus(); }
    palBtn.classList.toggle("on", !palBox.hidden);
  };
  const applyPal = list => {
    if (!list.length) { palNote.textContent = "no hex codes in that"; return; }
    SWATCHES.length = 0;
    SWATCHES.push(...list);
    saveSwatches();
    buildPens();
    showPal();
    paint();
    palNote.textContent = list.length + " color" + (list.length === 1 ? "" : "s");
  };
  /*  One line, and Enter applies it. It was a four-row box with its own apply
      button, which is a form — and this is one field holding one list. */
  palIn.onkeydown = e => {
    if (e.key === "Enter") { e.preventDefault(); applyPal(readHexes(palIn.value)); }
    if (e.key === "Escape") { palBox.hidden = true; palBtn.classList.remove("on"); }
  };

  // Directly under the swatches it edits, rather than at the foot of the panel.
  right.insertBefore(palBox, penBar.nextSibling);

  const toolBar = el("div", "sp-row", right);
  el("span", "sp-cap", toolBar).textContent = "tools";
  /*  U+25AB and U+25AA are the WHITE and BLACK SMALL SQUARE — small is in the
      name, and they came out as specks beside the other glyphs. Their
      full-size counterparts say the same thing and can actually be seen. */
  const TOOLS = [
    ["pencil", "\u270E", "freehand"],
    ["line",   "\u2571", "straight line \u2014 drag from one end to the other"],
    ["rect",   "\u25A1", "box outline"],
    ["fill",   "\u25A0", "filled box"],
    ["move",   "\u2725", "nudge what is drawn — drag it into place"],
    ["copy",   "\u29C9", "drag a box to lift those pixels, then click to stamp them down"],
    ["guide",  "\u2220", "drag out a guide \u2014 shift snaps to 15\u00b0, right-click removes one"],
    /*  Spelled out, with the arrows still on it. A lone glyph in a row of
        glyphs made you hover to find out which one asked a question instead of
        making a mark, and this is the one tool that changes nothing. */
    ["measure", "\u2190measure\u2192", "how big is that \u2014 click a shape, or "
              + "drag across anything. Changes nothing. Mark as many as you like "
              + "— they stay while you draw. ⊗ drops one, right-click "
              + "drops the lot."],
  ];
  /*  THE ANCHOR IS NOT IN THIS ROW.

      It was, and it did not belong: this row is how you MAKE a mark — pencil,
      line, box, fill — and the anchor is one of three things that say what a
      mark MEANS. Those three now sit together beside the erase square, which
      is where the things you paint with that are not colours already live. */
  const toolBtns = TOOLS.map(([id, glyph, tip]) => {
    /*  A word is not an icon: the square, oversized box that makes a pencil
        legible would only stretch a label. */
    const b = el("button", glyph.length > 2 ? null : "sp-tool", toolBar);
    b.type = "button"; b.textContent = glyph; b.title = tip;
    /*  THE MARKS OUTLIVE THE TOOL.

        Switching away used to wipe them, which got the point of measuring
        exactly backwards: you measure a doorway so you can go and draw against
        it, and the moment you picked up the pencil the answer disappeared. They
        stay now, through every tool, until you press the ⊗ on one. Nothing in
        this row takes them away — a measurement is dismissed where it is, not
        from a button somewhere else. */
    b.onclick = () => { tool = id; paint(); };
    return b;
  });

  /*  UNDO.

      `empty board` is one press and there is nothing underneath it, which is
      the case that asked for this — but an undo that only undoes one button is
      a strange thing to own, so it takes a copy before anything destructive:
      a stroke, a shape, a nudge, a resize, a dropped file, and the emptying.

      A copy of all five layers, not a diff. At 24x28x4 that is a few hundred
      kilobytes for a stack of twenty-four and it cannot get out of step with
      what is on the canvas, which a diff can. `layerCopy` does not carry the
      frame count across — it copies pixels — so that is put back by hand.

      Snapshots are taken at the START of a stroke, so one undo takes back one
      stroke rather than one pixel of one. */
  const UNDO_MAX = 24;
  const undos = [], redos = [];
  const undoBtn = el("button", null, null);
  undoBtn.type = "button"; undoBtn.textContent = "undo";
  undoBtn.title = "take back the last thing that changed the drawing \u2014 "
                + "including emptying the board";
  const redoBtn = el("button", null, null);
  redoBtn.type = "button"; redoBtn.textContent = "redo";
  redoBtn.title = "put back the last thing you took away";

  //  A copy of all five layers. `layerCopy` carries pixels and not the frame
  //  count, so that goes across by hand.
  const capture = () => {
    const shot = {};
    for (const k of TARGETS) {
      shot[k] = layerCopy(layers[k]);
      shot[k].__frames = layers[k].__frames;
    }
    return shot;
  };
  /*  Everything comes back touched. A restored layer is your work, and the
      name box must not be able to fetch a file over the top of it. */
  const restore = shot => {
    wipSeq++;                       // undo changes the drawing like anything else
    for (const k of TARGETS) { layers[k] = shot[k]; touched[k] = true; }
  };
  const syncHistory = () => {
    undoBtn.disabled = !undos.length;
    redoBtn.disabled = !redos.length;
  };
  const snapshot = () => {
    undos.push(capture());
    if (undos.length > UNDO_MAX) undos.shift();
    /*  A new mark ends the branch you had stepped back from. Keeping those
        futures would let redo paste in work that never followed what is on
        the canvas now. */
    redos.length = 0;
    syncHistory();
  };
  const step = (from, to) => {
    if (!from.length) return;
    to.push(capture());
    if (to.length > UNDO_MAX) to.shift();
    restore(from.pop());
    syncHistory();
    syncSize(); paint();
    recordStep();
  };
  undoBtn.onclick = () => step(undos, redos);
  redoBtn.onclick = () => step(redos, undos);
  syncHistory();

  /*  RECORDING.

      Every drawing here is a sequence of decisions and the file keeps only the
      last one. This keeps the rest: a picture of the whole drawing after each
      committed change, so you can watch it arrive.

      A PNG per step rather than a canvas per step. A canvas is 69KB of raw
      RGBA whatever is on it; the same frame as a PNG is a kilobyte or so,
      because pixel art is flat colour and compresses enormously. Five hundred
      steps is then under a megabyte instead of thirty-five, and the encoding
      lands after your stroke rather than during it.

      A BUDGET, and it counts down where you can see it. Recording that quietly
      fills memory until something gives is worse than recording that stops and
      says so — and the number on the button means you always know how much
      room is left rather than finding out at the end.

      Memory only. Frames go when the tab does: a session's worth of drawing is
      not something this browser's storage should be holding, and that storage
      is the pile's. */
  const REC_BUDGET = 500;
  /*  TWO RECORDINGS, NOT ONE.

      A wardrobe is one drawing made of four layers — you go body, bottom, top,
      hat and back again, and every one of those steps belongs to the same
      figure arriving. A place is a different drawing entirely, on a different
      canvas at a different size.

      One shared list put both in the same reel: switch to the place mid-record
      and a 102x64 building appeared in the middle of somebody getting dressed,
      and the export letterboxed the whole thing to whichever shape it met
      first. So the wear layers share a recording and the place keeps its own,
      and the buttons follow whichever you are drawing. */
  const recSets = { wear: { frames: [], left: 0, on: false, k: 0, fw: 0, fh: 0, used: false },
                    place: { frames: [], left: 0, on: false, k: 0, fw: 0, fh: 0, used: false } };
  const rec = () => recSets[isPlace() ? "place" : "wear"];
  let replaying = 0;
  /*  Drawn instead of the layers while a replay runs, so nothing in the file
      is touched by watching it. Declared up here because `paint` reads it and
      `paint` runs while this panel is still being built. */
  let replayShot = null;

  const recBtn = el("button", null, null);
  recBtn.type = "button";
  const replayBtn = el("button", null, null);
  replayBtn.type = "button"; replayBtn.textContent = "replay";
  replayBtn.title = "watch it arrive, from the first mark";
  /*  There was no way to throw a reel away — you could stop recording and
      start again, and the new steps simply piled onto the old ones. Discard
      empties this reel and hands its budget back, so the next `record` starts
      from five hundred rather than from wherever the last one left off. */
  const dropRecBtn = el("button", null, null);
  dropRecBtn.type = "button"; dropRecBtn.textContent = "clear";
  dropRecBtn.onclick = () => {
    if (replaying) { replaying = 0; replayShot = null; }
    const r = rec();
    r.frames = []; r.left = 0; r.on = false; r.k = 0; r.fw = 0; r.fh = 0;
    expK.value = "";                          // `used` stays: you still want these
    hint.textContent = "recording discarded";
    syncRec();
    paint();
  };

  const syncRec = () => {
    const r = rec();
    recBtn.textContent = r.on ? "rec " + r.left
                       : r.left === 0 && r.frames.length ? "rec +" + REC_BUDGET
                       : "record";
    recBtn.classList.toggle("on", r.on);
    recBtn.title = r.on
      ? "stop recording \u2014 " + r.left + " steps left of " + REC_BUDGET
        + ", frames kept in memory only"
      : r.frames.length
      ? r.frames.length + " frames recorded for " + (isPlace() ? "this place" : "this wardrobe")
      : "keep a picture of the drawing after every change";
    /*  SHOWN ONCE ASKED FOR, THEN THEY STAY.

        These appeared with the first frame and vanished with the last, so
        clearing a reel took the controls away with it — you pressed clear and
        the row you were working in collapsed, which reads as the thing having
        closed rather than emptied. Once you have pressed record they are
        yours; empty they are simply disabled, which says "nothing to replay"
        without moving anything.

        Available WHILE recording, too. Watching what you have so far is most
        useful mid-way, and nothing here writes to a layer, so a replay cannot
        disturb the take it is showing you. */
    const shown = r.used || r.frames.length > 0;
    const empty = r.frames.length === 0;
    for (const n of [replayBtn, dropRecBtn, expBtn, expK, expX, expOut]) n.hidden = !shown;
    for (const n of [replayBtn, dropRecBtn, expBtn, expK]) n.disabled = empty;
    if (empty) expOut.textContent = "";
    dropRecBtn.title = "throw away these " + r.frames.length
                     + " frames and hand the budget back";
    /*  Filled as soon as there is anything to export, not only once the
        controls are on screen — they were hidden while recording, so the
        defaults never ran and the boxes were empty when they appeared, which
        the export then clamped to its 16px floor. */
    if (r.frames.length) {
      if (!r.k) expDefaults();
      expK.value = r.k;
      expOut.textContent = (r.fw * r.k) + " \u00d7 " + (r.fh * r.k);
    }
  };
  recBtn.onclick = () => {
    const r = rec();
    if (r.on) { r.on = false; }
    else { r.on = true; r.used = true; if (r.left <= 0) r.left = REC_BUDGET; recordStep(); }
    syncRec();
  };
  /*  What the drawing IS, not what the canvas happens to be showing: the same
      image `download` would hand you, so a replay is the artwork arriving
      rather than a recording of a panel. */
  /*  WHAT A REPLAY IS OF.

      It was `stitchSheet()` — the four rows and four frames laid out as they
      go into the PNG. That is the FILE's shape, not the drawing's: watching it
      back you saw sixteen little cells changing rather than a person being
      dressed, which is nobody's idea of what they were doing.

      So a wear reel records the figure, composed the way the street composes
      it, at the frame you are standing on. A place already recorded the thing
      itself and is unchanged. */
  function recordShot() {
    if (isPlace()) return layers.place;
    const who = dressBody(ROWS.map(k => ({ img: layers[k], slot: k })), false);
    if (!who) return stitchSheet();
    const fw = who.__cellW || SPR_W, fh = who.__cellH || SPR_H;
    const n = who.__frames || SPR_FRAMES;
    const one = document.createElement("canvas");
    one.width = fw; one.height = fh;
    const g2 = one.getContext("2d");
    g2.imageSmoothingEnabled = false;
    g2.drawImage(who, (frame % n) * fw, 0, fw, fh, 0, 0, fw, fh);
    return one;
  }

  function recordStep() {
    const r = rec();
    if (!r.on || r.left <= 0) return;
    try {
      const cv = recordShot();
      const url = cv.toDataURL("image/png");
      //  A step that changed nothing is not a step.
      if (r.frames.length && r.frames[r.frames.length - 1] === url) return;
      r.frames.push(url);
      r.fw = cv.width; r.fh = cv.height;      // what the export scales up from
      r.left--;
      if (r.left <= 0) r.on = false;          // stops itself rather than creeping on
      syncRec();
    } catch (e) { r.on = false; syncRec(); }
  }
  /*  EXPORT.

      The frames are already the drawing at each step; this puts them in a file
      somebody else can open. WebM through MediaRecorder, because it is in the
      browser already — a GIF encoder would be a library to carry for a format
      with 256 colours and worse compression.

      OUTPUT DIMENSIONS, because a 96-pixel sheet is not a video. It is scaled
      with smoothing OFF, so a pixel becomes a block of pixels rather than a
      blur, and letterboxed on the grid's own colour when the numbers you give
      do not match the drawing's shape — cropping would silently lose part of
      the thing you are exporting, and stretching would lie about it.

      Nearest whole multiple by default: at a whole number of screen pixels per
      drawn pixel every block is the same size, and at 3.7 they are not. */
  const expBtn = el("button", null, null);
  expBtn.type = "button"; expBtn.textContent = "export";
  /*  A FACTOR, NOT A WIDTH AND A HEIGHT.

      Two boxes let you ask for 500 x 300 of a 102 x 64 drawing, which is 4.9
      pixels across and 4.7 down — every block a slightly different size, which
      is the one thing pixel art cannot survive. It also meant carrying
      letterboxing and aspect maths for a shape mismatch that should never have
      been expressible.

      One number, and the answer is shown beside it. Whole multiples only, so
      every drawn pixel becomes exactly the same square. */
  const expK = el("input", "sp-num", null);
  expK.type = "number"; expK.min = "1"; expK.max = "32"; expK.step = "1";
  expK.title = "how many screen pixels per drawn pixel";
  const expX = el("span", "sp-x", null); expX.textContent = "\u00d7";
  const expOut = el("span", "sp-ans", null);
  /*  THE SIZE BELONGS TO THE RECORDING, NOT TO THE PANEL.

      These two boxes were one pair shared by both reels, filled the first time
      anything was recorded and never revisited — so a wardrobe recorded first
      left 384x448 in them, and exporting the place afterwards squeezed a
      102x64 building into a wardrobe's shape. The place was taking its
      dimensions from body, bottom, top and hat.

      Each recording now carries its own, worked out from its own drawing. */
  const expDefaults = () => {
    const r = rec();
    if (!r.fw || !r.fh) { const cv = recordShot(); r.fw = cv.width; r.fh = cv.height; }
    //  Big enough to see, at a whole multiple.
    r.k = Math.max(1, Math.min(32, Math.round(480 / Math.max(r.fw || 1, r.fh || 1))));
  };
  //  Typed in, and remembered against the reel you typed it for.
  expK.oninput = () => { rec().k = Math.max(1, Math.min(32, +expK.value || 1)); syncRec(); };
  const EXP_FPS = 12;
  expBtn.onclick = async () => {
    const frames = rec().frames;
    if (!frames.length || replaying) return;
    if (typeof MediaRecorder === "undefined") {
      hint.textContent = "this browser cannot record video";
      return;
    }
    const r = rec();
    if (!r.k) expDefaults();
    const k = Math.max(1, Math.min(32, r.k));
    /*  Even numbers. H.264 stores colour at half resolution, so an odd width
        or height has no whole chroma sample to sit in — encoders either refuse
        it or pad it and hand you a green edge. Both cell sizes here are even
        already; a hand-typed 25 is not. */
    const w = (r.fw * k + 1) & ~1, h = (r.fh * k + 1) & ~1;
    const cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    const c = cv.getContext("2d");
    c.imageSmoothingEnabled = false;
    /*  A stream fed by hand: one frame per step, held for the same time each,
        rather than whatever the browser felt like sampling. */
    const stream = cv.captureStream(0);
    const track = stream.getVideoTracks()[0];
    /*  MP4 FIRST, BECAUSE THAT IS WHAT ANYTHING WILL TAKE.

        This asked for WebM, which the browser makes happily and Instagram
        will not accept — nor will most places you would want to put a
        timelapse. Chrome and Safari both encode H.264 in an MP4 container
        through MediaRecorder now, so ask for that and keep WebM as the
        fallback for a browser that cannot. */
    const type = ["video/mp4;codecs=avc1.42E01E", "video/mp4;codecs=avc1", "video/mp4",
                  "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"]
      .find(t => MediaRecorder.isTypeSupported(t)) || "";
    const ext = /^video\/mp4/.test(type) ? "mp4" : "webm";
    const chunks = [];
    const mr = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
    mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    const done = new Promise(r => { mr.onstop = r; });
    mr.start();
    expBtn.disabled = true;
    for (let i = 0; i < frames.length; i++) {
      const img = await loadImg(frames[i]);
      if (!host.isConnected) break;
      c.fillStyle = gridBg;
      c.fillRect(0, 0, w, h);
      /*  A whole factor of the frame's own size, so it fills the canvas
          exactly — no letterbox, no crop, no fractional block. */
      if (img) c.drawImage(img, 0, 0, img.width, img.height, 0, 0, w, h);
      if (track.requestFrame) track.requestFrame();
      else if (stream.requestFrame) stream.requestFrame();
      hint.textContent = "exporting \u2014 frame " + (i + 1) + " of " + frames.length;
      await new Promise(r => setTimeout(r, 1000 / EXP_FPS));
    }
    mr.stop();
    await done;
    expBtn.disabled = false;
    const blob = new Blob(chunks, { type: type || "video/mp4" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = fileName().replace(/\.png$/, "") + "-" + w + "x" + h + "." + ext;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    hint.textContent = "exported " + frames.length + " frames at " + w + " \u00d7 " + h
                     + " as " + ext.toUpperCase();
  };

  replayBtn.onclick = async () => {
    const frames = rec().frames;
    if (replaying || !frames.length) return;
    const token = ++replaying;
    for (let i = 0; i < frames.length; i++) {
      if (token !== replaying) return;
      const img = await loadImg(frames[i]);
      if (token !== replaying || !host.isConnected) return;
      replayShot = img;
      paint();
      await new Promise(r => setTimeout(r, 80));
    }
    replayShot = null;
    replaying = 0;
    paint();
  };


  /*  SCALE — what one pixel is worth, out in the world.

      A place is a building, and buildings come with real numbers attached: a
      door is about 7 feet, a storey about 10, a kirk tower whatever the record
      says. None of that helps while you are drawing unless you can turn it
