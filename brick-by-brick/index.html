<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noimageindex">
<title>Brick by Brick</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧱</text></svg>">
<style>
  /* Palette and board grammar deliberately match collage/index.html (v2). */
  :root {
    /* Tells the browser to paint its OWN widgets dark — number-input spinners,
       select arrows, scrollbars, focus rings, autofill. Without it those stay
       light no matter what the rules below say, which is what made the Brick
       Builder fields look white. */
    color-scheme: dark;
    --bg: #111; --fg: #eee; --panel: #1a1a1a; --border: #333;
    --field: #0d0d0d;       /* inset surfaces: inputs, lists, code, canvases */
    --border-soft: #2b2b2b; /* hairlines inside a panel, quieter than --border */
    --accent: #ff5500;      /* verified */
    --accent2: #33ff33;     /* structural affordances */
    --draft: #7a8a99;       /* the '-' status, used everywhere a brick is drawn */
    --ghost: #b06a00;       /* referenced but never declared */
    --bad: #f44336;
    /*  The "on" washes, mixed from the color they belong to rather than
        hand-picked. One less thing for a theme to get wrong: change --accent2
        and its wash follows, in any theme, light or dark. */
    --tint: color-mix(in srgb, var(--accent2) 14%, var(--panel));
    --tint-verified: color-mix(in srgb, var(--accent) 14%, var(--panel));
    --tint-bad: color-mix(in srgb, var(--bad) 14%, var(--panel));
    --panel-gap: 14px;
    --panel-radius: 6px;
    --close-size: 18px;
    --panel-border: 1px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  /*  Nothing is selectable by default — dragging a tile by its header, or
      swiping across a list, was leaving blue selection smeared over the UI.
      The exceptions below are the places where selecting text is the point:
      the editor, and the read-only content you might want to copy out. */
  body { user-select: none; -webkit-user-select: none; }
  textarea, input, .lines, .doc-raw, .doc-meta, .issues, .feed,
  .bld-preview, .slot-note, .gaz-static,
  /* the reference table's examples are meant to be copied into the pallet */
  #reference [data-el="ref"], #reference table {
    user-select: text; -webkit-user-select: text;
  }
  body {
    background: var(--bg); color: var(--fg);
    font-family: system-ui, sans-serif; margin: 0; padding: 14px; font-size: 14px;
  }
  h1 { font-size: 1.05rem; margin: 0; letter-spacing: 0.02em; }
  h1 .brickmark { color: var(--accent); }
  .topbar { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .tagline { font-size: 0.72rem; opacity: 0.45; margin: 0; flex: 1; min-width: 180px; }
  /*  Collapsed to the glass until wanted. Width, not display, so it can
      animate and so the input keeps focus through the transition. */
  .topsearch { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .topsearch input {
    width: 0; padding: 3px 0; border-width: 0; opacity: 0;
    transition: width 0.15s ease, opacity 0.15s ease, padding 0.15s ease;
  }
  .topsearch.open input { width: 170px; padding: 3px 7px; border-width: 1px; opacity: 1; }
  /* Quiet by design: reassurance, not a notification. */
  .top-btn { font-size: 0.65rem; padding: 2px 8px; flex-shrink: 0; }
  .top-auto {
    display: flex; align-items: center; gap: 4px;
    font-size: 0.62rem; opacity: 0.55; flex-shrink: 0; cursor: pointer;
  }
  .top-auto input { accent-color: var(--accent2); cursor: pointer; }
  .save-state { font-size: 0.62rem; opacity: 0.4; white-space: nowrap; margin-left: auto; }
  /*  HIDDEN MEANS HIDDEN.

      The browser's own rule for [hidden] is display:none at the very bottom of
      the cascade, so ANY display of our own beats it — and every flex or grid
      box in this file has one. The palette drawer was the third thing to be
      found toggling its hidden attribute perfectly while staying on screen,
      which is two too many for a fix per class. The rules below that name a
      class each are older and now redundant; they are left because they are
      harmless and removing them proves nothing. */
  [hidden] { display: none !important; }

  .save-state[hidden] { display: none; }
  .save-state.bad { color: var(--bad); opacity: 1; }
  .topsearch.active input { border-color: var(--accent2); }
  /* A round button to match the panels' corner control, and large enough to
     read as the primary way in rather than a minor toggle. */
  #topsearchBtn {
    width: 26px; height: 26px; padding: 0; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; font-size: 1rem; line-height: 1;
  }
  /* A filter that is on but collapsed would be invisible; the glass stays lit. */
  .topsearch.active #topsearchBtn { border-color: var(--accent2); color: var(--accent2); }

  /* ---------- THE BOARD ----------
     A coordinate space, not a queue. Cells and tiles are BOTH explicitly
     placed, so neither can push the other around via auto-flow. */
  #board {
    display: grid; gap: var(--panel-gap); position: relative;
    grid-template-columns: repeat(var(--board-cols, 4), minmax(0, 1fr));
    grid-auto-rows: var(--board-row, 220px);
    padding-bottom: 40px;
  }
  .board-cell {
    border: 1px dashed var(--border-soft); border-radius: 6px; z-index: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--border-soft); font-size: 1.4rem; cursor: pointer; user-select: none;
  }
  .board-cell:hover { border-color: var(--accent2); color: var(--accent2); }
  .board-tile { position: relative; z-index: 1; min-width: 0; min-height: 0; display: flex; }
  /* Raise a tile while its label is the thing being read, so a neighboring
     tile's background cannot paint over the overhanging cartouche. */
  .board-tile:hover { z-index: 3; }
  /*  Scrolling belongs to the BODY, not the panel. With overflow:auto on the
      panel, the half of the cartouche that hangs above the top border was
      clipped away — an element cannot overflow a scroll container it lives
      inside. The body scrolls; the panel stays visible so the label can sit
      proud of the frame. */
  .board-tile > .panel {
    flex: 1 1 auto; min-width: 0; overflow: visible;
    display: flex; flex-direction: column;
  }
  .board-tile > .panel > .panel-body {
    flex: 1 1 auto; min-height: 0; overflow: auto;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .board-tile > .panel > .panel-body::-webkit-scrollbar { display: none; }
  .board-tile.dragging { opacity: 0.4; }
  /* The footprint a drop would occupy. Never placed until mouseup. */
  #boardGhost {
    z-index: 2; pointer-events: none; border-radius: 6px;
    border: 2px dashed var(--accent2); background: rgba(51,255,51,0.10);
  }
  #boardGhost.invalid { border-color: #ff5555; background: rgba(255,85,85,0.12); }
  /* A swap is still a drop preview, so it stays green like every other
     structural affordance. Solid rather than dashed is what separates it from
     an ordinary move — the shape carries the difference, not the hue. */
  #boardGhost.swap { border-style: solid; background: rgba(51,255,51,0.16); }
  #boardGhost[hidden] { display: none; }
  .board-tile.swap-target > .panel { outline: 2px solid var(--accent2); outline-offset: -2px; }
  .board-empty {
    grid-column: 1 / -1; text-align: center; padding: 40px 10px;
    opacity: 0.35; font-size: 0.85rem;
  }

  /* Grow/shrink a placed tile by a column or row. Only the legal buttons are
     shown — a "+" never appears toward an occupied neighbor or past the edge. */
  .tile-resize { position: absolute; display: flex; gap: 2px; z-index: 4; opacity: 0; transition: opacity 0.15s; }
  .board-tile:hover .tile-resize { opacity: 1; }
  .tile-resize button {
    width: 18px; height: 18px; padding: 0; font-size: 0.8rem; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); border-radius: 3px; background: var(--field); color: var(--fg); cursor: pointer;
  }
  .tile-resize button:hover { border-color: var(--accent2); color: var(--accent2); }
  .tile-resize-w { right: -9px; top: 50%; transform: translateY(-50%); flex-direction: column; }
  .tile-resize-h { bottom: -9px; left: 50%; transform: translateX(-50%); flex-direction: row; }
  /*  Sits on the top-right corner rather than in the header row, centered on
      the corner arc's own center of curvature — which is (radius, radius) in
      from the corner, so the circle is offset half its width back from that
      point. Derived from the variables, so changing the panel radius keeps it
      centered without re-tuning any numbers. */
  .tile-remove {
    position: absolute; z-index: 3;
    /* Less the border: absolute offsets are measured from the PADDING edge,
       which is inside the border, while the corner arc lives on the border
       box — without this the circle sits 1px off center in both axes. */
    top: calc(var(--panel-radius) - var(--close-size) / 2 - var(--panel-border));
    right: calc(var(--panel-radius) - var(--close-size) / 2 - var(--panel-border));
    width: var(--close-size); height: var(--close-size); padding: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; border: 1px solid var(--border); background: var(--panel);
    font-size: 0.7rem; line-height: 1; opacity: 0.5;
  }
  .tile-remove:hover { opacity: 1; border-color: var(--bad); color: var(--bad); }
  /* Keeps any header control from sliding under the overlaid circle. */
  .panel-head { padding-right: calc(var(--close-size) / 2 + 4px); }

  /* ---------- panels ---------- */
  .panel {
    background: var(--panel); border: var(--panel-border) solid var(--border);
    border-radius: var(--panel-radius);
    /* Extra top padding is the room the cartouche occupies where it straddles
       the border; the label is pulled up into it rather than adding a row. */
    padding: 14px 12px 12px; min-width: 0; position: relative;
    /* Container query context: contents respond to the PANEL's width, not the
       viewport's, so the same panel works at 1 cell and at 4. */
    container-type: inline-size;
  }
  .panel-head {
    display: flex; justify-content: space-between; align-items: center;
    gap: 6px; margin-bottom: 8px; flex-wrap: wrap; cursor: grab;
  }
  /*  The title as a cartouche: lifted out of the flow and set ON the top
      border, like a label on a map's neatline. It reclaims the line the header
      used to spend on itself, and the panel's own background masks the border
      behind it so the rule appears to break cleanly around the text. */
  /*  max-width was reserving 90px for header controls that are no longer in
      the row — the close button is an overlay now — which squeezed every
      1-cell title to zero width. The title gets the room; only the drag
      handle, badge and a small margin come out of it. */
  .panel-head-lead {
    position: absolute; top: -7px; left: 10px; z-index: 2;
    display: flex; align-items: center; gap: 5px; max-width: calc(100% - 34px);
    background: var(--panel); padding: 0 6px; border-radius: 3px;
  }
  /* Without an explicit min-width a flex child may collapse entirely rather
     than ellipsise; 3ch keeps at least a stub of the title visible. */
  .panel-head-lead h2 { min-width: 3ch; }
  .panel-head-lead h2 { opacity: 0.75; }
  /* One letter, quiet by default — it is a property of the panel, not a
     control, so it should not compete with the title. */
  .role-badge {
    flex-shrink: 0; font-size: 0.56rem; line-height: 1; padding: 2px 3px;
    border: 1px solid var(--border); border-radius: 2px; opacity: 0.45;
    font-family: var(--mono); cursor: default;
  }
  .role-badge:hover { opacity: 1; }
  .role-badge + .role-badge { margin-left: -3px; }
  /*  In a one-cell panel the handle and badge left the title about 46px — the
      name matters more than the annotation, so the badge stands down. The
      panel is the query container (container-type: inline-size). */
  @container (max-width: 210px) { .role-badge { display: none; } }
  /*  Reads as an annotation, not a control: no fill, and only fully legible on
      hover. Sized off the badges beside it so the row keeps one baseline. It
      outlives them when a tile narrows, being the one thing in the header you
      cannot get to any other way. */
  .panel-doc {
    font: 500 0.6rem/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 0.04em; color: var(--muted); text-decoration: none;
    opacity: 0.6; flex-shrink: 0; white-space: nowrap;
    border-bottom: 1px dotted currentColor;
    margin-left: 3px; transition: opacity 0.12s, color 0.12s;
  }
  .panel-doc:hover, .panel-doc:focus-visible { opacity: 1; color: var(--accent2); }
  /*  Reads as dangerous only once you are near it: quiet in the bar, plainly
      red under the cursor. A permanently red button in a toolbar is either
      ignored or feared, and neither is useful. */
  .top-btn.danger { color: var(--muted); }
  .top-btn.danger:hover, .top-btn.danger:focus-visible {
    color: var(--bad); border-color: var(--bad);
  }
  /*  Rides with the tagline rather than joining the button cluster — it is a
      thing to read, not a thing to press, and the buttons beside it all act on
      your pile. */
  .top-guide {
    margin-left: 0.55rem; white-space: nowrap;
    color: var(--accent2); text-decoration: none;
    border-bottom: 1px dotted currentColor; opacity: 0.8;
  }
  .top-guide:hover, .top-guide:focus-visible { opacity: 1; border-bottom-style: solid; }

  /* ---------- sprite editor ---------- */
  /*  Two columns: the blown-up cell, and everything you decide about it. The
      grid keeps its own size rather than stretching, because a pixel that is
      not square is worse than a pixel that is small. */
  .sp-wrap { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; height: 100%; }
  /*  The drawing surface gets the room. It was capped at 336px, which made a
      102-wide scene tiny in a panel with space to spare — and a place is the
      one thing here you cannot judge small. */
  .sp-left { flex: 2 1 260px; min-width: 160px; }
  .sp-grid {
    display: block; image-rendering: pixelated;
    border: 1px solid var(--border); border-radius: 3px;
    cursor: crosshair; touch-action: none;
    /*  No display size here. The canvas is drawn at the size it is shown at —
        the cell size is picked to fill the panel (see `fitZ`) — so it renders
        one buffer pixel to one screen pixel and the grid rules stay hairlines.
        The cap is only a backstop for the moment before layout has settled;
        if it ever engages, something is a pixel or two wide too many. */
    max-width: 100%; height: auto;
  }
  /*  Something is being dragged over the canvas and would land if let go. */
  /*  A picker tucked under the canvas it tints. */
  .sp-under { margin-top: 6px; }
  .sp-grid.sp-drop { outline: 2px dashed var(--accent2); outline-offset: 2px; }
  .sp-right { flex: 1 1 180px; min-width: 170px; max-width: 260px; display: flex; flex-direction: column; gap: 7px; }
  .sp-row { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  /*  Where the panel stops being about drawing and starts being about the
      file. A rule, so the eye skips the whole of it while you are working —
      which is what a drawer was standing in for, without hiding anything. */
  .sp-row.sp-fold {
    border-top: 1px solid var(--border);
    margin-top: 3px; padding-top: 8px;
  }
  .sp-cap {
    font-size: 0.62rem; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--muted); min-width: 34px;
  }
  /*  A label that is not the row's first is a mid-row caption, and does not
      need the leading column width that keeps the first ones aligned. */
  .sp-cap + * ~ .sp-cap { min-width: 0; margin-left: 4px; }
  .sp-row button { font-size: 0.68rem; padding: 2px 7px; }
  /*  A tool button is a picture, not a word, and 0.68rem is a size chosen for
      words. At that size a pencil and a box outline are two smudges you have
      to hover to tell apart. Squared off as well, so the row reads as a set of
      icons rather than as buttons of seven different widths. */
  .sp-row button.sp-tool {
    font-size: 1.1rem; line-height: 1;
    min-width: 27px; height: 25px;
    padding: 0 4px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  /*  ON IS FILLED. HOVER IS NOT.

      This rule used to be `border-color: accent2; color: accent2` — which is,
      character for character, the global `button:hover`. So the moment you
      clicked a toggle the class came off and the hover put the exact same
      paint back: the ghost went out, the button still looked lit, and it only
      told the truth once the pointer left it. Every toggle in the panel read
      one press behind, and no amount of checking `classList` finds that,
      because the class was right the whole time.

      A state has to be a different KIND of mark from a pointer's whereabouts,
      not the same mark in the same colour. So on is filled, and hover stays a
      tint of the edge. */
  .sp-row button.on,
  .sp-row button.on:hover {
    background: var(--accent2);
    border-color: var(--accent2);
    color: var(--bg);
  }
  /*  A swatch is the color it draws — a label would only repeat what the
      square already says, and there is no room for one. */
  .sp-pen {
    width: 20px; height: 20px; padding: 0; border-radius: 3px;
    border: 1px solid var(--border);
  }
  .sp-pen.on { outline: 2px solid var(--accent2); outline-offset: 1px; }
  /*  A swatch and its two shades, stacked. The shades are shorter than the
      colour itself so the row still reads as nine swatches with tints either
      side, rather than as twenty-seven equal squares. */
  .sp-pen-col { display: flex; flex-direction: column; gap: 1px; }
  .sp-pen-col .sp-pen { border-radius: 2px; }
  .sp-pen-col .sp-shade { height: 9px; }
  .sp-pen-set { display: flex; gap: 3px; }
  .sp-pal-btn { padding: 0 5px; line-height: 1.4; }
  .sp-pal-btn.on { border-color: var(--accent2); color: var(--accent2); }
  /* One field and one word of feedback, on one line. */
  .sp-pal { display: flex; align-items: center; gap: 4px; }
  .sp-pal-in {
    flex: 1 1 auto; min-width: 60px; font-family: var(--mono); font-size: 0.64rem;
    border: 1px solid var(--border); border-radius: 3px;
    background: var(--field); color: var(--fg); padding: 2px 5px;
  }
  .sp-pal-in:focus { border-color: var(--accent2); outline: none; }
  .sp-pal-note { font-size: 0.6rem; opacity: 0.5; white-space: nowrap; }
  /*  Recents are dashed, so a color you mixed reads as yours rather than as
      another fixed swatch. */
  .sp-recent { border-style: dashed; }
  .sp-recent[hidden] { display: none; }
  .sp-pen.sp-erase {
    background-image: linear-gradient(45deg, var(--border) 25%, transparent 25%,
      transparent 75%, var(--border) 75%),
      linear-gradient(45deg, var(--border) 25%, transparent 25%,
      transparent 75%, var(--border) 75%);
    background-size: 8px 8px; background-position: 0 0, 4px 4px;
  }
  .sp-row input[type="color"] {
    width: 22px; height: 22px; padding: 0; border: 1px solid var(--border);
    border-radius: 3px; background: none; cursor: pointer;
  }
  /*  The period row sets what a century's colors ARE; the paint row is what
      you draw with. They showed the same browns as identical squares, which
      made two unrelated controls look like one. Pens are square and solid;
      period colors are round and sunk into a labeled strip. */
  .sp-era { display: flex; align-items: center; gap: 4px; }
  .sp-era input[type="color"] {
    width: 18px; height: 18px; border-radius: 50%;
  }
  .sp-era input[type="color"]:disabled { opacity: 0.3; cursor: default; }
  .sp-eranum {
    font-size: 0.55rem; color: var(--muted); margin-right: -2px;
  }
  .sp-row select { font-size: 0.68rem; padding: 1px 4px; }
  /*  Narrow enough that size and frames share a line — they are read together
      and wrapping them apart made two controls look like two subjects. */
  .sp-bg { display: flex; align-items: center; gap: 3px; }
  .sp-bg input[type="color"] { width: 17px; height: 17px; border-radius: 3px; }
  /*  38px was the box, not the content: a three-digit place size and the
      spinner arrows do not both fit in it, and the number is what loses.
      Wide enough for "256" with the arrows still on the end. */
  .sp-num { width: 58px; font-size: 0.68rem; padding: 1px 3px; }
  .sp-x { font-size: 0.62rem; color: var(--muted); margin: 0 -1px; }
  .sp-unit { width: 34px; font-size: 0.68rem; padding: 1px 3px; }
  .sp-ans { font-size: 0.68rem; color: var(--accent2); font-variant-numeric: tabular-nums; }
  .sp-name { flex: 1 1 90px; min-width: 70px; font-size: 0.68rem; padding: 2px 5px; }
  /*  The filename, shown as you type it — the one thing that decides whether
      the page ever finds this drawing. */
  .sp-filename {
    flex: 1 1 100%; font-family: var(--mono, ui-monospace, monospace);
    font-size: 0.6rem; color: var(--accent2); opacity: 0.85; word-break: break-all;
  }
  /*  The answer to "does it read?", which is the only question that matters
      while drawing a 24px sleeve. Both sizes, because 4x flatters and 1x does
      not, and the street runs at 1x. */
  .sp-preview {
    display: flex; gap: 10px; align-items: flex-end;
    padding: 8px; border: 1px dashed var(--border); border-radius: 4px;
    /*  Set from the two swatches below it — a figure reads differently against
        a night sky and a bright one, and which one you are drawing for is your
        business, not a constant in a stylesheet. */
    background: linear-gradient(180deg, var(--sp-sky) 0%, var(--sp-sky) 72%,
                                var(--sp-ground) 72%);
  }
  .sp-preview canvas { display: block; image-rendering: pixelated; }
  .sp-true { align-self: flex-end; }
  .sp-hint { font-size: 0.63rem; line-height: 1.5; margin: 0; opacity: 0.6; }
  /*  The rule that makes the whole thing work, kept next to the box you type
      the name into. Quiet enough to be scenery until you need it. */
  .sp-conv {
    border-top: 1px solid var(--border);
    margin-top: 4px; padding-top: 7px;
    font-size: 0.6rem; line-height: 1.5; opacity: 0.55;
  }
  .sp-conv b { font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
  /*  Path and meaning on one line each: three lines say what four sentences
      were saying, and the paths line up so they can be compared at a glance. */
  .sp-conv dl {
    margin: 4px 0 0;
    display: grid; grid-template-columns: auto 1fr; gap: 1px 8px;
  }
  .sp-conv dt {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--accent2);
  }
  .sp-conv dd { margin: 0; }
  .sp-conv p { margin: 5px 0 0; }
  .sp-conv i { font-style: italic; opacity: 0.85; }
  /* One line per role, each led by the badge it explains. */
  .role-key {
    display: flex; flex-direction: column; gap: 3px;
    font-size: 0.62rem; opacity: 0.55; margin: 0 0 9px;
  }
  /* Each line is its own row, or the badges stretch to the column's width. */
  .role-key > span { display: flex; align-items: center; gap: 5px; }
  .role-write  { color: var(--accent); border-color: var(--accent); }
  .role-filter { color: var(--accent2); border-color: var(--accent2); }
  /*  With the title absolutely positioned it is no longer a flex item, so
      space-between has nothing to push against and the controls collapse to
      the left — directly under the cartouche. Pin them right instead, and hold
      the row open so it does not lose its height entirely. */
  .panel-head { min-height: 16px; justify-content: flex-end; flex-wrap: nowrap; }
  .board-tile.dragging .panel-head { cursor: grabbing; }
  .panel-head h2 {
    margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 0.66rem; font-weight: 500; opacity: 0.55; line-height: 1.3;
    text-transform: uppercase; letter-spacing: 0.07em;
  }
  /* A four-way move glyph rather than the braille grip dots — it names the
     action instead of implying only a texture to grab. */
  .drag-handle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 17px; height: 17px; flex-shrink: 0;
    border: 1px solid var(--border); border-radius: 3px;
    /* cursor:move states the affordance; the glyph needs a touch more size
       than the grip dots did to stay legible at this scale. */
    background: var(--field); opacity: 0.35; cursor: move; font-size: 12px; line-height: 1;
  }
  .drag-handle:hover { opacity: 1; border-color: var(--accent2); }

  button, select, input, textarea {
    background: var(--field); color: var(--fg); border: 1px solid var(--border);
    border-radius: 3px; padding: 3px 7px; font-size: 0.73rem; font-family: inherit; cursor: pointer;
  }
  /* Chrome paints autofilled fields near-white via an internal shadow that
     background alone cannot override; the inset shadow is the standard way to
     repaint it, and the long delay keeps it from flashing back. */
  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus {
    -webkit-text-fill-color: var(--fg);
    -webkit-box-shadow: 0 0 0 1000px var(--field) inset;
    transition: background-color 9999s ease-in-out 0s;
  }
  input::placeholder, textarea::placeholder { color: var(--fg); opacity: 0.35; }
  button:hover, select:hover { border-color: var(--accent2); color: var(--accent2); }
  input[type=text], input[type=number] { cursor: text; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .hint { font-size: 0.69rem; opacity: 0.45; line-height: 1.55; margin: 6px 0 0; }
  code, .hint code { color: var(--accent2); font-family: var(--mono); }

  /* ---------- flyout: the panel list ---------- */
  #boardFlyoutWrap {
    position: fixed; top: 0; right: 0; bottom: 0; width: 300px; z-index: 60;
    transform: translateX(100%); transition: transform 0.18s ease;
  }
  #boardFlyoutWrap.open { transform: none; }
  #boardFlyout {
    position: absolute; inset: 0; background: var(--field);
    border-left: 1px solid var(--border); padding: 10px; overflow-y: auto;
  }
  #boardFlyout h3 { margin: 0 0 8px; font-size: 0.85rem; }
  #boardFlyout label { font-size: 0.72rem; display: flex; align-items: center; gap: 4px; }
  #boardFlyout input[type=number] { width: 54px; }
  #boardSearch { width: 100%; margin-bottom: 8px; }
  #boardFlyoutTab {
    position: absolute; right: 100%; top: 50%; transform: translateY(-50%); z-index: 61;
    padding: 8px 6px; font-size: 1.1rem; line-height: 1; border-radius: 6px 0 0 6px;
  }
  .board-card {
    display: flex; flex-direction: column; gap: 4px;
    border: 1px solid var(--border); border-radius: 5px; background: var(--field);
    padding: 7px 9px; margin-bottom: 6px; cursor: grab; font-size: 0.8rem;
  }
  .board-card:hover { border-color: var(--accent2); }
  .board-card.dragging { opacity: 0.4; }
  .board-card-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .board-card-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board-card-desc { opacity: 0.55; font-size: 0.7rem; line-height: 1.35; margin-left: 28px; }
  .board-card .fp { opacity: 0.7; font-size: 0.72rem; display: flex; align-items: center; gap: 3px; flex-shrink: 0; }
  .board-card .fp input[type=number] { width: 30px; font-size: 0.7rem; padding: 1px 2px; }
  .board-card .fp-add {
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; flex-shrink: 0; border: 1px solid var(--border);
    border-radius: 3px; background: var(--field); color: var(--fg); opacity: 0.5; cursor: grab; padding: 0;
  }
  .board-card .fp-add:hover { opacity: 1; border-color: var(--accent2); }
  .board-group-heading {
    margin: 12px 0 4px; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; opacity: 0.55;
  }
  .board-group-heading:first-child { margin-top: 0; }

  /* ---------- panel bodies ---------- */
  textarea {
    width: 100%; flex: 1 1 auto; min-height: 96px; resize: none;
    background: var(--field); color: var(--fg); border: 1px solid var(--border); border-radius: 3px;
    font-family: var(--mono); font-size: 12px; line-height: 1.55; padding: 8px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  /*  The body must actually FILL the panel for the editor's flex:1 to mean
      anything — otherwise the body is content-height, there is no spare space
      to distribute, and the textarea sits at its min-height no matter how much
      room collapsing the menu freed up. min-height:0 lets it shrink below
      content size, which flex items otherwise refuse to do. */
  #pallet .panel { display: flex; flex-direction: column; }
  #pallet .panel-body {
    display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0;
  }
  .panel-head-btn { order: 98; flex-shrink: 0; padding: 0 6px; font-size: 0.7rem; line-height: 1.4; }
  .panel-head-btn.on { border-color: var(--accent2); color: var(--accent2); }
  .panel-head-btn[hidden] { display: none; }
  /* The log shares the bar rather than owning a line of its own; it is
     usually empty, and an empty element still reserved height. */
  /* :empty so a quiet status line costs no height at all. */
  .pallet-status {
    display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 0.66rem; opacity: 0.5; margin-bottom: 5px;
  }
  .pallet-status:empty { display: none; }
  .pallet-menu {
    display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 7px; padding: 7px;
    border: 1px solid var(--border); border-radius: 4px; background: var(--field);
  }
  .pallet-menu[hidden] { display: none; }
  .pallet-menu .hint { flex-basis: 100%; }

  .lines { font-family: var(--mono); font-size: 11.5px; }
  .ln { display: flex; align-items: baseline; gap: 8px; padding: 2px 8px; margin: 1px 0;
        border-left: 3px solid var(--border); background: var(--field); }
  .ln.ok { border-left-color: var(--accent); }
  .ln.ok.draft { border-left-color: var(--draft); }
  .ln.bad { border-left-color: var(--bad); background: var(--tint-bad); }
  .ln.comment { border-left-color: var(--border-soft); background: transparent; opacity: 0.55; }
  .ln .num { width: 26px; text-align: right; opacity: 0.3; flex-shrink: 0; }
  .ln .ico { width: 19px; flex-shrink: 0; }
  .ln .body { flex: 1; min-width: 0; word-break: break-word; }
  .ln .body .name { opacity: 0.55; font-style: italic; }
  .ln.draft .body { color: var(--draft); }
  .ln .tag { font-size: 9.5px; opacity: 0.5; background: var(--field); border: 1px solid var(--border);
             padding: 0 5px; border-radius: 3px; flex-shrink: 0; text-transform: uppercase; }
  /* At one cell wide the tag goes — the icon already says what it says. */
  @container (max-width: 340px) { .ln .tag { display: none; } }

  .ent-controls { display: flex; gap: 4px; margin-bottom: 6px; }
  .ent-controls input { flex: 1; min-width: 50px; }
  .ent-kinds { display: flex; gap: 3px; flex-shrink: 0; }
  .ent-controls button { padding: 1px 6px; font-size: 0.8rem; line-height: 1.3; flex-shrink: 0; opacity: 0.45; }
  .ent-controls button.on { opacity: 1; border-color: var(--accent2); }
  .ents { display: flex; flex-wrap: wrap; gap: 5px; }
  .ent { font-family: var(--mono); font-size: 11px; padding: 2px 7px; border-radius: 3px;
         border: 1px solid var(--accent); color: var(--accent); background: var(--field); white-space: nowrap; }
  /* Border STYLE carries the state as well as color, so it survives greyscale
     and color-blind viewing. */
  .ent.draft { border-color: var(--draft); color: var(--draft); border-style: dashed; }
  .ent.ghost { border-color: var(--ghost); color: var(--ghost); border-style: dotted; }
  .ent .n { opacity: 0.45; margin-left: 5px; }
  .ent { cursor: pointer; }
  .ent.focused { background: var(--tint); box-shadow: 0 0 0 1px var(--accent2); }

  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 7px; }
  .stat { background: var(--field); border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; }
  .stat .v { font-size: 1.1rem; font-family: var(--mono); line-height: 1.1; }
  .stat .k { font-size: 0.6rem; opacity: 0.45; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }

  .issues { font-size: 11px; font-family: var(--mono); line-height: 1.7; }
  .issues .warn { color: var(--ghost); }
  .issues .err { color: var(--bad); }
  .issues .none { opacity: 0.4; font-family: system-ui, sans-serif; }

  table { border-collapse: collapse; width: 100%; font-size: 11.5px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
  th { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.45; font-weight: 500; }
  td.mono { font-family: var(--mono); color: var(--accent2); white-space: nowrap; }

  /* ---------- filter ---------- */
  .flt-group { margin-bottom: 8px; }
  .flt-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.07em; opacity: 0.4; margin-bottom: 4px; }
  .flt-chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .flt-chips button { font-size: 0.7rem; padding: 2px 7px; }
  .flt-chips button.on { border-color: var(--accent2); color: var(--accent2); background: var(--tint); }
  .flt-chips button.on[data-status="verified"] { border-color: var(--accent); color: var(--accent); background: var(--tint-verified); }
  .flt-chips button.on[data-status="draft"] { border-color: var(--draft); color: var(--draft); background: #0d1115; }
  .flt-chips .count { opacity: 0.45; margin-left: 4px; font-size: 0.62rem; }
  .flt-chips .lbl { margin-left: 4px; }
  /* One cell wide there is no room for the words; the emoji still says it, and
     the tooltip carries the rest. */
  @container (max-width: 250px) { .flt-chips .lbl { display: none; } }
  /* When a filter is on, every panel showing a subset says so — a filtered
     count that looks like a total is how people misread their own data. */
  .time-row { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
  .time-row input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  .time-read {
    font-family: var(--mono); font-size: 0.68rem; color: var(--accent2);
    white-space: nowrap; flex-shrink: 0;
  }
  .time-sub { font-size: 0.6rem; opacity: 0.4; flex-shrink: 0; width: 26px; }
  .filtered-note {
    font-size: 0.6rem; color: var(--accent2); opacity: 0.8;
    text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 5px;
  }

  /* ---------- document viewer ---------- */
  .doc-pos { font-size: 0.65rem; opacity: 0.5; font-family: var(--mono); }
  .doc-viewport {
    position: relative; overflow: hidden; margin-bottom: 8px;
    height: clamp(160px, 40cqh, 60vh);
    border: 1px solid var(--border); border-radius: 4px; background: var(--field);
    cursor: grab; touch-action: none;
  }
  .doc-viewport.panning { cursor: grabbing; }
  .doc-viewport canvas { display: block; width: 100%; height: 100%; }
  .doc-zoom {
    position: absolute; left: 6px; bottom: 6px; display: flex; align-items: center; gap: 3px;
    background: rgba(0,0,0,0.72); border: 1px solid var(--border); border-radius: 4px; padding: 2px 4px;
  }
  .doc-zoom button { padding: 1px 6px; font-size: 0.7rem; }
  .doc-zoom span { font-size: 0.66rem; opacity: 0.65; width: 40px; text-align: center; font-family: var(--mono); }
  .doc-overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 14px; font-size: 0.72rem; opacity: 0.5; line-height: 1.6; pointer-events: none;
  }
  .doc-overlay.bad { color: var(--bad); opacity: 0.9; }
  /* container-query unit above needs the panel as the container; the tile is
     already one, so 40cqh tracks the panel's own height as it is resized. */
  .doc-nosrc {
    border: 1px dashed var(--border); border-radius: 4px; padding: 14px; margin-bottom: 8px;
    font-size: 0.7rem; opacity: 0.45; text-align: center; line-height: 1.6;
  }
  .doc-raw {
    font-family: var(--mono); font-size: 11.5px; background: var(--field); border-radius: 3px;
    padding: 6px 8px; margin-bottom: 8px; word-break: break-all; line-height: 1.5;
    border-left: 3px solid var(--accent);
  }
  .doc-raw.draft { border-left-color: var(--draft); color: var(--draft); }
  .doc-meta { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 0.72rem; margin-bottom: 8px; }
  .doc-meta dt { opacity: 0.4; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.06em; padding-top: 2px; }
  .doc-meta dd { margin: 0; }
  .doc-names { display: flex; flex-wrap: wrap; gap: 4px; }
  .doc-names button { font-size: 0.7rem; padding: 1px 7px; }
  .doc-names button.ghost { border-color: var(--ghost); color: var(--ghost); border-style: dotted; }

  /* ---------- files ---------- */
  .file-list { display: flex; flex-direction: column; gap: 3px; margin-top: 7px; }
  .file-item {
    display: flex; align-items: center; gap: 6px; padding: 4px 7px; flex-wrap: wrap;
    border: 1px solid var(--border); border-radius: 3px; background: var(--field); font-size: 0.73rem;
  }
  .file-item.current { border-color: var(--accent); }
  /*  min-width:0 let this shrink to 1px in a one-cell panel — the filename was
      not truncated, it was gone. A floor keeps it readable, and the row wraps
      rather than crushing it further. */
  .file-item .nm { flex: 1 1 auto; min-width: 68px; overflow: hidden; text-overflow: ellipsis;
                   white-space: nowrap; font-family: var(--mono); font-size: 0.7rem; }
  .file-item .meta { font-size: 0.62rem; opacity: 0.45; flex-shrink: 0; font-family: var(--mono); }
  .file-item button { padding: 0 6px; font-size: 0.68rem; }
  /*  The dismiss sits quiet until you are on the row: it is the one button here
      that changes what the page does on every later visit, and a row of three
      equally loud buttons invites the wrong one. */
  .file-item .x { opacity: 0.35; }
  .file-item:hover .x, .file-item .x:focus-visible { opacity: 1; }
  .file-empty { font-size: 0.7rem; opacity: 0.45; line-height: 1.6; }
  /* ---------- art held in the browser ---------- */
  .art-wrap { display: flex; flex-direction: column; gap: 5px; height: 100%; min-height: 0; }
  .art-bar { display: flex; align-items: center; gap: 5px; }
  .art-bar button { font-size: 0.6rem; padding: 1px 6px; }
  .art-count { flex: 1 1 auto; font-size: 0.62rem; opacity: 0.5; }
  .art-list { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; min-height: 0; }
  .art-item {
    display: flex; align-items: center; gap: 7px; padding: 3px 6px;
    border: 1px solid var(--border); border-radius: 3px; background: var(--field);
  }
  /*  Against the street's own night sky, at its own pixels: the thumbnail is
      there to show what is stored, not to flatter it. */
  .art-item img {
    image-rendering: pixelated; background: #1d2c38; border-radius: 2px;
    max-height: 34px; max-width: 76px; flex-shrink: 0;
  }
  /*  An input styled as text: it is the filename, and it is editable, and it
      should not look like a form until you are in it. */
  .art-item .nm {
    flex: 1 1 auto; min-width: 60px; font-family: var(--mono); font-size: 0.66rem;
    border: 1px solid transparent; border-radius: 2px; padding: 1px 3px;
    background: none; color: var(--fg);
  }
  .art-item .nm:hover { border-color: var(--border); }
  .art-item .nm:focus { border-color: var(--accent2); background: var(--bg); outline: none; }
  .art-bar select {
    font-size: 0.6rem; padding: 1px 3px; background: var(--field); color: var(--fg);
    border: 1px solid var(--border); border-radius: 3px;
  }
  /* Lit while a file is over it, the way every other drop target here is. */
  .art-wrap.drop { outline: 1px dashed var(--accent2); outline-offset: 3px; }
  .art-item button { font-size: 0.6rem; padding: 0 6px; }
  .art-item .x { opacity: 0.35; }
  .art-item:hover .x, .art-item .x:focus-visible { opacity: 1; }
  .file-empty .lnk {
    padding: 0; border: 0; background: none; font: inherit; color: var(--accent);
    text-decoration: underline; cursor: pointer;
  }
  /* ---------- timeline ---------- */
  #timeline .panel-body { display: flex; flex-direction: column; }
  /* Reserves its line always (&nbsp;) so hovering does not shift the lanes. */
  /*  Wraps rather than truncating: this line exists to show the detail, and a
      source citation or a long description is exactly the case where it
      matters. Capped at two lines so a verbose brick cannot push the lanes
      around, and min-height still reserves the first line so hovering never
      shifts the layout. */
  .tl-detail {
    /* Reserves BOTH lines it can grow to. At one line the box changed height
       on hover and pushed every lane down — the marks moved out from under the
       pointer, which is worse than the wasted line. */
    font-size: 0.68rem; line-height: 1.4; min-height: 2.8em; margin-bottom: 4px;
    color: var(--accent2); white-space: normal; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
  }
  /* Left margin matches .tl-name + its gap so the axis starts where the tracks
     do; without it every tick sat left of the marks it labeled. */
  .tl-scale {
    position: relative; height: 11px; flex-shrink: 0;
    border-bottom: 1px solid var(--border); margin: 0 0 3px 84px;
    overflow: hidden;
  }
  .tl-tick {
    position: absolute; top: 0; font-size: 8.5px; opacity: 0.4;
    transform: translateX(-50%); white-space: nowrap;
  }
  .tl-lanes {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .tl-lanes::-webkit-scrollbar { display: none; }
  /* min-height rather than height: a fixed height forces overflow the moment
     anything inside rounds up a fraction of a pixel. */
  .tl-lane { display: flex; align-items: center; gap: 6px; min-height: 15px; flex-shrink: 0; }
  .tl-name {
    width: 78px; max-width: 40%; flex-shrink: 0; font-size: 0.64rem; opacity: 0.6;
    cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tl-name:hover { opacity: 1; color: var(--accent2); }
  /* min-width:0 lets the track shrink inside the flex row instead of forcing
     the lane wider than the panel. */
  .tl-track { position: relative; flex: 1 1 auto; min-width: 0; height: 100%; }
  /* The span of a life as recorded — first mark to last. */
  .tl-span {
    position: absolute; top: 50%; height: 1px; background: var(--border); transform: translateY(-50%);
  }
  .tl-dot {
    position: absolute; top: 50%; width: 6px; height: 6px; border-radius: 50%;
    background: var(--draft); transform: translate(-50%, -50%); cursor: pointer;
  }
  .tl-dot.verified { background: var(--accent); }
  /* Hollow = the year came from prose, not a date field. */
  .tl-dot.loose { background: none; border: 1px solid var(--draft); }
  .tl-dot.loose.verified { border-color: var(--accent); }
  .tl-dot:hover { box-shadow: 0 0 0 2px var(--accent2); z-index: 2; }
  .tl-empty { font-size: 0.7rem; opacity: 0.45; }

  /* ---------- gazetteer ---------- */
  .gaz-list { display: flex; flex-direction: column; gap: 3px; max-height: 100%; overflow: auto; }
  .gaz-row {
    display: flex; align-items: center; gap: 5px; padding: 2px 6px;
    border: 1px solid var(--border); border-radius: 3px; background: var(--field); font-size: 0.72rem;
  }
  .gaz-row:focus-within { border-color: var(--accent2); }
  .gaz-row.locked { opacity: 0.6; }
  .gaz-row.orphan { opacity: 0.5; }
  .gaz-name {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    cursor: pointer;
  }
  .gaz-name:hover { color: var(--accent2); }
  .gaz-row input[type=number] {
    width: 74px; flex-shrink: 0; font-family: var(--mono); font-size: 0.68rem; padding: 2px 4px;
  }
  .gaz-row input[type=number]:disabled { opacity: 0.5; cursor: not-allowed; }
  .gaz-static { font-size: 0.64rem; opacity: 0.6; font-family: var(--mono); flex-shrink: 0; }
  /* Wide enough for "bottom right" — the longest of the nine choices. */
  .gaz-label { flex-shrink: 0; font-size: 0.64rem; padding: 1px 2px; max-width: 92px; }
  .gaz-icon { width: 34px; flex-shrink: 0; text-align: center; padding: 1px 2px; }
  .gaz-menu {
    display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 7px; padding: 7px;
    border: 1px solid var(--border); border-radius: 4px; background: var(--field);
  }
  .gaz-menu[hidden] { display: none; }
  .gaz-sub {
    font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.4;
    margin: 8px 0 2px;
  }
  .gaz-add input[type=text] { flex: 1; min-width: 60px; }
  .gaz-add input[type=number] { width: 66px; flex-shrink: 0; }


  /* ---------- brick builder ---------- */
  .bld-row { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin-bottom: 7px; }
  .bld-type button { font-size: 0.9rem; padding: 2px 6px; line-height: 1.3; }
  .bld-type button.active { border-color: var(--accent2); background: var(--tint); }
  .bld-status button.active[data-st="+"] { border-color: var(--accent); color: var(--accent); }
  .bld-status button.active[data-st="-"] { border-color: var(--draft); color: var(--draft); }
  .bld-field { display: flex; flex-direction: column; gap: 2px; margin-bottom: 6px; }
  .bld-field label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.45; }
  .bld-field input { width: 100%; font-family: var(--mono); font-size: 11.5px; padding: 4px 6px; }
  .bld-field .sub { font-size: 0.63rem; opacity: 0.4; }
  .bld-alias-wrap { display: flex; gap: 4px; }
  .bld-alias-wrap input.num { width: 46px; flex-shrink: 0; }
  /* Every uid already in the pile, visible and clickable — a datalist only
     helps if you already know what you are looking for. */
  .uid-picker { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; max-height: 108px; overflow: auto; }
  .uid-picker button {
    font-size: 0.66rem; padding: 1px 6px; font-family: var(--mono);
    border-color: var(--border-soft); opacity: 0.8;
  }
  .uid-picker button:hover { opacity: 1; }
  .uid-picker button.on { border-color: var(--accent2); color: var(--accent2); background: var(--tint); opacity: 1; }
  .uid-picker button.ghost { border-style: dotted; color: var(--ghost); border-color: var(--ghost); }
  .uid-picker .none { font-size: 0.65rem; opacity: 0.4; }
  /* The line the builder will actually write. Shown before it is committed, so
     the notation stays visible — the builder is a way into the text, not a
     replacement for reading it. */
  .bld-preview {
    font-family: var(--mono); font-size: 11.5px; background: var(--field); border-radius: 3px;
    padding: 6px 8px; margin: 8px 0 7px; word-break: break-all; line-height: 1.5;
    border-left: 3px solid var(--accent);
  }
  .bld-preview.draft { border-left-color: var(--draft); color: var(--draft); }
  .bld-preview.bad { border-left-color: var(--bad); color: var(--bad); }
  /* Said before you commit, not after: a uid clash is easier to avoid than to
     unpick once it is in the pile. */
  .bld-clash {
    font-size: 0.68rem; color: var(--bad); line-height: 1.5;
    border: 1px dashed var(--bad); border-radius: 3px; padding: 5px 7px; margin-bottom: 7px;
  }
  .bld-editing { font-size: 0.65rem; color: var(--accent2); margin-bottom: 6px; }
  /* Classification lines are clickable when the builder is available. */
  .ln { cursor: pointer; }
  .ln:hover { outline: 1px solid var(--border-soft); }
  .ln.editing { outline: 1px solid var(--accent2); }

  /* ---------- map ---------- */
  /* Fill the panel rather than a fixed slice of it, so dragging the tile
     taller actually gives the map the space. The panel body is the flex
     parent; min-height keeps it usable in a 1-row tile. */
  #viz-map .panel-body { display: flex; flex-direction: column; height: 100%; }
  .map-shell { position: relative; flex: 1 1 auto; min-height: 200px; border-radius: 4px; overflow: hidden; }
  /* width/height, not inset: MapLibre adds .maplibregl-map to this same
     element and its own rules were collapsing it to height:0, which clipped
     the whole map away under .map-shell's overflow:hidden. Explicit
     dimensions win regardless of what the library sets. */
  .map-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  /* A marker is a plain DOM element the map positions — no source, no tiling,
     no style dependency, and it survives a basemap switch untouched. */
  .map-marker {
    width: var(--mk); height: var(--mk); border-radius: 50%;
    background: var(--fill, var(--draft)); border: 1.5px solid #0d1317;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.5); cursor: pointer; position: relative;
    /* Fill is the kind, so status has to be carried by something else. Weight
       is the natural second channel: a draft mark is simply fainter, which
       survives greyscale and color-blind viewing the way a second hue does
       not. */
    opacity: 0.62;
  }
  .map-marker.verified { opacity: 1; }
  /*  An icon marker drops the dot's own shape entirely and draws the glyph, so
      the emoji is the mark rather than sitting on top of a circle. Status can
      no longer be read from fill, so a colored ring carries it instead. */
  .map-marker.as-icon {
    width: auto; height: auto; background: none; border: none; box-shadow: none;
    /* A glyph reads smaller than a filled disc of the same measure, so it is
       set a little larger than the dot it replaces. */
    font-size: calc(var(--mk) * 1.4); line-height: 1;
    text-shadow: 0 0 3px #0d1317, 0 0 2px #0d1317;
    display: flex; align-items: center; justify-content: center;
    transform: translateY(-2px);
  }
  .map-marker.as-icon::before { content: attr(data-glyph); }
  /* An emoji has its own colors, so the kind's color rings it instead. */
  .map-marker.as-icon.verified { outline: 2px solid var(--fill, var(--accent)); outline-offset: 2px; border-radius: 50%; }
  .map-marker-label {
    position: absolute; font-size: 10px; line-height: 1.2; white-space: nowrap;
    color: #cfd6dc; text-shadow: 0 0 3px #0d1317, 0 0 2px #0d1317; pointer-events: none;
  }
  /*  The eight compass positions, plus hidden. Cardinals center on the dot;
      the diagonals are offset on both axes and, crucially, are NOT centered —
      a corner label reads outward from the dot, so it is anchored by the
      corner nearest the mark rather than by its middle. */
  /*  Every offset is derived from one number, --lbl, so the whole sheet's
      label spacing moves together from a single control. The constants that
      remain are the RELATIONSHIPS between placements, not the distance:
      a side label needs a touch more room than a stacked one, a corner label
      needs a touch less because it clears the mark diagonally, and an emoji
      mark is bigger than a dot so everything steps out around it. */
  /*  --lbl is the gap from the EDGE of the mark, not from its center, so
      growing the marker pushes its name out with it and the spacing you set
      stays the spacing you see. --r is just the mark's radius, named once. */
  .map-shell { --mk: 11px; --lbl: 8px; --r: calc(var(--mk) / 2); }
  .lbl-bottom .map-marker-label { left: 50%; top: calc(var(--r) + var(--lbl)); transform: translateX(-50%); }
  .lbl-top    .map-marker-label { left: 50%; bottom: calc(var(--r) + var(--lbl)); transform: translateX(-50%); }
  .lbl-right  .map-marker-label { left: calc(var(--r) + var(--lbl) + 2px);  top: 50%; transform: translateY(-50%); }
  .lbl-left   .map-marker-label { right: calc(var(--r) + var(--lbl) + 2px); top: 50%; transform: translateY(-50%); }
  .lbl-topright    .map-marker-label { left: calc(var(--r) + var(--lbl) - 3px);  bottom: calc(var(--r) + var(--lbl) - 4px); }
  .lbl-topleft     .map-marker-label { right: calc(var(--r) + var(--lbl) - 3px); bottom: calc(var(--r) + var(--lbl) - 4px); }
  .lbl-bottomright .map-marker-label { left: calc(var(--r) + var(--lbl) - 3px);  top: calc(var(--r) + var(--lbl) - 4px); }
  .lbl-bottomleft  .map-marker-label { right: calc(var(--r) + var(--lbl) - 3px); top: calc(var(--r) + var(--lbl) - 4px); }
  /* An emoji is set larger than the dot, so its name clears a wider mark. */
  .as-icon.lbl-bottom .map-marker-label { top: calc(var(--r) + var(--lbl) + 4px); }
  .as-icon.lbl-top    .map-marker-label { bottom: calc(var(--r) + var(--lbl) + 4px); }
  .as-icon.lbl-right  .map-marker-label { left: calc(var(--r) + var(--lbl) + 5px); }
  .as-icon.lbl-left   .map-marker-label { right: calc(var(--r) + var(--lbl) + 5px); }
  .as-icon.lbl-topright    .map-marker-label { left: calc(var(--r) + var(--lbl) + 1px);  bottom: calc(var(--r) + var(--lbl)); }
  .as-icon.lbl-topleft     .map-marker-label { right: calc(var(--r) + var(--lbl) + 1px); bottom: calc(var(--r) + var(--lbl)); }
  .as-icon.lbl-bottomright .map-marker-label { left: calc(var(--r) + var(--lbl) + 1px);  top: calc(var(--r) + var(--lbl)); }
  .as-icon.lbl-bottomleft  .map-marker-label { right: calc(var(--r) + var(--lbl) + 1px); top: calc(var(--r) + var(--lbl)); }
  .lbl-none   .map-marker-label { display: none; }
  /* Vetted out: another name got there first. */
  .map-marker-label.suppressed { display: none; }
  /*  Two places named by the same record, or by the same person, drawn as a
      line between them. Dotted on purpose: this is inferred from the records,
      not a surveyed route — nobody said anyone traveled it. Under the
      markers, since the places are the figure and the link is the relation. */
  .map-links {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 2; pointer-events: none; overflow: visible;
  }
  /*  A record names both places outright, so it takes the verified color the
      rest of the page uses for a stated fact. Drawn with a dark casing under
      it: a hairline over a mottled basemap disappears wherever the land
      happens to be light, and a line you can only see half of is worse than
      no line. The casing makes it legible over anything. */
  .map-link { stroke: var(--accent); stroke-dasharray: 5 3; opacity: 0.95; }
  /* Nobody stated this one — it is inferred through a shared person. So it
     takes --draft, the same gray every unverified thing on this page wears,
     rather than introducing a color that means nothing anywhere else. */
  .map-link.via { stroke: var(--draft); stroke-dasharray: 2 3.5; opacity: 0.8; }
  .map-link-case { stroke: #05080b; opacity: 0.55; }
  #viz-map .maplibregl-marker { z-index: 3; }
  /*  Project context. Arrows and text sit above the marks because they are
      annotation — the thing you drew to point AT the map. */
  .map-annos {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 4; pointer-events: none; overflow: visible;
  }
  .map-anno-text { position: absolute; top: 0; left: 0; z-index: 5; pointer-events: none; }
  .proj-text {
    position: absolute; top: 0; left: 0; transform-origin: 0 0;
    font-size: 0.7rem; line-height: 1.35; padding: 4px 7px; border-radius: 3px;
    color: #111; max-width: 220px; white-space: pre-wrap;
  }
  /* A reference point is not a record, so it does not wear a status. */
  .map-marker.proj-point { opacity: 1; border-style: solid; }
  /*  Which tiles are drawing. Small, in the corner, and only two options —
      it is a choice you make once, not a toolbar. */
  .map-source {
    position: absolute; left: 6px; top: 6px; z-index: 4;
    font: inherit; font-size: 0.62rem; color: #cfd6dc;
    background: rgba(0,0,0,0.72); border: 1px solid var(--border);
    border-radius: 4px; padding: 2px 4px; cursor: pointer; max-width: 130px;
  }
  .map-source:focus { outline: none; border-color: var(--accent2); }
  /* Grayed, not hidden: something is outranking it, and that should be visible. */
  .map-source:disabled { opacity: 0.4; cursor: default; }

  /* ---------- map editor ---------- */
  .map-canvas.arming, .map-canvas.arming canvas { cursor: crosshair; }
  #mapeditor .panel-body { display: flex; flex-direction: column; }
  .me-tools { flex-wrap: wrap; gap: 4px; }
  .me-tools button { padding: 2px 7px; font-size: 0.8rem; }
  .me-tools button.on { border-color: var(--accent2); color: var(--accent2); background: var(--tint); }
  /* The digitizing surface. Given real height because tracing on a letterbox
     is miserable; it grows with the tile like the viewer does. */
  .me-shell {
    position: relative; flex: 1 1 auto; min-height: 180px;
    border: 1px solid var(--border); border-radius: 4px; overflow: hidden; margin: 4px 0;
  }
  .me-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  /* Square, so a handle never reads as one of your own round marks. */
  .me-handle {
    width: 9px; height: 9px; background: var(--accent2);
    border: 1px solid #05080b; border-radius: 1px; cursor: grab;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.55);
  }
  .me-handle:active { cursor: grabbing; }
  #mapeditor .maplibregl-marker { z-index: 4; }
  .me-list { display: flex; flex-direction: column; gap: 2px; margin: 4px 0 7px; }
  .me-item {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px;
    align-items: center; padding: 2px 4px; border: 1px solid transparent;
    border-radius: 3px; cursor: pointer; font-size: 0.7rem;
  }
  .me-item:hover { border-color: var(--border); }
  .me-item.on { border-color: var(--accent2); background: var(--tint); }
  .me-nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .me-del { border: 0; background: none; opacity: 0.4; padding: 0 3px; }
  .me-del:hover { opacity: 1; color: var(--bad); }
  .me-style {
    display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px;
    padding-top: 7px; border-top: 1px solid var(--border-soft);
  }
  .me-style[hidden] { display: none; }
  .me-field { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 7px; align-items: center; }
  .me-field > span { font-size: 0.65rem; opacity: 0.55; }
  .me-field input[type="color"] {
    width: 24px; height: 18px; padding: 0; border: 1px solid var(--border);
    border-radius: 3px; background: none; cursor: pointer;
  }
  .me-field input[type="range"] { width: 100%; accent-color: var(--accent2); }
  .me-field input[type="text"], .me-field select { width: 100%; font-size: 0.66rem; }
  .me-url { width: 100%; font-size: 0.63rem; margin: 2px 0 4px; }

  /* ---------- theme ---------- */
  .th-presets { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 9px; }
  .th-presets button { display: flex; align-items: center; gap: 5px; }
  /* Each preset shows its own ground and both accents — you pick a theme by
     looking at it, not by reading its name. */
  .th-chip {
    display: inline-flex; gap: 2px; align-items: center; justify-content: center;
    width: 22px; height: 13px; border: 1px solid; border-radius: 2px;
  }
  .th-chip i { width: 4px; height: 4px; border-radius: 50%; }
  /* A saved theme and its × read as one control, so they sit flush. */
  .th-item { display: inline-flex; }
  .th-item > button[data-theme] { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .th-del {
    border-left: 0; border-top-left-radius: 0; border-bottom-left-radius: 0;
    padding: 0 5px; opacity: 0.5; font-size: 0.8rem; line-height: 1;
  }
  .th-del:hover { opacity: 1; border-color: var(--bad); color: var(--bad); }
  .th-presets input[type="text"] { min-width: 0; }
  /* One column: each swatch now carries a line of explanation, and two
     columns of that is a wall of text in a one-cell tile. */
  .th-rows { display: flex; flex-direction: column; gap: 3px; }
  .th-row { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 7px; }
  .th-label { min-width: 0; display: flex; align-items: baseline; gap: 6px; }
  .th-label b { font-weight: normal; font-size: 0.72rem; opacity: 0.85; }
  .th-label em {
    font-style: normal; font-size: 0.6rem; opacity: 0.42;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .th-row input[type="color"] {
    width: 24px; height: 18px; padding: 0; border: 1px solid var(--border);
    border-radius: 3px; background: none; cursor: pointer;
  }

  /* ---------- map style ---------- */
  #mapstyle .panel-body { display: flex; flex-direction: column; }
  .ms-rows { display: flex; flex-direction: column; gap: 3px; }
  /* Sized to survive a one-column tile, which is where this panel will
     usually live: the name is the only part allowed to give up space. */
  .ms-row { display: grid; grid-template-columns: auto auto minmax(40px, 1fr) 42px 42px; align-items: center; gap: 5px; }
  .ms-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ms-row input[type="color"] {
    width: 24px; height: 18px; padding: 0; border: 1px solid var(--border);
    border-radius: 3px; background: none; cursor: pointer;
  }
  /* Controls, not data: green like every other affordance on the page. */
  .ms-row input[type="range"] { width: 42px; accent-color: var(--accent2); }
  .ms-row input[type="checkbox"] { accent-color: var(--accent2); cursor: pointer; }
  .ms-name { font-size: 0.72rem; opacity: 0.8; }
  .ms-head { padding-bottom: 3px; border-bottom: 1px solid var(--border-soft); margin-bottom: 3px; }
  .ms-col {
    font-size: 0.56rem; text-transform: uppercase; letter-spacing: 0.06em;
    opacity: 0.45; overflow: hidden; text-overflow: ellipsis;
  }
  /* Where the basemap layers end and the label controls begin. */
  .ms-sep { margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--border-soft); }
  .ms-bar { gap: 6px; margin-top: 9px; }
  .ms-raw { margin-top: 8px; display: flex; flex-direction: column; }
  .ms-raw[hidden] { display: none; }
  .ms-text {
    width: 100%; min-height: 150px; resize: vertical; font-family: var(--mono, monospace);
    font-size: 0.66rem; line-height: 1.5; background: var(--field); color: var(--fg);
    border: 1px solid var(--border); border-radius: 4px; padding: 7px;
  }
  .ms-pick { width: 100%; margin-bottom: 6px; font-size: 0.66rem; }
  .ms-pick[hidden] { display: none; }
  /* No :focus rule — the page already has one for every textarea, and a second
     one here in a different color is exactly the mismatch worth avoiding. */
  /*  Zoom and extent, in the order a project file wants them. Bottom-left,
      out of the way, and monospaced so the digits do not jitter as you pan. */
  .map-where {
    position: absolute; left: 6px; bottom: 6px; z-index: 4; cursor: pointer;
    font-family: var(--mono); font-size: 9.5px; letter-spacing: -0.01em;
    color: #cfd6dc; opacity: 0.5; background: rgba(0,0,0,0.45);
    border-radius: 3px; padding: 2px 5px; white-space: nowrap;
  }
  .map-where:hover { opacity: 0.95; }
  .map-where.copied { color: var(--accent2); opacity: 1; }
  /* Deliberately tiny and non-interactive: a credit line, not a UI element. */
  .map-attrib {
    position: absolute; right: 4px; bottom: 3px; z-index: 2; pointer-events: none;
    font-size: 8.5px; line-height: 1.4; letter-spacing: 0.01em;
    color: #cfd6dc; opacity: 0.45; text-shadow: 0 0 3px #0d1317, 0 0 2px #0d1317;
  }
  .map-attrib[hidden] { display: none; }
  /* Sits above the coordinate readout, which owns the bottom-left corner. */
  .map-note {
    position: absolute; left: 8px; bottom: 26px; z-index: 2;
    font-size: 0.68rem; background: rgba(0,0,0,0.75); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 8px; pointer-events: none;
  }
  /* MapLibre's own chrome, restyled to sit inside a dark panel rather than a
     full-page map. */
  .maplibregl-ctrl-top-right { top: 6px; right: 6px; }
  .maplibregl-ctrl-group { background: #111 !important; border: 1px solid var(--border) !important; }
  .maplibregl-ctrl-group button { background: transparent !important; }
  .maplibregl-ctrl-attrib { background: rgba(0,0,0,0.6) !important; font-size: 10px !important; }
  .maplibregl-ctrl-attrib a { color: #9fb0bd !important; }
  .maplibregl-popup-content { background: #111 !important; color: var(--fg) !important; }

  /* ---------- the promenade ---------- */
  /*  The scene takes the whole tile. Its readouts float on top of it rather
      than stealing a strip, because a promenade with a caption bar under it
      is a diagram, not a view. */
  #viz-promenade .panel-body { padding: 0; overflow: hidden; }
  .pr-shell {
    position: absolute; inset: 0; overflow: hidden;
    background: var(--field); cursor: grab;
  }
  .pr-shell:active { cursor: grabbing; }
  .pr-canvas { display: block; }
  .pr-note {
    position: absolute; left: 8px; bottom: 6px; z-index: 2; margin: 0;
    font-size: 0.6rem; opacity: 0.45; pointer-events: none;
    text-shadow: 0 0 3px #0d1317, 0 0 2px #0d1317;
  }
  /*  Clear of the panel's own close button, which owns the top-right corner.
      At top: 6px the + sat directly beside the ×, so reaching for one risked
      the other — and one of them removes the panel. */
  .pr-zoom {
    position: absolute; right: 6px; top: 28px; z-index: 2;
    font-size: 0.62rem; padding: 1px 7px; min-width: 30px;
  }
  .pr-zoom { min-width: 24px; }
  .pr-zoom-out { right: 34px; }
  .pr-zoom:disabled { opacity: 0.3; cursor: default; }
  .pr-mode { right: 66px; min-width: 46px; }
  .pr-drift { right: 120px; min-width: 26px; }
  .pr-drift.on { border-color: var(--accent2); color: var(--accent2); }
  .pr-sort {
    position: absolute; right: 152px; top: 28px; z-index: 2;
    font-size: 0.62rem; padding: 1px 4px;
  }
  .pr-sort[hidden] { display: none; }
  /* Appears only when a place is selected, so it never asks you to guess
     what it would color. */
  .pr-tint {
    position: absolute; left: 8px; top: 6px; z-index: 3;
    display: flex; align-items: center; gap: 5px;
    background: rgba(0,0,0,0.6); border: 1px solid var(--border);
    border-radius: 4px; padding: 3px 6px;
  }
  .pr-tint[hidden] { display: none; }
  .pr-tint-name { font-size: 0.62rem; opacity: 0.8; max-width: 110px;
                  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pr-tint input[type="color"] {
    width: 22px; height: 16px; padding: 0; border: 1px solid var(--border);
    border-radius: 3px; background: none; cursor: pointer;
  }
  .pr-files {
    position: absolute; right: 6px; bottom: 6px; z-index: 3; display: flex; gap: 4px;
  }
  .pr-files button, .pr-files .pr-doc {
    font-size: 0.6rem; padding: 1px 7px; line-height: 1.7;
  }
  /* Named on the bar rather than in a dialog the browser is free to suppress. */
  .pr-groupin {
    font-size: 0.6rem; padding: 1px 6px; line-height: 1.7; width: 120px;
    border: 1px solid var(--accent2); border-radius: 3px;
    background: var(--field); color: var(--fg);
  }
  /*  The scene's sky and ground, in the panel's own bar. Two swatches sized to
      the buttons beside them, so the bar reads as one row rather than a
      control bolted onto the end of it. */
  .pr-bg {
    display: flex; align-items: center; gap: 3px;
    padding: 0 5px; border: 1px solid var(--border); border-radius: 3px;
    background: var(--field);
  }
  .pr-bg-cap { font-size: 0.55rem; opacity: 0.5; letter-spacing: 0.04em; }
  .pr-bg input[type="color"] {
    width: 15px; height: 15px; padding: 0; border: 1px solid var(--border);
    border-radius: 2px; background: none; cursor: pointer;
  }
  .pr-bg button { border: 0; background: none; padding: 0 2px; opacity: 0.55; }
  .pr-bg button:hover { opacity: 1; }
  /* A link, styled as one of the buttons beside it. */
  .pr-doc {
    border: 1px solid var(--border); border-radius: 3px; background: var(--field);
    color: var(--fg); text-decoration: none;
  }
  .pr-doc:hover { border-color: var(--accent2); color: var(--accent2); }
  /* Sits under the pen, because that is all it searches. */
  .pr-find {
    position: absolute; z-index: 3; font-size: 0.6rem; padding: 2px 5px;
  }
  .pr-find[hidden] { display: none; }
  .pr-tint input[type="range"] { width: 54px; accent-color: var(--accent2); }
  .pr-tint button { font-size: 0.62rem; padding: 0 5px; line-height: 1.5; }
  .pr-scene { position: relative; height: 100%; min-height: 150px; }
  .pr-sky {
    position: absolute; inset: 0 0 34% 0;
    background: linear-gradient(180deg, #14202b 0%, #1d2c38 60%, #24333f 100%);
  }
  .pr-ground {
    position: absolute; inset: 66% 0 0 0; background: #1a1f18;
    border-top: 2px solid #2b3327;
  }
  .pr-cast { position: absolute; inset: 0; }

  /* Signposts: the place names, standing in the ground. */
  .pr-sign { position: absolute; bottom: 26%; transform: translateX(-50%); text-align: center; }
  .pr-sign-board {
    display: block; font-size: 9px; letter-spacing: 0.02em; white-space: nowrap;
    background: #4a3b28; color: #e8dcc4; border: 1px solid #2c2318;
    padding: 2px 5px; border-radius: 1px;
  }
  .pr-sign-post { display: block; width: 2px; height: 16px; margin: 0 auto; background: #3a2f20; }
  .pr-sign-lost .pr-sign-board { background: #2a2a2a; color: var(--draft); border-color: #1c1c1c; }

  /*  A walker. Blocky on purpose — placeholder art with the era logic already
      wired, so a sprite sheet can drop in later without changing placement. */
  .pr-walker {
    position: absolute; bottom: 26%; width: 14px;
    transform: translateX(-50%);
    animation: pr-pace var(--dur, 8s) ease-in-out infinite alternate;
    animation-delay: var(--delay, 0s);
  }
  .pr-name {
    position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
    font-size: 8px; white-space: nowrap; color: #cfd6dc; opacity: 0.75;
    text-shadow: 0 0 3px #0d1317, 0 0 2px #0d1317; pointer-events: none;
  }
  .pr-body { position: relative; display: block; width: 14px; height: 24px; }
  .pr-body > i { position: absolute; display: block; }
  .pr-head { left: 4px; bottom: 15px; width: 6px; height: 6px; background: #c9a689; }
  .pr-coat { left: 3px; bottom: 6px; width: 8px; height: 10px; background: var(--coat); }
  .pr-leg  { bottom: 0; width: 3px; height: 6px; background: var(--trim);
             animation: pr-step 0.6s steps(2) infinite; }
  .pr-leg.l { left: 4px; }
  .pr-leg.r { left: 8px; animation-delay: 0.3s; }
  .pr-hat { left: 3px; bottom: 20px; }
  .hat-tall   { width: 8px; height: 6px; background: #16181c; }
  .hat-bowler { width: 8px; height: 3px; background: #16181c; border-radius: 3px 3px 0 0; }
  .hat-cap    { width: 8px; height: 2px; background: #4a4335; }
  .hat-none   { display: none; }
  /* Someone with no place in the record stands apart, and looks it. */
  .pr-lost { opacity: 0.45; }
  .pr-lost .pr-coat, .pr-lost .pr-leg { background: var(--draft); }

  @keyframes pr-pace { from { margin-left: -18px; } to { margin-left: 18px; } }
  @keyframes pr-step { from { height: 6px; } to { height: 4px; } }
  /* Anyone who asks for stillness gets a tableau instead of a parade. */
  @media (prefers-reduced-motion: reduce) {
    .pr-walker, .pr-leg { animation: none; }
  }

  .slot-empty { display: flex; flex-direction: column; gap: 9px; }
  .slot-desc { font-size: 0.74rem; opacity: 0.5; }
  .slot-note { font-size: 0.69rem; opacity: 0.45; border: 1px dashed var(--border);
               border-radius: 4px; padding: 9px; line-height: 1.65; }
  .feed { font-family: var(--mono); font-size: 11px; opacity: 0.75; line-height: 1.7; }
  .feed b { color: var(--accent); font-weight: normal; }
</style>
</head>
