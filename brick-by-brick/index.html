/*  Clear all — back to a blank project.

    Scoped to what this project HOLDS, not to how the page looks. Themes you
    made and a tile key you pasted survive, because losing those is a separate
    annoyance you never asked for and they say nothing about the research. The
    dialog names both lists, so nothing goes without being announced.

    Deliberately not undoable: an undo for this would have to hold a full copy
    of everything it just deleted, which is the one thing a page storing your
    only copy should not quietly keep. Export is the undo, which is why it sits
    immediately to the left. */
const CLEAR_KEYS = [
  TEXT_KEY, GAZETTEER_KEY, PINNED_KEY, COLTINT_KEY, GROUPS_KEY, SCENEBG_KEY, ARTKEY,
  RIBBON_KEY,
  BOARD_KEY, FOOTPRINT_KEY,
  MAPPROJECT_KEY, MAPSTYLE_KEY, MAPOVERRIDE_KEY, MAPSOURCE_KEY,
  STYLEURL_KEY, MEURL_KEY, MESOURCE_KEY,
];

function clearAll() {
  const bricks = state.text.trim() ? state.text.trim().split(/\n/).filter(l => l.trim()).length : 0;
  const places = (typeof GAZETTEER !== "undefined" && GAZETTEER) ? GAZETTEER.size : 0;

  const lines = [
    "Clear everything and start a new project?",
    "",
    "This removes:",
    "  · the pile — " + bricks + " line" + (bricks === 1 ? "" : "s"),
  ];
  if (places) lines.push("  · " + places + " gazetteer coordinate" + (places === 1 ? "" : "s"));
  /*  Named separately, and named LOUDLY, because it is the one thing in this
      list that exists nowhere else. A placement can be redone in a minute; a
      drawing you never downloaded cannot be redone at all. */
  if (LOCAL_ART.size) {
    lines.push("  · " + LOCAL_ART.size + " drawing" + (LOCAL_ART.size === 1 ? "" : "s") +
               " held in this browser and nowhere else");
  }
  lines.push("  · Promenade placements and column colors",
             "  · your board layout and panel sizes",
             "  · the map's project file, style and source",
             "",
             "It keeps your themes and your tile key.",
             "");
  /*  The one warning worth interrupting for. Everything else here is
      recoverable by redoing a bit of arranging; an unexported pile is not
      recoverable at all. */
  if (bricks && !lastExport) {
    lines.push("⚠ This pile has never been exported. There is no copy of it",
               "  anywhere but this browser, and this cannot be undone.", "");
  } else if (bricks && lastExport) {
    lines.push("Last export: " + lastExport.name + " (" + ago(lastExport.at) + ").", "");
  }
  lines.push("This cannot be undone.");

  if (!confirm(lines.join("\n"))) return;

  // Stop the autosave that is about to run, or it writes the old pile back
  // over the empty one a moment after this finishes.
  clearTimeout(saveTimer);
  dirty = false;

  for (const k of CLEAR_KEYS) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }

  state.text = "";
  if (typeof GAZETTEER !== "undefined" && GAZETTEER && GAZETTEER.clear) GAZETTEER.clear();
  if (typeof COLUMN_TINT !== "undefined" && COLUMN_TINT && COLUMN_TINT.clear) COLUMN_TINT.clear();
  // The filter is never persisted, so the reload below is what clears it.
  lastExport = null;

  /*  The pile is gone, so nothing on the board is showing anything. Reload
      rather than trying to reset a dozen panels in place: every panel already
      knows how to build itself from scratch at boot, and half-resetting them
      by hand is how a stale map or a stranded Pixi scene survives a clear. */
  location.reload();
}

el("quickClear").addEventListener("click", clearAll);

el("boardFlyoutTab").addEventListener("click", () => el("boardFlyoutWrap").classList.toggle("open"));
el("boardFlyoutClose").addEventListener("click", () => el("boardFlyoutWrap").classList.remove("open"));
el("boardSearch").addEventListener("input", renderBoardCardList);
el("boardReset").addEventListener("click", resetBoard);

el("boardCols").addEventListener("change", e => {
  const cols = Math.max(1, Math.min(12, Math.round(Number(e.target.value)) || 4));
  e.target.value = cols;
  if (cols !== board.cols) { board.cols = cols; repackForCols(cols); renderBoard(); saveBoard(); }
});
el("boardRowUnit").addEventListener("change", e => {
  const px = Math.max(80, Math.min(600, Math.round(Number(e.target.value)) || 220));
  e.target.value = px;
  board.rowUnit = px;
  renderBoard(); saveBoard();
});

/* ---------- drag wiring ---------- */
el("boardCardList").addEventListener("dragstart", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "BUTTON") { e.preventDefault(); return; }
  const card = e.target.closest(".board-card[draggable]");
  if (!card) return;
  const fp = FOOTPRINTS[card.dataset.id];
  if (!fp) return;
  card.classList.add("dragging");
  boardDrag = { id: card.dataset.id, w: Math.min(fp.w, board.cols), h: fp.h, fromTile: null, valid: false };
  showDockTargets(true);
  e.dataTransfer.effectAllowed = "copy";
  // Firefox needs data set to fire subsequent drag events at all.
  e.dataTransfer.setData("text/plain", card.dataset.id);
});
el("boardCardList").addEventListener("dragend", () => endBoardDrag(false));

boardEl().addEventListener("dragover", e => {
  if (!boardDrag) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = boardDrag.fromTile ? "move" : "copy";
  updateGhost(e.clientX, e.clientY);
});
boardEl().addEventListener("drop", e => {
  if (!boardDrag) return;
  e.preventDefault();
  endBoardDrag(true);
});

// Repositioning a tile already on the board — grabbed by its own header.
boardEl().addEventListener("mousedown", e => {
  const head = e.target.closest(".panel-head");
  const tile = e.target.closest(".board-tile");
  if (!head || !tile || e.target.closest("button")) return;
  const t = board.tiles.find(k => k.id === tile.dataset.id);
  if (!t) return;
  tile.classList.add("dragging");
  boardDrag = { id: t.id, w: t.w, h: t.h, fromTile: t, valid: false };
  showDockTargets(true);
  const onMove = ev => updateGhost(ev.clientX, ev.clientY);
  const onUp = ev => {
    updateGhost(ev.clientX, ev.clientY);
    endBoardDrag(true);
    window.removeEventListener("mousemove", onMove);
    window.removeEventListener("mouseup", onUp);
  };
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);
});
</script>
</body>
</html>
