        s.P       Pixi, for anything the Graphics API alone cannot do
        s.Z       the zoom — multiply every size by it or it will not scale
        s.H       the panel's height in world units
        s.width   how wide the street runs, which is wider than the panel
        s.ground  the y of the horizon line
        s.sky     the sky's color as an int, since yours is settable
        s.tint    (amount) → the sky nudged toward its own opposite, which is
                  how anything here should pick a color: white on a pale sky
                  is a hole, and so is black on a dark one
        s.rnd     () → 0…1, seeded per piece and per street width, so a piece
                  sits still between renders instead of reshuffling every time
                  you drop somebody. Never call Math.random here.

    Moving things do not belong in this list — the balloon and the birds are
    stateful and live on the stage above the street. This is the quiet layer. */
const SCENERY = [
  {
    id: "clouds",
    on: true,
    draw(g, s) {
      const puff = s.tint(0.1);
      g.beginFill(puff, 0.55);
      const n = Math.max(2, Math.round(s.width / 260));
      for (let i = 0; i < n; i++) {
        const cx = ((i + s.rnd() * 0.7) / n) * s.width;
        const cy = s.H * (0.06 + s.rnd() * 0.3);
        const r = (9 + s.rnd() * 7) * s.Z;
        /*  Three or four overlapping lobes on one baseline: a cloud is a row
            of bumps with a flat bottom, and anything fussier than that is
            invisible at this size. */
        const lobes = 3 + Math.round(s.rnd());
        for (let k = 0; k < lobes; k++) {
          const lx = cx + (k - (lobes - 1) / 2) * r * 1.05;
          const lr = r * (0.62 + s.rnd() * 0.48);
          g.drawEllipse(lx, cy - lr * 0.25, lr, lr * 0.72);
        }
        g.drawRect(cx - r * lobes * 0.52, cy - r * 0.1, r * lobes * 1.04, r * 0.5);
      }
      g.endFill();
    },
  },
];

/*  A cheap deterministic sequence. Math.random would give a different sky on
    every drop, drag and resize, which is the one thing a background must not
    do. Seeded per piece as well as per width, so adding a second piece does
    not reshuffle the first. */
function sceneryRnd(id, width) {
  let seed = Math.round(width) * 9301 + 49297;
  for (let i = 0; i < id.length; i++) seed = (seed * 31 + id.charCodeAt(i)) % 233280;
  return () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
}

/*  Balloon silks: the envelope, and the two side gores under it.

    Each pair is one dyestuff at two strengths rather than two colors, because
    that is what a gore is — the same bolt, shaded by the curve of the cloth.
    The names are the dyes a balloon of the period would actually have been
    made up in, which is also why none of them is a bright primary: aniline
    had barely arrived, and madder, weld and indigo do not do neon.

    Muted on purpose besides. This thing crosses the sky above somebody's
    research; it is meant to be noticed once and then ignored. */
const BALLOON_SILKS = [
  [0xb4553a, 0x8f4530],   // madder — the original, and still the commonest
  [0xc08a3e, 0x9a6b2e],   // ochre
  [0x8f9d5c, 0x6f7c46],   // weld over woad, the green of old bunting
  [0x6d7f96, 0x53637a],   // indigo, weak
  [0x9c4f57, 0x7c3d45],   // cochineal
  [0x7a6a94, 0x5e5175],   // logwood damson
  // Undyed silk, which is a color too — taken down a little from the raw
  // cloth, because against a night sky the true shade was the one thing up
  // there brighter than the signposts.
  [0xc4b79c, 0xa39a82],
  [0x4f6b63, 0x3c534d],   // verdigris
];

/*  A BRICKLING is one of the little figures on the street: a person from the
    pile, drawn, dressed and walking. The distinction is worth keeping — a
    PERSON is a brick you wrote and a BRICKLING is what the Promenade makes of
    them, so a person with no brickling is one this panel is filtering out, and
    a brickling with no person cannot happen.

    The code below still says "walker" throughout, because that is what the
    thing does rather than what it is called, and renaming a hundred variables
    would make every future diff unreadable for a word nobody types. */

/*  PASSENGERS.

    Drop somebody onto the balloon and they hang under it on a string until it
    leaves the frame, at which point everyone is set down exactly where they
    were. Nothing is written: no pin moves, no brick changes, and the sidecar
    never hears about it. A ride is a thing you watch, not a thing you record —
    which is also why the balloon is allowed to carry them off the edge of the
    world without that costing you a placement.

    One, because one is what a basket holds. */
const BALLOON_SEATS = 1;

/*  THE PEN IS A CHOICE, NOT A DEFAULT.

    It used to be where anybody with no place ended up: no pin and no record
    meant the box in the sky. That made the ordinary state of a fresh pile —
    nobody placed yet — a crowd standing in a corner rather than a crowd
    standing in the street, and it read as an error queue.

    So the default is The Promenade, which is exactly what The Promenade is
    for: these people, not anywhere in particular. The pen still exists, and
    it still means "I no longer know where this one was", but you have to say
    so by dragging them there.

    Which needs a value for "in the pen", because absence now means the
    Promenade. It is a column slug that no place and no group can produce:
    every place slug is kebab-case and every group's is prefixed grp-. */
const PEN_SLUG = "\u2205";

/*  THE BALLOON, IN NUMBERS.

    A person rides IN the basket, which means the balloon has to be person
    sized — the nine-pixel one it started as could not have held a hat. So it
    is drawn to a figure: an envelope wide enough to be flying it, ropes long
    enough to clear the passenger's head, and a basket deep enough to hide
    them from the hips down.

        -17   top of the envelope
          0   its middle, and the balloon's own origin
         17   bottom of the envelope
         34   the basket rim
         48   the basket floor, where a passenger stands
         50   the bottom of the basket

    Everything else in this file is derived from those, so moving one number
    moves the drawing and the seating together. */
const BAL = { rx: 14, ry: 17, rim: 34, floor: 48, deep: 16, half: 9 };

const balloonDrift = load => 0.35 - load * 0.03;   // always forward, and always +x

// Standing on the floor of the basket, in the middle of it. No lean: a
// passenger in a basket is not being dragged through the air, they are riding.
function riderPos() { return { x: 0, y: BAL.floor }; }

/*  Generous, because you are aiming a person at a moving target. Reaches from
    above the envelope to below the basket — a figure dragged UP to the balloon
    arrives from underneath, so the catch has to be where the hand is coming
    from. */
function overBalloonAt(host, x, y) {
  const b = host._balloon;
  if (!b || b.riders.length >= BALLOON_SEATS) return false;
  const dx = Math.abs(x - b.node.x), dy = y - b.node.y;
  return dx < 26 && dy > -30 && dy < BAL.rim + BAL.deep + 12;
}

/*  WHAT IS UNDER THIS POINT.

    Three regions accept a person and they mean three different things:

        balloon   nothing. A ride. No pin, no brick, no record.
        pen       "I no longer know where they were." Clears the pin.
        column    "they belong with this group." Writes the pin.
        nowhere   no column has coordinates yet, so there is nothing to join.

    One function answers it, and both the highlight during a drag and the drop
    itself read that one answer. They used to work it out separately, three
    regions by three code paths, and the results could disagree — the balloon
    could swell to say it would catch you while the release went to a column.
    Worse, each path grew its own hit testing, so a fix for one was a fix for
    one. Everything about where a person lands is decided here now.

    Point is in STAGE coordinates: a carried figure is on the stage, which is
    the only frame the pen, the sky and the street can all be compared in. */
function dropTargetAt(host, x, y) {
  if (host._balloon && overBalloonAt(host, x, y)) return { kind: "balloon" };
  const b = host._penBox;
  if (b && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return { kind: "pen" };
  const col = host._columnAt ? host._columnAt(x - (host._world ? host._world.x : 0)) : null;
  return col === null ? { kind: "nowhere" } : { kind: "column", slug: col };
}

/*  On, and off.

    Both go through host._aloft, which is the only durable record of who is up
    there: b.riders holds live nodes and does not survive a rebuild, and the
    rebuild puts everybody back on the rope by reading the set. */
function boardRider(host, w, P) {
  const b = host._balloon;
  if (!b || !w || b.riders.length >= BALLOON_SEATS) return false;
  w.riding = true;
  w.held = false;
  b.node.addChild(w.node);           // the balloon owns them now
  /*  Counter-scaled against the balloon, which is itself scaled to the zoom:
      the walker's sprite is already drawn at zoom, so inheriting the balloon's
      scale on top would render them at zoom squared. Facing forward, too,
      since that is the way they are going. */
  const bz = b.node.scale.x || 1;
  w.node.scale.set(1 / bz, 1 / bz);
  b.riders.push({ slug: w.slug, node: w.node, h: (w.sprite && w.sprite.height) || 24 });
  host._aloft.add(w.slug);
  rigBalloon(host, P);
  return true;
}

/*  EVERYTHING IN THE BASKET THAT IS NOT THE BALLOON.

    The balloon owns exactly two things of its own — the envelope and the
    basket. Any other child is a passenger, and after a rebuild it is a
    passenger from a cast that no longer exists.

    That is the bug this exists to stop. A rebuild replaces every walker, and
    the restore below puts the NEW node in the basket — but the old one was
    still parented to the balloon, and nothing on the panel clears the balloon.
    So the passenger was in the basket twice: the live one, who left when you
    set them down, and a ghost who stayed behind, kept whatever facing it had
    when it was abandoned, and sailed off with the balloon. */
function clearPassengers(b) {
  if (!b || !b.node || b.node.destroyed) return;
  for (const c of [...b.node.children]) {
    if (c === b.envelope || c === b.basket) continue;
    b.node.removeChild(c);
    if (!c.destroyed) c.destroy({ children: true });
  }
}

/*  Out of the basket. Called the moment a passenger is picked up rather than
    when they are put down, so what you are dragging is already nobody's
    passenger. */
function unboardRider(host, w, P) {
  if (!w) return;
  w.riding = false;
  w.node.scale.set(1, 1);            // out of the balloon's frame, back to its own
  host._aloft.delete(w.slug);
  const b = host._balloon;
  if (!b) return;
  const i = b.riders.findIndex(r => r.slug === w.slug);
  if (i >= 0) b.riders.splice(i, 1);
  rigBalloon(host, P);
}

/*  Stand the passenger in the basket, and put the basket back in front of them.

    The occlusion is the whole trick. There is no mask and no clipping: the
    basket is simply drawn last, so a figure standing on its floor is buried
    from the hips down and reads as being INSIDE it rather than in front of
    it. addChild on a child already there moves it to the top, which is all
    this needs to do to stay in front of whoever just climbed in. */
function rigBalloon(host, P) {
  const b = host._balloon;
  if (!b) return;
  for (const r of b.riders) {
    const at = riderPos();
    r.node.x = at.x;
    r.node.y = at.y;
  }
  if (b.basket) b.node.addChild(b.basket);
  // Always "grab": it can be moved whether or not it is carrying anybody.
  if (b.envelope) b.envelope.cursor = "grab";
}

/*  Click the balloon and everyone aboard is set down in The Promenade.

    Which is a real decision, unlike the ride itself: it writes a placement,
    the same one a drop into that column writes by hand. The Promenade is
    where somebody stands when you have not said where they were, and stepping
    out of a balloon into the middle of the street is exactly that.

    They fall the rest of the way, through the same gravity a dropped figure
    uses, because they should land rather than appear. */
function dropOffBalloon(host) {
  const b = host._balloon;
  if (!b || !b.riders.length) return;
  const riders = [...b.riders];
  const world = host._world;
  const promX = host._columnX ? host._columnX("") : null;
  riders.forEach((r, i) => {
    const w = (host._walkers || []).find(k => k.slug === r.slug);
    host._pinned.set(r.slug, "");            // "" is The Promenade's own slug
    host._aloft.delete(r.slug);
    if (!w || !world) return;
    // Handed from the balloon to the street at the point they were hanging, so
    // the fall starts where they were rather than where they are going.
    const gx = b.node.x + w.node.x, gy = b.node.y + w.node.y;
    w.riding = false;
    world.addChild(w.node);
    w.node.x = gx - world.x;
    w.node.y = gy - world.y;
    /*  Facing forward again. A passenger is turned to face whichever way the
        balloon is travelling, and a balloon that has bounced off the right
        edge is travelling left — so somebody set down from one arrived on the
        ground mirrored, and stayed that way until they next took a step.
        Scale goes back to its own too, since they are out of the balloon's
        frame and no longer counter-scaled against it. */
    w.node.scale.set(1, 1);
    /*  Spread across the column on the way down rather than landing in one
        stack. Same arithmetic the drop handler uses, so five off a balloon
        stand exactly as five dropped by hand would. */
    if (promX !== null) w.home = promX + (i - (riders.length - 1) / 2) * 22;
    w.t = 1;
    w.vy = 0;
    w.falling = true;
  });
  b.riders.length = 0;
  // Nothing should be left standing in an empty basket.
  clearPassengers(b);
  if (b.envelope) b.envelope.cursor = "grab";
  if (host._savePins) host._savePins();
  /*  The Promenade has just taken somebody, so every column east of it moves.
      Reflowed once they are down, not while they are in the air. */
  clearTimeout(host._settle);
  host._settle = setTimeout(() => {
    host._noTween = true;
    renderPromenadePixi(V(), host);
  }, 1100);
}

/*  Everybody down.

    The rebuild is what actually returns them: their pins were never touched,
    so a plain re-render puts each one back in the column they were taken
    from. Which is why the nodes can simply be destroyed with the balloon —
    the render makes new ones. */
function landBalloon(host) {
  const b = host._balloon;
  if (!b) return;
  const had = (b.riders || []).length;
  if (host._aloft) host._aloft.clear();

  /*  Everything interactive comes off the event boundary before any of it is
      torn down. Pixi holds a reference to whatever it is currently tracking a
      pointer over, and a destroyed node still sitting in that slot throws on
      the next move — which is what broke when a balloon carrying somebody
      reached the edge with the pointer anywhere near it.

      The passenger is the part that was missed. The balloon's own listeners
      were being cleaned up; the walker riding INSIDE it is a separate
      interactive object with a full set of drag handlers, and destroy({
      children: true }) took it down with everything still attached. */
  /*  The passenger is lifted OUT before the balloon is destroyed, not destroyed
      with it. destroy({ children: true }) took a live, fully wired walker down
      along with the basket — and the very next thing that happens is a rebuild
      whose first act is to read every walker's position. One destroyed node in
      that list threw, and the whole panel went with it.

      They are set aside alive, outlive the render that replaces them, and are
      cleaned up after. */
  const orphans = [];
  for (const r of b.riders || []) {
    if (!r.node || r.node.destroyed) continue;
    r.node.eventMode = "none";
    r.node.removeAllListeners();
    if (r.node.parent) r.node.parent.removeChild(r.node);
    orphans.push(r.node);
  }
  b.riders.length = 0;
  b.node.eventMode = "none";
  if (b.envelope) b.envelope.eventMode = "none";
  b.node.removeAllListeners();
  b.node.destroy({ children: true });
  host._balloon = null;

  /*  The rebuild is what actually returns them: their pins were never touched,
      so a plain re-render stands each one back in the column they were taken
      from, with a brand new node. */
  if (had) { host._noTween = true; renderPromenadePixi(V(), host); }
  for (const n of orphans) if (!n.destroyed) n.destroy({ children: true });
}

function renderPromenadePixi(model, host) {
  // Who is in the sky rather than on the street. Read below, when the cast is
  // worked out, so a passenger is not also standing in their column.
  if (!host._aloft) host._aloft = new Set();
  const { coord, out: whereByPerson } = peoplePlaces(model);
  /*  AN EMPTY STREET GETS ONE BRICKLING ANYWAY.

      A panel with nobody in it is a panel that looks broken — the sky, the
      ground and a ribbon, and no reason to believe anything would ever appear
      there. So when the pile is empty the author walks it himself: one
      brickling, dressed from wear/michael-bricknell.png if there is one and
      the default if there is not, standing in the Promenade like anybody
      unplaced.

      He is a stand-in, not a record. He is in no pile, he is written to
      nothing, and the moment you declare a single person he is gone — which is
      also why the footer still says the street is empty while he is on it.
      Reporting one brickling would be the panel lying about your research to
      make itself look busy. */
  const HOUSE_BRICKLING = { slug: "michael-bricknell", name: "Michael Bricknell",
                            declared: true, detail: "" };

  /*  Passengers stay in the cast.

      Taking them out of it was the tidier-looking choice and the wrong one:
      a walker that is not in host._walkers has no drag, no drop, no name and
      no way down, so a passenger could be lifted off the balloon and then
      belonged nowhere — the release found no walker and did nothing at all.

      They keep their place in their column too. It is held open for them
      rather than closing up and reopening, which is both less work and a
      better answer to "where was that person" while they are in the air. */
  const declared = (model.people || []).filter(p => p.declared);
  const noneDeclared = !declared.length;
  const people = noneDeclared ? [HOUSE_BRICKLING] : declared;
  const P = window.PIXI;

  /*  Zoom scales the world, not the camera: spacing, figures and lettering
      all grow together, so 3× is a closer walk down the same street rather
      than a magnified screenshot of it. Pixel art has no in-between sizes
      worth having, so the steps are whole numbers. */
  const Z = host._zoom || 1;
  const GRID = host._view === "grid";

  /*  Two arrangements of the same cast.

      STREET is geography: west to east, everyone standing where the records
      put them, the distance between two figures meaning something.

      GRID is an isotype board — the old pictogram trick of one figure per
      person, ranked and counted. Distance means nothing there, so it can be
      sorted by anything you like, and it answers "how many, and when" where
      the street answers "where". They walk on the spot in both, because a
      figure frozen mid-stride reads as a corpse. */
  const SORTS = {
    lng:  { label: "west→east", of: p => (host._lngOf.get(p.slug) ?? Infinity) },
    year: { label: "earliest first", of: p => (p.birthYear ?? p.deathYear ?? Infinity) },
    name: { label: "A→Z", of: p => p.name.toLowerCase() },
  };

  /*  The street, narrowed to whatever you searched for.

      Filtering the columns rather than dimming them, because the point is to
      shorten the walk: a match two parishes wide is a street two parishes
      long. Anyone placed in a column that is filtered out goes back to the pen
      for the duration — their placement is untouched and returns with them
      when you clear the box. */
  const placeQ = host._placeQuery || "";
  const placeName = slug => {
    const e = (model.entities || []).find(k => k.slug === slug);
    return ((e && e.name) || slug).toLowerCase();
  };
  const placed = [...coord.entries()]
    .filter(([slug]) => !placeQ || placeName(slug).includes(placeQ) ||
                        slug.toLowerCase().includes(placeQ))
    .sort((a, b) => a[1].lng - b[1].lng);

  /*  With nowhere on the map, the street itself is the one place.

      A pile with no coordinates had no columns and therefore nowhere to drop
      anybody — the one arrangement this panel exists to let you make. Rather
      than inventing a column per declared place, which claims a geography
      nobody gave, there is a single unnamed column: the promenade. Group
      people in it, and when you geocode a place later the real columns appear
      and the grouping is still there. */
  /*  Your own columns, after the places. They have no coordinates by
      definition, so they cannot be ordered by geography — they keep the order
      you made them in, which is at least an order you chose. */
  for (const g of PROM_GROUPS) {
    if (!placeQ || g.name.toLowerCase().includes(placeQ) || g.slug.includes(placeQ)) {
      placed.push([g.slug, null]);
    }
  }

  /*  THE PROMENADE ITSELF — always a column, never a place.

      The named places take the room their crowds need; whatever is left over
      IS the promenade, and it is where somebody stands when you have decided
      they belong together but not that they belong anywhere on the map. It is
      not a fallback for a pile with no coordinates — it is there beside the
      parishes whether they exist or not, because "these people, not anywhere
      in particular" is a grouping in its own right. */
  const PROMENADE = "";
  placed.push([PROMENADE, null]);
  const STEP = (GRID ? 74 : 110) * Z, PAD = 70 * Z, GROUND = 0.72;

  /*  Columns widen to hold their crowd.

      A place with ten people in it needs more room than a place with one, and
      a fixed column would either waste space everywhere or overflow wherever
      you put a family. So each column is sized to its occupancy and the street
      is laid out cumulatively — the parishes stay in west-to-east order, they
      just take the room they need.

      Only people you have PLACED count. Someone standing at the average of
      three parishes belongs to none of them and does not swell any column. */
  /*  Tuned so the growth is visible rather than theoretical. At the previous
      15+40 a column of five came out 115 against a 110 minimum — arithmetically
      wider, indistinguishable by eye. These give roughly 110 for one or two,
      160 for five, 270 for ten. */
  const SPACING = 22 * Z, GUTTER = 50 * Z;
  const occ = new Map();
  if (host._pinned) {
    for (const place of host._pinned.values()) occ.set(place, (occ.get(place) || 0) + 1);
  }
  /*  The one fallback column IS the street, so it takes the whole view rather
      than standing as a narrow strip with empty ground either side. A real
      place is sized to its crowd; the promenade is sized to the panel. */
  const widthOf = slug => Math.max(STEP, (occ.get(slug) || 0) * SPACING + GUTTER);

  /*  The places are sized to their crowds; the promenade takes the rest of the
      view. Never less than its own crowd needs, so a busy promenade on a
      narrow panel still holds everyone — it stops being "the leftover" and
      starts being a column like any other, which is the honest thing for it to
      do once there are twenty people in it.

      host.clientWidth, not app.screen.width: the layout is worked out before
      the Pixi application exists, and reaching for `app` here threw before a
      single column was measured. */
  const xOf = new Map(), wOf = new Map();
  const named = placed.filter(([slug]) => slug !== PROMENADE);
  const takenByPlaces = named.reduce((n, [slug]) => n + widthOf(slug), 0);
  const view = (host.clientWidth || 600);
  const promW = Math.max(widthOf(PROMENADE), view - PAD * 2 - takenByPlaces);

  let cursor = PAD;
  for (const [slug] of placed) {
    const w = slug === PROMENADE ? promW : widthOf(slug);
    wOf.set(slug, w);
    xOf.set(slug, cursor + w / 2);      // the column's center
    cursor += w;
  }
  const unknownX = cursor;
  const worldW = cursor + PAD;

  if (!host._app) {
    const shell = document.createElement("div");
    shell.className = "pr-shell";
    host.innerHTML = "";
    host.appendChild(shell);
    const note = document.createElement("p");
    note.className = "hint pr-note";
    shell.appendChild(note);

    /*  Whole-number steps only. Re-rendering is the right move here rather
        than scaling the stage: at 3× the walkers need more room between the
        signposts, not the same street enlarged until everyone overlaps. */
    /*  Plain + and −, not a cycling label. A single button that steps 1→2→3→1
        makes zooming out a three-press journey and gives no clue what is
        coming. Two buttons say what they do and stop at the ends. */
    const zoomOut = document.createElement("button");
    zoomOut.className = "pr-zoom pr-zoom-out";
    zoomOut.textContent = "−";
    const zoom = document.createElement("button");
    zoom.className = "pr-zoom";
    zoom.textContent = "+";
    /*  Street or grid, and how the grid is ranked. The sort only appears in
        the grid, because on the street the order is the geography — offering
        to re-sort it would be offering to move Perth. */
    const modeBtn = document.createElement("button");
    modeBtn.className = "pr-zoom pr-mode";
    const sortSel = document.createElement("select");
    sortSel.className = "pr-sort";
    sortSel.innerHTML =
      '<option value="lng">west→east</option>' +
      '<option value="year">earliest first</option>' +
      '<option value="name">A→Z</option>';
    const syncMode = () => {
      modeBtn.textContent = host._view === "grid" ? "grid" : "street";
      sortSel.hidden = host._view !== "grid";
      sortSel.value = host._sort || "lng";
    };
    modeBtn.onclick = () => {
      host._view = host._view === "grid" ? "street" : "grid";
      /*  Placements survive the view change. Putting someone in Perth is a
          statement about who they belong with, not about where they stand in
          one particular arrangement — so the grid groups by it and the street
          stands them there. Clearing it here was throwing away the only thing
          the two views have in common. */
      syncMode();
      host._world.x = 0;   // the two layouts share no coordinates
      renderPromenadePixi(V(), host);
    };
    sortSel.onchange = () => {
      host._sort = sortSel.value;
      // A re-sort reorders within the groups; it does not dissolve them.
      renderPromenadePixi(V(), host);
    };
    const driftBtn = document.createElement("button");
    driftBtn.className = "pr-zoom pr-drift on";
    driftBtn.textContent = "❚❚";
    host._driftBtn = driftBtn;
    driftBtn.onclick = () => {
      clearTimeout(host._idleTimer);        // an explicit choice outranks the timer
      host._drift = !host._drift;
      driftBtn.textContent = host._drift ? "❚❚" : "▶";
      driftBtn.classList.toggle("on", host._drift);
    };
    shell.appendChild(driftBtn);

    shell.appendChild(modeBtn);
    shell.appendChild(sortSel);
    host._syncMode = syncMode;
    syncMode();

    const ZOOM_MIN = 1, ZOOM_MAX = 4;
    const setZoom = next => {
      const z = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, next));
      if (z === (host._zoom || 1)) return;
      host._zoom = z;
      host._noTween = true;          // the coordinates are about to mean something else
      zoom.disabled = z >= ZOOM_MAX;
      zoomOut.disabled = z <= ZOOM_MIN;
      // Hold the middle of the view across the change, so zooming in does not
      // also teleport you to the west coast.
      const mid = (-host._world.x + host._app.screen.width / 2) / (host._worldW || 1);
      renderPromenadePixi(V(), host);
      host._world.x = Math.min(0, Math.max(-(host._worldW - host._app.screen.width),
        -(mid * host._worldW - host._app.screen.width / 2)));
    };
    zoom.onclick = () => setZoom((host._zoom || 1) + 1);
    zoomOut.onclick = () => setZoom((host._zoom || 1) - 1);
    zoomOut.disabled = true;                 // starts at 1×
    shell.appendChild(zoom);
    shell.appendChild(zoomOut);

    /*  Find anybody on the panel.

        It removes nobody: non-matches dim, and matches light up and show their
        name, so you can still see how many you are choosing from and where
        they are standing relative to everyone else. */
    /*  Columns you invent.

        A button rather than a field, because adding a group is something you
        do rarely and deliberately — a permanent input for it sat there asking
        to be filled in. Naming an existing group removes it, since there is
        nowhere sensible to hang a row of delete buttons over a street. Anyone
        standing in a removed group goes back to the pen: their placement
        referred to a column that no longer exists. */
    const groupBtn = document.createElement("button");
    groupBtn.textContent = "+ group";
    groupBtn.title = "a column of your own \u2014 a household, a theory, anything. " +
                     "Name an existing one to remove it.";
    /*  Named in a field on the bar, not in a native prompt().

        A prompt() that the browser has decided to suppress — and Chrome
        offers to suppress them after a page has thrown a few — returns null,
        which is indistinguishable from you pressing Cancel. So the button did
        nothing, said nothing, and there was no way to tell which of those had
        happened. A field cannot be switched off by a checkbox. */
    const groupIn = document.createElement("input");
    groupIn.type = "text";
    groupIn.className = "pr-groupin";
    groupIn.placeholder = "name a column…";
    groupIn.spellcheck = false;
    groupIn.hidden = true;
    groupIn.title = "Enter to add it. Naming one that already exists removes it. Esc to give up.";

    const closeGroupIn = () => { groupIn.hidden = true; groupIn.value = ""; };
    groupBtn.onclick = () => {
      groupIn.hidden = !groupIn.hidden;
      if (!groupIn.hidden) groupIn.focus();
    };
    groupIn.onkeydown = e => {
      if (e.key === "Escape") { closeGroupIn(); return; }
      if (e.key !== "Enter") return;
      const want = groupIn.value.trim();
      if (!want) { closeGroupIn(); return; }
      const slug = "grp-" + slugify(want);
      const at = PROM_GROUPS.findIndex(g => g.slug === slug);
      if (at === -1) PROM_GROUPS.push({ slug, name: want });
      else {
        /*  Naming one that exists removes it, and anyone standing in it goes
            back to the pen — their placement referred to a column that is no
            longer there. */
        PROM_GROUPS.splice(at, 1);
        for (const [uid, where] of [...host._pinned.entries()]) {
          if (where === slug) host._pinned.delete(uid);
        }
        if (host._savePins) host._savePins();
      }
      saveGroups();
      closeGroupIn();
      renderPromenadePixi(V(), host);
    };
    host._groupBtn = groupBtn;
    host._groupIn = groupIn;

    const penFind = document.createElement("input");
    penFind.type = "text";
    penFind.className = "pr-find";
    penFind.placeholder = "find a brickling or a place…";
    penFind.spellcheck = false;
    shell.appendChild(penFind);
    host._penFind = penFind;
    penFind.addEventListener("input", () => {
      /*  One box, both questions.

          "Find someone" and "filter to a place" were separate fields asking
          the same thing in two ways — you typed a word and had to decide which
          kind of answer you wanted before you knew what was there. Now the
          word is applied to both: matching people light up, and the columns
          narrow to matching places. */
      const q = penFind.value.trim().toLowerCase();
      host._penQuery = q;
      host._placeQuery = q;
      applyPenSearch(host);
      host._noTween = true;
      host._world.x = 0;       // the street just changed length
      renderPromenadePixi(V(), host);
    });

    /*  Save and load the sidecar.

        Save hands you a brick.json to drop beside your bricks; Load takes one
        back. Opening a research folder that already contains one reads it
        without asking, so these are for moving an arrangement between machines
        rather than everyday use. */
    const fileBar = document.createElement("div");
    fileBar.className = "pr-files";
    fileBar.innerHTML =
      '<button data-k="save" title="write a brick.json holding who you put where, ' +
      'the columns you made, their colors and the scene behind them \u2014 keep it ' +
      'beside your bricks">save scene</button>' +
      '<button data-k="load" title="read a brick.json back in, replacing the ' +
      'scene you are looking at">open\u2026</button>' +
      // Beside the file controls, since the questions it answers are mostly
      // "what file do I make, and what goes in it".
      '<a class="pr-doc" href="doc/promenade.html" target="_blank" rel="noopener"' +
      ' title="how to manage the promenade, and how to make its art">help</a>';
    // README.md covers the whole project; this button is the Promenade's own page.
    shell.appendChild(fileBar);
    fileBar.querySelector('[data-k="save"]').onclick = () =>
      downloadText(sidecarJSON(host), "brick.json", "application/json");
    fileBar.insertBefore(groupBtn, fileBar.firstChild);
    fileBar.insertBefore(groupIn, groupBtn.nextSibling);

    /*  The scene's own sky and ground.

        In the bar rather than behind a signpost, because it is the one
        backdrop with no column to select: the tint bar appears when you click
        a place, and there is nothing to click for "the whole street". Two
        swatches and a way back. */
    const bgBar = document.createElement("span");
    bgBar.className = "pr-bg";
    bgBar.innerHTML =
      '<span class="pr-bg-cap">scene</span>' +
      '<input type="color" data-k="sky" title="the sky behind the whole street">' +
      '<input type="color" data-k="ground" title="the ground everybody stands on">' +
      '<button data-k="reset" title="back to the street’s own colors">↺</button>';
    fileBar.insertBefore(bgBar, groupBtn.nextSibling);
    const syncBgBar = () => {
      bgBar.querySelector('[data-k="sky"]').value = SCENE_BG.sky;
      bgBar.querySelector('[data-k="ground"]').value = SCENE_BG.ground;
    };
    const redrawScene = () => {
      saveSceneBg();
      host._noTween = true;
      renderPromenadePixi(V(), host);
    };
    bgBar.addEventListener("input", e => {
      const k = e.target.dataset.k;
      if (k !== "sky" && k !== "ground") return;
      SCENE_BG[k] = e.target.value;
      redrawScene();
    });
    bgBar.querySelector('[data-k="reset"]').onclick = () => {
      SCENE_BG = { ...SCENE_BG_DEFAULT };
      syncBgBar();
      redrawScene();
    };
    syncBgBar();
    host._syncSceneBg = syncBgBar;   // an opened sidecar can bring its own
    fileBar.querySelector('[data-k="load"]').onclick = () => {
      const inp = document.createElement("input");
      inp.type = "file";
      inp.accept = ".json,application/json";
      inp.onchange = () => {
        const f = inp.files && inp.files[0];
        if (!f) return;
        f.text().then(txt => {
          const got = applySidecar(txt, host);
          const note = host.querySelector(".pr-note");
          if (note) {
            note.textContent = got
              ? got.pins + " placed, " + got.tints + " colored"
              : "that file is not valid JSON";
          }
          host._noTween = true;
          renderPromenadePixi(V(), host);
        });
      };
      inp.click();
    };

    /*  Color the selected column.

        Only visible when a place is actually selected, because a color picker
        with nothing to color is a puzzle. Click a signpost and it appears
        naming that place; click away and it goes. Two stops and a clear —
        which is the whole of what a backdrop needs. */
    const tintBar = document.createElement("div");
    tintBar.className = "pr-tint";
    tintBar.hidden = true;
    tintBar.innerHTML =
      '<span class="pr-tint-name"></span>' +
      '<input type="color" data-k="from" value="#1d2c38">' +
      '<input type="color" data-k="to" value="#1a1f18">' +
      '<input type="range" data-k="alpha" min="0" max="1" step="0.05" value="1" ' +
        'title="how strongly it shows">' +
      /*  The ribbon's own color, shown only for the columns that HAVE a
          ribbon. A place has a signpost and there is nothing here to paint,
          so the control goes away rather than sitting there doing nothing. */
      '<input type="color" data-k="ribbon" class="pr-ribbon" ' +
        'title="the color of this column\u2019s ribbon">' +
      '<button data-k="clear" title="no gradient for this place">×</button>';
    shell.appendChild(tintBar);
    host._tintBar = tintBar;

    const readTint = () => {
      const slug = host._focusKind === "column" ? host._focus : null;
      // "" is the promenade — a real column and a valid key, so this has to
      // test for null rather than for falsiness.
      if (slug === null) return null;
      return COLUMN_TINT.get(slug) || { from: "#1d2c38", to: "#1a1f18", alpha: 1 };
    };
    tintBar.addEventListener("input", e => {
      const slug = host._focusKind === "column" ? host._focus : null;
      if (slug === null || !e.target.dataset.k) return;
      const cur = readTint();
      const next = { from: cur.from, to: cur.to,
                     alpha: cur.alpha === undefined ? 1 : cur.alpha };
      const k = e.target.dataset.k;
      /*  The ribbon is not part of the gradient — it is the label, not the
          backdrop — so it is stored and saved separately even though the two
          controls share a bar. */
      if (k === "ribbon") {
        RIBBON.set(slug, e.target.value);
        saveRibbons();
        host._noTween = true;
        renderPromenadePixi(V(), host);
        return;
      }
      next[k] = k === "alpha" ? Number(e.target.value) : e.target.value;
      COLUMN_TINT.set(slug, next);
      saveColumnTints();
      host._noTween = true;
      renderPromenadePixi(V(), host);
    });
    tintBar.querySelector('[data-k="clear"]').onclick = () => {
      const slug = host._focusKind === "column" ? host._focus : null;
      if (slug === null) return;
      COLUMN_TINT.delete(slug);
      RIBBON.delete(slug);            // back to the street's own timber
      saveColumnTints();
      saveRibbons();
      host._noTween = true;
      renderPromenadePixi(V(), host);
    };

    host._syncTint = model2 => {
      /*  Any column can be colored, not only a parish.

          A group and the promenade are columns like any other — the whole
          point of clicking their signpost is to give that stretch of street a
          background. Restricting this to places meant the one thing a group's
          signpost could usefully do was the one thing it could not. */
      const isCol = host._focusKind === "column";
      // "" is the promenade, and a valid key — check the kind, not the slug.
      const slug = isCol ? host._focus : null;
      tintBar.hidden = !isCol || host._view === "grid";
      if (!isCol) return;
      const grp = slug ? groupNameOf(slug) : "The Promenade";
      const e = grp ? null : ((model2 || V()).entities || []).find(k => k.slug === slug);
      tintBar.querySelector(".pr-tint-name").textContent = grp || (e ? e.name : slug);
      const t = readTint();
      tintBar.querySelector('[data-k="from"]').value = t.from;
      tintBar.querySelector('[data-k="to"]').value = t.to;
      tintBar.querySelector('[data-k="alpha"]').value = t.alpha === undefined ? 1 : t.alpha;
      const rb = tintBar.querySelector('[data-k="ribbon"]');
      rb.hidden = !grp;               // only the columns that hang one
      rb.value = ribbonOf(slug);
    };

    const app = new P.Application({
      backgroundAlpha: 0, antialias: false, autoDensity: true,
      resolution: window.devicePixelRatio || 1,
      width: shell.clientWidth || 600, height: shell.clientHeight || 150,
    });
    // Pixi 7 exposes the canvas as .view; append it, do not replace the shell.
    shell.appendChild(app.view);
    app.view.className = "pr-canvas";
    host._app = app;
    host._shell = shell;
    // The drawing itself. Every walker gets a recolored copy of this.
    host._wear = { body: makeBodySheet(), bottom: makeBottomSheet(),
                   top: makeTopSheet(), hat: makeHatSheet() };
    host._body = host._wear.body;                 // the bare figure, for reference
    // The fully dressed default, for anything wanting one finished figure.
    host._base = dressBody(ROWS.map(k => ({ img: host._wear[k], slot: k })));
    host._texCache = new Map();
    host._world = new P.Container();
    app.stage.addChild(host._world);

    /*  Drag to walk along the scene. A wheel works too, but a scene you can
        take hold of is the point of a promenade. */
    /*  Panning happens on the BACKGROUND, through Pixi's own events.

        It used to be a DOM listener on the canvas, which fought Pixi's hit
        testing on the very same pointerdown: whichever ran first won, so
        picking up a figure sometimes panned the street instead. Letting Pixi
        decide what was grabbed removes the race — the ground is a target like
        any other, and if you grabbed a walker the ground never hears about it.

        The pan state lives on the host because the background object itself is
        rebuilt with every render. */
    /*  Panning the street.

        A plain DOM drag on the canvas, guarded by a flag the walkers set. Pixi
        registers its own listener when the Application is built — before this
        one — so a pointerdown on a figure has already set host._dragging by
        the time this runs, and the street stays put. */
    app.stage.eventMode = "static";
    let panFrom = null;
    app.view.addEventListener("pointerdown", e => {
      if (host._dragging) return;          // a walker took it
      panFrom = { x: e.clientX, wx: host._world.x };
      host._drift = false;
    });
    window.addEventListener("pointermove", e => {
      if (!panFrom || host._dragging) return;
      host._world.x = Math.min(0, Math.max(-(host._worldW - app.screen.width),
                                           panFrom.wx + (e.clientX - panFrom.x)));
    });
    window.addEventListener("pointerup", () => { panFrom = null; });

    /*  A LAST RESORT FOR THE BALLOON.

        Taking hold of the envelope sets a `held` flag that stops the ticker
        moving it, and only the balloon's own pointerup and pointerupoutside
        clear it again. Neither of those arrives if the button comes up
        somewhere Pixi never hears about — outside the canvas, outside the
        window, or a pointercancel from the OS — and the balloon then hangs
        motionless in the sky for the rest of the session with no way back.

        The pan above has had this same safety net since it was written, for
        the same reason. Anything that latches on pointerdown needs a release
        that cannot be missed. */
    const letGoOfBalloon = () => {
      const b = host._balloon;
      if (!b) return;
      if (b.release) b.release();
      /*  And if it is still held after that, force it. release() bails when it
          thinks no drag is in progress, which is exactly the state a lost
          pointerup leaves behind — the flag set and the gesture forgotten. */
      if (b.held) {
        b.held = false;
        b.from = b.node.y - (b.riders.length * 3 + Math.sin(b.t * 0.7) * 6);
        host._dragging = false;
      }
    };
    window.addEventListener("pointerup", letGoOfBalloon);
    window.addEventListener("pointercancel", letGoOfBalloon);
    window.addEventListener("blur", letGoOfBalloon);
    app.view.addEventListener("wheel", e => {
      host._drift = false;
      host._world.x = Math.min(0, Math.max(-(host._worldW - app.screen.width),
                                           host._world.x - e.deltaY));
      e.preventDefault();
    }, { passive: false });

    /*  Resizing, driven by whoever actually knows.

        A ResizeObserver on the shell does not survive the board rebuilding its
        tiles — the panel is re-parented and the observation is silently lost,
        so growing a tile left the canvas at its old size. The board calls this
        directly instead. The observer stays as a second route, for the window
        resizing rather than the grid.

        The ground line and everyone's feet are positioned against the panel's
        height, so this rebuilds the scene rather than just stretching the
        canvas; the world container keeps its x, so your place in the street
        survives. */
    host._reflowNow = () => {
      const w = shell.clientWidth, h = shell.clientHeight;
      if (w <= 0 || h <= 0) return;
      if (app.screen.width === w && app.screen.height === h) return;
      app.renderer.resize(w, h);
      clearTimeout(host._reflow);
      host._reflow = setTimeout(() => {
        host._noTween = true;        // a resize moves the ground, not the people
        const keep = host._world.x;
        renderPromenadePixi(V(), host);
        host._world.x = Math.min(0, Math.max(-(host._worldW - app.screen.width), keep));
      }, 60);
    };

    /*  Where you have put people, remembered.

        Still purely the Promenade's own: it never reaches the pile, writes no
        brick and sets no coordinate. But an arrangement you spent time on
        should survive closing the tab — losing it on reload made the whole
        thing feel like a toy. Stored by uid, so it lines up again whatever
        else changed in the pile meanwhile. */
    host._pinned = new Map();
    try {
      const raw = JSON.parse(localStorage.getItem(PINNED_KEY) || "null");
      if (Array.isArray(raw)) {
        for (const [uid, place] of raw) {
          if (typeof uid === "string" && typeof place === "string") host._pinned.set(uid, place);
        }
      }
    } catch (e) { /* unavailable */ }

    host._savePins = () => {
      try {
        if (host._pinned.size) {
          localStorage.setItem(PINNED_KEY, JSON.stringify([...host._pinned.entries()]));
        } else {
          localStorage.removeItem(PINNED_KEY);
        }
      } catch (e) { /* private mode */ }
    };

    /*  The holding pen: everyone no record places.

        It hangs off the STAGE rather than the world, so it does not scroll —
        it stays in the top-left corner wherever you have panned to. That is
        the point of it. Parking the unplaced at the far end of the street
        meant they were a mile from every column you might want to drop them
        into, and out of sight for most of the scene.

        Dotted, like the drop zones, because it is one: drag somebody back
        into it to say you no longer know where they were. */
    /*  The pen is drawn last, above the street and above whoever is being
        carried — a figure passing over the box must not hide the box it is
        being aimed at. Pixi only honors zIndex on a sorted parent. */
    app.stage.sortableChildren = true;
    host._limbo = new P.Container();
    host._limbo.zIndex = PEN_Z;
    app.stage.addChild(host._limbo);

    /*  Drift as an attract mode.

        Still off while you are working — a scene that slides about under the
        cursor is an obstacle — but it starts on its own once the panel has
        been left alone for a while, so a board sitting on a screen eventually
        shows itself off. Any touch of it stops the drift and starts the wait
        over: the moment you reach for someone, the street stands still.

        The button remains an override for starting it deliberately.

        It STARTS moving, so the button is a pause. A still street reads as a
        broken one — you cannot tell a paused promenade from one that failed to
        start, and the first thing this panel has to say is that these are
        people rather than a chart. Reach for anyone and it stops. */
    host._drift = true;
    host._idleMs = 30000;
    host._bumpIdle = () => {
      host._drift = false;
      if (host._driftBtn) {
        host._driftBtn.textContent = "▶";
        host._driftBtn.classList.remove("on");
      }
      clearTimeout(host._idleTimer);
      // A stilled scene is what someone asked for; do not override that.
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      host._idleTimer = setTimeout(() => {
        host._drift = true;
        if (host._driftBtn) {
          host._driftBtn.textContent = "❚❚";
          host._driftBtn.classList.add("on");
        }
      }, host._idleMs);
    };
    for (const t of ["pointerdown", "pointermove", "wheel"]) {
      shell.addEventListener(t, host._bumpIdle, { passive: true });
    }
    /*  Not called here.

        It used to be, to arm the idle timer — but bumpIdle's first act is to
        STOP the drift, so arming it that way turned the street off the instant
        it was built. The timer is armed by the first interaction instead,
        which is the only time the "left alone for a while" it measures starts
        meaning anything. */
    /*  Reassigning a texture makes Pixi rebuild the sprite's UVs. At six
        frames a second the walk cycle only changes every tenth frame, so doing
        it unconditionally was nine wasted rebuilds out of ten, per walker. */
    const setFrame = (w, i) => {
      if (w.frame === i) return;
      w.frame = i;
      w.sprite.texture = w.frames[i];
    };
    app.ticker.add(() => {
      const t = app.ticker.lastTime / 1000;
      for (const w of host._walkers || []) {
        /*  A held figure belongs to the hand, not to the ticker.

            This is what stopped dragging from working at all: the loop below
            reassigns node.x on every frame, so a figure followed the pointer
            for a fraction of a frame and was then yanked back to where the
            records put them. The drag was working; it was being undone sixty
            times a second. */
        if (w.held) {
          setFrame(w, Math.floor(t * 10 + w.phase) % w.frames.length);
          continue;
        }

        /*  A passenger belongs to the balloon, exactly as a held figure
            belongs to the hand. Their x and y are the balloon's business now;
            the loop below would drag them back to a column they are three
            hundred feet above. They keep walking, because everybody does. */
        if (w.riding) {
          setFrame(w, Math.floor(t * 4 + w.phase) % w.frames.length);
          continue;
        }

        /*  Dropped, and falling. Gravity rather than a tween, because you
            threw them — they should land, not glide. They also slide into the
            middle of their column on the way down, so the drop reads as
            "into that group" rather than "at that spot". */
        if (w.falling) {
          w.vy += 0.9 * (app.ticker.deltaMS / 16.7);
          w.node.y += w.vy;
          w.node.x += (w.home - w.node.x) * 0.12;
          setFrame(w, 0);
          if (w.node.y >= w.toY) {
            w.node.y = w.toY;
            w.node.x = w.home;
            w.falling = false;
            w.vy = 0;
          }
          continue;
        }

        /*  Rearranging is a walk, not a cut.

            When the layout changes, everyone keeps their own position and
            walks to the new one — so you can follow a particular person from
            the street into the grid and see where they landed. A hard swap
            loses that thread entirely, and the whole point of one figure per
            person is that you can keep your eye on one of them.

            Staggered by phase so the cast moves as a crowd rather than a
            rank of soldiers, and eased so it settles rather than stops. */
        if (w.t < 1) {
          w.t = Math.min(1, w.t + app.ticker.deltaMS / w.dur);
          // t starts negative to stagger the crowd; until it reaches zero the
          // walker simply waits where they were.
          const k = Math.max(0, w.t);
          const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
          w.node.x = w.fromX + (w.home - w.fromX) * e;
          w.node.y = w.fromY + (w.toY - w.fromY) * e;
          // Face the way they are traveling while they travel.
          if (Math.abs(w.home - w.fromX) > 2) w.node.scale.x = w.home < w.fromX ? -1 : 1;
          setFrame(w, Math.floor(t * 8 + w.phase * 3) % w.frames.length);
          continue;
        }
        // Each pace is a slow sine about the spot the records put them on, so
        // nobody wanders somewhere no document says they were.
        const off = Math.sin(t / w.period + w.phase) * w.range;
        w.node.x = w.home + off;
        w.node.y = w.toY;
        if (w.range) w.node.scale.x = Math.cos(t / w.period + w.phase) < 0 ? -1 : 1;
        setFrame(w, Math.floor(t * 6 + w.phase * 3) % w.frames.length);
      }
      /*  Names ride on the container, so they flip with their walker; undo it.

          This used to be a second ticker.add() called from the render body,
          which meant one more permanent callback on every zoom, sort, drop and
          resize — each iterating the whole cast every frame, for ever. It
          belongs in the one ticker registered at startup. */
      for (const w of host._walkers || []) {
        if (w.nameNode) w.nameNode.scale.x = w.node.scale.x < 0 ? -1 : 1;
      }
      // The signposts belong to the street, so they fade rather than blink.
      if (host._signLayer) {
        const want = host._view === "grid" ? 0 : 1;
        const a = host._signLayer.alpha;
        if (a !== want) host._signLayer.alpha = a + Math.sign(want - a) * Math.min(0.06, Math.abs(want - a));
      }
      /*  The sky exists on the street and nowhere else.

          The grid is a pictogram board — a flat field with no horizon, so
          there is nothing for a balloon to be in front of and nothing for it
          to be behind. Anything already crossing when you switch is taken
          down rather than left hanging over a chart. */
      const SKY = host._view !== "grid";
      if (!SKY) {
        // Through landBalloon, so anybody aboard is set down in their column
        // rather than deleted along with the basket.
        if (host._balloon) landBalloon(host);
        if (host._birds) { host._birds.node.destroy({ children: true }); host._birds = null; }
      }

      /*  Now and again, a balloon.

          Drawn rather than fetched, and never announced. It drifts across the
          sky on its own schedule, bobs a little, and is gone — the sort of
          thing you only notice if you happen to be looking at the right
          moment, which is the whole point of it.

          Deliberately in the sky layer and never interactive: it is not a
          record, it cannot be clicked, and nothing depends on it. */
      if (SKY && !host._balloon && Math.random() < 0.0004) {
        const bal = new P.Container();
        const g = new P.Graphics();
        // A silk, drawn each time from the same bolt of cloth.
        const [silk, gore] = BALLOON_SILKS[Math.floor(Math.random() * BALLOON_SILKS.length)];
        /*  THE ENVELOPE IS A PEAR, NOT AN ELLIPSE.

            An ellipse is as round at the bottom as it is at the top, which is
            the one thing a balloon is not: the crown is a dome and the base
            draws in to a throat where the ropes gather. And the gores were
            full-height ellipses laid over it, so they bulged past the crown
            and it read as three blobs stuck together rather than one taut bag.

            So the silhouette is sampled once, top to bottom, and everything
            else is expressed as a fraction of the half-width AT THAT HEIGHT.
            The gores are then panels of the balloon rather than shapes sitting
            on it — they narrow where it narrows, and they cannot escape it. */
        const RN = 22;
        const skin = [];                       // [y, halfWidth] from crown to throat
        for (let i = 0; i <= RN; i++) {
          const yy = -BAL.ry + (2 * BAL.ry * i) / RN;
          const u = yy / BAL.ry;               // -1 at the crown, +1 at the throat
          let hw = BAL.rx * Math.sqrt(Math.max(0, 1 - u * u));
          // Below the equator it draws in, and stops at a throat rather than a point.
          if (u > 0) hw = hw * (1 - 0.5 * Math.pow(u, 1.4)) + BAL.rx * 0.2 * Math.pow(u, 2.2);
          skin.push([yy, hw]);
        }
        const bandOf = (centre, halfFrac) => {
          const left = [], right = [];
          for (const [yy, hw] of skin) {
            left.push(centre * hw - halfFrac * hw, yy);
            right.unshift(centre * hw + halfFrac * hw, yy);
          }
          return left.concat(right);
        };
        const outline = [];
        for (const [yy, hw] of skin) outline.push(-hw, yy);
        for (let i = skin.length - 1; i >= 0; i--) outline.push(skin[i][1], skin[i][0]);

        g.beginFill(silk).drawPolygon(outline).endFill();
        g.beginFill(gore).drawPolygon(bandOf(-0.46, 0.13)).endFill();
        g.beginFill(gore).drawPolygon(bandOf(0.46, 0.13)).endFill();

        // The ropes, gathered at the throat and splaying to the basket's corners.
        const throat = skin[skin.length - 1];
        g.lineStyle(1, 0x3a2f20, 0.9);
        g.moveTo(-throat[1] * 0.85, throat[0]); g.lineTo(-BAL.half, BAL.rim);
        g.moveTo(throat[1] * 0.85, throat[0]);  g.lineTo(BAL.half, BAL.rim);
        g.lineStyle(0);
        bal.addChild(g);

        /*  The basket is its own object because it has to be drawn AFTER the
            passenger. Everything else about a passenger riding in it rather
            than under it is that one fact. */
        const basket = new P.Graphics();
        basket.beginFill(0x6d5433)
          .drawRect(-BAL.half, BAL.rim, BAL.half * 2, BAL.deep).endFill();
        // A darker rim, so the near edge reads in front of whoever is in it.
        basket.beginFill(0x4a3922)
          .drawRect(-BAL.half, BAL.rim, BAL.half * 2, 2).endFill();
        // Wicker, suggested rather than drawn: three courses is enough at
        // this size, and a fourth turns the whole thing into a smudge.
        basket.lineStyle(1, 0x4a3922, 0.5);
        for (let wy = BAL.rim + 5; wy < BAL.rim + BAL.deep; wy += 5) {
          basket.moveTo(-BAL.half, wy); basket.lineTo(BAL.half, wy);
        }
        bal.addChild(basket);
        bal.y = H() * 0.22;
        bal.x = -30;
        /*  Solid. It was 0.85 back when it was scenery you were meant to
            half-notice — but it carries a person now, and container alpha
            multiplies down into its children, so the passenger was being
            washed out along with it. Nothing you can pick somebody up with
            should look like weather. */
        /*  Above the street, below the pen.

            This used to be addChildAt(stage, 0), which reads as "behind
            everything" and was: the world's own sky is an opaque rectangle the
            full size of the panel, so a balloon put underneath it drifted the
            whole way across without a single pixel of it ever being seen. The
            stage sorts on zIndex — world sits at 0 and the pen at 10, so the
            sky belongs between them. */
        /*  The balloon hangs off the STAGE, not the world, so the zoom that
            scales the street goes straight past it — it stayed nine-tenths of
            an inch across while the people under it doubled. The whole
            container is scaled instead, and kept in step by the ticker below,
            because the zoom can change without a balloon ever being rebuilt. */
        bal.scale.set(host._zoom || 1);
        bal.zIndex = SKY_Z;
        /*  Clickable, but only ever to let people off. A Container is not hit
            tested through its children, so it needs its own area — generous,
            because it is nine pixels wide and moving. */
        /*  THE ENVELOPE IS THE TARGET, NOT THE BALLOON.

            A hitArea on a Container does not merely describe that container —
            Pixi prunes the entire subtree when the point falls outside it. So
            a hit box drawn round the envelope quietly made the passenger
            hanging beneath it untouchable, and the passenger could not be
            dragged back off. Draw it big enough to reach them instead and the
            opposite happens: the passenger is on top, and every click meant
            for the balloon lands on the person it was trying to put down.

            Both problems are the same mistake. The envelope is a sibling of
            the passenger, not their parent, so it gets its own hit box and
            they keep theirs. */
        /*  The ENVELOPE only, stopping above the basket rim. The passenger's
            head and shoulders show above that rim and they are draggable in
            their own right — so the balloon's own target has to end where they
            begin, or grabbing the passenger grabs the balloon instead. */
        g.eventMode = "static";
        g.hitArea = new P.Rectangle(-BAL.rx - 2, -BAL.ry - 2, BAL.rx * 2 + 4, BAL.ry * 2 + 4);
        // Deaf for the length of a drag, like the pen — see the walker's
        // pointerdown. Set here too, for a balloon that arrives mid-drag.
        bal.interactiveChildren = !host._dragging;
        /*  Take hold of it and it goes where you put it.

            The drift is a schedule, not a rule. Steering the balloon is how you
            get it over the person you want to pick up, and how you get it over
            the column you want to set them down in — without it, boarding is a
            game of waiting for the thing to drift past somebody.

            Same distance rule as everywhere else on this panel: under four
            pixels is a click, past that you are moving it. So one gesture on
            one target does both, and neither has to be explained. */
        g.cursor = "grab";
        let downX = null, downY = null, fromX = 0, fromY = 0, shifted = false;
        const mine = () => (host._balloon && host._balloon.node === bal && !bal.destroyed)
          ? host._balloon : null;
        g.on("pointerdown", ev => {
          const b = mine();
          if (!b) return;
          downX = ev.global.x; downY = ev.global.y;
          fromX = bal.x; fromY = bal.y;
          shifted = false;
          b.held = true;                 // the ticker leaves it alone while held
          host._dragging = true;         // and the street does not pan underneath
          host._drift = false;
          g.cursor = "grabbing";
        });
        g.on("globalpointermove", ev => {
          if (downX === null || !mine()) return;
          const dx = ev.global.x - downX, dy = ev.global.y - downY;
          if (!shifted && Math.abs(dx) + Math.abs(dy) < 4) return;
          shifted = true;
          bal.x = fromX + dx;
          bal.y = fromY + dy;
        });
        const release = () => {
          if (downX === null) return;
          downX = null;
          g.cursor = "grab";
          host._dragging = false;
          /*  A press and a release are two events with a frame or more between
              them, and in that gap the balloon can have left the frame and been
              destroyed — the handler still runs, on a node whose transform is
              already gone. */
          const b = mine();
          if (!b) return;
          b.held = false;
          /*  Hand the height back to the bob without a jump: `from` is the line
              it hangs about, so it has to be set to wherever it is NOW minus
              however far through the bob we happen to be. */
          b.from = bal.y - (b.riders.length * 3 + Math.sin(b.t * 0.7) * 6);
          if (!shifted) dropOffBalloon(host);
        };
        g.on("pointerup", release);
        g.on("pointerupoutside", release);
        app.stage.addChild(bal);
        host._balloon = { node: bal, envelope: g, basket, t: 0, from: bal.y,
                          riders: [], held: false, dir: 1, release };
      }
      if (host._balloon) {
        const b2 = host._balloon;
        b2.t += app.ticker.deltaMS / 1000;
        /*  Held, so the ticker keeps its hands off. Same rule as a walker
            being carried: whoever has hold of a thing owns its position, and
            two writers of one x is how a drag stops working. */
        if (!b2.held) {
          // Heavier when it is carrying somebody: slower across, riding lower.
          const load = b2.riders.length;
          b2.node.x += balloonDrift(load) * b2.dir;
          b2.node.y = b2.from + load * 3 + Math.sin(b2.t * 0.7) * 6;

          /*  Zoom can change between frames. Compared before assigning so a
              still scene is not rewriting a transform sixty times a second. */
          const bz = host._zoom || 1;
          if (b2.node.scale.x !== bz) {
            b2.node.scale.set(bz);
            for (const r of b2.riders) if (r.node && !r.node.destroyed) {
              // Counter-scaled: the sprite inside is already drawn at zoom, so
              // without this a passenger would render at zoom squared.
              r.node.scale.set(Math.sign(r.node.scale.x || 1) / bz, 1 / bz);
            }
          }

          if (load) {
            /*  CARRYING SOMEBODY: it turns at the edges instead of leaving.

                An empty balloon is scenery and is meant to pass. One with a
                passenger in it is holding a person you put there, and sailing
                off the side with them is both alarming and the thing that used
                to break: the balloon was destroyed at the edge and took a live,
                fully-wired walker down with it.

                Now it simply cannot reach the edge while loaded. It works the
                room until you let them out. */
            const edge = (BAL.rx + 6) * bz;
            const far = app.screen.width - edge;
            if (b2.node.x < edge)      { b2.node.x = edge; b2.dir = 1; }
            else if (b2.node.x > far)  { b2.node.x = far;  b2.dir = -1; }
            // The passenger faces the way they are going, like everyone else.
            for (const r of b2.riders) {
              if (r.node && !r.node.destroyed) r.node.scale.x = Math.abs(r.node.scale.x) * b2.dir;
            }
          }
          // Empty, and past the far side: gone, as it always was.
          else if (b2.node.x > app.screen.width + 30) landBalloon(host);
        }
      }

      /*  And birds, more often than the balloon.

          A skein of three or four, flapping out of step with each other so
          they read as birds rather than a decal. Same rules: sky only, never
          interactive, gone when they leave the frame. */
      if (SKY && !host._birds && Math.random() < 0.0016) {
        const flock = new P.Container();
        const n = 3 + Math.floor(Math.random() * 3);
        const dir = Math.random() < 0.5 ? 1 : -1;
        const marks = [];
        for (let i = 0; i < n; i++) {
          const g = new P.Graphics();
          // Behind the leader and a little above or below, the way they fly.
          g.x = -i * (11 + Math.random() * 7) * dir;
          g.y = i * (4 - Math.random() * 8);
          flock.addChild(g);
          marks.push({ g, phase: Math.random() * 6.28, rate: 6 + Math.random() * 4 });
        }
        flock.y = H() * (0.1 + Math.random() * 0.16);
        flock.x = dir > 0 ? -40 : app.screen.width + 40;
        /*  Dark birds or pale ones, decided per flock. A single dark tone
            vanished into the sky it was drawn on; silhouettes read one way
            against a bright sky and the other way against a dim one, and
            picking per flock gets both without knowing which sky it is. */
        flock.alpha = 0.75;
        host._birdTone = Math.random() < 0.5 ? 0x11151b : 0xe8ece6;
        flock.zIndex = SKY_Z;               // same sky the balloon crosses
        app.stage.addChild(flock);
        host._birds = { node: flock, marks, dir, t: 0 };
      }
      if (host._birds) {
        const f = host._birds;
        f.t += app.ticker.deltaMS / 1000;
        f.node.x += 0.9 * f.dir;
        f.node.y += Math.sin(f.t * 0.5) * 0.12;
        for (const m of f.marks) {
          // Two strokes of a wing, redrawn as the beat opens and closes.
          const beat = Math.sin(f.t * m.rate + m.phase);
          const lift = 2.2 * beat;
          m.g.clear();
          m.g.lineStyle(1, host._birdTone === undefined ? 0x11151b : host._birdTone, 0.95);
          m.g.moveTo(-3, lift); m.g.lineTo(0, -lift * 0.5);
          m.g.lineTo(3, lift);
        }
        if (f.node.x < -60 || f.node.x > app.screen.width + 60) {
          f.node.destroy({ children: true });
          host._birds = null;
        }
      }

      if (host._drift) {
        host._world.x -= 0.25;
        if (host._world.x < -(host._worldW - app.screen.width)) host._world.x = 0;
      }
    });

    if (window.ResizeObserver) {
      /*  The ground line and everyone's feet are laid out against the panel's
          height, so stretching the canvas alone leaves the horizon where it
          was and the walkers standing in mid-air. The scene has to be rebuilt.

          Debounced, because dragging a tile's edge fires this continuously and
          each rebuild is ~200 display objects. The scroll position is on the
          world container, which survives the rebuild, so your place in the
          street is kept. */
      new ResizeObserver(() => host._reflowNow()).observe(shell);
    }
  }

  const app = host._app, world = host._world;
  host._renderId = (host._renderId || 0) + 1;
  host._worldW = worldW;

  /*  Where everyone was standing a moment ago.

      Read before the scene is torn down so the rebuilt cast can start from
      the old arrangement and walk to the new one. Keyed by uid, so a person
      who was on screen keeps their thread through the change; anyone new just
      appears where they belong. */
  /*  Destroyed nodes are skipped rather than read. A Pixi node whose transform
      has been torn down throws on .x, and this loop touches every walker in
      the cast before anything else happens — so one destroyed node anywhere in
      that list takes the whole render down, and with it the panel. Whoever
      destroyed it has already decided that person needs rebuilding; there is
      no last position worth recovering. */
  const wasAt = new Map();
  for (const w of host._walkers || []) {
    if (w.node && !w.node.destroyed) wasAt.set(w.slug, { x: w.node.x, y: w.node.y });
  }

  /*  Anything still held when a rebuild lands — a drag interrupted by a model
      change, a timer, a resize — is on the stage, which nothing below clears.
      Sweep it up here or it outlives the rebuild as a duplicate. */
  if (host._lifted) {
    if (host._lifted.parent) host._lifted.parent.removeChild(host._lifted);
    host._lifted = null;
  }
  world.removeChildren();
  host._walkers = [];
  host._ensureNameFor = new Map();

  // Both directions of the person↔place relation, so a click either way can
  // light the other side without walking the records again.
  const byPlace = new Map();
  for (const [person, places] of whereByPerson) {
    for (const pl of places) {
      let set = byPlace.get(pl);
      if (!set) byPlace.set(pl, set = new Set());
      set.add(person);
    }
  }
  host._related = { byPerson: whereByPerson, byPlace };

  const H = () => app.screen.height || 150;
  const groundY = () => H() * GROUND;

  // Ground and sky, redrawn with the scene so a resized panel keeps its horizon.
  const bg = new P.Graphics();
  if (GRID) {
    // A board, not a landscape: no horizon, because nothing here is standing
    // anywhere. Faint rules instead, so the ranks read as ranks.
    bg.beginFill(sceneGrid()).drawRect(0, 0, Math.max(worldW, app.screen.width), H()).endFill();
  } else {
    /*  Floored to the panel, exactly as the grid already was. The world is
        sized to the places in it, so an empty pile — or one where nothing is
        geocoded yet — collapsed the street to a 140px sliver at the far left
        and left the rest of the panel blank. There should always be somewhere
        to stand, even before anybody does. */
    const bgW = Math.max(worldW, app.screen.width);
    bg.beginFill(sceneSky()).drawRect(0, 0, bgW, H() * GROUND).endFill();
    bg.beginFill(sceneGround()).drawRect(0, H() * GROUND, bgW, H()).endFill();
    bg.beginFill(sceneEdge()).drawRect(0, H() * GROUND, bgW, 2).endFill();
  }
  world.addChild(bg);

  /*  The scenery. One Graphics for the lot, in behind everything else the
      street draws — see SCENERY for what is in it and how to add to it. */
  if (!GRID) {
    const streetW = Math.max(worldW, app.screen.width);
    const skin = new P.Graphics();
    for (const piece of SCENERY) {
      if (!piece.on) continue;
      piece.draw(skin, {
        P, Z, H: H(), width: streetW, ground: H() * GROUND,
        sky: sceneSky(),
        tint: amount => mixInt(sceneSky(),
                               lumOf(sceneSky()) > 0.5 ? 0x000000 : 0xffffff, amount),
        rnd: sceneryRnd(piece.id, streetW),
      });
    }
    world.addChild(skin);
  }

  /*  Column gradients: the SKY above that column, not the ground.

      The ground is the plane everybody stands on and it runs the length of the
      street — coloring one stretch of it would cut the floor into pieces and
      make the figures look like they were standing on different surfaces. The
      sky is backdrop, and backdrop is what this is for.

      Nothing at all for a place you have not colored. */
  if (!GRID) {
    for (const [slug] of placed) {
      const tint = COLUMN_TINT.get(slug);
      if (!tint) continue;
      const w = wOf.get(slug) || STEP;
      const spr = new P.Sprite(gradientTexture(P, tint.from, tint.to));
      spr.x = xOf.get(slug) - w / 2;
      spr.y = 0;
      spr.width = w;
      spr.height = H() * GROUND;      // stops at the horizon
      // Opacity on the whole ramp, so a backdrop can sit under the sky rather
      // than replacing it.
      spr.alpha = tint.alpha === undefined ? 1 : tint.alpha;
      world.addChild(spr);
    }
  }

  /*  Where scene art goes in: above the ground and above the column gradients,
      below everything added after this point.

      Scene art used to be inserted at index 1 — above the ground, which was the
      whole of the stack when that line was written. Once columns could be
      tinted, index 1 was underneath the gradients, so a colored column washed
      its own building out. A gradient is sky; a building stands in front of
      the sky. */
  const ART_FLOOR = world.children.length;

  const label = (text, size, color) => new P.Text(text, {
    fontFamily: "ui-monospace, Menlo, monospace", fontSize: size, fill: color,
  });

  /*  How tall this column's picture stands above the ground line, or null when
      there is no picture — or there is one and it has not arrived yet.

      Exactly the arithmetic the scene art itself uses to size and place the
      sprite, and deliberately not a second copy of it: if the two ever
      disagreed, the ribbon would hang somewhere the roof is not. */
  const sceneArtTop = slug => {
    if (!slug) return null;
    const got = sceneImage(slug);
    if (!got || got instanceof Promise) return null;
    const sc = Math.min(1, ((wOf.get(slug) || STEP) - 8 * Z) / (got.width || 1)) * Z;
    return (got.height || 0) * sc;
  };

  /*  Each signpost is one container, so a highlight can dim it with a single
      alpha rather than hunting down its post, board and text separately. */
  /*  The columns: one per place that can be drawn, plus one at the end for
      people no record places. Dropping a figure anywhere in a column puts them
      in that column — the x you released at only decides which. */
  // Only real places are columns now — the unplaced live in the pen, which is
  // not part of the street at all.
  const columns = placed.map(([slug]) => ({ slug, x: xOf.get(slug) }));
  /*  Nearest column to an x, or null when there are none.

      A pile whose places carry no coordinates has no columns at all — the
      ordinary state before a gazetteer is loaded. Returning columns[0].slug
      blind threw on the first pointer move of any drag. */
  host._columnAt = px => {
    if (!columns.length) return null;
    let best = columns[0], bestD = Infinity;
    for (const c of columns) {
      const d = Math.abs(c.x - px);
      if (d < bestD) { bestD = d; best = c; }
    }
    return best.slug;
  };
  /*  Null when that place is gone. Falling back to unknownX put the person
      off the end of the street with no signpost and no drop zone, looking
      placed while belonging to nothing. */
  const columnX = slug => {
    const c = columns.find(k => k.slug === slug);
    return c ? c.x : null;
  };
  host._columnX = columnX;

  /*  The drop zones: one dotted frame per column, the full height of the
      scene, so it is obvious both that you may drop somebody here and exactly
      how far "here" reaches. Invisible until you pick somebody up — a scene
      permanently ruled into columns would read as a chart.

      Pixi has no dashed stroke, so the dashes are drawn: short segments with
      gaps, which is also the only way to keep the dash length constant when
      the columns are wider at 3×. */
  const zoneLayer = new P.Container();
  zoneLayer.visible = false;
  world.addChild(zoneLayer);
  host._zoneLayer = zoneLayer;
  host._zones = [];
  /*  Built on demand, not on every render.

      Fifty-nine dotted frames is seven thousand line segments, and they are
      invisible except during the second or two you are actually holding
      somebody. Building them with the scene cost 30ms on every drop, sort and
      zoom — two dropped frames, exactly when you would feel it. Now they are
      made the first time you pick a person up and left alone after that.

      `visible = false` rather than `alpha = 0`, because a transparent layer is
      still submitted to the renderer every frame; an invisible one is not. */
  host._buildZones = () => {
    if (host._zones.length || GRID) return;
    const dash = 5, gap = 4;
    const top = 6, bot = H() - 6;
    for (const c of columns) {
      const g = new P.Graphics();
      const half = (wOf.get(c.slug) || STEP) / 2 - 3;
      g.lineStyle(1, 0x33ff33, 0.9);
      for (const x of [c.x - half, c.x + half]) {
        for (let y = top; y < bot; y += dash + gap) {
          g.moveTo(x, y); g.lineTo(x, Math.min(y + dash, bot));
        }
      }
      for (const y of [top, bot]) {
        for (let x = c.x - half; x < c.x + half; x += dash + gap) {
          g.moveTo(x, y); g.lineTo(Math.min(x + dash, c.x + half), y);
        }
      }
      g.alpha = 0.45;
      zoneLayer.addChild(g);
      host._zones.push({ slug: c.slug, g, x: c.x });
    }
  };

  /*  Scene art, found rather than configured.

      A place gets a picture if a picture exists with its uid as the filename:
