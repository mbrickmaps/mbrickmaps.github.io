  latIn.addEventListener("paste", handler);
  lngIn.addEventListener("paste", handler);
}

function renderGazetteerPanel(body) {   // built once, refreshed on every update()
  if (!body.dataset.built) {
    body.dataset.built = "1";

    const newName = body.querySelector('[data-el="newname"]');
    const newLat = body.querySelector('[data-el="newlat"]');
    const newLng = body.querySelector('[data-el="newlng"]');

    const addPlace = () => {
      const name = newName.value.trim();
      if (!name) { newName.focus(); return; }
      const uid = slugify(name);
      if (!uid) return;

      // Only a declared PLACE with this uid counts as "already exists" here —
      // a clash with some other kind is still worth attempting, so the usual
      // uid-uniqueness error surfaces in Red Flags rather than being hidden.
      const isNewPlace = !state.model.entities.some(e => e.slug === uid && e.declared && e.kind === "place");
      if (isNewPlace) {
        state.text = state.text.replace(/\s*$/, "") + "\n" + "-|📍|<" + uid + ">|" + name;
        saveText();
      }
      const lat = parseFloat(newLat.value), lng = parseFloat(newLng.value);
      if (isFinite(lat) && isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180) {
        GAZETTEER.set(uid, { lat, lng });
        saveGazetteer();
      }
      update();
      newName.value = ""; newLat.value = ""; newLng.value = "";
      newName.focus();
    };
    body.querySelector('[data-act="add"]').onclick = addPlace;
    [newName, newLat, newLng].forEach(inp =>
      inp.addEventListener("keydown", e => { if (e.key === "Enter") addPlace(); }));

    // No click needed once there is enough to act on: a name plus a complete,
    // valid coordinate pair adds the place ~0.4s after you stop typing —
    // matching how the per-row edits below now behave. Typing only a name, or
    // only coordinates, does nothing yet, so a place is never created off a
    // single character.
    let addTimer = null;
    const maybeAutoAdd = () => {
      const lat = parseFloat(newLat.value), lng = parseFloat(newLng.value);
      if (!newName.value.trim() || !isFinite(lat) || !isFinite(lng) ||
          Math.abs(lat) > 90 || Math.abs(lng) > 180) return;
      clearTimeout(addTimer);
      addTimer = setTimeout(addPlace, 400);
    };
    newLat.addEventListener("input", maybeAutoAdd);
    newLng.addEventListener("input", maybeAutoAdd);
    // A paste is already a complete, deliberate action, so it adds immediately
    // rather than waiting out the debounce.
    wireCoordPaste(newLat, newLng, () => { if (newName.value.trim()) addPlace(); });

    body.querySelector('[data-act="load"]').onclick = () => {
      const inp = document.createElement("input");
      inp.type = "file"; inp.accept = ".csv"; inp.multiple = true;
      inp.onchange = () => {
        const files = [...(inp.files || [])];
        Promise.all(files.map(f => f.text()))
          .then(texts => {
            const added = texts.reduce((n, t) => n + mergeGazetteerFile(t), 0);
            if (added) { update(); showMergeLog(added + " gazetteer row" + (added === 1 ? "" : "s") + " loaded"); }
          });
      };
      inp.click();
    };
    body.querySelector('[data-act="export"]').onclick = () => {
      const rows = ["uid,lat,lng,label,icon"];
      for (const [uid, c] of [...GAZETTEER.entries()].sort((a, b) => a[0].localeCompare(b[0]))) {
        rows.push(uid + "," + c.lat + "," + c.lng + "," +
                  (LABEL_POS.get(uid) || "") + "," + (MARKER_ICON.get(uid) || ""));
      }
      const blob = new Blob([rows.join("\n") + "\n"], { type: "text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "gazetteer.csv";
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };
    body.querySelector('[data-act="clear"]').onclick = () => {
      if (!GAZETTEER.size) return;
      if (!confirm("Forget all " + GAZETTEER.size + " loaded gazetteer entries? Places using them lose their coordinates.")) return;
      GAZETTEER.clear();
      LABEL_POS.clear();
      MARKER_ICON.clear();
      saveGazetteer();
      update();
    };

  }
  renderGazetteerList(body);
}

/*  The list is built from your declared PLACES, not from the CSV — the CSV is
    just where numbers happen to be stored. Every declared place gets a row,
    named, with its lat/lng editable right there; a brick's own inline
    coordinates still win if it has any (that row is read-only, since editing
    it here would silently disagree with the brick). Any gazetteer entry that
    matches no declared place is listed underneath as unclaimed. */
function renderGazetteerList(body) {
  /*  Uses the one global search rather than a box of its own — a second search
      field that filtered only this list was another thing to notice, keep in
      sync, and wonder why it disagreed with everything else on the board. */
  const q = (state.filter.text || "").trim().toLowerCase();
  const list = body.querySelector('[data-el="list"]');
  const all = state.model || { entities: [] };

  const places = all.entities.filter(e => e.kind === "place" && e.declared);
  const claimed = new Set(places.map(e => e.slug));
  const orphans = [...GAZETTEER.keys()].filter(uid => !claimed.has(uid));

  const matches = e => !q || e.slug.includes(q) || e.name.toLowerCase().includes(q);
  const placeRows = places.filter(matches).sort((a, b) => a.name.localeCompare(b.name));
  const orphanRows = orphans.filter(uid => !q || uid.includes(q)).sort();

  const fromBrick = places.filter(e => e.coordsFrom === "brick").length;
  const fromGaz = places.filter(e => e.coordsFrom === "gazetteer").length;
  const none = places.length - fromBrick - fromGaz;
  const searchNote = q ? ' · matching "' + q + '"' : "";
  body.querySelector('[data-el="summary"]').textContent =
    places.length
      ? places.length + " place" + (places.length === 1 ? "" : "s") + " · " + fromGaz + " set here" +
        (fromBrick ? " · " + fromBrick + " fixed in a brick" : "") +
        (none ? " · " + none + " with no coordinates" : "") + searchNote
      : "No places declared yet.";

  list.innerHTML = "";
  if (!placeRows.length && !orphanRows.length) {
    list.innerHTML = '<div class="file-empty">' + (q ? "No match." : "No places declared yet.") + "</div>";
    return;
  }

  for (const e of placeRows) {
    const locked = e.coordsFrom === "brick";
    const row = document.createElement("div");
    row.className = "gaz-row" + (locked ? " locked" : "");
    row.title = locked ? "coordinates are fixed in the brick itself (line " + e.declaredAt + ") — edit the brick to change them" : "";

    const name = document.createElement("span");
    name.className = "gaz-name";
    name.textContent = e.name;
    name.onclick = () => focusEntity(e.slug);
    name.title = "click to focus <" + e.slug + ">";
    row.appendChild(name);

    const latIn = document.createElement("input");
    latIn.type = "number"; latIn.step = "any"; latIn.placeholder = "lat";
    latIn.value = e.coords ? e.coords.lat : "";
    latIn.disabled = locked;

    const lngIn = document.createElement("input");
    lngIn.type = "number"; lngIn.step = "any"; lngIn.placeholder = "lng";
    lngIn.value = e.coords ? e.coords.lng : "";
    lngIn.disabled = locked;

    const commit = () => {
      const lat = parseFloat(latIn.value), lng = parseFloat(lngIn.value);
      if (isFinite(lat) && isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180) {
        GAZETTEER.set(e.slug, { lat, lng });
      } else if (!latIn.value && !lngIn.value) {
        GAZETTEER.delete(e.slug);
      } else {
        return;   // half-typed or out of range: leave the map alone until it is valid
      }
      saveGazetteer();
      update();     // rebuilds the model, which re-renders this panel too
    };
    // "change" alone meant nothing happened until you clicked away from the
    // field — indistinguishable from broken. Debounced "input" commits ~0.4s
    // after you stop typing, without needing a blur; "change" stays as an
    // immediate backstop (spinner clicks, Enter, real blur). A plain re-render
    // on every keystroke would kick focus out of the field mid-type, so the
    // debounce is what makes typing continuously into it possible at all.
    let commitTimer = null;
    const commitSoon = () => { clearTimeout(commitTimer); commitTimer = setTimeout(commit, 400); };
    latIn.addEventListener("input", commitSoon);
    lngIn.addEventListener("input", commitSoon);
    latIn.addEventListener("change", commit);
    lngIn.addEventListener("change", commit);
    // Pasting "56.4629, -2.9715" (Google Maps' copy-coordinates format) into
    // either field fills both and commits immediately — setting .value in JS
    // does not fire "change" on its own, so the paste handler commits directly.
    wireCoordPaste(latIn, lngIn, commit);

    /*  Per-place label position. Empty is "auto", and auto is the default —
        the map tries the eight positions and keeps the first that does not
        collide. Choosing a side here opts OUT of that: it is honoured or the
        label is dropped, never quietly moved somewhere else. */
    const labelSel = document.createElement("select");
    labelSel.className = "gaz-label";
    labelSel.title = "where this place's label sits";
    for (const [val, text] of [["", "auto"], ["bottom", "bottom"], ["top", "top"],
                               ["right", "right"], ["left", "left"],
                               ["topright", "top right"], ["topleft", "top left"],
                               ["bottomright", "bottom right"], ["bottomleft", "bottom left"],
                               ["none", "hidden"]]) {
      const o = document.createElement("option");
      o.value = val; o.textContent = text;
      labelSel.appendChild(o);
    }
    labelSel.value = LABEL_POS.get(e.slug) || "";
    labelSel.onchange = () => {
      if (labelSel.value) LABEL_POS.set(e.slug, labelSel.value);
      else LABEL_POS.delete(e.slug);
      saveGazetteer();
      update();
    };

    // Any single emoji or character. Kept short deliberately — this is a map
    // mark, not a caption; the name already has its own label.
    const iconIn = document.createElement("input");
    iconIn.type = "text";
    iconIn.className = "gaz-icon";
    iconIn.maxLength = 4;
    iconIn.placeholder = "•";
    iconIn.title = "marker icon — any emoji, blank for the plain dot";
    iconIn.value = MARKER_ICON.get(e.slug) || "";
    const commitIcon = () => {
      const v = iconIn.value.trim();
      if (v) MARKER_ICON.set(e.slug, v.slice(0, 4));
      else MARKER_ICON.delete(e.slug);
      saveGazetteer();
      update();
    };
    iconIn.addEventListener("change", commitIcon);

    row.append(latIn, lngIn, iconIn, labelSel);
    list.appendChild(row);
  }

  if (orphanRows.length) {
    const head = document.createElement("div");
    head.className = "gaz-sub";
    head.textContent = "not used by any declared place";
    list.appendChild(head);
    for (const uid of orphanRows) {
      const c = GAZETTEER.get(uid);
      const row = document.createElement("div");
      row.className = "gaz-row orphan";
      row.title = "in the gazetteer, but no place brick declares <" + uid + ">";
      row.innerHTML = '<span class="gaz-name">' + esc(uid) + '</span><span class="gaz-static">' +
        c.lat.toFixed(4) + ", " + c.lng.toFixed(4) + "</span>";
      list.appendChild(row);
    }
  }
}


/* ---------- brick builder ----------
   A way INTO the notation, not a replacement for it: every change shows the
   exact line it will write, and the line goes into the same pallet text that
   everything else reads. Nothing here is a separate data store. */
// Draft by default. A new brick is a claim you have just typed, not one you
// have checked — defaulting to "+" quietly marks everything verified.
const builder = { type: "person", status: "-", editing: null, values: {} };

// Which fields each type offers, in the order they appear in the line.
function fieldsFor(type) {
  if (type === "comment") return [
    { key: "name", label: "heading or note", ph: "LONGFORGAN",
      sub: "becomes a '#' line, and a grouping chip in Filter" },
  ];
  const kind = TYPES[type].kind;
  if (kind === "person") return [
    { key: "alias", label: "uid (alias)", kind: "alias", ph: "George Isles",
      sub: "type it however you like — it becomes kebab-case in the line" },
    { key: "detail", label: "description / occupation", ph: "Powerloom Tender" },
    { key: "links", label: "links", kind: "links", ph: "birth-cert-1869" },
  ];
  if (kind === "place") return [
    { key: "alias", label: "uid (alias)", kind: "alias", ph: "Longforgan",
      sub: "type it however you like — it becomes kebab-case in the line" },
    { key: "name", label: "name", ph: "Longforgan" },
    { key: "detail", label: "description", ph: "Village west of Dundee" },
    { key: "coords", label: "coordinates", ph: "56.4647, -3.1200",
      sub: "optional — leave blank to use a gazetteer.csv entry for this uid" },
    { key: "links", label: "links", kind: "links", ph: "census-1891" },
  ];
  if (kind === "event") return [
    { key: "date", label: "date", ph: "1894-06-29", sub: "???? if the question was asked and not answered" },
    { key: "links", label: "participants", kind: "links", ph: "george,margaret-kinnear" },
  ];
  if (kind === "document") return [
    // A document without a uid cannot be cited, and an uncitable source is no
    // source at all — so it comes first, like it does for a person.
    { key: "alias", label: "uid (alias)", kind: "alias", ph: "census 1891 longforgan",
      sub: "how claims will cite this source" },
    { key: "subtype", label: "subtype", ph: "census, or an emoji like 👶" },
    { key: "date", label: "date", ph: "1891" },
    /*  Three different things, deliberately three fields.

        SOURCE is the record — it exists whether or not anything digital does,
        and it is what you would write in a footnote. IMAGE is a surrogate of
        it. URL is where you happened to reach a copy, and pointers rot. Losing
        the URL should never lose the citation. */
    { key: "detail", label: "source", ph: "1891 Census of Scotland, Longforgan, ED 4, p17 line 3",
      sub: "the record itself — what you would write in a footnote" },
    { key: "src", label: "image", ph: "images/1891-longforgan-p17.jpg",
      sub: "a scan of it — a surrogate, not the record" },
    { key: "url", label: "url", ph: "https://scotlandspeople.gov.uk/…",
      sub: "where you reached a copy — optional, and the first thing to go stale" },
    { key: "links", label: "links", kind: "links", ph: "george,margaret" },
  ];
  return [   // census
    { key: "date", label: "year", ph: "1891" },
    { key: "name", label: "forename", ph: "George" },
    { key: "detail", label: "age", ph: "22 ~1869", sub: "keep your working — '22 1891-22 ~1869' is kept verbatim" },
    // Without this a census row attaches to nobody, and census rows are the
    // bulk of the evidence. The forename is what the enumerator wrote; the link
    // is who you think it was — deliberately two different fields.
    { key: "links", label: "who this is", kind: "links", ph: "George Isles",
      sub: "leave empty until you know — an unattached row is an honest one" },
  ];
}

// Assembles the line. Trailing empty fields are dropped rather than written as
// bare pipes, so the builder produces the same shape a person would type.
function builderLine() {
  const v = builder.values;
  // A comment is the one line with no status and no pipes.
  if (builder.type === "comment") return "# " + (v.name || "").replace(/^#+\s*/, "");
  const icon = TYPES[builder.type].icon;
  const kind = TYPES[builder.type].kind;
  const parts = [builder.status, icon];
  // Links name uids too, so they get the same treatment.
  const links = (v.links || "").split(",")
    .map(x => slugify(x.trim().replace(/^@/, ""))).filter(Boolean);
  const linkField = links.length ? "@" + links.join(",") : "";

  if (kind === "person") {
    const num = (v.num || "").trim();
    parts.push((num ? "<" + num + ">" : "") + "<" + slugify(v.alias || "") + ">",
               v.detail || "", linkField);
  } else if (kind === "place") {
    parts.push("<" + slugify(v.alias || "") + ">", v.name || "", v.detail || "",
               (v.coords || "").trim(), linkField);
  } else if (kind === "event") {
    parts.push(v.date || "", linkField);
  } else if (kind === "document") {
    // Only emit the uid if there is one — an empty <> would declare a nameless
    // source rather than an unnamed one.
    const uid = slugify(v.alias || "");
    if (uid) parts.push("<" + uid + ">");
    parts.push(v.subtype || "", v.date || "", v.detail || "", v.src || "", v.url || "", linkField);
  } else {
    // Census: year, the forename as written, the age blob, then who you think
    // it was. The link is a separate claim from the transcription.
    parts.push(v.date || "", v.name || "", v.detail || "", linkField);
  }
  while (parts.length > 2 && !parts[parts.length - 1]) parts.pop();
  return parts.join("|");
}

// Reverse: an existing brick back into the form, so a line can be corrected
// rather than retyped.
function loadBrickIntoBuilder(lineNumber) {
  const b = state.model.bricks.find(x => x.lineNumber === lineNumber);
  if (!b || b.empty || !b.valid) return;
  if (b.comment) {
    builder.type = "comment";
    builder.editing = lineNumber;
    builder.values = { name: b.name };
    const p0 = document.getElementById("builder");
    if (!p0 || !p0.closest(".board-tile")) Brick.place("builder");
    refreshPanel("builder");
    renderClassification(document.querySelector('#classification [data-el="lines"]'));
    return;
  }
  builder.type = b.type;
  builder.status = b.status === "verified" ? "+" : "-";
  builder.editing = lineNumber;
  const v = builder.values = {};
  v.links = b.links.join(",");
  v.date = b.date || "";
  if (b.alias) { v.alias = b.alias.slug; v.num = b.alias.num !== null && b.alias.num !== undefined ? String(b.alias.num) : ""; }
  const kind = b.kind;
  if (kind === "person") v.detail = b.detail || "";
  else if (kind === "place") {
    v.name = b.text[0] || ""; v.detail = b.text[1] || "";
    v.coords = b.coords ? b.coords.lat + ", " + b.coords.lng : "";
  }
  else if (kind === "document") {
    v.subtype = b.subtype || ""; v.detail = b.text[0] || "";
    v.src = b.src || ""; v.url = b.url || "";
  }
  else if (kind === "census") { v.name = b.name || ""; v.detail = b.text[0] || ""; }

  const panel = document.getElementById("builder");
  if (!panel || !panel.closest(".board-tile")) Brick.place("builder");
  refreshPanel("builder");
  const p = document.getElementById("builder");
  if (p) p.scrollIntoView({ block: "nearest" });
  renderClassification(document.querySelector('#classification [data-el="lines"]'));
}

function commitBuilder() {
  const line = builderLine();
  const lines = state.text.split("\n");
  if (builder.editing !== null && lines[builder.editing - 1] !== undefined) {
    lines[builder.editing - 1] = line;
    state.text = lines.join("\n");
    builder.editing = null;
  } else {
    // Appended to the end of the pile. A brick is added to the pile, not
    // inserted into a structure — that is the whole premise.
    state.text = state.text.replace(/\s*$/, "") + "\n" + line;
  }
  builder.values = {};
  saveText();
  update();
  refreshPanel("pallet");
}

function renderBuilder(body) {
  // Built once. Re-rendering the whole form on every keystroke elsewhere would
  // blow away whatever is half-typed in it.
  if (!body.dataset.built) {
    body.dataset.built = "1";

    const st = body.querySelector('[data-el="status"]');
    st.innerHTML = '<button data-st="+" title="verified">+ verified</button>' +
                   '<button data-st="-" title="draft / unverified">− draft</button>';
    st.querySelectorAll("button").forEach(b => b.onclick = () => {
      builder.status = b.dataset.st; renderBuilderState(body);
    });

    const ty = body.querySelector('[data-el="type"]');
    // Comment is not in TYPES — it has no status and no fields — but it is a
    // line you write constantly, and your '#' headings are what the filter
    // groups by, so it needs a button like everything else.
    ty.innerHTML = Object.keys(TYPES).map(k =>
      '<button data-ty="' + k + '" title="' + esc(TYPES[k].label) + '">' + TYPES[k].icon + "</button>").join("") +
      '<button data-ty="comment" title="a # heading or note — this is what the filter groups by">💬</button>';
    ty.querySelectorAll("button").forEach(b => b.onclick = () => {
      builder.type = b.dataset.ty;
      buildBuilderFields(body);
      renderBuilderState(body);
    });

    body.querySelector('[data-act="commit"]').onclick = () => { commitBuilder(); renderBuilderState(body); };
    body.querySelector('[data-act="cancel"]').onclick = () => {
      // Leaving an edit returns to the resting state, which is draft — the
      // status of the brick you were editing must not stick to the next one.
      builder.editing = null; builder.values = {}; builder.status = "-";
      renderBuilderState(body);
      renderClassification(document.querySelector('#classification [data-el="lines"]'));
    };
    body.querySelector('[data-act="clearfields"]').onclick = () => {
      builder.values = {}; buildBuilderFields(body); renderBuilderState(body);
    };
    buildBuilderFields(body);
  }
  // The field set depends on the type, which can change via loadBrickIntoBuilder
  // as well as via the type buttons.
  // Also covers the comment pseudo-type, which is not a key of TYPES.
  if (body.dataset.fieldsFor !== builder.type) buildBuilderFields(body);
  renderBuilderState(body);
}

function buildBuilderFields(body) {
  const host = body.querySelector('[data-el="fields"]');
  body.dataset.fieldsFor = builder.type;
  const listId = "bld-aliases";
  body.querySelector('[data-el="aliases"]').id = listId;

  host.innerHTML = fieldsFor(builder.type).map(f => {
    const val = esc(builder.values[f.key] || "");
    const input = f.kind === "alias"
      ? '<div class="bld-alias-wrap">' +
          '<input data-k="alias" list="' + listId + '" placeholder="' + esc(f.ph) + '" value="' + val + '">' +
          '<input class="num" data-k="num" placeholder="no." value="' + esc(builder.values.num || "") + '" title="optional disambiguator, e.g. 4 for <4><george-isles>">' +
        "</div>"
      : '<input data-k="' + f.key + '"' + (f.kind === "links" ? ' list="' + listId + '"' : "") +
        ' placeholder="' + esc(f.ph) + '" value="' + val + '">' +
        (f.kind === "links" ? '<div class="uid-picker" data-picker="1"></div>' : "");
    return '<div class="bld-field"><label>' + esc(f.label) + (f.kind === "links" ? " (comma separated)" : "") +
      "</label>" + input + (f.sub ? '<span class="sub">' + esc(f.sub) + "</span>" : "") + "</div>";
  }).join("");

  host.querySelectorAll("input[data-k]").forEach(i => {
    i.addEventListener("input", () => {
      builder.values[i.dataset.k] = i.value;
      renderUidPicker(body);
      renderBuilderPreview(body);
    });
  });
  renderUidPicker(body);
}

function renderBuilderState(body) {
  body.querySelectorAll('[data-el="status"] button').forEach(b =>
    b.classList.toggle("active", b.dataset.st === builder.status));
  body.querySelectorAll('[data-el="type"] button').forEach(b =>
    b.classList.toggle("active", b.dataset.ty === builder.type));

  // Values can be set programmatically (editing an existing line), so push them
  // back into the inputs.
  body.querySelectorAll("input[data-k]").forEach(i => {
    const v = builder.values[i.dataset.k] || "";
    if (i.value !== v) i.value = v;
  });

  // A comment cannot be verified or draft, so the confidence row steps aside.
  const isComment = builder.type === "comment";
  body.querySelector('[data-el="status"]').style.display = isComment ? "none" : "";

  const ed = body.querySelector('[data-el="editing"]');
  ed.hidden = builder.editing === null;
  ed.textContent = builder.editing === null ? "" : "editing line " + builder.editing;
  body.querySelector('[data-act="cancel"]').hidden = builder.editing === null;
  body.querySelector('[data-act="commit"]').textContent =
    builder.editing === null ? "Add brick" : "Update line " + builder.editing;

  // Aliases already declared, offered to every alias and link field.
  const list = body.querySelector("datalist");
  if (list && state.model) {
    list.innerHTML = state.model.entities
      .map(e => '<option value="' + esc(e.slug) + '">' + esc(e.name) + "</option>").join("");
  }
  renderBuilderPreview(body);
}

function renderBuilderPreview(body) {
  const pre = body.querySelector('[data-el="preview"]');
  const line = builderLine();
  showUidClash(body);
  // Parsed with the real parser rather than trusted — if the builder can emit
  // something the parser rejects, that is a bug worth seeing immediately.
  const test = parseLine(line, 0, "");
  pre.textContent = line;
  pre.classList.toggle("draft", builder.status === "-");
  pre.classList.toggle("bad", !test.valid);
}

/*  Warn while typing, not after committing. Editing the very line that declared
    the uid is not a clash, so the check ignores the line being edited. */
/*  Every uid in the pile, as buttons. Click to attach or detach — the links
    field stays plain text, so anything typed by hand still works and the
    buttons are only a faster way to type it. */
function renderUidPicker(body) {   // rebuilt whenever the links field changes
  const host = body.querySelector("[data-picker]");
  if (!host) return;
  const chosen = new Set((builder.values.links || "").split(",")
    .map(x => slugify(x.trim().replace(/^@/, ""))).filter(Boolean));

  // Never offer the brick its own uid: a record linking to itself says nothing.
  const self = slugify(builder.values.alias || "");
  const list = state.model.entities
    .filter(e => e.slug !== self)
    .sort((a, b) => (a.declared === b.declared ? a.name.localeCompare(b.name) : (a.declared ? -1 : 1)));

  if (!list.length) { host.innerHTML = '<span class="none">No uids declared yet.</span>'; return; }
  host.innerHTML = "";
  for (const e of list) {
    const b = document.createElement("button");
    b.type = "button";
    const icon = e.kind === "place" ? "📍" : e.kind === "person" ? "👤"
               : e.kind === "document" ? "📜" : e.kind === "event" ? "🔔" : "❔";
    b.textContent = icon + " " + e.slug;
    b.title = e.declared ? e.kind + (e.detail ? " · " + e.detail : "") + " · line " + e.declaredAt
                         : "ghost — referenced " + e.refs + "×, never declared";
    if (!e.declared) b.classList.add("ghost");
    if (chosen.has(e.slug)) b.classList.add("on");
    b.onclick = () => {
      chosen.has(e.slug) ? chosen.delete(e.slug) : chosen.add(e.slug);
      builder.values.links = [...chosen].join(",");
      const input = body.querySelector('input[data-k="links"]');
      if (input) input.value = builder.values.links;
      renderUidPicker(body);
      renderBuilderPreview(body);
    };
    host.appendChild(b);
  }
}

function showUidClash(body) {   // called on every keystroke in the builder
  const box = body.querySelector('[data-el="clash"]');
  if (!box) return;
  const slug = slugify(builder.values.alias || "");
  const kind = builder.type === "comment" ? null : TYPES[builder.type].kind;
  if (!slug || (kind !== "person" && kind !== "place" && kind !== "document" && kind !== "event")) {
    box.hidden = true; return;
  }
  const e = state.model.entities.find(x => x.slug === slug && x.declared);
  if (!e || e.declaredAt === builder.editing) { box.hidden = true; return; }
  box.hidden = false;
  box.textContent = "<" + slug + "> is already declared on line " + e.declaredAt +
    " as a " + e.kind + (e.detail ? " (" + e.detail + ")" : "") +
    ". A uid must be unique — committing this makes a clash.";
}

function renderClassification(host) {
  if (!host) return;
  const rows = V().bricks;
  if (!rows.length) { host.innerHTML = '<p class="hint">Nothing on the pallet.</p>'; return; }
  host.innerHTML = rows.map(b => {
    const cls = ["ln"];
    if (b.comment) cls.push("comment");
    else if (!b.valid) cls.push("bad");
    else { cls.push("ok"); if (b.status === "draft") cls.push("draft"); }
    const tag = b.comment ? "section" : (b.valid ? (b.type || "") : "unparsed");
    const name = (!b.comment && b.name && b.name !== b.raw.trim())
      ? '<br><span class="name">&rarr; ' + esc(b.name) + (b.estimate ? " · ~" + b.estimate : "") +
        (b.links.length ? " · " + b.links.length + " link" + (b.links.length > 1 ? "s" : "") : "") + "</span>"
      : "";
    if (b.lineNumber === builder.editing) cls.push("editing");
    return '<div class="' + cls.join(" ") + '" data-line="' + b.lineNumber + '"' +
      (b.valid && !b.comment ? ' title="click to edit this line in the Brick Builder"' : "") +
      '><span class="num">' + b.lineNumber + "</span>" +
      '<span class="ico">' + b.icon + '</span><span class="body">' + esc(b.raw.trim()) + name +
      '</span><span class="tag">' + esc(tag) + "</span></div>";
  }).join("");

  // Delegated, so it survives every re-render of the list above.
  if (!host.dataset.wired) {
    host.dataset.wired = "1";
    host.addEventListener("click", e => {
      const row = e.target.closest(".ln[data-line]");
      if (row) loadBrickIntoBuilder(Number(row.dataset.line));
    });
  }
}

/*  The Bricks panel's own filter.

    Deliberately separate from state.filter: this hides chips in THIS panel and
    nothing else. The global search narrows the whole board — every panel, the
    map, the timeline — which is the wrong tool for "I just want to find a name
    in this list". Kept out of state so it can never be mistaken for the real
    filter, and so nothing else has to know it exists. */
const entLocal = { text: "", kinds: new Set() };

function renderEntities(body) {
  // Tolerates being handed either the body or the list, since the panel used
  // to pass the list directly.
  const host = body.matches && body.matches('[data-el="ents"]')
    ? body : body.querySelector('[data-el="ents"]');
  const root = host.closest(".panel-body") || body;

  const controls = root.querySelector(".ent-controls");
  if (controls && !controls.dataset.wired) {
    controls.dataset.wired = "1";
    const input = controls.querySelector('[data-el="local"]');
    input.addEventListener("input", () => {
      entLocal.text = input.value;
      renderEntities(root);          // only this panel repaints
    });
  }
  if (controls) {
    const input = controls.querySelector('[data-el="local"]');
    if (document.activeElement !== input && input.value !== entLocal.text) input.value = entLocal.text;

    /*  A toggle per kind actually present, rather than a hardcoded three.
        Entities are not only people and places — a document or an event that
        declares a uid is an entity too, and hardcoding meant those could never
        be filtered for. Ghost is listed separately because it is a state
        (never declared), not a kind. */
    const KIND_ICON = { person: "👤", place: "📍", document: "📜", event: "🔔" };
    const present = [...new Set(V().entities.filter(e => e.declared).map(e => e.kind))]
      .filter(k => KIND_ICON[k]).sort();
    const hasGhosts = V().entities.some(e => !e.declared);
    // "persons" is what naive pluralisation gives; spell the labels out.
    const KIND_LABEL = { person: "people", place: "places", document: "documents", event: "events" };
    const wanted = present.map(k => [k, KIND_ICON[k], KIND_LABEL[k] || k + "s"])
      .concat(hasGhosts ? [["ghost", "❔", "ghosts — referenced but never declared"]] : []);

    const kindsHost = controls.querySelector('[data-el="kinds"]');
    const signature = wanted.map(w => w[0]).join(",");
    if (kindsHost.dataset.sig !== signature) {
      kindsHost.dataset.sig = signature;
      kindsHost.innerHTML = "";
      for (const [k, icon, label] of wanted) {
        const btn = document.createElement("button");
        btn.dataset.kind = k;
        btn.textContent = icon;
        btn.title = "show " + label;
        btn.onclick = () => {
          entLocal.kinds.has(k) ? entLocal.kinds.delete(k) : entLocal.kinds.add(k);
          renderEntities(root);
        };
        kindsHost.appendChild(btn);
      }
      // A kind that has vanished from the pile must not keep filtering it out.
      for (const k of [...entLocal.kinds]) if (!wanted.some(w => w[0] === k)) entLocal.kinds.delete(k);
    }
    kindsHost.querySelectorAll("[data-kind]").forEach(b =>
      b.classList.toggle("on", entLocal.kinds.has(b.dataset.kind)));
  }
  renderEntityChips(host, root);
}

function renderEntityChips(host, root) {
  if (!host) return;
  const all = V().entities.slice().sort((a, b) =>
    a.declared !== b.declared ? (a.declared ? -1 : 1) : a.name.localeCompare(b.name));

  // Local visibility only — no effect on state.filter or any other panel.
  const q = entLocal.text.trim().toLowerCase();
  const kinds = entLocal.kinds;
  const ents = all.filter(e => {
    if (q && !e.slug.includes(q) && !e.name.toLowerCase().includes(q)) return false;
    if (kinds.size) {
      // "ghost" is a state, not a kind, so it is matched separately.
      const isGhost = !e.declared;
      const matches = (kinds.has("ghost") && isGhost) ||
                      (kinds.has(e.kind) && !isGhost);
      if (!matches) return false;
    }
    return true;
  });

  const note = root && root.querySelector('[data-el="entnote"]');
  if (note) {
    note.textContent = ents.length === all.length
      ? "solid verified · dashed draft · dotted ghost"
      : "showing " + ents.length + " of " + all.length + " — this panel only";
  }

  if (!all.length) { host.innerHTML = '<p class="hint">No aliases yet.</p>'; return; }
  if (!ents.length) { host.innerHTML = '<p class="hint">Nothing matches here.</p>'; return; }
  host.innerHTML = ents.map(e => {
    const cls = ["ent"];
    if (!e.declared) cls.push("ghost");
    else if (e.status === "draft") cls.push("draft");
    const icon = e.kind === "place" ? "📍" : e.kind === "person" ? "👤"
               : e.kind === "document" ? "📜" : e.kind === "event" ? "🔔" : "❔";
    const title = e.declared
      ? e.kind + (e.status === "draft" ? ", draft" : ", verified") +
        (e.detail ? " · " + e.detail : "") +
        (lifeSummary(e) ? " · " + lifeSummary(e) : "") +
        (e.coordsFrom === "gazetteer" ? " · coords from gazetteer" : "") +
        " · referenced " + e.refs + "×"
      : "ghost — referenced " + e.refs + "×, never declared";
    // Coordinates show in the tooltip only. One icon per kind — a second pin
    // emoji was not a distinction anyone could read.
    const geo = e.coords ? " · " + e.coords.lat + ", " + e.coords.lng : "";
    const on = state.filter.focus === e.slug;
    return '<span class="' + cls.join(" ") + (on ? " focused" : "") + '" data-slug="' + esc(e.slug) +
      '" title="' + esc(title + geo) + ' — click to show only records naming them">' +
      icon + " " +
      esc(e.name) + (e.refs ? '<span class="n">' + e.refs + "</span>" : "") + "</span>";
  }).join("");

  if (!host.dataset.wired) {
    host.dataset.wired = "1";
    host.addEventListener("click", ev => {
      const chip = ev.target.closest(".ent[data-slug]");
      if (chip) focusEntity(chip.dataset.slug);
    });
  }
}

function renderStats(host) {
  if (!host) return;
  const s = V().stats;
  const cells = [["bricks", s.bricks], ["verified", s.verified], ["draft", s.draft],
                 ["entities", s.entities], ["ghosts", s.ghosts], ["links", s.links],
                 ["dated", s.dated], ["estimated", s.estimated], ["geocoded", s.geocoded],
                 ["unparsed", s.unparsed]];
  host.innerHTML = cells.map(([k, v]) => {
    const color = (k === "unparsed" && v > 0) ? "var(--bad)"
                 : (k === "ghosts" && v > 0) ? "var(--ghost)"
                 : k === "draft" ? "var(--draft)" : k === "verified" ? "var(--accent)" : "inherit";
    return '<div class="stat"><div class="v" style="color:' + color + '">' + v +
           '</div><div class="k">' + k + "</div></div>";
  }).join("");
}

function renderIssues(host) {
  if (!host) return;
  const list = state.model.issues;
  if (!list.length) { host.innerHTML = '<span class="none">No red flags. Every line landed somewhere.</span>'; return; }
  host.innerHTML = list.map(i => '<div class="' + (i.level === "err" ? "err" : "warn") + '">' +
    (i.line ? "L" + String(i.line).padStart(3, "0") + " " : "···· ") + esc(i.msg) + "</div>").join("");
}

function renderReference(host) {
  if (!host) return;
  const rows = Object.keys(TYPES).map(k => {
    const toks = Object.keys(TOKENS).filter(t => TOKENS[t] === k && t !== TYPES[k].icon);
    return "<tr><td>" + TYPES[k].icon + "</td><td>" + esc(TYPES[k].label) + "</td>" +
      '<td class="mono">' + esc(toks.join("  ·  ")) + '</td><td class="mono">' + esc(exampleFor(k)) + "</td></tr>";
  }).join("");
  host.innerHTML = "<table><thead><tr><th>icon</th><th>type</th><th>also accepts</th><th>example</th></tr></thead><tbody>" +
    rows + '<tr><td>💬</td><td>comment</td><td class="mono">#</td><td class="mono"># PEOPLE</td></tr></tbody></table>' +
    '<p class="hint">Add a row to <code>TOKENS</code> in this file and the parser, the classifier, the counts and every ' +
    "panel pick it up with no other edit. That is the whole extension mechanism.</p>";
}

function exampleFor(k) {
  return {
    person: "+|👤|<charles-alexander>|Assistant Registrar",
    birth: "+|👶|1894-06-29|@george",
    marriage: "-|🔔|????|@james,margaret-kinnear",
    death: "-|⚰️|1901|@james",
    place: "-|📍|<longforgan>|Longforgan|West of Dundee",
    document: "+|📜|census|1891|@george,margaret",
    census: "-|✏️|1891|George|22 ~1869",
  }[k] || "";
}

function palletAction(act, ta) {
  if (act === "menu") {
    const panel = document.getElementById("pallet");
    const menu = panel.querySelector('[data-el="menu"]');
    menu.hidden = !menu.hidden;
    const btn = panel.querySelector('.panel-head-btn[data-act="menu"]');
    if (btn) btn.classList.toggle("on", !menu.hidden);
    return;
  }
  if (act === "sample") return setText(SAMPLE);
  if (act === "clear") {
    if (confirm("Empty the pallet? Your bricks are only stored in this browser.")) setText("");
    return;
  }
  if (act === "copy") { navigator.clipboard.writeText(state.text).catch(() => ta.select()); return; }
  if (act === "export") {
    const blob = new Blob([state.text], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    const fname = "bricks-" + new Date().toISOString().slice(0, 10) + ".txt";
    a.download = fname;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    stampExport(fname);
    return;
  }
  if (act === "import" || act === "merge") return pickFiles(act === "merge");
  if (act === "folder") return openFolder();
  if (act === "rescan") return rescanFolder();
}

/*  Reading a whole folder.

    A page cannot watch a folder — there is no filesystem access without a user
    gesture, so this is "open" and "rescan", never live sync. Three routes,
    because support differs and this file has to work from a plain file:// too:

      1. showDirectoryPicker()  — Chromium. Keeps a handle, so Rescan re-reads
         the same folder with no second prompt. Needs https or localhost.
      2. <input webkitdirectory> — everywhere else. No handle survives, so
         Rescan has to re-prompt.
      3. dropping a folder onto the Pallet — uses the same reader as (2).

    Every route ends in the same place: .txt files, sorted by name, folded in
    with mergeText, so duplicates are skipped and the order is predictable. */
let folderHandle = null;      // route 1 only
let folderName = "";

function isBrickFile(name) { return /\.txt$/i.test(name); }
// brick.json is the sidecar, not an Atlas project file — it must not appear
// in the project picker or be mistaken for a map.
function isSidecarFile(name) { return /(^|\/)brick\.json$/i.test(name); }
function isProjectFile(name) { return /\.json$/i.test(name) && !isSidecarFile(name); }
function isImageFile(name) { return /\.(jpe?g|png|gif|webp|avif|svgz?|tiff?)$/i.test(name); }

/*  Images found in the opened folder, keyed by their path within it.

    A brick says `images/birth-1894.jpg`. As an <img src> that would resolve
    against the PAGE, not against your research folder — so a local scan would
    never load. Indexing the folder's images and handing back a blob URL makes
    the same brick file work both locally and hosted, with nothing uploaded. */

/*  Gazetteer: uid -> {lat, lng}, so coordinates do not have to live inside a
    brick at all. A place brick declares identity; the gazetteer supplies
    geometry, by the same uid. A brick's own trailing "lat, lng" still wins if
    present -- the gazetteer is a fallback, not the only source. */
const GAZETTEER = new Map();   // uid -> {lat, lng}
/*  Label placement per place, kept in its own map rather than folded into the
    coordinate object: a place can have a label preference with no coordinates
    yet, or coordinates that come from its brick rather than the gazetteer, and
    mixing the two would make a half-populated coords object that the map would
    try to plot. Empty/absent means "use the map's default". */
const LABEL_POS = new Map();   // uid -> "bottom"|"top"|"right"|"left"|"none"
/*  Per-place marker glyph — any emoji or character. Empty/absent means the
    plain status dot, which stays the default because it is the only marker
    whose color still carries the verified/draft distinction. */
const MARKER_ICON = new Map();   // uid -> "⛪" etc.

function isGazetteerFile(name) { return /gazetteer.*\.csv$/i.test(name); }

function splitCsvRow(row) {
  const out = []; let cur = "", q = false;
  for (let i = 0; i < row.length; i++) {
    const c = row[i];
    if (q) { if (c === '"') { if (row[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === "," || c === ";") { out.push(cur); cur = ""; }
    else cur += c;
  }
  out.push(cur);
  return out.map(s => s.trim());
}

// Accepts "uid,lat,lng" or "name,lat,lng" (name is slugified to a uid) with or
// without a header row -- `family/locations.csv` drops in unmodified.
function parseGazetteerCSV(text) {
  const lines = String(text).split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (!lines.length) return [];
  const head = splitCsvRow(lines[0]).map(h => h.toLowerCase());
  const uidCol = head.indexOf("uid") !== -1 ? head.indexOf("uid") : head.indexOf("name");
  const latCol = head.indexOf("lat");
  const lngCol = head.indexOf("lng") !== -1 ? head.indexOf("lng")
               : head.indexOf("lon") !== -1 ? head.indexOf("lon") : head.indexOf("long");
  const labelCol = head.indexOf("label");
  const iconCol = head.indexOf("icon");
  const hasHeader = uidCol !== -1 && latCol !== -1 && lngCol !== -1;
  const c = hasHeader ? { uid: uidCol, lat: latCol, lng: lngCol, label: labelCol, icon: iconCol }
                      : { uid: 0, lat: 1, lng: 2, label: 3, icon: 4 };
  const out = [];
  for (let i = hasHeader ? 1 : 0; i < lines.length; i++) {
    const row = splitCsvRow(lines[i]);
    if (row.length < 3) continue;
    const uid = slugify(row[c.uid] || "");
    const lat = Number(row[c.lat]), lng = Number(row[c.lng]);
    if (!uid || !isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) continue;
    const label = c.label >= 0 ? (row[c.label] || "").trim().toLowerCase() : "";
    const icon = c.icon >= 0 ? (row[c.icon] || "").trim().slice(0, 4) : "";
    out.push([uid, { lat, lng }, LABEL_CHOICES.includes(label) ? label : "", icon]);
  }
  return out;
}

/*  Ordered as they appear in the dropdown, not alphabetically: the four
    cardinals first, then the corners, then hidden. A gazetteer.csv written by
    an older version only ever names one of the first four, so widening this
    list cannot invalidate a file you already have. */
const LABEL_CHOICES = ["bottom", "top", "right", "left",
                       "topright", "topleft", "bottomright", "bottomleft", "none"];

/*  Coordinates you typed are work, and work should survive a reload. Stored as
    one object holding both maps, since a label override without its coordinate
    is meaningless on its own.

    Deliberately NOT merged with a loaded gazetteer.csv on save: the CSV stays
    the portable source, this is just the working copy. Anything typed here is
    also exported by the panel's Export button, so nothing is trapped. */
function saveGazetteer() {
  try {
    localStorage.setItem(GAZETTEER_KEY, JSON.stringify({
      coords: [...GAZETTEER.entries()],
      labels: [...LABEL_POS.entries()],
      icons: [...MARKER_ICON.entries()],
    }));
  } catch (e) { /* private mode or quota: the session still works */ }
}

function loadGazetteer() {
  let raw;
  try { raw = JSON.parse(localStorage.getItem(GAZETTEER_KEY) || "null"); } catch (e) { return 0; }
  if (!raw) return 0;
  let n = 0;
  for (const [uid, c] of Array.isArray(raw.coords) ? raw.coords : []) {
    if (!uid || !c || !isFinite(c.lat) || !isFinite(c.lng)) continue;
    if (Math.abs(c.lat) > 90 || Math.abs(c.lng) > 180) continue;
    GAZETTEER.set(uid, { lat: c.lat, lng: c.lng });
    n++;
  }
  for (const [uid, pos] of Array.isArray(raw.labels) ? raw.labels : []) {
    if (uid && LABEL_CHOICES.includes(pos)) LABEL_POS.set(uid, pos);
  }
  for (const [uid, icon] of Array.isArray(raw.icons) ? raw.icons : []) {
    if (uid && typeof icon === "string" && icon) MARKER_ICON.set(uid, icon.slice(0, 4));
  }
  return n;
}

function mergeGazetteerFile(text) {
  let n = 0;
  for (const [uid, coords, label, icon] of parseGazetteerCSV(text)) {
    GAZETTEER.set(uid, coords);
    if (label) LABEL_POS.set(uid, label);
    if (icon) MARKER_ICON.set(uid, icon);
    n++;
  }
  if (n) saveGazetteer();
  return n;
}

const folderImages = new Map();   // path within the opened folder -> { file, url }

function setFolderImages(list) {
  for (const v of folderImages.values()) if (v.url) URL.revokeObjectURL(v.url);
  folderImages.clear();
  for (const f of list) folderImages.set(f.name, { file: f.file, url: "" });
  resetSceneCache();   // art is looked up by filename, and the filenames just changed
  costumeCache.clear();
  ROW_CACHE.clear();   // the sliced rows belong to sheets that are no longer the sheets
}

/*  Matching is forgiving on purpose: you should not have to write the path
    exactly as the folder happens to be nested. Exact path first, then a
    suffix match, then the bare filename. */
function resolveSrc(src) {
  const t = (src || "").trim();
  if (!t || /^(https?:|data:|blob:)/i.test(t)) return t;
  const want = t.replace(/^\.\//, "");
  let hit = folderImages.get(want);
  if (!hit) {
    const base = want.split("/").pop().toLowerCase();
    for (const [path, v] of folderImages) {
      const lower = path.toLowerCase();
      if (lower.endsWith("/" + want.toLowerCase()) || lower === want.toLowerCase() ||
          lower.split("/").pop() === base) { hit = v; break; }
    }
  }
  if (!hit) return t;                       // fall through to the page-relative URL
  if (!hit.url) hit.url = URL.createObjectURL(hit.file);
  return hit.url;
}

// Recurses into subfolders. Depth-capped: a stray symlink or a deep tree should
// not hang the page, and nobody nests a pile eight deep on purpose.
async function filesFromDirectoryHandle(dir, path, depth, out, imgs, gazCount) {
  if (depth > 8) return out;
  for await (const entry of dir.values()) {
    if (entry.kind === "file" && isGazetteerFile(entry.name)) {
      const f = await entry.getFile();
      gazCount.n += mergeGazetteerFile(await f.text());
    } else if (entry.kind === "file" && isBrickFile(entry.name)) {
      const f = await entry.getFile();
      out.push({ name: path + entry.name, text: await f.text() });
    } else if (entry.kind === "file" && isImageFile(entry.name) && imgs) {
      imgs.push({ name: path + entry.name, file: await entry.getFile() });
    } else if (entry.kind === "directory") {
      await filesFromDirectoryHandle(entry, path + entry.name + "/", depth + 1, out, imgs, gazCount);
    }
  }
  return out;
}

/*  What the last folder read turned up. Kept so the Files panel can show what
    is available rather than only what was merged — a folder read used to
    dissolve every file into one pile and forget the parts. */
let folderFiles = [];
let currentFile = "";   // which file is on the pallet, when one was opened alone

function rememberFolder(files, label) {
  folderFiles = files.filter(f => isBrickFile(f.name))
                     .sort((a, b) => a.name.localeCompare(b.name));
  folderName = label || folderName;
  refreshPanel("pallet");
}

// Open one file on its own, replacing the pallet — the pile IS the file.
function openFile(name) {
  const f = folderFiles.find(x => x.name === name);
  if (!f) return;
  currentFile = name;
  showSaved();
  setText(f.text);
  refreshPanel("pallet");
}

function mergeFile(name) {
  const f = folderFiles.find(x => x.name === name);
  if (!f) return;
  const r = mergeText(state.text, f.text, f.name);
  setText(r.text);
  showMergeLog(f.name + ": +" + r.added + (r.skipped ? " (" + r.skipped + " already here)" : ""));
}

/*  The folder's files, listed inside the Pallet rather than in a panel of their
    own — they are what the pallet is loaded FROM, so they belong to it. */
function renderFileList(body) {
  const host = body.querySelector('[data-el="files"]');
  if (!host) return;
  if (!folderFiles.length) {
    // An empty list that renders nothing is a feature nobody can find — say so
    // rather than showing a blank gap. And when the list is empty BECAUSE you
    // excluded everything, say that instead, or the way back is invisible.
    host.innerHTML = '<div class="file-empty">No folder open — <b>Folder…</b> lists its ' +
      "<code>.txt</code> piles here.</div>";
    hostedExtras(host);
    return;
  }
  host.innerHTML = "";
  for (const f of folderFiles) {
    // Counting bricks means parsing, which is cheap and tells you which files
    // are worth opening without opening them.
    const n = parse(f.text).filter(b => !b.empty && !b.comment).length;
    const row = document.createElement("div");
    row.className = "file-item" + (f.name === currentFile ? " current" : "");
    // The folder prefix is the same on every row and only steals width; the
    // full path stays in the tooltip.
    const shortName = f.name.split("/").pop();
    row.innerHTML = '<span class="nm" title="' + esc(f.name) + '">' + esc(shortName) + "</span>" +
                    '<span class="meta">' + n + "</span>";
    const open = document.createElement("button");
    open.textContent = "open"; open.title = "put this file on the pallet, replacing what is there";
    open.onclick = () => openFile(f.name);
    const merge = document.createElement("button");
    merge.textContent = "+"; merge.title = "merge this file into what is on the pallet";
    merge.onclick = () => mergeFile(f.name);
    row.append(open, merge);
    /*  Only this site's files can be dismissed, and dismissing is about the
        listing, never the file: it stays on the server, and this page stops
        fetching it. A folder you dropped is re-read from disk each time, so
        there would be nothing for a dismissal to outlive. */
    if (isHostedFile(f.name)) {
      const no = document.createElement("button");
      no.className = "x";
      no.textContent = "✕";
      no.title = "stop loading " + shortName + " from this site";
      no.onclick = () => ignoreFile(f.name);
      row.append(no);
    }
    host.appendChild(row);
  }
  hostedExtras(host);
}

/*  What the site loaded that is not a pile, and the way back from excluding it.

    The gazetteer is the other thing a hosted page reads on its own, and it is
    the easier one to miss: it merges coordinates into your gazetteer without
    appearing in any list. It gets a row of its own so that what arrived
    unasked is at least visible, and refusable on the same terms as a pile. */
function hostedExtras(host) {
  if (GAZ_ON && !IGNORED.has(GAZ_FILE)) {
    const row = document.createElement("div");
    row.className = "file-item";
    row.innerHTML = '<span class="nm" title="' + esc(GAZ_FILE) + '">gazetteer.csv</span>' +
                    '<span class="meta">coordinates</span>';
    const no = document.createElement("button");
    no.className = "x";
    no.textContent = "✕";
    no.title = "stop reading this site's coordinates on load";
    no.onclick = () => { IGNORED.add(GAZ_FILE); saveIgnored(); refreshPanel("pallet"); };
    row.append(no);
    host.appendChild(row);
  }
  if (!IGNORED.size) return;
  const back = document.createElement("div");
  back.className = "file-empty";
  back.innerHTML = IGNORED.size + " site file" + (IGNORED.size === 1 ? "" : "s") +
                   " excluded · <button class=\"lnk\">read them again</button>";
  back.querySelector("button").onclick = unignoreAll;
  host.appendChild(back);
}

/*  Project files found in the research folder.

    Collected, never auto-applied. Which map you are looking at is a decision,
    not something a folder scan should make for you — opening a folder that
    happens to contain two .json files must not silently pick one and redraw
    your map. They go in a list; you choose in the Project fold.

    Only .json is looked at, so the bricks and the gazetteer .csv are
    unaffected, and context never enters the pile either way. */
let FOLDER_PROJECTS = [];   // [{ name, text }]

/*  A brick.json in the opened folder is applied straight away — it is this
    research's own view settings, so there is nothing to choose. */
function foldSidecar(files) {
  const hit = files.find(f => isSidecarFile(f.name));
  if (!hit) return "";
  const got = applySidecar(hit.text, promenadeHost());
  if (!got) return ", brick.json is not valid JSON";
  refreshPanel("viz-promenade");
  return ", brick.json: " + got.pins + " placed, " + got.tints + " colored";
}

// The Promenade's panel body, when it is on the board.
function promenadeHost() {
  const n = document.getElementById("viz-promenade");
  return n ? n.querySelector(".panel-body") : null;
}

function foldProject(files) {
  const cands = files.filter(f => isProjectFile(f.name))
                     .sort((a, b) => a.name.localeCompare(b.name));
  FOLDER_PROJECTS = cands.map(f => ({ name: f.name, text: f.text }));
  refreshPanel("mapstyle");
  if (!cands.length) return "";
  return ", " + cands.length + " project file" + (cands.length === 1 ? "" : "s") +
         " — choose one in Map Style";
}

function useFolderProject(name) {
  const f = FOLDER_PROJECTS.find(p => p.name === name);
  MAP_PROJECT = f ? f.text : "";
  saveProject();
  const host = mapHost();
  if (host && host._buildProject) host._buildProject();
}

function foldFiles(files, label) {
  const usable = files.filter(f => isBrickFile(f.name))
                      .sort((a, b) => a.name.localeCompare(b.name));
  const projNote = foldProject(files) + foldSidecar(files);
  if (!usable.length) {
    showMergeLog("no .txt files found in " + label + projNote);
    return;
  }
  let text = state.text, added = 0, skipped = 0, touched = 0;
  for (const f of usable) {
    const r = mergeText(text, f.text, f.name);
    text = r.text; added += r.added; skipped += r.skipped;
    if (r.added) touched++;
  }
  setText(text);
  showMergeLog(label + ": " + usable.length + " file" + (usable.length > 1 ? "s" : "") +
    " read, " + added + " new brick" + (added === 1 ? "" : "s") + " from " + touched +
    " of them, " + skipped + " already here");
}

async function openFolder() {
  if (window.showDirectoryPicker) {
    try {
      const dir = await window.showDirectoryPicker({ mode: "read" });
      folderHandle = dir;
      folderName = dir.name;
      const imgs = [], gaz = { n: 0 };
      const files = await filesFromDirectoryHandle(dir, "", 0, [], imgs, gaz);
      setFolderImages(imgs);
      rememberFolder(files, folderName);
      if (gaz.n) update();
      foldFiles(files, folderName);
      showRescan(true);
      return;
    } catch (err) {
      // AbortError is the user closing the picker — not worth reporting.
      if (err && err.name === "AbortError") return;
      showMergeLog("folder picker unavailable here (" + ((err && err.name) || err) + "), falling back");
    }
  }
  // Fallback: the directory input. No handle survives it, so no Rescan.
  const inp = document.createElement("input");
  inp.type = "file";
  inp.webkitdirectory = true;
  inp.multiple = true;
  inp.onchange = () => {
    const files = [...(inp.files || [])];
    if (!files.length) return;
    const label = (files[0].webkitRelativePath || "").split("/")[0] || "folder";
    // Paths from a directory input include the chosen folder as their first
    // segment; strip it so a brick can say "images/x.jpg" rather than
    // "my-research/images/x.jpg".
    const strip = n => n.split("/").slice(1).join("/") || n;
    setFolderImages(files.filter(f => isImageFile(f.name))
      .map(f => ({ name: strip(f.webkitRelativePath || f.name), file: f })));
    Promise.all(files.filter(f => isGazetteerFile(f.name)).map(f => f.text()))
      .then(texts => { if (texts.some(t => mergeGazetteerFile(t))) update(); });
    Promise.all(files.filter(f => isBrickFile(f.name))
      .map(f => f.text().then(t => ({ name: strip(f.webkitRelativePath || f.name), text: t }))))
      .then(all => { rememberFolder(all, label); foldFiles(all, label); })
      .catch(err => showMergeLog("could not read: " + ((err && err.message) || err)));
  };
  inp.click();
}

async function rescanFolder() {
  if (!folderHandle) { showRescan(false); return openFolder(); }
  try {
    // Permission can lapse between sessions; ask again rather than failing.
    if (folderHandle.queryPermission) {
      const p = await folderHandle.queryPermission({ mode: "read" });
      if (p !== "granted" && await folderHandle.requestPermission({ mode: "read" }) !== "granted") {
        showMergeLog("permission to read " + folderName + " was declined");
        return;
      }
    }
    const imgs = [], gaz = { n: 0 };
    const files = await filesFromDirectoryHandle(folderHandle, "", 0, [], imgs, gaz);
    setFolderImages(imgs);
    rememberFolder(files, folderName);
    if (gaz.n) update();
    foldFiles(files, folderName);
  } catch (err) {
    showMergeLog("could not re-read " + folderName + ": " + ((err && err.message) || err));
  }
}

function showRescan(on) {
  const b = document.querySelector('#pallet .pallet-menu [data-act="rescan"]');
  if (b) { b.hidden = !on; b.title = "read " + folderName + " again — duplicates are skipped"; }
}

/* Dropping a folder straight onto the Pallet. webkitGetAsEntry is the only way
   to see that a dropped item is a directory at all; a plain file drop still
   works through the same path. */
/*  Hosted piles.

    Served from a static host, the .txt files sit next to this page but nothing
    can find them: fetch has to be told a name, and a static host will not list
    a directory. So `bricks/manifest.json` is the index — an array of filenames —
    and the page reads it on load. Not merged automatically: they are listed in
    the Pallet like any other folder, and you choose what to open.

    Silent on file:// and data: URLs, where fetch is blocked; there is nothing
    useful to say to someone opening the page from disk.

    ── Two switches ────────────────────────────────────────────────────────
    Per file, from the page: the ✕ on a site file's row in the Pallet drops it
    and stops it being read again — see IGNORED below.

    Wholesale, from the source: set READ_HOSTED to false and the page never
    touches bricks/ at all — no manifest, no piles, no gazetteer, nothing
    listed. Deleting the bricks/ folder from the site does the same without
    editing anything, since a missing manifest already means "no piles here."
    ──────────────────────────────────────────────────────────────────────── */
const READ_HOSTED = true;
const MANIFEST = "bricks/manifest.json";
const GAZ_FILE = "bricks/gazetteer.csv";

/*  Site files you have told to stay away, by path.

    A preference about this site rather than anything about your research, so
    it outlives Clear all the way a saved theme does: clearing the pile and
    finding the files you excluded queued up again would make the exclusion
    worthless, since a fresh project is exactly when they would reappear. */
let IGNORED = new Set();

function loadIgnored() {
  try {
    const raw = localStorage.getItem(IGNORED_KEY);
    if (raw) IGNORED = new Set(JSON.parse(raw));
  } catch (e) { IGNORED = new Set(); }
}
function saveIgnored() {
  try {
    if (IGNORED.size) localStorage.setItem(IGNORED_KEY, JSON.stringify([...IGNORED]));
    else localStorage.removeItem(IGNORED_KEY);
  } catch (e) { /* unavailable */ }
}

// Only site files can be excluded: a folder you dropped is read fresh every
// time, so there would be nothing for the exclusion to outlive.
function isHostedFile(name) { return /^bricks\//.test(name || ""); }

function ignoreFile(name) {
  IGNORED.add(name);
  saveIgnored();
  folderFiles = folderFiles.filter(f => f.name !== name);
  refreshPanel("pallet");
}

function unignoreAll() {
  IGNORED.clear();
  saveIgnored();
  refreshPanel("pallet");            // the count goes now, not when the fetch lands
  loadHostedGazetteer().then(loadHostedBricks);
}

let GAZ_ON = false;   // this site turned out to have coordinates, and they were read

async function loadHostedGazetteer() {
  if (!READ_HOSTED) return;
  if (!/^https?:$/.test(location.protocol)) return;
  if (IGNORED.has(GAZ_FILE)) return;
  try {
    const r = await fetch(GAZ_FILE, { cache: "no-cache" });
    if (!r.ok) return;
    GAZ_ON = true;
    if (mergeGazetteerFile(await r.text())) update();
    refreshPanel("pallet");   // so the row saying it happened appears
  } catch (e) { /* optional */ }
}

async function loadHostedBricks() {
  if (!READ_HOSTED) return;
  if (!/^https?:$/.test(location.protocol)) return;
  let names;
  try {
    const r = await fetch(MANIFEST, { cache: "no-cache" });
    if (!r.ok) return;
    names = await r.json();
  } catch (e) { return; }
  if (!Array.isArray(names) || !names.length) return;

  const files = [];
  for (const n of names) {
    const name = typeof n === "string" ? n : (n && n.name);
    if (!name || !isBrickFile(name)) continue;
    const path = "bricks/" + name;
    // Excluded files are not merely hidden — they are never fetched, so a file
    // you have said no to costs nothing on every load thereafter.
    if (IGNORED.has(path)) continue;
    try {
      const r = await fetch(path, { cache: "no-cache" });
      if (r.ok) files.push({ name: path, text: await r.text() });
    } catch (e) { /* one missing file must not lose the rest */ }
  }
  if (!files.length) { refreshPanel("pallet"); return; }
  rememberFolder(files, "this site");

  /*  Listed, never loaded.

      This used to merge them in whenever the pile looked untouched, which was
      convenient while the site's piles were the test data and wrong the moment
      they were not: an empty pile is also what Clear all leaves behind, so the
      piles walked back in on the reload seconds after a dialog said they had
      gone. Nothing reads its way onto the pallet on its own now — the folder
      is there in the Pallet like any folder you dropped, and you open it. */
  showMergeLog(files.length + " pile" + (files.length > 1 ? "s" : "") + " on this site — open or merge one");
}

let droppedImages = [];
let droppedGazetteerText = [];
function entryFiles(entry, path, depth, out) {
  if (depth > 8) return Promise.resolve(out);
  if (entry.isFile) {
    if (isImageFile(entry.name)) {
      return new Promise(res => entry.file(f => {
        droppedImages.push({ name: path + entry.name, file: f });
        res(out);
      }, () => res(out)));
    }
    if (isGazetteerFile(entry.name)) {
      return new Promise(res => entry.file(f => f.text()
        .then(t => { droppedGazetteerText.push(t); res(out); })
        .catch(() => res(out))));
    }
    if (!isBrickFile(entry.name)) return Promise.resolve(out);
    return new Promise(res => entry.file(f => f.text()
      .then(t => { out.push({ name: path + entry.name, text: t }); res(out); })
      .catch(() => res(out))));
  }
  if (!entry.isDirectory) return Promise.resolve(out);
  const reader = entry.createReader();
  // readEntries returns at most 100 per call, so it must be drained in a loop.
  const drain = () => new Promise(res => reader.readEntries(batch => {
    if (!batch.length) return res(out);
    Promise.all(batch.map(e => entryFiles(e, path + entry.name + "/", depth + 1, out)))
      .then(() => drain().then(res));
  }, () => res(out)));
  return drain();
}

function wireFolderDrop(panelBody) {
  const stop = e => { e.preventDefault(); e.stopPropagation(); };
  panelBody.addEventListener("dragover", e => {
    if (!e.dataTransfer || !e.dataTransfer.types.includes("Files")) return;
    stop(e);
    e.dataTransfer.dropEffect = "copy";
  });
  panelBody.addEventListener("drop", e => {
    if (!e.dataTransfer || !e.dataTransfer.types.includes("Files")) return;
    stop(e);
    const items = [...(e.dataTransfer.items || [])]
      .map(i => i.webkitGetAsEntry && i.webkitGetAsEntry())
      .filter(Boolean);
    if (!items.length) return;
    const label = items.length === 1 ? items[0].name : items.length + " items";
    // One shared collector, so every branch of the recursion appends to the
    // same list rather than to a copy that is then discarded.
    const out = [];
    droppedImages = []; droppedGazetteerText = [];
    Promise.all(items.map(en => entryFiles(en, "", 0, out)))
      .then(() => {
        setFolderImages(droppedImages);
        const gazAdded = droppedGazetteerText.reduce((n, t) => n + mergeGazetteerFile(t), 0);
        rememberFolder(out, label);
        foldFiles(out, label);
        if (gazAdded) update();
      })
      .catch(err => showMergeLog("could not read drop: " + ((err && err.message) || err)));
  });
}

/*  Merging piles.

    The premise of the notation is that a file is a pile of bricks, so several
    small piles must be able to become one without anything being rewritten.
    Merge therefore: keeps what is already here, marks where each file's bricks
    came from with a '#' provenance line, and skips any brick already present
    verbatim — the same person recorded in two piles should not become two
    entities. Comments are never treated as duplicates, since the same '# PEOPLE'
    heading legitimately appears in every file. */
function mergeText(current, incoming, sourceName) {
  const have = new Set(
    current.split("\n").map(l => l.trim()).filter(l => l && !l.startsWith("#"))
  );
  const kept = [], skipped = [];
  for (const raw of incoming.split("\n")) {
    const line = raw.trim();
    if (!line) continue;
    if (!line.startsWith("#") && have.has(line)) { skipped.push(line); continue; }
    if (!line.startsWith("#")) have.add(line);
    kept.push(raw);
  }
  // A block whose only new content is comments adds nothing but noise. Skipping
  // it is what makes Rescan idempotent: reading the same folder twice brings in
  // the bricks added since last time and nothing else.
  const newBricks = kept.filter(l => !l.trim().startsWith("#")).length;
  if (!newBricks) return { text: current, added: 0, skipped: skipped.length };
  const block = "\n\n# --- merged from " + sourceName + " ---\n" + kept.join("\n");
  return { text: current.replace(/\s*$/, "") + block, added: newBricks, skipped: skipped.length };
}

function pickFiles(merge) {
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = ".txt,text/plain";
  inp.multiple = merge;
  inp.onchange = () => {
    const files = [...(inp.files || [])];
    if (!files.length) return;
    if (!merge) {
      const r = new FileReader();
      r.onload = () => setText(String(r.result));
      r.readAsText(files[0]);
      return;
    }
    // Read every file first, then fold them in one after another, so the
    // duplicate check sees each merge's result rather than racing on the
    // original text.
    Promise.all(files.map(f => f.text().then(t => ({ name: f.name, text: t }))))
      .then(all => {
        let text = state.text, added = 0, skipped = 0;
        const report = [];
        for (const f of all) {
          const r = mergeText(text, f.text, f.name);
          text = r.text; added += r.added; skipped += r.skipped;
          report.push(f.name + ": +" + r.added + (r.skipped ? " (" + r.skipped + " already here)" : ""));
        }
        setText(text);
        showMergeLog(report.join(" · ") + " — " + added + " lines added, " + skipped + " duplicates skipped");
      })
      .catch(err => showMergeLog("could not read: " + ((err && err.message) || err)));
  };
  inp.click();
}

function showMergeLog(msg) {
  const log = document.querySelector('#pallet [data-el="mergelog"]');
  if (!log) return;
  // Lives inline in the bar now, so it empties rather than hides — hiding it
  // would collapse the bar's height and make the row jump.
  log.textContent = msg;
  log.title = msg;
  clearTimeout(showMergeLog.t);
  showMergeLog.t = setTimeout(() => { log.textContent = ""; log.title = ""; }, 9000);
}

/* --------------------------------------------------------------------------
   UPDATE — only tiles actually on the board render. An off-board panel does
   nothing at all until placed, which is the whole page-load win.
   -------------------------------------------------------------------------- */
function refreshPanel(id) {
  const def = panels.get(id);
  const node = document.getElementById(id);
  /*  Mounted anywhere the page actually shows it. This used to insist on a
      .board-tile, which was true of every panel until panels could be docked
      to an edge — and then a docked Tally sat there permanently blank, because
      nothing ever called its render. */
  if (!def || !node || !def.render) return;
  if (!node.closest(".board-tile") && !node.closest(".dock")) return;
  const body = node.querySelector(".panel-body");
  if (body) def.render(body);
}
/*  Driven off what is actually mounted, not off board.tiles. Those two can
    drift — a board restored from localStorage that predates a panel, or a tile
    added without a save — and when they did, that panel simply never received
    updates again. Reading the DOM cannot drift from the DOM. */
function refreshAll() {
  for (const node of document.querySelectorAll(".board-tile > .panel, .dock > .panel")) {
    refreshPanel(node.id);
  }
}

// Re-parsing the whole pallet on every keystroke is cheap at genealogical scale
// and removes an entire class of stale-state bug incremental parsing invites.
function update() {
  state.model = buildModel(parse(state.text));
  state.model.view = buildView(state.model);
  refreshAll();
  pushPlacesToMap();
}

/*  The map gets its data directly, not only via the panel-refresh chain.
    Markers failing to appear after typing a coordinate was the single most
    reported problem with this panel, and every cause was some link in that
    chain being skipped. This is one short, unconditional call: if a map exists
    and has its source, it receives the current places, full stop. */
function pushPlacesToMap() {
  const node = document.getElementById("viz-map");
  const host = node && node.querySelector(".panel-body");
  const map = host && host._map;
  if (!map) return;
  if (host._syncMarkers) host._syncMarkers();
}

/*  When the pile was last written to this browser.

    The autosave is silent and debounced, which is exactly why it needs
    saying: there is no Save button to press, so the only evidence that your
    typing is safe is a line telling you so. It also says when it FAILED —
    private browsing refuses localStorage, and finding that out by losing a
    morning's work is not acceptable. */
let lastSaved = null, lastSaveOk = true, saveTicker = null;
let lastExport = null;   // { name, at } — the last time this pile left the browser

function stampSave(ok) {
  lastSaved = new Date();
  lastSaveOk = ok;
  showSaved();
  // Re-render the relative time while you sit there, so "just now" does not
  // still say "just now" ten minutes later.
  if (!saveTicker) saveTicker = setInterval(showSaved, 30000);
}
function stampExport(name) {
  lastExport = { name, at: new Date() };
  showSaved();
  if (!saveTicker) saveTicker = setInterval(showSaved, 30000);
}

function ago(then) {
  const secs = Math.round((Date.now() - then) / 1000);
  return secs < 45 ? "just now"
    : secs < 5400 ? Math.round(secs / 60) + " min ago"
    : then.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

/*  Three different questions, answered in one line:

      where this pile came from   — a file you opened, or the browser
      when it was last autosaved  — to localStorage, silently
      when it last left           — exported to a real file on disk

    They are genuinely different guarantees. localStorage is this browser on
    this machine and nothing else; a clear-site-data wipes it. Only the export
    is a file you own. Saying just "saved" would blur the two, and the whole
    point of the line is to be honest about which one you have. */
function showSaved() {
  const box = el("saveState");
  if (!box) return;
  const parts = [];

  if (currentFile) parts.push(currentFile.split("/").pop());
  else if (folderName) parts.push(folderName);

  if (!lastSaveOk) {
    box.className = "save-state bad";
    box.hidden = false;
    box.textContent = (parts.length ? parts[0] + " · " : "") +
      "not saved — this browser is refusing storage, use Export";
    return;
  }
  // Unsaved work is the one thing that must not be quiet.
  if (!AUTOSAVE && dirty) {
    box.className = "save-state bad";
    box.hidden = false;
    box.textContent = (parts.length ? parts[0] + " · " : "") + "unsaved changes";
    return;
  }
  // "in browser" every time, because that is the fact people get wrong: this
  // is not a file, and it does not follow you to another machine.
  if (!AUTOSAVE) parts.push(lastSaved ? "saved in browser " + ago(lastSaved) : "autosave off");
  else if (lastSaved) parts.push("autosaved in browser " + ago(lastSaved));
  if (lastExport) parts.push("exported " + lastExport.name + " " + ago(lastExport.at));

  box.className = "save-state";
  box.hidden = !parts.length;
  box.textContent = parts.join(" · ");
}

/*  Autosave, and the switch that turns it off.

    Off means OFF: nothing is written until you press Save. That is a real
    choice — someone experimenting on a pile they care about should be able to
    do it without the browser quietly committing every keystroke. The status
    line says "autosave off" so an unsaved pile can never look like a saved
    one. The setting itself is remembered, since a preference you have to
    re-set every session is not a preference. */
let AUTOSAVE = true;
function loadAutosave() {
  try { AUTOSAVE = localStorage.getItem(AUTOSAVE_KEY) !== "off"; } catch (e) { AUTOSAVE = true; }
}
function saveAutosave() {
  try { localStorage.setItem(AUTOSAVE_KEY, AUTOSAVE ? "on" : "off"); } catch (e) { /* unavailable */ }
}

function writePile() {
  try { localStorage.setItem(TEXT_KEY, state.text); stampSave(true); return true; }
  catch (e) { stampSave(false); return false; }
}

let saveTimer = null, dirty = false;
function saveText() {
  if (!AUTOSAVE) { dirty = true; showSaved(); return; }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { dirty = false; writePile(); }, 400);
}
function setText(t) { state.text = t; saveText(); update(); }

/*  Top-bar search.

    two are one search with two ways in rather than two searches. Kept in sync
    on both sides: this one is not a panel, so refreshAll() never redraws it,
    and the panel's box is redrawn constantly — each therefore updates the
    other, skipping whichever currently has focus so neither fights your typing. */
const topSearch = el("topsearch");
const topSearchInput = el("topsearchInput");

el("topsearchBtn").onclick = () => {
  const open = topSearch.classList.toggle("open");
  if (open) topSearchInput.focus();
  else if (state.filter.text) setFilter(f => { f.text = ""; });   // collapsing clears
};

topSearchInput.addEventListener("input", () => {

});

    topSearch.classList.remove("open");
    topSearchInput.blur();

});
