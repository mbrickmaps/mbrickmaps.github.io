      if (/^#[0-9a-f]{6}$/i.test(s.color)) MAP_SETTINGS.marks[k.key].color = s.color;
      if (typeof s.on === "boolean") MAP_SETTINGS.marks[k.key].on = s.on;
    }
  }
  for (const l of MAP_LAYERS) {
    const s = raw[l.key];
    if (!s || typeof s !== "object") continue;
    if (/^#[0-9a-f]{6}$/i.test(s.color)) MAP_SETTINGS[l.key].color = s.color;
    if (typeof s.on === "boolean") MAP_SETTINGS[l.key].on = s.on;
    const w = Number(s.width);
    if (w > 0 && w <= 8) MAP_SETTINGS[l.key].width = w;
    const o = Number(s.opacity);
    // Zero is a legal opacity — a layer turned all the way down is not the
    // same as one switched off, and both are worth being able to say.
    if (o >= 0 && o <= 1) MAP_SETTINGS[l.key].opacity = o;
  }
}
function saveMapSettings() {
  try { localStorage.setItem(MAPSTYLE_KEY, JSON.stringify(MAP_SETTINGS)); } catch (e) { /* unavailable */ }
}

/*  Dark, quiet, and matched to the panel it sits in. Land and ocean separate
    by value rather than hue so the points are the only saturated thing on the
    map -- the data should be the figure, the basemap the ground. */
function basemapStyle(archive) {
  const S = MAP_SETTINGS;
  const vis = k => ({ visibility: S[k].on ? "visible" : "none" });
  // A different archive, the same cartography — which is the whole point of
  // pointing this at another .pmtiles: your design, someone else's extent.
  const url = archive ? (/^pmtiles:/.test(archive) ? archive : "pmtiles://" + archive) : BASEMAP;
  return {
    version: 8,
    glyphs: "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
    sources: {
      basemap: { type: "vector", url },
      // 512px WEBP, worldwide, z0-8 — declared always, drawn only when on.
      hillshade: { type: "raster", url: HILLSHADE, tileSize: 512, maxzoom: 8 },
    },
    /*  Paint order matters more than usual here.

        The hillshade sits directly above the background, under everything
        else. The land fill therefore has to let it through — which is what
        its opacity slider is for, and why it defaults below 1. Terrain read
        THROUGH the fill rather than laid over it: the shading tints the
        color instead of greying it.

        The ocean is drawn after both, so the sea stays clean. The shading
        covers the whole globe, and a relief-shaded ocean is the giveaway of a
        hillshade dropped in without thought. */
    layers: [
      /*  Order, bottom to top: background, ocean, hillshade, land.

          The `ocean` polygon is full-extent, not sea-minus-land — so it has to
          be painted BEFORE the land or it covers the whole map and nothing
          else is visible. Learned the hard way: putting it after the land to
          keep the sea unshaded blanked the entire basemap.

          The hillshade therefore sits above the ocean and below the land,
          which is what "terrain above the background" means here, and why the
          land fill is translucent — the relief reads up through it. */
      { id: "bg", type: "background", paint: { "background-color": S.ocean.color } },
      { id: "ocean", type: "fill", source: "basemap", "source-layer": "ocean",
        layout: vis("ocean"),
        paint: { "fill-color": S.ocean.color, "fill-opacity": S.ocean.opacity } },
      { id: "land", type: "fill", source: "basemap", "source-layer": "coastline_land",
        layout: vis("land"),
        paint: { "fill-color": S.land.color, "fill-opacity": S.land.opacity } },
      { id: "hillshade", type: "raster", source: "hillshade",
        layout: vis("hillshade"),
        paint: { "raster-opacity": S.hillshade.opacity, "raster-fade-duration": 0 } },
      { id: "lakes", type: "fill", source: "basemap", "source-layer": "ne_10m_lakes",
        layout: vis("lakes"),
        paint: { "fill-color": S.lakes.color, "fill-opacity": S.lakes.opacity } },
      { id: "rivers", type: "line", source: "basemap",
        "source-layer": "ne_10m_rivers_lake_centerlines", layout: vis("rivers"),
        /*  Width comes from the data, not from one number for every river.
            Natural Earth ships `strokeweig` on each centerline — its own
            cartographer's judgment of how big that river draws — so a trunk
            river is heavier than a burn without anything here deciding which
            is which. Multiplied by a zoom ramp and then by your slider, so the
            slider scales the whole family and keeps their relative weights.

            coalesce, because a centerline with no strokeweig should still
            draw; it just draws at the default weight. */
        paint: { "line-color": S.rivers.color, "line-opacity": S.rivers.opacity,
                 /*  The interpolate has to be outermost: `zoom` is only legal
                     as the direct input to a top-level step/interpolate, so
                     the multiply lives inside each stop rather than wrapping
                     the ramp.

                     Each stop also asks the feature whether it belongs at THAT
                     zoom — min_zoom is the other half of Natural Earth's own
                     cartography, holding back the burns until the map is close
                     enough to want them. A feature below its min_zoom gets
                     width 0, and because the stops interpolate it thickens in
                     rather than snapping on. Comparing against the stop's
                     literal zoom keeps `zoom` itself out of the expression,
                     which is what makes this legal at all. */
                 "line-width": ["interpolate", ["linear"], ["zoom"],
                   3, ["*", ["to-number", ["coalesce", ["get", "strokeweig"], 0.3]], 1.5 * S.rivers.width],
                   9, ["*", ["to-number", ["coalesce", ["get", "strokeweig"], 0.3]], 6 * S.rivers.width]] } },
      { id: "admin1", type: "line", source: "basemap", "source-layer": "admin1_land",
        layout: vis("admin1"),
        paint: { "line-color": S.admin1.color, "line-opacity": S.admin1.opacity,
                 "line-width": S.admin1.width } },
      { id: "admin0", type: "line", source: "basemap", "source-layer": "admin0_land",
        layout: vis("admin0"),
        paint: { "line-color": S.admin0.color, "line-opacity": S.admin0.opacity,
                 "line-width": S.admin0.width } },
      { id: "coast", type: "line", source: "basemap", "source-layer": "coastline_land",
        layout: vis("coast"),
        paint: { "line-color": S.coast.color, "line-opacity": S.coast.opacity,
                 "line-width": ["interpolate", ["linear"], ["zoom"], 2, 0.4 * S.coast.width, 9, 1.2 * S.coast.width] } },
    ],
  };
}

/* ==========================================================================
   PROJECT FILE — context on the basemap
   --------------------------------------------------------------------------
   Reads the Atlas project format as-is: `view`, `points`, `polys`,
   `annotations`. Same three tiers, composited bottom to top — basemap style,
   then the project file, then the bricks. Context is pure reference: it never
   enters the model, never becomes an entity, and the timeline never touches
   it. Your records and your reference stay separate things.

   Supported, and the divergences from the sandbox, stated rather than
   discovered:

     view       center, zoom, lock, basemap, hide, hideFeatures, insertBelow
     points     data[] with lng/lat/name/dir/style
     polys      data[] with geometry (Polygon | LineString) or source (a URL),
                style fill/stroke/dash, and per-entry insertBelow
     annotations  straight-arrow, curved-arrow, text-area

     NOT here:  refUid, because it addresses features in YOUR tiles by uid and
                this basemap has different source layers. pattern fills, which
                need a sprite this page does not carry. hillshade and inset.
                Each is ignored rather than treated as an error, so a file that
                uses them still draws everything else.
   ========================================================================== */
/*  A tile-service key — MapTiler, Stadia, whoever.

    Kept in this browser and NEVER written into a project file. A style URL
    stores the placeholder instead:

      https://api.maptiler.com/maps/streets-v2/style.json?key={key}

    so the file you hand someone, commit, or publish alongside the bricks
    carries no credential. The substitution happens at the moment the style is
    handed to MapLibre and nowhere else. A URL that has a real key typed into
    it still works — it is just then a URL you should not share. */
let TILE_KEY = "";

function loadTileKey() {
  try { TILE_KEY = localStorage.getItem(TILEKEY_KEY) || ""; } catch (e) { TILE_KEY = ""; }
}
function saveTileKey() {
  try {
    if (TILE_KEY) localStorage.setItem(TILEKEY_KEY, TILE_KEY);
    else localStorage.removeItem(TILEKEY_KEY);
  } catch (e) { /* unavailable */ }
}
function withKey(url) {
  return typeof url === "string" ? url.replace(/\{key\}/g, encodeURIComponent(TILE_KEY)) : url;
}

/*  A hosted basemap style — MapTiler, Stadia, your own.

    Deliberately NOT part of the project file. In the Atlas model the base
    style is tier one and the project file is tier three; they are different
    decisions. A project says what to draw ON a map, not which map. Keeping it
    out also means the same context can be dropped over any basemap. */
let STYLE_URL = "";

function loadStyleUrl() {
  try { STYLE_URL = localStorage.getItem(STYLEURL_KEY) || ""; } catch (e) { STYLE_URL = ""; }
}
function saveStyleUrl() {
  try {
    if (STYLE_URL) localStorage.setItem(STYLEURL_KEY, STYLE_URL);
    else localStorage.removeItem(STYLEURL_KEY);
  } catch (e) { /* unavailable */ }
}
function hostedStyle() {
  const v = STYLE_URL.trim();
  return /^https?:\/\//i.test(v) ? withKey(v) : null;
}

let MAP_PROJECT = "";

function loadProject() {
  try { MAP_PROJECT = localStorage.getItem(MAPPROJECT_KEY) || ""; }
  catch (e) { MAP_PROJECT = ""; }
}
function saveProject() {
  try {
    if (MAP_PROJECT) localStorage.setItem(MAPPROJECT_KEY, MAP_PROJECT);
    else localStorage.removeItem(MAPPROJECT_KEY);
  } catch (e) { /* unavailable */ }
}
function projectObject() {
  const v = MAP_PROJECT.trim();
  if (!v) return null;
  try {
    const p = JSON.parse(v);
    return p && typeof p === "object" ? p : null;
  } catch (e) { return null; }
}

const DASHES = { solid: null, dashed: [2, 2], dotted: [0.6, 1.6] };
const SVGNS = "http://www.w3.org/2000/svg";

/*  An arrowhead, in the arrow's own color.

    `fill="context-stroke"` would say that in one line, but only Firefox
    implements it — everywhere else the head silently vanishes, which is why
    arrows were drawing as plain lines. So each color gets its own marker,
    made once and reused, with the fill written out explicitly.

    markerUnits="strokeWidth" ties the head's size to the line's weight, so a
    heavier arrow gets a proportionate head instead of a pin on a plank. */
function arrowMarker(svg, color) {
  const id = "ah-" + String(color).replace(/[^a-z0-9]/gi, "") || "ah-default";
  let defs = svg.querySelector("defs");
  if (!defs) { defs = document.createElementNS(SVGNS, "defs"); svg.appendChild(defs); }
  if (!defs.querySelector('marker[id="' + id + '"]')) {
    const m = document.createElementNS(SVGNS, "marker");
    m.setAttribute("id", id);
    m.setAttribute("viewBox", "0 0 10 10");
    m.setAttribute("refX", "8"); m.setAttribute("refY", "5");
    m.setAttribute("markerWidth", "5"); m.setAttribute("markerHeight", "5");
    m.setAttribute("orient", "auto-start-reverse");
    m.setAttribute("markerUnits", "strokeWidth");
    const tip = document.createElementNS(SVGNS, "path");
    tip.setAttribute("d", "M 0 0 L 10 5 L 0 10 z");
    tip.setAttribute("fill", color);
    m.appendChild(tip);
    defs.appendChild(m);
  }
  return id;
}

// A style block from the file, read defensively — a missing key is a default,
// never a crash, because a project file is hand-written.
function paintLine(s) {
  const out = { "line-color": s.stroke || "#000", "line-width": num(s["stroke-width"], 1) };
  const dash = DASHES[s["stroke-dash"]];
  if (dash) out["line-dasharray"] = dash;
  if (s.opacity !== undefined) out["line-opacity"] = num(s.opacity, 1);
  return out;
}
function num(v, d) { const n = Number(v); return isFinite(n) ? n : d; }

/*  Everything the project adds is namespaced `proj-`, so tearing it down is a
    matter of dropping anything with that prefix. setStyle wipes sources and
    layers wholesale, so this runs again on every style load rather than
    trying to survive one. */
function clearProject(map) {
  for (const l of map.getStyle().layers || []) {
    if (l.id.startsWith("proj-")) map.removeLayer(l.id);
  }
  for (const id of Object.keys(map.getStyle().sources || {})) {
    if (id.startsWith("proj-")) map.removeSource(id);
  }
}

function applyProjectLayers(map, p) {
  if (!p) return;
  const view = p.view || {};

  // view.basemap:false hides the drawn basemap but keeps the background, so
  // the ground color still comes from your style rather than going white.
  if (view.basemap === false) {
    for (const l of map.getStyle().layers || []) {
      if (l.type !== "background" && !l.id.startsWith("proj-")) {
        map.setLayoutProperty(l.id, "visibility", "none");
      }
    }
  }
  for (const id of view.hide || []) {
    if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", "none");
  }
  for (const hf of view.hideFeatures || []) {
    if (!hf || !map.getLayer(hf.layer)) continue;
    // "hide these values" is the negation of a match, which is how the
    // sandbox reads it: everything EXCEPT the listed features stays.
    map.setFilter(hf.layer, ["!", ["in", ["get", hf.property], ["literal", hf.values || []]]]);
  }

  const below = view.insertBelow || {};
  const under = (want) => (want && map.getLayer(want) ? want : undefined);

  if (p.polys && p.polys.show !== false) {
    (p.polys.data || []).forEach((entry, i) => {
      if (!entry || (!entry.geometry && !entry.source)) return;   // refUid: not here
      const id = "proj-poly-" + i;
      const data = entry.source
        ? entry.source
        : { type: "Feature", geometry: entry.geometry, properties: {} };
      map.addSource(id, { type: "geojson", data });
      const s = entry.style || {};
      const at = under(entry.insertBelow || below.polys);
      const isLine = entry.geometry && /LineString/.test(entry.geometry.type);
      if (!isLine && s.fill && s.fill !== "none") {
        map.addLayer({ id: id + "-fill", type: "fill", source: id,
          paint: { "fill-color": s.fill, "fill-opacity": num(s["fill-opacity"], 0.4) } }, at);
      }
      if (s.stroke && s.stroke !== "none") {
        map.addLayer({ id: id + "-line", type: "line", source: id,
          layout: { "line-join": s["line-join"] || "miter" },
          paint: paintLine(s) }, at);
      }
    });
  }
}

/*  Points and annotations are DOM, not style layers.

    Deliberate: the sandbox draws point labels with a symbol layer and a named
    font, and this page's glyph endpoint has two fonts in it. A DOM mark needs
    no glyph server, gets the same eight-way label placement the bricks use,
    and survives setStyle without being rebuilt. The cost is that
    view.insertBelow cannot put an annotation under a basemap layer — they are
    always above. That is the one place this diverges visibly. */
const DIR_TO_POS = {
  N: "top", S: "bottom", E: "right", W: "left",
  NE: "topright", NW: "topleft", SE: "bottomright", SW: "bottomleft",
};

/*  The escape hatch: a hand-edited style file.

    The controls cover the seven layers this basemap has. When you want
    something they cannot express, edit the style file itself and apply it —
    it then outranks both the controls and the source dropdown until cleared.
    It is an ordinary MapLibre style, the same JSON you would put in a
    style.json, and the editor starts from whatever the map is drawing now. */
let MAP_STYLE_OVERRIDE = "";

function loadStyleOverride() {
  try { MAP_STYLE_OVERRIDE = localStorage.getItem(MAPOVERRIDE_KEY) || ""; }
  catch (e) { MAP_STYLE_OVERRIDE = ""; }
}
function saveStyleOverride() {
  try {
    if (MAP_STYLE_OVERRIDE) localStorage.setItem(MAPOVERRIDE_KEY, MAP_STYLE_OVERRIDE);
    else localStorage.removeItem(MAPOVERRIDE_KEY);
  } catch (e) { /* unavailable */ }
}
/*  The parsed style, or null when there is nothing usable. Null is the signal
    to fall back to the dropdown's choice — a style file with a typo in it must
    never leave the map with nothing to draw. */
function overrideStyle() {
  const v = MAP_STYLE_OVERRIDE.trim();
  if (!v) return null;
  try {
    const s = JSON.parse(v);
    return s && typeof s === "object" && Array.isArray(s.layers) ? s : null;
  } catch (e) { return null; }
}

// Places in the current view that can actually be drawn.
function placeFeatures(model) {
  return (model.places || []).filter(p => p.coords).map(p => ({
    type: "Feature",
    geometry: { type: "Point", coordinates: [p.coords.lng, p.coords.lat] },
    properties: {
      slug: p.slug, name: p.name,
      status: p.status || "draft",
      refs: p.refs,
      detail: p.detail || "",
      labelPos: LABEL_POS.get(p.slug) || "",   // "" = follow the map default
      icon: MARKER_ICON.get(p.slug) || "",     // "" = the plain status dot
    },
  }));
}

/*  Which places are connected, and why.

    Two readings of "referenced together", both drawn:

    1. Direct — one record names both places. Rare in this corpus but the
       strongest claim, because the author wrote it down.
    2. Through a person — a census in one parish and a marriage in another,
       naming the same man. No single brick says these two places are related;
       the pile does, and that is the whole point of the notation.

    Undirected: a line between two parishes has no arrow, since the records
    give an association, never a direction of travel. Pairs are keyed on the
    sorted slugs so A-B and B-A are one line carrying a weight, not two lines
    overdrawn.

    Only places that can be drawn take part — an ungeocoded place is silently
    not a node here, exactly as it is silently not a marker. */
function placeLinks(model) {
  const coord = new Map();
  for (const p of model.places || []) {
    if (p.coords) coord.set(p.slug, [p.coords.lng, p.coords.lat]);
  }
  if (coord.size < 2) return [];

  const pairs = new Map();
  const add = (a, b, via) => {
    if (a === b) return;
    const [lo, hi] = a < b ? [a, b] : [b, a];
    const key = lo + "|" + hi;
    let e = pairs.get(key);
    if (!e) pairs.set(key, e = { a: lo, b: hi, via: new Set(), weight: 0, direct: false });
    e.weight++;
    if (via) e.via.add(via); else e.direct = true;
  };

  const reach = new Map();   // non-place uid -> places it is named alongside
  for (const b of model.records || []) {
    if (!b.valid) continue;
    const named = [b.alias ? b.alias.slug : null, ...b.links].filter(Boolean);
    const here = named.filter(s => coord.has(s));
    if (!here.length) continue;
    for (let i = 0; i < here.length; i++) {
      for (let j = i + 1; j < here.length; j++) add(here[i], here[j], null);
    }
    for (const other of named) {
      if (coord.has(other)) continue;
      let set = reach.get(other);
      if (!set) reach.set(other, set = new Set());
      for (const p of here) set.add(p);
    }
  }
  for (const [who, set] of reach) {
    const list = [...set];
    for (let i = 0; i < list.length; i++) {
      for (let j = i + 1; j < list.length; j++) add(list[i], list[j], who);
    }
  }

  return [...pairs.values()].map(e => ({
    a: e.a, b: e.b, weight: e.weight, direct: e.direct, via: [...e.via],
    from: coord.get(e.a), to: coord.get(e.b),
  }));
}

/*  Everything the map draws: the places, plus any event that names a place
    with coordinates.

    An event has no coordinates of its own — it borrows them from the place it
    names, which is the honest reading of "@george,longforgan": the record says
    this happened at Longforgan, not at some point 40 meters east of it. Two
    events at one parish therefore sit on the same point, and that is correct;
    they are the same place.

    Toggling a kind off here is a MAP decision, not a filter — the pile is
    untouched and every other panel still shows the record. */
function markFeatures(model) {
  const out = [];
  if (MAP_SETTINGS.marks.place.on) {
    for (const f of placeFeatures(model)) {
      f.properties.mark = "place";
      out.push(f);
    }
  }
  const byId = new Map((model.entities || []).map(e => [e.slug, e]));
  for (const b of model.events || []) {
    const kind = MARK_KINDS.find(k => k.key === b.type);
    if (!kind || kind.key === "place" || !MAP_SETTINGS.marks[kind.key].on) continue;
    const links = (b.links || []).map(s => byId.get(s)).filter(Boolean);
    const where = links.filter(e => e.kind === "place" && e.coords);
    if (!where.length) continue;   // a dateline with no location is not a point
    const who = links.filter(e => e.kind === "person");
    const year = b.date && /^\d{4}/.test(b.date) ? b.date.slice(0, 4) : "";
    // Named for whoever it happened to — the place already has its own label,
    // and repeating it here would just be the same word twice on one dot.
    const name = [who.map(p => p.name).join(" & "), year].filter(Boolean).join(" ") ||
                 kind.label;
    for (const p of where) {
      out.push({
        type: "Feature",
        geometry: { type: "Point", coordinates: [p.coords.lng, p.coords.lat] },
        properties: {
          mark: kind.key,
          slug: (who[0] && who[0].slug) || p.slug,
          name, status: b.status || "draft", refs: 0, detail: "",
          labelPos: "", icon: kind.glyph,
        },
      });
    }
  }
  return out;
}

function renderMap(model, host) {
  const fc = { type: "FeatureCollection", features: placeFeatures(model) };

  // Already running: just push new data in. This is the whole reason a slot
  // owns its element.
  if (host._map) {
    if (host._syncMarkers) host._syncMarkers();
    else updateMapCount(host, fc.features.length, model);
    return;
  }
  if (host._starting) return;
  host._starting = true;

  host.innerHTML = '<div class="map-shell">' +
      '<div class="map-canvas"></div>' +
      '<select class="map-source">' +
        '<option value="custom">My tiles</option>' +
        '<option value="demo">MapLibre</option>' +
      "</select>" +
      '<div class="map-where"></div>' +
      '<div class="map-note">loading basemap…</div>' +
      '<div class="map-attrib"></div>' +
    "</div>";
  const canvas = host.querySelector(".map-canvas");
  const note = host.querySelector(".map-note");

  const attribEl = host.querySelector(".map-attrib");

  const hosted = isHostedContext();
  // Always load pmtiles, not just when hosted -- the dropdown lets you TRY the
  // custom source from anywhere (e.g. picking "Your tiles" while opened from
  // file://), not only in whatever context happened to be guessed at start.
  const toLoad = [loadOnce(MAPLIBRE_CSS, true), loadOnce(MAPLIBRE_JS), loadOnce(PMTILES_JS)];

  Promise.all(toLoad)
    .then(() => {
      // One protocol registration per page, not per panel.
      if (!window.__pmtilesReady) {
        const protocol = new window.pmtiles.Protocol();
        window.maplibregl.addProtocol("pmtiles", protocol.tile);
        window.__pmtilesReady = true;
      }
      // Your last choice wins, and only falls back to the context guess when
      // you have never made one. Decided BEFORE the map is built so a
      // remembered preference is the first style loaded, not a second one
      // swapped in a frame later.
      const startMode = loadMapSource() || (hosted ? "custom" : "demo");
      const map = new window.maplibregl.Map({
        container: canvas,
        // An applied override, then a project's own basemap, then the
        // dropdown — the same order applyStyle uses, from the first frame.
        style: overrideStyle() || hostedStyle() ||
               (startMode === "demo" ? DEMO_STYLE : basemapStyle()),
        center: [-3.4, 56.4],
        zoom: 7,
        attributionControl: false,
        // Default false clears the WebGL buffer right after each paint, which
        // is invisible to the eye but means any screenshot/screen-recording
        // tool grabs a blank frame even though the map is drawing correctly.
        preserveDrawingBuffer: true,
      });
      host._map = map;
      map.addControl(new window.maplibregl.NavigationControl({ showCompass: false }), "top-right");

      // 'style.load' fires after the INITIAL style AND after any later
      // setStyle() call, so the same function adds the places layers whether
      // this is the first load or a fallback swap — one place, not two.
      //
      // Recomputed HERE rather than using the `fc` closed over when renderMap
      // was first called: script loading (MapLibre + PMTiles, ~1-2s) means an
      // edit made in the Gazetteer panel while the map is still starting hits
      // the "still starting, do nothing" branch below and would otherwise be
      // silently lost — the map would open already stale, with no further
      // update due until some unrelated later edit happened to trigger one.
      /*  DOM markers, not a GeoJSON source with circle layers.

          The source approach kept failing in ways that were slow to see: the
          data went in (`_data` held the feature) but MapLibre never tiled it,
          so `querySourceFeatures` returned 0 and nothing drew. setStyle() also
          wipes sources and layers, so every basemap switch needed them rebuilt,
          and 'style.load' does not fire reliably across quick successive swaps.

          A Marker is a plain DOM element positioned by the map. It survives
          setStyle untouched, needs no source, no tiling and no style to be
          loaded, and appears the instant it is added. For a few dozen places
          that is strictly better, and it removes the whole class of bug. */
      host._markers = [];
      // Declared ABOVE syncMarkers, which reads it — a `let` further down would
      // work on the first call and throw on every one after.
      // The default a place falls back to; per-place overrides live in the
      // Gazetteer, which is where the rest of a place's display settings are.
      const labelPlacement = "bottom";

      /*  Connections as an SVG overlay, projected from lng/lat — the same
          decision as the DOM markers, for the same reason. A GeoJSON line
          layer is wiped by every setStyle and can silently fail to tile; an
          SVG line cannot fail to draw, and re-projecting on move keeps it
          registered with the basemap under it.

          Declared ABOVE syncMarkers because syncMarkers calls it, and it runs
          once immediately — a const further down would throw on the first
          call and work on every one after, which is the worst kind of bug. */
      const linkSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      linkSvg.setAttribute("class", "map-links");
      canvas.appendChild(linkSvg);
      let linkLines = [];

      const drawLinks = () => {
        for (const l of linkLines) {
          const p = map.project(l.from), q = map.project(l.to);
          for (const el of l.els) {
            el.setAttribute("x1", p.x); el.setAttribute("y1", p.y);
            el.setAttribute("x2", q.x); el.setAttribute("y2", q.y);
          }
        }
      };
      const buildLinks = () => {
        const links = placeLinks(V());
        linkSvg.textContent = "";
        linkLines = links.map(l => {
          // Weight is how many records assert the pair, so a well-evidenced
          // connection is heavier — capped, or one busy pair drowns the rest.
          const w = Math.min(3, 1.1 + l.weight * 0.3);
          const line = cls => {
            const ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
            ln.setAttribute("class", cls);
            linkSvg.appendChild(ln);
            return ln;
          };
          // Casing first so the colored line paints on top of it.
          const casing = line("map-link-case");
          casing.setAttribute("stroke-width", (w + 2).toFixed(2));
          // Direct beats inferred: if any record names both places outright,
          // the line is drawn as the stronger of the two claims.
          const ln = line("map-link" + (l.direct ? "" : " via"));
          ln.setAttribute("stroke-width", w.toFixed(2));
          return { els: [casing, ln], from: l.from, to: l.to };
        });
        drawLinks();
        return linkLines.length;
      };
      map.on("move", drawLinks);
      map.on("resize", drawLinks);

      /*  Where you are, in the numbers a project file wants.

          Zoom to two places and the bounding box in west, south, east, north
          order — the same order `view.bbox` takes, so what you read here can
          be typed straight into a file without reshuffling it. Click it to
          copy. Six decimal places is about 10cm, which is past the accuracy of
          anything a parish register will ever give you. */
      const whereEl = host.querySelector(".map-where");
      const showWhere = () => {
        const b = map.getBounds(), c = map.getCenter();
        const f = n => n.toFixed(4);
        whereEl.dataset.bbox = "[" + [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()]
          .map(n => +n.toFixed(6)).join(", ") + "]";
        whereEl.dataset.center = "[" + [+c.lng.toFixed(6), +c.lat.toFixed(6)].join(", ") + "]";
        whereEl.textContent = "z" + map.getZoom().toFixed(2) + "  " +
          f(b.getWest()) + ", " + f(b.getSouth()) + " → " + f(b.getEast()) + ", " + f(b.getNorth());
      };
      whereEl.onclick = () => {
        const text = '"center": ' + whereEl.dataset.center +
                     ', "zoom": ' + map.getZoom().toFixed(2) +
                     ', "bbox": ' + whereEl.dataset.bbox;
        navigator.clipboard && navigator.clipboard.writeText(text);
        whereEl.classList.add("copied");
        setTimeout(() => whereEl.classList.remove("copied"), 700);
      };
      map.on("move", showWhere);
      showWhere();

      /*  Label vetting — the oldest rule in the trade: two names may not
          occupy the same ink. Greedy placement in priority order, which is
          what a hand-drawn sheet does and what every automated placer still
          falls back to.

          Priority is the map's own hierarchy, not the DOM order:
            1. verified before draft — a confirmed place outranks a guess
            2. more references before fewer — the busier the place in the
               records, the more the reader needs its name
            3. alphabetical last, purely so the outcome is STABLE. Without a
               deterministic tiebreak the same two colliding labels trade
               places every redraw and the map flickers as you pan.

          Run on settle, not per frame: 59 getBoundingClientRect calls during a
          pan would be a layout thrash for no gain, and labels holding their
          last state mid-drag is invisible to the eye. */
      const LABEL_PAD = 2;   // a hair of air, or neighbors read as one word

      /*  Where a name goes when you have not said. Imhof's order, and the same
          one every automatic placer since has used: upper right first, because
          that is where the eye arrives after reading the mark; then the other
          corners; then the sides; and the stacked positions last, since a name
          directly above or below a dot is the hardest to tie back to it when
          marks are close together. */
      const AUTO_ORDER = ["topright", "topleft", "bottomright", "bottomleft",
                          "right", "left", "top", "bottom"];

      const setPos = (dot, pos) => {
        for (const p of LABEL_CHOICES) dot.classList.remove("lbl-" + p);
        dot.classList.add("lbl-" + pos);
      };

      const declutter = () => {
        const box = canvas.getBoundingClientRect();
        const items = [];
        for (const m of host._markers) {
          const dot = m.getElement();
          const label = dot.querySelector(".map-marker-label");
          if (!label) continue;
          label.classList.remove("suppressed");
          const fixed = dot.dataset.pos || "";   // "" means: you decide
          if (fixed === "none") continue;
          if (!MAP_SETTINGS.labelVet) {
            // Nothing is being avoided, so an auto label has no reason to
            // prefer one side; it takes the map's plain default and shows.
            setPos(dot, fixed || labelPlacement);
            continue;
          }
          const d = dot.getBoundingClientRect();
          // A mark off the edge cannot collide with anything you can see, and
          // letting it claim space would suppress a label that matters.
          if (d.right < box.left || d.left > box.right ||
              d.bottom < box.top || d.top > box.bottom) continue;
          items.push({
            dot, label, fixed,
            verified: dot.classList.contains("verified") ? 1 : 0,
            refs: Number(dot.dataset.refs) || 0,
            name: dot.dataset.name || "",
          });
        }
        items.sort((a, b) => b.verified - a.verified || b.refs - a.refs ||
                             a.name.localeCompare(b.name));

        const placed = [];
        const clear = r => !placed.some(p =>
          !(r.right + LABEL_PAD < p.left || r.left - LABEL_PAD > p.right ||
            r.bottom + LABEL_PAD < p.top || r.top - LABEL_PAD > p.bottom));

        for (const it of items) {
          /*  A placement you chose is honoured or nothing — trying seven other
              sides for you would quietly overrule the choice. Only a label on
              auto gets to move. */
          const tries = it.fixed ? [it.fixed] : AUTO_ORDER;
          let done = false;
          for (const pos of tries) {
            setPos(it.dot, pos);
            // Measured rather than computed: reading the rect back after the
            // class is on cannot disagree with the CSS, and a duplicated copy
            // of those offsets in JS eventually would.
            const r = it.label.getBoundingClientRect();
            if (clear(r)) { placed.push(r); done = true; break; }
          }
          if (!done) {
            // Nowhere to put it. Put it back where it started so the hidden
            // label is at least consistent, then drop it.
            setPos(it.dot, it.fixed || AUTO_ORDER[0]);
            it.label.classList.add("suppressed");
          }
        }
      };
      host._declutter = declutter;
      map.on("moveend", declutter);
      map.on("zoomend", declutter);

      /* ---------- project file: points, annotations, view ---------- */
      const annoSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      annoSvg.setAttribute("class", "map-annos");
      canvas.appendChild(annoSvg);
      const annoLayer = document.createElement("div");
      annoLayer.className = "map-anno-text";
      canvas.appendChild(annoLayer);

      let projMarkers = [], annoItems = [];

      const drawAnnos = () => {
        for (const a of annoItems) {
          if (a.kind === "text") {
            const q = map.project(a.at);
            a.el.style.transform = "translate(" + q.x + "px," + q.y + "px)";
            continue;
          }
          const s = map.project(a.start), e = map.project(a.end);
          if (a.bend) {
            // Perpendicular offset at the midpoint — the same construction the
            // sandbox uses, so a given `bend` curves the same way here.
            const mx = (s.x + e.x) / 2, my = (s.y + e.y) / 2;
            const dx = e.x - s.x, dy = e.y - s.y;
            a.el.setAttribute("d", "M " + s.x + " " + s.y + " Q " +
              (mx - dy * a.bend) + " " + (my + dx * a.bend) + " " + e.x + " " + e.y);
          } else {
            a.el.setAttribute("d", "M " + s.x + " " + s.y + " L " + e.x + " " + e.y);
          }
        }
      };

      const buildProject = () => {
        for (const m of projMarkers) m.remove();
        projMarkers = [];
        annoItems = [];
        annoLayer.textContent = "";
        // Only the drawn lines — the arrowhead markers live in <defs> and are
        // reused, so a blanket path sweep would gut them.
        [...annoSvg.querySelectorAll("path.anno-line")].forEach(n => n.remove());

        const p = projectObject();
        if (!p) { drawAnnos(); return 0; }

        if (p.points && p.points.show !== false) {
          for (const pt of p.points.data || []) {
            if (!pt || !isFinite(pt.lng) || !isFinite(pt.lat)) continue;
            const s = pt.style || {};
            const dot = document.createElement("div");
            dot.className = "map-marker proj-point lbl-" +
                            (DIR_TO_POS[String(pt.dir || "").toUpperCase()] || "bottom");
            dot.style.setProperty("--fill", s.fill || "#ffffff");
            dot.style.setProperty("--mk", num(s.size, 7) * 2 + "px");
            if (s.stroke) dot.style.borderColor = s.stroke;
            dot.style.borderWidth = num(s["stroke-width"], 1) + "px";
            if (s.opacity !== undefined) dot.style.opacity = num(s.opacity, 1);
            if (pt.name) {
              const lab = document.createElement("span");
              lab.className = "map-marker-label";
              lab.textContent = pt.name;
              if (s["label-color"]) lab.style.color = s["label-color"];
              if (s["label-size"]) lab.style.fontSize = num(s["label-size"], 10) + "px";
              if (s["label-halo-color"]) {
                const w = num(s["label-halo-width"], 1);
                lab.style.textShadow = "0 0 " + (w * 2) + "px " + s["label-halo-color"];
              }
              dot.appendChild(lab);
            }
            // Project points are reference, not records: they are not in the
            // model, so they take no part in the label vetting that ranks
            // bricks against each other, and nothing can suppress them.
            projMarkers.push(new window.maplibregl.Marker({ element: dot })
              .setLngLat([pt.lng, pt.lat]).addTo(map));
          }
        }

        if (p.annotations && p.annotations.show !== false) {
          for (const a of p.annotations.data || []) {
            if (!a) continue;
            const s = a.style || {};
            if (a.type === "text-area" && Array.isArray(a.position)) {
              const el = document.createElement("div");
              el.className = "proj-text";
              el.textContent = a.text || "";
              if (s.fill) el.style.background = s.fill;
              if (s["fill-opacity"] !== undefined && s.fill) {
                el.style.background = s.fill;
                el.style.opacity = num(s["fill-opacity"], 1);
              }
              if (s.stroke) el.style.border = num(s["stroke-width"], 1) + "px solid " + s.stroke;
              if (s.align) el.style.textAlign = s.align;
              annoLayer.appendChild(el);
              annoItems.push({ kind: "text", el, at: a.position });
              continue;
            }
            if (!Array.isArray(a.start) || !Array.isArray(a.end)) continue;
            const path = document.createElementNS(SVGNS, "path");
            path.setAttribute("class", "anno-line");
            path.setAttribute("fill", "none");
            const col = s.stroke || "#000";
            path.setAttribute("stroke", col);
            path.setAttribute("stroke-width", num(s["stroke-width"], 2));
            const dash = DASHES[s["stroke-dash"]];
            if (dash) path.setAttribute("stroke-dasharray", dash.map(n => n * 3).join(" "));
            path.setAttribute("marker-end", "url(#" + arrowMarker(annoSvg, col) + ")");
            annoSvg.appendChild(path);
            annoItems.push({ kind: "arrow", el: path, start: a.start, end: a.end,
                             bend: a.type === "curved-arrow" ? num(a.bend, 0.25) : 0 });
          }
        }
        drawAnnos();
        return projMarkers.length + annoItems.length;
      };

      // The style is rebuilt from scratch on every setStyle, so the project's
      // sources and layers have to go back in each time; the DOM half does not.
      const reapplyProject = () => {
        const p = projectObject();
        try { clearProject(map); } catch (e) { /* style not ready */ }
        try { applyProjectLayers(map, p); } catch (e) { console.warn("project layers:", e); }
      };
      /*  A project may bring its own basemap, so changing the project can mean
          changing the style underneath it. Only reloaded when the URL actually
          differs — otherwise every color tweak in the editor would throw the
          whole basemap away and refetch it. */
      let styleShowing = hostedStyle();   // what the map opened with
      host._buildProject = () => {
        const want = hostedStyle();
        if (want !== styleShowing) {
          styleShowing = want;
          applyStyle({ silent: true });   // style.load re-adds the project layers
        } else {
          reapplyProject();
        }
        buildProject();
      };

      /*  Lets the Map Editor collect coordinates by clicking. It hands back
          its own disarm function rather than exposing the map, so the editor
          can never leave a listener behind it does not know how to remove. */
      host._armMap = fn => {
        const handler = e => fn([+e.lngLat.lng.toFixed(6), +e.lngLat.lat.toFixed(6)]);
        map.on("click", handler);
        canvas.classList.add("arming");
        return () => { map.off("click", handler); canvas.classList.remove("arming"); };
      };
      map.on("move", drawAnnos);
      map.on("resize", drawAnnos);
      map.on("style.load", reapplyProject);

      const syncMarkers = () => {
        const feats = markFeatures(V());
        for (const m of host._markers) m.remove();
        host._markers = [];
        for (const f of feats) {
          const elDot = document.createElement("div");
          const glyph = f.properties.icon;
          const mark = f.properties.mark || "place";
          elDot.className = "map-marker" + (glyph ? " as-icon" : "") +
                            " mk-" + mark +
                            (f.properties.status === "verified" ? " verified" : "");
          // Color says WHICH KIND of thing this is. Set per element rather
          // than per class so the swatches in Map Style drive it directly.
          elDot.style.setProperty("--fill", MAP_SETTINGS.marks[mark].color);
          if (glyph) elDot.dataset.glyph = glyph;
          // Carried on the element so the vetting pass can rank without
          // going back to the model for every mark on every pan.
          elDot.dataset.refs = f.properties.refs || 0;
          elDot.dataset.name = f.properties.name;
          elDot.title = f.properties.name + (f.properties.detail ? " — " + f.properties.detail : "");
          elDot.onclick = ev => { ev.stopPropagation(); focusEntity(f.properties.slug); };

          const label = document.createElement("span");
          label.className = "map-marker-label";
          // Empty means auto: the vetting pass will choose a side. The class
          // set here is only the starting position it measures from.
          elDot.dataset.pos = f.properties.labelPos || "";
          elDot.classList.add("lbl-" + (f.properties.labelPos || labelPlacement));
          label.textContent = f.properties.name;
          elDot.appendChild(label);

          host._markers.push(
            new window.maplibregl.Marker({ element: elDot })
              .setLngLat(f.geometry.coordinates)
              .addTo(map)
          );
        }
        // Same trigger as the markers: what is connected is a fact about the
        // filtered view, so it is recomputed whenever the markers are.
        buildLinks();
        applyMarkerVars();
        // A frame later: the labels have to be in the document and laid out
        // before anything can measure whether they collide.
        requestAnimationFrame(declutter);
        updateMapCount(host, feats.length, V());
        return feats.length;
      };

      buildProject();
      // view.center/zoom/lock is the file framing the map, so it is applied
      // once at open rather than on every redraw — it must not fight you every
      // time a brick changes.
      (function applyProjectView() {
        const p = projectObject();
        const v = (p && p.view) || {};
        if (Array.isArray(v.center) && v.center.length === 2) map.setCenter(v.center);
        if (isFinite(v.zoom)) map.setZoom(v.zoom);
        if (Array.isArray(v.bbox) && v.bbox.length === 4) {
          map.fitBounds([[v.bbox[0], v.bbox[1]], [v.bbox[2], v.bbox[3]]], { duration: 0 });
        }
        if (v.lock) {
          for (const h of ["dragPan", "scrollZoom", "boxZoom", "dragRotate",
                           "keyboard", "doubleClickZoom", "touchZoomRotate"]) {
            if (map[h]) map[h].disable();
          }
        }
      })();

      host._syncMarkers = syncMarkers;
      host._ensurePlaces = syncMarkers;   // same job, kept for existing callers
      syncMarkers();
      // Markers survive a style swap, so this only refreshes the count/note.
      map.on("style.load", () => { if (!usingFallback) note.hidden = true; });

      /*  Credit belongs to whatever is actually drawing, not to the map widget.
          Natural Earth is public domain and asks for nothing; the demo style
          carries OpenStreetMap data, which is ODbL and does require credit.
          Attributing both at all times would be wrong in one direction or the
          other, so it follows the source. */
      /*  Read off the archive's own tippecanoe command, not assumed: the land
          and both admin levels (admin0_land, admin1_land, coastline_land) are
          geoBoundaries CGAZ; the lakes, rivers and geographic lines are the
          ne_* layers, Natural Earth. Crediting only one of them was wrong. */
      const ATTRIB = {
        custom: "geoBoundaries · Natural Earth",
        demo: "© OpenStreetMap contributors",
      };
      const showAttrib = () => {
        // Your own style file is yours to credit — this page will not invent
        // an attribution for tiles it knows nothing about.
        const text = overrideStyle() ? "" : (ATTRIB[usingFallback ? "demo" : "custom"] || "");
        attribEl.textContent = text;
        attribEl.hidden = !text;
      };

      /*  Two sources, and the dropdown always names the one actually drawing.
          There is no third "auto" mode to pick: falling back when the tiles do
          not answer is behavior, not a choice you should have to make. */
      let usingFallback = startMode === "demo";   // true when DEMO_STYLE is what's actually showing

      const sourceSel = host.querySelector(".map-source");

      /*  One place decides what the map draws: a hand-edited style file if
          there is one, otherwise the settings applied to whichever source the
          dropdown names. The dropdown grays out while overridden rather than
          vanishing, so it is clear the choice still exists and something is
          currently outranking it. */
      const applyStyle = ({ silent } = {}) => {
        const ov = overrideStyle();
        const proj = hostedStyle();
        if (!silent) note.hidden = true;
        map.setStyle(ov || proj || (usingFallback ? DEMO_STYLE : basemapStyle()));
        sourceSel.disabled = !!ov;
        showAttrib();
      };
      host._applyStyle = applyStyle;

      function setSource(mode, { silent } = {}) {
        usingFallback = mode === "demo";
        applyStyle({ silent });
      }

      sourceSel.value = startMode;
      sourceSel.disabled = !!overrideStyle();
      sourceSel.onchange = () => { setSource(sourceSel.value); saveMapSource(sourceSel.value); };
      showAttrib();

      map.on("error", ev => {
        const msg = (ev && ev.error && ev.error.message) || "unknown";
        /*  The tiles did not answer, so show something rather than markers
            floating on nothing. The dropdown moves to MapLibre with it — the
            control has to say what is on screen, or the next thing you do is
            wonder why "My tiles" looks like OpenStreetMap.

            This used to require a `placesReady` flag that was set true and
            never cleared, so the fallback the whole design rests on could not
            fire at all. */
        // An applied style file is your decision; a tile error inside it gets
        // reported, never quietly replaced with something you did not ask for.
        if (!usingFallback && !overrideStyle()) {
          usingFallback = true;
          map.setStyle(DEMO_STYLE);
          sourceSel.value = "demo";
          showAttrib();
          note.hidden = false;
          note.textContent = "tiles.mbricknell.com did not respond — showing MapLibre's basemap.";
          return;
        }
        // Already on MapLibre's own tiles and they are failing too: that is the
        // connection, not the basemap, and there is nowhere further to fall.
        note.hidden = false;
        note.textContent = /fetch/i.test(msg)
          ? "Could not reach the tile server — check the connection."
          : "map error: " + msg;
      });

      /*  Observe the SHELL and the panel, not the canvas. `.map-canvas` is
          absolutely positioned and MapLibre sets its pixel size itself, so
          watching it meant growing the tile never triggered a resize — the map
          kept the height it had at startup. The shell is the element that
          actually tracks the panel's box. */
      if (window.ResizeObserver) {
        // A resized tile moves every mark relative to every other, so the
        // vetting has to be redone — a resize is a re-layout, not a repaint.
        const ro = new ResizeObserver(() => { map.resize(); requestAnimationFrame(declutter); });
        ro.observe(host.querySelector(".map-shell"));
        ro.observe(host);
      }
      // Same trap as the document canvas: a tile built while its column has no
      // real width would otherwise leave MapLibre sized against zero forever.
      requestAnimationFrame(() => map.resize());
    })
    .catch(err => {
      host._starting = false;
      note.hidden = false;
      note.textContent = "The map needs a connection — " + err.message;
    });
}

function fitToPlaces(map, fc) {
  if (!fc.features.length) return;
  const b = new window.maplibregl.LngLatBounds();
  for (const f of fc.features) b.extend(f.geometry.coordinates);
  map.fitBounds(b, { padding: 40, maxZoom: 9, duration: 0 });
}

function updateMapCount(host, shown, model) {
  const note = host.querySelector(".map-note");
  if (!note) return;
  const total = (model.all || model).places.filter(p => p.coords).length;
  if (shown) { note.hidden = true; return; }
  note.hidden = false;
  note.textContent = total
    ? "No places in view — the filter is hiding all " + total + "."
    : "No place bricks carry coordinates yet.";
}

/* --------------------------------------------------------------------------
   THEMES
   --------------------------------------------------------------------------
   Eight colors and a light/dark flag. Everything else on the page is written
   in terms of these, and the "on" washes are mixed from --accent/--accent2 at
   render time, so a theme never has to name a tint and never has one drift out
   of step with the color it belongs to.

   `color-scheme` is not decoration: without it the browser paints native
   controls — checkboxes, sliders, scrollbars, the color picker itself — for
   the wrong side, which is what made the Brick Builder fields white.

   Not covered here: the basemap. Its colors are cartography, not chrome, and
   they live in the Map Style panel where they belong.
   -------------------------------------------------------------------------- */
/*  Each token says what it paints, in the words of the thing on screen rather
    than the word in the stylesheet — "Behind the panels" is checkable by
    looking, "--bg" is not. */
const THEME_TOKENS = [
  { key: "bg",      label: "Board",    hint: "behind the panels" },
  { key: "panel",   label: "Panels",   hint: "the tiles themselves" },
  { key: "field",   label: "Inputs",   hint: "text boxes, lists, buttons" },
  { key: "fg",      label: "Text",     hint: "every word on the page" },
  { key: "border",  label: "Edges",    hint: "panel outlines and rules" },
  { key: "accent",  label: "Verified", hint: "+ bricks, confirmed markers" },
  { key: "accent2", label: "Active",   hint: "hover, focus, what is switched on" },
  { key: "draft",   label: "Draft",    hint: "− bricks, unconfirmed things" },
];

const THEMES = [
  { id: "night", name: "Night", scheme: "dark", tokens: {
      bg: "#111111", panel: "#1a1a1a", field: "#0d0d0d", fg: "#eeeeee",
      border: "#333333", accent: "#ff5500", accent2: "#33ff33", draft: "#7a8a99" } },
  { id: "blueprint", name: "Blueprint", scheme: "dark", tokens: {
      bg: "#0a1c33", panel: "#102844", field: "#08172a", fg: "#dce9fb",
      border: "#1e3d66", accent: "#ffb703", accent2: "#7fdbff", draft: "#6f8bb0" } },
  // Dark, but warm rather than blue — the tobacco-and-lamplight end of an old
  // map room. Easier on the eye than Night for a long session.
  { id: "vellum", name: "Vellum", scheme: "dark", tokens: {
      bg: "#171310", panel: "#211b16", field: "#120e0b", fg: "#e8ddcb",
      border: "#3a2f25", accent: "#e07b39", accent2: "#c9a227", draft: "#8c7c66" } },
  // Near-black with a green cast: a phosphor terminal, which is where this
  // notation's ancestors were actually typed.
  { id: "phosphor", name: "Phosphor", scheme: "dark", tokens: {
      bg: "#0a0f0b", panel: "#111a13", field: "#070c08", fg: "#cfe8d4",
      border: "#23342a", accent: "#ff7a1a", accent2: "#3ddc72", draft: "#6f8d7a" } },
  // Cold and low-contrast, the quietest of the set — for when even Night's
  // pure black feels like a hole in the screen.
  { id: "slate", name: "Slate", scheme: "dark", tokens: {
      bg: "#14181d", panel: "#1c2229", field: "#0f1317", fg: "#dbe2ea",
      border: "#2c353f", accent: "#f0883e", accent2: "#58c8b0", draft: "#7d8a99" } },
  // Deep aubergine — the same value range as Night, a different temperature.
  { id: "plum", name: "Plum", scheme: "dark", tokens: {
      bg: "#150f1a", panel: "#1f1727", field: "#100b14", fg: "#e6dcf0",
      border: "#332844", accent: "#ff6b9d", accent2: "#a78bfa", draft: "#8b7fa0" } },
];

/*  Themes you have saved. Kept apart from the built-in four: those are code
    and improve when the code does, these are yours and must never be rewritten
    by a later version of this page. */
let SAVED_THEMES = [];

let THEME_ID = "night";
let THEME = Object.assign({}, THEMES[0].tokens);

// Saved themes answer to the same lookup as the built-in ones, so everything
// downstream — applying, marking the active one, restoring on load — is
// written once and does not care where a theme came from.
function themeById(id) {
  return THEMES.find(t => t.id === id) || SAVED_THEMES.find(t => t.id === id) || null;
}

function loadSavedThemes() {
  let raw;
  try { raw = JSON.parse(localStorage.getItem(THEMES_KEY) || "null"); } catch (e) { return; }
  if (!Array.isArray(raw)) return;
  SAVED_THEMES = raw
    .filter(t => t && t.name && t.tokens && !THEMES.some(b => b.id === t.id))
    .map(t => {
      const tokens = Object.assign({}, THEMES[0].tokens);
      for (const k of THEME_TOKENS) {
        if (/^#[0-9a-f]{6}$/i.test(t.tokens[k.key])) tokens[k.key] = t.tokens[k.key];
      }
      return { id: String(t.id), name: String(t.name), saved: true,
               scheme: isLight(tokens.bg) ? "light" : "dark", tokens };
    });
}
function saveSavedThemes() {
  try { localStorage.setItem(THEMES_KEY, JSON.stringify(SAVED_THEMES)); }
  catch (e) { /* unavailable */ }
}

/*  Written as inline properties on <html>, which outrank the :root block in
    the stylesheet. That keeps the stylesheet as the honest default — open the
    file with an empty localStorage and you get Night, exactly as written. */
function applyTheme() {
  const root = document.documentElement;
  for (const t of THEME_TOKENS) root.style.setProperty("--" + t.key, THEME[t.key]);
  const preset = themeById(THEME_ID);
  root.style.colorScheme = preset ? preset.scheme : (isLight(THEME.bg) ? "light" : "dark");
}

// Perceived lightness, so a custom ground picks its own light/dark side rather
// than making you tell it. sRGB luma is close enough for a yes/no.
function isLight(hex) {
  const m = /^#([0-9a-f]{6})$/i.exec(String(hex || ""));
  if (!m) return false;
  const n = parseInt(m[1], 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return (0.2126 * r + 0.7152 * g + 0.0722 * b) > 140;
}

function saveTheme() {
  try { localStorage.setItem(THEME_KEY, JSON.stringify({ id: THEME_ID, tokens: THEME })); }
  catch (e) { /* unavailable */ }
}
function loadTheme() {
  let raw;
  try { raw = JSON.parse(localStorage.getItem(THEME_KEY) || "null"); } catch (e) { return; }
  if (!raw || typeof raw !== "object") return;
  const preset = themeById(raw.id);
  // A named preset is re-read from the code, not from storage: editing a
  // preset here should reach anyone who picked it, rather than being frozen at
  // whatever it looked like the day they chose it.
  if (preset && raw.id !== "custom") {
    THEME_ID = preset.id;
    THEME = Object.assign({}, preset.tokens);
    return;
  }
  if (raw.tokens && typeof raw.tokens === "object") {
    THEME_ID = "custom";
    for (const t of THEME_TOKENS) {
      const v = raw.tokens[t.key];
      if (/^#[0-9a-f]{6}$/i.test(v)) THEME[t.key] = v;
    }
  }
}

function renderTheme(body) {
  const presets = body.querySelector('[data-el="presets"]');
  const rows = body.querySelector('[data-el="rows"]');
  const msg = body.querySelector('[data-el="msg"]');

  const name = body.querySelector('[data-el="name"]');

  const chip = t =>
    '<span class="th-chip" style="background:' + t.tokens.bg +
      ';border-color:' + t.tokens.border + '">' +
      '<i style="background:' + t.tokens.accent + '"></i>' +
      '<i style="background:' + t.tokens.accent2 + '"></i>' +
    "</span>";

  // Saved themes sit in the same strip as the built-in ones, and carry a ×
  // because they are the only ones you can delete.
  const renderPresets = () => {
    presets.innerHTML =
      THEMES.map(t => '<button data-theme="' + t.id + '">' + chip(t) + esc(t.name) + "</button>").join("") +
      SAVED_THEMES.map(t =>
        '<span class="th-item">' +
          '<button data-theme="' + esc(t.id) + '">' + chip(t) + esc(t.name) + "</button>" +
          '<button class="th-del" data-del="' + esc(t.id) + '">&times;</button>' +
        "</span>").join("");
  };

  const paint = () => {
    presets.querySelectorAll("button[data-theme]").forEach(b => {
      b.classList.toggle("on", b.dataset.theme === THEME_ID);
    });
    rows.querySelectorAll('input[type="color"]').forEach(i => { i.value = THEME[i.dataset.k]; });
    const cur = themeById(THEME_ID);
    msg.textContent = cur
      ? cur.name + " — edit any swatch to make it yours."
      : "Unsaved — give it a name to keep it.";
  };

  if (body._wired) { renderPresets(); paint(); return; }
  body._wired = true;

  renderPresets();

  rows.innerHTML = THEME_TOKENS.map(t =>
    '<div class="th-row">' +
      '<input type="color" data-k="' + t.key + '" value="' + THEME[t.key] + '">' +
      '<span class="th-label"><b>' + esc(t.label) + "</b>" +
        '<em>' + esc(t.hint) + "</em></span>" +
    "</div>").join("");

  presets.addEventListener("click", e => {
    const del = e.target.closest("button[data-del]");
    if (del) {
      SAVED_THEMES = SAVED_THEMES.filter(t => t.id !== del.dataset.del);
      saveSavedThemes();
      // Deleting the theme you are wearing leaves the colors on screen
      // untouched — they simply stop having a name. Nothing should change
      // appearance because you tidied a list.
      if (THEME_ID === del.dataset.del) { THEME_ID = "custom"; saveTheme(); }
      renderPresets(); paint();
      return;
    }
    const b = e.target.closest("button[data-theme]");
    if (!b) return;
    const preset = themeById(b.dataset.theme);
    if (!preset) return;
    THEME_ID = preset.id;
    THEME = Object.assign({}, preset.tokens);
    applyTheme(); saveTheme(); paint();
  });

  // Editing any swatch makes it yours — the preset it started from is a
  // starting point, not a thing you have to leave first.
  rows.addEventListener("input", e => {
    const i = e.target.closest('input[type="color"]');
    if (!i) return;
    THEME[i.dataset.k] = i.value;
    THEME_ID = "custom";
    applyTheme(); saveTheme(); paint();
  });

  const doSave = () => {
    const label = name.value.trim();
    if (!label) { msg.textContent = "Give it a name first."; name.focus(); return; }
    if (THEMES.some(t => t.name.toLowerCase() === label.toLowerCase())) {
      msg.textContent = "“" + label + "” is one of the built-in four — pick another name.";
      return;
    }
    /*  Saving the same name twice updates that theme rather than making a
        second one with the same label, the same rule the Gazetteer's Add row
        follows. A list where two rows read alike and behave differently is
        worse than no list. */
    const existing = SAVED_THEMES.find(t => t.name.toLowerCase() === label.toLowerCase());
    const tokens = Object.assign({}, THEME);
    if (existing) {
      existing.tokens = tokens;
      existing.scheme = isLight(tokens.bg) ? "light" : "dark";
      THEME_ID = existing.id;
    } else {
      const id = "saved-" + Date.now().toString(36);
      SAVED_THEMES.push({ id, name: label, saved: true,
                          scheme: isLight(tokens.bg) ? "light" : "dark", tokens });
      THEME_ID = id;
    }
    saveSavedThemes(); saveTheme();
    name.value = "";
    renderPresets(); paint();
  };

  body.querySelector('button[data-act="save"]').onclick = doSave;
  name.addEventListener("keydown", e => { if (e.key === "Enter") doSave(); });

  body.querySelector('button[data-act="reset"]').onclick = () => {
    THEME_ID = "night";
    THEME = Object.assign({}, THEMES[0].tokens);
    applyTheme(); saveTheme(); paint();
  };

  paint();
}

/* --------------------------------------------------------------------------
   MAP EDITOR — authoring a project file by clicking the map
   --------------------------------------------------------------------------
   It edits the same object the loader reads, and every change is written
   straight back through applyProject. So the preview is not a preview: it is
   the real renderer drawing the real file. Nothing can look right here and
   wrong when loaded, because there is only one path.
   -------------------------------------------------------------------------- */
// Same idiom the gazetteer and pallet exports use, named once.
function downloadText(text, filename, mime) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: mime || "text/plain" }));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

let ME_MODE = null;      // which tool is armed
let ME_DISARM = null;    // how to un-arm it
let ME_VERTS = [];       // vertices collected so far
let ME_SEL = null;       // { bucket, index } of the entry being styled

// The file, with its three buckets guaranteed present so nothing downstream
// has to test for them.
function projDraft() {
  const p = projectObject() || {};
  for (const k of ["points", "polys", "annotations"]) {
    if (!p[k] || typeof p[k] !== "object") p[k] = { data: [] };
    if (!Array.isArray(p[k].data)) p[k].data = [];
  }
  return p;
}
function commitDraft(p) {
  // An empty file is no file: three empty buckets should leave the map clean
  // rather than sitting there as a project that draws nothing.
  const empty = !p.points.data.length && !p.polys.data.length &&
                !p.annotations.data.length && !p.view;
  MAP_PROJECT = empty ? "" : JSON.stringify(p, null, 2);
  saveProject();
  const h = mapHost();
  if (h && h._buildProject) h._buildProject();
  meDrawProject();
  refreshPanel("mapstyle");
  refreshPanel("mapeditor");
}

const ME_TOOLS = {
  point: { tip: "Click the map to drop a point.", clicks: 1 },
  line:  { tip: "Click each vertex, then Finish.", clicks: 0 },
  poly:  { tip: "Click each corner, then Finish. It closes itself.", clicks: 0 },
  arrow: { tip: "Click where the arrow starts, then where it points.", clicks: 2 },
  curve: { tip: "Click start, then end — it will bow to one side.", clicks: 2 },
  text:  { tip: "Click where the note should sit.", clicks: 1 },
};

function meDisarm() {
  if (ME_DISARM) ME_DISARM();
  ME_DISARM = null; ME_MODE = null; ME_VERTS = [];
  refreshPanel("mapeditor");
}

/*  The editor's own map.

    Separate from the Map Viewer on purpose. That one carries your records —
    59 parish marks, their labels, the connector lines — and tracing over the
    top of them means fighting for every click. This one shows the basemap and
    the project file and nothing else, so what you draw is the only thing on
    it.

    It reads the same basemap settings, so the ground you digitize against is
    the ground you will publish against. */
let ME_MAP = null;
let ME_SOURCE = "custom";
function loadMeSource() {
  try {
    const v = localStorage.getItem(MESOURCE_KEY);
    if (v === "custom" || v === "demo" || v === "url") ME_SOURCE = v;
  } catch (e) { /* unavailable */ }
}
function saveMeSource() {
  try { localStorage.setItem(MESOURCE_KEY, ME_SOURCE); } catch (e) { /* unavailable */ }
}

let ME_SVG = null, ME_TEXTS = null, ME_PTS = [], ME_ANNOS = [], ME_HANDLES = [];

/*  Draws the project onto the editor's map. The polys go in as real style
    layers through the same applyProjectLayers the viewer uses, so a shape can
    never look one way here and another there. Points and annotations are DOM,
    same as the viewer.

    `moveOnly` skips the rebuild and just re-projects — panning must not
    reconstruct every element sixty times a second. */
function meDrawProject(moveOnly) {
  if (!ME_MAP || !ME_MAP.isStyleLoaded()) return;
  const p = projectObject();

  if (!ME_SVG) {
    const c = ME_MAP.getCanvasContainer();
    ME_SVG = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    ME_SVG.setAttribute("class", "map-annos");
    c.appendChild(ME_SVG);
    ME_TEXTS = document.createElement("div");
    ME_TEXTS.className = "map-anno-text";
    c.appendChild(ME_TEXTS);
  }

  const reproject = () => {
    for (const a of ME_ANNOS) {
      if (a.kind === "text") {
        const q = ME_MAP.project(a.at);
        a.el.style.transform = "translate(" + q.x + "px," + q.y + "px)";
      } else {
        const s = ME_MAP.project(a.start), e = ME_MAP.project(a.end);
        const mx = (s.x + e.x) / 2, my = (s.y + e.y) / 2;
        const dx = e.x - s.x, dy = e.y - s.y;
        a.el.setAttribute("d", a.bend
          ? "M " + s.x + " " + s.y + " Q " + (mx - dy * a.bend) + " " + (my + dx * a.bend) +
            " " + e.x + " " + e.y
          : "M " + s.x + " " + s.y + " L " + e.x + " " + e.y);
      }
    }
  };
  if (moveOnly) { reproject(); return; }

  try { clearProject(ME_MAP); } catch (e) { /* style not ready */ }
  try { applyProjectLayers(ME_MAP, p); } catch (e) { /* a bad entry is not fatal */ }

  for (const m of ME_PTS) m.remove();
  ME_PTS = []; ME_ANNOS = [];
  ME_TEXTS.textContent = "";
  [...ME_SVG.querySelectorAll("path.anno-line")].forEach(n => n.remove());
  if (!p) return;

  for (const pt of (p.points && p.points.data) || []) {
    if (!pt || !isFinite(pt.lng) || !isFinite(pt.lat)) continue;
    const s = pt.style || {};
    const dot = document.createElement("div");
    dot.className = "map-marker proj-point lbl-" +
                    (DIR_TO_POS[String(pt.dir || "").toUpperCase()] || "bottom");
    dot.style.setProperty("--fill", s.fill || "#ffffff");
    dot.style.setProperty("--mk", num(s.size, 7) * 2 + "px");
    dot.style.setProperty("--lbl", "8px");
    if (s.stroke) dot.style.borderColor = s.stroke;
    if (pt.name) {
      const lab = document.createElement("span");
      lab.className = "map-marker-label";
      lab.textContent = pt.name;
      dot.appendChild(lab);
    }
    ME_PTS.push(new window.maplibregl.Marker({ element: dot })
      .setLngLat([pt.lng, pt.lat]).addTo(ME_MAP));
  }

  for (const a of (p.annotations && p.annotations.data) || []) {
    if (!a) continue;
    const s = a.style || {};
    if (a.type === "text-area" && Array.isArray(a.position)) {
      const el = document.createElement("div");
      el.className = "proj-text";
      el.textContent = a.text || "";
      if (s.fill) el.style.background = s.fill;
      if (s.stroke) el.style.border = "1px solid " + s.stroke;
      ME_TEXTS.appendChild(el);
      ME_ANNOS.push({ kind: "text", el, at: a.position });
      continue;
    }
    if (!Array.isArray(a.start) || !Array.isArray(a.end)) continue;
    const path = document.createElementNS(SVGNS, "path");
    path.setAttribute("class", "anno-line");
    path.setAttribute("fill", "none");
    const col = s.stroke || "#fff";
    path.setAttribute("stroke", col);
    path.setAttribute("stroke-width", num(s["stroke-width"], 2));
    const dash = DASHES[s["stroke-dash"]];
    if (dash) path.setAttribute("stroke-dasharray", dash.map(n => n * 3).join(" "));
    path.setAttribute("marker-end", "url(#" + arrowMarker(ME_SVG, col) + ")");
    ME_SVG.appendChild(path);
    ME_ANNOS.push({ kind: "arrow", el: path, start: a.start, end: a.end,
                    bend: a.type === "curved-arrow" ? num(a.bend, 0.25) : 0 });
  }
  reproject();
  meHandles(p);
}

/*  Handles on the selected item, so a thing you placed is not final.

    Every coordinate of the selected entry becomes a draggable square. Drop it
    and the coordinate is written back and everything redraws. Only the
    selection gets handles — putting them on all of it at once would bury the
    drawing under its own controls.

    A polygon's ring is closed, so its first and last coordinates are the same
    point; dragging either moves both, or the ring tears open. */
function meHandles(p) {
  for (const h of ME_HANDLES) h.remove();
  ME_HANDLES = [];
  if (!ME_SEL || !p) return;
  const item = p[ME_SEL.bucket] && p[ME_SEL.bucket].data[ME_SEL.index];
  if (!item) return;

  const spots = [];   // { at:[lng,lat], set(lngLat) }
  if (ME_SEL.bucket === "points") {
    spots.push({ at: [item.lng, item.lat], set: c => { item.lng = c[0]; item.lat = c[1]; } });
  } else if (ME_SEL.bucket === "polys" && item.geometry) {
    const g = item.geometry;
    if (g.type === "LineString") {
      g.coordinates.forEach((c, i) =>
        spots.push({ at: c, set: v => { g.coordinates[i] = v; } }));
    } else if (g.type === "Polygon") {
      const ring = g.coordinates[0] || [];
      ring.slice(0, -1).forEach((c, i) =>
        spots.push({ at: c, set: v => {
          ring[i] = v;
          if (i === 0) ring[ring.length - 1] = v;   // keep the ring closed
        } }));
    }
  } else if (ME_SEL.bucket === "annotations") {
    if (item.type === "text-area") {
      spots.push({ at: item.position, set: v => { item.position = v; } });
    } else {
      spots.push({ at: item.start, set: v => { item.start = v; } });
      spots.push({ at: item.end, set: v => { item.end = v; } });
    }
  }

  for (const s of spots) {
    if (!Array.isArray(s.at)) continue;
    const el = document.createElement("div");
    el.className = "me-handle";
    const m = new window.maplibregl.Marker({ element: el, draggable: true })
      .setLngLat(s.at).addTo(ME_MAP);
    m.on("drag", () => {
      // Live while dragging: the shape follows the handle rather than jumping
      // when you let go, which is the difference between editing and guessing.
      const c = m.getLngLat();
      s.set([+c.lng.toFixed(6), +c.lat.toFixed(6)]);
      MAP_PROJECT = JSON.stringify(p, null, 2);
      meRedrawOnly(p);
    });
    m.on("dragend", () => { commitDraft(p); });
    ME_HANDLES.push(m);
  }
}

// Geometry only, no handle rebuild — dragging must not destroy the handle
// currently under the pointer.
function meRedrawOnly(p) {
  try { clearProject(ME_MAP); applyProjectLayers(ME_MAP, p); } catch (e) { /* mid-style */ }
  const h = mapHost();
  if (h && h._buildProject) h._buildProject();
  meDrawAnnosOnly();
}
function meDrawAnnosOnly() {
  const p = projectObject();
  if (!p || !ME_ANNOS.length) return;
  const data = (p.annotations && p.annotations.data) || [];
  ME_ANNOS.forEach((a, i) => {
    const d = data[i];
    if (!d) return;
    if (a.kind === "text" && d.position) a.at = d.position;
    else { if (d.start) a.start = d.start; if (d.end) a.end = d.end; }
  });
  meDrawProject(true);
}

/*  What the editor traces against.

    Kept apart from the Map Viewer's choice on purpose: the reference you
    digitize FROM and the cartography you publish ONTO are rarely the same
    thing. Imagery here, your own style there. */
let ME_URL = "";
function loadMeUrl() {
  try { ME_URL = localStorage.getItem(MEURL_KEY) || ""; } catch (e) { ME_URL = ""; }
}
function saveMeUrl() {
  try {
    if (ME_URL) localStorage.setItem(MEURL_KEY, ME_URL);
    else localStorage.removeItem(MEURL_KEY);
  } catch (e) { /* unavailable */ }
}

function meStyleFor(mode) {
  if (mode === "demo") return DEMO_STYLE;
  if (mode === "url") {
    const u = withKey(ME_URL.trim());
    return /^https?:\/\//i.test(u) ? u : basemapStyle();
  }
  return basemapStyle();
}
function meSourceOptions() {
  const out = [["custom", "My tiles"], ["demo", "MapLibre"]];
  if (/^https?:\/\//i.test(ME_URL.trim())) out.push(["url", "Pasted URL"]);
  return out;
}
// Rebuilt on every render, since the URL can be typed at any moment.
function meSyncSources(body) {
  const pick = body.querySelector('[data-el="mesource"]');
  if (!pick) return;
  const opts = meSourceOptions();
  if (!opts.some(o => o[0] === ME_SOURCE)) ME_SOURCE = "custom";
  const sig = opts.map(o => o.join("|")).join(",");
  if (pick.dataset.sig !== sig) {
    pick.dataset.sig = sig;
    pick.innerHTML = opts.map(o =>
      '<option value="' + o[0] + '">' + esc(o[1]) + "</option>").join("");
  }
  pick.value = ME_SOURCE;
}

function meBoot(body) {
  const shell = body.querySelector('[data-el="shell"]');
  const canvas = shell.querySelector(".me-canvas");
  const pick = shell.querySelector('[data-el="mesource"]');
  if (ME_MAP || !window.maplibregl) return;

  meSyncSources(body);
  pick.onchange = () => {
    ME_SOURCE = pick.value;
    saveMeSource();
    ME_MAP._fellBack = false;   // an explicit choice deserves a fresh try
    ME_MAP.setStyle(meStyleFor(ME_SOURCE));
  };

  ME_MAP = new window.maplibregl.Map({
    container: canvas,
    style: overrideStyle() || meStyleFor(ME_SOURCE),
    center: [-3.4, 56.4], zoom: 7,
    attributionControl: false, preserveDrawingBuffer: true,
  });
  ME_MAP.addControl(new window.maplibregl.NavigationControl({ showCompass: false }), "top-right");
  // Falls back for the same reason the viewer does: an unreachable basemap
  // must not leave you digitizing onto black.
  ME_MAP.on("error", () => {
    if (ME_MAP._fellBack) return;
    ME_MAP._fellBack = true;
    ME_MAP.setStyle(DEMO_STYLE);
    pick.value = "demo";
  });
  ME_MAP.on("style.load", () => meDrawProject());
  ME_MAP.on("move", () => meDrawProject(true));
  if (window.ResizeObserver) new ResizeObserver(() => ME_MAP.resize()).observe(shell);
  requestAnimationFrame(() => ME_MAP.resize());
}

function meArm(mode) {
  if (!ME_MAP) return;
  if (ME_MODE === mode) { meDisarm(); return; }   // clicking the tool again puts it down
  if (ME_DISARM) ME_DISARM();
  ME_MODE = mode; ME_VERTS = [];
  const handler = e => {
    ME_VERTS.push([+e.lngLat.lng.toFixed(6), +e.lngLat.lat.toFixed(6)]);
    const t = ME_TOOLS[mode];
    if (t.clicks && ME_VERTS.length >= t.clicks) meFinish();
    else refreshPanel("mapeditor");
  };
  ME_MAP.on("click", handler);
  ME_MAP.getCanvasContainer().style.cursor = "crosshair";
  ME_DISARM = () => {
    ME_MAP.off("click", handler);
    ME_MAP.getCanvasContainer().style.cursor = "";
  };
  refreshPanel("mapeditor");
}

function meFinish() {
  const mode = ME_MODE, verts = ME_VERTS.slice();
  const need = mode === "poly" ? 3 : mode === "line" ? 2 : (ME_TOOLS[mode] || {}).clicks || 1;
  if (!mode || verts.length < need) { meDisarm(); return; }
  const p = projDraft();

  if (mode === "point") {
    p.points.data.push({ name: "Point " + (p.points.data.length + 1),
                         lng: verts[0][0], lat: verts[0][1], dir: "NE",
                         style: { fill: "#ffcc00", size: 6, stroke: "#000000", "stroke-width": 1 } });
    ME_SEL = { bucket: "points", index: p.points.data.length - 1 };
  } else if (mode === "line" || mode === "poly") {
    // A ring must close on itself; a line must not. Same clicks, one rule apart.
    const coords = mode === "poly" ? [verts.concat([verts[0]])] : verts;
    p.polys.data.push({
      geometry: { type: mode === "poly" ? "Polygon" : "LineString", coordinates: coords },
      style: mode === "poly"
        ? { fill: "#ff5500", "fill-opacity": 0.25, stroke: "#ff5500", "stroke-width": 2, "stroke-dash": "solid" }
        : { fill: "none", stroke: "#00e0ff", "stroke-width": 2, "stroke-dash": "solid" },
    });
    ME_SEL = { bucket: "polys", index: p.polys.data.length - 1 };
  } else if (mode === "arrow" || mode === "curve") {
    p.annotations.data.push({
      type: mode === "curve" ? "curved-arrow" : "straight-arrow",
      start: verts[0], end: verts[1],
      ...(mode === "curve" ? { bend: 0.25 } : {}),
      style: { stroke: "#ffffff", "stroke-width": 2, "stroke-dash": "solid" },
    });
    ME_SEL = { bucket: "annotations", index: p.annotations.data.length - 1 };
  } else if (mode === "text") {
    p.annotations.data.push({
      type: "text-area", position: verts[0], text: "Note",
      style: { fill: "#ffffff", "fill-opacity": 0.85, stroke: "#000000", "stroke-width": 1, align: "left" },
    });
    ME_SEL = { bucket: "annotations", index: p.annotations.data.length - 1 };
  }
  meDisarm();
  commitDraft(p);
}

// One row per thing in the file, in the order it draws.
function meEntries(p) {
  const rows = [];
  p.points.data.forEach((d, i) =>
    rows.push({ bucket: "points", index: i, icon: "📍", label: d.name || "point" }));
  p.polys.data.forEach((d, i) => {
    const line = d.geometry && /LineString/.test(d.geometry.type);
    rows.push({ bucket: "polys", index: i, icon: line ? "╱" : "⬠",
                label: d.source || (line ? "line" : "shape") });
  });
  p.annotations.data.forEach((d, i) =>
    rows.push({ bucket: "annotations", index: i,
                icon: d.type === "text-area" ? "🗨" : d.type === "curved-arrow" ? "↝" : "➤",
                label: d.type === "text-area" ? (d.text || "note") : "arrow" }));
  return rows;
}

function renderMapEditor(body) {
  // MapLibre comes from a CDN and only when a map is actually on the board.
  if (!ME_MAP) {
    Promise.all([loadOnce(MAPLIBRE_CSS, true), loadOnce(MAPLIBRE_JS), loadOnce(PMTILES_JS)])
      .then(() => {
        if (!window.__pmtilesReady && window.pmtiles) {
          window.maplibregl.addProtocol("pmtiles", new window.pmtiles.Protocol().tile);
          window.__pmtilesReady = true;
        }
        meBoot(body);
      })
