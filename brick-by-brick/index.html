    // must never disagree about what a slot looks like.
    const other = gridOther();
    for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) {
      g.fillStyle = ((x + y) & 1) ? gridBg : other;
      g.fillRect(x * z, y * z, z, z);
    }
    if (onion && !isPlace()) {
      /*  Everything EXCEPT what you are drawing. Showing only the body was no
          use when adding a hat to someone already in a coat — you need to see
          what the new piece has to sit with. */
      const others = ROWS.filter(k => k !== slot).map(k => ({ img: layers[k] }));
      const ghost = dressBody(others, false);
      if (ghost) {
        const gw = ghost.__cellW, gh = ghost.__cellH;
        const gn = ghost.__frames || SPR_FRAMES;
        g.globalAlpha = 0.3;
        g.drawImage(ghost, (frame % gn) * gw, 0, gw, gh,
                    Math.round((cw - gw) / 2) * z, (ch - gh) * z, gw * z, gh * z);
        g.globalAlpha = 1;
      }
    }
    /*  A replay stands in for the layers entirely: watching a drawing must not
        be able to change it. Scaled into the cell grid, so a wear sheet's four
        frames read at the size they are drawn. */
    if (replayShot) {
      g.drawImage(replayShot, 0, 0, replayShot.width, replayShot.height,
                  0, 0, grid.width, grid.height);
    } else if (anchor && pending && tool === "move") {
      // Shown where it would land, so the nudge is judged before it is made.
      const m = clampShift(pending.x - anchor.x, pending.y - anchor.y);
      g.drawImage(layers[slot], frame * cw, 0, cw, ch,
                  m.dx * z, m.dy * z, grid.width, grid.height);
    } else {
      /*  FAINT WHILE YOU MARK.

          In effects the drawing is the thing you are marking, not the thing
          you are making — it has to be legible enough to aim at and quiet
          enough that the marks are what you see. Full strength, a cyan wash
          over a pale wall is invisible; too faint and you cannot find the
          window. */
      if (fxMode) g.globalAlpha = 0.45;
      g.drawImage(layers[slot], frame * cw, 0, cw, ch, 0, 0, grid.width, grid.height);
      g.globalAlpha = 1;
    }


    /*  There was a head-height line across a place, drawn from the body
        sprite's height — a person's 28 pixels ruled onto a building.

        It only meant anything while both were measured the same way, and they
        are not: a place carries its own ratio now (1px = so many feet) while a
        figure is 28 pixels because that is how tall a brickling is drawn, not
        because anybody measured one. Ruling the second onto the first was two
        scales in one picture pretending to be one. The scale row is the honest
        version of that question, and the bricklings in the preview are the
        eyeball check. */

    /*  What is on the clipboard, hovering where it would land — in its own
        colors, faintly, so it reads as a proposal rather than as paint that
        has already gone down. Outlined as well, because a shape lifted from a
        dark coat and hovered over a dark coat is otherwise invisible. */
    /*  THE BOX BEING DRAWN.

        A marching-ants outline and nothing else — no fill, no tint. The whole
        promise of a marquee is that you can see exactly what is inside it, and
        a wash over the pixels breaks that at the moment you most need it.
        Dashed, so it cannot be read as a rectangle you have drawn, and in the
        same blue the stamp preview uses, because it is the same operation one
        step earlier. */
    if (tool === "copy" && !clip && anchor && pending) {
      const bx0 = Math.min(anchor.x, pending.x), bx1 = Math.max(anchor.x, pending.x);
      const by0 = Math.min(anchor.y, pending.y), by1 = Math.max(anchor.y, pending.y);
      g.save();
      g.strokeStyle = gridLight() ? "rgba(0,105,165,0.95)" : "rgba(120,220,255,0.95)";
      g.lineWidth = 1;
      g.setLineDash([3, 2]);
      g.strokeRect(bx0 * z + 0.5, by0 * z + 0.5,
                   (bx1 - bx0 + 1) * z - 1, (by1 - by0 + 1) * z - 1);
      g.restore();
    }

    if (tool === "copy" && clip && hover) {
      g.globalAlpha = 0.75;
      for (const [dx, dy, r, g2, b, a] of clip.pts) {
        const px = hover.x + dx, py = hover.y + dy;
        if (px < 0 || py < 0 || px >= cw || py >= ch || !a) continue;
        g.fillStyle = "rgba(" + r + "," + g2 + "," + b + "," + (a / 255) + ")";
        g.fillRect(px * z, py * z, z, z);
      }
      g.globalAlpha = 1;
      g.strokeStyle = gridLight() ? "rgba(0,105,165,0.9)" : "rgba(120,220,255,0.9)";
      g.lineWidth = 1;
      for (const [dx, dy, , , , a] of clip.pts) {
        const px = hover.x + dx, py = hover.y + dy;
        if (px < 0 || py < 0 || px >= cw || py >= ch || !a) continue;
        g.strokeRect(px * z + 0.5, py * z + 0.5, z - 1, z - 1);
      }
    }

    /*  The shape under the cursor, not yet committed. Drawn in the pen's own
        color so what you see is what you get, and outlined when erasing,
        where the color is nothing. */
    if (anchor && pending && tool !== "pencil" && tool !== "move" && tool !== "copy") {
      const col = drawing ? null : colorNow();
      for (const [px, py] of shapePixels(anchor.x, anchor.y, pending.x, pending.y)) {
        if (px < 0 || py < 0 || px >= cw || py >= ch) continue;
        if (col) { g.fillStyle = col; g.fillRect(px * z, py * z, z, z); }
        else {
          g.strokeStyle = "rgba(217,138,92,0.9)"; g.lineWidth = 1;
          g.strokeRect(px * z + 0.5, py * z + 0.5, z - 1, z - 1);
        }
      }
    }

    /*  Two weights. Every cell gets a faint rule so you can count pixels, and
        every fourth a firmer one so you can count them QUICKLY — without the
        major lines you lose your place around the tenth column and start
        miscounting a sleeve. Skipped when the cells are too small to rule,
        where a grid is only noise. */
    g.lineWidth = 1;
    /*  THE GRID THINS OUT RATHER THAN SWITCHING OFF.

        It drew every cell above five screen pixels and nothing at all below,
        which was fine while the canvas was always big — then the panel filled
        up with rows, the fit dropped to two pixels a cell, and the grid simply
        vanished with the button still lit.

        A rule needs a few pixels of cell either side to read as a rule rather
        than as a texture. So under that, only the firm ones are drawn: you
        lose the per-cell mesh and keep the counting marks, which is the half
        that was doing the work at that size anyway. */
    if (gridOn && z >= 2) {
      const every = z >= 5;                  // room for a line on every cell
      for (let i = 1; i < cw; i++) {
        if (!every && i % gridStep) continue;
        g.strokeStyle = gridInk(i % gridStep ? 0.13 : 0.3);
        g.beginPath(); g.moveTo(i * z + 0.5, 0); g.lineTo(i * z + 0.5, grid.height); g.stroke();
      }
      for (let i = 1; i < ch; i++) {
        if (!every && i % gridStep) continue;
        g.strokeStyle = gridInk(i % gridStep ? 0.13 : 0.3);
        g.beginPath(); g.moveTo(0, i * z + 0.5); g.lineTo(grid.width, i * z + 0.5); g.stroke();
      }
    }

    /*  The center lines, and the ground.

        Vertical matters most: every layer is centered on it, so a sleeve two
        pixels off the middle is two pixels off on the body — invisible until
        you can see the axis it is meant to be even about. Horizontal is a
        second reference, roughly the waist. The bottom edge is the ground line
        everything stands on, so it gets its own color and no dashes. */
    if (axesOn) {
      const midX = Math.round(cw / 2) * z, midY = Math.round(ch / 2) * z;
      /*  Cyan reads on a dark grid and washes out on a pale one, so the
          axes take a deeper blue there. Same line, same job. */
      g.strokeStyle = gridLight() ? "rgba(0,105,165,0.95)" : "rgba(120,220,255,0.95)";
      g.lineWidth = 2;
      g.setLineDash([6, 4]);
      g.beginPath(); g.moveTo(midX + 0.5, 0); g.lineTo(midX + 0.5, grid.height); g.stroke();
      g.beginPath(); g.moveTo(0, midY + 0.5); g.lineTo(grid.width, midY + 0.5); g.stroke();
      g.setLineDash([]);
    }

    /*  The guides, over everything they are guiding.

        Each one is drawn from its cell out to well past both corners, which is
        the cheap way to draw a line that has no ends. Amber, where the fixed
        center lines are cyan: they behave differently and should not be
        mistaken for one another. The anchor gets a dot, because that is the
        cell you grab to move it and there would otherwise be nothing to aim
        at on a line that is the same all the way along. */
    if (guides.length) {
      const far = (grid.width + grid.height) * 2;
      guides.forEach((gd, i) => {
        const { dx, dy } = guideDir(gd.deg);
        const ax = (gd.x + 0.5) * z, ay = (gd.y + 0.5) * z;
        const amber = gridLight() ? "185,105,0" : "255,196,92";
        g.strokeStyle = "rgba(" + amber + (i === lastGuide ? ",0.95)" : ",0.55)");
        g.lineWidth = 1;
        g.beginPath();
        g.moveTo(ax - dx * far, ay - dy * far);
        g.lineTo(ax + dx * far, ay + dy * far);
        g.stroke();
        g.fillStyle = "rgba(" + amber + (i === lastGuide ? ",0.95)" : ",0.5)");
        g.beginPath();
        g.arc(ax, ay, Math.max(2, z / 3), 0, Math.PI * 2);
        g.fill();
      });
    }
    gNote.textContent = guides.length
      ? guides.length + (guides.length === 1 ? " guide" : " guides")
      : "";
    gClear.disabled = !guides.length;

    g.lineWidth = 1;
    g.strokeStyle = "#d98a5c";
    g.beginPath();
    g.moveTo(0, grid.height - 0.5); g.lineTo(grid.width, grid.height - 0.5);
    g.stroke();

    /*  How big this actually is, on the thing itself.

        The number lives in a box at the far end of the panel, which is no use
        while you are drawing: what you want to know is whether you are working
        at 24 wide or 102, and you want to know it without looking away. Top
        right, because the figure stands centred on the bottom, and quiet
        enough to be ignored — it takes its ink from the grid, so it survives a
        pale one as well as a dark. */
    g.font = "11px ui-monospace, SFMono-Regular, Menlo, monospace";
    g.textAlign = "right";
    g.textBaseline = "top";
    g.fillStyle = gridInk(0.5);


    /*  WHICH TOOL IS IN YOUR HAND, ON THE CANVAS.

        Seven glyphs and a word, and the only thing saying which was live was a
        green fill you had to compare against six neighbours — a pencil and a
        lifted-shape stamp are one hover apart at eleven pixels. The name
        settles it, and it belongs where you are looking rather than in the
        panel you are not.

        Bottom left: the size has the top right, the pointer's coordinates the
        top left, and the figure stands centred on the bottom edge, so this is
        the one corner nothing else wants. */
    g.font = "11px ui-monospace, SFMono-Regular, Menlo, monospace";
    g.textBaseline = "alphabetic";
    g.textAlign = "left";
    /*  Neon, with a fallback that keeps it neon.

        #33ff33 is the app's own accent and it burns against a dark grid — but
        the grid is yours now, and neon green on cream is a luminance away from
        nothing: about 1.3:1, which is a colour you can see and a word you
        cannot read. Rather than swap the colour for a duller one and lose the
        thing that makes the label findable, the ground under it changes: when
        the contrast falls below 3:1 the label gets a dark plate to sit on and
        the green stays exactly as green.

        Plain luminance contrast, which is what actually fails here — the
        letters are one flat colour on one flat ground, with no hue trickery to
        account for. */
    const TOOL_NEON = "#33ff33";
    const lumA = lumOf(hexInt(TOOL_NEON)), lumB = lumOf(hexInt(gridBg));
    const ratio = (Math.max(lumA, lumB) + 0.05) / (Math.min(lumA, lumB) + 0.05);
    const tw2 = g.measureText(tool).width;
    /*  IT GETS OUT OF THE WAY.

        The label sits in the bottom left corner, which is also somewhere you
        draw. Working down there meant drawing under a word, and the word is
        only a reminder of which tool you are holding.

        So it moves to the opposite corner while the pointer is near it, and
        comes back when the pointer leaves. Near is measured against the label
        itself rather than a fixed corner, so it does not dodge a pointer that
        was never going to reach it. */
    const labW = tw2 + 8, labH = 15;
    let labX = 2, labY = grid.height - 17;
    const near = atCell || hover;
    if (near) {
      const px = (near.x + 0.5) * z, py = (near.y + 0.5) * z;
      const room = 26;
      const over = px > labX - room && px < labX + labW + room
                && py > labY - room && py < labY + labH + room;
      //  To the right, along the same edge: the bottom of the canvas is where
      //  this belongs, and the far corner is the furthest point on it.
      if (over) labX = grid.width - labW - 2;
    }
    if (ratio < 3) {
      g.fillStyle = "rgba(10,12,9,0.86)";
      g.fillRect(labX, labY, labW, labH);
    }
    g.fillStyle = TOOL_NEON;
    g.fillText(tool, labX + 4, labY + 11);

    /*  WHICH CELL THE POINTER IS ON.

        A crosshair cursor has no pixel — it is a pair of lines with a hole
        where the point should be — so the tools that place a single deliberate
        point had you guessing which cell you were about to commit to. The cell
        is outlined instead, and its coordinates written in the corner, so the
        answer is on the canvas rather than under the cursor.

        Only for the tools that need it. A pencil shows you where it went the
        instant it goes there, and outlining every cell you pass over would be
        a light chasing the hand for no reason. */
    const showCell = cellCursor ? (drawing === null ? hover : atCell)
                                : (drawing === null && (tool === "guide" || tool === "measure") ? hover : null);
    if (showCell) {
      const hx = showCell.x * z, hy = showCell.y * z;
      g.strokeStyle = gridInk(0.9);
      g.lineWidth = 1;
      g.strokeRect(hx + 0.5, hy + 0.5, z - 1, z - 1);
      /*  A second, brighter ring inside it when the cell is small: at five
          screen pixels a single hairline square is easy to lose among the
          rules it sits on. */
      if (z >= 6) {
        /*  The tool's own colour where it has one, so an amber ring means a
            guide is about to be placed and a magenta one a measurement. Every
            other tool gets plain ink: it is a pointer, not a claim about what
            kind of mark is coming. */
        g.strokeStyle = tool === "guide"
          ? (gridLight() ? "rgba(185,105,0,0.9)" : "rgba(255,196,92,0.9)")
          : tool === "measure"
          ? (gridLight() ? "rgba(150,60,180,0.9)" : "rgba(226,150,255,0.9)")
          : gridInk(0.55);
        g.strokeRect(hx + 1.5, hy + 1.5, z - 3, z - 3);
      }
      /*  Coordinates share the top-left corner with the drag readout, and the
          drag readout is the better answer while a drag is happening. */
      if (drawing === null) {
        const txt = showCell.x + ", " + showCell.y;
        g.font = "11px ui-monospace, SFMono-Regular, Menlo, monospace";
        g.textBaseline = "top";
        g.textAlign = "left";
        const pad = 4, tw = g.measureText(txt).width;
        g.fillStyle = gridLight() ? "rgba(255,255,255,0.88)" : "rgba(0,0,0,0.72)";
        g.fillRect(3, 3, tw + pad * 2, 15);
        g.fillStyle = gridInk(0.95);
        g.fillText(txt, 3 + pad, 5);
      }
    }

    /*  WHAT IS MARKED, SHOWN WITHOUT BEING PAINTED.

        The flag lives in the alpha channel and is invisible by design, which
        is right for the street and useless in the editor — you cannot mark a
        window you cannot see you have already marked.

        So the editor washes the marked area in colour: the whole cell, faint
        enough to read the drawing straight through it, so what you see is the
        REGION you have marked rather than a scatter of dots you have to join
        up. A window is a shape, and the thing you need to know is whether the
        shape is right.

        Bordered where the wash meets unmarked pixels, because a translucent
        tint over dark paint is nearly invisible and the edge is exactly what
        you are checking. It is an overlay, never paint, and it appears only
        while a marker tool is up — put the tool down and you are looking at
        the window itself, which is the thing you are designing. */
    if (isPlace() && fxMode) {
      const lg = layers[slot].getContext("2d", { willReadFrequently: true });
      const md = lg.getImageData(frame * cw, 0, cw, ch).data;
      //  Which effect a cell carries, as its index in the table plus one, so
      //  zero still means "none". Adding a row needs nothing here.
      const kind = (x, y) => {
        if (x < 0 || y < 0 || x >= cw || y >= ch) return 0;
        const e = EFFECT_BY_ALPHA.get(md[(y * cw + x) * 4 + 3]);
        return e ? EFFECTS.indexOf(e) + 1 : 0;
      };
      g.save();
      for (let y = 0; y < ch; y++) {
        for (let x = 0; x < cw; x++) {
          const k = kind(x, y);
          if (!k) continue;
          //  The effect's own colour, washed thin over the drawing and drawn
          //  solid along the edges of its region.
          const ink = EFFECTS[k - 1].ink;
          g.globalAlpha = 0.34;
          g.fillStyle = ink;
          g.fillRect(x * z, y * z, z, z);
          g.globalAlpha = 1;
          //  The outline of the region, drawn only on sides that leave it.
          g.fillStyle = ink;
          const t = Math.max(1, Math.round(z / 8));
          if (kind(x, y - 1) !== k) g.fillRect(x * z, y * z, z, t);
          if (kind(x, y + 1) !== k) g.fillRect(x * z, (y + 1) * z - t, z, t);
          if (kind(x - 1, y) !== k) g.fillRect(x * z, y * z, t, z);
          if (kind(x + 1, y) !== k) g.fillRect((x + 1) * z - t, y * z, t, z);
        }
      }
      g.restore();
    }

    /*  THE MEASUREMENT, STILL THERE AFTER THE POINTER IS UP.

        Boxed in the measuring colour so it cannot be mistaken for a guide or
        for something drawn, and labelled with the same numbers the live
        readout uses — cells, and real units on a place, so a window can be
        compared against the door you drew an hour ago. */
    measCloses = [];
    const mine = measures();
    for (let mi = 0; mi < mine.length; mi++) {
      const measured = mine[mi];
      const { x0, y0, x1, y1 } = measured;
      const w = x1 - x0 + 1, h = y1 - y0 + 1;
      g.strokeStyle = gridLight() ? "rgba(150,60,180,0.95)" : "rgba(226,150,255,0.95)";
      g.lineWidth = 1;
      g.setLineDash([3, 2]);
      g.strokeRect(x0 * z + 0.5, y0 * z + 0.5, w * z - 1, h * z - 1);
      g.setLineDash([]);

      let txt = w + " \u00d7 " + h;
      if (isPlace() && scale.per > 0) {
        txt += "  \u00b7  " + realOf(w) + " \u00d7 " + realOf(h) + " " + scale.unit;
      }
      if (measured.shape) txt += "  (shape)";
      g.font = "11px ui-monospace, SFMono-Regular, Menlo, monospace";
      g.textBaseline = "top";
      g.textAlign = "left";
      /*  KEPT INSIDE THE CANVAS, ON ALL FOUR SIDES.

          It preferred to sit above the box and flipped below when there was no
          room. That covered three edges and not the fourth: measure something
          against the bottom and the flip put the label past the bottom of the
          canvas, where it is simply clipped away — the tool looked broken at
          exactly the moment it had an answer for you.

          So: above by preference, below if that does not fit, and then clamped
          into the canvas whatever happens. A label half over its own box is
          worth more than a label you cannot read. */
      /*  THE × THAT PUTS IT AWAY.

          A measurement that survives every tool needs somewhere obvious to
          die, and the obvious place is on the thing itself, next to the
          numbers it is about — not back on a tool button three rows up, which
          is where you would have to go looking for it.

          It is drawn, not a DOM node, because the label it hangs off is drawn:
          a real button would have to be positioned over a canvas whose cell
          size, offset and clamping all move underneath it. So the box is
          remembered in `measCloses` and the pointer handler tests it first. */
      const pad = 4, gap = 6, xw = 11;
      const tw = g.measureText(txt).width;
      const bw = tw + pad * 2 + gap + xw, bh = 15;
      let bx = x0 * z, by = y0 * z - bh - 2;
      if (by < 0) by = y1 * z + z + 3;
      bx = Math.max(0, Math.min(bx, grid.width - bw));
      by = Math.max(0, Math.min(by, grid.height - bh));
      /*  NUDGED OFF THE LABEL ALREADY THERE.

          Two marks that start on the same row put their labels in exactly the
          same place, and the second one drawn wins — the first is unreadable
          and its ⊗ is unreachable, buried under an opaque box. Measure a row of
          windows along a wall and that is every one of them but the last.

          So a label that would land on one already placed steps down past it,
          as many times as it takes. Sideways would leave the label pointing at
          the wrong box; downwards it stays over its own. */
      for (let guard = 0; guard < measCloses.length + 1; guard++) {
        const clash = measCloses.find(o =>
          Math.abs(o.ly - by) < bh && bx < o.lx + o.lw && o.lx < bx + bw);
        if (!clash) break;
        by = clash.ly + bh + 1;
      }
      by = Math.max(0, Math.min(by, grid.height - bh));
      g.fillStyle = gridLight() ? "rgba(255,255,255,0.9)" : "rgba(0,0,0,0.78)";
      g.fillRect(bx, by, bw, bh);
      g.fillStyle = gridLight() ? "rgb(120,40,150)" : "rgb(232,170,255)";
      g.fillText(txt, bx + pad, by + 2);

      /*  A RING AROUND IT, so it reads as a control.

          A bare × in a line of type is just another character — it sat beside
          `9 × 11` looking like part of the sum, which is the one thing this
          label already has two of. Circled, it stops being type: a ring is a
          button everywhere on a screen, and nothing else drawn on this canvas
          is round.

          Drawn rather than set as ⊗, because the glyph is a different size in
          every font it falls back through and lands off the baseline in most
          of them. Two strokes and an arc are the same shape at any size and
          land exactly where they are put. */
      const cx = bx + pad + tw + gap, cy = by + bh / 2, rr = 5;
      g.save();
      g.lineWidth = 1;
      g.strokeStyle = gridLight() ? "rgb(120,40,150)" : "rgb(232,170,255)";
      g.beginPath();
      g.arc(cx + rr, cy, rr - 0.5, 0, Math.PI * 2);
      g.stroke();
      const arm = 2;
      g.beginPath();
      g.moveTo(cx + rr - arm, cy - arm); g.lineTo(cx + rr + arm, cy + arm);
      g.moveTo(cx + rr + arm, cy - arm); g.lineTo(cx + rr - arm, cy + arm);
      g.stroke();
      g.restore();
      /*  Bigger than it looks: the ring is 10px across and the whole right end
          of the label takes the press, because a 10px target is not one you can
          hit with a mouse in a hurry, let alone a finger. */
      measCloses.push({
        i: mi,
        x: cx - gap / 2, y: by, w: xw + gap / 2 + pad, h: bh,
        lx: bx, ly: by, lw: bw,          // the whole label, for the nudge above
      });
    }

    /*  HOW FAR THIS STROKE HAS GONE, WHILE IT IS GOING.

        You cannot count cells on a grid while your hand is moving, and the
        thing you usually want is not where you are but how far you have come:
        a wall eleven cells long, a window three by four. So the extent of the
        drag is written down live, and it goes the moment you let go — it is a
        measurement of an action, not a label on a drawing.

        TOP LEFT, not beside the pointer. Following the cursor put the label
        squarely over the line while you dragged sideways, which is the one
        direction you most want to watch: it was hiding the thing it was
        describing. A fixed corner never covers what is under the hand, and
        being always in the same place beats being near — you learn where to
        look once instead of hunting for it on every drag. It sits opposite
        the size, so the two numbers do not crowd each other.

        Inclusive counts, because a drag from cell 4 to cell 6 draws THREE
        cells and reporting two would be arithmetic rather than an answer.

        The pencil is left out. It commits as it goes, proposing no shape, so
        a box measured from wherever you happened to press describes nothing
        you are about to do.

        `move` gets a signed offset instead: nudging is about displacement,
        and "3 x 1" tells you nothing about which way. */
    if (anchor && atCell && drawing !== null
        && tool !== "guide" && tool !== "measure" && tool !== "pencil") {
      const dx = atCell.x - anchor.x, dy = atCell.y - anchor.y;
      const w = Math.abs(dx) + 1, h = Math.abs(dy) + 1;
      const sign = n => (n > 0 ? "+" : n < 0 ? "\u2212" : "\u00b1") + Math.abs(n);
      let txt = tool === "move" ? sign(dx) + ", " + sign(dy) : w + " \u00d7 " + h;
      //  A line's answer is its run, not the box it happens to sit in.
      if (tool === "line") txt = Math.max(w, h) + " cells";
      //  On a place, the same measurement in the units the building is in.
      if (isPlace() && scale.per > 0 && tool !== "move") {
        txt += "  \u00b7  " + (tool === "line"
          ? realOf(Math.max(w, h)) + " " + scale.unit
          : realOf(w) + " \u00d7 " + realOf(h) + " " + scale.unit);
      }

      g.font = "11px ui-monospace, SFMono-Regular, Menlo, monospace";
      g.textBaseline = "top";
      g.textAlign = "left";
      const pad = 4, tw = g.measureText(txt).width;
      g.fillStyle = gridLight() ? "rgba(255,255,255,0.88)" : "rgba(0,0,0,0.72)";
      g.fillRect(3, 3, tw + pad * 2, 15);
      g.fillStyle = gridInk(0.95);
      g.fillText(txt, 3 + pad, 5);
    }

    nameOut.textContent = (isPlace() ? "images/places/" : "images/wear/") + fileName();
    /*  Offered only when the name has moved on from what is loaded. `loadedAs`
        is whatever the canvas was last filled from, so returning to that name
        puts the button away again. */
    const named = slugify(nameIn.value.trim());
    const stale = !!named && named !== loadedAs && touched[slot];
    openBtn.hidden = !stale;
    if (stale) {
      openBtn.textContent = "open " + named;
      openBtn.title = "replace what is on the canvas with the drawing saved "
                    + "under this name. Undo brings yours back.";
    }
    if (host._wipQueue) host._wipQueue();
    /*  A ONE-SHOT MESSAGE OUTLIVES THE REPAINT THAT FOLLOWS IT.

        Anything that wants to say something to you says it and then returns,
        and the pointer release repaints a moment later and writes the standing
        hint straight over the top. So a refusal explaining why nothing
        happened was never on screen long enough to read. Setting `hintOnce`
        instead survives exactly one repaint. */
    if (hintOnce) {
      hint.textContent = hintOnce;
      hintOnce = "";
      return;
    }
    hint.textContent = (tool === "copy"
                        ? (clip ? clip.w + " × " + clip.h
                                    + " on the clipboard · click to stamp it "
                                    + "— right-click to drop it"
                                : "drag a box round what you want")
                      : tool === "pencil" ? "drag to draw"
                      : tool === "move" ? "drag to nudge the layer"
                      : tool === "guide" ? "drag to aim \u2014 shift snaps to 15\u00b0, "
                          + "right-click removes, drop on a guide to move it"
                      : tool === "measure" ? "click a shape to size it, or drag across "
                          + "anything \u00b7 right-click clears"
                      : "drag to place the shape") +
      " \u00b7 right-click or ctrl to erase \u00b7 middle-drag to nudge \u00b7 " +
      slot + ", frame " + (frame + 1) + " \u00b7 " + cw + " \u00d7 " + ch +
      " \u00b7 grows from the center, so it stays on the body";
    drawPreview();
  }

  /*  The render example, through the real compositor and the real palette
      swap — so what walks here is what walks down the street. */
  function drawPreview() {
    const dressed = dressBody(ROWS.map(k => ({ img: layers[k], slot: k })), false);
    if (!dressed) return;
    if (isPlace()) return drawPlacePreview(dressed);
    const swapped = dressed;
    const cw = dressed.__cellW, ch = dressed.__cellH;
    const n = dressed.__frames || SPR_FRAMES;
    const f = playing ? Math.floor(tick / 9) % n : Math.min(frame, n - 1);
    prev.hidden = prev1.hidden = false;       // the place preview hides one
    for (const [cv, z] of [[prev, 4], [prev1, 1]]) {
      cv.width = cw * z; cv.height = ch * z;
      const c = cv.getContext("2d");
      c.imageSmoothingEnabled = false;
      c.clearRect(0, 0, cv.width, cv.height);
      c.drawImage(swapped, f * cw, 0, cw, ch, 0, 0, cw * z, ch * z);
    }
  }

  /*  Scenery in its column: sky, ground, the scene standing on the line, and
      people in front of it. A building drawn on its own always looks right;
      the question is whether it still reads with a crowd in front of it. */
  /*  THE PREVIEW SHOWS WHAT THE STREET WILL SHOW.

      Two things were wrong with it. It sized its canvas FROM the drawing, so a
      200-pixel building made a 424-pixel preview and pushed itself out of a
      260-pixel column — a preview that grows with its subject is not a
      preview. And it scaled the building and the bricklings together, which
      the Promenade never does.

      The street's rule is one line: a place is drawn at
      `min(1, (column - 8) / width)` and a person is drawn at 1:1. So a place
      narrower than 102 appears pixel-for-pixel and a wider one is SHRUNK
      against people who stay the size they are — which is the whole question
      you are asking when you look at this box. Getting that wrong meant a
      240-wide kirk looked right here and came out half the height of the
      person standing in front of it on the street.

      So the scene is composed in the street's own units — a 110-wide column,
      a ground line, the place on it at the street's scale, bricklings at
      theirs — and only then scaled as a whole to fit the window. Whole
      multiples while they fit, so blocks stay square. */
  /*  Tall enough for the scene to fit at TWICE size rather than once. A
      102x64 place plus the sky and ground it stands in is 78 units, and a
      window of 132 could only take one whole multiple of that — so the
      preview sat at 1:1 and was half the size it had room to be. */
  const PREV_COL = 110;                       // the Promenade's narrowest column
  /*  The place with its marked windows lit, kept until the drawing changes.

      Keyed on a cheap signature rather than the pixels: the width, the height,
      the hour, and a count of what is flagged. Any of those moving is a
      different picture; none of them moving means the last answer still
      stands. A stroke that changes a colour without changing a flag is caught
      by `wipSeq`, which every edit bumps. */
  let litCache = null, litKey = "";

  function litPlace(sc) {
    const key = sc.width + "x" + sc.height + ":" + (NIGHT ? "n" : "d") + ":" + wipSeq;
    if (litCache && litKey === key) return litCache;
    const copy = document.createElement("canvas");
    copy.width = sc.width; copy.height = sc.height;
    copy.getContext("2d").drawImage(sc, 0, 0);
    litCache = readSignMark(copy).img;
    litKey = key;
    return litCache;
  }

  function drawPlacePreview(fig) {
    const sc = layers.place;
    const fw = fig.__cellW || SPR_W, fh = fig.__cellH || SPR_H;

    //  Exactly the expression the Promenade uses, at zoom 1.
    const world = Math.min(1, (PREV_COL - 8) / Math.max(1, sc.width));
    const pw = Math.max(1, Math.round(sc.width * world));
    const ph = Math.max(1, Math.round(sc.height * world));

    /*  THE WINDOW GROWS WITH THE BUILDING, THEN THE SCENE SHRINKS.

        A tall place used to be cropped at a fixed height, on the argument that
        fitting the height would shrink it out of proportion. That argument was
        wrong: `zz` scales the WHOLE scene — the place and the bricklings
        together — so shrinking to fit costs nothing of the comparison this box
        exists to make. What must never happen is the place being scaled apart
        from the people, and the street's own rule (`world`, above) is the only
        thing that does that.

        So: a taller drawing gets a taller preview, and NOTHING ELSE CHANGES.
        The zoom comes from the width of the column and nothing but that, so a
        place stays the same size across the box however tall it grows — you
        are watching a building get taller, not a preview rearranging itself
        around one. Letting the height drive the zoom shrank a spire and every
        brickling beside it, which reads as the whole scene stepping backwards
        the moment you added a storey. */
    const sky = 6, ground = 8;
    const sceneH = Math.max(ph, fh) + sky + ground;
    const boxW = Math.max(80, prevWrap.clientWidth - 18);
    let zz = boxW / PREV_COL;
    if (zz >= 1) zz = Math.floor(zz);

    /*  THREE TIMES TALL, AND NO TALLER.

        Height is the free axis, but free is not the same as unbounded: a
        256-pixel place made a 540-pixel preview, which is most of the side
        panel spent on one box. Three times the default scene is a spire's
        worth of room.

        Past it the top is CROPPED, not scaled — shrinking would mean the width
        moving, and the width is the column's and does not move. Cropping is
        also what the street does with a place taller than its sky. */
    const shownH = Math.min(sceneH, 3 * (PLACE_H + sky + ground));
    const off = sceneH - shownH;              // units lost off the top

    prev1.hidden = true;                      // no true-size copy of a building
    prev.hidden = false;
    prev.width = Math.max(1, Math.round(PREV_COL * zz));
    prev.height = Math.max(1, Math.round(shownH * zz));
    const c = prev.getContext("2d");
    c.imageSmoothingEnabled = false;
    /*  Everything is measured up from the ground, and the canvas is only as
        tall as it is allowed to be — so when the scene overflows, what is lost
        is the top of the sky, never the ground the figures stand on. */
    const groundY = sceneH - ground - off;    // the ground never moves; the sky is what goes
    c.fillStyle = bg.sky; c.fillRect(0, 0, prev.width, Math.round(groundY * zz));
    c.fillStyle = bg.ground;
    c.fillRect(0, Math.round(groundY * zz), prev.width, prev.height);

    //  Centred in the column, standing on the ground line — the street again.
    const px0 = Math.round((PREV_COL - pw) / 2 * zz), py0 = Math.round((groundY - ph) * zz);
    const pxw = Math.round(pw * zz), pxh = Math.round(ph * zz);
    /*  LIT HERE TOO.

        Marking a window and then having to push the drawing to the street to
        find out whether it worked is not a preview, it is a round trip. Same
        function the Promenade uses, so what you see here is what will happen
        there — including the hour, which the sun in the sky sets.

        Cached against the layer's own content, because this runs on every
        repaint and reading a whole place back out of a canvas sixty times a
        second is real work. */
    const lit = litPlace(sc);
    c.drawImage(lit, 0, 0, lit.width, lit.height, px0, py0, pxw, pxh);

    /*  WHERE THE DRAWING'S EDGES ARE.

        A place taller than this window has its top cropped, the same way a
        place taller than the sky is cropped on the street. That is honest but
        it is not legible: a blank upper half looks like a blank upper half,
        not like a spire continuing past the frame.

        So the canvas's own bounds are outlined. Inside the window you can see
        how much of the box is empty; past the top the two side rules simply
        run off, which reads as "it keeps going" rather than "it stopped". */
    if (onion) {
      c.save();
      c.strokeStyle = "rgba(120,220,255,0.5)";
      c.lineWidth = 1;
      c.setLineDash([4, 3]);
      c.strokeRect(px0 + 0.5, py0 + 0.5, pxw - 1, pxh - 1);
      c.restore();
    }

    /*  `ghost` is the DOTTED BOUNDS, not the people.

        On a wear slot it shows what the layer has to sit with; here the
        equivalent is where the drawing's edges are — the box that tells you
        how much of that sky is empty and whether the top is being cropped.
        The bricklings are the scale reference and stay put: they are the
        reason to look at this box at all, and they go with it. */
    if (!onion) return;
    const f = playing ? Math.floor(tick / 9) % (fig.__frames || SPR_FRAMES) : 0;
    for (const at of [0.28, 0.5, 0.72]) {
      c.drawImage(fig, f * fw, 0, fw, fh,
                  Math.round((PREV_COL * at - fw / 2) * zz), Math.round((groundY - fh) * zz),
                  Math.round(fw * zz), Math.round(fh * zz));
    }
  }

  (function loop() {
    if (!host.isConnected) return;              // panel taken off the board
    if (playing) { tick++; if (tick % 9 === 0) drawPreview(); }
    host._spriteRAF = requestAnimationFrame(loop);
  })();

  /*  WORK IN PROGRESS.

      Everything else this editor writes is a finished thing: a PNG you
      downloaded, or one kept in the browser under the path the loader reads.
      There was nothing for the half-drawn coat you have to walk away from —
      close the panel and it was gone, which makes an unfinished drawing a
      thing you dare not leave.

      So the working layers are kept in the browser as you go. No button:
      a draft you have to remember to save is a draft you lose. It writes at
      most once a second, and only the rows you have actually drawn on — an
      untouched row is still whatever the file says it is, and storing a copy
      of that would only go stale when the file changed.

      Restoring marks those rows touched, which is what stops `openExisting`
      from loading the file over the top of them. That is the same rule the
      editor already uses for a row you have drawn on this session: a mark on
      the canvas outranks a file on disk. */
  const WIP_KEY = "brick-by-brick:wip:v1";
  let wipAt = 0;
  function saveWip() {
    try {
      const rows = {}, frames = {};
      for (const k of TARGETS) {
        if (!touched[k]) continue;
        rows[k] = layers[k].toDataURL("image/png");
        frames[k] = layers[k].__frames || SPR_FRAMES;
      }
      if (!Object.keys(rows).length) { localStorage.removeItem(WIP_KEY); return; }
      localStorage.setItem(WIP_KEY, JSON.stringify({
        name: nameIn.value, slot, at: Date.now(), rows, frames,
      }));
    } catch (e) { /* full, or unavailable — a draft is not worth an alert */ }
  }
  /*  Called from `paint`, which runs after every change there is; the delay is
      what keeps a stroke from writing the whole sheet out on every pixel. */
  host._wipQueue = () => {
    clearTimeout(wipAt);
    wipAt = setTimeout(saveWip, 900);
  };

  async function restoreWip() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(WIP_KEY) || "null"); } catch (e) { return false; }
    if (!d || !d.rows || !Object.keys(d.rows).length) return false;
    let got = 0;
    for (const k of TARGETS) {
      if (!d.rows[k]) continue;
      const img = await loadImg(d.rows[k]);
      if (!img || !host.isConnected) continue;
      blitInto(layers[k], img);
      layers[k].__frames = d.frames && d.frames[k] ? d.frames[k] : (k === "place" ? 1 : SPR_FRAMES);
      touched[k] = true;
      got++;
    }
    if (!got) return false;
    if (typeof d.name === "string") nameIn.value = d.name;
    if (TARGETS.includes(d.slot)) slot = d.slot;
    syncSize(); paint();
    const when = d.at ? new Date(d.at) : null;
    hint.textContent = "picked up where you left off"
      + (when ? " — " + when.toLocaleString() : "")
      + " \u00b7 download it when it is done, or press empty board to drop it";
    return true;
  }

  syncSize();
  drawParts();
  /*  The draft wins over the file. If there is nothing half-drawn, this falls
      through to the ordinary "open whatever exists for this name". */
  restoreWip().then(found => { if (!found && host.isConnected) openExisting(); });
  paint();
}

/* ==========================================================================
   THE MAP
   --------------------------------------------------------------------------
   MapLibre over the user's own PMTiles basemap:
   pmtiles://https://tiles.mbricknell.com/basemap.pmtiles — vector MVT, z0-9,
   Natural Earth layers (ocean, coastline_land, admin0_land, admin1_land,
   lakes, rivers).

   Both libraries load from a CDN, and only when the Map tile is actually on
   the board. Everything else on this page keeps working without them, and a
   page opened from file:// simply says the map needs a connection rather than
   failing silently.
   ========================================================================== */
const MAPLIBRE_JS  = "https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js";
const MAPLIBRE_CSS = "https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css";
const PMTILES_JS   = "https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js";
const BASEMAP      = "pmtiles://https://tiles.mbricknell.com/basemap.pmtiles";
const HILLSHADE    = "pmtiles://https://tiles.mbricknell.com/hs.pmtiles";
// MapLibre's own public demo style — no key, no pmtiles, works from a plain
// double-clicked file. Same "hosted vs local" test the manifest/gazetteer
// fetches already use: the custom basemap only when actually served over
// http(s), MapLibre's default everywhere else.
const DEMO_STYLE   = "https://demotiles.maplibre.org/style.json";
function isHostedContext() { return /^https?:$/.test(location.protocol); }

function loadOnce(url, isCss) {
  const key = (isCss ? "css:" : "js:") + url;
  loadOnce.cache = loadOnce.cache || {};
  if (loadOnce.cache[key]) return loadOnce.cache[key];
  loadOnce.cache[key] = new Promise((res, rej) => {
    const el = document.createElement(isCss ? "link" : "script");
    if (isCss) { el.rel = "stylesheet"; el.href = url; }
    else { el.src = url; el.async = true; }
    el.onload = res;
    el.onerror = () => rej(new Error("could not load " + url));
    document.head.appendChild(el);
  });
  return loadOnce.cache[key];
}

/*  The style is settings, and the settings are the style.

    Each row is one layer of the basemap: its color, whether it draws, and how
    heavy its line is. The panel edits this object and the style is rebuilt
    from it, so there is exactly one description of how the map looks — no
    chance of a control saying one thing while the map draws another.

    Ordered as they paint, bottom-up, which is also the order they are listed
    in the panel: ocean, then land, then everything drawn on the land. */
/*  Width belongs to lines; opacity belongs to everything. Kept as separate
    fields rather than one overloaded slider, because "how heavy" and "how
    present" are different questions and a layer often needs both answered —
    a hairline coastline at full strength, a broad admin line at a whisper. */
const MAP_LAYERS = [
  { key: "ocean",  label: "Ocean",     type: "fill", def: "#0d1317", opacity: 1 },
  // Raster, not terrain-DEM: hs.pmtiles holds pre-rendered WEBP shading, z0-8.
  // No color of its own to set.
  { key: "hillshade", label: "Hillshade", type: "raster", def: "#000000", opacity: 0.5 },
  // Below 1 by default: the hillshade is underneath it, and an opaque land
  // fill would hide the thing it is meant to show.
  { key: "land",   label: "Land",      type: "fill", def: "#1b2126", opacity: 0.75 },
  { key: "lakes",  label: "Lakes",     type: "fill", def: "#132029", opacity: 1 },
  { key: "rivers", label: "Rivers",    type: "line", def: "#22303a", width: 1,   opacity: 1 },
  { key: "admin1", label: "Regions",   type: "line", def: "#252d33", width: 0.5, opacity: 1 },
  { key: "admin0", label: "Countries", type: "line", def: "#2f383f", width: 0.8, opacity: 1 },
  { key: "coast",  label: "Coastline", type: "line", def: "#39434a", width: 1,   opacity: 1 },
];

/*  What can be on the map, and what color it is.

    A place brick is a place. An event brick becomes a mark too, but only when
    it names somewhere with coordinates — a birth with no location is still a
    fact, it just is not a point. Nothing is invented to fill the map.

    Color carries the KIND. Status moves to opacity, because a mark cannot say
    two things with one fill, and "what is this" is the question you ask of a
    map before "how sure are we". */
const MARK_KINDS = [
  { key: "place",    label: "Places",    def: "#7a8a99", glyph: "" },
  { key: "birth",    label: "Births",    def: "#4ade80", glyph: "👶" },
  { key: "death",    label: "Deaths",    def: "#f87171", glyph: "⚰️" },
  { key: "marriage", label: "Marriages", def: "#c084fc", glyph: "💒" },
];

const LABEL_GAP_DEFAULT = 8;
const MARKER_SIZE_DEFAULT = 11;

function defaultMapSettings() {
  const out = { labelGap: LABEL_GAP_DEFAULT, labelVet: true,
                markerSize: MARKER_SIZE_DEFAULT, marks: {} };
  for (const l of MAP_LAYERS) {
    out[l.key] = { color: l.def, on: true, width: l.width || 1,
                   opacity: l.opacity === undefined ? 1 : l.opacity };
  }
  for (const k of MARK_KINDS) out.marks[k.key] = { color: k.def, on: true };
  return out;
}

/*  Mark size and label spacing, both as CSS variables on the shell — so one
    assignment restyles every marker at once, rather than the renderer walking
    59 elements. One number each for the whole sheet, because consistent
    spacing is what makes a set of marks read as one map. */
function applyMarkerVars() {
  const shell = document.querySelector("#viz-map .map-shell");
  if (!shell) return;
  shell.style.setProperty("--mk", MAP_SETTINGS.markerSize + "px");
  shell.style.setProperty("--lbl", MAP_SETTINGS.labelGap + "px");
}
let MAP_SETTINGS = defaultMapSettings();

function loadMapSettings() {
  let raw;
  try { raw = JSON.parse(localStorage.getItem(MAPSTYLE_KEY) || "null"); } catch (e) { return; }
  if (!raw || typeof raw !== "object") return;
  // Read field by field: a settings file from an older version, or one with a
  // key that no longer exists, must degrade to the default rather than
  // handing MapLibre a color it cannot parse.
  const gap = Number(raw.labelGap);
  if (gap >= 2 && gap <= 30) MAP_SETTINGS.labelGap = gap;
  if (typeof raw.labelVet === "boolean") MAP_SETTINGS.labelVet = raw.labelVet;
  const mk = Number(raw.markerSize);
  if (mk >= 4 && mk <= 32) MAP_SETTINGS.markerSize = mk;
  if (raw.marks && typeof raw.marks === "object") {
    for (const k of MARK_KINDS) {
      const s = raw.marks[k.key];
      if (!s || typeof s !== "object") continue;
      if (/^#[0-9a-f]{6}$/i.test(s.color)) MAP_SETTINGS.marks[k.key].color = s.color;
      if (typeof s.on === "boolean") MAP_SETTINGS.marks[k.key].on = s.on;
    }
  }
  for (const l of MAP_LAYERS) {
    const s = raw[l.key];
    if (!s || typeof s !== "object") continue;
    if (/^#[0-9a-f]{6}$/i.test(s.color)) MAP_SETTINGS[l.key].color = s.color;
    if (typeof s.on === "boolean") MAP_SETTINGS[l.key].on = s.on;
    const w = Number(s.width);
    if (w > 0 && w <= 8) MAP_SETTINGS[l.key].width = w;
    const o = Number(s.opacity);
    // Zero is a legal opacity — a layer turned all the way down is not the
    // same as one switched off, and both are worth being able to say.
    if (o >= 0 && o <= 1) MAP_SETTINGS[l.key].opacity = o;
  }
}
function saveMapSettings() {
  try { localStorage.setItem(MAPSTYLE_KEY, JSON.stringify(MAP_SETTINGS)); } catch (e) { /* unavailable */ }
}

/*  Dark, quiet, and matched to the panel it sits in. Land and ocean separate
    by value rather than hue so the points are the only saturated thing on the
    map -- the data should be the figure, the basemap the ground. */
function basemapStyle(archive) {
  const S = MAP_SETTINGS;
  const vis = k => ({ visibility: S[k].on ? "visible" : "none" });
  // A different archive, the same cartography — which is the whole point of
  // pointing this at another .pmtiles: your design, someone else's extent.
  const url = archive ? (/^pmtiles:/.test(archive) ? archive : "pmtiles://" + archive) : BASEMAP;
  return {
    version: 8,
    glyphs: "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
    sources: {
      basemap: { type: "vector", url },
      // 512px WEBP, worldwide, z0-8 — declared always, drawn only when on.
      hillshade: { type: "raster", url: HILLSHADE, tileSize: 512, maxzoom: 8 },
    },
    /*  Paint order matters more than usual here.

        The hillshade sits directly above the background, under everything
        else. The land fill therefore has to let it through — which is what
        its opacity slider is for, and why it defaults below 1. Terrain read
        THROUGH the fill rather than laid over it: the shading tints the
        color instead of greying it.

        The ocean is drawn after both, so the sea stays clean. The shading
        covers the whole globe, and a relief-shaded ocean is the giveaway of a
        hillshade dropped in without thought. */
    layers: [
      /*  Order, bottom to top: background, ocean, hillshade, land.

          The `ocean` polygon is full-extent, not sea-minus-land — so it has to
          be painted BEFORE the land or it covers the whole map and nothing
          else is visible. Learned the hard way: putting it after the land to
          keep the sea unshaded blanked the entire basemap.

          The hillshade therefore sits above the ocean and below the land,
          which is what "terrain above the background" means here, and why the
          land fill is translucent — the relief reads up through it. */
      { id: "bg", type: "background", paint: { "background-color": S.ocean.color } },
      { id: "ocean", type: "fill", source: "basemap", "source-layer": "ocean",
        layout: vis("ocean"),
        paint: { "fill-color": S.ocean.color, "fill-opacity": S.ocean.opacity } },
      { id: "land", type: "fill", source: "basemap", "source-layer": "coastline_land",
        layout: vis("land"),
        paint: { "fill-color": S.land.color, "fill-opacity": S.land.opacity } },
      { id: "hillshade", type: "raster", source: "hillshade",
        layout: vis("hillshade"),
        paint: { "raster-opacity": S.hillshade.opacity, "raster-fade-duration": 0 } },
      { id: "lakes", type: "fill", source: "basemap", "source-layer": "ne_10m_lakes",
        layout: vis("lakes"),
        paint: { "fill-color": S.lakes.color, "fill-opacity": S.lakes.opacity } },
      { id: "rivers", type: "line", source: "basemap",
        "source-layer": "ne_10m_rivers_lake_centerlines", layout: vis("rivers"),
        /*  Width comes from the data, not from one number for every river.
            Natural Earth ships `strokeweig` on each centerline — its own
            cartographer's judgment of how big that river draws — so a trunk
            river is heavier than a burn without anything here deciding which
            is which. Multiplied by a zoom ramp and then by your slider, so the
            slider scales the whole family and keeps their relative weights.

            coalesce, because a centerline with no strokeweig should still
            draw; it just draws at the default weight. */
        paint: { "line-color": S.rivers.color, "line-opacity": S.rivers.opacity,
                 /*  The interpolate has to be outermost: `zoom` is only legal
                     as the direct input to a top-level step/interpolate, so
                     the multiply lives inside each stop rather than wrapping
                     the ramp.

                     Each stop also asks the feature whether it belongs at THAT
                     zoom — min_zoom is the other half of Natural Earth's own
                     cartography, holding back the burns until the map is close
                     enough to want them. A feature below its min_zoom gets
                     width 0, and because the stops interpolate it thickens in
                     rather than snapping on. Comparing against the stop's
                     literal zoom keeps `zoom` itself out of the expression,
                     which is what makes this legal at all. */
                 "line-width": ["interpolate", ["linear"], ["zoom"],
                   3, ["*", ["to-number", ["coalesce", ["get", "strokeweig"], 0.3]], 1.5 * S.rivers.width],
                   9, ["*", ["to-number", ["coalesce", ["get", "strokeweig"], 0.3]], 6 * S.rivers.width]] } },
      { id: "admin1", type: "line", source: "basemap", "source-layer": "admin1_land",
        layout: vis("admin1"),
        paint: { "line-color": S.admin1.color, "line-opacity": S.admin1.opacity,
                 "line-width": S.admin1.width } },
      { id: "admin0", type: "line", source: "basemap", "source-layer": "admin0_land",
        layout: vis("admin0"),
        paint: { "line-color": S.admin0.color, "line-opacity": S.admin0.opacity,
                 "line-width": S.admin0.width } },
      { id: "coast", type: "line", source: "basemap", "source-layer": "coastline_land",
        layout: vis("coast"),
        paint: { "line-color": S.coast.color, "line-opacity": S.coast.opacity,
                 "line-width": ["interpolate", ["linear"], ["zoom"], 2, 0.4 * S.coast.width, 9, 1.2 * S.coast.width] } },
    ],
  };
}

/* ==========================================================================
   PROJECT FILE — context on the basemap
   --------------------------------------------------------------------------
   Reads the Atlas project format as-is: `view`, `points`, `polys`,
   `annotations`. Same three tiers, composited bottom to top — basemap style,
   then the project file, then the bricks. Context is pure reference: it never
   enters the model, never becomes an entity, and the timeline never touches
   it. Your records and your reference stay separate things.

   Supported, and the divergences from the sandbox, stated rather than
   discovered:

     view       center, zoom, lock, basemap, hide, hideFeatures, insertBelow
     points     data[] with lng/lat/name/dir/style
     polys      data[] with geometry (Polygon | LineString) or source (a URL),
                style fill/stroke/dash, and per-entry insertBelow
     annotations  straight-arrow, curved-arrow, text-area

     NOT here:  refUid, because it addresses features in YOUR tiles by uid and
                this basemap has different source layers. pattern fills, which
                need a sprite this page does not carry. hillshade and inset.
                Each is ignored rather than treated as an error, so a file that
                uses them still draws everything else.
   ========================================================================== */
/*  A tile-service key — MapTiler, Stadia, whoever.

    Kept in this browser and NEVER written into a project file. A style URL
    stores the placeholder instead:

      https://api.maptiler.com/maps/streets-v2/style.json?key={key}

    so the file you hand someone, commit, or publish alongside the bricks
    carries no credential. The substitution happens at the moment the style is
    handed to MapLibre and nowhere else. A URL that has a real key typed into
    it still works — it is just then a URL you should not share. */
let TILE_KEY = "";

function loadTileKey() {
  try { TILE_KEY = localStorage.getItem(TILEKEY_KEY) || ""; } catch (e) { TILE_KEY = ""; }
}
function saveTileKey() {
  try {
    if (TILE_KEY) localStorage.setItem(TILEKEY_KEY, TILE_KEY);
    else localStorage.removeItem(TILEKEY_KEY);
  } catch (e) { /* unavailable */ }
}
function withKey(url) {
  return typeof url === "string" ? url.replace(/\{key\}/g, encodeURIComponent(TILE_KEY)) : url;
}

/*  A hosted basemap style — MapTiler, Stadia, your own.

    Deliberately NOT part of the project file. In the Atlas model the base
    style is tier one and the project file is tier three; they are different
    decisions. A project says what to draw ON a map, not which map. Keeping it
    out also means the same context can be dropped over any basemap. */
let STYLE_URL = "";

function loadStyleUrl() {
  try { STYLE_URL = localStorage.getItem(STYLEURL_KEY) || ""; } catch (e) { STYLE_URL = ""; }
}
function saveStyleUrl() {
  try {
    if (STYLE_URL) localStorage.setItem(STYLEURL_KEY, STYLE_URL);
    else localStorage.removeItem(STYLEURL_KEY);
  } catch (e) { /* unavailable */ }
}
function hostedStyle() {
  const v = STYLE_URL.trim();
  return /^https?:\/\//i.test(v) ? withKey(v) : null;
}

let MAP_PROJECT = "";

function loadProject() {
  try { MAP_PROJECT = localStorage.getItem(MAPPROJECT_KEY) || ""; }
  catch (e) { MAP_PROJECT = ""; }
}
function saveProject() {
  try {
    if (MAP_PROJECT) localStorage.setItem(MAPPROJECT_KEY, MAP_PROJECT);
    else localStorage.removeItem(MAPPROJECT_KEY);
  } catch (e) { /* unavailable */ }
}
function projectObject() {
  const v = MAP_PROJECT.trim();
  if (!v) return null;
  try {
    const p = JSON.parse(v);
    return p && typeof p === "object" ? p : null;
  } catch (e) { return null; }
}

const DASHES = { solid: null, dashed: [2, 2], dotted: [0.6, 1.6] };
const SVGNS = "http://www.w3.org/2000/svg";

/*  An arrowhead, in the arrow's own color.

    `fill="context-stroke"` would say that in one line, but only Firefox
    implements it — everywhere else the head silently vanishes, which is why
    arrows were drawing as plain lines. So each color gets its own marker,
    made once and reused, with the fill written out explicitly.

    markerUnits="strokeWidth" ties the head's size to the line's weight, so a
    heavier arrow gets a proportionate head instead of a pin on a plank. */
function arrowMarker(svg, color) {
  const id = "ah-" + String(color).replace(/[^a-z0-9]/gi, "") || "ah-default";
  let defs = svg.querySelector("defs");
  if (!defs) { defs = document.createElementNS(SVGNS, "defs"); svg.appendChild(defs); }
  if (!defs.querySelector('marker[id="' + id + '"]')) {
    const m = document.createElementNS(SVGNS, "marker");
    m.setAttribute("id", id);
    m.setAttribute("viewBox", "0 0 10 10");
    m.setAttribute("refX", "8"); m.setAttribute("refY", "5");
    m.setAttribute("markerWidth", "5"); m.setAttribute("markerHeight", "5");
    m.setAttribute("orient", "auto-start-reverse");
    m.setAttribute("markerUnits", "strokeWidth");
    const tip = document.createElementNS(SVGNS, "path");
    tip.setAttribute("d", "M 0 0 L 10 5 L 0 10 z");
    tip.setAttribute("fill", color);
    m.appendChild(tip);
    defs.appendChild(m);
  }
  return id;
}

// A style block from the file, read defensively — a missing key is a default,
// never a crash, because a project file is hand-written.
function paintLine(s) {
  const out = { "line-color": s.stroke || "#000", "line-width": num(s["stroke-width"], 1) };
  const dash = DASHES[s["stroke-dash"]];
  if (dash) out["line-dasharray"] = dash;
  if (s.opacity !== undefined) out["line-opacity"] = num(s.opacity, 1);
  return out;
}
function num(v, d) { const n = Number(v); return isFinite(n) ? n : d; }

/*  Everything the project adds is namespaced `proj-`, so tearing it down is a
    matter of dropping anything with that prefix. setStyle wipes sources and
    layers wholesale, so this runs again on every style load rather than
    trying to survive one. */
function clearProject(map) {
  for (const l of map.getStyle().layers || []) {
    if (l.id.startsWith("proj-")) map.removeLayer(l.id);
  }
  for (const id of Object.keys(map.getStyle().sources || {})) {
    if (id.startsWith("proj-")) map.removeSource(id);
  }
}

function applyProjectLayers(map, p) {
  if (!p) return;
  const view = p.view || {};

  // view.basemap:false hides the drawn basemap but keeps the background, so
  // the ground color still comes from your style rather than going white.
  if (view.basemap === false) {
    for (const l of map.getStyle().layers || []) {
      if (l.type !== "background" && !l.id.startsWith("proj-")) {
        map.setLayoutProperty(l.id, "visibility", "none");
      }
    }
  }
  for (const id of view.hide || []) {
    if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", "none");
  }
  for (const hf of view.hideFeatures || []) {
    if (!hf || !map.getLayer(hf.layer)) continue;
    // "hide these values" is the negation of a match, which is how the
    // sandbox reads it: everything EXCEPT the listed features stays.
    map.setFilter(hf.layer, ["!", ["in", ["get", hf.property], ["literal", hf.values || []]]]);
  }

  const below = view.insertBelow || {};
  const under = (want) => (want && map.getLayer(want) ? want : undefined);

  if (p.polys && p.polys.show !== false) {
    (p.polys.data || []).forEach((entry, i) => {
      if (!entry || (!entry.geometry && !entry.source)) return;   // refUid: not here
      const id = "proj-poly-" + i;
      const data = entry.source
        ? entry.source
        : { type: "Feature", geometry: entry.geometry, properties: {} };
      map.addSource(id, { type: "geojson", data });
      const s = entry.style || {};
      const at = under(entry.insertBelow || below.polys);
      const isLine = entry.geometry && /LineString/.test(entry.geometry.type);
      if (!isLine && s.fill && s.fill !== "none") {
        map.addLayer({ id: id + "-fill", type: "fill", source: id,
          paint: { "fill-color": s.fill, "fill-opacity": num(s["fill-opacity"], 0.4) } }, at);
      }
      if (s.stroke && s.stroke !== "none") {
        map.addLayer({ id: id + "-line", type: "line", source: id,
          layout: { "line-join": s["line-join"] || "miter" },
          paint: paintLine(s) }, at);
      }
    });
  }
}

/*  Points and annotations are DOM, not style layers.

    Deliberate: the sandbox draws point labels with a symbol layer and a named
    font, and this page's glyph endpoint has two fonts in it. A DOM mark needs
    no glyph server, gets the same eight-way label placement the bricks use,
    and survives setStyle without being rebuilt. The cost is that
    view.insertBelow cannot put an annotation under a basemap layer — they are
    always above. That is the one place this diverges visibly. */
const DIR_TO_POS = {
  N: "top", S: "bottom", E: "right", W: "left",
  NE: "topright", NW: "topleft", SE: "bottomright", SW: "bottomleft",
};

/*  The escape hatch: a hand-edited style file.

    The controls cover the seven layers this basemap has. When you want
    something they cannot express, edit the style file itself and apply it —
    it then outranks both the controls and the source dropdown until cleared.
    It is an ordinary MapLibre style, the same JSON you would put in a
    style.json, and the editor starts from whatever the map is drawing now. */
let MAP_STYLE_OVERRIDE = "";

function loadStyleOverride() {
  try { MAP_STYLE_OVERRIDE = localStorage.getItem(MAPOVERRIDE_KEY) || ""; }
  catch (e) { MAP_STYLE_OVERRIDE = ""; }
}
function saveStyleOverride() {
  try {
    if (MAP_STYLE_OVERRIDE) localStorage.setItem(MAPOVERRIDE_KEY, MAP_STYLE_OVERRIDE);
    else localStorage.removeItem(MAPOVERRIDE_KEY);
  } catch (e) { /* unavailable */ }
}
/*  The parsed style, or null when there is nothing usable. Null is the signal
    to fall back to the dropdown's choice — a style file with a typo in it must
    never leave the map with nothing to draw. */
function overrideStyle() {
  const v = MAP_STYLE_OVERRIDE.trim();
  if (!v) return null;
  try {
    const s = JSON.parse(v);
    return s && typeof s === "object" && Array.isArray(s.layers) ? s : null;
  } catch (e) { return null; }
}

// Places in the current view that can actually be drawn.
function placeFeatures(model) {
  return (model.places || []).filter(p => p.coords).map(p => ({
    type: "Feature",
    geometry: { type: "Point", coordinates: [p.coords.lng, p.coords.lat] },
    properties: {
      slug: p.slug, name: p.name,
      status: p.status || "draft",
      refs: p.refs,
      detail: p.detail || "",
      labelPos: LABEL_POS.get(p.slug) || "",   // "" = follow the map default
      icon: MARKER_ICON.get(p.slug) || "",     // "" = the plain status dot
    },
  }));
}

/*  Which places are connected, and why.

    Two readings of "referenced together", both drawn:

    1. Direct — one record names both places. Rare in this corpus but the
       strongest claim, because the author wrote it down.
    2. Through a person — a census in one parish and a marriage in another,
       naming the same man. No single brick says these two places are related;
       the pile does, and that is the whole point of the notation.

    Undirected: a line between two parishes has no arrow, since the records
    give an association, never a direction of travel. Pairs are keyed on the
    sorted slugs so A-B and B-A are one line carrying a weight, not two lines
    overdrawn.

    Only places that can be drawn take part — an ungeocoded place is silently
    not a node here, exactly as it is silently not a marker. */
function placeLinks(model) {
  const coord = new Map();
  for (const p of model.places || []) {
    if (p.coords) coord.set(p.slug, [p.coords.lng, p.coords.lat]);
  }
  if (coord.size < 2) return [];

  const pairs = new Map();
  const add = (a, b, via) => {
    if (a === b) return;
    const [lo, hi] = a < b ? [a, b] : [b, a];
    const key = lo + "|" + hi;
    let e = pairs.get(key);
    if (!e) pairs.set(key, e = { a: lo, b: hi, via: new Set(), weight: 0, direct: false });
    e.weight++;
    if (via) e.via.add(via); else e.direct = true;
  };

  const reach = new Map();   // non-place uid -> places it is named alongside
  for (const b of model.records || []) {
    if (!b.valid) continue;
    const named = [b.alias ? b.alias.slug : null, ...b.links].filter(Boolean);
    const here = named.filter(s => coord.has(s));
    if (!here.length) continue;
    for (let i = 0; i < here.length; i++) {
      for (let j = i + 1; j < here.length; j++) add(here[i], here[j], null);
    }
    for (const other of named) {
      if (coord.has(other)) continue;
      let set = reach.get(other);
      if (!set) reach.set(other, set = new Set());
      for (const p of here) set.add(p);
    }
  }
  for (const [who, set] of reach) {
    const list = [...set];
    for (let i = 0; i < list.length; i++) {
      for (let j = i + 1; j < list.length; j++) add(list[i], list[j], who);
    }
  }

  return [...pairs.values()].map(e => ({
    a: e.a, b: e.b, weight: e.weight, direct: e.direct, via: [...e.via],
    from: coord.get(e.a), to: coord.get(e.b),
  }));
}

/*  Everything the map draws: the places, plus any event that names a place
    with coordinates.

    An event has no coordinates of its own — it borrows them from the place it
    names, which is the honest reading of "@george,longforgan": the record says
    this happened at Longforgan, not at some point 40 meters east of it. Two
    events at one parish therefore sit on the same point, and that is correct;
    they are the same place.

    Toggling a kind off here is a MAP decision, not a filter — the pile is
    untouched and every other panel still shows the record. */
function markFeatures(model) {
  const out = [];
  if (MAP_SETTINGS.marks.place.on) {
    for (const f of placeFeatures(model)) {
      f.properties.mark = "place";
      out.push(f);
    }
  }
  const byId = new Map((model.entities || []).map(e => [e.slug, e]));
  for (const b of model.events || []) {
    const kind = MARK_KINDS.find(k => k.key === b.type);
    if (!kind || kind.key === "place" || !MAP_SETTINGS.marks[kind.key].on) continue;
    const links = (b.links || []).map(s => byId.get(s)).filter(Boolean);
    const where = links.filter(e => e.kind === "place" && e.coords);
    if (!where.length) continue;   // a dateline with no location is not a point
    const who = links.filter(e => e.kind === "person");
    const year = b.date && /^\d{4}/.test(b.date) ? b.date.slice(0, 4) : "";
    // Named for whoever it happened to — the place already has its own label,
    // and repeating it here would just be the same word twice on one dot.
    const name = [who.map(p => p.name).join(" & "), year].filter(Boolean).join(" ") ||
                 kind.label;
    for (const p of where) {
      out.push({
        type: "Feature",
        geometry: { type: "Point", coordinates: [p.coords.lng, p.coords.lat] },
        properties: {
          mark: kind.key,
          slug: (who[0] && who[0].slug) || p.slug,
          name, status: b.status || "draft", refs: 0, detail: "",
          labelPos: "", icon: kind.glyph,
        },
      });
    }
  }
  return out;
}

function renderMap(model, host) {
  const fc = { type: "FeatureCollection", features: placeFeatures(model) };

  // Already running: just push new data in. This is the whole reason a slot
  // owns its element.
  if (host._map) {
    if (host._syncMarkers) host._syncMarkers();
    else updateMapCount(host, fc.features.length, model);
    return;
  }
  if (host._starting) return;
  host._starting = true;

  host.innerHTML = '<div class="map-shell">' +
      '<div class="map-canvas"></div>' +
      '<select class="map-source">' +
        '<option value="custom">My tiles</option>' +
        '<option value="demo">MapLibre</option>' +
      "</select>" +
      '<div class="map-where"></div>' +
      '<div class="map-note">loading basemap…</div>' +
      '<div class="map-attrib"></div>' +
    "</div>";
  const canvas = host.querySelector(".map-canvas");
  const note = host.querySelector(".map-note");

  const attribEl = host.querySelector(".map-attrib");

  const hosted = isHostedContext();
  // Always load pmtiles, not just when hosted -- the dropdown lets you TRY the
  // custom source from anywhere (e.g. picking "Your tiles" while opened from
  // file://), not only in whatever context happened to be guessed at start.
  const toLoad = [loadOnce(MAPLIBRE_CSS, true), loadOnce(MAPLIBRE_JS), loadOnce(PMTILES_JS)];

  Promise.all(toLoad)
    .then(() => {
      // One protocol registration per page, not per panel.
      if (!window.__pmtilesReady) {
        const protocol = new window.pmtiles.Protocol();
        window.maplibregl.addProtocol("pmtiles", protocol.tile);
        window.__pmtilesReady = true;
      }
      // Your last choice wins, and only falls back to the context guess when
      // you have never made one. Decided BEFORE the map is built so a
      // remembered preference is the first style loaded, not a second one
      // swapped in a frame later.
      const startMode = loadMapSource() || (hosted ? "custom" : "demo");
      const map = new window.maplibregl.Map({
        container: canvas,
        // An applied override, then a project's own basemap, then the
        // dropdown — the same order applyStyle uses, from the first frame.
        style: overrideStyle() || hostedStyle() ||
               (startMode === "demo" ? DEMO_STYLE : basemapStyle()),
        center: [-3.4, 56.4],
        zoom: 7,
        attributionControl: false,
        // Default false clears the WebGL buffer right after each paint, which
        // is invisible to the eye but means any screenshot/screen-recording
        // tool grabs a blank frame even though the map is drawing correctly.
        preserveDrawingBuffer: true,
      });

      map.addControl(new window.maplibregl.NavigationControl({ showCompass: false }), "top-right");

      // 'style.load' fires after the INITIAL style AND after any later
      // setStyle() call, so the same function adds the places layers whether
      // this is the first load or a fallback swap — one place, not two.
      //
      // Recomputed HERE rather than using the `fc` closed over when renderMap
      // was first called: script loading (MapLibre + PMTiles, ~1-2s) means an
      // edit made in the Gazetteer panel while the map is still starting hits
      // the "still starting, do nothing" branch below and would otherwise be
      // silently lost — the map would open already stale, with no further
      // update due until some unrelated later edit happened to trigger one.
      /*  DOM markers, not a GeoJSON source with circle layers.

          The source approach kept failing in ways that were slow to see: the
          data went in (`_data` held the feature) but MapLibre never tiled it,
          so `querySourceFeatures` returned 0 and nothing drew. setStyle() also
          wipes sources and layers, so every basemap switch needed them rebuilt,
          and 'style.load' does not fire reliably across quick successive swaps.

          A Marker is a plain DOM element positioned by the map. It survives
          setStyle untouched, needs no source, no tiling and no style to be
          loaded, and appears the instant it is added. For a few dozen places
          that is strictly better, and it removes the whole class of bug. */
      host._markers = [];
      // Declared ABOVE syncMarkers, which reads it — a `let` further down would
      // work on the first call and throw on every one after.
      // The default a place falls back to; per-place overrides live in the
      // Gazetteer, which is where the rest of a place's display settings are.
      const labelPlacement = "bottom";

      /*  Connections as an SVG overlay, projected from lng/lat — the same

          layer is wiped by every setStyle and can silently fail to tile; an
          SVG line cannot fail to draw, and re-projecting on move keeps it
          registered with the basemap under it.

          Declared ABOVE syncMarkers because syncMarkers calls it, and it runs
          once immediately — a const further down would throw on the first
          call and work on every one after, which is the worst kind of bug. */
      const linkSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      linkSvg.setAttribute("class", "map-links");
      canvas.appendChild(linkSvg);
      let linkLines = [];

      const drawLinks = () => {
        for (const l of linkLines) {
          const p = map.project(l.from), q = map.project(l.to);
          for (const el of l.els) {
            el.setAttribute("x1", p.x); el.setAttribute("y1", p.y);

        }
      };

        const links = placeLinks(V());
        linkSvg.textContent = "";
        linkLines = links.map(l => {
          // Weight is how many records assert the pair, so a well-evidenced
          // connection is heavier — capped, or one busy pair drowns the rest.
          const w = Math.min(3, 1.1 + l.weight * 0.3);
          const line = cls => {
            const ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
            ln.setAttribute("class", cls);
            linkSvg.appendChild(ln);
            return ln;
          };
          // Casing first so the colored line paints on top of it.
          const casing = line("map-link-case");
          casing.setAttribute("stroke-width", (w + 2).toFixed(2));
          // Direct beats inferred: if any record names both places outright,
          // the line is drawn as the stronger of the two claims.
          const ln = line("map-link" + (l.direct ? "" : " via"));
          ln.setAttribute("stroke-width", w.toFixed(2));
          return { els: [casing, ln], from: l.from, to: l.to };
        });
        drawLinks();
        return linkLines.length;
      };
      map.on("move", drawLinks);
      map.on("resize", drawLinks);

      /*  Where you are, in the numbers a project file wants.

          Zoom to two places and the bounding box in west, south, east, north
          order — the same order `view.bbox` takes, so what you read here can
          be typed straight into a file without reshuffling it. Click it to
          copy. Six decimal places is about 10cm, which is past the accuracy of
          anything a parish register will ever give you. */
      const whereEl = host.querySelector(".map-where");
      const showWhere = () => {
        const b = map.getBounds(), c = map.getCenter();
        const f = n => n.toFixed(4);
        whereEl.dataset.bbox = "[" + [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()]
          .map(n => +n.toFixed(6)).join(", ") + "]";
        whereEl.dataset.center = "[" + [+c.lng.toFixed(6), +c.lat.toFixed(6)].join(", ") + "]";
        whereEl.textContent = "z" + map.getZoom().toFixed(2) + "  " +
          f(b.getWest()) + ", " + f(b.getSouth()) + " → " + f(b.getEast()) + ", " + f(b.getNorth());
      };
      whereEl.onclick = () => {

                     ', "zoom": ' + map.getZoom().toFixed(2) +
                     ', "bbox": ' + whereEl.dataset.bbox;

        whereEl.classList.add("copied");
        setTimeout(() => whereEl.classList.remove("copied"), 700);
      };
      map.on("move", showWhere);
      showWhere();

      /*  Label vetting — the oldest rule in the trade: two names may not
          occupy the same ink. Greedy placement in priority order, which is
          what a hand-drawn sheet does and what every automated placer still
          falls back to.

          Priority is the map's own hierarchy, not the DOM order:
            1. verified before draft — a confirmed place outranks a guess
            2. more references before fewer — the busier the place in the
               records, the more the reader needs its name
            3. alphabetical last, purely so the outcome is STABLE. Without a
               deterministic tiebreak the same two colliding labels trade
               places every redraw and the map flickers as you pan.

          Run on settle, not per frame: 59 getBoundingClientRect calls during a
          pan would be a layout thrash for no gain, and labels holding their
          last state mid-drag is invisible to the eye. */
      const LABEL_PAD = 2;   // a hair of air, or neighbors read as one word

      /*  Where a name goes when you have not said. Imhof's order, and the same
          one every automatic placer since has used: upper right first, because
          that is where the eye arrives after reading the mark; then the other
          corners; then the sides; and the stacked positions last, since a name
          directly above or below a dot is the hardest to tie back to it when
          marks are close together. */
      const AUTO_ORDER = ["topright", "topleft", "bottomright", "bottomleft",
                          "right", "left", "top", "bottom"];

      const setPos = (dot, pos) => {
        for (const p of LABEL_CHOICES) dot.classList.remove("lbl-" + p);
        dot.classList.add("lbl-" + pos);
      };

      const declutter = () => {
        const box = canvas.getBoundingClientRect();
        const items = [];
        for (const m of host._markers) {
          const dot = m.getElement();
          const label = dot.querySelector(".map-marker-label");
          if (!label) continue;
          label.classList.remove("suppressed");
          const fixed = dot.dataset.pos || "";   // "" means: you decide
          if (fixed === "none") continue;
          if (!MAP_SETTINGS.labelVet) {
            // Nothing is being avoided, so an auto label has no reason to
            // prefer one side; it takes the map's plain default and shows.
