        const wx = c.x + (x0 - img.width / 2) * sc;
        const wy = groundY() + (y0 - img.height) * sc;
        const ww = (x1 - x0 + 1) * sc, wh = (y1 - y0 + 1) * sc;
        const hot = new P.Graphics();
        //  Lamplight through the doorway, drawn once and shown by alpha.
        hot.beginFill(0xffdda3).drawRect(wx, wy, ww, wh).endFill();
        hot.alpha = 0;
        hot.eventMode = "static";
        hot.cursor = "pointer";
        /*  WHAT YOU CAN HIT IS BIGGER THAN WHAT LIGHTS.

            A door drawn six pixels wide on a building shrunk to fit its column
            is a six pixel target, and asking for that with a mouse on a street
            you can also pan is not a control. So the box is padded out to
            something a hand can find, centred on the doorway so it still
            belongs to the door it opens, while the light stays the shape you
            actually drew. */
        const hitW = Math.max(16 * Z, ww), hitH = Math.max(18 * Z, wh);
        hot.hitArea = new P.Rectangle(wx + ww / 2 - hitW / 2,
                                      wy + wh / 2 - hitH / 2, hitW, hitH);

        let over = false, rapping = false;
        //  Whatever it should look like when nothing is happening to it.
        const rest = () => {
          if (hot.destroyed) return;
          hot.alpha = over && !rapping ? 0.14 : 0;
        };
        /*  ONE FLASH PER PRESS, to match the one rap it makes. Press twice and
            the gesture produces the knock; the door does not perform one at
            you for a single click.

            Timed rather than tweened because it is two alpha writes over a
            tenth of a second, and a ticker handler for that would outlive the
            scene it belongs to. It checks the node is still alive, since a
            rebuild can land mid-rap. */
        const knock = () => {
          rapping = true;
          hot.alpha = 0.42;
          setTimeout(() => {
            if (hot.destroyed) return;
            rapping = false;
            rest();
          }, 90);
        };
        hot.on("pointerover", () => { over = true; rest(); });
        hot.on("pointerout", () => { over = false; rest(); });

        /*  Pixi has no double-click, so it is two taps inside a window. 450ms
            rather than the platform's own 500: this is a deliberate gesture on
            a small target, not a text selection. */
        let lastTap = 0;
        //  Stopped here, or the same press also reaches the column underneath
        //  and focuses it, which is a second thing happening for one gesture.
        hot.on("pointertap", ev => {
          if (ev && ev.stopPropagation) ev.stopPropagation();
          /*  Every press raps, including the one that opens. Two presses are
              therefore two raps and a door that answers, which is the whole
              gesture and needs no separate flourish. */
          knock();
          knockSound();
          const now = performance.now();
          if (now - lastTap < 450) {
            lastTap = 0;
            host._openDoor(c.slug);
            return;
          }
          lastTap = now;
        });
        host._doorLayer.addChild(hot);
      }
    };
    for (const c of columns) {
      if (!c.slug) continue;
      const got = sceneImage(c.slug);
      if (!got) continue;                     // known to have none
      if (got instanceof Promise) {
        /*  A picture that lands after the scene was built needs one more pass:
            the ribbon over that column was placed at head height because there
            was no roof to measure yet, and it should be sitting on this. Same
            debounce the costumes use, so a folder full of scenery causes one
            redraw rather than one each. */
        got.then(img => { place(c, img); if (img) costumeArrived(); });
      } else place(c, got);
    }
  }

  /*  WHICH COLUMN EACH PERSON IS ACTUALLY IN.

      Three answers folded into one, so nothing downstream has to remember the
      precedence: what you pinned, then what their records say, then the
      Promenade. Absence is no longer a fourth answer meaning "the pen" — the
      pen is a pin like any other now.

      A person whose records place them somewhere is left to their records:
      colOf returns the pin only when there is one, and the caller falls back
      to the geography it worked out earlier. */
  const colOf = uid => {
    const pinned = host._pinned.get(uid);
    if (pinned !== undefined) return pinned;
    return (whereByPerson.get(uid) || new Set()).size ? null : PROMENADE;
  };
  /*  Everyone in each column, in cast order, so a rank is stable between
      renders and two people in one column never land on the same spot. */
  const roster = new Map();
  for (const p2 of people) {
    const c = colOf(p2.slug);
    if (c === null || c === PEN_SLUG) continue;
    if (!roster.has(c)) roster.set(c, []);
    roster.get(c).push(p2.slug);
  }

  host._signs = [];
  const signLayer = new P.Container();
  signLayer.alpha = host._signLayer ? host._signLayer.alpha : (GRID ? 0 : 1);
  world.addChild(signLayer);
  host._signLayer = signLayer;

  /*  THE NOTES.

      In the sign layer, so they come and go with the signposts — a caption on
      a street is part of the street, and on the grid there is no street for it
      to be a caption on.

      Not parented to the sign itself: the sign can be dragged up and down, and
      a note is about the column rather than about where you happened to put
      its board. */
  for (const c of columns) {
    const note = COL_NOTE.get(c.slug);
    if (!note) continue;
    /*  WRAPPED TO THE COLUMN, NOT SHRUNK TO IT.

        A long line used to be scaled down until it fitted, which is how you
        get a caption nobody can read — the longer the thing you had to say,
        the smaller it was written. Wrapping keeps the type one size and lets
        the note grow downward, which is the direction there is room in. */
    const room = Math.max(40, (wOf.get(c.slug) || STEP) - 8 * Z);
    for (const at of ["above", "below"]) {
      const text = note[at];
      if (!text) continue;
      const n = new P.Text(text, {
        fontFamily: "ui-monospace, Menlo, monospace",
        fontSize: 7 * Z, fill: 0xbfae92,
        align: "center", wordWrap: true, wordWrapWidth: room,
        lineHeight: 9 * Z,
      });
      n.resolution = 2;
      /*  Both grow AWAY from the street. The one above is anchored at its
          foot so extra lines climb into the sky; the one below is anchored at
          its head so they run down into the ground band. Anchored the other
          way round, a second line would walk into the scene. */
      n.anchor.set(0.5, at === "below" ? 0 : 1);
      n.x = c.x;
      /*  Above: clear of the tallest thing a column has, its signpost.

          Below: ON the ground, which is a narrower target than it sounds. The
          band is the bottom 28% of the panel — about sixty pixels — and it has
          to hold the walkers' own name labels (4 units under their feet) and
          then this. Pushed down far enough to clear those names, a note of any
          length hangs off the bottom edge of the panel entirely.

          So it starts below the names and is then pulled back up by however
          much it overhangs, which puts the LAST line on the ground rather than
          the first. A long note ends up snug under the names; a short one sits
          where it was put. */
      /*  A STARTING POSITION, NOT A LAYOUT.

          Three things want the strip under the ground line — a walker's name,
          a signpost brought down to the street, and this — and they arrive
          from three different places at three different times. Every rule for
          arranging them automatically was right for one scene and wrong for
          the next, because which of them is even present depends on what you
          have drawn and where you have put it.

          So each one opens somewhere sensible and is then dragged where it
          belongs. You can see the scene; the arithmetic cannot. */
      const home = () => (at === "below" ? groundY() + 18 * Z : groundY() - 62 * Z);
      /*  UP AND DOWN ONLY. A note is centred on its column and stays there —
          sideways it drifts off the place it is about and onto the next one,
          and there is nothing sideways can say that is worth that. */
      const dy = (at === "below" ? note.by : note.ay) || 0;
      n.x = c.x;
      n.y = home() + dy * Z;

      n.eventMode = "static";
      n.cursor = "ns-resize";      // says which way it goes before you try it
      /*  Its own target, a little bigger than the type. These are seven pixels
          tall and the anchor is at the foot or the head, so the box has to be
          placed by hand rather than left to the default. */
      n.hitArea = new P.Rectangle(-n.width / 2 - 4,
                                  at === "below" ? -4 : -n.height - 4,
                                  n.width + 8, n.height + 8);
      let px = null, py = null, fy = 0, went = false;
      n.on("pointerdown", ev => {
        px = ev.global.x; py = ev.global.y;
        fy = (at === "below" ? note.by : note.ay) || 0;
        went = false;
        host._dragging = true;          // the street does not pan underneath
        n.cursor = "ns-resize";
      });
      n.on("globalpointermove", ev => {
        if (px === null) return;
        const mx = ev.global.x - px, my = ev.global.y - py;
        if (!went && Math.abs(mx) + Math.abs(my) < 4) return;
        went = true;
        n.y = home() + fy * Z + my;     // x never moves
        n.alpha = 0.8;
      });
      const letGo = () => {
        if (px === null) return;
        px = py = null;
        n.alpha = 1;
        n.cursor = "ns-resize";
        host._dragging = false;
        if (!went) return;
        //  World units off where it opened, so it survives a zoom and a resize
        //  exactly as a sign's height does.
        const ry = Math.round(((n.y - home()) / Z) * 10) / 10;
        const cur = COL_NOTE.get(c.slug);
        if (!cur) return;
        if (at === "below") cur.by = ry; else cur.ay = ry;
        saveColNotes();
      };
      n.on("pointerup", letGo);
      n.on("pointerupoutside", letGo);
      /*  Right-click puts it back where it opened — the same erase as a guide,
          a measurement, an anchor pixel and a signpost's height. */
      n.on("rightdown", ev => {
        if (ev && ev.preventDefault) ev.preventDefault();
        const cur = COL_NOTE.get(c.slug);
        if (!cur) return;
        if (at === "below") cur.by = 0; else cur.ay = 0;
        saveColNotes();
        n.y = home();
      });
      signLayer.addChild(n);
    }
  }
  for (const [slug] of placed) {
    /*  A POST IS A PLACE. A SIGN IN THE SKY IS AN IDEA.

        A signpost is planted in the ground, and what it says is "this ground,
        here, is Longforgan" — which is only true of somewhere a record puts on
        a map. A household, a theory, a maybe: those are not ground. Giving
        them posts said they were places, and the whole point of a group is
        that it is the arrangement you made rather than one the records did.

        So the post is reserved for places, and everything you invented — every
        group, and The Promenade itself — is named by a banner hanging in the
        sky over the width it occupies. It reads as a region rather than a
        point, which is what it is. */
    const grp = slug ? groupNameOf(slug) : "The Promenade";
    const e = grp ? null : (model.entities || []).find(x => x.slug === slug);
    const x = xOf.get(slug);
    const sign = new P.Container();
    const t = label(grp || (e ? e.name : slug), 9 * Z, grp ? 0xc9a877 : 0xe8dcc4);
    t.resolution = 2;
    t.anchor.set(0.5, 0);

    if (grp) {
      /*  A banner across the column, up where nothing else is: the sky above
          the horizon is empty apart from the occasional balloon, and a label
          up there cannot be buried by a crowd the way a post can.

          It spans the column rather than the word, because the column is the
          extent of what it is naming — a place is a point and a group is an
          area, and the sign should be able to say which it is without being
          read. */
      const colW = wOf.get(slug) || STEP;
      const wide = Math.min(colW - 10 * Z, Math.max(t.width + 26 * Z, 58 * Z));
      /*  A RIBBON.

          Four parts, and it stops reading as cloth if any of them is missing:

            the TAILS   flare out past each end and hang LOWER than the band,
                        deeply swallow-tailed at their outer edge, and darker
                        because they have turned away from the light
            the FOLDS   a small dark wedge under each end of the band — the
                        turn-back, and the only thing that says this is one
                        strip of cloth rather than three pieces laid out in a
                        row
            the BAND    the panel the name sits on, in front of both, and
                        ARCED: a straight band is a plank, and cloth strung
                        between two points does not hang straight
            the LIGHT   one lit pixel along the top edge

          The first attempt cut the swallowtail into the band itself, which
          makes a pennant. The notch belongs on the tail. */
      const hh = t.height + 7;                             // the band's depth
      const arc = hh * 0.42;                               // how much it bows up
      const tw = Math.min(17 * Z, wide * 0.26);            // how far a tail runs out
      const notch = tw * 0.55;                             // and how deep the V bites
      const col = ribbonOf(slug);
      const face = hexInt(col);
      const tailCol = shadeInt(col, -0.20);
      const fold = shadeInt(col, -0.46);
      const half = wide / 2;
      // The bow, as a fraction of the way out from the middle.
      const bow = x => arc * (1 - Math.pow((2 * x) / wide, 2));

      /*  IT SITS ON THE SKYLINE, NOT AT A FIXED HEIGHT.

          The ribbon hangs just clear of whatever this column has standing in
          it, so it reads as a banner strung above that roof rather than as a
          label floating at an altitude somebody picked. A tall building pushes
          it up; a column with nothing in it keeps it just over the heads.

          Measured to the ribbon's BOTTOM — tails included — because that is
          the edge that has to clear the roof. The band itself is then a whole
          ribbon further up.

          `sceneArtTop` answers null while a picture is still loading, so the
          first render of a column places the ribbon at head height and the
          re-render that the picture triggers lifts it onto the roof. */
      const roof = sceneArtTop(slug);
      const drop = hh * 1.39 + arc;            // band, tails and bow together
      const clear = Math.max(52 * Z, (roof || 0) + 9 * Z);
      const bandY = -Math.min(clear + drop, H() * 0.9);

      const band = new P.Graphics();

      // --- tails, behind everything
      /*  Named rather than inlined, because the fold below has to END on the
          tail's lower inner corner. Two copies of that arithmetic is how the
          wedge and the tail came apart in the first place. */
      const tailTop = bandY + hh * 0.18;
      const tailH = hh * 1.05;
      const tailDrop = hh * 0.16;
      const tailInnerBot = tailTop + tailH * 0.86;    // the bottom tooth
      const tailAt = dir => [
        dir * half, tailTop,
        dir * (half + tw), tailTop + tailDrop,
        dir * (half + tw - notch), tailTop + tailDrop + tailH / 2,
        dir * (half + tw), tailTop + tailDrop + tailH,
        dir * half, tailInnerBot,
      ];
      band.beginFill(tailCol, 0.95);
      band.drawPolygon(tailAt(-1));
      band.drawPolygon(tailAt(1));
      band.endFill();

      /*  --- the turn-back under each end

          It opens OUTWARD, over the tail, not inward under the band: the cloth
          goes behind the band and comes out the far side, so the wedge belongs
          on the tail's side of the end. Drawn the other way round it pointed
          back under the band and read as a bite taken out of it.

          Its lower corner is the tail's own bottom tooth — the same number,
          not a similar one — so the two shapes meet on a line instead of
          leaving a notch of sky between them. */
      band.beginFill(fold, 0.95);
      for (const dir of [-1, 1]) {
        const xEnd = dir * half;
        band.drawPolygon([
          xEnd, bandY + hh,                       // where the band's bottom ends
          xEnd + dir * tw * 0.5, bandY + hh,      // outward, across the tail
          xEnd, tailInnerBot,                     // down to the tail's bottom tooth
        ]);
      }
      band.endFill();

      // --- the band, arced, in front of both
      const top = [], bot = [];
      const STEPS = 16;
      for (let i = 0; i <= STEPS; i++) {
        const x = -half + (wide * i) / STEPS;
        top.push(x, bandY - bow(x));
        bot.unshift(x, bandY + hh - bow(x) * 0.55);
      }
      band.beginFill(face, 0.95).drawPolygon(top.concat(bot)).endFill();
      // A lit top edge, so it reads as cloth catching the light from above.
      band.lineStyle(1, shadeInt(col, 0.26), 0.95);
      for (let i = 0; i <= STEPS; i++) {
        const x = -half + (wide * i) / STEPS;
        if (i) band.lineTo(x, bandY - bow(x)); else band.moveTo(x, bandY - bow(x));
      }
      band.lineStyle(0);

      /*  THE NAME FOLLOWS THE CLOTH.

          Straight lettering on a bowed band reads as a label stuck onto a
          ribbon rather than as something printed on one — the band curves away
          from the word at both ends and the gap does the telling.

          Pixi has no text-on-a-path, so the word is set one glyph at a time
          along the band's midline, each rotated to the slope at its own x. The
          face is monospaced, which is the only reason this is three lines
          instead of a layout engine: every glyph advances the same distance,
          so the position of the nth is arithmetic rather than measurement.

          Written in whatever the ribbon leaves legible — the same rule the
          rest of the scene's lettering follows, so a pale ribbon gets dark
          writing without anybody having to choose. */
      const ink = sceneInk(face, false);
      const chars = [...(grp || "")];
      const adv = t.width / Math.max(1, chars.length);
      // The band's middle, and how steeply it is climbing, at any x.
      const midAt = x => bandY + hh / 2 - bow(x) * 0.775;
      const tiltAt = x => Math.atan((6.2 * arc * x) / (wide * wide));
      const word = new P.Container();
      chars.forEach((ch, i) => {
        if (ch === " ") return;                 // still advances, draws nothing
        const cx = -t.width / 2 + adv * (i + 0.5);
        const g2 = label(ch, 9 * Z, ink);
        g2.resolution = 2;
        g2.anchor.set(0.5, 0.5);
        g2.x = cx;
        g2.y = midAt(cx);
        g2.rotation = tiltAt(cx);
        word.addChild(g2);
      });
      sign.addChild(band, word);
      sign.hitArea = new P.Rectangle(-half - tw, bandY - arc - 3 * Z,
                                     wide + tw * 2, hh * 2.4 + arc);
    } else {
      /*  A signpost stands over the people, not among them — but it was
          standing a long way over them. A person is 24 units tall and the post
          ran to 40 with the board above that, which is a sign twice the height
          of everyone under it: it read as scaffolding rather than as a
          waymarker, and it pushed the name so far up that the eye had to
          travel to connect it to the ground it names.

          28 clears a head with room to spare, which is all the clearance the
          rule ever needed. */
      /*  WHERE THE DRAWING SAYS, IF IT SAYS ANYTHING.

          A place picture may carry one magenta pixel naming its own anchor —
          see `readSignMark`. On the bottom row it moves the post sideways to
          that point of the building; anywhere else it means there is no post
          at all and the name floats at that spot.

          Held in the art's own pixels and converted here, because the scale
          the picture is drawn at is not known until it is placed in a
          column. */
      const art = sceneCache.get(slug);
      const at = art && !(art instanceof Promise) ? art.__signAt : null;
      let offX = 0, floatY = null;
      if (at && art) {
        const artS = Math.min(1, ((wOf.get(slug) || STEP) - 8 * Z) / (art.width || 1)) * Z;
        //  The art is anchored 0.5, 1 — centre, on the ground — so the pixel's
        //  offset is measured from the middle of the picture and from its foot.
        offX = (at.x + 0.5 - art.width / 2) * artS;
        if (!at.ground) floatY = (at.y + 0.5 - art.height) * artS;
      }

      const BOARD_Y = SIGN_BOARD_Y;
      const board = new P.Graphics();
      /*  A floating label hangs at the pixel; a planted one keeps the height
          it has always had, so a street of ordinary places still reads as one
          row of signs. */
      /*  THE MARK IS THE POST'S FOOT.

          A marked pixel is where the post STANDS, not how high it climbs. It
          is the roof the sign is bolted to, the wall it hangs off, the spot on
          the ground the picture chose. So the post runs from the underside of
          the board down to that pixel and stops, and it never reaches the
          street unless the street is what was marked.

          Which makes the board open a short drop above the mark rather than
          centred on it: centred, the board's own bottom edge is already below
          the pixel and there is no post to draw at all. */
      const POST_DROP = 12;
      const baseTop = floatY === null ? BOARD_Y * Z
                                      : floatY - (t.height + 4) - POST_DROP * Z;
      const post = new P.Graphics();
      sign.addChild(post);
      sign.addChild(board, t);

      /*  A POST IS PLANTED. IT DOES NOT SLIDE.

          Setting the height by moving the whole container was the obvious
          thing and the wrong one: the post went with it, so lowering a sign
          drove its foot through the ground and left it hanging by nothing.
          A signpost is a post in the earth with a board nailed to it — the
          board is what moves, and the post is however long it has to be to
          reach it.

          So the offset moves the board and REDRAWS the post to match. Below
          the ground there is no post left to draw and the board sits on the
          earth, which is what a sign lying against a wall looks like. */
      sign.__applyOff = off => {
        const top = baseTop + off * Z;
        board.clear();
        board.beginFill(0x4a3b28)
          .drawRect(-t.width / 2 - 3, top, t.width + 6, t.height + 4).endFill();
        t.y = top + 2;
        /*  THE POST IS THE GAP BETWEEN THE BOARD AND ITS FOOT.

            It hangs from the underside of the board and stops at the foot: the
            marked pixel if the drawing named one, the ground if it did not.
            Nothing else decides its length, so dragging the board up lengthens
            it and dragging the board down to its foot leaves none of it.

            `floatY` has no `off` in it on purpose. The mark is a fixed point in
            the picture — a chimney, a gable, the top of a wall — and it does
            not move because you moved the sign. It did once, so the foot rose
            with the drag and the post could never shorten. */
        const foot = floatY === null ? 0 : floatY;
        const pTop = top + t.height + 4;        // the underside of the board
        const h = Math.max(0, foot - pTop);
        post.clear();
        if (h > 0) post.beginFill(0x3a2f20).drawRect(-Z, pTop, 2 * Z, h).endFill();
        //  The target has to follow the board, or a sign you moved is a sign
        //  you cannot pick up again.
        const hitTop = top - 2;
        //  Down past the post as well, so a sign with a long drop can be
        //  picked up by the post rather than only by the board.
        const hitBot = Math.max(top + t.height + 6, pTop + h);
        sign.hitArea = new P.Rectangle(-t.width / 2 - 4, hitTop,
                                       t.width + 8, hitBot - hitTop);
      };
      /*  HOW FAR IT MAY GO.

          Down to where the board rests on the ground, up to just under the top
          of the panel. Computed here because this is the only place that knows
          where the board actually starts. */
      sign.__offX = offX;
    }
    /*  A ribbon has no post, so for a group the offset is simply where it
        hangs. Both kinds answer to the same call. */
    if (!sign.__applyOff) sign.__applyOff = off => { sign.y = groundY() + off * Z; };

    /*  CLAMPED BY WHAT IS DRAWN, NOT BY THE ORIGIN.

        A signpost's origin is its foot and everything it draws is above it. A
        group's ribbon hangs its banner far above an origin that is still on
        the ground. Clamping the origin therefore meant two different things
        for the two kinds — and for a ribbon it meant pushing the banner clean
        off the top of the panel while the origin sat obediently at y=20. The
        label was not missing. It was above the sky.

        So the clamp asks the sign where it actually draws. `getLocalBounds` is
        the union of whichever parts this one has — post, board, text, banner —
        and the offset is limited so that box stays on the panel. One rule for
        both kinds, and it cannot drift from what is drawn because it is
        measured from it. */
    sign.__clampOff = off => {
      sign.__applyOff(0);
      const b2 = sign.getLocalBounds();
      const top = sign.y + b2.y, bot = sign.y + b2.y + b2.height;
      const lo = (10 - top) / Z;                      // no higher than this
      const hi = (app.screen.height - 6 - bot) / Z;   // no lower than this
      if (lo > hi) return 0;                          // taller than the panel
      return Math.max(lo, Math.min(hi, off));
    };
    sign.x = x + (sign.__offX || 0);
    sign.y = groundY();
    /*  CLAMPED ON THE WAY IN, NOT ONLY ON THE WAY OUT.

        A height is stored in world units off the ground, and the ground moves
        when the panel is resized — so an offset set in a tall panel puts the
        sign off the top of a short one, where it cannot be seen and therefore
        cannot be dragged back or right-clicked. The same clamp the drag uses,
        applied against the panel as it is now. */
    sign.__applyOff(sign.__clampOff(SIGN_Y[slug] || 0));
    sign.eventMode = "static";
    sign.cursor = "pointer";
    /*  A GROUP'S RIBBON CAN BE DRAGGED INTO ANOTHER GAP.

        The places are in longitude order and that order IS the information —
        dragging Longforgan east of Dundee would be a lie about the map. But
        the order of the columns you invented is arbitrary: it is whichever
        order you happened to name them in, which is no order at all. So a
        ribbon can be picked up and put down between two others, and a place's
        signpost cannot.

        The Promenade stays put as well. It is not one column among several —
        it is whatever width the places leave over, and it is always the last
        of them, so there is no gap to move it into.

        Same four pixels as everywhere else on this panel tell a click from a
        drag, so the ribbon keeps doing what it already did when you click it. */
    const movable = !!slug && slug.startsWith("grp-");
    /*  SIDEWAYS IS AN ARGUMENT ABOUT ORDER. UP AND DOWN IS NOT.

        Only a group's ribbon can be dragged sideways, because sideways means
        "put this column between those two" and the places are in longitude
        order — dragging Longforgan east of Dundee would be a lie about the
        map.

        Height says nothing about order, so every sign can be moved up and
        down: a place's post as freely as a group's ribbon. It is a statement
        about this scene, where the roof is and where the sky is empty, and
        only the person looking at it can make it. */
    let dx = null, dy = null, shifted = false, fromX = 0, fromOff = 0;
    let liveOff = SIGN_Y[slug] || 0;
    sign.on("pointerdown", ev => {
      dx = ev.global.x; dy = ev.global.y;
      fromX = sign.x; fromOff = liveOff;
      shifted = false;
      host._dragging = true;                // stops the street panning underneath
    });
    sign.on("globalpointermove", ev => {
      if (dx === null) return;
      const mx = ev.global.x - dx, my = ev.global.y - dy;
      if (!shifted && Math.abs(mx) + Math.abs(my) < 4) return;
      shifted = true;
      //  Sideways only where sideways is allowed; the height is always yours.
      if (movable) sign.x = fromX + mx;
      /*  In world units, because that is what gets stored — converting once
          here beats converting on every read. Clamped so the sign stays on the
          panel: one dragged off the top is one you cannot get hold of again,
          and it would be saved that way. */
      liveOff = sign.__clampOff(fromOff + my / Z);
      sign.__applyOff(liveOff);
      sign.alpha = 0.85;
      sign.cursor = "grabbing";
    });
    const dropSign = ev => {
      if (dx === null) return;
      const moved = shifted;
      dx = null; dy = null; shifted = false;
      sign.alpha = 1;
      sign.cursor = "pointer";
      host._dragging = false;
      if (moved && slug) {
        //  World units off the sign's own resting place — the one measurement
        //  that survives a zoom, a resize and a different screen.
        const was = SIGN_Y[slug];
        if (Math.abs(liveOff) < 0.5) { liveOff = 0; delete SIGN_Y[slug]; }
        else SIGN_Y[slug] = liveOff = Math.round(liveOff * 10) / 10;
        sign.__applyOff(liveOff);
        saveSignY();
        /*  The note under this column is placed BELOW the board, so moving the
            board is a question about where the note goes. Only the render
            knows that, and the drag was not asking for one — so a sign brought
            down to the street landed on top of its own caption and stayed
            there until something else happened to redraw. */
        if (was !== SIGN_Y[slug] && COL_NOTE.has(slug)) {
          host._noTween = true;
          renderPromenadePixi(V(), host);
        }
      }
      if (!moved) {
        // A group and the promenade are columns, not places: what they light
        // up is whoever you put in them.
        toggleFocus(host, "column", slug);
        return;
      }
      /*  Where it was let go decides where it goes: it lands after every group
          whose own column is to the left of it. Measured against the columns
          rather than against the other ribbons, since a ribbon being dragged
          is not where its column is. */
      /*  Only when it actually went sideways. Nudging a ribbon up used to
          re-sort the columns against an x that had not changed — usually
          landing it back where it was, and occasionally not. */
      if (movable && Math.abs(sign.x - (x + (sign.__offX || 0))) > 2) {
        moveGroupTo(slug, sign.x, xOf);
        host._noTween = true;
        renderPromenadePixi(V(), host);
      }
    };
    sign.on("pointerup", dropSign);
    sign.on("pointerupoutside", dropSign);
    /*  BACK TO WHERE IT WOULD HAVE BEEN.

        A height you set is a height you have to be able to unset, and there is
        no obvious place to put a control for something you can only want while
        pointing at the sign itself. Right-click is the erase everywhere else in
        this project — a guide, a measurement, a clipboard, an anchor pixel —
        so it is the erase of a height too. */
    sign.on("rightdown", ev => {
      if (ev && ev.preventDefault) ev.preventDefault();
      if (!slug || SIGN_Y[slug] === undefined) return;
      delete SIGN_Y[slug];
      saveSignY();
      sign.__applyOff(liveOff = 0);
    });
    signLayer.addChild(sign);
    host._signs.push({ slug, node: sign });
  }


  /*  Frames for one person: their era's colors, nudged by their own uid so
      the parish is not a line of identical twins. Textures are cached by
      palette, so people who land on the same colors share one. */
  /*  A costume that arrives after the scene was built needs one more render to
      be worn. Debounced, so a folder full of uniforms causes one redraw. */
  const costumeArrived = () => {
    clearTimeout(host._costumeSettle);
    host._costumeSettle = setTimeout(() => {
      host._noTween = true;
      renderPromenadePixi(V(), host);
    }, 120);
  };

  const framesFor = (slug, occupation) => {
    // Body first, then whichever layers apply to this person.
    const dressed = dressBody(outfitFor(slug, occupation, host, costumeArrived));
    // Their own shade of the same clothes.
    // seedOf returns a float, so this has to be floored: without it every
    // person lands in a bucket of their own and each is a separate texture,
    // which is the exact cost the bucketing exists to avoid.
    const bucket = Math.floor(Math.abs(seedOf(slug))) % TINTS;
    const sheet = tintSheet(dressed, bucket);
    // Keyed on the dressed sheet AND the shade, so two people in the same
    // clothes share one texture only when they are the same shade of them.
    if (!dressed.__dressId) dressed.__dressId = ++dressIds;
    const key = dressed.__dressId + ":" + bucket;
    let base = host._texCache.get(key);
    if (!base) {
      base = P.BaseTexture.from(sheet, { scaleMode: P.SCALE_MODES.NEAREST });
      host._texCache.set(key, base);
    }
    const cw = dressed.__cellW || SPR_W, ch = dressed.__cellH || SPR_H;
    const n = dressed.__frames || SPR_FRAMES;
    const frames = [];
    for (let f = 0; f < n; f++) frames.push(new P.Texture(base, new P.Rectangle(f * cw, 0, cw, ch)));
    /*  Once a cell can grow upward for a tall hat, the bottom of the texture
        is no longer the bottom of the person. Carried on the array so the
        walker can anchor on the feet rather than on the frame. */
    frames.footY = (dressed.__footY === undefined ? ch : dressed.__footY) / ch;
    return frames;
  };

  /*  Where each person sits on the street, worked out once so the grid can
      sort by it without redoing the arithmetic. */
  host._lngOf = new Map();
  const streetX = new Map();
  let lost = 0;
  for (const p of people) {
    const mine = whereByPerson.get(p.slug);
    const xs = mine ? [...mine].map(s => xOf.get(s)).filter(v => v !== undefined) : [];
    if (xs.length) {
      streetX.set(p.slug, xs.reduce((a, b) => a + b, 0) / xs.length);
      host._lngOf.set(p.slug, xs.reduce((a, b) => a + b, 0) / xs.length);
    } else {
      streetX.set(p.slug, unknownX + (lost++ % 3) * 20 * Z - 20 * Z);
    }
  }

  /*  In the grid the cast is ordered by whatever you asked for and wrapped
      into rows; on the street they stand where they stood. */
  const sortKey = SORTS[host._sort || "lng"] ? (host._sort || "lng") : "lng";
  /*  In the grid, a person you have put in a column stays with that column.

      Placing somebody is a statement about who belongs together, and it would
      be a poor one if it evaporated the moment you changed view. So the grid
      ranks by group first and by your chosen sort second — people you have
      grouped stand together, in the order you asked for, and everyone
      ungrouped follows. */
  const groupOf = p => {
    const pin = host._pinned.get(p.slug);
    if (pin !== undefined) return pin || "\uffff";   // the unrecorded column sorts last
    return "\uffff\uffff";                          // never placed: last of all
  };
  const cast = GRID
    ? [...people].sort((a, b) => {
        const ga = groupOf(a), gb = groupOf(b);
        if (ga !== gb) return ga < gb ? -1 : 1;
        const x = SORTS[sortKey].of(a), y = SORTS[sortKey].of(b);
        return x < y ? -1 : x > y ? 1 : a.name.localeCompare(b.name);
      })
    : people;
  const perRow = Math.max(1, Math.floor((app.screen.width - PAD) / STEP));
  const rowH = (SPR_H + 26) * Z;

  /*  Rebuild the pen. Sized to whoever is in it, captioned so it is obvious
      what it holds, and left empty-but-present so there is always somewhere to
      drop a person you have decided you cannot place. */
  const pen = host._limbo;
  pen.removeChildren();
  pen.visible = !GRID;
  const unplacedList = people.filter(p => host._pinned.get(p.slug) === PEN_SLUG);
  let penned = 0;                  // how many have been laid out in the pen so far
  /*  A crowd, not a table.

      They are standing about waiting to be placed, so they stand about: a
      loose huddle a few deep, jostled off each other rather than ruled into
      rows. A grid would say these people have an order, and the whole point of
      this box is that nothing is known about them yet.

      The scatter is seeded from each uid, so the huddle is the same huddle
      every time you look rather than reshuffling on every redraw. */
  const penW = Math.max(96, Math.min(190, 54 + unplacedList.length * 11)) * Z / 1;
  const penH = (SPR_H + 26) * Z;
  /*  The pen paints its own ground, and it has to stay a box on any sky. Pushed
      away from whatever the sky is rather than always toward black: over a pale
      sky a near-black box was right, and over a pale one it is a hole. */
  const penGround = mixInt(sceneSky(), lumOf(sceneSky()) > 0.5 ? 0xf2f4f6 : 0x05080b, 0.6);
  const penInk = sceneInk(penGround, true);

  /*  SHUT WHEN IT IS EMPTY.

      Now that nobody starts in the pen, an empty one is the normal state — and
      a full-sized empty box hanging in the middle of the sky, captioned, is a
      lot of furniture for a thing holding nothing. So it closes down to a
      dotted tab.

      It opens the moment you pick anybody up, which is the only moment it has
      anything to say, and stays open while it holds somebody. Which also keeps
      it an easy target: what shrinks is the box at rest, never the box you are
      aiming at.

      Skin and occupants are separate children so this can be redrawn mid-drag
      without disturbing whoever is standing in it. */
  const SHUT_W = 44 * Z, SHUT_H = 13 * Z;
  const penSkin = new P.Container();
  pen.addChild(penSkin);

  const paintPen = open => {
    penSkin.removeChildren();
    const w = open ? penW : SHUT_W;
    const h = open ? penH : SHUT_H;

    const penBg = new P.Graphics();
    penBg.beginFill(penGround, open ? 0.72 : 0.5).drawRect(0, 0, w, h).endFill();
    const dash = 4, gapd = 3;
    penBg.lineStyle(1, penInk, open ? 0.55 : 0.4);
    for (let x = 0; x < w; x += dash + gapd) {
      penBg.moveTo(x, 0); penBg.lineTo(Math.min(x + dash, w), 0);
      penBg.moveTo(x, h); penBg.lineTo(Math.min(x + dash, w), h);
    }
    for (let y = 0; y < h; y += dash + gapd) {
      penBg.moveTo(0, y); penBg.lineTo(0, Math.min(y + dash, h));
      penBg.moveTo(w, y); penBg.lineTo(w, Math.min(y + dash, h));
    }
    penSkin.addChild(penBg);

    /*  Lit while you are carrying somebody, brighter when you are over it.

        The pen is where a placement is undone, and there was nothing to say so:
        you could pick a person out of a column with no idea that dropping them
        back in the box was even a thing you were allowed to do. Hidden at rest,
        because a box glowing at nobody is just noise. */
    const penGlow = new P.Graphics();
    penGlow.beginFill(0x7fc188, 0.16).drawRect(0, 0, w, h).endFill();
    penGlow.lineStyle(2, 0x7fc188, 0.95);
    penGlow.drawRect(0, 0, w, h);
    penGlow.visible = false;
    penSkin.addChild(penGlow);
    host._penGlow = penGlow;

    // Named only when it is open. A tab this small captioned is a caption with
    // a box attached.
    if (open) {
      const penCap = label("no place recorded", 8, penInk);
      penCap.resolution = 2;
      penCap.anchor.set(0.5, 0);
      penCap.x = w / 2; penCap.y = h + 2;
      penSkin.addChild(penCap);
    }

    /*  Centered over the street rather than tucked in a corner: it is the one
        thing you are meant to empty, so it sits where you are already looking
        and the same distance from every column. Recomputed on each render
        because the panel can be resized under it. */
    pen.x = Math.round((app.screen.width - w) / 2);
    pen.y = 10;
    host._penBox = { x: pen.x, y: pen.y, w, h: h + (open ? 12 : 0) };
  };
  host._paintPen = paintPen;
  paintPen(unplacedList.length > 0);

  /*  `lost` used to be reset here and reused as the pen's index counter, which
      is why the footer's "placed by their records" was really counting the pen.
      The pen has its own counter now, and this one keeps meaning the one thing
      it is named for. */
  let lastGroup = null;      // so each group in the grid is named once
  cast.forEach((p, i) => {
    const mine = whereByPerson.get(p.slug);
    const known = !!(mine && mine.size);
    let x, y;
    if (GRID) {
      x = PAD / 2 + (i % perRow) * STEP + STEP / 2;
      y = rowH * (Math.floor(i / perRow) + 1) + 8 * Z;
    } else {
      x = streetX.get(p.slug);
    }


    /*  The occupation is the first clause of the detail field.

        That field is prose in practice — "Farmer, Robert immigrated to Utah in
        the John Tidwell Company in 1852" — and slugging the lot gives a
        seventy-character filename nobody would ever draw for. The trade is
        almost always written first, so the text up to the first comma or full
        stop is the part worth matching on. Capped, so a run-on sentence with
        no punctuation cannot become a filename either. */
    const occupation = occupationOf(p);
    const frames = framesFor(p.slug, occupation);

    const node = new P.Container();
    const sprite = new P.Sprite(frames[0]);
    // Feet on the ground, wherever they sit inside the frame.
    sprite.anchor.set(0.5, frames.footY === undefined ? 1 : frames.footY);
    sprite.scale.set(Z);
    // Fading lives on the container alone. Setting it here as well multiplied
    // the two together and left an unplaced person at a fifth opacity — which,
    // on a pile where nobody is placed yet, is the whole cast.
    node.addChild(sprite);

    /*  Click to single somebody out. It dims the rest of the scene rather
        than filtering the pile — a scene you are looking at should not be
        torn down and rebuilt underneath you just because you pointed at
        someone in it.

        A drag must not count as a click, or panning would keep re-selecting
        whoever you dragged from, so the hit only lands if the pointer barely
        moved. */
    /*  Drag to arrange, click to single out.

        Dragging moves the figure and nothing else. It writes no brick, sets no
        coordinate, and does not touch the gazetteer — it is a way of tidying
        the view, the same as sliding photographs around a table. The pile is
        untouched, and the arrangement lasts as long as you are looking at it.

        Kept apart from a click by distance: under four pixels is a click, past
        that you are moving somebody. */
    node.eventMode = "static";
    node.cursor = "grab";
    /*  An explicit hit area, because a Container only hit-tests children that
        are interactive themselves — and a plain Sprite is not. Without this
        the figure has no target at all: pointerdown never lands, and dragging
        silently does nothing.

        Sized to the sprite, which is anchored bottom-center, and given a
        little headroom so small figures are still catchable. */
    node.hitArea = new P.Rectangle(
      -SPR_W * Z / 2 - 2, -SPR_H * Z - 2, SPR_W * Z + 4, SPR_H * Z + 6);
    let downAt = null, moved = false;
    node.on("pointerdown", e => {
      downAt = { x: e.global.x, y: e.global.y, nx: node.x, ny: node.y };
      moved = false;
      host._dragging = true;          // stops the scene panning underneath
      /*  And stop the drift. Reaching for someone while the whole street is
          still sliding means they walk out from under the cursor before the
          pointer goes down — which reads as "I cannot drag anyone" even though
          the drag itself works perfectly. */
      host._setDrift(false);
      node.cursor = "grabbing";
      if (host._buildZones) host._buildZones();
      if (host._zoneLayer) host._zoneLayer.visible = true;
      // The pen is a target too — say so the moment somebody is lifted.
      if (host._penGlow) { host._penGlow.visible = true; host._penGlow.alpha = 0.55; }
      const me = host._walkers.find(k => k.slug === p.slug);
      if (me) { me.held = true; me.falling = false; }
      /*  Off the rope the moment they are lifted, not when they are put down.
          What you are holding is a person, not a passenger — and the rope has
          to close up behind them while you can see it happen. */
      if (me && me.riding) unboardRider(host, me, P);
      /*  Nothing above the figure may take the release.

          A drag ends on pointerup, and Pixi sends that to whatever is topmost
          under the pointer. The pen and the balloon both sit ABOVE a carried
          figure on purpose — you have to be able to see the box you are aiming
          at — so releasing onto either one delivered the pointerup to them and
          the drag simply never finished: no drop, no placement, and the figure
          left stuck to the stage.

          Deafening their children for the length of the drag fixes both, and
          keeps them drawn on top, which was the point of putting them there.
          Handed back in finish(), by every path out of it. */
      if (host._limbo) host._limbo.interactiveChildren = false;
      if (host._balloon) host._balloon.node.interactiveChildren = false;
      // Open the pen while somebody is in the air, so there is a box to aim at.
      if (host._paintPen) host._paintPen(true);
      // Lifted out of the line, the way you pick a piece off a board.
      node.scale.set(node.scale.x < 0 ? -1.25 : 1.25, 1.25);
      /*  Carried on the STAGE while held, so a figure can be lifted out of the
          pen and dropped on the street, or back the other way. Held in world
          or pen coordinates it could never cross between them. */
      const gp0 = node.getGlobalPosition();
      /*  Where they were standing before they were picked up. The stage is not
          cleared by a rebuild — only world and pen are — so a figure left on it
          survives the next render and the rebuilt cast draws a second copy of
          the same person. Every path out of a drag has to put them back
          somewhere that gets cleared. */
      downAt.from = node.parent;
      downAt.lx = node.x; downAt.ly = node.y;
      host._lifted = node;
      app.stage.addChild(node);
      node.x = gp0.x; node.y = gp0.y;
      downAt.nx = node.x; downAt.ny = node.y;
    });
    node.on("globalpointermove", e => {
      if (!downAt) return;
      const dx = e.global.x - downAt.x, dy = e.global.y - downAt.y;
      if (!moved && Math.abs(dx) + Math.abs(dy) < 4) return;
      moved = true;
      node.x = downAt.nx + dx;
      node.y = downAt.ny + dy;
      /*  Every region says whether it is the one about to catch you, and all
          three read the same answer the release will read. A column brightens,
          the pen glows, the balloon swells — the balloon because a target that
          small and that mobile has no other language, and because the pen has
          a dotted frame and it should not be the only one making a promise. */
      const t = dropTargetAt(host, node.x, node.y);
      for (const z of host._zones || []) {
        z.g.alpha = (t.kind === "column" && z.slug === t.slug) ? 1 : 0.3;
      }
      if (host._penGlow) host._penGlow.alpha = t.kind === "pen" ? 1 : 0.55;
      if (host._balloon) {
        const bz = host._zoom || 1;
        host._balloon.node.scale.set(t.kind === "balloon" ? bz * 1.25 : bz);
      }
    });
    /*  One ending for both ways a drag can finish.

        Releasing away from where you grabbed fires `pointerupoutside`, not
        `pointerup` — which is every drag worth making. Treating that as a
        cancel meant a drag moved the figure and then quietly threw the move
        away the moment you let go. */
    const finish = () => {
      node.cursor = "grab";
      host._dragging = false;
      // Listening again, now that nothing is being carried over them.
      if (host._limbo) host._limbo.interactiveChildren = true;
      if (host._balloon) host._balloon.node.interactiveChildren = true;
      if (host._zoneLayer) host._zoneLayer.visible = false;
      if (host._penGlow) host._penGlow.visible = false;
      if (!downAt) return;
      const me = host._walkers.find(k => k.slug === p.slug);
      if (me) me.held = false;
      node.scale.set(node.scale.x < 0 ? -1 : 1, 1);

      if (!moved) {
        // A click, not a drag. toggleFocus only changes opacity, so nothing
        // re-parents them — they have to go back by hand or they stay on the
        // stage and get doubled by the next rebuild.
        /*  A passenger was taken off the rope when they were lifted, so
            handing the node back to the balloon is not enough — the balloon
            has forgotten them, and the next rebuild would stand them in their
            column while this copy still hung there. Put them back on properly. */
        if (me && host._balloon && downAt.from === host._balloon.node) {
          host._lifted = null;
          boardRider(host, me, P);
        } else {
          if (downAt.from) { downAt.from.addChild(node); node.x = downAt.lx; node.y = downAt.ly; }
          host._lifted = null;
        }
        toggleFocus(host, "person", p.slug);
      }
      else if (me) {
        /*  One question, asked once, and a case per answer. The three regions
            used to be three conditions in this chain, each doing its own hit
            test — which is how the highlight and the drop came to disagree. */
        const t = dropTargetAt(host, node.x, node.y);

        /*  Forgotten as soon as they are handed to whoever is taking them.
            The stage is not cleared by a rebuild — only world and pen are — so
            a figure left on it survives the next render and the rebuilt cast
            draws a second copy of the same person. Every case below hands the
            node to something that gets torn down. */
        host._lifted = null;

        if (t.kind === "balloon" && boardRider(host, me, P)) {
          host._balloon.node.scale.set(host._zoom || 1);   // it swelled to catch them; it has
        }
        else if (t.kind === "pen" || t.kind === "nowhere") {
          /*  The pen means you no longer know where they were — and that is now
              something you SAY rather than something you fail to say, so it is
              written down like any other placement. "Nowhere" is the same
              answer arrived at differently: no column would take them. */
          host._pinned.set(p.slug, PEN_SLUG);
          host._savePins();
          if (node.parent) node.parent.removeChild(node);
          renderPromenadePixi(V(), host);
        }
        else if (t.kind === "column") {
          /*  Each place is a column. Let go anywhere inside one and they belong
              to that column — they fall to the ground and stand with whoever
              else is there. You are not placing a figure at a coordinate, you
              are putting a person in a group.

              The landing spot is worked out here rather than by re-rendering,
              so the fall can actually be watched. */
          host._pinned.set(p.slug, t.slug);
          host._savePins();
          // Back into the street, at the point it was released. world is
          // cleared by the next rebuild, so this hands the figure back to
          // something that gets torn down.
          world.addChild(node);
          node.x -= world.x;
          const mates = [...host._pinned.entries()].filter(([, v]) => v === t.slug).map(([k]) => k);
          const rank = Math.max(0, mates.indexOf(p.slug));
          me.home = host._columnX(t.slug) + (rank - (mates.length - 1) / 2) * SPACING;
          /*  The column has just grown to hold one more, which moves every
              column east of it. Reflow once they have landed. */
          clearTimeout(host._settle);
          host._settle = setTimeout(() => {
            host._noTween = true;
            renderPromenadePixi(V(), host);
          }, 700);
          me.toY = groundY();
          me.t = 1;
          me.falling = true;
          me.vy = 0;
        }
        else {
          // The balloon refused them — it was already carrying somebody. Put
          // them back where they were rather than dropping them into the sky.
          if (downAt.from) { downAt.from.addChild(node); node.x = downAt.lx; node.y = downAt.ly; }
        }
      }
      /*  Shut the pen again — AFTER the drop has been resolved, never before.

          Shutting it first made the box smaller than the box you had been
          aiming at all through the drag, so a release squarely inside the open
          pen fell outside the shut one and was read as a column instead. The
          target may not move between the last thing you saw and the answer.

          Read off the placements rather than the render's own list, which was
          taken before this drop existed. */
      if (host._paintPen) {
        host._paintPen([...host._pinned.values()].includes(PEN_SLUG));
      }
      downAt = null;
    };
    node.on("pointerup", finish);
    node.on("pointerupoutside", finish);
    // Names are noise at sixty walkers, so they arrive on hover and stay for
    // whoever is selected. The scene reads as a crowd until you ask it not to.
    node.on("pointerover", () => { if (!host._focus) { const n = ensureName(); if (n) n.visible = true; } });
    node.on("pointerout", () => {
      const w = host._walkers.find(k => k.slug === p.slug);
      if (w && w.nameNode && host._focus !== p.slug) w.nameNode.visible = false;
    });

    /*  The name is built the first time it is wanted, not with the scene.

        A Text in Pixi rasterises to its own canvas and uploads a texture. At
        sixty-five people that was sixty-five of them made on every render —
        every drop, sort, zoom and resize — for labels that are hidden until
        you hover. Making them on demand is most of what a rebuild was doing. */
    const nameText = p.name + (p.birthYear ? " " + (p.birthExact ? "" : "~") + p.birthYear : "");
    /*  PICKED AGAINST WHAT IT IS ACTUALLY SITTING ON.

        This read the SKY, from back when a name floated over a head. The name
        moved under the feet and this did not, so the ink was being chosen to
        contrast with a colour it is nowhere near: on a pale sky it went dark,
        then sat on dark ground and disappeared. At sunset the two part company
        completely, the sky going red while the street goes brown.

        A quieter variant for somebody whose place is a guess, but only a third
        of the way back to the field rather than nearly half. Dimmer has to
        stay readable; the difference between known and unknown is worth
        saying, and not worth saying at the cost of the name itself. */
    const nameField = GRID ? sceneGrid() : sceneGround();
    /*  A guess is dimmer by a sixth, not by a third. Half-erasing the name is
        not a way of saying the PLACE is uncertain, and the one thing on the
        street that has to be readable is who somebody is. */
    const nameColor = known ? bestInk(nameField)
                            : mixInt(bestInk(nameField), nameField, 0.15);
    const ensureName = () => {
      const w = host._walkers.find(k => k.slug === p.slug);
      if (!w || w.nameNode) return w && w.nameNode;
      /*  And outlined in the ground itself, which is what makes it hold up
          wherever it lands. A caption under a figure crosses the street, the
          horizon line, the figure's own boots and whatever is drawn behind it,
          and no single flat colour is legible against all of those. The stroke
          carries its own background with it. */
      const n = label(nameText, 8 * Z, nameColor, {
        stroke: nameField,
        strokeThickness: Math.max(2, Math.round(2 * Z)),
        lineJoin: "round",
      });
      n.resolution = 2;
      /*  UNDER THE FEET, in both views.

          It used to go above the head on the street, on the argument that a
          crowd standing shoulder to shoulder leaves no free space except
          upward. But up there it shares the sky with the signposts, the group
          ribbons and the balloons, and a name floating at head height among
          three other kinds of floating text is one more thing to read rather
          than a caption on a person.

          Under the feet it is where a caption goes, and it is unambiguous
          about whom it belongs to: it touches them. The grid view had it there
          already and was the better of the two. */
      n.anchor.set(0.5, 0);
      //  Tucked up to sit right under the boots. In world units like every
      //  other measurement here, so it holds its place at all three zooms
      //  rather than creeping closer as the street grows.
      n.y = 2 * Z;
      n.scale.x = 1;   // counter-scaled so a walker turning does not write backwards
      node.addChild(n);
      w.nameNode = n;
      return n;
    };
    host._ensureNameFor = host._ensureNameFor || new Map();
    host._ensureNameFor.set(p.slug, ensureName);

    let toY = GRID ? y : groundY();
    let pin = colOf(p.slug);
    // null means "their records already put them somewhere" — leave the x the
    // geography worked out, and do not rank them into a column.
    if (pin !== null && pin !== PEN_SLUG && columnX(pin) === null) {
      if (!placeQ) {
        // The place has been deleted or un-geocoded, so it is no longer
        // somewhere anyone can stand and the placement lapses.
        host._pinned.delete(p.slug);
        if (host._savePins) host._savePins();
      }
      // Filtered out of view, or gone: either way they fall back to the
      // Promenade, which is always there.
      pin = PROMENADE;
    }
    if (pin !== null && pin !== PEN_SLUG && !GRID) {
      /*  Feet on the ground, and spread a little so a column of five is five
          people rather than one person drawn five times.

          Ranked against everyone whose column this IS, not just those with a
          pin saying so — since a person can now belong to the Promenade by
          saying nothing at all, and counting only the pinned would stack the
          rest on one spot. */
      const mates = roster.get(pin) || [p.slug];
      const rank = Math.max(0, mates.indexOf(p.slug));
      // Spread across the room the column actually has, so a crowd fills it
      // rather than spilling past the frame you dropped them into.
      x = columnX(pin) + (rank - (mates.length - 1) / 2) * SPACING;
      toY = groundY();
    }
    /*  In the grid, a group is announced by its place name over the first
        person in it. Without that the ranks are just people in an order, and
        the grouping you did by dragging is invisible — which defeats the
        point of carrying it across from the street. */
    if (GRID) {
      const g = host._pinned.get(p.slug);
      const gName = g === undefined ? "" : g;
      if (gName !== lastGroup) {
        lastGroup = gName;
        const grpName = gName && groupNameOf(gName);
        const e = !grpName && gName && (model.entities || []).find(k => k.slug === gName);
        const cap = label(grpName || (e ? e.name : (gName ? gName : "The Promenade")),
                          8 * Z, sceneInk(sceneGrid(), !gName));
        cap.resolution = 2;
        cap.anchor.set(0, 1);
        cap.x = Math.round(x - STEP / 2 + 4);
        cap.y = Math.round(y - SPR_H * Z - 6 * Z);
        world.addChild(cap);
      }
    }

    /*  Only those you have deliberately set aside wait in the pen — which
        lives on the stage, so they stay in the corner while the street scrolls
        past behind them. */
    const inPen = !GRID && pin === PEN_SLUG;
    if (inPen) {
      /*  Its own counter. It used to share `lost`, which is how many people no
          record places — and the footer reports that number. Borrowing it to
          space the pen out meant every person you set aside was also counted
          as one the records had failed to place, and the footer quietly
          disagreed with itself. */
      const n = penned++;
      const seed = seedOf(p.slug);
      const jx = (Math.sin(seed * 12.9898) * 43758.5453) % 1;
      const jy = (Math.sin(seed * 78.233) * 43758.5453) % 1;
      // Spread along the box, with a little depth so they overlap like a crowd.
      const span = penW - 22 * Z;
      x = 11 * Z + ((n + 0.5) / Math.max(1, unplacedList.length)) * span
          + jx * 7 * Z;
      toY = penH - 6 * Z - Math.abs(jy) * 9 * Z;
    }

    const prev = wasAt.get(p.slug);
    /*  Walking to a new position only makes sense when the old one meant the
        same thing. A zoom or a resize rescales every coordinate in the scene,
        so tweening from the old numbers sends everybody flying in from the
        edge. Those redraws place people directly instead. */
    const still = matchMedia("(prefers-reduced-motion: reduce)").matches || host._noTween;
    // A person already on screen starts from where they were; a new one is
    // simply already there.
    node.x = (prev && !still && !inPen) ? prev.x : x;
    node.y = (prev && !still && !inPen) ? prev.y : toY;
    (inPen ? pen : world).addChild(node);
    // In a crowd, whoever is nearer the front stands in front.
    if (inPen) pen.children.sort((a, b) => (a.y || 0) - (b.y || 0));
    host._walkers.push({
      node, sprite, frames, home: x, slug: p.slug, toY, inPen,
      // Matched against the name as shown, plus the uid, so either finds them.
      search: (p.name + " " + p.slug).toLowerCase(),
      fromX: node.x, fromY: node.y,
      // Staggered starts, so the crowd flows instead of snapping as one.
      t: (prev && !still) ? -(i % 7) * 0.06 : 1,
      dur: 620,
      // Base opacity is the person's own standing — unplaced people are
      // faint to begin with. Focus multiplies it rather than replacing it, so
      // dimming never accidentally promotes someone.
      /*  Everybody is solid.

          Unplaced people used to be drawn faint, to say "no record puts this
          person anywhere". But standing in the pen already says that, and a
          washed-out figure reads as broken rather than as unlocated — worse,
          it made the ordinary state of a new pile, where nobody is placed yet,
          look like a rendering fault. Focus still dims; that is a temporary
          answer to a question you asked, not a permanent judgment on someone
          whose parish is unknown. */
      base: 1,
      /*  Pacing belongs to the street. In the grid a sorted rank would shuffle
          itself out of order in front of you, and in the pen a huddle would
          walk through itself — so in both they march on the spot. */
      range: (GRID || inPen) ? 0 : 16 * Z,
      period: 2.4 + (i % 5) * 0.6,
      phase: (i * 1.7) % 6.28,
    });
  });

  // The grid wraps into the panel, so there is nothing to scroll sideways to.
  if (GRID) { host._worldW = app.screen.width; world.x = 0; }

  /*  Clicking bare ground clears the selection — the way out has to be as easy
      as the way in, or a focused scene becomes a trap.

      The listener goes on the BACKGROUND, not the stage. A hitArea on the
      stage covers the whole canvas and wins every hit test before it can
      reach a walker, which is why nobody could be clicked or dragged. */
  bg.eventMode = "static";
  bg.cursor = "grab";
  bg.on("pointertap", () => { if (host._focus) toggleFocus(host, null, host._focus); });

  /*  Put the passengers back on the rope.

      Every walker is new after a rebuild, so anybody who was aloft is standing
      in their column again with a node the balloon has never seen. host._aloft
      is what survives, and it is a Set, so iterating it restores boarding
      order — which is depth order, so nobody swaps places on a redraw.

      Cleared if the balloon has gone in the meantime: they are already on the
      ground where they belong, and holding the set would strand them in the
      sky for the next balloon along. */
  if (host._aloft.size) {
    if (!host._balloon) host._aloft.clear();
    else {
      clearPassengers(host._balloon);
      host._balloon.riders = [];
      for (const slug of [...host._aloft]) {
        const w = host._walkers.find(k => k.slug === slug);
        if (w) boardRider(host, w, P); else host._aloft.delete(slug);
      }
    }
  }

  /*  DOORS LAST, SO A DOORWAY IS NOT BLOCKED BY WHOEVER IS STANDING IN IT.

      The hit boxes went in beside the building art, which put them under the
      cast: anybody standing in the doorway took the press, and the door of a
      busy place was the one you could never knock on. They go on top instead,
      added here because the walkers are all in by now.

      The layer is made further up and filled as pictures arrive, so a drawing
      that loads late still lands in it rather than wherever the world happened
      to end at that moment. */
  if (!GRID && host._doorLayer) world.addChild(host._doorLayer);

  applyFocus(host);

  host._noTween = false;
  const findW = Math.max(130, Math.round(penW));
  if (host._penFind) {
    host._penFind.hidden = GRID || !unplacedList.length;
    host._penFind.style.left = Math.round(pen.x) + "px";
    host._penFind.style.top = Math.round(pen.y + penH + 16) + "px";
    host._penFind.style.width = findW + "px";
  }
  applyPenSearch(host);
  if (host._syncTint) host._syncTint(model);

  const known = people.length - lost;
  /*  States the count and stops. The instruction that used to follow it told
      you how to fix an emptiness you can already see.

      Kept on the host as well as written out, because the ticker appends a
      frame rate to it several times a second and has no other way of knowing
      what the sentence in front of the number is supposed to say. */
  host._noteBase = noneDeclared
    ? "No bricklings yet."
    : people.length + (people.length === 1 ? " brickling · " : " bricklings · ") +
      known + " placed by their records · " +
      placed.length + (placed.length === 1 ? " signpost" : " signposts");

  /*  Names for the status line, captured while the model is still in scope.
      A selection is made long after this render and applyFocus has no model to
      look anything up in. */
  const entName = new Map((model.entities || []).map(e => [e.slug, e.name]));
  host._titleOf = new Map();
  for (const p of people) host._titleOf.set(p.slug, p.name || titleCase(p.slug));
  for (const [slug] of placed) {
    const grp = PROM_GROUPS.find(g => g.slug === slug);
    host._titleOf.set(slug, (grp && grp.name) || entName.get(slug) || titleCase(slug));
  }
  // The promenade's own column is the empty uid and carries no sign, so
  // titleCase leaves it blank and the line would read "showing everyone at ".
  host._titleOf.set("", "the promenade");
  syncPromNote(host);

  /*  WHERE EACH COLUMN STANDS, for the camera. `_zones` has this too but is
      built only when you first pick somebody up, and a story should not have
      to fake a drag to find out where Longforgan is. */
  host._colX = xOf;

  /*  A restored view asked to stand somewhere, as a fraction of a street that
      did not exist until this render finished laying it out. Applied here and
      then forgotten, so it cannot fight the next drag. */
  if (host._panFracWanted !== undefined && host._panFracWanted !== null) {
    const span = Math.max(0, worldW - host._app.screen.width);
    host._world.x = Math.min(0, Math.max(-span, -host._panFracWanted * worldW));
    host._panFracWanted = null;
    host._panTo = null;
  }

  /*  CUT TO A SCENE.

      A scene is the whole street as it was saved: who stands where, the column
      colours and their notes, the groups, the hour, the weather, the smoke,
      the zoom and where you were standing. So playing one is restoring a
      sidecar and drawing it, which is the same path a brick.json takes when
      you open a folder. Nothing about a scene is a special case.

      The caption is the one thing that is not part of the street, so it is
      carried beside the state rather than inside it. */
  host._cut = scene => {
    if (!scene) return;
    if (scene.state) applySidecar(JSON.stringify(scene.state), host);
    if (host._say) host._say(scene.say || "");
    host._setDrift(false);
    host._noTween = true;             // a cut is a cut, not a walk across
    renderPromenadePixi(V(), host);
  };

  /*  THE STREET AS IT STANDS. Arrange it by hand, press record, and the whole
      arrangement is kept, rather than you describing it to a form. */
  host._capture = () => sidecarData(host);

  PROM_HOST = host;
}

function renderPromenade(model, host) {
  // The engine is a CDN script and only fetched when this panel is on the
  // board — the same bargain the map makes for MapLibre.
  if (window.PIXI) return renderPromenadePixi(model, host);
  if (host._loading) return;
  host._loading = true;
  host.innerHTML = '<p class="hint">loading the sprite engine…</p>';
  loadOnce(PIXI_JS)
    .then(() => { host._loading = false; renderPromenadePixi(model, host); })
    .catch(() => {
      host._loading = false;
      host.innerHTML = '<p class="hint" style="color:var(--bad)">' +
        "The promenade needs a connection the first time — PixiJS loads from a CDN.</p>";
    });
}

/* ==========================================================================
   THE SPRITE EDITOR
   --------------------------------------------------------------------------
   A wear sheet is 96 x 96: four frames across, four rows down. At that size a
   pixel is the unit of meaning and a mouse cannot hit one, so the editor works
   on ONE 24 x 24 cell at a time, blown up until a pixel is a target — and puts
   the finished figure walking next to it at true size, because the only
   question that matters while drawing a sleeve is whether it reads at 24 px.

   It never touches the pile. It draws a PNG and hands it to you; where that
   file goes and who wears it is the filename's business.
   ========================================================================== */
/*  Every layer starts as a copy of the built-in one, so you are always
    editing something that already works rather than a void. */
function layerCopy(src) {
  const c = document.createElement("canvas");
  c.width = src.width; c.height = src.height;
  const g = c.getContext("2d", { willReadFrequently: true });
  g.imageSmoothingEnabled = false;
  g.drawImage(src, 0, 0);
  return c;
}

/*  Resize a layer, keeping what is drawn centered in it — because the anchor
    is the center, so growing a layer should grow it evenly around the body
    rather than push the drawing off one edge. */
function layerResize(src, w, h, frames) {
  const on = src.__frames || SPR_FRAMES;
  const n = frames || on;
  const c = document.createElement("canvas");
  c.width = w * n; c.height = h;
  const g = c.getContext("2d", { willReadFrequently: true });
  g.imageSmoothingEnabled = false;
  const ow = src.width / on, oh = src.height;
  /*  Resize the way the compositor places things, or the drawing moves on the
      body: CENTERED across, and anchored to the BOTTOM.

      Centering vertically was the bug — the bottom edge is the ground line, so
      keeping a layer the same distance from the bottom is what keeps a hat
      on the head. Center it instead and every change of height slid the hat
      down by half the difference. */
  const dx = Math.round((w - ow) / 2);
  /*  Anchored to the bottom, because that edge is the ground. Clamped so a
      smaller box never silently eats the drawing: shrinking a 24-tall sheet
      whose hat sits in the top four rows would otherwise crop the hat and
      leave an empty canvas. */
  let dy = h - oh;
  const g0 = src.getContext("2d", { willReadFrequently: true });
  const d0 = g0.getImageData(0, 0, src.width, src.height).data;
  let top = oh;
  for (let y = 0; y < oh && top === oh; y++) {
    for (let x = 0; x < src.width; x++) if (d0[(y * src.width + x) * 4 + 3]) { top = y; break; }
  }
  if (top < oh) dy = Math.max(dy, -top);
  // Growing the count repeats what is there rather than leaving blank frames.
  for (let f = 0; f < n; f++) {
    g.drawImage(src, (f % on) * ow, 0, ow, oh, f * w + dx, dy, ow, oh);
  }
  c.__frames = n;
  return c;
}

/*  WHAT THE PAGE IS HOLDING.

    One row per drawing, at true size against the street's own sky so you are
    judging it in something like the light it will be seen in. The path is the
    whole of the interface: it is what the loader asks for, so a row reading
    `wear/mill-worker.png` is the answer to "why is that trade dressed like
    that", and moving it into the repository means saving it under that name.

    Deliberately blunt about being temporary. This is a browser holding a file
    the site does not have, and the difference matters the first time somebody
    else opens the page and sees none of it. */
/*  Scenery, and only scenery. Every picture here goes behind a place, so there
    is no folder to choose and nothing to be told. */
const ART_KIND = "places";

/*  Files in, under their own names.

    The name is the whole of the wiring: longforgan.png stands behind the place
    whose uid is longforgan, and a file called anything else stands behind
    nobody. Which is the same bargain images/places/ has always offered — this
    just skips the deploy. */
function addArtFiles(files, done) {
  const jobs = [...files].filter(f => /^image\//.test(f.type)).map(f =>
    new Promise(res => {
      const r = new FileReader();
      r.onload = () => res([ART_KIND + "/" + slugify(f.name.replace(/\.[^.]+$/, "")) + ".png", r.result]);
      r.onerror = () => res(null);
      r.readAsDataURL(f);
    }));
  if (!jobs.length) { done(0, true); return; }
  Promise.all(jobs).then(got => {
    let n = 0;
    for (const pair of got) if (pair && pair[1]) { LOCAL_ART.set(pair[0], pair[1]); n++; }
    const ok = saveLocalArt();
    artChanged();
    done(n, ok !== false);
  });
}

function renderArtHeld(model, host) {
  host.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "art-wrap";
  host.appendChild(wrap);

  const again = () => renderArtHeld(model, host);
  const say = msg => { const n = wrap.querySelector(".art-count"); if (n) n.textContent = msg; };

  /*  The bar is here whether anything is held or not: an empty store is
      exactly when you want to put something in it. */
  const bar = document.createElement("div");
  bar.className = "art-bar";
  /*  One button and a count.

      There were two more — download-all and forget-all — and they were the
      bulk twins of the save and ✕ on every row, so every action in this panel
      existed twice over. At two or three drawings that is not a shortcut, it
      is a bar to read past. Clearing the lot is what Clear all is for, and it
      names the count while it asks. */
  bar.innerHTML =
    '<button data-k="add" title="take place pictures from disk into the page">add…</button>' +
    '<span class="art-count"></span>';
  wrap.appendChild(bar);
  say(LOCAL_ART.size ? LOCAL_ART.size + " held in this browser only" : "nothing held");

  const list = document.createElement("div");
  list.className = "art-list";
  wrap.appendChild(list);

  const saveOne = (path, url) => {
    const a = document.createElement("a");
    a.href = url;
    a.download = path.split("/").pop();
    a.click();
  };

  const took = (n, ok) => {
    if (!ok) { say("no room left in this browser — some were not kept"); return; }
    if (!n) { say("nothing there that was an image"); return; }
    again();
  };
  const fileIn = document.createElement("input");
  fileIn.type = "file";
  fileIn.accept = "image/*";
  fileIn.multiple = true;
  fileIn.hidden = true;
  wrap.appendChild(fileIn);
  fileIn.onchange = () => {
    if (fileIn.files && fileIn.files.length) addArtFiles(fileIn.files, took);
  };
  bar.querySelector('[data-k="add"]').onclick = () => fileIn.click();

  /*  Dropping onto the panel does the same thing, because that is what anybody
      with a folder of PNGs open beside the browser will try first. */
  host.ondragover = e => { e.preventDefault(); wrap.classList.add("drop"); };
  host.ondragleave = () => wrap.classList.remove("drop");
  host.ondrop = e => {
    e.preventDefault();
    wrap.classList.remove("drop");
    const fs = e.dataTransfer && e.dataTransfer.files;
    if (fs && fs.length) addArtFiles(fs, took);
  };

  if (!LOCAL_ART.size) {
    const note = document.createElement("div");
    note.className = "file-empty";
    note.innerHTML = "Drop place pictures here, or <b>add…</b> them. A file " +
      "named for a place's uid stands behind that place, exactly as though it " +
      "were in <code>images/places/</code>.";
    list.appendChild(note);
    return;
  }

  for (const [path, url] of LOCAL_ART) {
    const row = document.createElement("div");
    row.className = "art-item";
    const img = document.createElement("img");
    img.src = url;
    img.alt = path;
    // Its own pixels, never smoothed and never blown up — the point of the
    // thumbnail is to show you what is actually stored.
    row.appendChild(img);

    /*  The path is editable, because a file added from disk is named whatever
        it was named on disk, and that is exactly the thing that decides
        whether anybody wears it. Renaming here is how you fix a miss without
        going back to the file manager. */
    const nm = document.createElement("input");
    nm.className = "nm";
    nm.value = path;
    nm.spellcheck = false;
    nm.title = "the loader asks for images/" + path + " — edit and press Enter to rename";
    const rename = () => {
      const want = nm.value.trim();
      if (!want || want === path) { nm.value = path; return; }
      const url2 = LOCAL_ART.get(path);
      LOCAL_ART.delete(path);
      LOCAL_ART.set(want, url2);
      saveLocalArt();
      artChanged();
      again();
    };
    nm.onkeydown = e => {
      if (e.key === "Enter") rename();
      if (e.key === "Escape") { nm.value = path; nm.blur(); }
    };
    nm.onblur = rename;
    row.appendChild(nm);

    const get = document.createElement("button");
    get.textContent = "save"; get.title = "download it, to commit under this name";
    get.onclick = () => saveOne(path, url);
    const del = document.createElement("button");
    del.className = "x"; del.textContent = "✕";
    del.title = "forget it — the street goes back to whatever it used before";
    del.onclick = () => { dropLocalArt(path); again(); };
    row.append(get, del);
    list.appendChild(row);
  }

}

/* ==========================================================================
   THE PHOTO RULER — what is that, in feet?

   The question this answers comes up before a single pixel is drawn: you have
   a photograph of a mill, you are about to draw it 102 cells wide, and you do
   not know how wide the real door is. Nothing on the sprite canvas can tell
   you. Its measure tool counts CELLS — the unit of the drawing you have not
