        It used to be a DOM listener on the canvas, which fought Pixi's hit
        testing on the very same pointerdown: whichever ran first won, so
        picking up a figure sometimes panned the street instead. Letting Pixi
        decide what was grabbed removes the race — the ground is a target like
        any other, and if you grabbed a walker the ground never hears about it.

        The pan state lives on the host because the background object itself is
        rebuilt with every render. */
    /*  Panning the street.

        A plain DOM drag on the canvas, guarded by a flag the walkers set. Pixi
        registers its own listener when the Application is built — before this
        one — so a pointerdown on a figure has already set host._dragging by
        the time this runs, and the street stays put. */
    app.stage.eventMode = "static";
    let panFrom = null;
    app.view.addEventListener("pointerdown", e => {
      if (host._dragging) return;          // a walker took it
      panFrom = { x: e.clientX, wx: host._world.x };
      host._setDrift(false);
    });
    window.addEventListener("pointermove", e => {
      if (!panFrom || host._dragging) return;
      host._world.x = Math.min(0, Math.max(-(host._worldW - app.screen.width),
                                           panFrom.wx + (e.clientX - panFrom.x)));
    });
    window.addEventListener("pointerup", () => { panFrom = null; });

    /*  A LAST RESORT FOR THE BALLOON.

        Taking hold of the envelope sets a `held` flag that stops the ticker
        moving it, and only the balloon's own pointerup and pointerupoutside
        clear it again. Neither of those arrives if the button comes up
        somewhere Pixi never hears about — outside the canvas, outside the
        window, or a pointercancel from the OS — and the balloon then hangs
        motionless in the sky for the rest of the session with no way back.

        The pan above has had this same safety net since it was written, for
        the same reason. Anything that latches on pointerdown needs a release
        that cannot be missed. */
    const letGoOfBalloon = () => {
      const b = host._balloon;
      if (!b) return;
      if (b.release) b.release();
      /*  And if it is still held after that, force it. release() bails when it
          thinks no drag is in progress, which is exactly the state a lost
          pointerup leaves behind — the flag set and the gesture forgotten. */
      if (b.held) {
        b.held = false;
        b.from = b.node.y - (b.riders.length * 3 + Math.sin(b.t * 0.7) * 6);
        host._dragging = false;
      }
    };
    window.addEventListener("pointerup", letGoOfBalloon);
    window.addEventListener("pointercancel", letGoOfBalloon);
    window.addEventListener("blur", letGoOfBalloon);
    app.view.addEventListener("wheel", e => {
      host._setDrift(false);
      host._world.x = Math.min(0, Math.max(-(host._worldW - app.screen.width),
                                           host._world.x - e.deltaY));
      e.preventDefault();
    }, { passive: false });

    /*  Resizing, driven by whoever actually knows.

        A ResizeObserver on the shell does not survive the board rebuilding its
        tiles — the panel is re-parented and the observation is silently lost,
        so growing a tile left the canvas at its old size. The board calls this
        directly instead. The observer stays as a second route, for the window
        resizing rather than the grid.

        The ground line and everyone's feet are positioned against the panel's
        height, so this rebuilds the scene rather than just stretching the
        canvas; the world container keeps its x, so your place in the street
        survives. */
    host._reflowNow = () => {
      const w = shell.clientWidth, h = shell.clientHeight;
      if (w <= 0 || h <= 0) return;
      if (app.screen.width === w && app.screen.height === h) return;
      app.renderer.resize(w, h);
      clearTimeout(host._reflow);
      host._reflow = setTimeout(() => {
        host._noTween = true;        // a resize moves the ground, not the people
        const keep = host._world.x;
        renderPromenadePixi(V(), host);
        host._world.x = Math.min(0, Math.max(-(host._worldW - app.screen.width), keep));
      }, 60);
    };

    /*  Where you have put people, remembered.

        Still purely the Promenade's own: it never reaches the pile, writes no
        brick and sets no coordinate. But an arrangement you spent time on
        should survive closing the tab — losing it on reload made the whole
        thing feel like a toy. Stored by uid, so it lines up again whatever
        else changed in the pile meanwhile. */
    host._pinned = new Map();
    try {
      const raw = JSON.parse(localStorage.getItem(PINNED_KEY) || "null");
      if (Array.isArray(raw)) {
        for (const [uid, place] of raw) {
          if (typeof uid === "string" && typeof place === "string") host._pinned.set(uid, place);
        }
      }
    } catch (e) { /* unavailable */ }

    host._savePins = () => {
      try {
        if (host._pinned.size) {
          localStorage.setItem(PINNED_KEY, JSON.stringify([...host._pinned.entries()]));
        } else {
          localStorage.removeItem(PINNED_KEY);
        }
      } catch (e) { /* private mode */ }
    };

    /*  The holding pen: everyone no record places.

        It hangs off the STAGE rather than the world, so it does not scroll —
        it stays in the top-left corner wherever you have panned to. That is
        the point of it. Parking the unplaced at the far end of the street
        meant they were a mile from every column you might want to drop them
        into, and out of sight for most of the scene.

        Dotted, like the drop zones, because it is one: drag somebody back
        into it to say you no longer know where they were. */
    /*  The pen is drawn last, above the street and above whoever is being
        carried — a figure passing over the box must not hide the box it is
        being aimed at. Pixi only honors zIndex on a sorted parent. */
    app.stage.sortableChildren = true;
    host._limbo = new P.Container();
    host._limbo.zIndex = PEN_Z;
    app.stage.addChild(host._limbo);

    /*  Drift as an attract mode.

        Still off while you are working — a scene that slides about under the
        cursor is an obstacle — but it starts on its own once the panel has
        been left alone for a while, so a board sitting on a screen eventually
        shows itself off. Any touch of it stops the drift and starts the wait
        over: the moment you reach for someone, the street stands still.

        The button remains an override for starting it deliberately.

        It STARTS moving, so the button is a pause. A still street reads as a
        broken one — you cannot tell a paused promenade from one that failed to
        start, and the first thing this panel has to say is that these are
        people rather than a chart. Reach for anyone and it stops. */
    //  Through the setter like everything else, so the button starts in step.
    host._setDrift(true);
    host._idleMs = 30000;
    /*  THE PAUSE BUTTON HAD TO FIGHT THIS, AND LOST.

        These listeners are on the shell, and the drift button is IN the shell,
        so pressing it fired a pointerdown here first. This handler turned the
        drift off and armed the 30-second timer; the button's own click then
        toggled from that fresh `false` back to `true`, and cleared the timer.

        So pressing pause STARTED the drift, and with the timer cleared nothing
        was left that could ever turn it off again — the street slid on for
        ever and the button only restated it. That is the stuck screensaver.

        A press on that button is not "the user is busy elsewhere", it is an
        instruction about this exact thing, so it does not count as a poke. */
    /*  TYPING IS NOT IDLING.

        The timer measures "left alone for a while" and then starts the street
        moving again. Someone writing bricks in the pallet is not idle, and a
        scene that slides sideways beside the line you are typing is the worst
        moment this panel could pick to move. So the timer still runs, but when
        it comes due with a text field focused it looks again shortly rather
        than starting the drift — and a short look rather than another thirty
        seconds, so the street resumes soon after you leave the field instead
        of waiting out a fresh count.

        Sliders and color wells are left out: a range is focused while you drag
        it, and you are plainly here. */
    const inAField = () => {
      const el = document.activeElement;
      if (!el || el === document.body) return false;
      if (el.isContentEditable) return true;
      if (el.tagName === "TEXTAREA") return true;
      return el.tagName === "INPUT" &&
        !/^(button|checkbox|radio|range|color|submit|reset|file|image)$/i.test(el.type || "text");
    };
    const RECHECK_MS = 2000;
    const armIdle = () => {
      clearTimeout(host._idleTimer);
      host._idleTimer = setTimeout(function due() {
        if (inAField()) { host._idleTimer = setTimeout(due, RECHECK_MS); return; }
        host._setDrift(true);
      }, host._idleMs);
    };

    host._bumpIdle = e => {
      const t = e && e.target;
      if (t && t.closest && t.closest(".pr-drift")) return;
      host._setDrift(false);
      clearTimeout(host._idleTimer);
      // A stilled scene is what someone asked for; do not override that.
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      armIdle();
    };
    for (const t of ["pointerdown", "pointermove", "wheel"]) {
      shell.addEventListener(t, host._bumpIdle, { passive: true });
    }
    /*  Not called here.

        It used to be, to arm the idle timer — but bumpIdle's first act is to
        STOP the drift, so arming it that way turned the street off the instant
        it was built. The timer is armed by the first interaction instead,
        which is the only time the "left alone for a while" it measures starts
        meaning anything. */
    /*  Reassigning a texture makes Pixi rebuild the sprite's UVs. At six
        frames a second the walk cycle only changes every tenth frame, so doing
        it unconditionally was nine wasted rebuilds out of ten, per walker. */
    const setFrame = (w, i) => {
      if (w.frame === i) return;
      w.frame = i;
      w.sprite.texture = w.frames[i];
    };
    app.ticker.add(() => {
      const t = app.ticker.lastTime / 1000;
      for (const w of host._walkers || []) {
        /*  A held figure belongs to the hand, not to the ticker.

            This is what stopped dragging from working at all: the loop below
            reassigns node.x on every frame, so a figure followed the pointer
            for a fraction of a frame and was then yanked back to where the
            records put them. The drag was working; it was being undone sixty
            times a second. */
        if (w.held) {
          setFrame(w, Math.floor(t * 10 + w.phase) % w.frames.length);
          continue;
        }

        /*  A passenger belongs to the balloon, exactly as a held figure
            belongs to the hand. Their x and y are the balloon's business now;
            the loop below would drag them back to a column they are three
            hundred feet above. They keep walking, because everybody does. */
        if (w.riding) {
          setFrame(w, Math.floor(t * 4 + w.phase) % w.frames.length);
          continue;
        }

        /*  Dropped, and falling. Gravity rather than a tween, because you
            threw them — they should land, not glide. They also slide into the
            middle of their column on the way down, so the drop reads as
            "into that group" rather than "at that spot". */
        if (w.falling) {
          w.vy += 0.9 * (app.ticker.deltaMS / 16.7);
          w.node.y += w.vy;
          w.node.x += (w.home - w.node.x) * 0.12;
          setFrame(w, 0);
          if (w.node.y >= w.toY) {
            w.node.y = w.toY;
            w.node.x = w.home;
            w.falling = false;
            w.vy = 0;
          }
          continue;
        }

        /*  Rearranging is a walk, not a cut.

            When the layout changes, everyone keeps their own position and
            walks to the new one — so you can follow a particular person from
            the street into the grid and see where they landed. A hard swap
            loses that thread entirely, and the whole point of one figure per
            person is that you can keep your eye on one of them.

            Staggered by phase so the cast moves as a crowd rather than a
            rank of soldiers, and eased so it settles rather than stops. */
        if (w.t < 1) {
          w.t = Math.min(1, w.t + app.ticker.deltaMS / w.dur);
          // t starts negative to stagger the crowd; until it reaches zero the
          // walker simply waits where they were.
          const k = Math.max(0, w.t);
          const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
          w.node.x = w.fromX + (w.home - w.fromX) * e;
          w.node.y = w.fromY + (w.toY - w.fromY) * e;
          // Face the way they are traveling while they travel.
          if (Math.abs(w.home - w.fromX) > 2) w.node.scale.x = w.home < w.fromX ? -1 : 1;
          setFrame(w, Math.floor(t * 8 + w.phase * 3) % w.frames.length);
          continue;
        }
        // Each pace is a slow sine about the spot the records put them on, so
        // nobody wanders somewhere no document says they were.
        const off = Math.sin(t / w.period + w.phase) * w.range;
        w.node.x = w.home + off;
        w.node.y = w.toY;
        if (w.range) w.node.scale.x = Math.cos(t / w.period + w.phase) < 0 ? -1 : 1;
        setFrame(w, Math.floor(t * 6 + w.phase * 3) % w.frames.length);
      }
      /*  Names ride on the container, so they flip with their walker; undo it.

          This used to be a second ticker.add() called from the render body,
          which meant one more permanent callback on every zoom, sort, drop and
          resize — each iterating the whole cast every frame, for ever. It
          belongs in the one ticker registered at startup. */
      for (const w of host._walkers || []) {
        if (w.nameNode) w.nameNode.scale.x = w.node.scale.x < 0 ? -1 : 1;
      }
      // The signposts belong to the street, so they fade rather than blink.
      if (host._signLayer) {
        const want = host._view === "grid" ? 0 : 1;
        const a = host._signLayer.alpha;
        if (a !== want) host._signLayer.alpha = a + Math.sign(want - a) * Math.min(0.06, Math.abs(want - a));
      }
      /*  The sky exists on the street and nowhere else.

          The grid is a pictogram board — a flat field with no horizon, so
          there is nothing for a balloon to be in front of and nothing for it
          to be behind. Anything already crossing when you switch is taken
          down rather than left hanging over a chart. */
      const SKY = host._view !== "grid";
      if (!SKY) {
        // Through landBalloon, so anybody aboard is set down in their column
        // rather than deleted along with the basket.
        if (host._balloon) landBalloon(host);
        if (host._birds) { host._birds.node.destroy({ children: true }); host._birds = null; }
      }

        /*  SMOKE.

          One texture, a fixed pool and a global budget, because this is the
          one thing on the panel whose cost grows with the size of your pile.
          Fifty-nine columns with four chimneys each, at sixty frames a second,
          is where a naive version stops being free.

          So: every puff is a Sprite sharing one soft round texture, which lets
          Pixi batch the lot into a single draw call. The pool is allocated
          once and recycled, because object churn at 60fps is what actually
          stutters, not the arithmetic. And a chimney off the side of the
          screen emits nothing, which turns a cost per corpus into a cost per
          screen. */
      if (SKY && host._smokeAt && host._smokeAt.length) {
        if (!host._smokePool) {
          //  The puff itself, drawn once, round. A radial gradient in a canvas
          //  rather than a Graphics circle, so the edge is soft at any scale.
          const S = 32, cvs = document.createElement("canvas");
          cvs.width = cvs.height = S;
          const cg = cvs.getContext("2d");
          const grad = cg.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
          grad.addColorStop(0, "rgba(255,255,255,1)");
          grad.addColorStop(0.5, "rgba(255,255,255,0.55)");
          grad.addColorStop(1, "rgba(255,255,255,0)");
          cg.fillStyle = grad;
          cg.fillRect(0, 0, S, S);
          host._smokeTex = P.Texture.from(cvs);
          host._smokeS = S;
          /*  THE CHIMNEY IS A CEILING TO LOOK UP THROUGH, NOT A SHAPE.

              Smoke must never appear below the pot it came out of, and a puff
              is round, so at the moment it is born half of it hangs under the
              marked pixel and reads as leaking through the roof. The cut
              belongs to the chimney's own horizontal line, so a puff loses
              only the part that has not cleared it yet, and stops being cut
              at all once it has risen clear.

              Done by cropping the texture rather than masking the sprite: a
              mask per puff is a separate draw call per puff, and this panel
              can hold a hundred and twenty of them. Every crop is a window
              onto the SAME base texture, so the whole plume still batches
              into one call. Thirty-three of them, one per row of the circle,
              built once — a puff picks the nearest rather than allocating a
              Texture sixty times a second. */
          host._smokeCrop = [host._smokeTex];        // row 0 is never drawn
          for (let k = 1; k <= S; k++) {
            host._smokeCrop[k] = new P.Texture(host._smokeTex.baseTexture,
                                               new P.Rectangle(0, 0, S, k));
          }
          /*  BEHIND THE ROOFS, NOT IN FRONT OF THEM.

              Smoke leaves a chimney at the back of a building, so a puff that
              draws over the front of the roof reads as fog on the street
              rather than as something coming out of the pot. The layer lives
              inside the world, one slot under the scene art, which also means
              it pans and hides with the street instead of being nailed to the
              stage. The render parks it there on every rebuild; this is only
              the first time, before any render has seen it. */
          host._smokeLayer = new P.Container();
          host._world.addChildAt(host._smokeLayer,
            Math.min(host._artFloor || 0, host._world.children.length));
          host._smokePool = [];
          for (let i = 0; i < SMOKE_MAX; i++) {
            const sp = new P.Sprite(host._smokeTex);
            //  Held by its bottom edge, because that edge is the thing the
            //  chimney line decides. Cropping a texture only ever takes rows
            //  off the bottom, so anything anchored by its middle would
            //  shuffle upward as it was cut.
            sp.anchor.set(0.5, 1);
            sp.visible = false;
            sp.eventMode = "none";
            host._smokeLayer.addChild(sp);
            /*  `life` must be a number from the start. Left undefined, the
                "is this puff free" test compares a number against undefined,
                which is false for everything: nothing is ever free to spawn,
                and every sprite meanwhile reports itself alive with a NaN
                position. The pool looked full and the sky stayed empty. */
            host._smokePool.push({ sp, age: 1, life: 0, fade: 1,
                                   x: 0, y: 0, drift: 0, src: null });
          }
          host._smokeClock = 0;
        }
        const dt = app.ticker.deltaMS / 1000;
        host._smokeClock += dt;
        const pool = host._smokePool;
        const wind = WEATHER.wind;
        /*  What each ink looks like at this hour, worked out once a frame
            rather than once a puff. A street usually runs on one or two
            colours, and a plume already in the air has to follow the sun down
            with everything else — a puff keeping the tint it was born with
            would leave a trail of the last five seconds of daylight hanging
            over the roof. */
        const inkNow = new Map();
        const smokeNow = ink => {
          let v = inkNow.get(ink);
          if (v === undefined) inkNow.set(ink, v = smokeTint(ink));
          return v;
        };

        /*  Only the chimneys you can see. The street pans, so most of them are
            off the side at any moment, and asking each one whether it is on
            screen is far cheaper than drawing for it. */
        const left = -host._world.x - 40, right = left + app.screen.width + 80;
        for (const src of host._smokeAt) {
          if (src.wx < left || src.wx > right) continue;
          src.next -= dt;
          if (src.next > 0) continue;
          src.next = 0.7 + Math.random() * 0.7;
          const free = pool.find(q => q.age > q.life);
          if (!free) break;                       // budget spent; the rest wait
          free.age = 0;
          free.life = 2.6 + Math.random() * 2.2;
          free.x = src.wx + (Math.random() - 0.5) * 2;
          free.y = src.wy;
          free.drift = (Math.random() - 0.5) * 0.4;
          free.src = src;
          free.fade = 0.35 + (src.fade === undefined ? 0.5 : src.fade) * 1.9;
          free.sp.tint = smokeNow(src.ink);
        }

        for (const q of pool) {
          if (q.age > q.life) { if (q.sp.visible) q.sp.visible = false; continue; }
          q.age += dt;
          const t = q.age / q.life;
          if (t >= 1) { q.sp.visible = false; continue; }
          //  Rises, leans with the wind, spreads and gives up. `fade` is the
          //  whole character of it: low is a wisp, high is a working chimney.
          const rise = 26 * t;
          //  World coordinates, because the layer is in the world now — the
          //  container carries the pan, so adding it here would count it twice.
          q.sp.x = q.x + (wind * 18 + q.drift * 10) * t;
          const sc = (0.18 + t * 0.55) * (host._zoom || 1);
          /*  Cut at the chimney's own line. `q.y` is the marked pixel; the
              puff's middle is `rise` above it and its radius is half the
              texture, so the rows that have cleared the line are the rows
              worth drawing. All of them, once the puff has risen its own
              radius clear, which is most of its life. */
          const S = host._smokeS, R = S * 0.5 * sc;
          let rows = Math.round(((rise + R) / (2 * R)) * S);
          if (rows <= 0) { q.sp.visible = false; continue; }
          if (rows > S) rows = S;
          if (q.sp.texture !== host._smokeCrop[rows]) q.sp.texture = host._smokeCrop[rows];
          //  Anchored at the bottom, so the sprite hangs from wherever the cut
          //  landed: the chimney line while it is still being cut, its own
          //  underside once it is clear.
          q.sp.y = Math.min(q.y, q.y - rise + R);
          //  Re-read every frame, so dragging the sun takes the plume with it.
          const ink = smokeNow(q.src ? q.src.ink : SMOKE_DEFAULT.ink);
          if (q.sp.tint !== ink) q.sp.tint = ink;
          q.sp.scale.set(sc);
          q.sp.alpha = Math.max(0, (q.src ? q.src.thick : 0.55) * Math.pow(1 - t, q.fade));
          q.sp.visible = true;
        }
      } else if (host._smokeLayer) {
        for (const q of host._smokePool) q.sp.visible = false;
      }

      /*  The sun sits in the world so it can be drawn on the sky, under the
          roofs. It must not travel with the world, though, so the pan comes
          straight back off it here — every frame, because the street can be
          moved by a drag, a wheel, a zoom or the drift, and this is the one
          place all four of them have already landed. */
      if (host._sun && !host._sun.destroyed && host._sun.__sx !== undefined) {
        host._sun.x = host._sun.__sx - host._world.x;
      }

      /*  THE FRAME RATE, on the end of the line that is already there.

          Four times a second rather than sixty. Pixi's own FPS is smoothed
          already, so reading it every frame buys no accuracy and costs a DOM
          write per frame on the one panel whose whole point is not to drop
          frames. A number that changes four times a second is also the fastest
          a person can actually read. */
      host._fpsMs = (host._fpsMs || 0) + app.ticker.deltaMS;
      if (host._fpsMs >= 250) {
        host._fpsMs = 0;
        const note = host.querySelector(".pr-note");
        if (note) {
          note.textContent = (host._noteText || "") +
            " · " + Math.round(app.ticker.FPS) + " fps";
        }
      }

      /*  PARALLAX, WHICH IS THE SAME SUM WITH THE DIAL TURNED DOWN.

          The sun above takes the whole pan back off itself and so never
          moves. A cloud takes back all but its own share: at `__par` of 0.3 it
          keeps three tenths of the street's movement and gives back seven, so
          it slides the right way and lags behind the roofs. Turn __par to 0
          and you have the sun; turn it to 1 and the cloud is nailed to the
          street like a building.

          Here rather than in the render because the street moves without
          rebuilding: a drag, a wheel, the idle drift. This is the one place
          all of them have already landed. */
      /*  AND THE SKY MOVES WHEN NOBODY IS LOOKING.

          Parallax alone shows nothing on a street shorter than the panel: the
          pan is clamped to zero, so there is no movement for the clouds to
          take a share of, and every depth setting looks identical. Most piles
          are that short. A sky on the wind reads its own depth without the
          street having to be walked at all, and a scene left alone now has
          weather in it rather than a painted backdrop.

          Wrapped rather than allowed to march off, so a cloud leaving one edge
          is the cloud arriving at the other and the sky never empties. */
      /*  WRAPPED IN SCREEN SPACE, WHICH IS THE ONLY SPACE THAT WORKS.

          The first wrap recycled clouds along world coordinates, so the band
          they lived in travelled with the street and the window eventually
          panned clean off the end of it. Wrapping around what you can SEE
          instead, the sky is full at any pan and at any street length: work
          out where the cloud wants to be on screen, bring it back inside the
          window, and only then hand it to a container that is itself moving. */
      if (host._sky && !host._sky.destroyed) {
        host._skyT = (host._skyT || 0) + app.ticker.deltaMS / 1000;
        const wx = host._world.x, blow = host._skyT * WEATHER.wind * 9;
        for (const sp of host._sky.children) {
          if (sp.__par === undefined) continue;
          //  Where it belongs on screen: its own share of the pan, plus drift.
          let sx = sp.__x0 + wx * sp.__par + blow * sp.__blow;
          sx = ((sx % sp.__run) + sp.__run) % sp.__run;
          //  Screen back to the world container, which carries the pan itself.
          sp.x = sx - sp.__pad - wx;
        }
      }

    /*  Now and again, a balloon.

          Drawn rather than fetched, and never announced. It drifts across the
          sky on its own schedule, bobs a little, and is gone — the sort of
          thing you only notice if you happen to be looking at the right
          moment, which is the whole point of it.

          Deliberately in the sky layer and never interactive: it is not a
          record, it cannot be clicked, and nothing depends on it. */
      if (SKY && !host._balloon && Math.random() < 0.0004) {
        const bal = new P.Container();
        const g = new P.Graphics();
        // A silk, drawn each time from the same bolt of cloth.
        const [silk, gore] = BALLOON_SILKS[Math.floor(Math.random() * BALLOON_SILKS.length)];
        /*  THE ENVELOPE IS A PEAR, NOT AN ELLIPSE.

            An ellipse is as round at the bottom as it is at the top, which is
            the one thing a balloon is not: the crown is a dome and the base
            draws in to a throat where the ropes gather. And the gores were
            full-height ellipses laid over it, so they bulged past the crown
            and it read as three blobs stuck together rather than one taut bag.

            So the silhouette is sampled once, top to bottom, and everything
            else is expressed as a fraction of the half-width AT THAT HEIGHT.
            The gores are then panels of the balloon rather than shapes sitting
            on it — they narrow where it narrows, and they cannot escape it. */
        const RN = 22;
        const skin = [];                       // [y, halfWidth] from crown to throat
        for (let i = 0; i <= RN; i++) {
          const yy = -BAL.ry + (2 * BAL.ry * i) / RN;
          const u = yy / BAL.ry;               // -1 at the crown, +1 at the throat
          let hw = BAL.rx * Math.sqrt(Math.max(0, 1 - u * u));
          // Below the equator it draws in, and stops at a throat rather than a point.
          if (u > 0) hw = hw * (1 - 0.5 * Math.pow(u, 1.4)) + BAL.rx * 0.2 * Math.pow(u, 2.2);
          skin.push([yy, hw]);
        }
        const bandOf = (centre, halfFrac) => {
          const left = [], right = [];
          for (const [yy, hw] of skin) {
            left.push(centre * hw - halfFrac * hw, yy);
            right.unshift(centre * hw + halfFrac * hw, yy);
          }
          return left.concat(right);
        };
        const outline = [];
        for (const [yy, hw] of skin) outline.push(-hw, yy);
        for (let i = skin.length - 1; i >= 0; i--) outline.push(skin[i][1], skin[i][0]);

        g.beginFill(silk).drawPolygon(outline).endFill();
        g.beginFill(gore).drawPolygon(bandOf(-0.46, 0.13)).endFill();
        g.beginFill(gore).drawPolygon(bandOf(0.46, 0.13)).endFill();

        // The ropes, gathered at the throat and splaying to the basket's corners.
        const throat = skin[skin.length - 1];
        g.lineStyle(1, 0x3a2f20, 0.9);
        g.moveTo(-throat[1] * 0.85, throat[0]); g.lineTo(-BAL.half, BAL.rim);
        g.moveTo(throat[1] * 0.85, throat[0]);  g.lineTo(BAL.half, BAL.rim);
        g.lineStyle(0);
        bal.addChild(g);

        /*  The basket is its own object because it has to be drawn AFTER the
            passenger. Everything else about a passenger riding in it rather
            than under it is that one fact. */
        const basket = new P.Graphics();
        basket.beginFill(0x6d5433)
          .drawRect(-BAL.half, BAL.rim, BAL.half * 2, BAL.deep).endFill();
        // A darker rim, so the near edge reads in front of whoever is in it.
        basket.beginFill(0x4a3922)
          .drawRect(-BAL.half, BAL.rim, BAL.half * 2, 2).endFill();
        // Wicker, suggested rather than drawn: three courses is enough at
        // this size, and a fourth turns the whole thing into a smudge.
        basket.lineStyle(1, 0x4a3922, 0.5);
        for (let wy = BAL.rim + 5; wy < BAL.rim + BAL.deep; wy += 5) {
          basket.moveTo(-BAL.half, wy); basket.lineTo(BAL.half, wy);
        }
        bal.addChild(basket);
        bal.y = H() * 0.22;
        bal.x = -30;
        /*  Solid. It was 0.85 back when it was scenery you were meant to
            half-notice — but it carries a person now, and container alpha
            multiplies down into its children, so the passenger was being
            washed out along with it. Nothing you can pick somebody up with
            should look like weather. */
        /*  Above the street, below the pen.

            This used to be addChildAt(stage, 0), which reads as "behind
            everything" and was: the world's own sky is an opaque rectangle the
            full size of the panel, so a balloon put underneath it drifted the
            whole way across without a single pixel of it ever being seen. The
            stage sorts on zIndex — world sits at 0 and the pen at 10, so the
            sky belongs between them. */
        /*  The balloon hangs off the STAGE, not the world, so the zoom that
            scales the street goes straight past it — it stayed nine-tenths of
            an inch across while the people under it doubled. The whole
            container is scaled instead, and kept in step by the ticker below,
            because the zoom can change without a balloon ever being rebuilt. */
        bal.scale.set(host._zoom || 1);
        bal.zIndex = SKY_Z;
        /*  Clickable, but only ever to let people off. A Container is not hit
            tested through its children, so it needs its own area — generous,
            because it is nine pixels wide and moving. */
        /*  THE ENVELOPE IS THE TARGET, NOT THE BALLOON.

            A hitArea on a Container does not merely describe that container —
            Pixi prunes the entire subtree when the point falls outside it. So
            a hit box drawn round the envelope quietly made the passenger
            hanging beneath it untouchable, and the passenger could not be
            dragged back off. Draw it big enough to reach them instead and the
            opposite happens: the passenger is on top, and every click meant
            for the balloon lands on the person it was trying to put down.

            Both problems are the same mistake. The envelope is a sibling of
            the passenger, not their parent, so it gets its own hit box and
            they keep theirs. */
        /*  The ENVELOPE only, stopping above the basket rim. The passenger's
            head and shoulders show above that rim and they are draggable in
            their own right — so the balloon's own target has to end where they
            begin, or grabbing the passenger grabs the balloon instead. */
        g.eventMode = "static";
        g.hitArea = new P.Rectangle(-BAL.rx - 2, -BAL.ry - 2, BAL.rx * 2 + 4, BAL.ry * 2 + 4);
        // Deaf for the length of a drag, like the pen — see the walker's
        // pointerdown. Set here too, for a balloon that arrives mid-drag.
        bal.interactiveChildren = !host._dragging;
        /*  Take hold of it and it goes where you put it.

            The drift is a schedule, not a rule. Steering the balloon is how you
            get it over the person you want to pick up, and how you get it over
            the column you want to set them down in — without it, boarding is a
            game of waiting for the thing to drift past somebody.

            Same distance rule as everywhere else on this panel: under four
            pixels is a click, past that you are moving it. So one gesture on
            one target does both, and neither has to be explained. */
        g.cursor = "grab";
        let downX = null, downY = null, fromX = 0, fromY = 0, shifted = false;
        const mine = () => (host._balloon && host._balloon.node === bal && !bal.destroyed)
          ? host._balloon : null;
        g.on("pointerdown", ev => {
          const b = mine();
          if (!b) return;
          downX = ev.global.x; downY = ev.global.y;
          fromX = bal.x; fromY = bal.y;
          shifted = false;
          b.held = true;                 // the ticker leaves it alone while held
          host._dragging = true;         // and the street does not pan underneath
          host._setDrift(false);
          g.cursor = "grabbing";
        });
        g.on("globalpointermove", ev => {
          if (downX === null || !mine()) return;
          const dx = ev.global.x - downX, dy = ev.global.y - downY;
          if (!shifted && Math.abs(dx) + Math.abs(dy) < 4) return;
          shifted = true;
          bal.x = fromX + dx;
          bal.y = fromY + dy;
        });
        const release = () => {
          if (downX === null) return;
          downX = null;
          g.cursor = "grab";
          host._dragging = false;
          /*  A press and a release are two events with a frame or more between
              them, and in that gap the balloon can have left the frame and been
              destroyed — the handler still runs, on a node whose transform is
              already gone. */
          const b = mine();
          if (!b) return;
          b.held = false;
          /*  Hand the height back to the bob without a jump: `from` is the line
              it hangs about, so it has to be set to wherever it is NOW minus
              however far through the bob we happen to be. */
          b.from = bal.y - (b.riders.length * 3 + Math.sin(b.t * 0.7) * 6);
          if (!shifted) dropOffBalloon(host);
        };
        g.on("pointerup", release);
        g.on("pointerupoutside", release);
        app.stage.addChild(bal);
        host._balloon = { node: bal, envelope: g, basket, t: 0, from: bal.y,
                          riders: [], held: false, dir: 1, release };
      }
      if (host._balloon) {
        const b2 = host._balloon;
        b2.t += app.ticker.deltaMS / 1000;
        /*  Held, so the ticker keeps its hands off. Same rule as a walker
            being carried: whoever has hold of a thing owns its position, and
            two writers of one x is how a drag stops working. */
        if (!b2.held) {
          // Heavier when it is carrying somebody: slower across, riding lower.
          const load = b2.riders.length;
          //  A balloon has no engine, so the wind is most of what moves it.
          b2.node.x += balloonDrift(load) * b2.dir * windHelp(b2.dir);
          b2.node.y = b2.from + load * 3 + Math.sin(b2.t * 0.7) * 6;

          /*  Zoom can change between frames. Compared before assigning so a
              still scene is not rewriting a transform sixty times a second. */
          const bz = host._zoom || 1;
          if (b2.node.scale.x !== bz) {
            b2.node.scale.set(bz);
            for (const r of b2.riders) if (r.node && !r.node.destroyed) {
              // Counter-scaled: the sprite inside is already drawn at zoom, so
              // without this a passenger would render at zoom squared.
              r.node.scale.set(Math.sign(r.node.scale.x || 1) / bz, 1 / bz);
            }
          }

          if (load) {
            /*  CARRYING SOMEBODY: it turns at the edges instead of leaving.

                An empty balloon is scenery and is meant to pass. One with a
                passenger in it is holding a person you put there, and sailing
                off the side with them is both alarming and the thing that used
                to break: the balloon was destroyed at the edge and took a live,
                fully-wired walker down with it.

                Now it simply cannot reach the edge while loaded. It works the
                room until you let them out. */
            const edge = (BAL.rx + 6) * bz;
            const far = app.screen.width - edge;
            if (b2.node.x < edge)      { b2.node.x = edge; b2.dir = 1; }
            else if (b2.node.x > far)  { b2.node.x = far;  b2.dir = -1; }
            // The passenger faces the way they are going, like everyone else.
            for (const r of b2.riders) {
              if (r.node && !r.node.destroyed) r.node.scale.x = Math.abs(r.node.scale.x) * b2.dir;
            }
          }
          // Empty, and past the far side: gone, as it always was.
          else if (b2.node.x > app.screen.width + 30) landBalloon(host);
        }
      }

      /*  And birds, more often than the balloon.

          A skein of three or four, flapping out of step with each other so
          they read as birds rather than a decal. Same rules: sky only, never
          interactive, gone when they leave the frame. */
      if (SKY && !host._birds && Math.random() < 0.0016) {
        const flock = new P.Container();
        const n = 3 + Math.floor(Math.random() * 3);
        const dir = Math.random() < 0.5 ? 1 : -1;
        const marks = [];
        for (let i = 0; i < n; i++) {
          const g = new P.Graphics();
          // Behind the leader and a little above or below, the way they fly.
          g.x = -i * (11 + Math.random() * 7) * dir;
          g.y = i * (4 - Math.random() * 8);
          flock.addChild(g);
          marks.push({ g, phase: Math.random() * 6.28, rate: 6 + Math.random() * 4 });
        }
        flock.y = H() * (0.1 + Math.random() * 0.16);
        flock.x = dir > 0 ? -40 : app.screen.width + 40;
        /*  Dark birds or pale ones, decided per flock. A single dark tone
            vanished into the sky it was drawn on; silhouettes read one way
            against a bright sky and the other way against a dim one, and
            picking per flock gets both without knowing which sky it is. */
        flock.alpha = 0.75;
        host._birdTone = Math.random() < 0.5 ? 0x11151b : 0xe8ece6;
        /*  Under the balloon, not level with it.

            Both sat at SKY_Z, and equal keys fall back to the order the stage
            happened to receive them in. The balloon and the flock each arrive
            on their own schedule, so which one was in front changed from one
            run to the next. A gull is a speck and a balloon is a vehicle;
            there is a right answer here and it should not be a coin toss. */
        flock.zIndex = SKY_Z - 1;
        app.stage.addChild(flock);
        host._birds = { node: flock, marks, dir, t: 0 };
      }
      if (host._birds) {
        const f = host._birds;
        f.t += app.ticker.deltaMS / 1000;
        //  With the wind they make time; against it they labour.
        f.node.x += 0.9 * f.dir * windHelp(f.dir);
        f.node.y += Math.sin(f.t * 0.5) * 0.12;
        for (const m of f.marks) {
          // Two strokes of a wing, redrawn as the beat opens and closes.
          const beat = Math.sin(f.t * m.rate + m.phase);
          const lift = 2.2 * beat;
          m.g.clear();
          m.g.lineStyle(1, host._birdTone === undefined ? 0x11151b : host._birdTone, 0.95);
          m.g.moveTo(-3, lift); m.g.lineTo(0, -lift * 0.5);
          m.g.lineTo(3, lift);
        }
        if (f.node.x < -60 || f.node.x > app.screen.width + 60) {
          f.node.destroy({ children: true });
          host._birds = null;
        }
      }

      /*  NOTHING TO DRIFT ALONG IS NOT A REASON TO SHAKE.

          The wrap used to be `x < -(worldW - screenW)` with no check that the
          street is longer than the window. With four parishes it is not, that
          span goes NEGATIVE, and the test reads `x < +200` — true on the very
          first frame. So every frame moved the street a quarter pixel and then
          snapped it back to 0, which is the juddering pan you see on a short
          street. A street that already fits simply has nowhere to go. */
      /*  THE CLOCK.

          Climb to the top of the panel, turn, come back down, and set. The
          light is read off the disc's own height, so moving it is the only
          thing the hour needs: `_relight` repaints the sky and the disc, and
          everything heavier waits for the handover at the horizon.

          `_relight` is called only when the QUANTISED height changes, because
          it mints a gradient texture. At a pixel a second that is about once
          every twelve seconds rather than sixty times a second.

          Hands off while you are holding it, and off entirely for anyone who
          asked for less motion — a sky that restyles itself unbidden is
          exactly what that setting means. */
      const sn = host._sun;
      if (sn && !sn.destroyed && host._relight && host._sunHorizon && !host._dragging &&
          !matchMedia("(prefers-reduced-motion: reduce)").matches) {
        const rate = NIGHT ? MOON_RATE : SUN_RATE;
        const step = rate * (app.ticker.deltaMS / 1000) * (host._sunDir || 1);
        let y = sn.__sy + step;
        if (y <= host._sunTop) { y = host._sunTop; host._sunDir = 1; }
        //  Only on the way DOWN. A disc you dragged below the line is climbing
        //  out of there, and passing the horizon upward is a sunrise.
        if (y >= host._sunHorizon && host._sunDir === 1) {
          if (host._sunSet) host._sunSet();
        } else {
          const was = SUN_LOW;
          sn.__place(sn.__sx, y);
          setSunLow(y, host._sunHorizon);
          if (SUN_LOW !== was) host._relight();
        }
      }

      /*  THE CAMERA MOVE A BEAT ASKS FOR.

          Eased both ends, because a story cut is a move between two places
          somebody chose and a linear slide reads as machinery. Cancels the
          drift rather than fighting it: the two write the same number. */
      if (host._panTo) {
        const p = host._panTo;
        p.t += app.ticker.deltaMS;
        const k = Math.min(1, p.t / p.dur);
        const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
        host._world.x = p.from + (p.to - p.from) * e;
        if (k >= 1) host._panTo = null;
      }

      if (host._drift && !host._panTo) {
        const span = host._worldW - app.screen.width;
        if (span > 0) {
          host._world.x -= 0.25;
          if (host._world.x < -span) host._world.x = 0;
        } else if (host._world.x !== 0) {
          host._world.x = 0;
        }
      }
    });

    if (window.ResizeObserver) {
      /*  The ground line and everyone's feet are laid out against the panel's
          height, so stretching the canvas alone leaves the horizon where it
          was and the walkers standing in mid-air. The scene has to be rebuilt.

          Debounced, because dragging a tile's edge fires this continuously and
          each rebuild is ~200 display objects. The scroll position is on the
          world container, which survives the rebuild, so your place in the
          street is kept. */
      new ResizeObserver(() => host._reflowNow()).observe(shell);
    }
  }

  const app = host._app, world = host._world;
  host._renderId = (host._renderId || 0) + 1;
  host._worldW = worldW;

  /*  Where everyone was standing a moment ago.

      Read before the scene is torn down so the rebuilt cast can start from
      the old arrangement and walk to the new one. Keyed by uid, so a person
      who was on screen keeps their thread through the change; anyone new just
      appears where they belong. */
  /*  Destroyed nodes are skipped rather than read. A Pixi node whose transform
      has been torn down throws on .x, and this loop touches every walker in
      the cast before anything else happens — so one destroyed node anywhere in
      that list takes the whole render down, and with it the panel. Whoever
      destroyed it has already decided that person needs rebuilding; there is
      no last position worth recovering. */
  const wasAt = new Map();
  for (const w of host._walkers || []) {
    if (w.node && !w.node.destroyed) wasAt.set(w.slug, { x: w.node.x, y: w.node.y });
  }

  /*  Anything still held when a rebuild lands — a drag interrupted by a model
      change, a timer, a resize — is on the stage, which nothing below clears.
      Sweep it up here or it outlives the rebuild as a duplicate. */
  if (host._lifted) {
    if (host._lifted.parent) host._lifted.parent.removeChild(host._lifted);
    host._lifted = null;
  }
  world.removeChildren();
  host._walkers = [];
  host._ensureNameFor = new Map();

  // Both directions of the person↔place relation, so a click either way can
  // light the other side without walking the records again.
  const byPlace = new Map();
  for (const [person, places] of whereByPerson) {
    for (const pl of places) {
      let set = byPlace.get(pl);
      if (!set) byPlace.set(pl, set = new Set());
      set.add(person);
    }
  }
  host._related = { byPerson: whereByPerson, byPlace };

  const H = () => app.screen.height || 150;
  const groundY = () => H() * GROUND;
  /*  SIGN_BOARD_Y is declared up beside the store that measures against it.
      A second copy here is how the two came to disagree, and a stored offset
      is meaningless without the base it was written against. */

  /*  What hour it is, before anything is painted in it.

      The sun is built further down, but where it hangs is already known, and
      every colour from here on reads DUSK — so this has to be settled first or
      the sky would be a frame behind the sun that decides it. */
  setSunLow(GRID ? 0
                 : (SUN_POS ? SUN_POS.fy * app.screen.height : 30 * Z),
            H() * GROUND);

  /*  Sky and ground, redrawn with the scene so a resized panel keeps its
      horizon — and drawn as two separate things with the sun in between them,
      because the ground has to be IN FRONT of the sun. One rectangle behind it
      meant a sun taken down to the horizon sat on the field like a coin on a
      table. Sky, sun, then ground over the top of both is what lets it set. */
  const bg = new P.Graphics();          // the grid board, or nothing
  const groundG = new P.Graphics();     // the street, over the top of the sun
  //  The sky is a ramp rather than a fill, so the hour can gather toward the
  //  horizon. With the sun up, both ends are the sky you chose and it paints
  //  exactly as the flat rectangle it replaced.
  const skyBand = GRID ? null : new P.Sprite(gradientTexture(P, skyHigh(), skyLow()));
  /*  And the ground is a ramp too, darkening toward the bottom of the panel.

      A flat field is the one thing on this street with no depth cue in it at
      all: the sky has its hour, the buildings have their own shading, and the
      ground was a single colour running to the edge of the screen, which reads
      as a wall rather than as a surface you are looking across. Falling away
      into shadow at the near edge is what tells the eye it is a plane.

      It also buys back the contrast the captions need. Names sit in the top of
      this band, where it is still the colour you chose; what darkens is the
      empty strip below them. */
  const groundBand = GRID ? null : new P.Sprite(P.Texture.WHITE);
  const paintBg = () => {
    bg.clear();
    groundG.clear();
    if (GRID) {
      // A board, not a landscape: no horizon, because nothing here is standing
      // anywhere. Faint rules instead, so the ranks read as ranks.
      bg.beginFill(sceneGrid()).drawRect(0, 0, Math.max(worldW, app.screen.width), H()).endFill();
      return;
    }
    /*  Floored to the panel, exactly as the grid already was. The world is
        sized to the places in it, so an empty pile — or one where nothing is
        geocoded yet — collapsed the street to a 140px sliver at the far left
        and left the rest of the panel blank. There should always be somewhere
        to stand, even before anybody does. */
    const bgW = Math.max(worldW, app.screen.width);
    //  The field itself as a ramp, and the horizon line drawn on top of it.
    groundBand.texture = gradientTexture(P, intHex(sceneGround()),
                                            intHex(mixInt(sceneGround(), 0x000000, 0.42)));
    groundBand.x = 0;
    groundBand.y = H() * GROUND;
    groundBand.width = bgW;
    groundBand.height = Math.max(1, H() - H() * GROUND);
    groundG.beginFill(sceneEdge()).drawRect(0, H() * GROUND, bgW, 2).endFill();
    skyBand.texture = gradientTexture(P, skyHigh(), skyLow());
    skyBand.x = 0;
    skyBand.y = 0;
    skyBand.width = bgW;
    skyBand.height = H() * GROUND;
  };
  paintBg();
  world.addChild(bg);
  if (skyBand) {
    skyBand.eventMode = "none";
    world.addChild(skyBand);
  }

  /*  THE SUN, OR THE MOON.

      One of the two is always up, and which one is the plainest possible
      statement of what hour it is — plainer than a sky colour, which somebody
      may have set to anything.

      It does not slide past as you walk the street. The sun over Longforgan is
      the same sun over Dundee; a second copy scrolling by would be a lie about
      a very old fact. See where it is added for how that is arranged.

      Drawn rather than fetched, like everything else in this sky. */
  if (!GRID) {
    if (host._sun && !host._sun.destroyed) host._sun.destroy();
    const sun = new P.Graphics();
    const R = 9 * Z;
    /*  Where you put it, or — until you have — over toward the left. NOT the
        top right corner, which is where the zoom, the view switch and the play
        button live; a moon behind a row of buttons reads as a stray graphic
        rather than as the sky.

        Drawn at the origin and moved by the container's own x and y, so
        dragging it is one assignment rather than a redraw. */
    const cx = 0, cy = 0;
    /*  Held in SCREEN coordinates, not world ones. It lives in the world so it
        can be drawn just above the sky, but it is still the same sun over
        every place on the street, so the ticker cancels the pan back out of it
        and it stays put while the street walks past underneath. */
    sun.__place = (sx, sy) => {
      sun.__sx = sx; sun.__sy = sy;
      sun.x = sx - (host._world ? host._world.x : 0);
      sun.y = sy;
      if (host._relight) host._relight();
    };
    /*  Whatever the last render left here is a closure over a sun and a sky
        that have both just been thrown away. Cleared before the first
        __place, and set again once there is something to repaint. */
    host._relight = null;
    sun.__place(SUN_POS ? SUN_POS.fx * app.screen.width
                        : Math.max(46 * Z, app.screen.width * 0.17),
                SUN_POS ? SUN_POS.fy * app.screen.height : 30 * Z);
    /*  Redrawn rather than built once, because the disc is one of the things
        the hour colours: white-gold up high, orange partway down, deep red on
        the deck. Same DUSK ramp the sky reads, so the two can never disagree
        about how late it is. */
    sun.__draw = () => {
      sun.clear();
      const D = dusk(), t = duskT();
      const disc = duskMix(D.discLo, D.discMid, D.discHi, t);
      const coro = mixInt(D.coroHi, D.coroLo, t);
      /*  The corona widens and thickens as it drops. Low means a long way
          through the air, and the glow swelling is the part of that you can
          actually see at this size. A high moon has none of it at all, which
          is why the base amount comes off the palette rather than being a
          number written here. */
      const spread = 1 + t * 0.5;
      sun.beginFill(coro, D.glow + t * D.glowRise);
      sun.drawCircle(cx, cy, R * 2.1 * spread); sun.endFill();
      sun.beginFill(coro, D.glow * 1.6 + t * D.glowRise * 1.45);
      sun.drawCircle(cx, cy, R * 1.5 * spread); sun.endFill();
      if (NIGHT) {
        /*  A FULL MOON WITH ITS SEAS ON, NOT A CRESCENT.

            This used to be a disc with a second disc cut out of it. At nine
            pixels across, that reads as a circle somebody has taken a bite out
            of rather than as a phase — there is no room for the cusps that
            make a crescent legible, and the notch just looks like a drawing
            error. A round moon has a shape everyone knows on sight.

            What makes it read as the moon rather than as a pale dot is the
            markings. Six of them, in the arrangement of the near side, so the
            face is the face you actually look up at. */
        /*  AND IT FADES AS IT GOES DOWN.

            A moon on the horizon is being looked at through the whole depth of
            the air, and it goes thin and washy long before it touches the
            ground. Holding full strength all the way down made it look like a
            lamp being lowered on a wire. The halo above is deliberately left
            out of this: haze is what takes the disc away, and the same haze is
            what the glow around it is made of, so as one goes the other
            comes.

            READ OFF SUN_LOW ITSELF, NOT THE EASED duskT. Everything else on
            this street holds its ordinary colour through the top half of the
            sky and only turns near the ground, because that is how the light
            behaves. A moon does not: it is being outshone rather than
            reddened, and it starts losing that argument from the moment the
            sky begins to lift. On the squared curve it stayed solid until it
            was almost down and then went all at once. Straight off the height,
            it is already going by halfway. */
        const wash = SUN_LOW;
        const lit = 1 - wash * D.thin;
        /*  One flat disc, and that is the whole of the body.

            The first go had a darker disc under a smaller brighter one, for an
            edge that fell off toward the limb. At this size that rim was half
            the moon: what came out was a circle with a dark bite in it, which
            is the exact thing this was meant to stop being. Shading needs room
            the drawing does not have. */
        //  Whitening on the same straight ramp, so the colour and the fading
        //  are one movement instead of two that start at different heights.
        const pale = duskMix(D.discLo, D.discMid, D.discHi, wash);
        sun.beginFill(pale, 0.95 * lit);
        sun.drawCircle(cx, cy, R);
        sun.endFill();
        /*  The maria. Grey-blue rather than black, because they are basalt
            plains catching the same light as the highlands around them, and
            small: at nine pixels across, a patch of any size reads as damage
            to the circle rather than as a marking on it. They fade faster than
            the disc does, so a low moon is a plain pale coin and the face only
            comes back as it rises. Cubed rather than squared: the markings are
            the first thing washing takes off a moon, well before the disc
            itself gives up. */
        sun.beginFill(mixInt(pale, 0x39415e, 0.26), 0.6 * lit * lit * lit);
        for (const sea of MOON_MARIA) {
          for (const [mx, my, mr] of sea) {
            sun.drawCircle(cx + mx * R, cy + my * R, mr * R);
          }
        }
        sun.endFill();
        return;
      }
      sun.beginFill(disc, 0.95); sun.drawCircle(cx, cy, R); sun.endFill();
    };
    sun.__draw();
    /*  THE HOUR, WHILE YOU ARE STILL HOLDING IT.

        Only the two things the eye is on during a drag: the sky and the disc.
        Everything else that reads DUSK — the lettering, the scenery, a
        column's own backdrop — waits for the drop and a full render, because
        rebuilding the cast sixty times a second to watch a sunset would be
        the one expensive thing on this panel. */
    host._relight = () => {
      setSunLow(sun.__sy, H() * GROUND);
      paintBg();
      sun.__draw();
    };
    host._relight();

    /*  What the clock in the ticker needs, in the panel's own pixels. Kept on
        the host because the ticker is built once, long before this render, and
        cannot see the height or the radius from in there. */
    host._sunHorizon = H() * GROUND;
    host._sunTop = R * 1.6;
    if (host._sunDir === undefined) host._sunDir = -1;   // start by climbing

    /*  SETTING IS WHAT ENDS THE DAY.

        Put the sun below the ground line and the sky changes hands: the moon
        comes up on the far side, low, where a body that has just set is not.
        The moon goes down in its turn and it is morning. One move, repeated,
        carries the whole cycle, whether the hand does it or the clock does.

        It rises at a fixed low height rather than at the height it set from,
        because setting means BELOW the horizon and starting the next body down
        there would hide it behind the ground. */
    host._sunSet = () => {
      let fx = (app.screen.width - sun.__sx) / app.screen.width;
      /*  NIGHT is still the hour that is ending, so false here means the sun
          is going down and the moon is the one coming up. It gets its night's
          worth of drift; the sun rises opposite whatever the moon did. */
      if (!NIGHT) {
        host._moonDrift = ((host._moonDrift || 0) + LUNAR_DRIFT) % 1;
        fx += host._moonDrift;
      }
      fx = ((fx % 1) + 1) % 1;
      SUN_POS = {
        fx: Math.max(0.06, Math.min(0.94, fx)),
        fy: Math.max(0, (host._sunHorizon - R * 1.6) / app.screen.height),
      };
      saveSunPos();
      host._sunDir = -1;              // the new one comes up
      if (host._toggleNight) host._toggleNight();   // redraws at the new hour
    };
    /*  The balloon and the birds cross in FRONT of it — a bird passing behind
        the moon would be a bird in space. They hang off the stage, and the
        stage draws over the world, so that comes free. */
    /*  PRESS THE SKY TO CHANGE THE HOUR.

        The switch in the bar is a button among nine other buttons and reads as
        a setting. The sun is the thing itself: putting it down and bringing
        the moon up is what you actually mean, and it is where you are already
        looking when you think of it.

        The bar keeps its switch — this is a second way to the same place, not
        a replacement, and a control you can only reach by finding a nine-pixel
        disc in a dark sky would be a worse one. */
    sun.eventMode = "static";
    sun.cursor = "grab";
    //  A Graphics is hit tested by what it drew, and a crescent has a bite out
    //  of it — so it gets a square box you can actually hit.
    sun.hitArea = new P.Rectangle(-R * 1.6, -R * 1.6, R * 3.2, R * 3.2);
    /*  PRESS TO CHANGE THE HOUR, DRAG TO HANG IT SOMEWHERE ELSE.

        Same four pixels that tell a click from a drag everywhere else on this
        panel, so one gesture on one target does both and neither has to be
        explained. */
    let sdx = null, sdy = null, sfx = 0, sfy = 0, smoved = false;
    sun.on("pointerdown", ev => {
      sdx = ev.global.x; sdy = ev.global.y;
      sfx = sun.__sx; sfy = sun.__sy;      // screen, like the pointer deltas
      smoved = false;
      host._dragging = true;               // the street does not pan underneath
      sun.cursor = "grabbing";
    });
    sun.on("globalpointermove", ev => {
      if (sdx === null) return;
      const mx = ev.global.x - sdx, my = ev.global.y - sdy;
      if (!smoved && Math.abs(mx) + Math.abs(my) < 4) return;
      smoved = true;
      /*  Kept on the panel, and allowed to go down BEHIND the horizon now that
          the ground draws over it. Not all the way behind: it stops with about
          half of it still showing, because a sun you have pushed out of sight
          is a sun you can never take hold of again. */
      sun.__place(Math.max(R, Math.min(app.screen.width - R, sfx + mx)),
                  Math.max(R, Math.min(H() * GROUND + R * 0.55, sfy + my)));
    });
    const sunDrop = () => {
      if (sdx === null) return;
      sdx = sdy = null;
      sun.cursor = "grab";
      host._dragging = false;
      if (!smoved) { if (host._toggleNight) host._toggleNight(); return; }

      SUN_POS = { fx: sun.__sx / app.screen.width,
                  fy: sun.__sy / app.screen.height };
      saveSunPos();
      /*  A DRAG HANGS IT SOMEWHERE. IT DOES NOT END THE DAY.

          Only the clock walking the disc down into the horizon changes the
          hour. Put it wherever you like, below the ground line included, and
          it climbs back out from there rather than taking your positioning as
          an instruction about the time of day. The switch in the bar is still
          how you say that deliberately. */
      host._sunDir = -1;
      //  Now the rest of the scene catches up with the hour the drag settled on.
      host._noTween = true;
      renderPromenadePixi(V(), host);
    };
    sun.on("pointerup", sunDrop);
    sun.on("pointerupoutside", sunDrop);
    /*  Right-click puts it back where it started, the same erase as everywhere
        else here. */
    sun.on("rightdown", ev => {
      if (ev && ev.preventDefault) ev.preventDefault();
      SUN_POS = null;
      saveSunPos();
      sun.__place(Math.max(46 * Z, app.screen.width * 0.17), 30 * Z);
    });
    /*  JUST ABOVE THE SKY, AND NOTHING ELSE.

        It used to hang off the stage, over the top of the whole street, so a
        moon dropped low sat in FRONT of the roofs — a moon in the room. Added
        here, with only the ground and the sky band in the world so far, it
        lands on the sky and under everything standing on the ground, which is
        where a moon is. The pan is cancelled back out in the ticker, so it
        still does not walk with the street. */
    world.addChild(sun);            // straight onto the sky band, and no higher
    host._sun = sun;
  } else {
    //  No horizon on the grid, so nothing for it to be above, and no hour for
    //  anything to be repainted in.
    host._relight = null;
    host._sunSet = null;
    host._sunHorizon = 0;
    if (host._sun && !host._sun.destroyed) host._sun.destroy();
    host._sun = null;
  }

  /*  THE GROUND, OVER THE TOP OF IT.

      Added after the sun and before everything that stands on the street, so
      the sun can go down behind the horizon rather than resting on it. This is
      the only reason the ground is drawn apart from the sky. */
  if (!GRID) {
    //  The field, then the horizon line on top of it.
    groundBand.eventMode = "none";
    groundG.eventMode = "none";
    world.addChild(groundBand);
    world.addChild(groundG);
  }

  /*  The scenery. One Graphics for the lot, in behind everything else the
      street draws — see SCENERY for what is in it and how to add to it.

      A piece gets a container as well as that Graphics. Anything translucent
      has to be a sprite rather than a shape: overlapping shapes in one
      Graphics composite against each other and the overlaps go darker, which
      is a seam where the drawing meant a single form. See cloudTexture. */
  if (!GRID) {
    const streetW = Math.max(worldW, app.screen.width);
    const skin = new P.Graphics();
    const skyLayer = new P.Container();
    for (const piece of SCENERY) {
      //  The store, not the table: `on` in the table is only the default.
      if (!sceneryOn(piece)) continue;
      piece.draw(skin, {
        get: k => sceneryGet(piece, k),
        P, Z, H: H(), width: streetW, ground: H() * GROUND,
        //  The street's length and the window onto it are two different
        //  numbers, and anything that parallaxes needs both.
        screenW: app.screen.width,
        sky: sceneSky(), layer: skyLayer,
        tint: amount => mixInt(sceneSky(),
                               lumOf(sceneSky()) > 0.5 ? 0x000000 : 0xffffff, amount),
        rnd: sceneryRnd(piece.id, streetW),
      });
    }
    skin.eventMode = "none";          // weather, and the moon is behind it
    skyLayer.eventMode = "none";
    world.addChild(skin);
    world.addChild(skyLayer);
    host._sky = skyLayer;             // the ticker moves what is in it
  } else {
    //  No weather on the pictogram board, and nothing for the ticker to push
    //  around. Left pointing at the last render's container it would keep
    //  moving sprites that are no longer in the world.
    host._sky = null;
  }

  /*  Column gradients: the SKY above that column, not the ground.

      The ground is the plane everybody stands on and it runs the length of the
      street — coloring one stretch of it would cut the floor into pieces and
      make the figures look like they were standing on different surfaces. The
      sky is backdrop, and backdrop is what this is for.

      Nothing at all for a place you have not colored. */
  if (!GRID) {
    for (const [slug] of placed) {
      const tint = COLUMN_TINT.get(slug);
      if (!tint) continue;
      const w = wOf.get(slug) || STEP;
      const spr = new P.Sprite(gradientTexture(P, tint.from, tint.to));
      spr.x = xOf.get(slug) - w / 2;
      spr.y = 0;
      spr.width = w;
      spr.height = H() * GROUND;      // stops at the horizon
      // Opacity on the whole ramp, so a backdrop can sit under the sky rather
      // than replacing it.
      spr.alpha = tint.alpha === undefined ? 1 : tint.alpha;
      spr.eventMode = "none";         // backdrop, and the moon is behind it
      world.addChild(spr);
    }
  }

  /*  Where scene art goes in: above the ground and above the column gradients,
      below everything added after this point.

      Scene art used to be inserted at index 1 — above the ground, which was the
      whole of the stack when that line was written. Once columns could be
      tinted, index 1 was underneath the gradients, so a colored column washed
      its own building out. A gradient is sky; a building stands in front of
      the sky. */
  /*  Smoke goes in one slot lower still, so every chimney's plume is behind
      its own roof. The layer survives a rebuild — world.removeChildren() takes
      it out but never destroys it — so it is re-parked here rather than made
      again, and the pool of puffs keeps flying through the change. */
  if (host._smokeLayer && !host._smokeLayer.destroyed) world.addChild(host._smokeLayer);
  const ART_FLOOR = world.children.length;
  host._artFloor = ART_FLOOR;

  const label = (text, size, color, extra) => new P.Text(text, {
    fontFamily: "ui-monospace, Menlo, monospace", fontSize: size, fill: color,
    ...(extra || {}),
  });

  /*  How tall this column's picture stands above the ground line, or null when
      there is no picture — or there is one and it has not arrived yet.

      Exactly the arithmetic the scene art itself uses to size and place the
      sprite, and deliberately not a second copy of it: if the two ever
      disagreed, the ribbon would hang somewhere the roof is not. */
  const sceneArtTop = slug => {
    if (!slug) return null;
    const got = sceneImage(slug);
    if (!got || got instanceof Promise) return null;
    const sc = Math.min(1, ((wOf.get(slug) || STEP) - 8 * Z) / (got.width || 1)) * Z;
    return (got.height || 0) * sc;
  };

  /*  Each signpost is one container, so a highlight can dim it with a single
      alpha rather than hunting down its post, board and text separately. */
  /*  The columns: one per place that can be drawn, plus one at the end for
      people no record places. Dropping a figure anywhere in a column puts them
      in that column — the x you released at only decides which. */
  // Only real places are columns now — the unplaced live in the pen, which is
  // not part of the street at all.
  const columns = placed.map(([slug]) => ({ slug, x: xOf.get(slug) }));
  /*  Nearest column to an x, or null when there are none.

      A pile whose places carry no coordinates has no columns at all — the
      ordinary state before a gazetteer is loaded. Returning columns[0].slug
      blind threw on the first pointer move of any drag. */
  host._columnAt = px => {
    if (!columns.length) return null;
    let best = columns[0], bestD = Infinity;
    for (const c of columns) {
      const d = Math.abs(c.x - px);
      if (d < bestD) { bestD = d; best = c; }
    }
    return best.slug;
  };
  /*  Null when that place is gone. Falling back to unknownX put the person
      off the end of the street with no signpost and no drop zone, looking
      placed while belonging to nothing. */
  const columnX = slug => {
    const c = columns.find(k => k.slug === slug);
    return c ? c.x : null;
  };
  host._columnX = columnX;

  /*  The drop zones: one dotted frame per column, the full height of the
      scene, so it is obvious both that you may drop somebody here and exactly
      how far "here" reaches. Invisible until you pick somebody up — a scene
      permanently ruled into columns would read as a chart.

      Pixi has no dashed stroke, so the dashes are drawn: short segments with
      gaps, which is also the only way to keep the dash length constant when
      the columns are wider at 3×. */
  const zoneLayer = new P.Container();
  zoneLayer.visible = false;
  world.addChild(zoneLayer);
  host._zoneLayer = zoneLayer;
  host._zones = [];
  /*  Built on demand, not on every render.

      Fifty-nine dotted frames is seven thousand line segments, and they are
      invisible except during the second or two you are actually holding
      somebody. Building them with the scene cost 30ms on every drop, sort and
      zoom — two dropped frames, exactly when you would feel it. Now they are
      made the first time you pick a person up and left alone after that.

      `visible = false` rather than `alpha = 0`, because a transparent layer is
      still submitted to the renderer every frame; an invisible one is not. */
  host._buildZones = () => {
    if (host._zones.length || GRID) return;
    const dash = 5, gap = 4;
    const top = 6, bot = H() - 6;
    for (const c of columns) {
      const g = new P.Graphics();
      const half = (wOf.get(c.slug) || STEP) / 2 - 3;
      g.lineStyle(1, 0x33ff33, 0.9);
      for (const x of [c.x - half, c.x + half]) {
        for (let y = top; y < bot; y += dash + gap) {
          g.moveTo(x, y); g.lineTo(x, Math.min(y + dash, bot));
        }
      }
      for (const y of [top, bot]) {
        for (let x = c.x - half; x < c.x + half; x += dash + gap) {
          g.moveTo(x, y); g.lineTo(Math.min(x + dash, c.x + half), y);
        }
      }
      g.alpha = 0.45;
      zoneLayer.addChild(g);
      host._zones.push({ slug: c.slug, g, x: c.x });
    }
  };

  /*  Scene art, found rather than configured.

      A place gets a picture if a picture exists with its uid as the filename:
      longforgan.png sits behind Longforgan. Nothing to point at, nothing to
      set, nothing to keep in step — name the file after the place and it
      appears.

      Loaded through a plain Image first so a place with no art costs nothing
      and says nothing: a missing file is the ordinary case, not an error.

      Centered in its column, standing on the ground line, behind the people.
      The column width is the only constraint. */
  if (!GRID) {
    /*  A render token, so a picture that arrives late is dropped rather than
        dressed for a scene that no longer exists. Comparing host._world to
        world could never work: it is the same container every time, only
        emptied between renders. */
    const myRender = host._renderId;
    //  Rebuilt with the scene, because a resize or a sort moves every column.
    host._smokeAt = [];
    /*  Made here and parented at the very end of the render, above the cast.
        Scene art arrives whenever it arrives, so the doors it carries need
        somewhere to go that is already the right depth. */
    host._doorLayer = new P.Container();
    host._doorLayer.eventMode = "static";
    const place = (c, img) => {
      if (!img || host._renderId !== myRender) return;
      // Fit the column, never blown up past its own pixels.
      const fit = Math.min(1, ((wOf.get(c.slug) || STEP) - 8 * Z) / (img.width || 1));
      /*  A ONE-PIXEL WINDOW MUST NOT VANISH.

          Nearest neighbour is right when a drawing is blown UP — it is what
          keeps pixel art crisp instead of soft. Shrinking, it is exactly
          wrong: it picks one source pixel per destination pixel and throws
          the rest away, so at the zoomed-out street a pane one pixel wide
          fell in the gap between samples and the window went out. Not dimmer.
          Gone.

          So a picture being made smaller is averaged down first, once, into a
          canvas at the size it will actually be drawn — a lit pane then
          survives as a dimmer pixel rather than as no pixel. Above 1:1 nothing
          changes and nearest still does the work.

          Cached on the image itself and keyed by the width asked for, because
          this runs for every column on every render and the answer only
          changes when the column does. */
      const src = fit < 1 ? shrunk(img, fit) : img;
      const spr = new P.Sprite(P.Texture.from(src));
      spr.texture.baseTexture.scaleMode = P.SCALE_MODES.NEAREST;
      spr.anchor.set(0.5, 1);
      spr.x = c.x;
      spr.y = groundY();
      spr.scale.set(fit < 1 ? Z : fit * Z);
      /*  A BUILDING IS SCENERY, NOT A TARGET.

          It has no listeners, but Pixi hit tests it anyway and hands it the
          press — which is fine while nothing behind it wants one, and was not
          once the moon moved in behind the roofs: dropping the moon on a
          building meant you could never pick it up again. Columns are chosen
          by arithmetic on the pointer's x, never by hitting a sprite, so
          nothing here loses anything by standing aside. */
      spr.eventMode = "none";
      // Above the ground and the column's gradient, below everyone. Clamped
      // because this can land long after the render that asked for it.
      world.addChildAt(spr, Math.min(ART_FLOOR, world.children.length));

      /*  THE CHIMNEYS OF THIS COLUMN, in world coordinates.

          Worked out here because this is the only place that knows what scale
          the picture ended up at. Marked in image pixels, drawn at `fit * Z`,
          anchored centre and standing on the ground: the same arithmetic the
          signpost anchor uses, so the two can never disagree about where a
          point on a building is. */
      const chimneys = (img.__smoke || []);
      if (chimneys.length) {
        const sc = fit * Z;
        const look = smokeOf(c.slug);
        for (const [ix, iy] of chimneys) {
          host._smokeAt.push({
            wx: c.x + (ix + 0.5 - img.width / 2) * sc,
            wy: groundY() + (iy + 0.5 - img.height) * sc,
            ink: look.ink, thick: look.thick, fade: look.fade,
            next: Math.random() * 0.9,
          });
        }
      }

      /*  THE DOOR, AND YOU KNOCK BEFORE YOU GO IN.

          Marked pixels become one box you can press, because a door is a door
          whether you drew it three pixels wide or twelve, and asking somebody
          to hit an exact pixel on a building that scales with the zoom would
          be a worse control than no control.

          One click knocks: the doorway lights twice, in the rhythm of a rap,
          and nothing else happens. Two opens it. A single click that walked
          you straight into somebody's house was the wrong manners and the
          wrong interaction — a stray press on a street full of buildings
          should not put a panel over the scene, and there was no way to find
          out a door was a door short of going through it.

          So the knock is the discovery as well as the courtesy. Hovering
          brings the doorway up faintly, knocking answers, and only then does
          it open.

          Its own node with nothing drawn in it until it lights: the building
          itself stays `eventMode = "none"` so it cannot swallow presses meant
          for the moon behind it, and this is the only interactive thing over
          that stretch of wall. */
      const doorPx = (img.__doors || []);
      if (doorPx.length && host._openDoor) {
        const sc = fit * Z;
        let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
        for (const [ix, iy] of doorPx) {
          if (ix < x0) x0 = ix; if (ix > x1) x1 = ix;
          if (iy < y0) y0 = iy; if (iy > y1) y1 = iy;
        }
        //  The doorway as drawn: what lights when you knock.
