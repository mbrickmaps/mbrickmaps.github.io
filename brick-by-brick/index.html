/* ==========================================================================
   THE PROMENADE — your people, walking the ground they are recorded on
   --------------------------------------------------------------------------
   A side-on scene you pan along. The horizontal axis is LONGITUDE: west on
   the left, east on the right, the same order you would meet these parishes
   walking across Perthshire. Signposts mark the places; each person stands
   near the places their records actually name, and paces about there.

   Two decisions worth stating, because both could have gone the other way:

   1. The axis is geography, not time. A person exists in one spot and their
      clothes carry the period instead. Time as the axis would make a queue of
      strangers; geography makes neighbors, and neighbors are what parish
      records are actually about.

   2. Nobody is invented. A person with no place named in any record does not
      get parked somewhere plausible — they wait at the end of the scene under
      their own sign, because "we do not know where he was" is a finding, not
      a gap to be filled.

   The figures are drawn from divs, deliberately: they are placeholder art
   with the era logic already wired, so a sprite sheet can replace the shapes
   later without touching how anyone is placed or dressed.
   ========================================================================== */

/*  What a person wore, inferred from when they were alive.

    Banded by the decades that actually changed silhouette in Britain, not by
    round numbers: the tall hat and frock coat give way to the bowler and sack
    suit around 1870, soft caps and shorter skirts after 1900, and everything
    after 1945 is simply "modern" because this corpus does not go there. */
/*  Loose bands, deliberately.

    These are not costume history — nobody changed coat on the stroke of 1880,
    and a parish register rarely gives you a date you would want to hang a
    decade on anyway. They are wide, they overlap in spirit, and the years are
    only there so the same person always dresses the same way. Treat them as
    "roughly this sort of century", not as a claim. */
/*  Which places each person is recorded at.

    A record that names a person and a place puts that person there. Same rule
    the connector lines use, so the map and the procession can never disagree
    about who was where. */
function peoplePlaces(model) {
  const coord = new Map();
  for (const p of model.places || []) if (p.coords) coord.set(p.slug, p.coords);
  const byId = new Map((model.entities || []).map(e => [e.slug, e]));
  const out = new Map();
  for (const b of model.records || []) {
    if (!b.valid) continue;
    const named = [b.alias ? b.alias.slug : null, ...(b.links || [])].filter(Boolean);
    const here = named.filter(s => coord.has(s));
    if (!here.length) continue;
    for (const s of named) {
      const e = byId.get(s);
      if (!e || e.kind !== "person") continue;
      let set = out.get(s);
      if (!set) out.set(s, set = new Set());
      for (const p of here) set.add(p);
    }
  }
  return { coord, byId, out };
}

/*  PixiJS 7, UMD build — a global `PIXI`, which is what the loadOnce() script
    tag can actually consume. Pixi 8 is ESM-and-async-init and would need a
    different loader for no benefit here. */
const PIXI_JS = "https://unpkg.com/pixi.js@7.4.2/dist/pixi.min.js";

/*  24 wide for a 10-wide body, and the margin is deliberate: it is where a
    carried thing goes. A hod on the shoulder, a basket held out, a scythe —
    none of them fit inside the body's own footprint, and widening the cell
    later would invalidate every sheet already drawn against it. The room is
    cheap now and impossible to add once there is art. */
const SPR_W = 24, SPR_H = 24, SPR_FRAMES = 4;
const BODY_X = 4;      // the body sits inset by this much, leaving prop room both sides

/*  One figure, recolored.

    You draw a single 64×24 strip — four frames of one walk cycle — and paint
    the swappable parts in flat key colors. Everything else passes through
    untouched, so faces, boots, whatever you like stay exactly as drawn.

        magenta #ff00ff  →  coat
        cyan    #00ffff  →  legs and arms
        yellow  #ffff00  →  hat

    Each era, and then each person, gets that strip recolored into their own
    texture. It is the old palette-swap trick, and it means one drawing dresses
    a whole parish. */
/*  Layers are drawn in the colors you drew them in.

    There was a palette-swap here once: three marker colors, a palette per
    century, and a figure recolored to suit its dates. It let one drawing
    serve five centuries, and it cost more in confusion than it ever returned —
    every question about clothing turned into a question about magenta.

    So: a pixel is the color you painted it. If you want a Georgian coat and a
    Victorian one, draw two coats and name them for who wears them. */

function seedOf(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 100000;
  return h / 1000;
}

/*  Repaint the key colors. Cached on the palette itself, because a parish of
    sixty people is sixty little 64×24 canvases otherwise, redrawn on every
    resize and every sort. */
const sheetCache = new Map();
/*  ONE CELL, SHARED BY EVERY LAYER.

    A figure is four rasters stacked — body, bottom, top, hat — all the same
    size and all in the same space. The bottom edge of that space is the ground
    the person stands on; the center line is the person. You draw each element
    where it actually goes, and the layers simply lie on top of one another.

    Which is why there are no anchors and nothing to configure: a taller cell
    is a taller hat, because the extra room is above the head. A 24 x 24 cell
    is an ordinary figure; a 40 x 32 cell is the same figure with eight pixels
    of headroom and eight either side for a brim or a carried tool. */
const SWING = [0, 1, 0, -1];          // pass, stride, pass, stride the other way

function sheetCanvas() {
  const c = document.createElement("canvas");
  c.width = SPR_W * SPR_FRAMES;
  c.height = SPR_H;
  const g = c.getContext("2d", { willReadFrequently: true });
  g.imageSmoothingEnabled = false;
  return [c, g];
}

const SKIN = "#c9a689", SKIN_SHADE = "#aa8970", HAIR = "#4a3b2a";

/*  The body: skin and hair, no clothes. */
function makeBodySheet() {
  const [c, g] = sheetCanvas();
  for (let f = 0; f < SPR_FRAMES; f++) {
    const ox = f * SPR_W + BODY_X, s = SWING[f];
    const box = (x0, y0, x1, y1, col) => { g.fillStyle = col; g.fillRect(x0, y0, x1 - x0 + 1, y1 - y0 + 1); };
    box(ox + 5, 2, ox + 10, 7, SKIN);            // head
    box(ox + 5, 1, ox + 10, 2, HAIR);            // scalp, so a hatless head is not an egg
    box(ox + 10, 3, ox + 10, 7, SKIN_SHADE);     // one column of form
    box(ox + 7, 8, ox + 8, 8, SKIN_SHADE);       // neck
    box(ox + 5, 9, ox + 10, 16, SKIN);           // torso
    box(ox + 10, 9, ox + 10, 16, SKIN_SHADE);
    box(ox + 3, 10 - s, ox + 4, 15 - s, SKIN);   // arms swing opposite the legs
    box(ox + 11, 10 + s, ox + 12, 15 + s, SKIN);
    box(ox + 12, 10 + s, ox + 12, 15 + s, SKIN_SHADE);
    box(ox + 5, 17, ox + 10, 17, SKIN);          // hips
    box(ox + 5 - s, 18, ox + 7 - s, 23, SKIN);   // legs
    box(ox + 8 + s, 18, ox + 10 + s, 23, SKIN_SHADE);
  }
  c.__frames = SPR_FRAMES;
  return c;
}

function bodySpaceSheet(draw) {
  const [c, g] = sheetCanvas();
  for (let f = 0; f < SPR_FRAMES; f++) draw(g, f * SPR_W + BODY_X, SWING[f], f);
  c.__frames = SPR_FRAMES;
  return c;
}

/*  Trousers, not painted legs — a pixel proud of the limb inside, with a seat
    joining them, or it reads as bare skin in a different color. */
function makeBottomSheet() {
  const K = "#4a5568";                       // trousers
  return bodySpaceSheet((g, x, s) => {
    g.fillStyle = K;
    g.fillRect(x + 4, 17, 8, 3);              // seat
    g.fillRect(x + 4 - s, 19, 3, 5);          // left leg
    g.fillRect(x + 9 + s, 19, 3, 5);          // right leg
  });
}

/*  A coat with a shape of its own: shoulders past the torso, and a skirt
    hanging below the waist over the top of the trousers. */
function makeTopSheet() {
  const C = "#2f3542", T = "#4a5568";        // coat, and its cuffs and collar
  return bodySpaceSheet((g, x, s) => {
    g.fillStyle = C;
    g.fillRect(x + 3, 9, 10, 10);             // body of the coat, down over the hips
    g.fillRect(x + 4, 8, 8, 2);               // shoulders
    g.fillStyle = T;
    g.fillRect(x + 7, 8, 2, 3);               // collar
    g.fillRect(x + 2, 10 - s, 3, 7);          // sleeves swing with the arms
    g.fillRect(x + 11, 10 + s, 3, 7);
  });
}

/*  A brim wider than the head, which is the whole of what says "hat". */
function makeHatSheet() {
  const K = "#16181c";                       // hat
  return bodySpaceSheet((g, x) => {
    g.fillStyle = K;
    g.fillRect(x + 2, 2, 12, 2);              // brim
    g.fillRect(x + 4, 0, 8, 3);               // crown
  });
}

/*  A SHIFT OF TINT, so a parish is not one figure repeated.

    Twenty mill workers in the same drawn coat should read as twenty people,
    not as one person printed twenty times — but they must still read as mill
    workers, so the shift has to be small: a few degrees of hue and a little
    lightness, never enough to turn a brown coat blue.

    Seeded from the uid, so somebody is the same shade in every render, this
    session and the next. Bucketed into a handful of variants rather than one
    per person, because each distinct tint is another GPU texture and a parish
    of three hundred does not need three hundred of them. */
const TINTS = 7;
const tintCache = new Map();

function tintSheet(base, bucket) {
  if (!bucket) return base;                       // bucket 0 is the drawing as drawn
  if (!base.__tintId) base.__tintId = ++dressIds;
  const key = base.__tintId + ":" + bucket;
  if (tintCache.has(key)) return tintCache.get(key);

  const c = document.createElement("canvas");
  c.width = base.width; c.height = base.height;
  const g = c.getContext("2d", { willReadFrequently: true });
  g.imageSmoothingEnabled = false;
  g.drawImage(base, 0, 0);
  const im = g.getImageData(0, 0, c.width, c.height), d = im.data;

  // Spread evenly either side of the drawing rather than always one way.
  const t = (bucket / (TINTS - 1)) * 2 - 1;       // -1 … 1
  const dh = t * 14, dl = t * 0.05;               // degrees, and a fraction

  for (let i = 0; i < d.length; i += 4) {
    if (!d[i + 3]) continue;
    const r = d[i] / 255, gg = d[i + 1] / 255, b = d[i + 2] / 255;
    const mx = Math.max(r, gg, b), mn = Math.min(r, gg, b);
    let h = 0, sat = 0;
    const l = (mx + mn) / 2;
    if (mx !== mn) {
      const dd = mx - mn;
      sat = l > 0.5 ? dd / (2 - mx - mn) : dd / (mx + mn);
      h = mx === r ? ((gg - b) / dd + (gg < b ? 6 : 0))
        : mx === gg ? (b - r) / dd + 2
        : (r - gg) / dd + 4;
      h *= 60;
    }
    const h2 = (h + dh + 360) % 360;
    const l2 = Math.max(0, Math.min(1, l + dl));
    // back to rgb
    const cc = (1 - Math.abs(2 * l2 - 1)) * sat;
    const x = cc * (1 - Math.abs(((h2 / 60) % 2) - 1));
    const m = l2 - cc / 2;
    let rr, g2, bb;
    if (h2 < 60)       { rr = cc; g2 = x;  bb = 0; }
    else if (h2 < 120) { rr = x;  g2 = cc; bb = 0; }
    else if (h2 < 180) { rr = 0;  g2 = cc; bb = x; }
    else if (h2 < 240) { rr = 0;  g2 = x;  bb = cc; }
    else if (h2 < 300) { rr = x;  g2 = 0;  bb = cc; }
    else               { rr = cc; g2 = 0;  bb = x; }
    d[i]     = Math.round((rr + m) * 255);
    d[i + 1] = Math.round((g2 + m) * 255);
    d[i + 2] = Math.round((bb + m) * 255);
  }
  g.putImageData(im, 0, 0);
  tintCache.set(key, c);
  return c;
}

/*  Body first, then each layer over it. Cached, because a parish of mill
    workers is one composite shared by all of them.

    `cache` is off for anything being edited: the cache is keyed on each
    canvas's identity, and drawing into a canvas does not change its identity,
    so a sheet you are painting would keep handing back the composite from
    before your first stroke. */
const dressCache = new Map();
let dressIds = 0;

function dressBody(layers, cache) {
  const worn = (layers || []).filter(l => l && l.img);
  if (!worn.length) return null;
  const useCache = cache !== false;
  const idOf = cv => cv.__dressId || (cv.__dressId = ++dressIds);
  const key = worn.map(l => idOf(l.img)).join(">");
  if (useCache && dressCache.has(key)) return dressCache.get(key);

  /*  Every layer brings its own cell, and the composite takes the largest —
      so a sheet drawn on a roomier grid keeps its headroom instead of being
      cropped to the body's box.

      Two rules place everything, and they are the only two that survive a
      change of size: CENTERED on the vertical axis, because a person is
      symmetrical about it, and sitting on the BOTTOM edge, because that edge
      is the ground. Extra height is therefore headroom, which is exactly where
      a tall hat needs it. */
  const cells = worn.map(({ img }) => {
    const n = img.__frames || SPR_FRAMES;
    return { img, n, w: (img.width || SPR_W * n) / n, h: img.height || SPR_H };
  });
  const cw = Math.max(SPR_W, ...cells.map(c => c.w));
  const ch = Math.max(SPR_H, ...cells.map(c => c.h));

  const gcd = (x, y) => y ? gcd(y, x % y) : x;
  const frames = Math.min(24, cells.reduce((m, c) => m * c.n / gcd(m, c.n), 1));

  const c = document.createElement("canvas");
  c.width = cw * frames; c.height = ch;
  const g = c.getContext("2d");
  g.imageSmoothingEnabled = false;
  for (const l of cells) {
    const dx = Math.round((cw - l.w) / 2), dy = ch - l.h;
    for (let f = 0; f < frames; f++) {
      // A layer with fewer frames repeats: a one-frame hat sits still on a
      // four-frame walk without anybody drawing it four times.
      g.drawImage(l.img, (f % l.n) * l.w, 0, l.w, l.h, f * cw + dx, dy, l.w, l.h);
    }
  }
  c.__cellW = cw; c.__cellH = ch; c.__frames = frames;
  c.__footY = ch;                       // the ground is the bottom edge
  if (useCache) dressCache.set(key, c);
  return c;
}

/*  Singling somebody out, without disturbing the scene.

    Everything unrelated drops to a quarter opacity and everything related
    stays lit — the person, and the parishes their records put them in; or the
    parish, and everyone recorded there. The scene is never rebuilt, so the
    walkers keep their stride and the view keeps its place.

    Clicking the same thing again, or the empty ground, clears it. */
const FOCUS_DIM = 0.22;

function toggleFocus(host, kind, slug) {
  const same = host._focus === slug;
  host._focus = same ? null : slug;
  host._focusKind = same ? null : kind;
  applyFocus(host);
}

function applyFocus(host) {
  const focus = host._focus, kind = host._focusKind;
  const rel = host._related || { byPerson: new Map(), byPlace: new Map() };

  const litPlaces = !focus ? null
    : kind === "person" ? (rel.byPerson.get(focus) || new Set())
    : new Set([focus]);
  /*  A column you made has no records behind it, so there is nothing to look
      up — who is in it is simply who you put in it. Same for the promenade.
      Read straight off the placements rather than off the relation map. */
  const fromPins = () => {
    const set = new Set();
    if (!host._pinned) return set;
    for (const [uid, where] of host._pinned) if (where === focus) set.add(uid);
    return set;
  };
  /*  A column's people are whoever the records put there AND whoever you did.
      One rule for both kinds: a parish knows its own from the pile, a group you
      invented knows only what you told it, and a parish you have also dragged
      people into is both. */
  const litPeople = !focus ? null
    : kind === "column" ? new Set([...(rel.byPlace.get(focus) || []), ...fromPins()])
    : new Set([focus]);

  for (const w of host._walkers || []) {
    const lit = !focus || litPeople.has(w.slug);
    w.node.alpha = lit ? w.base : w.base * FOCUS_DIM;
    // The selected person keeps their name up; everyone else waits for hover.
    if (focus === w.slug) {
      const make = host._ensureNameFor && host._ensureNameFor.get(w.slug);
      if (make) make();
    }
    if (w.nameNode) w.nameNode.visible = focus === w.slug;
  }
  for (const s of host._signs || []) {
    const lit = !focus || litPlaces.has(s.slug);
    s.node.alpha = lit ? 1 : FOCUS_DIM;
  }
  if (host._syncTint) host._syncTint();
  syncPromNote(host);
}

/*  The line under the street, which is this panel's whole status bar.

    Three things can be true at once: how many bricklings there are, that one
    of them is selected, and that the board filter is hiding part of the pile
    from this panel exactly as it hides it from every other. The panels made of
    HTML say that last one with noteFiltered() and a badge; the street has no
    markup to hang a badge on, so it says all three in the sentence it already
    owns.

    Selection is separate from the board filter on purpose — dimming the street
    changes nothing about the pile — so the line has to distinguish them or
    they read as one state. */
function syncPromNote(host) {
  const el = host.querySelector(".pr-note");
  if (!el) return;
  const bits = [];
  if (host._noteBase) bits.push(host._noteBase);

  if (host._focus) {
    const name = (host._titleOf && host._titleOf.get(host._focus)) || titleCase(host._focus);
    bits.push((host._focusKind === "person" ? "showing " : "showing everyone at ") +
              name + ", click again to clear");
  }

  const view = V();
  if (view && view.active && state.model) {
    bits.push("filtered to " + view.stats.bricks + " of " + state.model.stats.bricks + " bricks");
  }

  host._noteText = bits.join(" · ");
  el.textContent = host._noteText;
}

/*  A gradient behind one column.

    Per place, and entirely optional: a column with no gradient shows the plain
    sky and ground like every other. It is scenery, not data — it says nothing
    about the place and never reaches the pile.

    Stored by uid so it survives a reload, and kept out of the gazetteer for
    the same reason the scene art is: that file is coordinates. */
const COLUMN_TINT = new Map();   // uid -> { from, to }

/*  GROUPS — columns you invent.

    A place is a column because a record says somebody was there. A group is a
    column because YOU say these people belong together: a household, a
    suspected family, everyone in one lawsuit, the ones you have not settled.
    The page attaches no meaning to it and never infers one — it is a heading
    you wrote, exactly like the `#` headings in the pile.

    Kept beside the placements rather than in the pile, for the same reason
    those are: which column somebody stands in is a note about your thinking,
    not a fact a document attests. Saved into brick.json with the rest. */
const PROM_GROUPS = [];          // [{ slug, name }]

function loadGroups() {
  let raw;
  try { raw = JSON.parse(localStorage.getItem(GROUPS_KEY) || "null"); } catch (e) { return; }
  if (!Array.isArray(raw)) return;
  for (const g of raw) {
    const name = typeof g === "string" ? g : (g && g.name);
    if (name && !PROM_GROUPS.some(x => x.name === name)) {
      PROM_GROUPS.push({ slug: "grp-" + slugify(name), name });
    }
  }
}
function saveGroups() {
  try {
    if (PROM_GROUPS.length) localStorage.setItem(GROUPS_KEY, JSON.stringify(PROM_GROUPS));
    else localStorage.removeItem(GROUPS_KEY);
  } catch (e) { /* unavailable */ }
}
/*  Prefixed, so a group called Perth and a parish called Perth are different
    columns — the same collision the art folders solve by being folders. */
/*  Put a group down in a new place in the running order.

    Reordering is only ever within the groups: the places are laid out by
    longitude and sit before all of them, so a group dropped over Longforgan
    still lands at the head of the groups rather than in among the parishes.
    That is a real limit, and it is the honest one — a column you invented has
    no coordinates, so there is no honest way to interleave it with columns
    that do. */
function moveGroupTo(slug, x, xOf) {
  const i = PROM_GROUPS.findIndex(g => g.slug === slug);
  if (i < 0) return;
  const [moved] = PROM_GROUPS.splice(i, 1);
  let at = 0;
  for (const other of PROM_GROUPS) {
    const ox = xOf.get(other.slug);
    if (ox !== undefined && x > ox) at++;
  }
  PROM_GROUPS.splice(at, 0, moved);
  saveGroups();
}

function groupNameOf(slug) {
  const g = PROM_GROUPS.find(x => x.slug === slug);
  return g ? g.name : null;
}

/*  ONE SHEET PER WEARER.

    Four frames across, four rows down, and the rows are what a figure is made
    of — from the skin outwards:

        row 1   body
        row 2   bottom
        row 3   top
        row 4   hat

    The filename says who it is for, and that is the whole of the configuration:

        images/wear/<who>.png       who = a uid, a trade, or "default"

        mill-worker.png   every mill worker
        george-isles.png  him and nobody else
        default.png       everyone else

    ROWS ARE INDEPENDENT. Leave a row transparent and it falls through to the
    next sheet in the chain — the person's, then their trade's, then default's,
    then the built-in. So a sheet with only a hat drawn on it changes only the
    hat, and one that redraws the body row gives that person a different figure
    entirely without a flag or a setting anywhere. */
const ROWS = ["body", "bottom", "top", "hat"];

/*  THE STREET'S OWN SKY AND GROUND.

    A column tint colors one stretch of sky; this is the whole scene behind
    every stretch of it, which is why it sits in the panel's own bar rather
    than behind a signpost — there is no column to select for it.

    Two colors, because everything else follows from them and a picker with
    five swatches is a paint program. The horizon line is the ground lifted a
    little, so it reads as an edge without being chosen; the grid view's flat
    field is the sky taken down, because a board of pictograms is the same
    room with the lights off. */
/*  ONE PAIR PER HOUR, NOT ONE PAIR AND A RULE.

    The first try kept a single sky and ground, and let the hour override them
    only while you had not chosen your own — which meant the moment you picked
    a colour you liked, the day/night switch stopped changing the sky at all.
    Choosing a colour turned the feature off.

    So there are two pairs and the switch says which one you are looking at and
    editing. Setting the sky at night sets the night sky. */
const SCENE_BG_DEFAULT = { sky: "#a8c6dd", ground: "#6f7d52" };   // daylight
const SCENE_BG_NIGHT_DEFAULT = { sky: "#0b1522", ground: "#0d120e" };
let SCENE_BG = { ...SCENE_BG_DEFAULT };
let SCENE_BG_NIGHT = { ...SCENE_BG_NIGHT_DEFAULT };

//  What the street is painted, for the hour it is.
function sceneColors() { return NIGHT ? SCENE_BG_NIGHT : SCENE_BG; }

const okBg = v => v && /^#[0-9a-f]{6}$/i.test(v.sky) && /^#[0-9a-f]{6}$/i.test(v.ground);

function loadSceneBg() {
  let raw;
  try { raw = JSON.parse(localStorage.getItem(SCENEBG_KEY) || "null"); } catch (e) { return; }
  if (!raw) return;
  /*  A file written when there was one pair. It was the only sky there was,
      so it is the day one — reading it as night would black out a scene
      somebody chose deliberately. */
  if (okBg(raw)) { SCENE_BG = { sky: raw.sky, ground: raw.ground }; return; }
  if (okBg(raw.day)) SCENE_BG = { sky: raw.day.sky, ground: raw.day.ground };
  if (okBg(raw.night)) SCENE_BG_NIGHT = { sky: raw.night.sky, ground: raw.night.ground };
}
function saveSceneBg() {
  try {
    const same = (a, b) => a.sky === b.sky && a.ground === b.ground;
    if (same(SCENE_BG, SCENE_BG_DEFAULT) && same(SCENE_BG_NIGHT, SCENE_BG_NIGHT_DEFAULT)) {
      localStorage.removeItem(SCENEBG_KEY);
      return;
    }
    localStorage.setItem(SCENEBG_KEY,
      JSON.stringify({ day: SCENE_BG, night: SCENE_BG_NIGHT }));
  } catch (e) { /* unavailable */ }
}

const hexInt = h => parseInt(String(h).slice(1), 16) || 0;

/*  Toward white for a positive amount, toward black for a negative one. Per
    channel, so a color keeps its hue instead of drifting grey. */
function shadeInt(hex, amt) {
  const n = hexInt(hex);
  const mix = c => amt >= 0 ? Math.round(c + (255 - c) * amt) : Math.round(c * (1 + amt));
  return (mix((n >> 16) & 255) << 16) | (mix((n >> 8) & 255) << 8) | mix(n & 255);
}

const mixInt = (a, b, t) => {
  const ch = s => {
    const x = Math.round(((a >> s) & 255) * (1 - t) + ((b >> s) & 255) * t);
    return x < 0 ? 0 : x > 255 ? 255 : x;
  };
  return (ch(16) << 16) | (ch(8) << 8) | ch(0);
};

// Perceived brightness, so a saturated yellow counts as light and a saturated
// blue does not — which the plain average gets backwards.
const lumOf = int => (0.299 * ((int >> 16) & 255) + 0.587 * ((int >> 8) & 255) +
                      0.114 * (int & 255)) / 255;

/*  LETTERING THAT SURVIVES THE SKY.

    Every label out here used to be a fixed color — a pale grey for a person
    whose place is known, a dim slate for one whose is not — chosen against the
    one sky this panel had. The moment the sky became yours, those two were a
    guess: pale grey on a pale sky is not dim, it is gone.

    So the ink is picked from what it is sitting on. Near-black on a light
    field, near-white on a dark one; the quiet variant is the same ink taken
    part of the way back toward the field, so "known" and "unknown" stay a
    difference in strength rather than two unrelated hues that only happened
    to work against navy. */
/*  THE INK THAT ACTUALLY WINS, rather than the one a threshold nominates.

    sceneInk picks a side by perceived brightness: over half lit, go dark;
    under, go light. That is fine for a label on a sky, which is always clearly
    one or the other. It falls apart on the ground. The default street green
    lands at 0.47, a hair under the line, so it is handed near-white at a
    contrast of 3.7 — and had it been a hair over, near-black at 4.0. Neither
    is good and the choice between them is a coin toss.

    So measure both properly and keep the winner. Real relative luminance, not
    the quick perceived brightness lumOf uses: that one exists to pick a side
    and this one has to produce a number you can compare. Taken nearer the
    extremes as well, since every point of contrast is bought on a caption
    seven pixels tall. */
function relLum(int) {
  const f = c => {
    c /= 255;
    return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  };
  return 0.2126 * f((int >> 16) & 255) + 0.7152 * f((int >> 8) & 255)
       + 0.0722 * f(int & 255);
}
const contrastOf = (a, b) => {
  const l1 = relLum(a), l2 = relLum(b);
  return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
};
const INK_DARK = 0x080b0e, INK_LIGHT = 0xf6fafd;
const bestInk = bg =>
  contrastOf(bg, INK_DARK) >= contrastOf(bg, INK_LIGHT) ? INK_DARK : INK_LIGHT;

function sceneInk(bgInt, quiet, amount) {
  const ink = lumOf(bgInt) > 0.5 ? 0x14181c : 0xe4ebf0;
  //  How far the quiet variant is taken back toward its field. Caller's
  //  choice, because "quieter" on a caption somebody is reading is not the
  //  same amount as "quieter" on a label they are scanning past.
  return quiet ? mixInt(ink, bgInt, amount === undefined ? 0.45 : amount) : ink;
}

/*  The same shift as shadeInt, handed back as a hex string — which is what a
    swatch, a CSS background and a colour input all want. */
const shadeHex = (hex, amt) =>
  "#" + shadeInt(hex, amt).toString(16).padStart(6, "0");

/*  DUSK.

    Where you hang the sun is what hour it is, and an hour is not a lamp. This
    is not a light source: nothing here casts, falls off or shadows. It is the
    ambient colour of the air, and everything painted in the scene reads it
    from the same place, so a sun dropped near the ground warms the whole
    street at once rather than lighting a patch of it.

    SUN_LOW is the whole state: 0 with it overhead, 1 with it on the horizon.
    Kept flat at 0 on the pictogram board, which has no horizon for anything to
    be near.

    THE MOON DOES IT TOO. A low sun is dusk; a low moon is the same hour from
    the other side of it, so night reads the same ramp with its own palette and
    a moon brought down to the rooftops gives you the band of light before dawn
    instead of a red sunset.

    Nothing below is stored. Your sky and your ground stay exactly the two
    colours you chose in Theme; dusk is a shift applied over them, so putting
    the sun back up gives your own scene back untouched. */
let SUN_LOW = 0;
const DUSK = {
  //  Where the sky is dragged to, top to bottom, with the sun on the horizon.
  day: {
    high:   0x36436d,     // the last of the blue, going violet
    mid:    0xb1332b,     // the red band
    low:    0xff8a3d,     // orange sitting on the horizon
    ground: 0x4a3327,     // the street catching the same light
    //  And the disc itself: white-gold up high, deep red on the deck.
    discHi: 0xffeec2, discMid: 0xffb347, discLo: 0xd8321c,
    coroHi: 0xffd66b, coroLo: 0xff5a2b,
    glow: 0.10,           // how much corona there is to begin with
    glowRise: 0.14,       // and how much more it gathers on the way down
    thin: 0.30,           // how far the disc washes out at the horizon
  },
  //  The same fall, an hour further round: no red, a cold violet band and one
  //  dull ember along the horizon where the sun either went or is coming.
  night: {
    high:   0x05080f,
    mid:    0x241d3c,
    low:    0x6e3f4e,
    ground: 0x17111d,
    /*  THE MOON GOES WHITE, NOT AMBER.

        It was drifting warm on the way down, borrowed from the sun's own
        ramp. Wrong body: what a low sun does is go red, and what a low moon
        does is go pale and vanish. By the time it is over the rooftops at
        dawn there is enough light in the sky to compete with it, and you get
        a thin white disc you can see the sky through rather than a hot
        coloured one. So it cools slightly as it drops, and mostly it just
        stops being there. */
    discHi: 0xf2f0e2, discMid: 0xf6f6f4, discLo: 0xfcfdff,
    coroHi: 0x9fb6d8, coroLo: 0xd7e6fb,
    glow: 0.0,            // nothing around a high moon
    glowRise: 0.05,       // and barely any as it falls: dawn washes, it does
                          // not halo
    thin: 0.93,           // all but gone by the time it reaches the ground
  },
};
//  Which of the two, for the hour the switch says it is.
const dusk = () => NIGHT ? DUSK.night : DUSK.day;
/*  THE FACE OF THE MOON, as fractions of its own radius: x, y, size.

    Roughly where the big maria sit on the near side, reading down from
    Imbrium at the top left to Nubium underneath. Not a map, and not trying to
    be: the point is that the markings sit where the eye expects them, because
    a moon with its patches in the wrong places reads as a golf ball.

    EACH SEA IS MORE THAN ONE CIRCLE. Six even discs came out looking like a
    cookie — the eye reads a repeated perfect shape as a pattern somebody
    stamped on, not as terrain. Overlapping lobes fill in one pass, so they
    merge with no seam between them and what you get is an irregular patch.

    Every lobe is kept inside the limb — distance from the middle plus its own
    size stays under 1 — so nothing spills off the edge. */
const MOON_MARIA = [
  [[-0.30, -0.28, 0.17], [-0.14, -0.36, 0.11]],   // Imbrium
  [[ 0.14, -0.30, 0.12]],                         // Serenitatis
  [[ 0.28, -0.02, 0.14], [ 0.34,  0.12, 0.09]],   // Tranquillitatis
  [[-0.44,  0.16, 0.13]],                         // Procellarum, toward the limb
  [[-0.06,  0.36, 0.11]],                         // Nubium
  [[ 0.52, -0.34, 0.08]],                         // Crisium, small and east
];
/*  Eased so the top half of the sky is the ordinary hour and the colour
    gathers as the sun gets close to the ground, which is how it actually
    behaves. A straight ramp made every position look like dusk. */
const duskT = () => SUN_LOW * SUN_LOW;
//  A three-stop ramp read at any point, so the disc and the sky share one rule.
const duskMix = (lo, mid, hi, t) =>
  t < 0.5 ? mixInt(hi, mid, t * 2) : mixInt(mid, lo, (t - 0.5) * 2);

//  All four read through sceneColors(), so the hour reaches every one of them
//  — including the ink that is picked to contrast with the sky.
//  The sky they hand back is the middle of the band, which is what a label
//  sitting out in the scene is most likely to be sitting on.
const sceneSky = () => mixInt(hexInt(sceneColors().sky), dusk().mid, duskT() * 0.85);
const sceneGround = () =>
  mixInt(hexInt(sceneColors().ground), dusk().ground, duskT() * 0.7);
//  The two bands the sky is drawn between, above and below that middle. Handed
//  back as strings because gradientTexture, which already paints every ramp in
//  this panel, takes the two ends as CSS colours.
const intHex = int => "#" + (int >>> 0).toString(16).padStart(6, "0");
const skyHigh = () => intHex(mixInt(hexInt(sceneColors().sky), dusk().high, duskT()));
const skyLow = () => intHex(mixInt(hexInt(sceneColors().sky), dusk().low, duskT() * 0.95));
// 0.08 rather than a rounder number because it lands on #2c312a for the
// default ground, which is the #2b3327 this line was hand-picked as. Taken off
// the dusked ground rather than the stored one, so the horizon line stays a
// lightening of whatever the street is currently painted.
const sceneEdge = () => mixInt(sceneGround(), 0xffffff, 0.08);  // the horizon line
const sceneGrid = () => shadeInt(sceneColors().sky, -0.38);     // the pictogram board

//  Flattened to its own brightness, so a colour loses its hue without losing
//  how light it was. Perceived, not averaged, for the reason lumOf exists.
const grayInt = int => {
  const l = Math.round(lumOf(int) * 255);
  return (l << 16) | (l << 8) | l;
};
/*  SMOKE IS IN THE SAME AIR AS EVERYTHING ELSE.

    You pick one colour per place and that is the colour it is in daylight. The
    other two it needs are worked out rather than asked for, because they are
    not separate decisions — they are the same smoke at a different hour.

    Toward the horizon, it catches the light that is hitting it, which is why a
    plume over a sunset goes pink whatever the coal was.

    At night it goes grey and drops. You do not see the colour of smoke in the
    dark; you see a shape moving against the sky, and a plume still rendering
    in the blue you chose for it in daylight reads as a painted-on effect. It
    keeps a quarter of its own hue so two chimneys set to different colours are
    still telling you something after sundown. */
function smokeTint(ink) {
  const base = hexInt(ink), t = duskT();
  if (!NIGHT) return mixInt(base, dusk().low, t * 0.55);
  const night = mixInt(mixInt(base, grayInt(base), 0.75), 0x000000, 0.3);
  //  And the same ember off the horizon as the moon gets, once it is low.
  return mixInt(night, dusk().low, t * 0.35);
}

/*  THE RIBBONS.

    A group's name hangs on a ribbon rather than a board, and the color of it
    is yours. Keyed by column slug, the same way a column's backdrop is —
    "" is The Promenade, "grp-…" is one you invented — so the two settings sit
    side by side in the same bar and are saved by the same file.

    The default is the signboard timber every other label on the street is
    painted in, so an uncolored ribbon still belongs to the picture. */
/*  A LINE OF YOUR OWN, PER COLUMN.

    The scene knows what the records know: a name, a parish, who stood there.
    It does not know that the mill burned in 1874, or that this is the only
    place in the pile anybody was born. Those are the things you learn while
    reading, and until now there was nowhere on the street to put one.

    So a column can carry text above the roofline and text on the ground under
    it — both at once, because they are answers to different questions. The one
    over the roof is what this place IS; the one on the ground is what happened
    there. Making them exclusive meant choosing which half of that to lose.

    It wraps, so a sentence is allowed to be a sentence. The cap is generous
    rather than absent: past a few lines this stops being a caption on a scene
    and starts being a document, and there is already somewhere for those.

    Kept per slug beside the tints and the ribbon colours, and carried in the
    same sidecar — it is the same kind of fact about the same kind of thing. */
const NOTE_KEY = "brick-by-brick:colnote:v1";
const NOTE_MAX = 400;
const COL_NOTE = new Map();          // slug -> { above: string, below: string }
const noteOf = slug => COL_NOTE.get(slug) || { above: "", below: "" };
function loadColNotes() {
  let raw;
  try { raw = JSON.parse(localStorage.getItem(NOTE_KEY) || "null"); } catch (e) { return; }
  if (!Array.isArray(raw)) return;
  for (const [slug, v] of raw) {
    if (typeof slug !== "string" || !v) continue;
    /*  A file written when a column had ONE note, on one side. Read it into
        the side it was on rather than dropping it: somebody's captions are not
        worth losing to a format change. */
    if (typeof v.text === "string") {
      const at = v.at === "below" ? "below" : "above";
      COL_NOTE.set(slug, { above: "", below: "", [at]: v.text.slice(0, NOTE_MAX) });
      continue;
    }
    const above = typeof v.above === "string" ? v.above.slice(0, NOTE_MAX) : "";
    const below = typeof v.below === "string" ? v.below.slice(0, NOTE_MAX) : "";
    const num = k => (typeof v[k] === "number" && isFinite(v[k]) ? v[k] : 0);
    //  Where you dragged it, alongside what it says.
    if (above || below) {
      COL_NOTE.set(slug, { above, below,
        ax: num("ax"), ay: num("ay"), bx: num("bx"), by: num("by") });
    }
  }
}
function saveColNotes() {
  try {
    if (COL_NOTE.size) localStorage.setItem(NOTE_KEY, JSON.stringify([...COL_NOTE.entries()]));
    else localStorage.removeItem(NOTE_KEY);
  } catch (e) { /* unavailable */ }
}

/*  SMOKE.

    Two settings per column and two for the whole street, which is the split
    the panel already uses everywhere else: a decision about one place lives
    with that place, and a decision about the weather lives with the sky.

    Colour and thickness are per column, because a lime kiln and a cottage do
    not smoke alike. Wind and dissipation are the scene's, because every
    chimney on one street stands in the same air, and letting neighbours
    disagree about which way the wind blows would look like a fault. */
const SMOKE_KEY = "brick-by-brick:smoke:v1";
const SMOKE = new Map();                 // slug -> { ink, thick }
const SMOKE_DEFAULT = { ink: "#b9c6d4", thick: 0.55, fade: 0.5 };
const smokeOf = slug => SMOKE.get(slug) || SMOKE_DEFAULT;
function loadSmoke() {
  let raw;
  try { raw = JSON.parse(localStorage.getItem(SMOKE_KEY) || "null"); } catch (e) { return; }
  if (!Array.isArray(raw)) return;
  for (const [slug, v] of raw) {
    if (typeof slug !== "string" || !v) continue;
    const ink = /^#[0-9a-f]{6}$/i.test(v.ink) ? v.ink : SMOKE_DEFAULT.ink;
    const thick = (+v.thick >= 0 && +v.thick <= 1) ? +v.thick : SMOKE_DEFAULT.thick;
    const fade = (+v.fade >= 0 && +v.fade <= 1) ? +v.fade : SMOKE_DEFAULT.fade;
    SMOKE.set(slug, { ink, thick, fade });
  }
}
function saveSmoke() {
  try {
    if (SMOKE.size) localStorage.setItem(SMOKE_KEY, JSON.stringify([...SMOKE.entries()]));
    else localStorage.removeItem(SMOKE_KEY);
  } catch (e) { /* unavailable */ }
}

/*  THE WIND, AND EVERYTHING IN THE SKY OBEYS IT.

    One number for the whole street, negative for a westerly. It leans the
    smoke, and it helps or hinders anything else crossing: a skein of birds
    flying with it makes better time than one beating into it, and so does the
    balloon. That is the point of having it at scene level rather than per
    place. It is weather, and weather is the same for everybody standing in it.

    How a particular chimney smokes belongs to that chimney, so colour,
    thickness and how fast a puff gives up all live with the column. */
const WEATHER_KEY = "brick-by-brick:weather:v1";
const WEATHER_DEFAULT = { wind: 0.25 };
let WEATHER = { ...WEATHER_DEFAULT };
function loadWeather() {
  let raw;
  try { raw = JSON.parse(localStorage.getItem(WEATHER_KEY) || "null"); } catch (e) { return; }
  if (!raw) return;
  const w = +raw.wind;
  if (w >= -1 && w <= 1) WEATHER.wind = w;
}
function saveWeather() {
  try {
    if (WEATHER.wind === WEATHER_DEFAULT.wind) localStorage.removeItem(WEATHER_KEY);
    else localStorage.setItem(WEATHER_KEY, JSON.stringify(WEATHER));
  } catch (e) { /* unavailable */ }
}

/*  How much a thing crossing the sky is helped or hindered. Dead with the wind
    is a third again; dead against it is a third slower. Nothing stops, because
    a bird pinned motionless in the air reads as a bug. */
const windHelp = dir => 1 + WEATHER.wind * dir * 0.34;

/*  THE KNOCK, MADE RATHER THAN FETCHED.

    A sample would be a second file, and this page is one file on purpose: a
    .wav beside it is the thing that goes missing when somebody saves the page,
    mails it, or opens it off a stick. So the sound is built from arithmetic at
    the moment it is needed and weighs nothing.

    A knuckle on wood is a very short burst of noise with all the high end
    taken out of it and a fast decay. Noise through a narrow bandpass low down,
    over in seventy milliseconds, twice, at the same spacing as the two flashes
    on the doorway. Anything longer stops being a knock and starts being a
    drum.

    The context is built on the first knock and never before. Browsers refuse
    to start audio outside a gesture, and building it at load would leave a
    suspended context sitting there for everybody who never touches a door. */
let knockCtx = null, knockNoise = null, knockTone = 1;
//  How many raps in the current run, and when the last one was. See knockSound.
let knockRun = 0, knockAt = 0;
function knockSound() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!knockCtx) knockCtx = new AC();
    if (knockCtx.state === "suspended") knockCtx.resume();
    if (!knockNoise) {
      //  One burst of noise, cut once and reused. It is eighty milliseconds of
      //  random numbers; making a fresh one per rap would be work for nothing.
      const n = Math.floor(knockCtx.sampleRate * 0.08);
      knockNoise = knockCtx.createBuffer(1, n, knockCtx.sampleRate);
      const d = knockNoise.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    }
    /*  THREE LAYERS, BECAUSE A KNOCK IS THREE THINGS AT ONCE.

          the knuckle   bright, almost no body, gone in 12ms
          the panel     the woody middle, a resonant 500-ish, 55ms
          the door      a low thud you feel more than hear, 85ms

        Each is the same burst of noise through a different filter, which is
        why one buffer serves all three voices.

        A version after this one replaced the body with four tuned sine
        partials, on the theory that a struck board rings at discrete modes
        rather than making noise. That is true of a marimba bar and it is the
        textbook way to synthesise wood, and it sounded worse: too pitched, too
        clean, more xylophone than door. Filtered noise keeps the grain. The
        theory was right about the physics and wrong about the door. */
    const layer = (t, peak, type, freq, q, decay) => {
      const src = knockCtx.createBufferSource();
      src.buffer = knockNoise;
      const f = knockCtx.createBiquadFilter();
      f.type = type;
      f.frequency.value = freq;
      f.Q.value = q;
      const g = knockCtx.createGain();
      /*  Ramps rather than steps, because a gain that jumps is a click of its
          own and you hear it as a fault rather than as part of the sound. The
          attack is four milliseconds for the body and one for the knuckle:
          any slower and the strike turns into a swell. */
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + Math.min(0.004, decay / 8));
      g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
      src.connect(f).connect(g).connect(knockCtx.destination);
      src.start(t);
      src.stop(t + decay + 0.02);
    };
    /*  ONE RAP PER PRESS.

        It used to fire both raps on a single click, which meant one click
        sounded like a whole knock and the double-click that actually opens
        the door sounded like four. Now the gesture makes the rhythm: press
        once and you have rapped once, press twice and you have knocked.

        The tone shifts a few percent each time so two raps in a row are not
        the same sample played twice, which is what makes a repeated sound
        read as a recording rather than as a hand. */
    /*  EACH RAP HARDER THAN THE LAST.

        Nobody knocks twice at the same weight. You try, you wait, and if
        nothing happens you hit it again a bit harder — so a run of raps
        climbs, and the second one landing heavier is most of what makes two
        presses read as one knock rather than as two identical beeps.

        It resets after a second of quiet, which makes this one person going at
        one door rather than a level that creeps up over the life of the page.
        Capped, because insistent is the idea and distortion is not.

        STEPPED IN DECIBELS, NOT IN MULTIPLES. Loudness is logarithmic: adding
        a fixed amount to the gain each time sounds like a big jump and then
        progressively smaller ones, because the ear reads ratios. Three
        decibels a rap is an even climb and six is a doubling.

        NOT AN EVEN LADDER, THOUGH. The gesture that matters is two presses,
        so the step from the first rap to the second is the one anybody
        actually hears; every rap after that is somebody leaning on the door
        and needs far less to say so. Nine decibels between the first two is
        nearly three times the level — a proper second knock — and the rest
        taper to the ceiling.

        The ceiling is 14 rather than 16 because a render at +16 put one
        sample over full scale. */
    const now = performance.now();
    knockRun = (now - knockAt > 900) ? 0 : knockRun + 1;
    knockAt = now;
    const KNOCK_DB = [0, 9, 12, 14];
    const push = Math.pow(10,
      KNOCK_DB[Math.min(knockRun, KNOCK_DB.length - 1)] / 20);

    const t = knockCtx.currentTime;
    knockTone = knockTone === 1 ? 0.94 : 1;
    layer(t, 0.16 * push, "highpass", 1500 * knockTone, 0.7, 0.012);  // the knuckle
    layer(t, 0.20 * push, "bandpass", 520 * knockTone, 1.6, 0.055);   // the panel
    layer(t, 0.17 * push, "lowpass", 230 * knockTone, 5.5, 0.085);    // the door
  } catch (e) { /*  No audio here. The door still opens.  */ }
}

const RIBBON = new Map();
const RIBBON_DEFAULT = "#4a3b28";
const ribbonOf = slug => RIBBON.get(slug) || RIBBON_DEFAULT;

function loadRibbons() {
  let raw;
  try { raw = JSON.parse(localStorage.getItem(RIBBON_KEY) || "null"); } catch (e) { return; }
  if (!Array.isArray(raw)) return;
  for (const [slug, c] of raw) {
    if (typeof slug === "string" && /^#[0-9a-f]{6}$/i.test(c)) RIBBON.set(slug, c);
  }
}
function saveRibbons() {
  try {
    if (RIBBON.size) localStorage.setItem(RIBBON_KEY, JSON.stringify([...RIBBON.entries()]));
    else localStorage.removeItem(RIBBON_KEY);
  } catch (e) { /* unavailable */ }
}

function loadColumnTints() {
  let raw;
  try { raw = JSON.parse(localStorage.getItem(COLTINT_KEY) || "null"); } catch (e) { return; }
  if (!Array.isArray(raw)) return;
  for (const [uid, t] of raw) {
    if (uid && t && /^#[0-9a-f]{6}$/i.test(t.from) && /^#[0-9a-f]{6}$/i.test(t.to)) {
      const a = Number(t.alpha);
      COLUMN_TINT.set(uid, { from: t.from, to: t.to,
                             alpha: (a >= 0 && a <= 1) ? a : 1 });
    }
  }
}
function saveColumnTints() {
  try {
    if (COLUMN_TINT.size) localStorage.setItem(COLTINT_KEY, JSON.stringify([...COLUMN_TINT.entries()]));
    else localStorage.removeItem(COLTINT_KEY);
  } catch (e) { /* unavailable */ }
}

/*  A vertical gradient as a texture: Pixi's Graphics fills are flat, so the
    ramp is painted on a 1-pixel-wide canvas and stretched across the column.
    Cached, because the same two colors redraw on every render otherwise. */
const gradCache = new Map();
function gradientTexture(P, from, to) {
  const key = from + "|" + to;
  if (gradCache.has(key)) return gradCache.get(key);
  const c = document.createElement("canvas");
  c.width = 1; c.height = 64;
  const g = c.getContext("2d");
  const ramp = g.createLinearGradient(0, 0, 0, 64);
  ramp.addColorStop(0, from);
  ramp.addColorStop(1, to);
  g.fillStyle = ramp;
  g.fillRect(0, 0, 1, 64);
  const tex = P.Texture.from(c);
  gradCache.set(key, tex);
  return tex;
}

/* ==========================================================================
   brick.json — the sidecar
   --------------------------------------------------------------------------
   Everything that belongs to a piece of research but is not a record: who you
   have placed in which column, and what color you gave a column. It sits
   beside bricks/ and images/ and travels with them.

   Deliberately NOT the bricks. A brick is something a document says; this file
   is how you have chosen to look at them. Keeping the two apart means a
   arrangement can never be mistaken for evidence, and you can throw this file
   away without losing a single record.

   Read automatically when you open a folder that contains one.
   ========================================================================== */
/*  The sidecar as an object, because a scene is the same snapshot kept in
    memory rather than written to disk. One serialisation, two users: what a
    brick.json restores when you open a folder is exactly what a scene restores
    when the story cuts to it. */
function sidecarData(host) {
  return {
    brickByBrick: 1,
    saved: new Date().toISOString(),
    promenade: {
      pins: host && host._pinned ? [...host._pinned.entries()] : [],
      groups: PROM_GROUPS.map(g => g.name),
    },
    columns: {
      tints: [...COLUMN_TINT.entries()],
      ribbons: [...RIBBON.entries()],
      //  Your own line about each column, which is the part of a saved scene
      //  a file cannot regenerate — nothing in the records says it.
      notes: [...COL_NOTE.entries()],
      // The scene behind all of them, which is the same kind of decision.
      //  Both hours. An older file carrying one pair still reads as the day.
      scene: { day: { ...SCENE_BG }, night: { ...SCENE_BG_NIGHT } },
    },
    /*  HOW IT LOOKED, not only how it was arranged. The hour, the weather and
        where you were standing are as much a part of a saved street as who is
        in which column, and leaving them out meant a brick.json restored the
        placements into whatever light the page happened to be in. */
    view: {
      night: NIGHT,
      sun: SUN_POS ? { ...SUN_POS } : null,
      zoom: host ? (host._zoom || 1) : 1,
      //  Fractional, so the same scene lands in the same place in a tile of a
      //  different width.
      panFrac: host && host._world && host._worldW
        ? -host._world.x / host._worldW : 0,
      signY: { ...SIGN_Y },
    },
    sky: {
      weather: { ...WEATHER },
      scenery: [...SCENE_SET.entries()],
      smoke: [...SMOKE.entries()],
    },
  };
}

function sidecarJSON(host) {
  return JSON.stringify(sidecarData(host), null, 2);
}

/*  Returns what it managed to read, so the caller can say so rather than
    leaving you guessing whether the file did anything. */
function applySidecar(text, host) {
  let data;
  try { data = JSON.parse(text); } catch (e) { return null; }
  if (!data || typeof data !== "object") return null;
  const out = { pins: 0, tints: 0, groups: 0 };

  const pins = data.promenade && data.promenade.pins;
  if (Array.isArray(pins) && host && host._pinned) {
    host._pinned.clear();
    for (const [uid, place] of pins) {
      if (typeof uid === "string" && typeof place === "string") {
        host._pinned.set(uid, place);
        out.pins++;
      }
    }
    if (host._savePins) host._savePins();
  }

  const groups = data.promenade && data.promenade.groups;
  if (Array.isArray(groups)) {
    PROM_GROUPS.length = 0;
    for (const name of groups) {
      if (typeof name === "string" && name.trim()) {
        PROM_GROUPS.push({ slug: "grp-" + slugify(name), name });
        out.groups++;
      }
    }
    saveGroups();
  }

  const tints = data.columns && data.columns.tints;
  if (Array.isArray(tints)) {
    COLUMN_TINT.clear();
    for (const [uid, t] of tints) {
      if (uid && t && /^#[0-9a-f]{6}$/i.test(t.from) && /^#[0-9a-f]{6}$/i.test(t.to)) {
        const a = Number(t.alpha);
        COLUMN_TINT.set(uid, { from: t.from, to: t.to, alpha: (a >= 0 && a <= 1) ? a : 1 });
        out.tints++;
      }
    }
    saveColumnTints();
  }

  const ribbons = data.columns && data.columns.ribbons;
  if (Array.isArray(ribbons)) {
    RIBBON.clear();
    for (const [slug, c] of ribbons) {
      if (typeof slug === "string" && /^#[0-9a-f]{6}$/i.test(c)) RIBBON.set(slug, c);
    }
    saveRibbons();
  }

  /*  Absent in a file written before notes existed. Same rule as the scene
      below: an older file says nothing about them rather than saying they
      should all go. */
  const notes = data.columns && data.columns.notes;
  if (Array.isArray(notes)) {
    COL_NOTE.clear();
    for (const [slug, v] of notes) {
      if (typeof slug !== "string" || !v) continue;
      //  Same one-note-per-column file the loader forgives, forgiven here too.
      if (typeof v.text === "string") {
        const at = v.at === "below" ? "below" : "above";
        COL_NOTE.set(slug, { above: "", below: "", [at]: v.text.slice(0, NOTE_MAX) });
        continue;
      }
      const above = typeof v.above === "string" ? v.above.slice(0, NOTE_MAX) : "";
      const below = typeof v.below === "string" ? v.below.slice(0, NOTE_MAX) : "";
      const num = k => (typeof v[k] === "number" && isFinite(v[k]) ? v[k] : 0);
      if (above || below) {
        COL_NOTE.set(slug, { above, below,
          ax: num("ax"), ay: num("ay"), bx: num("bx"), by: num("by") });
      }
    }
    saveColNotes();
  }

  /*  Absent in a file written before the scene was settable, which must leave
      the current one alone rather than resetting it to the default. */
  const scene = data.columns && data.columns.scene;
  if (scene) {
    if (okBg(scene)) SCENE_BG = { sky: scene.sky, ground: scene.ground };
    else {
      if (okBg(scene.day)) SCENE_BG = { sky: scene.day.sky, ground: scene.day.ground };
      if (okBg(scene.night)) SCENE_BG_NIGHT = { sky: scene.night.sky, ground: scene.night.ground };
    }
    saveSceneBg();
    if (host && host._syncSceneBg) host._syncSceneBg();
  }

  /*  Absent in every file written before scenes existed, and absent is not the
      same as "put it back to the default": an old brick.json says nothing
      about the hour and must leave the hour alone. */
  const view = data.view;
  if (view && typeof view === "object") {
    if (typeof view.night === "boolean") { NIGHT = view.night; saveNight(); }
    if (view.sun && isFinite(view.sun.fx) && isFinite(view.sun.fy)) {
      SUN_POS = { fx: Math.max(0, Math.min(1, view.sun.fx)),
                  fy: Math.max(0, Math.min(1, view.sun.fy)) };
      saveSunPos();
    }
    if (isFinite(view.zoom) && host) host._zoom = Math.max(1, Math.min(4, Math.round(view.zoom)));
    if (view.signY && typeof view.signY === "object") {
      SIGN_Y = {};
      for (const [k, v] of Object.entries(view.signY)) if (isFinite(v)) SIGN_Y[k] = Number(v);
      saveSignY();
    }
    /*  Held for the render to use, because the street it is a fraction OF does
        not exist until the columns are laid out again. */
    if (isFinite(view.panFrac) && host) host._panFracWanted = Number(view.panFrac);
  }

  const sky = data.sky;
  if (sky && typeof sky === "object") {
    if (sky.weather && isFinite(sky.weather.wind)) {
      WEATHER = { ...WEATHER, wind: Math.max(0, Math.min(1, Number(sky.weather.wind))) };
      saveWeather();
    }
    if (Array.isArray(sky.scenery)) {
      SCENE_SET.clear();
      for (const [k, v] of sky.scenery) {
        if (typeof k === "string" && (typeof v === "number" || typeof v === "boolean")) {
          SCENE_SET.set(k, v);
        }
      }
      saveScenery();
    }
    if (Array.isArray(sky.smoke)) {
      SMOKE.clear();
      for (const [k, v] of sky.smoke) {
        if (typeof k === "string" && v && typeof v === "object") SMOKE.set(k, v);
      }
      saveSmoke();
    }
  }
  return out;
}

/*  Light the people in the pen whose name matches, dim the rest.

    Kept apart from the focus dimming so the two can coexist: a search inside
    the pen does not disturb a place you have selected out on the street. */
function applyPenSearch(host) {
  /*  Searches EVERYONE on the panel, not only the pen.

      Restricting it to the unplaced assumed you always know where somebody is
      once you have put them somewhere — but a column of twelve is no easier to
      scan than a huddle of twelve, and the name you half remember is as likely
      to be standing in Longforgan as waiting to be placed. */
  const q = host._penQuery || "";
  for (const w of host._walkers || []) {
    const hit = !q || w.search.includes(q);
    w.node.alpha = hit ? w.base : w.base * 0.18;
    if (q && hit) {
      const make = host._ensureNameFor && host._ensureNameFor.get(w.slug);
      if (make) make();
    }
    if (w.nameNode) w.nameNode.visible = !!q && hit;
  }
}

/*  A costume for an occupation.

    images/occupations/<trade>.png — found by filename, the same bargain as the
    scene art: a person whose occupation slugs to "powerloom-tender" wears
    powerloom-tender.png if such a file exists, and the ordinary figure if it
    does not. Nothing to configure, nothing to keep in step.

    A costume is a walk sheet like any other: same 64x24 geometry, same key
    colors. Which means a uniform still takes its era's palette and its
    wearer's own nudge, so twenty millworkers are recognisably millworkers
    without being twenty identical sprites. */
const costumeCache = new Map();   // occupation slug -> Image | null | Promise

function occupationOf(entity) {
  const raw = (entity.detail || "").split(/[,.;(]/)[0].trim();
  if (!raw || raw.length > 28) return "";
  return slugify(raw);
}

/*  Art lives in a folder named for what it is:

      images/places/longforgan.png        behind that parish
      images/occupations/mill-worker.png  worn by that trade

    Which settles the collision outright — a parish called Mason and a trade
    called mason are different files, and neither has to carry a prefix in its
    name to say so.

    An opened research folder is matched on the directory as well as the
    filename, so the same layout works from disk and hosted. */
/*  The directory this page lives in, worked out rather than assumed.

    A relative "images/..." resolves against the URL, and a server that serves
    index.html at /brick-by-brick WITHOUT a trailing slash makes that resolve to
    /images/... — one level too high, so every layer and scene 404s while
    looking perfectly correct in the source. There is no way to ask whether a
    slashless path is a directory, so: a path ending in a file extension keeps
    its directory, anything else is treated as one. */
const ASSET_BASE = (() => {
  const p = location.pathname;
  if (/\.[a-z0-9]+$/i.test(p)) return p.slice(0, p.lastIndexOf("/") + 1);
  return p.endsWith("/") ? p : p + "/";
})();

/*  DRAWINGS KEPT IN THE BROWSER.

    A drawing made in the Sprite Editor has, until now, had one way onto the
    street: download the PNG, put it in images/, deploy the site, reload. Which
    is a deploy per hat, and it makes trying something out cost more than
    drawing it.

    So the page can hold art itself. Keyed by exactly the path the loader would
    have asked the server for — "wear/mill-worker.png", "places/longforgan.png"
    — and checked before anything else, because it is the most recent thing you
    deliberately did. Nothing else changes: the same names, the same chain, the
    same fall-through. The file simply has not been written yet.

    Temporary on purpose. It lives in this browser, it travels with nothing,
    and the Art panel exists partly to keep that visible and partly to hand
    you the PNG when you decide a drawing has earned a place in the repo. */
const LOCAL_ART = new Map();          // "wear/name.png" -> data: URL

function loadLocalArt() {
  let raw;
  try { raw = JSON.parse(localStorage.getItem(ARTKEY) || "null"); } catch (e) { return; }
  if (!raw || typeof raw !== "object") return;
  for (const [path, url] of Object.entries(raw)) {
    if (typeof url === "string" && url.startsWith("data:image/")) LOCAL_ART.set(path, url);
  }
}
function saveLocalArt() {
  try {
    if (!LOCAL_ART.size) { localStorage.removeItem(ARTKEY); return; }
    localStorage.setItem(ARTKEY, JSON.stringify(Object.fromEntries(LOCAL_ART)));
    return true;
  } catch (e) {
    /*  Out of room. Says so rather than losing the drawing quietly — the
        browser's quota is a few megabytes and a sheet is a few hundred bytes,
        so this means something else has filled it. */
    return false;
  }
}

/*  Every cache that remembers where art came from, or that it was missing.
    Called whenever the store changes, because "this place has no picture" is
    exactly the kind of thing that has just stopped being true. */
function artChanged() {
  resetSceneCache();
  costumeCache.clear();
  ROW_CACHE.clear();
  dressCache.clear();
  if (typeof refreshAll === "function") refreshAll();
}

function putLocalArt(path, dataUrl) {
  LOCAL_ART.set(path, dataUrl);
  const ok = saveLocalArt();
  artChanged();
  return ok;
}
function dropLocalArt(path) {
  LOCAL_ART.delete(path);
  saveLocalArt();
  artChanged();
}

function artSrc(kind, slug) {
  // The page's own drawings first: nothing else in the chain is as deliberate
  // or as recent as something you drew a moment ago.
  const held = LOCAL_ART.get(kind + "/" + slug.toLowerCase() + ".png");
  if (held) return held;
  const want = slug.toLowerCase();
  for (const [path, v] of folderImages) {
    const parts = path.toLowerCase().split("/");
    /*  A trailing -WxH is dimensions, not part of the name, so
        mill-worker-96x96.png and mill-worker.png are the same wearer. */
    const base = parts.pop().replace(/\.[^.]+$/, "").replace(/-\d+x\d+$/, "");
    if (base !== want) continue;
    if (!parts.includes(kind)) continue;      // right name, wrong folder
    if (!v.url) v.url = URL.createObjectURL(v.file);
    return v.url;
  }
  return folderImages.size ? "" : ASSET_BASE + "images/" + kind + "/" + encodeURIComponent(want) + ".png";
}

/*  A sheet from any of the art folders. Cached under folder+name, so a parish
    called Mason and a tradesman called mason stay different pictures. */
function layerImage(kind, slug, onReady) {
  if (!slug) return null;
  const key = kind + "/" + slug;
  if (costumeCache.has(key)) {
    const got = costumeCache.get(key);
    return got instanceof Promise ? null : got;
  }
  const src = artSrc(kind, slug);
  if (!src) { costumeCache.set(key, null); return null; }
  const pending = new Promise(res => {
    const img = new Image();
    img.onload = () => { costumeCache.set(key, img); res(img); if (onReady) onReady(); };
    img.onerror = () => { costumeCache.set(key, null); res(null); };
    img.src = src;
  });
  costumeCache.set(key, pending);
  return null;                    // this render uses the default; the next has it
}

/*  Where a place's picture lives.

    images/places/<uid>.png — the parish's own name, in the places folder.

    No configuration, and no complaint when there is nothing there — most
    places will not have art, and that is the normal state, not a fault. */
function sceneSrc(slug) { return artSrc("places", slug); }

/*  Look each place's art up once, and remember when there is none.

    Without this every render speculatively requested images/<uid>.png for
    every place — 59 requests that all 404 on a site with no images folder,
    repeated on every zoom, sort, drop and resize. A place that has no picture
    is a permanent fact for the session, so it is worth remembering.

    Resolves to an Image once loaded, or null. Reset when a folder is opened,
    since that changes where art comes from. */
const sceneCache = new Map();     // slug -> HTMLImageElement | null | Promise
function resetSceneCache() { sceneCache.clear(); }

function loadImg(src) {
  return new Promise(res => {
    if (!src) return res(null);
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => res(null);
    img.src = src;
  });
}

/*  THE ANCHOR PIXEL.

    A place drawing says where its own name goes, by carrying one pixel of a
    colour nothing else uses. It travels inside the PNG, which is the only
    place it can travel: the whole pipeline here is draw it, download it,
    commit it, and anything held beside the file in this browser is lost at the
    first `git pull` on another machine.

    WHERE the pixel is says WHAT it is:

      on the bottom row   a signpost, planted in the ground at that x. The
                          building decides where its own post stands — beside
                          the door, at the gable end — instead of it landing in
                          the middle of the column whatever is drawn there.

      anywhere else       a floating label at that exact point, with no post.
                          For the things a post would be a lie about: a name
                          over a roof, a hill, a stretch of water.

    Magenta because no one paints with it. It is stripped on the way in, so the
    pixel is a note to the renderer and never a mark on the picture. */
const SIGN_MARK = { r: 255, g: 0, b: 255 };

/*  THE OLD ANCHOR, READ AS THE NEW ONE.

    Anchors used to be a painted magenta pixel. They are an alpha flag now, and
    when the reader moved onto the effects table it stopped looking for magenta
    at all — so every drawing made the old way kept its anchor as a bright pink
    dot on the building, and the sign stopped going where it pointed.

    Both are fixed by honouring the old mark wherever art is read. Each opaque
    magenta pixel is handed back as an anchor position, and the pixel itself is
    given the colour of whatever is beside it, so where the note was there is
    building rather than a hole or a pink speck.

    `keep` is the alpha the pixel is left with: 255 for the street, which reads
    the anchor and throws the flag away, and ANCHOR_A for the editor, where the
    old mark becomes a real ⚑ you can see in effects mode and move like any
    other. A mark with nothing opaque beside it has nothing to borrow and no
    pixel to carry a flag on, so it goes transparent; the street still uses
    its position. */
/*  TWO COLOURS, AND ONLY ONE OF THEM IS A CONVENTION.

    Magenta #ff00ff is STORAGE. It was the anchor itself, painted into the PNG,
    and it was picked because nobody paints with it. Reserving it was the deal,
    so any opaque magenta pixel is an anchor and always was.

    Pink #ff78eb is DISPLAY. It is the anchor's ink in the editor, the colour
    of the wash that shows you what you have marked while a marker tool is up.
    It was never meant to reach a pixel. It only did because an earlier marker
    wrote its ink into the picture instead of only flagging the alpha.

    So the pink is only ever read as an anchor when the pixel is ALSO flagged,
    which is the signature of that bug and nothing else. Plain opaque pink is
    somebody painting: a flower, a sunset window, a painted sign. Treating a
    display colour as a reserved one would quietly make it unpaintable, and no
    one agreed to give up pink. */
const OLD_ANCHOR_RGB = [
  { rgb: [255, 0, 255], flaggedOnly: false },     // reserved, always an anchor
  { rgb: [255, 120, 235], flaggedOnly: true },    // ink spilled onto a flag
];
function adoptOldAnchors(px, w, h, keep) {
  const isMark = i => {
    const a = px[i + 3];
    if (a !== 255 && a !== ANCHOR_A) return false;
    for (const m of OLD_ANCHOR_RGB) {
      if (m.flaggedOnly && a !== ANCHOR_A) continue;
      if (px[i] === m.rgb[0] && px[i + 1] === m.rgb[1] && px[i + 2] === m.rgb[2]) return true;
    }
    return false;
  };
  const hits = [];
  for (let i = 0; i < px.length; i += 4) if (isMark(i)) hits.push(i / 4);
  for (const p of hits) {
    const x = p % w, y = (p / w) | 0, i = p * 4;
    let from = -1;
    for (const [dx, dy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
      const j = (ny * w + nx) * 4;
      if (px[j + 3] && !isMark(j)) { from = j; break; }
    }
    if (from < 0) { px[i + 3] = 0; continue; }
    px[i] = px[from]; px[i + 1] = px[from + 1]; px[i + 2] = px[from + 2];
    px[i + 3] = keep;
  }
  return hits.map(p => [p % w, (p / w) | 0]);
}

/*  MARKED GLASS, AND A MARKED DOOR.

    Two more reserved colours, on the same principle as the anchor pixel above
    and for the same reason: what a drawing MEANS has to ride inside the PNG,

/*  A candle is a POINT, not a filled pane.

const GLASS_DAY_CORE  = "#46596a";      // sky in the pane

/*  THE HOUR PASSES WITHOUT YOU.

const SUN_RATE = 1;                  // pixels per second

/*  THE MOON IS NOT ON THE SUN'S CLOCK.

/*  THE STORY.

/*  A name is what makes a scene findable in a library, so one is always

/*  The one writer of SUN_LOW — see DUSK. Given where the sun is hanging and

function readSignMark(img) {

  //  That is not a failure worth breaking the scene over: no mark, carry on.

      remembered, because it is the way into this place and something will want
      to know where it is. Done here, on the one pass that already reads every
      pixel of every scene image — a second sweep for this would be a second
      sweep for nothing. */

      of coordinates, or a `mask` when something downstream needs to ask "is

      then set back to opaque, so nothing a marker did survives into the

/*  Every marked pane, lit from its own middle outwards.

    the pane; a second pass over each pane turns depth into a fraction of its
    own deepest point, so a one-pixel slit and a ten-pixel casement are both
    lit across their whole width rather than the slit coming out uniformly

    tools use, so what counts as one window here is what looks like one window
    everywhere else. */

  const N = w * h;
  const depth = new Int32Array(N).fill(-1);
  const pane = new Int32Array(N).fill(-1);
  //  Depth 0 is any glass pixel touching something that is not glass — the
  //  frame, or the edge of the picture.
  const queue = [];

    for (let x = 0; x < w; x++) {

      if (edge) { depth[k] = 0; queue.push(k); }

    const stack = [k];

      if (y < y0) y0 = y; if (y > y1) y1 = y;

    const fx = box.x0 + (0.33 + (rnd % 34) / 100) * (bw - 1);
    const fy = box.y0 + 0.68 * (bh - 1);

    const reach = Math.max(bw, bh) * (0.95 + ((rnd >> 8) % 30) / 100);
    box.fx = fx; box.fy = fy; box.reach = reach;
    //  One candle is not the next: some rooms are brighter.
    /*  Over 1, so the middle of a pane saturates at the flame colour and the
        falloff happens across the glass rather than all of it being partway to

        — sixty pixels wide in a column — and a subtle one reads as grey. */
    box.warm = 1.15 + ((rnd >> 16) % 40) / 100;

  for (let k = 0; k < N; k++) {
    if (!isGlass[k]) continue;
    const id = pane[k], b2 = bounds[id];
    const x = k % w, y = (k - x) / w;

    /*  Inverse-square-ish rather than linear: a flame is very bright very

        the first attempt look like a sticker. */
    let lum = b2.warm / (1 + 1.5 * r * r);

    if (depth[k] === 0) lum *= 0.72;

        by how much light reaches there. So a pane with astragals across it
        keeps them: the glass is pale and lights, the astragal is dark and
        stays darker than the glass beside it, because both moved the same
        distance toward the same flame from different places.

        By day the mix is barely anything — daylight through glass is the
        drawing itself, very slightly cooled. */
    const mix = NIGHT ? 0.30 + 0.62 * t : 0.16;
    for (let ch = 0; ch < 3; ch++) {
      const lit = px[i + ch] + (c3[ch] - px[i + ch]) * mix;
      px[i + ch] = Math.max(0, Math.min(255, Math.round(lit)));
    }
  }

  /*  THE SPILL.

      A lit window throws a little light onto the wall around it. Without it
      the pane is a bright rectangle sitting on unlit stone, which is the last
      thing that keeps it looking pasted on. One pixel of it, warm and very
      faint, and only at night. */
  if (!NIGHT) return;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const k = y * w + x;
      if (isGlass[k]) continue;
      const i = k * 4;
      if (!px[i + 3]) continue;                 // nothing there to catch it
      let near = false;
      for (const n of [x > 0 ? k - 1 : -1, x < w - 1 ? k + 1 : -1,
                       y > 0 ? k - w : -1, y < h - 1 ? k + w : -1]) {
        if (n >= 0 && isGlass[n]) { near = true; break; }
      }
      if (!near) continue;
      for (let ch = 0; ch < 3; ch++) {
        px[i + ch] = Math.round(px[i + ch] + (core[ch] - px[i + ch]) * 0.18);
      }
    }
  }
}

//  "#rrggbb" as three numbers, for writing straight into pixel data.
function hexBytes(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

/*  An image averaged down to a fraction of its size.

    `imageSmoothingQuality: "high"` is a box filter in every engine that
    implements it, which is the right filter for minifying: every source pixel
    contributes, so a single bright pane becomes a dimmer pixel rather than
    being skipped. Done in one step because the reductions here are modest —
    a place is 102 wide in a column of about 100. */
function shrunk(img, fit) {
  const w = Math.max(1, Math.round(img.width * fit));
  const h = Math.max(1, Math.round(img.height * fit));
  if (img.__shrunk && img.__shrunk.width === w && img.__shrunk.height === h) {
    return img.__shrunk;
  }
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d");
  g.imageSmoothingEnabled = true;
  g.imageSmoothingQuality = "high";
  g.drawImage(img, 0, 0, img.width, img.height, 0, 0, w, h);
  try { img.__shrunk = c; } catch (e) { /* a plain Image will take it too */ }
  return c;
}

function sceneImage(slug) {
  if (sceneCache.has(slug)) return sceneCache.get(slug);
  // The place's own picture, then the one everywhere shares.
  const pending = loadImg(sceneSrc(slug))
    .then(img => img || (slug === "default" ? null : loadImg(sceneSrc("default"))))
    .then(img => {
      const got = img ? readSignMark(img).img : null;
      sceneCache.set(slug, got);
      return got;
    });
  sceneCache.set(slug, pending);
  return pending;
}

/*  A wardrobe is one file.

    images/wear/<who>.png — four frames across, four rows down, the rows in
    ROWS order from the skin outwards. The cell is width/4 by height/4, so a
    96 x 96 sheet is four 24 x 24 cells and a 128 x 160 sheet is four 32 x 40
    ones. A broader hat therefore makes the whole figure's cell broader, which
    is the price of one file and a fair one: a hat is only ever broad ON
    somebody.

    Four frames is fixed, because nothing in a PNG can say otherwise. With a
    file per layer the cell width was derivable from the layer's own size;
    stacked into one sheet every row shares a cell, and a sheet cannot say how
    many columns it was cut into. */
const ROW_CACHE = new Map();   // sheet Image -> [canvas | null] in ROWS order

function sheetRows(img) {
  if (!img) return null;
  const had = ROW_CACHE.get(img);
  if (had) return had;

  const w = img.width, rh = Math.max(1, Math.round(img.height / ROWS.length));
  const probe = document.createElement("canvas");
  probe.width = w; probe.height = img.height;
  const pg = probe.getContext("2d", { willReadFrequently: true });
  pg.imageSmoothingEnabled = false;
  pg.drawImage(img, 0, 0);

  const rows = ROWS.map((slot, i) => {
    /*  A row nobody drew on is not an empty coat — it is a coat this sheet has
        no opinion about, so it falls through to the next sheet in the chain.
        Which is what makes one file per wearer as expressive as four: a sheet
        with only the hat row inked changes only the hat. */
    const d = pg.getImageData(0, i * rh, w, rh).data;
    let ink = false;
    for (let p = 3; p < d.length; p += 4) if (d[p]) { ink = true; break; }
    if (!ink) return null;
    const c = document.createElement("canvas");
    c.width = w; c.height = rh;
    const g = c.getContext("2d");
    g.imageSmoothingEnabled = false;
    g.drawImage(img, 0, i * rh, w, rh, 0, 0, w, rh);
    c.__frames = SPR_FRAMES;
    return c;
  });
  /*  Bounded, because the editor loads a fresh Image on every pass and each
      one is a new key. The Promenade's sheets come from costumeCache and are
      the same objects render after render, so they cost four entries, not one
      per render — this cap only ever throws away editor scratch. */
  if (ROW_CACHE.size > 64) ROW_CACHE.clear();
  ROW_CACHE.set(img, rows);
  return rows;
}

function wearSheet(who, onReady) {
  return who ? layerImage("wear", who, onReady) : null;
}

/*  A LOOSE LAYER, for when a whole sheet is more than you meant.

        images/wear/<who>.<slot>.png     slot = body | bottom | top | hat

    Drawing one hat should not require drawing the three rows under it, and a
    hat that has to live inside somebody's sheet cannot be lent to anybody
    else. So a single-layer file still counts, and it beats the same wearer's
    sheet — it is the more specific statement of the two.

    Its cell is its own, which is the one thing a sheet cannot offer: a broad
    hat here is broad without widening the body it sits on. */
function wearImage(who, slot, onReady) {
  return who ? layerImage("wear", who + "." + slot, onReady) : null;
}

/*  Everything this person has on.

    Three wearers, most specific first — themselves, their trade, everybody —
    and for each of them a loose layer beats their sheet's row. First hit down
    that list wins the slot, so a trade supplies a coat while one person
    overrides only the hat, and a slot nobody has drawn anywhere keeps the
    built-in. */
function outfitFor(slug, trade, host, onReady) {
  const whos = [slug, trade, "default"].filter(Boolean);
  const rowsOf = new Map();
  const rows = who => {
    if (!rowsOf.has(who)) rowsOf.set(who, sheetRows(wearSheet(who, onReady)));
    return rowsOf.get(who);
  };
  return ROWS.map((slot, i) => {
    let img = null;
    for (const who of whos) {
      img = wearImage(who, slot, onReady) || (rows(who) || [])[i];
      if (img) break;
    }
    if (!img) img = host && host._wear[slot];
    return img ? { img, slot } : null;
  });
}

/*  What sits in front of what, on the STAGE — which is the layer that does not
    pan, unlike the world inside it.

        0   the street: ground, gradients, scenery, people, signposts
        5   the sky: a balloon, a skein of birds — over the street, under the pen
