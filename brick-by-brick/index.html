  /* Square, so a handle never reads as one of your own round marks. */
  .me-handle {
    width: 9px; height: 9px; background: var(--accent2);
    border: 1px solid #05080b; border-radius: 1px; cursor: grab;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.55);
  }
  .me-handle:active { cursor: grabbing; }
  #mapeditor .maplibregl-marker { z-index: 4; }
  .me-list { display: flex; flex-direction: column; gap: 2px; margin: 4px 0 7px; }
  .me-item {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px;
    align-items: center; padding: 2px 4px; border: 1px solid transparent;
    border-radius: 3px; cursor: pointer; font-size: 0.7rem;
  }
  .me-item:hover { border-color: var(--border); }
  .me-item.on { border-color: var(--accent2); background: var(--tint); }
  .me-nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .me-del { border: 0; background: none; opacity: 0.4; padding: 0 3px; }
  .me-del:hover { opacity: 1; color: var(--bad); }
  .me-style {
    display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px;
    padding-top: 7px; border-top: 1px solid var(--border-soft);
  }
  .me-style[hidden] { display: none; }
  .me-field { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 7px; align-items: center; }
  .me-field > span { font-size: 0.65rem; opacity: 0.55; }
  .me-field input[type="color"] {
    width: 24px; height: 18px; padding: 0; border: 1px solid var(--border);
    border-radius: 3px; background: none; cursor: pointer;
  }
  .me-field input[type="range"] { width: 100%; accent-color: var(--accent2); }
  .me-field input[type="text"], .me-field select { width: 100%; font-size: 0.66rem; }
  .me-url { width: 100%; font-size: 0.63rem; margin: 2px 0 4px; }

  /* ---------- theme ---------- */
  .th-presets { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 9px; }
  .th-presets button { display: flex; align-items: center; gap: 5px; }
  /* Each preset shows its own ground and both accents — you pick a theme by
     looking at it, not by reading its name. */
  .th-chip {
    display: inline-flex; gap: 2px; align-items: center; justify-content: center;
    width: 22px; height: 13px; border: 1px solid; border-radius: 2px;
  }
  .th-chip i { width: 4px; height: 4px; border-radius: 50%; }
  /* A saved theme and its × read as one control, so they sit flush. */
  .th-item { display: inline-flex; }
  .th-item > button[data-theme] { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .th-del {
    border-left: 0; border-top-left-radius: 0; border-bottom-left-radius: 0;
    padding: 0 5px; opacity: 0.5; font-size: 0.8rem; line-height: 1;
  }
  .th-del:hover { opacity: 1; border-color: var(--bad); color: var(--bad); }
  .th-presets input[type="text"] { min-width: 0; }
  /* One column: each swatch now carries a line of explanation, and two
     columns of that is a wall of text in a one-cell tile. */
  .th-rows { display: flex; flex-direction: column; gap: 3px; }
  .th-row { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 7px; }
  .th-label { min-width: 0; display: flex; align-items: baseline; gap: 6px; }
  .th-label b { font-weight: normal; font-size: 0.72rem; opacity: 0.85; }
  .th-label em {
    font-style: normal; font-size: 0.6rem; opacity: 0.42;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .th-row input[type="color"] {
    width: 24px; height: 18px; padding: 0; border: 1px solid var(--border);
    border-radius: 3px; background: none; cursor: pointer;
  }

  /* ---------- map style ---------- */
  #mapstyle .panel-body { display: flex; flex-direction: column; }
  .ms-rows { display: flex; flex-direction: column; gap: 3px; }
  /* Sized to survive a one-column tile, which is where this panel will
     usually live: the name is the only part allowed to give up space. */
  .ms-row { display: grid; grid-template-columns: auto auto minmax(40px, 1fr) 42px 42px; align-items: center; gap: 5px; }
  .ms-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ms-row input[type="color"] {
    width: 24px; height: 18px; padding: 0; border: 1px solid var(--border);
    border-radius: 3px; background: none; cursor: pointer;
  }
  /* Controls, not data: green like every other affordance on the page. */
  .ms-row input[type="range"] { width: 42px; accent-color: var(--accent2); }
  .ms-row input[type="checkbox"] { accent-color: var(--accent2); cursor: pointer; }
  .ms-name { font-size: 0.72rem; opacity: 0.8; }
  .ms-head { padding-bottom: 3px; border-bottom: 1px solid var(--border-soft); margin-bottom: 3px; }
  .ms-col {
    font-size: 0.56rem; text-transform: uppercase; letter-spacing: 0.06em;
    opacity: 0.45; overflow: hidden; text-overflow: ellipsis;
  }
  /* Where the basemap layers end and the label controls begin. */
  .ms-sep { margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--border-soft); }
  .ms-bar { gap: 6px; margin-top: 9px; }
  .ms-raw { margin-top: 8px; display: flex; flex-direction: column; }
  .ms-raw[hidden] { display: none; }
  .ms-text {
    width: 100%; min-height: 150px; resize: vertical; font-family: var(--mono, monospace);
    font-size: 0.66rem; line-height: 1.5; background: var(--field); color: var(--fg);
    border: 1px solid var(--border); border-radius: 4px; padding: 7px;
  }
  .ms-pick { width: 100%; margin-bottom: 6px; font-size: 0.66rem; }
  .ms-pick[hidden] { display: none; }
  /* No :focus rule — the page already has one for every textarea, and a second
     one here in a different color is exactly the mismatch worth avoiding. */
  /*  Zoom and extent, in the order a project file wants them. Bottom-left,
      out of the way, and monospaced so the digits do not jitter as you pan. */
  .map-where {
    position: absolute; left: 6px; bottom: 6px; z-index: 4; cursor: pointer;
    font-family: var(--mono); font-size: 9.5px; letter-spacing: -0.01em;
    color: #cfd6dc; opacity: 0.5; background: rgba(0,0,0,0.45);
    border-radius: 3px; padding: 2px 5px; white-space: nowrap;
  }
  .map-where:hover { opacity: 0.95; }
  .map-where.copied { color: var(--accent2); opacity: 1; }
  /* Deliberately tiny and non-interactive: a credit line, not a UI element. */
  .map-attrib {
    position: absolute; right: 4px; bottom: 3px; z-index: 2; pointer-events: none;
    font-size: 8.5px; line-height: 1.4; letter-spacing: 0.01em;
    color: #cfd6dc; opacity: 0.45; text-shadow: 0 0 3px #0d1317, 0 0 2px #0d1317;
  }
  .map-attrib[hidden] { display: none; }
  /* Sits above the coordinate readout, which owns the bottom-left corner. */
  .map-note {
    position: absolute; left: 8px; bottom: 26px; z-index: 2;
    font-size: 0.68rem; background: rgba(0,0,0,0.75); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 8px; pointer-events: none;
  }
  /* MapLibre's own chrome, restyled to sit inside a dark panel rather than a
     full-page map. */
  .maplibregl-ctrl-top-right { top: 6px; right: 6px; }
  .maplibregl-ctrl-group { background: #111 !important; border: 1px solid var(--border) !important; }
  .maplibregl-ctrl-group button { background: transparent !important; }
  .maplibregl-ctrl-attrib { background: rgba(0,0,0,0.6) !important; font-size: 10px !important; }
  .maplibregl-ctrl-attrib a { color: #9fb0bd !important; }
  .maplibregl-popup-content { background: #111 !important; color: var(--fg) !important; }

  /* ---------- the promenade ---------- */
  /*  The scene takes the whole tile. Its readouts float on top of it rather
      than stealing a strip, because a promenade with a caption bar under it
      is a diagram, not a view. */
  #viz-promenade .panel-body { padding: 0; overflow: hidden; }
  .pr-shell {
    position: absolute; inset: 0; overflow: hidden;
    background: var(--field); cursor: grab;
  }
  .pr-shell:active { cursor: grabbing; }
  .pr-canvas { display: block; }
  .pr-note {
    position: absolute; left: 8px; bottom: 6px; z-index: 2; margin: 0;
    font-size: 0.6rem; opacity: 0.45; pointer-events: none;
    text-shadow: 0 0 3px #0d1317, 0 0 2px #0d1317;
  }
  /*  Clear of the panel's own close button, which owns the top-right corner.
      At top: 6px the + sat directly beside the ×, so reaching for one risked
      the other — and one of them removes the panel. */
  .pr-zoom {
    position: absolute; right: 6px; top: 28px; z-index: 2;
    font-size: 0.62rem; padding: 1px 7px; min-width: 30px;
  }
  .pr-zoom { min-width: 24px; }
  .pr-zoom-out { right: 34px; }
  .pr-zoom:disabled { opacity: 0.3; cursor: default; }
  .pr-night { font-size: 0.72rem; padding: 1px 5px; }
  .pr-weather { width: 44px; accent-color: var(--accent2); }
  .pr-smoke { display: flex; gap: 3px; align-items: center; }
  .pr-smoke input[type="range"] { width: 44px; accent-color: var(--accent2); }
  .pr-mode { right: 66px; min-width: 46px; }
  .pr-drift { right: 120px; min-width: 26px; }
  .pr-drift.on { border-color: var(--accent2); color: var(--accent2); }
  /*  Left of the drift button, and lit while it is on, so it reads as the
      switch it is rather than as an action you fire. */
  .pr-bare-btn { right: 152px; min-width: 26px; }
  .pr-bare-btn.on { border-color: var(--accent2); color: var(--accent2); }
  .pr-sort {
    position: absolute; right: 152px; top: 28px; z-index: 2;
    font-size: 0.62rem; padding: 1px 4px;
  }
  .pr-sort[hidden] { display: none; }
  /* Appears only when a place is selected, so it never asks you to guess
     what it would color. */
  .pr-tint {
    position: absolute; left: 8px; top: 6px; z-index: 3;
    display: flex; align-items: center; gap: 5px;
    background: rgba(0,0,0,0.6); border: 1px solid var(--border);
    border-radius: 4px; padding: 3px 6px;
  }
  .pr-tint[hidden] { display: none; }
  /*  The scenery strip. Same corner and same dress as the tint bar, because
      it is the same kind of thing: dials for whatever you just asked about. */
  /*  THROUGH THE DOOR. Anchored to the panel rather than to the building,
      because a building near the right edge would push its own list off the
      screen. Capped and scrollable: a busy parish can name thirty people and
      the panel is not always tall. */
  .pr-door {
    position: absolute; right: 8px; top: 8px; bottom: 8px; width: min(290px, 62%);
    z-index: 4; display: flex; flex-direction: column;
    background: rgba(0,0,0,0.82); border: 1px solid var(--border);
    border-radius: 4px; overflow: hidden;
  }
  .pr-door[hidden] { display: none; }
  .pr-door-head {
    display: flex; align-items: baseline; gap: 6px;
    padding: 5px 6px; border-bottom: 1px solid var(--border); flex: 0 0 auto;
  }
  .pr-door-name { font-size: 0.74rem; font-weight: 600; flex: 1 1 auto;
                  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pr-door-tabs { display: flex; gap: 2px; flex: 0 0 auto; }
  .pr-door-tabs button {
    font-size: 0.58rem; padding: 1px 6px; border-radius: 3px;
    border: 1px solid var(--border); background: none; color: inherit;
    cursor: pointer; opacity: 0.6;
  }
  .pr-door-tabs button.on { opacity: 1; border-color: var(--accent2); }
  .pr-door-x { flex: 0 0 auto; }
  .pr-door-count { font-size: 0.58rem; opacity: 0.55; padding: 3px 7px 0; flex: 0 0 auto; }
  .pr-door-body { overflow-y: auto; padding: 4px 6px 8px; flex: 1 1 auto; }
  /*  The chronology has no person heading to indent under, so its list sits
      flush and each entry names who it caught. */
  .pr-door-flat { padding-left: 0; }
  .pr-door-named {
    display: block; border: 0; padding: 0 0 4px 12px;
    font-size: 0.57rem; opacity: 0.6;
  }
  .pr-door-empty { font-size: 0.62rem; opacity: 0.65; margin: 6px 2px; }
  .pr-door-row { margin: 0 0 7px; }
  .pr-door-who {
    background: none; border: 0; padding: 1px 0; cursor: pointer;
    font: inherit; font-size: 0.66rem; color: var(--accent2); text-align: left;
  }
  .pr-door-who:hover { text-decoration: underline; }
  .pr-door-recs { list-style: none; margin: 1px 0 0; padding: 0 0 0 7px; }
  .pr-door-recs li {
    display: flex; gap: 5px; align-items: baseline;
    font-size: 0.6rem; line-height: 1.45;
    /*  The same distinction the whole page runs on, carried by the border's
        STYLE as well as its colour so it survives greyscale: a solid edge is
        a document saying so, a dashed one is somebody's inference. */
    border-left: 2px solid var(--border); padding-left: 5px;
  }
  .pr-door-recs li.is-sure { border-left-style: solid; opacity: 0.95; }
  .pr-door-recs li.is-draft { border-left-style: dashed; opacity: 0.7; }
  /*  A visit is neither a document nor an inference: it is a thing you did.
      Dotted, which the page already uses for somebody named but not set
      down, and in the accent so it reads as yours rather than as weaker. */
  .pr-door-recs li.is-visit {
    border-left-style: dotted; border-left-color: var(--accent2); opacity: 0.85;
  }
  .pr-door-when { font-variant-numeric: tabular-nums; opacity: 0.75; flex: 0 0 auto; }
  .pr-door-what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pr-sky-piece { display: flex; align-items: center; gap: 5px; }
  .pr-sky-on { display: flex; align-items: center; gap: 3px;
               font-size: 0.62rem; opacity: 0.85; cursor: pointer; }
  .pr-sky-on input { margin: 0; cursor: pointer; }
  .pr-scenery-btn { font-size: 0.72rem; }
  /*  Label above the slider, so three dials in a row read as three dials. */
  .pr-sky-dial { display: flex; flex-direction: column; gap: 1px; cursor: pointer; }
  .pr-sky-dial span { font-size: 0.52rem; opacity: 0.65; letter-spacing: 0.04em; }
  /*  Wider than the tint bar's, because these carry a much longer range and
      the same 54px would make every step a jump.

      Both classes, because `.pr-tint input[type="range"]` further down has the
      same specificity and would otherwise win on source order alone. */
  .pr-tint.pr-sky-bar input[type="range"] { width: 78px; }
  .pr-tint-name { font-size: 0.62rem; opacity: 0.8; max-width: 110px;
                  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pr-tint input[type="color"] {
    width: 22px; height: 16px; padding: 0; border: 1px solid var(--border);
    border-radius: 3px; background: none; cursor: pointer;
  }
  .pr-files {
    position: absolute; right: 6px; bottom: 6px; z-index: 3; display: flex; gap: 4px;
  }
  .pr-files button, .pr-files .pr-doc {
    font-size: 0.6rem; padding: 1px 7px; line-height: 1.7;
  }
  /* Named on the bar rather than in a dialog the browser is free to suppress. */
  .pr-groupin {
    font-size: 0.6rem; padding: 1px 6px; line-height: 1.7; width: 120px;
    border: 1px solid var(--accent2); border-radius: 3px;
    background: var(--field); color: var(--fg);
  }
  /*  The scene's sky and ground, in the panel's own bar. Two swatches sized to
      the buttons beside them, so the bar reads as one row rather than a
      control bolted onto the end of it. */
  .pr-bg {
    display: flex; align-items: center; gap: 3px;
    padding: 0 5px; border: 1px solid var(--border); border-radius: 3px;
    background: var(--field);
  }
  .pr-bg-cap { font-size: 0.55rem; opacity: 0.5; letter-spacing: 0.04em; }
  .pr-bg input[type="color"] {
    width: 15px; height: 15px; padding: 0; border: 1px solid var(--border);
    border-radius: 2px; background: none; cursor: pointer;
  }
  .pr-bg button { border: 0; background: none; padding: 0 2px; opacity: 0.55; }
  .pr-bg button:hover { opacity: 1; }
  /* A link, styled as one of the buttons beside it. */
  .pr-doc {
    border: 1px solid var(--border); border-radius: 3px; background: var(--field);
    color: var(--fg); text-decoration: none;
  }
  .pr-doc:hover { border-color: var(--accent2); color: var(--accent2); }
  /* Sits under the pen, because that is all it searches. */
  .pr-find {
    position: absolute; z-index: 3; font-size: 0.6rem; padding: 2px 5px;
  }
  .pr-find[hidden] { display: none; }
  /*  THE HANDLE HAS TO REACH BOTH ENDS.

      A native thumb is about sixteen pixels wide and it may not hang off the
      track, so its centre only travels from 8px to width-8px. On a 54px
      slider that is three quarters of the bar: you drag to the far right and
      the handle stops short of it, which reads as the control refusing rather
      than as the value being at its maximum. Drawn small, the same slider
      travels almost the whole way and max looks like max. */
  .pr-tint input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 54px; height: 10px; margin: 0; background: transparent;
    cursor: pointer;
  }
  .pr-tint input[type="range"]::-webkit-slider-runnable-track {
    height: 3px; border-radius: 2px; background: var(--border);
  }
  .pr-tint input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 8px; height: 8px; border-radius: 50%; border: 0;
    background: var(--accent2); margin-top: -2.5px;
  }
  .pr-tint input[type="range"]::-moz-range-track {
    height: 3px; border-radius: 2px; background: var(--border);
  }
  .pr-tint input[type="range"]::-moz-range-thumb {
    width: 8px; height: 8px; border-radius: 50%; border: 0;
    background: var(--accent2);
  }
  /*  Stacked in the order they appear on the street: the box for the line
      over the roof sits over the box for the line on the ground. */
  .pr-notes { display: flex; flex-direction: column; gap: 2px; }
  .pr-note-in {
    width: 170px; font-size: 0.66rem; padding: 1px 4px;
    background: rgba(0,0,0,0.35); border: 1px solid var(--border);
    border-radius: 3px; color: inherit;
  }
  .pr-tint button { font-size: 0.62rem; padding: 0 5px; line-height: 1.5; }
  .pr-scene { position: relative; height: 100%; min-height: 150px; }
  .pr-sky {
    position: absolute; inset: 0 0 34% 0;
    background: linear-gradient(180deg, #14202b 0%, #1d2c38 60%, #24333f 100%);
  }
  .pr-ground {
    position: absolute; inset: 66% 0 0 0; background: #1a1f18;
    border-top: 2px solid #2b3327;
  }
  .pr-cast { position: absolute; inset: 0; }

  /* Signposts: the place names, standing in the ground. */
  .pr-sign { position: absolute; bottom: 26%; transform: translateX(-50%); text-align: center; }
  .pr-sign-board {
    display: block; font-size: 9px; letter-spacing: 0.02em; white-space: nowrap;
    background: #4a3b28; color: #e8dcc4; border: 1px solid #2c2318;
    padding: 2px 5px; border-radius: 1px;
  }
  .pr-sign-post { display: block; width: 2px; height: 16px; margin: 0 auto; background: #3a2f20; }
  .pr-sign-lost .pr-sign-board { background: #2a2a2a; color: var(--draft); border-color: #1c1c1c; }

  /*  A walker. Blocky on purpose — placeholder art with the era logic already
      wired, so a sprite sheet can drop in later without changing placement. */
  .pr-walker {
    position: absolute; bottom: 26%; width: 14px;
    transform: translateX(-50%);
    animation: pr-pace var(--dur, 8s) ease-in-out infinite alternate;
    animation-delay: var(--delay, 0s);
  }
  .pr-name {
    position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
    font-size: 8px; white-space: nowrap; color: #cfd6dc; opacity: 0.75;
    text-shadow: 0 0 3px #0d1317, 0 0 2px #0d1317; pointer-events: none;
  }
  .pr-body { position: relative; display: block; width: 14px; height: 24px; }
  .pr-body > i { position: absolute; display: block; }
  .pr-head { left: 4px; bottom: 15px; width: 6px; height: 6px; background: #c9a689; }
  .pr-coat { left: 3px; bottom: 6px; width: 8px; height: 10px; background: var(--coat); }
  .pr-leg  { bottom: 0; width: 3px; height: 6px; background: var(--trim);
             animation: pr-step 0.6s steps(2) infinite; }
  .pr-leg.l { left: 4px; }
  .pr-leg.r { left: 8px; animation-delay: 0.3s; }
  .pr-hat { left: 3px; bottom: 20px; }
  .hat-tall   { width: 8px; height: 6px; background: #16181c; }
  .hat-bowler { width: 8px; height: 3px; background: #16181c; border-radius: 3px 3px 0 0; }
  .hat-cap    { width: 8px; height: 2px; background: #4a4335; }
  .hat-none   { display: none; }
  /* Someone with no place in the record stands apart, and looks it. */
  .pr-lost { opacity: 0.45; }
  .pr-lost .pr-coat, .pr-lost .pr-leg { background: var(--draft); }

  @keyframes pr-pace { from { margin-left: -18px; } to { margin-left: 18px; } }
  @keyframes pr-step { from { height: 6px; } to { height: 4px; } }
  /* Anyone who asks for stillness gets a tableau instead of a parade. */
  @media (prefers-reduced-motion: reduce) {
    .pr-walker, .pr-leg { animation: none; }
  }

  .slot-empty { display: flex; flex-direction: column; gap: 9px; }
  .slot-desc { font-size: 0.74rem; opacity: 0.5; }
  .slot-note { font-size: 0.69rem; opacity: 0.45; border: 1px dashed var(--border);
               border-radius: 4px; padding: 9px; line-height: 1.65; }
  .feed { font-family: var(--mono); font-size: 11px; opacity: 0.75; line-height: 1.7; }
  .feed b { color: var(--accent); font-weight: normal; }
</style>
</head>
<body>

<div class="topbar">
  <h1><span class="brickmark">🧱</span> Brick by Brick</h1>
  <p class="tagline">A notation system where you define the symbols. Add a brick, the connections emerge.
    <!-- Next to the tagline, which is where someone who does not yet know what
         this is has just finished reading. The per-panel “?” answers “what is
         THIS box”; this answers “what is any of this”. -->
    <a class="top-guide" href="doc/quick-guide.html" target="_blank" rel="noopener"
       title="what a brick is, what the panels do, and how to keep your work safe">quick guide</a></p>
  <!-- Same filter state as the Filter panel's search, reachable without it. -->
  <!-- The autosave has no button, so it needs a line saying it happened. -->
  <span class="save-state" id="saveState" hidden></span>
  <label class="top-auto"><input type="checkbox" id="autoSave" checked>auto</label>
  <button type="button" id="quickSave" class="top-btn">Save to browser</button>
  <button type="button" id="quickDownload" class="top-btn">Export</button>
  <!-- Beside Export on purpose: the safe way out sits next to the
       destructive one, so the escape route is already under the cursor. -->
  <button type="button" id="quickClear" class="top-btn danger"
          title="empty the pile and put every panel back as it started">Clear all</button>
  <div class="topsearch" id="topsearch">
    <input type="text" id="topsearchInput" placeholder="find in the text…" spellcheck="false">
    <button id="topsearchBtn" title="search the pile">&#128269;</button>
  </div>
</div>

<div id="board"></div>

<div id="boardFlyoutWrap">
  <button type="button" id="boardFlyoutTab" title="show/hide the panel list">&#129520;</button>
  <div id="boardFlyout">
    <h3>Panels</h3>
    <div class="row">
      <label>Columns <input type="number" id="boardCols" min="1" max="12" step="1" value="4"></label>
      <label>Row px <input type="number" id="boardRowUnit" min="80" max="600" step="10" value="220"></label>
      <button type="button" id="boardFlyoutClose" title="hide the list">&times;</button>
    </div>
    <div class="row"><button type="button" id="boardReset" title="back to the starting board">reset board</button></div>
    <input type="text" id="boardSearch" placeholder="search panels&hellip;" spellcheck="false">
    <!-- What the badges on every panel header mean. Spelled out here, where
         you are already reading the list of panels, rather than hidden behind
         a hover on each one. -->
    <p class="role-key">
      <span><span class="role-badge role-write">W</span>write &mdash; changes the pile</span>
      <span><span class="role-badge role-filter">F</span>filter &mdash; changes what is in view</span>
      <span><span class="role-badge role-read">R</span>read only</span>
    </p>
    <div id="boardCardList"></div>
  </div>
</div>

<div id="panelStore" hidden></div>

<template id="tpl-pallet">
  <!-- One compact bar. The eight buttons and the syntax hint used to sit open
       above the editor and cost more vertical space than the text itself. -->
  <div class="pallet-menu" data-el="menu" hidden>
    <button data-act="sample" title="replace the text with the bundled Bricknall sample">Sample</button>
    <button data-act="clear" title="empty the pallet">Clear</button>
    <button data-act="copy" title="copy the raw notation to the clipboard">Copy</button>
    <button data-act="export" title="save the notation as a .txt file">Export</button>
    <button data-act="import" title="open a .txt file of bricks — replaces what is here">Import</button>
    <button data-act="merge" title="add one or more .txt files to this pile, keeping what is already here">Merge</button>
    <button data-act="folder" title="read every .txt in a folder, including subfolders, and merge them in filename order">Folder…</button>
    <button data-act="rescan" hidden title="read that folder again — duplicates are skipped, so only new bricks come in">Rescan</button>
    <p class="hint" style="margin:6px 0 0"><code>[status]|[type]|[field]|[field]|[linkage]</code><br><code>+</code> verified, <code>-</code> draft.</p>
  </div>
  <span class="pallet-status" data-el="mergelog"></span>
  <!-- Above the editor: this is how you choose what goes ON the pallet. -->
  <div class="file-list" data-el="files"></div>
  <textarea data-el="text" spellcheck="false" placeholder="+|👤|<someone>|A description"></textarea>
</template>
<template id="tpl-classification">
  <div class="filtered-note" data-el="note" hidden></div>
  <div class="lines" data-el="lines"></div>
</template>
<template id="tpl-entities">
  <div class="ent-controls">
    <input type="text" data-el="local" placeholder="filter…" spellcheck="false">
    <span class="ent-kinds" data-el="kinds"></span>
  </div>
  <div class="ents" data-el="ents"></div>
  <p class="hint" data-el="entnote">solid verified &middot; dashed draft &middot; dotted ghost</p>
</template>
<template id="tpl-builder">
  <div class="bld-editing" data-el="editing" hidden></div>
  <div class="bld-row bld-status" data-el="status"></div>
  <div class="bld-row bld-type" data-el="type"></div>
  <div data-el="fields"></div>
  <div class="bld-preview" data-el="preview"></div>
  <div class="bld-clash" data-el="clash" hidden></div>
  <div class="bld-row">
    <button data-act="commit">Add brick</button>
    <button data-act="cancel" hidden>Cancel edit</button>
    <button data-act="clearfields" title="empty the fields, keep the type">Clear</button>
  </div>
  <datalist data-el="aliases"></datalist>
  <p class="hint">Click any line in Classification to load it here for editing.</p>
</template>

<template id="tpl-filter">
  <div class="row">
    <input type="text" data-el="text" placeholder="find in the text&hellip;" spellcheck="false" style="flex:1;min-width:90px">
    <button data-act="clear" title="show everything again">reset</button>
  </div>
  <div class="flt-group"><div class="flt-label">Confidence</div><div class="flt-chips" data-el="status"></div></div>
  <div class="flt-group"><div class="flt-label">Kind</div><div class="flt-chips" data-el="types"></div></div>
  <div class="flt-group">
    <div class="flt-label" data-el="sectionlabel">Your headings</div>
    <div class="flt-chips" data-el="sections"></div>
  </div>
  <div class="flt-group" data-el="focuswrap" hidden>
    <div class="flt-label">Focused on</div>
    <div class="flt-chips" data-el="focus"></div>
  </div>
  <div class="flt-group">
    <div class="flt-label">Time</div>
    <div class="flt-chips" data-el="timemode"></div>
    <div data-el="timebody"></div>
  </div>
  <p class="hint" data-el="summary"></p>
</template>

<template id="tpl-document">
  <div class="row">
    <button data-act="prev" title="previous document">&larr;</button>
    <span class="doc-pos" data-el="pos"></span>
    <button data-act="next" title="next document">&rarr;</button>
    <button data-act="open" hidden title="open the original in a new tab">open &#8599;</button>
    <button data-act="edit" hidden title="load this brick into the Brick Builder">edit</button>
    <button data-act="ref" title="open an image from disk to draw from — this session only">ref&hellip;</button>
    <input type="file" accept="image/*" data-el="reffile" hidden>
  </div>
  <div class="doc-viewport" data-el="viewport">
    <canvas data-el="canvas"></canvas>
    <div class="doc-zoom">
      <button data-act="zoomout" title="zoom out">&minus;</button>
      <span data-el="zoomlabel">100%</span>
      <button data-act="zoomin" title="zoom in">+</button>
      <button data-act="fit" title="fit the whole scan in the panel">Fit</button>
      <button data-act="actual" title="actual pixels">1:1</button>
    </div>
    <div class="doc-overlay" data-el="overlay" hidden></div>
  </div>
  <div data-el="view"></div>
</template>

<template id="tpl-gazetteer">
  <!-- File actions live behind the header menu; only the row you actually
       type into stays on show. -->
  <div class="gaz-menu" data-el="menu" hidden>
    <button data-act="load" title="add one or more gazetteer .csv files">Load&hellip;</button>
    <button data-act="export" title="save the loaded gazetteer as a .csv file">Export</button>
    <button data-act="clear" title="forget every loaded entry">Clear</button>
  </div>
  <div class="row gaz-add">
    <input type="text" data-el="newname" placeholder="new place…" spellcheck="false">
    <input type="number" step="any" data-el="newlat" placeholder="lat">
    <input type="number" step="any" data-el="newlng" placeholder="lng">
    <button data-act="add" title="declare this place and set its coordinates">Add</button>
  </div>
  <p class="hint" data-el="summary" style="margin:0 0 7px"></p>
  <div class="gaz-list" data-el="list"></div>
</template>

<template id="tpl-mapeditor">
  <div class="row me-tools">
    <button data-act="point" title="click the map to drop a reference point">📍</button>
    <button data-act="line" title="click the map for each vertex, then Finish">╱</button>
    <button data-act="poly" title="click the map for each corner, then Finish">⬠</button>
    <button data-act="arrow" title="click the map twice: from, then to">➤</button>
    <button data-act="curve" title="click twice for a curved arrow">↝</button>
    <button data-act="text" title="click the map to place a note">🗨</button>
    <button data-act="finish" hidden>Finish</button>
    <button data-act="cancel" hidden>Cancel</button>
  </div>
  <p class="hint" data-el="tip"></p>
  <!-- Paste a style URL to trace on. A MapTiler URL with your key in it works
       as typed; write {key} instead to keep the key out of what you share. -->
  <input type="text" class="me-url" data-el="meurl" spellcheck="false"
    placeholder="paste a basemap style URL to trace on…">
  <!-- The digitizing surface. Deliberately its own map: no bricks, no
       markers, no place labels — only the basemap and what you are drawing,
       so nothing you did not put there can be clicked or read by mistake. -->
  <div class="me-shell" data-el="shell">
    <div class="me-canvas"></div>
    <!-- What you are tracing against. Its own choice, separate from the Map
         Viewer's: you often want imagery here and your own cartography there. -->
    <select class="map-source" data-el="mesource"></select>
  </div>
  <div class="me-list" data-el="list"></div>
  <div class="me-style" data-el="style" hidden></div>
  <div class="row ms-bar">
    <button data-act="view" title="store the map's current center and zoom in the file">Capture view</button>
    <button data-act="download" title="save this project file">Download</button>
    <button data-act="wipe" title="throw the whole project file away">Clear</button>
  </div>
</template>

<template id="tpl-theme">
  <div class="th-presets" data-el="presets"></div>
  <div class="ms-rows th-rows" data-el="rows"></div>
  <div class="row ms-bar">
    <input type="text" data-el="name" placeholder="save as…" spellcheck="false">
    <button data-act="save" title="keep these colors under a name">Save</button>
    <button data-act="reset" title="back to Night, the theme this page ships with">Reset</button>
  </div>
  <p class="hint" data-el="msg"></p>
</template>

<template id="tpl-mapstyle">
  <div class="ms-rows" data-el="rows"></div>
  <!-- Outside the fold: it explains why the controls above are grayed, so it
       has to be visible when the style file editor is closed. -->
  <p class="hint" data-el="msg"></p>
  <div class="row ms-bar">
    <button data-act="reset" title="back to the colors this page ships with">Reset</button>
    <button data-act="edit" title="edit the style file these settings produce">Style file&hellip;</button>
    <button data-act="proj" title="an Atlas project file — context drawn over the basemap">Project&hellip;</button>
  </div>
  <div class="ms-raw" data-el="projwrap" hidden>
    <!-- Only shown once a folder has been opened and actually contains some. -->
    <select class="ms-pick" data-el="projpick" hidden></select>
    <textarea class="ms-text" data-el="project" spellcheck="false"
      placeholder="an Atlas project file — view, points, polys, annotations"></textarea>
    <p class="hint" data-el="projmsg"></p>
    <div class="row ms-bar">
      <button data-act="projapply">Apply</button>
      <button data-act="projclear" title="remove the context and leave the basemap">Clear</button>
    </div>
  </div>
  <div class="ms-raw" data-el="raw" hidden>
    <!-- Where the basemap comes from: a hosted style, or one typed below.
         Write {key} where the key goes; the key itself stays in this browser
         and is substituted only when the style is handed to the map. -->
    <input type="text" class="ms-pick" data-el="styleurl" spellcheck="false"
      placeholder="style URL — https://api.maptiler.com/maps/…/style.json?key={key}">
    <input type="password" class="ms-pick" data-el="tilekey" autocomplete="off"
      spellcheck="false" placeholder="tile service key — stays on this machine">
    <textarea class="ms-text" data-el="style" spellcheck="false"
      placeholder="a MapLibre style file — version, sources, layers"></textarea>
    <div class="row ms-bar">
      <button data-act="apply">Apply</button>
      <button data-act="current" title="load the style the map is drawing now">Current</button>
      <button data-act="clear" title="drop the hand-edited file and go back to the settings above">Clear</button>
    </div>
  </div>
</template>

<template id="tpl-timeline">
  <div class="tl-detail" data-el="detail">&nbsp;</div>
  <div class="tl-scale" data-el="scale"></div>
  <div class="tl-lanes" data-el="lanes"></div>
</template>

<template id="tpl-count"><div class="stats" data-el="stats"></div></template>
<template id="tpl-notes"><div class="issues" data-el="issues"></div></template>
<template id="tpl-reference"><div data-el="ref"></div></template>

<script>
"use strict";
/* ==========================================================================
   BRICK BY BRICK
   --------------------------------------------------------------------------
     1. PARSE   text   -> bricks[]                    (forgiving, positionless)
     2. MODEL   bricks -> {entities, edges, stats}    (one object, handed on)
     3. BOARD   a coordinate grid of tiles you place yourself
     4. VIZ     a registry — every visualization is a panel you drop on the board

   A visualization is not a tab or a mode. It is a panel like any other, given a
   footprint on the board, so several can sit side by side reading the same
   model at once. One pile of bricks, many simultaneous readings of it.
   ========================================================================== */

/* --------------------------------------------------------------------------
   1. PARSE
   -------------------------------------------------------------------------- */

const TYPES = {
  person:   { icon: "👤", kind: "person",   label: "person"   },
  birth:    { icon: "👶", kind: "event",    label: "birth"    },
  marriage: { icon: "🔔", kind: "event",    label: "marriage" },
  death:    { icon: "⚰️", kind: "event",    label: "death"    },
  place:    { icon: "📍", kind: "place",    label: "location" },
  document: { icon: "📜", kind: "document", label: "document" },
  census:   { icon: "✏️", kind: "census",   label: "census"   },
};

// Emoji, full word and single letter are all first-class. This table is the
// extension point: add a row and the parser, classifier, counts and every panel
// pick it up with no other edit.
const TOKENS = {
  "👤": "person", person: "person", p: "person",
  "👶": "birth", birth: "birth", b: "birth",
  "🔔": "marriage", marriage: "marriage", m: "marriage",
  "⚰️": "death", death: "death", d: "death",
  "📍": "place", location: "place", place: "place", l: "place",
  "📜": "document", document: "document", doc: "document",
  "✏️": "census", census: "census", c: "census",
};

const RE_DATE = /^\d{4}(-\d{2})?(-\d{2})?$/;
const RE_EST = /~\s*(\d{4})/;
const RE_UNKNOWN = /^\?+$/;
const RE_ALIAS = /<([^<>]*)>/g;

/*  A coordinate pair, as your earlier spec wrote it: "56.463, -2.977".

    Recognized by shape like everything else. It cannot be confused with a
    linkage field (no '@'), a date (no comma) or a source (no dot-slash or
    extension), so it needs no keyword. Latitude first, as every geographic
    convention outside of a few APIs has it. */
const RE_COORDS = /^\s*([-+]?\d{1,2}(?:\.\d+)?)\s*,\s*([-+]?\d{1,3}(?:\.\d+)?)\s*$/;
function readCoords(field) {   // "56.463, -2.977" -> {lat, lng}
  const m = String(field || "").match(RE_COORDS);
  if (!m) return null;
  const lat = Number(m[1]), lng = Number(m[2]);
  // Out-of-range numbers are almost certainly something else that happens to
  // have a comma in it, so they are left as text rather than silently wrong.
  if (!isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
  return { lat, lng };
}

/*  A source reference: the actual scan, photo or page a document brick stands
    for. Recognized by shape like everything else — a URL, a path, or a filename
    with an image/pdf extension — so it can sit in any field position without a
    keyword. Deliberately tight: '377/4/1' (a census reference) must NOT look
    like a path, so a bare slash is not enough. */
const RE_SOURCE = /^(https?:\/\/\S+|data:image\/\S+|\.{0,2}\/\S+|\S+\.(?:jpe?g|png|gif|webp|avif|svgz?|tiff?|pdf))(\?\S*)?$/i;
function looksLikeSource(s) { return RE_SOURCE.test((s || "").trim()); }

// Anything rendered as a link or an <img> passes through here first. A brick
// file can be shared, and a shared file must not be able to run script in the
// reader's page.
function safeSrc(s) {
  const t = (s || "").trim();
  if (!t) return "";
  if (/^\s*(javascript|vbscript|file):/i.test(t)) return "";
  if (/^data:/i.test(t) && !/^data:image\//i.test(t)) return "";
  return t;
}
function isImageSrc(s) {
  return /^data:image\//i.test(s) || /\.(jpe?g|png|gif|webp|avif|svgz?|tiff?)(\?|$)/i.test(s);
}

function normalizeToken(tok) {
  const t = (tok || "").trim();
  return TOKENS[t] || TOKENS[t.toLowerCase()] || null;
}

// '<3><george>' -> {slug:'george', num:3}; a bare number is a disambiguator.
function readAliases(field) {
  const found = []; let m;
  RE_ALIAS.lastIndex = 0;
  while ((m = RE_ALIAS.exec(field)) !== null) found.push(m[1].trim());
  if (!found.length) return null;
  let num = null; const parts = [];
  for (const f of found) { if (/^\d+$/.test(f)) num = Number(f); else parts.push(f); }
  // Canonicalised here, not just in the builder: <George Isles> typed by hand
  // and <george-isles> from the form must be the same uid. Two spellings of one
  // uid is a duplicate uid, which the rules do not allow.
  const slug = slugify(parts.join("-"));
  return slug ? { slug, num } : null;
}

// Handles the real-world quirk: '@george,james,dora-edmed' types '@' once and
// the rest of the comma list inherits it. Requiring '@' per token would
// silently drop siblings.
function readLinks(field) {
  if (!field || field.indexOf("@") === -1) return [];
  // Same canonicalisation as declarations, so @George Isles finds <george-isles>
  // instead of quietly creating a ghost beside it.
  return field.split(",")
    .map(s => slugify(s.trim().replace(/^@/, "").replace(/[<>]/g, "")))
    .filter(Boolean);
}

function looksLikeDate(s) {
  const t = (s || "").trim();
  return RE_DATE.test(t) || RE_UNKNOWN.test(t) || RE_EST.test(t);
}
/*  Type "George Isles" or "Rankie's Court" and get <george-isles> /
    <rankies-court>. The uid is machine-facing — lowercase, hyphenated, no
    punctuation — but nobody should have to type it that way. Apostrophes are
    dropped rather than hyphenated, so "Rankie's" stays one word. */
function slugify(s) {   // "St Clement" -> st-clement; canonical form of every uid
  return String(s).trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/['\u2019]/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");
}

function titleCase(slug) {
  return String(slug).split("-").filter(Boolean)
    .map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
}
function displayFor(a) {
  if (!a) return "";
  return a.num !== null && a.num !== undefined ? titleCase(a.slug) + " (" + a.num + ")" : titleCase(a.slug);
}

/*  Fields are read by SHAPE rather than by fixed position after the leading
    slots. The real corpus is inconsistent — some census rows carry an extra
    pipe, some documents put linkage where the spec puts a description — and a
    notation whose premise is "you define the symbols" cannot then punish the
    author for a stray column. Anything unplaceable becomes a note; the line
    still parses. */
function parseLine(raw, lineNumber, section) {
  const trimmed = raw.trim();
  const brick = {
    lineNumber, raw, section, status: null, type: null, kind: null, icon: "",
    alias: null, name: "", detail: "", src: "", url: "", coords: null, text: [], date: null, estimate: null,
    age: null, links: [], valid: false, notes: [], empty: false, comment: false,
  };

  if (!trimmed) { brick.empty = true; return brick; }

  if (trimmed.startsWith("#")) {
    brick.comment = true; brick.valid = true; brick.kind = "comment";
    brick.icon = "💬"; brick.name = trimmed.replace(/^#+\s*/, "");
    return brick;
  }
  if (trimmed[0] !== "+" && trimmed[0] !== "-") {
    brick.notes.push({ level: "err", msg: "no +/- status prefix" });
    return brick;
  }

  const parts = trimmed.split("|").map(s => s.trim());
  brick.status = parts[0] === "+" ? "verified" : "draft";

  const type = normalizeToken(parts[1]);
  if (!type) {
    brick.notes.push({ level: "err", msg: "unknown type token “" + (parts[1] || "") + "”" });
    brick.icon = "❓";
    return brick;
  }
  brick.type = type; brick.kind = TYPES[type].kind; brick.icon = TYPES[type].icon; brick.valid = true;

  const rest = parts.slice(2);
  let start = 0;

  if (brick.kind === "person" || brick.kind === "place") {
    const a = readAliases(rest[0] || "");
    if (a) { brick.alias = a; start = 1; }
    else brick.notes.push({ level: "warn", msg: TYPES[type].label + " has no <uid>" });
  } else if (brick.kind === "census") {
    // '-|✏️|1891|George|22 1891-22 ~1869' — year, forename, then an age blob
    // that may carry the author's own arithmetic. The working is part of the
    // record, so the blob is kept verbatim too.
    if (looksLikeDate(rest[0])) { brick.date = rest[0]; start = 1; }
    if (rest[start] && !looksLikeDate(rest[start])) { brick.name = rest[start]; start++; }
    // Everything left is the age blob EXCEPT a linkage field. Without this the
    // '@george-isles' on the end got swallowed into the blob and the row
    // attached to nobody — which is the whole point of putting it there.
    const tail = rest.slice(start);
    for (const f of tail) if (f.indexOf("@") !== -1) brick.links.push(...readLinks(f));
    const blob = tail.filter(f => f.indexOf("@") === -1).join(" ");
    const ageM = blob.match(/(?:^|\s)(\d{1,3})(?:\s|$)/);
    if (ageM) brick.age = Number(ageM[1]);
    const estM = blob.match(RE_EST);
    if (estM) brick.estimate = Number(estM[1]);
    // 1841 rounded adult ages down to the nearest five, so a derived year is a
    // range, never a date. Record it as an estimate and say so.
    else if (brick.age !== null && brick.date && RE_DATE.test(brick.date)) {
      brick.estimate = Number(brick.date.slice(0, 4)) - brick.age;
      brick.notes.push({ level: "warn", msg: "birth year " + brick.estimate + " derived from age, not recorded" });
    }
    if (blob) brick.text.push(blob);
    start = rest.length;
  } else if (brick.kind === "document") {
    // A document may name itself, so it can be cited: an unciteable source is
    // no source at all. The alias is checked before the subtype because
    // '<birth-cert-1894>' would otherwise be swallowed as a subtype string.
    const a = readAliases(rest[0] || "");
    if (a) { brick.alias = a; start = 1; }
    if (rest[start] && !looksLikeDate(rest[start]) && rest[start].indexOf("@") === -1) {
      brick.subtype = normalizeToken(rest[start]) || rest[start];
      start++;
    }
  } else if (brick.kind === "event") {
    const a = readAliases(rest[0] || "");
    if (a && !looksLikeDate(rest[0])) { brick.alias = a; start = 1; }
  }

  for (let i = start; i < rest.length; i++) {
    const f = rest[i];
    if (!f) continue;
    if (f.indexOf("@") !== -1) { brick.links.push(...readLinks(f)); continue; }
    if (!brick.coords) { const c = readCoords(f); if (c) { brick.coords = c; continue; } }
    // Checked before the date, since a filename can contain a year.
    // A scan and a citation URL are different things and a brick may carry both:
    // the image is what you look at, the URL is where you got it.
    if (looksLikeSource(f)) {
      if (isImageSrc(f)) { if (!brick.src) { brick.src = f; continue; } }
      else if (!brick.url) { brick.url = f; continue; }
      if (!brick.src) { brick.src = f; continue; }
    }
    if (!brick.date && looksLikeDate(f)) {
      brick.date = f;
      const est = f.match(RE_EST);
      if (est) brick.estimate = Number(est[1]);
      continue;
    }
    brick.text.push(f);
  }

  // Field roles differ by type. For a PERSON the free text is a description or
  // occupation ('Merchant Seaman'), so the name comes from the alias, or George
  // Isles displays as "Powerloom Tender". For a PLACE the free text IS the
  // proper name ('<longforgan>|Longforgan'), so it wins.
  if (!brick.name) {
    if (brick.kind === "person") {
      brick.name = displayFor(brick.alias) || brick.text[0] || "";
      if (brick.text[0]) brick.detail = brick.text[0];
    } else {
      brick.name = brick.text[0] || displayFor(brick.alias) || "";
      if (brick.text[1]) brick.detail = brick.text[1];
    }
  }
  if (brick.kind === "event" && !brick.date) {
    brick.notes.push({ level: "warn", msg: TYPES[type].label + " has no date" });
  }
  return brick;
}

function parse(text) {
  const out = []; let section = "";
  const lines = String(text).split("\n");
  for (let i = 0; i < lines.length; i++) {
    const b = parseLine(lines[i], i + 1, section);
    if (b.comment) section = b.name;   // a '#' heading scopes the bricks beneath it
    out.push(b);
  }
  return out;
}

/* --------------------------------------------------------------------------
   2. MODEL
   -------------------------------------------------------------------------- */

/*  A reference to an alias nobody declared is NOT an error. It becomes a ghost
    entity — in genealogy that is the most interesting object in the pile:
    someone who appears in one record and nowhere else. */
function buildModel(bricks) {
  const entities = new Map(), edges = [], issues = [];

  function touch(slug, patch) {
    if (!slug) return null;
    let e = entities.get(slug);
    if (!e) {
      e = { slug, name: titleCase(slug), kind: "unknown", declared: false,
            status: null, num: null, refs: 0, detail: "", bricks: [] };
      entities.set(slug, e);
    }
    if (patch) Object.assign(e, patch);
    return e;
  }

  for (const b of bricks) {
    if (b.empty || b.comment) continue;
    for (const n of b.notes) issues.push({ line: b.lineNumber, level: n.level, msg: n.msg });
    if (!b.valid) continue;

    // Any brick that names itself becomes a declared entity — including a
    // document or an event, so a claim can point back at the thing that
    // evidences it rather than at a phantom.
    if (b.alias) {
      const existing = entities.get(b.alias.slug);
      /*  A uid is unique by definition — duplicate RECORDS are ordinary and
          expected, duplicate uids are not. So the first declaration wins and
          every later one is an error that changes nothing.

          Letting a later declaration overwrite was silent data loss: declaring
          <james> as a person and then as a place turned the man into a street,
          with only a warning. First-wins means the pile keeps what it had and
          tells you where the clash is. */
      if (existing && existing.declared) {
        issues.push({ line: b.lineNumber, level: "err",
          msg: "<" + b.alias.slug + "> is already declared on line " + existing.declaredAt +
               (existing.kind !== b.kind ? " as a " + existing.kind : "") + " — a uid must be unique" });
        existing.bricks.push(b);
      } else {
        const e = touch(b.alias.slug, {
          kind: b.kind, declared: true, declaredAt: b.lineNumber, status: b.status,
          num: b.alias.num, name: b.name || displayFor(b.alias),
          coords: b.coords || (b.kind === "place" ? GAZETTEER.get(b.alias.slug) || null : null),
          coordsFrom: b.coords ? "brick" : (GAZETTEER.has(b.alias.slug) ? "gazetteer" : null),
        });
        e.bricks.push(b);
        if (b.detail) e.detail = b.detail;
      }
    }

    for (const target of b.links) {
      const e = touch(target);
      e.refs++;
      edges.push({ from: b.alias ? b.alias.slug : null, to: target, kind: b.kind,
                   type: b.type, status: b.status, line: b.lineNumber, date: b.date });
    }
  }

  for (const e of entities.values()) {
    if (!e.declared) {
      issues.push({ line: null, level: "warn",
        msg: "“" + e.name + "” referenced " + e.refs + "× but never declared" });
    }
  }

  const real = bricks.filter(b => !b.empty && !b.comment);
  const byType = {};
  for (const b of real) { const k = b.type || "unparsed"; byType[k] = (byType[k] || 0) + 1; }

  /*  Birth and death years per person, so an age can be worked out anywhere.

      A birth EVENT is a recorded fact and wins. A census estimate ("22 ~1869")
      is arithmetic done on a rounded age and is only ever approximate, so it
      is kept separately and marked — an age derived from it is written "~22"
      and must never be mistaken for one derived from a real date. */
  for (const b of real) {
    if (!b.valid) continue;
    const y = b.date && /^\d{4}/.test(b.date) ? Number(b.date.slice(0, 4)) : null;
    const targets = [];
    if (b.alias && entities.has(b.alias.slug)) targets.push(entities.get(b.alias.slug));
    for (const l of b.links) if (entities.has(l)) targets.push(entities.get(l));

    const people = targets.filter(e => e.kind === "person");
    if (!people.length) continue;

    /*  A birth or a death has ONE subject, and it is the first person named.
        Anyone after them is a parent or a witness: dating every name on the
        line handed a mother her own daughter's birth year. A census is the
        other way round — every person on it was there that night. */
    if ((b.type === "birth" || b.type === "death") && y !== null) {
      const subject = people[0];
      if (b.type === "birth") { subject.birthYear = y; subject.birthExact = true; }
      else { subject.deathYear = y; subject.deathExact = true; }
    } else if (b.kind === "census" && b.estimate !== null && b.estimate !== undefined) {
      // Only fills a gap; never overrides a recorded birth.
      for (const e of people) {
        if (e.birthYear === undefined) { e.birthYear = b.estimate; e.birthExact = false; }
      }
    }
  }

  const ents = [...entities.values()];
  return {
    bricks, records: real, entities: ents, edges, issues, byType,
    sections: [...new Set(bricks.filter(b => b.comment).map(b => b.name))],
    people: ents.filter(e => e.kind === "person"),
    places: ents.filter(e => e.kind === "place"),
    events: real.filter(b => b.kind === "event"),
    documents: real.filter(b => b.kind === "document"),
    census: real.filter(b => b.kind === "census"),
    stats: {
      bricks: real.length,
      verified: real.filter(b => b.status === "verified").length,
      draft: real.filter(b => b.status === "draft").length,
      unparsed: real.filter(b => !b.valid).length,
      entities: ents.length,
      ghosts: ents.filter(e => !e.declared).length,
      links: edges.length,
      dated: real.filter(b => b.date && RE_DATE.test(b.date)).length,
      estimated: real.filter(b => b.estimate !== null).length,
      geocoded: ents.filter(e => e.kind === "place" && e.coords).length,
    },
  };
}

/* --------------------------------------------------------------------------
   2b. VIEW — the filtered subset every panel actually draws
   --------------------------------------------------------------------------
   Sits between MODEL and the panels, so filtering is written once rather than
   re-implemented in each one. A visualization renders `model.view` and inherits
   every filter without knowing filters exist.

   Ghost-ness is deliberately NOT recomputed here: whether an alias was ever
   declared is a fact about the whole pile, not about what you are currently
   looking at. Filtering to one family must not manufacture ghosts.
   -------------------------------------------------------------------------- */
/*  The year a brick sits at, or null if it has none.

    A record's own date wins; a census row falls back to its derived birth year
    (`~1869`), which is the only year some of them carry. "????" is deliberately
    a date that yields no year — the question was asked and not answered, which
    is not the same as the record being undated. */
function brickYear(b) {
  if (b.date) {
    const m = String(b.date).match(/^(\d{4})/);
    if (m) return Number(m[1]);
  }
  return b.estimate !== null && b.estimate !== undefined ? b.estimate : null;
}

// The window the time filter currently describes, as [from, to].
function timeWindow(t) {
  if (!t || !t.on) return null;
  if (t.mode === "decade") return [t.decade, t.decade + 9];
  if (t.mode === "around") return [t.year - t.span, t.year + t.span];
  return [t.min, t.max];
}

/*  A looser year than the filter uses: falls back to scanning the brick's own
    free text and headings for a four-digit year. A note reading "moved to
    Dundee 1893" carries a date even though no date FIELD does, and on a
    timeline that is worth placing. Kept separate from brickYear() so the time
    filter stays strict — silently filtering on a year mentioned in prose would
    be surprising, whereas showing it on a timeline is the point.

    Bounded to plausible record years so a house number or a reference like
    "377/4/1" cannot masquerade as a date. */
/*  An age at a given year, or "" when it cannot be worked out. Prefixed "~"
    whenever the birth year is itself an estimate, and negative results are
    suppressed — a record predating a birth is a data problem, not an age. */
function ageAt(entity, year) {
  if (!entity || year === null || entity.birthYear === undefined) return "";
  const age = year - entity.birthYear;
  if (age < 0 || age > 120) return "";
  return (entity.birthExact ? "" : "~") + age;
}

// "b. 1869 · d. 1931 · ~62" — whatever of it is known.
function lifeSummary(e) {
  if (!e) return "";
  const bits = [];
  if (e.birthYear !== undefined) bits.push("b. " + (e.birthExact ? "" : "~") + e.birthYear);
  if (e.deathYear !== undefined) bits.push("d. " + e.deathYear);
  if (e.birthYear !== undefined && e.deathYear !== undefined) {
    const a = ageAt(e, e.deathYear);
    if (a !== "") bits.push("aged " + a);
  }
  return bits.join(" · ");
}

function timelineYear(b) {
  const strict = brickYear(b);
  if (strict !== null) return { year: strict, loose: false };
  const hay = [b.name, b.detail, ...(b.text || []), b.section].filter(Boolean).join(" ");
  const m = hay.match(/\b(1[0-9]{3}|20[0-2][0-9])\b/);
  return m ? { year: Number(m[1]), loose: true } : null;
}

/*  One lane per person, their dated records in order, plus a lane for dated
    records that name nobody. A record naming several people appears in each of
    their lanes — it genuinely happened to all of them, and dropping it from
    all but one would misrepresent the record. */
function timelineLanes(model) {
  const people = new Map(model.entities.filter(e => e.kind === "person").map(e => [e.slug, e]));
  const lanes = new Map();
  const loose = [];

  for (const b of model.records) {
    const ty = timelineYear(b);
    if (!ty) continue;
    const evt = { year: ty.year, loose: ty.loose, brick: b };
    const named = [];
    if (b.alias && people.has(b.alias.slug)) named.push(b.alias.slug);
    for (const l of b.links) if (people.has(l)) named.push(l);

    if (!named.length) { loose.push(evt); continue; }
    for (const slug of new Set(named)) {
      if (!lanes.has(slug)) lanes.set(slug, { entity: people.get(slug), events: [] });
      lanes.get(slug).events.push(evt);
    }
  }

  const out = [...lanes.values()];
  for (const lane of out) lane.events.sort((a, b2) => a.year - b2.year);
  // Ordered by when each life first appears in the record, so the panel reads
  // top-to-bottom as the research does.
  out.sort((a, b2) => a.events[0].year - b2.events[0].year);
  if (loose.length) {
    loose.sort((a, b2) => a.year - b2.year);
    out.push({ entity: null, events: loose });
  }
  return out;
}

/*  KINSHIP — derived, never stored.
    --------------------------------------------------------------------------
    There is no family record in this notation and there should not be one. A
    family is a filing convenience: it asserts a household, a marriage and a
    surname that the evidence may not support. People and events say only what
    was recorded, so parenthood is read back off the events themselves.

      +|👶|1893-02-11|@alice,@george-isles,@margaret-kinnear
                       child    parent        parent

    The person born is named FIRST and their parents follow. That is the whole
    convention, and it is the only place the pile ever says whose child anyone
    is. A marriage names partners in no particular order.

    Ghosts are kin too. A woman who appears once as a mother and never again is
    exactly the person a tree exists to show, so an undeclared uid is drawn
    dashed rather than dropped. The cost is that an undeclared PLACE on a birth
    line is indistinguishable from an undeclared person; declaring your places
    is the cure. */
function kinGraph(model) {
  const ent = new Map(model.entities.map(e => [e.slug, e]));
  const isPerson = s => {
    const e = ent.get(s);
    return !!e && (e.kind === "person" || (!e.declared && e.kind === "unknown"));
  };

  const parents = new Map(), children = new Map(), partners = new Map();
  /*  The same pair can be named by two records of different confidence — a
      draft census and a verified certificate. Verified wins, so a line is only
      drawn dashed while nothing solid says the same thing. */
  const add = (m, a, b, status) => {
    if (!m.has(a)) m.set(a, new Map());
    if (m.get(a).get(b) !== "verified") m.get(a).set(b, status);
  };

  for (const b of model.records) {
    if (!b.valid) continue;
    const who = b.links.filter(isPerson);
    if (b.type === "birth" && who.length > 1) {
      const child = who[0];
      for (const p of who.slice(1)) {
        if (p === child) continue;
        add(parents, child, p, b.status);
        add(children, p, child, b.status);
      }
    } else if (b.type === "marriage") {
      for (const a of who) for (const c of who) if (a !== c) add(partners, a, c, b.status);
    }
  }

  const has = s => parents.has(s) || children.has(s) || partners.has(s);
  const degree = s => (parents.get(s) || EMPTY_KIN).size +
                      (children.get(s) || EMPTY_KIN).size +
                      (partners.get(s) || EMPTY_KIN).size;
  const people = [...new Set([...parents.keys(), ...children.keys(), ...partners.keys()])];
  return { ent, parents, children, partners, has, degree, people };
}
const EMPTY_KIN = new Map();

/*  Generation and reading order in one walk. Depth is relative to whoever the
    drawing is rooted on: a parent is one above, a child one below, a partner
    level with you. The first depth reached wins, so a cousin marriage cannot
    drag a whole branch up a row later on.

    Partners are visited before children so a couple ends up side by side. */
function treeWalk(g, root) {
  const gen = new Map([[root, 0]]), order = [], seen = new Set();
  (function visit(s) {
    if (seen.has(s)) return;
    seen.add(s); order.push(s);
    const at = gen.get(s);
    const step = (m, d) => {
      for (const t of (m.get(s) || EMPTY_KIN).keys()) {
        if (!gen.has(t)) gen.set(t, at + d);
        visit(t);
      }
    };
    step(g.partners, 0);
    step(g.children, 1);
    step(g.parents, -1);
  })(root);
  return { gen, order };
}

function brickPasses(b, f) {
  if (f.sections.size && !f.sections.has(b.section || "")) return false;
  if (b.comment) return true;                       // headings give the list its shape
  if (f.status !== "all" && b.status !== f.status) return false;
  if (f.types.size && !f.types.has(b.type)) return false;
  if (f.focus) {
    const mine = (b.alias && b.alias.slug === f.focus) || b.links.includes(f.focus);
    if (!mine) return false;
  }
  if (f.text) {
    const q = f.text.toLowerCase();
    if (!b.raw.toLowerCase().includes(q) && !(b.name || "").toLowerCase().includes(q)) return false;
  }
  /*  Time filters only what HAS a time. A place, a person, an undated record
      is not "outside the window" — it has no position on the axis at all, and
      hiding it would empty the map every time you touched the slider. */
  const win = timeWindow(f.time);
  if (win) {
    const y = brickYear(b);
    if (y !== null && (y < win[0] || y > win[1])) return false;
  }
  return true;
}

function buildView(model) {
  const f = state.filter;
  const bricks = model.bricks.filter(b => b.empty ? false : brickPasses(b, f));
  const records = bricks.filter(b => !b.comment);

  // Entities present in what survived — reusing the objects from the full model
  // so `declared` and `refs` keep their whole-pile meaning.
  const slugs = new Set();
  for (const b of records) {
    if (b.alias) slugs.add(b.alias.slug);
    for (const l of b.links) slugs.add(l);
  }
  const entities = model.entities.filter(e => slugs.has(e.slug));
  const lines = new Set(records.map(b => b.lineNumber));

  return {
    active: filterIsActive(),
    bricks, records, entities,
    edges: model.edges.filter(e => lines.has(e.line)),
    people: entities.filter(e => e.kind === "person"),
    places: entities.filter(e => e.kind === "place"),
    events: records.filter(b => b.kind === "event"),
    documents: records.filter(b => b.kind === "document"),
    census: records.filter(b => b.kind === "census"),
    sections: [...new Set(bricks.filter(b => b.comment).map(b => b.name))],
    all: model,                                     // the unfiltered pile, if a panel needs it
    stats: {
      bricks: records.length,
      verified: records.filter(b => b.status === "verified").length,
      draft: records.filter(b => b.status === "draft").length,
      unparsed: records.filter(b => !b.valid).length,
      entities: entities.length,
      ghosts: entities.filter(e => !e.declared).length,
      links: records.reduce((n, b) => n + b.links.length, 0),
      dated: records.filter(b => b.date && RE_DATE.test(b.date)).length,
      estimated: records.filter(b => b.estimate !== null).length,
      geocoded: entities.filter(e => e.kind === "place" && e.coords).length,
    },
  };
}

/*  HOW HIGH EACH SIGN HANGS, once you have said.

    Every sign — a place's post, a group's ribbon — sits at a height the code
    chose. That height is a guess about a scene it has not seen: a building
    drawn tall puts its roof through the ribbon above it, and a short one
    leaves the name marooned in empty sky. The person who can see the scene is
    you.

    So a sign can be dragged up and down and it stays where you put it. Kept by
    slug, in world units rather than screen pixels, so it means the same thing
    at any zoom and at any panel size. */
/*  WHERE A PLACE'S NAME OPENS, in world units from the ground line, down
    positive. Just under the street, and far enough under it to clear a
    walker's own caption: a brickling's name hangs 4 below its feet and stands

    It was -38 once, a board up on a post at roof height. That works for a bare

const SIGN_BOARD_Y = 16;

/*  AN OFFSET IS MEASURED FROM SOMEWHERE, AND THE SOMEWHERE KEEPS MOVING.

    These are offsets from where a sign opens, so they only mean anything
    alongside the opening position they were written against. That position has
    now moved twice, and each time every stored number silently came to mean a
    different place while looking untouched. A saved position is a decision
    somebody made with the scene in front of them; moving the origin under it
    undoes the decision while appearing to honour it.

    So the file records the base it was written against and the loader shifts
    by the difference. Move SIGN_BOARD_Y again and every dragged sign stays
    exactly where its owner put it, with no new key and nothing to remember.
    The older files had no such record, so their bases are listed here. */

  if (raw && typeof raw === "object") {
    if (typeof raw.__base === "number" && isFinite(raw.__base)) base = raw.__base;
  } else {
    raw = null;
    for (const [key, b] of SIGNY_OLD) {
      let old = null;
      try { old = JSON.parse(localStorage.getItem(key) || "null"); } catch (e) { old = null; }
      if (old && typeof old === "object") { raw = old; base = b; break; }
    }

  if (!raw) return;
  //  An offset written against `base` names the spot base + off. Keep the spot.
  const shift = base - SIGN_BOARD_Y;

loadSignY();
const ARTKEY = "brick-by-brick:art:v1";                   // drawings kept in the browser
/*  THE PARTS TRAY.

    door, a chimney, a course of stone — and drawing the fourth window of a
    terrace by hand is work the machine should be doing. The copy tool already
    lifts a rectangle and stamps it down; the only thing it could not do was
    remember one, so lifting a second window meant losing the first.

    A part is exactly that lift, kept: a small PNG and a name. Nothing about
    stamping changes — a part reaching the clipboard is indistinguishable from
    a box you dragged a moment ago, which is why it inherits the preview, the
    edge clamping, the undo and the frame handling without any of it being
    written twice.

    same reason: these are working materials, not files anybody committed. A

  try {

    localStorage.setItem(PARTS_KEY, JSON.stringify(Object.fromEntries(PARTS)));
