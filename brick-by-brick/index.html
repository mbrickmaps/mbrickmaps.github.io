<script>
"use strict";
/* ==========================================================================
   BRICK BY BRICK
   --------------------------------------------------------------------------
     1. PARSE   text   -> bricks[]                    (forgiving, positionless)
     2. MODEL   bricks -> {entities, edges, stats}    (one object, handed on)
     3. BOARD   a coordinate grid of tiles you place yourself
     4. VIZ     a registry — every visualization is a panel you drop on the board

   A visualization is not a tab or a mode. It is a panel like any other, given a
   footprint on the board, so several can sit side by side reading the same
   model at once. One pile of bricks, many simultaneous readings of it.
   ========================================================================== */

/* --------------------------------------------------------------------------
   1. PARSE
   -------------------------------------------------------------------------- */

const TYPES = {
  person:   { icon: "👤", kind: "person",   label: "person"   },
  birth:    { icon: "👶", kind: "event",    label: "birth"    },
  marriage: { icon: "🔔", kind: "event",    label: "marriage" },
  death:    { icon: "⚰️", kind: "event",    label: "death"    },
  place:    { icon: "📍", kind: "place",    label: "location" },
  document: { icon: "📜", kind: "document", label: "document" },
  census:   { icon: "✏️", kind: "census",   label: "census"   },
};

// Emoji, full word and single letter are all first-class. This table is the
// extension point: add a row and the parser, classifier, counts and every panel
// pick it up with no other edit.
const TOKENS = {
  "👤": "person", person: "person", p: "person",
  "👶": "birth", birth: "birth", b: "birth",
  "🔔": "marriage", marriage: "marriage", m: "marriage",
  "⚰️": "death", death: "death", d: "death",
  "📍": "place", location: "place", place: "place", l: "place",
  "📜": "document", document: "document", doc: "document",
  "✏️": "census", census: "census", c: "census",
};

const RE_DATE = /^\d{4}(-\d{2})?(-\d{2})?$/;
const RE_EST = /~\s*(\d{4})/;
const RE_UNKNOWN = /^\?+$/;
const RE_ALIAS = /<([^<>]*)>/g;

/*  A coordinate pair, as your earlier spec wrote it: "56.463, -2.977".

    Recognized by shape like everything else. It cannot be confused with a
    linkage field (no '@'), a date (no comma) or a source (no dot-slash or
    extension), so it needs no keyword. Latitude first, as every geographic
    convention outside of a few APIs has it. */
const RE_COORDS = /^\s*([-+]?\d{1,2}(?:\.\d+)?)\s*,\s*([-+]?\d{1,3}(?:\.\d+)?)\s*$/;
function readCoords(field) {   // "56.463, -2.977" -> {lat, lng}
  const m = String(field || "").match(RE_COORDS);
  if (!m) return null;
  const lat = Number(m[1]), lng = Number(m[2]);
  // Out-of-range numbers are almost certainly something else that happens to
  // have a comma in it, so they are left as text rather than silently wrong.
  if (!isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
  return { lat, lng };
}

/*  A source reference: the actual scan, photo or page a document brick stands
    for. Recognized by shape like everything else — a URL, a path, or a filename
    with an image/pdf extension — so it can sit in any field position without a
    keyword. Deliberately tight: '377/4/1' (a census reference) must NOT look
    like a path, so a bare slash is not enough. */
const RE_SOURCE = /^(https?:\/\/\S+|data:image\/\S+|\.{0,2}\/\S+|\S+\.(?:jpe?g|png|gif|webp|avif|svgz?|tiff?|pdf))(\?\S*)?$/i;
function looksLikeSource(s) { return RE_SOURCE.test((s || "").trim()); }

// Anything rendered as a link or an <img> passes through here first. A brick
// file can be shared, and a shared file must not be able to run script in the
// reader's page.
function safeSrc(s) {
  const t = (s || "").trim();
  if (!t) return "";
  if (/^\s*(javascript|vbscript|file):/i.test(t)) return "";
  if (/^data:/i.test(t) && !/^data:image\//i.test(t)) return "";
  return t;
}
function isImageSrc(s) {
  return /^data:image\//i.test(s) || /\.(jpe?g|png|gif|webp|avif|svgz?|tiff?)(\?|$)/i.test(s);
}

function normalizeToken(tok) {
  const t = (tok || "").trim();
  return TOKENS[t] || TOKENS[t.toLowerCase()] || null;
}

// '<3><george>' -> {slug:'george', num:3}; a bare number is a disambiguator.
function readAliases(field) {
  const found = []; let m;
  RE_ALIAS.lastIndex = 0;
  while ((m = RE_ALIAS.exec(field)) !== null) found.push(m[1].trim());
  if (!found.length) return null;
  let num = null; const parts = [];
  for (const f of found) { if (/^\d+$/.test(f)) num = Number(f); else parts.push(f); }
  // Canonicalised here, not just in the builder: <George Isles> typed by hand
  // and <george-isles> from the form must be the same uid. Two spellings of one
  // uid is a duplicate uid, which the rules do not allow.
  const slug = slugify(parts.join("-"));
  return slug ? { slug, num } : null;
}

// Handles the real-world quirk: '@george,james,dora-edmed' types '@' once and
// the rest of the comma list inherits it. Requiring '@' per token would
// silently drop siblings.
function readLinks(field) {
  if (!field || field.indexOf("@") === -1) return [];
  // Same canonicalisation as declarations, so @George Isles finds <george-isles>
  // instead of quietly creating a ghost beside it.
  return field.split(",")
    .map(s => slugify(s.trim().replace(/^@/, "").replace(/[<>]/g, "")))
    .filter(Boolean);
}

function looksLikeDate(s) {
  const t = (s || "").trim();
  return RE_DATE.test(t) || RE_UNKNOWN.test(t) || RE_EST.test(t);
}
/*  Type "George Isles" or "Rankie's Court" and get <george-isles> /
    <rankies-court>. The uid is machine-facing — lowercase, hyphenated, no
    punctuation — but nobody should have to type it that way. Apostrophes are
    dropped rather than hyphenated, so "Rankie's" stays one word. */
function slugify(s) {   // "St Clement" -> st-clement; canonical form of every uid
  return String(s).trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/['\u2019]/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");
}

function titleCase(slug) {
  return String(slug).split("-").filter(Boolean)
    .map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
}
function displayFor(a) {
  if (!a) return "";
  return a.num !== null && a.num !== undefined ? titleCase(a.slug) + " (" + a.num + ")" : titleCase(a.slug);
}

/*  Fields are read by SHAPE rather than by fixed position after the leading
    slots. The real corpus is inconsistent — some census rows carry an extra
    pipe, some documents put linkage where the spec puts a description — and a
    notation whose premise is "you define the symbols" cannot then punish the
    author for a stray column. Anything unplaceable becomes a note; the line
    still parses. */
function parseLine(raw, lineNumber, section) {
  const trimmed = raw.trim();
  const brick = {
    lineNumber, raw, section, status: null, type: null, kind: null, icon: "",
    alias: null, name: "", detail: "", src: "", url: "", coords: null, text: [], date: null, estimate: null,
    age: null, links: [], valid: false, notes: [], empty: false, comment: false,
  };

  if (!trimmed) { brick.empty = true; return brick; }

  if (trimmed.startsWith("#")) {
    brick.comment = true; brick.valid = true; brick.kind = "comment";
    brick.icon = "💬"; brick.name = trimmed.replace(/^#+\s*/, "");
    return brick;
  }
  if (trimmed[0] !== "+" && trimmed[0] !== "-") {
    brick.notes.push({ level: "err", msg: "no +/- status prefix" });
    return brick;
  }

  const parts = trimmed.split("|").map(s => s.trim());
  brick.status = parts[0] === "+" ? "verified" : "draft";

  const type = normalizeToken(parts[1]);
  if (!type) {
    brick.notes.push({ level: "err", msg: "unknown type token “" + (parts[1] || "") + "”" });
    brick.icon = "❓";
    return brick;
  }
  brick.type = type; brick.kind = TYPES[type].kind; brick.icon = TYPES[type].icon; brick.valid = true;

  const rest = parts.slice(2);
  let start = 0;

  if (brick.kind === "person" || brick.kind === "place") {
    const a = readAliases(rest[0] || "");
    if (a) { brick.alias = a; start = 1; }
    else brick.notes.push({ level: "warn", msg: TYPES[type].label + " has no <uid>" });
  } else if (brick.kind === "census") {
    // '-|✏️|1891|George|22 1891-22 ~1869' — year, forename, then an age blob
    // that may carry the author's own arithmetic. The working is part of the
    // record, so the blob is kept verbatim too.
    if (looksLikeDate(rest[0])) { brick.date = rest[0]; start = 1; }
    if (rest[start] && !looksLikeDate(rest[start])) { brick.name = rest[start]; start++; }
    // Everything left is the age blob EXCEPT a linkage field. Without this the
    // '@george-isles' on the end got swallowed into the blob and the row
    // attached to nobody — which is the whole point of putting it there.
    const tail = rest.slice(start);
    for (const f of tail) if (f.indexOf("@") !== -1) brick.links.push(...readLinks(f));
    const blob = tail.filter(f => f.indexOf("@") === -1).join(" ");
    const ageM = blob.match(/(?:^|\s)(\d{1,3})(?:\s|$)/);
    if (ageM) brick.age = Number(ageM[1]);
    const estM = blob.match(RE_EST);
    if (estM) brick.estimate = Number(estM[1]);
    // 1841 rounded adult ages down to the nearest five, so a derived year is a
    // range, never a date. Record it as an estimate and say so.
    else if (brick.age !== null && brick.date && RE_DATE.test(brick.date)) {
      brick.estimate = Number(brick.date.slice(0, 4)) - brick.age;
      brick.notes.push({ level: "warn", msg: "birth year " + brick.estimate + " derived from age, not recorded" });
    }
    if (blob) brick.text.push(blob);
    start = rest.length;
  } else if (brick.kind === "document") {
    // A document may name itself, so it can be cited: an unciteable source is
    // no source at all. The alias is checked before the subtype because
    // '<birth-cert-1894>' would otherwise be swallowed as a subtype string.
    const a = readAliases(rest[0] || "");
    if (a) { brick.alias = a; start = 1; }
    if (rest[start] && !looksLikeDate(rest[start]) && rest[start].indexOf("@") === -1) {
      brick.subtype = normalizeToken(rest[start]) || rest[start];
      start++;
    }
  } else if (brick.kind === "event") {
    const a = readAliases(rest[0] || "");
    if (a && !looksLikeDate(rest[0])) { brick.alias = a; start = 1; }
  }

  for (let i = start; i < rest.length; i++) {
    const f = rest[i];
    if (!f) continue;
    if (f.indexOf("@") !== -1) { brick.links.push(...readLinks(f)); continue; }
    if (!brick.coords) { const c = readCoords(f); if (c) { brick.coords = c; continue; } }
    // Checked before the date, since a filename can contain a year.
    // A scan and a citation URL are different things and a brick may carry both:
    // the image is what you look at, the URL is where you got it.
    if (looksLikeSource(f)) {
      if (isImageSrc(f)) { if (!brick.src) { brick.src = f; continue; } }
      else if (!brick.url) { brick.url = f; continue; }
      if (!brick.src) { brick.src = f; continue; }
    }
    if (!brick.date && looksLikeDate(f)) {
      brick.date = f;
      const est = f.match(RE_EST);
      if (est) brick.estimate = Number(est[1]);
      continue;
    }
    brick.text.push(f);
  }

  // Field roles differ by type. For a PERSON the free text is a description or
  // occupation ('Merchant Seaman'), so the name comes from the alias, or George
  // Isles displays as "Powerloom Tender". For a PLACE the free text IS the
  // proper name ('<longforgan>|Longforgan'), so it wins.
  if (!brick.name) {
    if (brick.kind === "person") {
      brick.name = displayFor(brick.alias) || brick.text[0] || "";
      if (brick.text[0]) brick.detail = brick.text[0];
    } else {
      brick.name = brick.text[0] || displayFor(brick.alias) || "";
      if (brick.text[1]) brick.detail = brick.text[1];
    }
  }
  if (brick.kind === "event" && !brick.date) {
    brick.notes.push({ level: "warn", msg: TYPES[type].label + " has no date" });
  }
  return brick;
}

function parse(text) {
  const out = []; let section = "";
  const lines = String(text).split("\n");
  for (let i = 0; i < lines.length; i++) {
    const b = parseLine(lines[i], i + 1, section);
    if (b.comment) section = b.name;   // a '#' heading scopes the bricks beneath it
    out.push(b);
  }
  return out;
}

/* --------------------------------------------------------------------------
   2. MODEL
   -------------------------------------------------------------------------- */

/*  A reference to an alias nobody declared is NOT an error. It becomes a ghost
    entity — in genealogy that is the most interesting object in the pile:
    someone who appears in one record and nowhere else. */
function buildModel(bricks) {
  const entities = new Map(), edges = [], issues = [];

  function touch(slug, patch) {
    if (!slug) return null;
    let e = entities.get(slug);
    if (!e) {
      e = { slug, name: titleCase(slug), kind: "unknown", declared: false,
            status: null, num: null, refs: 0, detail: "", bricks: [] };
      entities.set(slug, e);
    }
    if (patch) Object.assign(e, patch);
    return e;
  }

  for (const b of bricks) {
    if (b.empty || b.comment) continue;
    for (const n of b.notes) issues.push({ line: b.lineNumber, level: n.level, msg: n.msg });
    if (!b.valid) continue;

    // Any brick that names itself becomes a declared entity — including a
    // document or an event, so a claim can point back at the thing that
    // evidences it rather than at a phantom.
    if (b.alias) {
      const existing = entities.get(b.alias.slug);
      /*  A uid is unique by definition — duplicate RECORDS are ordinary and
          expected, duplicate uids are not. So the first declaration wins and
          every later one is an error that changes nothing.

          Letting a later declaration overwrite was silent data loss: declaring
          <james> as a person and then as a place turned the man into a street,
          with only a warning. First-wins means the pile keeps what it had and
          tells you where the clash is. */
      if (existing && existing.declared) {
        issues.push({ line: b.lineNumber, level: "err",
          msg: "<" + b.alias.slug + "> is already declared on line " + existing.declaredAt +
               (existing.kind !== b.kind ? " as a " + existing.kind : "") + " — a uid must be unique" });
        existing.bricks.push(b);
      } else {
        const e = touch(b.alias.slug, {
          kind: b.kind, declared: true, declaredAt: b.lineNumber, status: b.status,
          num: b.alias.num, name: b.name || displayFor(b.alias),
          coords: b.coords || (b.kind === "place" ? GAZETTEER.get(b.alias.slug) || null : null),
          coordsFrom: b.coords ? "brick" : (GAZETTEER.has(b.alias.slug) ? "gazetteer" : null),
        });
        e.bricks.push(b);
        if (b.detail) e.detail = b.detail;
      }
    }

    for (const target of b.links) {
      const e = touch(target);
      e.refs++;
      edges.push({ from: b.alias ? b.alias.slug : null, to: target, kind: b.kind,
                   type: b.type, status: b.status, line: b.lineNumber, date: b.date });
    }
  }

  for (const e of entities.values()) {
    if (!e.declared) {
      issues.push({ line: null, level: "warn",
        msg: "“" + e.name + "” referenced " + e.refs + "× but never declared" });
    }
  }

  const real = bricks.filter(b => !b.empty && !b.comment);
  const byType = {};
  for (const b of real) { const k = b.type || "unparsed"; byType[k] = (byType[k] || 0) + 1; }

  /*  Birth and death years per person, so an age can be worked out anywhere.

      A birth EVENT is a recorded fact and wins. A census estimate ("22 ~1869")
      is arithmetic done on a rounded age and is only ever approximate, so it
      is kept separately and marked — an age derived from it is written "~22"
      and must never be mistaken for one derived from a real date. */
  for (const b of real) {
    if (!b.valid) continue;
    const y = b.date && /^\d{4}/.test(b.date) ? Number(b.date.slice(0, 4)) : null;
    const targets = [];
    if (b.alias && entities.has(b.alias.slug)) targets.push(entities.get(b.alias.slug));
    for (const l of b.links) if (entities.has(l)) targets.push(entities.get(l));

    for (const e of targets) {
      if (e.kind !== "person") continue;
      if (b.type === "birth" && y !== null) { e.birthYear = y; e.birthExact = true; }
      else if (b.type === "death" && y !== null) { e.deathYear = y; e.deathExact = true; }
      else if (b.kind === "census" && b.estimate !== null && b.estimate !== undefined) {
        // Only fills a gap; never overrides a recorded birth.
        if (e.birthYear === undefined) { e.birthYear = b.estimate; e.birthExact = false; }
      }
    }
  }

  const ents = [...entities.values()];
  return {
    bricks, records: real, entities: ents, edges, issues, byType,
    sections: [...new Set(bricks.filter(b => b.comment).map(b => b.name))],
    people: ents.filter(e => e.kind === "person"),
    places: ents.filter(e => e.kind === "place"),
    events: real.filter(b => b.kind === "event"),
    documents: real.filter(b => b.kind === "document"),
    census: real.filter(b => b.kind === "census"),
    stats: {
      bricks: real.length,
      verified: real.filter(b => b.status === "verified").length,
      draft: real.filter(b => b.status === "draft").length,
      unparsed: real.filter(b => !b.valid).length,
      entities: ents.length,
      ghosts: ents.filter(e => !e.declared).length,
      links: edges.length,
      dated: real.filter(b => b.date && RE_DATE.test(b.date)).length,
      estimated: real.filter(b => b.estimate !== null).length,
      geocoded: ents.filter(e => e.kind === "place" && e.coords).length,
    },
  };
}

/* --------------------------------------------------------------------------
   2b. VIEW — the filtered subset every panel actually draws
   --------------------------------------------------------------------------
   Sits between MODEL and the panels, so filtering is written once rather than
   re-implemented in each one. A visualization renders `model.view` and inherits
   every filter without knowing filters exist.

   Ghost-ness is deliberately NOT recomputed here: whether an alias was ever
   declared is a fact about the whole pile, not about what you are currently
   looking at. Filtering to one family must not manufacture ghosts.
   -------------------------------------------------------------------------- */
/*  The year a brick sits at, or null if it has none.

    A record's own date wins; a census row falls back to its derived birth year
    (`~1869`), which is the only year some of them carry. "????" is deliberately
    a date that yields no year — the question was asked and not answered, which
    is not the same as the record being undated. */
function brickYear(b) {
  if (b.date) {
    const m = String(b.date).match(/^(\d{4})/);
    if (m) return Number(m[1]);
  }
  return b.estimate !== null && b.estimate !== undefined ? b.estimate : null;
}

// The window the time filter currently describes, as [from, to].
function timeWindow(t) {
  if (!t || !t.on) return null;
  if (t.mode === "decade") return [t.decade, t.decade + 9];
  if (t.mode === "around") return [t.year - t.span, t.year + t.span];
  return [t.min, t.max];
}

/*  A looser year than the filter uses: falls back to scanning the brick's own
    free text and headings for a four-digit year. A note reading "moved to
    Dundee 1893" carries a date even though no date FIELD does, and on a
    timeline that is worth placing. Kept separate from brickYear() so the time
    filter stays strict — silently filtering on a year mentioned in prose would
    be surprising, whereas showing it on a timeline is the point.

    Bounded to plausible record years so a house number or a reference like
    "377/4/1" cannot masquerade as a date. */
/*  An age at a given year, or "" when it cannot be worked out. Prefixed "~"
    whenever the birth year is itself an estimate, and negative results are
    suppressed — a record predating a birth is a data problem, not an age. */
function ageAt(entity, year) {
  if (!entity || year === null || entity.birthYear === undefined) return "";
  const age = year - entity.birthYear;
  if (age < 0 || age > 120) return "";
  return (entity.birthExact ? "" : "~") + age;
}

// "b. 1869 · d. 1931 · ~62" — whatever of it is known.
function lifeSummary(e) {
  if (!e) return "";
  const bits = [];
  if (e.birthYear !== undefined) bits.push("b. " + (e.birthExact ? "" : "~") + e.birthYear);
  if (e.deathYear !== undefined) bits.push("d. " + e.deathYear);
  if (e.birthYear !== undefined && e.deathYear !== undefined) {
    const a = ageAt(e, e.deathYear);
    if (a !== "") bits.push("aged " + a);
  }
  return bits.join(" · ");
}

function timelineYear(b) {
  const strict = brickYear(b);
  if (strict !== null) return { year: strict, loose: false };
  const hay = [b.name, b.detail, ...(b.text || []), b.section].filter(Boolean).join(" ");
  const m = hay.match(/\b(1[0-9]{3}|20[0-2][0-9])\b/);
  return m ? { year: Number(m[1]), loose: true } : null;
}

/*  One lane per person, their dated records in order, plus a lane for dated
    records that name nobody. A record naming several people appears in each of
    their lanes — it genuinely happened to all of them, and dropping it from
    all but one would misrepresent the record. */
function timelineLanes(model) {
  const people = new Map(model.entities.filter(e => e.kind === "person").map(e => [e.slug, e]));
  const lanes = new Map();
  const loose = [];

  for (const b of model.records) {
    const ty = timelineYear(b);
    if (!ty) continue;
    const evt = { year: ty.year, loose: ty.loose, brick: b };
    const named = [];
    if (b.alias && people.has(b.alias.slug)) named.push(b.alias.slug);
    for (const l of b.links) if (people.has(l)) named.push(l);

    if (!named.length) { loose.push(evt); continue; }
    for (const slug of new Set(named)) {
      if (!lanes.has(slug)) lanes.set(slug, { entity: people.get(slug), events: [] });
      lanes.get(slug).events.push(evt);
    }
  }

  const out = [...lanes.values()];
  for (const lane of out) lane.events.sort((a, b2) => a.year - b2.year);
  // Ordered by when each life first appears in the record, so the panel reads
  // top-to-bottom as the research does.
  out.sort((a, b2) => a.events[0].year - b2.events[0].year);
  if (loose.length) {
    loose.sort((a, b2) => a.year - b2.year);
    out.push({ entity: null, events: loose });
  }
  return out;
}

function brickPasses(b, f) {
  if (f.sections.size && !f.sections.has(b.section || "")) return false;
  if (b.comment) return true;                       // headings give the list its shape
  if (f.status !== "all" && b.status !== f.status) return false;
  if (f.types.size && !f.types.has(b.type)) return false;
  if (f.focus) {
    const mine = (b.alias && b.alias.slug === f.focus) || b.links.includes(f.focus);
    if (!mine) return false;
  }
  if (f.text) {
    const q = f.text.toLowerCase();
    if (!b.raw.toLowerCase().includes(q) && !(b.name || "").toLowerCase().includes(q)) return false;
  }
  /*  Time filters only what HAS a time. A place, a person, an undated record
      is not "outside the window" — it has no position on the axis at all, and
      hiding it would empty the map every time you touched the slider. */
  const win = timeWindow(f.time);
  if (win) {
    const y = brickYear(b);
    if (y !== null && (y < win[0] || y > win[1])) return false;
  }
  return true;
}

function buildView(model) {
  const f = state.filter;
  const bricks = model.bricks.filter(b => b.empty ? false : brickPasses(b, f));
  const records = bricks.filter(b => !b.comment);

  // Entities present in what survived — reusing the objects from the full model
  // so `declared` and `refs` keep their whole-pile meaning.
  const slugs = new Set();
  for (const b of records) {
    if (b.alias) slugs.add(b.alias.slug);
    for (const l of b.links) slugs.add(l);
  }
  const entities = model.entities.filter(e => slugs.has(e.slug));
  const lines = new Set(records.map(b => b.lineNumber));

  return {
    active: filterIsActive(),
    bricks, records, entities,
    edges: model.edges.filter(e => lines.has(e.line)),
    people: entities.filter(e => e.kind === "person"),
    places: entities.filter(e => e.kind === "place"),
    events: records.filter(b => b.kind === "event"),
    documents: records.filter(b => b.kind === "document"),
    census: records.filter(b => b.kind === "census"),
    sections: [...new Set(bricks.filter(b => b.comment).map(b => b.name))],
    all: model,                                     // the unfiltered pile, if a panel needs it
    stats: {
      bricks: records.length,
      verified: records.filter(b => b.status === "verified").length,
      draft: records.filter(b => b.status === "draft").length,
      unparsed: records.filter(b => !b.valid).length,
      entities: entities.length,
      ghosts: entities.filter(e => !e.declared).length,
      links: records.reduce((n, b) => n + b.links.length, 0),
      dated: records.filter(b => b.date && RE_DATE.test(b.date)).length,
      estimated: records.filter(b => b.estimate !== null).length,
      geocoded: entities.filter(e => e.kind === "place" && e.coords).length,
    },
  };
}

// Every panel draws this. Falls back to the whole pile before the first parse.
function V() { return (state.model && state.model.view) || state.model; }

/* --------------------------------------------------------------------------
   SHARED STATE — declared before the registry, because registering a panel
   touches it and the boot-time registrations run before the view section.
   -------------------------------------------------------------------------- */
const TEXT_KEY = "brick-by-brick:text:v1";
const AUTOSAVE_KEY = "brick-by-brick:autosave:v1";
const BOARD_KEY = "brick-by-brick:board:v2";
const FOOTPRINT_KEY = "brick-by-brick:footprints:v2";
const GAZETTEER_KEY = "brick-by-brick:gazetteer:v1";
const MAPSOURCE_KEY = "brick-by-brick:mapsource:v1";
const THEME_KEY = "brick-by-brick:theme:v1";     // the one in use
const THEMES_KEY = "brick-by-brick:themes:v1";   // the ones you saved
const MAPPROJECT_KEY = "brick-by-brick:mapproject:v1";    // an Atlas project file
const TILEKEY_KEY = "brick-by-brick:tilekey:v1";          // MapTiler & friends
const STYLEURL_KEY = "brick-by-brick:styleurl:v1";        // a hosted basemap style
const MESOURCE_KEY = "brick-by-brick:mesource:v1";        // what the editor traces against
const MEURL_KEY = "brick-by-brick:meurl:v1";              // a style URL pasted into the editor
const COLTINT_KEY = "brick-by-brick:columntint:v1";       // per-place column gradients
const PINNED_KEY = "brick-by-brick:promenade-pins:v1";    // who you put in which column
const GROUPS_KEY = "brick-by-brick:promenade-groups:v1";  // columns you invented
const MAPSTYLE_KEY = "brick-by-brick:mapstyle:v1";        // the settings
const MAPOVERRIDE_KEY = "brick-by-brick:mapstyle-raw:v1"; // a hand-edited style file
const IGNORED_KEY = "brick-by-brick:ignored:v1";          // site files told not to come back
const SCENEBG_KEY = "brick-by-brick:promenade-bg:v1";     // the street's own sky and ground
const ARTKEY = "brick-by-brick:art:v1";                   // drawings kept in the browser
const RIBBON_KEY = "brick-by-brick:ribbons:v1";           // what color each ribbon is

// Which tiles the map draws. Remembered, because it is a preference about the
// tool rather than anything about the pile — reopening should not silently
// put you back on a basemap you already rejected.
function saveMapSource(mode) {
  try { localStorage.setItem(MAPSOURCE_KEY, mode); } catch (e) { /* unavailable */ }
}
function loadMapSource() {
  let v;
  try { v = localStorage.getItem(MAPSOURCE_KEY); } catch (e) { return null; }
  return v === "custom" || v === "demo" ? v : null;
}

/*  The filter is not a separate database of categories. Every control it offers
    is read back out of the text you wrote: your '#' headings are the groupings
    (family, place, concept — whatever you decided a heading means), the type
    tokens are the kinds, and '+/-' is the confidence. Nothing here invents a
    taxonomy you did not type. */
/*  Top-bar search elements and their sync, declared HERE rather than beside
    their event wiring at the bottom: renderFilter() calls syncSearchInputs()
    during the very first paint, and a `const` declared further down is still
    in its temporal dead zone at that point — which threw and took the whole
    boot with it. */
function syncSearchInputs() {
  const wrap = document.getElementById("topsearch");
  const inp = document.getElementById("topsearchInput");
  if (!wrap || !inp) return;
  const text = state.filter.text || "";
  if (document.activeElement !== inp && inp.value !== text) inp.value = text;
  wrap.classList.toggle("active", !!text);
  // A search with text in it must not collapse and hide what it is doing.
  if (text) wrap.classList.add("open");
}

const state = {
  text: "", model: null,
  filter: {
    text: "", status: "all", types: new Set(), sections: new Set(), focus: null,
    time: { on: false, mode: "range", min: 1800, max: 1900, decade: 1890, year: 1891, span: 5 },
  },
};
function filterIsActive() {
  const f = state.filter;
  return !!(f.text || f.status !== "all" || f.types.size || f.sections.size || f.focus ||
            (f.time && f.time.on));
}

// The full span of years present, used to bound the sliders. Falls back to a
// sane historical range when nothing is dated yet.
function yearExtent(model) {
  const ys = (model.records || []).map(brickYear).filter(y => y !== null);
  if (!ys.length) return [1800, 1900];
  return [Math.min(...ys), Math.max(...ys)];
}
const el = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* --------------------------------------------------------------------------
   3. PANEL + FOOTPRINT REGISTRY
   --------------------------------------------------------------------------
   Everything on the board is a panel with a footprint — the w×h in grid cells
   it occupies when placed. Core panels and visualization panels are the same
   kind of object, so a viz gets every affordance a core panel has: place,
   move, resize, remove.
   -------------------------------------------------------------------------- */
const panels = new Map();       // id -> {id, title, help, group, render, tpl}
const FOOTPRINTS = {};          // id -> {name, desc, w, h, group}
/*  What a panel does to state, not what it looks like.
      write  — changes the pile (state.text / GAZETTEER)
      filter — changes what is in view (state.filter)
      read   — read only
    A panel is "filter" if using it can narrow the board: clicking a name in
    Bricks, a lane in Timeline, a person in Document, a marker on the Map.
    None of them own filter state — everything routes through setFilter — but
    from the desk they ARE filter controls, and calling them R described the
    plumbing rather than the panel. */
const ROLES = {
  write:  { badge: "W", label: "Write — changes the pile" },
  read:   { badge: "R", label: "Read only" },
  filter: { badge: "F", label: "Filter — can change what is in view" },
};
/*  Where each panel is written up in doc/. A panel's own section, not the top
    of the page — a header link that lands you on a contents list has made you
    do the finding yourself. The Promenade earns its own page: its sprite
    sheets need drawing, not describing. */
/*  A real filename, not a directory index: a server that strips
    "index.html" without adding a trailing slash leaves the page at
    /doc, and its relative stylesheet then resolves to /doc.css and
    404s — the page loads unstyled. */
const DOC_HOME = "doc/documentation.html";
const DOCS = {
  pallet: "#pallet", builder: "#builder", classification: "#classification",
  entities: "#bricks", filter: "#filter", document: "#document",
  gazetteer: "#gazetteer", timeline: "#timeline", count: "#tally",
  notes: "#red-flags", reference: "#notation-reference", theme: "#theme",
  "viz-map": "#map-viewer", mapstyle: "#map-style", mapeditor: "#map-editor",
  "viz-promenade": "doc/promenade.html",
};
function docHref(id) {
  const d = DOCS[id];
  if (!d) return "";
  return d[0] === "#" ? DOC_HOME + d : d;
}

const ROLE_RANK = ["write", "filter", "read"];
const ROLE_ORDER = [
  { role: "write",  title: "Write · changes the pile" },
  { role: "filter", title: "Filter · changes the view" },
  { role: "read",   title: "Read only" },
];
const GROUPS = ["Visualizations", "Data & structure"];

function definePanel(cfg) {
  /*  Roles are a LIST: a panel often does more than one thing. The Gazetteer
      edits coordinates and focuses a place; the Map draws and filters. Given
      as a string or an array, always stored as an array, ordered W → F → R so
      the badges read the same way on every panel. */
  const def = Object.assign({ group: "Data & structure", help: "" }, cfg);
  const given = cfg.roles || cfg.role || "read";
  const list = (Array.isArray(given) ? given : [given]).filter(r => ROLES[r]);
  def.roles = ROLE_RANK.filter(r => list.includes(r));
  if (!def.roles.length) def.roles = ["read"];
  def.role = def.roles[0];   // the primary, used for grouping
  panels.set(cfg.id, def);
  FOOTPRINTS[cfg.id] = { name: cfg.title, desc: cfg.help, w: cfg.w || 1, h: cfg.h || 1,
                         group: cfg.group || "Data & structure",
                         role: panels.get(cfg.id).role };
  return cfg.id;
}

/* --------------------------------------------------------------------------
   4. VIZ REGISTRY — the drop-in point
   --------------------------------------------------------------------------
     Brick.viz.register("timeline", {
       emoji: "🕰️", label: "Timeline", description: "…", w: 2, h: 2,
       render(model, el) { ...draw into el... }
     });

   Registering creates a panel with a footprint. It appears in the flyout list
   and you drag it onto the board wherever you want it. A slot receives the
   model and an empty element — no access to the raw text, the editor, or its
   neighbors — so a broken renderer can only break its own tile.
   -------------------------------------------------------------------------- */
const Brick = {
  viz: {
    slots: new Map(),
    register(id, cfg) {
      const slot = Object.assign({ id, emoji: "▫️", label: id, description: "" }, cfg);
      this.slots.set(id, slot);
      definePanel({
        // A slot cannot reach state directly, but it can offer a filter — the
        // map does, by clicking a marker. Declared per slot, so a purely
        // passive chart still gets R.
        roles: slot.roles || slot.role || "read",
        id: "viz-" + id,
        title: slot.emoji + " " + slot.label,
        help: slot.description,
        group: "Visualizations",
        w: slot.w || 2, h: slot.h || 2,
        render(body) { renderSlotBody(slot, body); },
      });
      if (booted) { renderBoardCardList(); refreshPanel("viz-" + id); }
      return this;
    },
    unregister(id) {
      this.slots.delete(id);
      const pid = "viz-" + id;
      panels.delete(pid);
      delete FOOTPRINTS[pid];
      board.tiles = board.tiles.filter(t => t.id !== pid);
      const node = document.getElementById(pid);
      if (node) node.remove();
      if (booted) { renderBoard(); renderBoardCardList(); saveBoard(); }
    },
    list() { return [...this.slots.values()]; },
  },
  get model() { return state.model; },
  get bricks() { return state.model ? state.model.bricks : []; },
  parse, buildModel,
  // Drop a viz straight onto the board from the console.
  place(id, w, h) {
    const pid = panels.has(id) ? id : "viz-" + id;
    if (!FOOTPRINTS[pid] || board.tiles.some(t => t.id === pid)) return false;
    const fp = FOOTPRINTS[pid];
    const slot = findFreeSlot(w || fp.w, h || fp.h);
    addTile(pid, slot.x, slot.y, w || fp.w, h || fp.h);
    return true;
  },
};
window.Brick = Brick;

/* ==========================================================================
   THE PROMENADE — your people, walking the ground they are recorded on
   --------------------------------------------------------------------------
   A side-on scene you pan along. The horizontal axis is LONGITUDE: west on
   the left, east on the right, the same order you would meet these parishes
   walking across Perthshire. Signposts mark the places; each person stands
   near the places their records actually name, and paces about there.

   Two decisions worth stating, because both could have gone the other way:

   1. The axis is geography, not time. A person exists in one spot and their
      clothes carry the period instead. Time as the axis would make a queue of
      strangers; geography makes neighbors, and neighbors are what parish
      records are actually about.

   2. Nobody is invented. A person with no place named in any record does not
      get parked somewhere plausible — they wait at the end of the scene under
      their own sign, because "we do not know where he was" is a finding, not
      a gap to be filled.

   The figures are drawn from divs, deliberately: they are placeholder art
   with the era logic already wired, so a sprite sheet can replace the shapes
   later without touching how anyone is placed or dressed.
   ========================================================================== */

/*  What a person wore, inferred from when they were alive.

    Banded by the decades that actually changed silhouette in Britain, not by
    round numbers: the tall hat and frock coat give way to the bowler and sack
    suit around 1870, soft caps and shorter skirts after 1900, and everything
    after 1945 is simply "modern" because this corpus does not go there. */
/*  Loose bands, deliberately.

    These are not costume history — nobody changed coat on the stroke of 1880,
    and a parish register rarely gives you a date you would want to hang a
    decade on anyway. They are wide, they overlap in spirit, and the years are
    only there so the same person always dresses the same way. Treat them as
    "roughly this sort of century", not as a claim. */
/*  Which places each person is recorded at.

    A record that names a person and a place puts that person there. Same rule
    the connector lines use, so the map and the procession can never disagree
    about who was where. */
function peoplePlaces(model) {
  const coord = new Map();
  for (const p of model.places || []) if (p.coords) coord.set(p.slug, p.coords);
  const byId = new Map((model.entities || []).map(e => [e.slug, e]));
  const out = new Map();
  for (const b of model.records || []) {
    if (!b.valid) continue;
    const named = [b.alias ? b.alias.slug : null, ...(b.links || [])].filter(Boolean);
    const here = named.filter(s => coord.has(s));
    if (!here.length) continue;
    for (const s of named) {
      const e = byId.get(s);
      if (!e || e.kind !== "person") continue;
      let set = out.get(s);
      if (!set) out.set(s, set = new Set());
      for (const p of here) set.add(p);
    }
  }
  return { coord, byId, out };
}

/*  PixiJS 7, UMD build — a global `PIXI`, which is what the loadOnce() script
    tag can actually consume. Pixi 8 is ESM-and-async-init and would need a
    different loader for no benefit here. */
const PIXI_JS = "https://unpkg.com/pixi.js@7.4.2/dist/pixi.min.js";

/*  24 wide for a 10-wide body, and the margin is deliberate: it is where a
    carried thing goes. A hod on the shoulder, a basket held out, a scythe —
    none of them fit inside the body's own footprint, and widening the cell
    later would invalidate every sheet already drawn against it. The room is
    cheap now and impossible to add once there is art. */
const SPR_W = 24, SPR_H = 24, SPR_FRAMES = 4;
const BODY_X = 4;      // the body sits inset by this much, leaving prop room both sides

/*  One figure, recolored.

    You draw a single 64×24 strip — four frames of one walk cycle — and paint
    the swappable parts in flat key colors. Everything else passes through
    untouched, so faces, boots, whatever you like stay exactly as drawn.

        magenta #ff00ff  →  coat
        cyan    #00ffff  →  legs and arms
        yellow  #ffff00  →  hat

    Each era, and then each person, gets that strip recolored into their own
    texture. It is the old palette-swap trick, and it means one drawing dresses
    a whole parish. */
/*  Layers are drawn in the colors you drew them in.

    There was a palette-swap here once: three marker colors, a palette per
    century, and a figure recolored to suit its dates. It let one drawing
    serve five centuries, and it cost more in confusion than it ever returned —
    every question about clothing turned into a question about magenta.

    So: a pixel is the color you painted it. If you want a Georgian coat and a
    Victorian one, draw two coats and name them for who wears them. */

function seedOf(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 100000;
  return h / 1000;
}

/*  Repaint the key colors. Cached on the palette itself, because a parish of
    sixty people is sixty little 64×24 canvases otherwise, redrawn on every
    resize and every sort. */
const sheetCache = new Map();
/*  ONE CELL, SHARED BY EVERY LAYER.

    A figure is four rasters stacked — body, bottom, top, hat — all the same
    size and all in the same space. The bottom edge of that space is the ground
    the person stands on; the center line is the person. You draw each element
    where it actually goes, and the layers simply lie on top of one another.

    Which is why there are no anchors and nothing to configure: a taller cell
    is a taller hat, because the extra room is above the head. A 24 x 24 cell
    is an ordinary figure; a 40 x 32 cell is the same figure with eight pixels
    of headroom and eight either side for a brim or a carried tool. */
const SWING = [0, 1, 0, -1];          // pass, stride, pass, stride the other way

function sheetCanvas() {
  const c = document.createElement("canvas");
  c.width = SPR_W * SPR_FRAMES;
  c.height = SPR_H;
  const g = c.getContext("2d", { willReadFrequently: true });
  g.imageSmoothingEnabled = false;
  return [c, g];
}

const SKIN = "#c9a689", SKIN_SHADE = "#aa8970", HAIR = "#4a3b2a";

/*  The body: skin and hair, no clothes. */
function makeBodySheet() {
  const [c, g] = sheetCanvas();
  for (let f = 0; f < SPR_FRAMES; f++) {
    const ox = f * SPR_W + BODY_X, s = SWING[f];
    const box = (x0, y0, x1, y1, col) => { g.fillStyle = col; g.fillRect(x0, y0, x1 - x0 + 1, y1 - y0 + 1); };
    box(ox + 5, 2, ox + 10, 7, SKIN);            // head
    box(ox + 5, 1, ox + 10, 2, HAIR);            // scalp, so a hatless head is not an egg
    box(ox + 10, 3, ox + 10, 7, SKIN_SHADE);     // one column of form
    box(ox + 7, 8, ox + 8, 8, SKIN_SHADE);       // neck
    box(ox + 5, 9, ox + 10, 16, SKIN);           // torso
    box(ox + 10, 9, ox + 10, 16, SKIN_SHADE);
    box(ox + 3, 10 - s, ox + 4, 15 - s, SKIN);   // arms swing opposite the legs
    box(ox + 11, 10 + s, ox + 12, 15 + s, SKIN);
    box(ox + 12, 10 + s, ox + 12, 15 + s, SKIN_SHADE);
    box(ox + 5, 17, ox + 10, 17, SKIN);          // hips
    box(ox + 5 - s, 18, ox + 7 - s, 23, SKIN);   // legs
    box(ox + 8 + s, 18, ox + 10 + s, 23, SKIN_SHADE);
  }
  c.__frames = SPR_FRAMES;
  return c;
}

function bodySpaceSheet(draw) {
  const [c, g] = sheetCanvas();
  for (let f = 0; f < SPR_FRAMES; f++) draw(g, f * SPR_W + BODY_X, SWING[f], f);
  c.__frames = SPR_FRAMES;
  return c;
}

/*  Trousers, not painted legs — a pixel proud of the limb inside, with a seat
    joining them, or it reads as bare skin in a different color. */
function makeBottomSheet() {
  const K = "#4a5568";                       // trousers
  return bodySpaceSheet((g, x, s) => {
    g.fillStyle = K;
    g.fillRect(x + 4, 17, 8, 3);              // seat
    g.fillRect(x + 4 - s, 19, 3, 5);          // left leg
    g.fillRect(x + 9 + s, 19, 3, 5);          // right leg
  });
}

/*  A coat with a shape of its own: shoulders past the torso, and a skirt
    hanging below the waist over the top of the trousers. */
function makeTopSheet() {
  const C = "#2f3542", T = "#4a5568";        // coat, and its cuffs and collar
  return bodySpaceSheet((g, x, s) => {
    g.fillStyle = C;
    g.fillRect(x + 3, 9, 10, 10);             // body of the coat, down over the hips
    g.fillRect(x + 4, 8, 8, 2);               // shoulders
    g.fillStyle = T;
    g.fillRect(x + 7, 8, 2, 3);               // collar
    g.fillRect(x + 2, 10 - s, 3, 7);          // sleeves swing with the arms
    g.fillRect(x + 11, 10 + s, 3, 7);
  });
}

/*  A brim wider than the head, which is the whole of what says "hat". */
function makeHatSheet() {
  const K = "#16181c";                       // hat
  return bodySpaceSheet((g, x) => {
    g.fillStyle = K;
    g.fillRect(x + 2, 2, 12, 2);              // brim
    g.fillRect(x + 4, 0, 8, 3);               // crown
  });
}

/*  A SHIFT OF TINT, so a parish is not one figure repeated.

    Twenty mill workers in the same drawn coat should read as twenty people,
    not as one person printed twenty times — but they must still read as mill
    workers, so the shift has to be small: a few degrees of hue and a little
    lightness, never enough to turn a brown coat blue.

    Seeded from the uid, so somebody is the same shade in every render, this
    session and the next. Bucketed into a handful of variants rather than one
    per person, because each distinct tint is another GPU texture and a parish
    of three hundred does not need three hundred of them. */
const TINTS = 7;
const tintCache = new Map();

function tintSheet(base, bucket) {
  if (!bucket) return base;                       // bucket 0 is the drawing as drawn
  if (!base.__tintId) base.__tintId = ++dressIds;
  const key = base.__tintId + ":" + bucket;
  if (tintCache.has(key)) return tintCache.get(key);

  const c = document.createElement("canvas");
  c.width = base.width; c.height = base.height;
  const g = c.getContext("2d", { willReadFrequently: true });
  g.imageSmoothingEnabled = false;
  g.drawImage(base, 0, 0);
  const im = g.getImageData(0, 0, c.width, c.height), d = im.data;

  // Spread evenly either side of the drawing rather than always one way.
  const t = (bucket / (TINTS - 1)) * 2 - 1;       // -1 … 1
  const dh = t * 14, dl = t * 0.05;               // degrees, and a fraction

  for (let i = 0; i < d.length; i += 4) {
    if (!d[i + 3]) continue;
    const r = d[i] / 255, gg = d[i + 1] / 255, b = d[i + 2] / 255;
    const mx = Math.max(r, gg, b), mn = Math.min(r, gg, b);
    let h = 0, sat = 0;
    const l = (mx + mn) / 2;
    if (mx !== mn) {
      const dd = mx - mn;
      sat = l > 0.5 ? dd / (2 - mx - mn) : dd / (mx + mn);
      h = mx === r ? ((gg - b) / dd + (gg < b ? 6 : 0))
        : mx === gg ? (b - r) / dd + 2
        : (r - gg) / dd + 4;
      h *= 60;
    }
    const h2 = (h + dh + 360) % 360;
    const l2 = Math.max(0, Math.min(1, l + dl));
    // back to rgb
    const cc = (1 - Math.abs(2 * l2 - 1)) * sat;
    const x = cc * (1 - Math.abs(((h2 / 60) % 2) - 1));
    const m = l2 - cc / 2;
    let rr, g2, bb;
    if (h2 < 60)       { rr = cc; g2 = x;  bb = 0; }
    else if (h2 < 120) { rr = x;  g2 = cc; bb = 0; }
    else if (h2 < 180) { rr = 0;  g2 = cc; bb = x; }
    else if (h2 < 240) { rr = 0;  g2 = x;  bb = cc; }
    else if (h2 < 300) { rr = x;  g2 = 0;  bb = cc; }
    else               { rr = cc; g2 = 0;  bb = x; }
    d[i]     = Math.round((rr + m) * 255);
    d[i + 1] = Math.round((g2 + m) * 255);
    d[i + 2] = Math.round((bb + m) * 255);
  }
  g.putImageData(im, 0, 0);
  tintCache.set(key, c);
  return c;
}

/*  Body first, then each layer over it. Cached, because a parish of mill
    workers is one composite shared by all of them.

    `cache` is off for anything being edited: the cache is keyed on each
    canvas's identity, and drawing into a canvas does not change its identity,
    so a sheet you are painting would keep handing back the composite from
    before your first stroke. */
const dressCache = new Map();
let dressIds = 0;

function dressBody(layers, cache) {
  const worn = (layers || []).filter(l => l && l.img);
  if (!worn.length) return null;
  const useCache = cache !== false;
  const idOf = cv => cv.__dressId || (cv.__dressId = ++dressIds);
  const key = worn.map(l => idOf(l.img)).join(">");
  if (useCache && dressCache.has(key)) return dressCache.get(key);

  /*  Every layer brings its own cell, and the composite takes the largest —
      so a sheet drawn on a roomier grid keeps its headroom instead of being
      cropped to the body's box.

      Two rules place everything, and they are the only two that survive a
      change of size: CENTERED on the vertical axis, because a person is
      symmetrical about it, and sitting on the BOTTOM edge, because that edge
      is the ground. Extra height is therefore headroom, which is exactly where
      a tall hat needs it. */
  const cells = worn.map(({ img }) => {
    const n = img.__frames || SPR_FRAMES;
    return { img, n, w: (img.width || SPR_W * n) / n, h: img.height || SPR_H };
  });
  const cw = Math.max(SPR_W, ...cells.map(c => c.w));
  const ch = Math.max(SPR_H, ...cells.map(c => c.h));

  const gcd = (x, y) => y ? gcd(y, x % y) : x;
  const frames = Math.min(24, cells.reduce((m, c) => m * c.n / gcd(m, c.n), 1));

  const c = document.createElement("canvas");
  c.width = cw * frames; c.height = ch;
  const g = c.getContext("2d");
  g.imageSmoothingEnabled = false;
  for (const l of cells) {
    const dx = Math.round((cw - l.w) / 2), dy = ch - l.h;
    for (let f = 0; f < frames; f++) {
      // A layer with fewer frames repeats: a one-frame hat sits still on a
      // four-frame walk without anybody drawing it four times.
      g.drawImage(l.img, (f % l.n) * l.w, 0, l.w, l.h, f * cw + dx, dy, l.w, l.h);
    }
  }
  c.__cellW = cw; c.__cellH = ch; c.__frames = frames;
  c.__footY = ch;                       // the ground is the bottom edge
  if (useCache) dressCache.set(key, c);
  return c;
}

/*  Singling somebody out, without disturbing the scene.

    Everything unrelated drops to a quarter opacity and everything related
    stays lit — the person, and the parishes their records put them in; or the
    parish, and everyone recorded there. The scene is never rebuilt, so the
    walkers keep their stride and the view keeps its place.

    Clicking the same thing again, or the empty ground, clears it. */
const FOCUS_DIM = 0.22;

function toggleFocus(host, kind, slug) {
  const same = host._focus === slug;
  host._focus = same ? null : slug;
  host._focusKind = same ? null : kind;
  applyFocus(host);
}

function applyFocus(host) {
  const focus = host._focus, kind = host._focusKind;
  const rel = host._related || { byPerson: new Map(), byPlace: new Map() };

  const litPlaces = !focus ? null
    : kind === "person" ? (rel.byPerson.get(focus) || new Set())
    : new Set([focus]);
  /*  A column you made has no records behind it, so there is nothing to look
      up — who is in it is simply who you put in it. Same for the promenade.
      Read straight off the placements rather than off the relation map. */
  const fromPins = () => {
    const set = new Set();
    if (!host._pinned) return set;
    for (const [uid, where] of host._pinned) if (where === focus) set.add(uid);
    return set;
  };
  /*  A column's people are whoever the records put there AND whoever you did.
      One rule for both kinds: a parish knows its own from the pile, a group you
      invented knows only what you told it, and a parish you have also dragged
      people into is both. */
  const litPeople = !focus ? null
    : kind === "column" ? new Set([...(rel.byPlace.get(focus) || []), ...fromPins()])
    : new Set([focus]);

  for (const w of host._walkers || []) {
    const lit = !focus || litPeople.has(w.slug);
    w.node.alpha = lit ? w.base : w.base * FOCUS_DIM;
    // The selected person keeps their name up; everyone else waits for hover.
    if (focus === w.slug) {
      const make = host._ensureNameFor && host._ensureNameFor.get(w.slug);
      if (make) make();
    }
    if (w.nameNode) w.nameNode.visible = focus === w.slug;
  }
  for (const s of host._signs || []) {
    const lit = !focus || litPlaces.has(s.slug);
    s.node.alpha = lit ? 1 : FOCUS_DIM;
  }
  if (host._syncTint) host._syncTint();
}

/*  A gradient behind one column.

    Per place, and entirely optional: a column with no gradient shows the plain
    sky and ground like every other. It is scenery, not data — it says nothing
    about the place and never reaches the pile.

    Stored by uid so it survives a reload, and kept out of the gazetteer for
    the same reason the scene art is: that file is coordinates. */
const COLUMN_TINT = new Map();   // uid -> { from, to }

/*  GROUPS — columns you invent.

    A place is a column because a record says somebody was there. A group is a
    column because YOU say these people belong together: a household, a
    suspected family, everyone in one lawsuit, the ones you have not settled.
    The page attaches no meaning to it and never infers one — it is a heading
    you wrote, exactly like the `#` headings in the pile.

    Kept beside the placements rather than in the pile, for the same reason
    those are: which column somebody stands in is a note about your thinking,
    not a fact a document attests. Saved into brick.json with the rest. */
const PROM_GROUPS = [];          // [{ slug, name }]

function loadGroups() {
  let raw;
  try { raw = JSON.parse(localStorage.getItem(GROUPS_KEY) || "null"); } catch (e) { return; }
  if (!Array.isArray(raw)) return;
  for (const g of raw) {
    const name = typeof g === "string" ? g : (g && g.name);
    if (name && !PROM_GROUPS.some(x => x.name === name)) {
      PROM_GROUPS.push({ slug: "grp-" + slugify(name), name });
    }
  }
}
function saveGroups() {
  try {
    if (PROM_GROUPS.length) localStorage.setItem(GROUPS_KEY, JSON.stringify(PROM_GROUPS));
    else localStorage.removeItem(GROUPS_KEY);
  } catch (e) { /* unavailable */ }
}
/*  Prefixed, so a group called Perth and a parish called Perth are different
    columns — the same collision the art folders solve by being folders. */
/*  Put a group down in a new place in the running order.

    Reordering is only ever within the groups: the places are laid out by
    longitude and sit before all of them, so a group dropped over Longforgan
    still lands at the head of the groups rather than in among the parishes.
    That is a real limit, and it is the honest one — a column you invented has
    no coordinates, so there is no honest way to interleave it with columns
    that do. */
function moveGroupTo(slug, x, xOf) {
  const i = PROM_GROUPS.findIndex(g => g.slug === slug);
  if (i < 0) return;
  const [moved] = PROM_GROUPS.splice(i, 1);
  let at = 0;
  for (const other of PROM_GROUPS) {
    const ox = xOf.get(other.slug);
    if (ox !== undefined && x > ox) at++;
  }
  PROM_GROUPS.splice(at, 0, moved);
  saveGroups();
}

function groupNameOf(slug) {
  const g = PROM_GROUPS.find(x => x.slug === slug);
  return g ? g.name : null;
}

/*  ONE SHEET PER WEARER.

    Four frames across, four rows down, and the rows are what a figure is made
    of — from the skin outwards:

        row 1   body
        row 2   bottom
        row 3   top
        row 4   hat

    The filename says who it is for, and that is the whole of the configuration:

        images/wear/<who>.png       who = a uid, a trade, or "default"

        mill-worker.png   every mill worker
        george-isles.png  him and nobody else
        default.png       everyone else

    ROWS ARE INDEPENDENT. Leave a row transparent and it falls through to the
    next sheet in the chain — the person's, then their trade's, then default's,
    then the built-in. So a sheet with only a hat drawn on it changes only the
    hat, and one that redraws the body row gives that person a different figure
    entirely without a flag or a setting anywhere. */
const ROWS = ["body", "bottom", "top", "hat"];

/*  THE STREET'S OWN SKY AND GROUND.

    A column tint colors one stretch of sky; this is the whole scene behind
    every stretch of it, which is why it sits in the panel's own bar rather
    than behind a signpost — there is no column to select for it.

    Two colors, because everything else follows from them and a picker with
    five swatches is a paint program. The horizon line is the ground lifted a
    little, so it reads as an edge without being chosen; the grid view's flat
    field is the sky taken down, because a board of pictograms is the same
    room with the lights off. */
const SCENE_BG_DEFAULT = { sky: "#1d2c38", ground: "#1a1f18" };
let SCENE_BG = { ...SCENE_BG_DEFAULT };

function loadSceneBg() {
  let raw;
  try { raw = JSON.parse(localStorage.getItem(SCENEBG_KEY) || "null"); } catch (e) { return; }
  if (raw && /^#[0-9a-f]{6}$/i.test(raw.sky) && /^#[0-9a-f]{6}$/i.test(raw.ground)) {
    SCENE_BG = { sky: raw.sky, ground: raw.ground };
  }
}
function saveSceneBg() {
  try {
    const d = SCENE_BG.sky === SCENE_BG_DEFAULT.sky && SCENE_BG.ground === SCENE_BG_DEFAULT.ground;
    if (d) localStorage.removeItem(SCENEBG_KEY);
    else localStorage.setItem(SCENEBG_KEY, JSON.stringify(SCENE_BG));
  } catch (e) { /* unavailable */ }
}

const hexInt = h => parseInt(String(h).slice(1), 16) || 0;

/*  Toward white for a positive amount, toward black for a negative one. Per
    channel, so a color keeps its hue instead of drifting grey. */
function shadeInt(hex, amt) {
  const n = hexInt(hex);
  const mix = c => amt >= 0 ? Math.round(c + (255 - c) * amt) : Math.round(c * (1 + amt));
  return (mix((n >> 16) & 255) << 16) | (mix((n >> 8) & 255) << 8) | mix(n & 255);
}

const mixInt = (a, b, t) => {
  const ch = s => {
    const x = Math.round(((a >> s) & 255) * (1 - t) + ((b >> s) & 255) * t);
    return x < 0 ? 0 : x > 255 ? 255 : x;
  };
  return (ch(16) << 16) | (ch(8) << 8) | ch(0);
};

// Perceived brightness, so a saturated yellow counts as light and a saturated
// blue does not — which the plain average gets backwards.
const lumOf = int => (0.299 * ((int >> 16) & 255) + 0.587 * ((int >> 8) & 255) +
                      0.114 * (int & 255)) / 255;

/*  LETTERING THAT SURVIVES THE SKY.

    Every label out here used to be a fixed color — a pale grey for a person
    whose place is known, a dim slate for one whose is not — chosen against the
    one sky this panel had. The moment the sky became yours, those two were a
    guess: pale grey on a pale sky is not dim, it is gone.

    So the ink is picked from what it is sitting on. Near-black on a light
    field, near-white on a dark one; the quiet variant is the same ink taken
    part of the way back toward the field, so "known" and "unknown" stay a
    difference in strength rather than two unrelated hues that only happened
    to work against navy. */
function sceneInk(bgInt, quiet) {
  const ink = lumOf(bgInt) > 0.5 ? 0x14181c : 0xe4ebf0;
  return quiet ? mixInt(ink, bgInt, 0.45) : ink;
}

/*  The same shift as shadeInt, handed back as a hex string — which is what a
    swatch, a CSS background and a colour input all want. */
const shadeHex = (hex, amt) =>
  "#" + shadeInt(hex, amt).toString(16).padStart(6, "0");

const sceneSky = () => hexInt(SCENE_BG.sky);
const sceneGround = () => hexInt(SCENE_BG.ground);
// 0.08 rather than a rounder number because it lands on #2c312a for the
// default ground, which is the #2b3327 this line was hand-picked as.
const sceneEdge = () => shadeInt(SCENE_BG.ground, 0.08);    // the horizon line
const sceneGrid = () => shadeInt(SCENE_BG.sky, -0.38);      // the pictogram board

/*  THE RIBBONS.

    A group's name hangs on a ribbon rather than a board, and the color of it
    is yours. Keyed by column slug, the same way a column's backdrop is —
    "" is The Promenade, "grp-…" is one you invented — so the two settings sit
    side by side in the same bar and are saved by the same file.

    The default is the signboard timber every other label on the street is
    painted in, so an uncolored ribbon still belongs to the picture. */
const RIBBON = new Map();
const RIBBON_DEFAULT = "#4a3b28";
const ribbonOf = slug => RIBBON.get(slug) || RIBBON_DEFAULT;

function loadRibbons() {
  let raw;
  try { raw = JSON.parse(localStorage.getItem(RIBBON_KEY) || "null"); } catch (e) { return; }
  if (!Array.isArray(raw)) return;
  for (const [slug, c] of raw) {
    if (typeof slug === "string" && /^#[0-9a-f]{6}$/i.test(c)) RIBBON.set(slug, c);
  }
}
function saveRibbons() {
  try {
    if (RIBBON.size) localStorage.setItem(RIBBON_KEY, JSON.stringify([...RIBBON.entries()]));
    else localStorage.removeItem(RIBBON_KEY);
  } catch (e) { /* unavailable */ }
}

function loadColumnTints() {
  let raw;
  try { raw = JSON.parse(localStorage.getItem(COLTINT_KEY) || "null"); } catch (e) { return; }
  if (!Array.isArray(raw)) return;
  for (const [uid, t] of raw) {
    if (uid && t && /^#[0-9a-f]{6}$/i.test(t.from) && /^#[0-9a-f]{6}$/i.test(t.to)) {
      const a = Number(t.alpha);
      COLUMN_TINT.set(uid, { from: t.from, to: t.to,
                             alpha: (a >= 0 && a <= 1) ? a : 1 });
    }
  }
}
function saveColumnTints() {
  try {
    if (COLUMN_TINT.size) localStorage.setItem(COLTINT_KEY, JSON.stringify([...COLUMN_TINT.entries()]));
    else localStorage.removeItem(COLTINT_KEY);
  } catch (e) { /* unavailable */ }
}

/*  A vertical gradient as a texture: Pixi's Graphics fills are flat, so the
    ramp is painted on a 1-pixel-wide canvas and stretched across the column.
    Cached, because the same two colors redraw on every render otherwise. */
const gradCache = new Map();
function gradientTexture(P, from, to) {
  const key = from + "|" + to;
  if (gradCache.has(key)) return gradCache.get(key);
  const c = document.createElement("canvas");
  c.width = 1; c.height = 64;
  const g = c.getContext("2d");
  const ramp = g.createLinearGradient(0, 0, 0, 64);
  ramp.addColorStop(0, from);
  ramp.addColorStop(1, to);
  g.fillStyle = ramp;
  g.fillRect(0, 0, 1, 64);
  const tex = P.Texture.from(c);
  gradCache.set(key, tex);
  return tex;
}

/* ==========================================================================
   brick.json — the sidecar
   --------------------------------------------------------------------------
   Everything that belongs to a piece of research but is not a record: who you
   have placed in which column, and what color you gave a column. It sits
   beside bricks/ and images/ and travels with them.

   Deliberately NOT the bricks. A brick is something a document says; this file
   is how you have chosen to look at them. Keeping the two apart means a
   arrangement can never be mistaken for evidence, and you can throw this file
   away without losing a single record.

   Read automatically when you open a folder that contains one.
   ========================================================================== */
function sidecarJSON(host) {
  return JSON.stringify({
    brickByBrick: 1,
    saved: new Date().toISOString(),
    promenade: {
      pins: host && host._pinned ? [...host._pinned.entries()] : [],
      groups: PROM_GROUPS.map(g => g.name),
    },
    columns: {
      tints: [...COLUMN_TINT.entries()],
      ribbons: [...RIBBON.entries()],
      // The scene behind all of them, which is the same kind of decision.
      scene: { ...SCENE_BG },
    },
  }, null, 2);
}

/*  Returns what it managed to read, so the caller can say so rather than
    leaving you guessing whether the file did anything. */
function applySidecar(text, host) {
  let data;
  try { data = JSON.parse(text); } catch (e) { return null; }
  if (!data || typeof data !== "object") return null;
  const out = { pins: 0, tints: 0, groups: 0 };

  const pins = data.promenade && data.promenade.pins;
  if (Array.isArray(pins) && host && host._pinned) {
    host._pinned.clear();
    for (const [uid, place] of pins) {
      if (typeof uid === "string" && typeof place === "string") {
        host._pinned.set(uid, place);
        out.pins++;
      }
    }
    if (host._savePins) host._savePins();
  }

  const groups = data.promenade && data.promenade.groups;
  if (Array.isArray(groups)) {
    PROM_GROUPS.length = 0;
    for (const name of groups) {
      if (typeof name === "string" && name.trim()) {
        PROM_GROUPS.push({ slug: "grp-" + slugify(name), name });
        out.groups++;
      }
    }
    saveGroups();
  }

  const tints = data.columns && data.columns.tints;
  if (Array.isArray(tints)) {
    COLUMN_TINT.clear();
    for (const [uid, t] of tints) {
      if (uid && t && /^#[0-9a-f]{6}$/i.test(t.from) && /^#[0-9a-f]{6}$/i.test(t.to)) {
        const a = Number(t.alpha);
        COLUMN_TINT.set(uid, { from: t.from, to: t.to, alpha: (a >= 0 && a <= 1) ? a : 1 });
        out.tints++;
      }
    }
    saveColumnTints();
  }

  const ribbons = data.columns && data.columns.ribbons;
  if (Array.isArray(ribbons)) {
    RIBBON.clear();
    for (const [slug, c] of ribbons) {
      if (typeof slug === "string" && /^#[0-9a-f]{6}$/i.test(c)) RIBBON.set(slug, c);
    }
    saveRibbons();
  }

  /*  Absent in a file written before the scene was settable, which must leave
      the current one alone rather than resetting it to the default. */
  const scene = data.columns && data.columns.scene;
  if (scene && /^#[0-9a-f]{6}$/i.test(scene.sky) && /^#[0-9a-f]{6}$/i.test(scene.ground)) {
    SCENE_BG = { sky: scene.sky, ground: scene.ground };
    saveSceneBg();
    if (host && host._syncSceneBg) host._syncSceneBg();
  }
  return out;
}

/*  Light the people in the pen whose name matches, dim the rest.

    Kept apart from the focus dimming so the two can coexist: a search inside
    the pen does not disturb a place you have selected out on the street. */
function applyPenSearch(host) {
  /*  Searches EVERYONE on the panel, not only the pen.

      Restricting it to the unplaced assumed you always know where somebody is
      once you have put them somewhere — but a column of twelve is no easier to
      scan than a huddle of twelve, and the name you half remember is as likely
      to be standing in Longforgan as waiting to be placed. */
  const q = host._penQuery || "";
  for (const w of host._walkers || []) {
    const hit = !q || w.search.includes(q);
    w.node.alpha = hit ? w.base : w.base * 0.18;
    if (q && hit) {
      const make = host._ensureNameFor && host._ensureNameFor.get(w.slug);
      if (make) make();
    }
    if (w.nameNode) w.nameNode.visible = !!q && hit;
  }
}

/*  A costume for an occupation.

    images/occupations/<trade>.png — found by filename, the same bargain as the
    scene art: a person whose occupation slugs to "powerloom-tender" wears
    powerloom-tender.png if such a file exists, and the ordinary figure if it
    does not. Nothing to configure, nothing to keep in step.

    A costume is a walk sheet like any other: same 64x24 geometry, same key
    colors. Which means a uniform still takes its era's palette and its
    wearer's own nudge, so twenty millworkers are recognisably millworkers
    without being twenty identical sprites. */
const costumeCache = new Map();   // occupation slug -> Image | null | Promise

function occupationOf(entity) {
  const raw = (entity.detail || "").split(/[,.;(]/)[0].trim();
  if (!raw || raw.length > 28) return "";
  return slugify(raw);
}

/*  Art lives in a folder named for what it is:

      images/places/longforgan.png        behind that parish
      images/occupations/mill-worker.png  worn by that trade

    Which settles the collision outright — a parish called Mason and a trade
    called mason are different files, and neither has to carry a prefix in its
    name to say so.

    An opened research folder is matched on the directory as well as the
    filename, so the same layout works from disk and hosted. */
/*  The directory this page lives in, worked out rather than assumed.

    A relative "images/..." resolves against the URL, and a server that serves
    index.html at /brick-by-brick WITHOUT a trailing slash makes that resolve to
    /images/... — one level too high, so every layer and scene 404s while
    looking perfectly correct in the source. There is no way to ask whether a
    slashless path is a directory, so: a path ending in a file extension keeps
    its directory, anything else is treated as one. */
const ASSET_BASE = (() => {
  const p = location.pathname;
  if (/\.[a-z0-9]+$/i.test(p)) return p.slice(0, p.lastIndexOf("/") + 1);
  return p.endsWith("/") ? p : p + "/";
})();

/*  DRAWINGS KEPT IN THE BROWSER.

    A drawing made in the Sprite Editor has, until now, had one way onto the
    street: download the PNG, put it in images/, deploy the site, reload. Which
    is a deploy per hat, and it makes trying something out cost more than
    drawing it.

    So the page can hold art itself. Keyed by exactly the path the loader would
    have asked the server for — "wear/mill-worker.png", "places/longforgan.png"
    — and checked before anything else, because it is the most recent thing you
    deliberately did. Nothing else changes: the same names, the same chain, the
    same fall-through. The file simply has not been written yet.

    Temporary on purpose. It lives in this browser, it travels with nothing,
    and the Art panel exists partly to keep that visible and partly to hand
    you the PNG when you decide a drawing has earned a place in the repo. */
const LOCAL_ART = new Map();          // "wear/name.png" -> data: URL

function loadLocalArt() {
  let raw;
  try { raw = JSON.parse(localStorage.getItem(ARTKEY) || "null"); } catch (e) { return; }
  if (!raw || typeof raw !== "object") return;
  for (const [path, url] of Object.entries(raw)) {
    if (typeof url === "string" && url.startsWith("data:image/")) LOCAL_ART.set(path, url);
  }
}
function saveLocalArt() {
  try {
    if (!LOCAL_ART.size) { localStorage.removeItem(ARTKEY); return; }
    localStorage.setItem(ARTKEY, JSON.stringify(Object.fromEntries(LOCAL_ART)));
    return true;
  } catch (e) {
    /*  Out of room. Says so rather than losing the drawing quietly — the
        browser's quota is a few megabytes and a sheet is a few hundred bytes,
        so this means something else has filled it. */
    return false;
  }
}

/*  Every cache that remembers where art came from, or that it was missing.
    Called whenever the store changes, because "this place has no picture" is
    exactly the kind of thing that has just stopped being true. */
function artChanged() {
  resetSceneCache();
  costumeCache.clear();
  ROW_CACHE.clear();
  dressCache.clear();
  if (typeof refreshAll === "function") refreshAll();
}

function putLocalArt(path, dataUrl) {
  LOCAL_ART.set(path, dataUrl);
  const ok = saveLocalArt();
  artChanged();
  return ok;
}
function dropLocalArt(path) {
  LOCAL_ART.delete(path);
  saveLocalArt();
  artChanged();
}

function artSrc(kind, slug) {
  // The page's own drawings first: nothing else in the chain is as deliberate
  // or as recent as something you drew a moment ago.
  const held = LOCAL_ART.get(kind + "/" + slug.toLowerCase() + ".png");
  if (held) return held;
  const want = slug.toLowerCase();
  for (const [path, v] of folderImages) {
    const parts = path.toLowerCase().split("/");
    /*  A trailing -WxH is dimensions, not part of the name, so
        mill-worker-96x96.png and mill-worker.png are the same wearer. */
    const base = parts.pop().replace(/\.[^.]+$/, "").replace(/-\d+x\d+$/, "");
    if (base !== want) continue;
    if (!parts.includes(kind)) continue;      // right name, wrong folder
    if (!v.url) v.url = URL.createObjectURL(v.file);
    return v.url;
  }
  return folderImages.size ? "" : ASSET_BASE + "images/" + kind + "/" + encodeURIComponent(want) + ".png";
}

/*  A sheet from any of the art folders. Cached under folder+name, so a parish
    called Mason and a tradesman called mason stay different pictures. */
function layerImage(kind, slug, onReady) {
  if (!slug) return null;
  const key = kind + "/" + slug;
  if (costumeCache.has(key)) {
    const got = costumeCache.get(key);
    return got instanceof Promise ? null : got;
  }
  const src = artSrc(kind, slug);
  if (!src) { costumeCache.set(key, null); return null; }
  const pending = new Promise(res => {
    const img = new Image();
    img.onload = () => { costumeCache.set(key, img); res(img); if (onReady) onReady(); };
    img.onerror = () => { costumeCache.set(key, null); res(null); };
    img.src = src;
  });
  costumeCache.set(key, pending);
  return null;                    // this render uses the default; the next has it
}

/*  Where a place's picture lives.

    images/places/<uid>.png — the parish's own name, in the places folder.

    No configuration, and no complaint when there is nothing there — most
    places will not have art, and that is the normal state, not a fault. */
function sceneSrc(slug) { return artSrc("places", slug); }

/*  Look each place's art up once, and remember when there is none.

    Without this every render speculatively requested images/<uid>.png for
    every place — 59 requests that all 404 on a site with no images folder,
    repeated on every zoom, sort, drop and resize. A place that has no picture
    is a permanent fact for the session, so it is worth remembering.

    Resolves to an Image once loaded, or null. Reset when a folder is opened,
    since that changes where art comes from. */
const sceneCache = new Map();     // slug -> HTMLImageElement | null | Promise
function resetSceneCache() { sceneCache.clear(); }

function loadImg(src) {
  return new Promise(res => {
    if (!src) return res(null);
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => res(null);
    img.src = src;
  });
}

function sceneImage(slug) {
  if (sceneCache.has(slug)) return sceneCache.get(slug);
  // The place's own picture, then the one everywhere shares.
  const pending = loadImg(sceneSrc(slug))
    .then(img => img || (slug === "default" ? null : loadImg(sceneSrc("default"))))
    .then(img => { sceneCache.set(slug, img || null); return img || null; });
  sceneCache.set(slug, pending);
  return pending;
}

/*  A wardrobe is one file.

    images/wear/<who>.png — four frames across, four rows down, the rows in
    ROWS order from the skin outwards. The cell is width/4 by height/4, so a
    96 x 96 sheet is four 24 x 24 cells and a 128 x 160 sheet is four 32 x 40
    ones. A broader hat therefore makes the whole figure's cell broader, which
    is the price of one file and a fair one: a hat is only ever broad ON
    somebody.

    Four frames is fixed, because nothing in a PNG can say otherwise. With a
    file per layer the cell width was derivable from the layer's own size;
    stacked into one sheet every row shares a cell, and a sheet cannot say how
    many columns it was cut into. */
const ROW_CACHE = new Map();   // sheet Image -> [canvas | null] in ROWS order

function sheetRows(img) {
  if (!img) return null;
  const had = ROW_CACHE.get(img);
  if (had) return had;

  const w = img.width, rh = Math.max(1, Math.round(img.height / ROWS.length));
  const probe = document.createElement("canvas");
  probe.width = w; probe.height = img.height;
  const pg = probe.getContext("2d", { willReadFrequently: true });
  pg.imageSmoothingEnabled = false;
  pg.drawImage(img, 0, 0);

  const rows = ROWS.map((slot, i) => {
    /*  A row nobody drew on is not an empty coat — it is a coat this sheet has
        no opinion about, so it falls through to the next sheet in the chain.
        Which is what makes one file per wearer as expressive as four: a sheet
        with only the hat row inked changes only the hat. */
    const d = pg.getImageData(0, i * rh, w, rh).data;
    let ink = false;
    for (let p = 3; p < d.length; p += 4) if (d[p]) { ink = true; break; }
    if (!ink) return null;
    const c = document.createElement("canvas");
    c.width = w; c.height = rh;
    const g = c.getContext("2d");
    g.imageSmoothingEnabled = false;
    g.drawImage(img, 0, i * rh, w, rh, 0, 0, w, rh);
    c.__frames = SPR_FRAMES;
    return c;
  });
  /*  Bounded, because the editor loads a fresh Image on every pass and each
      one is a new key. The Promenade's sheets come from costumeCache and are
      the same objects render after render, so they cost four entries, not one
      per render — this cap only ever throws away editor scratch. */
  if (ROW_CACHE.size > 64) ROW_CACHE.clear();
  ROW_CACHE.set(img, rows);
  return rows;
}

function wearSheet(who, onReady) {
  return who ? layerImage("wear", who, onReady) : null;
}

/*  A LOOSE LAYER, for when a whole sheet is more than you meant.

        images/wear/<who>.<slot>.png     slot = body | bottom | top | hat

    Drawing one hat should not require drawing the three rows under it, and a
    hat that has to live inside somebody's sheet cannot be lent to anybody
    else. So a single-layer file still counts, and it beats the same wearer's
    sheet — it is the more specific statement of the two.

    Its cell is its own, which is the one thing a sheet cannot offer: a broad
    hat here is broad without widening the body it sits on. */
function wearImage(who, slot, onReady) {
  return who ? layerImage("wear", who + "." + slot, onReady) : null;
}

/*  Everything this person has on.

    Three wearers, most specific first — themselves, their trade, everybody —
    and for each of them a loose layer beats their sheet's row. First hit down
    that list wins the slot, so a trade supplies a coat while one person
    overrides only the hat, and a slot nobody has drawn anywhere keeps the
    built-in. */
function outfitFor(slug, trade, host, onReady) {
  const whos = [slug, trade, "default"].filter(Boolean);
  const rowsOf = new Map();
  const rows = who => {
    if (!rowsOf.has(who)) rowsOf.set(who, sheetRows(wearSheet(who, onReady)));
    return rowsOf.get(who);
  };
  return ROWS.map((slot, i) => {
    let img = null;
    for (const who of whos) {
      img = wearImage(who, slot, onReady) || (rows(who) || [])[i];
      if (img) break;
    }
    if (!img) img = host && host._wear[slot];
    return img ? { img, slot } : null;
  });
}

/*  What sits in front of what, on the STAGE — which is the layer that does not
    pan, unlike the world inside it.

        0   the street: ground, gradients, scenery, people, signposts
        5   the sky: a balloon, a skein of birds — over the street, under the pen
       10   the pen, and whoever is being carried

    Named because "addChildAt(0)" is not layering, it is a guess, and the guess
    was wrong: the street paints an opaque sky over the whole panel, so index 0
    is not "behind everything", it is "invisible". */
const SKY_Z = 5, PEN_Z = 10;

/*  THE SCENERY: STILL THINGS BEHIND THE STREET.

    Everything in this list is drawn once per render into a single Graphics
    that goes in behind the gradients, the scenery, the crowd and the ribbons.
    It is for depth, not for information — nothing here is ever clickable, and
    nothing here means anything.

    To add one, add an entry. That is the whole of it:

        { id: "gulls", on: true, draw(g, s) { … } }

    `draw` gets a Pixi Graphics to paint into and a small kit:
