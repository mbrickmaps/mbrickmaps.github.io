    A docked tile keeps its x, y, w and h untouched, so undocking drops it back
    into the cell it came from. `dock` and `dockSize` are the only additions,
    and a board saved without them reads exactly as it always did.

    The board gets padding rather than a smaller width, so nothing about the
    grid has to know a dock exists. */
const DOCK_SIDES = ["top", "right", "bottom", "left"];
const DOCK_MIN = 90, DOCK_MAX = 0.7;     // px, and a share of the window

function dockedTiles(side) {
  return board.tiles.filter(t => t.dock === side);
}
function dockSizeOf(side) {
  const tiles = dockedTiles(side);
  if (!tiles.length) return 0;
  const across = side === "left" || side === "right";
  const room = (across ? window.innerWidth : window.innerHeight) * DOCK_MAX;
  //  One size per EDGE, taken from the first panel on it: two panels sharing an
  //  edge share its thickness, the way a split pane does.
  return Math.max(DOCK_MIN, Math.min(room, tiles[0].dockSize || (across ? 300 : 240)));
}

function setDock(id, side) {
  const t = board.tiles.find(x => x.id === id);
  if (!t) return;
  if (side && !DOCK_SIDES.includes(side)) return;
  if (side) t.dock = side; else delete t.dock;
  saveBoard();
  renderBoard();
  //  Canvas panels measure themselves against their box, and that box has just
  //  changed shape completely.
  const pr = document.querySelector("#viz-promenade .panel-body");
  if (pr && pr._reflowNow) requestAnimationFrame(pr._reflowNow);
}

/*  The way off an edge, beside the ordinary ✕ rather than instead of it. Two
    glyphs, two meanings: ⊞ goes back to the board, ✕ leaves the board. An
    earlier version hid the ✕ while docked to avoid two crosses in one header,
    which read as a panel you were not allowed to remove.

    Added once and kept, since the header survives a re-render. */
/*  Reused across re-renders rather than recreated: the panel-head survives a
    render, so appending a fresh button each time would pile up duplicates.
    Wanted in two places now, a tile and a rail, which is why it left
    renderBoardTiles. */
function ensureRemoveButton(panel, id) {
  if (panel.querySelector(".panel-head > .tile-remove")) return;
  const rm = document.createElement("button");
  rm.type = "button";
  rm.className = "tile-remove";
  rm.title = "remove from board";
  rm.textContent = "✕";
  rm.addEventListener("click", e => { e.stopPropagation(); removeTile(id); });
  panel.querySelector(".panel-head").appendChild(rm);
}

function addDockPop(panel, id) {
  if (panel.querySelector(".panel-head > .dock-pop")) return;
  const x = document.createElement("button");
  x.type = "button";
  x.className = "dock-pop";
  x.textContent = "⊞";
  x.title = "take it off this edge and put it back on the board";
  x.addEventListener("click", e => { e.stopPropagation(); setDock(id, ""); });
  //  Before the ✕, which owns the corner, so the two never trade places.
  const head = panel.querySelector(".panel-head");
  head.insertBefore(x, head.querySelector(".tile-remove"));
}

function renderDocks() {
  for (const side of DOCK_SIDES) {
    const tiles = dockedTiles(side);
    let rail = document.getElementById("dock-" + side);
    if (!tiles.length) { if (rail) rail.remove(); continue; }
    if (!rail) {
      rail = document.createElement("div");
      rail.id = "dock-" + side;
      rail.className = "dock dock-" + side;
      const grip = document.createElement("div");
      grip.className = "dock-grip";
      grip.title = "drag to resize this edge";
      rail.appendChild(grip);
      wireDockGrip(grip, side);
      document.body.appendChild(rail);
    }
    const size = dockSizeOf(side);
    if (side === "left" || side === "right") rail.style.width = size + "px";
    else rail.style.height = size + "px";

    for (const t of tiles) {
      const panel = document.getElementById(t.id) || buildPanel(panels.get(t.id));
      if (panel.parentElement !== rail) rail.appendChild(panel);
      panel.classList.add("is-docked");
      //  A board restored with this panel already docked never went through
      //  renderBoardTiles, so it has no ✕ yet. Without this it arrives on the
      //  rail with no way off the board at all.
      ensureRemoveButton(panel, t.id);
      addDockPop(panel, t.id);
    }
    //  Panels that left this rail since the last render.
    for (const node of [...rail.querySelectorAll(":scope > .panel")]) {
      if (!tiles.some(t => t.id === node.id)) node.remove();
    }

    /*  The rail's own plus, FIRST rather than last. On the end of a bottom
        rail it lands in the bottom right corner, which is where the minimap
        lives, and a drop target you cannot reach is not one. */
    let slot = rail.querySelector(":scope > .dock-slot");
    if (!slot) {
      slot = document.createElement("button");
      slot.type = "button";
      slot.className = "dock-slot";
      slot.textContent = "+";
      slot.title = "drop a panel here to add it to this edge";
      wireDockTarget(slot, side);
    }
    //  Kept at the head of the rail as panels come and go.
    rail.insertBefore(slot, rail.querySelector(":scope > .panel") || null);
  }

  /*  The page keeps clear of every rail. Set on the documentElement rather
      than the board, because the header and the minimap have to move too. */
  const s = document.body.style;
  s.paddingTop = dockSizeOf("top") + "px";
  s.paddingRight = dockSizeOf("right") + "px";
  s.paddingBottom = dockSizeOf("bottom") + "px";
  s.paddingLeft = dockSizeOf("left") + "px";
}

/*  Dragging the inside edge of a rail. Written onto every tile on that edge,
    so the size belongs to the edge rather than to whichever panel happens to
    be first on it. */
function wireDockGrip(grip, side) {
  let from = 0, start = 0;
  const across = side === "left" || side === "right";
  const move = ev => {
    const now = across ? ev.clientX : ev.clientY;
    const away = (side === "left" || side === "top") ? now - from : from - now;
    const room = (across ? window.innerWidth : window.innerHeight) * DOCK_MAX;
    const size = Math.max(DOCK_MIN, Math.min(room, start + away));
    for (const t of dockedTiles(side)) t.dockSize = size;
    renderDocks();
  };
  const up = () => {
    document.removeEventListener("pointermove", move);
    document.removeEventListener("pointerup", up);
    saveBoard();
    renderMiniMap();
    const pr = document.querySelector("#viz-promenade .panel-body");
    if (pr && pr._reflowNow) pr._reflowNow();
  };
  grip.addEventListener("pointerdown", ev => {
    ev.preventDefault();
    from = across ? ev.clientX : ev.clientY;
    start = dockSizeOf(side);
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
  });
}

/*  THE MINIMAP.

    A board of twenty panels is taller than any window, so "where is the
    Gazetteer" becomes a scroll and a hunt. This is the board at about a
    fiftieth scale in the corner: every tile at its own grid position and
    footprint, which makes it a recognisable shape rather than a legend. You
    already know the Pallet is the tall one second from the left.

    Click a block to bring that panel into view. The lit outline is the part of
    the board you are actually looking at, so the map says where you are as
    well as what there is.

    Built from `board.tiles` and nothing else. It cannot drift from the layout
    because it IS the layout, read at draw time. */
function renderMiniMap() {
  let host = document.getElementById("miniMap");
  if (!host) {
    host = document.createElement("div");
    host.id = "miniMap";
    host.innerHTML = '<div class="mm-grid" data-el="grid"></div>' +
                     '<div class="mm-name" data-el="name"></div>';
    document.body.appendChild(host);
    //  Follows the scroll it is describing, cheaply: the viewport box is the
    //  only thing that moves, and it is one style write.
    window.addEventListener("scroll", () => syncMiniView(), { passive: true });
    window.addEventListener("resize", () => syncMiniView(), { passive: true });

    /*  AND THE OTHER WAY ROUND.

        Hovering a panel lights its block on the map, which is how you learn
        the map: you find the Gazetteer the ordinary way once and see where it
        lives in the little shape. After that you use the map.

        One delegated listener rather than one per panel, and it does nothing
        at all unless the panel under the pointer has changed, so sweeping
        across the board is a string comparison per event. */
    let lastOver = null;
    document.addEventListener("pointerover", ev => {
      const panel = ev.target.closest && ev.target.closest(".panel");
      const id = panel ? panel.id : null;
      if (id === lastOver) return;
      lastOver = id;
      for (const c of document.querySelectorAll(".mm-cell.lit")) c.classList.remove("lit");
      if (!id) return;
      const cell = document.querySelector('.mm-cell[data-id="' + CSS.escape(id) + '"]');
      if (cell) cell.classList.add("lit");
    }, { passive: true });
  }
  const grid = host.querySelector('[data-el="grid"]');
  const name = host.querySelector('[data-el="name"]');
  grid.innerHTML = "";
  host.hidden = board.tiles.length < 2;
  /*  Slid clear of a bottom or right rail. It is fixed to the corner and a
      rail is fixed to the same corner, so without this the map sits under the
      drawer and the one thing that is meant to be reachable is the one thing
      covered. */
  host.style.bottom = (10 + dockSizeOf("bottom")) + "px";
  host.style.right = (10 + dockSizeOf("right")) + "px";
  if (host.hidden) return;

  const rows = board.tiles.reduce((n, t) => Math.max(n, t.y + t.h), 1);
  grid.style.gridTemplateColumns = "repeat(" + board.cols + ", 1fr)";
  grid.style.gridTemplateRows = "repeat(" + rows + ", 1fr)";
  //  Taller boards get a taller map rather than squashed blocks, up to a cap.
  grid.style.height = Math.min(120, Math.max(40, rows * 13)) + "px";

  for (const t of board.tiles) {
    const cell = document.createElement("button");
    cell.type = "button";
    cell.className = "mm-cell";
    cell.style.gridColumn = (t.x + 1) + " / span " + t.w;
    cell.style.gridRow = (t.y + 1) + " / span " + t.h;
    const label = (FOOTPRINTS[t.id] && FOOTPRINTS[t.id].name) || t.id;
    cell.title = label;
    cell.dataset.id = t.id;
    cell.onmouseenter = () => {
      name.textContent = label;
      const node = document.getElementById(t.id);
      if (node) node.classList.add("mm-lit");
    };
    cell.onmouseleave = () => {
      name.textContent = "";
      const node = document.getElementById(t.id);
      if (node) node.classList.remove("mm-lit");
    };
    cell.onclick = () => {
      const node = document.getElementById(t.id);
      if (!node) return;
      node.scrollIntoView({ behavior: "smooth", block: "center", inline: "nearest" });
      /*  A flash, because a smooth scroll ending on a wall of identical panels
          leaves you asking which one you asked for. */
      node.classList.add("mm-ping");
      setTimeout(() => node.classList.remove("mm-ping"), 900);
    };
    grid.appendChild(cell);
  }
  syncMiniView();
}

/*  Which tiles are on screen, and where the window sits over the whole board.
    Measured rather than computed from scroll maths, so a sticky header or a
    board that has not finished laying out cannot put it out by a row. */
function syncMiniView() {
  const host = document.getElementById("miniMap");
  if (!host || host.hidden) return;
  const top = window.scrollY, bot = top + window.innerHeight;
  for (const cell of host.querySelectorAll(".mm-cell")) {
    const node = document.getElementById(cell.dataset.id);
    if (!node) { cell.classList.remove("here"); continue; }
    const r = node.getBoundingClientRect();
    const y0 = r.top + window.scrollY, y1 = y0 + r.height;
    cell.classList.toggle("here", y1 > top && y0 < bot);
  }
}

function renderBoard() {
  renderBoardCells();
  renderBoardTiles();
  renderDocks();
  renderMiniMap();
  const b = boardEl();
  const empty = b.querySelector(".board-empty");
  if (!board.tiles.length) {
    if (!empty) {
      const d = document.createElement("div");
      d.className = "board-empty";
      d.textContent = "Empty board — open Panels and drag one in.";
      b.appendChild(d);
    }
  } else if (empty) empty.remove();
  refreshAll();
  /*  Canvas panels size themselves against the tile, and a ResizeObserver does
      not survive this function re-parenting them. So the board tells them
      directly — it is the only thing that reliably knows the grid moved. */
  const pr = document.querySelector("#viz-promenade .panel-body");
  if (pr && pr._reflowNow) requestAnimationFrame(pr._reflowNow);
}

function renderBoardCardList() {
  const list = el("boardCardList");
  const q = el("boardSearch").value.trim().toLowerCase();
  const available = Object.keys(FOOTPRINTS).filter(id => !isOnBoard(id));
  list.innerHTML = "";
  let shown = 0;

  // Grouped by what a panel does to state, which is a fact about it, rather
  // than by the ad-hoc labels the list used before.
  for (const group of ROLE_ORDER) {
    const ids = available.filter(id => (FOOTPRINTS[id].role || "read") === group.role);
    const visible = q ? ids.filter(id => FOOTPRINTS[id].name.toLowerCase().includes(q)) : ids;
    if (!visible.length) continue;
    const heading = document.createElement("h4");
    heading.className = "board-group-heading";
    heading.textContent = group.title;
    list.appendChild(heading);

    for (const id of visible) {
      const fp = FOOTPRINTS[id];
      const card = document.createElement("div");
      card.className = "board-card";
      card.draggable = true;
      card.dataset.id = id;
      card.innerHTML =
        '<div class="board-card-row">' +
          '<button type="button" class="fp-add" title="add to board">+</button>' +
          '<span class="board-card-name">' + esc(fp.name) + "</span>" +
          '<span class="fp">' +
            '<input type="number" class="fp-w" min="1" max="12" step="1" value="' + fp.w + '" title="width (cells)">' +
            "<span>&times;</span>" +
            '<input type="number" class="fp-h" min="1" max="12" step="1" value="' + fp.h + '" title="height (cells)">' +
          "</span>" +
        "</div>" +
        '<div class="board-card-desc">' + esc(fp.desc || "") + "</div>";

      const wIn = card.querySelector(".fp-w"), hIn = card.querySelector(".fp-h");
      [wIn, hIn].forEach(i => i.addEventListener("mousedown", e => e.stopPropagation()));
      wIn.addEventListener("change", () => { fp.w = Math.max(1, Math.min(12, parseInt(wIn.value, 10) || 1)); wIn.value = fp.w; saveFootprints(); });
      hIn.addEventListener("change", () => { fp.h = Math.max(1, Math.min(12, parseInt(hIn.value, 10) || 1)); hIn.value = fp.h; saveFootprints(); });

      const add = card.querySelector(".fp-add");
      add.addEventListener("mousedown", e => e.stopPropagation());
      add.addEventListener("click", e => {
        e.stopPropagation();
        const slot = findFreeSlot(fp.w, fp.h);
        addTile(id, slot.x, slot.y, fp.w, fp.h);
      });
      list.appendChild(card);
      shown++;
    }
  }
  if (!shown) {
    const none = document.createElement("div");
    none.className = "board-card";
    none.style.cursor = "default";
    none.textContent = board.tiles.length ? "everything is on the board" : "no match";
    list.appendChild(none);
  }
}

function addTile(id, x, y, w, h) {
  const fp = FOOTPRINTS[id];
  if (!fp) return;
  board.tiles.push({ id, x, y, w: Math.min(w || fp.w, board.cols), h: h || fp.h });
  renderBoard(); renderBoardCardList(); saveBoard();
}

function findFreeSlot(w, h) {
  const cw = Math.min(w, board.cols);
  for (let y = 0; y < 999; y++) {
    for (let x = 0; x <= board.cols - cw; x++) {
      if (!overlaps(null, x, y, cw, h)) return { x, y };
    }
  }
  return { x: 0, y: 0 };
}

function moveTile(id, x, y) {
  const t = board.tiles.find(k => k.id === id);
  if (!t) return;
  t.x = x; t.y = y;
  renderBoard(); saveBoard();
}

/* Two tiles of identical footprint exchange positions. Same size is the whole
   condition: neither can then overlap anything the other did not, so the
   exchange needs no repack and can never half-fail. */
function swapTiles(idA, idB) {
  const a = board.tiles.find(k => k.id === idA);
  const b = board.tiles.find(k => k.id === idB);
  if (!a || !b || a === b || a.w !== b.w || a.h !== b.h) return;
  const x = a.x, y = a.y;
  a.x = b.x; a.y = b.y;
  b.x = x;   b.y = y;
  renderBoard(); saveBoard();
}

function removeTile(id) {
  board.tiles = board.tiles.filter(t => t.id !== id);
  // Park the panel rather than destroying it, so its scroll and typed text
  // survive a trip off the board.
  const panel = document.getElementById(id);
  if (panel) {
    const rm = panel.querySelector(".panel-head > .tile-remove");
    if (rm) rm.remove();
    //  A panel removed straight off a rail takes its dock furniture with it,
    //  or it comes back to the board still wearing the undock button.
    const pop = panel.querySelector(".panel-head > .dock-pop");
    if (pop) pop.remove();
    panel.classList.remove("is-docked");
    el("panelStore").appendChild(panel);
  }
  renderBoard(); renderBoardCardList(); saveBoard();
}

function resetBoard() {
  board = JSON.parse(JSON.stringify(DEFAULT_BOARD));
  renderBoard(); renderBoardCardList(); saveBoard();
}

/* ---------- drag: card -> board, and tile -> board ---------- */
let boardDrag = null;

function boardCellUnderPoint(clientX, clientY) {
  const b = boardEl();
  const r = b.getBoundingClientRect();
  const gap = parseFloat(getComputedStyle(b).columnGap) || 14;
  const cellW = (r.width - gap * (board.cols - 1)) / board.cols;
  const cellH = board.rowUnit;
  return { x: Math.floor((clientX - r.left) / (cellW + gap)),
           y: Math.floor((clientY - r.top) / (cellH + gap)) };
}

function tileAtCell(x, y) {
  return board.tiles.find(t => x >= t.x && x < t.x + t.w && y >= t.y && y < t.y + t.h) || null;
}

function updateGhost(clientX, clientY) {
  if (!boardDrag) return;
  const { x, y } = boardCellUnderPoint(clientX, clientY);

  /*  Dragging one tile onto another of the same footprint swaps them, instead
      of being refused as an overlap. Only ever offered for a tile already on
      the board — a card from the flyout has nowhere to send the displaced tile
      back to. Different sizes still refuse: an unequal exchange would have to
      shove a third tile somewhere, and a drop should do exactly what its ghost
      showed. */
  const under = boardDrag.fromTile ? tileAtCell(x, y) : null;
  const swap = under && under !== boardDrag.fromTile &&
               under.w === boardDrag.w && under.h === boardDrag.h ? under : null;

  const cx = swap ? swap.x : Math.max(0, Math.min(board.cols - boardDrag.w, x));
  const cy = swap ? swap.y : Math.max(0, y);
  const bad = !swap &&
              (x < 0 || x > board.cols - boardDrag.w || y < 0 ||
               overlaps(boardDrag.fromTile || null, cx, cy, boardDrag.w, boardDrag.h));
  const g = ghostEl();
  g.hidden = false;
  g.classList.toggle("invalid", bad);
  g.classList.toggle("swap", !!swap);
  g.style.gridColumn = (cx + 1) + " / span " + boardDrag.w;
  g.style.gridRow = (cy + 1) + " / span " + boardDrag.h;
  // The ghost marks where the dragged tile lands; the outline marks the tile
  // being sent the other way, so both halves of the exchange are visible.
  boardEl().querySelectorAll(".board-tile.swap-target")
    .forEach(n => n.classList.remove("swap-target"));
  if (swap) {
    const node = boardEl().querySelector('.board-tile[data-id="' + swap.id + '"]');
    if (node) node.classList.add("swap-target");
  }
  boardDrag.valid = !bad; boardDrag.cx = cx; boardDrag.cy = cy;
  boardDrag.swapWith = swap ? swap.id : null;
}

/*  DROP TARGETS FOR THE EDGES.

    A plus sign at each edge of the window, and one on the end of every rail
    that already has something in it. Drag a panel onto a plus and it docks
    there; a rail's own plus is how a second panel joins it, so an edge can
    hold as many as you like.

    Only visible while you are dragging a panel. Four permanent crosses around
    the window would be four things in the way of a page you are reading. */
function dockTargets() {
  let host = document.getElementById("dockTargets");
  if (!host) {
    host = document.createElement("div");
    host.id = "dockTargets";
    for (const side of DOCK_SIDES) {
      const t = document.createElement("button");
      t.type = "button";
      t.className = "dock-target dock-target-" + side;
      t.dataset.side = side;
      t.textContent = "+";
      t.title = "dock to the " + side;
      wireDockTarget(t, side);
      host.appendChild(t);
    }
    document.body.appendChild(host);
  }
  //  Clear of any rail already on that edge, so the plus for the bottom is
  //  never hidden behind the bottom rail.
  for (const t of host.children) {
    const side = t.dataset.side;
    const off = dockSizeOf(side) + 8;
    if (side === "left" || side === "right") t.style[side] = off + "px";
    else t.style[side] = off + "px";
  }
  return host;
}

/*  Both drags end here. The flyout uses HTML5 drag and drop and a tile already
    on the board is moved with plain mouse events, so a target has to answer to
    either one. */
function wireDockTarget(node, side) {
  const take = () => {
    if (!boardDrag) return false;
    const id = boardDrag.id;
    const known = board.tiles.some(t => t.id === id);
    //  Dragged in from the flyout: it has to be on the board before it can be
    //  docked, and it keeps that cell for when it is undocked again.
    if (!known) {
      const fp = FOOTPRINTS[id] || { w: 1, h: 1 };
      const slot = findFreeSlot(fp.w, fp.h);
      addTile(id, slot.x, slot.y, fp.w, fp.h);
    }
    boardDrag = null;
    setDock(id, side);
    return true;
  };
  node.addEventListener("dragover", e => {
    if (!boardDrag) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    node.classList.add("over");
  });
  node.addEventListener("dragleave", () => node.classList.remove("over"));
  node.addEventListener("drop", e => {
    e.preventDefault();
    node.classList.remove("over");
    if (take()) endBoardDrag(false);
  });
  //  The mouse drag: the pointer is down the whole way, so a plain mouseup on
  //  the target is the drop.
  node.addEventListener("mouseenter", () => { if (boardDrag) node.classList.add("over"); });
  node.addEventListener("mouseleave", () => node.classList.remove("over"));
  node.addEventListener("mouseup", () => {
    node.classList.remove("over");
    if (take()) endBoardDrag(false);
  });
}

function showDockTargets(on) {
  dockTargets().classList.toggle("live", !!on);
  document.body.classList.toggle("panel-dragging", !!on);
}

function endBoardDrag(commit) {
  showDockTargets(false);
  if (boardDrag && commit && boardDrag.valid) {
    if (boardDrag.swapWith) swapTiles(boardDrag.id, boardDrag.swapWith);
    else if (boardDrag.fromTile) moveTile(boardDrag.id, boardDrag.cx, boardDrag.cy);
    else addTile(boardDrag.id, boardDrag.cx, boardDrag.cy, boardDrag.w, boardDrag.h);
  }
  ghostEl().hidden = true;
  document.querySelectorAll(".board-card.dragging, .board-tile.dragging, .board-tile.swap-target")
    .forEach(n => n.classList.remove("dragging", "swap-target"));
  boardDrag = null;
}

/* --------------------------------------------------------------------------
   PANEL BODIES
   -------------------------------------------------------------------------- */

function renderSlotBody(slot, host) {
  /*  A renderer OWNS its element. It is called again on every model change, so
      it must update what is there rather than assume an empty element — a map
      or a canvas cannot be rebuilt sixty times while you type. Only the empty
      placeholder clears the host. */
  if (typeof slot.render === "function") {
    try { slot.render(V(), host); }
    catch (err) {
      // One bad renderer must not take the page down with it.
      host.innerHTML = '<p class="hint" style="color:var(--bad)">Slot “' + esc(slot.id) +
        "” threw: " + esc((err && err.message) || err) + "</p>";
    }
    return;
  }
  const m = V();
  if (!m) return;
  host.innerHTML = "";
  host.innerHTML =
    '<div class="slot-empty">' +
      '<div class="slot-desc">' + esc(slot.description) + "</div>" +
      '<div class="feed">This tile would receive:<br>' +
        "<b>" + m.stats.bricks + "</b> records &middot; <b>" + m.people.length + "</b> people &middot; " +
        "<b>" + m.places.length + "</b> places &middot; <b>" + m.events.length + "</b> events &middot; " +
        "<b>" + m.documents.length + "</b> documents &middot; <b>" + m.census.length + "</b> census<br>" +
        "<b>" + m.entities.length + "</b> entities (" + m.stats.ghosts + " ghost) &middot; " +
        "<b>" + m.edges.length + "</b> edges" +
      "</div>" +
      '<div class="slot-note">Fill this slot:<br><br>' +
        "<code>Brick.viz.register(&quot;" + esc(slot.id) + "&quot;, {<br>" +
        "&nbsp;&nbsp;emoji: &quot;" + slot.emoji + "&quot;, label: &quot;" + esc(slot.label) + "&quot;,<br>" +
        "&nbsp;&nbsp;render(model, el) { /* draw into el */ }<br>});</code><br><br>" +
        "The model is on <code>Brick.model</code>. A new id becomes a new card in the panel list." +
      "</div>" +
    "</div>";
}

/* ---------- filter ---------- */
// A filtered count that looks like a total is how people misread their own
// data, so any panel showing a subset says so.
function noteFiltered(host) {
  if (!host) return;
  const v = V();
  host.hidden = !v.active;
  host.textContent = v.active ? "filtered — " + v.stats.bricks + " of " + state.model.stats.bricks : "";
}

function setFilter(mutate) {
  mutate(state.filter);
  state.model.view = buildView(state.model);
  refreshAll();
  // The top bar is not a panel, so refreshAll() does not reach it — and the
  // Filter panel may not even be on the board.
  if (typeof syncSearchInputs === "function") syncSearchInputs();
}
function toggleIn(set, key) { set.has(key) ? set.delete(key) : set.add(key); }

function renderFilter(body) {
  if (!body.dataset.built) {
    body.dataset.built = "1";
    const t = body.querySelector('[data-el="text"]');
    t.addEventListener("input", () => setFilter(f => { f.text = t.value; }));
    body.querySelector('[data-act="clear"]').onclick = () => {
      body.querySelector('[data-el="text"]').value = "";
      setFilter(f => {
        f.text = ""; f.status = "all"; f.focus = null; f.types.clear(); f.sections.clear();
        f.time.on = false;
      });
    };
  }
  const f = state.filter, all = state.model, view = V();
  const chip = (label, on, attrs, count) =>
    "<button " + attrs + ' class="' + (on ? "on" : "") + '">' + label +
    (count !== undefined ? '<span class="count">' + count + "</span>" : "") + "</button>";

  // Confidence — the cut this whole project is about: what does the tree look
  // like if I only believe what is verified?
  body.querySelector('[data-el="status"]').innerHTML =
    chip("all", f.status === "all", 'data-status="all"') +
    chip("+ verified", f.status === "verified", 'data-status="verified"', all.stats.verified) +
    chip("− draft", f.status === "draft", 'data-status="draft"', all.stats.draft);

  // Emoji alone was not discoverable — the word goes on the chip, and only
  // drops off when the panel is too narrow to hold it.
  body.querySelector('[data-el="types"]').innerHTML = Object.keys(TYPES)
    .filter(k => all.byType[k])
    .map(k => chip(TYPES[k].icon + '<span class="lbl">' + esc(TYPES[k].label) + "</span>",
                   f.types.has(k), 'data-type="' + k + '" title="only ' + esc(TYPES[k].label) + ' bricks"', all.byType[k]))
    .join("");

  // The headings are whatever you decided they mean — a family, a place, a line
  // of thought. One mechanism, because it is all just text.
  const secs = all.sections.filter(Boolean);
  body.querySelector('[data-el="sectionlabel"]').textContent =
    secs.length ? "Your headings (" + secs.length + ")" : "Your headings — none yet";
  body.querySelector('[data-el="sections"]').innerHTML = secs.map(s => {
    const n = all.records.filter(b => b.section === s).length;
    const short = s.length > 26 ? s.slice(0, 25) + "…" : s;
    return chip(esc(short), f.sections.has(s), 'data-section="' + esc(s) + '" title="' + esc(s) + '"', n);
  }).join("");

  renderTimeFilter(body, all);

  const fw = body.querySelector('[data-el="focuswrap"]');
  fw.hidden = !f.focus;
  if (f.focus) {
    const e = all.entities.find(x => x.slug === f.focus);
    body.querySelector('[data-el="focus"]').innerHTML =
      chip((e ? esc(e.name) : esc(f.focus)) + " ✕", true, 'data-focus="clear"');
  }

  /*  The panel's own box is created once and then never re-read the state, so
      a search typed in the top bar left it stale and showing nothing. Push the
      value in on every render, skipping it while focused so it cannot fight
      what is being typed here. */
  const panelSearch = body.querySelector('[data-el="text"]');
  if (panelSearch && document.activeElement !== panelSearch &&
      panelSearch.value !== (state.filter.text || "")) {
    panelSearch.value = state.filter.text || "";
  }
  syncSearchInputs();

  const win = timeWindow(state.filter.time);
  body.querySelector('[data-el="summary"]').textContent = view.active
    ? view.stats.bricks + " of " + all.stats.bricks + " bricks · " +
      view.stats.entities + " of " + all.stats.entities + " entities" +
      (win ? " · " + win[0] + "–" + win[1] + " (undated kept)" : "")
    : "Showing everything — " + all.stats.bricks + " bricks.";

  body.querySelectorAll("[data-status]").forEach(b => b.onclick = () => setFilter(f2 => { f2.status = b.dataset.status; }));
  body.querySelectorAll("[data-type]").forEach(b => b.onclick = () => setFilter(f2 => toggleIn(f2.types, b.dataset.type)));
  body.querySelectorAll("[data-section]").forEach(b => b.onclick = () => setFilter(f2 => toggleIn(f2.sections, b.dataset.section)));
  body.querySelectorAll('[data-focus="clear"]').forEach(b => b.onclick = () => setFilter(f2 => { f2.focus = null; }));
}

// Focusing on a person shows every record that names them — their family as the
// records actually describe it, rather than as a tree asserts it.
/*  Three ways to ask a time question, because they are genuinely different
    questions: a decade ("the 1890s"), an explicit span ("1841 to 1861"), or a
    point with tolerance ("around 1869, give or take 5") — the last being the
    one that matches how an estimated birth year actually behaves. */
function renderTimeFilter(body, model) {
  const t = state.filter.time;
  const [lo, hi] = yearExtent(model);
  // Keep the stored values inside whatever the data actually spans.
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  t.min = clamp(t.min, lo, hi); t.max = clamp(t.max, lo, hi);
  if (t.min > t.max) t.min = t.max;
  t.year = clamp(t.year, lo, hi);
  t.decade = clamp(Math.floor(t.decade / 10) * 10, Math.floor(lo / 10) * 10, Math.floor(hi / 10) * 10);

  const modes = body.querySelector('[data-el="timemode"]');
  modes.innerHTML =
    '<button data-tmode="off" class="' + (t.on ? "" : "on") + '">off</button>' +
    '<button data-tmode="decade" class="' + (t.on && t.mode === "decade" ? "on" : "") + '">decade</button>' +
    '<button data-tmode="range" class="' + (t.on && t.mode === "range" ? "on" : "") + '">range</button>' +
    '<button data-tmode="around" class="' + (t.on && t.mode === "around" ? "on" : "") + '">± years</button>';
  modes.querySelectorAll("[data-tmode]").forEach(b => b.onclick = () => setFilter(f => {
    if (b.dataset.tmode === "off") f.time.on = false;
    else { f.time.on = true; f.time.mode = b.dataset.tmode; }
  }));

  const host = body.querySelector('[data-el="timebody"]');
  if (!t.on) { host.innerHTML = ""; return; }

  const slider = (key, min, max, step, label) =>
    '<div class="time-row"><span class="time-sub">' + label + "</span>" +
    '<input type="range" data-tkey="' + key + '" min="' + min + '" max="' + max +
    '" step="' + step + '" value="' + t[key] + '">' +
    '<span class="time-read" data-tread="' + key + '"></span></div>';

  if (t.mode === "decade") {
    host.innerHTML = slider("decade", Math.floor(lo / 10) * 10, Math.floor(hi / 10) * 10, 10, "");
  } else if (t.mode === "around") {
    host.innerHTML = slider("year", lo, hi, 1, "yr") + slider("span", 0, 50, 1, "±");
  } else {
    host.innerHTML = slider("min", lo, hi, 1, "from") + slider("max", lo, hi, 1, "to");
  }

  const readouts = () => {
    host.querySelectorAll("[data-tread]").forEach(el => {
      const k = el.dataset.tread;
      el.textContent = k === "decade" ? t.decade + "s" : k === "span" ? "±" + t.span : String(t[k]);
    });
  };
  readouts();

  host.querySelectorAll("[data-tkey]").forEach(inp => {
    // 'input' so the map and lists move as the slider moves, not on release.
    inp.addEventListener("input", () => {
      const k = inp.dataset.tkey;
      t[k] = Number(inp.value);
      // from/to must not cross over each other.
      if (k === "min" && t.min > t.max) t.max = t.min;
      if (k === "max" && t.max < t.min) t.min = t.max;
      readouts();
      state.model.view = buildView(state.model);
      refreshAllExcept("filter");
      pushPlacesToMap();
    });
  });
}

/*  Everything except the panel holding the control being dragged. Re-rendering
    the Filter panel mid-drag would replace the slider element under the
    pointer and the drag would stop dead. */
function refreshAllExcept(skipId) {
  for (const node of document.querySelectorAll(".board-tile > .panel")) {
    if (node.id !== skipId) refreshPanel(node.id);
  }
}

function focusEntity(slug) { setFilter(f => { f.focus = f.focus === slug ? null : slug; }); }

/* ---------- document viewer ----------
   One document, large: the scan on the left of your eye and what you wrote
   about it underneath, so the claim and its evidence are on screen together.

   Selection is by line number rather than by index, because the list of
   documents changes shape as you filter and an index would silently point at a
   different record. */
let selectedDoc = null;   // line number, never an index into a filtered list

/*  The scan on a canvas: wheel to zoom, drag to pan, Fit and 1:1.

    Same zoom-to-cursor arithmetic as the collage clipper —
    `pan = c - (z1/z0) * (c - pan)` keeps whatever is under the pointer
    pinned there while the scale changes, which is the whole difference
    between zooming and jumping.

    The buffer is sized in device pixels so a census page at 1:1 shows the
    ink, not a resampled blur — the entire reason for reading a scan at all. */
const docView = { img: null, natW: 0, natH: 0, zoom: 1, panX: 0, panY: 0, src: "", fitted: false };
/*  A REFERENCE IMAGE, IN THE VIEWER THAT ALREADY EXISTS.

    Drawing a kirk from a photograph wants exactly what this panel already does
    — an image, zoomable, pannable, big — and building a second panel for it
    would have been a second copy of that viewport to keep in step. So a local
    file can be put into this one directly. It is not a document: it belongs to
    no brick, it is never written anywhere, and it holds the viewport until you
    clear it.

    An object URL rather than a data URL, and session-only. A photograph is
    megabytes and this browser's storage is the pile's; a reference is
    something you have on screen while you draw, not something you keep. */
let docRef = "", docRefName = "";
// Sources (a thumbnail grid of every scan) was removed — the Document panel and
// its arrows are the only way to reach a scan now.

function docCanvasEls(body) {
  return { vp: body.querySelector('[data-el="viewport"]'), cv: body.querySelector('[data-el="canvas"]') };
}

function resizeDocCanvas(body) {
  const { vp, cv } = docCanvasEls(body);
  const dpr = window.devicePixelRatio || 1;
  const w = vp.clientWidth, h = vp.clientHeight;
  if (!w || !h) return false;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  return true;
}

function drawDoc(body) {
  const { cv } = docCanvasEls(body);
  const ctx = cv.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (!docView.img) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.translate(docView.panX, docView.panY);
  ctx.scale(docView.zoom, docView.zoom);
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(docView.img, 0, 0);
  const lab = body.querySelector('[data-el="zoomlabel"]');
  if (lab) lab.textContent = Math.round(docView.zoom * 100) + "%";
}

function fitDoc(body) {
  const { vp } = docCanvasEls(body);
  const vw = vp.clientWidth, vh = vp.clientHeight;
  if (!docView.img || !vw || !vh) { docView.zoom = 1; docView.panX = docView.panY = 0; return drawDoc(body); }
  // Never fit *up*: a small thumbnail blown out to fill the panel just looks
  // like a bad scan.
  docView.zoom = Math.min(vw / docView.natW, vh / docView.natH, 1) || 1;
  docView.panX = (vw - docView.natW * docView.zoom) / 2;
  docView.panY = (vh - docView.natH * docView.zoom) / 2;
  // A panel built while its tile has no width (off-screen, collapsed pane, a
  // hidden board) would fit against zero and keep that bogus scale forever.
  // Record whether this fit was real, so the resize observer can redo it.
  docView.fitted = vw > 0 && vh > 0;
  drawDoc(body);
}

function zoomDocBy(body, factor, ox, oy) {
  const { vp } = docCanvasEls(body);
  const cx = ox === undefined ? vp.clientWidth / 2 : ox;
  const cy = oy === undefined ? vp.clientHeight / 2 : oy;
  const z0 = docView.zoom;
  const z1 = Math.min(16, Math.max(0.05, z0 * factor));
  docView.panX = cx - (z1 / z0) * (cx - docView.panX);
  docView.panY = cy - (z1 / z0) * (cy - docView.panY);
  docView.zoom = z1;
  drawDoc(body);
}

function loadDocImage(body, src) {
  const overlay = body.querySelector('[data-el="overlay"]');
  if (docView.src === src) return;          // same scan; keep the reader's zoom
  docView.src = src;
  const url = resolveSrc(src);
  docView.img = null;
  if (!src) {
    overlay.hidden = false;
    overlay.className = "doc-overlay";
    overlay.textContent = "No scan attached. Add a URL or an image path to the brick and it appears here.";
    drawDoc(body);
    return;
  }
  overlay.hidden = false;
  overlay.className = "doc-overlay";
  overlay.textContent = "loading…";
  const img = new Image();
  // Deliberately NOT setting crossOrigin: it would make images fail to load
  // from any host without CORS headers, and nothing here reads pixels back.
  img.onload = () => {
    if (docView.src !== src) return;        // a faster click won the race
    docView.img = img;
    docView.natW = img.naturalWidth; docView.natH = img.naturalHeight;
    overlay.hidden = true;
    resizeDocCanvas(body);
    fitDoc(body);
  };
  img.onerror = () => {
    if (docView.src !== src) return;
    overlay.className = "doc-overlay bad";
    overlay.textContent = "Source will not load: " + src;
    drawDoc(body);
  };
  img.src = url;
}

function wireDocViewport(body) {
  const { vp } = docCanvasEls(body);

  vp.addEventListener("wheel", e => {
    if (!docView.img) return;
    e.preventDefault();
    const r = vp.getBoundingClientRect();
    zoomDocBy(body, e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });

  vp.addEventListener("pointerdown", e => {
    if (!docView.img || e.button !== 0) return;
    // The panel header drag moves the tile; this must not also start one.
    e.stopPropagation();
    vp.setPointerCapture(e.pointerId);
    vp.classList.add("panning");
    let lx = e.clientX, ly = e.clientY;
    const move = ev => {
      docView.panX += ev.clientX - lx;
      docView.panY += ev.clientY - ly;
      lx = ev.clientX; ly = ev.clientY;
      drawDoc(body);
    };
    const up = () => {
      vp.classList.remove("panning");
      vp.removeEventListener("pointermove", move);
      vp.removeEventListener("pointerup", up);
      vp.removeEventListener("pointercancel", up);
    };
    vp.addEventListener("pointermove", move);
    vp.addEventListener("pointerup", up);
    vp.addEventListener("pointercancel", up);
  });

  vp.addEventListener("dblclick", () => fitDoc(body));

  body.querySelector('[data-act="zoomin"]').onclick = () => zoomDocBy(body, 1.3);
  body.querySelector('[data-act="zoomout"]').onclick = () => zoomDocBy(body, 1 / 1.3);
  body.querySelector('[data-act="fit"]').onclick = () => fitDoc(body);
  body.querySelector('[data-act="actual"]').onclick = () => {
    const z0 = docView.zoom;
    zoomDocBy(body, 1 / z0);               // back to exactly 100%, about the center
  };

  // The tile can be resized by a column or a row at any time; the buffer has to
  // follow or the scan goes soft.
  if (window.ResizeObserver) {
    new ResizeObserver(() => {
      if (!resizeDocCanvas(body)) return;
      // First time it has a real size, fit properly rather than redrawing a
      // scale that was computed against nothing.
      if (docView.img && !docView.fitted) fitDoc(body);
      else drawDoc(body);
    }).observe(vp);
  }
}

// The documents the viewer can step through — whatever the current filter left
// standing, so the viewer obeys the filter like every other panel.
function viewableDocs() {
  return V().records.filter(b => b.kind === "document" || safeSrc(b.src));
}

function selectDocument(lineNumber) {
  selectedDoc = lineNumber;
  const panel = document.getElementById("document");
  if (!panel || !panel.closest(".board-tile")) Brick.place("document");
  refreshPanel("document");
  const p = document.getElementById("document");
  if (p) p.scrollIntoView({ block: "nearest" });
}

function stepDocument(dir) {
  const docs = viewableDocs();
  if (!docs.length) return;
  const at = docs.findIndex(d => d.lineNumber === selectedDoc);
  const next = at === -1 ? 0 : (at + dir + docs.length) % docs.length;
  selectDocument(docs[next].lineNumber);
}

function setDocRef(body, file) {
  if (docRef) URL.revokeObjectURL(docRef);    // the old one is unreachable now
  docRef = file ? URL.createObjectURL(file) : "";
  docRefName = file ? file.name : "";
  docView.fitted = false;                     // a new image gets a new fit
  renderDocument(body);
}

function renderDocument(body) {
  if (!body.dataset.built) {
    body.dataset.built = "1";
    body.querySelector('[data-act="prev"]').onclick = () => stepDocument(-1);
    body.querySelector('[data-act="next"]').onclick = () => stepDocument(1);
    const refFile = body.querySelector('[data-el="reffile"]');
    body.querySelector('[data-act="ref"]').onclick = () => {
      if (docRef) setDocRef(body, null);
      else refFile.click();
    };
    refFile.onchange = () => {
      const f = refFile.files && refFile.files[0];
      if (f) setDocRef(body, f);
      refFile.value = "";                     // so the same file can be picked twice
    };
    /*  Dropping onto the viewport is the obvious gesture and costs two lines.
        preventDefault on dragover as well, or the browser navigates to the
        file and takes the whole pile off screen with it. */
    const vp = body.querySelector('[data-el="viewport"]');
    vp.addEventListener("dragover", e => e.preventDefault());
    vp.addEventListener("drop", e => {
      e.preventDefault();
      const f = [...((e.dataTransfer && e.dataTransfer.files) || [])]
        .find(x => /^image\//.test(x.type));
      if (f) setDocRef(body, f);
    });
    wireDocViewport(body);
    resizeDocCanvas(body);
  }
  // ResizeObserver is the usual path, but its callbacks are throttled while the
  // page is not being painted (hidden tab, collapsed pane), so a panel built in
  // that state would keep a scale computed against zero width. Re-check on every
  // render too: cheap, and it does not depend on the observer having run.
  if (docView.img && !docView.fitted && resizeDocCanvas(body)) fitDoc(body);
  const docs = viewableDocs();
  const b = docs.find(d => d.lineNumber === selectedDoc) || docs[0] || null;
  const view = body.querySelector('[data-el="view"]');
  const openBtn = body.querySelector('[data-act="open"]');
  const editBtn = body.querySelector('[data-act="edit"]');

  /*  A reference outranks the document, and it has to be checked BEFORE the
      "no documents" bail below — an empty pile is exactly when you are most
      likely to be drawing from a photograph, and that return was throwing the
      reference off the screen the moment it was dropped. */
  const refBtn = body.querySelector('[data-act="ref"]');
  refBtn.textContent = docRef ? "clear ref" : "ref\u2026";
  if (docRef) {
    body.querySelector('[data-el="pos"]').textContent = docRefName;
    openBtn.hidden = editBtn.hidden = true;
    body.querySelector('[data-el="overlay"]').hidden = true;
    loadDocImage(body, docRef);
    view.innerHTML = "";
    return;
  }

  if (!b) {
    body.querySelector('[data-el="pos"]').textContent = "";
    openBtn.hidden = editBtn.hidden = true;
    loadDocImage(body, "");
    body.querySelector('[data-el="overlay"]').textContent =
      "No documents in view." + (V().active ? " The filter may be hiding them." : "");
    view.innerHTML = "";
    return;
  }
  // Keep the selection honest: if the filter removed what was selected, the
  // viewer has moved on, and the position indicator must agree.
  selectedDoc = b.lineNumber;
  const at = docs.findIndex(d => d.lineNumber === b.lineNumber);
  body.querySelector('[data-el="pos"]').textContent = (at + 1) + " / " + docs.length;

  const src = safeSrc(b.src);
  openBtn.hidden = !src;
  openBtn.onclick = () => window.open(src, "_blank", "noopener,noreferrer");
  editBtn.hidden = false;
  editBtn.onclick = () => loadBrickIntoBuilder(b.lineNumber);

  view.innerHTML = "";

  // Only images go on the canvas. A PDF or a catalog URL is still a source
  // worth recording — it just gets a link rather than a viewport.
  if (src && isImageSrc(src)) {
    loadDocImage(body, src);
  } else {
    loadDocImage(body, "");
    if (src) {
      const o = body.querySelector('[data-el="overlay"]');
      o.hidden = false;
      o.className = "doc-overlay";
      o.textContent = "Not an image — use “open ↗” for " + src;
    }
  }

  const raw = document.createElement("div");
  raw.className = "doc-raw" + (b.status === "draft" ? " draft" : "");
  raw.textContent = b.raw.trim();
  view.appendChild(raw);

  const meta = document.createElement("dl");
  meta.className = "doc-meta";
  const rows = [
    ["line", "L" + b.lineNumber],
    ["status", b.status === "verified" ? "+ verified" : "− draft"],
    ["kind", b.subtype ? (TYPES[b.subtype] ? TYPES[b.subtype].label : b.subtype) : TYPES[b.type].label],
    ["source", b.detail || b.text[0] || "— (no citation recorded)"],
    ["date", b.date || "—"],
    ["heading", b.section || "—"],
    ["cite as", b.alias ? "@" + b.alias.slug : "— (give it a uid to cite it)"],
  ];
  for (const [k, v] of rows) {
    const dt = document.createElement("dt"); dt.textContent = k;
    const dd = document.createElement("dd"); dd.textContent = v;
    meta.append(dt, dd);
  }
  // Where you got it, as a link you can actually follow back.
  if (safeSrc(b.url)) {
    const dt = document.createElement("dt"); dt.textContent = "source";
    const dd = document.createElement("dd");
    const a = document.createElement("a");
    a.href = safeSrc(b.url);
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.textContent = b.url.replace(/^https?:\/\//, "").slice(0, 60);
    a.style.color = "var(--accent2)";
    dd.appendChild(a);
    meta.append(dt, dd);
  }
  view.appendChild(meta);

  if (b.links.length) {
    const lab = document.createElement("dt");
    lab.className = "flt-label";
    lab.textContent = "names " + b.links.length + " " + (b.links.length === 1 ? "person" : "people");
    const names = document.createElement("div");
    names.className = "doc-names";
    for (const slug of b.links) {
      const e = state.model.entities.find(x => x.slug === slug);
      const btn = document.createElement("button");
      btn.textContent = e ? e.name : slug;
      if (e && !e.declared) {
        btn.classList.add("ghost");
        btn.title = "ghost — named here but never declared";
      } else btn.title = "show only records naming them";
      btn.onclick = () => focusEntity(slug);
      names.appendChild(btn);
    }
    view.append(lab, names);
  }
}

/* ---------- timeline panel ---------- */
function renderTimeline(body) {
  const model = V();
  const lanes = timelineLanes(model);
  const detail = body.querySelector('[data-el="detail"]');
  const scale = body.querySelector('[data-el="scale"]');
  const host = body.querySelector('[data-el="lanes"]');

  if (!lanes.length) {
    scale.innerHTML = "";
    host.innerHTML = '<div class="tl-empty">Nothing dated in view.</div>';
    return;
  }

  const years = lanes.flatMap(l => l.events.map(e => e.year));
  let lo = Math.min(...years), hi = Math.max(...years);
  // A single year would divide by zero; give it a nominal decade of room.
  if (lo === hi) { lo -= 5; hi += 5; }
  /*  Marks are positioned by their CENTER, so a year at 0% or 100% would hang
      half outside the track and get clipped. Plot into an inset band instead
      of the full width, leaving room for the dot's radius at both ends. */
  const PAD = 6;   // percent of track width reserved at each end
  const pct = y => PAD + ((y - lo) / (hi - lo)) * (100 - PAD * 2);

  // Round ticks so the axis reads in whole decades rather than at whatever
  // years the data happens to start and end on.
  const step = Math.max(10, Math.ceil((hi - lo) / 5 / 10) * 10);
  let ticks = "";
  for (let y = Math.ceil(lo / step) * step; y <= hi; y += step) {
    ticks += '<span class="tl-tick" style="left:' + pct(y).toFixed(2) + '%">' + y + "</span>";
  }
  scale.innerHTML = ticks;

  host.innerHTML = "";
  for (const lane of lanes) {
    const row = document.createElement("div");
    row.className = "tl-lane";

    // Computed before the name, which reports the span in its hover summary.
    const first = lane.events[0].year, last = lane.events[lane.events.length - 1].year;

    const name = document.createElement("span");
    name.className = "tl-name";
    name.textContent = lane.entity ? lane.entity.name : "— no person —";
    if (lane.entity) {
      const e = lane.entity;
      const life = lifeSummary(e);
      const summary = e.name + (life ? " · " + life : "") + " · " +
                      lane.events.length + " dated record" +
                      (lane.events.length === 1 ? "" : "s") +
                      (last > first ? " · " + first + "–" + last : " · " + first) +
                      " · click to focus";
      name.onmouseenter = () => { detail.textContent = summary; };
      name.onmouseleave = () => { detail.innerHTML = "&nbsp;"; };
      name.onclick = () => focusEntity(e.slug);
    } else {
      name.onmouseenter = () => { detail.textContent = "dated records that name nobody"; };
      name.onmouseleave = () => { detail.innerHTML = "&nbsp;"; };
      name.style.cursor = "default";
    }
    row.appendChild(name);

    const track = document.createElement("div");
    track.className = "tl-track";
    if (last > first) {
      const span = document.createElement("div");
      span.className = "tl-span";
      span.style.left = pct(first).toFixed(2) + "%";
      span.style.width = (pct(last) - pct(first)).toFixed(2) + "%";
      track.appendChild(span);
    }

    for (const evt of lane.events) {
      const b = evt.brick;
      const dot = document.createElement("div");
      dot.className = "tl-dot" + (b.status === "verified" ? " verified" : "") + (evt.loose ? " loose" : "");
      dot.style.left = pct(evt.year).toFixed(2) + "%";
      // Age is only meaningful in a person's own lane — in the "no person"
      // lane there is nobody to be that age.
      const age = lane.entity ? ageAt(lane.entity, evt.year) : "";
      const text = evt.year + (evt.loose ? " (from a note)" : "") + " · " +
                   (b.icon || "") + " " + (b.name || b.type) +
                   (age !== "" ? " · aged " + age : "") +
                   (b.detail ? " — " + b.detail : "");
      // No title attribute: the browser's own tooltip duplicates the detail
      // line, arrives late, and cannot be styled.
      dot.onmouseenter = () => { detail.textContent = text; };
      dot.onmouseleave = () => { detail.innerHTML = "&nbsp;"; };
      dot.onclick = () => loadBrickIntoBuilder(b.lineNumber);
      track.appendChild(dot);
    }
    row.appendChild(track);
    host.appendChild(row);
  }
}

/* ---------- story ---------- */

/*  Playing is a chain of timers rather than one clock, because a beat's hold
    is its own and the next one starts when it ends. Kept on the module so a
    re-render of the panel cannot leave a second story running behind the
    first. */
let STORY_AT = -1, STORY_TIMER = null;
//  Files the last open could make nothing of, reported on the panel rather
//  than swallowed: silently ignoring four of six selected files is worse than
//  loading none of them.
let STORY_BAD = 0;

function storyStop() {
  clearTimeout(STORY_TIMER);
  STORY_TIMER = null;
  STORY_AT = -1;
  if (PROM_HOST) {
    if (PROM_HOST._say) PROM_HOST._say("");
    if (PROM_HOST._setPretty) PROM_HOST._setPretty(false);
  }
  refreshPanel("viz-story");
}

function storyPlay(from) {
  if (!PROM_HOST || !PROM_HOST._cut || !STORY.order.length) return false;
  clearTimeout(STORY_TIMER);
  PROM_HOST._setPretty(true);
  const run = i => {
    if (i >= STORY.order.length) { storyStop(); return; }
    const sc = STORY.scenes[STORY.order[i]];
    //  A dangling id is skipped rather than stopping the show. It can only
    //  happen to a hand-edited file, and one bad line should not end the story.
    if (!sc) { run(i + 1); return; }
    STORY_AT = i;
    PROM_HOST._cut(sc);
    refreshPanel("viz-story");
    STORY_TIMER = setTimeout(() => run(i + 1), Math.max(500, sc.hold * 1000));
  };
  run(Math.max(0, from || 0));
  return true;
}

/*  SWAPPING THROUGH THEM BY HAND.

    The other way to watch a story, and the one you use while you are building
    it: step to the next scene and stay there. Stepping cancels a play in
    progress rather than racing it, and leaves the controls alone, because you
    are still working on the thing. */
function storyStep(delta) {
  if (!PROM_HOST || !PROM_HOST._cut || !STORY.order.length) return;
  clearTimeout(STORY_TIMER);
  STORY_TIMER = null;
  let i = STORY_AT < 0 ? (delta > 0 ? 0 : STORY.order.length - 1) : STORY_AT + delta;
  i = Math.max(0, Math.min(STORY.order.length - 1, i));
  STORY_AT = i;
  const sc = STORY.scenes[STORY.order[i]];
  if (sc) PROM_HOST._cut(sc);
  refreshPanel("viz-story");
}

/*  Both ways of making a scene end here: keep it in the library, and put it on
    the end of the running order, because you almost always want the thing you
    just made to be in the show. */
function storyAdd(scene) {
  const id = newSceneId();
  STORY.scenes[id] = cleanScene(scene);
  STORY.order.push(id);
  saveStory();
  refreshPanel("viz-story");
  return id;
}

function renderStory(model, host) {
  if (!host.dataset.built) {
    host.dataset.built = "1";
    host.innerHTML =
      '<div class="st-root">' +
        '<div class="st-bar">' +
          '<input class="st-title" data-el="title" type="text" placeholder="untitled story">' +
          '<button data-act="prev" type="button" title="the scene before">◀</button>' +
          '<button data-act="play" type="button">▶ play</button>' +
          '<button data-act="next" type="button" title="the scene after">▶|</button>' +
          '<button data-act="stop" type="button">■</button>' +
          '<button data-act="grab" type="button" title="take the street as it stands as a new scene, without saving a file">● record</button>' +
          '<button data-act="save" type="button" title="write story.json">save</button>' +
          '<label class="st-load" title="open scene files saved from the Promenade, ' +
            'or a whole story.json">open scenes…' +
            '<input type="file" accept=".json,application/json" multiple hidden></label>' +
        "</div>" +
        '<div class="st-note" data-el="note"></div>' +
        '<div class="st-order" data-el="order"></div>' +
        '<div class="st-lib"><span>scenes you have saved</span><div data-el="lib"></div></div>' +
      "</div>";

    const t = host.querySelector('[data-el="title"]');
    t.addEventListener("input", () => { STORY.title = t.value; saveStory(); });

    host.querySelector('[data-act="play"]').onclick = () => storyPlay(0);
    host.querySelector('[data-act="stop"]').onclick = () => storyStop();
    host.querySelector('[data-act="prev"]').onclick = () => storyStep(-1);
    host.querySelector('[data-act="next"]').onclick = () => storyStep(1);
    host.querySelector('[data-act="grab"]').onclick = () => {
      if (!PROM_HOST || !PROM_HOST._capture) return;
      storyAdd({ name: "", say: "", hold: 6, state: PROM_HOST._capture() });
    };
    host.querySelector('[data-act="save"]').onclick = () => {
      const blob = new Blob([JSON.stringify(STORY, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = (slugify(STORY.title) || "story") + ".json";
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    };
    /*  TAKES BOTH KINDS OF FILE, AND ANY NUMBER OF THEM.

        A story.json is the whole show and replaces what is here. A scene file
        saved from the Promenade is one arrangement, so each one becomes a
        scene on the end of the order: select six and you have a six-scene
        story in the order you picked them. The two are told apart by shape,
        since only a story carries `scenes` or `beats`.

        The name comes from inside the file if it has one and from the filename
        if it does not, which is why the Promenade writes the name in. */
    host.querySelector(".st-load input").addEventListener("change", ev => {
      const files = [...(ev.target.files || [])];
      ev.target.value = "";
      if (!files.length) return;
      Promise.all(files.map(f => f.text().then(
        txt => { try { return { f, raw: JSON.parse(txt) }; } catch (e) { return null; } }
      ))).then(got => {
        let added = 0, bad = 0;
        for (const item of got) {
          if (!item || !item.raw) { bad++; continue; }
          const asStory = adoptStory(item.raw);
          if (asStory) { STORY = asStory; added++; continue; }
          if (item.raw.promenade || item.raw.columns) {
            const name = String(item.raw.sceneName ||
              item.f.name.replace(/\.(scene\.)?json$/i, "")).slice(0, 60);
            const id = newSceneId();
            STORY.scenes[id] = cleanScene({ name, say: "", hold: 6, state: item.raw });
            STORY.order.push(id);
            added++;
            continue;
          }
          bad++;
        }
        STORY_BAD = bad;
        if (added || bad) { saveStory(); refreshPanel("viz-story"); }
      });
    });
  }

  host.querySelector('[data-el="title"]').value = STORY.title;

  const ids = Object.keys(STORY.scenes);
  const held = STORY.order.reduce((n, id) => n + ((STORY.scenes[id] || {}).hold || 0), 0);
  host.querySelector('[data-el="note"]').textContent = !PROM_HOST
    ? "Put the Promenade on the board and the story has somewhere to play."
    : STORY.order.length
      ? STORY.order.length + (STORY.order.length === 1 ? " scene" : " scenes") +
        " in the order · " + Math.round(held) + "s · " +
        (STORY_AT >= 0 ? "showing " + (STORY_AT + 1) : ids.length + " saved") +
        (STORY_BAD ? (STORY_BAD === 1 ? " · one file was not a scene"
                                      : " · " + STORY_BAD + " files were not scenes") : "")
      : ids.length
        ? "Nothing in the order yet. Click a saved scene to put it in the show."
        : "Save scenes from the Promenade, then open them here. Or press record " +
          "to take the street as it stands.";

  /*  THE RUNNING ORDER. A row is a position in the show rather than a scene:
      taking one out leaves the scene saved, and the same scene appearing twice
      is two rows over one entry. */
  const order = host.querySelector('[data-el="order"]');
  order.innerHTML = "";
  STORY.order.forEach((id, i) => {
    const sc = STORY.scenes[id];
    const row = document.createElement("div");
    row.className = "st-beat" + (i === STORY_AT ? " on" : "") + (sc ? "" : " gone");

    const head = document.createElement("div");
    head.className = "st-head";
    head.innerHTML = '<span class="st-n">' + (i + 1) + "</span>";
    row.appendChild(head);

    if (!sc) {
      const missing = document.createElement("span");
      missing.className = "st-missing";
      missing.textContent = "a scene that is no longer here";
      head.appendChild(missing);
      const drop = document.createElement("button");
      drop.type = "button"; drop.textContent = "✕";
      drop.onclick = () => { STORY.order.splice(i, 1); saveStory(); refreshPanel("viz-story"); };
      head.appendChild(drop);
      order.appendChild(row);
      return;
    }

    const name = document.createElement("input");
    name.type = "text"; name.className = "st-name"; name.value = sc.name;
    name.title = "what this scene is called";
    name.oninput = () => { sc.name = name.value.slice(0, 60); saveStory(); };
    head.appendChild(name);

    const mk = (label, title, fn) => {
      const x = document.createElement("button");
      x.type = "button"; x.textContent = label; x.title = title; x.onclick = fn;
      head.appendChild(x);
    };
    mk("↑", "earlier", () => {
      if (i === 0) return;
      STORY.order.splice(i - 1, 0, STORY.order.splice(i, 1)[0]);
      saveStory(); refreshPanel("viz-story");
    });
    mk("↓", "later", () => {
      if (i === STORY.order.length - 1) return;
      STORY.order.splice(i + 1, 0, STORY.order.splice(i, 1)[0]);
      saveStory(); refreshPanel("viz-story");
    });
    mk("▸", "play from here", () => storyPlay(i));
    mk("✕", "take out of the order, keep the scene", () => {
      STORY.order.splice(i, 1); saveStory(); refreshPanel("viz-story");
    });

    const say = document.createElement("input");
    say.type = "text"; say.className = "st-say"; say.value = sc.say;
    say.placeholder = "caption, or nothing";
    say.oninput = () => { sc.say = say.value.slice(0, 400); saveStory(); };
    row.appendChild(say);

    const foot = document.createElement("div");
    foot.className = "st-foot";

    const hold = document.createElement("input");
    hold.type = "number"; hold.className = "st-hold";
    hold.min = "0.5"; hold.max = "600"; hold.step = "0.5"; hold.value = sc.hold;
    hold.title = "seconds to hold";
    hold.onchange = () => {
      sc.hold = cleanBeat({ hold: hold.value }).hold; hold.value = sc.hold; saveStory();
    };
    foot.appendChild(hold);
    foot.appendChild(document.createTextNode("s"));

    /*  Two things you can do to a saved street: go and look at it, or replace
        it with what you are looking at now. Between them they are the whole of
        editing a scene, because a scene is not a form. */
    const act = (label, title, fn) => {
      const x = document.createElement("button");
      x.type = "button"; x.className = "st-act";
      x.textContent = label; x.title = title; x.onclick = fn;
      foot.appendChild(x);
    };
    act("go", "put this scene on the street", () => {
      if (PROM_HOST && PROM_HOST._cut) { storyStop(); PROM_HOST._cut(sc); }
    });
    act("re-record", "replace this scene with the street as it stands now", () => {
      if (!PROM_HOST || !PROM_HOST._capture) return;
      sc.state = PROM_HOST._capture();
      saveStory(); refreshPanel("viz-story");
    });

    const what = sc.state && sc.state.promenade ? sc.state : null;
    if (what) {
      const sum = document.createElement("span");
      sum.className = "st-who";
      const pins = (what.promenade.pins || []).length;
      const v = what.view || {};
      sum.textContent = pins + " placed · " + (v.night ? "night" : "day") +
                        (v.zoom > 1 ? " · " + v.zoom + "×" : "");
      foot.appendChild(sum);
    }

    const uses = STORY.order.filter(x => x === id).length;
    if (uses > 1) {
      const many = document.createElement("span");
      many.className = "st-uses";
      many.textContent = "used " + uses + "×";
      many.title = "editing this changes every place it plays";
      foot.appendChild(many);
    }
    row.appendChild(foot);
    order.appendChild(row);
  });

  /*  THE LIBRARY. Click one to put it in the show; a scene can be in the order
      as many times as you like. The ✕ is the only destructive control here, so
      it says how many places it is about to empty. */
  const lib = host.querySelector('[data-el="lib"]');
  lib.innerHTML = "";
  if (!ids.length) lib.innerHTML = '<span class="st-empty">Nothing saved yet.</span>';
  for (const id of ids) {
    const sc = STORY.scenes[id];
    const chip = document.createElement("span");
    chip.className = "st-chip" + (STORY.order.includes(id) ? " in" : "");

    const add = document.createElement("button");
    add.type = "button"; add.className = "st-chip-add";
    add.textContent = sc.name;
    add.title = "put this scene in the order";
    add.onclick = () => { STORY.order.push(id); saveStory(); refreshPanel("viz-story"); };
    chip.appendChild(add);

    const del = document.createElement("button");
    del.type = "button"; del.className = "st-chip-x";
    del.textContent = "✕";
    const uses = STORY.order.filter(x => x === id).length;
    del.title = uses ? "delete the scene, and the " + uses + " place" +
                       (uses === 1 ? "" : "s") + " it plays" : "delete the scene";
    del.onclick = () => {
      delete STORY.scenes[id];
      STORY.order = STORY.order.filter(x => x !== id);
      saveStory(); refreshPanel("viz-story");
    };
    chip.appendChild(del);
    lib.appendChild(chip);
  }
}

/* ---------- tree ---------- */

/*  The tree's own focus, deliberately NOT state.filter.focus. Focusing the
    board on one person leaves only the records that name them, which would
    collapse the drawing to the very person you clicked. Re-rooting has to be
    a move inside the panel. */
let TREE_ROOT = null;

const TREE_HINT =
  'A birth names the person born first and their parents after, and that is ' +
  'the only place parentage is recorded:<br>' +
  '<code>+|👶|1893-02-11|@alice,@george-isles,@margaret-kinnear</code>';

/*  A tree that is actually a tree. The rooted person is the trunk; their
    parents are the two boughs it forks into, and every generation back forks
    again, thinner and shorter, until the pile runs out of ancestors and the
    branch puts out leaves instead. Descendants go the other way, as roots
    spreading under the ground line — which is also where they belong in every
    pedigree chart ever drawn, only upside down.

    Canvas rather than boxes: a bough tapers and bends, and no amount of CSS
    makes a div do that. The cost is hit testing, so every name label records
    its rectangle for the click handler. */
const TREE_GEN_UP = 5;      // generations of ancestors before the branch stops
const TREE_GEN_DOWN = 3;    // generations of descendants in the root system

/*  Stable per-person wobble. A branch that jitters differently on every redraw
    looks like a glitch; the same person should grow the same way every time,
    so the angle offset is hashed from the uid rather than drawn from
    Math.random. */
function treeJitter(slug) {
  let h = 2166136261;
  for (let i = 0; i < slug.length; i++) { h ^= slug.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 2000) / 1000 - 1;      // -1 … 1
}

function renderTree(model, host) {
  if (!host.dataset.built) {
    host.dataset.built = "1";
    host.innerHTML =
      '<div class="tr-root">' +
        '<div class="tr-head" data-el="head"></div>' +
        '<div class="tr-wrap" data-el="wrap"><canvas data-el="canvas"></canvas></div>' +
      "</div>";
    const cv = host.querySelector('[data-el="canvas"]');
    const pick = ev => {
      const r = cv.getBoundingClientRect();
      const x = ev.clientX - r.left, y = ev.clientY - r.top;
      for (const b of host.__hits || []) {
        if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.slug;
      }
      return null;
    };
    cv.addEventListener("click", ev => {
      const slug = pick(ev);
      if (slug && slug !== TREE_ROOT) { TREE_ROOT = slug; refreshPanel("viz-tree"); }
    });
    cv.addEventListener("mousemove", ev => { cv.style.cursor = pick(ev) ? "pointer" : "default"; });
    /*  Every coordinate comes from the canvas size, so a tile that changes
        shape has to grow the tree again from scratch. */
    if (window.ResizeObserver) {
      new ResizeObserver(() => { if (host.__draw) host.__draw(); }).observe(host);
    }
  }

  const head = host.querySelector('[data-el="head"]');
  const wrap = host.querySelector('[data-el="wrap"]');
  const cv   = host.querySelector('[data-el="canvas"]');
  for (const old of [...wrap.querySelectorAll(".tr-empty, .tr-hint")]) old.remove();
  host.__hits = [];
  host.__draw = null;

  const g = kinGraph(model);
  if (!g.people.length) {
    head.textContent = "";
    cv.hidden = true;
    const empty = document.createElement("div");
    empty.className = "tr-empty";
    empty.textContent = model.people.length
      ? "Nobody in view is recorded as anyone's parent, child or partner."
      : "No people in view.";
    const hint = document.createElement("div");
    hint.className = "tr-hint";
    hint.innerHTML = TREE_HINT;
    wrap.appendChild(empty);
    wrap.appendChild(hint);
    return;
  }
  cv.hidden = false;

  /*  Whoever you last clicked, else whoever the board is focused on, else the
      best-connected person — rooting on a leaf grows one twig and hides the
      tree it came off. */
  let root = TREE_ROOT && g.has(TREE_ROOT) ? TREE_ROOT : null;
  if (!root && state.filter.focus && g.has(state.filter.focus)) root = state.filter.focus;
  if (!root) {
    root = g.people.slice().sort((a, b) => g.degree(b) - g.degree(a) || a.localeCompare(b))[0];
  }

  const nameOf = s => { const e = g.ent.get(s); return (e && e.name) || titleCase(s); };
  const ghost = s => { const e = g.ent.get(s); return !e || !e.declared; };
  const { order } = treeWalk(g, root);
  const life = g.ent.get(root) ? lifeSummary(g.ent.get(root)) : "";
  head.innerHTML = "Rooted on <b>" + esc(nameOf(root)) + "</b>" +
    (life ? " · " + esc(life) : "") + " · " + order.length + " related · click a name to re-root" +
    // Said on the head line rather than under the canvas: the canvas fills the
    // tile, so anything appended below it is scrolled out of existence.
    (g.parents.size ? "" : " · no birth names a parent yet, so nothing forks");

  host.__draw = () => {
    const W = wrap.clientWidth, H = wrap.clientHeight;
    if (!W || !H) return;                       // the tile is collapsed or hidden
    // Cleared HERE, not in the render above: a resize redraws without
    // re-rendering, and the hit boxes would otherwise pile up a stale copy per
    // redraw with the oldest winning the click.
    host.__hits = [];
    const dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + "px"; cv.style.height = H + "px";
    const ctx = cv.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    const cs = getComputedStyle(host);
    const col = (name, fallback) => cs.getPropertyValue(name).trim() || fallback;
    const WOOD = col("--accent", "#ff5500"), DRAFT = col("--draft", "#7a8a99");
    const LEAF = col("--accent2", "#33ff33"), FG = col("--fg", "#eee");
    const EDGE = col("--border", "#333"), BACK = col("--panel", "#1a1a1a");

    const kids = [...(g.children.get(root) || EMPTY_KIN)];
    // Ground sits low when nothing grows below it, and lifts to make room for
    // a root system when it does.
    const ground = kids.length ? H * 0.68 : H * 0.9;

    const boughs = [], labels = [], tufts = [];
    const push = (a, b, wide, status, curve) =>
      boughs.push({ a, b, wide, status, curve });

    /*  One recursion, run twice: once upward over parents and once downward
        over children. `dir` is -1 for the sky and 1 for the soil, and the only
        other difference is which map supplies the next generation. */
    const grow = (slug, x, y, ang, len, wide, depth, dir, seen) => {
      const ex = x + Math.sin(ang) * len, ey = y + dir * Math.cos(ang) * len;
      const bend = treeJitter(slug) * len * 0.16;
      push([x, y], [ex, ey], wide, "verified", [
        x + Math.sin(ang) * len * 0.5 + bend, y + dir * Math.cos(ang) * len * 0.5,
      ]);
      labels.push({ slug, x: ex, y: ey });

      const next = [...((dir < 0 ? g.parents : g.children).get(slug) || EMPTY_KIN)]
        .filter(([s]) => !seen.has(s));
      const max = dir < 0 ? TREE_GEN_UP : TREE_GEN_DOWN;
      if (!next.length || depth >= max) {
        if (dir < 0) tufts.push([ex, ey, len * 0.22]);
        return;
      }
      const n = next.length;
      next.forEach(([s, status], i) => {
        // One parent known: carry on nearly straight rather than veering off at
        // the angle a missing second parent would have balanced.
        const off = n === 1 ? treeJitter(s) * 0.28
                            : (i / (n - 1) - 0.5) * 2 * 0.58 + treeJitter(s) * 0.1;
        const kept = new Set(seen); kept.add(s);
        // The limb ITSELF carries the confidence of the record claiming the
        // relationship, so a drafted parentage grows a dashed branch.
        const before = boughs.length;
        grow(s, ex, ey, ang + off, len * 0.76, Math.max(1, wide * 0.66),
             depth + 1, dir, kept);
        if (boughs[before]) boughs[before].status = status;
      });
    };

    const trunkLen = Math.max(24, (ground - 12) * 0.3);
    const seen = new Set([root]);
    // The trunk is the root person: drawn first so everything else hangs off
    // its top, and labelled last so the name sits over the bark.
    const topX = W / 2, topY = ground - trunkLen;
    push([W / 2, ground], [topX, topY], 7, "verified", [W / 2, ground - trunkLen * 0.5]);

    const parents = [...(g.parents.get(root) || EMPTY_KIN)];
    parents.forEach(([s, status], i) => {
      const n = parents.length;
      const off = n === 1 ? treeJitter(s) * 0.3 : (i / (n - 1) - 0.5) * 2 * 0.62;
      const before = boughs.length;
      grow(s, topX, topY, off, trunkLen * 0.82, 5, 1, -1, new Set([...seen, s]));
      if (boughs[before]) boughs[before].status = status;
    });
    if (!parents.length) tufts.push([topX, topY, 14]);

    kids.forEach(([s, status], i) => {
      const n = kids.length;
      const off = n === 1 ? treeJitter(s) * 0.4 : (i / (n - 1) - 0.5) * 2 * 0.85;
      const before = boughs.length;
      grow(s, W / 2, ground, off, (H - ground) * 0.55, 4, 1, 1, new Set([...seen, s]));
      if (boughs[before]) boughs[before].status = status;
    });

    /*  A partner is nobody's ancestor and nobody's descendant, so the tree has
        no place to put them — and leaving them out loses the mother of every
        child in the soil below. They grow as a second stem off the trunk,
        which is about right: married in, not descended from. Skipped when the
        pile already puts them somewhere, as a cousin marriage does. */
    for (const [s, status] of g.partners.get(root) || EMPTY_KIN) {
      if (labels.some(l => l.slug === s)) continue;
      const side = labels.filter(l => l.mate).length % 2 ? -1 : 1;
      const ax = W / 2, ay = ground - trunkLen * 0.72, len = trunkLen * 0.8;
      const ang = side * (1.12 + treeJitter(s) * 0.14);
      const ex = ax + Math.sin(ang) * len, ey = ay - Math.cos(ang) * len;
      push([ax, ay], [ex, ey], 3, status,
           [ax + Math.sin(ang) * len * 0.5, ay - Math.cos(ang) * len * 0.5 - len * 0.14]);
      labels.push({ slug: s, x: ex, y: ey, mate: true });
    }

    // ---- ground, then wood, then leaves, then names ----
    ctx.strokeStyle = EDGE; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, ground + 0.5); ctx.lineTo(W, ground + 0.5); ctx.stroke();

    ctx.lineCap = "round";
    for (const b of boughs) {
      ctx.beginPath();
      ctx.moveTo(b.a[0], b.a[1]);
      ctx.quadraticCurveTo(b.curve[0], b.curve[1], b.b[0], b.b[1]);
      ctx.lineWidth = b.wide;
      ctx.strokeStyle = b.status === "verified" ? WOOD : DRAFT;
      ctx.setLineDash(b.status === "verified" ? [] : [3, 4]);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    /*  A tuft marks where the research stops: the branch has no more parents
        on it, so it puts out leaves. The end of a line of descent looks like
        the end of a branch, which is the one metaphor this drawing gets for
        free. */
    ctx.fillStyle = LEAF; ctx.globalAlpha = 0.45;
    for (const [x, y, r] of tufts) {
      for (let i = 0; i < 5; i++) {
        const a = (i / 5) * Math.PI * 2 + treeJitter(String(x + i)) * 0.6;
        ctx.beginPath();
        ctx.ellipse(x + Math.cos(a) * r, y + Math.sin(a) * r * 0.8,
                    Math.max(2, r * 0.5), Math.max(1.5, r * 0.32), a, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    labels.push({ slug: root, x: W / 2, y: ground - trunkLen * 0.45, root: true });
    ctx.font = '10px ' + (cs.fontFamily || "system-ui, sans-serif");
    ctx.textBaseline = "middle";
    for (const l of labels) {
      const text = nameOf(l.slug);
      const w = Math.ceil(ctx.measureText(text).width) + 8, h = 14;
      // Clamped into the canvas: a name grown off the edge is a name you can
      // neither read nor click.
      const x = Math.min(Math.max(2, l.x - w / 2), W - w - 2);
      const y = Math.min(Math.max(2, l.y - h / 2), H - h - 2);
      ctx.globalAlpha = 0.88; ctx.fillStyle = BACK;
      ctx.fillRect(x, y, w, h); ctx.globalAlpha = 1;
      ctx.strokeStyle = l.root ? LEAF : EDGE; ctx.lineWidth = 1;
      ctx.setLineDash(ghost(l.slug) ? [2, 2] : []);
      ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
      ctx.setLineDash([]);
      ctx.fillStyle = l.root ? LEAF : FG;
      ctx.globalAlpha = ghost(l.slug) ? 0.65 : 1;
      ctx.fillText(text, x + 4, y + h / 2 + 0.5);
      ctx.globalAlpha = 1;
      host.__hits.push({ x, y, w, h, slug: l.slug });
    }
  };
  host.__draw();
}

/* ---------- gazetteer panel ---------- */
// Reads and writes the same GAZETTEER map every folder/hosted route uses.

/*  Google Maps' right-click "copy coordinates" puts one string on the
    clipboard: "56.462857045769084, -2.971490044008239". The lat/lng fields
    here are two separate number inputs (so each can be edited alone
    afterwards), but a paste should not care which of the two you pasted
    into — split it across both, using the same RE_COORDS/readCoords the
    parser itself uses, so "what counts as a coordinate pair" is defined in
    exactly one place. */
function wireCoordPaste(latIn, lngIn, onDone) {
  const handler = e => {
    const text = (e.clipboardData || window.clipboardData).getData("text");
    const c = readCoords(text);
    if (!c) return;               // not a pair — let the normal single-number paste happen
    e.preventDefault();
    latIn.value = c.lat;
    lngIn.value = c.lng;
    if (onDone) onDone(c);
  };
