  // The field set depends on the type, which can change via loadBrickIntoBuilder
  // as well as via the type buttons.
  // Also covers the comment pseudo-type, which is not a key of TYPES.
  if (body.dataset.fieldsFor !== builder.type) buildBuilderFields(body);
  renderBuilderState(body);
}

function buildBuilderFields(body) {
  const host = body.querySelector('[data-el="fields"]');
  body.dataset.fieldsFor = builder.type;
  const listId = "bld-aliases";
  body.querySelector('[data-el="aliases"]').id = listId;

  host.innerHTML = fieldsFor(builder.type).map(f => {
    const val = esc(builder.values[f.key] || "");
    const input = f.kind === "alias"
      ? '<div class="bld-alias-wrap">' +
          '<input data-k="alias" list="' + listId + '" placeholder="' + esc(f.ph) + '" value="' + val + '">' +
          '<input class="num" data-k="num" placeholder="no." value="' + esc(builder.values.num || "") + '" title="optional disambiguator, e.g. 4 for <4><george-isles>">' +
        "</div>"
      : '<input data-k="' + f.key + '"' + (f.kind === "links" ? ' list="' + listId + '"' : "") +
        ' placeholder="' + esc(f.ph) + '" value="' + val + '">' +
        (f.kind === "links" ? '<div class="uid-picker" data-picker="1"></div>' : "");
    return '<div class="bld-field"><label>' + esc(f.label) + (f.kind === "links" ? " (comma separated)" : "") +
      "</label>" + input + (f.sub ? '<span class="sub">' + esc(f.sub) + "</span>" : "") + "</div>";
  }).join("");

  host.querySelectorAll("input[data-k]").forEach(i => {
    i.addEventListener("input", () => {
      builder.values[i.dataset.k] = i.value;
      renderUidPicker(body);
      renderBuilderPreview(body);
    });
  });
  renderUidPicker(body);
}

function renderBuilderState(body) {
  body.querySelectorAll('[data-el="status"] button').forEach(b =>
    b.classList.toggle("active", b.dataset.st === builder.status));
  body.querySelectorAll('[data-el="type"] button').forEach(b =>
    b.classList.toggle("active", b.dataset.ty === builder.type));

  // Values can be set programmatically (editing an existing line), so push them
  // back into the inputs.
  body.querySelectorAll("input[data-k]").forEach(i => {
    const v = builder.values[i.dataset.k] || "";
    if (i.value !== v) i.value = v;
  });

  // A comment cannot be verified or draft, so the confidence row steps aside.
  const isComment = builder.type === "comment";
  body.querySelector('[data-el="status"]').style.display = isComment ? "none" : "";

  const ed = body.querySelector('[data-el="editing"]');
  ed.hidden = builder.editing === null;
  ed.textContent = builder.editing === null ? "" : "editing line " + builder.editing;
  body.querySelector('[data-act="cancel"]').hidden = builder.editing === null;
  body.querySelector('[data-act="commit"]').textContent =
    builder.editing === null ? "Add brick" : "Update line " + builder.editing;

  // Aliases already declared, offered to every alias and link field.
  const list = body.querySelector("datalist");
  if (list && state.model) {
    list.innerHTML = state.model.entities
      .map(e => '<option value="' + esc(e.slug) + '">' + esc(e.name) + "</option>").join("");
  }
  renderBuilderPreview(body);
}

function renderBuilderPreview(body) {
  const pre = body.querySelector('[data-el="preview"]');
  const line = builderLine();
  showUidClash(body);
  // Parsed with the real parser rather than trusted — if the builder can emit
  // something the parser rejects, that is a bug worth seeing immediately.
  const test = parseLine(line, 0, "");
  pre.textContent = line;
  pre.classList.toggle("draft", builder.status === "-");
  pre.classList.toggle("bad", !test.valid);
}

/*  Warn while typing, not after committing. Editing the very line that declared
    the uid is not a clash, so the check ignores the line being edited. */
/*  Every uid in the pile, as buttons. Click to attach or detach — the links
    field stays plain text, so anything typed by hand still works and the
    buttons are only a faster way to type it. */
function renderUidPicker(body) {   // rebuilt whenever the links field changes
  const host = body.querySelector("[data-picker]");
  if (!host) return;
  const chosen = new Set((builder.values.links || "").split(",")
    .map(x => slugify(x.trim().replace(/^@/, ""))).filter(Boolean));

  // Never offer the brick its own uid: a record linking to itself says nothing.
  const self = slugify(builder.values.alias || "");
  const list = state.model.entities
    .filter(e => e.slug !== self)
    .sort((a, b) => (a.declared === b.declared ? a.name.localeCompare(b.name) : (a.declared ? -1 : 1)));

  if (!list.length) { host.innerHTML = '<span class="none">No uids declared yet.</span>'; return; }
  host.innerHTML = "";
  for (const e of list) {
    const b = document.createElement("button");
    b.type = "button";
    const icon = e.kind === "place" ? "📍" : e.kind === "person" ? "👤"
               : e.kind === "document" ? "📜" : e.kind === "event" ? "🔔" : "❔";
    b.textContent = icon + " " + e.slug;
    b.title = e.declared ? e.kind + (e.detail ? " · " + e.detail : "") + " · line " + e.declaredAt
                         : "ghost — referenced " + e.refs + "×, never declared";
    if (!e.declared) b.classList.add("ghost");
    if (chosen.has(e.slug)) b.classList.add("on");
    b.onclick = () => {
      chosen.has(e.slug) ? chosen.delete(e.slug) : chosen.add(e.slug);
      builder.values.links = [...chosen].join(",");
      const input = body.querySelector('input[data-k="links"]');
      if (input) input.value = builder.values.links;
      renderUidPicker(body);
      renderBuilderPreview(body);
    };
    host.appendChild(b);
  }
}

function showUidClash(body) {   // called on every keystroke in the builder
  const box = body.querySelector('[data-el="clash"]');
  if (!box) return;
  const slug = slugify(builder.values.alias || "");
  const kind = builder.type === "comment" ? null : TYPES[builder.type].kind;
  if (!slug || (kind !== "person" && kind !== "place" && kind !== "document" && kind !== "event")) {
    box.hidden = true; return;
  }
  const e = state.model.entities.find(x => x.slug === slug && x.declared);
  if (!e || e.declaredAt === builder.editing) { box.hidden = true; return; }
  box.hidden = false;
  box.textContent = "<" + slug + "> is already declared on line " + e.declaredAt +
    " as a " + e.kind + (e.detail ? " (" + e.detail + ")" : "") +
    ". A uid must be unique — committing this makes a clash.";
}

function renderClassification(host) {
  if (!host) return;
  const rows = V().bricks;
  if (!rows.length) { host.innerHTML = '<p class="hint">Nothing on the pallet.</p>'; return; }
  host.innerHTML = rows.map(b => {
    const cls = ["ln"];
    if (b.comment) cls.push("comment");
    else if (!b.valid) cls.push("bad");
    else { cls.push("ok"); if (b.status === "draft") cls.push("draft"); }
    const tag = b.comment ? "section" : (b.valid ? (b.type || "") : "unparsed");
    const name = (!b.comment && b.name && b.name !== b.raw.trim())
      ? '<br><span class="name">&rarr; ' + esc(b.name) + (b.estimate ? " · ~" + b.estimate : "") +
        (b.links.length ? " · " + b.links.length + " link" + (b.links.length > 1 ? "s" : "") : "") + "</span>"
      : "";
    if (b.lineNumber === builder.editing) cls.push("editing");
    return '<div class="' + cls.join(" ") + '" data-line="' + b.lineNumber + '"' +
      (b.valid && !b.comment ? ' title="click to edit this line in the Brick Builder"' : "") +
      '><span class="num">' + b.lineNumber + "</span>" +
      '<span class="ico">' + b.icon + '</span><span class="body">' + esc(b.raw.trim()) + name +
      '</span><span class="tag">' + esc(tag) + "</span></div>";
  }).join("");

  // Delegated, so it survives every re-render of the list above.
  if (!host.dataset.wired) {
    host.dataset.wired = "1";
    host.addEventListener("click", e => {
      const row = e.target.closest(".ln[data-line]");
      if (row) loadBrickIntoBuilder(Number(row.dataset.line));
    });
  }
}

/*  The Bricks panel's own filter.

    Deliberately separate from state.filter: this hides chips in THIS panel and
    nothing else. The global search narrows the whole board — every panel, the
    map, the timeline — which is the wrong tool for "I just want to find a name
    in this list". Kept out of state so it can never be mistaken for the real
    filter, and so nothing else has to know it exists. */
const entLocal = { text: "", kinds: new Set() };

function renderEntities(body) {
  // Tolerates being handed either the body or the list, since the panel used
  // to pass the list directly.
  const host = body.matches && body.matches('[data-el="ents"]')
    ? body : body.querySelector('[data-el="ents"]');
  const root = host.closest(".panel-body") || body;

  const controls = root.querySelector(".ent-controls");
  if (controls && !controls.dataset.wired) {
    controls.dataset.wired = "1";
    const input = controls.querySelector('[data-el="local"]');
    input.addEventListener("input", () => {
      entLocal.text = input.value;
      renderEntities(root);          // only this panel repaints
    });
  }
  if (controls) {
    const input = controls.querySelector('[data-el="local"]');
    if (document.activeElement !== input && input.value !== entLocal.text) input.value = entLocal.text;

    /*  A toggle per kind actually present, rather than a hardcoded three.
        Entities are not only people and places — a document or an event that
        declares a uid is an entity too, and hardcoding meant those could never
        be filtered for. Ghost is listed separately because it is a state
        (never declared), not a kind. */
    const KIND_ICON = { person: "👤", place: "📍", document: "📜", event: "🔔" };
    const present = [...new Set(V().entities.filter(e => e.declared).map(e => e.kind))]
      .filter(k => KIND_ICON[k]).sort();
    const hasGhosts = V().entities.some(e => !e.declared);
    // "persons" is what naive pluralisation gives; spell the labels out.
    const KIND_LABEL = { person: "people", place: "places", document: "documents", event: "events" };
    const wanted = present.map(k => [k, KIND_ICON[k], KIND_LABEL[k] || k + "s"])
      .concat(hasGhosts ? [["ghost", "❔", "ghosts — referenced but never declared"]] : []);

    const kindsHost = controls.querySelector('[data-el="kinds"]');
    const signature = wanted.map(w => w[0]).join(",");
    if (kindsHost.dataset.sig !== signature) {
      kindsHost.dataset.sig = signature;
      kindsHost.innerHTML = "";
      for (const [k, icon, label] of wanted) {
        const btn = document.createElement("button");
        btn.dataset.kind = k;
        btn.textContent = icon;
        btn.title = "show " + label;
        btn.onclick = () => {
          entLocal.kinds.has(k) ? entLocal.kinds.delete(k) : entLocal.kinds.add(k);
          renderEntities(root);
        };
        kindsHost.appendChild(btn);
      }
      // A kind that has vanished from the pile must not keep filtering it out.
      for (const k of [...entLocal.kinds]) if (!wanted.some(w => w[0] === k)) entLocal.kinds.delete(k);
    }
    kindsHost.querySelectorAll("[data-kind]").forEach(b =>
      b.classList.toggle("on", entLocal.kinds.has(b.dataset.kind)));
  }
  renderEntityChips(host, root);
}

function renderEntityChips(host, root) {
  if (!host) return;
  const all = V().entities.slice().sort((a, b) =>
    a.declared !== b.declared ? (a.declared ? -1 : 1) : a.name.localeCompare(b.name));

  // Local visibility only — no effect on state.filter or any other panel.
  const q = entLocal.text.trim().toLowerCase();
  const kinds = entLocal.kinds;
  const ents = all.filter(e => {
    if (q && !e.slug.includes(q) && !e.name.toLowerCase().includes(q)) return false;
    if (kinds.size) {
      // "ghost" is a state, not a kind, so it is matched separately.
      const isGhost = !e.declared;
      const matches = (kinds.has("ghost") && isGhost) ||
                      (kinds.has(e.kind) && !isGhost);
      if (!matches) return false;
    }
    return true;
  });

  const note = root && root.querySelector('[data-el="entnote"]');
  if (note) {
    note.textContent = ents.length === all.length
      ? "solid verified · dashed draft · dotted ghost"
      : "showing " + ents.length + " of " + all.length + " — this panel only";
  }

  if (!all.length) { host.innerHTML = '<p class="hint">No aliases yet.</p>'; return; }
  if (!ents.length) { host.innerHTML = '<p class="hint">Nothing matches here.</p>'; return; }
  host.innerHTML = ents.map(e => {
    const cls = ["ent"];
    if (!e.declared) cls.push("ghost");
    else if (e.status === "draft") cls.push("draft");
    const icon = e.kind === "place" ? "📍" : e.kind === "person" ? "👤"
               : e.kind === "document" ? "📜" : e.kind === "event" ? "🔔" : "❔";
    const title = e.declared
      ? e.kind + (e.status === "draft" ? ", draft" : ", verified") +
        (e.detail ? " · " + e.detail : "") +
        (lifeSummary(e) ? " · " + lifeSummary(e) : "") +
        (e.coordsFrom === "gazetteer" ? " · coords from gazetteer" : "") +
        " · referenced " + e.refs + "×"
      : "ghost — referenced " + e.refs + "×, never declared";
    // Coordinates show in the tooltip only. One icon per kind — a second pin
    // emoji was not a distinction anyone could read.
    const geo = e.coords ? " · " + e.coords.lat + ", " + e.coords.lng : "";
    const on = state.filter.focus === e.slug;
    return '<span class="' + cls.join(" ") + (on ? " focused" : "") + '" data-slug="' + esc(e.slug) +
      '" title="' + esc(title + geo) + ' — click to show only records naming them">' +
      icon + " " +
      esc(e.name) + (e.refs ? '<span class="n">' + e.refs + "</span>" : "") + "</span>";
  }).join("");

  if (!host.dataset.wired) {
    host.dataset.wired = "1";
    host.addEventListener("click", ev => {
      const chip = ev.target.closest(".ent[data-slug]");
      if (chip) focusEntity(chip.dataset.slug);
    });
  }
}

function renderStats(host) {
  if (!host) return;
  const s = V().stats;
  const cells = [["bricks", s.bricks], ["verified", s.verified], ["draft", s.draft],
                 ["entities", s.entities], ["ghosts", s.ghosts], ["links", s.links],
                 ["dated", s.dated], ["estimated", s.estimated], ["geocoded", s.geocoded],
                 ["unparsed", s.unparsed]];
  host.innerHTML = cells.map(([k, v]) => {
    const colour = (k === "unparsed" && v > 0) ? "var(--bad)"
                 : (k === "ghosts" && v > 0) ? "var(--ghost)"
                 : k === "draft" ? "var(--draft)" : k === "verified" ? "var(--accent)" : "inherit";
    return '<div class="stat"><div class="v" style="color:' + colour + '">' + v +
           '</div><div class="k">' + k + "</div></div>";
  }).join("");
}

function renderIssues(host) {
  if (!host) return;
  const list = state.model.issues;
  if (!list.length) { host.innerHTML = '<span class="none">No red flags. Every line landed somewhere.</span>'; return; }
  host.innerHTML = list.map(i => '<div class="' + (i.level === "err" ? "err" : "warn") + '">' +
    (i.line ? "L" + String(i.line).padStart(3, "0") + " " : "···· ") + esc(i.msg) + "</div>").join("");
}

function renderReference(host) {
  if (!host) return;
  const rows = Object.keys(TYPES).map(k => {
    const toks = Object.keys(TOKENS).filter(t => TOKENS[t] === k && t !== TYPES[k].icon);
    return "<tr><td>" + TYPES[k].icon + "</td><td>" + esc(TYPES[k].label) + "</td>" +
      '<td class="mono">' + esc(toks.join("  ·  ")) + '</td><td class="mono">' + esc(exampleFor(k)) + "</td></tr>";
  }).join("");
  host.innerHTML = "<table><thead><tr><th>icon</th><th>type</th><th>also accepts</th><th>example</th></tr></thead><tbody>" +
    rows + '<tr><td>💬</td><td>comment</td><td class="mono">#</td><td class="mono"># PEOPLE</td></tr></tbody></table>' +
    '<p class="hint">Add a row to <code>TOKENS</code> in this file and the parser, the classifier, the counts and every ' +
    "panel pick it up with no other edit. That is the whole extension mechanism.</p>";
}

function exampleFor(k) {
  return {
    person: "+|👤|<charles-alexander>|Assistant Registrar",
    birth: "+|👶|1894-06-29|@george",
    marriage: "-|🔔|????|@james,margaret-kinnear",
    death: "-|⚰️|1901|@james",
    place: "-|📍|<longforgan>|Longforgan|West of Dundee",
    document: "+|📜|census|1891|@george,margaret",
    census: "-|✏️|1891|George|22 ~1869",
  }[k] || "";
}

function palletAction(act, ta) {
  if (act === "menu") {
    const panel = document.getElementById("pallet");
    const menu = panel.querySelector('[data-el="menu"]');
    menu.hidden = !menu.hidden;
    const btn = panel.querySelector('.panel-head-btn[data-act="menu"]');
    if (btn) btn.classList.toggle("on", !menu.hidden);
    return;
  }
  if (act === "sample") return setText(SAMPLE);
  if (act === "clear") {
    if (confirm("Empty the pallet? Your bricks are only stored in this browser.")) setText("");
    return;
  }
  if (act === "copy") { navigator.clipboard.writeText(state.text).catch(() => ta.select()); return; }
  if (act === "export") {
    const blob = new Blob([state.text], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "bricks-" + new Date().toISOString().slice(0, 10) + ".txt";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    return;
  }
  if (act === "import" || act === "merge") return pickFiles(act === "merge");
  if (act === "folder") return openFolder();
  if (act === "rescan") return rescanFolder();
}

/*  Reading a whole folder.

    A page cannot watch a folder — there is no filesystem access without a user
    gesture, so this is "open" and "rescan", never live sync. Three routes,
    because support differs and this file has to work from a plain file:// too:

      1. showDirectoryPicker()  — Chromium. Keeps a handle, so Rescan re-reads
         the same folder with no second prompt. Needs https or localhost.
      2. <input webkitdirectory> — everywhere else. No handle survives, so
         Rescan has to re-prompt.
      3. dropping a folder onto the Pallet — uses the same reader as (2).

    Every route ends in the same place: .txt files, sorted by name, folded in
    with mergeText, so duplicates are skipped and the order is predictable. */
let folderHandle = null;      // route 1 only
let folderName = "";

function isBrickFile(name) { return /\.txt$/i.test(name); }
function isImageFile(name) { return /\.(jpe?g|png|gif|webp|avif|svgz?|tiff?)$/i.test(name); }

/*  Images found in the opened folder, keyed by their path within it.

    A brick says `images/birth-1894.jpg`. As an <img src> that would resolve
    against the PAGE, not against your research folder — so a local scan would
    never load. Indexing the folder's images and handing back a blob URL makes
    the same brick file work both locally and hosted, with nothing uploaded. */

/*  Gazetteer: uid -> {lat, lng}, so coordinates do not have to live inside a
    brick at all. A place brick declares identity; the gazetteer supplies
    geometry, by the same uid. A brick's own trailing "lat, lng" still wins if
    present -- the gazetteer is a fallback, not the only source. */
const GAZETTEER = new Map();   // uid -> {lat, lng}
/*  Label placement per place, kept in its own map rather than folded into the
    coordinate object: a place can have a label preference with no coordinates
    yet, or coordinates that come from its brick rather than the gazetteer, and
    mixing the two would make a half-populated coords object that the map would
    try to plot. Empty/absent means "use the map's default". */
const LABEL_POS = new Map();   // uid -> "bottom"|"top"|"right"|"left"|"none"
/*  Per-place marker glyph — any emoji or character. Empty/absent means the
    plain status dot, which stays the default because it is the only marker
    whose colour still carries the verified/draft distinction. */
const MARKER_ICON = new Map();   // uid -> "⛪" etc.
function isGazetteerFile(name) { return /gazetteer.*\.csv$/i.test(name); }

function splitCsvRow(row) {
  const out = []; let cur = "", q = false;
  for (let i = 0; i < row.length; i++) {
    const c = row[i];
    if (q) { if (c === '"') { if (row[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === "," || c === ";") { out.push(cur); cur = ""; }
    else cur += c;
  }
  out.push(cur);
  return out.map(s => s.trim());
}

// Accepts "uid,lat,lng" or "name,lat,lng" (name is slugified to a uid) with or
// without a header row -- `family/locations.csv` drops in unmodified.
function parseGazetteerCSV(text) {
  const lines = String(text).split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  if (!lines.length) return [];
  const head = splitCsvRow(lines[0]).map(h => h.toLowerCase());
  const uidCol = head.indexOf("uid") !== -1 ? head.indexOf("uid") : head.indexOf("name");
  const latCol = head.indexOf("lat");
  const lngCol = head.indexOf("lng") !== -1 ? head.indexOf("lng")
               : head.indexOf("lon") !== -1 ? head.indexOf("lon") : head.indexOf("long");
  const labelCol = head.indexOf("label");
  const iconCol = head.indexOf("icon");
  const hasHeader = uidCol !== -1 && latCol !== -1 && lngCol !== -1;
  const c = hasHeader ? { uid: uidCol, lat: latCol, lng: lngCol, label: labelCol, icon: iconCol }
                      : { uid: 0, lat: 1, lng: 2, label: 3, icon: 4 };
  const out = [];
  for (let i = hasHeader ? 1 : 0; i < lines.length; i++) {
    const row = splitCsvRow(lines[i]);
    if (row.length < 3) continue;
    const uid = slugify(row[c.uid] || "");
    const lat = Number(row[c.lat]), lng = Number(row[c.lng]);
    if (!uid || !isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) continue;
    const label = c.label >= 0 ? (row[c.label] || "").trim().toLowerCase() : "";
    const icon = c.icon >= 0 ? (row[c.icon] || "").trim().slice(0, 4) : "";
    out.push([uid, { lat, lng }, LABEL_CHOICES.includes(label) ? label : "", icon]);
  }
  return out;
}

const LABEL_CHOICES = ["bottom", "top", "right", "left", "none"];

/*  Coordinates you typed are work, and work should survive a reload. Stored as
    one object holding both maps, since a label override without its coordinate
    is meaningless on its own.

    Deliberately NOT merged with a loaded gazetteer.csv on save: the CSV stays
    the portable source, this is just the working copy. Anything typed here is
    also exported by the panel's Export button, so nothing is trapped. */
function saveGazetteer() {
  try {
    localStorage.setItem(GAZETTEER_KEY, JSON.stringify({
      coords: [...GAZETTEER.entries()],
      labels: [...LABEL_POS.entries()],
      icons: [...MARKER_ICON.entries()],
    }));
  } catch (e) { /* private mode or quota: the session still works */ }
}

function loadGazetteer() {
  let raw;
  try { raw = JSON.parse(localStorage.getItem(GAZETTEER_KEY) || "null"); } catch (e) { return 0; }
  if (!raw) return 0;
  let n = 0;
  for (const [uid, c] of Array.isArray(raw.coords) ? raw.coords : []) {
    if (!uid || !c || !isFinite(c.lat) || !isFinite(c.lng)) continue;
    if (Math.abs(c.lat) > 90 || Math.abs(c.lng) > 180) continue;
    GAZETTEER.set(uid, { lat: c.lat, lng: c.lng });
    n++;
  }
  for (const [uid, pos] of Array.isArray(raw.labels) ? raw.labels : []) {
    if (uid && LABEL_CHOICES.includes(pos)) LABEL_POS.set(uid, pos);
  }
  for (const [uid, icon] of Array.isArray(raw.icons) ? raw.icons : []) {
    if (uid && typeof icon === "string" && icon) MARKER_ICON.set(uid, icon.slice(0, 4));
  }
  return n;
}

function mergeGazetteerFile(text) {
  let n = 0;
  for (const [uid, coords, label, icon] of parseGazetteerCSV(text)) {
    GAZETTEER.set(uid, coords);
    if (label) LABEL_POS.set(uid, label);
    if (icon) MARKER_ICON.set(uid, icon);
    n++;
  }
  if (n) saveGazetteer();
  return n;
}

const folderImages = new Map();   // path within the opened folder -> { file, url }

function setFolderImages(list) {
  for (const v of folderImages.values()) if (v.url) URL.revokeObjectURL(v.url);
  folderImages.clear();
  for (const f of list) folderImages.set(f.name, { file: f.file, url: "" });
}

/*  Matching is forgiving on purpose: you should not have to write the path
    exactly as the folder happens to be nested. Exact path first, then a
    suffix match, then the bare filename. */
function resolveSrc(src) {
  const t = (src || "").trim();
  if (!t || /^(https?:|data:|blob:)/i.test(t)) return t;
  const want = t.replace(/^\.\//, "");
  let hit = folderImages.get(want);
  if (!hit) {
    const base = want.split("/").pop().toLowerCase();
    for (const [path, v] of folderImages) {
      const lower = path.toLowerCase();
      if (lower.endsWith("/" + want.toLowerCase()) || lower === want.toLowerCase() ||
          lower.split("/").pop() === base) { hit = v; break; }
    }
  }
  if (!hit) return t;                       // fall through to the page-relative URL
  if (!hit.url) hit.url = URL.createObjectURL(hit.file);
  return hit.url;
}

// Recurses into subfolders. Depth-capped: a stray symlink or a deep tree should
// not hang the page, and nobody nests a pile eight deep on purpose.
async function filesFromDirectoryHandle(dir, path, depth, out, imgs, gazCount) {
  if (depth > 8) return out;
  for await (const entry of dir.values()) {
    if (entry.kind === "file" && isGazetteerFile(entry.name)) {
      const f = await entry.getFile();
      gazCount.n += mergeGazetteerFile(await f.text());
    } else if (entry.kind === "file" && isBrickFile(entry.name)) {
      const f = await entry.getFile();
      out.push({ name: path + entry.name, text: await f.text() });
    } else if (entry.kind === "file" && isImageFile(entry.name) && imgs) {
      imgs.push({ name: path + entry.name, file: await entry.getFile() });
    } else if (entry.kind === "directory") {
      await filesFromDirectoryHandle(entry, path + entry.name + "/", depth + 1, out, imgs, gazCount);
    }
  }
  return out;
}

/*  What the last folder read turned up. Kept so the Files panel can show what
    is available rather than only what was merged — a folder read used to
    dissolve every file into one pile and forget the parts. */
let folderFiles = [];
let currentFile = "";   // which file is on the pallet, when one was opened alone

function rememberFolder(files, label) {
  folderFiles = files.filter(f => isBrickFile(f.name))
                     .sort((a, b) => a.name.localeCompare(b.name));
  folderName = label || folderName;
  refreshPanel("pallet");
}

// Open one file on its own, replacing the pallet — the pile IS the file.
function openFile(name) {
  const f = folderFiles.find(x => x.name === name);
  if (!f) return;
  currentFile = name;
  setText(f.text);
  refreshPanel("pallet");
}

function mergeFile(name) {
  const f = folderFiles.find(x => x.name === name);
  if (!f) return;
  const r = mergeText(state.text, f.text, f.name);
  setText(r.text);
  showMergeLog(f.name + ": +" + r.added + (r.skipped ? " (" + r.skipped + " already here)" : ""));
}

/*  The folder's files, listed inside the Pallet rather than in a panel of their
    own — they are what the pallet is loaded FROM, so they belong to it. */
function renderFileList(body) {
  const host = body.querySelector('[data-el="files"]');
  if (!host) return;
  if (!folderFiles.length) {
    // An empty list that renders nothing is a feature nobody can find — say so
    // rather than showing a blank gap.
    host.innerHTML = '<div class="file-empty">No folder open — <b>Folder…</b> lists its ' +
      "<code>.txt</code> piles here.</div>";
    return;
  }
  host.innerHTML = "";
  for (const f of folderFiles) {
    // Counting bricks means parsing, which is cheap and tells you which files
    // are worth opening without opening them.
    const n = parse(f.text).filter(b => !b.empty && !b.comment).length;
    const row = document.createElement("div");
    row.className = "file-item" + (f.name === currentFile ? " current" : "");
    // The folder prefix is the same on every row and only steals width; the
    // full path stays in the tooltip.
    const shortName = f.name.split("/").pop();
    row.innerHTML = '<span class="nm" title="' + esc(f.name) + '">' + esc(shortName) + "</span>" +
                    '<span class="meta">' + n + "</span>";
    const open = document.createElement("button");
    open.textContent = "open"; open.title = "put this file on the pallet, replacing what is there";
    open.onclick = () => openFile(f.name);
    const merge = document.createElement("button");
    merge.textContent = "+"; merge.title = "merge this file into what is on the pallet";
    merge.onclick = () => mergeFile(f.name);
    row.append(open, merge);
    host.appendChild(row);
  }
}

function foldFiles(files, label) {
  const usable = files.filter(f => isBrickFile(f.name))
                      .sort((a, b) => a.name.localeCompare(b.name));
  if (!usable.length) {
    showMergeLog("no .txt files found in " + label);
    return;
  }
  let text = state.text, added = 0, skipped = 0, touched = 0;
  for (const f of usable) {
    const r = mergeText(text, f.text, f.name);
    text = r.text; added += r.added; skipped += r.skipped;
    if (r.added) touched++;
  }
  setText(text);
  showMergeLog(label + ": " + usable.length + " file" + (usable.length > 1 ? "s" : "") +
    " read, " + added + " new brick" + (added === 1 ? "" : "s") + " from " + touched +
    " of them, " + skipped + " already here");
}

async function openFolder() {
  if (window.showDirectoryPicker) {
    try {
      const dir = await window.showDirectoryPicker({ mode: "read" });
      folderHandle = dir;
      folderName = dir.name;
      const imgs = [], gaz = { n: 0 };
      const files = await filesFromDirectoryHandle(dir, "", 0, [], imgs, gaz);
      setFolderImages(imgs);
      rememberFolder(files, folderName);
      if (gaz.n) update();
      foldFiles(files, folderName);
      showRescan(true);
      return;
    } catch (err) {
      // AbortError is the user closing the picker — not worth reporting.
      if (err && err.name === "AbortError") return;
      showMergeLog("folder picker unavailable here (" + ((err && err.name) || err) + "), falling back");
    }
  }
  // Fallback: the directory input. No handle survives it, so no Rescan.
  const inp = document.createElement("input");
  inp.type = "file";
  inp.webkitdirectory = true;
  inp.multiple = true;
  inp.onchange = () => {
    const files = [...(inp.files || [])];
    if (!files.length) return;
    const label = (files[0].webkitRelativePath || "").split("/")[0] || "folder";
    // Paths from a directory input include the chosen folder as their first
    // segment; strip it so a brick can say "images/x.jpg" rather than
    // "my-research/images/x.jpg".
    const strip = n => n.split("/").slice(1).join("/") || n;
    setFolderImages(files.filter(f => isImageFile(f.name))
      .map(f => ({ name: strip(f.webkitRelativePath || f.name), file: f })));
    Promise.all(files.filter(f => isGazetteerFile(f.name)).map(f => f.text()))
      .then(texts => { if (texts.some(t => mergeGazetteerFile(t))) update(); });
    Promise.all(files.filter(f => isBrickFile(f.name))
      .map(f => f.text().then(t => ({ name: strip(f.webkitRelativePath || f.name), text: t }))))
      .then(all => { rememberFolder(all, label); foldFiles(all, label); })
      .catch(err => showMergeLog("could not read: " + ((err && err.message) || err)));
  };
  inp.click();
}

async function rescanFolder() {
  if (!folderHandle) { showRescan(false); return openFolder(); }
  try {
    // Permission can lapse between sessions; ask again rather than failing.
    if (folderHandle.queryPermission) {
      const p = await folderHandle.queryPermission({ mode: "read" });
      if (p !== "granted" && await folderHandle.requestPermission({ mode: "read" }) !== "granted") {
        showMergeLog("permission to read " + folderName + " was declined");
        return;
      }
    }
    const imgs = [], gaz = { n: 0 };
    const files = await filesFromDirectoryHandle(folderHandle, "", 0, [], imgs, gaz);
    setFolderImages(imgs);
    rememberFolder(files, folderName);
    if (gaz.n) update();
    foldFiles(files, folderName);
  } catch (err) {
    showMergeLog("could not re-read " + folderName + ": " + ((err && err.message) || err));
  }
}

function showRescan(on) {
  const b = document.querySelector('#pallet .pallet-menu [data-act="rescan"]');
  if (b) { b.hidden = !on; b.title = "read " + folderName + " again — duplicates are skipped"; }
}

/* Dropping a folder straight onto the Pallet. webkitGetAsEntry is the only way
   to see that a dropped item is a directory at all; a plain file drop still
   works through the same path. */
/*  Hosted piles.

    Served from a static host, the .txt files sit next to this page but nothing
    can find them: fetch has to be told a name, and a static host will not list
    a directory. So `bricks/manifest.json` is the index — an array of filenames —
    and the page reads it on load. Not merged automatically: they are listed in
    the Pallet like any other folder, and you choose what to open.

    Silent on file:// and data: URLs, where fetch is blocked; there is nothing
    useful to say to someone opening the page from disk. */
const MANIFEST = "bricks/manifest.json";

async function loadHostedGazetteer() {
  if (!/^https?:$/.test(location.protocol)) return;
  try {
    const r = await fetch("bricks/gazetteer.csv", { cache: "no-cache" });
    if (r.ok && mergeGazetteerFile(await r.text())) update();
  } catch (e) { /* optional */ }
}

async function loadHostedBricks() {
  if (!/^https?:$/.test(location.protocol)) return;
  let names;
  try {
    const r = await fetch(MANIFEST, { cache: "no-cache" });
    if (!r.ok) return;
    names = await r.json();
  } catch (e) { return; }
  if (!Array.isArray(names) || !names.length) return;

  const files = [];
  for (const n of names) {
    const name = typeof n === "string" ? n : (n && n.name);
    if (!name || !isBrickFile(name)) continue;
    try {
      const r = await fetch("bricks/" + name, { cache: "no-cache" });
      if (r.ok) files.push({ name: "bricks/" + name, text: await r.text() });
    } catch (e) { /* one missing file must not lose the rest */ }
  }
  if (!files.length) return;
  rememberFolder(files, "this site");

  /*  Listing the site's piles is not the same as loading them, and only
      listing them meant a hosted page opened on the built-in SAMPLE — whose
      places carry no coordinates and match no gazetteer uid — so the map was
      correctly, but uselessly, empty.

      Merge them in on first visit only. If there is already work on the
      pallet (anything the user typed, or a restored autosave that differs
      from the sample) it is left alone: silently concatenating the site's
      piles into someone's own pile on every reload would be far worse than
      an empty map. */
  const untouched = !state.text.trim() || state.text === SAMPLE;
  if (!untouched) {
    showMergeLog(files.length + " pile" + (files.length > 1 ? "s" : "") + " on this site — open or merge one");
    return;
  }
  let text = "", added = 0;
  for (const f of files) {
    const r = mergeText(text, f.text, f.name);
    text = r.text; added += r.added;
  }
  if (!added) return;
  setText(text);
  currentFile = "";
  showMergeLog(added + " bricks loaded from this site");
}

let droppedImages = [];
let droppedGazetteerText = [];
function entryFiles(entry, path, depth, out) {
  if (depth > 8) return Promise.resolve(out);
  if (entry.isFile) {
    if (isImageFile(entry.name)) {
      return new Promise(res => entry.file(f => {
        droppedImages.push({ name: path + entry.name, file: f });
        res(out);
      }, () => res(out)));
    }
    if (isGazetteerFile(entry.name)) {
      return new Promise(res => entry.file(f => f.text()
        .then(t => { droppedGazetteerText.push(t); res(out); })
        .catch(() => res(out))));
    }
    if (!isBrickFile(entry.name)) return Promise.resolve(out);
    return new Promise(res => entry.file(f => f.text()
      .then(t => { out.push({ name: path + entry.name, text: t }); res(out); })
      .catch(() => res(out))));
  }
  if (!entry.isDirectory) return Promise.resolve(out);
  const reader = entry.createReader();
  // readEntries returns at most 100 per call, so it must be drained in a loop.
  const drain = () => new Promise(res => reader.readEntries(batch => {
    if (!batch.length) return res(out);
    Promise.all(batch.map(e => entryFiles(e, path + entry.name + "/", depth + 1, out)))
      .then(() => drain().then(res));
  }, () => res(out)));
  return drain();
}

function wireFolderDrop(panelBody) {
  const stop = e => { e.preventDefault(); e.stopPropagation(); };
  panelBody.addEventListener("dragover", e => {
    if (!e.dataTransfer || !e.dataTransfer.types.includes("Files")) return;
    stop(e);
    e.dataTransfer.dropEffect = "copy";
  });
  panelBody.addEventListener("drop", e => {
    if (!e.dataTransfer || !e.dataTransfer.types.includes("Files")) return;
    stop(e);
    const items = [...(e.dataTransfer.items || [])]
      .map(i => i.webkitGetAsEntry && i.webkitGetAsEntry())
      .filter(Boolean);
    if (!items.length) return;
    const label = items.length === 1 ? items[0].name : items.length + " items";
    // One shared collector, so every branch of the recursion appends to the
    // same list rather than to a copy that is then discarded.
    const out = [];
    droppedImages = []; droppedGazetteerText = [];
    Promise.all(items.map(en => entryFiles(en, "", 0, out)))
      .then(() => {
        setFolderImages(droppedImages);
        const gazAdded = droppedGazetteerText.reduce((n, t) => n + mergeGazetteerFile(t), 0);
        rememberFolder(out, label);
        foldFiles(out, label);
        if (gazAdded) update();
      })
      .catch(err => showMergeLog("could not read drop: " + ((err && err.message) || err)));
  });
}

/*  Merging piles.

    The premise of the notation is that a file is a pile of bricks, so several
    small piles must be able to become one without anything being rewritten.
    Merge therefore: keeps what is already here, marks where each file's bricks
    came from with a '#' provenance line, and skips any brick already present
    verbatim — the same person recorded in two piles should not become two
    entities. Comments are never treated as duplicates, since the same '# PEOPLE'
    heading legitimately appears in every file. */
function mergeText(current, incoming, sourceName) {
  const have = new Set(
    current.split("\n").map(l => l.trim()).filter(l => l && !l.startsWith("#"))
  );
  const kept = [], skipped = [];
  for (const raw of incoming.split("\n")) {
    const line = raw.trim();
    if (!line) continue;
    if (!line.startsWith("#") && have.has(line)) { skipped.push(line); continue; }
    if (!line.startsWith("#")) have.add(line);
    kept.push(raw);
  }
  // A block whose only new content is comments adds nothing but noise. Skipping
  // it is what makes Rescan idempotent: reading the same folder twice brings in
  // the bricks added since last time and nothing else.
  const newBricks = kept.filter(l => !l.trim().startsWith("#")).length;
  if (!newBricks) return { text: current, added: 0, skipped: skipped.length };
  const block = "\n\n# --- merged from " + sourceName + " ---\n" + kept.join("\n");
  return { text: current.replace(/\s*$/, "") + block, added: newBricks, skipped: skipped.length };
}

function pickFiles(merge) {
  const inp = document.createElement("input");
  inp.type = "file";
  inp.accept = ".txt,text/plain";
  inp.multiple = merge;
  inp.onchange = () => {
    const files = [...(inp.files || [])];
    if (!files.length) return;
    if (!merge) {
      const r = new FileReader();
      r.onload = () => setText(String(r.result));
      r.readAsText(files[0]);
      return;
    }
    // Read every file first, then fold them in one after another, so the
    // duplicate check sees each merge's result rather than racing on the
    // original text.
    Promise.all(files.map(f => f.text().then(t => ({ name: f.name, text: t }))))
      .then(all => {
        let text = state.text, added = 0, skipped = 0;
        const report = [];
        for (const f of all) {
          const r = mergeText(text, f.text, f.name);
          text = r.text; added += r.added; skipped += r.skipped;
          report.push(f.name + ": +" + r.added + (r.skipped ? " (" + r.skipped + " already here)" : ""));
        }
        setText(text);
        showMergeLog(report.join(" · ") + " — " + added + " lines added, " + skipped + " duplicates skipped");
      })
      .catch(err => showMergeLog("could not read: " + ((err && err.message) || err)));
  };
  inp.click();
}

function showMergeLog(msg) {
  const log = document.querySelector('#pallet [data-el="mergelog"]');
  if (!log) return;
  // Lives inline in the bar now, so it empties rather than hides — hiding it
  // would collapse the bar's height and make the row jump.
  log.textContent = msg;
  log.title = msg;
  clearTimeout(showMergeLog.t);
  showMergeLog.t = setTimeout(() => { log.textContent = ""; log.title = ""; }, 9000);
}

/* --------------------------------------------------------------------------
   UPDATE — only tiles actually on the board render. An off-board panel does
   nothing at all until placed, which is the whole page-load win.
   -------------------------------------------------------------------------- */
function refreshPanel(id) {
  const def = panels.get(id);
  const node = document.getElementById(id);
  if (!def || !node || !def.render || !node.closest(".board-tile")) return;
  const body = node.querySelector(".panel-body");
  if (body) def.render(body);
}
/*  Driven off what is actually mounted, not off board.tiles. Those two can
    drift — a board restored from localStorage that predates a panel, or a tile
    added without a save — and when they did, that panel simply never received
    updates again. Reading the DOM cannot drift from the DOM. */
function refreshAll() {
  for (const node of document.querySelectorAll(".board-tile > .panel")) {
    refreshPanel(node.id);
  }
}

// Re-parsing the whole pallet on every keystroke is cheap at genealogical scale
// and removes an entire class of stale-state bug incremental parsing invites.
function update() {
  state.model = buildModel(parse(state.text));
  state.model.view = buildView(state.model);
  refreshAll();
  pushPlacesToMap();
}

/*  The map gets its data directly, not only via the panel-refresh chain.
    Markers failing to appear after typing a coordinate was the single most
    reported problem with this panel, and every cause was some link in that
    chain being skipped. This is one short, unconditional call: if a map exists
    and has its source, it receives the current places, full stop. */
function pushPlacesToMap() {
  const node = document.getElementById("viz-map");
  const host = node && node.querySelector(".panel-body");
  const map = host && host._map;
  if (!map) return;
  if (host._syncMarkers) host._syncMarkers();
}

function saveText() {

  saveTimer = setTimeout(() => {
    try { localStorage.setItem(TEXT_KEY, state.text); } catch (e) { /* private mode */ }
  }, 400);
}
function setText(t) { state.text = t; saveText(); update(); }

/*  Top-bar search.

  if (open) topSearchInput.focus();
  else if (state.filter.text) setFilter(f => { f.text = ""; });   // collapsing clears
};

topSearchInput.addEventListener("input", () => {
  setFilter(f => { f.text = topSearchInput.value; });
});
topSearchInput.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    topSearchInput.value = "";
    setFilter(f => { f.text = ""; });
    topSearch.classList.remove("open");
    topSearchInput.blur();
  }
});
// Collapse on blur only when it has nothing to show.
topSearchInput.addEventListener("blur", () => {
  if (!topSearchInput.value) topSearch.classList.remove("open");
});

/* ---------- flyout + board controls ---------- */
el("boardFlyoutTab").addEventListener("click", () => el("boardFlyoutWrap").classList.toggle("open"));
el("boardFlyoutClose").addEventListener("click", () => el("boardFlyoutWrap").classList.remove("open"));
el("boardSearch").addEventListener("input", renderBoardCardList);
el("boardReset").addEventListener("click", resetBoard);

el("boardCols").addEventListener("change", e => {
  const cols = Math.max(1, Math.min(12, Math.round(Number(e.target.value)) || 4));
  e.target.value = cols;
  if (cols !== board.cols) { board.cols = cols; repackForCols(cols); renderBoard(); saveBoard(); }
});
el("boardRowUnit").addEventListener("change", e => {
  const px = Math.max(80, Math.min(600, Math.round(Number(e.target.value)) || 220));
  e.target.value = px;
  board.rowUnit = px;
  renderBoard(); saveBoard();
});

/* ---------- drag wiring ---------- */
el("boardCardList").addEventListener("dragstart", e => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "BUTTON") { e.preventDefault(); return; }
  const card = e.target.closest(".board-card[draggable]");
  if (!card) return;
  const fp = FOOTPRINTS[card.dataset.id];
  if (!fp) return;
  card.classList.add("dragging");
  boardDrag = { id: card.dataset.id, w: Math.min(fp.w, board.cols), h: fp.h, fromTile: null, valid: false };
  e.dataTransfer.effectAllowed = "copy";
  // Firefox needs data set to fire subsequent drag events at all.
  e.dataTransfer.setData("text/plain", card.dataset.id);
});
el("boardCardList").addEventListener("dragend", () => endBoardDrag(false));

boardEl().addEventListener("dragover", e => {
  if (!boardDrag) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = boardDrag.fromTile ? "move" : "copy";
  updateGhost(e.clientX, e.clientY);
});
boardEl().addEventListener("drop", e => {
  if (!boardDrag) return;
  e.preventDefault();
  endBoardDrag(true);
});

// Repositioning a tile already on the board — grabbed by its own header.
boardEl().addEventListener("mousedown", e => {
  const head = e.target.closest(".panel-head");
  const tile = e.target.closest(".board-tile");
  if (!head || !tile || e.target.closest("button")) return;
  const t = board.tiles.find(k => k.id === tile.dataset.id);
  if (!t) return;
  tile.classList.add("dragging");
  boardDrag = { id: t.id, w: t.w, h: t.h, fromTile: t, valid: false };
  const onMove = ev => updateGhost(ev.clientX, ev.clientY);
  const onUp = ev => {
    updateGhost(ev.clientX, ev.clientY);
    endBoardDrag(true);
    window.removeEventListener("mousemove", onMove);
    window.removeEventListener("mouseup", onUp);
  };
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onUp);
});
</script>
</body>
</html>
