<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noimageindex">
<title>Brick by Brick</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧱</text></svg>">
<style>
  /* Palette and board grammar deliberately match collage/index.html (v2). */
  :root {
    /* Tells the browser to paint its OWN widgets dark — number-input spinners,
       select arrows, scrollbars, focus rings, autofill. Without it those stay
       light no matter what the rules below say, which is what made the Brick
       Builder fields look white. */
    color-scheme: dark;
    --bg: #111; --fg: #eee; --panel: #1a1a1a; --border: #333;
    --accent: #ff5500;      /* verified */
    --accent2: #33ff33;     /* structural affordances */
    --draft: #7a8a99;       /* the '-' status, used everywhere a brick is drawn */
    --ghost: #b06a00;       /* referenced but never declared */
    --bad: #f44336;
    --panel-gap: 14px;
    --panel-radius: 6px;
    --close-size: 18px;
    --panel-border: 1px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  /*  Nothing is selectable by default — dragging a tile by its header, or
      swiping across a list, was leaving blue selection smeared over the UI.
      The exceptions below are the places where selecting text is the point:
      the editor, and the read-only content you might want to copy out. */
  body { user-select: none; -webkit-user-select: none; }
  textarea, input, .lines, .doc-raw, .doc-meta, .issues, .feed,
  .bld-preview, .slot-note, .gaz-static,
  /* the reference table's examples are meant to be copied into the pallet */
  #reference [data-el="ref"], #reference table {
    user-select: text; -webkit-user-select: text;
  }
  body {
    background: var(--bg); color: var(--fg);
    font-family: system-ui, sans-serif; margin: 0; padding: 14px; font-size: 14px;
  }
  h1 { font-size: 1.05rem; margin: 0; letter-spacing: 0.02em; }
  h1 .brickmark { color: var(--accent); }
  .topbar { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .tagline { font-size: 0.72rem; opacity: 0.45; margin: 0; flex: 1; min-width: 180px; }
  /*  Collapsed to the glass until wanted. Width, not display, so it can
      animate and so the input keeps focus through the transition. */
  .topsearch { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .topsearch input {
    width: 0; padding: 3px 0; border-width: 0; opacity: 0;
    transition: width 0.15s ease, opacity 0.15s ease, padding 0.15s ease;
  }
  .topsearch.open input { width: 170px; padding: 3px 7px; border-width: 1px; opacity: 1; }
  .topsearch.active input { border-color: var(--accent2); }
  /* A round button to match the panels' corner control, and large enough to
     read as the primary way in rather than a minor toggle. */
  #topsearchBtn {
    width: 26px; height: 26px; padding: 0; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; font-size: 1rem; line-height: 1;
  }
  /* A filter that is on but collapsed would be invisible; the glass stays lit. */
  .topsearch.active #topsearchBtn { border-color: var(--accent2); color: var(--accent2); }

  /* ---------- THE BOARD ----------
     A coordinate space, not a queue. Cells and tiles are BOTH explicitly
     placed, so neither can push the other around via auto-flow. */
  #board {
    display: grid; gap: var(--panel-gap); position: relative;
    grid-template-columns: repeat(var(--board-cols, 4), minmax(0, 1fr));
    grid-auto-rows: var(--board-row, 220px);
    padding-bottom: 40px;
  }
  .board-cell {
    border: 1px dashed #2e2e2e; border-radius: 6px; z-index: 0;
    display: flex; align-items: center; justify-content: center;
    color: #2e2e2e; font-size: 1.4rem; cursor: pointer; user-select: none;
  }
  .board-cell:hover { border-color: var(--accent2); color: var(--accent2); }
  .board-tile { position: relative; z-index: 1; min-width: 0; min-height: 0; display: flex; }
  /* Raise a tile while its label is the thing being read, so a neighbouring
     tile's background cannot paint over the overhanging cartouche. */
  .board-tile:hover { z-index: 3; }
  /*  Scrolling belongs to the BODY, not the panel. With overflow:auto on the
      panel, the half of the cartouche that hangs above the top border was
      clipped away — an element cannot overflow a scroll container it lives
      inside. The body scrolls; the panel stays visible so the label can sit
      proud of the frame. */
  .board-tile > .panel {
    flex: 1 1 auto; min-width: 0; overflow: visible;
    display: flex; flex-direction: column;
  }
  .board-tile > .panel > .panel-body {
    flex: 1 1 auto; min-height: 0; overflow: auto;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .board-tile > .panel > .panel-body::-webkit-scrollbar { display: none; }
  .board-tile.dragging { opacity: 0.4; }
  /* The footprint a drop would occupy. Never placed until mouseup. */
  #boardGhost {
    z-index: 2; pointer-events: none; border-radius: 6px;
    border: 2px dashed var(--accent2); background: rgba(51,255,51,0.10);
  }
  #boardGhost.invalid { border-color: #ff5555; background: rgba(255,85,85,0.12); }
  /* A swap is a different move, so it reads as a different colour: solid, not
     dashed, because the outcome is certain rather than provisional. */
  #boardGhost.swap { border-style: solid; border-color: var(--accent); background: rgba(255,85,0,0.14); }
  #boardGhost[hidden] { display: none; }
  .board-tile.swap-target > .panel { outline: 2px solid var(--accent); outline-offset: -2px; }
  .board-empty {
    grid-column: 1 / -1; text-align: center; padding: 40px 10px;
    opacity: 0.35; font-size: 0.85rem;
  }

  /* Grow/shrink a placed tile by a column or row. Only the legal buttons are
     shown — a "+" never appears toward an occupied neighbour or past the edge. */
  .tile-resize { position: absolute; display: flex; gap: 2px; z-index: 4; opacity: 0; transition: opacity 0.15s; }
  .board-tile:hover .tile-resize { opacity: 1; }
  .tile-resize button {
    width: 18px; height: 18px; padding: 0; font-size: 0.8rem; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); border-radius: 3px; background: #000; color: var(--fg); cursor: pointer;
  }
  .tile-resize button:hover { border-color: var(--accent2); color: var(--accent2); }
  .tile-resize-w { right: -9px; top: 50%; transform: translateY(-50%); flex-direction: column; }
  .tile-resize-h { bottom: -9px; left: 50%; transform: translateX(-50%); flex-direction: row; }
  /*  Sits on the top-right corner rather than in the header row, centred on
      the corner arc's own centre of curvature — which is (radius, radius) in
      from the corner, so the circle is offset half its width back from that
      point. Derived from the variables, so changing the panel radius keeps it
      centred without re-tuning any numbers. */
  .tile-remove {
    position: absolute; z-index: 3;
    /* Less the border: absolute offsets are measured from the PADDING edge,
       which is inside the border, while the corner arc lives on the border
       box — without this the circle sits 1px off centre in both axes. */
    top: calc(var(--panel-radius) - var(--close-size) / 2 - var(--panel-border));
    right: calc(var(--panel-radius) - var(--close-size) / 2 - var(--panel-border));
    width: var(--close-size); height: var(--close-size); padding: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; border: 1px solid var(--border); background: var(--panel);
    font-size: 0.7rem; line-height: 1; opacity: 0.5;
  }
  .tile-remove:hover { opacity: 1; border-color: var(--bad); color: var(--bad); }
  /* Keeps any header control from sliding under the overlaid circle. */
  .panel-head { padding-right: calc(var(--close-size) / 2 + 4px); }

  /* ---------- panels ---------- */
  .panel {
    background: var(--panel); border: var(--panel-border) solid var(--border);
    border-radius: var(--panel-radius);
    /* Extra top padding is the room the cartouche occupies where it straddles
       the border; the label is pulled up into it rather than adding a row. */
    padding: 14px 12px 12px; min-width: 0; position: relative;
    /* Container query context: contents respond to the PANEL's width, not the
       viewport's, so the same panel works at 1 cell and at 4. */
    container-type: inline-size;
  }
  .panel-head {
    display: flex; justify-content: space-between; align-items: center;
    gap: 6px; margin-bottom: 8px; flex-wrap: wrap; cursor: grab;
  }
  /*  The title as a cartouche: lifted out of the flow and set ON the top
      border, like a label on a map's neatline. It reclaims the line the header
      used to spend on itself, and the panel's own background masks the border
      behind it so the rule appears to break cleanly around the text. */
  /*  max-width was reserving 90px for header controls that are no longer in
      the row — the close button is an overlay now — which squeezed every
      1-cell title to zero width. The title gets the room; only the drag
      handle, badge and a small margin come out of it. */
  .panel-head-lead {
    position: absolute; top: -7px; left: 10px; z-index: 2;
    display: flex; align-items: center; gap: 5px; max-width: calc(100% - 34px);
    background: var(--panel); padding: 0 6px; border-radius: 3px;
  }
  /* Without an explicit min-width a flex child may collapse entirely rather
     than ellipsise; 3ch keeps at least a stub of the title visible. */
  .panel-head-lead h2 { min-width: 3ch; }
  .panel-head-lead h2 { opacity: 0.75; }
  /* One letter, quiet by default — it is a property of the panel, not a
     control, so it should not compete with the title. */
  .role-badge {
    flex-shrink: 0; font-size: 0.56rem; line-height: 1; padding: 2px 3px;
    border: 1px solid var(--border); border-radius: 2px; opacity: 0.45;
    font-family: var(--mono); cursor: default;
  }
  .role-badge:hover { opacity: 1; }
  .role-badge + .role-badge { margin-left: -3px; }
  /*  In a one-cell panel the handle and badge left the title about 46px — the
      name matters more than the annotation, so the badge stands down. The
      panel is the query container (container-type: inline-size). */
  @container (max-width: 210px) { .role-badge { display: none; } }
  .role-write  { color: var(--accent); border-color: var(--accent); }
  .role-filter { color: var(--accent2); border-color: var(--accent2); }
  /*  With the title absolutely positioned it is no longer a flex item, so
      space-between has nothing to push against and the controls collapse to
      the left — directly under the cartouche. Pin them right instead, and hold
      the row open so it does not lose its height entirely. */
  .panel-head { min-height: 16px; justify-content: flex-end; flex-wrap: nowrap; }
  .board-tile.dragging .panel-head { cursor: grabbing; }
  .panel-head h2 {
    margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 0.66rem; font-weight: 500; opacity: 0.55; line-height: 1.3;
    text-transform: uppercase; letter-spacing: 0.07em;
  }
  /* A four-way move glyph rather than the braille grip dots — it names the
     action instead of implying only a texture to grab. */
  .drag-handle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 17px; height: 17px; flex-shrink: 0;
    border: 1px solid var(--border); border-radius: 3px;
    /* cursor:move states the affordance; the glyph needs a touch more size
       than the grip dots did to stay legible at this scale. */
    background: #000; opacity: 0.35; cursor: move; font-size: 12px; line-height: 1;
  }
  .drag-handle:hover { opacity: 1; border-color: var(--accent2); }

  button, select, input, textarea {
    background: #000; color: var(--fg); border: 1px solid var(--border);
    border-radius: 3px; padding: 3px 7px; font-size: 0.73rem; font-family: inherit; cursor: pointer;
  }
  /* Chrome paints autofilled fields near-white via an internal shadow that
     background alone cannot override; the inset shadow is the standard way to
     repaint it, and the long delay keeps it from flashing back. */
  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus {
    -webkit-text-fill-color: var(--fg);
    -webkit-box-shadow: 0 0 0 1000px #000 inset;
    transition: background-color 9999s ease-in-out 0s;
  }
  input::placeholder, textarea::placeholder { color: var(--fg); opacity: 0.35; }
  button:hover, select:hover { border-color: var(--accent2); color: var(--accent2); }
  input[type=text], input[type=number] { cursor: text; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .hint { font-size: 0.69rem; opacity: 0.45; line-height: 1.55; margin: 6px 0 0; }
  code, .hint code { color: var(--accent2); font-family: var(--mono); }

  /* ---------- flyout: the panel list ---------- */
  #boardFlyoutWrap {
    position: fixed; top: 0; right: 0; bottom: 0; width: 300px; z-index: 60;
    transform: translateX(100%); transition: transform 0.18s ease;
  }
  #boardFlyoutWrap.open { transform: none; }
  #boardFlyout {
    position: absolute; inset: 0; background: #131313;
    border-left: 1px solid var(--border); padding: 10px; overflow-y: auto;
  }
  #boardFlyout h3 { margin: 0 0 8px; font-size: 0.85rem; }
  #boardFlyout label { font-size: 0.72rem; display: flex; align-items: center; gap: 4px; }
  #boardFlyout input[type=number] { width: 54px; }
  #boardSearch { width: 100%; margin-bottom: 8px; }
  #boardFlyoutTab {
    position: absolute; right: 100%; top: 50%; transform: translateY(-50%); z-index: 61;
    padding: 8px 6px; font-size: 1.1rem; line-height: 1; border-radius: 6px 0 0 6px;
  }
  .board-card {
    display: flex; flex-direction: column; gap: 4px;
    border: 1px solid var(--border); border-radius: 5px; background: #0d0d0d;
    padding: 7px 9px; margin-bottom: 6px; cursor: grab; font-size: 0.8rem;
  }
  .board-card:hover { border-color: var(--accent2); }
  .board-card.dragging { opacity: 0.4; }
  .board-card-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .board-card-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board-card-desc { opacity: 0.55; font-size: 0.7rem; line-height: 1.35; margin-left: 28px; }
  .board-card .fp { opacity: 0.7; font-size: 0.72rem; display: flex; align-items: center; gap: 3px; flex-shrink: 0; }
  .board-card .fp input[type=number] { width: 30px; font-size: 0.7rem; padding: 1px 2px; }
  .board-card .fp-add {
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; flex-shrink: 0; border: 1px solid var(--border);
    border-radius: 3px; background: #000; color: var(--fg); opacity: 0.5; cursor: grab; padding: 0;
  }
  .board-card .fp-add:hover { opacity: 1; border-color: var(--accent2); }
  .board-group-heading {
    margin: 12px 0 4px; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; opacity: 0.55;
  }
  .board-group-heading:first-child { margin-top: 0; }

  /* ---------- panel bodies ---------- */
  textarea {
    width: 100%; flex: 1 1 auto; min-height: 96px; resize: none;
    background: #000; color: var(--fg); border: 1px solid var(--border); border-radius: 3px;
    font-family: var(--mono); font-size: 12px; line-height: 1.55; padding: 8px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  /*  The body must actually FILL the panel for the editor's flex:1 to mean
      anything — otherwise the body is content-height, there is no spare space
      to distribute, and the textarea sits at its min-height no matter how much
      room collapsing the menu freed up. min-height:0 lets it shrink below
      content size, which flex items otherwise refuse to do. */
  #pallet .panel { display: flex; flex-direction: column; }
  #pallet .panel-body {
    display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0;
  }
  .panel-head-btn { order: 98; flex-shrink: 0; padding: 0 6px; font-size: 0.7rem; line-height: 1.4; }
  .panel-head-btn.on { border-color: var(--accent2); color: var(--accent2); }
  .panel-head-btn[hidden] { display: none; }
  /* The log shares the bar rather than owning a line of its own; it is
     usually empty, and an empty element still reserved height. */
  /* :empty so a quiet status line costs no height at all. */
  .pallet-status {
    display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 0.66rem; opacity: 0.5; margin-bottom: 5px;
  }
  .pallet-status:empty { display: none; }
  .pallet-menu {
    display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 7px; padding: 7px;
    border: 1px solid var(--border); border-radius: 4px; background: #0d0d0d;
  }
  .pallet-menu[hidden] { display: none; }
  .pallet-menu .hint { flex-basis: 100%; }

  .lines { font-family: var(--mono); font-size: 11.5px; }
  .ln { display: flex; align-items: baseline; gap: 8px; padding: 2px 8px; margin: 1px 0;
        border-left: 3px solid var(--border); background: #0d0d0d; }
  .ln.ok { border-left-color: var(--accent); }
  .ln.ok.draft { border-left-color: var(--draft); }
  .ln.bad { border-left-color: var(--bad); background: #1a0d0d; }
  .ln.comment { border-left-color: #444; background: transparent; opacity: 0.55; }
  .ln .num { width: 26px; text-align: right; opacity: 0.3; flex-shrink: 0; }
  .ln .ico { width: 19px; flex-shrink: 0; }
  .ln .body { flex: 1; min-width: 0; word-break: break-word; }
  .ln .body .name { opacity: 0.55; font-style: italic; }
  .ln.draft .body { color: var(--draft); }
  .ln .tag { font-size: 9.5px; opacity: 0.5; background: #000; border: 1px solid var(--border);
             padding: 0 5px; border-radius: 3px; flex-shrink: 0; text-transform: uppercase; }
  /* At one cell wide the tag goes — the icon already says what it says. */
  @container (max-width: 340px) { .ln .tag { display: none; } }

  .ent-controls { display: flex; gap: 4px; margin-bottom: 6px; }
  .ent-controls input { flex: 1; min-width: 50px; }
  .ent-kinds { display: flex; gap: 3px; flex-shrink: 0; }
  .ent-controls button { padding: 1px 6px; font-size: 0.8rem; line-height: 1.3; flex-shrink: 0; opacity: 0.45; }
  .ent-controls button.on { opacity: 1; border-color: var(--accent2); }
  .ents { display: flex; flex-wrap: wrap; gap: 5px; }
  .ent { font-family: var(--mono); font-size: 11px; padding: 2px 7px; border-radius: 3px;
         border: 1px solid var(--accent); color: var(--accent); background: #000; white-space: nowrap; }
  /* Border STYLE carries the state as well as colour, so it survives greyscale
     and colour-blind viewing. */
  .ent.draft { border-color: var(--draft); color: var(--draft); border-style: dashed; }
  .ent.ghost { border-color: var(--ghost); color: var(--ghost); border-style: dotted; }
  .ent .n { opacity: 0.45; margin-left: 5px; }
  .ent { cursor: pointer; }
  .ent.focused { background: #051705; box-shadow: 0 0 0 1px var(--accent2); }

  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 7px; }
  .stat { background: #000; border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; }
  .stat .v { font-size: 1.1rem; font-family: var(--mono); line-height: 1.1; }
  .stat .k { font-size: 0.6rem; opacity: 0.45; text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }

  .issues { font-size: 11px; font-family: var(--mono); line-height: 1.7; }
  .issues .warn { color: var(--ghost); }
  .issues .err { color: var(--bad); }
  .issues .none { opacity: 0.4; font-family: system-ui, sans-serif; }

  table { border-collapse: collapse; width: 100%; font-size: 11.5px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #262626; vertical-align: top; }
  th { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.45; font-weight: 500; }
  td.mono { font-family: var(--mono); color: var(--accent2); white-space: nowrap; }

  /* ---------- filter ---------- */
  .flt-group { margin-bottom: 8px; }
  .flt-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.07em; opacity: 0.4; margin-bottom: 4px; }
  .flt-chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .flt-chips button { font-size: 0.7rem; padding: 2px 7px; }
  .flt-chips button.on { border-color: var(--accent2); color: var(--accent2); background: #051705; }
  .flt-chips button.on[data-status="verified"] { border-color: var(--accent); color: var(--accent); background: #170a05; }
  .flt-chips button.on[data-status="draft"] { border-color: var(--draft); color: var(--draft); background: #0d1115; }
  .flt-chips .count { opacity: 0.45; margin-left: 4px; font-size: 0.62rem; }
  .flt-chips .lbl { margin-left: 4px; }
  /* One cell wide there is no room for the words; the emoji still says it, and
     the tooltip carries the rest. */
  @container (max-width: 250px) { .flt-chips .lbl { display: none; } }
  /* When a filter is on, every panel showing a subset says so — a filtered
     count that looks like a total is how people misread their own data. */
  .time-row { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
  .time-row input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  .time-read {
    font-family: var(--mono); font-size: 0.68rem; color: var(--accent2);
    white-space: nowrap; flex-shrink: 0;
  }
  .time-sub { font-size: 0.6rem; opacity: 0.4; flex-shrink: 0; width: 26px; }
  .filtered-note {
    font-size: 0.6rem; color: var(--accent2); opacity: 0.8;
    text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 5px;
  }

  /* ---------- document viewer ---------- */
  .doc-pos { font-size: 0.65rem; opacity: 0.5; font-family: var(--mono); }
  .doc-viewport {
    position: relative; overflow: hidden; margin-bottom: 8px;
    height: clamp(160px, 40cqh, 60vh);
    border: 1px solid var(--border); border-radius: 4px; background: #0d0d0d;
    cursor: grab; touch-action: none;
  }
  .doc-viewport.panning { cursor: grabbing; }
  .doc-viewport canvas { display: block; width: 100%; height: 100%; }
  .doc-zoom {
    position: absolute; left: 6px; bottom: 6px; display: flex; align-items: center; gap: 3px;
    background: rgba(0,0,0,0.72); border: 1px solid var(--border); border-radius: 4px; padding: 2px 4px;
  }
  .doc-zoom button { padding: 1px 6px; font-size: 0.7rem; }
  .doc-zoom span { font-size: 0.66rem; opacity: 0.65; width: 40px; text-align: center; font-family: var(--mono); }
  .doc-overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 14px; font-size: 0.72rem; opacity: 0.5; line-height: 1.6; pointer-events: none;
  }
  .doc-overlay.bad { color: var(--bad); opacity: 0.9; }
  /* container-query unit above needs the panel as the container; the tile is
     already one, so 40cqh tracks the panel's own height as it is resized. */
  .doc-nosrc {
    border: 1px dashed var(--border); border-radius: 4px; padding: 14px; margin-bottom: 8px;
    font-size: 0.7rem; opacity: 0.45; text-align: center; line-height: 1.6;
  }
  .doc-raw {
    font-family: var(--mono); font-size: 11.5px; background: #000; border-radius: 3px;
    padding: 6px 8px; margin-bottom: 8px; word-break: break-all; line-height: 1.5;
    border-left: 3px solid var(--accent);
  }
  .doc-raw.draft { border-left-color: var(--draft); color: var(--draft); }
  .doc-meta { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 0.72rem; margin-bottom: 8px; }
  .doc-meta dt { opacity: 0.4; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.06em; padding-top: 2px; }
  .doc-meta dd { margin: 0; }
  .doc-names { display: flex; flex-wrap: wrap; gap: 4px; }
  .doc-names button { font-size: 0.7rem; padding: 1px 7px; }
  .doc-names button.ghost { border-color: var(--ghost); color: var(--ghost); border-style: dotted; }

  /* ---------- files ---------- */
  .file-list { display: flex; flex-direction: column; gap: 3px; margin-top: 7px; }
  .file-item {
    display: flex; align-items: center; gap: 6px; padding: 4px 7px; flex-wrap: wrap;
    border: 1px solid var(--border); border-radius: 3px; background: #000; font-size: 0.73rem;
  }
  .file-item.current { border-color: var(--accent); }
  /*  min-width:0 let this shrink to 1px in a one-cell panel — the filename was
      not truncated, it was gone. A floor keeps it readable, and the row wraps
      rather than crushing it further. */
  .file-item .nm { flex: 1 1 auto; min-width: 68px; overflow: hidden; text-overflow: ellipsis;
                   white-space: nowrap; font-family: var(--mono); font-size: 0.7rem; }
  .file-item .meta { font-size: 0.62rem; opacity: 0.45; flex-shrink: 0; font-family: var(--mono); }
  .file-item button { padding: 0 6px; font-size: 0.68rem; }
  .file-empty { font-size: 0.7rem; opacity: 0.45; line-height: 1.6; }
  /* ---------- timeline ---------- */
  #timeline .panel-body { display: flex; flex-direction: column; }
  /* Reserves its line always (&nbsp;) so hovering does not shift the lanes. */
  /*  Wraps rather than truncating: this line exists to show the detail, and a
      source citation or a long description is exactly the case where it
      matters. Capped at two lines so a verbose brick cannot push the lanes
      around, and min-height still reserves the first line so hovering never
      shifts the layout. */
  .tl-detail {
    /* Reserves BOTH lines it can grow to. At one line the box changed height
       on hover and pushed every lane down — the marks moved out from under the
       pointer, which is worse than the wasted line. */
    font-size: 0.68rem; line-height: 1.4; min-height: 2.8em; margin-bottom: 4px;
    color: var(--accent2); white-space: normal; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
  }
  /* Left margin matches .tl-name + its gap so the axis starts where the tracks
     do; without it every tick sat left of the marks it labelled. */
  .tl-scale {
    position: relative; height: 11px; flex-shrink: 0;
    border-bottom: 1px solid var(--border); margin: 0 0 3px 84px;
    overflow: hidden;
  }
  .tl-tick {
    position: absolute; top: 0; font-size: 8.5px; opacity: 0.4;
    transform: translateX(-50%); white-space: nowrap;
  }
  .tl-lanes {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .tl-lanes::-webkit-scrollbar { display: none; }
  /* min-height rather than height: a fixed height forces overflow the moment
     anything inside rounds up a fraction of a pixel. */
  .tl-lane { display: flex; align-items: center; gap: 6px; min-height: 15px; flex-shrink: 0; }
  .tl-name {
    width: 78px; max-width: 40%; flex-shrink: 0; font-size: 0.64rem; opacity: 0.6;
    cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tl-name:hover { opacity: 1; color: var(--accent2); }
  /* min-width:0 lets the track shrink inside the flex row instead of forcing
     the lane wider than the panel. */
  .tl-track { position: relative; flex: 1 1 auto; min-width: 0; height: 100%; }
  /* The span of a life as recorded — first mark to last. */
  .tl-span {
    position: absolute; top: 50%; height: 1px; background: var(--border); transform: translateY(-50%);
  }
  .tl-dot {
    position: absolute; top: 50%; width: 6px; height: 6px; border-radius: 50%;
    background: var(--draft); transform: translate(-50%, -50%); cursor: pointer;
  }
  .tl-dot.verified { background: var(--accent); }
  /* Hollow = the year came from prose, not a date field. */
  .tl-dot.loose { background: none; border: 1px solid var(--draft); }
  .tl-dot.loose.verified { border-color: var(--accent); }
  .tl-dot:hover { box-shadow: 0 0 0 2px var(--accent2); z-index: 2; }
  .tl-empty { font-size: 0.7rem; opacity: 0.45; }

  /* ---------- gazetteer ---------- */
  .gaz-list { display: flex; flex-direction: column; gap: 3px; max-height: 100%; overflow: auto; }
  .gaz-row {
    display: flex; align-items: center; gap: 5px; padding: 2px 6px;
    border: 1px solid var(--border); border-radius: 3px; background: #000; font-size: 0.72rem;
  }
  .gaz-row:focus-within { border-color: var(--accent2); }
  .gaz-row.locked { opacity: 0.6; }
  .gaz-row.orphan { opacity: 0.5; }
  .gaz-name {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    cursor: pointer;
  }
  .gaz-name:hover { color: var(--accent2); }
  .gaz-row input[type=number] {
    width: 74px; flex-shrink: 0; font-family: var(--mono); font-size: 0.68rem; padding: 2px 4px;
  }
  .gaz-row input[type=number]:disabled { opacity: 0.5; cursor: not-allowed; }
  .gaz-static { font-size: 0.64rem; opacity: 0.6; font-family: var(--mono); flex-shrink: 0; }
  .gaz-label { flex-shrink: 0; font-size: 0.64rem; padding: 1px 2px; max-width: 74px; }
  .gaz-icon { width: 34px; flex-shrink: 0; text-align: center; padding: 1px 2px; }
  .gaz-menu {
    display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 7px; padding: 7px;
    border: 1px solid var(--border); border-radius: 4px; background: #0d0d0d;
  }
  .gaz-menu[hidden] { display: none; }
  .gaz-sub {
    font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.4;
    margin: 8px 0 2px;
  }
  .gaz-add input[type=text] { flex: 1; min-width: 60px; }
  .gaz-add input[type=number] { width: 66px; flex-shrink: 0; }


  /* ---------- brick builder ---------- */
  .bld-row { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin-bottom: 7px; }
  .bld-type button { font-size: 0.9rem; padding: 2px 6px; line-height: 1.3; }
  .bld-type button.active { border-color: var(--accent2); background: #051705; }
  .bld-status button.active[data-st="+"] { border-color: var(--accent); color: var(--accent); }
  .bld-status button.active[data-st="-"] { border-color: var(--draft); color: var(--draft); }
  .bld-field { display: flex; flex-direction: column; gap: 2px; margin-bottom: 6px; }
  .bld-field label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.45; }
  .bld-field input { width: 100%; font-family: var(--mono); font-size: 11.5px; padding: 4px 6px; }
  .bld-field .sub { font-size: 0.63rem; opacity: 0.4; }
  .bld-alias-wrap { display: flex; gap: 4px; }
  .bld-alias-wrap input.num { width: 46px; flex-shrink: 0; }
  /* Every uid already in the pile, visible and clickable — a datalist only
     helps if you already know what you are looking for. */
  .uid-picker { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; max-height: 108px; overflow: auto; }
  .uid-picker button {
    font-size: 0.66rem; padding: 1px 6px; font-family: var(--mono);
    border-color: #2c2c2c; opacity: 0.8;
  }
  .uid-picker button:hover { opacity: 1; }
  .uid-picker button.on { border-color: var(--accent2); color: var(--accent2); background: #051705; opacity: 1; }
  .uid-picker button.ghost { border-style: dotted; color: var(--ghost); border-color: var(--ghost); }
  .uid-picker .none { font-size: 0.65rem; opacity: 0.4; }
  /* The line the builder will actually write. Shown before it is committed, so
     the notation stays visible — the builder is a way into the text, not a
     replacement for reading it. */
  .bld-preview {
    font-family: var(--mono); font-size: 11.5px; background: #000; border-radius: 3px;
    padding: 6px 8px; margin: 8px 0 7px; word-break: break-all; line-height: 1.5;
    border-left: 3px solid var(--accent);
  }
  .bld-preview.draft { border-left-color: var(--draft); color: var(--draft); }
  .bld-preview.bad { border-left-color: var(--bad); color: var(--bad); }
  /* Said before you commit, not after: a uid clash is easier to avoid than to
     unpick once it is in the pile. */
  .bld-clash {
    font-size: 0.68rem; color: var(--bad); line-height: 1.5;
    border: 1px dashed var(--bad); border-radius: 3px; padding: 5px 7px; margin-bottom: 7px;
  }
  .bld-editing { font-size: 0.65rem; color: var(--accent2); margin-bottom: 6px; }
  /* Classification lines are clickable when the builder is available. */
  .ln { cursor: pointer; }
  .ln:hover { outline: 1px solid #444; }
  .ln.editing { outline: 1px solid var(--accent2); }

  /* ---------- map ---------- */
  /* Fill the panel rather than a fixed slice of it, so dragging the tile
     taller actually gives the map the space. The panel body is the flex
     parent; min-height keeps it usable in a 1-row tile. */
  #viz-map .panel-body { display: flex; flex-direction: column; height: 100%; }
  .map-shell { position: relative; flex: 1 1 auto; min-height: 200px; border-radius: 4px; overflow: hidden; }
  /* width/height, not inset: MapLibre adds .maplibregl-map to this same
     element and its own rules were collapsing it to height:0, which clipped
     the whole map away under .map-shell's overflow:hidden. Explicit
     dimensions win regardless of what the library sets. */
  .map-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  /* A marker is a plain DOM element the map positions — no source, no tiling,
     no style dependency, and it survives a basemap switch untouched. */
  .map-marker {
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--draft); border: 1.5px solid #0d1317;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.5); cursor: pointer; position: relative;
  }
  .map-marker.verified { background: var(--accent); }
  /*  An icon marker drops the dot's own shape entirely and draws the glyph, so
      the emoji is the mark rather than sitting on top of a circle. Status can
      no longer be read from fill, so a coloured ring carries it instead. */
  .map-marker.as-icon {
    width: auto; height: auto; background: none; border: none; box-shadow: none;
    font-size: 15px; line-height: 1; text-shadow: 0 0 3px #0d1317, 0 0 2px #0d1317;
    display: flex; align-items: center; justify-content: center;
    transform: translateY(-2px);
  }
  .map-marker.as-icon::before { content: attr(data-glyph); }
  .map-marker.as-icon.verified { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 50%; }
  .map-marker-label {
    position: absolute; font-size: 10px; line-height: 1.2; white-space: nowrap;
    color: #cfd6dc; text-shadow: 0 0 3px #0d1317, 0 0 2px #0d1317; pointer-events: none;
  }
  .lbl-bottom .map-marker-label { left: 50%; top: 13px; transform: translateX(-50%); }
  .as-icon.lbl-bottom .map-marker-label { top: 17px; }
  .as-icon.lbl-top .map-marker-label { bottom: 17px; }
  .lbl-top    .map-marker-label { left: 50%; bottom: 13px; transform: translateX(-50%); }
  .lbl-right  .map-marker-label { left: 15px; top: 50%; transform: translateY(-50%); }
  .lbl-left   .map-marker-label { right: 15px; top: 50%; transform: translateY(-50%); }
  .lbl-none   .map-marker-label { display: none; }
  /* Deliberately tiny and non-interactive: a credit line, not a UI element. */
  .map-attrib {
    position: absolute; right: 4px; bottom: 3px; z-index: 2; pointer-events: none;
    font-size: 8.5px; line-height: 1.4; letter-spacing: 0.01em;
    color: #cfd6dc; opacity: 0.45; text-shadow: 0 0 3px #0d1317, 0 0 2px #0d1317;
  }
  .map-attrib[hidden] { display: none; }
  .map-note {
    position: absolute; left: 8px; bottom: 8px; z-index: 2;
    font-size: 0.68rem; background: rgba(0,0,0,0.75); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 8px; pointer-events: none;
  }
  /* MapLibre's own chrome, restyled to sit inside a dark panel rather than a
     full-page map. */
  .maplibregl-ctrl-top-right { top: 6px; right: 6px; }
  .maplibregl-ctrl-group { background: #111 !important; border: 1px solid var(--border) !important; }
  .maplibregl-ctrl-group button { background: transparent !important; }
  .maplibregl-ctrl-attrib { background: rgba(0,0,0,0.6) !important; font-size: 10px !important; }
  .maplibregl-ctrl-attrib a { color: #9fb0bd !important; }
  .maplibregl-popup-content { background: #111 !important; color: var(--fg) !important; }

  .slot-empty { display: flex; flex-direction: column; gap: 9px; }
  .slot-desc { font-size: 0.74rem; opacity: 0.5; }
  .slot-note { font-size: 0.69rem; opacity: 0.45; border: 1px dashed var(--border);
               border-radius: 4px; padding: 9px; line-height: 1.65; }
  .feed { font-family: var(--mono); font-size: 11px; opacity: 0.75; line-height: 1.7; }
  .feed b { color: var(--accent); font-weight: normal; }
</style>
</head>
<body>

<div class="topbar">
  <h1><span class="brickmark">🧱</span> Brick by Brick</h1>
  <p class="tagline">A notation system where you define the symbols. Add a brick, the connections emerge.</p>
  <!-- Same filter state as the Filter panel's search, reachable without it. -->
  <div class="topsearch" id="topsearch">
    <input type="text" id="topsearchInput" placeholder="find in the text…" spellcheck="false">
    <button id="topsearchBtn" title="search the pile">&#128269;</button>
  </div>
</div>

<div id="board"></div>

<div id="boardFlyoutWrap">
  <button type="button" id="boardFlyoutTab" title="show/hide the panel list">&#129520;</button>
  <div id="boardFlyout">
    <h3>Panels</h3>
    <div class="row">
      <label>Columns <input type="number" id="boardCols" min="1" max="12" step="1" value="4"></label>
      <label>Row px <input type="number" id="boardRowUnit" min="80" max="600" step="10" value="220"></label>
      <button type="button" id="boardFlyoutClose" title="hide the list">&times;</button>
    </div>
    <div class="row"><button type="button" id="boardReset" title="back to the starting board">reset board</button></div>
    <input type="text" id="boardSearch" placeholder="search panels&hellip;" spellcheck="false">
    <div id="boardCardList"></div>
  </div>
</div>

<div id="panelStore" hidden></div>

<template id="tpl-pallet">
  <!-- One compact bar. The eight buttons and the syntax hint used to sit open
       above the editor and cost more vertical space than the text itself. -->
  <div class="pallet-menu" data-el="menu" hidden>
    <button data-act="sample" title="replace the text with the bundled Bricknall sample">Sample</button>
    <button data-act="clear" title="empty the pallet">Clear</button>
    <button data-act="copy" title="copy the raw notation to the clipboard">Copy</button>
    <button data-act="export" title="save the notation as a .txt file">Export</button>
    <button data-act="import" title="open a .txt file of bricks — replaces what is here">Import</button>
    <button data-act="merge" title="add one or more .txt files to this pile, keeping what is already here">Merge</button>
    <button data-act="folder" title="read every .txt in a folder, including subfolders, and merge them in filename order">Folder…</button>
    <button data-act="rescan" hidden title="read that folder again — duplicates are skipped, so only new bricks come in">Rescan</button>
    <p class="hint" style="margin:6px 0 0"><code>[status]|[type]|[field]|[field]|[linkage]</code><br><code>+</code> verified, <code>-</code> draft.</p>
  </div>
  <span class="pallet-status" data-el="mergelog"></span>
  <!-- Above the editor: this is how you choose what goes ON the pallet. -->
  <div class="file-list" data-el="files"></div>
  <textarea data-el="text" spellcheck="false" placeholder="+|👤|<someone>|A description"></textarea>
</template>
<template id="tpl-classification">
  <div class="filtered-note" data-el="note" hidden></div>
  <div class="lines" data-el="lines"></div>
</template>
<template id="tpl-entities">
  <div class="ent-controls">
    <input type="text" data-el="local" placeholder="filter…" spellcheck="false">
    <span class="ent-kinds" data-el="kinds"></span>
  </div>
  <div class="ents" data-el="ents"></div>
  <p class="hint" data-el="entnote">solid verified &middot; dashed draft &middot; dotted ghost</p>
</template>
<template id="tpl-builder">
  <div class="bld-editing" data-el="editing" hidden></div>
  <div class="bld-row bld-status" data-el="status"></div>
  <div class="bld-row bld-type" data-el="type"></div>
  <div data-el="fields"></div>
  <div class="bld-preview" data-el="preview"></div>
  <div class="bld-clash" data-el="clash" hidden></div>
  <div class="bld-row">
    <button data-act="commit">Add brick</button>
    <button data-act="cancel" hidden>Cancel edit</button>
    <button data-act="clearfields" title="empty the fields, keep the type">Clear</button>
  </div>
  <datalist data-el="aliases"></datalist>
  <p class="hint">Click any line in Classification to load it here for editing.</p>
</template>

<template id="tpl-filter">
  <div class="row">
    <input type="text" data-el="text" placeholder="find in the text&hellip;" spellcheck="false" style="flex:1;min-width:90px">
    <button data-act="clear" title="show everything again">reset</button>
  </div>
  <div class="flt-group"><div class="flt-label">Confidence</div><div class="flt-chips" data-el="status"></div></div>
  <div class="flt-group"><div class="flt-label">Kind</div><div class="flt-chips" data-el="types"></div></div>
  <div class="flt-group">
    <div class="flt-label" data-el="sectionlabel">Your headings</div>
    <div class="flt-chips" data-el="sections"></div>
  </div>
  <div class="flt-group" data-el="focuswrap" hidden>
    <div class="flt-label">Focused on</div>
    <div class="flt-chips" data-el="focus"></div>
  </div>
  <div class="flt-group">
    <div class="flt-label">Time</div>
    <div class="flt-chips" data-el="timemode"></div>
    <div data-el="timebody"></div>
  </div>
  <p class="hint" data-el="summary"></p>
</template>

<template id="tpl-document">
  <div class="row">
    <button data-act="prev" title="previous document">&larr;</button>
    <span class="doc-pos" data-el="pos"></span>
    <button data-act="next" title="next document">&rarr;</button>
    <button data-act="open" hidden title="open the original in a new tab">open &#8599;</button>
    <button data-act="edit" hidden title="load this brick into the Brick Builder">edit</button>
  </div>
  <div class="doc-viewport" data-el="viewport">
    <canvas data-el="canvas"></canvas>
    <div class="doc-zoom">
      <button data-act="zoomout" title="zoom out">&minus;</button>
      <span data-el="zoomlabel">100%</span>
      <button data-act="zoomin" title="zoom in">+</button>
      <button data-act="fit" title="fit the whole scan in the panel">Fit</button>
      <button data-act="actual" title="actual pixels">1:1</button>
    </div>
    <div class="doc-overlay" data-el="overlay" hidden></div>
  </div>
  <div data-el="view"></div>
</template>

<template id="tpl-gazetteer">
  <!-- File actions live behind the header menu; only the row you actually
       type into stays on show. -->
  <div class="gaz-menu" data-el="menu" hidden>
    <button data-act="load" title="add one or more gazetteer .csv files">Load&hellip;</button>
    <button data-act="export" title="save the loaded gazetteer as a .csv file">Export</button>
    <button data-act="clear" title="forget every loaded entry">Clear</button>
  </div>
  <div class="row gaz-add">
    <input type="text" data-el="newname" placeholder="new place…" spellcheck="false">
    <input type="number" step="any" data-el="newlat" placeholder="lat">
    <input type="number" step="any" data-el="newlng" placeholder="lng">
    <button data-act="add" title="declare this place and set its coordinates">Add</button>
  </div>
  <p class="hint" data-el="summary" style="margin:0 0 7px"></p>
  <div class="gaz-list" data-el="list"></div>
</template>

<template id="tpl-timeline">
  <div class="tl-detail" data-el="detail">&nbsp;</div>
  <div class="tl-scale" data-el="scale"></div>
  <div class="tl-lanes" data-el="lanes"></div>
</template>

<template id="tpl-count"><div class="stats" data-el="stats"></div></template>
<template id="tpl-notes"><div class="issues" data-el="issues"></div></template>
<template id="tpl-reference"><div data-el="ref"></div></template>

<script>
"use strict";
/* ==========================================================================
   BRICK BY BRICK
   --------------------------------------------------------------------------
     1. PARSE   text   -> bricks[]                    (forgiving, positionless)
     2. MODEL   bricks -> {entities, edges, stats}    (one object, handed on)
     3. BOARD   a coordinate grid of tiles you place yourself
     4. VIZ     a registry — every visualization is a panel you drop on the board

   A visualization is not a tab or a mode. It is a panel like any other, given a
   footprint on the board, so several can sit side by side reading the same
   model at once. One pile of bricks, many simultaneous readings of it.
   ========================================================================== */

/* --------------------------------------------------------------------------
   1. PARSE
   -------------------------------------------------------------------------- */

const TYPES = {
  person:   { icon: "👤", kind: "person",   label: "person"   },
  birth:    { icon: "👶", kind: "event",    label: "birth"    },
  marriage: { icon: "🔔", kind: "event",    label: "marriage" },
  death:    { icon: "⚰️", kind: "event",    label: "death"    },
  place:    { icon: "📍", kind: "place",    label: "location" },
  document: { icon: "📜", kind: "document", label: "document" },
  census:   { icon: "✏️", kind: "census",   label: "census"   },
};

// Emoji, full word and single letter are all first-class. This table is the
// extension point: add a row and the parser, classifier, counts and every panel
// pick it up with no other edit.
const TOKENS = {
  "👤": "person", person: "person", p: "person",
  "👶": "birth", birth: "birth", b: "birth",
  "🔔": "marriage", marriage: "marriage", m: "marriage",
  "⚰️": "death", death: "death", d: "death",
  "📍": "place", location: "place", place: "place", l: "place",
  "📜": "document", document: "document", doc: "document",
  "✏️": "census", census: "census", c: "census",
};

const RE_DATE = /^\d{4}(-\d{2})?(-\d{2})?$/;
const RE_EST = /~\s*(\d{4})/;
const RE_UNKNOWN = /^\?+$/;
const RE_ALIAS = /<([^<>]*)>/g;

/*  A coordinate pair, as your earlier spec wrote it: "56.463, -2.977".

    Recognised by shape like everything else. It cannot be confused with a
    linkage field (no '@'), a date (no comma) or a source (no dot-slash or
    extension), so it needs no keyword. Latitude first, as every geographic
    convention outside of a few APIs has it. */
const RE_COORDS = /^\s*([-+]?\d{1,2}(?:\.\d+)?)\s*,\s*([-+]?\d{1,3}(?:\.\d+)?)\s*$/;
function readCoords(field) {   // "56.463, -2.977" -> {lat, lng}
  const m = String(field || "").match(RE_COORDS);
  if (!m) return null;
  const lat = Number(m[1]), lng = Number(m[2]);
  // Out-of-range numbers are almost certainly something else that happens to
  // have a comma in it, so they are left as text rather than silently wrong.
  if (!isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
  return { lat, lng };
}

/*  A source reference: the actual scan, photo or page a document brick stands
    for. Recognised by shape like everything else — a URL, a path, or a filename
    with an image/pdf extension — so it can sit in any field position without a
    keyword. Deliberately tight: '377/4/1' (a census reference) must NOT look
    like a path, so a bare slash is not enough. */
const RE_SOURCE = /^(https?:\/\/\S+|data:image\/\S+|\.{0,2}\/\S+|\S+\.(?:jpe?g|png|gif|webp|avif|svgz?|tiff?|pdf))(\?\S*)?$/i;
function looksLikeSource(s) { return RE_SOURCE.test((s || "").trim()); }

// Anything rendered as a link or an <img> passes through here first. A brick
// file can be shared, and a shared file must not be able to run script in the
// reader's page.
function safeSrc(s) {
  const t = (s || "").trim();
  if (!t) return "";
  if (/^\s*(javascript|vbscript|file):/i.test(t)) return "";
  if (/^data:/i.test(t) && !/^data:image\//i.test(t)) return "";
  return t;
}
function isImageSrc(s) {
  return /^data:image\//i.test(s) || /\.(jpe?g|png|gif|webp|avif|svgz?|tiff?)(\?|$)/i.test(s);
}

function normalizeToken(tok) {
  const t = (tok || "").trim();
  return TOKENS[t] || TOKENS[t.toLowerCase()] || null;
}

// '<3><george>' -> {slug:'george', num:3}; a bare number is a disambiguator.
function readAliases(field) {
  const found = []; let m;
  RE_ALIAS.lastIndex = 0;
  while ((m = RE_ALIAS.exec(field)) !== null) found.push(m[1].trim());
  if (!found.length) return null;
  let num = null; const parts = [];
  for (const f of found) { if (/^\d+$/.test(f)) num = Number(f); else parts.push(f); }
  // Canonicalised here, not just in the builder: <George Isles> typed by hand
  // and <george-isles> from the form must be the same uid. Two spellings of one
  // uid is a duplicate uid, which the rules do not allow.
  const slug = slugify(parts.join("-"));
  return slug ? { slug, num } : null;
}

// Handles the real-world quirk: '@george,james,dora-edmed' types '@' once and
// the rest of the comma list inherits it. Requiring '@' per token would
// silently drop siblings.
function readLinks(field) {
  if (!field || field.indexOf("@") === -1) return [];
  // Same canonicalisation as declarations, so @George Isles finds <george-isles>
  // instead of quietly creating a ghost beside it.
  return field.split(",")
    .map(s => slugify(s.trim().replace(/^@/, "").replace(/[<>]/g, "")))
    .filter(Boolean);
}

function looksLikeDate(s) {
  const t = (s || "").trim();
  return RE_DATE.test(t) || RE_UNKNOWN.test(t) || RE_EST.test(t);
}
/*  Type "George Isles" or "Rankie's Court" and get <george-isles> /
    <rankies-court>. The uid is machine-facing — lowercase, hyphenated, no
    punctuation — but nobody should have to type it that way. Apostrophes are
    dropped rather than hyphenated, so "Rankie's" stays one word. */
function slugify(s) {   // "St Clement" -> st-clement; canonical form of every uid
  return String(s).trim().toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/['\u2019]/g, "")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");
}

function titleCase(slug) {
  return String(slug).split("-").filter(Boolean)
    .map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
}
function displayFor(a) {
  if (!a) return "";
  return a.num !== null && a.num !== undefined ? titleCase(a.slug) + " (" + a.num + ")" : titleCase(a.slug);
}

/*  Fields are read by SHAPE rather than by fixed position after the leading
    slots. The real corpus is inconsistent — some census rows carry an extra
    pipe, some documents put linkage where the spec puts a description — and a
    notation whose premise is "you define the symbols" cannot then punish the
    author for a stray column. Anything unplaceable becomes a note; the line
    still parses. */
function parseLine(raw, lineNumber, section) {
  const trimmed = raw.trim();
  const brick = {
    lineNumber, raw, section, status: null, type: null, kind: null, icon: "",
    alias: null, name: "", detail: "", src: "", url: "", coords: null, text: [], date: null, estimate: null,
    age: null, links: [], valid: false, notes: [], empty: false, comment: false,
  };

  if (!trimmed) { brick.empty = true; return brick; }

  if (trimmed.startsWith("#")) {
    brick.comment = true; brick.valid = true; brick.kind = "comment";
    brick.icon = "💬"; brick.name = trimmed.replace(/^#+\s*/, "");
    return brick;
  }
  if (trimmed[0] !== "+" && trimmed[0] !== "-") {
    brick.notes.push({ level: "err", msg: "no +/- status prefix" });
    return brick;
  }

  const parts = trimmed.split("|").map(s => s.trim());
  brick.status = parts[0] === "+" ? "verified" : "draft";

  const type = normalizeToken(parts[1]);
  if (!type) {
    brick.notes.push({ level: "err", msg: "unknown type token “" + (parts[1] || "") + "”" });
    brick.icon = "❓";
    return brick;
  }
  brick.type = type; brick.kind = TYPES[type].kind; brick.icon = TYPES[type].icon; brick.valid = true;

  const rest = parts.slice(2);
  let start = 0;

  if (brick.kind === "person" || brick.kind === "place") {
    const a = readAliases(rest[0] || "");
    if (a) { brick.alias = a; start = 1; }
    else brick.notes.push({ level: "warn", msg: TYPES[type].label + " has no <uid>" });
  } else if (brick.kind === "census") {
    // '-|✏️|1891|George|22 1891-22 ~1869' — year, forename, then an age blob
    // that may carry the author's own arithmetic. The working is part of the
    // record, so the blob is kept verbatim too.
    if (looksLikeDate(rest[0])) { brick.date = rest[0]; start = 1; }
    if (rest[start] && !looksLikeDate(rest[start])) { brick.name = rest[start]; start++; }
    // Everything left is the age blob EXCEPT a linkage field. Without this the
    // '@george-isles' on the end got swallowed into the blob and the row
    // attached to nobody — which is the whole point of putting it there.
    const tail = rest.slice(start);
    for (const f of tail) if (f.indexOf("@") !== -1) brick.links.push(...readLinks(f));
    const blob = tail.filter(f => f.indexOf("@") === -1).join(" ");
    const ageM = blob.match(/(?:^|\s)(\d{1,3})(?:\s|$)/);
    if (ageM) brick.age = Number(ageM[1]);
    const estM = blob.match(RE_EST);
    if (estM) brick.estimate = Number(estM[1]);
    // 1841 rounded adult ages down to the nearest five, so a derived year is a
    // range, never a date. Record it as an estimate and say so.
    else if (brick.age !== null && brick.date && RE_DATE.test(brick.date)) {
      brick.estimate = Number(brick.date.slice(0, 4)) - brick.age;
      brick.notes.push({ level: "warn", msg: "birth year " + brick.estimate + " derived from age, not recorded" });
    }
    if (blob) brick.text.push(blob);
    start = rest.length;
  } else if (brick.kind === "document") {
    // A document may name itself, so it can be cited: an unciteable source is
    // no source at all. The alias is checked before the subtype because
    // '<birth-cert-1894>' would otherwise be swallowed as a subtype string.
    const a = readAliases(rest[0] || "");
    if (a) { brick.alias = a; start = 1; }
    if (rest[start] && !looksLikeDate(rest[start]) && rest[start].indexOf("@") === -1) {
      brick.subtype = normalizeToken(rest[start]) || rest[start];
      start++;
    }
  } else if (brick.kind === "event") {
    const a = readAliases(rest[0] || "");
    if (a && !looksLikeDate(rest[0])) { brick.alias = a; start = 1; }
  }

  for (let i = start; i < rest.length; i++) {
    const f = rest[i];
    if (!f) continue;
    if (f.indexOf("@") !== -1) { brick.links.push(...readLinks(f)); continue; }
    if (!brick.coords) { const c = readCoords(f); if (c) { brick.coords = c; continue; } }
    // Checked before the date, since a filename can contain a year.
    // A scan and a citation URL are different things and a brick may carry both:
    // the image is what you look at, the URL is where you got it.
    if (looksLikeSource(f)) {
      if (isImageSrc(f)) { if (!brick.src) { brick.src = f; continue; } }
      else if (!brick.url) { brick.url = f; continue; }
      if (!brick.src) { brick.src = f; continue; }
    }
    if (!brick.date && looksLikeDate(f)) {
      brick.date = f;
      const est = f.match(RE_EST);
      if (est) brick.estimate = Number(est[1]);
      continue;
    }
    brick.text.push(f);
  }

  // Field roles differ by type. For a PERSON the free text is a description or
  // occupation ('Merchant Seaman'), so the name comes from the alias, or George
  // Isles displays as "Powerloom Tender". For a PLACE the free text IS the
  // proper name ('<longforgan>|Longforgan'), so it wins.
  if (!brick.name) {
    if (brick.kind === "person") {
      brick.name = displayFor(brick.alias) || brick.text[0] || "";
      if (brick.text[0]) brick.detail = brick.text[0];
    } else {
      brick.name = brick.text[0] || displayFor(brick.alias) || "";
      if (brick.text[1]) brick.detail = brick.text[1];
    }
  }
  if (brick.kind === "event" && !brick.date) {
    brick.notes.push({ level: "warn", msg: TYPES[type].label + " has no date" });
  }
  return brick;
}

function parse(text) {
  const out = []; let section = "";
  const lines = String(text).split("\n");
  for (let i = 0; i < lines.length; i++) {
    const b = parseLine(lines[i], i + 1, section);
    if (b.comment) section = b.name;   // a '#' heading scopes the bricks beneath it
    out.push(b);
  }
  return out;
}

/* --------------------------------------------------------------------------
   2. MODEL
   -------------------------------------------------------------------------- */

/*  A reference to an alias nobody declared is NOT an error. It becomes a ghost
    entity — in genealogy that is the most interesting object in the pile:
    someone who appears in one record and nowhere else. */
function buildModel(bricks) {
  const entities = new Map(), edges = [], issues = [];

  function touch(slug, patch) {
    if (!slug) return null;
    let e = entities.get(slug);
    if (!e) {
      e = { slug, name: titleCase(slug), kind: "unknown", declared: false,
            status: null, num: null, refs: 0, detail: "", bricks: [] };
      entities.set(slug, e);
    }
    if (patch) Object.assign(e, patch);
    return e;
  }

  for (const b of bricks) {
    if (b.empty || b.comment) continue;
    for (const n of b.notes) issues.push({ line: b.lineNumber, level: n.level, msg: n.msg });
    if (!b.valid) continue;

    // Any brick that names itself becomes a declared entity — including a
    // document or an event, so a claim can point back at the thing that
    // evidences it rather than at a phantom.
    if (b.alias) {
      const existing = entities.get(b.alias.slug);
      /*  A uid is unique by definition — duplicate RECORDS are ordinary and
          expected, duplicate uids are not. So the first declaration wins and
          every later one is an error that changes nothing.

          Letting a later declaration overwrite was silent data loss: declaring
          <james> as a person and then as a place turned the man into a street,
          with only a warning. First-wins means the pile keeps what it had and
          tells you where the clash is. */
      if (existing && existing.declared) {
        issues.push({ line: b.lineNumber, level: "err",
          msg: "<" + b.alias.slug + "> is already declared on line " + existing.declaredAt +
               (existing.kind !== b.kind ? " as a " + existing.kind : "") + " — a uid must be unique" });
        existing.bricks.push(b);
      } else {
        const e = touch(b.alias.slug, {
          kind: b.kind, declared: true, declaredAt: b.lineNumber, status: b.status,
          num: b.alias.num, name: b.name || displayFor(b.alias),
          coords: b.coords || (b.kind === "place" ? GAZETTEER.get(b.alias.slug) || null : null),
          coordsFrom: b.coords ? "brick" : (GAZETTEER.has(b.alias.slug) ? "gazetteer" : null),
        });
        e.bricks.push(b);
        if (b.detail) e.detail = b.detail;
      }
    }

    for (const target of b.links) {
      const e = touch(target);
      e.refs++;
      edges.push({ from: b.alias ? b.alias.slug : null, to: target, kind: b.kind,
                   type: b.type, status: b.status, line: b.lineNumber, date: b.date });
    }
  }

  for (const e of entities.values()) {
    if (!e.declared) {
      issues.push({ line: null, level: "warn",
        msg: "“" + e.name + "” referenced " + e.refs + "× but never declared" });
    }
  }

  const real = bricks.filter(b => !b.empty && !b.comment);
  const byType = {};
  for (const b of real) { const k = b.type || "unparsed"; byType[k] = (byType[k] || 0) + 1; }

  /*  Birth and death years per person, so an age can be worked out anywhere.

      A birth EVENT is a recorded fact and wins. A census estimate ("22 ~1869")
      is arithmetic done on a rounded age and is only ever approximate, so it
      is kept separately and marked — an age derived from it is written "~22"
      and must never be mistaken for one derived from a real date. */
  for (const b of real) {
    if (!b.valid) continue;
    const y = b.date && /^\d{4}/.test(b.date) ? Number(b.date.slice(0, 4)) : null;
    const targets = [];
    if (b.alias && entities.has(b.alias.slug)) targets.push(entities.get(b.alias.slug));
    for (const l of b.links) if (entities.has(l)) targets.push(entities.get(l));

    for (const e of targets) {
      if (e.kind !== "person") continue;
      if (b.type === "birth" && y !== null) { e.birthYear = y; e.birthExact = true; }
      else if (b.type === "death" && y !== null) { e.deathYear = y; e.deathExact = true; }
      else if (b.kind === "census" && b.estimate !== null && b.estimate !== undefined) {
        // Only fills a gap; never overrides a recorded birth.
        if (e.birthYear === undefined) { e.birthYear = b.estimate; e.birthExact = false; }
      }
    }
  }

  const ents = [...entities.values()];
  return {
    bricks, records: real, entities: ents, edges, issues, byType,
    sections: [...new Set(bricks.filter(b => b.comment).map(b => b.name))],
    people: ents.filter(e => e.kind === "person"),
    places: ents.filter(e => e.kind === "place"),
    events: real.filter(b => b.kind === "event"),
    documents: real.filter(b => b.kind === "document"),
    census: real.filter(b => b.kind === "census"),
    stats: {
      bricks: real.length,
      verified: real.filter(b => b.status === "verified").length,
      draft: real.filter(b => b.status === "draft").length,
      unparsed: real.filter(b => !b.valid).length,
      entities: ents.length,
      ghosts: ents.filter(e => !e.declared).length,
      links: edges.length,
      dated: real.filter(b => b.date && RE_DATE.test(b.date)).length,
      estimated: real.filter(b => b.estimate !== null).length,
      geocoded: ents.filter(e => e.kind === "place" && e.coords).length,
    },
  };
}

/* --------------------------------------------------------------------------
   2b. VIEW — the filtered subset every panel actually draws
   --------------------------------------------------------------------------
   Sits between MODEL and the panels, so filtering is written once rather than
   re-implemented in each one. A visualization renders `model.view` and inherits
   every filter without knowing filters exist.

   Ghost-ness is deliberately NOT recomputed here: whether an alias was ever
   declared is a fact about the whole pile, not about what you are currently
   looking at. Filtering to one family must not manufacture ghosts.
   -------------------------------------------------------------------------- */
/*  The year a brick sits at, or null if it has none.

    A record's own date wins; a census row falls back to its derived birth year
    (`~1869`), which is the only year some of them carry. "????" is deliberately
    a date that yields no year — the question was asked and not answered, which
    is not the same as the record being undated. */
function brickYear(b) {
  if (b.date) {
    const m = String(b.date).match(/^(\d{4})/);
    if (m) return Number(m[1]);
  }
  return b.estimate !== null && b.estimate !== undefined ? b.estimate : null;
}

// The window the time filter currently describes, as [from, to].
function timeWindow(t) {
  if (!t || !t.on) return null;
  if (t.mode === "decade") return [t.decade, t.decade + 9];
  if (t.mode === "around") return [t.year - t.span, t.year + t.span];
  return [t.min, t.max];
}

/*  A looser year than the filter uses: falls back to scanning the brick's own
    free text and headings for a four-digit year. A note reading "moved to
    Dundee 1893" carries a date even though no date FIELD does, and on a
    timeline that is worth placing. Kept separate from brickYear() so the time
    filter stays strict — silently filtering on a year mentioned in prose would
    be surprising, whereas showing it on a timeline is the point.

    Bounded to plausible record years so a house number or a reference like
    "377/4/1" cannot masquerade as a date. */
/*  An age at a given year, or "" when it cannot be worked out. Prefixed "~"
    whenever the birth year is itself an estimate, and negative results are
    suppressed — a record predating a birth is a data problem, not an age. */
function ageAt(entity, year) {
  if (!entity || year === null || entity.birthYear === undefined) return "";
  const age = year - entity.birthYear;
  if (age < 0 || age > 120) return "";
  return (entity.birthExact ? "" : "~") + age;
}

// "b. 1869 · d. 1931 · ~62" — whatever of it is known.
function lifeSummary(e) {
  if (!e) return "";
  const bits = [];
  if (e.birthYear !== undefined) bits.push("b. " + (e.birthExact ? "" : "~") + e.birthYear);
  if (e.deathYear !== undefined) bits.push("d. " + e.deathYear);
  if (e.birthYear !== undefined && e.deathYear !== undefined) {
    const a = ageAt(e, e.deathYear);
    if (a !== "") bits.push("aged " + a);
  }
  return bits.join(" · ");
}

function timelineYear(b) {
  const strict = brickYear(b);
  if (strict !== null) return { year: strict, loose: false };
  const hay = [b.name, b.detail, ...(b.text || []), b.section].filter(Boolean).join(" ");
  const m = hay.match(/\b(1[0-9]{3}|20[0-2][0-9])\b/);
  return m ? { year: Number(m[1]), loose: true } : null;
}

/*  One lane per person, their dated records in order, plus a lane for dated
    records that name nobody. A record naming several people appears in each of
    their lanes — it genuinely happened to all of them, and dropping it from
    all but one would misrepresent the record. */
function timelineLanes(model) {
  const people = new Map(model.entities.filter(e => e.kind === "person").map(e => [e.slug, e]));
  const lanes = new Map();
  const loose = [];

  for (const b of model.records) {
    const ty = timelineYear(b);
    if (!ty) continue;
    const evt = { year: ty.year, loose: ty.loose, brick: b };
    const named = [];
    if (b.alias && people.has(b.alias.slug)) named.push(b.alias.slug);
    for (const l of b.links) if (people.has(l)) named.push(l);

    if (!named.length) { loose.push(evt); continue; }
    for (const slug of new Set(named)) {
      if (!lanes.has(slug)) lanes.set(slug, { entity: people.get(slug), events: [] });
      lanes.get(slug).events.push(evt);
    }
  }

  const out = [...lanes.values()];
  for (const lane of out) lane.events.sort((a, b2) => a.year - b2.year);
  // Ordered by when each life first appears in the record, so the panel reads
  // top-to-bottom as the research does.
  out.sort((a, b2) => a.events[0].year - b2.events[0].year);
  if (loose.length) {
    loose.sort((a, b2) => a.year - b2.year);
    out.push({ entity: null, events: loose });
  }
  return out;
}

function brickPasses(b, f) {
  if (f.sections.size && !f.sections.has(b.section || "")) return false;
  if (b.comment) return true;                       // headings give the list its shape
  if (f.status !== "all" && b.status !== f.status) return false;
  if (f.types.size && !f.types.has(b.type)) return false;
  if (f.focus) {
    const mine = (b.alias && b.alias.slug === f.focus) || b.links.includes(f.focus);
    if (!mine) return false;
  }
  if (f.text) {
    const q = f.text.toLowerCase();
    if (!b.raw.toLowerCase().includes(q) && !(b.name || "").toLowerCase().includes(q)) return false;
  }
  /*  Time filters only what HAS a time. A place, a person, an undated record
      is not "outside the window" — it has no position on the axis at all, and
      hiding it would empty the map every time you touched the slider. */
  const win = timeWindow(f.time);
  if (win) {
    const y = brickYear(b);
    if (y !== null && (y < win[0] || y > win[1])) return false;
  }
  return true;
}

function buildView(model) {
  const f = state.filter;
  const bricks = model.bricks.filter(b => b.empty ? false : brickPasses(b, f));
  const records = bricks.filter(b => !b.comment);

  // Entities present in what survived — reusing the objects from the full model
  // so `declared` and `refs` keep their whole-pile meaning.
  const slugs = new Set();
  for (const b of records) {
    if (b.alias) slugs.add(b.alias.slug);
    for (const l of b.links) slugs.add(l);
  }
  const entities = model.entities.filter(e => slugs.has(e.slug));
  const lines = new Set(records.map(b => b.lineNumber));

  return {
    active: filterIsActive(),
    bricks, records, entities,
    edges: model.edges.filter(e => lines.has(e.line)),
    people: entities.filter(e => e.kind === "person"),
    places: entities.filter(e => e.kind === "place"),
    events: records.filter(b => b.kind === "event"),
    documents: records.filter(b => b.kind === "document"),
    census: records.filter(b => b.kind === "census"),
    sections: [...new Set(bricks.filter(b => b.comment).map(b => b.name))],
    all: model,                                     // the unfiltered pile, if a panel needs it
    stats: {
      bricks: records.length,
      verified: records.filter(b => b.status === "verified").length,
      draft: records.filter(b => b.status === "draft").length,
      unparsed: records.filter(b => !b.valid).length,
      entities: entities.length,
      ghosts: entities.filter(e => !e.declared).length,
      links: records.reduce((n, b) => n + b.links.length, 0),
      dated: records.filter(b => b.date && RE_DATE.test(b.date)).length,
      estimated: records.filter(b => b.estimate !== null).length,
      geocoded: entities.filter(e => e.kind === "place" && e.coords).length,
    },
  };
}

// Every panel draws this. Falls back to the whole pile before the first parse.
function V() { return (state.model && state.model.view) || state.model; }

/* --------------------------------------------------------------------------
   SHARED STATE — declared before the registry, because registering a panel
   touches it and the boot-time registrations run before the view section.
   -------------------------------------------------------------------------- */
const TEXT_KEY = "brick-by-brick:text:v1";
const BOARD_KEY = "brick-by-brick:board:v2";
const FOOTPRINT_KEY = "brick-by-brick:footprints:v2";
const GAZETTEER_KEY = "brick-by-brick:gazetteer:v1";

/*  The filter is not a separate database of categories. Every control it offers
    is read back out of the text you wrote: your '#' headings are the groupings
    (family, place, concept — whatever you decided a heading means), the type
    tokens are the kinds, and '+/-' is the confidence. Nothing here invents a
    taxonomy you did not type. */
/*  Top-bar search elements and their sync, declared HERE rather than beside
    their event wiring at the bottom: renderFilter() calls syncSearchInputs()
    during the very first paint, and a `const` declared further down is still
    in its temporal dead zone at that point — which threw and took the whole
    boot with it. */
function syncSearchInputs() {
  const wrap = document.getElementById("topsearch");
  const inp = document.getElementById("topsearchInput");
  if (!wrap || !inp) return;
  const text = state.filter.text || "";
  if (document.activeElement !== inp && inp.value !== text) inp.value = text;
  wrap.classList.toggle("active", !!text);
  // A search with text in it must not collapse and hide what it is doing.
  if (text) wrap.classList.add("open");
}

const state = {
  text: "", model: null,
  filter: {
    text: "", status: "all", types: new Set(), sections: new Set(), focus: null,
    time: { on: false, mode: "range", min: 1800, max: 1900, decade: 1890, year: 1891, span: 5 },
  },
};
function filterIsActive() {
  const f = state.filter;
  return !!(f.text || f.status !== "all" || f.types.size || f.sections.size || f.focus ||
            (f.time && f.time.on));
}

// The full span of years present, used to bound the sliders. Falls back to a
// sane historical range when nothing is dated yet.
function yearExtent(model) {
  const ys = (model.records || []).map(brickYear).filter(y => y !== null);
  if (!ys.length) return [1800, 1900];
  return [Math.min(...ys), Math.max(...ys)];
}
const el = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* --------------------------------------------------------------------------
   3. PANEL + FOOTPRINT REGISTRY
   --------------------------------------------------------------------------
   Everything on the board is a panel with a footprint — the w×h in grid cells
   it occupies when placed. Core panels and visualization panels are the same
   kind of object, so a viz gets every affordance a core panel has: place,
   move, resize, remove.
   -------------------------------------------------------------------------- */
const panels = new Map();       // id -> {id, title, help, group, render, tpl}
const FOOTPRINTS = {};          // id -> {name, desc, w, h, group}
/*  What a panel does to state, not what it looks like.
      write  — changes the pile (state.text / GAZETTEER)
      filter — changes what is in view (state.filter)
      read   — changes nothing
    A panel is "filter" if using it can narrow the board: clicking a name in
    Bricks, a lane in Timeline, a person in Document, a marker on the Map.
    None of them own filter state — everything routes through setFilter — but
    from the desk they ARE filter controls, and calling them R described the
    plumbing rather than the panel. */
const ROLES = {
  write:  { badge: "W", label: "Write — changes the pile" },
  read:   { badge: "R", label: "Read — changes nothing" },
  filter: { badge: "F", label: "Filter — can change what is in view" },
};
const ROLE_RANK = ["write", "filter", "read"];
const ROLE_ORDER = [
  { role: "write",  title: "Write · changes the pile" },
  { role: "filter", title: "Filter · changes the view" },
  { role: "read",   title: "Read · changes nothing" },
];
const GROUPS = ["Visualizations", "Data & structure"];

function definePanel(cfg) {
  /*  Roles are a LIST: a panel often does more than one thing. The Gazetteer
      edits coordinates and focuses a place; the Map draws and filters. Given
      as a string or an array, always stored as an array, ordered W → F → R so
      the badges read the same way on every panel. */
  const def = Object.assign({ group: "Data & structure", help: "" }, cfg);
  const given = cfg.roles || cfg.role || "read";
  const list = (Array.isArray(given) ? given : [given]).filter(r => ROLES[r]);
  def.roles = ROLE_RANK.filter(r => list.includes(r));
  if (!def.roles.length) def.roles = ["read"];
  def.role = def.roles[0];   // the primary, used for grouping
  panels.set(cfg.id, def);
  FOOTPRINTS[cfg.id] = { name: cfg.title, desc: cfg.help, w: cfg.w || 1, h: cfg.h || 1,
                         group: cfg.group || "Data & structure",
                         role: panels.get(cfg.id).role };
  return cfg.id;
}

/* --------------------------------------------------------------------------
   4. VIZ REGISTRY — the drop-in point
   --------------------------------------------------------------------------
     Brick.viz.register("timeline", {
       emoji: "🕰️", label: "Timeline", description: "…", w: 2, h: 2,
       render(model, el) { ...draw into el... }
     });

   Registering creates a panel with a footprint. It appears in the flyout list
   and you drag it onto the board wherever you want it. A slot receives the
   model and an empty element — no access to the raw text, the editor, or its
   neighbours — so a broken renderer can only break its own tile.
   -------------------------------------------------------------------------- */
const Brick = {
  viz: {
    slots: new Map(),
    register(id, cfg) {
      const slot = Object.assign({ id, emoji: "▫️", label: id, description: "" }, cfg);
      this.slots.set(id, slot);
      definePanel({
        // A slot cannot reach state directly, but it can offer a filter — the
        // map does, by clicking a marker. Declared per slot, so a purely
        // passive chart still gets R.
        roles: slot.roles || slot.role || "read",
        id: "viz-" + id,
        title: slot.emoji + " " + slot.label,
        help: slot.description,
        group: "Visualizations",
        w: slot.w || 2, h: slot.h || 2,
        render(body) { renderSlotBody(slot, body); },
      });
      if (booted) { renderBoardCardList(); refreshPanel("viz-" + id); }
      return this;
    },
    unregister(id) {
      this.slots.delete(id);
      const pid = "viz-" + id;
      panels.delete(pid);
      delete FOOTPRINTS[pid];
      board.tiles = board.tiles.filter(t => t.id !== pid);
      const node = document.getElementById(pid);
      if (node) node.remove();
      if (booted) { renderBoard(); renderBoardCardList(); saveBoard(); }
    },
    list() { return [...this.slots.values()]; },
  },
  get model() { return state.model; },
  get bricks() { return state.model ? state.model.bricks : []; },
  parse, buildModel,
  // Drop a viz straight onto the board from the console.
  place(id, w, h) {
    const pid = panels.has(id) ? id : "viz-" + id;
    if (!FOOTPRINTS[pid] || board.tiles.some(t => t.id === pid)) return false;
    const fp = FOOTPRINTS[pid];
    const slot = findFreeSlot(w || fp.w, h || fp.h);
    addTile(pid, slot.x, slot.y, w || fp.w, h || fp.h);
    return true;
  },
};
window.Brick = Brick;

let booted = false;

/* ==========================================================================
   THE MAP
   --------------------------------------------------------------------------
   MapLibre over the user's own PMTiles basemap:
   pmtiles://https://tiles.mbricknell.com/basemap.pmtiles — vector MVT, z0-9,
   Natural Earth layers (ocean, coastline_land, admin0_land, admin1_land,
   lakes, rivers).

   Both libraries load from a CDN, and only when the Map tile is actually on
   the board. Everything else on this page keeps working without them, and a
   page opened from file:// simply says the map needs a connection rather than
   failing silently.
   ========================================================================== */
const MAPLIBRE_JS  = "https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js";
const MAPLIBRE_CSS = "https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css";
const PMTILES_JS   = "https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js";
const BASEMAP      = "pmtiles://https://tiles.mbricknell.com/basemap.pmtiles";
// MapLibre's own public demo style — no key, no pmtiles, works from a plain
// double-clicked file. Same "hosted vs local" test the manifest/gazetteer
// fetches already use: the custom basemap only when actually served over
// http(s), MapLibre's default everywhere else.
const DEMO_STYLE   = "https://demotiles.maplibre.org/style.json";
function isHostedContext() { return /^https?:$/.test(location.protocol); }

function loadOnce(url, isCss) {
  const key = (isCss ? "css:" : "js:") + url;
  loadOnce.cache = loadOnce.cache || {};
  if (loadOnce.cache[key]) return loadOnce.cache[key];
  loadOnce.cache[key] = new Promise((res, rej) => {
    const el = document.createElement(isCss ? "link" : "script");
    if (isCss) { el.rel = "stylesheet"; el.href = url; }
    else { el.src = url; el.async = true; }
    el.onload = res;
    el.onerror = () => rej(new Error("could not load " + url));
    document.head.appendChild(el);
  });
  return loadOnce.cache[key];
}

/*  Dark, quiet, and matched to the panel it sits in. Land and ocean separate
    by value rather than hue so the points are the only saturated thing on the
