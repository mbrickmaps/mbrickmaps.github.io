      into pixels, and the only reference the panel offered was a person 28
      pixels tall and the arithmetic left to you.

      So: say what one pixel is worth and the panel answers the other question.
      Units are whatever you type — feet, metres, cubits — because the number
      is a ratio and the panel never needs to know what it is a ratio OF.

      Place only. A hat has no scale; it is 24 pixels across because that is
      how wide a hat is here, and inviting somebody to measure one in feet
      would be inviting nonsense. */
  const SCALE_KEY = "brick-by-brick:placescale:v1";
  let scale = { per: 0.25, unit: "ft" };
  try {
    const raw = JSON.parse(localStorage.getItem(SCALE_KEY) || "null");
    if (raw && +raw.per > 0 && typeof raw.unit === "string") {
      scale = { per: +raw.per, unit: raw.unit.slice(0, 4) };
    }
  } catch (e) { /* unavailable */ }
  const saveScale = () => {
    try { localStorage.setItem(SCALE_KEY, JSON.stringify(scale)); } catch (e) { /* unavailable */ }
  };

  const scaleBar = el("div", "sp-row", right);
  el("span", "sp-cap", scaleBar).textContent = "scale";
  el("span", "sp-x", scaleBar).textContent = "1px =";
  const perIn = el("input", "sp-num", scaleBar);
  perIn.type = "number"; perIn.min = "0"; perIn.step = "0.01";
  perIn.title = "how much of the world one pixel covers";
  const unitIn = el("input", "sp-unit", scaleBar);
  unitIn.type = "text"; unitIn.maxLength = 4;
  unitIn.title = "whatever you measure in \u2014 ft, m, yd";
  /*  Just the ratio. There was a converter on the end of this row — type a
      measurement, read back the pixels — and it answered a question nobody
      asks: you do not sit down knowing a wall is forty feet and needing the
      pixel count, you draw the wall and want to know what you have drawn. The
      measure tool is that direction, and this ratio is what it reads. */
  /*  AS MANY DECIMALS AS THE RATIO HAS.

      A whole number of cells times a two-decimal ratio is exact to two
      decimals: 9 cells at 0.25 ft is 2.25 ft, not 2.3. Rounding to one place
      was discarding a digit that was really there, and on a scale like 0.05
      it made neighbouring measurements read the same. Capped at six, past
      which nobody is measuring a wall. */
  const scaleDp = () => {
    const t = String(scale.per), dot = t.indexOf(".");
    return dot < 0 ? 0 : Math.min(6, t.length - dot - 1);
  };
  const realOf = n => +(n * scale.per).toFixed(scaleDp());
  const syncScale = () => {
    perIn.value = scale.per;
    unitIn.value = scale.unit;
  };
  perIn.oninput = () => {
    const v = parseFloat(perIn.value);
    if (v > 0) { scale.per = v; saveScale(); paint(); }
    syncScale();
  };
  unitIn.oninput = () => { scale.unit = unitIn.value.slice(0, 4); saveScale(); syncScale(); paint(); };
  syncScale();

  /*  A guide can be dragged out by eye, but a pitch you already know the
      number of should not have to be. This row is the same guide from the
      other end: type the angle, press +, and it lands on the middle cell —
      then drag it where it belongs with the same tool. */
  const guideBar = el("div", "sp-row", right);
  el("span", "sp-cap", guideBar).textContent = "angle";
  const gAng = el("input", "sp-num", guideBar);
  gAng.type = "number"; gAng.min = "0"; gAng.max = "179.9"; gAng.step = "1";
  gAng.value = "0";
  gAng.title = "angle in degrees \u2014 0 lies flat, 90 stands up, and up is to the right";
  el("span", "sp-x", guideBar).textContent = "\u00b0";
  const gAdd = el("button", null, guideBar);
  gAdd.type = "button"; gAdd.textContent = "+";
  gAdd.title = "a guide at that angle, through the middle";
  const gClear = el("button", null, guideBar);
  gClear.type = "button"; gClear.textContent = "clear";
  gClear.title = "remove every guide";
  const gNote = el("span", "sp-pal-note", guideBar);

  /*  Typing an angle re-aims the guide you last touched, so a line dragged
      roughly into place can be made exact without being drawn again. With no
      guide to aim, the number is simply what the next + will use. */
  let lastGuide = -1;
  gAng.oninput = () => {
    if (lastGuide < 0 || lastGuide >= guides.length) return;
    guides[lastGuide].deg = normDeg(parseFloat(gAng.value) || 0);
    saveGuides(); paint();
  };
  gAdd.onclick = () => {
    guides.push({ x: Math.floor(cellW() / 2), y: Math.floor(cellH() / 2),
                  deg: normDeg(parseFloat(gAng.value) || 0) });
    lastGuide = guides.length - 1;
    tool = "guide";
    saveGuides(); paint();
  };
  gClear.onclick = () => { guides = []; lastGuide = -1; saveGuides(); paint(); };

  // ---- and how it should look
  const optBar = el("div", "sp-row", right);
  const onionBtn = el("button", null, optBar);
  onionBtn.type = "button"; onionBtn.textContent = "ghost";
  onionBtn.title = "show what this has to sit with \u2014 the rest of the figure, "
                 + "or on a place the head-height line and the bricklings in the preview";
  onionBtn.onclick = () => { onion = !onion; paint(); };

  /*  Names the pointer you have, and pressing gives you the other one.

      It read "cell cursor" whichever mode was up, with a green fill for the
      difference — two words for two modes in one label, and you had to know
      which of them the fill meant. A cycler should say where it IS. */
  const curBtn = el("button", null, optBar);
  curBtn.type = "button";
  curBtn.onclick = () => {
    cellCursor = !cellCursor;
    try { localStorage.setItem(CURSOR_KEY, cellCursor ? "1" : "0"); } catch (e) { /* unavailable */ }
    paint();
  };

  const gridBtn = el("button", null, optBar);
  gridBtn.type = "button"; gridBtn.textContent = "grid";
  gridBtn.title = "rule every cell, with a firmer line every so many";
  gridBtn.onclick = () => { gridOn = !gridOn; paint(); };
  /*  HOW OFTEN THE FIRM LINE FALLS.

      It was every fourth, always, and the four came from the figure: a
      brickling is 24 x 28, which divides into blocks of four, and the sheet is
      four frames by four rows. On a place it divides into nothing — 102 leaves
      a remainder of 2 — so the heavy lines drifted out of step with the edges
      of the thing being drawn.

      It is a reading aid and nothing else: no pixel, no file and no export
      depends on it, so it can be whatever number helps you count. Ten for a
      place, eight for a wide building, four for a figure. */
  const stepIn = el("input", "sp-num", optBar);
  stepIn.type = "number"; stepIn.min = "2"; stepIn.max = "32"; stepIn.step = "1";
  stepIn.title = "a firmer rule every this many cells \u2014 counting help only, "
               + "it changes nothing in the drawing";
  stepIn.value = gridStep;
  stepIn.oninput = () => {
    gridStep = Math.max(2, Math.min(32, +stepIn.value || 4));
    try { localStorage.setItem(GRIDSTEP_KEY, String(gridStep)); } catch (e) { /* unavailable */ }
    paint();
  };

  const axesBtn = el("button", null, optBar);
  axesBtn.type = "button"; axesBtn.textContent = "center";
  axesBtn.title = "the center lines \u2014 every layer is centered on the vertical one";
  axesBtn.onclick = () => { axesOn = !axesOn; paint(); };

  const linkBtn = el("button", null, optBar);
  //  "all frames" named the scope and left out the verb, which is the half
  //  that says this is a drawing mode and not another view switch.
  linkBtn.type = "button"; linkBtn.textContent = "paint all frames";
  linkBtn.title = "a stroke goes into every frame at once. Drawing only \u2014 move works on one frame.";
  linkBtn.onclick = () => { linked = !linked; paint(); };
  const frameBar = el("span", null, optBar);
  /*  After the frame numbers, because it is a statement about them: these are
      the frames, and this says whether a stroke goes into all of them. Before
      them it read as another view toggle sitting next to "ghost". */
  optBar.appendChild(linkBtn);

  // ---- the render example
  const prevWrap = el("div", "sp-preview", right);
  /*  The backdrop it stands against. Kept in the browser, because it is a
      preference about looking rather than anything about the drawing. */
  /*  THE GRID'S OWN COLOUR.

      The squares behind the drawing were a fixed near-black, chosen so a
      bright sprite would sit on them. That is the wrong way round for anyone
      painting a dark colour: a brown boot on a brown-black grid is a boot you
      cannot see well enough to draw. So the grid is yours — go pale and dark
      colours read.

      One colour, not two. The second square is derived, and only a nudge away
      from the first, because the checker is there to say "nothing is drawn
      here" and not to compete with what is. The nudge is smaller on a pale
      grid than a dark one, where the same proportion reads as a hard stripe.

      Kept in the browser, like the preview's backdrop: it is a preference
      about looking, reaches no file, and cannot land in an export. */
  const GRIDBG_KEY = "brick-by-brick:gridbg:v1";
  const GRIDBG_DEFAULT = "#20241c";
  let gridBg = GRIDBG_DEFAULT;
  try {
    const raw = localStorage.getItem(GRIDBG_KEY);
    if (raw && /^#[0-9a-f]{6}$/i.test(raw)) gridBg = raw;
  } catch (e) { /* unavailable */ }
  const gridLight = () => lumOf(hexInt(gridBg)) > 0.5;
  const gridOther = () => shadeHex(gridBg, gridLight() ? -0.09 : -0.28);
  /*  Rules and axes have to be drawn in something that survives the squares
      they are drawn over — white lines on a white grid are no lines at all. */
  const gridInk = a => (gridLight() ? "rgba(0,0,0," : "rgba(255,255,255,") + a + ")";

  /*  WHAT THE PREVIEW STANDS AGAINST.

      A figure and a place want different things behind them. The figure wants
      ONE flat colour: you are looking at whether a coat reads, and a horizon
      crossing it at the knee is an edge to mistake for part of the drawing.
      A place wants TWO — it is a building, it meets the ground somewhere, and
      where that line falls is half of what you are judging.

      So the row shows one picker or two depending on what you are drawing, and
      remembers all three colours either way. */
  const BG_KEY = "brick-by-brick:spritebg:v2";
  const BG_DEFAULT = { one: "#1d2c38", sky: "#1d2c38", ground: "#1a1f18" };
  let bg = { ...BG_DEFAULT };
  try {
    const raw = JSON.parse(localStorage.getItem(BG_KEY) || "null");
    if (raw) for (const k of ["one", "sky", "ground"]) {
      if (/^#[0-9a-f]{6}$/i.test(raw[k])) bg[k] = raw[k];
    }
  } catch (e) { /* unavailable */ }
  const applyBg = () => {
    prevWrap.style.setProperty("--sp-back", bg.one);
    try { localStorage.setItem(BG_KEY, JSON.stringify(bg)); } catch (e) { /* unavailable */ }
  };
  const prev = el("canvas", null, prevWrap);
  const prev1 = el("canvas", "sp-true", prevWrap);
  const backRow = el("div", "sp-row sp-under", right);
  el("span", "sp-cap", backRow).textContent = "behind";
  const backWrap = el("span", "sp-bg", backRow);
  const mk = (key, tip) => {
    const i = el("input", null, backWrap);
    i.type = "color"; i.value = bg[key]; i.title = tip;
    i.oninput = () => { bg[key] = i.value; applyBg(); paint(); };
    return i;
  };
  const backOne = mk("one", "what the figure stands against in this preview");
  const backSky = mk("sky", "the place's sky in this preview");
  const backGround = mk("ground", "the ground the place stands on");
  const backReset = el("button", null, backWrap);
  backReset.type = "button"; backReset.textContent = "\u21ba";
  backReset.title = "back to the street's own colours";
  backReset.onclick = () => {
    bg = { ...BG_DEFAULT };
    backOne.value = bg.one; backSky.value = bg.sky; backGround.value = bg.ground;
    applyBg(); paint();
  };
  /*  One picker or two, never all three at once. */
  const syncBack = () => {
    backOne.hidden = isPlace();
    backSky.hidden = backGround.hidden = !isPlace();
  };
  applyBg();


  /*  No pickers for these two.

      The preview's sky and ground were yours to set, which sounded useful and
      was not: the preview exists to show you the figure against the street,
      and the street has its own colours. Changing them here changed nothing
      about the drawing, nothing about the Promenade, and gave you a figure
      standing in front of a backdrop nobody else will ever see it against.

      The values stay — the preview still needs a sky — and the grid keeps its
      own picker under the canvas, because THAT one is about being able to see
      what you are drawing. */
  applyBg();

  /*  In with the backdrop, because both are the same kind of thing: what you
      are looking AT something against, rather than anything about the drawing
      itself. Neither leaves this browser and neither reaches the PNG. */
  /*  Parentless: it is moved under the drawing canvas a few lines below, and
      the row it used to sit in went with the backdrop pickers. */
  const gridWrap = el("span", "sp-bg", null);
  const gridIn = el("input", null, gridWrap);
  gridIn.type = "color"; gridIn.value = gridBg;
  gridIn.title = "the squares behind the drawing \u2014 go pale when you are "
               + "painting dark colours and cannot tell them apart";
  const saveGridBg = () => {
    try { localStorage.setItem(GRIDBG_KEY, gridBg); } catch (e) { /* unavailable */ }
  };
  gridIn.oninput = () => { gridBg = gridIn.value; saveGridBg(); paint(); };

  /*  Who this is for — and the whole of the filename, since a wardrobe is one
      file. Which layer you are drawing is a row inside it, not a name. */
  const nameBar = el("div", "sp-row", right);
  el("span", "sp-cap", nameBar).textContent = "for";
  const nameIn = el("input", null, nameBar);
  nameIn.type = "text"; nameIn.className = "sp-name";
  nameIn.placeholder = "mill-worker";
  nameIn.spellcheck = false;
  nameIn.title = "a person's uid, a trade, or \u201cdefault\u201d for everybody";
  /*  Settled, not per keystroke. Every pass asks for up to six files, and
      typing "mill-worker" one letter at a time asked for sixty-odd, all but
      the last set 404s for names that were only ever half-typed. */
  let nameWait = 0;
  nameIn.oninput = () => {
    clearTimeout(nameWait);
    nameWait = setTimeout(() => { openExisting(); paint(); }, 220);
    paint();                       // the filename under the box keeps up
  };
  /*  A WAY INTO A DRAWING YOU ALREADY HAVE.

      Typing a name opens whatever exists under it, but only while the canvas
      is untouched: once you have made a mark, the name is a label for what you
      are drawing rather than a request to throw it away. That is right, and it
      left no way at all to go and edit a different place. You typed `manse`,
      nothing happened, and the panel went on quietly writing to `default`.

      So when the name points at art that is not what you are looking at, this
      appears and says so. It is the only thing here that will discard your
      canvas, so it never fires on its own. */
  const openBtn = el("button", "sp-open", nameBar);
  openBtn.type = "button"; openBtn.hidden = true;
  openBtn.onclick = async () => {
    const named = slugify(nameIn.value.trim());
    if (!named) return;
    const kind = isPlace() ? "places" : "wear";
    const img = await loadImg(artSrc(kind, named));
    if (!img) { hintOnce = "no drawing found for " + named; paint(); return; }
    snapshot();                       // undo can bring your canvas back
    if (isPlace()) {
      blitInto(layers.place, img);
      layers.place.__frames = 1;
      bornCell.place = { w: layers.place.width, h: layers.place.height };
    } else {
      const rows = sheetRows(img) || [];
      rows.forEach((cvv, i) => { if (cvv) { blitInto(layers[ROWS[i]], cvv);
        layers[ROWS[i]].__frames = SPR_FRAMES; touched[ROWS[i]] = true; } });
    }
    touched[slot] = true;
    loadedAs = named;
    wipSeq++;
    syncSize();
    hintOnce = "opened " + named;
    paint();
  };

  const nameOut = el("span", "sp-filename", nameBar);

  const outBar = el("div", "sp-row", right);
  /*  Parented here and moved to the frame row below, where the preview it
      starts and stops actually is. It was in the export row for no better
      reason than that the export row came last. */
  const playBtn = el("button", null, outBar);
  /*  A word, not a glyph. This was U+275A twice — two heavy vertical bars,
      which is what a pause symbol is made of but not what one looks like at
      eleven pixels beside a row of numbers. The label says what pressing it
      does, so it reads "pause" while the walk is running. */
  playBtn.type = "button"; playBtn.textContent = "play";
  playBtn.title = "stop or start the walk in the preview";
  playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? "pause" : "play"; };
  const dl = el("button", null, outBar);
  dl.type = "button"; dl.textContent = "download";
  dl.title = "save all four rows as one wardrobe PNG";
  const save = (canvas, name) => canvas.toBlob(b => {
    const a2 = document.createElement("a");
    a2.href = URL.createObjectURL(b);
    a2.download = name;
    a2.click();
    setTimeout(() => URL.revokeObjectURL(a2.href), 1000);
  });
  // Drop either in images/wear/ and anyone whose uid or trade matches is
  // wearing it on the next load.
  dl.onclick = () => save(isPlace() ? layers.place : stitchSheet(), fileName());
  /*  Straight onto the street, without a deploy.

      The same PNG the download button hands you, kept in the browser under the
      path the loader would have asked the server for. The Promenade reads it
      on the next render, so a hat you have just drawn is on somebody within a
      second — and if you decide it is worth keeping, the Art panel will still
      give you the file to commit. */
  const keep = el("button", null, outBar);
  /*  It was "to page", which named the mechanism — the drawing is held by this
      page — and not the outcome. What you actually want to know is where it
      turns up, and the answer is the Promenade: a wearer walks in it, a place
      stands behind its column. Both land in the same scene, so the button can
      name it. */
  keep.type = "button"; keep.textContent = "to promenade";
  keep.onclick = () => {
    const cv = isPlace() ? layers.place : stitchSheet();
    const path = (isPlace() ? "places/" : "wear/") + fileName();
    const ok = putLocalArt(path, cv.toDataURL("image/png"));
    hint.textContent = ok === false
      ? "no room left in this browser to keep that — download it instead"
      : "kept as " + path + " — on the street until you clear it";
  };
  keep.title = "put it straight into the scene \u2014 held in this browser only, "
             + "with nothing written to disk and nothing deployed";
  /*  Nothing at all, on purpose.

      `reset` puts a layer back to what it was BEFORE you drew — which for a
      wearer is the built-in figure, not an empty grid. There was no way to
      start from nothing, and drawing your own person meant rubbing out
      somebody else's first.

      Every row, not just the one showing: an outfit is four rows, and blanking
      one at a time leaves you three-quarters dressed as the default. They are
      marked touched afterwards, or the editor would helpfully fill them back
      in from disk the moment the name box changed — a blank layer is a
      decision, and it has to look like one. */
  const blank = el("button", null, outBar);
  blank.type = "button"; blank.textContent = "empty board";
  blank.title = "back to nothing \u2014 every item, all frames, with no figure "
              + "underneath to rub out first";
  blank.onclick = () => {
    snapshot();
    const wipe = cv => cv.getContext("2d").clearRect(0, 0, cv.width, cv.height);
    for (const k of (isPlace() ? ["place"] : ROWS)) { wipe(layers[k]); touched[k] = true; }
    paint();
    recordStep();
  };

  const hint = el("p", "hint sp-hint", right);

  /*  THE NAMING CONVENTION, WRITTEN DOWN WHERE IT IS USED.

      Nothing here is configured: a drawing reaches a brickling or a column by
      being named after them. That is the whole mechanism, and it was knowledge
      you had to already have — the panel showed you the filename it would
      write and never said what made that filename find anybody.

      Read straight off `outfitFor`, so it cannot drift from the loader: a
      person is dressed from their own uid first, then their trade, then
      default, and within each of those a loose row beats that wearer's
      sheet. */
  const conv = el("div", "sp-conv", right);
  conv.innerHTML =
    '<b>naming</b>'
    + '<dl>'
    + '<dt>wear/<i>who</i>.png</dt><dd>whole outfit</dd>'
    + '<dt>wear/<i>who</i>.<i>item</i>.png</dt><dd>one item, beats the outfit</dd>'
    + '<dt>places/<i>place</i>.png</dt><dd>behind that place</dd>'
    + '</dl>'
    + '<p><i>who</i>: uid, then trade, then <i>default</i></p>';

  /*  ARRANGED BY WHAT A CONTROL TOUCHES.

      The first attempt at this sorted the rows by how often they get used and
      hid the unpopular ones behind a button. That is not a structure, it is a
      popularity contest: the panel still held everything it held before, plus
      a button and a saved state to get wrong, and it separated `size` from
      `for` when those are the same decision made in the same breath.

      Three groups, and every control belongs to exactly one:

        the DRAWING   what a stroke does — tool, paint, all frames
        the VIEW      what you are looking at — none of it changes a pixel
        the FILE      who it is for and where it goes, below a rule

      Two rows stop existing rather than being hidden. Guides fold into the
      tool that makes them and appear only while that tool is up. The backdrop
      and cell colours join the view row, where they always belonged. */

  //  A stroke going into every frame is a DRAWING mode, not a view toggle. It
  //  sat beside "ghost" and read as one for as long as it was there.
  toolBar.appendChild(linkBtn);
  /*  The glyph tools take the first line and the two worded ones the second,
      which is where the break falls anyway once `paint all frames` is in the
      row — better to put it where it means something than to let it land
      wherever the column width decides. */
  toolBar.insertBefore(el("span", "sp-break", null),
                       toolBtns[TOOLS.findIndex(t => t[0] === "measure")]);
  /*  The size, at the end of that second line rather than painted into the
      corner of the drawing. On the canvas it sat over whatever was drawn up
      there; here it is out of the picture and still directly above it. */
  /*  And it is the SIZE CONTROL, not a caption of one.

      It was a read-only note here and a pair of boxes in the side column, so
      the number you looked at and the number you changed were in different
      places. Same two boxes, moved to where the answer already was. */
  const sizeGrp = el("span", "sp-sizenote", toolBar);
  sizeGrp.appendChild(wIn);
  el("span", "sp-x", sizeGrp).textContent = "\u00d7";
  sizeGrp.appendChild(hIn);
  /*  THE SAME SIZE IN THE WORLD, AND SETTABLE THERE TOO.

      It was a read-only echo — cells in, feet out. But a building is a thing
      you know the real size of first: a kirk is sixty feet to the ridge, and
      working out that sixty feet is 240 cells at a quarter of a foot each is
      arithmetic the panel already knows how to do.

      So these are inputs, and they step by one CELL — `step` is the ratio
      itself, so an arrow press moves the drawing by exactly one pixel and
      never lands between two. Typed values are rounded to the nearest whole
      cell, because there is no such thing as two thirds of a pixel. */
  const realW = el("input", "sp-num sp-real", sizeGrp);
  const realX = el("span", "sp-x sp-real", sizeGrp); realX.textContent = "\u00d7";
  const realH = el("input", "sp-num sp-real", sizeGrp);
  const realU = el("span", "sp-ans sp-real", sizeGrp);
  /*  BACK TO THE SIZE THE FORMAT EXPECTS.

      Both defaults are answers to something, not round numbers: a place is
      102 wide because that is the widest that draws pixel-for-pixel in a
      column, and a figure is whatever the built-in one is, because that is
      what every hat and coat in the folder was drawn to fit. Having wandered
      away from either by typing or by feet, this is the way back.

      Read from the built-in art rather than written down again — a constant
      copied here would be a second opinion about the same thing, and one of
      them would eventually be wrong. */
  const sizeReset = el("button", null, sizeGrp);
  sizeReset.type = "button"; sizeReset.textContent = "\u21ba";
  /*  THE SIZE IT ARRIVED AT, not the size the code falls back to.

      This first read the built-in body sheet, which is 24 x 24 — but the
      wardrobe on disk is 24 x 28, and every hat in that folder is drawn to
      sit on a 28-tall figure. Resetting to the fallback would quietly crop
      four rows off the top of a coat.

      So the size each kind of drawing had when it was LOADED is remembered,
      and that is what this goes back to. The constants are only the answer
      before a file has had its say. */
  const defaultCell = () => (isPlace() ? bornCell.place : bornCell.wear)
    || (isPlace()
        ? { w: PLACE_W, h: PLACE_H }
        : { w: Math.round(wear.body.width / (wear.body.__frames || SPR_FRAMES)),
            h: wear.body.height });
  sizeReset.onclick = () => {
    const d = defaultCell();
    wIn.value = d.w; hIn.value = d.h;
    applySize();
  };
  for (const i of [realW, realH]) {
    i.type = "number"; i.min = "0";
    i.title = "the same size out in the world \u2014 one step is one pixel";
  }
  const cellsFor = v => Math.max(1, Math.round((+v || 0) / scale.per));
  const applyReal = () => {
    if (!(isPlace() && scale.per > 0)) return;
    wIn.value = cellsFor(realW.value);
    hIn.value = cellsFor(realH.value);
    applySize();
  };
  realW.onchange = realH.onchange = applyReal;
  //  Kept in step with the cell boxes without fighting whichever one has focus.
  const syncReal = (w, h) => {
    const on = isPlace() && scale.per > 0;
    for (const n of [realW, realX, realH, realU]) n.hidden = !on;
    if (!on) return;
    realU.textContent = scale.unit;
    realW.step = realH.step = String(scale.per);
    if (document.activeElement !== realW) realW.value = realOf(w);
    if (document.activeElement !== realH) realH.value = realOf(h);
  };

  /*  THE TOOLS GO OVER THE CANVAS.

      They were in the side column with everything else, so choosing a tool
      meant looking away from the drawing and back again — and the column is
      narrow, which wrapped seven glyphs and a mode onto two lines. Above the
      canvas they are in the same glance as the thing they act on, and the full
      width of the drawing fits them on one. */
  left.insertBefore(toolBar, grid);

  //  The frame you are on drives the preview, so it sits directly above it
  //  rather than at the end of a row of unrelated switches.
  const frameRow = el("div", "sp-row", right);
  //  Play leads the row: it is the verb, and "frame 1 2 3 4" is what it acts on.
  frameRow.appendChild(playBtn);
  el("span", "sp-cap", frameRow).textContent = "frame";
  frameRow.appendChild(frameBar);
  right.insertBefore(frameRow, prevWrap);

  /*  Each colour picker goes to the canvas it colours.

      Both were captioned swatches in a row on the far side of the panel, which
      meant looking away from the thing you were adjusting to adjust it — and
      two greyish squares in a list of toggles give you no clue which surface
      either one belongs to. Under their own canvas the question does not come
      up: this one tints what is directly above it. */
  const gridBgRow = el("div", "sp-row sp-under", left);
  /*  Undo lives under the canvas, not in the tool row: it acts on what is
      drawn rather than on how you draw, and the drawing is what you are
      looking at when you want it back. */
  /*  The view switches join the drawing side too: ghost, the cursor, the grid
      and the centre lines all change what the CANVAS looks like and nothing
      else, so they belong under it rather than across the panel from it. */
  left.appendChild(optBar);
  /*  ONE switch over the preview, for everything drawn on top of the scene:
      the dotted bounds and the bricklings together. They are both answers to
      the same question — what is here that is not the drawing — and splitting
      them into two buttons put a second control in a corner to solve a problem
      nobody had. */
  const prevBtns = el("span", "sp-prevbtns", prevWrap);
  prevBtns.appendChild(onionBtn);
  /*  Grid last, with its number. It is the only one of these carrying a
      setting, so it ends the row rather than splitting the plain toggles in
      half with an input box. */
  optBar.appendChild(gridBtn);
  optBar.appendChild(stepIn);
  //  Centre first: it is the reference every layer is drawn against, so it
  //  leads the row rather than sitting between two view switches.
  optBar.insertBefore(axesBtn, optBar.firstChild);
  gridBgRow.appendChild(undoBtn);
  gridBgRow.appendChild(redoBtn);
  /*  Emptying the board is a thing you do TO the drawing, like undoing one —
      it sat with download and to-promenade because it was next to them in the
      file row, which put "throw this away" beside "keep this" and neither of
      them anywhere near the canvas. */
  gridBgRow.appendChild(blank);
  gridBgRow.appendChild(recBtn);
  gridBgRow.appendChild(replayBtn);
  gridBgRow.appendChild(dropRecBtn);
  gridBgRow.appendChild(expBtn);
  gridBgRow.appendChild(expX);
  gridBgRow.appendChild(expK);
  gridBgRow.appendChild(expOut);
  syncRec();
  el("span", "sp-cap", gridBgRow).textContent = "cells";
  gridBgRow.appendChild(gridWrap);

  /* ----------------------------------------------------------------------
     THE PARTS TRAY

     Under the canvas, because a part is a thing you put ON the drawing and
     everything else that acts on the drawing lives down here too.
     ---------------------------------------------------------------------- */
  const partRow = el("div", "sp-row sp-parts", left);
  el("span", "sp-cap", partRow).textContent = "parts";
  const partList = el("div", "sp-part-list", partRow);
  const keepBtn = el("button", null, partRow);
  keepBtn.type = "button"; keepBtn.textContent = "keep";
  keepBtn.title = "put what you have just boxed with \u29c9 on the shelf, so you "
                + "can stamp it again later";

  /*  A part is a PNG, not a list of points: it has to survive being written to
      localStorage, read back next week, and dropped in from a file — and a
      PNG is the one shape all three of those already speak. */
  const clipToPng = () => {
    if (!clip || !clip.pts.length) return null;
    const c = document.createElement("canvas");
    c.width = clip.w || 1; c.height = clip.h || 1;
    const g = c.getContext("2d");
    const d = g.createImageData(c.width, c.height);
    for (const [dx, dy, r, g2, b, a] of clip.pts) {
      if (dx < 0 || dy < 0 || dx >= c.width || dy >= c.height) continue;
      const i = (dy * c.width + dx) * 4;
      d.data[i] = r; d.data[i + 1] = g2; d.data[i + 2] = b; d.data[i + 3] = a;
    }
    g.putImageData(d, 0, 0);
    return c.toDataURL("image/png");
  };

  /*  And back the other way. Identical to what `liftBox` builds, so from here
      on nothing can tell a part from a selection. */
  const pngToClip = async url => {
    const img = await loadImg(url);
    if (!img) return false;
    const c = document.createElement("canvas");
    c.width = img.width; c.height = img.height;
    const g = c.getContext("2d", { willReadFrequently: true });
    g.imageSmoothingEnabled = false;
    g.drawImage(img, 0, 0);
    const d = g.getImageData(0, 0, c.width, c.height).data;
    const pts = [];
    for (let y = 0; y < c.height; y++) {
      for (let x = 0; x < c.width; x++) {
        const i = (y * c.width + x) * 4;
        if (!d[i + 3]) continue;
        pts.push([x, y, d[i], d[i + 1], d[i + 2], d[i + 3]]);
      }
    }
    if (!pts.length) return false;
    clip = { pts, w: c.width, h: c.height };
    return true;
  };

  /*  Named after what it is, because a tray of eight unnamed thumbnails is a
      puzzle at the size these are drawn. The name is editable in place. */
  let partSeq = 0;
  const keepClip = () => {
    const url = clipToPng();
    if (!url) { hint.textContent = "nothing on the clipboard to keep"; return; }
    let name = "part " + (++partSeq);
    while (PARTS.has(name)) name = "part " + (++partSeq);
    PARTS.set(name, url);
    if (!saveParts()) {
      PARTS.delete(name);
      hint.textContent = "no room left in this browser for another part";
      return;
    }
    drawParts();
    hint.textContent = "kept as " + name;
  };
  keepBtn.onclick = keepClip;

  function drawParts() {
    partList.innerHTML = "";
    keepBtn.disabled = !clip;
    if (!PARTS.size) {
      const none = el("span", "sp-part-none", partList);
      none.textContent = "pick \u29c9, drag a box round something, press keep. "
                      + "Or drop a png here";
      return;
    }
    for (const [name, url] of PARTS) {
      const item = el("button", "sp-part", partList);
      item.type = "button";
      item.title = name + " \u2014 click to pick it up, right-click to forget it";
      const im = el("img", null, item);
      im.src = url; im.alt = name;
      item.onclick = async () => {
        if (!(await pngToClip(url))) { hint.textContent = "could not read " + name; return; }
        /*  Straight onto the clipboard AND into the tool that uses it, because
            picking up a part with the pencil still selected does nothing
            visible and looks broken. */
        tool = "copy";
        paint();
        hint.textContent = name + " \u2014 click to stamp it";
      };
      item.oncontextmenu = e => {
        e.preventDefault();
        PARTS.delete(name);
        saveParts();
        drawParts();
      };
    }
  }

  /*  Dropping a PNG on the tray adds a part; dropping one on the CANVAS still
      opens it as a drawing. Two targets, two meanings, and the one you are
      over is the one you get. */
  const partStop = e => { e.preventDefault(); e.stopPropagation(); };
  partRow.addEventListener("dragenter", e => { partStop(e); partRow.classList.add("drop"); });
  partRow.addEventListener("dragover", partStop);
  partRow.addEventListener("dragleave", e => { partStop(e); partRow.classList.remove("drop"); });
  partRow.addEventListener("drop", async e => {
    partStop(e);
    partRow.classList.remove("drop");
    const files = [...((e.dataTransfer && e.dataTransfer.files) || [])]
      .filter(f => /^image\//.test(f.type));
    if (!files.length) { hint.textContent = "that was not an image"; return; }
    for (const f of files) {
      const url = URL.createObjectURL(f);
      const img = await loadImg(url);
      URL.revokeObjectURL(url);
      if (!img) continue;
      const c = document.createElement("canvas");
      c.width = img.width; c.height = img.height;
      const g = c.getContext("2d");
      g.imageSmoothingEnabled = false;
      g.drawImage(img, 0, 0);
      const name = f.name.replace(/\.[^.]+$/, "") || ("part " + (++partSeq));
      PARTS.set(name, c.toDataURL("image/png"));
    }
    if (!saveParts()) hint.textContent = "no room left in this browser for that";
    drawParts();
  });
  /*  NOT CALLED HERE.

      `drawParts` reads `clip` to decide whether `keep` is pressable, and the
      clipboard is declared a few hundred lines below this — so calling it
      during the build hit the temporal dead zone, threw, and took the whole
      panel down with it. The first draw goes at the end of the build with
      everything else that needs the panel to exist first. */
  /*  Only the enabled state, on every repaint — rebuilding the thumbnails
      sixty times a second would throw away the one you are hovering. */
  function drawPartsSync() { keepBtn.disabled = !clip; }



  //  Its two boxes are over the canvas now; the row they were in is empty.
  sizeBar.remove();

  /*  The ratio goes under the canvas with the rest of the drawing's own
      settings. `sp-under` is what right-aligns that side of the column, and
      because the row is hidden on a wear slot the canvas gets the height back
      there — `belowGrid` counts only what is actually on screen. */
  /*  Over the canvas, at the right — with the size boxes it feeds rather than
      below the drawing they describe. `sp-under` is only the class that
      right-aligns a row and puts a gap above it; the name is now a lie about
      where this one sits, and not worth a second class to fix. */
  scaleBar.classList.add("sp-under");
  left.insertBefore(scaleBar, grid);
  nameBar.classList.add("sp-fold");
  /*  THE THINGS YOU PRESS GO ABOVE THE THING YOU LOOK AT.

      The name and the export buttons sat under the preview, at the bottom of a
      column that wants six hundred pixels — so on any tile shorter than that,
      `empty board` and half its neighbours were below the panel's edge and
      simply not there as far as anyone could tell.

      The preview is the one thing in this column you only ever read, so it can
      be the part that falls off the bottom. */
  right.insertBefore(nameBar, prevWrap);
  right.insertBefore(outBar, prevWrap);

  /*  The filename the page will look for. One name either way — a place is
      named for the place, a wardrobe for its wearer — because both are one
      file. Slugged, so what you type cannot produce a filename that will
      never match. */
  function fileName() {
    return (slugify(nameIn.value.trim()) || (isPlace() ? "place" : "default")) + ".png";
  }

  // ---- geometry
  const nFrames = () => layers[slot].__frames || SPR_FRAMES;
  const cellW = () => layers[slot].width / nFrames();
  const cellH = () => layers[slot].height;
  function syncSize() { wIn.value = cellW(); hIn.value = cellH(); }

  /*  Where the body sits behind this layer, in the layer's own pixels.
      Same two rules as everywhere else: centered, and standing on the bottom
      edge. A taller layer therefore shows the body lower down, which is
      correct — the extra room is headroom. */
  function bodyOffset() {
    return { x: (cellW() - SPR_W) / 2, y: cellH() - SPR_H };
  }

  // ---- drawing
  function colorNow() {
    if (pen === -1) return null;                    // erase
    if (pen === -2) return fixed.value;             // the picker
    return SWATCHES[pen];
  }
  /*  One pixel at an exact color — what the clipboard stamps with. Obeys the
      same "all frames" rule as the pencil: a shape stamped into one frame of a
      still layer should land in all of them, like any other mark. */
  /*  Bumped by everything that changes a layer. The lit preview is cached
      against it, so a stroke invalidates the cache and a repaint that changed
      nothing does not. */
  let wipSeq = 0;
  //  Set by anything that needs to explain itself; consumed by the next paint.
  let hintOnce = "";

  function setPixelRGBA(x, y, r, g2, b, a) {
    wipSeq++;
    if (x < 0 || y < 0 || x >= cellW() || y >= cellH()) return;
    const g = layers[slot].getContext("2d");
    const at = linked ? [...Array(nFrames()).keys()] : [frame];
    for (const f of at) {
      const sx = f * cellW() + x;
      g.clearRect(sx, y, 1, 1);
      if (!a) continue;
      g.fillStyle = "rgba(" + r + "," + g2 + "," + b + "," + (a / 255) + ")";
      g.fillRect(sx, y, 1, 1);
    }
  }

  /*  Every magenta pixel in the layer, across every frame. A place has one
      frame, but the sweep costs nothing and an anchor stranded in a frame you
      are not looking at would be invisible and permanent. */
  function clearAnchor() {
    wipSeq++;
    const cv = layers[slot];
    const g = cv.getContext("2d", { willReadFrequently: true });
    const d = g.getImageData(0, 0, cv.width, cv.height);
    const px = d.data;
    let hit = false;
    /*  Unflags, rather than deleting: the pixel is somebody's drawing. Unless
        it was standing in open air, in which case there was no drawing under
        it and it goes back to nothing. */
    for (let i = 0; i < px.length; i += 4) {
      if (px[i + 3] === ANCHOR_A) { px[i + 3] = 255; hit = true; }
      else if (px[i + 3] === ANCHOR_AIR) { px[i + 3] = 0; hit = true; }
    }
    if (hit) g.putImageData(d, 0, 0);
  }

  /*  One pixel's flag. The colour is never touched, which is the entire point.

      A transparent pixel normally has nothing to carry a flag and is left
      alone: a mark on nothing would appear from nowhere the moment somebody
      painted there. The anchor is the exception, because the height you want
      a post to reach is usually over the roof and there is no drawing up
      there to hang it on. See ANCHOR_AIR. */
  function flagPixel(x, y, want) {
    const w = cellW(), h = cellH();
    if (x < 0 || y < 0 || x >= w || y >= h) return false;
    const cv = layers[slot], g = cv.getContext("2d", { willReadFrequently: true });
    const at = linked ? [...Array(nFrames()).keys()] : [frame];
    let did = false;
    for (const f of at) {
      const sx = f * w + x;
      const d = g.getImageData(sx, y, 1, 1);
      const had = d.data[3];
      if (!had) {
        //  Nothing drawn here. Only an anchor may stand in open air.
        if (want !== ANCHOR_A) continue;
        d.data[3] = ANCHOR_AIR;
      } else if (had === ANCHOR_AIR) {
        /*  An anchor already standing in the air. Erasing it returns the
            pixel to nothing; anything else would turn a marker into paint
            somebody never laid down. */
        d.data[3] = want === ANCHOR_A ? ANCHOR_AIR : 0;
      } else {
        d.data[3] = want;
      }
      g.putImageData(d, sx, y);
      did = true;
    }
    return did;
  }

  function setPixel(x, y, erase) {
    wipSeq++;
    if (x < 0 || y < 0 || x >= cellW() || y >= cellH()) return;
    /*  IN EFFECTS, EVERY TOOL WRITES A FLAG.

        This is the one place a tool actually puts something down, so it is the
        only place the mode has to exist. The pencil, the line, the box and the
        fill all arrive here and all of them now mark instead of paint — which
        is why the mode needed no tools of its own. */
    if (fxMode) {
      /*  The erase square unmarks, exactly as it erases in paint. It was being
          ignored here, so picking erase in effects and drawing carefully over
          a window MARKED it — the one action whose whole purpose is to undo
          the previous one did the previous one again.

          `colorNow()` is null for the erase square, which is the same test the
          painting path below already uses. */
      flagPixel(x, y, (erase || !colorNow()) ? 255 : fxKind);
      return;
    }
    const g = layers[slot].getContext("2d");
    const c = colorNow();
    // Linked: the same pixel in every frame, so one drawing is a whole layer.
    const at = linked ? [...Array(nFrames()).keys()] : [frame];
    for (const f of at) {
      const sx = f * cellW() + x;
      if (erase || !c) g.clearRect(sx, y, 1, 1);
      else { g.fillStyle = c; g.fillRect(sx, y, 1, 1); }
    }
    if (!erase && c) remember(c);
    touched[slot] = true;
  }

  /*  Which pixels a shape covers. One function, so the preview drawn while you
      drag and the pixels committed when you let go cannot disagree — the
      commonest way a shape tool lies to you. */
  function shapePixels(x0, y0, x1, y1) {
    const out = [];
    if (tool === "pencil") { out.push([x1, y1]); return out; }
    if (tool === "line") {
      // Bresenham: whole pixels only, which is the only kind there are here.
      const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
      const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
      let err = dx + dy, x = x0, y = y0;
      for (;;) {
        out.push([x, y]);
        if (x === x1 && y === y1) break;
        const e2 = 2 * err;
        if (e2 >= dy) { err += dy; x += sx; }
        if (e2 <= dx) { err += dx; y += sy; }
      }
      return out;
    }
    const ax = Math.min(x0, x1), bx = Math.max(x0, x1);
    const ay = Math.min(y0, y1), by = Math.max(y0, y1);
    for (let y = ay; y <= by; y++) {
      for (let x = ax; x <= bx; x++) {
        const edge = x === ax || x === bx || y === ay || y === by;
        if (tool === "fill" || edge) out.push([x, y]);
      }
    }
    return out;
  }

  let drawing = null;
  let anchor = null;      // where a shape started, while it is being dragged
  let pending = null;     // the shape under the cursor, not yet committed
  /*  Where the pointer is now, for every tool. `pending` only exists for the
      tools that hold a shape before committing it, and the pencil — the one
      you are most likely to be counting cells with — is not one of them. */
  let atCell = null;
  /*  EVERY THING MEASURED, kept after the pointer is up.

      That they survive the pointer is the whole point: a measurement you have
      to hold a button down to read is one you cannot write down or compare
      against the next one. That there are several is the same argument taken
      one step further — the question is almost never "how big is this", it is
      "is this the same as that", and one at a time makes you hold the first
      answer in your head while you go and get the second.

      They pile up. The one being dragged is always the last.

      ONE SET PER TYPE, not one per panel. A measurement is about the thing it
      was taken from — the coat's shoulder, the mill's door — and body, bottom,
      top, hat and place are five different drawings that happen to share a
      canvas. Marks made on one followed you onto the next, sitting over art
      they had nothing to do with; on a place they were worse than meaningless,
      because a place is a different size and a box drawn in a 24-cell figure
      lands somewhere arbitrary on a 102-cell street.

      Read through the slot rather than swapped when the slot changes: every
      place that switches type — the type buttons, a dropped file, the draft
      coming back — would otherwise need to remember to swap it, and one that
      forgot would put somebody else's marks on your drawing. */
  const measuresBy = Object.create(null);
  const measures = () => (measuresBy[slot] || (measuresBy[slot] = []));
  /*  Where each label's ⊗ ended up, in canvas pixels, with the index of the
      measurement it belongs to. Written by `paint`, because only `paint` knows
      where a label was clamped and nudged to, and read by the pointer
      handler. Empty whenever there is nothing measured. */
  let measCloses = [];
  let overClose = false;         // the pointer is on that × right now
  /*  The canvas keeps the crosshair unless the drawn cell has replaced it —
      except over the ×, which is a button and says so. In one place because
      both the settings sync and the pointer move need to set it, and a repaint
      landing mid-hover was quietly putting the crosshair back. */
  const syncCursor = () => {
    grid.style.cursor = overClose ? "pointer" : (cellCursor ? "none" : "crosshair");
  };
  /*  The tool to go back to when the middle button is let go. Non-null only
      for as long as a middle-drag lasts. */
  let panFrom = null;

  /*  THE CLIPBOARD — A BOX YOU DRAG ROUND WHAT YOU WANT.

      This used to lift by color: click a pixel and it took that pixel and
      every pixel of the same color joined to it. The argument for it was that
      what is on this canvas is shapes — a sleeve, a boot, a band of trim — and
      none of them is rectangular, so a box copies the sleeve plus whatever
      corner of the body shares its bounding box.

      The argument was fine and the tool was not. What you get is decided by
      what the flood fill happens to find, which is not what you can see: a
      sleeve drawn in two shades is two shapes, one shade that leaks through a
      single-pixel join takes half the coat with it, and either way you do not
      find out until it is already on the clipboard. A tool where the selection
      is a guess is a tool you cannot aim.

      So: drag a box, and what is in the box is what you get — which is the one
      thing about a marquee that is never in doubt. Transparent pixels inside
      it stay transparent and stamp nothing, so a box drawn generously round a
      sleeve still only puts the sleeve down.

      It survives changing frame, layer and name, because copying a sleeve from
      one frame into the next is most of what it is for. It does not survive a
      resize: the pixels would no longer mean the same thing on a new grid.

      Same rule as the move tool at the edges — anything that would land
      outside the cell is dropped rather than wrapped into the frame next
      door. */
  let clip = null;        // { pts: [[dx, dy, r, g, b, a]] } once something is lifted
  let hover = null;       // where the stamp would land, for the preview

  const sameColor = (d, i2, j2) =>
    d[i2] === d[j2] && d[i2 + 1] === d[j2 + 1] &&
    d[i2 + 2] === d[j2 + 2] && d[i2 + 3] === d[j2 + 3];

  /*  Everything inside the box, offset from its top left corner — which is
      then the corner the cursor holds it by, so a selection is picked up and
      put down by the same pixel and lands where the preview says it will.

      Transparent pixels are dropped on the way in rather than carried and
      skipped on the way out: an empty pixel is not part of what you selected,
      it is the gap you drew the box across. Keeping them would make the
      clipboard an eraser wherever it was generous. */
  function liftBox(ax, ay, bx, by) {
    const w = cellW(), h = cellH();
    const x0 = Math.max(0, Math.min(ax, bx)), x1 = Math.min(w - 1, Math.max(ax, bx));
    const y0 = Math.max(0, Math.min(ay, by)), y1 = Math.min(h - 1, Math.max(ay, by));
    if (x1 < x0 || y1 < y0) return false;
    const g = layers[slot].getContext("2d", { willReadFrequently: true });
    const d = g.getImageData(frame * w, 0, w, h).data;
    const pts = [];
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const at = (y * w + x) * 4;
        if (!d[at + 3]) continue;
        pts.push([x - x0, y - y0, d[at], d[at + 1], d[at + 2], d[at + 3]]);
      }
    }
    //  A box drawn over nothing at all is not a selection, it is a slip.
    if (!pts.length) return false;
    clip = { pts, w: x1 - x0 + 1, h: y1 - y0 + 1 };
    return true;
  }

  /*  THE BOX ROUND WHATEVER IS UNDER THAT CELL.

      A four-connected flood fill — a shape that only touches at a
      corner is a second shape, which is what anybody drawing pixel art means
      by it — but it keeps the extremes instead of the pixels. Nothing is
      lifted, nothing is changed; the answer is four numbers. */
  function shapeBox(sx, sy) {
    const w = cellW(), h = cellH();
    if (sx < 0 || sy < 0 || sx >= w || sy >= h) return null;
    const g = layers[slot].getContext("2d", { willReadFrequently: true });
    const d = g.getImageData(frame * w, 0, w, h).data;
    const seed = (sy * w + sx) * 4;
    if (!d[seed + 3]) return null;              // empty cell measures nothing

    const seen = new Uint8Array(w * h);
    const queue = [[sx, sy]];
    seen[sy * w + sx] = 1;
    let x0 = sx, y0 = sy, x1 = sx, y1 = sy;
    while (queue.length) {
      const [x, y] = queue.pop();
      if (x < x0) x0 = x;
      if (x > x1) x1 = x;
      if (y < y0) y0 = y;
      if (y > y1) y1 = y;
      for (const [nx, ny] of [[x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]]) {
        if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
        const k = ny * w + nx;
        if (seen[k] || !sameColor(d, k * 4, seed)) continue;
        seen[k] = 1;
        queue.push([nx, ny]);
      }
    }
    return { x0, y0, x1, y1, shape: true };
  }

  function stampClip(atX, atY) {
    wipSeq++;
    //  Effects marks; it never paints. Stamping pixels down is painting.
    if (fxMode) return;
    if (!clip) return;
    for (const [dx, dy, r, g2, b, a] of clip.pts) setPixelRGBA(atX + dx, atY + dy, r, g2, b, a);
    touched[slot] = true;
  }

  const cellAt = e => {
    const r = grid.getBoundingClientRect();
    /*  MEASURE FROM THE PIXELS, NOT FROM THE BORDER.

        `getBoundingClientRect` gives the BORDER box, and this canvas has a
        1px border, so the old arithmetic started one pixel outside the drawing
        and then divided by a cell size 2/510 too big. At the left edge that is
        invisible; by the right edge the error has grown to most of a cell,
        which is where a guide node landed somewhere other than where it was
        put — and every other tool was a fraction out the whole way across.

        `clientLeft`/`clientTop` are the border widths and `clientWidth`/
        `clientHeight` the content box, all in CSS pixels; `k` carries them
        into screen pixels if the page itself is zoomed. */
    const k = grid.offsetWidth ? r.width / grid.offsetWidth : 1;
    const x0 = r.left + grid.clientLeft * k, y0 = r.top + grid.clientTop * k;
    const w = grid.clientWidth * k, h = grid.clientHeight * k;
    return { x: Math.floor((e.clientX - x0) / (w / cellW())),
             y: Math.floor((e.clientY - y0) / (h / cellH())) };
  };
  /*  The same measurement, stopping one step short of the divide by a cell.
      Anything drawn on the canvas rather than into it — the × on the
      measurement label — is placed in these, not in cells. */
  const pixAt = e => {
    const r = grid.getBoundingClientRect();
    const k = grid.offsetWidth ? r.width / grid.offsetWidth : 1;
    const sx = grid.clientWidth * k, sy = grid.clientHeight * k;
    if (!(sx > 0 && sy > 0)) return { x: -1, y: -1 };
    return { x: (e.clientX - r.left - grid.clientLeft * k) / (sx / grid.width),
             y: (e.clientY - r.top - grid.clientTop * k) / (sy / grid.height) };
  };
  /*  Which measurement's ⊗ is under the pointer, or -1. Searched newest first:
      where two labels do overlap, the one drawn on top is the one you meant. */
  const closeAt = e => {
    if (!measCloses.length) return -1;
    const p = pixAt(e);
    for (let i = measCloses.length - 1; i >= 0; i--) {
      const c = measCloses[i];
      if (p.x >= c.x && p.x <= c.x + c.w && p.y >= c.y && p.y <= c.y + c.h) return c.i;
    }
    return -1;
  };
  grid.addEventListener("pointerdown", e => {
    /*  BEFORE ANY TOOL GETS THE PRESS.

        The × sits over the drawing, so whatever is underneath it would
        otherwise get painted the moment you dismissed the label — you would
        clear the measurement and leave a pixel behind every time. It takes the
        press and nothing else sees it. */
    if (e.button === 0) {
      const hit = closeAt(e);
      if (hit >= 0) {
        e.preventDefault();
        measures().splice(hit, 1);
        paint();
        return;
      }
    }
    drawing = e.button === 2 || e.ctrlKey;
    /*  THE MIDDLE BUTTON NUDGES, WHATEVER TOOL IS UP.

        Moving what you have drawn is the one thing you want while holding
        another tool — you are drawing a window, it is two pixels left of where
        it should be, and switching to move and back costs you your place. The
        middle button borrows the move tool for the length of one drag and
        hands it back on release, so nothing you had selected is lost.

        preventDefault, or the browser opens its own autoscroll on middle-drag
        and takes the pointer with it. */
    if (e.button === 1) {
      e.preventDefault();
      panFrom = tool;
      tool = "move";
      drawing = false;
    }
    const { x, y } = cellAt(e);
    anchor = { x, y };
    /*  Before the first pixel of this stroke, so one undo is one stroke. The
        guide, measure and copy tools are excluded: none of them writes a pixel
        on the way down — copy takes its own snapshot at the stamp, which is
        the moment it does — and filling the stack with no-ops would push real
        work off the end of it. */
    if (tool !== "guide" && tool !== "measure" && tool !== "copy") snapshot();
    /*  A shape shows before it commits; the pencil goes straight down. Waiting
        to commit is what makes a line adjustable — you see it before you agree
        to it. */
    /*  Copy is a drag and then clicks: the drag draws the box, and every click
        after it stamps what was in the box. Right-click puts the clipboard
        down — the same button that erases everywhere else, and this is the
        erase of a selection.

        The snapshot is taken where the pixels change, which is the stamp.
        Selecting alters nothing, and an undo step that undoes nothing is a
        press of undo that looks broken. */
    if (tool === "copy") {
      if (drawing) { clip = null; anchor = null; pending = null; paint(); return; }
      if (clip) { snapshot(); stampClip(x, y); anchor = null; paint(); return; }
      anchor = { x, y };
      pending = { x, y };
      paint();
      try { grid.setPointerCapture(e.pointerId); } catch (err) { /* not captured */ }
      return;
    }
    /*  ONE ANCHOR, MOVED RATHER THAN ADDED TO.

        A second magenta pixel is never what anybody meant, and the reader
        would have to pick one of them. So placing an anchor clears whatever
        anchor was there first — pressing again moves it, and right-click takes
        it away entirely, which is the erase of an anchor. */
    if (tool === "anchor") {
      /*  MOVE IT ONLY IF THERE IS SOMEWHERE TO MOVE IT TO.

          The anchor is a flag in a pixel's alpha, so it needs a drawn pixel to
          live in. Clearing first and placing second meant a press on empty
          canvas threw the old anchor away and put nothing down, without
          saying so: you lost a signpost by clicking the sky.

          Now the old one only goes once the new one has somewhere to land. */
      const empty = !layers[slot].getContext("2d", { willReadFrequently: true })
        .getImageData(frame * cellW() + x, y, 1, 1).data[3];
      if (!drawing && empty) {
        /*  Left for the release to consume. This press is followed by its own
            pointerup, which repaints; painting here as well would spend the
            message on the first of the two and the second would write the
            standing hint over it. */
        hintOnce = "nothing drawn there to anchor to \u2014 put the flag on "
                 + "something you have drawn";
        try { grid.setPointerCapture(e.pointerId); } catch (err) { /* not captured */ }
        return;
      }
      clearAnchor();
      if (!drawing) flagPixel(x, y, ANCHOR_A);
      touched[slot] = true;
      anchor = null;
      paint();
      recordStep();
      //  Captured like every other press, so the release comes back here.
      try { grid.setPointerCapture(e.pointerId); } catch (err) { /* not captured */ }
      return;
    }
    /*  MEASURE. Draws nothing, so it takes no snapshot and sets no pixel.

        A click asks about the shape under it, which is the question you have
        when you cannot remember how big you made a window. A drag asks about
        an arbitrary span, for the gaps between things.

        Right-click clears them ALL — the same button that erases everywhere
        else in here, and with marks piling up there has to be one gesture that
        takes the lot away. The ⊗ on a label is how you drop just that one. */
    if (tool === "measure") {
      if (drawing) { measures().length = 0; anchor = null; paint(); return; }
      measures().push({ x0: x, y0: y, x1: x, y1: y, shape: false });
      paint();
      try { grid.setPointerCapture(e.pointerId); } catch (err) { /* not captured */ }
      return;
    }
    /*  A guide is grabbed, not drawn. Land on one and you are moving that one;
        land anywhere else and you are pivoting a new one out of that cell.
        Right-click takes one away — the same button that erases everywhere
        else in here, and removing a guide is the erase of a guide. */
    if (tool === "guide") {
      const hit = guideNear(x + 0.5, y + 0.5, 0.9);
      if (drawing) {
        if (hit >= 0) {
          guides.splice(hit, 1);
          if (lastGuide >= guides.length) lastGuide = guides.length - 1;
          saveGuides();
        }
        anchor = null;
      } else {
        if (hit >= 0) { guides[hit].x = x; guides[hit].y = y; lastGuide = hit; }
        else {
          guides.push({ x, y, deg: normDeg(parseFloat(gAng.value) || 0) });
          lastGuide = guides.length - 1;
        }
        /*  Nothing is committed on release, because a guide is not a mark —
            it is already where it is going the whole time you are aiming it.
            The anchor is only how the drag knows what to aim. */
        saveGuides();
      }
      paint();
      try { grid.setPointerCapture(e.pointerId); } catch (err) { /* not captured */ }
      return;
    }
    atCell = { x, y };
    if (tool === "pencil") setPixel(x, y, drawing);
    else pending = { x, y };
    paint();
    // Capture last, and never let it stop the drawing: it throws for a pointer
    // the browser does not consider active, and that aborted the whole stroke.
    try { grid.setPointerCapture(e.pointerId); } catch (err) { /* not captured */ }
  });
  grid.addEventListener("pointermove", e => {
    /*  OVER THE ×, THE CANVAS STOPS BEING A CANVAS.

        A crosshair — or nothing at all, with the cell pointer on — hanging
        over the one pressable thing on this surface reads as "you cannot click
        here", which is the opposite of true. The hand says otherwise, and it
        is also the only hint that the × is a button and not decoration. */
    if (drawing === null) {
      const over = closeAt(e) >= 0;
      if (over !== overClose) { overClose = over; syncCursor(); }
      if (over) return;
    }
    /*  THE BUTTON ITSELF IS THE TRUTH, NOT WHAT WE REMEMBER OF IT.

        A stroke ends when `stop` runs, and `stop` runs on pointerup — so a
        release the canvas never sees leaves `drawing` set to false rather than
        null, and false is not null, so every later MOVE paints. You then draw
        by hovering, before pressing anything.

        It is easy to lose that release: several tools return from pointerdown
        before the pointer is captured, and letting go outside the canvas then
        delivers pointerup somewhere else entirely.

        `e.buttons` is the hardware answer — a bitmask of what is physically
        held right now. If nothing is held, no stroke is in progress, whatever
        we thought. */
    if (drawing !== null && !e.buttons) { stop(); return; }
    /*  With a shape on the clipboard the cursor is a stamp, so the canvas has
        to show where it would land whether a button is down or not. */
    if (tool === "copy") {
      const at = cellAt(e);
      /*  Two different jobs on the same tool: with nothing on the clipboard
          the pointer is drawing the box, and with something on it the pointer
          is carrying that something. */
      if (!clip && anchor) {
        if (!pending || pending.x !== at.x || pending.y !== at.y) { pending = at; paint(); }
        return;
      }
      if (clip && (!hover || hover.x !== at.x || hover.y !== at.y)) { hover = at; paint(); }
      return;
    }
    /*  WHICH CELL, WITH NOTHING PRESSED.

        This has to come before the "no button down, nothing to do" guard —
        answering while nothing is pressed is the entire point of it, and sat
        below that line it never ran at all. */
    if (drawing === null && (cellCursor || tool === "guide" || tool === "measure")) {
      const at = cellAt(e);
      if (!hover || hover.x !== at.x || hover.y !== at.y) { hover = at; paint(); }
      return;
    }
    if (drawing === null) return;
    const { x, y } = cellAt(e);
    if (tool === "measure") {
      //  The one under the hand is always the one most recently pushed.
      const mine = measures();
      if (anchor && mine.length) {
        const m = mine[mine.length - 1];
        m.x0 = Math.min(anchor.x, x); m.y0 = Math.min(anchor.y, y);
        m.x1 = Math.max(anchor.x, x); m.y1 = Math.max(anchor.y, y);
        m.shape = false;
        paint();
      }
      return;
    }
    /*  Aiming. The pointer is a point on the line, not an end of it: the guide
        pivots on its cell and runs both ways, so dragging back through the
        anchor and out the other side changes nothing, which is right. */
    if (tool === "guide") {
      if (anchor && lastGuide >= 0 && lastGuide < guides.length) {
        const g = guides[lastGuide];
        const rise = (g.y + 0.5) - (y + 0.5), run = (x + 0.5) - (g.x + 0.5);
        if (rise || run) {
          let deg = Math.atan2(rise, run) * 180 / Math.PI;
          if (e.shiftKey) deg = Math.round(deg / 15) * 15;
          g.deg = normDeg(deg);
          gAng.value = String(g.deg);
          saveGuides(); paint();
        }
      }
      return;
    }
    atCell = { x, y };
    if (tool === "pencil") setPixel(x, y, drawing);
    else pending = { x, y };
    paint();
  });
  grid.addEventListener("pointerleave", () => { if (hover) { hover = null; paint(); } });
  /*  Shift the whole layer by a whole number of pixels. Committed on release,
      so a nudge can be lined up before it is agreed to — and applied to every
      frame when "all frames" is on, or the frames walk out of register with
      one another. */
  /*  How far the layer may actually go.

      Dragging past the edge used to cut whatever crossed it, permanently and
      with no undo — nudge a coat two pixels too far and a sleeve is gone. So
      the move is limited to what keeps the DRAWN pixels inside the cell: shove
      it as hard as you like and it stops at the edge rather than eating the
      drawing.

      Measured on the frame being moved. */
  function shiftRange() {
    const cv = layers[slot], w = cellW(), h = cellH();
    const g = cv.getContext("2d");
    const at = [frame];
    let minX = w, minY = h, maxX = -1, maxY = -1;
    for (const f of at) {
      const d = g.getImageData(f * w, 0, w, h).data;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          if (!d[(y * w + x) * 4 + 3]) continue;
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }
    if (maxX < 0) return { lo: 0, hi: 0, up: 0, down: 0 };   // nothing drawn
    return { lo: -minX, hi: w - 1 - maxX, up: -minY, down: h - 1 - maxY };
  }

  function clampShift(dx, dy) {
    const r = shiftRange();
    return { dx: Math.max(r.lo, Math.min(r.hi, dx)),
             dy: Math.max(r.up, Math.min(r.down, dy)) };
  }

  /*  Deliberately ONE frame, whatever "all frames" says.

      That toggle is about putting the same thing into every frame, which is
      what you want while drawing and precisely what you do not want here:
      moving is how you fix a frame that sits wrong against the others, and
      shifting them all together leaves you exactly where you started. */
  function shiftBy(dx, dy) {
    wipSeq++;
    //  Same rule: moving the drawing is changing the drawing.
    if (fxMode) return;
    if (!dx && !dy) return;
    touched[slot] = true;
    const cv = layers[slot], w = cellW(), h = cellH();
    const g = cv.getContext("2d");
    const at = [frame];
    for (const f of at) {
      const tmp = document.createElement("canvas");
      tmp.width = w; tmp.height = h;
      const tg = tmp.getContext("2d");
      tg.imageSmoothingEnabled = false;
      tg.drawImage(cv, f * w, 0, w, h, dx, dy, w, h);
      g.clearRect(f * w, 0, w, h);
      g.drawImage(tmp, f * w, 0);
    }
  }

  const stop = () => {
    //  Borrowed for one drag; given back however this drag ends.
    const back = () => { if (panFrom) { tool = panFrom; panFrom = null; } };
    /*  The box is only a selection once you let go of it. A drag that never
        left its cell is a one-pixel box, which is a legitimate thing to want —
        the single dark square that is somebody's eye — so it is not treated as
        a mis-click. */
    if (tool === "copy" && !clip && anchor && pending) {
      const got = liftBox(anchor.x, anchor.y, pending.x, pending.y);
      hover = pending;
      drawing = null; anchor = null; pending = null; atCell = null;
      paint();
      //  After the repaint, which writes the hint line itself and would
      //  otherwise wipe this the instant it was set.
      if (!got) hint.textContent = "nothing drawn inside that box";
      return;
    }
    /*  A measure drag that never left its starting cell was a click, and a
        click is a question about the shape there rather than about one cell. */
    if (tool === "measure") {
      const mine = measures();
      const last = mine.length - 1, m = mine[last];
      if (m && m.x0 === m.x1 && m.y0 === m.y1) {
        mine[last] = shapeBox(m.x0, m.y0) || m;
      }
      /*  THE SAME THING TWICE IS ONE MARK.

          Clicking a shape you have already measured used to stack an identical
          box on an identical box: nothing looked different, and dismissing it
          left a second one behind that you had no way of knowing was there.
          Now the second click is simply the first answer again. */
      const now = mine[last];
      if (now && mine.some((o, i) => i !== last && o.x0 === now.x0
            && o.y0 === now.y0 && o.x1 === now.x1 && o.y1 === now.y1)) {
        mine.pop();
      }
      drawing = null; anchor = null; pending = null; atCell = null;
      paint();
      return;
    }
    if (anchor && pending && tool === "move") {
      const m = clampShift(pending.x - anchor.x, pending.y - anchor.y);
      shiftBy(m.dx, m.dy);
      back();
      drawing = null; anchor = null; pending = null; atCell = null; paint();
      recordStep();
      return;
    }
    // Let go and the shape is laid down; until then it is only a proposal.
    if (anchor && pending && tool !== "pencil") {
      for (const [px, py] of shapePixels(anchor.x, anchor.y, pending.x, pending.y)) {
        setPixel(px, py, drawing);
      }
    }
    back();
    drawing = null; anchor = null; pending = null; atCell = null;
    paint();
    recordStep();
  };
  grid.addEventListener("pointerup", stop);
  grid.addEventListener("pointercancel", stop);
  grid.addEventListener("contextmenu", e => e.preventDefault());

  /*  OPEN A PNG BY DROPPING IT ON THE CANVAS.

      A finished drawing left here by the only door available: you downloaded
      it, and the editor could not read it back. It reads the server's own
      images folder and nothing else, so a file in ~/Downloads — the file this
      panel handed you five minutes ago — was out of reach.

      The FILENAME decides how it is read, because the filenames here already
      carry that meaning and are the ones this panel writes:

        default.png        a wardrobe sheet — four rows, split back apart
        default.hat.png    one row, into the slot it names
        anything, on the place slot — the place

      Not the shape of the image, which cannot tell you: a still one-frame hat
      and a four-row sheet are both roughly square, and guessing wrong quietly
      quarters somebody's drawing. A sheet whose height is not divisible by
      four is not a sheet whatever it is called, so that falls back to the row
      you are on rather than being cut into quarters that mean nothing. */
  const dropStop = e => { e.preventDefault(); e.stopPropagation(); };
  grid.addEventListener("dragenter", e => { dropStop(e); grid.classList.add("sp-drop"); });
  grid.addEventListener("dragover", dropStop);
  grid.addEventListener("dragleave", e => { dropStop(e); grid.classList.remove("sp-drop"); });
  grid.addEventListener("drop", async e => {
    dropStop(e);
    grid.classList.remove("sp-drop");
    const file = [...((e.dataTransfer && e.dataTransfer.files) || [])]
      .find(f => /^image\//.test(f.type));
    if (!file) { hint.textContent = "that was not an image"; return; }
    const url = URL.createObjectURL(file);
    const img = await loadImg(url);
    URL.revokeObjectURL(url);
    if (!img || !host.isConnected) { hint.textContent = "could not read " + file.name; return; }
    snapshot();

    const named = /\.(body|bottom|top|hat)\.[^.]+$/i.exec(file.name);
    let note;
    if (isPlace()) {
      blitInto(layers.place, img);
      layers.place.__frames = 1;
      touched.place = true;
      note = "opened as the place";
    } else if (named) {
      slot = named[1].toLowerCase();
      blitInto(layers[slot], img);
      layers[slot].__frames = SPR_FRAMES;
      touched[slot] = true;
      note = "opened into " + slot;
    } else if (img.height % ROWS.length === 0) {
      const rows = sheetRows(img) || [];
      let got = 0;
      rows.forEach((cv, i) => {
        if (!cv) return;                       // a row this sheet has no opinion about
        blitInto(layers[ROWS[i]], cv);
        layers[ROWS[i]].__frames = SPR_FRAMES;
        touched[ROWS[i]] = true;
        got++;
      });
      if (!got) { hint.textContent = file.name + " has nothing drawn in it"; return; }
      note = "opened as a sheet \u2014 " + got + (got === 1 ? " row" : " rows");
    } else {
      blitInto(layers[slot], img);
      layers[slot].__frames = SPR_FRAMES;
      touched[slot] = true;
      note = "opened into " + slot;
    }
    /*  Named after the file, so pressing download gives the same name back
        instead of quietly saving it as somebody else. */
    const base = file.name.replace(/\.[^.]+$/, "").replace(/\.(body|bottom|top|hat)$/i, "");
    if (base) nameIn.value = base;
    syncSize(); paint();
    recordStep();
    hint.textContent = note + " \u00b7 " + file.name;
  });

  // ---- painting
  let tick = 0;
  function paint() {
    /*  One cell, in screen pixels. Whole numbers only: a cell of 7.4 pixels
        has to be rounded somewhere, and wherever that lands is a drawn pixel
        a row taller than its neighbour. */
    const cw = cellW(), ch = cellH();
    const z = lastZ = fitZ(cw, ch);
    grid.width = cw * z; grid.height = ch * z;
    /*  THE ROWS ARE NOT SIZED FROM THE CANVAS.

        They were, briefly, so their right edge would line up exactly with the
        drawing instead of with the column — a few pixels of tidiness that cost
        the panel its layout. The rows narrow, so the tool row wraps onto more
        lines, so it is taller, so there is less height for the canvas, so the
        canvas narrows, so the rows narrow again. It settled at a 216-pixel
        canvas in a 533-pixel column.

        The column's width is fixed by the panel and does not depend on
        anything below it, which is what makes it safe to measure. A row is as
        wide as the column; the canvas is as wide as the fit allows. They can
        differ by up to a cell, and that is a better answer than a spiral. */

    slotBtns.forEach((b, i) => b.classList.toggle("on", ROWS[i] === slot));
    // Rebuilt, because the count is the layer's and changes with it.
    if (frameBar.childElementCount !== nFrames()) {
      frameBar.innerHTML = "";
      for (let i = 0; i < nFrames(); i++) {
        const b = el("button", null, frameBar);
        b.type = "button"; b.textContent = String(i + 1);
        b.title = "frame " + (i + 1);
        b.dataset.frame = String(i);
        b.onclick = () => { frame = +b.dataset.frame; paint(); };
      }
    }
    [...frameBar.children].forEach(b => b.classList.toggle("on", +b.dataset.frame === frame));
    //  `keep` is pressable exactly when there is something to keep.
    drawPartsSync();
    /*  A coat has no windows, so the whole idea is hidden off a place — and
        a mode you cannot see you are in is the worst kind. */
    if (!isPlace() && fxMode) fxMode = false;
    fxBtn.hidden = !isPlace();
    fxBtn.textContent = fxMode ? "effects" : "paint";
    fxBtn.title = fxMode
      ? "marking what the drawing MEANS \u2014 press to go back to painting"
      : "painting the drawing \u2014 press to mark lighting and entries on it";
    fxBtn.classList.toggle("on", fxMode);
    /*  THE ROW IS ONE CHOICE, SO ONLY ONE LIGHTS.

        They used to light from two different pieces of state: the painted
        marks from which mark you would paint, the flag from which tool you
        were holding. Both could be lit at once, and then nothing on screen
        told you which one your next click would act on.

        A single-pixel effect lights when you are holding its tool. A painted
        one lights when it is the mark you would paint AND you are not holding
        somebody else's tool. */
    const oneTools = new Set(EFFECTS.filter(e => e.one).map(e => e.tool));
    for (const b of markBtns) {
      const e = EFFECT[b.dataset.kind];
      b.hidden = !isPlace() || !fxMode;
      b.classList.toggle("on", e.one
        ? tool === e.tool
        : fxKind === e.alpha && !oneTools.has(tool));
    }
    toolBtns.forEach((b, i) => b.classList.toggle("on", TOOLS[i][0] === tool));
    //  Switching to a wear layer with the anchor up would leave you holding a
    //  tool whose button is not there any more.
    if (!isPlace() && EFFECTS.some(e => e.one && e.tool === tool)) tool = "pencil";
    /*  Cells first, always — that is what you draw in and what every other
        number here counts. The world size follows on a place, because a
        building has a real one: both, not either, since "25.5 x 16 ft" tells
        you nothing about where to put the next pixel. */
    syncReal(cellW(), cellH());
    const d = defaultCell();
    sizeReset.disabled = cellW() === d.w && cellH() === d.h;
    sizeReset.title = "back to " + d.w + " \u00d7 " + d.h
                    + (isPlace() ? " \u2014 the widest a place draws 1:1 in a column"
                                 : " \u2014 what the wardrobe art is drawn to");
    onionBtn.classList.toggle("on", onion);
    gridBtn.classList.toggle("on", gridOn);
    stepIn.hidden = !gridOn;
    curBtn.textContent = cellCursor ? "cell" : "crosshair";
    curBtn.title = cellCursor
      ? "the outlined cell is the pointer \u2014 press for the crosshair back"
      : "the system crosshair \u2014 press to let the outlined cell be the pointer, "
        + "which shows which square you are actually on";
    curBtn.classList.toggle("on", cellCursor);
    syncCursor();
    /*  Only while the tool that makes them is up. A guide is not a setting you
        keep an eye on, it is something you are either placing or not. */
    guideBar.hidden = tool !== "guide";
    scaleBar.hidden = !isPlace();
    syncBack();
    //  Which recording these buttons are talking about changes with the slot.
    syncRec();
    axesBtn.classList.toggle("on", axesOn);
    linkBtn.classList.toggle("on", linked);
    eraseBtn.classList.toggle("on", pen === -1);

    /*  A swatch shows what the slot BECOMES this century, not the marker
        color stored in the file. Nobody should have to look at magenta to
        know they are painting a coat. */
    penBtns.forEach((b, i) => {
      b.hidden = false;
      b.classList.toggle("on", pen === i);
    });
    recentBtns.forEach((b, i) => {
      const c = RECENT[i];
      b.hidden = !c;
      if (!c) return;
      b.style.background = c;
      b.title = c + " \u2014 used recently";
      b.classList.toggle("on", pen === -2 && fixed.value.toLowerCase() === c.toLowerCase());
    });

    const g = grid.getContext("2d");
    g.imageSmoothingEnabled = false;
    g.clearRect(0, 0, grid.width, grid.height);
    // cols is worked out above, with the swatches — the canvas and the pens
