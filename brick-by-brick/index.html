    map -- the data should be the figure, the basemap the ground. */
function basemapStyle() {
  const OCEAN = "#0d1317", LAND = "#1b2126", COAST = "#39434a",
        ADMIN0 = "#2f383f", ADMIN1 = "#252d33", LAKE = "#132029", RIVER = "#22303a";
  return {
    version: 8,
    glyphs: "https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
    sources: { basemap: { type: "vector", url: BASEMAP } },
    layers: [
      { id: "bg", type: "background", paint: { "background-color": OCEAN } },
      { id: "ocean", type: "fill", source: "basemap", "source-layer": "ocean",
        paint: { "fill-color": OCEAN } },
      { id: "land", type: "fill", source: "basemap", "source-layer": "coastline_land",
        paint: { "fill-color": LAND } },
      { id: "lakes", type: "fill", source: "basemap", "source-layer": "ne_10m_lakes",
        paint: { "fill-color": LAKE } },
      { id: "rivers", type: "line", source: "basemap",
        "source-layer": "ne_10m_rivers_lake_centerlines",
        paint: { "line-color": RIVER, "line-width": ["interpolate", ["linear"], ["zoom"], 3, 0.3, 9, 1.1] } },
      { id: "admin1", type: "line", source: "basemap", "source-layer": "admin1_land",
        paint: { "line-color": ADMIN1, "line-width": 0.5 } },
      { id: "admin0", type: "line", source: "basemap", "source-layer": "admin0_land",
        paint: { "line-color": ADMIN0, "line-width": 0.8 } },
      { id: "coast", type: "line", source: "basemap", "source-layer": "coastline_land",
        paint: { "line-color": COAST, "line-width": ["interpolate", ["linear"], ["zoom"], 2, 0.4, 9, 1.2] } },
    ],
  };
}

// Places in the current view that can actually be drawn.
function placeFeatures(model) {
  return (model.places || []).filter(p => p.coords).map(p => ({
    type: "Feature",
    geometry: { type: "Point", coordinates: [p.coords.lng, p.coords.lat] },
    properties: {
      slug: p.slug, name: p.name,
      status: p.status || "draft",
      refs: p.refs,
      detail: p.detail || "",
      labelPos: LABEL_POS.get(p.slug) || "",   // "" = follow the map default
      icon: MARKER_ICON.get(p.slug) || "",     // "" = the plain status dot
    },
  }));
}

function renderMap(model, host) {
  const fc = { type: "FeatureCollection", features: placeFeatures(model) };

  // Already running: just push new data in. This is the whole reason a slot
  // owns its element.
  if (host._map) {
    if (host._syncMarkers) host._syncMarkers();
    else updateMapCount(host, fc.features.length, model);
    return;
  }
  if (host._starting) return;
  host._starting = true;

  host.innerHTML = '<div class="map-shell">' +
      '<div class="map-canvas"></div>' +

      '<div class="map-note">loading basemap…</div>' +
      '<div class="map-attrib"></div>' +
    "</div>";
  const canvas = host.querySelector(".map-canvas");
  const note = host.querySelector(".map-note");

  const attribEl = host.querySelector(".map-attrib");

  const hosted = isHostedContext();
  // Always load pmtiles, not just when hosted -- the dropdown lets you TRY the
  // custom source from anywhere (e.g. picking "Your tiles" while opened from
  // file://), not only in whatever context happened to be guessed at start.
  const toLoad = [loadOnce(MAPLIBRE_CSS, true), loadOnce(MAPLIBRE_JS), loadOnce(PMTILES_JS)];

  Promise.all(toLoad)
    .then(() => {
      // One protocol registration per page, not per panel.
      if (!window.__pmtilesReady) {
        const protocol = new window.pmtiles.Protocol();
        window.maplibregl.addProtocol("pmtiles", protocol.tile);
        window.__pmtilesReady = true;
      }
      const map = new window.maplibregl.Map({
        container: canvas,
        style: hosted ? basemapStyle() : DEMO_STYLE,
        center: [-3.4, 56.4],
        zoom: 7,
        attributionControl: false,
        // Default false clears the WebGL buffer right after each paint, which
        // is invisible to the eye but means any screenshot/screen-recording
        // tool grabs a blank frame even though the map is drawing correctly.
        preserveDrawingBuffer: true,
      });
      host._map = map;
      map.addControl(new window.maplibregl.NavigationControl({ showCompass: false }), "top-right");

      // 'style.load' fires after the INITIAL style AND after any later
      // setStyle() call, so the same function adds the places layers whether
      // this is the first load or a fallback swap — one place, not two.
      //
      // Recomputed HERE rather than using the `fc` closed over when renderMap
      // was first called: script loading (MapLibre + PMTiles, ~1-2s) means an
      // edit made in the Gazetteer panel while the map is still starting hits
      // the "still starting, do nothing" branch below and would otherwise be
      // silently lost — the map would open already stale, with no further
      // update due until some unrelated later edit happened to trigger one.
      /*  DOM markers, not a GeoJSON source with circle layers.

          The source approach kept failing in ways that were slow to see: the
          data went in (`_data` held the feature) but MapLibre never tiled it,
          so `querySourceFeatures` returned 0 and nothing drew. setStyle() also
          wipes sources and layers, so every basemap switch needed them rebuilt,
          and 'style.load' does not fire reliably across quick successive swaps.

          A Marker is a plain DOM element positioned by the map. It survives
          setStyle untouched, needs no source, no tiling and no style to be
          loaded, and appears the instant it is added. For a few dozen places
          that is strictly better, and it removes the whole class of bug. */
      let placesReady = true;
      host._markers = [];
      // Declared ABOVE syncMarkers, which reads it — a `let` further down would
      // work on the first call and throw on every one after.
      // The default a place falls back to; per-place overrides live in the
      // Gazetteer, which is where the rest of a place's display settings are.
      const labelPlacement = "bottom";

      const syncMarkers = () => {
        const feats = placeFeatures(V());
        for (const m of host._markers) m.remove();
        host._markers = [];
        for (const f of feats) {
          const elDot = document.createElement("div");
          const glyph = f.properties.icon;
          elDot.className = "map-marker" + (glyph ? " as-icon" : "") +
                            (f.properties.status === "verified" ? " verified" : "");
          if (glyph) elDot.dataset.glyph = glyph;
          elDot.title = f.properties.name + (f.properties.detail ? " — " + f.properties.detail : "");
          elDot.onclick = ev => { ev.stopPropagation(); focusEntity(f.properties.slug); };

          const label = document.createElement("span");
          label.className = "map-marker-label";
          elDot.classList.add("lbl-" + (f.properties.labelPos || labelPlacement));
          label.textContent = f.properties.name;
          elDot.appendChild(label);

          host._markers.push(
            new window.maplibregl.Marker({ element: elDot })
              .setLngLat(f.geometry.coordinates)
              .addTo(map)
          );
        }
        updateMapCount(host, feats.length, V());
        return feats.length;
      };

      host._syncMarkers = syncMarkers;
      host._ensurePlaces = syncMarkers;   // same job, kept for existing callers
      syncMarkers();
      // Markers survive a style swap, so this only refreshes the count/note.
      map.on("style.load", () => { if (!usingFallback) note.hidden = true; });

      /*  tiles.mbricknell.com currently sends no CORS header at all, so the
          custom basemap fails from any origin, including the real hosted site
          -- not just this environment. "auto" is the self-healing default:
          try the custom tiles, and on the first failure swap to MapLibre's
          public style automatically. "custom"/"demo" are explicit choices
          from the dropdown -- once you have picked one, an error there is
          just reported, never silently overridden again. */
      /*  Credit belongs to whatever is actually drawing, not to the map widget.
          Natural Earth is public domain and asks for nothing; the demo style
          carries OpenStreetMap data, which is ODbL and does require credit.
          Attributing both at all times would be wrong in one direction or the
          other, so it follows the source. */
      /*  Read off the archive's own tippecanoe command, not assumed: the land
          and both admin levels (admin0_land, admin1_land, coastline_land) are
          geoBoundaries CGAZ; the lakes, rivers and geographic lines are the
          ne_* layers, Natural Earth. Crediting only one of them was wrong. */
      const ATTRIB = {
        custom: "geoBoundaries · Natural Earth",
        demo: "© OpenStreetMap contributors",
      };
      const showAttrib = () => {
        const text = ATTRIB[usingFallback ? "demo" : "custom"] || "";
        attribEl.textContent = text;
        attribEl.hidden = !text;
      };

      let sourceMode = hosted ? "auto" : "demo";
      let usingFallback = !hosted;   // true once DEMO_STYLE is what's actually showing

      function setSource(mode, { silent } = {}) {
        sourceMode = mode;
        usingFallback = mode === "demo";
        if (!silent) note.hidden = true;
        map.setStyle(mode === "demo" ? DEMO_STYLE : basemapStyle());
        showAttrib();
      }

      showAttrib();

      map.on("error", ev => {
        const msg = (ev && ev.error && ev.error.message) || "unknown";
        if (sourceMode === "auto" && !usingFallback && !placesReady) {
          usingFallback = true;
          map.setStyle(DEMO_STYLE);
          showAttrib();
          note.hidden = false;
          note.textContent = "Using the default MapLibre basemap — tiles.mbricknell.com did not respond.";
          return;
        }
        if (usingFallback) return;   // already on the fallback; a further tile error there is not worth reporting
        note.hidden = false;
        note.textContent = /fetch/i.test(msg)
          ? "Could not reach tiles.mbricknell.com — check the connection."
          : "map error: " + msg;
      });

      /*  Observe the SHELL and the panel, not the canvas. `.map-canvas` is
          absolutely positioned and MapLibre sets its pixel size itself, so
          watching it meant growing the tile never triggered a resize — the map
          kept the height it had at startup. The shell is the element that
          actually tracks the panel's box. */
      if (window.ResizeObserver) {
        const ro = new ResizeObserver(() => map.resize());
        ro.observe(host.querySelector(".map-shell"));
        ro.observe(host);
      }
      // Same trap as the document canvas: a tile built while its column has no
      // real width would otherwise leave MapLibre sized against zero forever.
      requestAnimationFrame(() => map.resize());
    })
    .catch(err => {
      host._starting = false;
      note.hidden = false;
      note.textContent = "The map needs a connection — " + err.message;
    });
}

function fitToPlaces(map, fc) {
  if (!fc.features.length) return;
  const b = new window.maplibregl.LngLatBounds();
  for (const f of fc.features) b.extend(f.geometry.coordinates);
  map.fitBounds(b, { padding: 40, maxZoom: 9, duration: 0 });
}

function updateMapCount(host, shown, model) {
  const note = host.querySelector(".map-note");
  if (!note) return;
  const total = (model.all || model).places.filter(p => p.coords).length;
  if (shown) { note.hidden = true; return; }
  note.hidden = false;
  note.textContent = total
    ? "No places in view — the filter is hiding all " + total + "."
    : "No place bricks carry coordinates yet.";
}

/* --------------------------------------------------------------------------
   THE BOARD
   -------------------------------------------------------------------------- */
const DEFAULT_BOARD = {
  cols: 4, rowUnit: 220,
  tiles: [
    { id: "builder",        x: 0, y: 0, w: 1, h: 2 },
    { id: "pallet",         x: 1, y: 0, w: 1, h: 2 },
    { id: "classification", x: 2, y: 0, w: 1, h: 2 },
    { id: "gazetteer",      x: 3, y: 0, w: 1, h: 1 },
    { id: "count",          x: 3, y: 1, w: 1, h: 1 },
    { id: "filter",         x: 0, y: 2, w: 1, h: 1 },
    { id: "entities",       x: 1, y: 2, w: 2, h: 1 },
    { id: "notes",          x: 3, y: 2, w: 1, h: 1 },
    { id: "document",       x: 0, y: 3, w: 1, h: 2 },
    { id: "viz-map",        x: 1, y: 3, w: 3, h: 2 },
    { id: "timeline",       x: 0, y: 5, w: 4, h: 1 },
    { id: "reference",      x: 0, y: 6, w: 4, h: 1 },
  ],
};

let board = JSON.parse(JSON.stringify(DEFAULT_BOARD));

const boardEl = () => el("board");
const ghostEl = () => el("boardGhost");

function loadBoard() {
  let raw;
  try { raw = JSON.parse(localStorage.getItem(BOARD_KEY) || "null"); } catch (e) { raw = null; }
  if (!raw || typeof raw !== "object") return;
  const cols = Math.max(1, Math.min(12, Math.round(raw.cols) || 4));
  const rowUnit = Math.max(80, Math.min(600, Math.round(raw.rowUnit) || 220));
  const seen = new Set(), tiles = [];
  for (const t of Array.isArray(raw.tiles) ? raw.tiles : []) {
    if (!t || !FOOTPRINTS[t.id] || seen.has(t.id)) continue;
    const w = Math.max(1, Math.min(cols, Math.round(t.w) || FOOTPRINTS[t.id].w));
    const h = Math.max(1, Math.round(t.h) || FOOTPRINTS[t.id].h);
    const x = Math.max(0, Math.min(cols - w, Math.round(t.x) || 0));
    const y = Math.max(0, Math.round(t.y) || 0);
    // A corrupt board degrades to a partial one: an overlap is dropped rather
    // than repaired, never left to render on top of another tile.
    if (tiles.some(o => x < o.x + o.w && x + w > o.x && y < o.y + o.h && y + h > o.y)) continue;
    seen.add(t.id);
    tiles.push({ id: t.id, x, y, w, h });
  }
  board = { cols, rowUnit, tiles };
}

function saveBoard() {
  try { localStorage.setItem(BOARD_KEY, JSON.stringify(board)); } catch (e) { /* unavailable */ }
}
function saveFootprints() {
  try {
    const out = {};
    for (const id in FOOTPRINTS) out[id] = { w: FOOTPRINTS[id].w, h: FOOTPRINTS[id].h };
    localStorage.setItem(FOOTPRINT_KEY, JSON.stringify(out));
  } catch (e) { /* unavailable */ }
}
function loadFootprints() {
  let raw;
  try { raw = JSON.parse(localStorage.getItem(FOOTPRINT_KEY) || "null"); } catch (e) { return; }
  if (!raw) return;
  for (const id in raw) {
    if (!FOOTPRINTS[id]) continue;
    FOOTPRINTS[id].w = Math.max(1, Math.min(12, Math.round(raw[id].w) || FOOTPRINTS[id].w));
    FOOTPRINTS[id].h = Math.max(1, Math.min(12, Math.round(raw[id].h) || FOOTPRINTS[id].h));
  }
}

function isOnBoard(id) { return board.tiles.some(t => t.id === id); }
function boardRows() { return board.tiles.reduce((m, t) => Math.max(m, t.y + t.h), 0) + 2; }
function overlaps(a, x, y, w, h) {
  return board.tiles.some(t => t !== a && x < t.x + t.w && x + w > t.x && y < t.y + t.h && y + h > t.y);
}

/* Cols shrinking can strand a tile past the new edge. Repacked in reading order
   with a simple skyline scan — first free slot wins — rather than trying to
   preserve exact positions that no longer fit. Only on an explicit column
   change, never on an ordinary drop. */
function repackForCols(cols) {
  const ordered = [...board.tiles].sort((a, b) => a.y - b.y || a.x - b.x);
  const placed = [];
  for (const t of ordered) {
    const w = Math.min(t.w, cols);
    let x = 0, y = 0;
    outer:
    for (y = 0; y < 999; y++) {
      for (x = 0; x <= cols - w; x++) {
        if (!placed.some(o => x < o.x + o.w && x + w > o.x && y < o.y + o.h && y + t.h > o.y)) break outer;
      }
    }
    placed.push({ id: t.id, x, y, w, h: t.h });
  }
  board.tiles = placed;
}

// Builds the panel element once; afterwards it is moved between tiles and the
// store, never rebuilt, so an off-board panel keeps its scroll and its input.
function buildPanel(def) {
  let node = document.getElementById(def.id);
  if (node) return node;

  node = document.createElement("section");
  node.className = "panel";
  node.id = def.id;

  const head = document.createElement("div");
  head.className = "panel-head";
  head.innerHTML =
    '<span class="panel-head-lead">' +
      '<span class="drag-handle" title="drag to move this tile">\u2725</span>' +
      "<h2>" + esc(def.title) + "</h2>" +
      // After the title: the name identifies the panel, the role annotates it.
      (def.roles || ["read"]).map(r =>
        '<span class="role-badge role-' + r + '">' + ROLES[r].badge + "</span>").join("") +
    "</span>" +
    // Panel-declared controls share the header row with the × rather than
    // costing the body a bar of its own.
    (def.headButtons || []).map(b =>
      '<button class="panel-head-btn" data-act="' + b.act + '"' +
      (b.hidden ? " hidden" : "") + ' title="' + esc(b.title) + '">' +
      b.label + "</button>").join("");
  node.appendChild(head);

  const body = document.createElement("div");
  body.className = "panel-body";
  // A panel whose template is missing must fail as one broken tile, not as a
  // blank page — the board is the only way back to everything else.
  if (def.tpl) {
    const tpl = el(def.tpl);
    if (tpl) body.appendChild(tpl.content.cloneNode(true));
    else body.innerHTML = '<p class="hint" style="color:var(--bad)">missing template “' + esc(def.tpl) + '”</p>';
  }
  node.appendChild(body);

  // Header buttons sit outside .panel-body, so the body-scoped wiring below
  // cannot see them; route them through the same action handler.
  head.querySelectorAll(".panel-head-btn").forEach(btn => {
    btn.onclick = () => {
      if (def.id === "pallet") palletAction(btn.dataset.act, body.querySelector("textarea"));
      else if (btn.dataset.act === "gazmenu") {
        const menu = body.querySelector('[data-el="menu"]');
        menu.hidden = !menu.hidden;
        btn.classList.toggle("on", !menu.hidden);
      }
    };
  });

  wirePanelBody(def, body);
  return node;
}

// Body wiring that must survive re-renders lives here, once per panel.
function wirePanelBody(def, body) {
  if (def.id === "pallet") {
    const ta = body.querySelector('[data-el="text"]');
    ta.addEventListener("input", e => { state.text = e.target.value; saveText(); update(); });
    body.querySelectorAll("button[data-act]").forEach(b => { b.onclick = () => palletAction(b.dataset.act, ta); });
    // Actions close the menu behind them; it is a menu, not a toolbar.
    body.querySelectorAll('.pallet-menu button[data-act]').forEach(b => {
      b.addEventListener("click", () => {
        body.querySelector('[data-el="menu"]').hidden = true;
        const mb = document.querySelector('#pallet .panel-head-btn[data-act="menu"]');
        if (mb) mb.classList.remove("on");
      });
    });
    wireFolderDrop(body);
  }
}

function renderBoardCells() {
  const b = boardEl();
  [...b.querySelectorAll(".board-cell")].forEach(c => c.remove());
  const rows = boardRows();
  const frag = document.createDocumentFragment();
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < board.cols; x++) {
      const cell = document.createElement("div");
      cell.className = "board-cell";
      cell.style.gridColumn = (x + 1) + " / span 1";
      cell.style.gridRow = (y + 1) + " / span 1";
      cell.textContent = "+";
      cell.title = "open the panel list";
      cell.addEventListener("click", () => el("boardFlyoutWrap").classList.add("open"));
      frag.appendChild(cell);
    }
  }
  b.insertBefore(frag, b.firstChild);
}

function renderBoardTiles() {
  const b = boardEl();
  /* Every placed panel is looked up BEFORE any wrapper is torn down. .remove()
     detaches the wrapper and the panel living inside it in the same call — a
     detached node is invisible to getElementById even though the object is
     still alive — so looking a panel up afterwards silently loses it on every
     render past the first. */
  const nodes = new Map(board.tiles.map(t => [t.id, document.getElementById(t.id) || buildPanel(panels.get(t.id))]));
  [...b.querySelectorAll(".board-tile")].forEach(t => t.remove());
  b.style.setProperty("--board-cols", board.cols);
  b.style.setProperty("--board-row", board.rowUnit + "px");

  /*  Appended in visual order (top row first, then left to right), not in the
      order the array happens to hold. Tiles all share z-index:1, so DOM order
      decides who paints over whom — and a cartouche overhangs UP into the tile
      above it, which must therefore already be on the page. Out of order, the
      label of a lower tile was painted over by its upper neighbour. */
  const painted = [...board.tiles].sort((a, c) => a.y - c.y || a.x - c.x);
  for (const t of painted) {
    const panel = nodes.get(t.id);
    if (!panel) continue;
    const wrap = document.createElement("div");
    wrap.className = "board-tile";
    wrap.dataset.id = t.id;
    wrap.style.gridColumn = (t.x + 1) + " / span " + t.w;
    wrap.style.gridRow = (t.y + 1) + " / span " + t.h;

    // Reused across re-renders rather than recreated — the panel-head survives
    // (only the wrapper is torn down), so appending a fresh button every render
    // would pile up duplicates.
    let rm = panel.querySelector(".panel-head > .tile-remove");
    if (!rm) {
      rm = document.createElement("button");
      rm.type = "button"; rm.className = "tile-remove"; rm.title = "remove from board";
      rm.textContent = "✕";
      rm.addEventListener("click", e => { e.stopPropagation(); removeTile(t.id); });
      panel.querySelector(".panel-head").appendChild(rm);
    }
    wrap.appendChild(panel);
    appendTileResize(wrap, t, "w", t.x + t.w < board.cols && !overlaps(t, t.x + t.w, t.y, 1, t.h));
    appendTileResize(wrap, t, "h", !overlaps(t, t.x, t.y + t.h, t.w, 1));
    b.appendChild(wrap);
  }
}

// Only the legal buttons — a "+" never appears toward an occupied neighbour or
// past the board edge.
function appendTileResize(wrap, t, dim, canGrow) {
  const canShrink = (dim === "w" ? t.w : t.h) > 1;
  if (!canGrow && !canShrink) return;
  const box = document.createElement("div");
  box.className = "tile-resize tile-resize-" + dim;
  const mk = (label, delta, title) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label; b.title = title;
    b.addEventListener("click", e => { e.stopPropagation(); resizeTile(t.id, dim, delta); });
    box.appendChild(b);
  };
  if (canGrow) mk("+", 1, dim === "w" ? "widen by one column" : "taller by one row");
  if (canShrink) mk("−", -1, dim === "w" ? "narrow by one column" : "shorter by one row");
  wrap.appendChild(box);
}

function resizeTile(id, dim, delta) {
  const t = board.tiles.find(k => k.id === id);
  if (!t) return;
  if (dim === "w") {
    const nw = t.w + delta;
    if (nw < 1) return;
    if (delta > 0 && (t.x + nw > board.cols || overlaps(t, t.x + t.w, t.y, delta, t.h))) return;
    t.w = nw;
  } else {
    const nh = t.h + delta;
    if (nh < 1) return;
    if (delta > 0 && overlaps(t, t.x, t.y + t.h, t.w, delta)) return;
    t.h = nh;
  }
  renderBoard(); saveBoard();
}

function renderBoard() {
  renderBoardCells();
  renderBoardTiles();
  const b = boardEl();
  const empty = b.querySelector(".board-empty");
  if (!board.tiles.length) {
    if (!empty) {
      const d = document.createElement("div");
      d.className = "board-empty";
      d.textContent = "Empty board — open Panels and drag one in.";
      b.appendChild(d);
    }
  } else if (empty) empty.remove();
  refreshAll();
}

function renderBoardCardList() {
  const list = el("boardCardList");
  const q = el("boardSearch").value.trim().toLowerCase();
  const available = Object.keys(FOOTPRINTS).filter(id => !isOnBoard(id));
  list.innerHTML = "";
  let shown = 0;

  // Grouped by what a panel does to state, which is a fact about it, rather
  // than by the ad-hoc labels the list used before.
  for (const group of ROLE_ORDER) {
    const ids = available.filter(id => (FOOTPRINTS[id].role || "read") === group.role);
    const visible = q ? ids.filter(id => FOOTPRINTS[id].name.toLowerCase().includes(q)) : ids;
    if (!visible.length) continue;
    const heading = document.createElement("h4");
    heading.className = "board-group-heading";
    heading.textContent = group.title;
    list.appendChild(heading);

    for (const id of visible) {
      const fp = FOOTPRINTS[id];
      const card = document.createElement("div");
      card.className = "board-card";
      card.draggable = true;
      card.dataset.id = id;
      card.innerHTML =
        '<div class="board-card-row">' +
          '<button type="button" class="fp-add" title="add to board">+</button>' +
          '<span class="board-card-name">' + esc(fp.name) + "</span>" +
          '<span class="fp">' +
            '<input type="number" class="fp-w" min="1" max="12" step="1" value="' + fp.w + '" title="width (cells)">' +
            "<span>&times;</span>" +
            '<input type="number" class="fp-h" min="1" max="12" step="1" value="' + fp.h + '" title="height (cells)">' +
          "</span>" +
        "</div>" +
        '<div class="board-card-desc">' + esc(fp.desc || "") + "</div>";

      const wIn = card.querySelector(".fp-w"), hIn = card.querySelector(".fp-h");
      [wIn, hIn].forEach(i => i.addEventListener("mousedown", e => e.stopPropagation()));
      wIn.addEventListener("change", () => { fp.w = Math.max(1, Math.min(12, parseInt(wIn.value, 10) || 1)); wIn.value = fp.w; saveFootprints(); });
      hIn.addEventListener("change", () => { fp.h = Math.max(1, Math.min(12, parseInt(hIn.value, 10) || 1)); hIn.value = fp.h; saveFootprints(); });

      const add = card.querySelector(".fp-add");
      add.addEventListener("mousedown", e => e.stopPropagation());
      add.addEventListener("click", e => {
        e.stopPropagation();
        const slot = findFreeSlot(fp.w, fp.h);
        addTile(id, slot.x, slot.y, fp.w, fp.h);
      });
      list.appendChild(card);
      shown++;
    }
  }
  if (!shown) {
    const none = document.createElement("div");
    none.className = "board-card";
    none.style.cursor = "default";
    none.textContent = board.tiles.length ? "everything is on the board" : "no match";
    list.appendChild(none);
  }
}

function addTile(id, x, y, w, h) {
  const fp = FOOTPRINTS[id];
  if (!fp) return;
  board.tiles.push({ id, x, y, w: Math.min(w || fp.w, board.cols), h: h || fp.h });
  renderBoard(); renderBoardCardList(); saveBoard();
}

function findFreeSlot(w, h) {
  const cw = Math.min(w, board.cols);
  for (let y = 0; y < 999; y++) {
    for (let x = 0; x <= board.cols - cw; x++) {
      if (!overlaps(null, x, y, cw, h)) return { x, y };
    }
  }
  return { x: 0, y: 0 };
}

function moveTile(id, x, y) {
  const t = board.tiles.find(k => k.id === id);
  if (!t) return;
  t.x = x; t.y = y;
  renderBoard(); saveBoard();
}

/* Two tiles of identical footprint exchange positions. Same size is the whole
   condition: neither can then overlap anything the other did not, so the
   exchange needs no repack and can never half-fail. */
function swapTiles(idA, idB) {
  const a = board.tiles.find(k => k.id === idA);
  const b = board.tiles.find(k => k.id === idB);
  if (!a || !b || a === b || a.w !== b.w || a.h !== b.h) return;
  const x = a.x, y = a.y;
  a.x = b.x; a.y = b.y;
  b.x = x;   b.y = y;
  renderBoard(); saveBoard();
}

function removeTile(id) {
  board.tiles = board.tiles.filter(t => t.id !== id);
  // Park the panel rather than destroying it, so its scroll and typed text
  // survive a trip off the board.
  const panel = document.getElementById(id);
  if (panel) {
    const rm = panel.querySelector(".panel-head > .tile-remove");
    if (rm) rm.remove();
    el("panelStore").appendChild(panel);
  }
  renderBoard(); renderBoardCardList(); saveBoard();
}

function resetBoard() {
  board = JSON.parse(JSON.stringify(DEFAULT_BOARD));
  renderBoard(); renderBoardCardList(); saveBoard();
}

/* ---------- drag: card -> board, and tile -> board ---------- */
let boardDrag = null;

function boardCellUnderPoint(clientX, clientY) {
  const b = boardEl();
  const r = b.getBoundingClientRect();
  const gap = parseFloat(getComputedStyle(b).columnGap) || 14;
  const cellW = (r.width - gap * (board.cols - 1)) / board.cols;
  const cellH = board.rowUnit;
  return { x: Math.floor((clientX - r.left) / (cellW + gap)),
           y: Math.floor((clientY - r.top) / (cellH + gap)) };
}

function tileAtCell(x, y) {
  return board.tiles.find(t => x >= t.x && x < t.x + t.w && y >= t.y && y < t.y + t.h) || null;
}

function updateGhost(clientX, clientY) {
  if (!boardDrag) return;
  const { x, y } = boardCellUnderPoint(clientX, clientY);

  /*  Dragging one tile onto another of the same footprint swaps them, instead
      of being refused as an overlap. Only ever offered for a tile already on
      the board — a card from the flyout has nowhere to send the displaced tile
      back to. Different sizes still refuse: an unequal exchange would have to
      shove a third tile somewhere, and a drop should do exactly what its ghost
      showed. */
  const under = boardDrag.fromTile ? tileAtCell(x, y) : null;
  const swap = under && under !== boardDrag.fromTile &&
               under.w === boardDrag.w && under.h === boardDrag.h ? under : null;

  const cx = swap ? swap.x : Math.max(0, Math.min(board.cols - boardDrag.w, x));
  const cy = swap ? swap.y : Math.max(0, y);
  const bad = !swap &&
              (x < 0 || x > board.cols - boardDrag.w || y < 0 ||
               overlaps(boardDrag.fromTile || null, cx, cy, boardDrag.w, boardDrag.h));
  const g = ghostEl();
  g.hidden = false;
  g.classList.toggle("invalid", bad);
  g.classList.toggle("swap", !!swap);
  g.style.gridColumn = (cx + 1) + " / span " + boardDrag.w;
  g.style.gridRow = (cy + 1) + " / span " + boardDrag.h;
  // The ghost marks where the dragged tile lands; the outline marks the tile
  // being sent the other way, so both halves of the exchange are visible.
  boardEl().querySelectorAll(".board-tile.swap-target")
    .forEach(n => n.classList.remove("swap-target"));
  if (swap) {
    const node = boardEl().querySelector('.board-tile[data-id="' + swap.id + '"]');
    if (node) node.classList.add("swap-target");
  }
  boardDrag.valid = !bad; boardDrag.cx = cx; boardDrag.cy = cy;
  boardDrag.swapWith = swap ? swap.id : null;
}

function endBoardDrag(commit) {
  if (boardDrag && commit && boardDrag.valid) {
    if (boardDrag.swapWith) swapTiles(boardDrag.id, boardDrag.swapWith);
    else if (boardDrag.fromTile) moveTile(boardDrag.id, boardDrag.cx, boardDrag.cy);
    else addTile(boardDrag.id, boardDrag.cx, boardDrag.cy, boardDrag.w, boardDrag.h);
  }
  ghostEl().hidden = true;
  document.querySelectorAll(".board-card.dragging, .board-tile.dragging, .board-tile.swap-target")
    .forEach(n => n.classList.remove("dragging", "swap-target"));
  boardDrag = null;
}

/* --------------------------------------------------------------------------
   PANEL BODIES
   -------------------------------------------------------------------------- */

function renderSlotBody(slot, host) {
  /*  A renderer OWNS its element. It is called again on every model change, so
      it must update what is there rather than assume an empty element — a map
      or a canvas cannot be rebuilt sixty times while you type. Only the empty
      placeholder clears the host. */
  if (typeof slot.render === "function") {
    try { slot.render(V(), host); }
    catch (err) {
      // One bad renderer must not take the page down with it.
      host.innerHTML = '<p class="hint" style="color:var(--bad)">Slot “' + esc(slot.id) +
        "” threw: " + esc((err && err.message) || err) + "</p>";
    }
    return;
  }
  const m = V();
  if (!m) return;
  host.innerHTML = "";
  host.innerHTML =
    '<div class="slot-empty">' +
      '<div class="slot-desc">' + esc(slot.description) + "</div>" +
      '<div class="feed">This tile would receive:<br>' +
        "<b>" + m.stats.bricks + "</b> records &middot; <b>" + m.people.length + "</b> people &middot; " +
        "<b>" + m.places.length + "</b> places &middot; <b>" + m.events.length + "</b> events &middot; " +
        "<b>" + m.documents.length + "</b> documents &middot; <b>" + m.census.length + "</b> census<br>" +
        "<b>" + m.entities.length + "</b> entities (" + m.stats.ghosts + " ghost) &middot; " +
        "<b>" + m.edges.length + "</b> edges" +
      "</div>" +
      '<div class="slot-note">Fill this slot:<br><br>' +
        "<code>Brick.viz.register(&quot;" + esc(slot.id) + "&quot;, {<br>" +
        "&nbsp;&nbsp;emoji: &quot;" + slot.emoji + "&quot;, label: &quot;" + esc(slot.label) + "&quot;,<br>" +
        "&nbsp;&nbsp;render(model, el) { /* draw into el */ }<br>});</code><br><br>" +
        "The model is on <code>Brick.model</code>. A new id becomes a new card in the panel list." +
      "</div>" +
    "</div>";
}

/* ---------- filter ---------- */
// A filtered count that looks like a total is how people misread their own
// data, so any panel showing a subset says so.
function noteFiltered(host) {
  if (!host) return;
  const v = V();
  host.hidden = !v.active;
  host.textContent = v.active ? "filtered — " + v.stats.bricks + " of " + state.model.stats.bricks : "";
}

function setFilter(mutate) {
  mutate(state.filter);
  state.model.view = buildView(state.model);
  refreshAll();
  // The top bar is not a panel, so refreshAll() does not reach it — and the
  // Filter panel may not even be on the board.
  if (typeof syncSearchInputs === "function") syncSearchInputs();
}
function toggleIn(set, key) { set.has(key) ? set.delete(key) : set.add(key); }

function renderFilter(body) {
  if (!body.dataset.built) {
    body.dataset.built = "1";
    const t = body.querySelector('[data-el="text"]');
    t.addEventListener("input", () => setFilter(f => { f.text = t.value; }));
    body.querySelector('[data-act="clear"]').onclick = () => {
      body.querySelector('[data-el="text"]').value = "";
      setFilter(f => {
        f.text = ""; f.status = "all"; f.focus = null; f.types.clear(); f.sections.clear();
        f.time.on = false;
      });
    };
  }
  const f = state.filter, all = state.model, view = V();
  const chip = (label, on, attrs, count) =>
    "<button " + attrs + ' class="' + (on ? "on" : "") + '">' + label +
    (count !== undefined ? '<span class="count">' + count + "</span>" : "") + "</button>";

  // Confidence — the cut this whole project is about: what does the tree look
  // like if I only believe what is verified?
  body.querySelector('[data-el="status"]').innerHTML =
    chip("all", f.status === "all", 'data-status="all"') +
    chip("+ verified", f.status === "verified", 'data-status="verified"', all.stats.verified) +
    chip("− draft", f.status === "draft", 'data-status="draft"', all.stats.draft);

  // Emoji alone was not discoverable — the word goes on the chip, and only
  // drops off when the panel is too narrow to hold it.
  body.querySelector('[data-el="types"]').innerHTML = Object.keys(TYPES)
    .filter(k => all.byType[k])
    .map(k => chip(TYPES[k].icon + '<span class="lbl">' + esc(TYPES[k].label) + "</span>",
                   f.types.has(k), 'data-type="' + k + '" title="only ' + esc(TYPES[k].label) + ' bricks"', all.byType[k]))
    .join("");

  // The headings are whatever you decided they mean — a family, a place, a line
  // of thought. One mechanism, because it is all just text.
  const secs = all.sections.filter(Boolean);
  body.querySelector('[data-el="sectionlabel"]').textContent =
    secs.length ? "Your headings (" + secs.length + ")" : "Your headings — none yet";
  body.querySelector('[data-el="sections"]').innerHTML = secs.map(s => {
    const n = all.records.filter(b => b.section === s).length;
    const short = s.length > 26 ? s.slice(0, 25) + "…" : s;
    return chip(esc(short), f.sections.has(s), 'data-section="' + esc(s) + '" title="' + esc(s) + '"', n);
  }).join("");

  renderTimeFilter(body, all);

  const fw = body.querySelector('[data-el="focuswrap"]');
  fw.hidden = !f.focus;
  if (f.focus) {
    const e = all.entities.find(x => x.slug === f.focus);
    body.querySelector('[data-el="focus"]').innerHTML =
      chip((e ? esc(e.name) : esc(f.focus)) + " ✕", true, 'data-focus="clear"');
  }

  /*  The panel's own box is created once and then never re-read the state, so
      a search typed in the top bar left it stale and showing nothing. Push the
      value in on every render, skipping it while focused so it cannot fight
      what is being typed here. */
  const panelSearch = body.querySelector('[data-el="text"]');
  if (panelSearch && document.activeElement !== panelSearch &&
      panelSearch.value !== (state.filter.text || "")) {
    panelSearch.value = state.filter.text || "";
  }
  syncSearchInputs();

  const win = timeWindow(state.filter.time);
  body.querySelector('[data-el="summary"]').textContent = view.active
    ? view.stats.bricks + " of " + all.stats.bricks + " bricks · " +
      view.stats.entities + " of " + all.stats.entities + " entities" +
      (win ? " · " + win[0] + "–" + win[1] + " (undated kept)" : "")
    : "Showing everything — " + all.stats.bricks + " bricks.";

  body.querySelectorAll("[data-status]").forEach(b => b.onclick = () => setFilter(f2 => { f2.status = b.dataset.status; }));
  body.querySelectorAll("[data-type]").forEach(b => b.onclick = () => setFilter(f2 => toggleIn(f2.types, b.dataset.type)));
  body.querySelectorAll("[data-section]").forEach(b => b.onclick = () => setFilter(f2 => toggleIn(f2.sections, b.dataset.section)));
  body.querySelectorAll('[data-focus="clear"]').forEach(b => b.onclick = () => setFilter(f2 => { f2.focus = null; }));
}

// Focusing on a person shows every record that names them — their family as the
// records actually describe it, rather than as a tree asserts it.
/*  Three ways to ask a time question, because they are genuinely different
    questions: a decade ("the 1890s"), an explicit span ("1841 to 1861"), or a
    point with tolerance ("around 1869, give or take 5") — the last being the
    one that matches how an estimated birth year actually behaves. */
function renderTimeFilter(body, model) {
  const t = state.filter.time;
  const [lo, hi] = yearExtent(model);
  // Keep the stored values inside whatever the data actually spans.
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  t.min = clamp(t.min, lo, hi); t.max = clamp(t.max, lo, hi);
  if (t.min > t.max) t.min = t.max;
  t.year = clamp(t.year, lo, hi);
  t.decade = clamp(Math.floor(t.decade / 10) * 10, Math.floor(lo / 10) * 10, Math.floor(hi / 10) * 10);

  const modes = body.querySelector('[data-el="timemode"]');
  modes.innerHTML =
    '<button data-tmode="off" class="' + (t.on ? "" : "on") + '">off</button>' +
    '<button data-tmode="decade" class="' + (t.on && t.mode === "decade" ? "on" : "") + '">decade</button>' +
    '<button data-tmode="range" class="' + (t.on && t.mode === "range" ? "on" : "") + '">range</button>' +
    '<button data-tmode="around" class="' + (t.on && t.mode === "around" ? "on" : "") + '">± years</button>';
  modes.querySelectorAll("[data-tmode]").forEach(b => b.onclick = () => setFilter(f => {
    if (b.dataset.tmode === "off") f.time.on = false;
    else { f.time.on = true; f.time.mode = b.dataset.tmode; }
  }));

  const host = body.querySelector('[data-el="timebody"]');
  if (!t.on) { host.innerHTML = ""; return; }

  const slider = (key, min, max, step, label) =>
    '<div class="time-row"><span class="time-sub">' + label + "</span>" +
    '<input type="range" data-tkey="' + key + '" min="' + min + '" max="' + max +
    '" step="' + step + '" value="' + t[key] + '">' +
    '<span class="time-read" data-tread="' + key + '"></span></div>';

  if (t.mode === "decade") {
    host.innerHTML = slider("decade", Math.floor(lo / 10) * 10, Math.floor(hi / 10) * 10, 10, "");
  } else if (t.mode === "around") {
    host.innerHTML = slider("year", lo, hi, 1, "yr") + slider("span", 0, 50, 1, "±");
  } else {
    host.innerHTML = slider("min", lo, hi, 1, "from") + slider("max", lo, hi, 1, "to");
  }

  const readouts = () => {
    host.querySelectorAll("[data-tread]").forEach(el => {
      const k = el.dataset.tread;
      el.textContent = k === "decade" ? t.decade + "s" : k === "span" ? "±" + t.span : String(t[k]);
    });
  };
  readouts();

  host.querySelectorAll("[data-tkey]").forEach(inp => {
    // 'input' so the map and lists move as the slider moves, not on release.
    inp.addEventListener("input", () => {
      const k = inp.dataset.tkey;
      t[k] = Number(inp.value);
      // from/to must not cross over each other.
      if (k === "min" && t.min > t.max) t.max = t.min;
      if (k === "max" && t.max < t.min) t.min = t.max;
      readouts();
      state.model.view = buildView(state.model);
      refreshAllExcept("filter");
      pushPlacesToMap();
    });
  });
}

/*  Everything except the panel holding the control being dragged. Re-rendering
    the Filter panel mid-drag would replace the slider element under the
    pointer and the drag would stop dead. */
function refreshAllExcept(skipId) {
  for (const node of document.querySelectorAll(".board-tile > .panel")) {
    if (node.id !== skipId) refreshPanel(node.id);
  }
}

function focusEntity(slug) { setFilter(f => { f.focus = f.focus === slug ? null : slug; }); }

/* ---------- document viewer ----------
   One document, large: the scan on the left of your eye and what you wrote
   about it underneath, so the claim and its evidence are on screen together.

   Selection is by line number rather than by index, because the list of
   documents changes shape as you filter and an index would silently point at a
   different record. */
let selectedDoc = null;   // line number, never an index into a filtered list

/*  The scan on a canvas: wheel to zoom, drag to pan, Fit and 1:1.

    Same zoom-to-cursor arithmetic as the collage clipper —
    `pan = c - (z1/z0) * (c - pan)` keeps whatever is under the pointer
    pinned there while the scale changes, which is the whole difference
    between zooming and jumping.

    The buffer is sized in device pixels so a census page at 1:1 shows the
    ink, not a resampled blur — the entire reason for reading a scan at all. */
const docView = { img: null, natW: 0, natH: 0, zoom: 1, panX: 0, panY: 0, src: "", fitted: false };
// Sources (a thumbnail grid of every scan) was removed — the Document panel and
// its arrows are the only way to reach a scan now.

function docCanvasEls(body) {
  return { vp: body.querySelector('[data-el="viewport"]'), cv: body.querySelector('[data-el="canvas"]') };
}

function resizeDocCanvas(body) {
  const { vp, cv } = docCanvasEls(body);
  const dpr = window.devicePixelRatio || 1;
  const w = vp.clientWidth, h = vp.clientHeight;
  if (!w || !h) return false;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  return true;
}

function drawDoc(body) {
  const { cv } = docCanvasEls(body);
  const ctx = cv.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (!docView.img) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.translate(docView.panX, docView.panY);
  ctx.scale(docView.zoom, docView.zoom);
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(docView.img, 0, 0);
  const lab = body.querySelector('[data-el="zoomlabel"]');
  if (lab) lab.textContent = Math.round(docView.zoom * 100) + "%";
}

function fitDoc(body) {
  const { vp } = docCanvasEls(body);
  const vw = vp.clientWidth, vh = vp.clientHeight;
  if (!docView.img || !vw || !vh) { docView.zoom = 1; docView.panX = docView.panY = 0; return drawDoc(body); }
  // Never fit *up*: a small thumbnail blown out to fill the panel just looks
  // like a bad scan.
  docView.zoom = Math.min(vw / docView.natW, vh / docView.natH, 1) || 1;
  docView.panX = (vw - docView.natW * docView.zoom) / 2;
  docView.panY = (vh - docView.natH * docView.zoom) / 2;
  // A panel built while its tile has no width (off-screen, collapsed pane, a
  // hidden board) would fit against zero and keep that bogus scale forever.
  // Record whether this fit was real, so the resize observer can redo it.
  docView.fitted = vw > 0 && vh > 0;
  drawDoc(body);
}

function zoomDocBy(body, factor, ox, oy) {
  const { vp } = docCanvasEls(body);
  const cx = ox === undefined ? vp.clientWidth / 2 : ox;
  const cy = oy === undefined ? vp.clientHeight / 2 : oy;
  const z0 = docView.zoom;
  const z1 = Math.min(16, Math.max(0.05, z0 * factor));
  docView.panX = cx - (z1 / z0) * (cx - docView.panX);
  docView.panY = cy - (z1 / z0) * (cy - docView.panY);
  docView.zoom = z1;
  drawDoc(body);
}

function loadDocImage(body, src) {
  const overlay = body.querySelector('[data-el="overlay"]');
  if (docView.src === src) return;          // same scan; keep the reader's zoom
  docView.src = src;
  const url = resolveSrc(src);
  docView.img = null;
  if (!src) {
    overlay.hidden = false;
    overlay.className = "doc-overlay";
    overlay.textContent = "No scan attached. Add a URL or an image path to the brick and it appears here.";
    drawDoc(body);
    return;
  }
  overlay.hidden = false;
  overlay.className = "doc-overlay";
  overlay.textContent = "loading…";
  const img = new Image();
  // Deliberately NOT setting crossOrigin: it would make images fail to load
  // from any host without CORS headers, and nothing here reads pixels back.
  img.onload = () => {
    if (docView.src !== src) return;        // a faster click won the race
    docView.img = img;
    docView.natW = img.naturalWidth; docView.natH = img.naturalHeight;
    overlay.hidden = true;
    resizeDocCanvas(body);
    fitDoc(body);
  };
  img.onerror = () => {
    if (docView.src !== src) return;
    overlay.className = "doc-overlay bad";
    overlay.textContent = "Source will not load: " + src;
    drawDoc(body);
  };
  img.src = url;
}

function wireDocViewport(body) {
  const { vp } = docCanvasEls(body);

  vp.addEventListener("wheel", e => {
    if (!docView.img) return;
    e.preventDefault();
    const r = vp.getBoundingClientRect();
    zoomDocBy(body, e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });

  vp.addEventListener("pointerdown", e => {
    if (!docView.img || e.button !== 0) return;
    // The panel header drag moves the tile; this must not also start one.
    e.stopPropagation();
    vp.setPointerCapture(e.pointerId);
    vp.classList.add("panning");
    let lx = e.clientX, ly = e.clientY;
    const move = ev => {
      docView.panX += ev.clientX - lx;
      docView.panY += ev.clientY - ly;
      lx = ev.clientX; ly = ev.clientY;
      drawDoc(body);
    };
    const up = () => {
      vp.classList.remove("panning");
      vp.removeEventListener("pointermove", move);
      vp.removeEventListener("pointerup", up);
      vp.removeEventListener("pointercancel", up);
    };
    vp.addEventListener("pointermove", move);
    vp.addEventListener("pointerup", up);
    vp.addEventListener("pointercancel", up);
  });

  vp.addEventListener("dblclick", () => fitDoc(body));

  body.querySelector('[data-act="zoomin"]').onclick = () => zoomDocBy(body, 1.3);
  body.querySelector('[data-act="zoomout"]').onclick = () => zoomDocBy(body, 1 / 1.3);
  body.querySelector('[data-act="fit"]').onclick = () => fitDoc(body);
  body.querySelector('[data-act="actual"]').onclick = () => {
    const z0 = docView.zoom;
    zoomDocBy(body, 1 / z0);               // back to exactly 100%, about the centre
  };

  // The tile can be resized by a column or a row at any time; the buffer has to
  // follow or the scan goes soft.
  if (window.ResizeObserver) {
    new ResizeObserver(() => {
      if (!resizeDocCanvas(body)) return;
      // First time it has a real size, fit properly rather than redrawing a
      // scale that was computed against nothing.
      if (docView.img && !docView.fitted) fitDoc(body);
      else drawDoc(body);
    }).observe(vp);
  }
}

// The documents the viewer can step through — whatever the current filter left
// standing, so the viewer obeys the filter like every other panel.
function viewableDocs() {
  return V().records.filter(b => b.kind === "document" || safeSrc(b.src));
}

function selectDocument(lineNumber) {
  selectedDoc = lineNumber;
  const panel = document.getElementById("document");
  if (!panel || !panel.closest(".board-tile")) Brick.place("document");
  refreshPanel("document");
  const p = document.getElementById("document");
  if (p) p.scrollIntoView({ block: "nearest" });
}

function stepDocument(dir) {
  const docs = viewableDocs();
  if (!docs.length) return;
  const at = docs.findIndex(d => d.lineNumber === selectedDoc);
  const next = at === -1 ? 0 : (at + dir + docs.length) % docs.length;
  selectDocument(docs[next].lineNumber);
}

function renderDocument(body) {
  if (!body.dataset.built) {
    body.dataset.built = "1";
    body.querySelector('[data-act="prev"]').onclick = () => stepDocument(-1);
    body.querySelector('[data-act="next"]').onclick = () => stepDocument(1);
    wireDocViewport(body);
    resizeDocCanvas(body);
  }
  // ResizeObserver is the usual path, but its callbacks are throttled while the
  // page is not being painted (hidden tab, collapsed pane), so a panel built in
  // that state would keep a scale computed against zero width. Re-check on every
  // render too: cheap, and it does not depend on the observer having run.
  if (docView.img && !docView.fitted && resizeDocCanvas(body)) fitDoc(body);
  const docs = viewableDocs();
  const b = docs.find(d => d.lineNumber === selectedDoc) || docs[0] || null;
  const view = body.querySelector('[data-el="view"]');
  const openBtn = body.querySelector('[data-act="open"]');
  const editBtn = body.querySelector('[data-act="edit"]');

  if (!b) {
    body.querySelector('[data-el="pos"]').textContent = "";
    openBtn.hidden = editBtn.hidden = true;
    loadDocImage(body, "");
    body.querySelector('[data-el="overlay"]').textContent =
      "No documents in view." + (V().active ? " The filter may be hiding them." : "");
    view.innerHTML = "";
    return;
  }
  // Keep the selection honest: if the filter removed what was selected, the
  // viewer has moved on, and the position indicator must agree.
  selectedDoc = b.lineNumber;
  const at = docs.findIndex(d => d.lineNumber === b.lineNumber);
  body.querySelector('[data-el="pos"]').textContent = (at + 1) + " / " + docs.length;

  const src = safeSrc(b.src);
  openBtn.hidden = !src;
  openBtn.onclick = () => window.open(src, "_blank", "noopener,noreferrer");
  editBtn.hidden = false;
  editBtn.onclick = () => loadBrickIntoBuilder(b.lineNumber);

  view.innerHTML = "";

  // Only images go on the canvas. A PDF or a catalogue URL is still a source
  // worth recording — it just gets a link rather than a viewport.
  if (src && isImageSrc(src)) {
    loadDocImage(body, src);
  } else {
    loadDocImage(body, "");
    if (src) {
      const o = body.querySelector('[data-el="overlay"]');
      o.hidden = false;
      o.className = "doc-overlay";
      o.textContent = "Not an image — use “open ↗” for " + src;
    }
  }

  const raw = document.createElement("div");
  raw.className = "doc-raw" + (b.status === "draft" ? " draft" : "");
  raw.textContent = b.raw.trim();
  view.appendChild(raw);

  const meta = document.createElement("dl");
  meta.className = "doc-meta";
  const rows = [
    ["line", "L" + b.lineNumber],
    ["status", b.status === "verified" ? "+ verified" : "− draft"],
    ["kind", b.subtype ? (TYPES[b.subtype] ? TYPES[b.subtype].label : b.subtype) : TYPES[b.type].label],
    ["source", b.detail || b.text[0] || "— (no citation recorded)"],
    ["date", b.date || "—"],
    ["heading", b.section || "—"],
    ["cite as", b.alias ? "@" + b.alias.slug : "— (give it a uid to cite it)"],
  ];
  for (const [k, v] of rows) {
    const dt = document.createElement("dt"); dt.textContent = k;
    const dd = document.createElement("dd"); dd.textContent = v;
    meta.append(dt, dd);
  }
  // Where you got it, as a link you can actually follow back.
  if (safeSrc(b.url)) {
    const dt = document.createElement("dt"); dt.textContent = "source";
    const dd = document.createElement("dd");
    const a = document.createElement("a");
    a.href = safeSrc(b.url);
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.textContent = b.url.replace(/^https?:\/\//, "").slice(0, 60);
    a.style.color = "var(--accent2)";
    dd.appendChild(a);
    meta.append(dt, dd);
  }
  view.appendChild(meta);

  if (b.links.length) {
    const lab = document.createElement("dt");
    lab.className = "flt-label";
    lab.textContent = "names " + b.links.length + " " + (b.links.length === 1 ? "person" : "people");
    const names = document.createElement("div");
    names.className = "doc-names";
    for (const slug of b.links) {
      const e = state.model.entities.find(x => x.slug === slug);
      const btn = document.createElement("button");
      btn.textContent = e ? e.name : slug;
      if (e && !e.declared) {
        btn.classList.add("ghost");
        btn.title = "ghost — named here but never declared";
      } else btn.title = "show only records naming them";
      btn.onclick = () => focusEntity(slug);
      names.appendChild(btn);
    }
    view.append(lab, names);
  }
}

/* ---------- timeline panel ---------- */
function renderTimeline(body) {
  const model = V();
  const lanes = timelineLanes(model);
  const detail = body.querySelector('[data-el="detail"]');
  const scale = body.querySelector('[data-el="scale"]');
  const host = body.querySelector('[data-el="lanes"]');

  if (!lanes.length) {
    scale.innerHTML = "";
    host.innerHTML = '<div class="tl-empty">Nothing dated in view.</div>';
    return;
  }

  const years = lanes.flatMap(l => l.events.map(e => e.year));
  let lo = Math.min(...years), hi = Math.max(...years);
  // A single year would divide by zero; give it a nominal decade of room.
  if (lo === hi) { lo -= 5; hi += 5; }
  /*  Marks are positioned by their CENTRE, so a year at 0% or 100% would hang
      half outside the track and get clipped. Plot into an inset band instead
      of the full width, leaving room for the dot's radius at both ends. */
  const PAD = 6;   // percent of track width reserved at each end
  const pct = y => PAD + ((y - lo) / (hi - lo)) * (100 - PAD * 2);

  // Round ticks so the axis reads in whole decades rather than at whatever
  // years the data happens to start and end on.
  const step = Math.max(10, Math.ceil((hi - lo) / 5 / 10) * 10);
  let ticks = "";
  for (let y = Math.ceil(lo / step) * step; y <= hi; y += step) {
    ticks += '<span class="tl-tick" style="left:' + pct(y).toFixed(2) + '%">' + y + "</span>";
  }
  scale.innerHTML = ticks;

  host.innerHTML = "";
  for (const lane of lanes) {
    const row = document.createElement("div");
    row.className = "tl-lane";

    // Computed before the name, which reports the span in its hover summary.
    const first = lane.events[0].year, last = lane.events[lane.events.length - 1].year;

    const name = document.createElement("span");
    name.className = "tl-name";
    name.textContent = lane.entity ? lane.entity.name : "— no person —";
    if (lane.entity) {
      const e = lane.entity;
      const life = lifeSummary(e);
      const summary = e.name + (life ? " · " + life : "") + " · " +
                      lane.events.length + " dated record" +
                      (lane.events.length === 1 ? "" : "s") +
                      (last > first ? " · " + first + "–" + last : " · " + first) +
                      " · click to focus";
      name.onmouseenter = () => { detail.textContent = summary; };
      name.onmouseleave = () => { detail.innerHTML = "&nbsp;"; };
      name.onclick = () => focusEntity(e.slug);
    } else {
      name.onmouseenter = () => { detail.textContent = "dated records that name nobody"; };
      name.onmouseleave = () => { detail.innerHTML = "&nbsp;"; };
      name.style.cursor = "default";
    }
    row.appendChild(name);

    const track = document.createElement("div");
    track.className = "tl-track";
    if (last > first) {
      const span = document.createElement("div");
      span.className = "tl-span";
      span.style.left = pct(first).toFixed(2) + "%";
      span.style.width = (pct(last) - pct(first)).toFixed(2) + "%";
      track.appendChild(span);
    }

    for (const evt of lane.events) {
      const b = evt.brick;
      const dot = document.createElement("div");
      dot.className = "tl-dot" + (b.status === "verified" ? " verified" : "") + (evt.loose ? " loose" : "");
      dot.style.left = pct(evt.year).toFixed(2) + "%";
      // Age is only meaningful in a person's own lane — in the "no person"
      // lane there is nobody to be that age.
      const age = lane.entity ? ageAt(lane.entity, evt.year) : "";
      const text = evt.year + (evt.loose ? " (from a note)" : "") + " · " +
                   (b.icon || "") + " " + (b.name || b.type) +
                   (age !== "" ? " · aged " + age : "") +
                   (b.detail ? " — " + b.detail : "");
      // No title attribute: the browser's own tooltip duplicates the detail
      // line, arrives late, and cannot be styled.
      dot.onmouseenter = () => { detail.textContent = text; };
      dot.onmouseleave = () => { detail.innerHTML = "&nbsp;"; };
      dot.onclick = () => loadBrickIntoBuilder(b.lineNumber);
      track.appendChild(dot);
    }
    row.appendChild(track);
    host.appendChild(row);
  }
}

/* ---------- gazetteer panel ---------- */
// Reads and writes the same GAZETTEER map every folder/hosted route uses.

/*  Google Maps' right-click "copy coordinates" puts one string on the
    clipboard: "56.462857045769084, -2.971490044008239". The lat/lng fields
    here are two separate number inputs (so each can be edited alone
    afterwards), but a paste should not care which of the two you pasted
    into — split it across both, using the same RE_COORDS/readCoords the
    parser itself uses, so "what counts as a coordinate pair" is defined in
    exactly one place. */
function wireCoordPaste(latIn, lngIn, onDone) {
  const handler = e => {
    const text = (e.clipboardData || window.clipboardData).getData("text");
    const c = readCoords(text);
    if (!c) return;               // not a pair — let the normal single-number paste happen
    e.preventDefault();
    latIn.value = c.lat;
    lngIn.value = c.lng;
    if (onDone) onDone(c);
  };
  latIn.addEventListener("paste", handler);
  lngIn.addEventListener("paste", handler);
}

function renderGazetteerPanel(body) {   // built once, refreshed on every update()
  if (!body.dataset.built) {
    body.dataset.built = "1";

    const newName = body.querySelector('[data-el="newname"]');
    const newLat = body.querySelector('[data-el="newlat"]');
    const newLng = body.querySelector('[data-el="newlng"]');

    const addPlace = () => {
      const name = newName.value.trim();
      if (!name) { newName.focus(); return; }
      const uid = slugify(name);
      if (!uid) return;

      // Only a declared PLACE with this uid counts as "already exists" here —
      // a clash with some other kind is still worth attempting, so the usual
      // uid-uniqueness error surfaces in Red Flags rather than being hidden.
      const isNewPlace = !state.model.entities.some(e => e.slug === uid && e.declared && e.kind === "place");
      if (isNewPlace) {
        state.text = state.text.replace(/\s*$/, "") + "\n" + "-|📍|<" + uid + ">|" + name;
        saveText();
      }
      const lat = parseFloat(newLat.value), lng = parseFloat(newLng.value);
      if (isFinite(lat) && isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180) {
        GAZETTEER.set(uid, { lat, lng });
        saveGazetteer();
      }
      update();
      newName.value = ""; newLat.value = ""; newLng.value = "";
      newName.focus();
    };
    body.querySelector('[data-act="add"]').onclick = addPlace;
    [newName, newLat, newLng].forEach(inp =>
      inp.addEventListener("keydown", e => { if (e.key === "Enter") addPlace(); }));

    // No click needed once there is enough to act on: a name plus a complete,
    // valid coordinate pair adds the place ~0.4s after you stop typing —
    // matching how the per-row edits below now behave. Typing only a name, or
    // only coordinates, does nothing yet, so a place is never created off a
    // single character.
    let addTimer = null;
    const maybeAutoAdd = () => {
      const lat = parseFloat(newLat.value), lng = parseFloat(newLng.value);
      if (!newName.value.trim() || !isFinite(lat) || !isFinite(lng) ||
          Math.abs(lat) > 90 || Math.abs(lng) > 180) return;
      clearTimeout(addTimer);
      addTimer = setTimeout(addPlace, 400);
    };
    newLat.addEventListener("input", maybeAutoAdd);
    newLng.addEventListener("input", maybeAutoAdd);
    // A paste is already a complete, deliberate action, so it adds immediately
    // rather than waiting out the debounce.
    wireCoordPaste(newLat, newLng, () => { if (newName.value.trim()) addPlace(); });

    body.querySelector('[data-act="load"]').onclick = () => {
      const inp = document.createElement("input");
      inp.type = "file"; inp.accept = ".csv"; inp.multiple = true;
      inp.onchange = () => {
        const files = [...(inp.files || [])];
        Promise.all(files.map(f => f.text()))
          .then(texts => {
            const added = texts.reduce((n, t) => n + mergeGazetteerFile(t), 0);
            if (added) { update(); showMergeLog(added + " gazetteer row" + (added === 1 ? "" : "s") + " loaded"); }
          });
      };
      inp.click();
    };
    body.querySelector('[data-act="export"]').onclick = () => {
      const rows = ["uid,lat,lng,label,icon"];
      for (const [uid, c] of [...GAZETTEER.entries()].sort((a, b) => a[0].localeCompare(b[0]))) {
        rows.push(uid + "," + c.lat + "," + c.lng + "," +
                  (LABEL_POS.get(uid) || "") + "," + (MARKER_ICON.get(uid) || ""));
      }
      const blob = new Blob([rows.join("\n") + "\n"], { type: "text/csv" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "gazetteer.csv";
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };
    body.querySelector('[data-act="clear"]').onclick = () => {
      if (!GAZETTEER.size) return;
      if (!confirm("Forget all " + GAZETTEER.size + " loaded gazetteer entries? Places using them lose their coordinates.")) return;
      GAZETTEER.clear();
      LABEL_POS.clear();
      MARKER_ICON.clear();
      saveGazetteer();
      update();
    };

  }
  renderGazetteerList(body);
}

/*  The list is built from your declared PLACES, not from the CSV — the CSV is
    just where numbers happen to be stored. Every declared place gets a row,
    named, with its lat/lng editable right there; a brick's own inline
    coordinates still win if it has any (that row is read-only, since editing
    it here would silently disagree with the brick). Any gazetteer entry that
    matches no declared place is listed underneath as unclaimed. */
function renderGazetteerList(body) {
  /*  Uses the one global search rather than a box of its own — a second search
      field that filtered only this list was another thing to notice, keep in
      sync, and wonder why it disagreed with everything else on the board. */
  const q = (state.filter.text || "").trim().toLowerCase();
  const list = body.querySelector('[data-el="list"]');
  const all = state.model || { entities: [] };

  const places = all.entities.filter(e => e.kind === "place" && e.declared);
  const claimed = new Set(places.map(e => e.slug));
  const orphans = [...GAZETTEER.keys()].filter(uid => !claimed.has(uid));

  const matches = e => !q || e.slug.includes(q) || e.name.toLowerCase().includes(q);
  const placeRows = places.filter(matches).sort((a, b) => a.name.localeCompare(b.name));
  const orphanRows = orphans.filter(uid => !q || uid.includes(q)).sort();

  const fromBrick = places.filter(e => e.coordsFrom === "brick").length;
  const fromGaz = places.filter(e => e.coordsFrom === "gazetteer").length;
  const none = places.length - fromBrick - fromGaz;
  const searchNote = q ? ' · matching "' + q + '"' : "";
  body.querySelector('[data-el="summary"]').textContent =
    places.length
      ? places.length + " place" + (places.length === 1 ? "" : "s") + " · " + fromGaz + " set here" +
        (fromBrick ? " · " + fromBrick + " fixed in a brick" : "") +
        (none ? " · " + none + " with no coordinates" : "") + searchNote
      : "No places declared yet.";

  list.innerHTML = "";
  if (!placeRows.length && !orphanRows.length) {
    list.innerHTML = '<div class="file-empty">' + (q ? "No match." : "No places declared yet.") + "</div>";
    return;
  }

  for (const e of placeRows) {
    const locked = e.coordsFrom === "brick";
    const row = document.createElement("div");
    row.className = "gaz-row" + (locked ? " locked" : "");
    row.title = locked ? "coordinates are fixed in the brick itself (line " + e.declaredAt + ") — edit the brick to change them" : "";

    const name = document.createElement("span");
    name.className = "gaz-name";
    name.textContent = e.name;
    name.onclick = () => focusEntity(e.slug);
    name.title = "click to focus <" + e.slug + ">";
    row.appendChild(name);

    const latIn = document.createElement("input");
    latIn.type = "number"; latIn.step = "any"; latIn.placeholder = "lat";
    latIn.value = e.coords ? e.coords.lat : "";
    latIn.disabled = locked;

    const lngIn = document.createElement("input");
    lngIn.type = "number"; lngIn.step = "any"; lngIn.placeholder = "lng";
    lngIn.value = e.coords ? e.coords.lng : "";
    lngIn.disabled = locked;

    const commit = () => {
      const lat = parseFloat(latIn.value), lng = parseFloat(lngIn.value);
      if (isFinite(lat) && isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180) {
        GAZETTEER.set(e.slug, { lat, lng });
      } else if (!latIn.value && !lngIn.value) {
        GAZETTEER.delete(e.slug);
      } else {
        return;   // half-typed or out of range: leave the map alone until it is valid
      }
      saveGazetteer();
      update();     // rebuilds the model, which re-renders this panel too
    };
    // "change" alone meant nothing happened until you clicked away from the
    // field — indistinguishable from broken. Debounced "input" commits ~0.4s
    // after you stop typing, without needing a blur; "change" stays as an
    // immediate backstop (spinner clicks, Enter, real blur). A plain re-render
    // on every keystroke would kick focus out of the field mid-type, so the
    // debounce is what makes typing continuously into it possible at all.
    let commitTimer = null;
    const commitSoon = () => { clearTimeout(commitTimer); commitTimer = setTimeout(commit, 400); };
    latIn.addEventListener("input", commitSoon);
    lngIn.addEventListener("input", commitSoon);
    latIn.addEventListener("change", commit);
    lngIn.addEventListener("change", commit);
    // Pasting "56.4629, -2.9715" (Google Maps' copy-coordinates format) into
    // either field fills both and commits immediately — setting .value in JS
    // does not fire "change" on its own, so the paste handler commits directly.
    wireCoordPaste(latIn, lngIn, commit);

    // Per-place label position. "map default" is the empty value, so a place
    // only overrides when you actually choose something for it.
    const labelSel = document.createElement("select");
    labelSel.className = "gaz-label";
    labelSel.title = "where this place's label sits";
    for (const [val, text] of [["", "default"], ["bottom", "below"], ["top", "above"],
                               ["right", "right"], ["left", "left"], ["none", "hidden"]]) {
      const o = document.createElement("option");
      o.value = val; o.textContent = text;
      labelSel.appendChild(o);
    }
    labelSel.value = LABEL_POS.get(e.slug) || "";
    labelSel.onchange = () => {
      if (labelSel.value) LABEL_POS.set(e.slug, labelSel.value);
      else LABEL_POS.delete(e.slug);
      saveGazetteer();
      update();
    };

    // Any single emoji or character. Kept short deliberately — this is a map
    // mark, not a caption; the name already has its own label.
    const iconIn = document.createElement("input");
    iconIn.type = "text";
    iconIn.className = "gaz-icon";
    iconIn.maxLength = 4;
    iconIn.placeholder = "•";
    iconIn.title = "marker icon — any emoji, blank for the plain dot";
    iconIn.value = MARKER_ICON.get(e.slug) || "";
    const commitIcon = () => {
      const v = iconIn.value.trim();
      if (v) MARKER_ICON.set(e.slug, v.slice(0, 4));
      else MARKER_ICON.delete(e.slug);
      saveGazetteer();
      update();
    };
    iconIn.addEventListener("change", commitIcon);

    row.append(latIn, lngIn, iconIn, labelSel);
    list.appendChild(row);
  }

  if (orphanRows.length) {
    const head = document.createElement("div");
    head.className = "gaz-sub";
    head.textContent = "not used by any declared place";
    list.appendChild(head);
    for (const uid of orphanRows) {
      const c = GAZETTEER.get(uid);
      const row = document.createElement("div");
      row.className = "gaz-row orphan";
      row.title = "in the gazetteer, but no place brick declares <" + uid + ">";
      row.innerHTML = '<span class="gaz-name">' + esc(uid) + '</span><span class="gaz-static">' +
        c.lat.toFixed(4) + ", " + c.lng.toFixed(4) + "</span>";
      list.appendChild(row);
    }
  }
}


/* ---------- brick builder ----------
   A way INTO the notation, not a replacement for it: every change shows the
   exact line it will write, and the line goes into the same pallet text that
   everything else reads. Nothing here is a separate data store. */
// Draft by default. A new brick is a claim you have just typed, not one you
// have checked — defaulting to "+" quietly marks everything verified.
const builder = { type: "person", status: "-", editing: null, values: {} };

// Which fields each type offers, in the order they appear in the line.
function fieldsFor(type) {
  if (type === "comment") return [
    { key: "name", label: "heading or note", ph: "LONGFORGAN",
      sub: "becomes a '#' line, and a grouping chip in Filter" },
  ];
  const kind = TYPES[type].kind;
  if (kind === "person") return [
    { key: "alias", label: "uid (alias)", kind: "alias", ph: "George Isles",
      sub: "type it however you like — it becomes kebab-case in the line" },
    { key: "detail", label: "description / occupation", ph: "Powerloom Tender" },
    { key: "links", label: "links", kind: "links", ph: "birth-cert-1869" },
  ];
  if (kind === "place") return [
    { key: "alias", label: "uid (alias)", kind: "alias", ph: "Longforgan",
      sub: "type it however you like — it becomes kebab-case in the line" },
    { key: "name", label: "name", ph: "Longforgan" },
    { key: "detail", label: "description", ph: "Village west of Dundee" },
    { key: "coords", label: "coordinates", ph: "56.4647, -3.1200",
      sub: "optional — leave blank to use a gazetteer.csv entry for this uid" },
    { key: "links", label: "links", kind: "links", ph: "census-1891" },
  ];
  if (kind === "event") return [
    { key: "date", label: "date", ph: "1894-06-29", sub: "???? if the question was asked and not answered" },
    { key: "links", label: "participants", kind: "links", ph: "george,margaret-kinnear" },
  ];
  if (kind === "document") return [
    // A document without a uid cannot be cited, and an uncitable source is no
    // source at all — so it comes first, like it does for a person.
    { key: "alias", label: "uid (alias)", kind: "alias", ph: "census 1891 longforgan",
      sub: "how claims will cite this source" },
    { key: "subtype", label: "subtype", ph: "census, or an emoji like 👶" },
    { key: "date", label: "date", ph: "1891" },
    /*  Three different things, deliberately three fields.

        SOURCE is the record — it exists whether or not anything digital does,
        and it is what you would write in a footnote. IMAGE is a surrogate of
        it. URL is where you happened to reach a copy, and pointers rot. Losing
        the URL should never lose the citation. */
    { key: "detail", label: "source", ph: "1891 Census of Scotland, Longforgan, ED 4, p17 line 3",
      sub: "the record itself — what you would write in a footnote" },
    { key: "src", label: "image", ph: "images/1891-longforgan-p17.jpg",
      sub: "a scan of it — a surrogate, not the record" },
    { key: "url", label: "url", ph: "https://scotlandspeople.gov.uk/…",
      sub: "where you reached a copy — optional, and the first thing to go stale" },
    { key: "links", label: "links", kind: "links", ph: "george,margaret" },
  ];
  return [   // census
    { key: "date", label: "year", ph: "1891" },
    { key: "name", label: "forename", ph: "George" },
    { key: "detail", label: "age", ph: "22 ~1869", sub: "keep your working — '22 1891-22 ~1869' is kept verbatim" },
    // Without this a census row attaches to nobody, and census rows are the
    // bulk of the evidence. The forename is what the enumerator wrote; the link
    // is who you think it was — deliberately two different fields.
    { key: "links", label: "who this is", kind: "links", ph: "George Isles",
      sub: "leave empty until you know — an unattached row is an honest one" },
  ];
}

// Assembles the line. Trailing empty fields are dropped rather than written as
// bare pipes, so the builder produces the same shape a person would type.
function builderLine() {
  const v = builder.values;
  // A comment is the one line with no status and no pipes.
  if (builder.type === "comment") return "# " + (v.name || "").replace(/^#+\s*/, "");
  const icon = TYPES[builder.type].icon;
  const kind = TYPES[builder.type].kind;
  const parts = [builder.status, icon];
  // Links name uids too, so they get the same treatment.
  const links = (v.links || "").split(",")
    .map(x => slugify(x.trim().replace(/^@/, ""))).filter(Boolean);
  const linkField = links.length ? "@" + links.join(",") : "";

  if (kind === "person") {
    const num = (v.num || "").trim();
    parts.push((num ? "<" + num + ">" : "") + "<" + slugify(v.alias || "") + ">",
               v.detail || "", linkField);
  } else if (kind === "place") {
    parts.push("<" + slugify(v.alias || "") + ">", v.name || "", v.detail || "",
               (v.coords || "").trim(), linkField);
  } else if (kind === "event") {
    parts.push(v.date || "", linkField);
  } else if (kind === "document") {
    // Only emit the uid if there is one — an empty <> would declare a nameless
    // source rather than an unnamed one.
    const uid = slugify(v.alias || "");
    if (uid) parts.push("<" + uid + ">");
    parts.push(v.subtype || "", v.date || "", v.detail || "", v.src || "", v.url || "", linkField);
  } else {
    // Census: year, the forename as written, the age blob, then who you think
    // it was. The link is a separate claim from the transcription.
    parts.push(v.date || "", v.name || "", v.detail || "", linkField);
  }
  while (parts.length > 2 && !parts[parts.length - 1]) parts.pop();
  return parts.join("|");
}

// Reverse: an existing brick back into the form, so a line can be corrected
// rather than retyped.
function loadBrickIntoBuilder(lineNumber) {
  const b = state.model.bricks.find(x => x.lineNumber === lineNumber);
  if (!b || b.empty || !b.valid) return;
  if (b.comment) {
    builder.type = "comment";
    builder.editing = lineNumber;
    builder.values = { name: b.name };
    const p0 = document.getElementById("builder");
    if (!p0 || !p0.closest(".board-tile")) Brick.place("builder");
    refreshPanel("builder");
    renderClassification(document.querySelector('#classification [data-el="lines"]'));
    return;
  }
  builder.type = b.type;
  builder.status = b.status === "verified" ? "+" : "-";
  builder.editing = lineNumber;
  const v = builder.values = {};
  v.links = b.links.join(",");
  v.date = b.date || "";
  if (b.alias) { v.alias = b.alias.slug; v.num = b.alias.num !== null && b.alias.num !== undefined ? String(b.alias.num) : ""; }
  const kind = b.kind;
  if (kind === "person") v.detail = b.detail || "";
  else if (kind === "place") {
    v.name = b.text[0] || ""; v.detail = b.text[1] || "";
    v.coords = b.coords ? b.coords.lat + ", " + b.coords.lng : "";
  }
  else if (kind === "document") {
    v.subtype = b.subtype || ""; v.detail = b.text[0] || "";
    v.src = b.src || ""; v.url = b.url || "";
  }
  else if (kind === "census") { v.name = b.name || ""; v.detail = b.text[0] || ""; }

  const panel = document.getElementById("builder");
  if (!panel || !panel.closest(".board-tile")) Brick.place("builder");
  refreshPanel("builder");
  const p = document.getElementById("builder");
  if (p) p.scrollIntoView({ block: "nearest" });
  renderClassification(document.querySelector('#classification [data-el="lines"]'));
}

function commitBuilder() {
  const line = builderLine();
  const lines = state.text.split("\n");
  if (builder.editing !== null && lines[builder.editing - 1] !== undefined) {
    lines[builder.editing - 1] = line;
    state.text = lines.join("\n");
    builder.editing = null;
  } else {
    // Appended to the end of the pile. A brick is added to the pile, not
    // inserted into a structure — that is the whole premise.
    state.text = state.text.replace(/\s*$/, "") + "\n" + line;
  }
  builder.values = {};
  saveText();
  update();
  refreshPanel("pallet");
}

function renderBuilder(body) {
  // Built once. Re-rendering the whole form on every keystroke elsewhere would
  // blow away whatever is half-typed in it.
  if (!body.dataset.built) {
    body.dataset.built = "1";

    const st = body.querySelector('[data-el="status"]');
    st.innerHTML = '<button data-st="+" title="verified">+ verified</button>' +
                   '<button data-st="-" title="draft / unverified">− draft</button>';
    st.querySelectorAll("button").forEach(b => b.onclick = () => {
      builder.status = b.dataset.st; renderBuilderState(body);
    });

    const ty = body.querySelector('[data-el="type"]');
    // Comment is not in TYPES — it has no status and no fields — but it is a
    // line you write constantly, and your '#' headings are what the filter
    // groups by, so it needs a button like everything else.
    ty.innerHTML = Object.keys(TYPES).map(k =>
      '<button data-ty="' + k + '" title="' + esc(TYPES[k].label) + '">' + TYPES[k].icon + "</button>").join("") +
      '<button data-ty="comment" title="a # heading or note — this is what the filter groups by">💬</button>';
    ty.querySelectorAll("button").forEach(b => b.onclick = () => {
      builder.type = b.dataset.ty;
      buildBuilderFields(body);
      renderBuilderState(body);
    });

    body.querySelector('[data-act="commit"]').onclick = () => { commitBuilder(); renderBuilderState(body); };
    body.querySelector('[data-act="cancel"]').onclick = () => {
      // Leaving an edit returns to the resting state, which is draft — the
      // status of the brick you were editing must not stick to the next one.
      builder.editing = null; builder.values = {}; builder.status = "-";
      renderBuilderState(body);
      renderClassification(document.querySelector('#classification [data-el="lines"]'));
    };
    body.querySelector('[data-act="clearfields"]').onclick = () => {
      builder.values = {}; buildBuilderFields(body); renderBuilderState(body);
    };
    buildBuilderFields(body);
  }
