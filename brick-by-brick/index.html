       10   the pen, and whoever is being carried

    Named because "addChildAt(0)" is not layering, it is a guess, and the guess
    was wrong: the street paints an opaque sky over the whole panel, so index 0
    is not "behind everything", it is "invisible". */
const SKY_Z = 5, PEN_Z = 10;
/*  Every puff on the street, shared out among whichever chimneys are on
    screen. A ceiling rather than a per-chimney allowance, so the cost does not
    climb with the size of your pile. */
const SMOKE_MAX = 120;

/*  THE SCENERY: STILL THINGS BEHIND THE STREET.

    Everything in this list is drawn once per render into a single Graphics
    that goes in behind the gradients, the scenery, the crowd and the ribbons.
    It is for depth, not for information — nothing here is ever clickable, and
    nothing here means anything.

    To add one, add an entry. That is the whole of it:

        { id: "gulls", on: true, draw(g, s) { … } }

    `draw` gets a Pixi Graphics to paint into and a small kit:

        s.P       Pixi, for anything the Graphics API alone cannot do
        s.Z       the zoom — multiply every size by it or it will not scale
        s.H       the panel's height in world units
        s.width   how wide the street runs, which is wider than the panel
        s.ground  the y of the horizon line
        s.sky     the sky's color as an int, since yours is settable
        s.tint    (amount) → the sky nudged toward its own opposite, which is
                  how anything here should pick a color: white on a pale sky
                  is a hole, and so is black on a dark one
        s.rnd     () → 0…1, seeded per piece and per street width, so a piece
                  sits still between renders instead of reshuffling every time
                  you drop somebody. Never call Math.random here.
        s.get     (key) → whatever the person has set that dial to, or the
                  default the piece declared. See `settings` below.

    A piece may declare `settings`, and the scenery bar builds itself from
    them. One entry is one slider:

        { k: "count", label: "how many", min: 0, max: 2.5, step: 0.05, def: 1 }

    `on` in the table is the default, not the state — somebody may have turned
    the piece off, so ask sceneryOn() rather than reading it.

    Moving things do not belong in this list — the balloon and the birds are
    stateful and live on the stage above the street. This is the quiet layer. */
/*  WHAT YOU HAVE SET THE SCENERY TO.

    Kept out here rather than on the pieces themselves, so a piece's entry in
    the table stays a description of how to draw it and never becomes a place
    where state accumulates. Keyed piece id, then setting key.

    Only what differs from the declared default is written down. A store that
    is all defaults is removed, so a scene you have not touched costs nothing
    and a later change to a default reaches you instead of being shadowed by a
    saved copy of the old one. */
const SCENERY_KEY = "brick-by-brick:scenery:v1";
const SCENE_SET = new Map();            // "clouds:count" -> number
const sceneryDefs = piece => piece.settings || [];
function sceneryGet(piece, key) {
  const v = SCENE_SET.get(piece.id + ":" + key);
  if (v !== undefined) return v;
  const def = sceneryDefs(piece).find(d => d.k === key);
  return def ? def.def : 1;
}
function sceneryOn(piece) {
  const v = SCENE_SET.get(piece.id + ":on");
  return v === undefined ? !!piece.on : !!v;
}
function loadScenery() {
  let raw;
  try { raw = JSON.parse(localStorage.getItem(SCENERY_KEY) || "null"); } catch (e) { return; }
  if (!raw) return;
  for (const [k, v] of Object.entries(raw)) {
    if (typeof v === "number" && isFinite(v)) SCENE_SET.set(k, v);
  }
}
function saveScenery() {
  try {
    //  Prune anything back at its default before writing, so the file is the
    //  list of your decisions and not a snapshot of every dial.
    for (const piece of SCENERY) {
      if (sceneryOn(piece) === !!piece.on) SCENE_SET.delete(piece.id + ":on");
      for (const d of sceneryDefs(piece)) {
        if (sceneryGet(piece, d.k) === d.def) SCENE_SET.delete(piece.id + ":" + d.k);
      }
    }
    if (!SCENE_SET.size) localStorage.removeItem(SCENERY_KEY);
    else localStorage.setItem(SCENERY_KEY,
      JSON.stringify(Object.fromEntries(SCENE_SET)));
  } catch (e) { /* unavailable */ }
}

/*  A CLOUD IS ONE SHAPE, AND HAS TO BE FILLED AS ONE.

    It was a row of overlapping lobes drawn between a single beginFill and
    endFill, which reads like one translucent shape and is not. Pixi keeps each
    drawEllipse as its own shape in the geometry and draws them in turn, so
    where two lobes crossed, 0.55 composited over 0.55 and came out at 0.80.
    Every lobe boundary showed as a darker lens and the cloud looked like a
    diagram of the circles it was made from.

    Baking it into a canvas fixes it at the root. Every lobe is a subpath of
    ONE path and a single fill() unions them, so there is no inside edge to
    see. The sprite then carries the transparency for the whole silhouette at
    once, which is what "a translucent cloud" meant in the first place.

    The flat bottom comes free: the lobes are centred on the canvas's bottom
    edge, so the edge itself does the cutting. Clouds do have flat bottoms, all
    at the same height, because that is where rising air reaches its dew point.

    Baked white and tinted per sprite, so the sky can change colour through the
    day without rebuilding a texture. */
const CLOUD_SHAPES = 4;
const cloudCache = new Map();
function cloudTexture(P, variant) {
  if (cloudCache.has(variant)) return cloudCache.get(variant);
  const W = 240, H = 52;
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const g = c.getContext("2d");
  let seed = (variant + 1) * 9301 + 49297;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const lobes = 4 + Math.round(rnd() * 2);
  g.fillStyle = "#ffffff";
  g.beginPath();
  for (let k = 0; k < lobes; k++) {
    const t = (k + 0.5) / lobes;
    const lx = W * (0.10 + t * 0.80);
    const lr = H * (0.34 + rnd() * 0.58);
    g.moveTo(lx + lr, H);
    g.arc(lx, H, lr, 0, Math.PI * 2);
  }
  //  Along the base, so the gaps between lobes are cloud rather than sky.
  g.rect(W * 0.08, H * 0.72, W * 0.84, H * 0.28);
  g.fill();                       // one fill, one silhouette, no inside edges
  const tex = P.Texture.from(c);
  cloudCache.set(variant, tex);
  return tex;
}

const SCENERY = [
  {
    id: "clouds",
    label: "clouds",
    on: true,
    /*  A piece declares its own dials and the bar builds itself from them, the
        same way the effect buttons come off EFFECTS. Adding a slider here is
        the whole of adding a slider. */
    settings: [
      /*  Wide on purpose. 1 is the sky as drawn, and the ends are meant to be
          useful rather than safe: nothing at 0, an overcast at 6, a haze of
          specks at 0.2 and weather the size of the street at 5. A dial whose
          extremes both look sensible is a dial that was not worth adding. */
      { k: "count", tag: "number", tip: "how many clouds there are",
        min: 0, max: 6, step: 0.1, def: 1 },
      { k: "size", tag: "size", tip: "how big they are",
        min: 0.2, max: 5, step: 0.05, def: 1 },
      /*  FAR HAS TO MEAN FAR.

          This started as a multiplier on how much of the street's movement a
          cloud keeps, so turning it up made the clouds move MORE, which the
          eye reads as closer. The dial said far and did near.

          Now it subtracts. All the way down, the clouds keep pace with the
          roofs and might as well be painted on them. In the middle is the sky
          as drawn. At 2 they hold still while the whole town walks past, which
          is what the sun does.

          PAST 2 THEY COME BACK THE OTHER WAY. The share goes negative and the
          sky slides against the street instead of behind it. Nothing in the
          air does that, and it does not have to: it reads as weather crossing
          while you walk, it makes the movement plain on a street too short to
          pan, and the dial had a dead stop at exactly the point where the
          interesting half begins. */
      { k: "depth", tag: "distance", tip: "how far off the clouds sit. Down, they " +
        "travel with the buildings. At the middle of the dial they hold still " +
        "while the street goes past, the way the sun does. Past that they " +
        "cross the other way",
        min: 0, max: 3, step: 0.05, def: 1 },
    ],
    /*  DEPTH, FROM ONE NUMBER.

        Every cloud draws a `near` between 0 and 1 and everything else follows
        from it: how fast it answers the pan, how big it is, and how much of
        the sky shows through it. Speed on its own reads as a bug, like the
        layer is lagging. Speed with size and haze reads as distance, because
        those three are what actually tell you a thing is far away.

        `par` is the fraction of the street's movement the cloud takes. The sun
        is the limit case at 0, standing still while the whole town goes past,
        which is why the sky needs nothing nearer than about 0.4 to sit between
        the two.

        A SKY IS MADE ONCE AND RECYCLED, NOT LAID OUT ALONG THE STREET.

        The first version spread clouds across the length of the town and gave
        each one a share of it to cover. That cannot work: a cloud moving at a
        third of the pan only travels a third as far, so however many you make,
        walking far enough leaves the sky behind and the far end of a long town
        has clear weather over it for ever.

        So the count is per SCREEN, and the ticker wraps each cloud around the
        window it is seen through. Walk as far as you like and the sky is
        always full, because a cloud going off the left is the cloud arriving on
        the right. Fifty places cost exactly as much sky as one. */
    draw(g, s) {
      const puff = s.tint(0.1);
      const many = s.get("count"), big = s.get("size"), far = s.get("depth");
      const n = Math.round(Math.max(0, s.screenW / 200) * many);
      for (let i = 0; i < n; i++) {
        const near = s.rnd();
        /*  `far` takes movement away rather than adding it: 2 minus the dial,
            so up means less of the street's motion and a cloud further off.
            Past 2 the term goes negative and the cloud crosses against the
            street, which is why the clamp is symmetrical now — it used to
            floor at 0 and threw that whole half of the dial away.

            Held under 1 either way, because at 1 a cloud moves exactly with
            the buildings and stops being sky at all. */
        const par = Math.max(-0.95, Math.min(0.95, (0.10 + near * 0.32) * (2 - far)));
        const sp = new s.P.Sprite(cloudTexture(s.P, i % CLOUD_SHAPES));
        //  Held by its flat underside, which is the line the eye reads.
        sp.anchor.set(0.5, 1);
        sp.tint = puff;
        //  Far ones thinner. Distance is haze as much as it is size.
        sp.alpha = 0.30 + near * 0.28;
        sp.eventMode = "none";
        const k = (0.11 + near * 0.22) * s.Z * big;
        sp.scale.set(k, k);
        //  Half of them turned over, so four baked shapes read as eight.
        if (s.rnd() > 0.5) sp.scale.x = -k;
        sp.__par = par;
        /*  Half a cloud of margin at each edge, so one crosses the boundary
            instead of blinking out of existence at it. The run is the window
            plus both margins, and that is the whole world a cloud lives in. */
        sp.__pad = 130 * k + 12;
        sp.__run = s.screenW + sp.__pad * 2;
        /*  Never quite still, even pinned. `par` is what a cloud does when YOU
            move; this is what it does when nobody does. They are different
            questions, and tying the second to the first meant a sky pushed all
            the way to "far" froze solid. Air still moves. */
        sp.__blow = 0.25 + near * 0.75;
        sp.__x0 = ((i + s.rnd() * 0.8) / n) * sp.__run;
        sp.x = sp.__x0 - sp.__pad;
        //  Far ones ride lower, toward the horizon, the way distance stacks a
        //  sky. Near ones are free to be overhead.
        sp.y = s.H * (0.05 + (1 - near) * 0.16 + s.rnd() * 0.16);
        s.layer.addChild(sp);
      }
    },
  },
];

/*  A cheap deterministic sequence. Math.random would give a different sky on
    every drop, drag and resize, which is the one thing a background must not
    do. Seeded per piece as well as per width, so adding a second piece does
    not reshuffle the first. */
function sceneryRnd(id, width) {
  let seed = Math.round(width) * 9301 + 49297;
  for (let i = 0; i < id.length; i++) seed = (seed * 31 + id.charCodeAt(i)) % 233280;
  return () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
}

/*  Balloon silks: the envelope, and the two side gores under it.

    Each pair is one dyestuff at two strengths rather than two colors, because
    that is what a gore is — the same bolt, shaded by the curve of the cloth.
    The names are the dyes a balloon of the period would actually have been
    made up in, which is also why none of them is a bright primary: aniline
    had barely arrived, and madder, weld and indigo do not do neon.

    Muted on purpose besides. This thing crosses the sky above somebody's
    research; it is meant to be noticed once and then ignored. */
const BALLOON_SILKS = [
  [0xb4553a, 0x8f4530],   // madder — the original, and still the commonest
  [0xc08a3e, 0x9a6b2e],   // ochre
  [0x8f9d5c, 0x6f7c46],   // weld over woad, the green of old bunting
  [0x6d7f96, 0x53637a],   // indigo, weak
  [0x9c4f57, 0x7c3d45],   // cochineal
  [0x7a6a94, 0x5e5175],   // logwood damson
  // Undyed silk, which is a color too — taken down a little from the raw
  // cloth, because against a night sky the true shade was the one thing up
  // there brighter than the signposts.
  [0xc4b79c, 0xa39a82],
  [0x4f6b63, 0x3c534d],   // verdigris
];

/*  A BRICKLING is one of the little figures on the street: a person from the
    pile, drawn, dressed and walking. The distinction is worth keeping — a
    PERSON is a brick you wrote and a BRICKLING is what the Promenade makes of
    them, so a person with no brickling is one this panel is filtering out, and
    a brickling with no person cannot happen.

    The code below still says "walker" throughout, because that is what the
    thing does rather than what it is called, and renaming a hundred variables
    would make every future diff unreadable for a word nobody types. */

/*  PASSENGERS.

    Drop somebody onto the balloon and they hang under it on a string until it
    leaves the frame, at which point everyone is set down exactly where they
    were. Nothing is written: no pin moves, no brick changes, and the sidecar
    never hears about it. A ride is a thing you watch, not a thing you record —
    which is also why the balloon is allowed to carry them off the edge of the
    world without that costing you a placement.

    One, because one is what a basket holds. */
const BALLOON_SEATS = 1;

/*  THE PEN IS A CHOICE, NOT A DEFAULT.

    It used to be where anybody with no place ended up: no pin and no record
    meant the box in the sky. That made the ordinary state of a fresh pile —
    nobody placed yet — a crowd standing in a corner rather than a crowd
    standing in the street, and it read as an error queue.

    So the default is The Promenade, which is exactly what The Promenade is
    for: these people, not anywhere in particular. The pen still exists, and
    it still means "I no longer know where this one was", but you have to say
    so by dragging them there.

    Which needs a value for "in the pen", because absence now means the
    Promenade. It is a column slug that no place and no group can produce:
    every place slug is kebab-case and every group's is prefixed grp-. */
const PEN_SLUG = "\u2205";

/*  THE BALLOON, IN NUMBERS.

    A person rides IN the basket, which means the balloon has to be person
    sized — the nine-pixel one it started as could not have held a hat. So it
    is drawn to a figure: an envelope wide enough to be flying it, ropes long
    enough to clear the passenger's head, and a basket deep enough to hide
    them from the hips down.

        -17   top of the envelope
          0   its middle, and the balloon's own origin
         17   bottom of the envelope
         34   the basket rim
         48   the basket floor, where a passenger stands
         50   the bottom of the basket

    Everything else in this file is derived from those, so moving one number
    moves the drawing and the seating together. */
const BAL = { rx: 14, ry: 17, rim: 34, floor: 48, deep: 16, half: 9 };

/*  Heavier is slower, but never slower than stopped and never NEGATIVE.

    It was `0.35 - load * 0.03`, written when the balloon only ever went one
    way. A direction was added later, and the two then disagreed: past eleven
    passengers the speed goes below zero, so the balloon creeps backwards while
    `dir` — and therefore every passenger's facing — still says forward. A
    balloon walking one way and travelling the other.

    Twelve people in a wicker basket is absurd, which is exactly why it was
    never noticed. The floor costs one `max`. */
const balloonDrift = load => Math.max(0.08, 0.35 - load * 0.03);

// Standing on the floor of the basket, in the middle of it. No lean: a
// passenger in a basket is not being dragged through the air, they are riding.
function riderPos() { return { x: 0, y: BAL.floor }; }

/*  Generous, because you are aiming a person at a moving target. Reaches from
    above the envelope to below the basket — a figure dragged UP to the balloon
    arrives from underneath, so the catch has to be where the hand is coming
    from. */
function overBalloonAt(host, x, y) {
  const b = host._balloon;
  if (!b || b.riders.length >= BALLOON_SEATS) return false;
  const dx = Math.abs(x - b.node.x), dy = y - b.node.y;
  return dx < 26 && dy > -30 && dy < BAL.rim + BAL.deep + 12;
}

/*  WHAT IS UNDER THIS POINT.

    Three regions accept a person and they mean three different things:

        balloon   nothing. A ride. No pin, no brick, no record.
        pen       "I no longer know where they were." Clears the pin.
        column    "they belong with this group." Writes the pin.
        nowhere   no column has coordinates yet, so there is nothing to join.

    One function answers it, and both the highlight during a drag and the drop
    itself read that one answer. They used to work it out separately, three
    regions by three code paths, and the results could disagree — the balloon
    could swell to say it would catch you while the release went to a column.
    Worse, each path grew its own hit testing, so a fix for one was a fix for
    one. Everything about where a person lands is decided here now.

    Point is in STAGE coordinates: a carried figure is on the stage, which is
    the only frame the pen, the sky and the street can all be compared in. */
function dropTargetAt(host, x, y) {
  if (host._balloon && overBalloonAt(host, x, y)) return { kind: "balloon" };
  const b = host._penBox;
  if (b && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return { kind: "pen" };
  const col = host._columnAt ? host._columnAt(x - (host._world ? host._world.x : 0)) : null;
  return col === null ? { kind: "nowhere" } : { kind: "column", slug: col };
}

/*  On, and off.

    Both go through host._aloft, which is the only durable record of who is up
    there: b.riders holds live nodes and does not survive a rebuild, and the
    rebuild puts everybody back on the rope by reading the set. */
function boardRider(host, w, P) {
  const b = host._balloon;
  if (!b || !w || b.riders.length >= BALLOON_SEATS) return false;
  w.riding = true;
  w.held = false;
  b.node.addChild(w.node);           // the balloon owns them now
  /*  Counter-scaled against the balloon, which is itself scaled to the zoom:
      the walker's sprite is already drawn at zoom, so inheriting the balloon's
      scale on top would render them at zoom squared. Facing forward, too,
      since that is the way they are going. */
  const bz = b.node.scale.x || 1;
  w.node.scale.set(1 / bz, 1 / bz);
  b.riders.push({ slug: w.slug, node: w.node, h: (w.sprite && w.sprite.height) || 24 });
  host._aloft.add(w.slug);
  rigBalloon(host, P);
  return true;
}

/*  EVERYTHING IN THE BASKET THAT IS NOT THE BALLOON.

    The balloon owns exactly two things of its own — the envelope and the
    basket. Any other child is a passenger, and after a rebuild it is a
    passenger from a cast that no longer exists.

    That is the bug this exists to stop. A rebuild replaces every walker, and
    the restore below puts the NEW node in the basket — but the old one was
    still parented to the balloon, and nothing on the panel clears the balloon.
    So the passenger was in the basket twice: the live one, who left when you
    set them down, and a ghost who stayed behind, kept whatever facing it had
    when it was abandoned, and sailed off with the balloon. */
function clearPassengers(b) {
  if (!b || !b.node || b.node.destroyed) return;
  for (const c of [...b.node.children]) {
    if (c === b.envelope || c === b.basket) continue;
    b.node.removeChild(c);
    if (!c.destroyed) c.destroy({ children: true });
  }
}

/*  Out of the basket. Called the moment a passenger is picked up rather than
    when they are put down, so what you are dragging is already nobody's
    passenger. */
function unboardRider(host, w, P) {
  if (!w) return;
  w.riding = false;
  w.node.scale.set(1, 1);            // out of the balloon's frame, back to its own
  host._aloft.delete(w.slug);
  const b = host._balloon;
  if (!b) return;
  const i = b.riders.findIndex(r => r.slug === w.slug);
  if (i >= 0) b.riders.splice(i, 1);
  rigBalloon(host, P);
}

/*  Stand the passenger in the basket, and put the basket back in front of them.

    The occlusion is the whole trick. There is no mask and no clipping: the
    basket is simply drawn last, so a figure standing on its floor is buried
    from the hips down and reads as being INSIDE it rather than in front of
    it. addChild on a child already there moves it to the top, which is all
    this needs to do to stay in front of whoever just climbed in. */
function rigBalloon(host, P) {
  const b = host._balloon;
  if (!b) return;
  for (const r of b.riders) {
    const at = riderPos();
    r.node.x = at.x;
    r.node.y = at.y;
  }
  if (b.basket) b.node.addChild(b.basket);
  // Always "grab": it can be moved whether or not it is carrying anybody.
  if (b.envelope) b.envelope.cursor = "grab";
}

/*  Click the balloon and everyone aboard is set down in The Promenade.

    Which is a real decision, unlike the ride itself: it writes a placement,
    the same one a drop into that column writes by hand. The Promenade is
    where somebody stands when you have not said where they were, and stepping
    out of a balloon into the middle of the street is exactly that.

    They fall the rest of the way, through the same gravity a dropped figure
    uses, because they should land rather than appear. */
function dropOffBalloon(host) {
  const b = host._balloon;
  if (!b || !b.riders.length) return;
  const riders = [...b.riders];
  const world = host._world;
  const promX = host._columnX ? host._columnX("") : null;
  riders.forEach((r, i) => {
    const w = (host._walkers || []).find(k => k.slug === r.slug);
    host._pinned.set(r.slug, "");            // "" is The Promenade's own slug
    host._aloft.delete(r.slug);
    if (!w || !world) return;
    // Handed from the balloon to the street at the point they were hanging, so
    // the fall starts where they were rather than where they are going.
    const gx = b.node.x + w.node.x, gy = b.node.y + w.node.y;
    w.riding = false;
    world.addChild(w.node);
    w.node.x = gx - world.x;
    w.node.y = gy - world.y;
    /*  Facing forward again. A passenger is turned to face whichever way the
        balloon is travelling, and a balloon that has bounced off the right
        edge is travelling left — so somebody set down from one arrived on the
        ground mirrored, and stayed that way until they next took a step.
        Scale goes back to its own too, since they are out of the balloon's
        frame and no longer counter-scaled against it. */
    w.node.scale.set(1, 1);
    /*  Spread across the column on the way down rather than landing in one
        stack. Same arithmetic the drop handler uses, so five off a balloon
        stand exactly as five dropped by hand would. */
    if (promX !== null) w.home = promX + (i - (riders.length - 1) / 2) * 22;
    w.t = 1;
    w.vy = 0;
    w.falling = true;
  });
  b.riders.length = 0;
  // Nothing should be left standing in an empty basket.
  clearPassengers(b);
  if (b.envelope) b.envelope.cursor = "grab";
  if (host._savePins) host._savePins();
  /*  The Promenade has just taken somebody, so every column east of it moves.
      Reflowed once they are down, not while they are in the air. */
  clearTimeout(host._settle);
  host._settle = setTimeout(() => {
    host._noTween = true;
    renderPromenadePixi(V(), host);
  }, 1100);
}

/*  Everybody down.

    The rebuild is what actually returns them: their pins were never touched,
    so a plain re-render puts each one back in the column they were taken
    from. Which is why the nodes can simply be destroyed with the balloon —
    the render makes new ones. */
function landBalloon(host) {
  const b = host._balloon;
  if (!b) return;
  const had = (b.riders || []).length;
  if (host._aloft) host._aloft.clear();

  /*  Everything interactive comes off the event boundary before any of it is
      torn down. Pixi holds a reference to whatever it is currently tracking a
      pointer over, and a destroyed node still sitting in that slot throws on
      the next move — which is what broke when a balloon carrying somebody
      reached the edge with the pointer anywhere near it.

      The passenger is the part that was missed. The balloon's own listeners
      were being cleaned up; the walker riding INSIDE it is a separate
      interactive object with a full set of drag handlers, and destroy({
      children: true }) took it down with everything still attached. */
  /*  The passenger is lifted OUT before the balloon is destroyed, not destroyed
      with it. destroy({ children: true }) took a live, fully wired walker down
      along with the basket — and the very next thing that happens is a rebuild
      whose first act is to read every walker's position. One destroyed node in
      that list threw, and the whole panel went with it.

      They are set aside alive, outlive the render that replaces them, and are
      cleaned up after. */
  const orphans = [];
  for (const r of b.riders || []) {
    if (!r.node || r.node.destroyed) continue;
    r.node.eventMode = "none";
    r.node.removeAllListeners();
    if (r.node.parent) r.node.parent.removeChild(r.node);
    orphans.push(r.node);
  }
  b.riders.length = 0;
  b.node.eventMode = "none";
  if (b.envelope) b.envelope.eventMode = "none";
  b.node.removeAllListeners();
  b.node.destroy({ children: true });
  host._balloon = null;

  /*  The rebuild is what actually returns them: their pins were never touched,
      so a plain re-render stands each one back in the column they were taken
      from, with a brand new node. */
  if (had) { host._noTween = true; renderPromenadePixi(V(), host); }
  for (const n of orphans) if (!n.destroyed) n.destroy({ children: true });
}

function renderPromenadePixi(model, host) {
  // Who is in the sky rather than on the street. Read below, when the cast is
  // worked out, so a passenger is not also standing in their column.
  if (!host._aloft) host._aloft = new Set();
  const { coord, out: whereByPerson } = peoplePlaces(model);
  /*  AN EMPTY STREET GETS ONE BRICKLING ANYWAY.

      A panel with nobody in it is a panel that looks broken — the sky, the
      ground and a ribbon, and no reason to believe anything would ever appear
      there. So when the pile is empty the author walks it himself: one
      brickling, dressed from wear/michael-bricknell.png if there is one and
      the default if there is not, standing in the Promenade like anybody
      unplaced.

      He is a stand-in, not a record. He is in no pile, he is written to
      nothing, and the moment you declare a single person he is gone — which is
      also why the footer still says the street is empty while he is on it.
      Reporting one brickling would be the panel lying about your research to
      make itself look busy. */
  const HOUSE_BRICKLING = { slug: "michael-bricknell", name: "Michael Bricknell",
                            declared: true, detail: "" };

  /*  Passengers stay in the cast.

      Taking them out of it was the tidier-looking choice and the wrong one:
      a walker that is not in host._walkers has no drag, no drop, no name and
      no way down, so a passenger could be lifted off the balloon and then
      belonged nowhere — the release found no walker and did nothing at all.

      They keep their place in their column too. It is held open for them
      rather than closing up and reopening, which is both less work and a
      better answer to "where was that person" while they are in the air. */
  const declared = (model.people || []).filter(p => p.declared);
  const noneDeclared = !declared.length;
  const people = noneDeclared ? [HOUSE_BRICKLING] : declared;
  const P = window.PIXI;

  /*  Zoom scales the world, not the camera: spacing, figures and lettering
      all grow together, so 3× is a closer walk down the same street rather
      than a magnified screenshot of it. Pixel art has no in-between sizes
      worth having, so the steps are whole numbers. */
  const Z = host._zoom || 1;
  const GRID = host._view === "grid";

  /*  Two arrangements of the same cast.

      STREET is geography: west to east, everyone standing where the records
      put them, the distance between two figures meaning something.

      GRID is an isotype board — the old pictogram trick of one figure per
      person, ranked and counted. Distance means nothing there, so it can be
      sorted by anything you like, and it answers "how many, and when" where
      the street answers "where". They walk on the spot in both, because a
      figure frozen mid-stride reads as a corpse. */
  const SORTS = {
    lng:  { label: "west→east", of: p => (host._lngOf.get(p.slug) ?? Infinity) },
    year: { label: "earliest first", of: p => (p.birthYear ?? p.deathYear ?? Infinity) },
    name: { label: "A→Z", of: p => p.name.toLowerCase() },
  };

  /*  The street, narrowed to whatever you searched for.

      Filtering the columns rather than dimming them, because the point is to
      shorten the walk: a match two parishes wide is a street two parishes
      long. Anyone placed in a column that is filtered out goes back to the pen
      for the duration — their placement is untouched and returns with them
      when you clear the box. */
  const placeQ = host._placeQuery || "";
  const placeName = slug => {
    const e = (model.entities || []).find(k => k.slug === slug);
    return ((e && e.name) || slug).toLowerCase();
  };
  const placed = [...coord.entries()]
    .filter(([slug]) => !placeQ || placeName(slug).includes(placeQ) ||
                        slug.toLowerCase().includes(placeQ))
    .sort((a, b) => a[1].lng - b[1].lng);

  /*  With nowhere on the map, the street itself is the one place.

      A pile with no coordinates had no columns and therefore nowhere to drop
      anybody — the one arrangement this panel exists to let you make. Rather
      than inventing a column per declared place, which claims a geography
      nobody gave, there is a single unnamed column: the promenade. Group
      people in it, and when you geocode a place later the real columns appear
      and the grouping is still there. */
  /*  Your own columns, after the places. They have no coordinates by
      definition, so they cannot be ordered by geography — they keep the order
      you made them in, which is at least an order you chose. */
  for (const g of PROM_GROUPS) {
    if (!placeQ || g.name.toLowerCase().includes(placeQ) || g.slug.includes(placeQ)) {
      placed.push([g.slug, null]);
    }
  }

  /*  THE PROMENADE ITSELF — always a column, never a place.

      The named places take the room their crowds need; whatever is left over
      IS the promenade, and it is where somebody stands when you have decided
      they belong together but not that they belong anywhere on the map. It is
      not a fallback for a pile with no coordinates — it is there beside the
      parishes whether they exist or not, because "these people, not anywhere
      in particular" is a grouping in its own right. */
  const PROMENADE = "";
  placed.push([PROMENADE, null]);
  const STEP = (GRID ? 74 : 110) * Z, PAD = 70 * Z, GROUND = 0.72;

  /*  Columns widen to hold their crowd.

      A place with ten people in it needs more room than a place with one, and
      a fixed column would either waste space everywhere or overflow wherever
      you put a family. So each column is sized to its occupancy and the street
      is laid out cumulatively — the parishes stay in west-to-east order, they
      just take the room they need.

      Only people you have PLACED count. Someone standing at the average of
      three parishes belongs to none of them and does not swell any column. */
  /*  Tuned so the growth is visible rather than theoretical. At the previous
      15+40 a column of five came out 115 against a 110 minimum — arithmetically
      wider, indistinguishable by eye. These give roughly 110 for one or two,
      160 for five, 270 for ten. */
  const SPACING = 22 * Z, GUTTER = 50 * Z;
  const occ = new Map();
  if (host._pinned) {
    for (const place of host._pinned.values()) occ.set(place, (occ.get(place) || 0) + 1);
  }
  /*  The one fallback column IS the street, so it takes the whole view rather
      than standing as a narrow strip with empty ground either side. A real
      place is sized to its crowd; the promenade is sized to the panel. */
  const widthOf = slug => Math.max(STEP, (occ.get(slug) || 0) * SPACING + GUTTER);

  /*  The places are sized to their crowds; the promenade takes the rest of the
      view. Never less than its own crowd needs, so a busy promenade on a
      narrow panel still holds everyone — it stops being "the leftover" and
      starts being a column like any other, which is the honest thing for it to
      do once there are twenty people in it.

      host.clientWidth, not app.screen.width: the layout is worked out before
      the Pixi application exists, and reaching for `app` here threw before a
      single column was measured. */
  const xOf = new Map(), wOf = new Map();
  const named = placed.filter(([slug]) => slug !== PROMENADE);
  const takenByPlaces = named.reduce((n, [slug]) => n + widthOf(slug), 0);
  const view = (host.clientWidth || 600);
  const promW = Math.max(widthOf(PROMENADE), view - PAD * 2 - takenByPlaces);

  let cursor = PAD;
  for (const [slug] of placed) {
    const w = slug === PROMENADE ? promW : widthOf(slug);
    wOf.set(slug, w);
    xOf.set(slug, cursor + w / 2);      // the column's center
    cursor += w;
  }
  const unknownX = cursor;
  const worldW = cursor + PAD;

  if (!host._app) {
    const shell = document.createElement("div");
    shell.className = "pr-shell";
    host.innerHTML = "";
    host.appendChild(shell);
    const note = document.createElement("p");
    note.className = "hint pr-note";
    shell.appendChild(note);

    /*  THE CAPTION, AND THE WAY OUT OF PRETTY MODE.

        Both live outside the bare-mode rule below, for opposite reasons: the
        caption is the one piece of furniture a story needs, and the exit is
        the one control you must not be able to lose. Everything else on this
        panel is a tool for arranging the scene, and a scene being watched is
        not being arranged. */
    const say = document.createElement("div");
    say.className = "pr-say";
    say.hidden = true;
    shell.appendChild(say);
    host._say = text => {
      say.textContent = text || "";
      say.hidden = !text;
    };

    /*  One writer for the mode and its switch, the same bargain the drift
        button struck: the flag and the lit state are one fact, so a story that
        turns it on leaves the button showing on. */
    host._setPretty = on => {
      host._pretty = !!on;
      shell.classList.toggle("pr-bare", host._pretty);
      const b = shell.querySelector(".pr-bare-btn");
      if (b) {
        b.classList.toggle("on", host._pretty);
        b.title = host._pretty ? "show the controls again (Esc)"
                               : "hide the controls and just show the street";
      }
    };
    /*  Esc is the way out of every full-screen thing anybody has used, and it
        works without the pointer having to find a five-pixel button. The shell
        takes focus for it, which it needs for nothing else. */
    shell.tabIndex = -1;
    shell.addEventListener("keydown", ev => {
      if (ev.key === "Escape" && host._pretty) { host._setPretty(false); ev.stopPropagation(); }
    });

    /*  Whole-number steps only. Re-rendering is the right move here rather
        than scaling the stage: at 3× the walkers need more room between the
        signposts, not the same street enlarged until everyone overlaps. */
    /*  Plain + and −, not a cycling label. A single button that steps 1→2→3→1
        makes zooming out a three-press journey and gives no clue what is
        coming. Two buttons say what they do and stop at the ends. */
    const zoomOut = document.createElement("button");
    zoomOut.className = "pr-zoom pr-zoom-out";
    zoomOut.textContent = "−";
    const zoom = document.createElement("button");
    zoom.className = "pr-zoom";
    zoom.textContent = "+";
    /*  Street or grid, and how the grid is ranked. The sort only appears in
        the grid, because on the street the order is the geography — offering
        to re-sort it would be offering to move Perth. */
    const modeBtn = document.createElement("button");
    modeBtn.className = "pr-zoom pr-mode";
    const sortSel = document.createElement("select");
    sortSel.className = "pr-sort";
    sortSel.innerHTML =
      '<option value="lng">west→east</option>' +
      '<option value="year">earliest first</option>' +
      '<option value="name">A→Z</option>';
    const syncMode = () => {
      modeBtn.textContent = host._view === "grid" ? "grid" : "street";
      sortSel.hidden = host._view !== "grid";
      sortSel.value = host._sort || "lng";
    };
    modeBtn.onclick = () => {
      host._view = host._view === "grid" ? "street" : "grid";
      /*  Placements survive the view change. Putting someone in Perth is a
          statement about who they belong with, not about where they stand in
          one particular arrangement — so the grid groups by it and the street
          stands them there. Clearing it here was throwing away the only thing
          the two views have in common. */
      syncMode();
      host._world.x = 0;   // the two layouts share no coordinates
      renderPromenadePixi(V(), host);
    };
    sortSel.onchange = () => {
      host._sort = sortSel.value;
      // A re-sort reorders within the groups; it does not dissolve them.
      renderPromenadePixi(V(), host);
    };
    /*  PRETTY MODE, BY HAND.

        Playing a story turns it on, which was the only way in: there was no
        way to simply look at the street without the tools for arranging it.
        Same button in reverse as the ✕ that lives inside bare mode, so
        whichever one you find gets you back. */
    const bareBtn = document.createElement("button");
    bareBtn.className = "pr-zoom pr-bare-btn";
    bareBtn.type = "button";
    bareBtn.textContent = "◱";
    bareBtn.title = "hide the controls and just show the street (Esc brings them back)";
    bareBtn.onclick = () => host._setPretty(!host._pretty);
    shell.appendChild(bareBtn);

    const driftBtn = document.createElement("button");
    driftBtn.className = "pr-zoom pr-drift on";
    driftBtn.textContent = "❚❚";
    host._driftBtn = driftBtn;
    /*  THE ONLY WRITER OF THE DRIFT STATE.

        There were five: the button, the idle timer, and three places that set
        `host._drift = false` by hand — the pan, the wheel, and picking somebody
        up. The three by hand never touched the button, so the street could be
        standing perfectly still with a pause icon showing, which is the panel
        telling you the opposite of what it is doing.

        The flag and the icon are one fact and now have one place that sets
        them. */
    host._setDrift = on => {
      host._drift = on;
      driftBtn.textContent = on ? "❚❚" : "▶";
      driftBtn.classList.toggle("on", on);
    };
    driftBtn.onclick = () => {
      clearTimeout(host._idleTimer);        // an explicit choice outranks the timer
      host._setDrift(!host._drift);
    };
    shell.appendChild(driftBtn);

    shell.appendChild(modeBtn);
    shell.appendChild(sortSel);
    host._syncMode = syncMode;
    syncMode();

    const ZOOM_MIN = 1, ZOOM_MAX = 4;
    const setZoom = next => {
      const z = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, next));
      if (z === (host._zoom || 1)) return;
      host._zoom = z;
      host._noTween = true;          // the coordinates are about to mean something else
      zoom.disabled = z >= ZOOM_MAX;
      zoomOut.disabled = z <= ZOOM_MIN;
      // Hold the middle of the view across the change, so zooming in does not
      // also teleport you to the west coast.
      const mid = (-host._world.x + host._app.screen.width / 2) / (host._worldW || 1);
      renderPromenadePixi(V(), host);
      host._world.x = Math.min(0, Math.max(-(host._worldW - host._app.screen.width),
        -(mid * host._worldW - host._app.screen.width / 2)));
    };
    zoom.onclick = () => setZoom((host._zoom || 1) + 1);
    zoomOut.onclick = () => setZoom((host._zoom || 1) - 1);
    zoomOut.disabled = true;                 // starts at 1×
    shell.appendChild(zoom);
    shell.appendChild(zoomOut);

    /*  Find anybody on the panel.

        It removes nobody: non-matches dim, and matches light up and show their
        name, so you can still see how many you are choosing from and where
        they are standing relative to everyone else. */
    /*  Columns you invent.

        A button rather than a field, because adding a group is something you
        do rarely and deliberately — a permanent input for it sat there asking
        to be filled in. Naming an existing group removes it, since there is
        nowhere sensible to hang a row of delete buttons over a street. Anyone
        standing in a removed group goes back to the pen: their placement
        referred to a column that no longer exists. */
    const groupBtn = document.createElement("button");
    groupBtn.textContent = "+ group";
    groupBtn.title = "a column of your own \u2014 a household, a theory, anything. " +
                     "Name an existing one to remove it.";
    /*  Named in a field on the bar, not in a native prompt().

        A prompt() that the browser has decided to suppress — and Chrome
        offers to suppress them after a page has thrown a few — returns null,
        which is indistinguishable from you pressing Cancel. So the button did
        nothing, said nothing, and there was no way to tell which of those had
        happened. A field cannot be switched off by a checkbox. */
    const groupIn = document.createElement("input");
    groupIn.type = "text";
    groupIn.className = "pr-groupin";
    groupIn.placeholder = "name a column…";
    groupIn.spellcheck = false;
    groupIn.hidden = true;
    groupIn.title = "Enter to add it. Naming one that already exists removes it. Esc to give up.";

    const closeGroupIn = () => { groupIn.hidden = true; groupIn.value = ""; };
    groupBtn.onclick = () => {
      groupIn.hidden = !groupIn.hidden;
      if (!groupIn.hidden) groupIn.focus();
    };
    groupIn.onkeydown = e => {
      if (e.key === "Escape") { closeGroupIn(); return; }
      if (e.key !== "Enter") return;
      const want = groupIn.value.trim();
      if (!want) { closeGroupIn(); return; }
      const slug = "grp-" + slugify(want);
      const at = PROM_GROUPS.findIndex(g => g.slug === slug);
      if (at === -1) PROM_GROUPS.push({ slug, name: want });
      else {
        /*  Naming one that exists removes it, and anyone standing in it goes
            back to the pen — their placement referred to a column that is no
            longer there. */
        PROM_GROUPS.splice(at, 1);
        for (const [uid, where] of [...host._pinned.entries()]) {
          if (where === slug) host._pinned.delete(uid);
        }
        if (host._savePins) host._savePins();
      }
      saveGroups();
      closeGroupIn();
      renderPromenadePixi(V(), host);
    };
    host._groupBtn = groupBtn;
    host._groupIn = groupIn;

    const penFind = document.createElement("input");
    penFind.type = "text";
    penFind.className = "pr-find";
    penFind.placeholder = "find a brickling or a place…";
    penFind.spellcheck = false;
    shell.appendChild(penFind);
    host._penFind = penFind;
    penFind.addEventListener("input", () => {
      /*  One box, both questions.

          "Find someone" and "filter to a place" were separate fields asking
          the same thing in two ways — you typed a word and had to decide which
          kind of answer you wanted before you knew what was there. Now the
          word is applied to both: matching people light up, and the columns
          narrow to matching places. */
      const q = penFind.value.trim().toLowerCase();
      host._penQuery = q;
      host._placeQuery = q;
      applyPenSearch(host);
      host._noTween = true;
      host._world.x = 0;       // the street just changed length
      renderPromenadePixi(V(), host);
    });

    /*  Save and load the sidecar.

        Save hands you a brick.json to drop beside your bricks; Load takes one
        back. Opening a research folder that already contains one reads it
        without asking, so these are for moving an arrangement between machines
        rather than everyday use. */
    const fileBar = document.createElement("div");
    fileBar.className = "pr-files";
    fileBar.innerHTML =
      '<button data-k="save" title="write a brick.json holding who you put where, ' +
      'the columns you made, their colors and the scene behind them \u2014 keep it ' +
      'beside your bricks">save scene</button>' +
      '<button data-k="load" title="read a brick.json back in, replacing the ' +
      'scene you are looking at">open\u2026</button>' +
      // Beside the file controls, since the questions it answers are mostly
      // "what file do I make, and what goes in it".
      '<a class="pr-doc" href="doc/promenade.html" target="_blank" rel="noopener"' +
      ' title="how to manage the promenade, and how to make its art">help</a>';
    // README.md covers the whole project; this button is the Promenade's own page.
    shell.appendChild(fileBar);
    /*  A SCENE IS A FILE, AND FILES NEED NAMES.

        This button always saved the street; what it could not do was save it
        twice. Everything landed as brick.json, so a second scene arrived as
        "brick (1).json" and you had a folder of arrangements you could not
        tell apart. Naming it writes <name>.scene.json instead, and the Story
        Maker reads any number of those and puts them in an order.

        Leaving the name empty still writes brick.json, because that is the
        file a research folder picks up on its own and it must stay one press
        away. */
    fileBar.querySelector('[data-k="save"]').onclick = () => {
      const name = (prompt(
        "Name this scene.\n\nLeave it empty to write the folder's brick.json instead.",
        "") || "").trim();
      const data = sidecarData(host);
      if (name) data.sceneName = name.slice(0, 60);
      downloadText(JSON.stringify(data, null, 2),
                   name ? slugify(name) + ".scene.json" : "brick.json",
                   "application/json");
    };
    fileBar.insertBefore(groupBtn, fileBar.firstChild);
    fileBar.insertBefore(groupIn, groupBtn.nextSibling);

    /*  The scene's own sky and ground.

        In the bar rather than behind a signpost, because it is the one
        backdrop with no column to select: the tint bar appears when you click
        a place, and there is nothing to click for "the whole street". Two
        swatches and a way back. */
    const bgBar = document.createElement("span");
    bgBar.className = "pr-bg";
    bgBar.innerHTML =
      '<span class="pr-bg-cap">scene</span>' +
      '<input type="color" data-k="sky" title="the sky behind the whole street">' +
      '<input type="color" data-k="ground" title="the ground everybody stands on">' +
      '<button data-k="night" class="pr-night" title="day or night — at night ' +
        'the marked windows light up">\u2600</button>' +
      /*  The day's air, which every chimney on the street shares. */
      '<input type="range" data-k="wind" min="-1" max="1" step="0.05" ' +
        'class="pr-weather" title="wind \u2014 which way the smoke leans">' +
      '<button data-k="scenery" class="pr-scenery-btn" title="the weather ' +
        'behind the street">☁</button>' +
      '<button data-k="reset" title="back to the street’s own colors">↺</button>';
    fileBar.insertBefore(bgBar, groupBtn.nextSibling);

    /*  THE SCENERY BAR.

        Behind a button rather than in the bar, because the bar is already
        nine controls wide and this is the least often touched thing on the
        panel. Built from SCENERY itself, so a new piece with `settings`
        appears here with no edit to this code.

        Sits where the tint bar sits and looks the same, because it is the
        same kind of thing: a strip of dials for the thing you just asked
        about, dismissed with an ×. */
    const skyBar = document.createElement("div");
    skyBar.className = "pr-tint pr-sky-bar";
    skyBar.hidden = true;
    skyBar.innerHTML = SCENERY.map(piece =>
      '<span class="pr-sky-piece" data-p="' + piece.id + '">' +
        '<label class="pr-sky-on"><input type="checkbox" data-k="on">' +
          (piece.label || piece.id) + '</label>' +
        /*  Each dial says what it is. Three identical sliders in a row with
            the answer only in a tooltip is a guessing game, and the tooltip
            does not exist at all on a touch screen. */
        sceneryDefs(piece).map(d =>
          '<label class="pr-sky-dial" title="' + d.tip + '">' +
            '<span>' + d.tag + '</span>' +
            '<input type="range" data-k="' + d.k + '" min="' + d.min +
            '" max="' + d.max + '" step="' + d.step + '">' +
          '</label>').join("") +
      '</span>').join("") +
      '<button data-k="reset" title="back to the street’s own weather">↺</button>' +
      '<button data-k="close" title="done">×</button>';
    shell.appendChild(skyBar);

    const syncSkyBar = () => {
      for (const piece of SCENERY) {
        const row = skyBar.querySelector('[data-p="' + piece.id + '"]');
        if (!row) continue;
        row.querySelector('[data-k="on"]').checked = sceneryOn(piece);
        for (const d of sceneryDefs(piece)) {
          const box = row.querySelector('[data-k="' + d.k + '"]');
          //  Never while it is the thing under the pointer.
          if (box && document.activeElement !== box) {
            box.value = String(sceneryGet(piece, d.k));
          }
        }
      }
    };
    skyBar.addEventListener("input", e => {
      const row = e.target.closest("[data-p]");
      const k = e.target.dataset.k;
      if (!row || !k) return;
      const id = row.dataset.p;
      SCENE_SET.set(id + ":" + k,
        e.target.type === "checkbox" ? (e.target.checked ? 1 : 0)
                                     : Number(e.target.value));
      saveScenery();
      host._noTween = true;
      renderPromenadePixi(V(), host);
    });
    skyBar.querySelector('[data-k="reset"]').onclick = () => {
      SCENE_SET.clear();
      saveScenery();
      syncSkyBar();
      host._noTween = true;
      renderPromenadePixi(V(), host);
    };
    skyBar.querySelector('[data-k="close"]').onclick = () => { skyBar.hidden = true; };
    /*  The two bars stand in the same place, so only one is ever up. Opening
        this one lets the column go, which is what closes the other. */
    host._skyBar = skyBar;
    bgBar.querySelector('[data-k="scenery"]').onclick = () => {
      skyBar.hidden = !skyBar.hidden;
      if (skyBar.hidden) return;
      host._focus = null;
      host._focusKind = null;
      applyFocus(host);
      syncSkyBar();
    };
    /*  THROUGH THE DOOR.

        A door marked in a place's drawing is clickable, and what it opens is
        the one view the street cannot give you: who this place's records put
        here, and WHICH record did it.

        A figure standing in Comrie does not say whether it is there because of
        a birth, a census or a guess somebody typed at midnight. Out here
        everybody is a silhouette; through the door they are a list of claims
        with evidence against each one.

        BUILT FROM THE RECORDS, NOT FROM THE SCENE. Where a figure is standing
        is an arrangement — you can drag people about — and the records are
        what is actually known. When the two disagree the records are right.
        It also means a place nobody is standing in still opens and still has
        something to say, which is exactly the place you most want to look at.

        An overlay rather than a panel of its own, because it belongs to the
        building you clicked and goes away when you are done with it. */
    /*  Built as nodes rather than as a string of HTML. Every value below comes
        out of somebody's brick file, and a name with an angle bracket in it
        would otherwise be markup. */
    const el = (tag, cls, parent) => {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (parent) parent.appendChild(n);
      return n;
    };
    const doorView = document.createElement("div");
    doorView.className = "pr-door";
    doorView.hidden = true;
    shell.appendChild(doorView);
    host._doorView = doorView;
    const closeDoor = () => { doorView.hidden = true; };

    host._openDoor = slug => {
      const m = V() || {};
      const byId = new Map((m.entities || []).map(e => [e.slug, e]));
      const here = byId.get(slug);
      /*  Every valid record naming this place, gathered per person it also
          names. One record can name three people and lands under all three,
          because it is evidence about each of them. */
      const rows = new Map();
      for (const b of m.records || []) {
        if (!b.valid || b.comment) continue;
        const named = [b.alias ? b.alias.slug : null, ...(b.links || [])].filter(Boolean);
        if (!named.includes(slug)) continue;
        for (const s of named) {
          const e = byId.get(s);
          if (!e || e.kind !== "person") continue;
          let list = rows.get(s);
          if (!list) rows.set(s, list = []);
          list.push(b);
        }
      }
      //  Undated last, because a record with no date cannot claim a position
      //  in a sequence and pretending otherwise invents an order.
      const when = b => b.date ? String(b.date) : "￿";
      const people = [...rows.entries()].sort((a, b2) => {
        const ka = a[1].map(when).sort()[0], kb = b2[1].map(when).sort()[0];
        return ka < kb ? -1 : ka > kb ? 1 : 0;
      });

      //  Every record naming the place, once each, for the chronology.
      const all = [];
      const seen = new Set();
      for (const b of m.records || []) {
        if (!b.valid || b.comment) continue;
        const named = [b.alias ? b.alias.slug : null, ...(b.links || [])].filter(Boolean);
        if (!named.includes(slug) || seen.has(b.lineNumber)) continue;
        seen.add(b.lineNumber);
        all.push({ b, who: named.filter(s => {
          const e = byId.get(s); return e && e.kind === "person";
        }) });
      }
      all.sort((x, y) => when(x.b) < when(y.b) ? -1 : when(x.b) > when(y.b) ? 1 : 0);

      /*  PUT HERE BY A RECORD, OR PUT HERE BY YOU.

          Two different claims, and the whole page runs on keeping them apart.
          A record naming somebody at this place is evidence. Dragging them
          into the column is an arrangement: useful, often right, and not the
          same thing at all.

          Built only from the records, this view could not see the second kind
          at all — drag somebody into a parish and the door said the room was
          empty. So anyone pinned here is listed too, and said to be pinned.
          Somebody can be both, and then the records do the talking. */
      const pinnedHere = [];
      if (host._pinned) {
        for (const [uid, where] of host._pinned) {
          if (where !== slug || rows.has(uid)) continue;
          /*  NOT EVERYONE STANDING HERE IS IN THE PILE.

              This asked the model whether the uid was a declared person, which
              quietly dropped the one person who is never declared: the house
              brickling, who exists so an empty street has somebody on it and
              is deliberately in no records at all. Pinned somewhere, he
              vanished from the room he was standing in.

              Being pinned is itself the claim. Anything the model does know
              about still has to be a person, because the pins are keyed by
              uid and a place could in principle share one. */
          const e = byId.get(uid);
          if (!e || e.kind === "person") pinnedHere.push(uid);
        }
      }

      /*  ONE ROOM, TWO WAYS OF STANDING IN IT.

          By person answers "who was here, and what puts them here" — the
          census question, one household at a time. Chronology answers "what
          happened here, in order" — the parish register question, which is
          the same records read down the page instead of across it.

          Neither is a subset of the other and both are one sort away from the
          same list, so they are a switch rather than two panels. */
      const line = (parent, b, extra) => {
        const li = el("li", b.status === "verified" ? "is-sure" : "is-draft", parent);
        el("span", "pr-door-icon", li).textContent = b.icon || "•";
        el("span", "pr-door-when", li).textContent = b.date || "—";
        el("span", "pr-door-what", li).textContent =
          extra || [b.name, b.detail].filter(Boolean).join(" · ") || b.type || "";
        //  The line itself, for when the summary is not enough.
        li.title = b.raw;
        return li;
      };
      //  titleCase for anybody the model has never heard of, which is how the
      //  rest of the page writes a bare uid rather than printing the slug raw.
      const nameOf = s => { const e = byId.get(s); return (e && e.name) || titleCase(s); };

      const draw = () => {
        doorView.replaceChildren();
        const head = el("div", "pr-door-head", doorView);
        el("span", "pr-door-name", head).textContent =
          (here && here.name) || groupNameOf(slug) || slug || "The Promenade";
        const tabs = el("span", "pr-door-tabs", head);
        for (const [mode, label, tip] of [
          ["people", "who", "who was here, and what puts them here"],
          ["time", "when", "everything that happened here, in order"],
        ]) {
          const tb = el("button", host._doorMode === mode ? "on" : "", tabs);
          tb.textContent = label;
          tb.title = tip;
          tb.onclick = () => { host._doorMode = mode; draw(); };
        }
        const shut = el("button", "pr-door-x", head);
        shut.textContent = "×";
        shut.title = "close";
        shut.onclick = closeDoor;

        const count = el("div", "pr-door-count", doorView);
        //  Counts the two kinds separately, because they are two claims.
        count.textContent = host._doorMode === "time"
          ? all.length + (all.length === 1 ? " record" : " records")
          : [people.length ? people.length + " by their records" : "",
             pinnedHere.length ? pinnedHere.length + " visiting" : "",
            ].filter(Boolean).join(" · ") || "nobody yet";

        const body = el("div", "pr-door-body", doorView);
        if (!all.length && !pinnedHere.length) {
          /*  Says which of the two it is. "Nothing here" reads as a failure;
              the truth is usually that the place is declared and nothing has
              been linked to it yet, which is a lead rather than a fault. */
          el("p", "pr-door-empty", body).textContent =
            "No record names this place yet.";
          return;
        }

        if (host._doorMode === "time") {
          const ul = el("ul", "pr-door-recs pr-door-flat", body);
          for (const { b, who } of all) {
            line(ul, b, [b.name, b.detail].filter(Boolean).join(" · ") || b.type || "");
            if (who.length) {
              const sub = el("li", "pr-door-named", ul);
              sub.textContent = who.map(nameOf).join(", ");
            }
          }
          return;
        }

        if (!people.length && !pinnedHere.length) {
          el("p", "pr-door-empty", body).textContent =
            "Records name this place, but none of them name a person.";
          return;
        }
        //  One row builder for both kinds, since the difference is what goes
        //  under the name rather than how the name is written.
        const personRow = (who, bricks) => {
          const row = el("div", "pr-door-row", body);
          const nm = el("button", "pr-door-who", row);
          nm.textContent = nameOf(who);
          nm.title = "focus on " + nameOf(who);
          //  The same focus a click on the street gives, so the two ways in
          //  agree with each other.
          nm.onclick = () => { closeDoor(); toggleFocus(host, "person", who); };
          if (!bricks) {
            /*  A VISITOR, NOT A PERSON WITH MISSING EVIDENCE.

                Dragging somebody into a column is not a failed citation: they
                are here, and they are not from here.

                The line under the name carries WHERE THEY CAME FROM and
                nothing else. It used to say "visiting" as well, under a count
                that already said "1 visiting", so the one fact on screen was
                printed twice; and where there was no origin to give, the row
                said "visiting" under a heading that said "visiting". Somebody
                the records place nowhere gets no second line at all, because
                there is nothing more to say about them than their name. */
            const rel = host._related && host._related.byPerson;
            const homes = rel ? (rel.get(who) || new Set()) : new Set();
            const from = [...homes].filter(s => s !== slug).map(nameOf);
            if (!from.length) return;
            const ul = el("ul", "pr-door-recs", row);
            const li = el("li", "is-visit", ul);
            el("span", "pr-door-what", li).textContent = "from " + from.join(", ");
            li.title = "you placed them here. Their records put them in "
                     + from.join(", ");
            return;
          }
          const ul = el("ul", "pr-door-recs", row);
          for (const b of bricks.slice().sort((x, y) => when(x) < when(y) ? -1 : 1)) {
            line(ul, b);
          }
        };
        for (const [who, bricks] of people) personRow(who, bricks);
        /*  The hand-placed come after the evidenced, always. It is the same
            order the page argues in everywhere else: what a document says
            first, what somebody decided second. */
        for (const who of pinnedHere) personRow(who, null);
      };
      if (!host._doorMode) host._doorMode = "people";
      draw();
      doorView.hidden = false;
    };
    //  Shows the hour that is on screen, which is the one the pickers edit.

    const syncBgBar = () => {
      const now = sceneColors();
      bgBar.querySelector('[data-k="sky"]').value = now.sky;
      bgBar.querySelector('[data-k="ground"]').value = now.ground;
    };
    const redrawScene = () => {
      saveSceneBg();
      host._noTween = true;
      renderPromenadePixi(V(), host);
    };
    bgBar.addEventListener("input", e => {
      const k = e.target.dataset.k;
      if (k !== "sky" && k !== "ground") return;
      //  Into the hour on screen. Setting the sky at night sets the night sky.
      (NIGHT ? SCENE_BG_NIGHT : SCENE_BG)[k] = e.target.value;
      redrawScene();
    });
    /*  NIGHT IS NOT A THEME.

        The panel's own light or dark says what the room you are sitting in is
        like. This says what time it is on the street, which is a fact about
        the scene and nothing to do with the room. So it is its own switch,
        beside the sky and the ground it changes.

        Every scene image has to be read again, because the marked windows are
        repainted on the way in — the cache is holding daylight. */
    const windIn = bgBar.querySelector('[data-k="wind"]');
    const syncWeather = () => {
      if (document.activeElement !== windIn) windIn.value = String(WEATHER.wind);
    };
    const writeWeather = () => {
      WEATHER = { wind: Number(windIn.value) };
      saveWeather();
      //  No rebuild. The ticker reads these every frame, so a drag of the
      //  slider shows on the next one.
    };
    windIn.addEventListener("input", writeWeather);
    syncWeather();

    const nightBtn = bgBar.querySelector('[data-k="night"]');
    const syncNight = () => {
      nightBtn.textContent = NIGHT ? "\u263e" : "\u2600";
      nightBtn.classList.toggle("on", NIGHT);
      nightBtn.title = NIGHT ? "night — press for day" : "day — press for night";
    };
    /*  One flip, two ways in. The bar button and the sun in the sky both call
        this, so they cannot come apart the way the drift button and the idle
        timer did. */
    host._toggleNight = () => {
      NIGHT = !NIGHT;
      saveNight();
      syncNight();
      resetSceneCache();
      syncBgBar();
      redrawScene();
    };
    nightBtn.onclick = () => host._toggleNight();
    syncNight();

    /*  This hour only. Resetting the night sky should not undo the daylight
        you spent ten minutes on. */
    bgBar.querySelector('[data-k="reset"]').onclick = () => {
      if (NIGHT) SCENE_BG_NIGHT = { ...SCENE_BG_NIGHT_DEFAULT };
      else SCENE_BG = { ...SCENE_BG_DEFAULT };
      syncBgBar();
      redrawScene();
    };
    syncBgBar();
    host._syncSceneBg = syncBgBar;   // an opened sidecar can bring its own
    fileBar.querySelector('[data-k="load"]').onclick = () => {
      const inp = document.createElement("input");
      inp.type = "file";
      inp.accept = ".json,application/json";
      inp.onchange = () => {
        const f = inp.files && inp.files[0];
        if (!f) return;
        f.text().then(txt => {
          const got = applySidecar(txt, host);
          const note = host.querySelector(".pr-note");
          if (note) {
            note.textContent = got
              ? got.pins + " placed, " + got.tints + " colored"
              : "that file is not valid JSON";
          }
          host._noTween = true;
          renderPromenadePixi(V(), host);
        });
      };
      inp.click();
    };

    /*  Color the selected column.

        Only visible when a place is actually selected, because a color picker
        with nothing to color is a puzzle. Click a signpost and it appears
        naming that place; click away and it goes. Two stops and a clear —
        which is the whole of what a backdrop needs. */
    const tintBar = document.createElement("div");
    tintBar.className = "pr-tint";
    tintBar.hidden = true;
    tintBar.innerHTML =
      '<span class="pr-tint-name"></span>' +
      '<input type="color" data-k="from" value="#1d2c38">' +
      '<input type="color" data-k="to" value="#1a1f18">' +
      '<input type="range" data-k="alpha" min="0" max="1" step="0.05" value="1" ' +
        'title="how strongly it shows">' +
      /*  The ribbon's own color, shown only for the columns that HAVE a
          ribbon. A place has a signpost and there is nothing here to paint,
          so the control goes away rather than sitting there doing nothing. */
      '<input type="color" data-k="ribbon" class="pr-ribbon" ' +
        'title="the color of this column\u2019s ribbon">' +
      /*  RESET IS ↺, CLOSE IS ×.

          They were the same button. The × threw the colours away, which is
          not what an × means anywhere else on this panel or anywhere else at
          all — every other × here shuts a thing, and the scene bar three
          controls along already uses ↺ for exactly this reset. So somebody
          finished choosing a colour, pressed the obvious button to put the
          picker away, and lost the colour they had just chosen. */
      '<button data-k="reset" title="no gradient for this place">↺</button>' +
      /*  TWO BOXES, NOT ONE BOX AND A SWITCH.

          A switch made them one note that could be in either place, so writing
          the second thing you wanted to say overwrote the first. They are two
          notes about two different questions — what this place is, and what
          happened there — and the controls say so by being two. Stacked in the
          order they appear on the street, so the top box is the top line. */
      '<span class="pr-notes">' +
        '<input type="text" data-k="above" class="pr-note-in" ' +
          'maxlength="400" placeholder="over the roof\u2026" ' +
          'title="shown above this column">' +
        '<input type="text" data-k="below" class="pr-note-in" ' +
          'maxlength="400" placeholder="on the ground\u2026" ' +
          'title="shown below this column">' +
      '</span>' +
      /*  A column's own smoke, beside its notes: both are decisions about this
          place rather than about the street. */
      '<span class="pr-smoke">' +
        '<input type="color" data-k="smokeink" title="the colour of this ' +
          'place\u2019s smoke">' +
        '<input type="range" data-k="smokethick" min="0" max="1" step="0.05" ' +
          'title="how thick the smoke is">' +
        '<input type="range" data-k="smokefade" min="0" max="1" step="0.05" ' +
          'title="how fast it gives up. Low is a plume, high is a wisp">' +
      '</span>' +
      '<button data-k="close" title="done">×</button>';
    shell.appendChild(tintBar);
    host._tintBar = tintBar;

    const readTint = () => {
      const slug = host._focusKind === "column" ? host._focus : null;
      // "" is the promenade — a real column and a valid key, so this has to
      // test for null rather than for falsiness.
      if (slug === null) return null;
      return COLUMN_TINT.get(slug) || { from: "#1d2c38", to: "#1a1f18", alpha: 1 };
    };
    tintBar.addEventListener("input", e => {
      const slug = host._focusKind === "column" ? host._focus : null;
      if (slug === null || !e.target.dataset.k) return;
      const cur = readTint();
      const next = { from: cur.from, to: cur.to,
                     alpha: cur.alpha === undefined ? 1 : cur.alpha };
      const k = e.target.dataset.k;
      /*  The ribbon is not part of the gradient — it is the label, not the
          backdrop — so it is stored and saved separately even though the two
          controls share a bar. */
      if (k === "ribbon") {
        RIBBON.set(slug, e.target.value);
        saveRibbons();
        host._noTween = true;
        renderPromenadePixi(V(), host);
        return;
      }
      /*  THREE CONTROLS ARE THE GRADIENT. THE REST ARE NOT.

          This listener is on the whole bar, so it hears every control in it:
          the smoke colour, both smoke sliders and both note boxes as well as
          the two swatches and the alpha. Every one of those already has its
          own writer a few lines down, and this was writing them a second time
          into the gradient's record — a smoke slider left `smokethick` sitting
          in a column tint.

          Far worse than the stray key: `next` starts from readTint(), which
          hands back a FULL-STRENGTH DARK GRADIENT when the column has none.
          So nudging the smoke thickness, or typing a word in a note, silently
          switched on a backdrop nobody asked for, and the street went dark
          behind that column. Smoke and the sky it rises through were fighting
          because one control was quietly setting the other. */
      if (k !== "from" && k !== "to" && k !== "alpha") return;
      next[k] = k === "alpha" ? Number(e.target.value) : e.target.value;
      COLUMN_TINT.set(slug, next);
      saveColumnTints();
      host._noTween = true;
      renderPromenadePixi(V(), host);
    });
    tintBar.querySelector('[data-k="reset"]').onclick = () => {
      const slug = host._focusKind === "column" ? host._focus : null;
      if (slug === null) return;
      COLUMN_TINT.delete(slug);
      RIBBON.delete(slug);            // back to the street's own timber
      saveColumnTints();
      saveRibbons();
      host._noTween = true;
      renderPromenadePixi(V(), host);
    };
    /*  THE NOTE.

        Written as you type, because the point of it is watching the line land
        on the scene and finding out it is too long, or in the wrong place. A
        save button would put a round trip between the words and the answer. */
    const smokeInk = tintBar.querySelector('[data-k="smokeink"]');
    const smokeThick = tintBar.querySelector('[data-k="smokethick"]');
    const smokeFade = tintBar.querySelector('[data-k="smokefade"]');
    const writeSmoke = () => {
      const slug = host._focusKind === "column" ? host._focus : null;
      if (slug === null) return;
      const ink = smokeInk.value, thick = Number(smokeThick.value);
      const fade = Number(smokeFade.value);
      //  Back to the default rather than storing a copy of it.
      if (ink === SMOKE_DEFAULT.ink && thick === SMOKE_DEFAULT.thick
          && fade === SMOKE_DEFAULT.fade) SMOKE.delete(slug);
      else SMOKE.set(slug, { ink, thick, fade });
      saveSmoke();
      host._noTween = true;
      renderPromenadePixi(V(), host);
    };
    smokeInk.addEventListener("input", writeSmoke);
    smokeThick.addEventListener("input", writeSmoke);
    smokeFade.addEventListener("input", writeSmoke);

    const aboveIn = tintBar.querySelector('[data-k="above"]');
    const belowIn = tintBar.querySelector('[data-k="below"]');
    const writeNote = () => {
      const slug = host._focusKind === "column" ? host._focus : null;
      if (slug === null) return;
      const above = aboveIn.value.trim(), below = belowIn.value.trim();
      //  Nothing on either side is no note at all, not an empty one.
      if (!above && !below) COL_NOTE.delete(slug);
      else {
        //  Merged, not replaced: what it says and where you put it are two
        //  facts, and typing is only about one of them.
        const was = COL_NOTE.get(slug) || {};
        COL_NOTE.set(slug, { ...was, above, below });
      }
      saveColNotes();
      host._noTween = true;
      renderPromenadePixi(V(), host);
    };
    aboveIn.addEventListener("input", writeNote);
    belowIn.addEventListener("input", writeNote);

    /*  Letting the column go is what hides this bar — it appears because
        something is selected, so it leaves the same way. Nothing is changed
        and nothing is lost. */
    tintBar.querySelector('[data-k="close"]').onclick = () => {
      host._focus = null;
      host._focusKind = null;
      applyFocus(host);
    };

    host._syncTint = model2 => {
      /*  Any column can be colored, not only a parish.

          A group and the promenade are columns like any other — the whole
          point of clicking their signpost is to give that stretch of street a
          background. Restricting this to places meant the one thing a group's
          signpost could usefully do was the one thing it could not. */
      const isCol = host._focusKind === "column";
      // "" is the promenade, and a valid key — check the kind, not the slug.
      const slug = isCol ? host._focus : null;
      tintBar.hidden = !isCol || host._view === "grid";
      //  Both bars stand in the same corner, so picking a column puts the
      //  scenery one away rather than drawing one over the other.
      if (!tintBar.hidden && host._skyBar) host._skyBar.hidden = true;
      if (!isCol) return;
      const grp = slug ? groupNameOf(slug) : "The Promenade";
      const e = grp ? null : ((model2 || V()).entities || []).find(k => k.slug === slug);
      tintBar.querySelector(".pr-tint-name").textContent = grp || (e ? e.name : slug);
      const t = readTint();
      tintBar.querySelector('[data-k="from"]').value = t.from;
      tintBar.querySelector('[data-k="to"]').value = t.to;
      tintBar.querySelector('[data-k="alpha"]').value = t.alpha === undefined ? 1 : t.alpha;
      const rb = tintBar.querySelector('[data-k="ribbon"]');
      rb.hidden = !grp;               // only the columns that hang one
      rb.value = ribbonOf(slug);
      /*  Not while you are typing in it. This runs on every render, and a
          render happens on every keystroke — writing the value back mid-word
          fights the person holding the keyboard. */
      const sm = smokeOf(slug);
      if (document.activeElement !== smokeInk) smokeInk.value = sm.ink;
      if (document.activeElement !== smokeThick) smokeThick.value = String(sm.thick);
      if (document.activeElement !== smokeFade) smokeFade.value = String(sm.fade);
      const n = noteOf(slug);
      for (const at of ["above", "below"]) {
        const box = tintBar.querySelector('[data-k="' + at + '"]');
        if (document.activeElement !== box) box.value = n[at] || "";
      }
    };

    const app = new P.Application({
      backgroundAlpha: 0, antialias: false, autoDensity: true,
      resolution: window.devicePixelRatio || 1,
      width: shell.clientWidth || 600, height: shell.clientHeight || 150,
    });
    // Pixi 7 exposes the canvas as .view; append it, do not replace the shell.
    shell.appendChild(app.view);
    app.view.className = "pr-canvas";
    host._app = app;
    host._shell = shell;
    // The drawing itself. Every walker gets a recolored copy of this.
    host._wear = { body: makeBodySheet(), bottom: makeBottomSheet(),
                   top: makeTopSheet(), hat: makeHatSheet() };
    host._body = host._wear.body;                 // the bare figure, for reference
    // The fully dressed default, for anything wanting one finished figure.
    host._base = dressBody(ROWS.map(k => ({ img: host._wear[k], slot: k })));
    host._texCache = new Map();
    host._world = new P.Container();
    app.stage.addChild(host._world);

    /*  Drag to walk along the scene. A wheel works too, but a scene you can
        take hold of is the point of a promenade. */
    /*  Panning happens on the BACKGROUND, through Pixi's own events.
