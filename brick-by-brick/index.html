  right.insertBefore(palBox, penBar.nextSibling);

  const toolBar = el("div", "sp-row", right);
  el("span", "sp-cap", toolBar).textContent = "tool";
  /*  U+25AB and U+25AA are the WHITE and BLACK SMALL SQUARE — small is in the
      name, and they came out as specks beside the other glyphs. Their
      full-size counterparts say the same thing and can actually be seen. */
  const TOOLS = [
    ["pencil", "\u270E", "freehand"],
    ["line",   "\u2571", "straight line \u2014 drag from one end to the other"],
    ["rect",   "\u25A1", "box outline"],
    ["fill",   "\u25A0", "filled box"],
    ["move",   "\u2725", "nudge what is drawn — drag it into place"],
    ["copy",   "\u29C9", "drag a box to lift those pixels, then click to stamp them down"],
    ["guide",  "\u2220", "drag out a guide \u2014 shift snaps to 15\u00b0, right-click removes one"],
    /*  Spelled out, with the arrows still on it. A lone glyph in a row of
        glyphs made you hover to find out which one asked a question instead of
        making a mark, and this is the one tool that changes nothing. */
    ["measure", "\u2190measure\u2192", "how big is that \u2014 click a shape, or "
              + "drag across anything. Changes nothing."],
  ];
  const toolBtns = TOOLS.map(([id, glyph, tip]) => {
    /*  A word is not an icon: the square, oversized box that makes a pencil
        legible would only stretch a label. */
    const b = el("button", glyph.length > 2 ? null : "sp-tool", toolBar);
    b.type = "button"; b.textContent = glyph; b.title = tip;
    b.onclick = () => { tool = id; if (id !== "measure") measured = null; paint(); };
    return b;
  });

  /*  UNDO.

      `empty board` is one press and there is nothing underneath it, which is
      the case that asked for this — but an undo that only undoes one button is
      a strange thing to own, so it takes a copy before anything destructive:
      a stroke, a shape, a nudge, a resize, a dropped file, and the emptying.

      A copy of all five layers, not a diff. At 24x28x4 that is a few hundred
      kilobytes for a stack of twenty-four and it cannot get out of step with
      what is on the canvas, which a diff can. `layerCopy` does not carry the
      frame count across — it copies pixels — so that is put back by hand.

      Snapshots are taken at the START of a stroke, so one undo takes back one
      stroke rather than one pixel of one. */
  const UNDO_MAX = 24;
  const undos = [];
  const undoBtn = el("button", null, toolBar);
  undoBtn.type = "button"; undoBtn.textContent = "undo";
  undoBtn.title = "take back the last thing that changed the drawing \u2014 "
                + "including emptying the board";
  const snapshot = () => {
    const shot = {};
    for (const k of TARGETS) {
      shot[k] = layerCopy(layers[k]);
      shot[k].__frames = layers[k].__frames;
    }
    undos.push(shot);
    if (undos.length > UNDO_MAX) undos.shift();
    undoBtn.disabled = false;
  };
  undoBtn.onclick = () => {
    const shot = undos.pop();
    if (!shot) return;
    /*  Everything comes back touched. A restored layer is your work, and the
        name box must not be able to fetch a file over the top of it. */
    for (const k of TARGETS) { layers[k] = shot[k]; touched[k] = true; }
    undoBtn.disabled = !undos.length;
    syncSize(); paint();
  };
  undoBtn.disabled = true;

  /*  SCALE — what one pixel is worth, out in the world.

      A place is a building, and buildings come with real numbers attached: a
      door is about 7 feet, a storey about 10, a kirk tower whatever the record
      says. None of that helps while you are drawing unless you can turn it
      into pixels, and the only reference the panel offered was a person 28
      pixels tall and the arithmetic left to you.

      So: say what one pixel is worth and the panel answers the other question.
      Units are whatever you type — feet, metres, cubits — because the number
      is a ratio and the panel never needs to know what it is a ratio OF.

      Place only. A hat has no scale; it is 24 pixels across because that is
      how wide a hat is here, and inviting somebody to measure one in feet
      would be inviting nonsense. */
  const SCALE_KEY = "brick-by-brick:placescale:v1";
  let scale = { per: 0.25, unit: "ft" };
  try {
    const raw = JSON.parse(localStorage.getItem(SCALE_KEY) || "null");
    if (raw && +raw.per > 0 && typeof raw.unit === "string") {
      scale = { per: +raw.per, unit: raw.unit.slice(0, 4) };
    }
  } catch (e) { /* unavailable */ }
  const saveScale = () => {
    try { localStorage.setItem(SCALE_KEY, JSON.stringify(scale)); } catch (e) { /* unavailable */ }
  };

  const scaleBar = el("div", "sp-row", right);
  el("span", "sp-cap", scaleBar).textContent = "scale";
  el("span", "sp-x", scaleBar).textContent = "1px =";
  const perIn = el("input", "sp-num", scaleBar);
  perIn.type = "number"; perIn.min = "0"; perIn.step = "0.01";
  perIn.title = "how much of the world one pixel covers";
  const unitIn = el("input", "sp-unit", scaleBar);
  unitIn.type = "text"; unitIn.maxLength = 4;
  unitIn.title = "whatever you measure in \u2014 ft, m, yd";
  el("span", "sp-x", scaleBar).textContent = "\u00b7";
  const askIn = el("input", "sp-num", scaleBar);
  askIn.type = "number"; askIn.min = "0"; askIn.step = "any";
  askIn.title = "a real measurement to turn into pixels";
  const ansOut = el("span", "sp-ans", scaleBar);

  /*  Both directions from one ratio, so a number you already know can be
      drawn and a thing you have drawn can be read back. */
  const pxFor = v => (scale.per > 0 ? v / scale.per : 0);
  /*  AS MANY DECIMALS AS THE RATIO HAS.

      A whole number of cells times a two-decimal ratio is exact to two
      decimals: 9 cells at 0.25 ft is 2.25 ft, not 2.3. Rounding to one place
      was discarding a digit that was really there, and on a scale like 0.05
      it made neighbouring measurements read the same. Capped at six, past
      which nobody is measuring a wall. */
  const scaleDp = () => {
    const t = String(scale.per), dot = t.indexOf(".");
    return dot < 0 ? 0 : Math.min(6, t.length - dot - 1);
  };
  const realOf = n => +(n * scale.per).toFixed(scaleDp());
  const syncScale = () => {
    perIn.value = scale.per;
    unitIn.value = scale.unit;
    const v = parseFloat(askIn.value);
    ansOut.textContent = !(v >= 0)
      ? ""
      : scale.unit + " = " + Math.round(pxFor(v)) + "px";
  };
  perIn.oninput = () => {
    const v = parseFloat(perIn.value);
    if (v > 0) { scale.per = v; saveScale(); paint(); }
    syncScale();
  };
  unitIn.oninput = () => { scale.unit = unitIn.value.slice(0, 4); saveScale(); syncScale(); paint(); };
  askIn.oninput = syncScale;
  askIn.value = "40";
  syncScale();

  /*  A guide can be dragged out by eye, but a pitch you already know the
      number of should not have to be. This row is the same guide from the
      other end: type the angle, press +, and it lands on the middle cell —
      then drag it where it belongs with the same tool. */
  const guideBar = el("div", "sp-row", right);
  el("span", "sp-cap", guideBar).textContent = "angle";
  const gAng = el("input", "sp-num", guideBar);
  gAng.type = "number"; gAng.min = "0"; gAng.max = "179.9"; gAng.step = "1";
  gAng.value = "0";
  gAng.title = "angle in degrees \u2014 0 lies flat, 90 stands up, and up is to the right";
  el("span", "sp-x", guideBar).textContent = "\u00b0";
  const gAdd = el("button", null, guideBar);
  gAdd.type = "button"; gAdd.textContent = "+";
  gAdd.title = "a guide at that angle, through the middle";
  const gClear = el("button", null, guideBar);
  gClear.type = "button"; gClear.textContent = "clear";
  gClear.title = "remove every guide";
  const gNote = el("span", "sp-pal-note", guideBar);

  /*  Typing an angle re-aims the guide you last touched, so a line dragged
      roughly into place can be made exact without being drawn again. With no
      guide to aim, the number is simply what the next + will use. */
  let lastGuide = -1;
  gAng.oninput = () => {
    if (lastGuide < 0 || lastGuide >= guides.length) return;
    guides[lastGuide].deg = normDeg(parseFloat(gAng.value) || 0);
    saveGuides(); paint();
  };
  gAdd.onclick = () => {
    guides.push({ x: Math.floor(cellW() / 2), y: Math.floor(cellH() / 2),
                  deg: normDeg(parseFloat(gAng.value) || 0) });
    lastGuide = guides.length - 1;
    tool = "guide";
    saveGuides(); paint();
  };
  gClear.onclick = () => { guides = []; lastGuide = -1; saveGuides(); paint(); };

  // ---- and how it should look
  const optBar = el("div", "sp-row", right);
  const onionBtn = el("button", null, optBar);
  onionBtn.type = "button"; onionBtn.textContent = "ghost";
  onionBtn.title = "show what this has to sit with \u2014 the rest of the figure, "
                 + "or on a place the head-height line and the bricklings in the preview";
  onionBtn.onclick = () => { onion = !onion; paint(); };

  const curBtn = el("button", null, optBar);
  curBtn.type = "button"; curBtn.textContent = "cell cursor";
  curBtn.title = "hide the crosshair and let the outlined cell be the pointer \u2014 "
               + "it shows which square you are actually on";
  curBtn.onclick = () => {
    cellCursor = !cellCursor;
    try { localStorage.setItem(CURSOR_KEY, cellCursor ? "1" : "0"); } catch (e) { /* unavailable */ }
    paint();
  };

  const gridBtn = el("button", null, optBar);
  gridBtn.type = "button"; gridBtn.textContent = "grid";
  gridBtn.title = "rule every cell, with a firmer line every fourth";
  gridBtn.onclick = () => { gridOn = !gridOn; paint(); };

  const axesBtn = el("button", null, optBar);
  axesBtn.type = "button"; axesBtn.textContent = "center";
  axesBtn.title = "the center lines \u2014 every layer is centered on the vertical one";
  axesBtn.onclick = () => { axesOn = !axesOn; paint(); };

  const linkBtn = el("button", null, optBar);
  //  "all frames" named the scope and left out the verb, which is the half
  //  that says this is a drawing mode and not another view switch.
  linkBtn.type = "button"; linkBtn.textContent = "paint all frames";
  linkBtn.title = "a stroke goes into every frame at once. Drawing only \u2014 move works on one frame.";
  linkBtn.onclick = () => { linked = !linked; paint(); };
  const frameBar = el("span", null, optBar);
  /*  After the frame numbers, because it is a statement about them: these are
      the frames, and this says whether a stroke goes into all of them. Before
      them it read as another view toggle sitting next to "ghost". */
  optBar.appendChild(linkBtn);

  // ---- the render example
  const prevWrap = el("div", "sp-preview", right);
  /*  The backdrop it stands against. Kept in the browser, because it is a
      preference about looking rather than anything about the drawing. */
  /*  THE GRID'S OWN COLOUR.

      The squares behind the drawing were a fixed near-black, chosen so a
      bright sprite would sit on them. That is the wrong way round for anyone
      painting a dark colour: a brown boot on a brown-black grid is a boot you
      cannot see well enough to draw. So the grid is yours — go pale and dark
      colours read.

      One colour, not two. The second square is derived, and only a nudge away
      from the first, because the checker is there to say "nothing is drawn
      here" and not to compete with what is. The nudge is smaller on a pale
      grid than a dark one, where the same proportion reads as a hard stripe.

      Kept in the browser, like the preview's backdrop: it is a preference
      about looking, reaches no file, and cannot land in an export. */
  const GRIDBG_KEY = "brick-by-brick:gridbg:v1";
  const GRIDBG_DEFAULT = "#20241c";
  let gridBg = GRIDBG_DEFAULT;
  try {
    const raw = localStorage.getItem(GRIDBG_KEY);
    if (raw && /^#[0-9a-f]{6}$/i.test(raw)) gridBg = raw;
  } catch (e) { /* unavailable */ }
  const gridLight = () => lumOf(hexInt(gridBg)) > 0.5;
  const gridOther = () => shadeHex(gridBg, gridLight() ? -0.09 : -0.28);
  /*  Rules and axes have to be drawn in something that survives the squares
      they are drawn over — white lines on a white grid are no lines at all. */
  const gridInk = a => (gridLight() ? "rgba(0,0,0," : "rgba(255,255,255,") + a + ")";

  const BG_KEY = "brick-by-brick:spritebg:v1";
  let bg = { sky: "#1d2c38", ground: "#1a1f18" };
  try {
    const raw = JSON.parse(localStorage.getItem(BG_KEY) || "null");
    if (raw && /^#[0-9a-f]{6}$/i.test(raw.sky) && /^#[0-9a-f]{6}$/i.test(raw.ground)) bg = raw;
  } catch (e) { /* unavailable */ }
  const applyBg = () => {
    prevWrap.style.setProperty("--sp-sky", bg.sky);
    prevWrap.style.setProperty("--sp-ground", bg.ground);
    try { localStorage.setItem(BG_KEY, JSON.stringify(bg)); } catch (e) { /* unavailable */ }
  };
  const prev = el("canvas", null, prevWrap);
  const prev1 = el("canvas", "sp-true", prevWrap);

  /*  Size sits under the preview, not above the canvas: it is a thing you
      adjust while looking at the result, not before you start. */
  right.appendChild(sizeBar);

  const bgBar = el("div", "sp-row", right);
  el("span", "sp-cap", bgBar).textContent = "backdrop";
  const bgWrap = el("span", "sp-bg", bgBar);
  const skyIn = el("input", null, bgWrap), groundIn = el("input", null, bgWrap);
  skyIn.type = groundIn.type = "color";
  skyIn.title = "sky"; groundIn.title = "ground";
  skyIn.value = bg.sky; groundIn.value = bg.ground;
  skyIn.oninput = () => { bg.sky = skyIn.value; applyBg(); };
  groundIn.oninput = () => { bg.ground = groundIn.value; applyBg(); };
  const bgReset = el("button", null, bgWrap);
  bgReset.type = "button"; bgReset.textContent = "\u21ba";
  bgReset.title = "back to the street's own colors";
  bgReset.onclick = () => {
    bg = { sky: "#1d2c38", ground: "#1a1f18" };
    skyIn.value = bg.sky; groundIn.value = bg.ground; applyBg();
    gridBg = GRIDBG_DEFAULT; gridIn.value = gridBg; saveGridBg(); paint();
  };
  applyBg();

  /*  In with the backdrop, because both are the same kind of thing: what you
      are looking AT something against, rather than anything about the drawing
      itself. Neither leaves this browser and neither reaches the PNG. */
  el("span", "sp-cap", bgBar).textContent = "grid";
  const gridWrap = el("span", "sp-bg", bgBar);
  const gridIn = el("input", null, gridWrap);
  gridIn.type = "color"; gridIn.value = gridBg;
  gridIn.title = "the squares behind the drawing \u2014 go pale when you are "
               + "painting dark colours and cannot tell them apart";
  const saveGridBg = () => {
    try { localStorage.setItem(GRIDBG_KEY, gridBg); } catch (e) { /* unavailable */ }
  };
  gridIn.oninput = () => { gridBg = gridIn.value; saveGridBg(); paint(); };

  /*  Who this is for — and the whole of the filename, since a wardrobe is one
      file. Which layer you are drawing is a row inside it, not a name. */
  const nameBar = el("div", "sp-row", right);
  el("span", "sp-cap", nameBar).textContent = "for";
  const nameIn = el("input", null, nameBar);
  nameIn.type = "text"; nameIn.className = "sp-name";
  nameIn.placeholder = "mill-worker";
  nameIn.spellcheck = false;
  nameIn.title = "a person's uid, a trade, or \u201cdefault\u201d for everybody";
  /*  Settled, not per keystroke. Every pass asks for up to six files, and
      typing "mill-worker" one letter at a time asked for sixty-odd, all but
      the last set 404s for names that were only ever half-typed. */
  let nameWait = 0;
  nameIn.oninput = () => {
    clearTimeout(nameWait);
    nameWait = setTimeout(() => { openExisting(); paint(); }, 220);
    paint();                       // the filename under the box keeps up
  };
  const nameOut = el("span", "sp-filename", nameBar);

  const outBar = el("div", "sp-row", right);
  /*  Parented here and moved to the frame row below, where the preview it
      starts and stops actually is. It was in the export row for no better
      reason than that the export row came last. */
  const playBtn = el("button", null, outBar);
  /*  A word, not a glyph. This was U+275A twice — two heavy vertical bars,
      which is what a pause symbol is made of but not what one looks like at
      eleven pixels beside a row of numbers. The label says what pressing it
      does, so it reads "pause" while the walk is running. */
  playBtn.type = "button"; playBtn.textContent = "play";
  playBtn.title = "stop or start the walk in the preview";
  playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? "pause" : "play"; };
  const dl = el("button", null, outBar);
  dl.type = "button"; dl.textContent = "download";
  dl.title = "save all four rows as one wardrobe PNG";
  const save = (canvas, name) => canvas.toBlob(b => {
    const a2 = document.createElement("a");
    a2.href = URL.createObjectURL(b);
    a2.download = name;
    a2.click();
    setTimeout(() => URL.revokeObjectURL(a2.href), 1000);
  });
  // Drop either in images/wear/ and anyone whose uid or trade matches is
  // wearing it on the next load.
  dl.onclick = () => save(isPlace() ? layers.place : stitchSheet(), fileName());
  /*  Straight onto the street, without a deploy.

      The same PNG the download button hands you, kept in the browser under the
      path the loader would have asked the server for. The Promenade reads it
      on the next render, so a hat you have just drawn is on somebody within a
      second — and if you decide it is worth keeping, the Art panel will still
      give you the file to commit. */
  const keep = el("button", null, outBar);
  /*  It was "to page", which named the mechanism — the drawing is held by this
      page — and not the outcome. What you actually want to know is where it
      turns up, and the answer is the Promenade: a wearer walks in it, a place
      stands behind its column. Both land in the same scene, so the button can
      name it. */
  keep.type = "button"; keep.textContent = "to promenade";
  keep.onclick = () => {
    const cv = isPlace() ? layers.place : stitchSheet();
    const path = (isPlace() ? "places/" : "wear/") + fileName();
    const ok = putLocalArt(path, cv.toDataURL("image/png"));
    hint.textContent = ok === false
      ? "no room left in this browser to keep that — download it instead"
      : "kept as " + path + " — on the street until you clear it";
  };
  keep.title = "put it straight into the scene \u2014 held in this browser only, "
             + "with nothing written to disk and nothing deployed";
  /*  Nothing at all, on purpose.

      `reset` puts a layer back to what it was BEFORE you drew — which for a
      wearer is the built-in figure, not an empty grid. There was no way to
      start from nothing, and drawing your own person meant rubbing out
      somebody else's first.

      Every row, not just the one showing: an outfit is four rows, and blanking
      one at a time leaves you three-quarters dressed as the default. They are
      marked touched afterwards, or the editor would helpfully fill them back
      in from disk the moment the name box changed — a blank layer is a
      decision, and it has to look like one. */
  const blank = el("button", null, outBar);
  blank.type = "button"; blank.textContent = "empty board";
  blank.title = "back to nothing \u2014 every item, all frames, with no figure "
              + "underneath to rub out first";
  blank.onclick = () => {
    snapshot();
    const wipe = cv => cv.getContext("2d").clearRect(0, 0, cv.width, cv.height);
    for (const k of (isPlace() ? ["place"] : ROWS)) { wipe(layers[k]); touched[k] = true; }
    paint();
  };

  const hint = el("p", "hint sp-hint", right);

  /*  THE NAMING CONVENTION, WRITTEN DOWN WHERE IT IS USED.

      Nothing here is configured: a drawing reaches a brickling or a column by
      being named after them. That is the whole mechanism, and it was knowledge
      you had to already have — the panel showed you the filename it would
      write and never said what made that filename find anybody.

      Read straight off `outfitFor`, so it cannot drift from the loader: a
      person is dressed from their own uid first, then their trade, then
      default, and within each of those a loose row beats that wearer's
      sheet. */
  const conv = el("div", "sp-conv", right);
  conv.innerHTML =
    '<b>naming</b>'
    + '<dl>'
    + '<dt>wear/<i>who</i>.png</dt><dd>whole outfit</dd>'
    + '<dt>wear/<i>who</i>.<i>item</i>.png</dt><dd>one item, beats the outfit</dd>'
    + '<dt>places/<i>place</i>.png</dt><dd>behind that place</dd>'
    + '</dl>'
    + '<p><i>who</i>: uid, then trade, then <i>default</i></p>';

  /*  ARRANGED BY WHAT A CONTROL TOUCHES.

      The first attempt at this sorted the rows by how often they get used and
      hid the unpopular ones behind a button. That is not a structure, it is a
      popularity contest: the panel still held everything it held before, plus
      a button and a saved state to get wrong, and it separated `size` from
      `for` when those are the same decision made in the same breath.

      Three groups, and every control belongs to exactly one:

        the DRAWING   what a stroke does — tool, paint, all frames
        the VIEW      what you are looking at — none of it changes a pixel
        the FILE      who it is for and where it goes, below a rule

      Two rows stop existing rather than being hidden. Guides fold into the
      tool that makes them and appear only while that tool is up. The backdrop
      and cell colours join the view row, where they always belonged. */

  //  A stroke going into every frame is a DRAWING mode, not a view toggle. It
  //  sat beside "ghost" and read as one for as long as it was there.
  toolBar.appendChild(linkBtn);

  //  The frame you are on drives the preview, so it sits directly above it
  //  rather than at the end of a row of unrelated switches.
  const frameRow = el("div", "sp-row", right);
  //  Play leads the row: it is the verb, and "frame 1 2 3 4" is what it acts on.
  frameRow.appendChild(playBtn);
  el("span", "sp-cap", frameRow).textContent = "frame";
  frameRow.appendChild(frameBar);
  right.insertBefore(frameRow, prevWrap);

  /*  Each colour picker goes to the canvas it colours.

      Both were captioned swatches in a row on the far side of the panel, which
      meant looking away from the thing you were adjusting to adjust it — and
      two greyish squares in a list of toggles give you no clue which surface
      either one belongs to. Under their own canvas the question does not come
      up: this one tints what is directly above it. */
  const gridBgRow = el("div", "sp-row sp-under", left);
  /*  Undo lives under the canvas, not in the tool row: it acts on what is
      drawn rather than on how you draw, and the drawing is what you are
      looking at when you want it back. */
  gridBgRow.appendChild(undoBtn);
  el("span", "sp-cap", gridBgRow).textContent = "cells";
  gridBgRow.appendChild(gridWrap);
  underGrid = gridBgRow;

  const prevBgRow = el("div", "sp-row sp-under", right);
  el("span", "sp-cap", prevBgRow).textContent = "backdrop";
  prevBgRow.appendChild(bgWrap);
  right.insertBefore(prevBgRow, prevWrap.nextSibling);
  bgBar.remove();

  //  Size is not something you set while drawing — it is part of what the file
  //  IS, like its name, so it goes with the name and the export buttons.
  right.insertBefore(sizeBar, outBar);
  nameBar.classList.add("sp-fold");

  /*  The filename the page will look for. One name either way — a place is
      named for the place, a wardrobe for its wearer — because both are one
      file. Slugged, so what you type cannot produce a filename that will
      never match. */
  function fileName() {
    return (slugify(nameIn.value.trim()) || (isPlace() ? "place" : "default")) + ".png";
  }

  // ---- geometry
  const nFrames = () => layers[slot].__frames || SPR_FRAMES;
  const cellW = () => layers[slot].width / nFrames();
  const cellH = () => layers[slot].height;
  function syncSize() { wIn.value = cellW(); hIn.value = cellH(); }

  /*  Where the body sits behind this layer, in the layer's own pixels.
      Same two rules as everywhere else: centered, and standing on the bottom
      edge. A taller layer therefore shows the body lower down, which is
      correct — the extra room is headroom. */
  function bodyOffset() {
    return { x: (cellW() - SPR_W) / 2, y: cellH() - SPR_H };
  }

  // ---- drawing
  function colorNow() {
    if (pen === -1) return null;                    // erase
    if (pen === -2) return fixed.value;             // the picker
    return SWATCHES[pen];
  }
  /*  One pixel at an exact color — what the clipboard stamps with. Obeys the
      same "all frames" rule as the pencil: a shape stamped into one frame of a
      still layer should land in all of them, like any other mark. */
  function setPixelRGBA(x, y, r, g2, b, a) {
    if (x < 0 || y < 0 || x >= cellW() || y >= cellH()) return;
    const g = layers[slot].getContext("2d");
    const at = linked ? [...Array(nFrames()).keys()] : [frame];
    for (const f of at) {
      const sx = f * cellW() + x;
      g.clearRect(sx, y, 1, 1);
      if (!a) continue;
      g.fillStyle = "rgba(" + r + "," + g2 + "," + b + "," + (a / 255) + ")";
      g.fillRect(sx, y, 1, 1);
    }
  }

  function setPixel(x, y, erase) {
    if (x < 0 || y < 0 || x >= cellW() || y >= cellH()) return;
    const g = layers[slot].getContext("2d");
    const c = colorNow();
    // Linked: the same pixel in every frame, so one drawing is a whole layer.
    const at = linked ? [...Array(nFrames()).keys()] : [frame];
    for (const f of at) {
      const sx = f * cellW() + x;
      if (erase || !c) g.clearRect(sx, y, 1, 1);
      else { g.fillStyle = c; g.fillRect(sx, y, 1, 1); }
    }
    if (!erase && c) remember(c);
    touched[slot] = true;
  }

  /*  Which pixels a shape covers. One function, so the preview drawn while you
      drag and the pixels committed when you let go cannot disagree — the
      commonest way a shape tool lies to you. */
  function shapePixels(x0, y0, x1, y1) {
    const out = [];
    if (tool === "pencil") { out.push([x1, y1]); return out; }
    if (tool === "line") {
      // Bresenham: whole pixels only, which is the only kind there are here.
      const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0);
      const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
      let err = dx + dy, x = x0, y = y0;
      for (;;) {
        out.push([x, y]);
        if (x === x1 && y === y1) break;
        const e2 = 2 * err;
        if (e2 >= dy) { err += dy; x += sx; }
        if (e2 <= dx) { err += dx; y += sy; }
      }
      return out;
    }
    const ax = Math.min(x0, x1), bx = Math.max(x0, x1);
    const ay = Math.min(y0, y1), by = Math.max(y0, y1);
    for (let y = ay; y <= by; y++) {
      for (let x = ax; x <= bx; x++) {
        const edge = x === ax || x === bx || y === ay || y === by;
        if (tool === "fill" || edge) out.push([x, y]);
      }
    }
    return out;
  }

  let drawing = null;
  let anchor = null;      // where a shape started, while it is being dragged
  let pending = null;     // the shape under the cursor, not yet committed
  /*  Where the pointer is now, for every tool. `pending` only exists for the
      tools that hold a shape before committing it, and the pencil — the one
      you are most likely to be counting cells with — is not one of them. */
  let atCell = null;
  /*  The last thing measured, kept after the pointer is up. That is the whole
      point of it: a measurement you have to keep the button held down to read
      is one you cannot write down or compare against the next one. */
  let measured = null;
  /*  The tool to go back to when the middle button is let go. Non-null only
      for as long as a middle-drag lasts. */
  let panFrom = null;

  /*  THE CLIPBOARD — A SHAPE, NOT A BOX.

      Click a pixel with the copy tool and it lifts that pixel and every pixel
      of the same color joined to it: the coat, the hat brim, the one dark
      square that is somebody's eye. Click again and the shape is stamped back
      down, picked up and put down by the same pixel, so it lands where the
      cursor says it will.

      A box would be the easier thing to write and the wrong thing to have.
      What is on this canvas is shapes — a sleeve, a boot, a band of trim — and
      none of them is rectangular. Copying a sleeve with a marquee means
      copying the sleeve plus whatever corner of the body shares its bounding
      box, and then painting that corner down on top of something else.

      It survives changing frame, layer and name, because copying a sleeve from
      one frame into the next is most of what it is for. It does not survive a
      resize: the pixels would no longer mean the same thing on a new grid.

      Same rule as the move tool at the edges — anything that would land
      outside the cell is dropped rather than wrapped into the frame next
      door. */
  let clip = null;        // { pts: [[dx, dy, r, g, b, a]] } once something is lifted
  let hover = null;       // where the stamp would land, for the preview

  const sameColor = (d, i2, j2) =>
    d[i2] === d[j2] && d[i2 + 1] === d[j2 + 1] &&
    d[i2 + 2] === d[j2 + 2] && d[i2 + 3] === d[j2 + 3];

  function liftShape(sx, sy) {
    const w = cellW(), h = cellH();
    if (sx < 0 || sy < 0 || sx >= w || sy >= h) return false;
    const g = layers[slot].getContext("2d", { willReadFrequently: true });
    const d = g.getImageData(frame * w, 0, w, h).data;
    const seed = (sy * w + sx) * 4;
    // Nothing there. Lifting the shape of a hole is a puzzle, not a feature.
    if (!d[seed + 3]) return false;

    const seen = new Uint8Array(w * h);
    const pts = [];
    const queue = [[sx, sy]];
    seen[sy * w + sx] = 1;
    while (queue.length) {
      const [x, y] = queue.pop();
      const at = (y * w + x) * 4;
      pts.push([x - sx, y - sy, d[at], d[at + 1], d[at + 2], d[at + 3]]);
      /*  Four-connected. A shape that only touches at a corner is a second
          shape, which is what anybody drawing pixel art means by it. */
      for (const [nx, ny] of [[x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]]) {
        if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
        const k = ny * w + nx;
        if (seen[k] || !sameColor(d, k * 4, seed)) continue;
        seen[k] = 1;
        queue.push([nx, ny]);
      }
    }
    clip = { pts };
    return true;
  }

  /*  THE BOX ROUND WHATEVER IS UNDER THAT CELL.

      Same four-connected walk as `liftShape` — a shape that only touches at a
      corner is a second shape, which is what anybody drawing pixel art means
      by it — but it keeps the extremes instead of the pixels. Nothing is
      lifted, nothing is changed; the answer is four numbers. */
  function shapeBox(sx, sy) {
    const w = cellW(), h = cellH();
    if (sx < 0 || sy < 0 || sx >= w || sy >= h) return null;
    const g = layers[slot].getContext("2d", { willReadFrequently: true });
    const d = g.getImageData(frame * w, 0, w, h).data;
    const seed = (sy * w + sx) * 4;
    if (!d[seed + 3]) return null;              // empty cell measures nothing

    const seen = new Uint8Array(w * h);
    const queue = [[sx, sy]];
    seen[sy * w + sx] = 1;
    let x0 = sx, y0 = sy, x1 = sx, y1 = sy;
    while (queue.length) {
      const [x, y] = queue.pop();
      if (x < x0) x0 = x;
      if (x > x1) x1 = x;
      if (y < y0) y0 = y;
      if (y > y1) y1 = y;
      for (const [nx, ny] of [[x - 1, y], [x + 1, y], [x, y - 1], [x, y + 1]]) {
        if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
        const k = ny * w + nx;
        if (seen[k] || !sameColor(d, k * 4, seed)) continue;
        seen[k] = 1;
        queue.push([nx, ny]);
      }
    }
    return { x0, y0, x1, y1, shape: true };
  }

  function stampClip(atX, atY) {
    if (!clip) return;
    for (const [dx, dy, r, g2, b, a] of clip.pts) setPixelRGBA(atX + dx, atY + dy, r, g2, b, a);
    touched[slot] = true;
  }

  const cellAt = e => {
    const r = grid.getBoundingClientRect();
    /*  MEASURE FROM THE PIXELS, NOT FROM THE BORDER.

        `getBoundingClientRect` gives the BORDER box, and this canvas has a
        1px border, so the old arithmetic started one pixel outside the drawing
        and then divided by a cell size 2/510 too big. At the left edge that is
        invisible; by the right edge the error has grown to most of a cell,
        which is where a guide node landed somewhere other than where it was
        put — and every other tool was a fraction out the whole way across.

        `clientLeft`/`clientTop` are the border widths and `clientWidth`/
        `clientHeight` the content box, all in CSS pixels; `k` carries them
        into screen pixels if the page itself is zoomed. */
    const k = grid.offsetWidth ? r.width / grid.offsetWidth : 1;
    const x0 = r.left + grid.clientLeft * k, y0 = r.top + grid.clientTop * k;
    const w = grid.clientWidth * k, h = grid.clientHeight * k;
    return { x: Math.floor((e.clientX - x0) / (w / cellW())),
             y: Math.floor((e.clientY - y0) / (h / cellH())) };
  };
  grid.addEventListener("pointerdown", e => {
    drawing = e.button === 2 || e.ctrlKey;
    /*  THE MIDDLE BUTTON NUDGES, WHATEVER TOOL IS UP.

        Moving what you have drawn is the one thing you want while holding
        another tool — you are drawing a window, it is two pixels left of where
        it should be, and switching to move and back costs you your place. The
        middle button borrows the move tool for the length of one drag and
        hands it back on release, so nothing you had selected is lost.

        preventDefault, or the browser opens its own autoscroll on middle-drag
        and takes the pointer with it. */
    if (e.button === 1) {
      e.preventDefault();
      panFrom = tool;
      tool = "move";
      drawing = false;
    }
    const { x, y } = cellAt(e);
    anchor = { x, y };
    /*  Before the first pixel of this stroke, so one undo is one stroke. The
        guide tool is excluded: it draws nothing into a layer, and filling the
        stack with no-ops would push real work off the end of it. */
    if (tool !== "guide" && tool !== "measure") snapshot();
    /*  A shape shows before it commits; the pencil goes straight down. Waiting
        to commit is what makes a line adjustable — you see it before you agree
        to it. */
    /*  Copy is a click, not a drag: the first one lifts a shape, every one
        after that stamps it. Right-click puts the clipboard down — the same
        button that erases everywhere else, and this is the erase of a
        selection. */
    if (tool === "copy") {
      if (drawing) clip = null;
      else if (!clip) liftShape(x, y);
      else stampClip(x, y);
      anchor = null;
      paint();
      return;
    }
    /*  MEASURE. Draws nothing, so it takes no snapshot and sets no pixel.

        A click asks about the shape under it, which is the question you have
        when you cannot remember how big you made a window. A drag asks about
        an arbitrary span, for the gaps between things. Right-click clears the
        answer, the same button that erases everywhere else here. */
    if (tool === "measure") {
      if (drawing) { measured = null; anchor = null; paint(); return; }
      measured = { x0: x, y0: y, x1: x, y1: y, shape: false };
      paint();
      try { grid.setPointerCapture(e.pointerId); } catch (err) { /* not captured */ }
      return;
    }
    /*  A guide is grabbed, not drawn. Land on one and you are moving that one;
        land anywhere else and you are pivoting a new one out of that cell.
        Right-click takes one away — the same button that erases everywhere
        else in here, and removing a guide is the erase of a guide. */
    if (tool === "guide") {
      const hit = guideNear(x + 0.5, y + 0.5, 0.9);
      if (drawing) {
        if (hit >= 0) {
          guides.splice(hit, 1);
          if (lastGuide >= guides.length) lastGuide = guides.length - 1;
          saveGuides();
        }
        anchor = null;
      } else {
        if (hit >= 0) { guides[hit].x = x; guides[hit].y = y; lastGuide = hit; }
        else {
          guides.push({ x, y, deg: normDeg(parseFloat(gAng.value) || 0) });
          lastGuide = guides.length - 1;
        }
        /*  Nothing is committed on release, because a guide is not a mark —
            it is already where it is going the whole time you are aiming it.
            The anchor is only how the drag knows what to aim. */
        saveGuides();
      }
      paint();
      try { grid.setPointerCapture(e.pointerId); } catch (err) { /* not captured */ }
      return;
    }
    atCell = { x, y };
    if (tool === "pencil") setPixel(x, y, drawing);
    else pending = { x, y };
    paint();
    // Capture last, and never let it stop the drawing: it throws for a pointer
    // the browser does not consider active, and that aborted the whole stroke.
    try { grid.setPointerCapture(e.pointerId); } catch (err) { /* not captured */ }
  });
  grid.addEventListener("pointermove", e => {
    /*  With a shape on the clipboard the cursor is a stamp, so the canvas has
        to show where it would land whether a button is down or not. */
    if (tool === "copy") {
      const at = cellAt(e);
      if (clip && (!hover || hover.x !== at.x || hover.y !== at.y)) { hover = at; paint(); }
      return;
    }
    /*  WHICH CELL, WITH NOTHING PRESSED.

        This has to come before the "no button down, nothing to do" guard —
        answering while nothing is pressed is the entire point of it, and sat
        below that line it never ran at all. */
    if (drawing === null && (cellCursor || tool === "guide" || tool === "measure")) {
      const at = cellAt(e);
      if (!hover || hover.x !== at.x || hover.y !== at.y) { hover = at; paint(); }
      return;
    }
    if (drawing === null) return;
    const { x, y } = cellAt(e);
    if (tool === "measure") {
      if (anchor && measured) {
        measured = { x0: Math.min(anchor.x, x), y0: Math.min(anchor.y, y),
                     x1: Math.max(anchor.x, x), y1: Math.max(anchor.y, y), shape: false };
        paint();
      }
      return;
    }
    /*  Aiming. The pointer is a point on the line, not an end of it: the guide
        pivots on its cell and runs both ways, so dragging back through the
        anchor and out the other side changes nothing, which is right. */
    if (tool === "guide") {
      if (anchor && lastGuide >= 0 && lastGuide < guides.length) {
        const g = guides[lastGuide];
        const rise = (g.y + 0.5) - (y + 0.5), run = (x + 0.5) - (g.x + 0.5);
        if (rise || run) {
          let deg = Math.atan2(rise, run) * 180 / Math.PI;
          if (e.shiftKey) deg = Math.round(deg / 15) * 15;
          g.deg = normDeg(deg);
          gAng.value = String(g.deg);
          saveGuides(); paint();
        }
      }
      return;
    }
    atCell = { x, y };
    if (tool === "pencil") setPixel(x, y, drawing);
    else pending = { x, y };
    paint();
  });
  grid.addEventListener("pointerleave", () => { if (hover) { hover = null; paint(); } });
  /*  Shift the whole layer by a whole number of pixels. Committed on release,
      so a nudge can be lined up before it is agreed to — and applied to every
      frame when "all frames" is on, or the frames walk out of register with
      one another. */
  /*  How far the layer may actually go.

      Dragging past the edge used to cut whatever crossed it, permanently and
      with no undo — nudge a coat two pixels too far and a sleeve is gone. So
      the move is limited to what keeps the DRAWN pixels inside the cell: shove
      it as hard as you like and it stops at the edge rather than eating the
      drawing.

      Measured on the frame being moved. */
  function shiftRange() {
    const cv = layers[slot], w = cellW(), h = cellH();
    const g = cv.getContext("2d");
    const at = [frame];
    let minX = w, minY = h, maxX = -1, maxY = -1;
    for (const f of at) {
      const d = g.getImageData(f * w, 0, w, h).data;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          if (!d[(y * w + x) * 4 + 3]) continue;
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }
    if (maxX < 0) return { lo: 0, hi: 0, up: 0, down: 0 };   // nothing drawn
    return { lo: -minX, hi: w - 1 - maxX, up: -minY, down: h - 1 - maxY };
  }

  function clampShift(dx, dy) {
    const r = shiftRange();
    return { dx: Math.max(r.lo, Math.min(r.hi, dx)),
             dy: Math.max(r.up, Math.min(r.down, dy)) };
  }

  /*  Deliberately ONE frame, whatever "all frames" says.

      That toggle is about putting the same thing into every frame, which is
      what you want while drawing and precisely what you do not want here:
      moving is how you fix a frame that sits wrong against the others, and
      shifting them all together leaves you exactly where you started. */
  function shiftBy(dx, dy) {
    if (!dx && !dy) return;
    touched[slot] = true;
    const cv = layers[slot], w = cellW(), h = cellH();
    const g = cv.getContext("2d");
    const at = [frame];
    for (const f of at) {
      const tmp = document.createElement("canvas");
      tmp.width = w; tmp.height = h;
      const tg = tmp.getContext("2d");
      tg.imageSmoothingEnabled = false;
      tg.drawImage(cv, f * w, 0, w, h, dx, dy, w, h);
      g.clearRect(f * w, 0, w, h);
      g.drawImage(tmp, f * w, 0);
    }
  }

  const stop = () => {
    //  Borrowed for one drag; given back however this drag ends.
    const back = () => { if (panFrom) { tool = panFrom; panFrom = null; } };
    /*  A measure drag that never left its starting cell was a click, and a
        click is a question about the shape there rather than about one cell. */
    if (tool === "measure") {
      if (measured && measured.x0 === measured.x1 && measured.y0 === measured.y1) {
        measured = shapeBox(measured.x0, measured.y0) || measured;
      }
      drawing = null; anchor = null; pending = null; atCell = null;
      paint();
      return;
    }
    if (anchor && pending && tool === "move") {
      const m = clampShift(pending.x - anchor.x, pending.y - anchor.y);
      shiftBy(m.dx, m.dy);
      back();
      drawing = null; anchor = null; pending = null; atCell = null; paint();
      return;
    }
    // Let go and the shape is laid down; until then it is only a proposal.
    if (anchor && pending && tool !== "pencil") {
      for (const [px, py] of shapePixels(anchor.x, anchor.y, pending.x, pending.y)) {
        setPixel(px, py, drawing);
      }
    }
    back();
    drawing = null; anchor = null; pending = null; atCell = null;
    paint();
  };
  grid.addEventListener("pointerup", stop);
  grid.addEventListener("pointercancel", stop);
  grid.addEventListener("contextmenu", e => e.preventDefault());

  /*  OPEN A PNG BY DROPPING IT ON THE CANVAS.

      A finished drawing left here by the only door available: you downloaded
      it, and the editor could not read it back. It reads the server's own
      images folder and nothing else, so a file in ~/Downloads — the file this
      panel handed you five minutes ago — was out of reach.

      The FILENAME decides how it is read, because the filenames here already
      carry that meaning and are the ones this panel writes:

        default.png        a wardrobe sheet — four rows, split back apart
        default.hat.png    one row, into the slot it names
        anything, on the place slot — the place

      Not the shape of the image, which cannot tell you: a still one-frame hat
      and a four-row sheet are both roughly square, and guessing wrong quietly
      quarters somebody's drawing. A sheet whose height is not divisible by
      four is not a sheet whatever it is called, so that falls back to the row
      you are on rather than being cut into quarters that mean nothing. */
  const dropStop = e => { e.preventDefault(); e.stopPropagation(); };
  grid.addEventListener("dragenter", e => { dropStop(e); grid.classList.add("sp-drop"); });
  grid.addEventListener("dragover", dropStop);
  grid.addEventListener("dragleave", e => { dropStop(e); grid.classList.remove("sp-drop"); });
  grid.addEventListener("drop", async e => {
    dropStop(e);
    grid.classList.remove("sp-drop");
    const file = [...((e.dataTransfer && e.dataTransfer.files) || [])]
      .find(f => /^image\//.test(f.type));
    if (!file) { hint.textContent = "that was not an image"; return; }
    const url = URL.createObjectURL(file);
    const img = await loadImg(url);
    URL.revokeObjectURL(url);
    if (!img || !host.isConnected) { hint.textContent = "could not read " + file.name; return; }
    snapshot();

    const named = /\.(body|bottom|top|hat)\.[^.]+$/i.exec(file.name);
    let note;
    if (isPlace()) {
      blitInto(layers.place, img);
      layers.place.__frames = 1;
      touched.place = true;
      note = "opened as the place";
    } else if (named) {
      slot = named[1].toLowerCase();
      blitInto(layers[slot], img);
      layers[slot].__frames = SPR_FRAMES;
      touched[slot] = true;
      note = "opened into " + slot;
    } else if (img.height % ROWS.length === 0) {
      const rows = sheetRows(img) || [];
      let got = 0;
      rows.forEach((cv, i) => {
        if (!cv) return;                       // a row this sheet has no opinion about
        blitInto(layers[ROWS[i]], cv);
        layers[ROWS[i]].__frames = SPR_FRAMES;
        touched[ROWS[i]] = true;
        got++;
      });
      if (!got) { hint.textContent = file.name + " has nothing drawn in it"; return; }
      note = "opened as a sheet \u2014 " + got + (got === 1 ? " row" : " rows");
    } else {
      blitInto(layers[slot], img);
      layers[slot].__frames = SPR_FRAMES;
      touched[slot] = true;
      note = "opened into " + slot;
    }
    /*  Named after the file, so pressing download gives the same name back
        instead of quietly saving it as somebody else. */
    const base = file.name.replace(/\.[^.]+$/, "").replace(/\.(body|bottom|top|hat)$/i, "");
    if (base) nameIn.value = base;
    syncSize(); paint();
    hint.textContent = note + " \u00b7 " + file.name;
  });

  // ---- painting
  let tick = 0;
  function paint() {
    /*  One cell, in screen pixels. Whole numbers only: a cell of 7.4 pixels
        has to be rounded somewhere, and wherever that lands is a drawn pixel
        a row taller than its neighbour. */
    const cw = cellW(), ch = cellH();
    const z = lastZ = fitZ(cw, ch);
    grid.width = cw * z; grid.height = ch * z;

    slotBtns.forEach((b, i) => b.classList.toggle("on", ROWS[i] === slot));
    // Rebuilt, because the count is the layer's and changes with it.
    if (frameBar.childElementCount !== nFrames()) {
      frameBar.innerHTML = "";
      for (let i = 0; i < nFrames(); i++) {
        const b = el("button", null, frameBar);
        b.type = "button"; b.textContent = String(i + 1);
        b.title = "frame " + (i + 1);
        b.dataset.frame = String(i);
        b.onclick = () => { frame = +b.dataset.frame; paint(); };
      }
    }
    [...frameBar.children].forEach(b => b.classList.toggle("on", +b.dataset.frame === frame));
    toolBtns.forEach((b, i) => b.classList.toggle("on", TOOLS[i][0] === tool));
    onionBtn.classList.toggle("on", onion);
    gridBtn.classList.toggle("on", gridOn);
    curBtn.classList.toggle("on", cellCursor);
    //  The canvas keeps the crosshair unless the drawn cell has replaced it.
    grid.style.cursor = cellCursor ? "none" : "crosshair";
    /*  Only while the tool that makes them is up. A guide is not a setting you
        keep an eye on, it is something you are either placing or not. */
    guideBar.hidden = tool !== "guide";
    scaleBar.hidden = !isPlace();
    axesBtn.classList.toggle("on", axesOn);
    linkBtn.classList.toggle("on", linked);
    eraseBtn.classList.toggle("on", pen === -1);

    /*  A swatch shows what the slot BECOMES this century, not the marker
        color stored in the file. Nobody should have to look at magenta to
        know they are painting a coat. */
    penBtns.forEach((b, i) => {
      b.hidden = false;
      b.classList.toggle("on", pen === i);
    });
    recentBtns.forEach((b, i) => {
      const c = RECENT[i];
      b.hidden = !c;
      if (!c) return;
      b.style.background = c;
      b.title = c + " \u2014 used recently";
      b.classList.toggle("on", pen === -2 && fixed.value.toLowerCase() === c.toLowerCase());
    });

    const g = grid.getContext("2d");
    g.imageSmoothingEnabled = false;
    g.clearRect(0, 0, grid.width, grid.height);
    // cols is worked out above, with the swatches — the canvas and the pens
    // must never disagree about what a slot looks like.
    const other = gridOther();
    for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++) {
      g.fillStyle = ((x + y) & 1) ? gridBg : other;
      g.fillRect(x * z, y * z, z, z);
    }
    if (onion && !isPlace()) {
      /*  Everything EXCEPT what you are drawing. Showing only the body was no
          use when adding a hat to someone already in a coat — you need to see
          what the new piece has to sit with. */
      const others = ROWS.filter(k => k !== slot).map(k => ({ img: layers[k] }));
      const ghost = dressBody(others, false);
      if (ghost) {
        const gw = ghost.__cellW, gh = ghost.__cellH;
        const gn = ghost.__frames || SPR_FRAMES;
        g.globalAlpha = 0.3;
        g.drawImage(ghost, (frame % gn) * gw, 0, gw, gh,
                    Math.round((cw - gw) / 2) * z, (ch - gh) * z, gw * z, gh * z);
        g.globalAlpha = 1;
      }
    }
    if (anchor && pending && tool === "move") {
      // Shown where it would land, so the nudge is judged before it is made.
      const m = clampShift(pending.x - anchor.x, pending.y - anchor.y);
      g.drawImage(layers[slot], frame * cw, 0, cw, ch,
                  m.dx * z, m.dy * z, grid.width, grid.height);
    } else {
      g.drawImage(layers[slot], frame * cw, 0, cw, ch, 0, 0, grid.width, grid.height);
    }

    /*  On a place, the scale reference is a LINE at head height.

        A block was still too much: the only thing you cannot judge by eye when
        drawing a kirk is how far up the wall a person reaches, and a line says
        that and nothing else. It obscures nothing, so there is no need to draw
        through it or fade it. */
    if (onion && isPlace()) {
      const ph = layers.body.height;
      const y = (ch - ph) * z;
      /*  Cream, until the grid could be any colour you liked — on a pale one
          this line and its label went the same way white rules did, which is
          to say nowhere. It takes its ink from the grid now, like everything
          else drawn over the top of it. */
      const ink = gridInk(0.8);
      g.strokeStyle = ink;
      g.lineWidth = 1;
      g.setLineDash([4, 3]);
      g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(grid.width, y + 0.5); g.stroke();
      g.setLineDash([]);
      g.fillStyle = ink;
      g.font = "10px ui-monospace, monospace";
      g.fillText("head height \u00b7 " + ph + "px"
                 + (scale.per > 0 ? " \u00b7 " + realOf(ph) + " " + scale.unit : ""),
                 4, y - 4);
    }

    /*  What is on the clipboard, hovering where it would land — in its own
        colors, faintly, so it reads as a proposal rather than as paint that
        has already gone down. Outlined as well, because a shape lifted from a
        dark coat and hovered over a dark coat is otherwise invisible. */
    if (tool === "copy" && clip && hover) {
      g.globalAlpha = 0.75;
      for (const [dx, dy, r, g2, b, a] of clip.pts) {
        const px = hover.x + dx, py = hover.y + dy;
        if (px < 0 || py < 0 || px >= cw || py >= ch || !a) continue;
        g.fillStyle = "rgba(" + r + "," + g2 + "," + b + "," + (a / 255) + ")";
        g.fillRect(px * z, py * z, z, z);
      }
      g.globalAlpha = 1;
      g.strokeStyle = gridLight() ? "rgba(0,105,165,0.9)" : "rgba(120,220,255,0.9)";
      g.lineWidth = 1;
      for (const [dx, dy, , , , a] of clip.pts) {
        const px = hover.x + dx, py = hover.y + dy;
        if (px < 0 || py < 0 || px >= cw || py >= ch || !a) continue;
        g.strokeRect(px * z + 0.5, py * z + 0.5, z - 1, z - 1);
      }
    }

    /*  The shape under the cursor, not yet committed. Drawn in the pen's own
        color so what you see is what you get, and outlined when erasing,
        where the color is nothing. */
    if (anchor && pending && tool !== "pencil" && tool !== "move") {
      const col = drawing ? null : colorNow();
      for (const [px, py] of shapePixels(anchor.x, anchor.y, pending.x, pending.y)) {
        if (px < 0 || py < 0 || px >= cw || py >= ch) continue;
        if (col) { g.fillStyle = col; g.fillRect(px * z, py * z, z, z); }
        else {
          g.strokeStyle = "rgba(217,138,92,0.9)"; g.lineWidth = 1;
          g.strokeRect(px * z + 0.5, py * z + 0.5, z - 1, z - 1);
        }
      }
    }

    /*  Two weights. Every cell gets a faint rule so you can count pixels, and
        every fourth a firmer one so you can count them QUICKLY — without the
        major lines you lose your place around the tenth column and start
        miscounting a sleeve. Skipped when the cells are too small to rule,
        where a grid is only noise. */
    g.lineWidth = 1;
    if (gridOn && z >= 5) {
      for (let i = 1; i < cw; i++) {
        g.strokeStyle = gridInk(i % 4 ? 0.13 : 0.3);
        g.beginPath(); g.moveTo(i * z + 0.5, 0); g.lineTo(i * z + 0.5, grid.height); g.stroke();
      }
      for (let i = 1; i < ch; i++) {
        g.strokeStyle = gridInk(i % 4 ? 0.13 : 0.3);
        g.beginPath(); g.moveTo(0, i * z + 0.5); g.lineTo(grid.width, i * z + 0.5); g.stroke();
      }
    }

    /*  The center lines, and the ground.

        Vertical matters most: every layer is centered on it, so a sleeve two
        pixels off the middle is two pixels off on the body — invisible until
        you can see the axis it is meant to be even about. Horizontal is a
        second reference, roughly the waist. The bottom edge is the ground line
        everything stands on, so it gets its own color and no dashes. */
    if (axesOn) {
      const midX = Math.round(cw / 2) * z, midY = Math.round(ch / 2) * z;
      /*  Cyan reads on a dark grid and washes out on a pale one, so the
          axes take a deeper blue there. Same line, same job. */
      g.strokeStyle = gridLight() ? "rgba(0,105,165,0.95)" : "rgba(120,220,255,0.95)";
      g.lineWidth = 2;
      g.setLineDash([6, 4]);
      g.beginPath(); g.moveTo(midX + 0.5, 0); g.lineTo(midX + 0.5, grid.height); g.stroke();
      g.beginPath(); g.moveTo(0, midY + 0.5); g.lineTo(grid.width, midY + 0.5); g.stroke();
      g.setLineDash([]);
    }

    /*  The guides, over everything they are guiding.

        Each one is drawn from its cell out to well past both corners, which is
        the cheap way to draw a line that has no ends. Amber, where the fixed
        center lines are cyan: they behave differently and should not be
        mistaken for one another. The anchor gets a dot, because that is the
        cell you grab to move it and there would otherwise be nothing to aim
        at on a line that is the same all the way along. */
    if (guides.length) {
      const far = (grid.width + grid.height) * 2;
      guides.forEach((gd, i) => {
        const { dx, dy } = guideDir(gd.deg);
        const ax = (gd.x + 0.5) * z, ay = (gd.y + 0.5) * z;
        const amber = gridLight() ? "185,105,0" : "255,196,92";
        g.strokeStyle = "rgba(" + amber + (i === lastGuide ? ",0.95)" : ",0.55)");
        g.lineWidth = 1;
        g.beginPath();
        g.moveTo(ax - dx * far, ay - dy * far);
        g.lineTo(ax + dx * far, ay + dy * far);
        g.stroke();
        g.fillStyle = "rgba(" + amber + (i === lastGuide ? ",0.95)" : ",0.5)");
        g.beginPath();
        g.arc(ax, ay, Math.max(2, z / 3), 0, Math.PI * 2);
        g.fill();
      });
    }
    gNote.textContent = guides.length
      ? guides.length + (guides.length === 1 ? " guide" : " guides")
      : "";
    gClear.disabled = !guides.length;

    g.lineWidth = 1;
    g.strokeStyle = "#d98a5c";
    g.beginPath();
    g.moveTo(0, grid.height - 0.5); g.lineTo(grid.width, grid.height - 0.5);
    g.stroke();

    /*  How big this actually is, on the thing itself.

        The number lives in a box at the far end of the panel, which is no use
        while you are drawing: what you want to know is whether you are working
        at 24 wide or 102, and you want to know it without looking away. Top
        right, because the figure stands centred on the bottom, and quiet
        enough to be ignored — it takes its ink from the grid, so it survives a
        pale one as well as a dark. */
    g.font = "11px ui-monospace, SFMono-Regular, Menlo, monospace";
    g.textAlign = "right";
    g.textBaseline = "top";
    g.fillStyle = gridInk(0.5);
    g.fillText(cw + " \u00d7 " + ch, grid.width - 5, 4);

    /*  WHICH TOOL IS IN YOUR HAND, ON THE CANVAS.

        Seven glyphs and a word, and the only thing saying which was live was a
        green fill you had to compare against six neighbours — a pencil and a
        lifted-shape stamp are one hover apart at eleven pixels. The name
        settles it, and it belongs where you are looking rather than in the
        panel you are not.

        Bottom left: the size has the top right, the pointer's coordinates the
        top left, and the figure stands centred on the bottom edge, so this is
        the one corner nothing else wants. */
    g.font = "11px ui-monospace, SFMono-Regular, Menlo, monospace";
    g.textBaseline = "alphabetic";
    g.textAlign = "left";
    /*  Neon, with a fallback that keeps it neon.

        #33ff33 is the app's own accent and it burns against a dark grid — but
        the grid is yours now, and neon green on cream is a luminance away from
        nothing: about 1.3:1, which is a colour you can see and a word you
        cannot read. Rather than swap the colour for a duller one and lose the
        thing that makes the label findable, the ground under it changes: when
        the contrast falls below 3:1 the label gets a dark plate to sit on and
        the green stays exactly as green.

        Plain luminance contrast, which is what actually fails here — the
        letters are one flat colour on one flat ground, with no hue trickery to
        account for. */
    const TOOL_NEON = "#33ff33";
    const lumA = lumOf(hexInt(TOOL_NEON)), lumB = lumOf(hexInt(gridBg));
    const ratio = (Math.max(lumA, lumB) + 0.05) / (Math.min(lumA, lumB) + 0.05);
    const tw2 = g.measureText(tool).width;
    if (ratio < 3) {
      g.fillStyle = "rgba(10,12,9,0.86)";
      g.fillRect(2, grid.height - 17, tw2 + 8, 15);
    }
    g.fillStyle = TOOL_NEON;
    g.fillText(tool, 6, grid.height - 6);

    /*  WHICH CELL THE POINTER IS ON.

        A crosshair cursor has no pixel — it is a pair of lines with a hole
        where the point should be — so the tools that place a single deliberate
        point had you guessing which cell you were about to commit to. The cell
        is outlined instead, and its coordinates written in the corner, so the
        answer is on the canvas rather than under the cursor.

        Only for the tools that need it. A pencil shows you where it went the
        instant it goes there, and outlining every cell you pass over would be
        a light chasing the hand for no reason. */
    const showCell = cellCursor ? (drawing === null ? hover : atCell)
                                : (drawing === null && (tool === "guide" || tool === "measure") ? hover : null);
    if (showCell) {
      const hx = showCell.x * z, hy = showCell.y * z;
      g.strokeStyle = gridInk(0.9);
      g.lineWidth = 1;
      g.strokeRect(hx + 0.5, hy + 0.5, z - 1, z - 1);
      /*  A second, brighter ring inside it when the cell is small: at five
          screen pixels a single hairline square is easy to lose among the
          rules it sits on. */
      if (z >= 6) {
        /*  The tool's own colour where it has one, so an amber ring means a
            guide is about to be placed and a magenta one a measurement. Every
            other tool gets plain ink: it is a pointer, not a claim about what
            kind of mark is coming. */
        g.strokeStyle = tool === "guide"
          ? (gridLight() ? "rgba(185,105,0,0.9)" : "rgba(255,196,92,0.9)")
          : tool === "measure"
          ? (gridLight() ? "rgba(150,60,180,0.9)" : "rgba(226,150,255,0.9)")
          : gridInk(0.55);
        g.strokeRect(hx + 1.5, hy + 1.5, z - 3, z - 3);
      }
      /*  Coordinates share the top-left corner with the drag readout, and the
          drag readout is the better answer while a drag is happening. */
      if (drawing === null) {
        const txt = showCell.x + ", " + showCell.y;
        g.font = "11px ui-monospace, SFMono-Regular, Menlo, monospace";
        g.textBaseline = "top";
        g.textAlign = "left";
        const pad = 4, tw = g.measureText(txt).width;
        g.fillStyle = gridLight() ? "rgba(255,255,255,0.88)" : "rgba(0,0,0,0.72)";
        g.fillRect(3, 3, tw + pad * 2, 15);
        g.fillStyle = gridInk(0.95);
        g.fillText(txt, 3 + pad, 5);
      }
    }

    /*  THE MEASUREMENT, STILL THERE AFTER THE POINTER IS UP.

        Boxed in the measuring colour so it cannot be mistaken for a guide or
        for something drawn, and labelled with the same numbers the live
        readout uses — cells, and real units on a place, so a window can be
        compared against the door you drew an hour ago. */
    if (measured) {
      const { x0, y0, x1, y1 } = measured;
      const w = x1 - x0 + 1, h = y1 - y0 + 1;
      g.strokeStyle = gridLight() ? "rgba(150,60,180,0.95)" : "rgba(226,150,255,0.95)";
      g.lineWidth = 1;
      g.setLineDash([3, 2]);
      g.strokeRect(x0 * z + 0.5, y0 * z + 0.5, w * z - 1, h * z - 1);
      g.setLineDash([]);

      let txt = w + " \u00d7 " + h;
      if (isPlace() && scale.per > 0) {
        txt += "  \u00b7  " + realOf(w) + " \u00d7 " + realOf(h) + " " + scale.unit;
      }
      if (measured.shape) txt += "  (shape)";
      g.font = "11px ui-monospace, SFMono-Regular, Menlo, monospace";
      g.textBaseline = "top";
      g.textAlign = "left";
      /*  KEPT INSIDE THE CANVAS, ON ALL FOUR SIDES.

          It preferred to sit above the box and flipped below when there was no
          room. That covered three edges and not the fourth: measure something
          against the bottom and the flip put the label past the bottom of the
          canvas, where it is simply clipped away — the tool looked broken at
          exactly the moment it had an answer for you.

          So: above by preference, below if that does not fit, and then clamped
          into the canvas whatever happens. A label half over its own box is
          worth more than a label you cannot read. */
      const pad = 4, tw = g.measureText(txt).width, bw = tw + pad * 2, bh = 15;
      let bx = x0 * z, by = y0 * z - bh - 2;
      if (by < 0) by = y1 * z + z + 3;
      bx = Math.max(0, Math.min(bx, grid.width - bw));
      by = Math.max(0, Math.min(by, grid.height - bh));
      g.fillStyle = gridLight() ? "rgba(255,255,255,0.9)" : "rgba(0,0,0,0.78)";
      g.fillRect(bx, by, bw, bh);
      g.fillStyle = gridLight() ? "rgb(120,40,150)" : "rgb(232,170,255)";
      g.fillText(txt, bx + pad, by + 2);
    }

    /*  HOW FAR THIS STROKE HAS GONE, WHILE IT IS GOING.

        You cannot count cells on a grid while your hand is moving, and the
        thing you usually want is not where you are but how far you have come:
        a wall eleven cells long, a window three by four. So the extent of the
        drag is written down live, and it goes the moment you let go — it is a
        measurement of an action, not a label on a drawing.

        TOP LEFT, not beside the pointer. Following the cursor put the label
        squarely over the line while you dragged sideways, which is the one
        direction you most want to watch: it was hiding the thing it was
        describing. A fixed corner never covers what is under the hand, and
        being always in the same place beats being near — you learn where to
        look once instead of hunting for it on every drag. It sits opposite
        the size, so the two numbers do not crowd each other.

        Inclusive counts, because a drag from cell 4 to cell 6 draws THREE
        cells and reporting two would be arithmetic rather than an answer.

        The pencil is left out. It commits as it goes, proposing no shape, so
        a box measured from wherever you happened to press describes nothing
        you are about to do.

        `move` gets a signed offset instead: nudging is about displacement,
        and "3 x 1" tells you nothing about which way. */
    if (anchor && atCell && drawing !== null
        && tool !== "guide" && tool !== "measure" && tool !== "pencil") {
      const dx = atCell.x - anchor.x, dy = atCell.y - anchor.y;
      const w = Math.abs(dx) + 1, h = Math.abs(dy) + 1;
      const sign = n => (n > 0 ? "+" : n < 0 ? "\u2212" : "\u00b1") + Math.abs(n);
      let txt = tool === "move" ? sign(dx) + ", " + sign(dy) : w + " \u00d7 " + h;
      //  A line's answer is its run, not the box it happens to sit in.
      if (tool === "line") txt = Math.max(w, h) + " cells";
      //  On a place, the same measurement in the units the building is in.
      if (isPlace() && scale.per > 0 && tool !== "move") {
        txt += "  \u00b7  " + (tool === "line"
          ? realOf(Math.max(w, h)) + " " + scale.unit
          : realOf(w) + " \u00d7 " + realOf(h) + " " + scale.unit);
      }

      g.font = "11px ui-monospace, SFMono-Regular, Menlo, monospace";
      g.textBaseline = "top";
      g.textAlign = "left";
      const pad = 4, tw = g.measureText(txt).width;
      g.fillStyle = gridLight() ? "rgba(255,255,255,0.88)" : "rgba(0,0,0,0.72)";
      g.fillRect(3, 3, tw + pad * 2, 15);
      g.fillStyle = gridInk(0.95);
      g.fillText(txt, 3 + pad, 5);
    }

    nameOut.textContent = (isPlace() ? "images/places/" : "images/wear/") + fileName();
    if (host._wipQueue) host._wipQueue();
    hint.textContent = (tool === "copy"
                        ? (clip ? "click to stamp it — right-click to drop it"
                                : "click a pixel to lift its shape")
                      : tool === "pencil" ? "drag to draw"
                      : tool === "move" ? "drag to nudge the layer"
                      : tool === "guide" ? "drag to aim \u2014 shift snaps to 15\u00b0, "
                          + "right-click removes, drop on a guide to move it"
                      : tool === "measure" ? "click a shape to size it, or drag across "
                          + "anything \u00b7 right-click clears"
                      : "drag to place the shape") +
      " \u00b7 right-click or ctrl to erase \u00b7 middle-drag to nudge \u00b7 " +
      slot + ", frame " + (frame + 1) + " \u00b7 " + cw + " \u00d7 " + ch +
      " \u00b7 grows from the center, so it stays on the body";
    drawPreview();
  }

  /*  The render example, through the real compositor and the real palette
      swap — so what walks here is what walks down the street. */
  function drawPreview() {
    const dressed = dressBody(ROWS.map(k => ({ img: layers[k], slot: k })), false);
    if (!dressed) return;
    if (isPlace()) return drawPlacePreview(dressed);
    const swapped = dressed;
    const cw = dressed.__cellW, ch = dressed.__cellH;
    const n = dressed.__frames || SPR_FRAMES;
    const f = playing ? Math.floor(tick / 9) % n : Math.min(frame, n - 1);
    for (const [cv, z] of [[prev, 4], [prev1, 1]]) {
      cv.width = cw * z; cv.height = ch * z;
      const c = cv.getContext("2d");
      c.imageSmoothingEnabled = false;
      c.clearRect(0, 0, cv.width, cv.height);
      c.drawImage(swapped, f * cw, 0, cw, ch, 0, 0, cw * z, ch * z);
    }
  }

  /*  Scenery in its column: sky, ground, the scene standing on the line, and
      people in front of it. A building drawn on its own always looks right;
      the question is whether it still reads with a crowd in front of it. */
  function drawPlacePreview(fig) {
    const sc = layers.place;
    const swapped = fig;
    const z = 2, pad = 6;
    const w = Math.max(sc.width, 110) + pad * 2, h = Math.max(sc.height, 40) + 18;
    for (const [cv, zz] of [[prev, z], [prev1, 1]]) {
      cv.width = w * zz; cv.height = h * zz;
      const c = cv.getContext("2d");
      c.imageSmoothingEnabled = false;
      const groundY = h - 10;
      c.fillStyle = bg.sky; c.fillRect(0, 0, cv.width, groundY * zz);
      c.fillStyle = bg.ground; c.fillRect(0, groundY * zz, cv.width, cv.height);
      c.drawImage(sc, 0, 0, sc.width, sc.height,
                  Math.round((w - sc.width) / 2) * zz, (groundY - sc.height) * zz,
                  sc.width * zz, sc.height * zz);
      /*  The three bricklings are a scale reference, which is exactly what
          `ghost` already means on a place — so they answer to it rather than
          to a fourth toggle. Off, the mini view is the scene alone, which is
          what the Promenade shows anyone who is not standing in it. */
      if (!onion) continue;
      const fw = swapped.__cellW || fig.__cellW, fh = swapped.__cellH || fig.__cellH;
      const f = playing ? Math.floor(tick / 9) % (fig.__frames || SPR_FRAMES) : 0;
      for (const dx of [w * 0.3, w * 0.5, w * 0.68]) {
        c.drawImage(swapped, f * fw, 0, fw, fh,
                    Math.round(dx - fw / 2) * zz, (groundY - fh) * zz, fw * zz, fh * zz);
      }
    }
  }

  (function loop() {
    if (!host.isConnected) return;              // panel taken off the board
    if (playing) { tick++; if (tick % 9 === 0) drawPreview(); }
    host._spriteRAF = requestAnimationFrame(loop);
  })();

  /*  WORK IN PROGRESS.

      Everything else this editor writes is a finished thing: a PNG you
      downloaded, or one kept in the browser under the path the loader reads.
      There was nothing for the half-drawn coat you have to walk away from —
      close the panel and it was gone, which makes an unfinished drawing a
      thing you dare not leave.

      So the working layers are kept in the browser as you go. No button:
      a draft you have to remember to save is a draft you lose. It writes at
      most once a second, and only the rows you have actually drawn on — an
      untouched row is still whatever the file says it is, and storing a copy
      of that would only go stale when the file changed.

      Restoring marks those rows touched, which is what stops `openExisting`
      from loading the file over the top of them. That is the same rule the
      editor already uses for a row you have drawn on this session: a mark on
      the canvas outranks a file on disk. */
  const WIP_KEY = "brick-by-brick:wip:v1";
  let wipAt = 0;
  function saveWip() {
    try {
      const rows = {}, frames = {};
      for (const k of TARGETS) {
        if (!touched[k]) continue;
        rows[k] = layers[k].toDataURL("image/png");
        frames[k] = layers[k].__frames || SPR_FRAMES;
      }
      if (!Object.keys(rows).length) { localStorage.removeItem(WIP_KEY); return; }
      localStorage.setItem(WIP_KEY, JSON.stringify({
        name: nameIn.value, slot, at: Date.now(), rows, frames,
      }));
    } catch (e) { /* full, or unavailable — a draft is not worth an alert */ }
  }
  /*  Called from `paint`, which runs after every change there is; the delay is
      what keeps a stroke from writing the whole sheet out on every pixel. */
  host._wipQueue = () => {
    clearTimeout(wipAt);
    wipAt = setTimeout(saveWip, 900);
  };

  async function restoreWip() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(WIP_KEY) || "null"); } catch (e) { return false; }
    if (!d || !d.rows || !Object.keys(d.rows).length) return false;
    let got = 0;
    for (const k of TARGETS) {
      if (!d.rows[k]) continue;
      const img = await loadImg(d.rows[k]);
      if (!img || !host.isConnected) continue;
      blitInto(layers[k], img);
      layers[k].__frames = d.frames && d.frames[k] ? d.frames[k] : (k === "place" ? 1 : SPR_FRAMES);
      touched[k] = true;
      got++;
    }
    if (!got) return false;
    if (typeof d.name === "string") nameIn.value = d.name;
    if (TARGETS.includes(d.slot)) slot = d.slot;
    syncSize(); paint();
    const when = d.at ? new Date(d.at) : null;
    hint.textContent = "picked up where you left off"
      + (when ? " — " + when.toLocaleString() : "")
      + " \u00b7 download it when it is done, or press empty board to drop it";
    return true;
  }

  syncSize();
  /*  The draft wins over the file. If there is nothing half-drawn, this falls
      through to the ordinary "open whatever exists for this name". */
  restoreWip().then(found => { if (!found && host.isConnected) openExisting(); });
  paint();
}

/* ==========================================================================
   THE MAP
   --------------------------------------------------------------------------
   MapLibre over the user's own PMTiles basemap:
   pmtiles://https://tiles.mbricknell.com/basemap.pmtiles — vector MVT, z0-9,
   Natural Earth layers (ocean, coastline_land, admin0_land, admin1_land,
   lakes, rivers).

   Both libraries load from a CDN, and only when the Map tile is actually on
   the board. Everything else on this page keeps working without them, and a
   page opened from file:// simply says the map needs a connection rather than
   failing silently.
   ========================================================================== */
const MAPLIBRE_JS  = "https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js";
const MAPLIBRE_CSS = "https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css";
const PMTILES_JS   = "https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js";
const BASEMAP      = "pmtiles://https://tiles.mbricknell.com/basemap.pmtiles";
const HILLSHADE    = "pmtiles://https://tiles.mbricknell.com/hs.pmtiles";
// MapLibre's own public demo style — no key, no pmtiles, works from a plain
// double-clicked file. Same "hosted vs local" test the manifest/gazetteer
// fetches already use: the custom basemap only when actually served over
// http(s), MapLibre's default everywhere else.
const DEMO_STYLE   = "https://demotiles.maplibre.org/style.json";
function isHostedContext() { return /^https?:$/.test(location.protocol); }

function loadOnce(url, isCss) {
  const key = (isCss ? "css:" : "js:") + url;
  loadOnce.cache = loadOnce.cache || {};
  if (loadOnce.cache[key]) return loadOnce.cache[key];
  loadOnce.cache[key] = new Promise((res, rej) => {
    const el = document.createElement(isCss ? "link" : "script");
    if (isCss) { el.rel = "stylesheet"; el.href = url; }
    else { el.src = url; el.async = true; }
    el.onload = res;
    el.onerror = () => rej(new Error("could not load " + url));
    document.head.appendChild(el);
  });
  return loadOnce.cache[key];
}

/*  The style is settings, and the settings are the style.

    Each row is one layer of the basemap: its color, whether it draws, and how
    heavy its line is. The panel edits this object and the style is rebuilt
    from it, so there is exactly one description of how the map looks — no
    chance of a control saying one thing while the map draws another.

    Ordered as they paint, bottom-up, which is also the order they are listed
    in the panel: ocean, then land, then everything drawn on the land. */
/*  Width belongs to lines; opacity belongs to everything. Kept as separate
    fields rather than one overloaded slider, because "how heavy" and "how
    present" are different questions and a layer often needs both answered —
    a hairline coastline at full strength, a broad admin line at a whisper. */
const MAP_LAYERS = [
  { key: "ocean",  label: "Ocean",     type: "fill", def: "#0d1317", opacity: 1 },
  // Raster, not terrain-DEM: hs.pmtiles holds pre-rendered WEBP shading, z0-8.
  // No color of its own to set.
  { key: "hillshade", label: "Hillshade", type: "raster", def: "#000000", opacity: 0.5 },
  // Below 1 by default: the hillshade is underneath it, and an opaque land
  // fill would hide the thing it is meant to show.
  { key: "land",   label: "Land",      type: "fill", def: "#1b2126", opacity: 0.75 },
  { key: "lakes",  label: "Lakes",     type: "fill", def: "#132029", opacity: 1 },
  { key: "rivers", label: "Rivers",    type: "line", def: "#22303a", width: 1,   opacity: 1 },
  { key: "admin1", label: "Regions",   type: "line", def: "#252d33", width: 0.5, opacity: 1 },
  { key: "admin0", label: "Countries", type: "line", def: "#2f383f", width: 0.8, opacity: 1 },
  { key: "coast",  label: "Coastline", type: "line", def: "#39434a", width: 1,   opacity: 1 },
];

/*  What can be on the map, and what color it is.

    A place brick is a place. An event brick becomes a mark too, but only when
    it names somewhere with coordinates — a birth with no location is still a
    fact, it just is not a point. Nothing is invented to fill the map.

    Color carries the KIND. Status moves to opacity, because a mark cannot say
    two things with one fill, and "what is this" is the question you ask of a
    map before "how sure are we". */
const MARK_KINDS = [
  { key: "place",    label: "Places",    def: "#7a8a99", glyph: "" },
  { key: "birth",    label: "Births",    def: "#4ade80", glyph: "👶" },
  { key: "death",    label: "Deaths",    def: "#f87171", glyph: "⚰️" },
  { key: "marriage", label: "Marriages", def: "#c084fc", glyph: "💒" },
];

const LABEL_GAP_DEFAULT = 8;
const MARKER_SIZE_DEFAULT = 11;

function defaultMapSettings() {
  const out = { labelGap: LABEL_GAP_DEFAULT, labelVet: true,
                markerSize: MARKER_SIZE_DEFAULT, marks: {} };
  for (const l of MAP_LAYERS) {
    out[l.key] = { color: l.def, on: true, width: l.width || 1,
                   opacity: l.opacity === undefined ? 1 : l.opacity };
  }
  for (const k of MARK_KINDS) out.marks[k.key] = { color: k.def, on: true };
  return out;
}

/*  Mark size and label spacing, both as CSS variables on the shell — so one
    assignment restyles every marker at once, rather than the renderer walking
    59 elements. One number each for the whole sheet, because consistent
    spacing is what makes a set of marks read as one map. */
function applyMarkerVars() {
  const shell = document.querySelector("#viz-map .map-shell");
  if (!shell) return;
  shell.style.setProperty("--mk", MAP_SETTINGS.markerSize + "px");
  shell.style.setProperty("--lbl", MAP_SETTINGS.labelGap + "px");
}
let MAP_SETTINGS = defaultMapSettings();

function loadMapSettings() {
  let raw;
  try { raw = JSON.parse(localStorage.getItem(MAPSTYLE_KEY) || "null"); } catch (e) { return; }
  if (!raw || typeof raw !== "object") return;
  // Read field by field: a settings file from an older version, or one with a
  // key that no longer exists, must degrade to the default rather than
  // handing MapLibre a color it cannot parse.
  const gap = Number(raw.labelGap);
  if (gap >= 2 && gap <= 30) MAP_SETTINGS.labelGap = gap;
  if (typeof raw.labelVet === "boolean") MAP_SETTINGS.labelVet = raw.labelVet;
  const mk = Number(raw.markerSize);
  if (mk >= 4 && mk <= 32) MAP_SETTINGS.markerSize = mk;
  if (raw.marks && typeof raw.marks === "object") {
    for (const k of MARK_KINDS) {
      const s = raw.marks[k.key];
      if (!s || typeof s !== "object") continue;
